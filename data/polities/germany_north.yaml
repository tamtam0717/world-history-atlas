    - {name: ヨハン5世, title: オルデンブルク伯, from: 1483, to: 1526, note: "1500年まで兄アドルフと共同統治。1514年にブトヤディンゲンのフリースラント人を征服した", source: "https://de.wikipedia.org/wiki/Johann_V._(Oldenburg)"}
