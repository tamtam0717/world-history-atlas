    - {name: ヴィルヘルム2世, title: ヴォルフェンビュッテル侯・カレンベルク侯, from: 1482, to: 1495, note: "1495年に二人の息子に領地を分けた", source: "https://de.wikipedia.org/wiki/Wilhelm_II._(Braunschweig-Lüneburg)"}
    - {name: ハインリヒ1世（長老公）, title: ヴォルフェンビュッテル侯, from: 1495, to: 1514, source: "https://de.wikipedia.org/wiki/Heinrich_I._(Braunschweig-Wolfenbüttel)"}
    - {name: ハインリヒ2世（若公）, title: ヴォルフェンビュッテル侯, from: 1514, to: 1568, note: "北ドイツのカトリック諸侯の筆頭。1542–47年はシュマルカルデン同盟に領地を追われた", source: "https://ja.wikipedia.org/wiki/ハインリヒ2世_(ブラウンシュヴァイク＝ヴォルフェンビュッテル公)"}
    - {name: ユリウス, title: ヴォルフェンビュッテル侯, from: 1568, to: 1589, note: "宗教改革を導入し、1576年にヘルムシュテット大学を創設。1584年にカレンベルクを相続した", source: "https://de.wikipedia.org/wiki/Julius_(Braunschweig-Wolfenbüttel)"}
    - {name: ハインリヒ・ユリウス, title: ヴォルフェンビュッテル侯, from: 1589, to: 1613, note: "ハルバーシュタット司教も兼ねた。皇帝ルドルフ2世の重臣", source: "https://de.wikipedia.org/wiki/Heinrich_Julius_(Braunschweig-Wolfenbüttel)"}
    - {name: フリードリヒ・ウルリヒ, title: ヴォルフェンビュッテル侯, from: 1613, to: 1634, note: "子なく死に、中家が断絶した", source: "https://de.wikipedia.org/wiki/Friedrich_Ulrich_(Braunschweig-Wolfenbüttel)"}
