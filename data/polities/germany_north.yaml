      text: ウェストファリア条約で、管理者アウグストの死後にブランデンブルクが継承することが決まった。1680年にブランデンブルク領（マグデブルク公領）となる。
  source: "https://ja.wikipedia.org/wiki/マクデブルク大司教領"

# ---------------------------------------------------------------- 中小の世俗領邦

- id: berg
  name: ベルク大公国
  short: ベルク
  color: "#f0c08a"
  kind: 大公国（ナポレオンの衛星国）
  rulers:
    - name: ジョアシャン・ミュラ
      title: ベルク大公
      from: 1806
      to: 1808
      note: ナポレオンの義弟。1808年にナポリ王に転じた。
      source: "https://ja.wikipedia.org/wiki/ジョアシャン・ミュラ"
    - name: ナポレオン1世（摂政）
      title: ベルク大公
      from: 1808
      to: 1809
      source: "https://ja.wikipedia.org/wiki/ナポレオン・ボナパルト"
    - name: ナポレオン・ルイ・ボナパルト
      title: ベルク大公（未成年。ナポレオンが摂政）
      from: 1809
      to: 1813
      source: "https://en.wikipedia.org/wiki/Napoléon_Louis_Bonaparte"
  periods:
    - from: 1806
      to: 1813
      text: バイエルンから譲られたベルク公国（首都デュッセルドルフ）とプロイセン領クレーヴェ（右岸）を合わせて作られたナポレオンの衛星国。1808年にマルク・ミュンスター（東部）などを加えたが、1810年末に北部をフランスに併合された。1813年のライプツィヒの戦いの後に崩壊。
  source: "https://de.wikipedia.org/wiki/Großherzogtum_Berg"

- id: westphalia_kingdom
  name: ヴェストファーレン王国
  short: ヴェストファーレン
  color: "#8ecbb9"
  kind: 王国（ナポレオンの衛星国）
  rulers:
    - name: ジェローム・ボナパルト
      title: ヴェストファーレン王
      from: 1807
      to: 1813
      note: ナポレオンの末弟。
      source: "https://ja.wikipedia.org/wiki/ジェローム・ボナパルト"
  periods:
    - from: 1807
      to: 1813
      text: ティルジット条約の後、プロイセンのエルベ川以西の領土・ヘッセン＝カッセル・ブラウンシュヴァイク・ハノーファー南部などを合わせて作られたナポレオンの衛星国。首都カッセル。ナポレオン法典を導入した「模範国家」とされたが、重い徴兵と負担に苦しんだ。1813年10月に崩壊。
  source: "https://ja.wikipedia.org/wiki/ヴェストファーレン王国"

- id: arenberg
  name: アーレンベルク公国
  short: アーレンベルク
  color: "#d4a5a5"
  kind: 公国
  rulers:
    - name: プロスパー・ルートヴィヒ
      title: アーレンベルク公
      from: 1803
      to: 1810
      source: "https://en.wikipedia.org/wiki/Prosper_Louis,_7th_Duke_of_Arenberg"
  periods:
    - from: 1803
      to: 1810
      text: ライン左岸の領地を失った補償として、ミュンスター司教領のメッペン地方とケルン選帝侯領のレックリングハウゼンを与えられた。1806年ライン同盟に加わったが、1810年末に北部をフランスに、南部をベルクに併合された。
  source: "https://de.wikipedia.org/wiki/Herzogtum_Arenberg"

- id: salm
  name: ザルム侯国
  short: ザルム
  color: "#c9a0b4"
  kind: 侯国
  periods:
    - from: 1803
      to: 1810
      text: ザルム＝ザルム家とザルム＝キルブルク家が、ライン左岸の領地の補償としてミュンスター司教領の西部（ボホルト・アーハウス）を共同で治めた。1806年ライン同盟に加わったが、1810年末にフランスに併合された。
  note: 地図では、ザルム＝ホルストマル伯領（コースフェルト）など周辺の補償領も含めてまとめて表示している（簡略化）。
  source: "https://de.wikipedia.org/wiki/Fürstentum_Salm"

- id: anhalt
  name: アンハルト諸侯国
  short: アンハルト
  color: "#f2c6c6"
  kind: 侯国（複数の系統）
  periods:
    - from: 1648
      to: 1806
      text: アンハルト＝デッサウ、ベルンブルク、ケーテン、ツェルプストなどの系統に分かれた小国。「老デッサウ人」レオポルト1世はプロイセン軍の育ての親として知られる。ツェルプスト家からはロシアのエカチェリーナ2世が出た（1793年断絶）。デッサウのレオポルト3世は啓蒙的な改革とヴェルリッツ庭園で知られる。
    - from: 1807
      to: 1815
      text: 1807年にライン同盟に加わり、各系統が公国となる。1815年ドイツ連邦に加盟。
  note: 系統ごとの君主は省略。地図ではアンハルト諸系統をまとめて表示している。
  source: "https://ja.wikipedia.org/wiki/アンハルト"

- id: saxon_duchies
  name: ザクセン諸公国
  short: ザクセン諸公国
  color: "#c3e3b5"
  kind: 公国（エルネスティン系の諸家）
  periods:
    - from: 1648
      to: 1805
      text: ルターを保護したザクセン選帝侯の系統（エルネスティン家）が分割相続をくり返してできた、テューリンゲンの小公国群（ヴァイマル、アイゼナハ、ゴータ、アルテンブルク、マイニンゲン、コーブルク、ヒルトブルクハウゼンなど）。ヴァイマルはゲーテ・シラーが活躍した古典主義文学の中心となった。
    - from: 1806
      to: 1815
      text: 1806年末にライン同盟に加わる。1815年にザクセン＝ヴァイマル＝アイゼナハは大公国となり、ドイツ連邦に加盟した。
  note: 公国ごとの君主は省略。地図では諸公国をまとめて表示している。主な人物：ザクセン＝ヴァイマル公（1815年から大公）カール・アウグスト（在位1758–1828）。
  source: "https://ja.wikipedia.org/wiki/ザクセン公国"

- id: reuss
  name: ロイス諸侯領
  short: ロイス
  color: "#e6d2b0"
  kind: 伯領→侯国
  periods:
    - from: 1648
      to: 1815
      text: テューリンゲン東部（ゲーラ・グライツ・シュライツ）の小領邦。男子が全員「ハインリヒ」と名乗ることで知られる。兄系（グライツ）は1778年、弟系は1806年に侯国となる。1807年ライン同盟加盟。
  source: "https://de.wikipedia.org/wiki/Reuß_(Adelsgeschlecht)"

- id: schwarzburg
  name: シュヴァルツブルク諸侯領
  short: シュヴァルツブルク
  color: "#d6c2a0"
  kind: 伯領→侯国
  periods:
    - from: 1648
      to: 1815
      text: テューリンゲン中部のシュヴァルツブルク＝ルードルシュタットとシュヴァルツブルク＝ゾンダースハウゼンの二つの系統。ともに18世紀に侯国となり、1807年ライン同盟に加わった。
  source: "https://de.wikipedia.org/wiki/Schwarzburg_(Adelsgeschlecht)"

- id: lippe
  name: リッペ侯国
  names:
    - {to: 1788, name: リッペ伯領, kind: 伯領}
  short: リッペ
  color: "#f0d8a0"
  kind: 侯国
  periods:
    - from: 1648
      to: 1815
      text: トイトブルクの森のふもと、首都デトモルトの小領邦。1789年に侯国となり、1807年ライン同盟、1815年ドイツ連邦に加わった。
  source: "https://de.wikipedia.org/wiki/Lippe_(Land)"

- id: schaumburg_lippe
  name: シャウムブルク＝リッペ伯領
  names:
    - {from: 1807, name: シャウムブルク＝リッペ侯国, kind: 侯国}
  short: シャウムブルク＝リッペ
  color: "#e3a9c4"
  kind: 伯領
  periods:
    - from: 1648
      to: 1806
      text: シャウムブルク伯家の断絶後、1647年の分割で伯領の北半分（ビュッケブルク・シュタットハーゲン）をリッペ家の分家が得て成立した小領邦（南半分のリンテルン周辺はヘッセン＝カッセル領）。18世紀のヴィルヘルム伯は軍事の改革者として知られる。
    - from: 1807
      to: 1815
      text: 1807年に侯国となってライン同盟に加わり、ヴェストファーレン王国には併合されずに独立を保った。1815年にドイツ連邦の加盟国となった。
  source: "https://de.wikipedia.org/wiki/Schaumburg-Lippe"

- id: east_frisia
  name: 東フリースラント
  short: 東フリースラント
  color: "#d8e3a0"
  kind: 伯領→侯国（1654/1662年）
  rulers:
    - name: ウルリヒ2世
      title: 東フリースラント伯
      from: 1628
      to: 1648
      source: "https://en.wikipedia.org/wiki/Ulrich_II,_Count_of_East_Frisia"
    - name: エンノ・ルートヴィヒ
      title: 東フリースラント伯、1654年から侯
      from: 1648
      to: 1660
      source: "https://en.wikipedia.org/wiki/Enno_Louis,_Prince_of_East_Frisia"
    - name: ゲオルク・クリスティアン
      title: 東フリースラント侯
      from: 1660
      to: 1665
      source: "https://en.wikipedia.org/wiki/George_Christian,_Prince_of_East_Frisia"
    - name: クリスティアン・エーバーハルト
      title: 東フリースラント侯
      from: 1665
      to: 1708
      source: "https://en.wikipedia.org/wiki/Christian_Everhard,_Prince_of_East_Frisia"
    - name: ゲオルク・アルブレヒト
      title: 東フリースラント侯
      from: 1708
      to: 1734
      source: "https://en.wikipedia.org/wiki/George_Albert,_Prince_of_East_Frisia"
    - name: カール・エツァルト
      title: 東フリースラント侯
      from: 1734
      to: 1744
      source: "https://en.wikipedia.org/wiki/Charles_Edzard,_Prince_of_East_Frisia"
  periods:
    - from: 1648
      to: 1744
      text: ツィルクセナ家が治める北海沿岸の侯国。エムデンの町と身分制議会が強く、侯としばしば争った。1744年に侯家が断絶し、継承権を持っていたプロイセンが併合した。
