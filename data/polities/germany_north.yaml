      to: 1998
      note: キリスト教民主同盟（CDU）。1982年から西ドイツの首相で、統一を実現した。
      source: "https://ja.wikipedia.org/wiki/ヘルムート・コール"
    - name: ゲアハルト・シュレーダー
      title: 連邦首相
      from: 1998
      to: 2005
      note: 社会民主党（SPD）。緑の党と連立した。
      source: "https://ja.wikipedia.org/wiki/ゲアハルト・シュレーダー"
    - name: アンゲラ・メルケル
      title: 連邦首相
      from: 2005
      to: 2021
      note: CDU。初の女性首相で、旧東ドイツの出身。4期16年務めた。
      source: "https://ja.wikipedia.org/wiki/アンゲラ・メルケル"
    - name: オラフ・ショルツ
      title: 連邦首相
      from: 2021
      to: 2025
      note: SPD。社会民主党・緑の党・自由民主党の連立（信号連立）。2024年11月に連立が崩れ、2025年2月に繰り上げ選挙となった。
      source: "https://ja.wikipedia.org/wiki/オラフ・ショルツ"
    - name: フリードリヒ・メルツ
      title: 連邦首相
      from: 2025
      note: CDU。2025年5月に就任（CDU・CSU と SPD の連立）。
      source: "https://ja.wikipedia.org/wiki/フリードリヒ・メルツ"
  periods:
    - from: 1918
      to: 1923
      text: 敗戦と革命のなかで共和国が生まれ、1919年に当時もっとも民主的といわれたヴァイマル憲法を定めた。ヴェルサイユ条約で領土の約13％と植民地をすべて失い、巨額の賠償を課された。左右の蜂起が続き、1923年にはフランス・ベルギーのルール占領とハイパーインフレーションで国が揺らいだ。
    - from: 1924
      to: 1929
      text: レンテンマルクで通貨が安定し、ドーズ案でアメリカの資本が流れ込んで経済が立ち直った（「相対的安定期」）。外相シュトレーゼマンのもとでロカルノ条約を結び、1926年に国際連盟に加わった。ベルリンを中心に「黄金の20年代」の文化が栄えた。
    - from: 1929
      to: 1932
      text: 世界恐慌で失業者が600万人を超え、議会の多数派が作れなくなって大統領の緊急令に頼る政治になった。共産党とナチ党が伸び、1932年7月の選挙でナチ党が第一党となった。
    - from: 1933
      to: 1938
      text: ヒトラーが首相となり、全権委任法で議会から立法権を奪い、ほかの政党や労働組合を解散させて一党独裁を作った。ユダヤ人を公職や市民権から締め出し（ニュルンベルク法）、秘密警察（ゲシュタポ）と強制収容所で反対派を弾圧した。国際連盟を脱退して再軍備を進め、1938年にオーストリアとズデーテンを併合した。
    - from: 1939
      to: 1945
      text: 1939年9月のポーランド侵攻で第二次世界大戦を起こし、1940年にはフランスなどヨーロッパの大部分を占領した。1941年からソ連と戦う。占領地でユダヤ人約600万人を組織的に殺害した（ホロコースト）。1943年のスターリングラードの敗北から後退し、1945年5月に無条件降伏した。
    - from: 1990
      to: 2004
      text: 東西の統一で人口約8,000万人の国となった。旧東ドイツの再建に巨額の費用がかかり、失業と東西の格差が問題になった。首都をボンからベルリンに移し（議会は1999年）、ヨーロッパ連合の中心国としてユーロを導入した（2002年に現金）。
    - from: 2005
      to: 2021
      text: メルケル首相のもとで労働市場改革の効果が出て経済が好調となり、ユーロ危機ではEUの中心として対応した。2011年に原子力発電からの撤退を決め、2015年には100万人を超える難民を受け入れた。
    - from: 2022
      text: ロシアのウクライナ侵攻を受けて「時代の転換」を掲げ、国防費を増やし、ロシア産の天然ガスへの依存から抜け出した。エネルギー価格の高騰と景気の停滞が続き、移民に反対する右派政党が伸びた。
  source:
    - "https://ja.wikipedia.org/wiki/ヴァイマル共和政"
    - "https://ja.wikipedia.org/wiki/ナチス・ドイツ"
    - "https://ja.wikipedia.org/wiki/ドイツ"

- id: west_germany
  name: ドイツ連邦共和国（西ドイツ）
  short: 西ドイツ
  color: "#b0aba6"
  kind: 連邦共和国
  note: >-
    1949年5月23日、米英仏の占領地区に基本法を定めて成立した。首都はボン（暫定）。元首の欄には実権を持つ連邦首相を書いた。
    連邦大統領：ホイス（1949–1959）、リュプケ（1959–1969）、ハイネマン（1969–1974）、シェール（1974–1979）、カルステンス（1979–1984）、ヴァイツゼッカー（1984–1994）。
    1955年のパリ協定で主権を回復した（ベルリンとドイツ全体についての権利は米英仏ソに残った）。1957年にザールが加わった。1990年10月3日に東ドイツの5州と東ベルリンが加わり、統一ドイツ（germany）となった。
  rulers:
    - name: コンラート・アデナウアー
      title: 連邦首相
      from: 1949
      to: 1963
      note: キリスト教民主同盟（CDU）。
      source: "https://ja.wikipedia.org/wiki/コンラート・アデナウアー"
    - name: ルートヴィヒ・エアハルト
      title: 連邦首相
      from: 1963
      to: 1966
      note: CDU。アデナウアー政権の経済相として「経済の奇跡」を導いた。
      source: "https://ja.wikipedia.org/wiki/ルートヴィヒ・エアハルト"
    - name: クルト・ゲオルク・キージンガー
      title: 連邦首相
      from: 1966
      to: 1969
      note: CDU。社会民主党との大連立。
      source: "https://ja.wikipedia.org/wiki/クルト・ゲオルク・キージンガー"
    - name: ヴィリー・ブラント
      title: 連邦首相
      from: 1969
      to: 1974
      note: 社会民主党（SPD）。元西ベルリン市長。東方外交で1971年にノーベル平和賞。側近が東ドイツのスパイだった事件で辞任した。
      source: "https://ja.wikipedia.org/wiki/ヴィリー・ブラント"
    - name: ヘルムート・シュミット
      title: 連邦首相
      from: 1974
      to: 1982
      note: SPD。
      source: "https://ja.wikipedia.org/wiki/ヘルムート・シュミット"
    - name: ヘルムート・コール
      title: 連邦首相
      from: 1982
      to: 1990
      note: CDU。1990年の統一後も統一ドイツの首相を1998年まで務めた。
      source: "https://ja.wikipedia.org/wiki/ヘルムート・コール"
  periods:
    - from: 1949
      to: 1962
      text: アデナウアー首相のもとで西側との結びつきを固め、1955年に主権を回復してNATOに加わった。通貨改革と市場経済で「経済の奇跡」と呼ばれる高度成長をとげ、フランスと和解して1952年のヨーロッパ石炭鉄鋼共同体、1958年のヨーロッパ経済共同体（EEC）に加わった。
    - from: 1963
      to: 1968
      text: 1963年にフランスとエリゼ条約を結ぶ。成長が鈍ると二大政党の大連立が組まれ、学生たちはナチ時代の過去への向き合い方やベトナム戦争をめぐって抗議運動を起こした。
    - from: 1969
      to: 1982
      text: ブラント首相が「東方外交」に転じ、ソ連・ポーランドと条約を結んでオーデル＝ナイセ線を事実上認め、1972年に東ドイツと基本条約を結んで、1973年に東西ドイツが国際連合に同時に加盟した。石油危機の後はシュミット首相が経済の安定に努めた。左翼のテロ（赤軍派）が社会を揺るがした。
    - from: 1982
      to: 1990
      text: コール首相のもとでアメリカのミサイル配備を受け入れ、ヨーロッパの統合を進めた。1989年の東ドイツの体制の崩れを受けて統一を急ぎ、1990年7月に通貨を統合し、10月3日に東ドイツを編入する形で統一した。
  source:
    - "https://ja.wikipedia.org/wiki/西ドイツ"
    - "https://en.wikipedia.org/wiki/West_Germany"

- id: east_germany
  name: ドイツ民主共和国（東ドイツ）
  short: 東ドイツ
  color: "#b5c79b"
  kind: 社会主義国（人民民主主義）
  note: >-
    1949年10月7日、ソ連占領地区に成立した。首都は東ベルリン。社会主義統一党（SED）の一党支配で、元首の欄には実権を持つ SED の指導者
    （書記長・第一書記）を書き、1989年12月に SED の指導的役割が憲法から削られた後は首相を書いた。
    国家元首：大統領ピーク（1949–1960）、1960年から国家評議会議長（ウルブリヒト 1960–1973、シュトフ 1973–1976、ホーネッカー 1976–1989、クレンツ 1989、ゲルラッハ 1989–1990）、1990年4–10月は人民議会議長ベルクマン＝ポール。首相：グローテヴォール（1949–1964）、シュトフ（1964–1973）、ジンダーマン（1973–1976）、シュトフ（1976–1989）、モドロウ、デメジエール。
    1950年にコメコン（経済相互援助会議）、1955年にワルシャワ条約機構に加わった（創設時の加盟国）。1990年10月3日に西ドイツに加わって消滅した。
  rulers:
    - name: ヴァルター・ウルブリヒト
      title: 社会主義統一党書記長（1950–）・第一書記（1953–1971）
      from: 1949
      to: 1971
      note: 1949–1950年は党副議長・副首相として実権を握った。1960年からは国家評議会議長も兼ねた。1971年にソ連の支持を失って退いた。
      source: "https://ja.wikipedia.org/wiki/ヴァルター・ウルブリヒト"
    - name: エーリッヒ・ホーネッカー
      title: 社会主義統一党第一書記・書記長（1976–）
      from: 1971
      to: 1989
      note: 1976年から国家評議会議長も兼ねた。1989年10月18日に辞任した。
      source: "https://ja.wikipedia.org/wiki/エーリッヒ・ホーネッカー"
    - name: エゴン・クレンツ
      title: 社会主義統一党書記長・国家評議会議長
      from: 1989
      to: 1989
      note: 1989年10月–12月。在任中の11月9日にベルリンの壁が開かれた。
      source: "https://ja.wikipedia.org/wiki/エゴン・クレンツ"
    - name: ハンス・モドロウ
      title: 閣僚評議会議長（首相）
      from: 1989
      to: 1990
      note: 1989年11月–1990年4月。改革派で、反体制派との「円卓会議」と協力した。
      source: "https://ja.wikipedia.org/wiki/ハンス・モドロウ"
    - name: ロタール・デメジエール
      title: 閣僚評議会議長（首相）
      from: 1990
      to: 1990
      note: 東ドイツのキリスト教民主同盟。1990年3月の初の自由選挙で勝ち、4月から10月の統一まで首相を務めた。
      source: "https://ja.wikipedia.org/wiki/ロタール・デメジエール"
  periods:
    - from: 1949
      to: 1960
      text: ソ連型の社会主義を目指し、工業の国有化と農業の集団化を進めた。1953年6月17日にはノルマの引き上げに反対する民衆蜂起がソ連軍に鎮圧された。生活の苦しさと自由のなさから、西ベルリンを通って毎年数十万人が西側へ逃れた。
    - from: 1961
      to: 1970
      text: 1961年8月に「ベルリンの壁」を築いて人の流出を止め、国境の監視を強めた。工業は東側陣営で最も進んだ水準となった。
    - from: 1971
      to: 1985
      text: ホーネッカーのもとで消費生活の向上を掲げ、1972年の基本条約と1973年の国際連合加盟で国際的に認められた。一方、秘密警察（シュタージ）が国民を広く監視し、経済は西側からの借金に頼るようになった。
    - from: 1986
      to: 1990
      text: ソ連のゴルバチョフの改革を拒んだが、1989年にハンガリー経由の大量出国と各地の月曜デモが広がり、ホーネッカーが退陣し、11月9日に壁が開かれた（平和革命）。1990年3月の自由選挙で早期統一派が勝ち、10月3日に西ドイツに加わった。
  source:
    - "https://ja.wikipedia.org/wiki/ドイツ民主共和国"
    - "https://en.wikipedia.org/wiki/East_Germany"

- id: berlin_allied
  name: ベルリン（四か国共同占領）
  short: ベルリン
  color: "#c9c4bb"
  kind: 連合国の共同占領地区
  note: >-
    1945年6月のベルリン宣言で、ベルリンは米英仏ソの4地区に分けられ、連合国の共同管理（コマンダントゥーラ）のもとに置かれた。ソ連占領地区の中の「島」だった。
    1948年6月から1949年5月までソ連がベルリン封鎖を行い、西側は空輸で西ベルリンを支えた。1948年末には東西で別々の市政府ができ、1949年からは西ベルリンと東ベルリンに分かれた（地図の扱いは地域 berlin_city の note）。
  periods:
    - from: 1945
      to: 1948
      text: 戦災で廃墟となった首都を米英仏ソが分割して占領した。占領国の対立が深まり、1948年の通貨改革をきっかけにソ連が西ベルリンへの陸路を封鎖し、アメリカ・イギリスは約1年にわたる「空の架け橋」（大空輸）で物資を運んだ。
  source:
    - "https://en.wikipedia.org/wiki/Berlin_Declaration_(1945)"
    - "https://ja.wikipedia.org/wiki/ベルリン封鎖"

# ================================================================ 1453–1647 の政体（BN）

- id: brandenburg
  name: ブランデンブルク選帝侯国
  short: ブランデンブルク
  color: "#97a9c4"
  kind: 選帝侯国
  note: ホーエンツォレルン家の選帝侯国（1415年から）。1618年にプロイセン公国を相続して同君連合（ブランデンブルク＝プロイセン）となったので、1618年からは prussia の色で塗る。色はプロイセンと同じ系統にしてある。
  rulers:
    - {name: フリードリヒ2世（鉄歯侯）, title: ブランデンブルク選帝侯, from: 1440, to: 1470, note: "ベルリンに城を築いて首都とした。1455年にドイツ騎士団からノイマルクを買い戻した", source: "https://ja.wikipedia.org/wiki/フリードリヒ2世_(ブランデンブルク選帝侯)"}
    - {name: アルブレヒト・アヒレス, title: ブランデンブルク選帝侯, from: 1470, to: 1486, note: "1473年の家憲（ディスポジティオ・アヒレア）で選帝侯領の分割を禁じた", source: "https://ja.wikipedia.org/wiki/アルブレヒト・アヒレス_(ブランデンブルク選帝侯)"}
    - {name: ヨハン・ツィツェロ, title: ブランデンブルク選帝侯, from: 1486, to: 1499, source: "https://ja.wikipedia.org/wiki/ヨハン・ツィツェロ"}
    - {name: ヨアヒム1世, title: ブランデンブルク選帝侯, from: 1499, to: 1535, note: "1506年にフランクフルト（オーダー）大学を創設。宗教改革に反対した。弟アルブレヒトはマインツ・マクデブルク大司教", source: "https://ja.wikipedia.org/wiki/ヨアヒム1世_(ブランデンブルク選帝侯)"}
    - {name: ヨアヒム2世, title: ブランデンブルク選帝侯, from: 1535, to: 1571, note: "1539年に宗教改革を導入した", source: "https://ja.wikipedia.org/wiki/ヨアヒム2世_(ブランデンブルク選帝侯)"}
    - {name: ヨハン・ゲオルク, title: ブランデンブルク選帝侯, from: 1571, to: 1598, source: "https://ja.wikipedia.org/wiki/ヨハン・ゲオルク_(ブランデンブルク選帝侯)"}
    - {name: ヨアヒム・フリードリヒ, title: ブランデンブルク選帝侯, from: 1598, to: 1608, note: "1605年からプロイセン公国の摂政", source: "https://ja.wikipedia.org/wiki/ヨアヒム・フリードリヒ_(ブランデンブルク選帝侯)"}
    - {name: ヨハン・ジギスムント, title: ブランデンブルク選帝侯, from: 1608, to: 1619, note: "1609年にユーリヒ＝クレーヴェの遺領を主張し、1614年にクレーヴェ・マルク・ラーヴェンスベルクを得た。1613年にカルヴァン派に改宗。1618年にプロイセン公国を相続（以後は prussia）", source: "https://ja.wikipedia.org/wiki/ヨハン・ジギスムント_(ブランデンブルク選帝侯)"}
  periods:
    - from: 1453
      to: 1498
      text: ホーエンツォレルン家の選帝侯がベルリンを首都とし、貴族や都市（ベルリン・ケルン）を従えて領邦を固める。1455年にノイマルクを取り戻し、1473年の家憲で選帝侯領の分割を禁じた。
    - from: 1499
      to: 1570
      text: ヨアヒム1世は宗教改革に反対したが、ヨアヒム2世が1539年にルター派を受け入れた。1537年のリーグニッツ公との相続契約や、1569年のプロイセン公国の共同封土権で、のちの拡大の足場を築く。
    - from: 1571
      to: 1617
      text: 1609年にユーリヒ＝クレーヴェ公が断絶すると遺領を主張し、1614年のクサンテン条約でライン下流のクレーヴェ・マルク・ラーヴェンスベルクを得た。1613年に選帝侯がカルヴァン派に改宗したが、領民の大半はルター派のまま。
  source:
    - "https://ja.wikipedia.org/wiki/ブランデンブルク辺境伯領"
    - "https://de.wikipedia.org/wiki/Mark_Brandenburg"

- id: teutonic_order
  name: ドイツ騎士団国家
  short: ドイツ騎士団
  color: "#c4c9cf"
  kind: 騎士団国家
  note: >-
    プロイセンのドイツ騎士団領（首都は1457年までマリエンブルク、以後ケーニヒスベルク）。十三年戦争（1454–66）に敗れた第二次トルンの和約（1466）で、
    西プロイセン（王領プロイセン）をポーランドに割譲し、残りもポーランド王の宗主権下に入った。1525年に騎士団長アルブレヒトがルター派に改宗し、プロイセン公国（ducal_prussia）となった。
    騎士団はその後もメルゲントハイム（南ドイツ）を本拠に存続した。リヴォニアの騎士団（リヴォニア騎士団）は別の政体（F 担当）。
  rulers:
    - {name: ルートヴィヒ・フォン・エルリヒスハウゼン, title: ドイツ騎士団総長, from: 1450, to: 1467, source: "https://en.wikipedia.org/wiki/Ludwig_von_Erlichshausen"}
    - {name: ハインリヒ・ロイス・フォン・プラウエン, title: ドイツ騎士団総長, from: 1467, to: 1470, note: "1467年から総長代理、1469年に総長", source: "https://en.wikipedia.org/wiki/Heinrich_Reuss_von_Plauen"}
    - {name: ハインリヒ・レッフレ・フォン・リヒテンベルク, title: ドイツ騎士団総長, from: 1470, to: 1477, source: "https://en.wikipedia.org/wiki/Heinrich_Reffle_von_Richtenberg"}
    - {name: マルティン・トルフゼス・フォン・ヴェッツハウゼン, title: ドイツ騎士団総長, from: 1477, to: 1489, source: "https://en.wikipedia.org/wiki/Martin_Truchseß_von_Wetzhausen"}
    - {name: ヨハン・フォン・ティーフェン, title: ドイツ騎士団総長, from: 1489, to: 1497, source: "https://en.wikipedia.org/wiki/Johann_von_Tiefen"}
    - {name: フリードリヒ・フォン・ザクセン, title: ドイツ騎士団総長, from: 1498, to: 1510, note: "ザクセン公アルブレヒトの子。ポーランド王への臣従を拒んだ", source: "https://en.wikipedia.org/wiki/Frederick_of_Saxony_(Teutonic_Knight)"}
    - {name: アルブレヒト・フォン・ブランデンブルク＝アンスバッハ, title: ドイツ騎士団総長, from: 1510, to: 1525, note: "1525年に改宗してプロイセン公となった（ducal_prussia）", source: "https://ja.wikipedia.org/wiki/アルブレヒト_(プロイセン公)"}
  periods:
    - from: 1453
      to: 1466
      text: 騎士団の支配に反発したプロイセン連合（都市と貴族）がポーランド王に助けを求め、十三年戦争となる。1457年に本拠マリエンブルクを失い、1466年の第二次トルンの和約で西半分をポーランドに割譲した。
    - from: 1467
      to: 1525
      text: 東プロイセンだけが残り、首都はケーニヒスベルクに移った。総長はポーランド王への臣従を義務づけられ、たびたびこれを拒んだ（騎士団戦争 1519–21）。1525年、総長アルブレヒトが宗教改革を受け入れ、騎士団国家は世俗のプロイセン公国になった。
  source:
    - "https://ja.wikipedia.org/wiki/ドイツ騎士団国"
    - "https://ja.wikipedia.org/wiki/第二次トルンの和約"

- id: ducal_prussia
  name: プロイセン公国
  short: プロイセン公国
  color: "#a9b6c9"
  kind: 公国（ポーランド王の封土）
  note: 1525年のクラクフ条約で、ドイツ騎士団国家がポーランド王を宗主とする世俗の公国になった（最初のルター派の国家）。1618年にブランデンブルク選帝侯が相続し、以後は prussia（ブランデンブルク＝プロイセン）の色で塗る。
  rulers:
    - {name: アルブレヒト, title: プロイセン公, from: 1525, to: 1568, note: "元ドイツ騎士団総長。1544年にケーニヒスベルク大学を創設した", source: "https://ja.wikipedia.org/wiki/アルブレヒト_(プロイセン公)"}
    - {name: アルブレヒト・フリードリヒ, title: プロイセン公, from: 1568, to: 1618, note: "心の病のため、1578年からアンスバッハ辺境伯ゲオルク・フリードリヒ、1605年からブランデンブルク選帝侯が摂政を務めた", source: "https://ja.wikipedia.org/wiki/アルブレヒト・フリードリヒ_(プロイセン公)"}
  periods:
    - from: 1525
      to: 1568
      text: 騎士団総長アルブレヒトがルター派に改宗し、ポーランド王ジグムント1世に臣従してプロイセン公となる（クラクフ条約、プロイセンの臣従礼）。1544年にケーニヒスベルク大学を創った。
    - from: 1569
      to: 1617
      text: 2代目の公が統治できなかったため、ホーエンツォレルン家の親族が摂政となる。ブランデンブルク選帝侯家は1569年に共同の封土権を得ており、1618年に公国を相続した。
  source: "https://ja.wikipedia.org/wiki/プロイセン公国"

- id: pomerania
  name: ポンメルン公国
  short: ポンメルン
  color: "#c9d5a2"
  kind: 公国
  note: >-
    グライフ家（ポンメルン公家）の公国。たびたび分割され、西のポンメルン＝ヴォルガストと東のポンメルン＝シュテッティンに分かれた時期が長い（1478–1531年はボギスラフ10世のもとで統一、1625–37年もボギスラフ14世のもとで統一）。
    地図ではまとめて1つの公国として描き、君主欄には両系の公を並べた。1529年のグリムニッツ条約でブランデンブルクに公家断絶後の相続権を認めた。
    1630年からスウェーデン軍が占領し、1637年に公家が断絶した。ウェストファリア条約で西部（フォアポンメルン）はスウェーデン、東部（ヒンターポンメルン）はブランデンブルクに分けられた。
  rulers:
    - {name: ヴァルティスラフ9世, title: ポンメルン＝ヴォルガスト公, from: 1415, to: 1457, source: "https://en.wikipedia.org/wiki/Wartislaw_IX,_Duke_of_Pomerania"}
    - {name: オットー3世, title: ポンメルン＝シュテッティン公, from: 1460, to: 1464, note: "シュテッティン系の最後の公", source: "https://en.wikipedia.org/wiki/Otto_III,_Duke_of_Pomerania"}
    - {name: エーリヒ2世, title: ポンメルン＝ヴォルガスト公（1464年からシュテッティンも）, from: 1457, to: 1474, source: "https://en.wikipedia.org/wiki/Eric_II,_Duke_of_Pomerania"}
    - {name: ヴァルティスラフ10世, title: ポンメルン＝ヴォルガスト公, from: 1457, to: 1478, source: "https://en.wikipedia.org/wiki/Wartislaw_X,_Duke_of_Pomerania"}
    - {name: ボギスラフ10世（大公）, title: ポンメルン公, from: 1474, to: 1523, note: "1478年に全ポンメルンを統一し、行政を整えた", source: "https://en.wikipedia.org/wiki/Bogislaw_X,_Duke_of_Pomerania"}
    - {name: ゲオルク1世, title: ポンメルン公, from: 1523, to: 1531, source: "https://en.wikipedia.org/wiki/George_I,_Duke_of_Pomerania"}
    - {name: バルニム9世, title: ポンメルン公（1532年からシュテッティン）, from: 1523, to: 1573, source: "https://en.wikipedia.org/wiki/Barnim_IX,_Duke_of_Pomerania"}
    - {name: フィリップ1世, title: ポンメルン＝ヴォルガスト公, from: 1531, to: 1560, note: "1534年のトレプトウ領邦議会で宗教改革を導入した", source: "https://en.wikipedia.org/wiki/Philip_I,_Duke_of_Pomerania"}
    - {name: ヨハン・フリードリヒ, title: ポンメルン＝シュテッティン公, from: 1569, to: 1600, source: "https://en.wikipedia.org/wiki/John_Frederick,_Duke_of_Pomerania"}
    - {name: エルンスト・ルートヴィヒ, title: ポンメルン＝ヴォルガスト公, from: 1569, to: 1592, source: "https://en.wikipedia.org/wiki/Ernst_Ludwig,_Duke_of_Pomerania"}
    - {name: フィリップ・ユリウス, title: ポンメルン＝ヴォルガスト公, from: 1592, to: 1625, source: "https://en.wikipedia.org/wiki/Philip_Julius,_Duke_of_Pomerania"}
    - {name: バルニム10世, title: ポンメルン＝シュテッティン公, from: 1600, to: 1603, source: "https://en.wikipedia.org/wiki/Barnim_X,_Duke_of_Pomerania"}
    - {name: ボギスラフ13世, title: ポンメルン＝シュテッティン公, from: 1603, to: 1606, source: "https://en.wikipedia.org/wiki/Bogislaw_XIII,_Duke_of_Pomerania"}
    - {name: フィリップ2世, title: ポンメルン＝シュテッティン公, from: 1606, to: 1618, source: "https://en.wikipedia.org/wiki/Philip_II,_Duke_of_Pomerania"}
    - {name: フランツ, title: ポンメルン＝シュテッティン公, from: 1618, to: 1620, source: "https://en.wikipedia.org/wiki/Francis,_Duke_of_Pomerania"}
    - {name: ボギスラフ14世, title: ポンメルン公（1625年から全ポンメルン）, from: 1620, to: 1637, note: "グライフ家最後の公。1630年からスウェーデン軍の占領下", source: "https://en.wikipedia.org/wiki/Bogislaw_XIV,_Duke_of_Pomerania"}
  periods:
    - from: 1453
      to: 1522
      text: ハンザ都市（シュトラールズント・シュテッティン・グライフスヴァルトなど）が栄える。ボギスラフ10世が1478年に全土を統一し、ブランデンブルクの封建的な宗主権の主張を退けた（1493年ピュリッツ条約）。
    - from: 1523
      to: 1624
      text: 1534年に宗教改革を導入し、1532年・1569年に東西（シュテッティンとヴォルガスト）に分割された。1529年のグリムニッツ条約で、公家が絶えればブランデンブルクが継ぐと決まった。
    - from: 1625
      to: 1637
      text: ボギスラフ14世のもとで再統一されたが、三十年戦争に巻き込まれる。1627年に皇帝軍（ヴァレンシュタイン）に占領され、1630年にスウェーデン王グスタフ・アドルフが上陸してからはスウェーデン軍の支配下に入った。1637年に公家が断絶した。
  source:
    - "https://ja.wikipedia.org/wiki/ポメラニア公国"
    - "https://en.wikipedia.org/wiki/Duchy_of_Pomerania"

- id: thuringia
  name: テューリンゲン方伯領
  short: テューリンゲン
  color: "#bcdca6"
  kind: 方伯領（ヴェッティン家）
  note: 1445年のアルテンブルクの分割で、ザクセン選帝侯フリードリヒ2世の弟ヴィルヘルム3世がテューリンゲンとフランケン地方の領地（コーブルクなど）を得た。兄弟はザクセン兄弟戦争（1446–51）を戦った。1482年にヴィルヘルムが死ぬと、甥のエルンストとアルブレヒト（ザクセン選帝侯家）に戻った。
  rulers:
    - {name: ヴィルヘルム3世（勇敢公）, title: テューリンゲン方伯, from: 1445, to: 1482, source: "https://en.wikipedia.org/wiki/William_III,_Landgrave_of_Thuringia"}
  source: "https://de.wikipedia.org/wiki/Landgrafschaft_Thüringen"

- id: henneberg
  name: ヘンネベルク伯領
  short: ヘンネベルク
  color: "#e2d0a6"
  kind: 侯伯領（帝国諸侯）
  note: テューリンゲン南部（シュロイジンゲン・マイニンゲン・ズール）を治めたヘンネベルク＝シュロイジンゲン家。1583年に断絶し、1554年のカーレ相続契約に従ってヴェッティン家の両系（エルネスト系・アルベルト系）が共同で管理した（1660年に分割）。シュマルカルデンはヘッセンとの共同領で、1583年からヘッセン＝カッセル領。
  source: "https://de.wikipedia.org/wiki/Henneberg_(Adelsgeschlecht)"

- id: mansfeld
  name: マンスフェルト伯領
  short: マンスフェルト
  color: "#e8c4b0"
  kind: 伯領
  note: ハルツ東麓の伯領。銅の鉱山で栄え、ルターの生地アイスレーベンがある。伯家は多くの系統に分かれて借財を重ね、1570年にザクセン選帝侯とマクデブルク大司教が統治権を差し押さえた（シークエストレーション）。北部はマクデブルク、南部はザクセンの封で、地図では1570年からザクセンとした。
  source: "https://de.wikipedia.org/wiki/Grafschaft_Mansfeld"

- id: halberstadt
  name: ハルバーシュタット司教領
  short: ハルバーシュタット
  color: "#c9b1db"
  kind: 司教領
  note: >-
    ハルツ北麓の司教領。16世紀からはブラウンシュヴァイク＝ヴォルフェンビュッテル家などプロテスタントの管理者（行政官）が治め、
    三十年戦争中の1628年からは皇帝の子レオポルト・ヴィルヘルムが司教となった。ウェストファリア条約でブランデンブルクの世俗の侯国となった。
    ヴェルニゲローデ伯領・クヴェードリンブルク帝国修道院など、郡内の小さな領邦もまとめて描いている。
  source: "https://de.wikipedia.org/wiki/Hochstift_Halberstadt"

- id: minden
  name: ミンデン司教領
  short: ミンデン
  color: "#bfa7d8"
  kind: 司教領
  note: ヴェーザー川沿いの司教領。16世紀半ばからプロテスタントの管理者（ブラウンシュヴァイク家など）が治めた。三十年戦争中の1634年からスウェーデン軍が占領した（地図では表示していない）。ウェストファリア条約でブランデンブルクの世俗の侯国となった。
  source: "https://de.wikipedia.org/wiki/Hochstift_Minden"

- id: bremen_archbishopric
  name: ブレーメン大司教領
  short: ブレーメン大司教領
  color: "#b7a3d4"
  kind: 大司教領
  note: エルベ川とヴェーザー川の河口の間の大司教領（中心はシュターデ・ブレーマーフェルデ。ブレーメン市自体は大司教から自立した帝国都市）。1567年からはプロテスタントの管理者（ブラウンシュヴァイク家・ホルシュタイン＝ゴットルプ家・デンマーク王子）が治めた。1645年にスウェーデン軍が占領し、ウェストファリア条約でスウェーデン領のブレーメン公国となった。
  source: "https://de.wikipedia.org/wiki/Erzstift_Bremen"

- id: verden
  name: フェルデン司教領
  short: フェルデン
  color: "#cdb9e1"
  kind: 司教領
  note: アラー川下流の小さな司教領（中心はフェルデン・ローテンブルク）。16世紀後半からプロテスタントの管理者が治め、ブレーメン大司教と同じ人物が兼ねることが多かった。1645年にスウェーデン軍が占領し、ウェストファリア条約でスウェーデン領のフェルデン侯国となった。
  source: "https://de.wikipedia.org/wiki/Hochstift_Verden"

- id: grubenhagen
  name: グルーベンハーゲン侯領
  short: グルーベンハーゲン
  color: "#d9cf9f"
  kind: 侯領（ブラウンシュヴァイク＝リューネブルク家の分家）
  note: ハルツ西麓のアインベック・オステローデを中心とするヴェルフ家の分家領。1596年に断絶し、ヴォルフェンビュッテル公が占有したが、1617年の帝国宮廷法院の判決でリューネブルク（ツェレ）家のものとなった（1665年にカレンベルクへ）。
  source: "https://de.wikipedia.org/wiki/Fürstentum_Grubenhagen"

- id: schaumburg
  name: シャウムブルク伯領
  short: シャウムブルク
  color: "#dcadc6"
  kind: 伯領
  note: ヴェーザー川沿いのシャウムブルク（ビュッケブルク・リンテルン・シュタットハーゲン）と、ホルシュタインのピンネベルクを治めたシャウエンブルク家（ホルシュタイン＝シャウムブルク）。1640年に断絶し、ピンネベルクはデンマーク王へ、シャウムブルク本領は1647年の取り決め（ウェストファリア条約で確認）でヘッセン＝カッセル・リッペ家（シャウムブルク＝リッペ）・ブラウンシュヴァイク＝リューネブルクに分けられた。
  source: "https://de.wikipedia.org/wiki/Grafschaft_Schaumburg"

- id: dithmarschen
  name: ディトマルシェン
  short: ディトマルシェン
  color: "#e6d8b4"
  kind: 農民共和国
  note: 北海沿岸の自由農民の共同体。名目上はブレーメン大司教に属し、1473年に皇帝がホルシュタインに含めたが、農民が自治を守った。1500年のヘミングシュテットの戦いでデンマーク王軍を破ったが、1559年に征服された（「最後のフェーデ」）。
  source: "https://de.wikipedia.org/wiki/Dithmarschen"

- id: jever
  name: イェファー領主領
  short: イェファー
  color: "#d8e6ae"
  kind: 領主領（フリースラントの首長）
  note: フリースラントの首長家が治めた小さな領主領。最後の領主マリア（「イェファーのマリア」、在位1517–75）は東フリースラント伯に対抗して1532年にブルゴーニュ（カール5世）の封を受けた。1575年に遺言でオルデンブルク伯に譲られた。
  rulers:
    - {name: マリア, title: イェファーの女領主, from: 1517, to: 1575, source: "https://de.wikipedia.org/wiki/Maria_von_Jever"}
  source: "https://de.wikipedia.org/wiki/Herrschaft_Jever"

- id: holstein_schauenburg
  name: ホルシュタイン伯領（シャウエンブルク家）
  short: ホルシュタイン
  color: "#d6c2a6"
  kind: 伯領（シュレースヴィヒ公を兼ねる）
  note: シャウエンブルク家のホルシュタイン＝レンツブルク伯がシュレースヴィヒ公を兼ねた。1459年にアドルフ8世が子なく死ぬと、翌1460年のリーベ条約で甥のデンマーク王クリスチャン1世が両地の領主に選ばれた（シュレースヴィヒとホルシュタインは「永遠に分かたれず」）。
  rulers:
    - {name: アドルフ8世, title: ホルシュタイン伯・シュレースヴィヒ公, from: 1427, to: 1459, source: "https://en.wikipedia.org/wiki/Adolphus_VIII,_Count_of_Holstein-Rendsburg"}
  source: "https://ja.wikipedia.org/wiki/リーベ条約"

- id: mecklenburg_stargard
  name: メクレンブルク＝シュタルガルト公国
  short: シュタルガルト
  color: "#9cc6ce"
  kind: 公国
  note: メクレンブルク公家の分家（ノイブランデンブルク・シュトレーリッツ周辺）。1471年に断絶してメクレンブルク公領に戻った。1701年成立のメクレンブルク＝シュトレーリッツ（mecklenburg_strelitz）とは別。
  rulers:
    - {name: ハインリヒ（シュタルガルト公）, title: メクレンブルク＝シュタルガルト公, from: 1417, to: 1466, source: "https://en.wikipedia.org/wiki/Henry_of_Mecklenburg-Stargard"}
    - {name: ウルリヒ2世, title: メクレンブルク＝シュタルガルト公, from: 1466, to: 1471, source: "https://en.wikipedia.org/wiki/Ulrich_II,_Duke_of_Mecklenburg-Stargard"}
  source: "https://de.wikipedia.org/wiki/Mecklenburg-Stargard"

- id: wallenstein_mecklenburg
  name: メクレンブルク公国（ヴァレンシュタイン）
  short: ヴァレンシュタイン
  color: "#e2b384"
  kind: 公国（皇帝が与えた）
  note: 皇帝フェルディナント2世は、デンマーク王に味方したメクレンブルク公兄弟を廃し、1628年に皇帝軍総司令官ヴァレンシュタインにメクレンブルクを（まず担保として、1629年に封土として）与えた。1631年、スウェーデン軍の進攻で公兄弟が復位した。ヴァレンシュタインはボヘミアのフリートラント公でもあった。
  rulers:
    - {name: アルブレヒト・フォン・ヴァレンシュタイン, title: メクレンブルク公・フリートラント公, from: 1628, to: 1631, note: "1630年に皇帝軍総司令官を罷免された。1634年に暗殺", source: "https://ja.wikipedia.org/wiki/アルブレヒト・フォン・ヴァレンシュタイン"}
  source: "https://ja.wikipedia.org/wiki/アルブレヒト・フォン・ヴァレンシュタイン"

- id: cleves
  name: クレーヴェ公国
  names:
    - {from: 1521, name: ユーリヒ＝クレーヴェ＝ベルク公国, short: ユーリヒ＝クレーヴェ, kind: 公国（連合公国）}
  short: クレーヴェ
  color: "#dcab90"
  kind: 公国
  note: >-
    ライン下流のクレーヴェ公国とマルク伯領（1398年から同君）。1449年のゾースト・フェーデでケルン大司教からゾーストを奪った。
    1521年、ユーリヒ＝ベルク公の女子相続人マリアと結婚したヨハン3世がクレーヴェ公を継ぎ、ユーリヒ・クレーヴェ・ベルク・マルク・ラーヴェンスベルクの連合公国となった。
    1609年に断絶すると、ブランデンブルク選帝侯とプファルツ＝ノイブルク公が遺領を争い（ユーリヒ＝クレーヴェ継承争い）、1614年のクサンテン条約で分けられた。
  rulers:
    - {name: ヨハン1世, title: クレーヴェ公・マルク伯, from: 1448, to: 1481, source: "https://en.wikipedia.org/wiki/John_I,_Duke_of_Cleves"}
    - {name: ヨハン2世, title: クレーヴェ公・マルク伯, from: 1481, to: 1521, source: "https://en.wikipedia.org/wiki/John_II,_Duke_of_Cleves"}
    - {name: ヨハン3世, title: ユーリヒ＝クレーヴェ＝ベルク公, from: 1521, to: 1539, note: "1511年から妻マリアの権利でユーリヒ＝ベルク公。娘アンはイングランド王ヘンリ8世の4番目の妃", source: "https://en.wikipedia.org/wiki/John_III,_Duke_of_Cleves"}
    - {name: ヴィルヘルム5世（富裕公）, title: ユーリヒ＝クレーヴェ＝ベルク公, from: 1539, to: 1592, note: "1538年にゲルデルン公国を継いだが、1543年のフェンロー条約でカール5世に譲った", source: "https://en.wikipedia.org/wiki/William,_Duke_of_Jülich-Cleves-Berg"}
    - {name: ヨハン・ヴィルヘルム, title: ユーリヒ＝クレーヴェ＝ベルク公, from: 1592, to: 1609, note: "心の病があり、子なく死んで家が断絶した", source: "https://en.wikipedia.org/wiki/John_William,_Duke_of_Jülich-Cleves-Berg"}
  periods:
    - from: 1453
      to: 1520
      text: クレーヴェ公がマルク伯を兼ね、ライン下流からルール地方に広がる。1449年にゾーストを得て、ケルン大司教と張り合った。
    - from: 1521
      to: 1592
      text: ユーリヒ・ベルクと合わさり、北西ドイツ最大の世俗領邦（首都デュッセルドルフ）となる。ヴィルヘルム5世はゲルデルンをめぐってカール5世と戦って敗れ（1543年）、エラスムス流の中道の宗教政策をとった。
    - from: 1593
      to: 1609
      text: 公の病で統治が乱れ、1609年に家が断絶。遺領をめぐる争いはスペインとオランダも巻き込む国際問題となった。
  source:
