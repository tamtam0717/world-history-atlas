      note: ウィリアム4世の弟（カンバーランド公）。女性が継げないハノーファーの継承法により即位し、イギリスとの同君連合が終わった。
      source: "https://en.wikipedia.org/wiki/Ernest_Augustus,_King_of_Hanover"
    - name: ゲオルク5世
      title: ハノーファー王
      from: 1851
