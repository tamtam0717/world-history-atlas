# 北ドイツの政体（担当 BN）。1648–1815 試作。
# 範囲：現代ドイツのうち シュレースヴィヒ＝ホルシュタイン、ハンブルク、ニーダーザクセン、ブレーメン、
# メクレンブルク＝フォアポンメルン、ブランデンブルク、ベルリン、ザクセン＝アンハルト、ザクセン、テューリンゲン、
# ノルトライン＝ヴェストファーレン。

# ---------------------------------------------------------------- 大きな領邦

- id: prussia
  name: プロイセン王国
  names:
    - {to: 1700, name: ブランデンブルク＝プロイセン, short: ブランデンブルク, kind: 選帝侯国（プロイセン公国と同君連合）}
  short: プロイセン
  color: "#8fa3bf"
  kind: 王国
  rulers:
    - name: フリードリヒ・ヴィルヘルム（大選帝侯）
      title: ブランデンブルク選帝侯・プロイセン公
      from: 1640
      to: 1688
      source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム_(ブランデンブルク選帝侯)"
    - name: フリードリヒ1世
      title: ブランデンブルク選帝侯（フリードリヒ3世）、1701年からプロイセン王
      from: 1688
      to: 1713
      source: "https://ja.wikipedia.org/wiki/フリードリヒ1世_(プロイセン王)"
    - name: フリードリヒ・ヴィルヘルム1世（兵隊王）
      title: プロイセン王
      from: 1713
      to: 1740
      source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム1世_(プロイセン王)"
    - name: フリードリヒ2世（大王）
      title: プロイセン王
      from: 1740
      to: 1786
      source: "https://ja.wikipedia.org/wiki/フリードリヒ2世_(プロイセン王)"
    - name: フリードリヒ・ヴィルヘルム2世
      title: プロイセン王
      from: 1786
      to: 1797
      source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム2世_(プロイセン王)"
    - name: フリードリヒ・ヴィルヘルム3世
      title: プロイセン王
      from: 1797
      to: 1840
      source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム3世_(プロイセン王)"
  periods:
    - from: 1648
      to: 1688
      text: 大選帝侯のもとで常備軍と官僚制を整え、ばらばらの領地（ブランデンブルク、東プロイセン、ライン下流のクレーヴェ・マルクなど）をまとめる。ウェストファリア条約で東ポンメルン・ミンデン・ハルバーシュタットを得、1680年にマグデブルクも加える。
    - from: 1689
      to: 1739
      text: 1701年に王国となる。兵隊王フリードリヒ・ヴィルヘルム1世は軍隊を大きく増やし、財政を引き締めた。1720年にスウェーデンからポンメルン南部（シュテッティンを含む）を獲得。
    - from: 1740
      to: 1786
      text: フリードリヒ2世（大王）がシュレジエンを奪い、七年戦争を戦い抜いて列強の一つとなる。啓蒙専制君主として知られ、「君主は国家第一の僕」と称した。
    - from: 1787
      to: 1805
      text: ポーランド分割で東へ大きく広がる。1795年のバーゼルの和約で対仏戦争から離れ、北ドイツの中立を保つ。1803年の帝国代表者会議主要決議でパーダーボルン・ミュンスター（東部）・ヒルデスハイムなどを得る。
    - from: 1806
      to: 1812
      text: イエナ・アウエルシュテットの戦いで大敗し、ティルジット条約でエルベ川以西とポーランド分割で得た領土の大半を失う。シュタイン・ハルデンベルクの改革で国家を立て直す。
    - from: 1813
      to: 1815
      text: 解放戦争でナポレオンと戦う。ウィーン会議でザクセンの北半分、ヴェストファーレン、ラインラント、スウェーデン領ポンメルンを得て、国土が東西二つに分かれた大国となる。
  source:
    - "https://ja.wikipedia.org/wiki/プロイセン王国"
    - "https://ja.wikipedia.org/wiki/ブランデンブルク＝プロイセン"

