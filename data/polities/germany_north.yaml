    - name: フリードリヒ・フランツ3世
      title: メクレンブルク＝シュヴェリーン大公
      from: 1883
      to: 1897
      source: "https://en.wikipedia.org/wiki/Frederick_Francis_III,_Grand_Duke_of_Mecklenburg-Schwerin"
    - name: フリードリヒ・フランツ4世
      title: メクレンブルク＝シュヴェリーン大公
      from: 1897
      to: 1918
      note: 1901年まで叔父ヨハン・アルブレヒトが摂政。
      source: "https://en.wikipedia.org/wiki/Frederick_Francis_IV,_Grand_Duke_of_Mecklenburg-Schwerin"
  periods:
    - from: 1453
      to: 1554
      text: メクレンブルク公家（オボトリート族の首長の子孫）のもとで、1471年に全土が一つにまとまる。ロストック・ヴィスマールのハンザ都市が大きな自治を持った。1549年に領邦議会がルター派を受け入れた。
    - from: 1555
      to: 1647
      text: 公家の兄弟がシュヴェリーンとギュストローに分かれて統治し、1621年に正式に分割した。三十年戦争ではデンマーク王に味方したため、1628年に皇帝に廃されてヴァレンシュタインに領地を奪われたが、1631年にスウェーデン軍の力で復位した。
    - from: 1648
      to: 1700
      text: 三十年戦争で大きく荒廃。ヴィスマールはスウェーデン領となる。1695年にギュストロー系が断絶し、その継承をめぐってシュトレーリッツ系と争った。
    - from: 1701
      to: 1785
      text: 1701年のハンブルク協定でメクレンブルク＝シュトレーリッツ公国と分かれる。貴族（騎士身分）が強く、1755年の「州基本法相続協定」で身分制の体制が固まった。
    - from: 1786
      to: 1815
      text: 1803年にヴィスマールをスウェーデンから質として取り戻す。1808年にライン同盟に加わり、1813年に最初に離脱した。1815年に大公国となる。
    - from: 1816
      to: 1866
      text: 大土地所有の騎士身分が強い農業国で、1755年の身分制の体制が続いた。1848年の革命で一度憲法ができたが、1850年に取り消された。農民の多くがアメリカへ移住した。
    - from: 1867
      to: 1914
      text: 北ドイツ連邦、1871年からドイツ帝国の構成国。ドイツの諸邦で唯一、帝政の終わり（1918年）まで近代的な憲法を持たなかった。
  source: "https://ja.wikipedia.org/wiki/メクレンブルク＝シュヴェリーン公国"

