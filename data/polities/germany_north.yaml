      title: アンハルト公
      from: 1871
      to: 1904
      source: "https://en.wikipedia.org/wiki/Frederick_I,_Duke_of_Anhalt"
    - name: フリードリヒ2世
      title: アンハルト公
      from: 1904
      to: 1918
      source: "https://en.wikipedia.org/wiki/Frederick_II,_Duke_of_Anhalt"
  periods:
    - from: 1453
      to: 1647
      text: アスカーニエン家の侯国。いくつもの系統に分かれ、1570年にいったん統一されたのち、1603年にデッサウ・ベルンブルク・ケーテン・ツェルプスト（・プレツカウ）に分割された。16世紀後半からカルヴァン派をとった。
    - from: 1648
      to: 1806
      text: アンハルト＝デッサウ、ベルンブルク、ケーテン、ツェルプストなどの系統に分かれた小国。「老デッサウ人」レオポルト1世はプロイセン軍の育ての親として知られる。ツェルプスト家からはロシアのエカチェリーナ2世が出た（1793年断絶）。デッサウのレオポルト3世は啓蒙的な改革とヴェルリッツ庭園で知られる。
    - from: 1807
      to: 1815
      text: 1807年にライン同盟に加わり、各系統が公国となる。1815年ドイツ連邦に加盟。
    - from: 1816
      to: 1862
      text: アンハルト＝デッサウ、ケーテン、ベルンブルクの3公国が並ぶ。1847年にケーテン系、1863年にベルンブルク系が断絶し、デッサウ系が相続した。
    - from: 1863
      to: 1914
      text: 1863年にアンハルト公国として統一。1867年に北ドイツ連邦、1871年からドイツ帝国の構成国。
  note: 地図ではアンハルト諸系統をまとめて表示している。君主欄は1863年の統一まで、デッサウ・ケーテン・ベルンブルクの各系統の公を並べている（ツェルプスト系は1793年に断絶）。
  source: "https://ja.wikipedia.org/wiki/アンハルト"

