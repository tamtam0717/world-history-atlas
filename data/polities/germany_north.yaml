- id: hamburg
  name: 自由都市ハンブルク
  names:
    - {from: 1815, to: 1870, name: 自由ハンザ都市ハンブルク, kind: 自由都市}
    - {from: 1871, name: 自由ハンザ都市ハンブルク, kind: 自由都市（ドイツ帝国の構成国）}
  short: ハンブルク
  color: "#d7807a"
  kind: 帝国自由都市（共和国）
  periods:
    - from: 1453
      to: 1647
      text: エルベ河口のハンザ都市。ホルシュタイン伯（のちデンマーク王）が領有を主張したが、1510年に帝国議会に招かれ、1618年に帝国最高法院が帝国都市と認めた。1529年に宗教改革。オランダ人などの亡命者を受け入れて、16世紀末から北ドイツ最大の商業都市となった。
    - from: 1648
      to: 1805
      text: エルベ川河口の商業都市。三十年戦争の被害を免れ、ドイツ最大の港町として栄えた。
    - from: 1806
      to: 1815
      text: 1806年からフランス軍が占領し、1810年末にフランスに併合された。1814年に解放され、1815年ドイツ連邦の自由都市となる。
    - from: 1816
      to: 1866
      text: 1842年の大火で市の中心部の約4分の1が焼けた。大西洋航路の海運会社（ハパグ、1847年創立）が生まれ、移民の出港地となる。
    - from: 1867
      to: 1914
      text: 北ドイツ連邦、1871年からドイツ帝国の構成国。1888年にドイツの関税領域に加わり、倉庫街（シュパイヒャーシュタット）と自由港が作られた。1892年にコレラが大流行した。ドイツ最大、ヨーロッパ有数の港となる。
  source: "https://ja.wikipedia.org/wiki/ハンブルク"

