    - from: 1754
      to: 1806
      text: 1753/54年に首都をブラウンシュヴァイクに移す。プロイセンと結びつきが強く、公子たちはプロイセン軍の将軍となった。
    - from: 1807
      to: 1813
      text: ヴェストファーレン王国に併合される。1813年末に公が帰国して復活した。
  source: "https://ja.wikipedia.org/wiki/ブラウンシュヴァイク＝ヴォルフェンビュッテル侯領"

