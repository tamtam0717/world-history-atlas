    - name: フリードリヒ・アウグスト1世（アウグスト強健王）
      title: ザクセン選帝侯、ポーランド王アウグスト2世（1697–1706、1709–1733）
      from: 1694
      to: 1733
      source: "https://ja.wikipedia.org/wiki/アウグスト2世_(ポーランド王)"
    - name: フリードリヒ・アウグスト2世
      title: ザクセン選帝侯、ポーランド王アウグスト3世（1734–1763）
      from: 1733
      to: 1763
      source: "https://ja.wikipedia.org/wiki/アウグスト3世_(ポーランド王)"
    - name: フリードリヒ・クリスティアン
      title: ザクセン選帝侯
      from: 1763
      to: 1763
      source: "https://en.wikipedia.org/wiki/Frederick_Christian,_Elector_of_Saxony"
    - name: フリードリヒ・アウグスト3世（1806年から国王フリードリヒ・アウグスト1世）
      title: ザクセン選帝侯→ザクセン王、ワルシャワ大公（1807–1815）
      from: 1763
      to: 1827
      source: "https://ja.wikipedia.org/wiki/フリードリヒ・アウグスト1世_(ザクセン王)"
  periods:
    - from: 1648
      to: 1693
      text: 三十年戦争で荒廃した国土を立て直す。1635年に獲得した上・下ラウジッツを領有。1656年から次男以下の分家（ヴァイセンフェルス、メルゼブルク、ツァイツ）が置かれる。
    - from: 1694
      to: 1763
      text: アウグスト強健王とその子がポーランド王を兼ねる（同君連合）。ドレスデンはバロック文化の都として栄え、マイセン磁器が作られる。一方で大北方戦争・七年戦争で大きな損害を受けた。
    - from: 1764
      to: 1805
      text: 七年戦争後の「再建（レタブリッスマン）」で財政と産業を立て直す。
    - from: 1806
      to: 1813
      text: ナポレオン側につき、ポーゼン条約で王国に昇格してライン同盟に加わる。国王はワルシャワ大公も兼ねた。1813年のライプツィヒの戦いの後、国王は捕虜となり、国土は連合国に占領された。
    - from: 1814
      to: 1815
      text: ウィーン会議で処分が争われ（ザクセン＝ポーランド問題）、国土の北半分（下ラウジッツ・上ラウジッツ北部・ヴィッテンベルクなど）をプロイセンに割譲した。
  source: "https://ja.wikipedia.org/wiki/ザクセン選帝侯領"

