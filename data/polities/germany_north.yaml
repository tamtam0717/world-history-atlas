  periods:
    - from: 1453
      to: 1484
      text: ヴェッティン家の選帝侯国。エルツ山地で銀山（シュネーベルク・アンナベルク）が開かれて豊かになる。1482年に叔父ヴィルヘルム3世のテューリンゲンを相続し、兄弟で共同統治した。
    - from: 1485
      to: 1546
      text: 1485年のライプツィヒの分割で、選帝侯位とヴィッテンベルクはエルンスト系、マイセン・ドレスデン・ライプツィヒはアルベルト系（ザクセン公国）に分かれる。ゲオルク髭公はルターに反対したが、1539年にハインリヒ敬虔公が宗教改革を導入した。
    - from: 1547
      to: 1585
      text: モーリッツがシュマルカルデン戦争で皇帝カール5世につき、ヴィッテンベルク降伏で選帝侯位とヴィッテンベルク周辺を得る。1552年には皇帝に背いてパッサウ条約を勝ち取り、アウグスブルクの和議への道を開いた。アウグストが領邦の行政を整えた。
    - from: 1586
      to: 1647
      text: ルター派の中心として皇帝と協調することが多かった。三十年戦争では1620年に皇帝の側でラウジッツを占領し、1631年にスウェーデンと結んだが、1635年のプラハの和約で皇帝と和解してラウジッツを得た。その後スウェーデン軍に何度も侵攻され、1645年に休戦した。
    - from: 1648
      to: 1693
      text: 三十年戦争で荒廃した国土を立て直す。1635年に獲得した上・下ラウジッツを領有。1656年から次男以下の分家（ヴァイセンフェルス、メルゼブルク、ツァイツ）が置かれる。
    - from: 1694
      to: 1763
      text: アウグスト強健王とその子がポーランド王を兼ねる（同君連合）。ドレスデンはバロック文化の都として栄え、マイセン磁器が作られる。一方で大北方戦争・七年戦争で大きな損害を受けた。
    - from: 1764
      to: 1805
      text: 七年戦争後の「再建（レタブリッスマン）」で財政と産業を立て直す。
    - from: 1806
      to: 1813
      text: ナポレオン側につき、ポーゼン条約で王国に昇格してライン同盟に加わる。国王はワルシャワ大公も兼ねた。1813年のライプツィヒの戦いの後、国王は捕虜となり、国土は連合国に占領された。
    - from: 1814
      to: 1815
      text: ウィーン会議で処分が争われ（ザクセン＝ポーランド問題）、国土の北半分（下ラウジッツ・上ラウジッツ北部・ヴィッテンベルクなど）をプロイセンに割譲した。
    - from: 1816
      to: 1847
      text: 国土の北半分を失ったが、ライプツィヒの見本市と繊維・機械工業でドイツで最も早く工業化が進んだ地域の一つ。1830年の騒乱の後、1831年に憲法を定めた。1839年にライプツィヒ＝ドレスデン鉄道が開通。
    - from: 1848
      to: 1866
      text: 1849年のドレスデン五月蜂起（作曲家ワーグナーも参加）をプロイセン軍の助けで鎮圧した。首相ボイストのもとで中小国をまとめてプロイセンに対抗し、1866年の普墺戦争ではオーストリア側で戦って敗れた。
    - from: 1867
      to: 1914
      text: 領土を減らされずに北ドイツ連邦、1871年からドイツ帝国の構成国となる。工業化が進み、社会民主党の支持が強い「赤いザクセン」と呼ばれた。
  source: "https://ja.wikipedia.org/wiki/ザクセン選帝侯領"

