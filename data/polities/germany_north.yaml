- id: north_german_confederation
  name: 北ドイツ連邦
  short: 北ドイツ連邦
  color: "#b9bfcc"
  kind: 連邦国家
  note: >-
    overlord（外枠）としてだけ使う枠。マイン川以北の22の邦（プロイセン、ザクセン、メクレンブルク、テューリンゲン諸国、ハンザ3都市など。
    ヘッセン大公国はマイン川以北の上ヘッセンだけ）からなる連邦国家。プロイセン王が連邦主席（Bundespräsidium）、
    ビスマルクが連邦宰相を務めた。1871年1月1日にドイツ帝国（憲法上は「ドイツ国」）に移行した。
  rulers:
    - name: ヴィルヘルム1世
      title: プロイセン王・北ドイツ連邦主席
      from: 1867
      to: 1870
      note: 連邦宰相はビスマルク（1867–1871）。
      source: "https://ja.wikipedia.org/wiki/ヴィルヘルム1世_(ドイツ皇帝)"
  periods:
    - from: 1867
      to: 1870
      text: 普墺戦争の勝利の後、プロイセンを中心にマイン川以北の諸国が作った連邦国家。男子普通選挙で選ばれる議会（帝国議会の前身）を持つ。バイエルン・ヴュルテンベルク・バーデン・ヘッセンの南ドイツ4国とは攻守同盟と関税議会で結ばれ、普仏戦争の中でドイツ帝国へと発展した。
  source:
    - "https://ja.wikipedia.org/wiki/北ドイツ連邦"
    - "https://en.wikipedia.org/wiki/North_German_Confederation"

- id: german_empire
  name: ドイツ帝国
  home_iso: [DEU, POL, RUS, LTU, DNK, FRA]   # 本国（エルザス＝ロートリンゲン・東部領土を含む）。膠州湾・占領地は含めない
  short: ドイツ帝国
  color: "#a7abc0"
  kind: 帝国（連邦国家）
  note: >-
    1871年1月18日、ヴェルサイユ宮殿鏡の間でプロイセン王ヴィルヘルム1世がドイツ皇帝として即位して成立した。
    4つの王国（プロイセン・バイエルン・ザクセン・ヴュルテンベルク）、6つの大公国、5つの公国、7つの侯国、3つの自由都市と
    帝国直轄領エルザス＝ロートリンゲンからなる連邦国家で、地図では1色で塗る。構成国の君主・情勢はそれぞれの政体に残している。
    帝国宰相：ビスマルク（1871–1890）、カプリヴィ（1890–1894）、ホーエンローエ（1894–1900）、ビューロー（1900–1909）、ベートマン・ホルヴェーク（1909–1917）。
  rulers:
    - name: ヴィルヘルム1世
      title: ドイツ皇帝・プロイセン王
      from: 1871
      to: 1888
      source: "https://ja.wikipedia.org/wiki/ヴィルヘルム1世_(ドイツ皇帝)"
    - name: フリードリヒ3世
      title: ドイツ皇帝・プロイセン王
      from: 1888
      to: 1888
      note: 喉頭がんのため在位99日で死去。1888年は「三皇帝の年」と呼ばれる。
      source: "https://ja.wikipedia.org/wiki/フリードリヒ3世_(ドイツ皇帝)"
    - name: ヴィルヘルム2世
      title: ドイツ皇帝・プロイセン王
      from: 1888
      to: 1918
      source: "https://ja.wikipedia.org/wiki/ヴィルヘルム2世_(ドイツ皇帝)"
  periods:
    - from: 1871
      to: 1878
      text: 宰相ビスマルクのもとで国内の統合を進める。カトリック教会と対立した文化闘争を起こし、国民自由党と協力して通貨・法制度を統一した。帝国議会は男子普通選挙で選ばれた。
    - from: 1879
      to: 1890
      text: 保護関税に転じ、社会主義者鎮圧法で社会主義運動を抑える一方、世界初の社会保険制度を作った（「アメとムチ」）。外交では三帝同盟・三国同盟・再保障条約でフランスを孤立させ、1884年からアフリカ・太平洋に植民地を得た。
    - from: 1890
      to: 1914
      text: ヴィルヘルム2世がビスマルクを辞めさせ、「世界政策」に転じる。再保障条約を更新せず露仏同盟を招き、大艦隊の建造でイギリスとも対立した。重化学工業でイギリスを追い抜き、社会民主党は1912年に帝国議会の第一党となった。1914年に第一次世界大戦が始まる。
    - from: 1914
      to: 1918
      text: 第一次世界大戦。西部戦線は塹壕戦で動かなくなり、東部ではロシアに勝ってブレスト＝リトフスク条約（1918年3月）を結んだ。1917年の無制限潜水艦作戦でアメリカが参戦し、1918年11月のキール軍港の水兵反乱からドイツ革命が起き、皇帝が退位して帝政が終わった。
  source:
    - "https://ja.wikipedia.org/wiki/ドイツ帝国"
    - "https://en.wikipedia.org/wiki/German_Empire"

