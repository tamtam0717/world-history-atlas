    - name: フリードリヒ・メルツ
      title: 連邦首相
      from: 2025
      note: CDU。2025年5月に就任（CDU・CSU と SPD の連立）。
      source: "https://ja.wikipedia.org/wiki/フリードリヒ・メルツ"
  periods:
    - from: 1918
      to: 1923
      text: 敗戦と革命のなかで共和国が生まれ、1919年に当時もっとも民主的といわれたヴァイマル憲法を定めた。ヴェルサイユ条約で領土の約13％と植民地をすべて失い、巨額の賠償を課された。左右の蜂起が続き、1923年にはフランス・ベルギーのルール占領とハイパーインフレーションで国が揺らいだ。
    - from: 1924
      to: 1929
      text: レンテンマルクで通貨が安定し、ドーズ案でアメリカの資本が流れ込んで経済が立ち直った（「相対的安定期」）。外相シュトレーゼマンのもとでロカルノ条約を結び、1926年に国際連盟に加わった。ベルリンを中心に「黄金の20年代」の文化が栄えた。
    - from: 1929
      to: 1932
      text: 世界恐慌で失業者が600万人を超え、議会の多数派が作れなくなって大統領の緊急令に頼る政治になった。共産党とナチ党が伸び、1932年7月の選挙でナチ党が第一党となった。
    - from: 1933
      to: 1938
      text: ヒトラーが首相となり、全権委任法で議会から立法権を奪い、ほかの政党や労働組合を解散させて一党独裁を作った。ユダヤ人を公職や市民権から締め出し（ニュルンベルク法）、秘密警察（ゲシュタポ）と強制収容所で反対派を弾圧した。国際連盟を脱退して再軍備を進め、1938年にオーストリアとズデーテンを併合した。
    - from: 1939
      to: 1945
      text: 1939年9月のポーランド侵攻で第二次世界大戦を起こし、1940年にはフランスなどヨーロッパの大部分を占領した。1941年からソ連と戦う。占領地でユダヤ人約600万人を組織的に殺害した（ホロコースト）。1943年のスターリングラードの敗北から後退し、1945年5月に無条件降伏した。
    - from: 1990
      to: 2004
      text: 東西の統一で人口約8,000万人の国となった。旧東ドイツの再建に巨額の費用がかかり、失業と東西の格差が問題になった。首都をボンからベルリンに移し（議会は1999年）、ヨーロッパ連合の中心国としてユーロを導入した（2002年に現金）。
    - from: 2005
      to: 2021
      text: メルケル首相のもとで労働市場改革の効果が出て経済が好調となり、ユーロ危機ではEUの中心として対応した。2011年に原子力発電からの撤退を決め、2015年には100万人を超える難民を受け入れた。
    - from: 2022
      text: ロシアのウクライナ侵攻を受けて「時代の転換」を掲げ、国防費を増やし、ロシア産の天然ガスへの依存から抜け出した。エネルギー価格の高騰と景気の停滞が続き、移民に反対する右派政党が伸びた。
  source:
    - "https://ja.wikipedia.org/wiki/ヴァイマル共和政"
    - "https://ja.wikipedia.org/wiki/ナチス・ドイツ"
    - "https://ja.wikipedia.org/wiki/ドイツ"

