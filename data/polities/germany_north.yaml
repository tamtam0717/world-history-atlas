  periods:
    - from: 1485
      to: 1546
      text: ライプツィヒの分割で選帝侯位を持つ系統（エルンスト系）。ヴィッテンベルクとテューリンゲンを治め、フリードリヒ賢明公がルターを守って宗教改革の拠点となった。1531年からシュマルカルデン同盟の盟主。
    - from: 1547
      to: 1647
      text: シュマルカルデン戦争に敗れ、ヴィッテンベルク降伏（1547）で選帝侯位とヴィッテンベルク周辺をアルベルト系に奪われる。テューリンゲンの領地は相続のたびに分けられ、ヴァイマル・コーブルク・アイゼナハ・アルテンブルク・ゴータなどの小公国になった。1558年にイェーナ大学を創設。
    - from: 1648
      to: 1805
      text: ルターを保護したザクセン選帝侯の系統（エルネスティン家）が分割相続をくり返してできた、テューリンゲンの小公国群（ヴァイマル、アイゼナハ、ゴータ、アルテンブルク、マイニンゲン、コーブルク、ヒルトブルクハウゼンなど）。ヴァイマルはゲーテ・シラーが活躍した古典主義文学の中心となった。
    - from: 1806
      to: 1815
      text: 1806年末にライン同盟に加わる。1815年にザクセン＝ヴァイマル＝アイゼナハは大公国となり、ドイツ連邦に加盟した。
    - from: 1816
      to: 1866
      text: ザクセン＝ヴァイマル＝アイゼナハ大公国は1816年にドイツで最も早い憲法の一つを定め、1817年には学生のヴァルトブルク祭が開かれた。1826年にゴータ家の断絶で再編され、ヴァイマル、コーブルク＝ゴータ、マイニンゲン、アルテンブルクの4国となる。コーブルク家からはベルギー王レオポルド1世やヴィクトリア女王の夫アルバートが出た。
    - from: 1867
      to: 1914
      text: 1866年の普墺戦争でオーストリア側についたマイニンゲン公は退位させられた。各国は北ドイツ連邦、1871年からドイツ帝国の構成国となった。イエナではツァイスの光学工業が育った。
  note: 地図では諸公国をまとめて表示している。君主欄は1815年以降の各公国（ヴァイマル、ゴータ＝アルテンブルク、コーブルク、マイニンゲン、ヒルトブルクハウゼン→アルテンブルク）の君主。1485–1647年は選帝侯と主な公を並べ、1648–1814年の各家の君主は省略。1485–1546年はエルネスト系の選帝侯国（ヴィッテンベルクとテューリンゲン）、1547年からテューリンゲンの諸公国。
  source: "https://ja.wikipedia.org/wiki/ザクセン公国"

