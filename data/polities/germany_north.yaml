      from: 1698
      to: 1727
      source: "https://ja.wikipedia.org/wiki/ジョージ1世_(イギリス王)"
    - name: ゲオルク2世アウグスト（イギリス王ジョージ2世）
      title: ハノーファー選帝侯・イギリス王
      from: 1727
      to: 1760
      source: "https://ja.wikipedia.org/wiki/ジョージ2世_(イギリス王)"
    - name: ゲオルク3世（イギリス王ジョージ3世）
      title: ハノーファー選帝侯・イギリス王、1814年からハノーファー王
      from: 1760
      to: 1820
      source: "https://ja.wikipedia.org/wiki/ジョージ3世_(イギリス王)"
  periods:
    - from: 1648
      to: 1704
      text: ヴェルフ家（ブラウンシュヴァイク＝リューネブルク家）の分家カレンベルク侯領。首都はハノーファー。1692年に9番目の選帝侯位を得る。リューネブルク（ツェレ）の本家とは1705年に統合。
    - from: 1705
      to: 1802
      text: 1714年に選帝侯ゲオルク・ルートヴィヒがイギリス王ジョージ1世となり、イギリスとの同君連合が始まる。1715–1719年にスウェーデン領だったブレーメン＝フェルデンを獲得。1737年にゲッティンゲン大学を開く。
    - from: 1803
      to: 1813
      text: 1803年にフランス軍に占領される。1806年に一時プロイセンが併合した後、南部は1807年にヴェストファーレン王国へ、残りも1810年にヴェストファーレン王国とフランスに分割された。
    - from: 1814
      to: 1815
      text: 王国に昇格。ウィーン会議で東フリースラント・ヒルデスハイム・ゴスラー・リンゲン・メッペンなどを得て、ラウエンブルクを手放す。
  note: イギリス王を兼ねた選帝侯はロンドンに住み、ハノーファーは枢密院が統治した。
  source: "https://ja.wikipedia.org/wiki/ハノーファー選帝侯領"

