    - from: 1648
      to: 1815
      text: ヴェーザー川の商業都市。周囲のスウェーデン領ブレーメン公領と帝国都市の地位をめぐって争った（1666年ハーベンハウゼン条約）。1810年末にフランスに併合され、1813年に解放された。
    - from: 1816
      to: 1914
      text: 1827年にヴェーザー川の河口にブレーマーハーフェンを築き、北ドイツ・ロイド（1857年創立）の本拠としてアメリカへの移民の主な出港地となった。1867年に北ドイツ連邦、1871年からドイツ帝国の構成国。
