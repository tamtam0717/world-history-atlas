      text: 1701年のハンブルク協定で成立。シュタルガルト地方（ノイシュトレーリッツ・ノイブランデンブルク）と、飛び地のラッツェブルク侯領からなる。イギリス王ジョージ3世の妃シャーロット、プロイセン王妃ルイーゼはこの家の出身。
    - from: 1816
      to: 1914
      text: シュヴェリーンと共通の身分制の体制のまま、憲法を持たない小さな農業国として続いた。1867年に北ドイツ連邦、1871年からドイツ帝国の構成国。
  source: "https://ja.wikipedia.org/wiki/メクレンブルク＝シュトレーリッツ公国"

