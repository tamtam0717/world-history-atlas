    1945–1949年は連合国の分割占領（地図では占領国の色に赤い斜線）、1949–1990年は西ドイツ（west_germany）と東ドイツ（east_germany）に分かれた。
    元首の欄には、その時期に実権を持った人を書いた。ヴァイマル期は大統領（首相は短命で、1930年からは大統領の緊急令に頼る大統領内閣だった）、
    ナチ期はヒトラー、統一後は連邦首相（大統領は儀礼的な元首）。
    ヴァイマル期の首相：シャイデマン、バウアー、ミュラー、フェーレンバッハ、ヴィルト、クーノ、シュトレーゼマン（1923）、マルクス、ルター、ミュラー（1928–1930）、ブリューニング（1930–1932）、パーペン、シュライヒャー（1932–1933）。
    統一後の連邦大統領：ヴァイツゼッカー（–1994）、ヘルツォーク、ラウ、ケーラー、ヴルフ、ガウク、シュタインマイアー（2017–）。
