  kind: 帝国自由都市（共和国）
  periods:
    - from: 1648
      to: 1805
      text: エルベ川河口の商業都市。三十年戦争の被害を免れ、ドイツ最大の港町として栄えた。
    - from: 1806
      to: 1815
      text: 1806年からフランス軍が占領し、1810年末にフランスに併合された。1814年に解放され、1815年ドイツ連邦の自由都市となる。
