      title: プロイセン王
      from: 1840
      to: 1861
      note: 1858年から病気のため弟ヴィルヘルム（のちのヴィルヘルム1世）が摂政。
      source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム4世_(プロイセン王)"
    - name: ヴィルヘルム1世
      title: プロイセン王、1867年から北ドイツ連邦主席、1871年からドイツ皇帝
      from: 1861
      to: 1888
      note: 1862年にビスマルクを首相に任命した。
      source: "https://ja.wikipedia.org/wiki/ヴィルヘルム1世_(ドイツ皇帝)"
    - name: フリードリヒ3世
      title: プロイセン王・ドイツ皇帝
      from: 1888
      to: 1888
      note: 在位99日で病死。自由主義的とされた。
      source: "https://ja.wikipedia.org/wiki/フリードリヒ3世_(ドイツ皇帝)"
    - name: ヴィルヘルム2世
      title: プロイセン王・ドイツ皇帝
      from: 1888
      to: 1918
      source: "https://ja.wikipedia.org/wiki/ヴィルヘルム2世_(ドイツ皇帝)"
  periods:
    - from: 1648
      to: 1688
      text: 大選帝侯のもとで常備軍と官僚制を整え、ばらばらの領地（ブランデンブルク、東プロイセン、ライン下流のクレーヴェ・マルクなど）をまとめる。ウェストファリア条約で東ポンメルン・ミンデン・ハルバーシュタットを得、1680年にマグデブルクも加える。
    - from: 1689
      to: 1739
      text: 1701年に王国となる。兵隊王フリードリヒ・ヴィルヘルム1世は軍隊を大きく増やし、財政を引き締めた。1720年にスウェーデンからポンメルン南部（シュテッティンを含む）を獲得。
    - from: 1740
      to: 1786
      text: フリードリヒ2世（大王）がシュレジエンを奪い、七年戦争を戦い抜いて列強の一つとなる。啓蒙専制君主として知られ、「君主は国家第一の僕」と称した。
    - from: 1787
      to: 1805
      text: ポーランド分割で東へ大きく広がる。1795年のバーゼルの和約で対仏戦争から離れ、北ドイツの中立を保つ。1803年の帝国代表者会議主要決議でパーダーボルン・ミュンスター（東部）・ヒルデスハイムなどを得る。
    - from: 1806
      to: 1812
      text: イエナ・アウエルシュテットの戦いで大敗し、ティルジット条約でエルベ川以西とポーランド分割で得た領土の大半を失う。シュタイン・ハルデンベルクの改革で国家を立て直す。
    - from: 1813
      to: 1815
      text: 解放戦争でナポレオンと戦う。ウィーン会議でザクセンの北半分、ヴェストファーレン、ラインラント、スウェーデン領ポンメルンを得て、国土が東西二つに分かれた大国となる。
    - from: 1816
      to: 1847
      text: ウィーン体制のもとで改革は止まり、約束された憲法は作られなかった。一方で1834年のドイツ関税同盟を主導して経済面でドイツをまとめ、ルール・シュレジエン・ベルリンを中心に工業化と鉄道建設が始まる。
    - from: 1848
      to: 1861
      text: 1848年の三月革命でベルリンに市街戦が起こる。国王は年末に欽定憲法を出し、1849年に三級選挙法を定めた。フランクフルト国民議会が贈った帝冠は拒否し、1850年のオルミュッツ協定でオーストリアに屈した。
    - from: 1862
      to: 1870
      text: 軍制改革をめぐる議会との対立（憲法紛争）の中で首相となったビスマルクが「鉄と血」による統一を進める。デンマーク戦争（1864）・普墺戦争（1866）に勝ってハノーファーなどを併合し、北ドイツ連邦を作った。
    - from: 1871
      to: 1914
      text: ドイツ帝国の中心の構成国。国王がドイツ皇帝を兼ね、首相は多くの場合帝国宰相を兼ねた。帝国の国土と人口の約5分の3を占め、三級選挙法のもとでユンカー（地主貴族）と軍の力が強かった。
  source:
    - "https://ja.wikipedia.org/wiki/プロイセン王国"
    - "https://ja.wikipedia.org/wiki/ブランデンブルク＝プロイセン"

