- id: cologne_city
  name: 自由都市ケルン
  short: ケルン市
  color: "#b88fb0"
  kind: 帝国自由都市
  periods:
    - from: 1648
      to: 1794
      text: ライン川沿いの大都市。ケルン大司教の居城はボンにあり、市は大司教から独立した帝国自由都市だった。1794年にフランスに占領された。
