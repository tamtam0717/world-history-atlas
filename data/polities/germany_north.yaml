    - name: カール・ヴィルヘルム・フェルディナント
      title: ブラウンシュヴァイク＝ヴォルフェンビュッテル公
      from: 1780
      to: 1806
      note: プロイセン軍の司令官。1792年の「ブラウンシュヴァイク宣言」で知られ、1806年アウエルシュテットで致命傷を負った。
      source: "https://en.wikipedia.org/wiki/Charles_William_Ferdinand,_Duke_of_Brunswick-Wolfenbüttel"
    - name: フリードリヒ・ヴィルヘルム（黒公）
      title: ブラウンシュヴァイク公
      from: 1806
      to: 1815
      note: 1807–1813年は領地をヴェストファーレン王国に奪われ、「黒い軍団」を率いてナポレオンと戦った。1815年カトル・ブラで戦死。
      source: "https://en.wikipedia.org/wiki/Frederick_William,_Duke_of_Brunswick-Wolfenbüttel"
    - name: カール2世
      title: ブラウンシュヴァイク公
      from: 1815
      to: 1830
      note: 未成年のため、イギリス摂政王太子（のちのジョージ4世）が後見した。
      source: "https://en.wikipedia.org/wiki/Charles_II,_Duke_of_Brunswick"
    - name: ヴィルヘルム
      title: ブラウンシュヴァイク公
      from: 1830
      to: 1884
      note: 兄カール2世の追放後、1830年に統治を始め、1831年に正式に公となった。
      source: "https://en.wikipedia.org/wiki/William,_Duke_of_Brunswick"
    - name: アルブレヒト（プロイセン王子）
      title: ブラウンシュヴァイク摂政
      from: 1885
      to: 1906
      note: ヴェルフ家の継承者（ハノーファー家のカンバーランド公）がプロイセンによるハノーファー併合を認めなかったため、摂政が置かれた。
      source: "https://en.wikipedia.org/wiki/Prince_Albert_of_Prussia_(1837–1906)"
    - name: ヨハン・アルブレヒト（メクレンブルク公）
      title: ブラウンシュヴァイク摂政
      from: 1907
      to: 1913
      source: "https://en.wikipedia.org/wiki/Duke_John_Albert_of_Mecklenburg"
    - name: エルンスト・アウグスト
      title: ブラウンシュヴァイク公
      from: 1913
      to: 1918
      note: ハノーファー王家の出身。ヴィルヘルム2世の娘ヴィクトリア・ルイーゼと結婚して即位した。
      source: "https://en.wikipedia.org/wiki/Ernest_Augustus,_Duke_of_Brunswick"
  periods:
    - from: 1453
      to: 1513
      text: ヴェルフ家の中家のヴォルフェンビュッテル侯領。1473–95年はカレンベルクと合わさっていた。ブラウンシュヴァイク市は公から自立したハンザ都市だった。
    - from: 1514
      to: 1567
      text: ハインリヒ若公はヒルデスハイム司教領のフェーデ（1519–23）で領地を広げ、カトリックを守ってシュマルカルデン同盟と争った。1542年に同盟軍に国を追われ、1547年に戻った。
    - from: 1568
      to: 1634
      text: ユリウスが宗教改革を導入し、ハルツの鉱山を開発した。1584年にカレンベルク侯領を相続して北ドイツの大きな領邦となったが、三十年戦争で荒廃し、1634年に中家が断絶。翌年、新家のアウグスト若公が継いだ。
    - from: 1648
      to: 1753
      text: ヴェルフ家の一系統。首都ヴォルフェンビュッテルにはアウグスト公の大図書館があった。1671年にブラウンシュヴァイク市を服属させる。
    - from: 1754
      to: 1806
      text: 1753/54年に首都をブラウンシュヴァイクに移す。プロイセンと結びつきが強く、公子たちはプロイセン軍の将軍となった。
    - from: 1807
      to: 1813
      text: ヴェストファーレン王国に併合される。1813年末に公が帰国して復活した。
    - from: 1816
      to: 1866
      text: 1830年に専制的なカール2世が民衆に城を焼かれて追放され、弟ヴィルヘルムのもとで1832年に憲法が定められた。
    - from: 1867
      to: 1914
      text: 北ドイツ連邦、1871年からドイツ帝国の構成国。1884年にヴィルヘルム公が死去してブラウンシュヴァイク家が断絶すると、継承者のハノーファー家とプロイセンが対立し、1913年まで摂政が治めた。
  source: "https://ja.wikipedia.org/wiki/ブラウンシュヴァイク＝ヴォルフェンビュッテル侯領"

- id: oldenburg
