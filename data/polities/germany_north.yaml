    - from: 1648
      to: 1815
      text: かつてのハンザ同盟の盟主。1806年にフランス軍に占領され、1810年末にフランスに併合された。1813年に解放された。
    - from: 1816
      to: 1914
      text: ハンブルク・ブレーメンとともに自由都市として残った。1867年に北ドイツ連邦、1871年からドイツ帝国の構成国。トーマス・マンの『ブッデンブローク家の人々』（1901年）はこの町の商家を描いた。
