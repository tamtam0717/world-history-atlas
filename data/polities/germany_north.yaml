      source: "https://ja.wikipedia.org/wiki/ピョートル3世"
    - name: パーヴェル（のちのロシア皇帝パーヴェル1世）
      title: ホルシュタイン＝ゴットルプ公
      from: 1762
      to: 1773
      source: "https://ja.wikipedia.org/wiki/パーヴェル1世"
  periods:
    - from: 1544
      to: 1647
      text: 1544年、デンマーク王クリスチャン3世が弟たちとシュレースヴィヒ・ホルシュタインを分け、ゴットルプ家の公領が生まれた（領地は王領と入り組んでいた）。首都はゴットルフ城（シュレースヴィヒ）。
    - from: 1648
      to: 1720
      text: シュレースヴィヒとホルシュタインをデンマーク王と分け合って治めた。スウェーデンと結んでデンマークと対立し、1658年にシュレースヴィヒの持ち分の主権を得たが、大北方戦争中の1713年にシュレースヴィヒの持ち分をデンマークに奪われた（1720年確定）。
    - from: 1721
      to: 1773
      text: キールを首都にホルシュタインの持ち分だけを治める。公カール・ペーター・ウルリヒがロシア皇帝ピョートル3世となり、ロシアとの結びつきが強まった。1773年、ホルシュタインの持ち分をデンマークに渡し、代わりにオルデンブルクを得た。
  note: 地図では、ゴットルプ家とデンマーク王家の細かい分有を、主な地域ごとにまとめて表示している（簡略化）。
  source: "https://ja.wikipedia.org/wiki/ホルシュタイン＝ゴットルプ家"

