    - {name: ヴィルヘルム4世, title: ユーリヒ＝ベルク公, from: 1475, to: 1511, source: "https://en.wikipedia.org/wiki/William_IV,_Duke_of_Jülich-Berg"}
    - {name: ヨハン（3世）, title: ユーリヒ＝ベルク公（妻マリアの権利で）, from: 1511, to: 1521, note: "1521年にクレーヴェ公を継いだ（cleves）", source: "https://en.wikipedia.org/wiki/John_III,_Duke_of_Cleves"}
