    - "https://ja.wikipedia.org/wiki/ユーリヒ＝クレーフェ継承戦争"

- id: julich_berg
  name: ユーリヒ＝ベルク公国
  short: ユーリヒ＝ベルク
  color: "#e7cf92"
  kind: 公国
  note: ライン左岸のユーリヒ公国と右岸のベルク公国（首都デュッセルドルフ）、ヴェストファーレンのラーヴェンスベルク伯領を治めた。1511年に最後の公ヴィルヘルム4世が死に、娘マリアの夫ヨハン（クレーヴェ公子）が継いで、1521年にクレーヴェと合わさった（以後は cleves の色）。
