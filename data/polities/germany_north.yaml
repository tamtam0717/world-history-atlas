      to: 1815
      text: ヴェーザー川の商業都市。周囲のスウェーデン領ブレーメン公領と帝国都市の地位をめぐって争った（1666年ハーベンハウゼン条約）。1810年末にフランスに併合され、1813年に解放された。
  source: "https://ja.wikipedia.org/wiki/ブレーメン"

- id: lubeck
  name: 自由都市リューベック
  short: リューベック
  color: "#c97a8f"
  kind: 帝国自由都市（共和国）
  periods:
    - from: 1648
      to: 1815
      text: かつてのハンザ同盟の盟主。1806年にフランス軍に占領され、1810年末にフランスに併合された。1813年に解放された。
