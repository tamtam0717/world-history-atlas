    - name: パウル・フリードリヒ・アウグスト
      title: オルデンブルク大公
      from: 1829
      to: 1853
      source: "https://en.wikipedia.org/wiki/Augustus,_Grand_Duke_of_Oldenburg"
    - name: ニコラウス・フリードリヒ・ペーター
      title: オルデンブルク大公
      from: 1853
      to: 1900
      source: "https://en.wikipedia.org/wiki/Peter_II,_Grand_Duke_of_Oldenburg"
    - name: フリードリヒ・アウグスト2世
      title: オルデンブルク大公
      from: 1900
      to: 1918
      source: "https://en.wikipedia.org/wiki/Frederick_Augustus_II,_Grand_Duke_of_Oldenburg"
  periods:
    - from: 1453
      to: 1602
      text: デンマーク王家（オルデンブルク朝）の本家筋にあたる伯領。北海沿岸のフリースラント人の土地（ブトヤディンゲン 1514、イェファー 1575）を合わせて広がり、1547年にミュンスター司教からデルメンホルストを取り戻した。
    - from: 1648
      to: 1667
      text: アントン・ギュンター伯が三十年戦争中も中立を保ち、国土の荒廃を免れた。
    - from: 1667
      to: 1772
      text: 伯の死後、デンマーク王が相続し、デンマーク領となる（地図ではデンマークの色で表示）。
    - from: 1773
      to: 1815
      text: 交換条約でホルシュタイン＝ゴットルプ家の若い系統に渡され、1774年に公国となる。1803年にミュンスター司教領の北部（フェヒタ・クロッペンブルク）を得る。1808年ライン同盟に加わったが、1810年末にフランスに併合された。
    - from: 1816
      to: 1866
      text: ウィーン会議で大公国とされ（称号の使用は1829年から）、1818年にヤーファーを得た。飛び地としてリューベック侯領（オイティン）とビルケンフェルト侯領を持つ。1849年に憲法を定め、1853年のヤーデ条約で軍港用地をプロイセンに売った。
    - from: 1867
      to: 1914
      text: 北ドイツ連邦、1871年からドイツ帝国の構成国。
  source: "https://ja.wikipedia.org/wiki/オルデンブルク公国"

