      source: "https://ja.wikipedia.org/wiki/ジョージ4世_(イギリス王)"
    - name: ヴィルヘルム（イギリス王ウィリアム4世）
      title: ハノーファー王・イギリス王
      from: 1830
      to: 1837
      source: "https://ja.wikipedia.org/wiki/ウィリアム4世_(イギリス王)"
    - name: エルンスト・アウグスト
      title: ハノーファー王
      from: 1837
      to: 1851
      note: ウィリアム4世の弟（カンバーランド公）。女性が継げないハノーファーの継承法により即位し、イギリスとの同君連合が終わった。
      source: "https://en.wikipedia.org/wiki/Ernest_Augustus,_King_of_Hanover"
    - name: ゲオルク5世
      title: ハノーファー王
      from: 1851
      to: 1866
      note: 盲目の王。1866年に国を失い、オーストリアに亡命した。
      source: "https://en.wikipedia.org/wiki/George_V_of_Hanover"
  periods:
    - from: 1648
      to: 1704
      text: ヴェルフ家（ブラウンシュヴァイク＝リューネブルク家）の分家カレンベルク侯領。首都はハノーファー。1692年に9番目の選帝侯位を得る。リューネブルク（ツェレ）の本家とは1705年に統合。
    - from: 1705
      to: 1802
      text: 1714年に選帝侯ゲオルク・ルートヴィヒがイギリス王ジョージ1世となり、イギリスとの同君連合が始まる。1715–1719年にスウェーデン領だったブレーメン＝フェルデンを獲得。1737年にゲッティンゲン大学を開く。
    - from: 1803
      to: 1813
      text: 1803年にフランス軍に占領される。1806年に一時プロイセンが併合した後、南部は1807年にヴェストファーレン王国へ、残りも1810年にヴェストファーレン王国とフランスに分割された。
    - from: 1814
      to: 1815
      text: 王国に昇格。ウィーン会議で東フリースラント・ヒルデスハイム・ゴスラー・リンゲン・メッペンなどを得て、ラウエンブルクを手放す。
    - from: 1816
      to: 1836
      text: イギリス王が国王を兼ね、ハノーファーでは副王（ケンブリッジ公アドルフス）が統治した。1833年に国家基本法（憲法）を定めた。
    - from: 1837
      to: 1866
      text: エルンスト・アウグストの即位でイギリスとの同君連合が終わる。王は憲法を廃止し、抗議したゲッティンゲン大学の7教授を追放した。1866年の普墺戦争でオーストリア側につき、ランゲンザルツァで降伏してプロイセンに併合された。
  note: イギリス王を兼ねた選帝侯はロンドンに住み、ハノーファーは枢密院が統治した。
  source: "https://ja.wikipedia.org/wiki/ハノーファー選帝侯領"

