      text: 小アンティル諸島の先住民（島のカリブ人、カリナゴ）。ヨーロッパ人の入植に強く抵抗し、1660年の英仏との取り決めでドミニカ島とセントビンセント島はカリブ人の島とされた。セントビンセントでは逃亡奴隷と混じり合った「黒いカリブ（ガリフナ）」が力を持ったが、第2次カリブ戦争（1795–96）に敗れて中米のロアタン島に移された。
