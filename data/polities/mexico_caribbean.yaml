    - {name: マヌエル・アマドール・ゲレロ, title: 大統領, from: 1904, to: 1908, note: 初代大統領（1903–04年は臨時政府評議会）, source: "https://en.wikipedia.org/wiki/Manuel_Amador_Guerrero"}
    - {name: アルヌルフォ・アリアス, title: 大統領, from: 1940, to: 1941, note: 主な元首のみ。1949–51年、1968年にも大統領となり、そのたびにクーデタで追われた, source: "https://en.wikipedia.org/wiki/Arnulfo_Arias"}
    - {name: オマール・トリホス, title: 国家警備隊司令官（最高指導者）, from: 1968, to: 1981, note: 1968年のクーデタで実権を握り、1977年にカーター大統領と新パナマ運河条約を結んだ。飛行機事故で死去, source: "https://ja.wikipedia.org/wiki/オマール・トリホス"}
    - {name: マヌエル・ノリエガ, title: 国防軍司令官（実権者）, from: 1983, to: 1989, note: 大統領を次々に立てて実権を握ったが、麻薬密輸で訴追され、1989年のアメリカ軍の侵攻で捕らえられた, source: "https://ja.wikipedia.org/wiki/マヌエル・ノリエガ"}
