    - {name: ケル・ラウヘルド・ガルシア, title: 大統領, from: 1974, to: 1978, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: ロメオ・ルカス・ガルシア, title: 大統領, from: 1978, to: 1982, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: エフライン・リオス・モント, title: 元首（軍事政権）, from: 1982, to: 1983, note: 内戦中の先住民の村々への虐殺の責任を問われ、2013年にジェノサイドの罪で有罪判決を受けた（のち無効とされ再審中に死去）, source: "https://ja.wikipedia.org/wiki/エフライン・リオス・モント"}
    - {name: オスカル・メヒア・ビクトレス, title: 元首（軍事政権）, from: 1983, to: 1986, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: ビニシオ・セレソ, title: 大統領, from: 1986, to: 1991, note: 民政移管, source: "https://en.wikipedia.org/wiki/Vinicio_Cerezo"}
    - {name: ホルヘ・セラーノ・エリアス, title: 大統領, from: 1991, to: 1993, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: ラミロ・デ・レオン・カルピオ, title: 大統領, from: 1993, to: 1996, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
