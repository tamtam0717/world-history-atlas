- id: maya_independent
  name: チャン・サンタ・クルス（マヤ人の国）
  short: チャン・サンタ・クルス
  color: "#ad9fd0"
  kind: マヤ人の自立政権
  periods:
    - from: 1850
      to: 1901
      text: カスタ戦争（1847–1901）で抵抗を続けたマヤ人が、半島東部（今のキンタナ・ロー）に「語る十字架」の信仰を中心とする国家を作った。都はチャン・サンタ・クルス（今のフェリペ・カリーリョ・プエルト）。英領ホンジュラス（ベリーズ）との交易で武器を手に入れ、半世紀にわたりメキシコから自立した。1901年にメキシコ軍が都を占領した。
  note: 範囲は年により変わる。地図では今のキンタナ・ロー州のピースで近似し、certainty は uncertain。
  source: "https://en.wikipedia.org/wiki/Chan_Santa_Cruz"

- id: apache
  name: アパッチ
  short: アパッチ
  color: "#f4bcaf"
  kind: 先住民の諸集団
  periods:
    - from: 1648
      to: 1886
      text: アメリカ南西部（今のアリゾナ・ニューメキシコ・テキサス西部）からメキシコ北部（チワワ・ソノラ）にかけての山地と乾燥地帯（アパチェリア）に住んだ先住民。スペインの北辺の要塞線（プレシディオ）やメキシコの村々を襲撃し、スペイン・メキシコ・アメリカに長く抵抗した。1886年にジェロニモが降伏した。
  note: 地図では、1700年ごろから合衆国側のトランス・ペコス（テキサス西部）・ニューメキシコ南部・アリゾナ南東部（アパチェリア）をこの色で塗る（地域ごとに1843–81年にメキシコ・合衆国の支配に移る。ジェロニモの降伏は1886年）。メキシコの州のピースは大きく、アパッチの勢力圏はその一部でしかないので、メキシコ北部（チワワ・ソノラ・コアウイラ）はスペイン・メキシコの色（植民地期の一部は uncertain）で塗る。
  source: "https://ja.wikipedia.org/wiki/アパッチ族"

