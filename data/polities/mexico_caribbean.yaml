    - {name: マヌエル・リサンドロ・バリリャス, title: 大統領, from: 1885, to: 1892, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: ホセ・マリア・レイナ・バリオス, title: 大統領, from: 1892, to: 1898, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: マヌエル・エストラダ・カブレラ, title: 大統領（独裁）, from: 1898, to: 1920, note: ユナイテッド・フルーツ社に特権を与えた, source: "https://en.wikipedia.org/wiki/Manuel_Estrada_Cabrera"}
    - {name: カルロス・エレラ、ホセ・マリア・オレリャナ、ラサロ・チャコン, title: 大統領, from: 1920, to: 1930, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: ホルヘ・ウビコ, title: 大統領（独裁）, from: 1931, to: 1944, source: "https://en.wikipedia.org/wiki/Jorge_Ubico"}
