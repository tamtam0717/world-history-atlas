  rulers:
    - {name: ジェレミー1世, title: ミスキート王, from: 1655, to: 1687, note: ジャマイカのイギリス人に認められた最初の王とされる, source: "https://en.wikipedia.org/wiki/Mosquito_Coast"}
    - {name: ジョージ・フレデリック・オーガスタス1世, title: ミスキート王, from: 1824, to: 1842, source: "https://en.wikipedia.org/wiki/Mosquito_Coast"}
    - {name: ロバート・チャールズ・フレデリック, title: ミスキート王, from: 1842, to: 1860, note: 1860年のマナグア条約で王国はニカラグアの中の「モスキート保護区」となった, source: "https://en.wikipedia.org/wiki/Mosquito_Coast"}
  periods:
    - from: 1648
      to: 1786
      text: 今のホンジュラス・ニカラグアのカリブ海岸（モスキート海岸）の先住民ミスキート人の王国。ジャマイカのイギリス人と結んで銃を手に入れ、スペインの入植地を襲った。イギリスは1740年に保護下に置き、ブラック・リバーなどに入植地を作った。
    - from: 1787
      to: 1860
      text: 1786年のロンドン協定でイギリス人入植者は引き揚げたが、王国はスペイン・中米諸国の支配を受けずに続いた。1844年にイギリスが保護を再び宣言し、サン・フアン川の河口（グレータウン）まで押さえたため、運河の建設をねらうアメリカとの争点になった（1850年のクレイトン＝ブルワー条約）。
  note: 範囲（海岸部の幅）はあいまいなので certainty は uncertain。1860年以後は、北部（ホンジュラスのグラシアス・ア・ディオス）がホンジュラス領、南部がニカラグアの中の自治区（モスキート保護区、1894年に併合）。
  source: "https://ja.wikipedia.org/wiki/モスキート海岸"

