    - {name: フランシスコ・モラサン, title: 連邦大統領, from: 1830, to: 1839, note: ホンジュラス出身の自由派。教会の特権を削ったが、カレラらの反乱で連邦は崩れた。1842年にコスタリカで処刑された, source: "https://ja.wikipedia.org/wiki/フランシスコ・モラサン"}
  periods:
    - from: 1821
      to: 1823
      text: 1821年9月にグアテマラ総督領が独立を宣言し、翌年イトゥルビデのメキシコ帝国に併合された。帝国が倒れると、チアパスを除く5州が中米連合州として独立した（1823年7月）。
    - from: 1824
      to: 1840
      text: グアテマラ・エルサルバドル・ホンジュラス・ニカラグア・コスタリカの5州の連邦。自由派と保守派の内戦が続き、1838年からニカラグア・ホンジュラス・コスタリカが、1839年にグアテマラが離脱して解体した（エルサルバドルは1841年に独立国となる）。その後も統合の試みは何度もあったが実らなかった。
