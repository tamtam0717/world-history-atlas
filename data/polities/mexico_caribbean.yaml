    - {from: 1961, name: キューバ共和国, short: キューバ, kind: 社会主義国（キューバ共産党の一党制）}
  home_iso: [CUB]
  rulers:
    - {name: トマス・エストラーダ・パルマ, title: 大統領, from: 1902, to: 1906, note: 1906年の反乱でアメリカの再占領を招いた, source: "https://en.wikipedia.org/wiki/Tomás_Estrada_Palma"}
    - {name: チャールズ・マグーン, title: 臨時総督（アメリカ）, from: 1906, to: 1909, source: "https://en.wikipedia.org/wiki/Charles_Edward_Magoon"}
    - {name: ホセ・ミゲル・ゴメス, title: 大統領, from: 1909, to: 1913, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Cuba"}
    - {name: マリオ・ガルシア・メノカル, title: 大統領, from: 1913, to: 1921, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Cuba"}
    - {name: アルフレド・サヤス, title: 大統領, from: 1921, to: 1925, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Cuba"}
    - {name: ヘラルド・マチャード, title: 大統領（独裁）, from: 1925, to: 1933, note: 世界恐慌の中のゼネストと軍の離反で亡命, source: "https://en.wikipedia.org/wiki/Gerardo_Machado"}
    - {name: フルヘンシオ・バティスタ, title: 陸軍参謀総長（実権者）・大統領, from: 1933, to: 1944, note: 1933年の「軍曹の反乱」で実権を握り、傀儡の大統領の背後にいた。1940–44年は大統領, source: "https://ja.wikipedia.org/wiki/フルヘンシオ・バティスタ"}
    - {name: ラモン・グラウ・サン・マルティン, title: 大統領, from: 1944, to: 1948, source: "https://en.wikipedia.org/wiki/Ramón_Grau"}
    - {name: カルロス・プリオ・ソカラス, title: 大統領, from: 1948, to: 1952, source: "https://en.wikipedia.org/wiki/Carlos_Prío_Socarrás"}
    - {name: フルヘンシオ・バティスタ, title: 大統領（独裁）, from: 1952, to: 1958, note: クーデタで政権に戻った。アメリカ資本・マフィアと結んだ。1959年1月1日に亡命, source: "https://ja.wikipedia.org/wiki/フルヘンシオ・バティスタ"}
    - {name: フィデル・カストロ, title: 首相・国家評議会議長・共産党第一書記, from: 1959, to: 2008, note: 1959–76年は首相、1976–2008年は国家評議会議長（元首）, source: "https://ja.wikipedia.org/wiki/フィデル・カストロ"}
    - {name: ラウル・カストロ, title: 国家評議会議長・共産党第一書記, from: 2008, to: 2018, note: フィデルの弟。共産党第一書記は2021年まで, source: "https://ja.wikipedia.org/wiki/ラウル・カストロ"}
    - {name: ミゲル・ディアス＝カネル, title: 国家評議会議長・大統領・共産党第一書記, from: 2018, to: 2025, note: 2019年から大統領、2021年から党第一書記, source: "https://en.wikipedia.org/wiki/Miguel_Díaz-Canel"}
  periods:
    - from: 1902
      to: 1933
      text: 米西戦争の後のアメリカ軍政（1898–1902）を経て独立したが、プラット修正条項でアメリカに干渉の権利とグアンタナモ基地を認めさせられた（事実上の保護国）。1906–09年にはアメリカが再占領した。砂糖産業はアメリカ資本が握った。
    - from: 1934
      to: 1958
      text: 善隣外交のもとでプラット修正条項は廃止された（1934）。バティスタが軍を握り、1952年のクーデタで独裁に戻った。ハバナはアメリカ人の観光・賭博の地となった。
    - from: 1959
      to: 1991
      text: キューバ革命：フィデル・カストロ・ゲバラらのゲリラがバティスタを倒した。アメリカ企業の国有化からアメリカと断交し（1961）、ピッグス湾事件の後に社会主義を宣言してソ連と結んだ。1962年のキューバ危機を経て、ソ連の援助で砂糖を輸出する体制が続き、アンゴラなどアフリカにも派兵した。
    - from: 1992
      to: 2025
      text: ソ連の解体で経済が急に悪化した（「特別な時期」）。観光と外国投資を一部受け入れ、2015年にアメリカと国交を回復したが、経済制裁は続く。2021年に全国で抗議行動が起きた。
  note: 1898–1902年と1906–09年のアメリカ軍政は地図では usa・occupied、1902–33年はプラット修正条項による overlord は usa。
  source: "https://ja.wikipedia.org/wiki/キューバの歴史"

