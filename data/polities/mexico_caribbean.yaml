  rulers:
    - {name: サンティアゴ・メンデス, title: 知事, from: 1841, to: 1841, source: "https://en.wikipedia.org/wiki/Santiago_Méndez_Ibarra"}
    - {name: ミゲル・バルバチャノ, title: 知事, from: 1841, to: 1847, note: メンデスと交代で政権を担った, source: "https://en.wikipedia.org/wiki/Miguel_Barbachano"}
    - {name: サンティアゴ・メンデス, title: 知事, from: 1847, to: 1848, note: カスタ戦争の危機に、スペイン・イギリス・アメリカに助けを求め、主権を差し出すことまで申し出た, source: "https://en.wikipedia.org/wiki/Santiago_Méndez_Ibarra"}
  periods:
    - from: 1841
      to: 1848
      text: メキシコの中央集権体制に反発したユカタン半島（今のユカタン・カンペチェ・キンタナ・ロー）が独立を宣言した（1841–43、1846–48）。1847年にマヤ人のカスタ戦争が始まって追いつめられ、メキシコの援助を受けるため1848年に復帰した。
