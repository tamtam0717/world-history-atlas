    - {name: アドルフォ・ディアス, title: 大統領, from: 1911, to: 1917, note: 保守派。アメリカ海兵隊の駐留を招いた（1912年から）, source: "https://en.wikipedia.org/wiki/Adolfo_Díaz"}
    - {name: アナスタシオ・ソモサ・ガルシア, title: 国家警備隊司令官・大統領, from: 1936, to: 1956, note: 1934年にサンディーノを暗殺させ、1936年のクーデタで実権を握った（1937年から大統領）。1956年に暗殺された, source: "https://ja.wikipedia.org/wiki/アナスタシオ・ソモサ・ガルシア"}
    - {name: ルイス・ソモサ・デバイレ, title: 大統領, from: 1956, to: 1963, source: "https://en.wikipedia.org/wiki/Luis_Somoza_Debayle"}
    - {name: アナスタシオ・ソモサ・デバイレ, title: 国家警備隊司令官・大統領, from: 1963, to: 1979, note: 1963–67年はソモサ家の傀儡の大統領（シック、ゲレロ）の背後で国家警備隊を握った, source: "https://ja.wikipedia.org/wiki/アナスタシオ・ソモサ・デバイレ"}
    - {name: ダニエル・オルテガ, title: 国家再建評議会の議長・大統領, from: 1979, to: 1990, note: サンディニスタ民族解放戦線（FSLN）。1985年から大統領, source: "https://ja.wikipedia.org/wiki/ダニエル・オルテガ"}
    - {name: ビオレタ・チャモロ, title: 大統領, from: 1990, to: 1997, source: "https://en.wikipedia.org/wiki/Violeta_Chamorro"}
    - {name: アルノルド・アレマン, title: 大統領, from: 1997, to: 2002, source: "https://en.wikipedia.org/wiki/Arnoldo_Alemán"}
    - {name: エンリケ・ボラーニョス, title: 大統領, from: 2002, to: 2007, source: "https://en.wikipedia.org/wiki/Enrique_Bolaños"}
    - {name: ダニエル・オルテガ, title: 大統領, from: 2007, to: 2025, note: 再選を重ね、2018年の抗議運動の弾圧以後は権威主義を強めた。妻のロサリオ・ムリーリョが副大統領（2025年から共同大統領）, source: "https://ja.wikipedia.org/wiki/ダニエル・オルテガ"}
  periods:
    - from: 1838
      to: 1909
      text: 中米連邦から離脱。レオン（自由派）とグラナダ（保守派）の争いが続き、1856–57年にはアメリカ人ウォーカーが一時実権を握った。大西洋と太平洋を結ぶ運河の候補地として、英米が強い関心を持った。
    - from: 1910
      to: 1936
      text: アメリカが保守派政権を支え、1912–33年に海兵隊を駐留させた（1925–26年に一時撤退）。1927年からサンディーノが海兵隊とのゲリラ戦を続けた。
    - from: 1936
      to: 1979
      text: ソモサ一族の独裁。国家警備隊を握り、国の富の多くを一族が所有した。1972年のマナグア地震の援助金の横領で反発が強まった。
    - from: 1979
      to: 1990
      text: サンディニスタ革命でソモサ政権が倒れた。アメリカ（レーガン政権）は反政府勢力コントラを支援し、内戦となった（イラン＝コントラ事件）。1990年の選挙でチャモロが勝ち、政権交代した。
    - from: 1990
      to: 2025
      text: 内戦後の復興。2007年にオルテガが政権に戻り、長期政権となった。
  source: "https://ja.wikipedia.org/wiki/ニカラグアの歴史"

- id: costa_rica
  name: コスタリカ共和国
  short: コスタリカ
  color: "#e4abbb"
  kind: 共和国
  home_iso: [CRI]
  rulers:
    - {name: ブラウリオ・カリーリョ, title: 元首, from: 1835, to: 1842, note: 19世紀の主な元首のみ。コーヒー栽培を奨励し、中米連邦からの離脱を進めた, source: "https://en.wikipedia.org/wiki/Braulio_Carrillo_Colina"}
    - {name: フアン・ラファエル・モラ・ポラス, title: 大統領, from: 1849, to: 1859, note: 1856–57年にウォーカーとの戦争を率いた, source: "https://en.wikipedia.org/wiki/Juan_Rafael_Mora_Porras"}
    - {name: トマス・グアルディア, title: 大統領（独裁）, from: 1870, to: 1882, note: カリブ海岸への鉄道を建設させた, source: "https://en.wikipedia.org/wiki/Tomás_Guardia_Gutiérrez"}
    - {name: ホセ・フィゲーレス・フェレール, title: 臨時政府評議会議長, from: 1948, to: 1949, note: 1948年の内戦に勝ち、軍隊を廃止した。のち大統領（1953–58、1970–74）, source: "https://ja.wikipedia.org/wiki/ホセ・フィゲーレス・フェレール"}
    - {name: オスカル・アリアス, title: 大統領, from: 1986, to: 1990, note: 中米和平合意を主導して1987年にノーベル平和賞。2006–10年にも大統領, source: "https://ja.wikipedia.org/wiki/オスカル・アリアス"}
    - {name: ラウラ・チンチージャ, title: 大統領, from: 2010, to: 2014, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Costa_Rica"}
    - {name: ルイス・ギジェルモ・ソリス, title: 大統領, from: 2014, to: 2018, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Costa_Rica"}
    - {name: カルロス・アルバラド, title: 大統領, from: 2018, to: 2022, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Costa_Rica"}
    - {name: ロドリゴ・チャベス, title: 大統領, from: 2022, to: 2025, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Costa_Rica"}
  periods:
    - from: 1838
      to: 1947
      text: 中米連邦から離脱。中部高原（メセタ・セントラル）の自営農によるコーヒー栽培で発展し、中米では比較的安定した。カリブ海岸では鉄道建設とともにバナナ農園が広がった（ユナイテッド・フルーツ社の発祥の地）。
    - from: 1948
      to: 2025
      text: 1948年の内戦の後、新憲法で軍隊を廃止し、教育と福祉に力を入れた。中米の内戦の時代にも民主政治を保ち、アリアス大統領が中米和平を仲介した。
  note: 主な元首のみ。元首は大統領（1838–47年の元首の称号は jefe de estado など）。
  source: "https://ja.wikipedia.org/wiki/コスタリカの歴史"

- id: panama
  name: パナマ共和国
  names:
