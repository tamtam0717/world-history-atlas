  periods:
    - from: 1821
      to: 1835
      text: 独立戦争（1810–21）の末、クリオーリョの軍人イトゥルビデがイグアラ綱領で独立を果たし、皇帝となった。帝政は1年で倒れ、1824年憲法で連邦共和国となった。北はカリフォルニア・テキサスまで及ぶ広い国だったが、北部は人がまばらで、政権は軍人の反乱で何度も替わった。
    - from: 1836
      to: 1848
      text: サンタ・アナらの中央集権体制にテキサスが反発して独立し（1836）、ユカタンも分離した。アメリカ＝メキシコ戦争（1846–48）に敗れ、グアダルーペ・イダルゴ条約で国土の約半分（カリフォルニア・ニューメキシコなど）をアメリカ合衆国に譲った。
    - from: 1849
      to: 1867
      text: ユカタンでマヤ人のカスタ戦争が続く。自由主義者フアレスらのレフォルマ（教会財産の解体、1857年憲法）に保守派が反発して内戦（レフォルマ戦争、1858–61）となった。ついでナポレオン3世のフランス軍が侵入してマクシミリアンの帝国を立てたが、フアレスの共和派が抵抗を続け、1867年に帝国は滅びた。
    - from: 1868
      to: 1910
      text: フアレス・レルドの共和政を経て、ディアスが35年近く独裁した（ポルフィリアート）。外国資本による鉄道・鉱山・石油の開発で経済は伸びたが、農村の共有地が大農園（アシエンダ）に奪われ、不満が積もった。
    - from: 1911
      to: 1934
      text: メキシコ革命：マデロがディアスを倒した後、ウエルタの反革命、サパタ・ビリャ・カランサらの争いが続いた。1917年憲法で地下資源の国有・農地改革・労働者の権利を定めた。1929年にカリェスが国民革命党（のちの制度的革命党 PRI）を作り、軍人の争いを党の中にまとめた。
    - from: 1934
      to: 1982
      text: カルデナスが農地改革と石油の国有化（1938）を進めた。その後、制度的革命党（PRI）の一党優位のもとで工業化が進み、「メキシコの奇跡」と呼ばれる成長が続いた。1968年のトラテロルコ事件など、強権的な面もあった。
    - from: 1982
      to: 2025
      text: 1982年の債務危機の後、市場開放に転じ、1994年に北米自由貿易協定（NAFTA）が発効した（同じ日にチアパスでサパティスタが蜂起）。2000年に PRI の政権が終わって政権交代が定着した。麻薬組織との抗争が深刻になった。
  note: 1836年からのテキサス、1848年の割譲地（カリフォルニア・ニューメキシコなど）は A1（アメリカ合衆国の担当）のデータ。
  source: "https://ja.wikipedia.org/wiki/メキシコの歴史"

- id: second_mexican_empire
  name: メキシコ帝国（第二帝政）
  names:
    - {to: 1863, name: メキシコ帝国（摂政政府）, short: メキシコ帝国, kind: 帝国（フランスの干渉で成立）}
  short: メキシコ帝国
  color: "#e1a570"
  kind: 帝国（フランスの干渉で成立）
  rulers:
    - {name: フアン・アルモンテら（摂政団）, title: 摂政, from: 1863, to: 1864, source: "https://en.wikipedia.org/wiki/Juan_Almonte"}
    - {name: マクシミリアン, title: メキシコ皇帝, from: 1864, to: 1867, note: オーストリア皇帝フランツ・ヨーゼフ1世の弟。フランス軍の撤退後、ケレタロで共和派に捕らえられ処刑された, source: "https://ja.wikipedia.org/wiki/マクシミリアン_(メキシコ皇帝)"}
  periods:
    - from: 1863
      to: 1867
      text: フランス軍がメキシコ市を占領し、保守派がハプスブルク家のマクシミリアンを皇帝に迎えた。フアレスの共和派は北部（パソ・デル・ノルテ）や南部の山地で抵抗を続けた。アメリカの南北戦争が終わると、アメリカの圧力とプロイセンの台頭でフランス軍は撤退し（1866–67）、帝国は崩れた。
  note: 地図では、帝国の支配が及んだ州を年末の状況でこの色に塗り、1863–66年はフランスの帯（overlord は france）を付ける。支配のあいまいな州は uncertain。
  source: "https://ja.wikipedia.org/wiki/メキシコ第二帝政"

