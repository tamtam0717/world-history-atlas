      text: ハイチ革命の末、世界で最初の黒人の共和国として独立した（ラテンアメリカで最初の独立国）。デサリーヌの暗殺の後、北部のクリストフの国（1811年から王国）と南部のペシオンの共和国に分かれた。
    - from: 1820
      to: 1843
      text: ボワイエが島全体を統一した（東部の併合は1822–44年）。1825年にフランスに巨額の「賠償金」を約束して独立を認めさせ、その支払いが長く経済を苦しめた。
    - from: 1844
      to: 1914
      text: 東部がドミニカ共和国として独立した。スールークの帝政（1849–59）の後も政変が繰り返され、外国（ドイツ・アメリカ・フランス）の商人と軍艦が圧力をかけた。
    - from: 1915
      to: 1934
      text: 大統領の殺害を機にアメリカ海兵隊が上陸し、19年間占領した。道路などを整えたが、強制労働への反乱（カコの反乱）を鎮圧した。
    - from: 1957
      to: 1986
      text: デュヴァリエ父子の独裁（トントン・マクートによる恐怖政治）。多くの人が国外に逃れた。
    - from: 1986
      to: 2025
      text: 独裁の終わりの後もクーデタと政情不安が続いた。2010年の大地震で20万人以上が死亡した。2021年の大統領暗殺の後、武装集団（ギャング）が首都を支配するようになり、国連が多国籍の治安支援を認めた。
  source: "https://ja.wikipedia.org/wiki/ハイチの歴史"

