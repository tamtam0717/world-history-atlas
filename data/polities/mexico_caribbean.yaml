    - {name: ナジブ・ブケレ, title: 大統領, from: 2019, to: 2025, note: ギャング組織の大量拘束で治安を回復したとして支持を集める一方、人権侵害や権力の集中が批判されている, source: "https://ja.wikipedia.org/wiki/ナジブ・ブケレ"}
