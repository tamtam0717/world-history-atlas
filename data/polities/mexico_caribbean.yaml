    - {name: アルフォンソ・ポルティーリョ, title: 大統領, from: 2000, to: 2004, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: オスカル・ベルヘル, title: 大統領, from: 2004, to: 2008, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: アルバロ・コロン, title: 大統領, from: 2008, to: 2012, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: オットー・ペレス・モリーナ, title: 大統領, from: 2012, to: 2015, note: 汚職事件で辞任, source: "https://en.wikipedia.org/wiki/Otto_Pérez_Molina"}
    - {name: アレハンドロ・マルドナド, title: 大統領（暫定）, from: 2015, to: 2016, source: "https://en.wikipedia.org/wiki/List_of_heads_of_state_of_Guatemala"}
    - {name: ジミー・モラレス, title: 大統領, from: 2016, to: 2020, source: "https://en.wikipedia.org/wiki/Jimmy_Morales"}
