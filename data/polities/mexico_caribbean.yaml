    - {name: ミレヤ・モスコソ, title: 大統領, from: 1999, to: 2004, note: 1999年12月31日に運河の返還を受けた, source: "https://en.wikipedia.org/wiki/Mireya_Moscoso"}
    - {name: マルティン・トリホス, title: 大統領, from: 2004, to: 2009, note: 運河の拡張（2016年に完成）を決めた, source: "https://en.wikipedia.org/wiki/Martín_Torrijos"}
    - {name: リカルド・マルティネリ, title: 大統領, from: 2009, to: 2014, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Panama"}
    - {name: フアン・カルロス・バレーラ, title: 大統領, from: 2014, to: 2019, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Panama"}
    - {name: ラウレンティーノ・コルティソ, title: 大統領, from: 2019, to: 2024, source: "https://en.wikipedia.org/wiki/List_of_presidents_of_Panama"}
    - {name: ホセ・ラウル・ムリーノ, title: 大統領, from: 2024, to: 2025, source: "https://en.wikipedia.org/wiki/José_Raúl_Mulino"}
  periods:
    - from: 1903
      to: 1938
      text: 運河の建設をねらうアメリカ（セオドア・ローズヴェルト）の支援でコロンビアから独立し、運河地帯を永久に租借させた。アメリカは憲法で干渉の権利を持ち、事実上の保護国だった。1914年にパナマ運河が開通した。
    - from: 1939
      to: 1977
      text: 1936年の条約（1939年批准）で干渉権はなくなったが、運河地帯の主権をめぐる対立が続いた（1964年の国旗事件）。1968年からトリホスの軍事政権。
    - from: 1978
      to: 2025
      text: 1977年の新パナマ運河条約で、1979年に運河地帯が廃止され、1999年末に運河が返還された。1989年にアメリカ軍が侵攻してノリエガ政権を倒した。
  note: 1821–1903 年のパナマは大コロンビア（gran_colombia）・コロンビア（colombia）の一部（A4 の政体）。1840–41年のイスモ自由国はこの ID の names で表す。主な元首のみ。
  source: "https://ja.wikipedia.org/wiki/パナマの歴史"

