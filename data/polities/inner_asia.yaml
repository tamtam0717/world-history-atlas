# 内陸アジア（モンゴル・内モンゴル・新疆・チベット・青海、シベリア南部・極東の一部）の政体。担当 G2。
# 清（qing）・中華民国（roc）・中華人民共和国（prc）・満洲国（manchukuo）は G1、日本（japan）は G3、
# ロシア（russia）・ソ連（soviet_union）・白軍（white_movement）・極東共和国（far_eastern_republic）・トゥヴァ（tuva）は north_east.yaml で定義。

# ---------------------------------------------------------------- モンゴル高原
- id: khalkha
  name: ハルハ（外モンゴル）
  short: ハルハ
  color: "#b9cfa0"
  kind: 遊牧諸侯の連合（3ハン家）
  rulers:
    - {name: ゲレセンジェの子ら（ハルハ諸侯）, title: ハルハ7旗の諸侯, from: 1550, to: 1579, note: ダヤン＝ハンの末子ゲレセンジェ（1549年ごろ没）の7人の子がハルハ部を分けて治め、全体をまとめる君主はいなかった。アブタイの父ノーノホ・ウイジェンは左翼の有力者。在位年は要確認, source: "https://en.wikipedia.org/wiki/Abtai_Sain_Khan"}
    - {name: アブタイ・サイン・ハン, title: ハルハ左翼の首長（トゥシェート・ハン家の祖）, from: 1580, to: 1588, note: ゲレセンジェ（ダヤン＝ハンの末子）の孫で、1554–1588年の人。1580年ごろから左翼の首長として頭角を現し、1586年ごろダライ・ラマ3世から「ハン」の称号を受け、エルデネ・ゾー寺を建てた。在位の始まりの年は要確認, source: "https://en.wikipedia.org/wiki/Abtai_Sain_Khan"}
    - {name: エリイェヘイ・メルゲン・ハン, title: ハルハ左翼の首長, from: 1588, to: 1635, note: アブタイの子。在位の終わりの年は不明（要確認）。子のゴンボドルジ（1594年生まれ）が1620年代にはすでにトゥシェート・ハン家の当主として動いていたとされ、ここで書いた1635年までの在位は長すぎる可能性が高い（1610年代〜1620年代に代替わりか）。北西部ではホトゴイト部のショロイ・ウバシ（アルタン・ハン、–1623）がオイラトと争った, source: "https://en.wikipedia.org/wiki/Tüsheet_Khan"}
    - {name: ゴンボドルジ, title: トゥシェート・ハン, from: 1636, to: 1655, note: 1594年生まれ。即位年は要確認（1620年代とも）, source: "https://en.wikipedia.org/wiki/Tüsheet_Khan"}
    - {name: チャホンドルジ, title: トゥシェート・ハン, from: 1655, to: 1691, note: 1691年のドローン・ノール会盟で清に服属した。弟がジェブツンダンバ・ホトクト1世（ザナバザル）, source: "https://en.wikipedia.org/wiki/Chakhundorj"}
  periods:
    - from: 1550
      to: 1647
      text: ダヤン＝ハンの末子ゲレセンジェの子孫がハルハ部を分けて治め、外モンゴルはしだいにハーン家（チャハル）から自立した。アブタイ・ハンはチベット仏教（ゲルク派）を受け入れ、エルデネ・ゾー寺を建てた（1585）。1630年代にはハルハのチョクト・ホンタイジが青海に移ったが、ホシュートのグシ・ハンに敗れた（1637）。
    - from: 1648
      to: 1687
      text: チンギス・ハンの子孫が率いるハルハ部が、トゥシェート・ハン、ジャサクト・ハン、セチェン・ハンの3ハン家に分かれてモンゴル高原の北部（外モンゴル）を治めた。チベット仏教が広まり、ジェブツンダンバ・ホトクト（ザナバザル）が宗教上の権威となった。
    - from: 1688
      to: 1691
      text: 1688年、ジュンガルのガルダンが侵入し、ハルハの諸侯は南の内モンゴルへ逃れて清の康熙帝に保護を求めた。1691年のドローン・ノール会盟で清に服属し、以後は清の藩部（外モンゴル）となった。
  note: 北西部（フブスグル・トゥヴァ方面）には、トゥシェート・ハン家から分かれたアルタン・ハン（ホトゴイト部）がいて、エニセイ川上流のキルギス人などを従えていた（1667年ごろジュンガルに滅ぼされる）。
  source:
    - "https://ja.wikipedia.org/wiki/ハルハ"
    - "https://ja.wikipedia.org/wiki/ドロンノール会盟"

- id: dzungar
  name: ジュンガル
  names:
    - {to: 1634, name: オイラト, short: オイラト, kind: 遊牧部族連合（西モンゴル）}
  short: ジュンガル
  color: "#9fb3d0"
  kind: 遊牧国家（オイラト）
  rulers:
    - {name: エセン（エセン＝ハン）, title: 太師→ハン（1453）, from: 1439, to: 1454, note: チョロス部の出身（のちのジュンガルの君主の祖先）。1449年の土木の変で明の正統帝を捕らえた。1453年にハンを名のったが、1454年に部下に殺された, source: "https://ja.wikipedia.org/wiki/エセン"}
    - {name: ハラ・フラ, title: チョロス（ジュンガル）部の首長, from: 1600, to: 1634, note: エルデニ・バートルの父。エセンの死後のオイラトは部族ごとに分かれ、1455–1600年ごろの盟主ははっきりしない。在位年は要確認, source: "https://en.wikipedia.org/wiki/Khara_Khula"}
    - {name: エルデニ・バートル・ホンタイジ, title: ホンタイジ, from: 1634, to: 1653, source: "https://en.wikipedia.org/wiki/Erdeni_Batur"}
    - {name: センゲ, title: ホンタイジ, from: 1653, to: 1670, note: 1670年に異母兄弟に殺される, source: "https://en.wikipedia.org/wiki/Sengge"}
    - {name: ガルダン, title: ホンタイジ→ボショクト・ハン（1679〜）, from: 1671, to: 1697, note: 1697年に死去（病死とも服毒とも）, source: "https://ja.wikipedia.org/wiki/ガルダン"}
    - {name: ツェワン・アラブタン, title: ホンタイジ, from: 1697, to: 1727, source: "https://ja.wikipedia.org/wiki/ツェワンラブタン"}
    - {name: ガルダン・ツェリン, title: ホンタイジ, from: 1727, to: 1745, source: "https://en.wikipedia.org/wiki/Galdan_Tseren"}
    - {name: ツェワン・ドルジ・ナムジャル, title: ホンタイジ, from: 1746, to: 1750, source: "https://en.wikipedia.org/wiki/Tsewang_Dorji_Namjal"}
    - {name: ラマ・ドルジ, title: ホンタイジ, from: 1750, to: 1753, source: "https://en.wikipedia.org/wiki/Lama_Dorji"}
    - {name: ダワチ, title: ホンタイジ, from: 1753, to: 1755, note: 1755年に清軍に捕らえられる。その後アムルサナが清に背いて自立を図った（1755–1757）, source: "https://en.wikipedia.org/wiki/Dawachi"}
  periods:
    - from: 1453
      to: 1454
      text: オイラトのエセンは土木の変（1449）で明の正統帝を捕らえ、1452年にモンゴルのハーンを倒して、1453年に自らハンを名のった。チンギス・カンの子孫でない者のハン即位は反発を招き、翌年エセンは殺された。
    - from: 1455
      to: 1634
      text: エセンの死後、オイラトはチョロス（ジュンガル）・ドルベト・ホシュート・トルグートなどの部族に分かれ、東モンゴル（ダヤン＝ハン、アルタン＝ハン、ハルハ）に押されて西へ移った。17世紀初めにはジュンガル盆地とイルティシ川流域が中心となり、トルグート部はヴォルガ川へ（1630ごろ）、ホシュート部は青海へ（1636–37）移った。1634年にエルデニ・バートルがジュンガル部を継ぎ、ジュンガルが盟主となる。
    - from: 1635
      to: 1647
      text: エルデニ・バートル・ホンタイジがイリ地方を本拠にジュンガルの国家を固め、1640年にはハルハとオイラトの諸侯を集めてモンゴル・オイラト法典を定めた。
    - from: 1648
      to: 1679
      text: 西モンゴルのオイラト諸部のうち、ジュンガル部がイリ地方を本拠に勢力を広げた。エルデニ・バートルは法典（モンゴル・オイラト法典、1640）の制定を主導し、チベット仏教（ゲルク派）を保護した。
    - from: 1680
      to: 1697
      text: ガルダンがタリム盆地のヤルカンド・ハン国を滅ぼしてオアシス都市を支配下に置き（1680）、1688年には東のハルハに侵入した。清の康熙帝は自ら軍を率いてガルダンを破り（1690 ウラーン・ブトゥン、1696 ジョーン・モド）、ガルダンは翌年に死んだ。
    - from: 1698
      to: 1745
      text: ツェワン・アラブタンとガルダン・ツェリンのもとで、ジュンガルはなお中央アジア最大の遊牧国家だった。1717年にはチベットに侵入してラサを占領し、カザフ草原にも攻め込んだ（カザフの「大災厄」）。清とはアルタイ山脈を境に戦い（1731 ホトン・ノールの戦い）、1739年に講和した。
    - from: 1746
      to: 1757
      text: ガルダン・ツェリンの死後に後継争いが起こり、清の乾隆帝はこれに乗じて1755年にイリを占領した。協力者だったアムルサナが背くと再び軍を送り（1757）、反乱の鎮圧と天然痘の流行でジュンガルの人々の多くが死に、国は滅んだ。
  note: >-
    オイラト（西モンゴル）はジュンガル・ドルベト・ホシュート・トルグートなどの部族連合で、ジュンガル部がその盟主となった。
    トルグート部は17世紀前半にヴォルガ川下流へ移り（カルムイク）、1771年にその一部が清領のイリへ戻った。
    地図では、ジュンガルの直接の支配地（ジュンガル盆地・イリ・西モンゴル・アルタイ）と、ホージャ家を通じて治めたタリム盆地（1680–1755、間接統治）を描く。
  source:
    - "https://ja.wikipedia.org/wiki/ジュンガル"
    - "https://en.wikipedia.org/wiki/Dzungar_Khanate"

- id: mongolia
  name: モンゴル国
  names:
    - {to: 1923, name: ボグド・ハーン政権（モンゴル国）, short: モンゴル, kind: 君主国（活仏を君主とする）}
    - {from: 1924, to: 1991, name: モンゴル人民共和国, short: モンゴル, kind: 人民共和国（社会主義・ソ連の衛星国）}
    - {from: 1992, name: モンゴル国, short: モンゴル, kind: 共和国}
  short: モンゴル
  color: "#8fc1a9"
  kind: 共和国
  rulers:
    - {name: ボグド・ハーン（ジェブツンダンバ・ホトクト8世）, title: ハーン（皇帝）, from: 1911, to: 1924, note: 1919–1921年は中華民国が自治を取り消した。1921年の人民革命の後は権限を制限された君主。1924年5月に死去, source: "https://ja.wikipedia.org/wiki/ボグド・ハーン"}
    - {name: ダムディン・スフバートル, title: 人民政府の軍事相（革命の指導者）, from: 1921, to: 1923, note: 首相はボドー（1921–1922）、ダムディンバザル（1922–1923）, source: "https://ja.wikipedia.org/wiki/ダムディン・スフバートル"}
    - {name: バリンギーン・ツェレンドルジ, title: 首相, from: 1923, to: 1928, source: "https://en.wikipedia.org/wiki/Balingiin_Tserendorj"}
    - {name: アナンディン・アマル, title: 首相, from: 1928, to: 1930, note: 1936–1939年にも首相, source: "https://en.wikipedia.org/wiki/Anandyn_Amar"}
    - {name: ツェンゲルティン・ジグジッドジャブ, title: 首相, from: 1930, to: 1932, note: 要確認, source: "https://en.wikipedia.org/wiki/Tsengeltiin_Jigjidjav"}
    - {name: ペルジディン・ゲンデン, title: 首相, from: 1932, to: 1936, note: 1936年に解任され、1937年にソ連で処刑された, source: "https://en.wikipedia.org/wiki/Peljidiin_Genden"}
    - {name: ホルローギーン・チョイバルサン, title: 内相・元帥→首相（1939〜）, from: 1936, to: 1952, note: 1936年から実権を握り、1937–1939年の大粛清を進めた（1936–1939年の首相はアマル）, source: "https://ja.wikipedia.org/wiki/ホルローギーン・チョイバルサン"}
    - {name: ユムジャーギーン・ツェデンバル, title: 首相→人民大会議幹部会議長（1974〜）・人民革命党書記長, from: 1952, to: 1984, source: "https://ja.wikipedia.org/wiki/ユムジャーギーン・ツェデンバル"}
    - {name: ジャムビン・バトムンフ, title: 人民大会議幹部会議長・人民革命党書記長, from: 1984, to: 1990, source: "https://en.wikipedia.org/wiki/Jambyn_Batmönkh"}
    - {name: プンサルマーギーン・オチルバト, title: 大統領, from: 1990, to: 1997, source: "https://ja.wikipedia.org/wiki/プンサルマーギーン・オチルバト"}
    - {name: ナツァギーン・バガバンディ, title: 大統領, from: 1997, to: 2005, source: "https://ja.wikipedia.org/wiki/ナツァギーン・バガバンディ"}
    - {name: ナンバリーン・エンフバヤル, title: 大統領, from: 2005, to: 2009, source: "https://ja.wikipedia.org/wiki/ナンバリーン・エンフバヤル"}
    - {name: ツァヒアギーン・エルベグドルジ, title: 大統領, from: 2009, to: 2017, source: "https://ja.wikipedia.org/wiki/ツァヒアギーン・エルベグドルジ"}
    - {name: ハルトマーギーン・バトトルガ, title: 大統領, from: 2017, to: 2021, source: "https://ja.wikipedia.org/wiki/ハルトマーギーン・バトトルガ"}
    - {name: ウフナーギーン・フレルスフ, title: 大統領, from: 2021, to: 2025, source: "https://ja.wikipedia.org/wiki/ウフナーギーン・フレルスフ"}
  periods:
    - from: 1911
      to: 1920
      text: 辛亥革命で清の支配が崩れると、1911年12月にハルハの諸侯が活仏ジェブツンダンバ・ホトクト8世をボグド・ハーン（皇帝）に推して独立を宣言した。1915年のキャフタ協定で、中華民国の宗主権のもとの自治にとどめられ、1919年には中国軍（徐樹錚）が自治を取り消した。
    - from: 1921
      to: 1944
      text: 1921年、スフバートルらのモンゴル人民党がソヴィエト赤軍とともに中国軍とウンゲルンの白軍を追い、人民政府を立てた（モンゴル人民革命）。1924年にボグド・ハーンが死ぬとモンゴル人民共和国となり、ソ連にならって牧畜の集団化や仏教寺院の破壊が進められ、1937–1939年の大粛清で多くの僧侶や政治家が殺された。1939年にはノモンハン（ハルハ河）で日本・満洲国軍とソ連・モンゴル軍が戦った。独ソ戦の間は家畜や毛皮でソ連を支えた。
    - from: 1945
      to: 1989
      text: 1945年のヤルタ協定と住民投票（10月）を経て、1946年に中華民国が独立を承認した。チョイバルサン、ツェデンバルの長い指導のもとでソ連の衛星国として社会主義化と定住化・都市化が進み、1961年に国際連合に加盟した。中ソ対立ではソ連の側に立った。
    - from: 1990
      to: 2025
      text: 1990年の民主化運動で一党独裁が終わり、1992年の新憲法で国名をモンゴル国とした。市場経済に移り、鉱物資源（石炭・銅）の輸出が経済を支えている。
  note: 1924–1991年の指導者は、実権を持った首相・党書記長を書いた。中華民国は1946年まで独立を認めず、台湾の中華民国政府が独立承認を事実上認めたのは2002年。
  source:
    - "https://ja.wikipedia.org/wiki/モンゴル国"
    - "https://ja.wikipedia.org/wiki/モンゴル人民共和国"
    - "https://ja.wikipedia.org/wiki/ボグド・ハーン政権"

- id: mengjiang
  name: 蒙疆政権（蒙古聯合自治政府）
  names:
    - {to: 1936, name: 蒙古軍政府, short: 蒙古軍政府, kind: 軍政府（日本の傀儡政権）}
    - {from: 1937, to: 1938, name: 蒙古聯盟自治政府（蒙疆）, short: 蒙疆, kind: 自治政府（日本の傀儡政権）}
    - {from: 1939, name: 蒙古聯合自治政府（蒙疆）, short: 蒙疆, kind: 自治政府（日本の傀儡政権）}
  short: 蒙疆
  color: "#c9b3d9"
  kind: 自治政府（日本の傀儡政権）
  rulers:
    - {name: 徳王（デムチュクドンロブ）, title: 総裁→主席, from: 1936, to: 1945, source: "https://ja.wikipedia.org/wiki/徳王"}
  periods:
    - from: 1936
      to: 1945
      text: 内モンゴルの自治をめざした徳王は、関東軍の後押しで1936年に蒙古軍政府を作った。日中戦争が始まると日本軍はチャハル・綏遠・山西北部を占領し（1937）、張家口を首都とする蒙疆の政権がまとめられた（1939年に蒙古聯合自治政府）。実権は日本の軍人・顧問が握り、1945年8月のソ連・モンゴル軍の進攻で崩れた。
  note: 地図では overlord を japan（日本）にする。張家口（チャハル南部）・大同（山西北部）など長城の南の部分は G1（中国本土）の担当のピース。
  source:
    - "https://ja.wikipedia.org/wiki/蒙古聯合自治政府"

- id: inner_mongolia_ag
  name: 内モンゴル自治政府
  names:
    - {to: 1946, name: 東モンゴル自治政府, short: 東モンゴル, kind: 自治政府}
  short: 内モンゴル
  color: "#e6c88a"
  kind: 自治政府（中国共産党の指導下）
  rulers:
    - {name: ウランフー（雲沢）, title: 主席, from: 1947, to: 1949, note: 1949年以後も内モンゴル自治区の主席・党書記（1966年の文化大革命で失脚）。1946年の東モンゴル自治政府の主席はボヤンマンダフ, source: "https://ja.wikipedia.org/wiki/ウランフ"}
  periods:
    - from: 1946
      to: 1949
      text: 日本の敗戦後、内モンゴル東部の満洲国の旧興安省などでモンゴル人がモンゴル人民共和国との合併や自治を求めた（1946年1月 東モンゴル自治政府）。中国共産党はウランフーを中心にこれをまとめ、1947年5月に王爺廟（ウランホト）で内モンゴル自治政府を作った。国共内戦では共産党の側に立ち、1949年に中華人民共和国の内モンゴル自治区となった。
  note: 中華人民共和国の成立（1949）より前の、中国で最初の省級の民族自治政府。地図では1946–1948年の内モンゴル東部を不確実（斜線）で描き、中国共産党の指導下にあったことを中国共産党（chinese_soviet）の帯（overlord）で示す。熱河の赤峰（ジョーウダ盟）は共産党の熱河省の機関が治めたので chinese_soviet で描く
  source:
    - "https://ja.wikipedia.org/wiki/内モンゴル自治政府"
    - "https://en.wikipedia.org/wiki/Inner_Mongolian_Autonomous_Government"

