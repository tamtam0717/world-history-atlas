  kind: ハン国（チャガタイ家）
  rulers:
    - {name: スルターン・サイード・ハン, title: ハン, from: 1514, to: 1533, note: モグーリスタンのハン家の出身。ドゥグラト部のミールザー・アブー・バクルを追ってヤルカンドを都とした。1532–33年にラダック・チベット西部へ遠征し、帰路に死去, source: "https://en.wikipedia.org/wiki/Sultan_Said_Khan"}
    - {name: アブドゥッラシード・ハン, title: ハン, from: 1533, to: 1560, note: 遠征を率いたドゥグラト部のミールザー・ハイダル（『ラシード史』の著者）は追われてカシミールへ去った, source: "https://en.wikipedia.org/wiki/Abdurashid_Khan"}
    - {name: アブドゥルカリーム・ハン, title: ハン, from: 1560, to: 1591, note: この時代にマフドゥーム・アーザムの子孫のホージャ家（のちの黒山党・白山党）が勢力を伸ばした。在位年は要確認, source: "https://en.wikipedia.org/wiki/Yarkent_Khanate"}
    - {name: ムハンマド・スルターン, title: ハン, from: 1591, to: 1610, note: 1603年、ポルトガル人のイエズス会士ベント・デ・ゴイスがヤルカンドを訪れた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Yarkent_Khanate"}
    - {name: シュジャー・ウッディーン・アフマド・ハン, title: ハン, from: 1610, to: 1618, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Yarkent_Khanate"}
    - {name: アブドゥッラティーフ・ハン（アファク・ハン）, title: ハン, from: 1618, to: 1630, note: 1618年には短くクライシュ・スルターンが立った。在位年は要確認, source: "https://en.wikipedia.org/wiki/Yarkent_Khanate"}
    - {name: スルターン・アフマド・ハン（プーラード・ハン）, title: ハン, from: 1630, to: 1638, note: 1633–1636年はマフムード・スルターン（クリチ・ハン）に位を奪われていた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Yarkent_Khanate"}
    - {name: アブドゥッラー・ハン, title: ハン, from: 1638, to: 1667, note: 1667年ごろ子のユルバルスとの争いに敗れて退位し、インドへ去ったとされる（年は要確認）, source: "https://en.wikipedia.org/wiki/Abdullah_Khan_(Yarkent)"}
    - {name: ユルバルス・ハン, title: ハン, from: 1667, to: 1669, note: ジュンガルの支援で立ったが、1670年ごろ殺された（年は要確認）, source: "https://en.wikipedia.org/wiki/Yarkent_Khanate"}
    - {name: イスマーイール・ハン, title: ハン, from: 1670, to: 1678, note: ガルダンに捕らえられた（年は1678–1680と諸説）。その後、ジュンガルはホージャ家（白山党のアーファーク・ホージャ）を通じてタリム盆地を治めた, source: "https://en.wikipedia.org/wiki/Yarkent_Khanate"}
  periods:
    - from: 1514
      to: 1569
      text: モグーリスタンのハン家のスルターン・サイードが、カシュガルを治めていたドゥグラト部のアブー・バクルを追い、ヤルカンドを都にタリム盆地西部のオアシス都市を治めた。東のトルファン・クチャはマンスール・ハンの家系（モグーリスタン）が治めた。
    - from: 1570
      to: 1647
      text: トルファン・ハミも一族の支配に入り、タリム盆地の全体がチャガタイ家のハンのもとにまとまった。一方、中央アジアから来たナクシュバンディー教団のホージャ家が信者を集め、のちに黒山党（イスハーク派）と白山党（アーファーク派）に分かれてハンの継承にまで関わるようになった。
    - from: 1648
      to: 1679
      text: チャガタイ・ハン家の子孫がヤルカンドを都にタリム盆地のオアシス都市（カシュガル・ヤルカンド・ホータン・アクス）を治めた。イスラーム神秘主義の教団の指導者ホージャ家が白山党・黒山党に分かれて争い、ハンの権威は弱まっていた。
  note: トルファン・ハミにもチャガタイ家の分家の王家があり（トルファン・ハン国）、地図ではまとめてヤルカンド・ハン国として描く。1680年ごろジュンガルに征服された。1514–1569年のトルファン・ハミ・クチャ（マンスール・ハンとその子孫）はモグーリスタン（moghulistan）として描く。トルファンがいつヤルカンドのハン家の一族の支配に入ったかは、地図では1570年とした（要確認）。
  source:
    - "https://ja.wikipedia.org/wiki/ヤルカンド・ハン国"
    - "https://en.wikipedia.org/wiki/Yarkent_Khanate"

- id: kashgaria
  name: ヤークーブ・ベク政権（カシュガリア）
  short: ヤークーブ・ベク政権
  color: "#d6a9c0"
  kind: 王国（アミール国）
  rulers:
    - {name: ヤークーブ・ベク, title: アミール（バダウレト）, from: 1865, to: 1877, note: 1877年5月にコルラで急死, source: "https://ja.wikipedia.org/wiki/ヤクブ・ベク"}
  periods:
    - from: 1865
      to: 1877
      text: 1864年に新疆の回民（ドンガン）・ウイグル人が清に反乱を起こすと、コーカンド・ハン国の軍人ヤークーブ・ベクがカシュガルに入り、タリム盆地からトルファン・ウルムチまでを支配した。イギリス・ロシアと条約を結び、オスマン帝国の宗主権を認めて援助を受けた。1876–1877年に左宗棠の清軍に敗れ、国は滅んだ。
  note: オスマン帝国の宗主権（1873–1874年に承認）は名目的なので、地図では overlord を付けない。
  source:
    - "https://ja.wikipedia.org/wiki/ヤクブ・ベク"
    - "https://en.wikipedia.org/wiki/Yettishar"

- id: east_turkestan_islamic
  name: 東トルキスタン・イスラーム共和国
  short: 東トルキスタン
  color: "#a9c9df"
  kind: 共和国（未承認）
  rulers:
    - {name: ホージャ・ニヤーズ, title: 大統領, from: 1933, to: 1934, source: "https://en.wikipedia.org/wiki/Khoja_Niyaz"}
  periods:
    - from: 1933
      to: 1934
      text: 新疆省の主席金樹仁の圧政に対して、ハミから始まったウイグル人・回民の反乱が広がり、1933年11月にカシュガルで東トルキスタン・イスラーム共和国が建てられた。1934年、馬仲英の回民軍に追われ、ソ連の支援を受けた盛世才が新疆を押さえた。
  note: 首相はサービト・ダーモッラー。ホータンのアミールたちの政権を含めて描く。
  source:
    - "https://ja.wikipedia.org/wiki/東トルキスタン・イスラム共和国"

- id: east_turkestan
  name: 東トルキスタン共和国
  short: 東トルキスタン
  color: "#9fc4dc"
  kind: 共和国（未承認。ソ連の支援を受けた）
  rulers:
    - {name: アリハン・トレ, title: 主席, from: 1944, to: 1946, note: 1946年にソ連に連れ去られた, source: "https://en.wikipedia.org/wiki/Elihan_Töre"}
    - {name: アフメトジャン・カスィミ, title: 指導者（新疆省連合政府の副主席）, from: 1946, to: 1949, note: 1949年8月、北京へ向かう途中に飛行機事故で死去, source: "https://en.wikipedia.org/wiki/Ehmetjan_Qasim"}
  periods:
    - from: 1944
      to: 1949
      text: 1944年11月、イリ地方でウイグル人・カザフ人などがソ連の後押しを受けて蜂起し、グルジャ（伊寧）で東トルキスタン共和国を建てた。1946年に国民政府と和議を結んで新疆省連合政府に加わったが、イリ・タルバガタイ・アルタイの「三区」は事実上の独立を保ち、1949年に中国共産党に合流した。
  note: 1946年以降は「三区革命政府」とも呼ばれる。
  source:
    - "https://ja.wikipedia.org/wiki/東トルキスタン共和国_(1944年-1949年)"

# ---------------------------------------------------------------- チベット・青海
- id: khoshut
  name: ホシュート（グシ・ハン王家）
  short: ホシュート
  color: "#c9abc6"
  kind: 遊牧国家（オイラト）
  rulers:
    - {name: グシ・ハン, title: ホシュート部の首長→青海のハン（1637）→チベット王（1642）, from: 1630, to: 1655, note: ホシュート部の首長となった年は要確認, source: "https://ja.wikipedia.org/wiki/グシ・ハン"}
    - {name: ダヤン・ハン, title: ハン（チベット王）, from: 1658, to: 1668, source: "https://en.wikipedia.org/wiki/Dayan_Khan_(Khoshut)"}
    - {name: ダライ・ハン, title: ハン（チベット王）, from: 1671, to: 1701, source: "https://en.wikipedia.org/wiki/Tenzin_Dalai_Khan"}
    - {name: ラサン・ハン, title: ハン（チベット王）, from: 1703, to: 1717, note: 1717年にラサに侵入したジュンガル軍に殺された, source: "https://en.wikipedia.org/wiki/Lha-bzang_Khan"}
    - {name: ロブサン・ダンジン, title: 青海ホシュートの首長, from: 1717, to: 1724, note: 1723年に清に背き、1724年に年羹堯の軍に敗れた, source: "https://en.wikipedia.org/wiki/Lobzang_Danjin"}
  periods:
    - from: 1636
      to: 1647
      text: ゲルク派（黄帽派）の求めを受けたホシュート部のグシ・ハンは、1636年にジュンガル盆地から青海へ移り、1637年にハルハのチョクト・ホンタイジを破って青海を本拠とした。1639–1640年にカムのベリ王を倒し、1642年にツァン王を滅ぼしてチベットの統治権をダライ・ラマ5世に献じた。
    - from: 1648
      to: 1716
      text: オイラトのホシュート部のグシ・ハンは青海（ココノール）を本拠に、1642年にチベットを征服してダライ・ラマ5世に献じ、自らはチベット王として軍事を握った（ダライ・ラマ政権の保護者）。青海の諸侯は1697–1698年に清の康熙帝に服属した。
    - from: 1717
      to: 1724
      text: 1717年にジュンガルがラサを占領してラサン・ハンを殺し、チベットでのホシュートの支配は終わった。青海のロブサン・ダンジンは1723年に清に背いたが敗れ、青海は清の藩部となった。
  note: 地図では1648–1716年のチベットを、ダライ・ラマ政権（tibet）の上にホシュートの帯（overlord）を付けて描き、青海はホシュートの領地とする。
  source:
    - "https://ja.wikipedia.org/wiki/ホシュート"
    - "https://en.wikipedia.org/wiki/Khoshut_Khanate"

- id: tibet
  name: チベット（ダライ・ラマ政権）
  short: チベット
  color: "#d79b6a"
  kind: 政教一致の政権（ガンデンポタン）
  rulers:
    - {name: ダライ・ラマ5世（ガワン・ロサン・ギャツォ）, title: ダライ・ラマ, from: 1642, to: 1682, note: 死は摂政サンギェ・ギャツォによって1697年まで隠された, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ5世"}
    - {name: サンギェ・ギャツォ, title: 摂政（デシ）, from: 1683, to: 1696, note: ダライ・ラマ5世の死（1682）を隠して政務を執った。1697年に6世を即位させた後も1703年まで実権を握り、1705年にラサン・ハンに殺された, source: "https://ja.wikipedia.org/wiki/サンギェ・ギャツォ"}
    - {name: ダライ・ラマ6世（ツァンヤン・ギャツォ）, title: ダライ・ラマ, from: 1697, to: 1706, note: 1706年にラサン・ハンに廃され、清へ送られる途中で死去。1682–1705年の実権者は摂政サンギェ・ギャツォ, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ6世"}
    - {name: ダライ・ラマ7世（ケルサン・ギャツォ）, title: ダライ・ラマ, from: 1720, to: 1757, note: 1728–1747年は貴族ポラネーが清の任命で政務を執った（ポラネーの子ギュルメ・ナムギャルは1750年に殺された）, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ7世"}
    - {name: ダライ・ラマ8世（ジャムペル・ギャツォ）, title: ダライ・ラマ, from: 1762, to: 1804, note: 政務は摂政が執ることが多かった, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ8世"}
    - {name: ダライ・ラマ13世（トゥプテン・ギャツォ）, title: ダライ・ラマ, from: 1895, to: 1933, note: 1879年に即位、1895年から親政。9世–12世（1810–1875年）はいずれも若くして死に、摂政が政務を執った, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ13世"}
    - {name: レティン・リンポチェ（トゥプテン・ジャムペル・イェシェ）, title: 摂政, from: 1934, to: 1941, note: ダライ・ラマ13世の死（1933年12月）の後の摂政。14世を探し出し、1940年に即位させた。1947年に獄死, source: "https://en.wikipedia.org/wiki/5th_Reting_Rinpoche"}
    - {name: タクタ・リンポチェ（ガワン・スンラプ・トゥトプ）, title: 摂政, from: 1941, to: 1949, note: 14世の師。1950年11月に14世の親政が始まって退いた, source: "https://en.wikipedia.org/wiki/Taktra_Rinpoche"}
    - {name: ダライ・ラマ14世（テンジン・ギャツォ）, title: ダライ・ラマ, from: 1950, to: 1959, note: 1940年に即位、1950年に親政。1934–1950年は摂政（レティン・リンポチェ、タクタ・リンポチェ）。1959年にインドへ亡命, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ14世"}
  periods:
    - from: 1642
      to: 1647
      text: 1642年、ホシュートのグシ・ハンがツァン王を倒し、ダライ・ラマ5世をチベットの政治と宗教の頂点に据えた（ガンデンポタン）。ゲルク派の政権がシガツェからラサに移り、1645年にポタラ宮の建設が始まった。
    - from: 1648
      to: 1716
      text: ダライ・ラマ5世はホシュートのグシ・ハンの支援でチベットの政治と宗教の頂点に立ち、ラサにポタラ宮を建てた。5世の死後は摂政サンギェ・ギャツォが政治を握ったが、1705年にホシュートのラサン・ハンに殺された。
    - from: 1717
      to: 1911
      text: 1717年のジュンガルの侵入を清が退けて（1720）、チベットは清の藩部となった。1727年から駐蔵大臣が置かれ、ダライ・ラマ政権（カシャ）が内政を治めた。1788–1792年のネパール（グルカ）との戦争の後、清は活仏の選定に金瓶掣籤を導入するなど統制を強めた。
    - from: 1912
      to: 1949
      text: 1904年のイギリス軍のラサ進駐、1910年の清軍の進駐を経て、辛亥革命の後にダライ・ラマ13世は中国軍を追い、1913年に独立を宣言した。中華民国は認めず、1914年のシムラ会議でもまとまらなかった。チベットは事実上独立した国として、カム（東チベット）の境界で中国の軍閥と争った。
    - from: 1950
      to: 1959
      text: 1950年に中国人民解放軍がチャムドでチベット軍を破り、1951年の「十七か条協定」でチベットは中華人民共和国に組み込まれた。ダライ・ラマ政権は内政を続けたが、東部の改革への反発から1959年3月にラサで蜂起が起こり、ダライ・ラマ14世はインドへ亡命した（亡命政府はダラムサラ）。
  note: 1720–1911年と1951年以降は、地図では清・中華人民共和国の間接統治（certainty indirect。1959年以降は中華人民共和国の直接の統治）として描く。チベットの帰属をめぐっては、中国政府とチベット亡命政府の見解が分かれている。
  source:
    - "https://ja.wikipedia.org/wiki/ガンデンポタン"
    - "https://ja.wikipedia.org/wiki/チベットの歴史"

# ================================================================ 1453–1647（Z2 で追加）
- id: northern_yuan
  name: モンゴル（北元・タタール）
  names:
    - {from: 1547, name: チャハル（モンゴルのハーン家）, short: チャハル, kind: 遊牧国家（モンゴルのハーンの直轄）}
  short: タタール
  color: "#8ae2ca"
  kind: 遊牧国家（チンギス・カンの子孫のハーン）
  rulers:
    - {name: マルコルギス（ウケクト・ハン）, title: ハーン, from: 1455, to: 1465, note: エセンの死後、東モンゴルの有力者（ボライ太師ら）に立てられた幼いハーン。在位年は要確認, source: "https://en.wikipedia.org/wiki/Markörgis_Khan"}
    - {name: モーラン・ハン, title: ハーン, from: 1465, to: 1466, note: 要確認。1466–1475年はハーンの位が空いていた, source: "https://en.wikipedia.org/wiki/Molon_Khan"}
    - {name: マンドゥールン・ハン, title: ハーン, from: 1475, to: 1479, note: 要確認, source: "https://en.wikipedia.org/wiki/Manduul_Khan"}
    - {name: ダヤン＝ハン（バト・モンケ）, title: ハーン, from: 1479, to: 1517, note: マンドゥールンの妃マンドゥハイ（満都海）に助けられて幼くして即位し、東モンゴルを再統一した。没年は1517年説と1543年説がある（要確認）, source: "https://ja.wikipedia.org/wiki/ダヤン・ハーン"}
    - {name: ボディ・アラク・ハン, title: ハーン, from: 1519, to: 1547, note: ダヤン＝ハンの孫。1517–1519年は叔父バルス・ボラトが位を奪ったとされる（要確認）, source: "https://en.wikipedia.org/wiki/Bodi_Alagh_Khan"}
    - {name: ダライスン・ゴデン・ハン, title: ハーン, from: 1547, to: 1557, note: アルタン＝ハンの圧迫を避けてチャハル部を率いて東（遼河の上流）へ移った, source: "https://en.wikipedia.org/wiki/Darayisung_Gödeng_Khan"}
    - {name: トゥメン・ジャサクト・ハン, title: ハーン, from: 1558, to: 1592, note: 左翼の諸侯を集めて法令を定め、チベット仏教（カルマ派）を受け入れた, source: "https://en.wikipedia.org/wiki/Tümen_Jasagtu_Khan"}
    - {name: ブヤン・セチェン・ハン, title: ハーン, from: 1593, to: 1603, source: "https://en.wikipedia.org/wiki/Buyan_Sechen_Khan"}
    - {name: リンダン＝ハン, title: ハーン, from: 1604, to: 1634, note: ハーンの権威の回復をめざしたが、内モンゴルの諸部は後金に付いた。1632年に後金に追われて西へ逃れ、1634年に甘粛のシラ・タラで病死した, source: "https://ja.wikipedia.org/wiki/リンダン・ハーン"}
    - {name: エジェイ（エジェイ・ホンゴル）, title: ハーン（リンダンの子）, from: 1634, to: 1635, note: 1635年に母とともに後金に降り、元朝の伝国の玉璽をホンタイジに差し出した, source: "https://en.wikipedia.org/wiki/Ejei_Khongor"}
  periods:
    - from: 1454
      to: 1478
      text: エセンの死後、東モンゴル（明はタタール＝韃靼と呼んだ）では、チンギス・カンの子孫のハーンは有力者（太師）に立てられる飾りにすぎず、ボライ・ベグ・アルスラン・モーリハイらが争った。一部はオルドス（河套）に入り、明の辺境を襲った。
    - from: 1479
      to: 1546
      text: ダヤン＝ハンはオイラトを退け、右翼の反乱を鎮めて（1510年ごろ）東モンゴルを再統一した。左翼（チャハル・ハルハ・ウリャンハン）と右翼（オルドス・トゥメト・ヨンシエブ）の6トゥメン（万戸）を諸子に分け、のちの内外モンゴルの諸侯の祖となった。
    - from: 1547
      to: 1627
      text: ダヤン＝ハンの死後、ハーンの家（チャハル）の権威は弱まり、右翼のアルタン＝ハンが最も強くなった。チャハルは東へ移り、明の遼東・宣府の辺境で交易と略奪を繰り返した。外モンゴルのハルハは自立していった。
    - from: 1628
      to: 1635
      text: リンダン＝ハンは諸部を力で従えようとしたが、ホルチン・ハラチンなどは後金と結んだ。リンダンは西へ移ってトゥメトを破ったが、ホンタイジに追われて青海へ逃れ（1632）、1634年に死んだ。1635年に子のエジェイが後金に降り、北元のハーン家は終わった。
  note: 1453年末はオイラトのエセンがハンを名のっていた（地図ではオイラト＝dzungar）。1547年以後は、ハーン家が直接率いたチャハル部と、それに近い左翼の諸部（内ハルハ・ホルチンなど）、内モンゴル中部（シリンゴル）を描く。右翼のトゥメト・オルドス（tumed）と外モンゴルのハルハ（khalkha）は別の色。
  source:
    - "https://ja.wikipedia.org/wiki/北元"
    - "https://ja.wikipedia.org/wiki/ダヤン・ハーン"
    - "https://en.wikipedia.org/wiki/Northern_Yuan_dynasty"

- id: tumed
  name: トゥメト部（アルタン＝ハン家）
  short: トゥメト
  color: "#b5cfe0"
  kind: 遊牧国家（モンゴル右翼）
  rulers:
    - {name: アルタン＝ハン, title: トゥメト部の首長→ハン（右翼の盟主）, from: 1542, to: 1582, note: ダヤン＝ハンの孫。1530年代から右翼の実力者となり、ハーンからハンの称号を受けた。1571年の隆慶和議で明から順義王に封じられた。在位の始まりは要確認, source: "https://ja.wikipedia.org/wiki/アルタン・ハーン"}
    - {name: センゲ・ドゥーレン・ハン, title: ハン（順義王）, from: 1583, to: 1586, note: アルタンの子。在位年は要確認, source: "https://en.wikipedia.org/wiki/Altan_Khan"}
    - {name: ナムダイ・セチェン（チュルケ）, title: ハン（順義王）, from: 1586, to: 1607, note: アルタンの孫。アルタンの妃の三娘子（ジョンゲン・ハトン）と結婚し、三娘子が明との交易を取りしきった。在位年は要確認, source: "https://en.wikipedia.org/wiki/Altan_Khan"}
    - {name: ボショクト, title: ハン（順義王）, from: 1613, to: 1627, note: 1608–1612年は後継をめぐって争いがあった。1627–1628年にチャハルのリンダン＝ハンに敗れた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Tümed"}
  periods:
    - from: 1542
      to: 1570
      text: アルタン＝ハンはモンゴル右翼（トゥメト・オルドス・ヨンシエブ）の盟主として、オイラトや青海に遠征し、明に交易を求めて毎年のように長城を越えた。1550年には北京を包囲した（庚戌の変）。長城の外に逃れてきた漢人を住まわせて農地を開かせた（板升）。
    - from: 1571
      to: 1627
      text: 1571年、明と和議を結んで順義王に封じられ、長城の関所で互市（馬市）が開かれた（隆慶和議）。1578年、青海でチベットのゲルク派のソナム・ギャツォに会い、「ダライ・ラマ」の称号を贈って、モンゴルにチベット仏教が広まるきっかけを作った。フフホト（帰化城）を築いた。
  note: 地図では、トゥメト部の本拠（フフホト・包頭・ウランチャブ）と、アルタンの兄のジノン（晋王）が率いたオルドス部（label でオルドス部）、青海に住みついた一族をまとめて描く。1571年以後は明の帯（overlord ming。順義王の冊封）。
  source:
    - "https://ja.wikipedia.org/wiki/アルタン・ハーン"
    - "https://ja.wikipedia.org/wiki/隆慶和議"

- id: dughlat
  name: ドゥグラト部のアミール政権（カシュガル）
  short: ドゥグラト
  color: "#edd59b"
  kind: アミール国
  rulers:
    - {name: ミールザー・アブー・バクル, title: アミール, from: 1465, to: 1514, note: モグーリスタンのハンから自立してヤルカンド・カシュガル・ホータンを治めた。1514年にスルターン・サイード・ハンに追われ、ラダックへ逃れる途中で死んだ。在位の始まりは要確認, source: "https://en.wikipedia.org/wiki/Mirza_Abu_Bakr_Dughlat"}
  periods:
    - from: 1465
      to: 1514
      text: モグーリスタン・ハン国の有力な部族ドゥグラト部のアブー・バクルが、カシュガル・ヤルカンド・ホータンでハンから自立した。
  source: "https://en.wikipedia.org/wiki/Dughlat"

# ---------------------------------------------------------------- チベット（1453–1647）
- id: phagmodrupa
  name: パクモドゥ派政権
  short: パクモドゥ
  color: "#9fb980"
  kind: 王朝（ネドンの首長、ゴンマ）
  rulers:
    - {name: クンガ・レクパ, title: ゴンマ（デシ）, from: 1448, to: 1481, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Phagmodrupa_dynasty"}
    - {name: ガギ・ワンポ, title: ゴンマ, from: 1481, to: 1491, note: 要確認, source: "https://en.wikipedia.org/wiki/Phagmodrupa_dynasty"}
    - {name: ツォキェ・ドルジェ, title: 摂政（リンプン家）, from: 1491, to: 1499, note: 幼いゴンマに代わってリンプン家の一族が政務を執った。要確認, source: "https://en.wikipedia.org/wiki/Phagmodrupa_dynasty"}
    - {name: ガワン・タシ・タクパ, title: ゴンマ, from: 1499, to: 1564, note: 1517年にリンプン派をラサから退け、ゴンマの権威を一時取り戻した。没年は1554年説もある（要確認）, source: "https://en.wikipedia.org/wiki/Ngawang_Tashi_Drakpa"}
    - {name: ドワイ・ゴンポ, title: ゴンマ, from: 1564, to: 1576, note: 在位年は要確認。この後のゴンマ（ガワン・タクパ、ミパム・ソナム・ワンチュクら）は名目的な存在だった, source: "https://en.wikipedia.org/wiki/Phagmodrupa_dynasty"}
  periods:
    - from: 1453
      to: 1564
      text: チベット中央部（ウー）のネドンを本拠とするパクモドゥ派のゴンマ（王）がチベットの名目上の君主だったが、1434年の内紛の後は家臣だったツァンのリンプン家が力を持ち、1498–1517年にはラサもリンプン派に押さえられた。宗教ではツォンカパの開いたゲルク派（黄帽派）が広まり、カルマ派などと争った。
    - from: 1565
      to: 1617
      text: ツァンでリンプン派が倒れてツァン王（ツァンパ）が台頭し、パクモドゥ派のゴンマは名目だけの存在となった。ウーではゲルク派と、ツァン王が保護するカルマ派の対立が深まった。
  note: 明は烏思蔵都指揮使司を置き、パクモドゥ派の首長に闡化王の称号を与えて朝貢を受けたが、実際の支配は及ばなかった（地図では明の帯は付けない）。
  source:
    - "https://en.wikipedia.org/wiki/Phagmodrupa_dynasty"
    - "https://ja.wikipedia.org/wiki/パクモドゥ派"

- id: rinpungpa
  name: リンプン派政権
  short: リンプン
  color: "#d7a4a2"
  kind: 王朝（ツァンの領主）
  rulers:
    - {name: ノルサン, title: リンプン家の当主, from: 1435, to: 1466, note: 要確認, source: "https://en.wikipedia.org/wiki/Rinpungpa"}
    - {name: クンサン, title: リンプン家の当主, from: 1466, to: 1479, note: 要確認, source: "https://en.wikipedia.org/wiki/Rinpungpa"}
    - {name: ドニョ・ドルジェ, title: リンプン家の当主, from: 1479, to: 1512, note: 1498年にラサ一帯を押さえ、カルマ派を保護した。要確認, source: "https://en.wikipedia.org/wiki/Donyo_Dorje"}
    - {name: ガワン・ナムギャル, title: リンプン家の当主, from: 1512, to: 1544, note: 要確認, source: "https://en.wikipedia.org/wiki/Rinpungpa"}
    - {name: ドンドゥプ・ツェテン・ドルジェ, title: リンプン家の当主, from: 1544, to: 1565, note: 1565年に家臣のシンシャクパに実権を奪われた。要確認, source: "https://en.wikipedia.org/wiki/Rinpungpa"}
  periods:
    - from: 1453
      to: 1565
      text: パクモドゥ派の家臣としてツァン（チベット西部の中心、シガツェ一帯）を治めたリンプン家が、1434年の内紛の後に自立した。カルマ派を保護してゲルク派と争い、1498–1517年にはウーのラサ一帯も支配した。
  source: "https://en.wikipedia.org/wiki/Rinpungpa"

- id: tsangpa
  name: ツァン王（ツァンパ政権）
  short: ツァン
  color: "#e3d36a"
  kind: 王朝（シガツェの王）
  rulers:
    - {name: カルマ・ツェテン（シンシャクパ・ツェテン・ドルジェ）, title: ツァン王, from: 1565, to: 1599, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Tsangpa"}
    - {name: カルマ・トゥトプ・ナムギャル, title: ツァン王, from: 1599, to: 1611, note: 兄弟のラワン・ドルジェと並んで治めたとされる。要確認, source: "https://en.wikipedia.org/wiki/Tsangpa"}
    - {name: カルマ・プンツォク・ナムギャル, title: ツァン王, from: 1611, to: 1620, note: 1618年にウーを征服し、チベットの大部分をまとめた。要確認, source: "https://en.wikipedia.org/wiki/Karma_Phuntsok_Namgyal"}
    - {name: カルマ・テンキョン・ワンポ, title: ツァン王, from: 1620, to: 1642, note: 1642年、グシ・ハンに捕らえられ、のちに殺された, source: "https://en.wikipedia.org/wiki/Karma_Tenkyong"}
  periods:
    - from: 1565
      to: 1617
      text: リンプン家の家臣だったシンシャクパ家がシガツェで自立し、ツァン王を名のった。カルマ派を保護し、ゲルク派とその後ろ盾のモンゴル（トゥメト）と対立した。
    - from: 1618
      to: 1642
      text: 1618年にウーを征服してチベットの大部分をまとめたが、ゲルク派はモンゴルの軍を招いて対抗した（1621年にラサの近くでツァン軍が敗れる）。1641–1642年、ホシュートのグシ・ハンに攻められてシガツェが落ち、ツァン王の政権は滅んだ。
  source:
    - "https://en.wikipedia.org/wiki/Tsangpa"

- id: guge
  name: グゲ王国
  short: グゲ
  color: "#8bb9b9"
  kind: 王国
  periods:
    - from: 1453
      to: 1630
      text: チベット西部（ガリ）のツァパランを都とする古い王国（10世紀に吐蕃の王族が開いた）。1624年にポルトガル人のイエズス会士アントニオ・デ・アンドラーデが訪れ、ツァパランに教会を建てた。1630年ごろ、ラダックのセンゲ・ナムギャルに攻められて滅んだ。
  note: 君主は省略（最後の王はティ・タシ・タクパ）。地図ではプラン（ブラン）を含むガリ全体を描く。
  source: "https://ja.wikipedia.org/wiki/グゲ王国"
