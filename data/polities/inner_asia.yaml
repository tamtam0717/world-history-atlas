    - {name: ダライ・ラマ6世（ツァンヤン・ギャツォ）, title: ダライ・ラマ, from: 1697, to: 1706, note: 1706年にラサン・ハンに廃され、清へ送られる途中で死去。1682–1705年の実権者は摂政サンギェ・ギャツォ, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ6世"}
    - {name: ダライ・ラマ7世（ケルサン・ギャツォ）, title: ダライ・ラマ, from: 1720, to: 1757, note: 1728–1747年は貴族ポラネーが清の任命で政務を執った（ポラネーの子ギュルメ・ナムギャルは1750年に殺された）, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ7世"}
    - {name: ダライ・ラマ8世（ジャムペル・ギャツォ）, title: ダライ・ラマ, from: 1762, to: 1804, note: 政務は摂政が執ることが多かった, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ8世"}
    - {name: ダライ・ラマ13世（トゥプテン・ギャツォ）, title: ダライ・ラマ, from: 1895, to: 1933, note: 1879年に即位、1895年から親政。9世–12世（1810–1875年）はいずれも若くして死に、摂政が政務を執った, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ13世"}
    - {name: ダライ・ラマ14世（テンジン・ギャツォ）, title: ダライ・ラマ, from: 1950, to: 1959, note: 1940年に即位、1950年に親政。1934–1950年は摂政（レティン・リンポチェ、タクタ・リンポチェ）。1959年にインドへ亡命, source: "https://ja.wikipedia.org/wiki/ダライ・ラマ14世"}
  periods:
    - from: 1648
      to: 1716
      text: ダライ・ラマ5世はホシュートのグシ・ハンの支援でチベットの政治と宗教の頂点に立ち、ラサにポタラ宮を建てた。5世の死後は摂政サンギェ・ギャツォが政治を握ったが、1705年にホシュートのラサン・ハンに殺された。
    - from: 1717
      to: 1911
      text: 1717年のジュンガルの侵入を清が退けて（1720）、チベットは清の藩部となった。1727年から駐蔵大臣が置かれ、ダライ・ラマ政権（カシャ）が内政を治めた。1788–1792年のネパール（グルカ）との戦争の後、清は活仏の選定に金瓶掣籤を導入するなど統制を強めた。
    - from: 1912
      to: 1950
      text: 1904年のイギリス軍のラサ進駐、1910年の清軍の進駐を経て、辛亥革命の後にダライ・ラマ13世は中国軍を追い、1913年に独立を宣言した。中華民国は認めず、1914年のシムラ会議でもまとまらなかった。チベットは事実上独立した国として、カム（東チベット）の境界で中国の軍閥と争った。
    - from: 1950
      to: 1959
      text: 1950年に中国人民解放軍がチャムドでチベット軍を破り、1951年の「十七か条協定」でチベットは中華人民共和国に組み込まれた。ダライ・ラマ政権は内政を続けたが、東部の改革への反発から1959年3月にラサで蜂起が起こり、ダライ・ラマ14世はインドへ亡命した（亡命政府はダラムサラ）。
  note: 1720–1911年と1951年以降は、地図では清・中華人民共和国の間接統治（certainty indirect。1959年以降は中華人民共和国の直接の統治）として描く。チベットの帰属をめぐっては、中国政府とチベット亡命政府の見解が分かれている。
  source:
    - "https://ja.wikipedia.org/wiki/ガンデンポタン"
    - "https://ja.wikipedia.org/wiki/チベットの歴史"
