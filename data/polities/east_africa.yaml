  periods:
    - {from: 1453, to: 1528, text: "ソロモン朝のキリスト教の帝国。ザラ・ヤコブのもとでシェワ・アムハラを中心に南のムスリム諸国（ダワロ・バリ・ハディヤ）を従えた。皇帝は天幕の宮廷で国内を移った。"}
    - {from: 1529, to: 1543, text: "アダルのイマーム、アフマド・グランの侵攻（ジハード）。1529年のシンブラ・クレの戦いに敗れ、高原の大部分が征服された。ポルトガル軍の助けを得て、1543年のワイナ・ダガの戦いでグランを倒した。"}
    - {from: 1544, to: 1631, text: "南からオロモ人が移り住み、シェワ・ダワロ・バリなど南の州を失った。オスマン帝国が紅海沿岸（マッサワ）を取った。スセニョスはカトリックに改宗したが、内乱を招いた。"}
    - {from: 1632, to: 1647, text: "ファシリデスがカトリックの宣教師を追い、1636年にゴンダールに都を定めた。"}
    - from: 1648
      to: 1768
      text: ソロモン朝の皇帝がゴンダールに都を置き、城や教会を建てた（ゴンダール朝）。南の低地にはオロモ人が広く住み、皇帝の支配は北部の高原が中心。
    - from: 1769
      to: 1854
      text: 「諸侯の時代」（ゼメネ・メサフィント）。皇帝は名目だけになり、ティグレ・ゴッジャム・シェワやオロモ系のイェジュ家などの諸侯が争った。
    - from: 1855
      to: 1889
      text: テオドロス2世が帝国を再統一したが、イギリスの遠征（1868年）で倒れた。ヨハネス4世はエジプト軍（1875–76年）を破り、マフディー国家・イタリアと戦った。
    - from: 1889
      to: 1935
      text: メネリク2世が南・東・西へ領土を広げ、今のエチオピアの範囲を作った。アドワの戦い（1896年）でイタリアを破り、アフリカで独立を保った（ほかはリベリア）。1923年に国際連盟に加盟。
    - from: 1936
      to: 1941
      text: 第二次エチオピア戦争でイタリアに占領され、イタリア領東アフリカに組み込まれた（国際連盟の制裁は効かなかった）。1941年、イギリス軍と抵抗勢力がイタリア軍を破り、ハイレ・セラシエが帰還。
    - from: 1941
      to: 1974
      text: ハイレ・セラシエの帝政。1952年にエリトリアと連邦を作り、1962年に併合した。首都アディスアベバにアフリカ統一機構（1963年）が置かれた。
    - from: 1974
      to: 1991
      text: 革命で帝政が倒れ、軍事政権（デルグ）がソ連と結んで社会主義を進めた。オガデン戦争（1977–78年）、大飢饉（1984–85年）、エリトリア・ティグレの反乱が続いた。
    - from: 1991
      text: エチオピア人民革命民主戦線（EPRDF）の政権が民族ごとの州による連邦制をとり、1993年にエリトリアの独立を認めた。エリトリアとの国境戦争（1998–2000年）、ティグレ戦争（2020–22年）。
  source: "https://ja.wikipedia.org/wiki/エチオピアの歴史"

