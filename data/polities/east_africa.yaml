# F3 東アフリカ・アフリカの角・スーダン（SDN SSD ETH ERI DJI SOM KEN UGA RWA BDI TZA）の政体（1648–2025）
# 他の担当が参照しうる ID：ethiopia・sudan・south_sudan・eritrea・djibouti・somalia・kenya・uganda・tanzania・rwanda・burundi・
#   zanzibar・funj・darfur・mahdist・buganda・bunyoro・rwanda_kingdom
# 植民地の時期は宗主国（britain・italy・france・german_empire・belgium・egypt・ottoman・oman・portugal）の政体を使う。
# コンゴ自由国（congo_free_state。ラド飛び地 1894–1908）は F4 が定義する。
# 元首は実権者。年代は「その年を含む」。17–18世紀の在地の王の年代は口承・年代記による推定で、説が分かれる（note に書いた）。

