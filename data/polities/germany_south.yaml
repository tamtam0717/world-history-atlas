    - {name: ヴィルヘルム8世, title: ヘッセン＝カッセル方伯, from: 1751, to: 1760, source: "https://en.wikipedia.org/wiki/William_VIII,_Landgrave_of_Hesse-Kassel"}
    - {name: フリードリヒ2世, title: ヘッセン＝カッセル方伯, from: 1760, to: 1785, note: アメリカ独立戦争にイギリスの傭兵として兵を貸し出した。, source: "https://en.wikipedia.org/wiki/Frederick_II,_Landgrave_of_Hesse-Kassel"}
    - {name: ヴィルヘルム9世（選帝侯ヴィルヘルム1世）, title: 方伯→ヘッセン選帝侯（1803）, from: 1785, to: 1821, note: 1806–1813年は亡命。, source: "https://en.wikipedia.org/wiki/William_I,_Elector_of_Hesse"}
    - {name: ヴィルヘルム2世, title: ヘッセン選帝侯, from: 1821, to: 1847, note: 1831年から子のフリードリヒ・ヴィルヘルムが共同統治者として実権を持った。, source: "https://en.wikipedia.org/wiki/William_II,_Elector_of_Hesse"}
    - {name: フリードリヒ・ヴィルヘルム, title: ヘッセン選帝侯, from: 1847, to: 1866, note: 1866年にプロイセンに捕らえられ、国を失った（退位はしなかった）。, source: "https://en.wikipedia.org/wiki/Frederick_William,_Elector_of_Hesse"}
  periods:
    - from: 1648
      to: 1735
      text: カルヴァン派の方伯領。ウェストファリア条約でヘルスフェルトを獲得し、ヘッセン戦争の結果マールブルクの北部を得た。
    - from: 1736
      to: 1805
      text: 1736年にハーナウ＝ミュンツェンベルク伯領を相続。兵士をイギリスなどへ貸し出す「兵士売買」で財を蓄えた。1803年に選帝侯国となった。
    - from: 1806
      to: 1813
      text: プロイセン側に立ったためナポレオンに占領され、本領はヴェストファーレン王国、ハーナウはフランクフルト大公国に編入された。1813年に選帝侯が復帰。
    - from: 1814
      to: 1830
      text: 復帰した選帝侯ヴィルヘルム1世はナポレオン期の改革を取り消し、旧体制を復活させた（兵士のおさげ髪まで元に戻させたといわれる）。
    - from: 1831
      to: 1866
      text: 1830年の騒乱を受けて1831年に憲法を制定したが、選帝侯と宰相ハッセンプフルークは議会と対立し続けた。1850年の憲法紛争はプロイセンとオーストリアの対立（オルミュッツ協定）に発展した。1866年、普墺戦争でオーストリア側につき、プロイセンに併合された。
  source:
    - "https://ja.wikipedia.org/wiki/ヘッセン＝カッセル方伯領"
    - "https://ja.wikipedia.org/wiki/ヘッセン選帝侯国"

