    - {name: ルートヴィヒ3世, title: ヘッセン大公, from: 1848, to: 1877, note: 宰相ダルヴィク（1850–71）が実権を握った。, source: "https://en.wikipedia.org/wiki/Louis_III,_Grand_Duke_of_Hesse"}
    - {name: ルートヴィヒ4世, title: ヘッセン大公, from: 1877, to: 1892, note: 妃はイギリスのヴィクトリア女王の娘アリス。, source: "https://en.wikipedia.org/wiki/Louis_IV,_Grand_Duke_of_Hesse"}
    - {name: エルンスト・ルートヴィヒ, title: ヘッセン大公, from: 1892, to: 1918, note: 妹アリックスはロシア皇帝ニコライ2世の皇后。1918年のドイツ革命で廃位。, source: "https://en.wikipedia.org/wiki/Ernest_Louis,_Grand_Duke_of_Hesse"}
  periods:
    - from: 1648
      to: 1735
      text: ルター派の方伯領。ヘッセン戦争（1645–48）の結果、ギーセンを含むオーバーヘッセン南部を確保した。
    - from: 1736
      to: 1802
      text: 1736年にハーナウ＝リヒテンベルク伯領（ライン左岸のピルマゼンス、アルザス北部など）を相続した。
    - from: 1803
      to: 1815
      text: 帝国代表者会議主要決議でマインツ領の一部やヴェストファーレン公領を獲得。1806年にライン同盟に加わって大公国となり、周辺の伯領などを陪臣化した。1816年にライン左岸のラインヘッセン（マインツ・ヴォルムス）を得る。
    - from: 1816
      to: 1847
      text: 1816年にライン左岸のラインヘッセン（マインツ・ヴォルムス）を得た。1820年に憲法を制定し、1828年にはプロイセンと関税同盟を結んで、のちのドイツ関税同盟の先がけとなった。
    - from: 1848
      to: 1870
      text: 宰相ダルヴィクが反プロイセン政策をとり、1866年の普墺戦争でオーストリア側について敗れた。ヘッセン＝ホンブルクなどをプロイセンに譲り、マイン川以北のオーバーヘッセン州だけが北ドイツ連邦に加わった（南部は加わらない、二つに分かれた状態）。
    - from: 1871
      to: 1914
      text: ドイツ帝国の構成国。エルンスト・ルートヴィヒ大公は芸術を保護し、ダルムシュタットのマティルデンヘーエに芸術家村（1899）を開いてユーゲントシュティールの中心とした。
  source:
    - "https://ja.wikipedia.org/wiki/ヘッセン＝ダルムシュタット方伯領"
    - "https://ja.wikipedia.org/wiki/ヘッセン大公国"

- id: nassau
  name: ナッサウ公国
  names:
    - {to: 1805, name: ナッサウ諸家（ヴァルラム系）, kind: 侯国・伯領（諸家）}
  short: ナッサウ
  color: "#e3c7a6"
  kind: 公国
  note: ナッサウ＝ヴァイルブルク、ナッサウ＝ウージンゲン、ナッサウ＝ザールブリュッケンなどヴァルラム系ナッサウ家の諸領をまとめたもの。1806年に統合されてナッサウ公国となった（首都はヴァイルブルク／ヴィースバーデン近郊ビープリヒ）。
  rulers:
    - {name: フリードリヒ・アウグスト（ナッサウ＝ウージンゲン）, title: ナッサウ公, from: 1806, to: 1816, note: ナッサウ＝ヴァイルブルク侯フリードリヒ・ヴィルヘルムと共同統治。1805年以前は家系ごとに君主が分かれるため省略。, source: "https://en.wikipedia.org/wiki/Frederick_Augustus,_Duke_of_Nassau"}
    - {name: ヴィルヘルム, title: ナッサウ公, from: 1816, to: 1839, note: 1816年にナッサウ＝ヴァイルブルク系のもとで両系の領地を統合。, source: "https://en.wikipedia.org/wiki/William,_Duke_of_Nassau"}
    - {name: アドルフ, title: ナッサウ公, from: 1839, to: 1866, note: 1866年に国を失い、1890年にルクセンブルク大公となった。, source: "https://ja.wikipedia.org/wiki/アドルフ_(ルクセンブルク大公)"}
  periods:
    - from: 1648
      to: 1802
      text: ヴァルラム系ナッサウ家は、ラーン川・タウヌス山地からザールブリュッケンまで、分家ごとに小領地を持っていた。
    - from: 1803
      to: 1815
      text: 帝国代表者会議主要決議でマインツ・トリーア両大司教領の右岸部分を得て領土を拡大。1806年にライン同盟に加わりナッサウ公国となった。
    - from: 1816
      to: 1866
      text: 1814年にドイツで最初期の憲法を制定。首都ヴィースバーデンは温泉保養地として栄えた。1866年の普墺戦争でオーストリア側につき、プロイセンに併合された（ヘッセン＝ナッサウ州）。
  source:
    - "https://de.wikipedia.org/wiki/Herzogtum_Nassau"
    - "https://ja.wikipedia.org/wiki/ナッサウ公国"

- id: nassau_orange
  name: ナッサウ＝オラニエ家領
  names:
    - {to: 1742, name: ナッサウ諸家（オットー系）}
  short: ナッサウ＝オラニエ
  color: "#efc38f"
  kind: 侯国
  note: オットー系ナッサウ家（ディレンブルク、ディーツ、ハダマー、ジーゲン）のドイツ内の領地。1743年にオラニエ公ウィレム4世（オランダ総督）のもとで統合された。1803–06年はフルダなども領有。1806年にナポレオンに没収されベルク大公国へ、1813年に回復、1815年にルクセンブルクと交換してプロイセン・ナッサウへ譲った。
  periods:
    - from: 1743
      to: 1805
      text: オランダ総督のオラニエ公がドイツ内の家領として統治した。
  source: "https://de.wikipedia.org/wiki/Nassau-Oranien"

- id: waldeck
  name: ヴァルデック侯国
  names:
    - {to: 1711, name: ヴァルデック伯領, kind: 伯領}
  short: ヴァルデック
  color: "#cfd9b0"
  kind: 侯国
  note: 1712年からヴァルデック侯国。ピルモント（ニーダーザクセン）も領有。1807年ライン同盟、1815年ドイツ連邦に加盟。
  rulers:
    - {name: ゲオルク2世, title: ヴァルデック＝ピルモント侯, from: 1813, to: 1845, source: "https://en.wikipedia.org/wiki/George_II,_Prince_of_Waldeck_and_Pyrmont"}
    - {name: ゲオルク・ヴィクトル, title: ヴァルデック＝ピルモント侯, from: 1845, to: 1893, note: 娘エマはオランダ王妃（ウィルヘルミナ女王の母）。, source: "https://en.wikipedia.org/wiki/George_Victor,_Prince_of_Waldeck_and_Pyrmont"}
    - {name: フリードリヒ, title: ヴァルデック＝ピルモント侯, from: 1893, to: 1918, note: 1918年のドイツ革命で退位。, source: "https://en.wikipedia.org/wiki/Friedrich,_Prince_of_Waldeck_and_Pyrmont"}
  periods:
    - from: 1648
      to: 1815
      text: アロルゼンを首都とするヘッセン北西部の小侯国。ヘッセン＝カッセルと同じく傭兵の供給で知られた。
    - from: 1816
      to: 1914
      text: ドイツ連邦の小国。財政難のため1867年の加盟条約（1868年発効）で行政をプロイセンに委ねたが、侯国としては存続し、北ドイツ連邦・ドイツ帝国の構成国となった。
  source: "https://de.wikipedia.org/wiki/Waldeck_(Land)"

- id: hohenzollern
  name: ホーエンツォレルン＝ジグマリンゲン侯国
  short: ホーエンツォレルン
  color: "#c2c9d6"
  kind: 侯国
  note: シュヴァーベンに残ったホーエンツォレルン家のカトリック系の分家（プロイセン王家の本家筋）。ヘヒンゲン系とジグマリンゲン系の2侯国があり、この地図ではジグマリンゲン侯国の中心部だけを示す。1806年のライン同盟加盟で独立を保ち、1815年ドイツ連邦の加盟国となった（1850年にプロイセン領）。
  rulers:
    - {name: アントン・アロイス, title: ホーエンツォレルン＝ジグマリンゲン侯, from: 1785, to: 1831, source: "https://en.wikipedia.org/wiki/Anton_Aloys,_Prince_of_Hohenzollern-Sigmaringen"}
    - {name: カール, title: ホーエンツォレルン＝ジグマリンゲン侯, from: 1831, to: 1848, source: "https://en.wikipedia.org/wiki/Charles,_Prince_of_Hohenzollern-Sigmaringen"}
    - {name: カール・アントン, title: ホーエンツォレルン＝ジグマリンゲン侯, from: 1848, to: 1849, note: 1849年に領国をプロイセン王に譲った。のちプロイセン首相（1858–62）。, source: "https://en.wikipedia.org/wiki/Karl_Anton,_Prince_of_Hohenzollern"}
  periods:
    - from: 1648
      to: 1805
      text: 1623年に侯国に昇格した小領邦（シュヴァーベン・クライス）。周囲を前方オーストリアなどハプスブルク家の領地に囲まれ、その影響下にあった。
    - from: 1806
      to: 1815
      text: ナポレオンの妃ジョゼフィーヌと縁のある侯妃の働きかけもあってライン同盟に加わり、周辺の小領を併合して独立を保った。
    - from: 1816
      to: 1849
      text: ドイツ連邦の小国（ジグマリンゲン・ヘヒンゲンの2侯国）。1848年の革命の騒乱を受け、両侯は1849年に領国をプロイセン王に譲り、1850年からプロイセンのホーエンツォレルン諸邦となった。カール・アントンの子カロルは1866年にルーマニア公となり、レオポルトのスペイン王位への立候補（1870）は普仏戦争のきっかけとなった。
  source: "https://de.wikipedia.org/wiki/Fürstentum_Hohenzollern-Sigmaringen"

- id: ansbach
  name: アンスバッハ＝バイロイト辺境伯領
  names:
    - {to: 1768, name: ブランデンブルク＝アンスバッハ辺境伯領}
  short: アンスバッハ
  color: "#b8c4cf"
  kind: 辺境伯領
  note: 1769年からアンスバッハ＝バイロイト辺境伯領（同君連合）。ホーエンツォレルン家のフランケン分家で、1791年にプロイセン王に譲られた。
  rulers:
    - {name: アルブレヒト2世, title: アンスバッハ辺境伯, from: 1634, to: 1667, source: "https://en.wikipedia.org/wiki/Albert_II,_Margrave_of_Brandenburg-Ansbach"}
    - {name: ヨハン・フリードリヒ, title: アンスバッハ辺境伯, from: 1667, to: 1686, source: "https://en.wikipedia.org/wiki/John_Frederick,_Margrave_of_Brandenburg-Ansbach"}
    - {name: クリスティアン・アルブレヒト, title: アンスバッハ辺境伯, from: 1686, to: 1692, source: "https://en.wikipedia.org/wiki/Christian_Albert,_Margrave_of_Brandenburg-Ansbach"}
    - {name: ゲオルク・フリードリヒ2世, title: アンスバッハ辺境伯, from: 1692, to: 1703, source: "https://en.wikipedia.org/wiki/George_Frederick_II,_Margrave_of_Brandenburg-Ansbach"}
    - {name: ヴィルヘルム・フリードリヒ, title: アンスバッハ辺境伯, from: 1703, to: 1723, source: "https://en.wikipedia.org/wiki/William_Frederick,_Margrave_of_Brandenburg-Ansbach"}
    - {name: カール・ヴィルヘルム・フリードリヒ, title: アンスバッハ辺境伯, from: 1723, to: 1757, source: "https://en.wikipedia.org/wiki/Charles_William_Frederick,_Margrave_of_Brandenburg-Ansbach"}
    - {name: カール・アレクサンダー, title: アンスバッハ（1769からバイロイトも）辺境伯, from: 1757, to: 1791, note: 1791年に退位し、領国をプロイセン王に売却。, source: "https://en.wikipedia.org/wiki/Charles_Alexander,_Margrave_of_Brandenburg-Ansbach"}
  periods:
    - from: 1648
      to: 1768
      text: ニュルンベルクの南西に広がる、ホーエンツォレルン家のプロテスタントの辺境伯領（フランケン・クライス）。
    - from: 1769
      to: 1790
      text: バイロイト系の断絶でアンスバッハ辺境伯がバイロイトを相続し、フランケンの2つの辺境伯領が統合された。
  source: "https://de.wikipedia.org/wiki/Fürstentum_Ansbach"

- id: bayreuth
  name: ブランデンブルク＝バイロイト辺境伯領
  short: バイロイト
  color: "#a8b8c6"
  kind: 辺境伯領
  note: 1769年にアンスバッハと統合された（以後はアンスバッハの色）。
  rulers:
    - {name: クリスティアン, title: バイロイト辺境伯, from: 1603, to: 1655, source: "https://en.wikipedia.org/wiki/Christian,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: クリスティアン・エルンスト, title: バイロイト辺境伯, from: 1655, to: 1712, source: "https://en.wikipedia.org/wiki/Christian_Ernst,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: ゲオルク・ヴィルヘルム, title: バイロイト辺境伯, from: 1712, to: 1726, source: "https://en.wikipedia.org/wiki/George_William,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: ゲオルク・フリードリヒ・カール, title: バイロイト辺境伯, from: 1726, to: 1735, source: "https://en.wikipedia.org/wiki/George_Frederick_Charles,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: フリードリヒ, title: バイロイト辺境伯, from: 1735, to: 1763, note: 妃ヴィルヘルミーネはフリードリヒ大王の姉。バイロイト辺境伯歌劇場を建設。, source: "https://en.wikipedia.org/wiki/Frederick,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: フリードリヒ・クリスティアン, title: バイロイト辺境伯, from: 1763, to: 1769, source: "https://en.wikipedia.org/wiki/Frederick_Christian,_Margrave_of_Brandenburg-Bayreuth"}
  periods:
    - from: 1648
      to: 1768
      text: バイロイトとエアランゲン（ユグノーの町）を中心とするホーエンツォレルン家の辺境伯領（クルムバッハ辺境伯領）。
  source: "https://de.wikipedia.org/wiki/Fürstentum_Bayreuth"

- id: nuremberg
  name: 帝国都市ニュルンベルク
  short: ニュルンベルク
  color: "#e0b4a4"
  kind: 帝国都市
  note: 帝国都市の中で最大級の領域（ラウフ、ヘルスブルック、アルトドルフ）を持った。1806年にバイエルンへ編入。
  periods:
    - from: 1648
      to: 1806
      text: 中世以来の商工業都市だが、三十年戦争後は衰退し、18世紀末には多額の負債を抱えていた。
  source: "https://de.wikipedia.org/wiki/Reichsstadt_Nürnberg"

- id: frankfurt
  name: 自由都市フランクフルト
  names:
    - {to: 1805, name: 帝国都市フランクフルト, kind: 帝国都市}
  short: フランクフルト
  color: "#e8a9a0"
  kind: 自由都市
  note: 皇帝の選挙・戴冠の都市（1562年からは戴冠も）。1806–1813年はダールベルクの国家に編入。1815年に自由都市フランクフルトとして復活し、ドイツ連邦議会の所在地となった。
  periods:
    - from: 1648
      to: 1805
      text: 皇帝の選挙と戴冠が行われる帝国都市。見本市と金融で栄えた（1749年ゲーテ誕生）。
    - from: 1813
      to: 1815
      text: ナポレオン体制の崩壊で独立を回復し、ウィーン会議で自由都市となった。
    - from: 1816
      to: 1866
      text: ドイツ連邦議会の所在地。ロスチャイルド家などの銀行が集まる金融の中心だった。1848–49年にはパウロ教会でフランクフルト国民議会が開かれた。1866年の普墺戦争の後、プロイセンに併合され、重い賠償金を課された。
  source: "https://ja.wikipedia.org/wiki/フランクフルト自由都市"

- id: frankfurt_gd
  name: フランクフルト大公国
  names:
    - {to: 1805, name: 大書記長侯国（ダールベルク領）, short: ダールベルク領, kind: 選帝侯国（帝国大書記長の国家）}
    - {to: 1809, name: 首座大司教侯国（ダールベルク領）, short: ダールベルク領, kind: 侯国}
  short: フランクフルト大公国
  color: "#d6cf8a"
  kind: 大公国
  note: 最後のマインツ選帝侯ダールベルクが、1803年に帝国大書記長としてアシャッフェンブルク・レーゲンスブルク・ヴェッツラーを得て作った国家。1806年にフランクフルトを加えて首座大司教侯国、1810年にレーゲンスブルクをバイエルンに譲り、フルダ・ハーナウを得てフランクフルト大公国となった。1813年に解体。
  rulers:
    - {name: カール・テオドール・フォン・ダールベルク, title: 大書記長→首座大司教→フランクフルト大公, from: 1803, to: 1813, note: 後継者にはナポレオンの養子ウジェーヌ・ド・ボアルネが指名されていた。, source: "https://en.wikipedia.org/wiki/Karl_Theodor_von_Dalberg"}
  periods:
    - from: 1803
      to: 1809
      text: 聖界諸侯の中でただ一人、世俗化を免れたダールベルクの国家。ライン同盟の議長（首座大司教）を務めた。
    - from: 1810
      to: 1813
      text: フランクフルト大公国として再編。ナポレオン法典を導入したが、1813年の連合軍の進出で崩壊した。
  source: "https://ja.wikipedia.org/wiki/フランクフルト大公国"

