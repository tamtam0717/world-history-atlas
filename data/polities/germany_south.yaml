# 南ドイツ（BS 担当）の政体：現代のヘッセン・ラインラント＝プファルツ・ザールラント・バーデン＝ヴュルテンベルク・バイエルン
# 神聖ローマ帝国・ライン同盟・ドイツ連邦（overlord 用の枠）と「その他の帝国諸邦」もここで定義する。

# ---------------------------------------------------------------- 上位の枠

- id: hre
  name: 神聖ローマ帝国
  short: 神聖ローマ帝国
  color: "#d9d2b6"
  kind: 帝国
  note: overlord（外枠）としてだけ使う枠。皇帝は1438年以降ハプスブルク家（1742–45年のみバイエルンのヴィッテルスバッハ家）。15世紀末から「ドイツ国民の神聖ローマ帝国」とも呼ばれた。帝国議会は1663年からレーゲンスブルクで常設（永久帝国議会）。君主欄の在位は皇帝（ローマ王）として帝国を治めた期間。
  rulers:
    - {name: フリードリヒ3世, title: 神聖ローマ皇帝, from: 1440, to: 1493, note: 1440年ローマ王、1452年ローマで戴冠（ローマで戴冠した最後の皇帝）。1486年から子マクシミリアンがローマ王として共同統治。, source: "https://ja.wikipedia.org/wiki/フリードリヒ3世_(神聖ローマ皇帝)"}
    - {name: マクシミリアン1世, title: ローマ王→神聖ローマ皇帝（1508–）, from: 1493, to: 1519, note: 1508年、ローマで戴冠せずに「選ばれたローマ皇帝」を名のった。ブルゴーニュ公女マリーとの結婚（1477）でネーデルラントを得て、ハプスブルク家の婚姻政策を進めた。, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(神聖ローマ皇帝)"}
    - {name: カール5世, title: 神聖ローマ皇帝（スペイン王カルロス1世）, from: 1519, to: 1556, note: 1519年の選挙でフランス王フランソワ1世を破った。1556年に退位（帝位の譲渡は1558年に確定）。, source: "https://ja.wikipedia.org/wiki/カール5世_(神聖ローマ皇帝)"}
    - {name: フェルディナント1世, title: 神聖ローマ皇帝, from: 1556, to: 1564, note: カール5世の弟。1531年からローマ王としてドイツの政務を代行し、アウクスブルクの和議（1555）をまとめた。皇帝位は1558年に正式に継承。, source: "https://ja.wikipedia.org/wiki/フェルディナント1世_(神聖ローマ皇帝)"}
    - {name: マクシミリアン2世, title: 神聖ローマ皇帝, from: 1564, to: 1576, source: "https://ja.wikipedia.org/wiki/マクシミリアン2世_(神聖ローマ皇帝)"}
    - {name: ルドルフ2世, title: 神聖ローマ皇帝, from: 1576, to: 1612, note: プラハに宮廷を置き、ケプラーらの学者・芸術家を集めた。, source: "https://ja.wikipedia.org/wiki/ルドルフ2世_(神聖ローマ皇帝)"}
    - {name: マティアス, title: 神聖ローマ皇帝, from: 1612, to: 1619, source: "https://ja.wikipedia.org/wiki/マティアス_(神聖ローマ皇帝)"}
    - {name: フェルディナント2世, title: 神聖ローマ皇帝, from: 1619, to: 1637, note: 熱心なカトリックで、ボヘミアの反乱から三十年戦争を戦った。1629年に復旧勅令を出した。, source: "https://ja.wikipedia.org/wiki/フェルディナント2世_(神聖ローマ皇帝)"}
    - {name: フェルディナント3世, title: 神聖ローマ皇帝, from: 1637, to: 1657, source: "https://ja.wikipedia.org/wiki/フェルディナント3世_(神聖ローマ皇帝)"}
    - {name: レオポルト1世, title: 神聖ローマ皇帝, from: 1658, to: 1705, source: "https://ja.wikipedia.org/wiki/レオポルト1世_(神聖ローマ皇帝)"}
    - {name: ヨーゼフ1世, title: 神聖ローマ皇帝, from: 1705, to: 1711, source: "https://ja.wikipedia.org/wiki/ヨーゼフ1世_(神聖ローマ皇帝)"}
    - {name: カール6世, title: 神聖ローマ皇帝, from: 1711, to: 1740, source: "https://ja.wikipedia.org/wiki/カール6世_(神聖ローマ皇帝)"}
    - {name: カール7世（バイエルン選帝侯カール・アルブレヒト）, title: 神聖ローマ皇帝, from: 1742, to: 1745, source: "https://ja.wikipedia.org/wiki/カール7世_(神聖ローマ皇帝)"}
    - {name: フランツ1世（マリア・テレジアの夫）, title: 神聖ローマ皇帝, from: 1745, to: 1765, source: "https://ja.wikipedia.org/wiki/フランツ1世_(神聖ローマ皇帝)"}
    - {name: ヨーゼフ2世, title: 神聖ローマ皇帝, from: 1765, to: 1790, source: "https://ja.wikipedia.org/wiki/ヨーゼフ2世_(神聖ローマ皇帝)"}
    - {name: レオポルト2世, title: 神聖ローマ皇帝, from: 1790, to: 1792, source: "https://ja.wikipedia.org/wiki/レオポルト2世_(神聖ローマ皇帝)"}
    - {name: フランツ2世, title: 神聖ローマ皇帝, from: 1792, to: 1806, source: "https://ja.wikipedia.org/wiki/フランツ2世_(神聖ローマ皇帝)"}
  periods:
    - from: 1453
      to: 1494
      text: ハプスブルク家のフリードリヒ3世のもとで皇帝の権威は弱く、諸侯どうしの私闘（フェーデ）が絶えなかった。東ではハンガリー王マーチャーシュがウィーンを占領した（1485–90）。
    - from: 1495
      to: 1516
      text: ヴォルムス帝国議会（1495）で永久ラント平和令と帝国最高法院（帝室裁判所）が定められ、帝国クライス（管区）が置かれるなど、帝国改造が進められた。マクシミリアン1世はブルゴーニュ・スペインとの婚姻でハプスブルク家の大帝国の基礎を築いた。
    - from: 1517
      to: 1555
      text: ルターの宗教改革（1517）が帝国を二分した。カール5世はヴォルムス帝国議会（1521）でルターを追放としたが、ドイツ農民戦争（1524–25）、シュマルカルデン戦争（1546–47）を経て、アウクスブルクの和議（1555）で諸侯がカトリックとルター派を選ぶ権利（「領土の属する者に宗教も属する」）を認めた。
    - from: 1556
      to: 1617
      text: 帝位はオーストリアのハプスブルク家（フェルディナント1世の系統）が継ぎ、スペイン王家と分かれた。カルヴァン派が広がる一方、対抗宗教改革も進み、1608年にプロテスタント諸侯の同盟（ウニオン）、1609年にカトリック諸侯の連盟（リーガ）が結ばれて対立が深まった。
    - from: 1618
      to: 1647
      text: ボヘミアの反乱から三十年戦争が始まった。デンマーク・スウェーデン・フランスが介入してドイツ全土が戦場となり、人口の多くを失った。皇帝は復旧勅令（1629）とプラハの和約（1635）で帝国の統一を図ったが果たせなかった。
    - from: 1648
      to: 1662
      text: ウェストファリア条約で諸侯の領邦主権が認められ、帝国は300近い領邦の緩やかな連合体となった（「帝国の死亡証明書」）。
    - from: 1663
      to: 1739
      text: 帝国議会がレーゲンスブルクで常設化。皇帝はフランス（ルイ14世）とオスマン帝国の両面に対処し、帝国諸侯を率いて戦った。
    - from: 1740
      to: 1788
      text: プロイセンとオーストリアの対立（二元主義）が帝国の枠を揺るがす。1742–45年には一時バイエルン選帝侯が皇帝となった。
    - from: 1789
      to: 1806
      text: フランス革命戦争でライン左岸を失い、1803年の帝国代表者会議主要決議で聖界諸侯領と帝国都市の大半が消滅。1806年、ライン同盟の結成を受けてフランツ2世が帝冠を放棄し、帝国は解体した。
  source:
    - "https://ja.wikipedia.org/wiki/神聖ローマ皇帝"
    - "https://ja.wikipedia.org/wiki/神聖ローマ帝国"

- id: rhine_confederation
  name: ライン同盟
  color: "#c9c3e0"
  kind: 国家連合
  note: overlord（外枠）としてだけ使う枠。ナポレオンが「保護者」。1806年7月に16か国で結成し、のちザクセン・ヴェストファーレン王国など計39か国に拡大。1813年のライプツィヒの戦いの後に崩壊。
  rulers:
    - {name: ナポレオン1世, title: 保護者（フランス皇帝）, from: 1806, to: 1813, source: "https://ja.wikipedia.org/wiki/ナポレオン・ボナパルト"}
    - {name: カール・テオドール・フォン・ダールベルク, title: 首座大司教（同盟の議長）, from: 1806, to: 1813, source: "https://en.wikipedia.org/wiki/Karl_Theodor_von_Dalberg"}
  periods:
    - from: 1806
      to: 1813
      text: 南西ドイツ諸邦が帝国を離脱してナポレオンの保護下に結集。加盟国は兵力の提供を義務づけられ、ロシア遠征にも多数の兵が動員された。
  source: "https://ja.wikipedia.org/wiki/ライン同盟"

- id: german_confederation
  name: ドイツ連邦
  color: "#d6cfa8"
  kind: 国家連合
  note: overlord（外枠）としてだけ使う枠。ウィーン会議で1815年に成立し、1866年の普墺戦争で解体。オーストリアが議長国で、連邦議会はフランクフルトに置かれた。プロイセン・オーストリアは旧帝国領の部分だけが加盟。君主欄は議長国の君主（1848–49年は帝国摂政）。
  rulers:
    - {name: フランツ1世, title: オーストリア皇帝（連邦議会の議長国）, from: 1815, to: 1835, note: 神聖ローマ皇帝としてはフランツ2世。, source: "https://ja.wikipedia.org/wiki/フランツ2世_(神聖ローマ皇帝)"}
    - {name: フェルディナント1世, title: オーストリア皇帝（連邦議会の議長国）, from: 1835, to: 1848, note: 実権は宰相メッテルニヒにあった。, source: "https://ja.wikipedia.org/wiki/フェルディナント1世_(オーストリア皇帝)"}
    - {name: ヨハン大公, title: 帝国摂政（フランクフルト国民議会が置いた臨時中央権力）, from: 1848, to: 1849, note: 1848年6月に国民議会が選出。連邦議会は権限を臨時中央権力に移した。1849年12月に辞任し、連邦議会の再開（1850–51年）までは、オーストリアとプロイセンの代表による「連邦中央委員会」が権限を引き継いだ。, source: "https://en.wikipedia.org/wiki/Archduke_John_of_Austria"}
    - {name: フランツ・ヨーゼフ1世, title: オーストリア皇帝（連邦議会の議長国）, from: 1850, to: 1866, note: 連邦議会は1850–51年に再開された。, source: "https://ja.wikipedia.org/wiki/フランツ・ヨーゼフ1世"}
  periods:
    - from: 1815
      to: 1847
      text: オーストリア宰相メッテルニヒのもとで、自由主義と国民統一の運動を抑えこんだ（1819年のカールスバート決議による大学・出版の取り締まり）。経済面ではプロイセン主導のドイツ関税同盟（1834）が広がった。
    - from: 1848
      to: 1850
      text: 三月革命。フランクフルトのパウロ教会で国民議会が開かれ、統一と憲法が議論された（大ドイツ主義と小ドイツ主義）。プロイセン王が帝冠を拒んで挫折し、連邦は復活した。
    - from: 1851
      to: 1866
      text: オーストリアとプロイセンが主導権を争った。シュレースヴィヒ・ホルシュタインの処理をめぐって対立が深まり、1866年の普墺戦争（ドイツ戦争）で連邦は解体した。
  source: "https://ja.wikipedia.org/wiki/ドイツ連邦"

- id: other_hre
  name: その他のドイツ諸邦
  names:
    - {to: 1805, name: その他の帝国諸邦}
  short: 諸邦
  color: "#dcdcd2"
  kind: 領邦の集まり
  note: 地図を見やすくするため、小さな帝国諸侯領・帝国都市・帝国修道院領・帝国騎士領などをまとめたもの。ピースの中で最も大きな部分を占める領邦がこれらの場合に使う。1806年以降は、ライン同盟などに加わった小国（イーゼンブルク、ライエンなど）や、所属が整理中の地域を表す。
  periods:
    - from: 1453
      to: 1647
      text: 帝国都市（アウクスブルク・ウルム・フランクフルトなど）、帝国伯、帝国修道院、帝国騎士が入り組んでいた。シュヴァーベンの諸身分はシュヴァーベン同盟（1488–1534）を結んで大諸侯に対抗し、帝国都市の多くは宗教改革を受け入れた。
    - from: 1648
      to: 1802
      text: 南西ドイツ（シュヴァーベン・フランケン・ライン地方）は特に細分化され、数十の伯領、帝国都市、修道院領、帝国騎士の所領が入り組んでいた。
    - from: 1803
      to: 1806
      text: 帝国代表者会議主要決議（1803）で聖界領と帝国都市の大半が、ライン同盟結成（1806）で中小の諸侯・伯・帝国騎士の大半が、バイエルン・ヴュルテンベルク・バーデンなどに併合された（陪臣化）。
  source: "https://ja.wikipedia.org/wiki/帝国直属"

# ---------------------------------------------------------------- 世俗の大きな領邦

- id: bavaria
  name: バイエルン王国
  names:
    - {to: 1504, name: バイエルン＝ミュンヘン公国, short: バイエルン＝ミュンヘン, kind: 公国}
    - {to: 1622, name: バイエルン公国, short: バイエルン, kind: 公国}
    - {to: 1805, name: バイエルン選帝侯領, kind: 選帝侯領}
  short: バイエルン
  color: "#93d3d6"
  kind: 王国
  rulers:
    - {name: アルブレヒト3世, title: バイエルン＝ミュンヘン公, from: 1438, to: 1460, note: 若い頃に恋人アグネス・ベルナウアーを父に処刑された（1435）。, source: "https://ja.wikipedia.org/wiki/アルブレヒト3世_(バイエルン公)"}
    - {name: ヨハン4世, title: バイエルン＝ミュンヘン公, from: 1460, to: 1463, note: 弟ジギスムントと共同統治。, source: "https://en.wikipedia.org/wiki/John_IV,_Duke_of_Bavaria"}
    - {name: ジギスムント, title: バイエルン＝ミュンヘン公, from: 1460, to: 1467, note: 1467年に弟アルブレヒト4世に譲位。, source: "https://en.wikipedia.org/wiki/Sigismund,_Duke_of_Bavaria"}
    - {name: アルブレヒト4世（賢公）, title: バイエルン＝ミュンヘン公→バイエルン公（1505–）, from: 1465, to: 1508, note: 1465–67年は兄ジギスムントと共同統治。ランツフート継承戦争（1504–05）でバイエルンを再統一し、1506年に長子相続制を定めた。, source: "https://en.wikipedia.org/wiki/Albert_IV,_Duke_of_Bavaria"}
    - {name: ヴィルヘルム4世, title: バイエルン公, from: 1508, to: 1550, note: 1516–45年は弟ルートヴィヒ10世がランツフート・シュトラウビングを治める共同統治。1516年にビール純粋令を出した。, source: "https://en.wikipedia.org/wiki/William_IV,_Duke_of_Bavaria"}
    - {name: ルートヴィヒ10世, title: バイエルン公（ランツフート）, from: 1516, to: 1545, note: 兄ヴィルヘルム4世との共同統治。ランツフートにイタリア風のレジデンツを建てた。, source: "https://en.wikipedia.org/wiki/Louis_X,_Duke_of_Bavaria"}
    - {name: アルブレヒト5世, title: バイエルン公, from: 1550, to: 1579, note: 対抗宗教改革を進め、イエズス会を招いた。ミュンヘンに美術収集室（クンストカマー）を開き、ラッススを宮廷楽長とした。, source: "https://en.wikipedia.org/wiki/Albert_V,_Duke_of_Bavaria"}
    - {name: ヴィルヘルム5世（敬虔公）, title: バイエルン公, from: 1579, to: 1597, note: ミュンヘンにイエズス会の聖ミヒャエル教会を建てた。財政難のため退位。, source: "https://en.wikipedia.org/wiki/William_V,_Duke_of_Bavaria"}
    - {name: マクシミリアン1世, title: バイエルン公・選帝侯（1623–）, from: 1597, to: 1651, note: カトリック連盟（リーガ）の盟主。ティリーの率いる連盟軍で皇帝を助け、1623年にプファルツの選帝侯位を、1628年にオーバープファルツを得た。, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(バイエルン選帝侯)"}
    - {name: フェルディナント・マリア, title: バイエルン選帝侯, from: 1651, to: 1679, source: "https://en.wikipedia.org/wiki/Ferdinand_Maria,_Elector_of_Bavaria"}
    - {name: マクシミリアン2世エマヌエル, title: バイエルン選帝侯, from: 1679, to: 1726, note: 1706–1714年は帝国追放を受け、領国はオーストリアの占領下。1692–1706年はスペイン領ネーデルラント総督も兼ねた。, source: "https://en.wikipedia.org/wiki/Maximilian_II_Emanuel,_Elector_of_Bavaria"}
    - {name: カール・アルブレヒト（皇帝カール7世）, title: バイエルン選帝侯, from: 1726, to: 1745, source: "https://ja.wikipedia.org/wiki/カール7世_(神聖ローマ皇帝)"}
    - {name: マクシミリアン3世ヨーゼフ, title: バイエルン選帝侯, from: 1745, to: 1777, source: "https://en.wikipedia.org/wiki/Maximilian_III_Joseph,_Elector_of_Bavaria"}
    - {name: カール・テオドール, title: プファルツ＝バイエルン選帝侯, from: 1777, to: 1799, note: プファルツ選帝侯（1742–）がバイエルンを相続。, source: "https://en.wikipedia.org/wiki/Charles_Theodore,_Elector_of_Bavaria"}
    - {name: マクシミリアン4世ヨーゼフ（国王マクシミリアン1世）, title: バイエルン選帝侯→バイエルン王（1806–）, from: 1799, to: 1825, note: 宰相モンジュラが改革を主導。, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(バイエルン王)"}
    - {name: ルートヴィヒ1世, title: バイエルン王, from: 1825, to: 1848, note: 1848年、ローラ・モンテス事件と三月革命の中で退位。, source: "https://ja.wikipedia.org/wiki/ルートヴィヒ1世_(バイエルン王)"}
    - {name: マクシミリアン2世, title: バイエルン王, from: 1848, to: 1864, source: "https://ja.wikipedia.org/wiki/マクシミリアン2世_(バイエルン王)"}
    - {name: ルートヴィヒ2世, title: バイエルン王, from: 1864, to: 1886, note: 1886年に統治不能として廃位され、直後に急死。, source: "https://ja.wikipedia.org/wiki/ルートヴィヒ2世_(バイエルン王)"}
    - {name: オットー1世, title: バイエルン王, from: 1886, to: 1913, note: 精神の病のため、叔父ルイトポルト（1886–1912）とその子ルートヴィヒ（1912–13）が摂政として統治した。, source: "https://ja.wikipedia.org/wiki/オットー1世_(バイエルン王)"}
    - {name: ルートヴィヒ3世, title: バイエルン王, from: 1913, to: 1918, note: 1912–13年は摂政。1918年のドイツ革命で退位。, source: "https://ja.wikipedia.org/wiki/ルートヴィヒ3世_(バイエルン王)"}
  periods:
    - from: 1453
      to: 1502
      text: バイエルンはヴィッテルスバッハ家の分割相続で、ミュンヘン公国とランツフート公国（「富裕公」の豊かな国）に分かれていた。ミュンヘンのアルブレヒト4世は帝国都市レーゲンスブルクを一時併合した（1486–92）。
    - from: 1503
      to: 1549
      text: ランツフート家の断絶をめぐるランツフート継承戦争（1504–05）に勝ってバイエルンを再統一したが、ノイブルク（若プファルツ）をプファルツ家に、クーフシュタインなどをオーストリアに譲った。1506年に長子相続を定め、以後は分割されなかった。宗教改革ではカトリックを守った。
    - from: 1550
      to: 1617
      text: アルブレヒト5世・ヴィルヘルム5世のもとで対抗宗教改革の拠点となり、インゴルシュタット大学とイエズス会が中心となった。マクシミリアン1世は財政と軍制を立て直し、1609年にカトリック連盟（リーガ）を結成した。
    - from: 1618
      to: 1647
      text: 三十年戦争で皇帝を助け、白山の戦い（1620）の後にオーバープファルツを占領（1628年に正式に領有）、1623年にプファルツから選帝侯位を得た。1632年と1634年、1646–48年にはスウェーデン軍がバイエルンに侵入した。
    - from: 1648
      to: 1700
      text: ウェストファリア条約で選帝侯位とオーバープファルツの領有を確認された、カトリックの南ドイツ最大の世俗領邦。
    - from: 1701
      to: 1714
      text: スペイン継承戦争でフランス側につき、1704年のブレンハイム（ヘーヒシュテット）の戦いで敗北。選帝侯は帝国追放となり、領国はオーストリアに占領された。1714年のラシュタット・バーデン条約で回復。
    - from: 1715
      to: 1739
      text: 選帝侯の帰国後、豪華な宮廷と戦費で財政が悪化した。カール・アルブレヒトはハプスブルク家の遺領の相続をねらい、国事詔書（プラグマティッシェ・ザンクツィオン）の承認を拒んだ。
    - from: 1740
      to: 1745
      text: オーストリア継承戦争でカール・アルブレヒトが皇帝カール7世に選ばれたが、本国はオーストリア軍に占領された。1745年1月にカール7世が死去し、子のマクシミリアン3世ヨーゼフがフュッセンの和約でオーストリア継承の要求を放棄して、本国を回復した。
    - from: 1746
      to: 1776
      text: マクシミリアン3世ヨーゼフのもとで戦争を避けて国力の回復につとめ、バイエルン科学アカデミーの創設（1759年）など啓蒙改革を進めた。
    - from: 1777
      to: 1799
      text: バイエルン系ヴィッテルスバッハ家が断絶し、プファルツ選帝侯カール・テオドールが相続（プファルツ＝バイエルン）。オーストリアのバイエルン獲得の企てはバイエルン継承戦争（1778–79）と諸侯同盟（1785）で阻まれた。
    - from: 1800
      to: 1815
      text: ナポレオンと結んでフランケン・シュヴァーベンの聖界領・帝国都市を獲得し、1806年に王国となった。1813年のリート条約で連合国側に転じ、王国の領土を保った。
    - from: 1816
      to: 1847
      text: 1818年に憲法を制定（南ドイツの立憲君主国）。ルートヴィヒ1世はミュンヘンを芸術の都として整え、1835年にはニュルンベルク–フュルト間にドイツ最初の鉄道が開通した。王子オットーは1832年にギリシア王となった。
    - from: 1848
      to: 1865
      text: 三月革命の中でルートヴィヒ1世が退位。マクシミリアン2世は学問を保護し、オーストリアとプロイセンの間で中小国をまとめる「第三のドイツ」の立場をとった。
    - from: 1866
      to: 1870
      text: ルートヴィヒ2世の治世。普墺戦争でオーストリア側について敗れ、プロイセンと秘密の攻守同盟を結んだ。1870年の普仏戦争ではプロイセン側で参戦し、11月の条約でドイツ帝国への加盟を決めた。
    - from: 1871
      to: 1914
      text: ドイツ帝国の構成国。軍隊（平時の指揮権）・郵便・鉄道などに独自の権限（留保権）を保った。ルートヴィヒ2世がノイシュヴァンシュタイン城などの築城に没頭した後、1886年から摂政ルイトポルトの時代が続いた。
    - from: 1915
      to: 1918
      text: 第一次世界大戦ではバイエルン軍が西部戦線で戦った（皇太子ループレヒトが軍集団を指揮）。1918年11月7日、ミュンヘンで独立社会民主党のクルト・アイスナーらが革命を起こしてルートヴィヒ3世は逃れ、ドイツの諸王家で最初に王政が倒れた（バイエルン自由州）。
  source:
    - "https://ja.wikipedia.org/wiki/バイエルン選帝侯領"
    - "https://ja.wikipedia.org/wiki/バイエルン王国"
    - "https://de.wikipedia.org/wiki/Bayern-München"
    - "https://de.wikipedia.org/wiki/Herzogtum_Bayern"

- id: bavaria_landshut
  name: バイエルン＝ランツフート公国
  short: バイエルン＝ランツフート
  color: "#a8d4aa"
  kind: 公国
  note: ヴィッテルスバッハ家の分家領（1392–1503）。1447年にバイエルン＝インゴルシュタットを併せ、ニーダーバイエルンとオーバーバイエルン東部（ブルクハウゼン・インゴルシュタット）、ノイブルク、ハイデンハイムなどを持った。塩の取引（ライヒェンハル）と銀で富み、公は「富裕公」と呼ばれた。1503年にゲオルクが男子なく死に、ランツフート継承戦争の末にバイエルン＝ミュンヘンに併合された。
  rulers:
    - {name: ルートヴィヒ9世（富裕公）, title: バイエルン＝ランツフート公, from: 1450, to: 1479, note: 1472年にインゴルシュタット大学を創設。ギーンゲンの戦い（1462）でブランデンブルク辺境伯アルブレヒト・アキレスを破った。, source: "https://en.wikipedia.org/wiki/Louis_IX,_Duke_of_Bavaria"}
    - {name: ゲオルク（富裕公）, title: バイエルン＝ランツフート公, from: 1479, to: 1503, note: 1475年、ポーランド王女ヤドヴィガとの結婚式が「ランツフートの結婚式」として知られる。遺言で娘婿のプファルツのループレヒトに領地を残したことが継承戦争を招いた。, source: "https://en.wikipedia.org/wiki/George,_Duke_of_Bavaria"}
  periods:
    - from: 1453
      to: 1503
      text: ランツフートとブルクハウゼンを中心に栄えた、当時のドイツで最も豊かな領邦の一つ。1475年のランツフートの結婚式は空前の祝宴として伝えられる。
  source:
    - "https://de.wikipedia.org/wiki/Bayern-Landshut"
    - "https://ja.wikipedia.org/wiki/ランツフート継承戦争"

- id: palatinate
  name: プファルツ選帝侯領
  short: プファルツ
  color: "#9fb6d9"
  kind: 選帝侯領
  note: ハイデルベルク（1720年からマンハイム）を首都とするライン中流の選帝侯領（クアプファルツ）。1777年からバイエルンと同君連合となり、この地図ではバイエルンの色で示す。1648年より前は、オーバープファルツ（アンベルク）と、プファルツ家の分家領（モースバッハ＝ノイマルクト 1410–1499、ジンメルン、ラインのシュポンハイム共有分）もこの色で示す。1623–48年は選帝侯位をバイエルンに奪われ、領国は外国軍の占領下にあった。
  rulers:
    - {name: フリードリヒ1世（勝利公）, title: プファルツ選帝侯, from: 1451, to: 1476, note: 甥フィリップの後見人として1449年から統治し、1451年に選帝侯となった。ゼッケンハイムの戦い（1462）でバーデン・ヴュルテンベルクなどを破った。, source: "https://en.wikipedia.org/wiki/Frederick_I,_Elector_Palatine"}
    - {name: フィリップ（正直公）, title: プファルツ選帝侯, from: 1476, to: 1508, note: ランツフート継承戦争（1504–05）に敗れ、領地の一部をヴュルテンベルク・ヘッセンなどに失った。, source: "https://en.wikipedia.org/wiki/Philip,_Elector_Palatine"}
    - {name: ルートヴィヒ5世, title: プファルツ選帝侯, from: 1508, to: 1544, source: "https://en.wikipedia.org/wiki/Louis_V,_Elector_Palatine"}
    - {name: フリードリヒ2世, title: プファルツ選帝侯, from: 1544, to: 1556, source: "https://en.wikipedia.org/wiki/Frederick_II,_Elector_Palatine"}
    - {name: オットハインリヒ, title: プファルツ選帝侯, from: 1556, to: 1559, note: ノイブルク公から選帝侯を継ぎ、ルター派を導入。ハイデルベルク城のオットハインリヒ館を建てた。, source: "https://en.wikipedia.org/wiki/Otto_Henry,_Elector_Palatine"}
    - {name: フリードリヒ3世（敬虔公）, title: プファルツ選帝侯, from: 1559, to: 1576, note: ジンメルン系。カルヴァン派に改宗し、ハイデルベルク信仰問答（1563）を定めた。, source: "https://en.wikipedia.org/wiki/Frederick_III,_Elector_Palatine"}
    - {name: ルートヴィヒ6世, title: プファルツ選帝侯, from: 1576, to: 1583, note: ルター派に戻した。, source: "https://en.wikipedia.org/wiki/Louis_VI,_Elector_Palatine"}
    - {name: フリードリヒ4世, title: プファルツ選帝侯, from: 1583, to: 1610, note: 1592年まで叔父ヨハン・カジミールが摂政（カルヴァン派に戻す）。1606年にマンハイムを建設し、1608年にプロテスタント同盟（ウニオン）の盟主となった。, source: "https://en.wikipedia.org/wiki/Frederick_IV,_Elector_Palatine"}
    - {name: フリードリヒ5世, title: プファルツ選帝侯・ボヘミア王（1619–20）, from: 1610, to: 1632, note: 「冬王」。ボヘミア王に選ばれたが白山の戦い（1620）に敗れ、1621年に帝国追放、1623年に選帝侯位を奪われた。オランダに亡命し1632年に死去。妃はイングランド王ジェームズ1世の娘エリザベス。, source: "https://ja.wikipedia.org/wiki/フリードリヒ5世_(プファルツ選帝侯)"}
    - {name: カール1世ルートヴィヒ, title: プファルツ選帝侯, from: 1632, to: 1680, note: 1648年まで亡命中の名目上の継承者。ウェストファリア条約で復位（第8の選帝侯位）。, source: "https://en.wikipedia.org/wiki/Charles_I_Louis,_Elector_Palatine"}
    - {name: カール2世, title: プファルツ選帝侯, from: 1680, to: 1685, note: ジンメルン系の断絶。, source: "https://en.wikipedia.org/wiki/Charles_II,_Elector_Palatine"}
    - {name: フィリップ・ヴィルヘルム, title: プファルツ選帝侯, from: 1685, to: 1690, note: ノイブルク系。, source: "https://en.wikipedia.org/wiki/Philip_William,_Elector_Palatine"}
    - {name: ヨハン・ヴィルヘルム, title: プファルツ選帝侯, from: 1690, to: 1716, note: デュッセルドルフに宮廷を置いた。1708–14年はオーバープファルツも領有。, source: "https://en.wikipedia.org/wiki/John_William,_Elector_Palatine"}
    - {name: カール3世フィリップ, title: プファルツ選帝侯, from: 1716, to: 1742, source: "https://en.wikipedia.org/wiki/Charles_III_Philip,_Elector_Palatine"}
    - {name: カール・テオドール, title: プファルツ選帝侯, from: 1742, to: 1799, note: 1777年からバイエルン選帝侯を兼ねる。, source: "https://en.wikipedia.org/wiki/Charles_Theodore,_Elector_of_Bavaria"}
    - {name: マクシミリアン4世ヨーゼフ, title: プファルツ＝バイエルン選帝侯, from: 1799, to: 1803, note: 1803年に右岸プファルツはバーデンなどへ。, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(バイエルン王)"}
  periods:
    - from: 1453
      to: 1504
      text: フリードリヒ1世（勝利公）のもとで勢力を広げ、南西ドイツで最も有力な世俗諸侯となった。ハイデルベルク大学（1386年創立）は人文主義の中心の一つ。ランツフート継承戦争（1504–05）に敗れて勢いを失った。
    - from: 1505
      to: 1558
      text: ルートヴィヒ5世はドイツ農民戦争で農民軍を鎮圧した。オットハインリヒ（1556–59）がルター派を導入した。
    - from: 1559
      to: 1618
      text: ジンメルン系のフリードリヒ3世がカルヴァン派に改宗し、ハイデルベルク信仰問答（1563）を定めた。以後、帝国のカルヴァン派の中心として、プロテスタント同盟（ウニオン、1608）を率いた。
    - from: 1619
      to: 1647
      text: フリードリヒ5世がボヘミア王を引き受けて敗れ（冬王）、ライン左岸はスペイン軍（1620–）、右岸とオーバープファルツはバイエルン軍（1621–22）に占領された。1623年に選帝侯位はバイエルンへ移り、ハイデルベルクの図書館（パラティーナ文庫）はローマ教皇に贈られた。1632年前後にはスウェーデン軍が一時取り戻した。
    - from: 1648
      to: 1684
      text: 三十年戦争で荒廃した国土の復興期。ウェストファリア条約で、オーバープファルツをバイエルンに残したまま、新設の第8選帝侯位とともに下プファルツを回復した。
    - from: 1685
      to: 1697
      text: ジンメルン系が断絶してカトリックのノイブルク系が継承。ルイ14世が弟の妃（リーゼロッテ）の相続権を口実に侵攻し（プファルツ継承戦争）、ハイデルベルクなどが焼き払われた。
    - from: 1698
      to: 1776
      text: ノイブルク系・ズルツバッハ系のもとで復興。1720年に首都をマンハイムに移し、カール・テオドールの宮廷はマンハイム楽派などで知られた。
  source: "https://ja.wikipedia.org/wiki/プファルツ選帝侯領"

- id: palatinate_neuburg
  name: プファルツ＝ノイブルク公国
  short: ノイブルク
  color: "#a6d6c8"
  kind: 公国
  note: ドナウ河畔ノイブルクを中心とするヴィッテルスバッハ家の分家領（ユンゲ・プファルツ、若プファルツ）。ランツフート継承戦争の和解（ケルンの裁定、1505）で、プファルツのループレヒトの遺児のために作られた。1614年からユーリヒ＝ベルクも領有した。1685年にプファルツ選帝侯位を継いだため、以後はプファルツの色で示す。
  rulers:
    - {name: オットハインリヒ, title: プファルツ＝ノイブルク公, from: 1505, to: 1556, note: 1522年まで叔父フリードリヒ（のちの選帝侯フリードリヒ2世）が後見。1541年まで弟フィリップと共同統治。1542年にルター派を導入し、シュマルカルデン戦争で領国を皇帝軍に占領された（1546–52）。1556年にプファルツ選帝侯となった。, source: "https://en.wikipedia.org/wiki/Otto_Henry,_Elector_Palatine"}
    - {name: ヴォルフガング, title: プファルツ＝ノイブルク公（ツヴァイブリュッケン公）, from: 1557, to: 1569, source: "https://en.wikipedia.org/wiki/Wolfgang,_Count_Palatine_of_Zweibrücken"}
    - {name: フィリップ・ルートヴィヒ, title: プファルツ＝ノイブルク公, from: 1569, to: 1614, note: ユーリヒ＝クレーフェ継承問題でブランデンブルクと争った。, source: "https://en.wikipedia.org/wiki/Philip_Louis,_Count_Palatine_of_Neuburg"}
    - {name: ヴォルフガング・ヴィルヘルム, title: プファルツ＝ノイブルク公, from: 1614, to: 1653, note: カトリックに改宗し（1613）、クサンテン条約（1614）でユーリヒ・ベルクを得た。, source: "https://en.wikipedia.org/wiki/Wolfgang_William,_Count_Palatine_of_Neuburg"}
    - {name: フィリップ・ヴィルヘルム, title: プファルツ＝ノイブルク公, from: 1653, to: 1690, note: 1685年からプファルツ選帝侯。, source: "https://en.wikipedia.org/wiki/Philip_William,_Elector_Palatine"}
  periods:
    - from: 1505
      to: 1613
      text: ドナウ河畔のノイブルクと、オーバープファルツ・フランケンに散らばる領地からなる小公国。オットハインリヒ以来ルター派で、1557年からツヴァイブリュッケン系の公が治めた。
    - from: 1614
      to: 1647
      text: ヴォルフガング・ヴィルヘルムがカトリックに改宗し、ユーリヒ・ベルク（デュッセルドルフ）を相続した。領国はカトリックに戻された。
  source: "https://de.wikipedia.org/wiki/Pfalz-Neuburg"

- id: zweibrucken
  name: プファルツ＝ツヴァイブリュッケン公国
  short: ツヴァイブリュッケン
  color: "#b9cfe0"
  kind: 公国
  note: ヴィッテルスバッハ家の分家領（1444年にプファルツ＝ジンメルン＝ツヴァイブリュッケンから分かれ、ヴェルデンツ伯領も継いだ）。1681–1718年はスウェーデン王が公を兼ねた（この期間は sweden の色）。1799年にマクシミリアン・ヨーゼフがバイエルン選帝侯を継いだ。
  rulers:
    - {name: ルートヴィヒ1世（黒公）, title: プファルツ＝ツヴァイブリュッケン公, from: 1444, to: 1489, note: プファルツ選帝侯フリードリヒ1世と争った。, source: "https://en.wikipedia.org/wiki/Louis_I,_Count_Palatine_of_Zweibrücken"}
    - {name: カスパル, title: プファルツ＝ツヴァイブリュッケン公, from: 1489, to: 1490, note: 弟アレクサンダーに廃され幽閉された。, source: "https://en.wikipedia.org/wiki/Caspar,_Count_Palatine_of_Zweibrücken"}
    - {name: アレクサンダー, title: プファルツ＝ツヴァイブリュッケン公, from: 1489, to: 1514, source: "https://en.wikipedia.org/wiki/Alexander,_Count_Palatine_of_Zweibrücken"}
    - {name: ルートヴィヒ2世, title: プファルツ＝ツヴァイブリュッケン公, from: 1514, to: 1532, source: "https://en.wikipedia.org/wiki/Louis_II,_Count_Palatine_of_Zweibrücken"}
    - {name: ヴォルフガング, title: プファルツ＝ツヴァイブリュッケン公, from: 1532, to: 1569, note: 1543年まで叔父ループレヒトが後見。1557年からノイブルク公を兼ね、ユグノー戦争でユグノー側に出兵した。, source: "https://en.wikipedia.org/wiki/Wolfgang,_Count_Palatine_of_Zweibrücken"}
    - {name: ヨハン1世, title: プファルツ＝ツヴァイブリュッケン公, from: 1569, to: 1604, note: カルヴァン派を導入。, source: "https://en.wikipedia.org/wiki/John_I,_Count_Palatine_of_Zweibrücken"}
    - {name: ヨハン2世, title: プファルツ＝ツヴァイブリュッケン公, from: 1604, to: 1635, note: 1632–35年は兄弟とともに三十年戦争の戦火を逃れてメッスに移った。, source: "https://en.wikipedia.org/wiki/John_II,_Count_Palatine_of_Zweibrücken"}
    - {name: フリードリヒ, title: ツヴァイブリュッケン公, from: 1635, to: 1661, source: "https://en.wikipedia.org/wiki/Frederick,_Count_Palatine_of_Zweibrücken"}
    - {name: フリードリヒ・ルートヴィヒ, title: ツヴァイブリュッケン公, from: 1661, to: 1681, note: ランツベルク系。要確認, source: "https://en.wikipedia.org/wiki/Frederick_Louis,_Count_Palatine_of_Zweibrücken"}
    - {name: カール11世（スウェーデン王）, title: ツヴァイブリュッケン公, from: 1681, to: 1697, source: "https://ja.wikipedia.org/wiki/カール11世_(スウェーデン王)"}
    - {name: カール12世（スウェーデン王）, title: ツヴァイブリュッケン公, from: 1697, to: 1718, source: "https://ja.wikipedia.org/wiki/カール12世_(スウェーデン王)"}
    - {name: グスタフ・サムエル・レオポルト, title: ツヴァイブリュッケン公, from: 1718, to: 1731, source: "https://en.wikipedia.org/wiki/Gustav_Samuel_Leopold,_Count_Palatine_of_Zweibrücken"}
    - {name: クリスティアン3世, title: ツヴァイブリュッケン公, from: 1731, to: 1735, source: "https://en.wikipedia.org/wiki/Christian_III,_Count_Palatine_of_Zweibrücken"}
    - {name: クリスティアン4世, title: ツヴァイブリュッケン公, from: 1735, to: 1775, source: "https://en.wikipedia.org/wiki/Christian_IV,_Count_Palatine_of_Zweibrücken"}
    - {name: カール2世アウグスト, title: ツヴァイブリュッケン公, from: 1775, to: 1795, source: "https://en.wikipedia.org/wiki/Charles_II_August,_Duke_of_Zweibrücken"}
    - {name: マクシミリアン・ヨーゼフ, title: ツヴァイブリュッケン公, from: 1795, to: 1799, note: 1799年にバイエルン選帝侯。領国はすでにフランスの占領下。, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(バイエルン王)"}
  periods:
    - from: 1453
      to: 1568
      text: ツヴァイブリュッケンとヴェルデンツ（クーゼル）を中心とする西プファルツの公国。ヴォルフガング公が1533年にルター派を導入し、1557年にはノイブルク公国も継いだ。
    - from: 1569
      to: 1647
      text: ノイブルク系と分かれ、カルヴァン派の公国となった。三十年戦争では1630年代に皇帝軍・ロレーヌ軍に荒らされ、人口の大半を失った。
    - from: 1648
      to: 1697
      text: 1680年代はルイ14世の「再統合（レユニオン）」政策でフランスに併合されたが、ライスワイク条約（1697）で回復。
    - from: 1698
      to: 1717
      text: スウェーデン王カール12世が公を兼ねた（同君連合）。
    - from: 1718
      to: 1730
      text: カール12世の死後、プファルツ＝クレーブルク系のグスタフ・サムエル・レオポルトが継いだ。
    - from: 1731
      to: 1797
      text: ビルケンフェルト系の公のもとで存続。この家系から1799年にバイエルン選帝侯（のちの初代バイエルン王）が出た。
    - from: 1798
      to: 1815
      text: 1797年からライン左岸の公国はフランスの支配下に入り、1801年のリュネヴィル条約で正式にフランス領（モン＝トネール県・サール県）となった。
  source: "https://de.wikipedia.org/wiki/Pfalz-Zweibrücken"

- id: wurttemberg
  name: ヴュルテンベルク王国
  names:
    - {to: 1481, name: ヴュルテンベルク＝シュトゥットガルト伯領, short: ヴュルテンベルク, kind: 伯領}
    - {to: 1494, name: ヴュルテンベルク伯領, kind: 伯領}
    - {to: 1802, name: ヴュルテンベルク公国, kind: 公国}
    - {to: 1805, name: ヴュルテンベルク選帝侯国, kind: 選帝侯国}
  short: ヴュルテンベルク
  color: "#e8c39e"
  kind: 王国
  note: 1442年のニュルティンゲン条約で、シュトゥットガルト系とウラハ系（wurttemberg_urach）に分かれ、1482年のミュンジンゲン条約で再統一された。1520–34年はハプスブルク家（オーストリア）の支配下、1634–38年は皇帝軍の占領下。
  rulers:
    - {name: ウルリヒ5世（多くに愛された伯）, title: ヴュルテンベルク＝シュトゥットガルト伯, from: 1433, to: 1480, note: 1441年まで兄弟と共同統治。ゼッケンハイムの戦い（1462）でプファルツの捕虜となった。, source: "https://en.wikipedia.org/wiki/Ulrich_V,_Count_of_Württemberg"}
    - {name: エーバーハルト6世, title: ヴュルテンベルク＝シュトゥットガルト伯, from: 1480, to: 1482, note: 1496–98年に公エーバーハルト2世。, source: "https://en.wikipedia.org/wiki/Eberhard_II,_Duke_of_Württemberg"}
    - {name: エーバーハルト5世（髭公）, title: ヴュルテンベルク伯→初代ヴュルテンベルク公（1495）, from: 1482, to: 1496, note: 1457年からウラハ伯。1477年にテュービンゲン大学を創設し、1482年に全ヴュルテンベルクを統一。1495年のヴォルムス帝国議会で公に昇格した。, source: "https://en.wikipedia.org/wiki/Eberhard_I,_Duke_of_Württemberg"}
    - {name: エーバーハルト2世, title: ヴュルテンベルク公, from: 1496, to: 1498, note: 等族と皇帝に廃された。, source: "https://en.wikipedia.org/wiki/Eberhard_II,_Duke_of_Württemberg"}
    - {name: ウルリヒ, title: ヴュルテンベルク公, from: 1498, to: 1550, note: 1503年まで後見。1514年の「貧しいコンラート」の反乱の後、テュービンゲン条約で等族に権利を認めた。1519年に帝国都市ロイトリンゲンを奪ってシュヴァーベン同盟に追われ、1534年にヘッセン方伯フィリップの助けで復帰し、ルター派を導入した。, source: "https://en.wikipedia.org/wiki/Ulrich,_Duke_of_Württemberg"}
    - {name: クリストフ, title: ヴュルテンベルク公, from: 1550, to: 1568, note: 大教会規定（1559）で領邦教会を整えた。, source: "https://en.wikipedia.org/wiki/Christoph,_Duke_of_Württemberg"}
    - {name: ルートヴィヒ, title: ヴュルテンベルク公, from: 1568, to: 1593, source: "https://en.wikipedia.org/wiki/Louis,_Duke_of_Württemberg"}
    - {name: フリードリヒ1世, title: ヴュルテンベルク公, from: 1593, to: 1608, note: モンベリアール系。1599年のプラハ条約でオーストリアの後封（陪臣の封）の地位から解放され、フロイデンシュタットを建設した。, source: "https://en.wikipedia.org/wiki/Frederick_I,_Duke_of_Württemberg"}
    - {name: ヨハン・フリードリヒ, title: ヴュルテンベルク公, from: 1608, to: 1628, source: "https://en.wikipedia.org/wiki/John_Frederick,_Duke_of_Württemberg"}
    - {name: エーバーハルト3世, title: ヴュルテンベルク公, from: 1628, to: 1674, note: 1633年まで叔父たちが摂政。ネルトリンゲンの戦い（1634）の後シュトラースブルクに亡命し、1638年に帰国した。, source: "https://en.wikipedia.org/wiki/Eberhard_III,_Duke_of_Württemberg"}
    - {name: ヴィルヘルム・ルートヴィヒ, title: ヴュルテンベルク公, from: 1674, to: 1677, source: "https://en.wikipedia.org/wiki/William_Louis,_Duke_of_Württemberg"}
    - {name: エーバーハルト・ルートヴィヒ, title: ヴュルテンベルク公, from: 1677, to: 1733, note: 1693年まで叔父フリードリヒ・カールが摂政。ルートヴィヒスブルク宮殿を建設。, source: "https://en.wikipedia.org/wiki/Eberhard_Louis,_Duke_of_Württemberg"}
    - {name: カール・アレクサンダー, title: ヴュルテンベルク公, from: 1733, to: 1737, source: "https://en.wikipedia.org/wiki/Charles_Alexander,_Duke_of_Württemberg"}
    - {name: カール・オイゲン, title: ヴュルテンベルク公, from: 1737, to: 1793, note: 1744年まで摂政政治。, source: "https://en.wikipedia.org/wiki/Charles_Eugene,_Duke_of_Württemberg"}
    - {name: ルートヴィヒ・オイゲン, title: ヴュルテンベルク公, from: 1793, to: 1795, source: "https://en.wikipedia.org/wiki/Louis_Eugene,_Duke_of_Württemberg"}
    - {name: フリードリヒ・オイゲン, title: ヴュルテンベルク公, from: 1795, to: 1797, source: "https://en.wikipedia.org/wiki/Frederick_II_Eugene,_Duke_of_Württemberg"}
    - {name: フリードリヒ1世, title: ヴュルテンベルク公→選帝侯（1803）→国王（1806）, from: 1797, to: 1816, source: "https://ja.wikipedia.org/wiki/フリードリヒ1世_(ヴュルテンベルク王)"}
    - {name: ヴィルヘルム1世, title: ヴュルテンベルク王, from: 1816, to: 1864, note: 1819年に憲法を制定。, source: "https://ja.wikipedia.org/wiki/ヴィルヘルム1世_(ヴュルテンベルク王)"}
    - {name: カール1世, title: ヴュルテンベルク王, from: 1864, to: 1891, source: "https://ja.wikipedia.org/wiki/カール1世_(ヴュルテンベルク王)"}
    - {name: ヴィルヘルム2世, title: ヴュルテンベルク王, from: 1891, to: 1918, note: 1918年のドイツ革命で退位。, source: "https://ja.wikipedia.org/wiki/ヴィルヘルム2世_(ヴュルテンベルク王)"}
  periods:
    - from: 1453
      to: 1495
      text: シュトゥットガルト系とウラハ系に分かれていたが、エーバーハルト髭公が1482年に統一し、1495年に公国に昇格した。テュービンゲン大学（1477）が置かれた。
    - from: 1496
      to: 1533
      text: ウルリヒ公の暴政に対して農民の「貧しいコンラート」の反乱（1514）が起こり、テュービンゲン条約で等族（領邦議会）が課税の承認権を得た。1519年にウルリヒはシュヴァーベン同盟に追われ、1520年から国はオーストリア（カール5世・フェルディナント）の支配下に入った。
    - from: 1534
      to: 1617
      text: ラウフェンの戦い（1534）でウルリヒが復帰し、ルター派を導入した（オーストリアの後封となるカーダン条約、1599年に解消）。クリストフ公の大教会規定で、ルター派の模範的な領邦教会が整えられた。
    - from: 1618
      to: 1647
      text: 三十年戦争ではネルトリンゲンの戦い（1634）の後、皇帝軍に占領されて公は亡命し、略奪と疫病で人口の半分以上を失った。1638年に公が帰国した。
    - from: 1648
      to: 1732
      text: シュトゥットガルトを首都とするシュヴァーベン最大の世俗領邦。プロテスタントで、領邦議会（等族）の力が強かった。
    - from: 1733
      to: 1796
      text: カトリックに改宗した公（カール・アレクサンダー、カール・オイゲン）と、プロテスタントの等族が対立。カール・オイゲンのカール学院からはシラーが出た。
    - from: 1797
      to: 1815
      text: フリードリヒ1世がナポレオンと結び、帝国都市・修道院領・前方オーストリア領を併合して領土をほぼ倍にした。1806年に王国となり、1813年に連合国側に転じた。
    - from: 1816
      to: 1863
      text: ヴィルヘルム1世が1819年に国王と議会の合意による憲法を定めた。飢饉（1816–17）の後、農業改革や農業学校（ホーエンハイム）の設立に努めた。
    - from: 1864
      to: 1870
      text: 普墺戦争でオーストリア側について敗れ、プロイセンと攻守同盟を結んだ。1870年の普仏戦争に参戦し、ドイツ帝国に加わった。
    - from: 1871
      to: 1914
      text: ドイツ帝国の構成国。独自の軍・郵便・鉄道を保った。シュトゥットガルト周辺でダイムラー、ボッシュなどの機械・自動車工業が発達した。
    - from: 1915
      to: 1918
      text: 第一次世界大戦に参戦。1918年11月の革命でヴィルヘルム2世は退位し（11月30日）、ヴュルテンベルク自由人民州となった。
  source:
    - "https://ja.wikipedia.org/wiki/ヴュルテンベルク公国"
    - "https://ja.wikipedia.org/wiki/ヴュルテンベルク王国"
    - "https://de.wikipedia.org/wiki/Grafschaft_Württemberg"

- id: wurttemberg_urach
  name: ヴュルテンベルク＝ウラハ伯領
  short: ヴュルテンベルク＝ウラハ
  color: "#bad19e"
  kind: 伯領
  note: 1442年のニュルティンゲン条約で分かれたヴュルテンベルク伯領の西半分（ウラハ・テュービンゲン・カルフ・バーリンゲンなど）。1482年のミュンジンゲン条約でエーバーハルト髭公のもとに再統一された（以後は wurttemberg）。
  rulers:
    - {name: ルートヴィヒ2世, title: ヴュルテンベルク＝ウラハ伯, from: 1450, to: 1457, source: "https://en.wikipedia.org/wiki/Louis_II,_Count_of_Württemberg-Urach"}
    - {name: エーバーハルト5世（髭公）, title: ヴュルテンベルク＝ウラハ伯, from: 1457, to: 1482, note: 1477年にテュービンゲン大学を創設。, source: "https://en.wikipedia.org/wiki/Eberhard_I,_Duke_of_Württemberg"}
  source: "https://de.wikipedia.org/wiki/Württemberg-Urach"

- id: baden
  name: バーデン大公国
  names:
    - {to: 1534, name: バーデン辺境伯領, kind: 辺境伯領}
    - {to: 1564, name: バーデン＝プフォルツハイム辺境伯領, short: バーデン＝プフォルツハイム, kind: 辺境伯領}
    - {to: 1770, name: バーデン＝ドゥルラハ辺境伯領, kind: 辺境伯領}
    - {to: 1802, name: バーデン辺境伯領, kind: 辺境伯領}
    - {to: 1805, name: バーデン選帝侯国, kind: 選帝侯国}
  short: バーデン
  color: "#f0dc8c"
  kind: 大公国
  note: 1535年までは統一されたバーデン辺境伯領。1535年にバーデン＝バーデン（baden_baden）とバーデン＝プフォルツハイム（1565年からドゥルラハ）に分かれ、この政体は後者を表す。1594–1622年はバーデン＝バーデンも占領していた（オーバーバーデン占領）。
  rulers:
    - {name: カール1世, title: バーデン辺境伯, from: 1453, to: 1475, note: ゼッケンハイムの戦い（1462）でプファルツの捕虜となり、領地の一部を譲った。, source: "https://en.wikipedia.org/wiki/Charles_I,_Margrave_of_Baden-Baden"}
    - {name: クリストフ1世, title: バーデン辺境伯, from: 1475, to: 1515, note: 1503年にハッハベルク＝ザウゼンベルク家の領地（レッテルン）を継いだ。1515年に引退。, source: "https://en.wikipedia.org/wiki/Christoph_I,_Margrave_of_Baden-Baden"}
    - {name: フィリップ1世, title: バーデン辺境伯, from: 1515, to: 1533, note: 兄弟ベルンハルト3世・エルンストと分けて治めた。, source: "https://en.wikipedia.org/wiki/Philip_I,_Margrave_of_Baden-Baden"}
    - {name: エルンスト, title: バーデン＝プフォルツハイム辺境伯, from: 1533, to: 1552, note: 1535年に兄ベルンハルト3世と領地を分けた。, source: "https://en.wikipedia.org/wiki/Ernest,_Margrave_of_Baden-Durlach"}
    - {name: カール2世, title: バーデン＝ドゥルラハ辺境伯, from: 1552, to: 1577, note: 1556年にルター派を導入し、1565年にドゥルラハへ移った。, source: "https://en.wikipedia.org/wiki/Charles_II,_Margrave_of_Baden-Durlach"}
    - {name: エルンスト・フリードリヒ, title: バーデン＝ドゥルラハ辺境伯, from: 1577, to: 1604, note: 1584年まで後見。弟たち（ハッハベルクのヤーコプ3世、ザウゼンベルクのゲオルク・フリードリヒ）と分けて治め、1594年にバーデン＝バーデンを占領した。カルヴァン派に改宗。, source: "https://en.wikipedia.org/wiki/Ernest_Frederick,_Margrave_of_Baden-Durlach"}
    - {name: ゲオルク・フリードリヒ, title: バーデン＝ドゥルラハ辺境伯, from: 1604, to: 1622, note: プロテスタント同盟に加わり、ヴィンプフェンの戦い（1622）でティリーに敗れた（戦いの前に子に譲位）。, source: "https://en.wikipedia.org/wiki/George_Frederick,_Margrave_of_Baden-Durlach"}
    - {name: フリードリヒ5世, title: バーデン＝ドゥルラハ辺境伯, from: 1622, to: 1659, source: "https://en.wikipedia.org/wiki/Frederick_V,_Margrave_of_Baden-Durlach"}
    - {name: フリードリヒ6世, title: バーデン＝ドゥルラハ辺境伯, from: 1659, to: 1677, source: "https://en.wikipedia.org/wiki/Frederick_VI,_Margrave_of_Baden-Durlach"}
    - {name: フリードリヒ7世マグヌス, title: バーデン＝ドゥルラハ辺境伯, from: 1677, to: 1709, source: "https://en.wikipedia.org/wiki/Frederick_VII_Magnus,_Margrave_of_Baden-Durlach"}
    - {name: カール3世ヴィルヘルム, title: バーデン＝ドゥルラハ辺境伯, from: 1709, to: 1738, note: 1715年にカールスルーエを建設。, source: "https://en.wikipedia.org/wiki/Charles_III_William,_Margrave_of_Baden-Durlach"}
    - {name: カール・フリードリヒ, title: 辺境伯→選帝侯（1803）→大公（1806）, from: 1738, to: 1811, note: 1771年にバーデン＝バーデンを相続して全バーデンを統一。啓蒙専制君主として知られる。, source: "https://en.wikipedia.org/wiki/Charles_Frederick,_Grand_Duke_of_Baden"}
    - {name: カール, title: バーデン大公, from: 1811, to: 1818, source: "https://en.wikipedia.org/wiki/Charles,_Grand_Duke_of_Baden"}
    - {name: ルートヴィヒ1世, title: バーデン大公, from: 1818, to: 1830, source: "https://en.wikipedia.org/wiki/Louis_I,_Grand_Duke_of_Baden"}
    - {name: レオポルト, title: バーデン大公, from: 1830, to: 1852, note: 1849年の革命で一時国外に逃れた。, source: "https://en.wikipedia.org/wiki/Leopold,_Grand_Duke_of_Baden"}
    - {name: ルートヴィヒ2世, title: バーデン大公, from: 1852, to: 1856, note: 病のため弟フリードリヒが摂政。名目上は1858年の死まで大公。, source: "https://en.wikipedia.org/wiki/Louis_II,_Grand_Duke_of_Baden"}
    - {name: フリードリヒ1世, title: バーデン大公, from: 1856, to: 1907, note: 1852年から摂政、1856年に大公の称号をとる。妃はヴィルヘルム1世の娘ルイーゼ。, source: "https://en.wikipedia.org/wiki/Frederick_I,_Grand_Duke_of_Baden"}
    - {name: フリードリヒ2世, title: バーデン大公, from: 1907, to: 1918, note: 1918年のドイツ革命で退位。, source: "https://en.wikipedia.org/wiki/Frederick_II,_Grand_Duke_of_Baden"}
  periods:
    - from: 1453
      to: 1534
      text: ライン上流の右岸、黒い森の北部（バーデン、プフォルツハイム）と南部（ハッハベルク、1503年からレッテルン）を持つツェーリンゲン家の辺境伯領。ゼッケンハイムの戦い（1462）でプファルツに敗れた。
    - from: 1535
      to: 1647
      text: 1535年に二つに分かれた。プフォルツハイム（ドゥルラハ）系は1556年にルター派を導入し、1594年からカトリックのバーデン＝バーデン系の領地を占領した（オーバーバーデン占領）。ヴィンプフェンの戦い（1622）で敗れてバーデン＝バーデンを返し、ネルトリンゲンの戦い（1634）の後は一時領国を失った。
    - from: 1648
      to: 1770
      text: プロテスタントのバーデン＝ドゥルラハと、カトリックのバーデン＝バーデンに分かれていた。1715年に新首都カールスルーエを建設。
    - from: 1771
      to: 1802
      text: バーデン＝バーデン家の断絶で両バーデンが統一された。カール・フリードリヒは農奴制の廃止（1783）など啓蒙改革を進めた。
    - from: 1803
      to: 1815
      text: ナポレオンと結んで右岸プファルツ（ハイデルベルク・マンハイム）、司教領、前方オーストリア（ブライスガウ）などを獲得し、領土は4倍以上になった。1806年に大公国。
    - from: 1816
      to: 1847
      text: 1818年に南ドイツで最も自由主義的といわれる憲法を制定。議会では自由主義者（ロテック、ヴェルカーら）が活躍した。
    - from: 1848
      to: 1849
      text: 三月革命の中心地の一つ。1848年4月にヘッカーらが共和政を求めて蜂起し、1849年5月の革命で大公が国外に逃れた。プロイセン軍が鎮圧し、7月にラシュタット要塞が降伏した。
    - from: 1850
      to: 1870
      text: フリードリヒ1世のもとで自由主義の改革を進め、南ドイツで最も親プロイセンの国となった。1870年の普仏戦争に参戦し、北ドイツ連邦との条約でドイツ帝国に加わった。
    - from: 1871
      to: 1914
      text: ドイツ帝国の構成国。大公フリードリヒ1世は皇帝ヴィルヘルム1世の娘婿で、帝国の成立に協力した。
    - from: 1915
      to: 1918
      text: 第一次世界大戦に参戦。最後の帝国宰相マックス・フォン・バーデン（1918年10–11月）は大公家の出身で、11月9日に皇帝の退位を発表した。大公フリードリヒ2世も11月22日に退位し、バーデン共和国となった。
  source:
    - "https://ja.wikipedia.org/wiki/バーデン辺境伯領"
    - "https://ja.wikipedia.org/wiki/バーデン大公国"

- id: baden_baden
  name: バーデン＝バーデン辺境伯領
  short: バーデン＝バーデン
  color: "#e6cf7a"
  kind: 辺境伯領
  note: 1535年にバーデン辺境伯領から分かれたカトリックの系統（バーデン、ラシュタット、エッテリンゲン）。1594–1622年はバーデン＝ドゥルラハに占領されていた。
  rulers:
    - {name: ベルンハルト3世, title: バーデン＝バーデン辺境伯, from: 1535, to: 1536, source: "https://en.wikipedia.org/wiki/Bernhard_III,_Margrave_of_Baden-Baden"}
    - {name: フィリベルト, title: バーデン＝バーデン辺境伯, from: 1536, to: 1569, note: 1556年まで後見。フランスのユグノー戦争でカトリック側に従軍して戦死。, source: "https://en.wikipedia.org/wiki/Philibert,_Margrave_of_Baden-Baden"}
    - {name: フィリップ2世, title: バーデン＝バーデン辺境伯, from: 1569, to: 1588, note: バイエルン公の宮廷で育ち、領国をカトリックに戻した。, source: "https://en.wikipedia.org/wiki/Philip_II,_Margrave_of_Baden-Baden"}
    - {name: エドゥアルト・フォルトゥナトゥス, title: バーデン＝バーデン辺境伯, from: 1588, to: 1594, note: 浪費と借財で、1594年にバーデン＝ドゥルラハに領国を占領された（1600年死去）。, source: "https://en.wikipedia.org/wiki/Edward_Fortunatus,_Margrave_of_Baden-Baden"}
    - {name: ヴィルヘルム, title: バーデン＝バーデン辺境伯, from: 1622, to: 1677, source: "https://en.wikipedia.org/wiki/William,_Margrave_of_Baden-Baden"}
    - {name: ルートヴィヒ・ヴィルヘルム（「トルコのルイ」）, title: バーデン＝バーデン辺境伯, from: 1677, to: 1707, note: 対オスマン戦争・スペイン継承戦争の帝国軍司令官。ラシュタットに宮殿を建設。, source: "https://en.wikipedia.org/wiki/Louis_William,_Margrave_of_Baden-Baden"}
    - {name: ルートヴィヒ・ゲオルク, title: バーデン＝バーデン辺境伯, from: 1707, to: 1761, note: 1727年まで母ジビラ・アウグスタが摂政。, source: "https://en.wikipedia.org/wiki/Louis_George,_Margrave_of_Baden-Baden"}
    - {name: アウグスト・ゲオルク, title: バーデン＝バーデン辺境伯, from: 1761, to: 1771, source: "https://en.wikipedia.org/wiki/Augustus_George,_Margrave_of_Baden-Baden"}
  periods:
    - from: 1535
      to: 1647
      text: 1535年の分割でできたカトリックの辺境伯領。1594年から1622年まではプロテスタントのバーデン＝ドゥルラハに占領され、ヴィンプフェンの戦いの後、皇帝の裁定でエドゥアルトの子ヴィルヘルムに返された。
    - from: 1648
      to: 1770
      text: ラシュタット（1705年から首都）を中心とするカトリックの辺境伯領。1771年に断絶し、ドゥルラハ系が相続した。
  source: "https://de.wikipedia.org/wiki/Markgrafschaft_Baden-Baden"

- id: hesse_kassel
  name: ヘッセン選帝侯国
  names:
    - {to: 1457, name: ヘッセン方伯領, short: ヘッセン, kind: 方伯領}
    - {to: 1499, name: ヘッセン＝カッセル方伯領, kind: 方伯領}
    - {to: 1566, name: ヘッセン方伯領, short: ヘッセン, kind: 方伯領}
    - {to: 1802, name: ヘッセン＝カッセル方伯領, kind: 方伯領}
  short: ヘッセン＝カッセル
  color: "#c8b3d6"
  kind: 選帝侯国
  note: 1803年から選帝侯国（ヘッセン選帝侯国、クールヘッセン）。1567年より前は、ヘッセン方伯領の全体（1458–1500年はニーダーヘッセン＝カッセル系。オーバーヘッセンのマールブルク系は hesse_marburg）を表す。
  rulers:
    - {name: ルートヴィヒ1世（温和公）, title: ヘッセン方伯, from: 1413, to: 1458, note: 1450年にツィーゲンハイン伯領を併せた。, source: "https://en.wikipedia.org/wiki/Louis_I,_Landgrave_of_Hesse"}
    - {name: ルートヴィヒ2世, title: ヘッセン＝カッセル方伯, from: 1458, to: 1471, source: "https://en.wikipedia.org/wiki/Louis_II,_Landgrave_of_Lower_Hesse"}
    - {name: ヴィルヘルム1世, title: ヘッセン＝カッセル方伯, from: 1471, to: 1493, note: 1493年に精神の病で退位。, source: "https://en.wikipedia.org/wiki/William_I,_Landgrave_of_Lower_Hesse"}
    - {name: ヴィルヘルム2世, title: ヘッセン＝カッセル方伯→ヘッセン方伯（1500–）, from: 1493, to: 1509, note: 1500年にマールブルク系を継いでヘッセンを再統一した。, source: "https://en.wikipedia.org/wiki/William_II,_Landgrave_of_Hesse"}
    - {name: フィリップ1世（寛大伯）, title: ヘッセン方伯, from: 1509, to: 1567, note: 1518年まで母アンナが摂政。宗教改革を導入してマールブルク大学（1527、最初のプロテスタント大学）を創り、シュマルカルデン同盟を率いた。シュマルカルデン戦争に敗れて1547–52年は皇帝に幽閉された。遺言で領国を4人の子に分けた。, source: "https://ja.wikipedia.org/wiki/フィリップ1世_(ヘッセン方伯)"}
    - {name: ヴィルヘルム4世（賢公）, title: ヘッセン＝カッセル方伯, from: 1567, to: 1592, note: カッセルに天文台を作った。, source: "https://en.wikipedia.org/wiki/William_IV,_Landgrave_of_Hesse-Kassel"}
    - {name: モーリッツ（学識公）, title: ヘッセン＝カッセル方伯, from: 1592, to: 1627, note: 1605年にカルヴァン派を導入。マールブルクの相続でダルムシュタットと争い、1627年に退位した。, source: "https://en.wikipedia.org/wiki/Maurice,_Landgrave_of_Hesse-Kassel"}
    - {name: ヴィルヘルム5世, title: ヘッセン＝カッセル方伯, from: 1627, to: 1637, note: スウェーデンと同盟し、プラハの和約を拒んで東フリースラントに逃れた。, source: "https://en.wikipedia.org/wiki/William_V,_Landgrave_of_Hesse-Kassel"}
    - {name: ヴィルヘルム6世, title: ヘッセン＝カッセル方伯, from: 1637, to: 1663, note: 1650年まで母アマーリエ・エリーザベトが摂政。, source: "https://en.wikipedia.org/wiki/William_VI,_Landgrave_of_Hesse-Kassel"}
    - {name: ヴィルヘルム7世, title: ヘッセン＝カッセル方伯, from: 1663, to: 1670, source: "https://en.wikipedia.org/wiki/William_VII,_Landgrave_of_Hesse-Kassel"}
    - {name: カール, title: ヘッセン＝カッセル方伯, from: 1670, to: 1730, note: ユグノーを受け入れ、カッセルのヴィルヘルムスヘーエを整備。, source: "https://en.wikipedia.org/wiki/Charles_I,_Landgrave_of_Hesse-Kassel"}
    - {name: フリードリヒ1世, title: ヘッセン＝カッセル方伯, from: 1730, to: 1751, note: スウェーデン王（1720–51）を兼ね、方伯領は弟ヴィルヘルムが統治した。, source: "https://ja.wikipedia.org/wiki/フレドリク1世_(スウェーデン王)"}
    - {name: ヴィルヘルム8世, title: ヘッセン＝カッセル方伯, from: 1751, to: 1760, source: "https://en.wikipedia.org/wiki/William_VIII,_Landgrave_of_Hesse-Kassel"}
    - {name: フリードリヒ2世, title: ヘッセン＝カッセル方伯, from: 1760, to: 1785, note: アメリカ独立戦争にイギリスの傭兵として兵を貸し出した。, source: "https://en.wikipedia.org/wiki/Frederick_II,_Landgrave_of_Hesse-Kassel"}
    - {name: ヴィルヘルム9世（選帝侯ヴィルヘルム1世）, title: 方伯→ヘッセン選帝侯（1803）, from: 1785, to: 1821, note: 1806–1813年は亡命。, source: "https://en.wikipedia.org/wiki/William_I,_Elector_of_Hesse"}
    - {name: ヴィルヘルム2世, title: ヘッセン選帝侯, from: 1821, to: 1847, note: 1831年から子のフリードリヒ・ヴィルヘルムが共同統治者として実権を持った。, source: "https://en.wikipedia.org/wiki/William_II,_Elector_of_Hesse"}
    - {name: フリードリヒ・ヴィルヘルム, title: ヘッセン選帝侯, from: 1847, to: 1866, note: 1866年にプロイセンに捕らえられ、国を失った（退位はしなかった）。, source: "https://en.wikipedia.org/wiki/Frederick_William,_Elector_of_Hesse"}
  periods:
    - from: 1453
      to: 1499
      text: ルートヴィヒ1世の死後（1458）、ニーダーヘッセン（カッセル）とオーバーヘッセン（マールブルク）に分かれた。1479年にカッツェンエルンボーゲン伯領を相続し、ライン川・マイン川に領地を広げた。1500年に再統一。
    - from: 1500
      to: 1566
      text: フィリップ寛大伯が1526年に宗教改革を導入し、ザクセン選帝侯とともにシュマルカルデン同盟（1531）を率いた。1534年にはヴュルテンベルク公ウルリヒの復帰を助けた。シュマルカルデン戦争に敗れて幽閉されたが、1552年の諸侯の反乱で解放された。
    - from: 1567
      to: 1647
      text: フィリップの遺言で、カッセル・マールブルク・ラインフェルス・ダルムシュタットの4家に分かれた。カッセル系はカルヴァン派となり、マールブルクの相続をめぐるダルムシュタット系との争いは、三十年戦争と結びついてヘッセン戦争（1645–48）となった。方伯妃アマーリエ・エリーザベトはスウェーデン・フランスと結んで戦い抜いた。
    - from: 1648
      to: 1735
      text: カルヴァン派の方伯領。ウェストファリア条約でヘルスフェルトを獲得し、ヘッセン戦争の結果マールブルクの北部を得た。
    - from: 1736
      to: 1805
      text: 1736年にハーナウ＝ミュンツェンベルク伯領を相続。兵士をイギリスなどへ貸し出す「兵士売買」で財を蓄えた。1803年に選帝侯国となった。
    - from: 1806
      to: 1813
      text: プロイセン側に立ったためナポレオンに占領され、本領はヴェストファーレン王国、ハーナウはフランクフルト大公国に編入された。1813年に選帝侯が復帰。
    - from: 1814
      to: 1830
      text: 復帰した選帝侯ヴィルヘルム1世はナポレオン期の改革を取り消し、旧体制を復活させた（兵士のおさげ髪まで元に戻させたといわれる）。
    - from: 1831
      to: 1866
      text: 1830年の騒乱を受けて1831年に憲法を制定したが、選帝侯と宰相ハッセンプフルークは議会と対立し続けた。1850年の憲法紛争はプロイセンとオーストリアの対立（オルミュッツ協定）に発展した。1866年、普墺戦争でオーストリア側につき、プロイセンに併合された。
  source:
    - "https://ja.wikipedia.org/wiki/ヘッセン＝カッセル方伯領"
    - "https://ja.wikipedia.org/wiki/ヘッセン選帝侯国"

- id: hesse_darmstadt
  name: ヘッセン大公国
  names:
    - {to: 1805, name: ヘッセン＝ダルムシュタット方伯領, kind: 方伯領}
  short: ヘッセン＝ダルムシュタット
  color: "#d9b8c4"
  kind: 大公国
  note: 1806年からヘッセン大公国。1567年、フィリップ寛大伯の末子ゲオルク1世が上カッツェンエルンボーゲン伯領（ダルムシュタット）を相続して始まった。1604年にマールブルク系の遺領の南半分（ギーセン）を得た。
  rulers:
    - {name: ゲオルク1世, title: ヘッセン＝ダルムシュタット方伯, from: 1567, to: 1596, source: "https://en.wikipedia.org/wiki/George_I,_Landgrave_of_Hesse-Darmstadt"}
    - {name: ルートヴィヒ5世（忠実伯）, title: ヘッセン＝ダルムシュタット方伯, from: 1596, to: 1626, note: 1607年にギーセン大学を創設。皇帝側に立ち、1623年に帝国宮内法院の判決でマールブルクを得た。, source: "https://en.wikipedia.org/wiki/Louis_V,_Landgrave_of_Hesse-Darmstadt"}
    - {name: ゲオルク2世, title: ヘッセン＝ダルムシュタット方伯, from: 1626, to: 1661, source: "https://en.wikipedia.org/wiki/George_II,_Landgrave_of_Hesse-Darmstadt"}
    - {name: ルートヴィヒ6世, title: ヘッセン＝ダルムシュタット方伯, from: 1661, to: 1678, source: "https://en.wikipedia.org/wiki/Louis_VI,_Landgrave_of_Hesse-Darmstadt"}
    - {name: ルートヴィヒ7世, title: ヘッセン＝ダルムシュタット方伯, from: 1678, to: 1678, source: "https://en.wikipedia.org/wiki/Louis_VII,_Landgrave_of_Hesse-Darmstadt"}
    - {name: エルンスト・ルートヴィヒ, title: ヘッセン＝ダルムシュタット方伯, from: 1678, to: 1739, source: "https://en.wikipedia.org/wiki/Ernest_Louis,_Landgrave_of_Hesse-Darmstadt"}
    - {name: ルートヴィヒ8世, title: ヘッセン＝ダルムシュタット方伯, from: 1739, to: 1768, source: "https://en.wikipedia.org/wiki/Louis_VIII,_Landgrave_of_Hesse-Darmstadt"}
    - {name: ルートヴィヒ9世, title: ヘッセン＝ダルムシュタット方伯, from: 1768, to: 1790, note: ピルマゼンスに住み、兵隊王として知られた。, source: "https://en.wikipedia.org/wiki/Louis_IX,_Landgrave_of_Hesse-Darmstadt"}
    - {name: ルートヴィヒ10世（大公ルートヴィヒ1世）, title: 方伯→ヘッセン大公（1806）, from: 1790, to: 1830, source: "https://en.wikipedia.org/wiki/Louis_I,_Grand_Duke_of_Hesse"}
    - {name: ルートヴィヒ2世, title: ヘッセン大公, from: 1830, to: 1848, source: "https://en.wikipedia.org/wiki/Louis_II,_Grand_Duke_of_Hesse"}
    - {name: ルートヴィヒ3世, title: ヘッセン大公, from: 1848, to: 1877, note: 宰相ダルヴィク（1850–71）が実権を握った。, source: "https://en.wikipedia.org/wiki/Louis_III,_Grand_Duke_of_Hesse"}
    - {name: ルートヴィヒ4世, title: ヘッセン大公, from: 1877, to: 1892, note: 妃はイギリスのヴィクトリア女王の娘アリス。, source: "https://en.wikipedia.org/wiki/Louis_IV,_Grand_Duke_of_Hesse"}
    - {name: エルンスト・ルートヴィヒ, title: ヘッセン大公, from: 1892, to: 1918, note: 妹アリックスはロシア皇帝ニコライ2世の皇后。1918年のドイツ革命で廃位。, source: "https://en.wikipedia.org/wiki/Ernest_Louis,_Grand_Duke_of_Hesse"}
  periods:
    - from: 1567
      to: 1647
      text: ダルムシュタットを都とするルター派の方伯領。1604年にマールブルク系の遺領の南部（ギーセン）を得て、皇帝側に立ってカッセル系とマールブルクを争った（1623–45年はマールブルクも領有）。
    - from: 1648
      to: 1735
      text: ルター派の方伯領。ヘッセン戦争（1645–48）の結果、ギーセンを含むオーバーヘッセン南部を確保した。
    - from: 1736
      to: 1802
      text: 1736年にハーナウ＝リヒテンベルク伯領（ライン左岸のピルマゼンス、アルザス北部など）を相続した。
    - from: 1803
      to: 1815
      text: 帝国代表者会議主要決議でマインツ領の一部やヴェストファーレン公領を獲得。1806年にライン同盟に加わって大公国となり、周辺の伯領などを陪臣化した。1816年にライン左岸のラインヘッセン（マインツ・ヴォルムス）を得る。
    - from: 1816
      to: 1847
      text: 1816年にライン左岸のラインヘッセン（マインツ・ヴォルムス）を得た。1820年に憲法を制定し、1828年にはプロイセンと関税同盟を結んで、のちのドイツ関税同盟の先がけとなった。
    - from: 1848
      to: 1870
      text: 宰相ダルヴィクが反プロイセン政策をとり、1866年の普墺戦争でオーストリア側について敗れた。ヘッセン＝ホンブルクなどをプロイセンに譲り、マイン川以北のオーバーヘッセン州だけが北ドイツ連邦に加わった（南部は加わらない、二つに分かれた状態）。
    - from: 1871
      to: 1914
      text: ドイツ帝国の構成国。エルンスト・ルートヴィヒ大公は芸術を保護し、ダルムシュタットのマティルデンヘーエに芸術家村（1899）を開いてユーゲントシュティールの中心とした。
    - from: 1915
      to: 1918
      text: 第一次世界大戦に参戦。1918年11月9日、退位を拒んだ大公エルンスト・ルートヴィヒは労兵評議会により廃位され、ヘッセン人民州となった。
  source:
    - "https://ja.wikipedia.org/wiki/ヘッセン＝ダルムシュタット方伯領"
    - "https://ja.wikipedia.org/wiki/ヘッセン大公国"

- id: hesse_marburg
  name: ヘッセン＝マールブルク方伯領
  short: ヘッセン＝マールブルク
  color: "#99e3f1"
  kind: 方伯領
  note: マールブルクを都とするオーバーヘッセンの方伯領。1458–1500年（ルートヴィヒ1世の子ハインリヒ3世の系統）と1567–1604年（フィリップ寛大伯の子ルートヴィヒ4世）の2度あった。1604年のルートヴィヒ4世の死後、北部はカッセル系、南部（ギーセン）はダルムシュタット系に分けられ、マールブルクの帰属は1648年まで争われた（ヘッセン戦争）。
  rulers:
    - {name: ハインリヒ3世（富裕伯）, title: ヘッセン＝マールブルク方伯, from: 1458, to: 1483, note: 妃がカッツェンエルンボーゲン伯の相続人で、1479年に同伯領を得た。, source: "https://en.wikipedia.org/wiki/Henry_III,_Landgrave_of_Upper_Hesse"}
    - {name: ヴィルヘルム3世, title: ヘッセン＝マールブルク方伯, from: 1483, to: 1500, note: 狩りの事故で死去し、カッセル系が継いだ。, source: "https://en.wikipedia.org/wiki/William_III,_Landgrave_of_Upper_Hesse"}
    - {name: ルートヴィヒ4世, title: ヘッセン＝マールブルク方伯, from: 1567, to: 1604, source: "https://en.wikipedia.org/wiki/Louis_IV,_Landgrave_of_Hesse-Marburg"}
  periods:
    - from: 1458
      to: 1500
      text: オーバーヘッセン（マールブルク・ギーセン・ツィーゲンハイン）と、1479年からカッツェンエルンボーゲン伯領を治めた。
    - from: 1567
      to: 1604
      text: ルター派の方伯ルートヴィヒ4世の領国。子がなく、遺言で遺領をカッセル系とダルムシュタット系に分けた。
  source: "https://de.wikipedia.org/wiki/Hessen-Marburg"

- id: hesse_rheinfels
  name: ヘッセン＝ラインフェルス方伯領
  short: ヘッセン＝ラインフェルス
  color: "#f4cddb"
  kind: 方伯領
  note: ザンクト・ゴアール（ラインフェルス城）を都とする下カッツェンエルンボーゲン伯領の方伯領（1567–83）。フィリップ2世の死後、カッセル系に戻った。
  rulers:
    - {name: フィリップ2世, title: ヘッセン＝ラインフェルス方伯, from: 1567, to: 1583, source: "https://en.wikipedia.org/wiki/Philip_II,_Landgrave_of_Hesse-Rheinfels"}
  source: "https://de.wikipedia.org/wiki/Hessen-Rheinfels"

- id: katzenelnbogen
  name: カッツェンエルンボーゲン伯領
  short: カッツェンエルンボーゲン
  color: "#c0daa0"
  kind: 伯領
  note: ライン川のザンクト・ゴアール周辺（下伯領）と、ダルムシュタット周辺（上伯領）に分かれた伯領。ライン通行税で富んだ。1479年に最後の伯フィリップ1世が死に、娘婿のヘッセン方伯（マールブルク系）が継いだ。
  rulers:
    - {name: フィリップ1世, title: カッツェンエルンボーゲン伯, from: 1444, to: 1479, source: "https://en.wikipedia.org/wiki/Philip_I,_Count_of_Katzenelnbogen"}
  source: "https://de.wikipedia.org/wiki/Grafschaft_Katzenelnbogen"

- id: nassau
  name: ナッサウ公国
  names:
    - {to: 1805, name: ナッサウ諸家（ヴァルラム系）, kind: 侯国・伯領（諸家）}
  short: ナッサウ
  color: "#e3c7a6"
  kind: 公国
  note: ナッサウ＝ヴァイルブルク、ナッサウ＝ウージンゲン、ナッサウ＝ザールブリュッケンなどヴァルラム系ナッサウ家の諸領をまとめたもの。1806年に統合されてナッサウ公国となった（首都はヴァイルブルク／ヴィースバーデン近郊ビープリヒ）。
  rulers:
    - {name: フリードリヒ・アウグスト（ナッサウ＝ウージンゲン）, title: ナッサウ公, from: 1806, to: 1816, note: ナッサウ＝ヴァイルブルク侯フリードリヒ・ヴィルヘルムと共同統治。1805年以前は家系ごとに君主が分かれるため省略。, source: "https://en.wikipedia.org/wiki/Frederick_Augustus,_Duke_of_Nassau"}
    - {name: ヴィルヘルム, title: ナッサウ公, from: 1816, to: 1839, note: 1816年にナッサウ＝ヴァイルブルク系のもとで両系の領地を統合。, source: "https://en.wikipedia.org/wiki/William,_Duke_of_Nassau"}
    - {name: アドルフ, title: ナッサウ公, from: 1839, to: 1866, note: 1866年に国を失い、1890年にルクセンブルク大公となった。, source: "https://ja.wikipedia.org/wiki/アドルフ_(ルクセンブルク大公)"}
  periods:
    - from: 1648
      to: 1802
      text: ヴァルラム系ナッサウ家は、ラーン川・タウヌス山地からザールブリュッケンまで、分家ごとに小領地を持っていた。
    - from: 1803
      to: 1815
      text: 帝国代表者会議主要決議でマインツ・トリーア両大司教領の右岸部分を得て領土を拡大。1806年にライン同盟に加わりナッサウ公国となった。
    - from: 1816
      to: 1866
      text: 1814年にドイツで最初期の憲法を制定。首都ヴィースバーデンは温泉保養地として栄えた。1866年の普墺戦争でオーストリア側につき、プロイセンに併合された（ヘッセン＝ナッサウ州）。
  source:
    - "https://de.wikipedia.org/wiki/Herzogtum_Nassau"
    - "https://ja.wikipedia.org/wiki/ナッサウ公国"

- id: nassau_orange
  name: ナッサウ＝オラニエ家領
  names:
    - {to: 1742, name: ナッサウ諸家（オットー系）}
  short: ナッサウ＝オラニエ
  color: "#efc38f"
  kind: 侯国
  note: オットー系ナッサウ家（ディレンブルク、ディーツ、ハダマー、ジーゲン）のドイツ内の領地。1743年にオラニエ公ウィレム4世（オランダ総督）のもとで統合された。1803–06年はフルダなども領有。1806年にナポレオンに没収されベルク大公国へ、1813年に回復、1815年にルクセンブルクと交換してプロイセン・ナッサウへ譲った。
  periods:
    - from: 1453
      to: 1742
      text: ディレンブルク・ジーゲンを中心とするオットー系ナッサウ家の領地。この家から出たオラニエ公ウィレム（1533年ディレンブルク生まれ）がオランダ独立戦争を指導した。ヨハン6世（ウィレムの弟）は1584年にヘルボルンにカルヴァン派の大学を作った。
    - from: 1743
      to: 1805
      text: オランダ総督のオラニエ公がドイツ内の家領として統治した。
  source: "https://de.wikipedia.org/wiki/Nassau-Oranien"

- id: waldeck
  name: ヴァルデック侯国
  names:
    - {to: 1711, name: ヴァルデック伯領, kind: 伯領}
  short: ヴァルデック
  color: "#cfd9b0"
  kind: 侯国
  note: 1712年からヴァルデック侯国。ピルモント（ニーダーザクセン）も領有。1807年ライン同盟、1815年ドイツ連邦に加盟。
  rulers:
    - {name: ゲオルク2世, title: ヴァルデック＝ピルモント侯, from: 1813, to: 1845, source: "https://en.wikipedia.org/wiki/George_II,_Prince_of_Waldeck_and_Pyrmont"}
    - {name: ゲオルク・ヴィクトル, title: ヴァルデック＝ピルモント侯, from: 1845, to: 1893, note: 娘エマはオランダ王妃（ウィルヘルミナ女王の母）。, source: "https://en.wikipedia.org/wiki/George_Victor,_Prince_of_Waldeck_and_Pyrmont"}
    - {name: フリードリヒ, title: ヴァルデック＝ピルモント侯, from: 1893, to: 1918, note: 1918年のドイツ革命で退位。, source: "https://en.wikipedia.org/wiki/Friedrich,_Prince_of_Waldeck_and_Pyrmont"}
  periods:
    - from: 1453
      to: 1647
      text: ヘッセンの北西の伯領（侯国になるのは1712年）。16世紀に宗教改革を受け入れた。たびたび分家に分かれ、1625年にピルモント伯領を相続した。
    - from: 1648
      to: 1815
      text: アロルゼンを首都とするヘッセン北西部の小侯国。ヘッセン＝カッセルと同じく傭兵の供給で知られた。
    - from: 1816
      to: 1914
      text: ドイツ連邦の小国。財政難のため1867年の加盟条約（1868年発効）で行政をプロイセンに委ねたが、侯国としては存続し、北ドイツ連邦・ドイツ帝国の構成国となった。
    - from: 1915
      to: 1918
      text: 1918年11月の革命で侯フリードリヒが退位し、ヴァルデック自由州となった（1929年の住民投票を受けてプロイセンに編入）。
  source: "https://de.wikipedia.org/wiki/Waldeck_(Land)"

- id: hohenzollern
  name: ホーエンツォレルン＝ジグマリンゲン侯国
  names:
    - {to: 1575, name: ホーエンツォレルン伯領, kind: 伯領}
    - {to: 1622, name: ホーエンツォレルン＝ジグマリンゲン伯領, kind: 伯領}
  short: ホーエンツォレルン
  color: "#c2c9d6"
  kind: 侯国
  note: シュヴァーベンに残ったホーエンツォレルン家のカトリック系の分家（プロイセン王家の本家筋）。ヘヒンゲン系とジグマリンゲン系の2侯国があり、この地図ではジグマリンゲン侯国の中心部だけを示す。1806年のライン同盟加盟で独立を保ち、1815年ドイツ連邦の加盟国となった（1850年にプロイセン領）。
  rulers:
    - {name: アントン・アロイス, title: ホーエンツォレルン＝ジグマリンゲン侯, from: 1785, to: 1831, source: "https://en.wikipedia.org/wiki/Anton_Aloys,_Prince_of_Hohenzollern-Sigmaringen"}
    - {name: カール, title: ホーエンツォレルン＝ジグマリンゲン侯, from: 1831, to: 1848, source: "https://en.wikipedia.org/wiki/Charles,_Prince_of_Hohenzollern-Sigmaringen"}
    - {name: カール・アントン, title: ホーエンツォレルン＝ジグマリンゲン侯, from: 1848, to: 1849, note: 1849年に領国をプロイセン王に譲った。のちプロイセン首相（1858–62）。, source: "https://en.wikipedia.org/wiki/Karl_Anton,_Prince_of_Hohenzollern"}
  periods:
    - from: 1535
      to: 1647
      text: 1535年、ホーエンツォレルン伯カール1世がカール5世からジグマリンゲン・フェリンゲン伯領を与えられた（それまではヴェルデンベルク伯の領地）。1576年にヘヒンゲン系とジグマリンゲン系に分かれ、1623年に侯国となった。
    - from: 1648
      to: 1805
      text: 1623年に侯国に昇格した小領邦（シュヴァーベン・クライス）。周囲を前方オーストリアなどハプスブルク家の領地に囲まれ、その影響下にあった。
    - from: 1806
      to: 1815
      text: ナポレオンの妃ジョゼフィーヌと縁のある侯妃の働きかけもあってライン同盟に加わり、周辺の小領を併合して独立を保った。
    - from: 1816
      to: 1849
      text: ドイツ連邦の小国（ジグマリンゲン・ヘヒンゲンの2侯国）。1848年の革命の騒乱を受け、両侯は1849年に領国をプロイセン王に譲り、1850年からプロイセンのホーエンツォレルン諸邦となった。カール・アントンの子カロルは1866年にルーマニア公となり、レオポルトのスペイン王位への立候補（1870）は普仏戦争のきっかけとなった。
  source: "https://de.wikipedia.org/wiki/Fürstentum_Hohenzollern-Sigmaringen"

- id: ansbach
  name: アンスバッハ＝バイロイト辺境伯領
  names:
    - {to: 1768, name: ブランデンブルク＝アンスバッハ辺境伯領}
  short: アンスバッハ
  color: "#b8c4cf"
  kind: 辺境伯領
  note: 1769年からアンスバッハ＝バイロイト辺境伯領（同君連合）。ホーエンツォレルン家のフランケン分家で、1791年にプロイセン王に譲られた。15–16世紀にはクルムバッハ（バイロイト）と同じ君主がたびたび治めた（1457–86、1495–1515、1557–1603）が、地図では2つの色のまま示す。
  rulers:
    - {name: アルブレヒト・アキレス, title: アンスバッハ辺境伯（1457年からクルムバッハ、1470年からブランデンブルク選帝侯も）, from: 1440, to: 1486, note: ハウス法（アキレス家憲、1473）でブランデンブルクとフランケンの領地の分け方を定めた。, source: "https://ja.wikipedia.org/wiki/アルブレヒト・アヒレス_(ブランデンブルク選帝侯)"}
    - {name: フリードリヒ1世（5世）, title: アンスバッハ辺境伯（1495年からクルムバッハも）, from: 1486, to: 1515, note: 1515年に子らに幽閉された。子にドイツ騎士団長アルブレヒト（初代プロイセン公）。, source: "https://en.wikipedia.org/wiki/Frederick_I,_Margrave_of_Brandenburg-Ansbach"}
    - {name: カジミール, title: アンスバッハ・クルムバッハ辺境伯, from: 1515, to: 1527, note: 弟ゲオルクと共同統治。農民戦争で農民を厳しく処罰した。, source: "https://en.wikipedia.org/wiki/Casimir,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: ゲオルク（敬虔公）, title: アンスバッハ辺境伯, from: 1515, to: 1543, note: 1528年にルター派を導入し、アウクスブルク信仰告白（1530）に署名した。, source: "https://en.wikipedia.org/wiki/George,_Margrave_of_Brandenburg-Ansbach"}
    - {name: ゲオルク・フリードリヒ1世, title: アンスバッハ辺境伯（1557年からクルムバッハも）, from: 1543, to: 1603, note: 1577年にプロイセン公の後見人となり、1578年にポーランド王の承認を得て摂政としてプロイセンも治めた。, source: "https://en.wikipedia.org/wiki/George_Frederick,_Margrave_of_Brandenburg-Ansbach"}
    - {name: ヨアヒム・エルンスト, title: アンスバッハ辺境伯, from: 1603, to: 1625, note: プロテスタント同盟（ウニオン、1608）の結成に加わった。, source: "https://en.wikipedia.org/wiki/Joachim_Ernst,_Margrave_of_Brandenburg-Ansbach"}
    - {name: フリードリヒ3世, title: アンスバッハ辺境伯, from: 1625, to: 1634, note: ネルトリンゲンの戦いで戦死。, source: "https://de.wikipedia.org/wiki/Friedrich_III._(Brandenburg-Ansbach)"}
    - {name: アルブレヒト2世, title: アンスバッハ辺境伯, from: 1634, to: 1667, source: "https://en.wikipedia.org/wiki/Albert_II,_Margrave_of_Brandenburg-Ansbach"}
    - {name: ヨハン・フリードリヒ, title: アンスバッハ辺境伯, from: 1667, to: 1686, source: "https://en.wikipedia.org/wiki/John_Frederick,_Margrave_of_Brandenburg-Ansbach"}
    - {name: クリスティアン・アルブレヒト, title: アンスバッハ辺境伯, from: 1686, to: 1692, source: "https://en.wikipedia.org/wiki/Christian_Albert,_Margrave_of_Brandenburg-Ansbach"}
    - {name: ゲオルク・フリードリヒ2世, title: アンスバッハ辺境伯, from: 1692, to: 1703, source: "https://en.wikipedia.org/wiki/George_Frederick_II,_Margrave_of_Brandenburg-Ansbach"}
    - {name: ヴィルヘルム・フリードリヒ, title: アンスバッハ辺境伯, from: 1703, to: 1723, source: "https://en.wikipedia.org/wiki/William_Frederick,_Margrave_of_Brandenburg-Ansbach"}
    - {name: カール・ヴィルヘルム・フリードリヒ, title: アンスバッハ辺境伯, from: 1723, to: 1757, source: "https://en.wikipedia.org/wiki/Charles_William_Frederick,_Margrave_of_Brandenburg-Ansbach"}
    - {name: カール・アレクサンダー, title: アンスバッハ（1769からバイロイトも）辺境伯, from: 1757, to: 1791, note: 1791年に退位し、領国をプロイセン王に売却。, source: "https://en.wikipedia.org/wiki/Charles_Alexander,_Margrave_of_Brandenburg-Ansbach"}
  periods:
    - from: 1453
      to: 1527
      text: ニュルンベルク城伯から出たホーエンツォレルン家のフランケン領。アルブレヒト・アキレスは帝国都市ニュルンベルクやバイエルン＝ランツフートと争った（第一次辺境伯戦争 1449–50、ギーンゲンの戦い 1462）。
    - from: 1528
      to: 1647
      text: 1528年にルター派を導入したプロテスタントの辺境伯領。1608年、領内のアウハウゼンでプロテスタント同盟（ウニオン）が結ばれた。
    - from: 1648
      to: 1768
      text: ニュルンベルクの南西に広がる、ホーエンツォレルン家のプロテスタントの辺境伯領（フランケン・クライス）。
    - from: 1769
      to: 1790
      text: バイロイト系の断絶でアンスバッハ辺境伯がバイロイトを相続し、フランケンの2つの辺境伯領が統合された。
  source: "https://de.wikipedia.org/wiki/Fürstentum_Ansbach"

- id: bayreuth
  name: ブランデンブルク＝バイロイト辺境伯領
  names:
    - {to: 1603, name: ブランデンブルク＝クルムバッハ辺境伯領, short: クルムバッハ}
  short: バイロイト
  color: "#a8b8c6"
  kind: 辺境伯領
  note: 1769年にアンスバッハと統合された（以後はアンスバッハの色）。1604年に都がクルムバッハ（プラッセンブルク城）からバイロイトに移るまでは、クルムバッハ辺境伯領と呼ばれた。
  rulers:
    - {name: ヨハン（錬金術師）, title: クルムバッハ辺境伯, from: 1440, to: 1457, note: 1457年に弟アルブレヒト・アキレスに譲った。, source: "https://en.wikipedia.org/wiki/John,_Margrave_of_Brandenburg-Kulmbach"}
    - {name: アルブレヒト・アキレス, title: クルムバッハ・アンスバッハ辺境伯, from: 1457, to: 1486, source: "https://ja.wikipedia.org/wiki/アルブレヒト・アヒレス_(ブランデンブルク選帝侯)"}
    - {name: ジークムント, title: クルムバッハ辺境伯, from: 1486, to: 1495, source: "https://en.wikipedia.org/wiki/Sigismund,_Margrave_of_Brandenburg-Kulmbach"}
    - {name: フリードリヒ1世（5世）, title: クルムバッハ・アンスバッハ辺境伯, from: 1495, to: 1515, source: "https://en.wikipedia.org/wiki/Frederick_I,_Margrave_of_Brandenburg-Ansbach"}
    - {name: カジミール, title: クルムバッハ辺境伯, from: 1515, to: 1527, source: "https://en.wikipedia.org/wiki/Casimir,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: アルブレヒト・アルキビアデス, title: クルムバッハ辺境伯, from: 1527, to: 1554, note: 1541年まで叔父ゲオルクが後見。第二次辺境伯戦争（1552–54）でフランケンの司教領・ニュルンベルクを荒らし、帝国追放となった。, source: "https://en.wikipedia.org/wiki/Albert_Alcibiades,_Margrave_of_Brandenburg-Kulmbach"}
    - {name: ゲオルク・フリードリヒ1世, title: クルムバッハ・アンスバッハ辺境伯, from: 1557, to: 1603, note: 1554–57年、クルムバッハはフランケン諸身分の占領下にあった。, source: "https://en.wikipedia.org/wiki/George_Frederick,_Margrave_of_Brandenburg-Ansbach"}
    - {name: クリスティアン, title: バイロイト辺境伯, from: 1603, to: 1655, note: 1604年に都をバイロイトへ移した。, source: "https://en.wikipedia.org/wiki/Christian,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: クリスティアン・エルンスト, title: バイロイト辺境伯, from: 1655, to: 1712, source: "https://en.wikipedia.org/wiki/Christian_Ernst,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: ゲオルク・ヴィルヘルム, title: バイロイト辺境伯, from: 1712, to: 1726, source: "https://en.wikipedia.org/wiki/George_William,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: ゲオルク・フリードリヒ・カール, title: バイロイト辺境伯, from: 1726, to: 1735, source: "https://en.wikipedia.org/wiki/George_Frederick_Charles,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: フリードリヒ, title: バイロイト辺境伯, from: 1735, to: 1763, note: 妃ヴィルヘルミーネはフリードリヒ大王の姉。バイロイト辺境伯歌劇場を建設。, source: "https://en.wikipedia.org/wiki/Frederick,_Margrave_of_Brandenburg-Bayreuth"}
    - {name: フリードリヒ・クリスティアン, title: バイロイト辺境伯, from: 1763, to: 1769, source: "https://en.wikipedia.org/wiki/Frederick_Christian,_Margrave_of_Brandenburg-Bayreuth"}
  periods:
    - from: 1453
      to: 1647
      text: プラッセンブルク城（クルムバッハ）を拠点とする、ホーエンツォレルン家のもう一つのフランケン領。1528年にルター派を導入。アルブレヒト・アルキビアデスの第二次辺境伯戦争（1552–54）に敗れて荒廃した。
    - from: 1648
      to: 1768
      text: バイロイトとエアランゲン（ユグノーの町）を中心とするホーエンツォレルン家の辺境伯領（クルムバッハ辺境伯領）。
  source: "https://de.wikipedia.org/wiki/Fürstentum_Bayreuth"

- id: nuremberg
  name: 帝国都市ニュルンベルク
  short: ニュルンベルク
  color: "#e0b4a4"
  kind: 帝国都市
  note: 帝国都市の中で最大級の領域（ラウフ、ヘルスブルック、アルトドルフ）を持った。1806年にバイエルンへ編入。
  periods:
    - from: 1453
      to: 1554
      text: 南ドイツ最大級の商工業都市として繁栄し、デューラーやベハイム（地球儀、1492）が活躍した。ランツフート継承戦争（1504–05）でラウフ・ヘルスブルックなどを得て大きな領域を持った。1525年にルター派を導入。
    - from: 1555
      to: 1647
      text: 第二次辺境伯戦争（1552–54）で領域が荒らされた。三十年戦争ではスウェーデンと皇帝の両軍がニュルンベルクの近くで対陣した（アルテ・フェステの戦い、1632）。
    - from: 1648
      to: 1806
      text: 中世以来の商工業都市だが、三十年戦争後は衰退し、18世紀末には多額の負債を抱えていた。
  source: "https://de.wikipedia.org/wiki/Reichsstadt_Nürnberg"

- id: frankfurt
  name: 自由都市フランクフルト
  names:
    - {to: 1805, name: 帝国都市フランクフルト, kind: 帝国都市}
  short: フランクフルト
  color: "#e8a9a0"
  kind: 自由都市
  note: 皇帝の選挙・戴冠の都市（1562年からは戴冠も）。1806–1813年はダールベルクの国家に編入。1815年に自由都市フランクフルトとして復活し、ドイツ連邦議会の所在地となった。
  periods:
    - from: 1648
      to: 1805
      text: 皇帝の選挙と戴冠が行われる帝国都市。見本市と金融で栄えた（1749年ゲーテ誕生）。
    - from: 1813
      to: 1815
      text: ナポレオン体制の崩壊で独立を回復し、ウィーン会議で自由都市となった。
    - from: 1816
      to: 1866
      text: ドイツ連邦議会の所在地。ロスチャイルド家などの銀行が集まる金融の中心だった。1848–49年にはパウロ教会でフランクフルト国民議会が開かれた。1866年の普墺戦争の後、プロイセンに併合され、重い賠償金を課された。
  source: "https://ja.wikipedia.org/wiki/フランクフルト自由都市"

- id: frankfurt_gd
  name: フランクフルト大公国
  names:
    - {to: 1805, name: 大書記長侯国（ダールベルク領）, short: ダールベルク領, kind: 選帝侯国（帝国大書記長の国家）}
    - {to: 1809, name: 首座大司教侯国（ダールベルク領）, short: ダールベルク領, kind: 侯国}
  short: フランクフルト大公国
  color: "#d6cf8a"
  kind: 大公国
  note: 最後のマインツ選帝侯ダールベルクが、1803年に帝国大書記長としてアシャッフェンブルク・レーゲンスブルク・ヴェッツラーを得て作った国家。1806年にフランクフルトを加えて首座大司教侯国、1810年にレーゲンスブルクをバイエルンに譲り、フルダ・ハーナウを得てフランクフルト大公国となった。1813年に解体。
  rulers:
    - {name: カール・テオドール・フォン・ダールベルク, title: 大書記長→首座大司教→フランクフルト大公, from: 1803, to: 1813, note: 後継者にはナポレオンの養子ウジェーヌ・ド・ボアルネが指名されていた。, source: "https://en.wikipedia.org/wiki/Karl_Theodor_von_Dalberg"}
  periods:
    - from: 1803
      to: 1809
      text: 聖界諸侯の中でただ一人、世俗化を免れたダールベルクの国家。ライン同盟の議長（首座大司教）を務めた。
    - from: 1810
      to: 1813
      text: フランクフルト大公国として再編。ナポレオン法典を導入したが、1813年の連合軍の進出で崩壊した。
  source: "https://ja.wikipedia.org/wiki/フランクフルト大公国"

