  periods:
    - from: 1453
      to: 1516
      text: マインツ司教区のフェーデ（1461–63）で自治都市マインツが大司教に征服された。グーテンベルクの活版印刷がマインツから広まった。大司教ベルトルトは帝国改造を主導した。
    - from: 1517
      to: 1630
      text: アルブレヒト・フォン・ブランデンブルクの贖宥状販売がルターの宗教改革のきっかけとなった。領内の多くがプロテスタントに傾いたが、16世紀後半から対抗宗教改革でカトリックに戻された。
    - from: 1631
      to: 1647
      text: 1631年末にスウェーデン王グスタフ・アドルフがマインツを占領して冬営し、1636年まで占領が続いた。1644年からはフランス軍に占領された。
    - from: 1648
      to: 1691
      text: シェーンボルン家の選帝侯のもとで三十年戦争からの復興を進め、フランスと結ぶ第一次ライン同盟（1658）を主導した。
    - from: 1692
      to: 1791
      text: 帝国大書記長として帝国政治の要となった。マインツ大学を中心に、18世紀後半にはカトリック啓蒙が進んだ。
    - from: 1792
      to: 1803
      text: 1792–93年にフランス軍がマインツを占領し、ドイツ初の共和国（マインツ共和国）が作られた。1797年に左岸を失い、1803年に世俗化された。
