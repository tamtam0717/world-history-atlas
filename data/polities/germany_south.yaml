    - {name: ヴィルヘルム・ルートヴィヒ, title: ヴュルテンベルク公, from: 1674, to: 1677, source: "https://en.wikipedia.org/wiki/William_Louis,_Duke_of_Württemberg"}
    - {name: エーバーハルト・ルートヴィヒ, title: ヴュルテンベルク公, from: 1677, to: 1733, note: 1693年まで叔父フリードリヒ・カールが摂政。ルートヴィヒスブルク宮殿を建設。, source: "https://en.wikipedia.org/wiki/Eberhard_Louis,_Duke_of_Württemberg"}
    - {name: カール・アレクサンダー, title: ヴュルテンベルク公, from: 1733, to: 1737, source: "https://en.wikipedia.org/wiki/Charles_Alexander,_Duke_of_Württemberg"}
    - {name: カール・オイゲン, title: ヴュルテンベルク公, from: 1737, to: 1793, note: 1744年まで摂政政治。, source: "https://en.wikipedia.org/wiki/Charles_Eugene,_Duke_of_Württemberg"}
    - {name: ルートヴィヒ・オイゲン, title: ヴュルテンベルク公, from: 1793, to: 1795, source: "https://en.wikipedia.org/wiki/Louis_Eugene,_Duke_of_Württemberg"}
    - {name: フリードリヒ・オイゲン, title: ヴュルテンベルク公, from: 1795, to: 1797, source: "https://en.wikipedia.org/wiki/Frederick_II_Eugene,_Duke_of_Württemberg"}
    - {name: フリードリヒ1世, title: ヴュルテンベルク公→選帝侯（1803）→国王（1806）, from: 1797, to: 1816, source: "https://ja.wikipedia.org/wiki/フリードリヒ1世_(ヴュルテンベルク王)"}
    - {name: ヴィルヘルム1世, title: ヴュルテンベルク王, from: 1816, to: 1864, note: 1819年に憲法を制定。, source: "https://ja.wikipedia.org/wiki/ヴィルヘルム1世_(ヴュルテンベルク王)"}
    - {name: カール1世, title: ヴュルテンベルク王, from: 1864, to: 1891, source: "https://ja.wikipedia.org/wiki/カール1世_(ヴュルテンベルク王)"}
    - {name: ヴィルヘルム2世, title: ヴュルテンベルク王, from: 1891, to: 1918, note: 1918年のドイツ革命で退位。, source: "https://ja.wikipedia.org/wiki/ヴィルヘルム2世_(ヴュルテンベルク王)"}
  periods:
    - from: 1648
      to: 1732
      text: シュトゥットガルトを首都とするシュヴァーベン最大の世俗領邦。プロテスタントで、領邦議会（等族）の力が強かった。
    - from: 1733
      to: 1796
      text: カトリックに改宗した公（カール・アレクサンダー、カール・オイゲン）と、プロテスタントの等族が対立。カール・オイゲンのカール学院からはシラーが出た。
    - from: 1797
      to: 1815
      text: フリードリヒ1世がナポレオンと結び、帝国都市・修道院領・前方オーストリア領を併合して領土をほぼ倍にした。1806年に王国となり、1813年に連合国側に転じた。
    - from: 1816
      to: 1863
      text: ヴィルヘルム1世が1819年に国王と議会の合意による憲法を定めた。飢饉（1816–17）の後、農業改革や農業学校（ホーエンハイム）の設立に努めた。
    - from: 1864
      to: 1870
      text: 普墺戦争でオーストリア側について敗れ、プロイセンと攻守同盟を結んだ。1870年の普仏戦争に参戦し、ドイツ帝国に加わった。
    - from: 1871
      to: 1914
      text: ドイツ帝国の構成国。独自の軍・郵便・鉄道を保った。シュトゥットガルト周辺でダイムラー、ボッシュなどの機械・自動車工業が発達した。
  source:
    - "https://ja.wikipedia.org/wiki/ヴュルテンベルク公国"
    - "https://ja.wikipedia.org/wiki/ヴュルテンベルク王国"

- id: baden
