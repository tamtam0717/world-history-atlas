    - from: 1698
      to: 1717
      text: スウェーデン王カール12世が公を兼ねた（同君連合）。
    - from: 1718
      to: 1730
      text: カール12世の死後、プファルツ＝クレーブルク系のグスタフ・サムエル・レオポルトが継いだ。
    - from: 1731
      to: 1797
      text: ビルケンフェルト系の公のもとで存続。この家系から1799年にバイエルン選帝侯（のちの初代バイエルン王）が出た。
    - from: 1798
      to: 1815
      text: 1797年からライン左岸の公国はフランスの支配下に入り、1801年のリュネヴィル条約で正式にフランス領（モン＝トネール県・サール県）となった。
  source: "https://de.wikipedia.org/wiki/Pfalz-Zweibrücken"

