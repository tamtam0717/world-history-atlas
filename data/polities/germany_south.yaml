    - from: 1648
      to: 1714
      text: フランスと国境を接し、オランダ戦争・プファルツ継承戦争などでたびたびフランス軍に占領・破壊された。
    - from: 1715
      to: 1791
      text: 18世紀には安定し、選帝侯はコブレンツ（エーレンブライトシュタイン）に住んだ。1789年以降、コブレンツはフランス亡命貴族の拠点となった。
    - from: 1792
      to: 1803
      text: 1794年にフランス軍が左岸を占領し、1797年からフランス領。右岸の残りも1803年にナッサウへ渡り、大司教領は消滅した。
  source: "https://ja.wikipedia.org/wiki/トリーア大司教"

- id: wurzburg
  name: ヴュルツブルク大公国
  names:
    - {to: 1802, name: ヴュルツブルク司教領, kind: 司教領}
    - {to: 1805, name: ヴュルツブルク選帝侯国, kind: 選帝侯国}
  short: ヴュルツブルク
  color: "#c3aedb"
  kind: 大公国
  note: フランケン公を称した司教の領国。1803年にバイエルンへ併合されたが、1805年のプレスブルク条約で前トスカーナ大公フェルディナント（皇帝フランツ2世の弟）の選帝侯国として再建され、1806年に大公国となった（1814年にバイエルンへ）。
  rulers:
    - {name: ゴットフリート4世・シェンク・フォン・リンプルク, title: ヴュルツブルク司教（フランケン公）, from: 1443, to: 1455, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: ヨハン3世・フォン・グルムバッハ, title: ヴュルツブルク司教（フランケン公）, from: 1455, to: 1466, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: ルドルフ2世・フォン・シェーレンベルク, title: ヴュルツブルク司教（フランケン公）, from: 1466, to: 1495, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: ローレンツ・フォン・ビブラ, title: ヴュルツブルク司教（フランケン公）, from: 1495, to: 1519, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: コンラート2世・フォン・テュンゲン, title: ヴュルツブルク司教（フランケン公）, from: 1519, to: 1540, note: 1525年、マリエンベルク城を農民軍に包囲された。, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: コンラート3世・フォン・ビブラ, title: ヴュルツブルク司教（フランケン公）, from: 1540, to: 1544, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: メルヒオール・ツォーベル・フォン・ギーベルシュタット, title: ヴュルツブルク司教（フランケン公）, from: 1544, to: 1558, note: 騎士グルムバッハの手下に暗殺された（グルムバッハ騒動）。, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: フリードリヒ・フォン・ヴィルスベルク, title: ヴュルツブルク司教（フランケン公）, from: 1558, to: 1573, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: ユリウス・エヒター・フォン・メスペルブルン, title: ヴュルツブルク司教（フランケン公）, from: 1573, to: 1617, note: 対抗宗教改革を強力に進め、ユリウス施療院（1576）とヴュルツブルク大学（1582）を創設した。, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: ヨハン・ゴットフリート・フォン・アシュハウゼン, title: ヴュルツブルク司教（フランケン公）, from: 1617, to: 1622, note: バンベルク司教も兼ねた。, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: フィリップ・アドルフ・フォン・エーレンベルク, title: ヴュルツブルク司教（フランケン公）, from: 1623, to: 1631, note: 大規模な魔女裁判を行った。, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: フランツ・フォン・ハッツフェルト, title: ヴュルツブルク司教（フランケン公）, from: 1631, to: 1642, note: 1631年のスウェーデン軍の侵入で逃れ、1634年に復帰した。バンベルク司教も兼ねた。, source: "https://de.wikipedia.org/wiki/Liste_der_Bischöfe_von_Würzburg"}
    - {name: ヨハン・フィリップ・フォン・シェーンボルン, title: ヴュルツブルク司教, from: 1642, to: 1673, note: マインツ大司教を兼ねる。, source: "https://en.wikipedia.org/wiki/Johann_Philipp_von_Schönborn"}
    - {name: ヨハン・ハルトマン・フォン・ローゼンバッハ, title: ヴュルツブルク司教, from: 1673, to: 1675, source: "https://en.wikipedia.org/wiki/Johann_Hartmann_von_Rosenbach"}
    - {name: ペーター・フィリップ・フォン・デルンバッハ, title: ヴュルツブルク司教, from: 1675, to: 1683, source: "https://en.wikipedia.org/wiki/Peter_Philipp_von_Dernbach"}
    - {name: コンラート・ヴィルヘルム・フォン・ヴェルナウ, title: ヴュルツブルク司教, from: 1683, to: 1684, source: "https://en.wikipedia.org/wiki/Konrad_Wilhelm_von_Wernau"}
    - {name: ヨハン・ゴットフリート・フォン・グッテンベルク, title: ヴュルツブルク司教, from: 1684, to: 1698, source: "https://en.wikipedia.org/wiki/Johann_Gottfried_von_Guttenberg"}
    - {name: ヨハン・フィリップ・フォン・グライフェンクラウ, title: ヴュルツブルク司教, from: 1699, to: 1719, source: "https://en.wikipedia.org/wiki/Johann_Philipp_von_Greiffenclau_zu_Vollraths"}
    - {name: ヨハン・フィリップ・フランツ・フォン・シェーンボルン, title: ヴュルツブルク司教, from: 1719, to: 1724, note: レジデンツ（司教館）の建設を始めた。, source: "https://en.wikipedia.org/wiki/Johann_Philipp_Franz_von_Schönborn"}
    - {name: クリストフ・フランツ・フォン・フッテン, title: ヴュルツブルク司教, from: 1724, to: 1729, source: "https://en.wikipedia.org/wiki/Christoph_Franz_von_Hutten"}
    - {name: フリードリヒ・カール・フォン・シェーンボルン, title: ヴュルツブルク司教, from: 1729, to: 1746, note: バンベルク司教を兼ねる。, source: "https://en.wikipedia.org/wiki/Friedrich_Karl_von_Schönborn"}
    - {name: アンゼルム・フランツ・フォン・インゲルハイム, title: ヴュルツブルク司教, from: 1746, to: 1749}
    - {name: カール・フィリップ・フォン・グライフェンクラウ, title: ヴュルツブルク司教, from: 1749, to: 1754, source: "https://en.wikipedia.org/wiki/Karl_Philipp_von_Greiffenclau_zu_Vollraths"}
    - {name: アダム・フリードリヒ・フォン・ザインスハイム, title: ヴュルツブルク司教, from: 1755, to: 1779, source: "https://en.wikipedia.org/wiki/Adam_Friedrich_von_Seinsheim"}
    - {name: フランツ・ルートヴィヒ・フォン・エルタール, title: ヴュルツブルク司教, from: 1779, to: 1795, source: "https://en.wikipedia.org/wiki/Franz_Ludwig_von_Erthal"}
    - {name: ゲオルク・カール・フォン・フェッヘンバッハ, title: ヴュルツブルク司教, from: 1795, to: 1803, source: "https://en.wikipedia.org/wiki/Georg_Karl_von_Fechenbach"}
    - {name: フェルディナント（前トスカーナ大公フェルディナンド3世）, title: ヴュルツブルク選帝侯→大公, from: 1806, to: 1814, source: "https://ja.wikipedia.org/wiki/フェルディナンド3世_(トスカーナ大公)"}
  periods:
    - from: 1453
      to: 1572
      text: マイン川流域を占めるフランケン最大の聖界領。ドイツ農民戦争（1525）では農民軍が司教の居城マリエンベルクを包囲した。帝国騎士グルムバッハとの争い（1558–67）が続いた。
    - from: 1573
      to: 1630
      text: ユリウス・エヒター司教がプロテスタントを追放して対抗宗教改革を進め、大学と施療院を創った。1620年代には大規模な魔女裁判が行われた。
    - from: 1631
      to: 1647
      text: 1631年にスウェーデン軍が占領し、1633年にはバンベルクとあわせてザクセン＝ヴァイマル公ベルンハルトの「フランケン公国」とされた。ネルトリンゲンの戦い（1634）の後、司教が復帰した。
    - from: 1648
      to: 1802
      text: マイン川流域を占めるフランケン最大の聖界領。シェーンボルン家の司教たちがバロック様式のレジデンツ（世界遺産）を建てた。
    - from: 1806
      to: 1813
      text: ハプスブルク家のフェルディナントを君主とするヴュルツブルク大公国としてライン同盟に加盟。1814年にフェルディナントがトスカーナへ戻り、バイエルン領となった。
  source: "https://de.wikipedia.org/wiki/Hochstift_Würzburg"

- id: bamberg
  name: バンベルク司教領
  short: バンベルク
  color: "#b59ccc"
  kind: 司教領
  note: レグニッツ川・マイン川上流の司教領。18世紀にはシェーンボルン家などがヴュルツブルク司教を兼ねることが多かった。1802–03年にバイエルンへ。
  source: "https://de.wikipedia.org/wiki/Hochstift_Bamberg"
  periods:
    - from: 1453
      to: 1647
      text: フランケンの司教領。ドイツ農民戦争（1525）で荒らされ、1626–31年には激しい魔女裁判があった。三十年戦争ではスウェーデン軍に占領された（1632–34年、ヴァイマル公ベルンハルトのフランケン公国）。

- id: eichstatt
  name: アイヒシュテット司教領
  short: アイヒシュテット
  color: "#bfa7d6"
  kind: 司教領
  note: 1803年に大部分がザルツブルク選帝侯国（前トスカーナ大公フェルディナント）に、1805年にバイエルンに渡った。
  source: "https://de.wikipedia.org/wiki/Hochstift_Eichstätt"
  periods:
    - from: 1453
      to: 1647
      text: アルトミュール川沿いの司教領。カトリックにとどまり、三十年戦争ではスウェーデン軍に荒らされた（1633–34年）。

- id: passau
  name: パッサウ司教領
  short: パッサウ
  color: "#ad97c9"
  kind: 司教領
  note: 1803年に西部がバイエルン、主要部がザルツブルク選帝侯国に渡り、1805年に全体がバイエルン領となった。
  source: "https://de.wikipedia.org/wiki/Hochstift_Passau"
  periods:
    - from: 1453
      to: 1647
      text: ドナウ川とイン川の合流点の司教領。1552年、皇帝側とプロテスタント諸侯がここでパッサウ条約を結び、アウクスブルクの和議（1555）への道を開いた。

- id: freising
  name: フライジング司教領
  short: フライジング
  color: "#c7b2de"
  kind: 司教領
  note: フライジング周辺のほか、アルプスのヴェルデンフェルス伯領（ガルミッシュ・パルテンキルヒェン・ミッテンヴァルト）を持った。この地図では後者を示す。1803年にバイエルンへ。
  source: "https://de.wikipedia.org/wiki/Hochstift_Freising"
  periods:
    - from: 1453
      to: 1647
      text: バイエルン公国に囲まれた小さな司教領。16世紀後半からはバイエルン公家（ヴィッテルスバッハ家）の一族が司教となることが多かった。

- id: augsburg_bishopric
  name: アウクスブルク司教領
  short: アウクスブルク司教領
  color: "#b8a2cf"
  kind: 司教領
  note: 司教は帝国都市アウクスブルクではなくディリンゲンに住んだ。領土はドナウ川沿いとアルゴイ（フュッセン、マルクトオーバードルフ）に分かれる。1803年にバイエルンへ。
  source: "https://de.wikipedia.org/wiki/Hochstift_Augsburg"
  periods:
    - from: 1453
      to: 1647
      text: 司教はディリンゲンに住んだ（アウクスブルク市は帝国自由都市）。司教オットー・トルフゼス（在位1543–73）がディリンゲン大学を創り、対抗宗教改革の拠点とした。

- id: kempten
  name: ケンプテン修道院侯領
  short: ケンプテン
  color: "#c4b0d8"
  kind: 修道院領
  note: アルゴイの帝国修道院領（侯修道院長）。帝国都市ケンプテンとは別。1803年にバイエルンへ。
  source: "https://de.wikipedia.org/wiki/Fürststift_Kempten"

- id: berchtesgaden
  name: ベルヒテスガーデン修道院侯領
  short: ベルヒテスガーデン
  color: "#cdb9e0"
  kind: 修道院領
  note: 製塩で栄えた帝国直属の修道院領（侯修道院長）。1803年ザルツブルク選帝侯国、1805年オーストリア、1810年バイエルン。
  source: "https://de.wikipedia.org/wiki/Fürstpropstei_Berchtesgaden"

- id: fulda
  name: フルダ司教領
  names:
    - {to: 1751, name: フルダ修道院領, kind: 修道院領}
  short: フルダ
  color: "#b29fd0"
  kind: 司教領
  note: 1752年から司教領（フルダ司教領）。1803年にナッサウ＝オラニエ家の侯国となり、1806年フランス、1810年フランクフルト大公国、1815年プロイセン、1816年ヘッセン選帝侯国。
  source: "https://de.wikipedia.org/wiki/Hochstift_Fulda"
  periods:
    - from: 1453
      to: 1647
      text: 帝国修道院長が治める領地（司教領になるのは1752年）。三十年戦争ではヘッセン＝カッセルに占領された（1632–34年）。

# ---------------------------------------------------------------- 1914–2025

- id: saar
  name: ザール
  names:
    - {from: 1920, to: 1935, name: ザール地域（国際連盟管理）, short: ザール, kind: 国際連盟の管理地域}
    - {from: 1947, to: 1956, name: ザール保護領, short: ザール, kind: 保護領（フランスと経済統合）}
  short: ザール
  color: "#c7b3d9"
  kind: 管理地域
  note: >-
    ドイツ南西部の炭鉱・製鉄地帯。2度ドイツから切り離された。
    1920–1935年はヴェルサイユ条約により国際連盟の統治委員会（5人。委員長が政府の長）が治め、炭鉱はフランスの所有、関税はフランスと一体だった。
    1947–1956年はフランスと経済・通貨・関税で統合された保護領で、自前の憲法・議会・政府を持ったが、フランスの高等弁務官（ジルベール・グランヴァル、1945–1955）が強い権限を持った。
    ここでは、1920–1935年は統治委員会の委員長を、1947–1956年は首相（自治政府の長）とフランスの代表を挙げる。
    1935–1946年、1957年以降はドイツの一部（地図ではドイツ・西ドイツの色）。
  rulers:
    - {name: ヴィクトル・ロー, title: 国際連盟ザール統治委員会委員長, from: 1920, to: 1926, note: フランス人。フランス寄りの政策で住民の反発を受けた。, source: "https://en.wikipedia.org/wiki/Victor_Rault"}
    - {name: ジョージ・ワシントン・スティーヴンズ, title: 国際連盟ザール統治委員会委員長, from: 1926, to: 1927, note: カナダ人。, source: "https://en.wikipedia.org/wiki/George_Washington_Stephens"}
    - {name: アーネスト・ウィルトン, title: 国際連盟ザール統治委員会委員長, from: 1927, to: 1932, note: イギリス人。, source: "https://en.wikipedia.org/wiki/Territory_of_the_Saar_Basin"}
    - {name: ジェフリー・ノックス, title: 国際連盟ザール統治委員会委員長, from: 1932, to: 1935, note: イギリス人。1935年の住民投票を実施した。, source: "https://en.wikipedia.org/wiki/Geoffrey_Knox"}
    - {name: ジルベール・グランヴァル, title: フランス軍政長官・高等弁務官（のち大使）, from: 1945, to: 1955, note: 1945–1948年軍政長官、1948–1952年高等弁務官、1952–1955年大使。, source: "https://en.wikipedia.org/wiki/Gilbert_Grandval"}
    - {name: ヨハネス・ホフマン, title: ザール首相, from: 1947, to: 1955, note: キリスト教人民党（CVP）。フランスとの結びつきとザールの自立を進め、1955年の住民投票で敗れて辞任した。, source: "https://en.wikipedia.org/wiki/Johannes_Hoffmann_(politician)"}
    - {name: ハインリヒ・ヴェルシュ, title: ザール首相, from: 1955, to: 1956, note: 住民投票後の暫定政府（1955年10月–1956年1月）。, source: "https://en.wikipedia.org/wiki/Heinrich_Welsch"}
    - {name: フーベルト・ナイ, title: ザール首相, from: 1956, to: 1956, note: キリスト教民主同盟（CDU）。西ドイツへの復帰を進めた（1957年6月まで在任）。, source: "https://en.wikipedia.org/wiki/Hubert_Ney"}
  periods:
    - from: 1920
      to: 1934
      text: ヴェルサイユ条約により15年間、国際連盟が治めた。炭鉱はドイツの賠償としてフランスのものとなり、通貨もフランス・フランが使われた。住民の大多数はドイツへの復帰を望んだ。
    - from: 1935
      to: 1935
      text: 1935年1月の住民投票で約91%がドイツへの復帰を選び、3月にナチス・ドイツに編入された。ヒトラー政権にとって最初の大きな外交上の成功となった。
    - from: 1947
      to: 1954
      text: フランスが占領地区から切り離し、経済・通貨・関税でフランスと統合した保護領とした。ホフマン首相のもとで独自の憲法と政府を持ち、1950年には欧州評議会の準加盟国となり、1952年のヘルシンキ五輪には独自の選手団を送った。
    - from: 1955
      to: 1956
      text: 1954年のパリ協定で西ヨーロッパ連合のもとに置く「ザール規約」が決まったが、1955年10月の住民投票で約68%が反対した。フランスはザール条約（1956年）で西ドイツへの復帰を認め、1957年1月にザールラント州となった（経済的な統合は1959年まで続いた）。
  source:
    - "https://en.wikipedia.org/wiki/Territory_of_the_Saar_Basin"
    - "https://en.wikipedia.org/wiki/Saar_Protectorate"
    - "https://ja.wikipedia.org/wiki/ザールラント州"
