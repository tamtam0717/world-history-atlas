# 南ドイツ（BS 担当）の政体：現代のヘッセン・ラインラント＝プファルツ・ザールラント・バーデン＝ヴュルテンベルク・バイエルン
# 神聖ローマ帝国・ライン同盟・ドイツ連邦（overlord 用の枠）と「その他の帝国諸邦」もここで定義する。

# ---------------------------------------------------------------- 上位の枠

- id: hre
  name: 神聖ローマ帝国
  short: 神聖ローマ帝国
  color: "#d9d2b6"
  kind: 帝国
  note: overlord（外枠）としてだけ使う枠。皇帝はハプスブルク家（1742–45年のみバイエルンのヴィッテルスバッハ家）。帝国議会は1663年からレーゲンスブルクで常設（永久帝国議会）。
  rulers:
    - {name: フェルディナント3世, title: 神聖ローマ皇帝, from: 1637, to: 1657, source: "https://ja.wikipedia.org/wiki/フェルディナント3世_(神聖ローマ皇帝)"}
    - {name: レオポルト1世, title: 神聖ローマ皇帝, from: 1658, to: 1705, source: "https://ja.wikipedia.org/wiki/レオポルト1世_(神聖ローマ皇帝)"}
    - {name: ヨーゼフ1世, title: 神聖ローマ皇帝, from: 1705, to: 1711, source: "https://ja.wikipedia.org/wiki/ヨーゼフ1世_(神聖ローマ皇帝)"}
    - {name: カール6世, title: 神聖ローマ皇帝, from: 1711, to: 1740, source: "https://ja.wikipedia.org/wiki/カール6世_(神聖ローマ皇帝)"}
    - {name: カール7世（バイエルン選帝侯カール・アルブレヒト）, title: 神聖ローマ皇帝, from: 1742, to: 1745, source: "https://ja.wikipedia.org/wiki/カール7世_(神聖ローマ皇帝)"}
    - {name: フランツ1世（マリア・テレジアの夫）, title: 神聖ローマ皇帝, from: 1745, to: 1765, source: "https://ja.wikipedia.org/wiki/フランツ1世_(神聖ローマ皇帝)"}
    - {name: ヨーゼフ2世, title: 神聖ローマ皇帝, from: 1765, to: 1790, source: "https://ja.wikipedia.org/wiki/ヨーゼフ2世_(神聖ローマ皇帝)"}
    - {name: レオポルト2世, title: 神聖ローマ皇帝, from: 1790, to: 1792, source: "https://ja.wikipedia.org/wiki/レオポルト2世_(神聖ローマ皇帝)"}
    - {name: フランツ2世, title: 神聖ローマ皇帝, from: 1792, to: 1806, source: "https://ja.wikipedia.org/wiki/フランツ2世_(神聖ローマ皇帝)"}
  periods:
    - from: 1648
      to: 1662
      text: ウェストファリア条約で諸侯の領邦主権が認められ、帝国は300近い領邦の緩やかな連合体となった（「帝国の死亡証明書」）。
    - from: 1663
      to: 1739
      text: 帝国議会がレーゲンスブルクで常設化。皇帝はフランス（ルイ14世）とオスマン帝国の両面に対処し、帝国諸侯を率いて戦った。
    - from: 1740
      to: 1788
      text: プロイセンとオーストリアの対立（二元主義）が帝国の枠を揺るがす。1742–45年には一時バイエルン選帝侯が皇帝となった。
    - from: 1789
      to: 1806
      text: フランス革命戦争でライン左岸を失い、1803年の帝国代表者会議主要決議で聖界諸侯領と帝国都市の大半が消滅。1806年、ライン同盟の結成を受けてフランツ2世が帝冠を放棄し、帝国は解体した。
  source:
    - "https://ja.wikipedia.org/wiki/神聖ローマ皇帝"
    - "https://ja.wikipedia.org/wiki/神聖ローマ帝国"

- id: rhine_confederation
  name: ライン同盟
  color: "#c9c3e0"
  kind: 国家連合
  note: overlord（外枠）としてだけ使う枠。ナポレオンが「保護者」。1806年7月に16か国で結成し、のちザクセン・ヴェストファーレン王国など計39か国に拡大。1813年のライプツィヒの戦いの後に崩壊。
  rulers:
    - {name: ナポレオン1世, title: 保護者（フランス皇帝）, from: 1806, to: 1813, source: "https://ja.wikipedia.org/wiki/ナポレオン・ボナパルト"}
    - {name: カール・テオドール・フォン・ダールベルク, title: 首座大司教（同盟の議長）, from: 1806, to: 1813, source: "https://en.wikipedia.org/wiki/Karl_Theodor_von_Dalberg"}
  periods:
    - from: 1806
      to: 1813
      text: 南西ドイツ諸邦が帝国を離脱してナポレオンの保護下に結集。加盟国は兵力の提供を義務づけられ、ロシア遠征にも多数の兵が動員された。
  source: "https://ja.wikipedia.org/wiki/ライン同盟"

- id: german_confederation
  name: ドイツ連邦
  color: "#d6cfa8"
  kind: 国家連合
  note: overlord（外枠）としてだけ使う枠。ウィーン会議で1815年に成立し、1866年の普墺戦争で解体。オーストリアが議長国で、連邦議会はフランクフルトに置かれた。プロイセン・オーストリアは旧帝国領の部分だけが加盟。君主欄は議長国の君主（1848–49年は帝国摂政）。
  rulers:
    - {name: フランツ1世, title: オーストリア皇帝（連邦議会の議長国）, from: 1815, to: 1835, note: 神聖ローマ皇帝としてはフランツ2世。, source: "https://ja.wikipedia.org/wiki/フランツ2世_(神聖ローマ皇帝)"}
    - {name: フェルディナント1世, title: オーストリア皇帝（連邦議会の議長国）, from: 1835, to: 1848, note: 実権は宰相メッテルニヒにあった。, source: "https://ja.wikipedia.org/wiki/フェルディナント1世_(オーストリア皇帝)"}
    - {name: ヨハン大公, title: 帝国摂政（フランクフルト国民議会が置いた臨時中央権力）, from: 1848, to: 1849, note: 1848年6月に国民議会が選出。連邦議会は権限を臨時中央権力に移した。1849年12月に辞任し、連邦議会の再開（1850–51年）までは、オーストリアとプロイセンの代表による「連邦中央委員会」が権限を引き継いだ。, source: "https://en.wikipedia.org/wiki/Archduke_John_of_Austria"}
    - {name: フランツ・ヨーゼフ1世, title: オーストリア皇帝（連邦議会の議長国）, from: 1850, to: 1866, note: 連邦議会は1850–51年に再開された。, source: "https://ja.wikipedia.org/wiki/フランツ・ヨーゼフ1世"}
  periods:
    - from: 1815
      to: 1847
      text: オーストリア宰相メッテルニヒのもとで、自由主義と国民統一の運動を抑えこんだ（1819年のカールスバート決議による大学・出版の取り締まり）。経済面ではプロイセン主導のドイツ関税同盟（1834）が広がった。
    - from: 1848
      to: 1850
      text: 三月革命。フランクフルトのパウロ教会で国民議会が開かれ、統一と憲法が議論された（大ドイツ主義と小ドイツ主義）。プロイセン王が帝冠を拒んで挫折し、連邦は復活した。
    - from: 1851
      to: 1866
      text: オーストリアとプロイセンが主導権を争った。シュレースヴィヒ・ホルシュタインの処理をめぐって対立が深まり、1866年の普墺戦争（ドイツ戦争）で連邦は解体した。
  source: "https://ja.wikipedia.org/wiki/ドイツ連邦"

- id: other_hre
  name: その他のドイツ諸邦
  names:
    - {to: 1805, name: その他の帝国諸邦}
  short: 諸邦
  color: "#dcdcd2"
  kind: 領邦の集まり
  note: 地図を見やすくするため、小さな帝国諸侯領・帝国都市・帝国修道院領・帝国騎士領などをまとめたもの。ピースの中で最も大きな部分を占める領邦がこれらの場合に使う。1806年以降は、ライン同盟などに加わった小国（イーゼンブルク、ライエンなど）や、所属が整理中の地域を表す。
  periods:
    - from: 1648
      to: 1802
      text: 南西ドイツ（シュヴァーベン・フランケン・ライン地方）は特に細分化され、数十の伯領、帝国都市、修道院領、帝国騎士の所領が入り組んでいた。
    - from: 1803
      to: 1806
      text: 帝国代表者会議主要決議（1803）で聖界領と帝国都市の大半が、ライン同盟結成（1806）で中小の諸侯・伯・帝国騎士の大半が、バイエルン・ヴュルテンベルク・バーデンなどに併合された（陪臣化）。
  source: "https://ja.wikipedia.org/wiki/帝国直属"

# ---------------------------------------------------------------- 世俗の大きな領邦

- id: bavaria
  name: バイエルン王国
  names:
    - {to: 1805, name: バイエルン選帝侯領, kind: 選帝侯領}
  short: バイエルン
  color: "#93d3d6"
  kind: 王国
  rulers:
    - {name: マクシミリアン1世, title: バイエルン公・選帝侯, from: 1597, to: 1651, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(バイエルン選帝侯)"}
    - {name: フェルディナント・マリア, title: バイエルン選帝侯, from: 1651, to: 1679, source: "https://en.wikipedia.org/wiki/Ferdinand_Maria,_Elector_of_Bavaria"}
    - {name: マクシミリアン2世エマヌエル, title: バイエルン選帝侯, from: 1679, to: 1726, note: 1706–1714年は帝国追放を受け、領国はオーストリアの占領下。1692–1706年はスペイン領ネーデルラント総督も兼ねた。, source: "https://en.wikipedia.org/wiki/Maximilian_II_Emanuel,_Elector_of_Bavaria"}
    - {name: カール・アルブレヒト（皇帝カール7世）, title: バイエルン選帝侯, from: 1726, to: 1745, source: "https://ja.wikipedia.org/wiki/カール7世_(神聖ローマ皇帝)"}
    - {name: マクシミリアン3世ヨーゼフ, title: バイエルン選帝侯, from: 1745, to: 1777, source: "https://en.wikipedia.org/wiki/Maximilian_III_Joseph,_Elector_of_Bavaria"}
    - {name: カール・テオドール, title: プファルツ＝バイエルン選帝侯, from: 1777, to: 1799, note: プファルツ選帝侯（1742–）がバイエルンを相続。, source: "https://en.wikipedia.org/wiki/Charles_Theodore,_Elector_of_Bavaria"}
    - {name: マクシミリアン4世ヨーゼフ（国王マクシミリアン1世）, title: バイエルン選帝侯→バイエルン王（1806–）, from: 1799, to: 1825, note: 宰相モンジュラが改革を主導。, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(バイエルン王)"}
    - {name: ルートヴィヒ1世, title: バイエルン王, from: 1825, to: 1848, note: 1848年、ローラ・モンテス事件と三月革命の中で退位。, source: "https://ja.wikipedia.org/wiki/ルートヴィヒ1世_(バイエルン王)"}
    - {name: マクシミリアン2世, title: バイエルン王, from: 1848, to: 1864, source: "https://ja.wikipedia.org/wiki/マクシミリアン2世_(バイエルン王)"}
    - {name: ルートヴィヒ2世, title: バイエルン王, from: 1864, to: 1886, note: 1886年に統治不能として廃位され、直後に急死。, source: "https://ja.wikipedia.org/wiki/ルートヴィヒ2世_(バイエルン王)"}
    - {name: オットー1世, title: バイエルン王, from: 1886, to: 1913, note: 精神の病のため、叔父ルイトポルト（1886–1912）とその子ルートヴィヒ（1912–13）が摂政として統治した。, source: "https://ja.wikipedia.org/wiki/オットー1世_(バイエルン王)"}
    - {name: ルートヴィヒ3世, title: バイエルン王, from: 1913, to: 1918, note: 1912–13年は摂政。1918年のドイツ革命で退位。, source: "https://ja.wikipedia.org/wiki/ルートヴィヒ3世_(バイエルン王)"}
  periods:
    - from: 1648
      to: 1700
      text: ウェストファリア条約で選帝侯位とオーバープファルツの領有を確認された、カトリックの南ドイツ最大の世俗領邦。
    - from: 1701
      to: 1714
      text: スペイン継承戦争でフランス側につき、1704年のブレンハイム（ヘーヒシュテット）の戦いで敗北。選帝侯は帝国追放となり、領国はオーストリアに占領された。1714年のラシュタット・バーデン条約で回復。
    - from: 1715
      to: 1739
      text: 選帝侯の帰国後、豪華な宮廷と戦費で財政が悪化した。カール・アルブレヒトはハプスブルク家の遺領の相続をねらい、国事詔書（プラグマティッシェ・ザンクツィオン）の承認を拒んだ。
    - from: 1740
      to: 1745
      text: オーストリア継承戦争でカール・アルブレヒトが皇帝カール7世に選ばれたが、本国はオーストリア軍に占領された。1745年1月にカール7世が死去し、子のマクシミリアン3世ヨーゼフがフュッセンの和約でオーストリア継承の要求を放棄して、本国を回復した。
    - from: 1746
      to: 1776
      text: マクシミリアン3世ヨーゼフのもとで戦争を避けて国力の回復につとめ、バイエルン科学アカデミーの創設（1759年）など啓蒙改革を進めた。
    - from: 1777
      to: 1799
      text: バイエルン系ヴィッテルスバッハ家が断絶し、プファルツ選帝侯カール・テオドールが相続（プファルツ＝バイエルン）。オーストリアのバイエルン獲得の企てはバイエルン継承戦争（1778–79）と諸侯同盟（1785）で阻まれた。
    - from: 1800
      to: 1815
      text: ナポレオンと結んでフランケン・シュヴァーベンの聖界領・帝国都市を獲得し、1806年に王国となった。1813年のリート条約で連合国側に転じ、王国の領土を保った。
    - from: 1816
      to: 1847
      text: 1818年に憲法を制定（南ドイツの立憲君主国）。ルートヴィヒ1世はミュンヘンを芸術の都として整え、1835年にはニュルンベルク–フュルト間にドイツ最初の鉄道が開通した。王子オットーは1832年にギリシア王となった。
    - from: 1848
      to: 1865
      text: 三月革命の中でルートヴィヒ1世が退位。マクシミリアン2世は学問を保護し、オーストリアとプロイセンの間で中小国をまとめる「第三のドイツ」の立場をとった。
    - from: 1866
      to: 1870
      text: ルートヴィヒ2世の治世。普墺戦争でオーストリア側について敗れ、プロイセンと秘密の攻守同盟を結んだ。1870年の普仏戦争ではプロイセン側で参戦し、11月の条約でドイツ帝国への加盟を決めた。
    - from: 1871
      to: 1914
      text: ドイツ帝国の構成国。軍隊（平時の指揮権）・郵便・鉄道などに独自の権限（留保権）を保った。ルートヴィヒ2世がノイシュヴァンシュタイン城などの築城に没頭した後、1886年から摂政ルイトポルトの時代が続いた。
  source:
    - "https://ja.wikipedia.org/wiki/バイエルン選帝侯領"
    - "https://ja.wikipedia.org/wiki/バイエルン王国"

- id: palatinate
  name: プファルツ選帝侯領
  short: プファルツ
  color: "#9fb6d9"
  kind: 選帝侯領
  note: ハイデルベルク（1720年からマンハイム）を首都とするライン中流の選帝侯領（クアプファルツ）。1777年からバイエルンと同君連合となり、この地図ではバイエルンの色で示す。
  rulers:
    - {name: カール1世ルートヴィヒ, title: プファルツ選帝侯, from: 1648, to: 1680, note: ウェストファリア条約で復位（第8の選帝侯位）。, source: "https://en.wikipedia.org/wiki/Charles_I_Louis,_Elector_Palatine"}
    - {name: カール2世, title: プファルツ選帝侯, from: 1680, to: 1685, note: ジンメルン系の断絶。, source: "https://en.wikipedia.org/wiki/Charles_II,_Elector_Palatine"}
    - {name: フィリップ・ヴィルヘルム, title: プファルツ選帝侯, from: 1685, to: 1690, note: ノイブルク系。, source: "https://en.wikipedia.org/wiki/Philip_William,_Elector_Palatine"}
    - {name: ヨハン・ヴィルヘルム, title: プファルツ選帝侯, from: 1690, to: 1716, note: デュッセルドルフに宮廷を置いた。1708–14年はオーバープファルツも領有。, source: "https://en.wikipedia.org/wiki/John_William,_Elector_Palatine"}
    - {name: カール3世フィリップ, title: プファルツ選帝侯, from: 1716, to: 1742, source: "https://en.wikipedia.org/wiki/Charles_III_Philip,_Elector_Palatine"}
    - {name: カール・テオドール, title: プファルツ選帝侯, from: 1742, to: 1799, note: 1777年からバイエルン選帝侯を兼ねる。, source: "https://en.wikipedia.org/wiki/Charles_Theodore,_Elector_of_Bavaria"}
    - {name: マクシミリアン4世ヨーゼフ, title: プファルツ＝バイエルン選帝侯, from: 1799, to: 1803, note: 1803年に右岸プファルツはバーデンなどへ。, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(バイエルン王)"}
  periods:
    - from: 1648
      to: 1684
      text: 三十年戦争で荒廃した国土の復興期。ウェストファリア条約で、オーバープファルツをバイエルンに残したまま、新設の第8選帝侯位とともに下プファルツを回復した。
    - from: 1685
      to: 1697
      text: ジンメルン系が断絶してカトリックのノイブルク系が継承。ルイ14世が弟の妃（リーゼロッテ）の相続権を口実に侵攻し（プファルツ継承戦争）、ハイデルベルクなどが焼き払われた。
    - from: 1698
      to: 1776
      text: ノイブルク系・ズルツバッハ系のもとで復興。1720年に首都をマンハイムに移し、カール・テオドールの宮廷はマンハイム楽派などで知られた。
  source: "https://ja.wikipedia.org/wiki/プファルツ選帝侯領"

- id: palatinate_neuburg
  name: プファルツ＝ノイブルク公国
  short: ノイブルク
  color: "#b3c3df"
  kind: 公国
  note: ドナウ河畔ノイブルクを中心とするヴィッテルスバッハ家の分家領（ユンゲ・プファルツ）。ユーリヒ＝ベルクも領有した。1685年にプファルツ選帝侯位を継いだため、以後はプファルツの色で示す。
  rulers:
    - {name: ヴォルフガング・ヴィルヘルム, title: プファルツ＝ノイブルク公, from: 1614, to: 1653, source: "https://en.wikipedia.org/wiki/Wolfgang_William,_Count_Palatine_of_Neuburg"}
    - {name: フィリップ・ヴィルヘルム, title: プファルツ＝ノイブルク公, from: 1653, to: 1690, note: 1685年からプファルツ選帝侯。, source: "https://en.wikipedia.org/wiki/Philip_William,_Elector_Palatine"}
  source: "https://de.wikipedia.org/wiki/Pfalz-Neuburg"

- id: zweibrucken
  name: プファルツ＝ツヴァイブリュッケン公国
  short: ツヴァイブリュッケン
  color: "#b9cfe0"
  kind: 公国
  note: ヴィッテルスバッハ家の分家領。1681–1718年はスウェーデン王が公を兼ねた（この期間は sweden の色）。1799年にマクシミリアン・ヨーゼフがバイエルン選帝侯を継いだ。
  rulers:
    - {name: フリードリヒ, title: ツヴァイブリュッケン公, from: 1635, to: 1661, source: "https://en.wikipedia.org/wiki/Frederick,_Count_Palatine_of_Zweibrücken"}
    - {name: フリードリヒ・ルートヴィヒ, title: ツヴァイブリュッケン公, from: 1661, to: 1681, note: ランツベルク系。要確認, source: "https://en.wikipedia.org/wiki/Frederick_Louis,_Count_Palatine_of_Zweibrücken"}
    - {name: カール11世（スウェーデン王）, title: ツヴァイブリュッケン公, from: 1681, to: 1697, source: "https://ja.wikipedia.org/wiki/カール11世_(スウェーデン王)"}
    - {name: カール12世（スウェーデン王）, title: ツヴァイブリュッケン公, from: 1697, to: 1718, source: "https://ja.wikipedia.org/wiki/カール12世_(スウェーデン王)"}
    - {name: グスタフ・サムエル・レオポルト, title: ツヴァイブリュッケン公, from: 1718, to: 1731, source: "https://en.wikipedia.org/wiki/Gustav_Samuel_Leopold,_Count_Palatine_of_Zweibrücken"}
    - {name: クリスティアン3世, title: ツヴァイブリュッケン公, from: 1731, to: 1735, source: "https://en.wikipedia.org/wiki/Christian_III,_Count_Palatine_of_Zweibrücken"}
    - {name: クリスティアン4世, title: ツヴァイブリュッケン公, from: 1735, to: 1775, source: "https://en.wikipedia.org/wiki/Christian_IV,_Count_Palatine_of_Zweibrücken"}
    - {name: カール2世アウグスト, title: ツヴァイブリュッケン公, from: 1775, to: 1795, source: "https://en.wikipedia.org/wiki/Charles_II_August,_Duke_of_Zweibrücken"}
    - {name: マクシミリアン・ヨーゼフ, title: ツヴァイブリュッケン公, from: 1795, to: 1799, note: 1799年にバイエルン選帝侯。領国はすでにフランスの占領下。, source: "https://ja.wikipedia.org/wiki/マクシミリアン1世_(バイエルン王)"}
  periods:
    - from: 1648
      to: 1697
