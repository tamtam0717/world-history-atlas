  periods:
    - from: 1453
      to: 1547
      text: アユタヤ朝はスコータイ朝を併合し（1438）、トライローカナート王が中央集権の制度（サクディナー制）を整えた。北のランナーと争い、マレー半島北部（パタニ・クダなど）に宗主権を広げた。1511年からポルトガル人が来航した。
    - from: 1548
      to: 1583
      text: ビルマのタウングー朝の侵攻を受け（1548年にスリヨータイ王妃が戦死）、1564年と1569年に都アユタヤが降って、ビルマに服属した。
    - from: 1584
      to: 1647
      text: ナレースワン王が独立を回復し（1584）、ノーンサーライの戦い（1593）でビルマを破り、カンボジアを従えた（1594）。17世紀前半は朱印船が来航し、日本町の山田長政が活躍した。1629年にプラーサートトーンが王位を奪った。
    - from: 1648
      to: 1766
      text: アユタヤ朝は東西交易の中継地として栄え、日本町・オランダ・フランスの商館が置かれた。ナーライ王はフランスと結んだが、1688年の政変で西洋人の勢力を退けた。18世紀にはビルマとの戦争がくり返された。
    - from: 1767
      to: 1850
      text: 1767年にアユタヤがビルマに滅ぼされたが、タークシンがトンブリー朝を開いて国を立て直し、1782年にラーマ1世がバンコクを都とするラタナコーシン朝を開いた。ラオス・カンボジア・ランナー・マレー北部の諸国を宗主権下に置いた。
    - from: 1851
      to: 1909
      text: ラーマ4世はボウリング条約（1855）で開国し、ラーマ5世はチャクリ改革で行政・軍・教育を近代化した。イギリス領ビルマ・マラヤとフランス領インドシナの間の緩衝国として、ラオス・カンボジア西部・マレー北部を譲りながら独立を保った。
    - from: 1910
      to: 1931
      text: 第一次世界大戦に連合国側で参戦し（1917）、戦後の条約改正で不平等条約を撤廃していった。
    - from: 1932
      to: 1944
      text: 1932年の立憲革命で絶対王政が終わった。ピブーン政権は1939年に国名をタイに改め、タイ＝フランス領インドシナ紛争（1940–41）で失地を回復し、太平洋戦争では日本と同盟を結んだ。
    - from: 1945
      to: 1972
      text: 戦後は抗日運動（自由タイ）の働きで敗戦国とされなかった。軍が実権を握る政権が続き（サリット・タノム）、冷戦期はアメリカと結んで東南アジア条約機構（SEATO）に加わり、ベトナム戦争ではアメリカ軍に基地を提供した。
    - from: 1973
      to: 2025
      text: 1973年の学生革命以後、民政と軍事クーデタ（1976・1991・2006・2014年）がくり返された。工業化で高い経済成長をとげたが、1997年のアジア通貨危機の発端ともなった。
  note: >-
    1945年9月–1949年5月は国名がシャムに戻ったが、地図ではタイとした。立憲革命（1932）の後の主な首相：プリーディー、ピブーン（1938–44、1948–57）、
    サリット（1959–63）、タノム（1963–73）、タクシン（2001–06）、プラユット（2014–23）、ペートンタン（2024–25）、アヌティン（2025–）。
    1564–67年・1569–83年はビルマ（タウングー朝）に服属したので、ビルマの帯を付ける。明・清への朝貢は続いたが（ラタナコーシン朝は1850年代まで）、宗主権の帯は付けない。
  source:
    - "https://ja.wikipedia.org/wiki/アユタヤ王朝"
    - "https://ja.wikipedia.org/wiki/チャクリー王朝"
    - "https://ja.wikipedia.org/wiki/タイの歴史"

