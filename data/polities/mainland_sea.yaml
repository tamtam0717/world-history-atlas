    - {name: ゴ・ディン・ジエム, title: 大統領, from: 1955, to: 1963, note: 1963年11月のクーデタで殺された, source: "https://ja.wikipedia.org/wiki/ゴ・ディン・ジエム"}
    - {name: ズオン・ヴァン・ミン, title: 軍事革命評議会議長, from: 1963, to: 1964, note: 1964–65年はグエン・カーンら軍人の政権が交代した, source: "https://ja.wikipedia.org/wiki/ズオン・ヴァン・ミン"}
    - {name: グエン・ヴァン・チュー, title: 国家指導評議会議長・大統領, from: 1965, to: 1975, note: 1965–67年は首相グエン・カオ・キと並ぶ, source: "https://ja.wikipedia.org/wiki/グエン・ヴァン・チュー"}
    - {name: ズオン・ヴァン・ミン, title: 大統領, from: 1975, to: 1975, note: 1975年4月30日に降伏した, source: "https://ja.wikipedia.org/wiki/ズオン・ヴァン・ミン"}
  periods:
    - from: 1949
      to: 1954
      text: フランスが元皇帝バオ・ダイを元首に立てた国。フランス連合の協同国として、フランス軍の支配地を治めた。
    - from: 1955
      to: 1963
      text: アメリカの支援を受けたゴ・ディン・ジエムが国民投票でバオ・ダイを廃して共和国とした。ジュネーヴ協定の統一選挙を拒み、独裁と仏教徒の弾圧への反発が強まった。
    - from: 1964
      to: 1975
      text: 軍のクーデタが相次ぐ中、アメリカ軍が本格的に介入し（最大で約54万人）、南ベトナム解放民族戦線・北ベトナム軍と戦った。1973年にアメリカ軍が撤退し、1975年4月30日にサイゴンが落ちて滅んだ。
  note: 1949–1953年はフランス連合の協同国なので、宗主権（overlord）をフランスとした
  source: "https://ja.wikipedia.org/wiki/ベトナム共和国"

