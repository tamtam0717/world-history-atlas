    - {name: アン・ドゥオン, title: カンボジア王, from: 1841, to: 1860, note: 1841年からシャムの後ろ盾で王を名のり、1848年に正式に即位した。シャムとベトナムの両方の宗主権を受けた。フランスに保護を求めた, source: "https://en.wikipedia.org/wiki/Ang_Duong"}
