      to: 1677
      text: 1592年に黎朝・鄭氏に都を追われた莫朝の一族が、明（のち清）の保護のもとで中国との国境の高平（カオバン）に残った。1677年に鄭氏に滅ぼされた。
  source: "https://ja.wikipedia.org/wiki/莫朝"

- id: nguyen_lords
  name: 広南国（広南阮氏）
  names:
