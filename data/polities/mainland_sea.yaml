  periods:
    - from: 2024
      to: 2025
      text: 2023年秋からの少数民族武装勢力の攻勢（1027作戦）の中で、ラカイン人の武装勢力アラカン軍が国軍を破り、2024年末までにラカイン州17郡区のうち14郡区をおさえた。州都シットウェーとチャウピューなどは国軍が保った。
  note: ロヒンギャの人々がアラカン軍の側からも迫害を受けているとの報告がある
