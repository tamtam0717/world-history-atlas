    - {name: オン・ロン, title: ヴィエンチャン王, from: 1730, to: 1767, source: "https://en.wikipedia.org/wiki/Kingdom_of_Vientiane"}
    - {name: オン・ブン（シリブンニャサーン）, title: ヴィエンチャン王, from: 1767, to: 1779, note: 1779年にシャムのチャクリー（のちのラーマ1世）に都を落とされ、エメラルド仏がバンコクに運ばれた, source: "https://en.wikipedia.org/wiki/Ong_Boun"}
    - {name: ナンタセーン, title: ヴィエンチャン王, from: 1781, to: 1795, source: "https://en.wikipedia.org/wiki/Nanthasen"}
    - {name: インタウォン, title: ヴィエンチャン王, from: 1795, to: 1804, source: "https://en.wikipedia.org/wiki/Inthavong"}
    - {name: アヌウォン, title: ヴィエンチャン王, from: 1804, to: 1828, note: 1826–28年にシャムに反乱を起こして敗れ、都は破壊された, source: "https://ja.wikipedia.org/wiki/アヌウォン"}
  periods:
    - from: 1707
      to: 1778
      text: ラーンサーンの分裂で生まれた王国。メコン川中流の両岸（現在のラオス中部とタイ東北部）を治めた。
    - from: 1779
      to: 1828
      text: 1779年にシャムに征服されて宗主権下に入った。アヌウォン王の反乱（1826–28）が鎮められ、王国は滅んで都は破壊された。住民の多くはメコン川の西岸（タイ東北部）に移された。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Vientiane"

- id: luang_prabang
  name: ルアンパバーン王国
  short: ルアンパバーン
  color: "#f7dba6"
  kind: 王国
  rulers:
    - {name: キンキッサラート, title: ルアンパバーン王, from: 1707, to: 1713, source: "https://en.wikipedia.org/wiki/Kingkitsarath"}
    - {name: アヌルット, title: ルアンパバーン王, from: 1791, to: 1817, source: "https://en.wikipedia.org/wiki/Kingdom_of_Luang_Phrabang"}
    - {name: マンタトゥラート, title: ルアンパバーン王, from: 1817, to: 1836, source: "https://en.wikipedia.org/wiki/Manthaturath"}
    - {name: ウンカム, title: ルアンパバーン王, from: 1872, to: 1894, note: 1887年に黒旗軍（ホー）に都を荒らされ、フランスのパヴィに救われた, source: "https://en.wikipedia.org/wiki/Oun_Kham"}
    - {name: シーサワンウォン, title: ルアンパバーン王（1946年からラオス国王）, from: 1904, to: 1959, source: "https://ja.wikipedia.org/wiki/シーサワンウォン"}
  periods:
    - from: 1707
      to: 1778
      text: ラーンサーンの分裂で生まれた北部の王国。ビルマと清の侵入を受けた。
    - from: 1779
      to: 1892
      text: シャムの宗主権下にあった（ベトナムにも朝貢した）。1887年に中国系の黒旗軍（ホー）に都を荒らされた。
    - from: 1893
      to: 1945
      text: 1893年のフランス＝シャム条約でフランスの保護国となり、フランス領インドシナのラオスの中心となった。
  note: 王の一覧は一部のみ（要確認）
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Luang_Phrabang"

- id: champasak
  name: チャンパーサック王国
  short: チャンパーサック
  color: "#fbceb6"
  kind: 王国
  rulers:
    - {name: ノーカサット（ソイシーサムット）, title: チャンパーサック王, from: 1713, to: 1737, source: "https://en.wikipedia.org/wiki/Kingdom_of_Champasak"}
    - {name: サイヤクマーン, title: チャンパーサック王, from: 1737, to: 1791, source: "https://en.wikipedia.org/wiki/Sayakumane"}
    - {name: カムスック, title: チャンパーサック王, from: 1863, to: 1899, source: "https://en.wikipedia.org/wiki/Kham_Souk"}
  periods:
    - from: 1713
      to: 1778
      text: ラーンサーンの南部が分かれてできた王国。メコン川中流域とタイ東北部の南部を治めた。
    - from: 1779
      to: 1904
      text: 1779年にシャムの宗主権下に入った。1893年に東岸をフランスに譲り、1904年に西岸もフランス領となって、王家は地方の知事となった。
  note: 王の一覧は一部のみ（要確認）。王家のブン・ウム（1912–1980）は1946年にフランスと結び、ラオス王国の南部の実力者となった
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Champasak"

- id: phuan
  name: シエンクアン（プアン侯国）
  short: シエンクアン
  color: "#cdb98e"
  kind: 侯国
  periods:
    - from: 1707
      to: 1831
      text: ジャール平原のプアン人の小国。ヴィエンチャン・ルアンパバーンとベトナムの両方に貢納した。
    - from: 1832
      to: 1892
      text: 1832年にベトナム（阮朝の明命帝）に併合され（鎮寧府）、のちに王家が戻されたが、1870年代からは黒旗軍（ホー）の略奪とシャムの出兵にさらされた。
  source: "https://en.wikipedia.org/wiki/Muang_Phuan"

- id: laos
  name: ラオス
  names:
    - {to: 1945, name: ラオ・イサラ（自由ラオス）政府, short: ラオス, kind: 臨時政府}
    - {from: 1946, to: 1974, name: ラオス王国, short: ラオス, kind: 王国}
    - {from: 1975, name: ラオス人民民主共和国, short: ラオス, kind: 社会主義共和国（ラオス人民革命党の一党制）}
  short: ラオス
  color: "#f2c48a"
  kind: 国
  rulers:
    - {name: ペッサラート, title: ラオ・イサラ政府の首班, from: 1945, to: 1946, note: 1945年10月にラオスの独立を宣言したが、1946年にフランスが戻った, source: "https://ja.wikipedia.org/wiki/ペッサラート"}
    - {name: シーサワンウォン, title: ラオス国王, from: 1946, to: 1959, source: "https://ja.wikipedia.org/wiki/シーサワンウォン"}
    - {name: サワンワッタナー, title: ラオス国王, from: 1959, to: 1975, note: 1975年に退位させられ、再教育キャンプで死んだとされる, source: "https://ja.wikipedia.org/wiki/サワンワッタナー"}
    - {name: カイソーン・ポムウィハーン, title: ラオス人民革命党書記長・首相（1991年から国家主席）, from: 1975, to: 1992, note: 国家主席はスパーヌウォン（1975–91）, source: "https://ja.wikipedia.org/wiki/カイソーン・ポムウィハーン"}
    - {name: カムタイ・シーパンドーン, title: ラオス人民革命党議長・国家主席, from: 1992, to: 2006, source: "https://ja.wikipedia.org/wiki/カムタイ・シーパンドーン"}
    - {name: チュンマリー・サイニャソーン, title: ラオス人民革命党書記長・国家主席, from: 2006, to: 2016, source: "https://ja.wikipedia.org/wiki/チュンマリー・サイニャソーン"}
    - {name: ブンニャン・ウォーラチット, title: ラオス人民革命党書記長・国家主席, from: 2016, to: 2021, source: "https://ja.wikipedia.org/wiki/ブンニャン・ウォーラチット"}
    - {name: トンルン・シースリット, title: ラオス人民革命党書記長・国家主席, from: 2021, to: 2025, source: "https://ja.wikipedia.org/wiki/トンルン・シースリット"}
  periods:
    - from: 1945
      to: 1953
      text: 日本の降伏後にラオ・イサラ（自由ラオス）が独立を宣言したが、1946年にフランスが戻った。1949年にフランス連合内の協同国となり、1953年に完全に独立した。
    - from: 1954
      to: 1974
      text: ジュネーヴ協定の後、王国政府と共産主義勢力のパテート・ラーオ（ネオ・ラーオ・ハクサット）の対立が内戦となった。中立派・右派・左派の連合政府は長続きせず、ベトナム戦争の中で東部をホー・チ・ミン・ルートが通り、アメリカの大規模な爆撃を受けた。
    - from: 1975
      to: 1985
      text: 1975年12月に王政を廃してラオス人民民主共和国が成立し、ラオス人民革命党の一党支配となった。ベトナムと「特別な関係」を結んだ。
    - from: 1986
      to: 2025
      text: 新経済メカニズム（チンタナカーン・マイ）で市場経済を取り入れ、1997年にASEANに加盟した。中国の投資が増え、2021年に中国・ラオス鉄道が開通した。
  note: 1946–1948年はフランスの保護国（france・間接統治）、1949–1952年はフランス連合の協同国（overlord france）として塗る
  source: "https://ja.wikipedia.org/wiki/ラオスの歴史"

- id: pathet_lao
  name: パテート・ラーオ
  short: パテート・ラーオ
  color: "#c4826a"
  kind: 共産主義勢力（ネオ・ラーオ・ハクサット）
  rulers:
    - {name: スパーヌウォン, title: パテート・ラーオの指導者（「赤い殿下」）, from: 1950, to: 1975, note: 実際の指導者はラオス人民党（1955年結成）書記長のカイソーン・ポムウィハーン, source: "https://ja.wikipedia.org/wiki/スパーヌウォン"}
  periods:
    - from: 1954
      to: 1957
      text: ジュネーヴ協定で北東部のフアパン・ポンサーリー2州に集結地を与えられた。1957年の連合政府で一時、王国政府に統合された。
    - from: 1960
      to: 1975
      text: 1960年のコン・レーのクーデタ以後、内戦が再燃し、北ベトナムの支援で東部の山地を広くおさえた。1975年に全土を握り、ラオス人民民主共和国を建てた。
  source: "https://ja.wikipedia.org/wiki/パテート・ラーオ"

# ---- カンボジア ----

