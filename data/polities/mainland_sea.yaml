  kind: 王国（チャム人）
  rulers:
    - {name: マハー・カリ（摩訶貴来）, title: チャンパー王, from: 1446, to: 1449, note: "在位年は要確認", source: "https://en.wikipedia.org/wiki/List_of_Champa_kings"}
    - {name: マハー・カイ（摩訶貴由）, title: チャンパー王, from: 1449, to: 1458, note: "在位年は要確認", source: "https://en.wikipedia.org/wiki/List_of_Champa_kings"}
    - {name: 槃羅茶悦（マハー・サヤ）, title: チャンパー王, from: 1458, to: 1460, note: "要確認", source: "https://en.wikipedia.org/wiki/List_of_Champa_kings"}
    - {name: 槃羅茶全（マハー・サジャン）, title: チャンパー王, from: 1460, to: 1471, note: "1471年に黎聖宗に捕らえられた", source: "https://en.wikipedia.org/wiki/List_of_Champa_kings"}
    - {name: ボー・チー・チー（布持持）, title: チャンパー王（南部）, from: 1471, to: 1478, note: "南部のパーンドゥランガに逃れて王となった。以後の16世紀の王の系譜ははっきりしない（要確認）", source: "https://en.wikipedia.org/wiki/List_of_Champa_kings"}
    - {name: ポー・クロン・ハラウ, title: チャンパー王, from: 1579, to: 1603, source: "https://en.wikipedia.org/wiki/Po_Klaong_Halau"}
    - {name: ポー・ニット, title: チャンパー王, from: 1603, to: 1613, source: "https://en.wikipedia.org/wiki/Po_Nit"}
    - {name: ポー・ジャイ・パラン, title: チャンパー王, from: 1613, to: 1618, source: "https://en.wikipedia.org/wiki/Po_Jai_Paran"}
    - {name: ポー・アイア・カ, title: チャンパー王, from: 1618, to: 1622, source: "https://en.wikipedia.org/wiki/Po_Aia_Ka"}
    - {name: ポー・クロン・メナイ, title: チャンパー王, from: 1622, to: 1627, source: "https://en.wikipedia.org/wiki/Po_Klaong_Menai"}
    - {name: ポー・ローム, title: チャンパー王, from: 1627, to: 1651, source: "https://en.wikipedia.org/wiki/Po_Rome"}
  periods:
    - from: 1453
      to: 1470
      text: 2世紀から中部ベトナムに続いたチャム人の王国。都はヴィジャヤ（現在のビンディン省）。明の冊封を受け、北の大越と争った。
    - from: 1471
      to: 1647
      text: 1471年に大越の黎聖宗に都ヴィジャヤを落とされ、王国は南部（カウターラ・パーンドゥランガ）に縮んだ。明への朝貢は16世紀半ばまで続いた。17世紀初めから広南阮氏の南進を受けた。
    - from: 1648
      to: 1692
      text: 2世紀から中部ベトナムに続いたチャム人の王国の最後の部分（パーンドゥランガ、現在のニントゥアン・ビントゥアン）。広南阮氏の南進で領土を失っていった。
    - from: 1693
      to: 1832
      text: 1692–97年に阮氏に征服され、阮氏（のち阮朝）のもとの自治的な領域（順城鎮）となった。1832年に明命帝が廃し、チャンパーは消滅した。
  note: 明の冊封の帯は1470年まで（都ヴィジャヤの陥落まで）。1471年より後も朝貢したが、王権が分かれ明の冊封の実態が薄いので帯は付けない。15–16世紀の王の名と在位年は漢文史料・チャム語史料で食い違う（要確認）
  source: "https://ja.wikipedia.org/wiki/チャンパー"

