    - {name: ノーラタ・ミンソー, title: ランナー王, from: 1579, to: 1607, note: "バインナウンの子。タウングー朝が分裂するとシャムに従った", source: "https://en.wikipedia.org/wiki/Nawrahta_Minsaw"}
    - {name: タド・チョー, title: ランナー王, from: 1607, to: 1608, note: "ノーラタ・ミンソーの子（要確認）", source: "https://en.wikipedia.org/wiki/Lan_Na"}
    - {name: シーソンムアン, title: ランナー王, from: 1608, to: 1614, note: "ノーラタ・ミンソーの子。1614–15年のビルマの侵攻で捕らえられた（要確認）", source: "https://en.wikipedia.org/wiki/Lan_Na"}
    - {name: カーウィラ, title: チェンマイ王（領主）, from: 1782, to: 1813, note: シャムと結んでビルマ軍を追い、1797年にチェンマイを復興した, source: "https://en.wikipedia.org/wiki/Kawila"}
    - {name: インタウィチャヤーノン, title: チェンマイ王, from: 1873, to: 1897, source: "https://en.wikipedia.org/wiki/Inthawichayanon"}
  periods:
    - from: 1453
      to: 1557
      text: ティローカラート王のもとで最盛期を迎え、アユタヤと争い、チェンマイは上座部仏教の中心となった（1477年の仏典結集）。16世紀前半から王位争いで弱まり、1546–51年はラーンサーンの王子セーターティラートが王となった。
    - from: 1558
      to: 1647
      text: 1558年にバインナウンに征服されてビルマの属国となり、ビルマ人の王族が治めた。タウングー朝の分裂で一時シャムに従ったが（1600–14）、アナウッペッルン王に再び従えられた。
    - from: 1648
      to: 1774
      text: 1558年からビルマの支配下にあった。1727年にチェンマイが反乱を起こして自立したが、1763年にコンバウン朝に再び征服された。
    - from: 1775
      to: 1898
      text: 1775年にシャムの援軍を得てビルマ軍を追い、シャムの宗主権のもとでカーウィラの一族（チェットトン家）が治めた。19世紀末からシャムが中央集権化を進め、1899年に州（モントン・パーヤップ）として組み込んだ。
  note: 1615年以後の王（ビルマが任じた領主）は省略した（要確認）。ナーン（ナーン県）・プレー（プレー県）は別の小王国だったが、地図ではランナーにまとめた。北部の小国の王の一覧は省略
  source: "https://en.wikipedia.org/wiki/Lan_Na"

- id: patani
  name: パタニ王国
  short: パタニ
  color: "#9fe2eb"
  kind: スルタン国
  periods:
    - from: 1453
      to: 1647
      text: マレー半島北東岸の港市国家。15世紀半ばに王がイスラームに改宗したと伝えられる。16世紀末から女王たち（ラジャ・ヒジャウ、ビル、ウング、クニン）のもとで栄え、日本・オランダ・イギリスの商人が訪れた。アユタヤの宗主権を受けたが、たびたび背いた。
    - from: 1648
      to: 1785
      text: マレー半島北東岸のイスラーム教のスルタン国。港市として栄え、アユタヤに金銀の花（ブンガ・マス）を贈ったが、たびたび自立した。
    - from: 1786
      to: 1808
      text: 1786年にラタナコーシン朝のシャムに征服され、シャムが王を立てた。1808年に7つの州に分けられた。
  note: 南タイのマレー系ムスリムの分離運動（20世紀後半から）の背景になった
  source: "https://en.wikipedia.org/wiki/Patani_Kingdom"

# ---- ラオス ----

- id: lan_xang
  name: ラーンサーン王国
  short: ラーンサーン
  color: "#f2c48a"
  kind: 王国
  rulers:
    - {name: チャッカパット・ペーンペオ, title: ラーンサーン王, from: 1442, to: 1479, note: "1479年の大越（黎聖宗）の侵攻で都を落とされ、退位した", source: "https://en.wikipedia.org/wiki/Chakkaphat_Phaen_Phaeo"}
    - {name: スワンナ・バンラン, title: ラーンサーン王, from: 1479, to: 1486, source: "https://en.wikipedia.org/wiki/Suvanna_Banlang"}
    - {name: ラーセーンタイ, title: ラーンサーン王, from: 1486, to: 1496, source: "https://en.wikipedia.org/wiki/Lahsaenthai_Bouvanart"}
    - {name: ソムプー, title: ラーンサーン王, from: 1496, to: 1501, source: "https://en.wikipedia.org/wiki/Somphou"}
    - {name: ウィスン, title: ラーンサーン王, from: 1501, to: 1520, note: "パバーン仏をルアンパバーンに迎えた", source: "https://en.wikipedia.org/wiki/Visoun"}
    - {name: ポーティサラート, title: ラーンサーン王, from: 1520, to: 1548, note: "上座部仏教を保護し、精霊信仰を禁じた", source: "https://en.wikipedia.org/wiki/Photisarath"}
    - {name: セーターティラート, title: ラーンサーン王, from: 1548, to: 1571, note: "1560年に都をヴィエンチャンに移し、タート・ルアンを建てた。バインナウンの侵攻に抵抗し、南部の遠征中に行方不明となった", source: "https://ja.wikipedia.org/wiki/セーターティラート"}
    - {name: セーン・スリンタ, title: ラーンサーン王, from: 1572, to: 1574, note: "1571年から摂政。1580–82年に復位した", source: "https://en.wikipedia.org/wiki/Sen_Soulintha"}
    - {name: マハーウパハート（ウォラウォンサー1世）, title: ラーンサーン王（ビルマの臣下）, from: 1575, to: 1579, note: "セーターティラートの弟。ビルマに連れ去られていたが、バインナウンに王に立てられた", source: "https://en.wikipedia.org/wiki/Voravongsa_I"}
    - {name: セーン・スリンタ（復位）, title: ラーンサーン王, from: 1580, to: 1582, source: "https://en.wikipedia.org/wiki/Sen_Soulintha"}
    - {name: ナコーン・ノーイ, title: ラーンサーン王（ビルマの臣下）, from: 1582, to: 1583, note: "1583年からは王のいない時期が続いた（1591年まで）", source: "https://en.wikipedia.org/wiki/Nakhon_Noi"}
    - {name: ノケオ・クマーン, title: ラーンサーン王, from: 1591, to: 1596, note: "セーターティラートの子。ビルマから戻って独立を回復した", source: "https://en.wikipedia.org/wiki/Nokeo_Koumane"}
    - {name: ウォラウォンサー2世, title: ラーンサーン王, from: 1596, to: 1621, note: "1596–99年はウォラピターが摂政", source: "https://en.wikipedia.org/wiki/Voravongsa_II"}
    - {name: ウパユワラート2世, title: ラーンサーン王, from: 1621, to: 1622, source: "https://en.wikipedia.org/wiki/Upayuvarat_II"}
    - {name: ポーティサラート2世, title: ラーンサーン王, from: 1622, to: 1627, source: "https://en.wikipedia.org/wiki/Photisarath_II"}
    - {name: モン・ケーオ, title: ラーンサーン王, from: 1627, to: 1627, source: "https://en.wikipedia.org/wiki/Mon_Keo"}
    - {name: トン・カム, title: ラーンサーン王, from: 1627, to: 1633, source: "https://en.wikipedia.org/wiki/Tone_Kham"}
    - {name: ウィサイ, title: ラーンサーン王, from: 1633, to: 1637, source: "https://en.wikipedia.org/wiki/Visai_(king)"}
    - {name: スリニャウォンサー, title: ラーンサーン王, from: 1638, to: 1695, note: ラーンサーンの最盛期。オランダ商人ファン・ウストホフが都ヴィエンチャンを訪れた（1641）, source: "https://en.wikipedia.org/wiki/Sourigna_Vongsa"}
    - {name: セーターティラート2世（サイ・オン・フエ）, title: ラーンサーン王（ヴィエンチャン）, from: 1698, to: 1707, note: ベトナムの支援で王位に就いた, source: "https://en.wikipedia.org/wiki/Setthathirath_II"}
  periods:
    - from: 1453
      to: 1547
      text: ファー・グムが開いた（1353）ラーオ人の王国。都はルアンパバーン（シエントーン）。1479年に大越の黎聖宗の侵攻を受けた。ウィスン王・ポーティサラート王のもとで上座部仏教が広まった。
    - from: 1548
      to: 1573
      text: セーターティラート王がビルマの脅威に備えて都をヴィエンチャンに移し（1560）、タート・ルアンを建てた。アユタヤと結んでバインナウンの侵攻（1565・1569–70）に抵抗した。
    - from: 1574
      to: 1637
      text: セーターティラートの死後に王位争いが続き、1574年にビルマに服属した。1591年にノケオ・クマーンが独立を回復したが、17世紀前半も王の交代が相次いだ。
    - from: 1648
      to: 1694
      text: スリニャウォンサー王のもとで、ラオスとタイ東北部（イサーン）を治めたラーオ人の王国の最盛期。
    - from: 1695
      to: 1707
      text: 王の死後に継承争いが起こり、1707年にルアンパバーン王国とヴィエンチャン王国に分かれた（1713年には南部がチャンパーサック王国として分かれた）。
  note: 1574–90年はビルマ（タウングー朝）に服属したので、ビルマの帯を付ける。在位年は資料によって1–2年違う（要確認）
  source: "https://ja.wikipedia.org/wiki/ラーンサーン王国"

