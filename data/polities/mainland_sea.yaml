  periods:
    - from: 1453
      to: 1530
      text: ベンガルのスルタンの助けで復位したミン・ソー・モンが1430年にミャウーに都を置いて開いた王国。初めはベンガルに貢納し、仏教徒の王がイスラーム風の称号も名のった。1459年にチッタゴンを取った。
    - from: 1531
      to: 1647
      text: ミン・ビン王のもとで強大になり、ポルトガル人の傭兵・海賊とともにベンガル沿岸を支配した。1580年にバインナウンの軍にサンドウェーを奪われたが取り戻し、1599年にはタウングーと結んでペグーを落とした。
    - from: 1648
      to: 1666
      text: ベンガル湾に面した交易国家。仏教徒の王がポルトガル人の傭兵・海賊とともにベンガルを襲い、チッタゴンを支配した。
    - from: 1667
      to: 1784
      text: 1666年にムガル帝国にチッタゴンを奪われ、以後は王の廃立が相次いで衰えた。1784年にビルマのボードーパヤー王に征服された（マハムニ仏像はマンダレーに運ばれた）。
  note: 王の名と在位年は英語版 Wikipedia の一覧による（ビルマ年代記と細部が違うものがある）。15世紀のベンガルへの貢納は帯にしていない。チッタゴン（バングラデシュのピース）は S2 の担当
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Mrauk_U"

