    - {name: 鄭森（チン・サム）, title: 鄭主, from: 1767, to: 1782, note: 1774–75年に阮氏の都フエ（富春）を奪った, source: "https://en.wikipedia.org/wiki/Trịnh_Sâm"}
    - {name: 鄭楷（チン・カイ）, title: 鄭主, from: 1782, to: 1786, note: 1782年の鄭檊（チン・カン）の短い在位の後。1786年に西山軍に敗れて自殺した, source: "https://en.wikipedia.org/wiki/Trịnh_Khải"}
  periods:
    - from: 1453
      to: 1526
      text: 黎利が明の支配を退けて開いた黎朝（1428）。聖宗（1460–97）のもとで最盛期となり、明にならった官僚制と洪徳律令を整え、チャンパーの都ヴィジャヤを落として（1471）南に領土を広げた。明の冊封を受けた。16世紀初めから暴君と反乱が続いた。
    - from: 1527
      to: 1591
      text: 1527年に莫登庸が帝位を奪い（莫朝）、黎朝の遺臣の阮淦がラオスで黎の皇族を立てて（1533）タインホアを拠点に戦った（南北朝）。阮淦の死後は娘婿の鄭検が実権を握り、その子の鄭松が北に攻めのぼった。
    - from: 1592
      to: 1647
      text: 鄭松が莫朝から昇竜（ハノイ）を取り戻し（1592）、明も黎朝を安南都統使として認めた（1597）。中部を治めていた阮潢が自立し（1600）、1627年から鄭氏と阮氏の戦争（鄭阮紛争）が始まった。
    - from: 1648
      to: 1672
      text: 黎朝の皇帝のもとで鄭氏が北部（東京〈トンキン〉）の実権を握り、中部の広南阮氏と戦った（鄭阮紛争、1627–1672）。
    - from: 1673
      to: 1773
      text: 和約の後、ザイン川（霊江）を境に南北の分立が約100年続いた。北部では農民反乱が相次いだ（18世紀半ば）。
    - from: 1774
      to: 1786
      text: 西山の反乱に乗じて南に出兵し、阮氏の都フエを奪った（1775）。1786年に西山軍の阮恵（グエン・フエ）に滅ぼされた。
  note: >-
    1527–32年は莫朝（mac_cao_bang）が全土を治めたので、黎朝の領土はない。1545年からの元首は実権を持つ鄭主とした。
    1548–1643年の黎朝の皇帝：中宗（1548–56）、英宗（1556–73）、世宗（1573–99）、敬宗（1600–19）、神宗（1619–43）。
    明の冊封の帯：1453–1526年、1597–1643年（明は1597年に黎朝を「安南都統使」として認めた）。
    黎朝の皇帝（名目上の君主）：真宗（1643–49）、神宗（1649–62、再位）、玄宗（1662–71）、嘉宗（1671–75）、熙宗（1675–1705）、裕宗（1705–29）、
    …、顕宗（1740–86）、愍帝（昭統帝、1786–89）。清は1667年に黎朝の皇帝を安南国王に冊封したので、それ以後は清の宗主権の帯を付ける。
  source:
    - "https://ja.wikipedia.org/wiki/黎朝"
    - "https://ja.wikipedia.org/wiki/鄭氏政権"

