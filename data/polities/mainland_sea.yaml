      text: 西山邑（ビンディン省）の阮岳・阮恵・阮侶の3兄弟が阮氏に対して反乱を起こし、1777年に阮氏の一族をほぼ滅ぼした。1785年にはシャムの侵攻を退けた。
    - from: 1786
      to: 1792
      text: 1786年に鄭氏を滅ぼし、1788年に阮恵が光中帝として即位して、黎朝を助けて侵入した清軍を1789年に破った。ベトナムの大部分を統一した。
    - from: 1793
      to: 1802
      text: 光中帝の死後に内紛で弱まり、南から北上した阮福映に1802年に滅ぼされた。
  note: 1789年から清の冊封を受けたので、宗主権の帯を付ける
  source: "https://ja.wikipedia.org/wiki/西山朝"

