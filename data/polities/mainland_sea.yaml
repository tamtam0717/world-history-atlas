    - {name: 咸宜帝, title: 阮朝の皇帝, from: 1884, to: 1885, note: 1883–84年に育徳帝・協和帝・建福帝が短期で立った後に即位。1885年に都を逃れて勤王運動を起こした, source: "https://ja.wikipedia.org/wiki/咸宜帝"}
    - {name: 同慶帝, title: 阮朝の皇帝（フランスの保護国）, from: 1885, to: 1889, source: "https://ja.wikipedia.org/wiki/同慶帝"}
    - {name: 成泰帝, title: 阮朝の皇帝（フランスの保護国）, from: 1889, to: 1907, source: "https://ja.wikipedia.org/wiki/成泰帝"}
    - {name: 維新帝, title: 阮朝の皇帝（フランスの保護国）, from: 1907, to: 1916, note: 1916年の反仏の挙兵に加わって流された, source: "https://ja.wikipedia.org/wiki/維新帝"}
    - {name: 啓定帝, title: 阮朝の皇帝（フランスの保護国）, from: 1916, to: 1925, source: "https://ja.wikipedia.org/wiki/啓定帝"}
    - {name: バオ・ダイ（保大帝）, title: 阮朝の皇帝（最後の皇帝）, from: 1926, to: 1945, note: 1945年8月の八月革命で退位した, source: "https://ja.wikipedia.org/wiki/バオ・ダイ"}
    - {name: レ・ズアン, title: ベトナム共産党書記長, from: 1976, to: 1986, source: "https://ja.wikipedia.org/wiki/レ・ズアン"}
    - {name: チュオン・チン, title: ベトナム共産党書記長, from: 1986, to: 1986, source: "https://ja.wikipedia.org/wiki/チュオン・チン"}
    - {name: グエン・ヴァン・リン, title: ベトナム共産党書記長, from: 1986, to: 1991, note: ドイモイ（刷新）政策を始めた, source: "https://ja.wikipedia.org/wiki/グエン・ヴァン・リン"}
    - {name: ド・ムオイ, title: ベトナム共産党書記長, from: 1991, to: 1997, source: "https://ja.wikipedia.org/wiki/ド・ムオイ"}
    - {name: レ・カー・フュー, title: ベトナム共産党書記長, from: 1997, to: 2001, source: "https://ja.wikipedia.org/wiki/レ・カー・フュー"}
    - {name: ノン・ドゥック・マイン, title: ベトナム共産党書記長, from: 2001, to: 2011, source: "https://ja.wikipedia.org/wiki/ノン・ドゥック・マイン"}
    - {name: グエン・フー・チョン, title: ベトナム共産党書記長, from: 2011, to: 2024, note: 2018–21年は国家主席も兼ねた, source: "https://ja.wikipedia.org/wiki/グエン・フー・チョン"}
    - {name: トー・ラム, title: ベトナム共産党書記長, from: 2024, to: 2025, source: "https://ja.wikipedia.org/wiki/トー・ラム"}
  periods:
    - from: 1802
      to: 1857
      text: 阮福映（嘉隆帝）が西山朝を倒して南北を統一し、フエを都とする阮朝を開いた。清の冊封を受け、清にならった官僚制・法典を整えた。明命帝はカンボジア・ラオスにも勢力を広げ、キリスト教を弾圧した。
    - from: 1858
      to: 1884
      text: フランスがキリスト教の保護を口実に出兵し、サイゴン条約（1862・1874）でコーチシナ（南部）を奪った。ユエ条約（1883・84）でフランスの保護国となり、清仏戦争後の天津条約（1885）で清も宗主権を放棄した。
    - from: 1885
      to: 1945
      text: 阮朝の皇帝はフランスの保護下で名目的に残り、ベトナムはフランス領インドシナ（コーチシナ直轄植民地、アンナン・トンキン保護国）に組み込まれた。ファン・ボイ・チャウのドンズー（東遊）運動、ベトナム国民党、インドシナ共産党（1930）などの民族運動が起こった。
    - from: 1976
      to: 1985
      text: 1976年に南北が統一されてベトナム社会主義共和国となった。カンボジアに侵攻してポル・ポト政権を倒し（1979）、中国との中越戦争（1979）を戦った。多くの難民（ボート・ピープル）が国外に逃れた。
    - from: 1986
      to: 2025
      text: ドイモイ（刷新）政策で市場経済と対外開放を進め、1995年にASEANに加盟し、アメリカと国交を結んだ。共産党の一党支配のもとで高い経済成長が続いた。
  note: >-
    阮朝（1802–1945）は清の冊封を受けたので、1883年まで清の宗主権の帯を付ける。1883–1945年はフランスの保護国（france・間接統治）・コーチシナはフランスの直轄植民地として塗る。
    1945–1976年は北ベトナム（north_vietnam）・南ベトナム（south_vietnam）に分けて塗る。統一後の元首は実権を持つ共産党書記長とした（国家主席・首相は省略）。
  source:
    - "https://ja.wikipedia.org/wiki/阮朝"
    - "https://ja.wikipedia.org/wiki/ベトナムの歴史"

