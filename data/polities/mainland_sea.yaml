  kind: 港市国家
  rulers:
    - {name: 莫玖（マク・クー）, title: 河仙鎮総兵, from: 1708, to: 1735, note: 広東出身の明の遺臣。カンボジアの港市を治め、1708年に広南阮氏に従った, source: "https://en.wikipedia.org/wiki/Mạc_Cửu"}
    - {name: 莫天賜（マク・ティエン・トゥ）, title: 河仙鎮総兵, from: 1735, to: 1780, note: 1771年にシャムのタークシンに河仙を落とされ、のちバンコクで死んだ, source: "https://en.wikipedia.org/wiki/Mạc_Thiên_Tứ"}
  periods:
    - from: 1708
      to: 1780
      text: 中国人の莫氏が治めた、シャム湾に面した交易の港市。広南阮氏の宗主権のもとで自立していた。
  source: "https://ja.wikipedia.org/wiki/河仙"

- id: vietnam
  name: ベトナム
  names:
    - {to: 1838, name: 阮朝（越南国）, short: 阮朝, kind: 王朝（阮朝）}
    - {from: 1839, to: 1945, name: 阮朝（大南国）, short: 阮朝, kind: 王朝（阮朝）}
    - {from: 1976, name: ベトナム社会主義共和国, short: ベトナム, kind: 社会主義共和国（ベトナム共産党の一党制）}
