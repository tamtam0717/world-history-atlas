    - {name: 莫福源（マク・フック・グエン）, title: 莫朝の皇帝, from: 1546, to: 1561, source: "https://ja.wikipedia.org/wiki/莫福源"}
    - {name: 莫茂洽（マク・マウ・ホップ）, title: 莫朝の皇帝, from: 1562, to: 1592, note: "1592年に鄭松に昇竜を奪われ、捕らえられて殺された", source: "https://ja.wikipedia.org/wiki/莫茂洽"}
    - {name: 莫敬止（マク・キン・チー）, title: 莫氏の首長, from: 1592, to: 1593, source: "https://en.wikipedia.org/wiki/Mạc_Kính_Chỉ"}
    - {name: 莫敬恭（マク・キン・クン）, title: 莫氏の首長（高平）, from: 1593, to: 1625, source: "https://en.wikipedia.org/wiki/Mạc_Kính_Cung"}
    - {name: 莫敬寛（マク・キン・コアン）, title: 莫氏の首長（高平）, from: 1623, to: 1638, note: "1627年に黎朝に降って高平を認められた", source: "https://en.wikipedia.org/wiki/Mạc_Kính_Khoan"}
    - {name: 莫敬宇（マク・キン・ブー）, title: 莫氏の首長（高平）, from: 1638, to: 1677, note: "1677年に鄭氏に高平を落とされ、清に逃れた", source: "https://en.wikipedia.org/wiki/Mạc_Kính_Vũ"}
  periods:
    - from: 1527
      to: 1591
      text: 莫登庸が黎朝の帝位を奪って開いた王朝。都は昇竜（ハノイ）。紅河デルタを中心に北部を治め、南のタインホアに拠る黎朝（南朝）と争った（南北朝）。1540年に明に降り、安南都統使として認められた。
    - from: 1592
      to: 1647
      text: 1592年に昇竜を失い、一族は明の保護のもとで中国との国境の高平（カオバン）に残った。
    - from: 1648
      to: 1677
      text: 1592年に黎朝・鄭氏に都を追われた莫朝の一族が、明（のち清）の保護のもとで中国との国境の高平（カオバン）に残った。1677年に鄭氏に滅ぼされた。
  note: 1527–92年の莫朝（大越の王朝）と、その後の高平の莫氏を同じ政体（同じ色）とした。明の冊封の帯は1540–1643年（安南都統使司）
  source: "https://ja.wikipedia.org/wiki/莫朝"

- id: nguyen_lords
  name: 広南国（広南阮氏）
  names:
    - {from: 1777, to: 1801, name: 阮福映（グエン・フック・アイン）の政権, short: 阮福映, kind: 阮氏の亡命政権・地方政権}
  short: 広南阮氏
  color: "#beb78e"
  kind: 地方政権（阮氏）
  rulers:
    - {name: 阮潢（グエン・ホアン）, title: 阮主, from: 1558, to: 1613, note: "阮淦の子。1558年に順化の鎮守として南に下り、1570年から広南も治めた。1600年に鄭氏から離れて自立した", source: "https://ja.wikipedia.org/wiki/阮潢"}
    - {name: 阮福源（グエン・フック・グエン）, title: 阮主, from: 1613, to: 1635, note: "1627年から鄭氏と戦った（鄭阮紛争）。娘をカンボジア王チェイ・チェッタ2世に嫁がせた", source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Nguyên"}
    - {name: 阮福瀾（グエン・フック・ラン）, title: 阮主, from: 1635, to: 1648, note: "都をフエ（富春）の近くに移した", source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Lan"}
    - {name: 阮福瀕（グエン・フック・タン）, title: 阮主, from: 1648, to: 1687, note: 1658年にカンボジアに出兵し、のちにメコン・デルタへの移住を進めた, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Tần"}
    - {name: 阮福溙（グエン・フック・タイ）, title: 阮主, from: 1687, to: 1691, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Thái"}
    - {name: 阮福淍（グエン・フック・チュー）, title: 阮主, from: 1691, to: 1725, note: チャンパーを併合し（1697）、嘉定府（サイゴン）を置いた（1698）, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Chu"}
    - {name: 阮福澍（グエン・フック・チュー）, title: 阮主, from: 1725, to: 1738, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Chú"}
    - {name: 阮福濶（グエン・フック・コアット）, title: 阮主（武王）, from: 1738, to: 1765, note: 王号を名のり、メコン・デルタの併合を完成した（1757）, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Khoát"}
    - {name: 阮福淳（グエン・フック・トゥアン）, title: 阮主, from: 1765, to: 1777, note: 1777年に西山軍に殺された, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Thuần"}
    - {name: 阮福映（グエン・フック・アイン）, title: 阮主（1780年から大元帥・王）, from: 1777, to: 1801, note: 1802年に嘉隆帝として阮朝を開いた, source: "https://ja.wikipedia.org/wiki/嘉隆帝"}
  periods:
    - from: 1600
      to: 1647
      text: 黎朝の将軍阮潢が順化・広南の鎮守として南に下り（1558）、1600年から鄭氏と離れて自立した。会安（ホイアン）に日本人町ができ、朱印船の交易で栄えた。1627年から鄭氏と戦った（鄭阮紛争）。
    - from: 1648
      to: 1773
      text: 黎朝の臣下の形をとりながら、中部（広南〈コーチシナ〉）で独立した政権を築いた。都はフエ（富春）。会安（ホイアン）は日本人町・中国人町のある国際港だった。南のチャンパー・カンボジアに進出し、メコン・デルタまで領土を広げた。
    - from: 1774
      to: 1801
      text: 西山の反乱と鄭氏の侵攻で滅びかけたが、生き残った阮福映がサイゴン（嘉定）を拠点に、シャム・フランス人宣教師ピニョーの助けを得て反撃した。
  note: 1558–99年の順化・広南は黎朝（trinh）の領土として塗り、阮潢の鎮守であることを副ラベルで示した。清の冊封は受けていない（黎朝の臣下という形をとった）ので、宗主権の帯は付けない
  source:
    - "https://ja.wikipedia.org/wiki/広南国"

- id: tay_son
  name: 西山朝
  short: 西山朝
  color: "#d98370"
  kind: 王朝
  rulers:
    - {name: 阮岳（グエン・ニャック）, title: 泰徳帝, from: 1778, to: 1793, note: 3兄弟の長兄。帰仁（クイニョン）を拠点とした, source: "https://en.wikipedia.org/wiki/Nguyễn_Nhạc"}
    - {name: 阮恵（グエン・フエ）, title: 光中帝, from: 1788, to: 1792, note: 1789年の棟多（ドンダー）の戦いで清軍を破った。清の冊封を受けた, source: "https://ja.wikipedia.org/wiki/光中帝"}
    - {name: 阮光纘（グエン・クアン・トアン）, title: 景盛帝, from: 1792, to: 1802, source: "https://en.wikipedia.org/wiki/Nguyễn_Quang_Toản"}
  periods:
    - from: 1771
      to: 1785
      text: 西山邑（ビンディン省）の阮岳・阮恵・阮侶の3兄弟が阮氏に対して反乱を起こし、1777年に阮氏の一族をほぼ滅ぼした。1785年にはシャムの侵攻を退けた。
    - from: 1786
      to: 1792
      text: 1786年に鄭氏を滅ぼし、1788年に阮恵が光中帝として即位して、黎朝を助けて侵入した清軍を1789年に破った。ベトナムの大部分を統一した。
    - from: 1793
      to: 1802
      text: 光中帝の死後に内紛で弱まり、南から北上した阮福映に1802年に滅ぼされた。
  note: 1789年から清の冊封を受けたので、宗主権の帯を付ける
  source: "https://ja.wikipedia.org/wiki/西山朝"

- id: champa
  name: チャンパー（パーンドゥランガ）
  names:
    - {to: 1470, name: チャンパー王国（ヴィジャヤ）, short: チャンパー, kind: 王国（チャム人）}
  short: チャンパー
