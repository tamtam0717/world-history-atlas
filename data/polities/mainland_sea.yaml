  periods:
    - from: 1453
      to: 1537
      text: 下ビルマのモン人の王国（ハンターワディー王国、1287–1539/41）。都ペグーはベンガル湾の交易で栄え、シン・ソーブ女王・ダンマゼーディー王のもとで上座部仏教の中心となった。
    - from: 1538
      to: 1541
      text: タウングー朝のタビンシュエーティーに都ペグー（1538）・マルタバン（1541）を落とされて滅んだ。
    - from: 1740
      to: 1757
      text: 下ビルマのモン人がタウングー朝に反乱を起こして建てた王国。フランスの支援を受け、1752年にアヴァを落としたが、アラウンパヤーに反撃され、1757年に都ペグーが落ちて滅んだ。
  note: 1541年までのハンターワディー王国と、1740–57年の復興ハンターワディー王国を同じ政体（同じ色）とした
  source:
    - "https://en.wikipedia.org/wiki/Hanthawaddy_kingdom"
    - "https://en.wikipedia.org/wiki/Restored_Hanthawaddy_Kingdom"

