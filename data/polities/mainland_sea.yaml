  kind: 港市国家
  rulers:
    - {name: 莫玖（マク・クー）, title: 河仙鎮総兵, from: 1708, to: 1735, note: 広東出身の明の遺臣。カンボジアの港市を治め、1708年に広南阮氏に従った, source: "https://en.wikipedia.org/wiki/Mạc_Cửu"}
    - {name: 莫天賜（マク・ティエン・トゥ）, title: 河仙鎮総兵, from: 1735, to: 1780, note: 1771年にシャムのタークシンに河仙を落とされ、のちバンコクで死んだ, source: "https://en.wikipedia.org/wiki/Mạc_Thiên_Tứ"}
  periods:
    - from: 1708
