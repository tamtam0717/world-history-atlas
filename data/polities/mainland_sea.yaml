    - {name: バオ・ヨウシャン（鮑有祥）, title: ワ州連合党・ワ州連合軍の指導者, from: 1989, to: 2025, source: "https://en.wikipedia.org/wiki/Bao_Youxiang"}
  periods:
    - from: 1989
      to: 2025
      text: ビルマ共産党の解体（1989）で生まれたワ人の武装勢力が、中国との国境地帯を事実上の自治地域として治めている。国軍と停戦協定を結び、中国の影響が強い。
  note: 法的にはミャンマーの「ワ自治管区」。実際の統治で塗る方針により独自の色（斜線）とした
