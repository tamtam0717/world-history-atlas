  kind: 民主共和国
  rulers:
    - {name: ホー・チ・ミン, title: 国家主席, from: 1945, to: 1969, note: 1960年からは党第一書記のレ・ズアンが実権を強めた, source: "https://ja.wikipedia.org/wiki/ホー・チ・ミン"}
    - {name: レ・ズアン, title: ベトナム労働党第一書記, from: 1969, to: 1976, source: "https://ja.wikipedia.org/wiki/レ・ズアン"}
  periods:
    - from: 1945
      to: 1954
      text: 1945年9月2日にホー・チ・ミンがハノイで独立を宣言した。1946年末からフランスとのインドシナ戦争を戦い、1954年のディエンビエンフーの勝利とジュネーヴ協定で北緯17度線以北を得た。
    - from: 1955
      to: 1964
      text: 土地改革と社会主義化を進め、ソ連・中国の援助を受けた。1959年から南ベトナムの武装闘争を支援し、南ベトナム解放民族戦線（1960）を結成させた。
    - from: 1965
      to: 1975
      text: アメリカの北爆を受けながら、ホー・チ・ミン・ルートで南に兵と物資を送った。1973年のパリ和平協定でアメリカ軍が撤退し、1975年4月にサイゴンを落とした。
  note: 1945–54年は年末の時点でベトミンが実際に治めていた地域を塗る（フランス軍の支配地は france または south_vietnam）
  source: "https://ja.wikipedia.org/wiki/ベトナム民主共和国"

- id: south_vietnam
  name: ベトナム共和国
  names:
