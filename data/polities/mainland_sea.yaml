    - {name: フン・セン, title: 首相, from: 1991, to: 2023, note: 1985年から首相。1993–98年はラナリット（第一首相）と並ぶ第二首相, source: "https://ja.wikipedia.org/wiki/フン・セン"}
    - {name: フン・マネット, title: 首相, from: 2023, to: 2025, note: フン・センの長男, source: "https://ja.wikipedia.org/wiki/フン・マネット"}
  periods:
    - from: 1453
      to: 1593
      text: アンコールを離れた王はプノンペン一帯（スレイ・サントー、プノンペン）に都を移し、メコン川の交易に頼る国となった。王族の争いが続き、アン・チャン1世はロンヴェークに都を置いてシャムと戦った。
    - from: 1594
      to: 1647
      text: 1594年にシャムのナレースワン王に都ロンヴェークを落とされて服属した。スペイン人・ポルトガル人の介入（1596–99）を経て、チェイ・チェッタ2世がウドンに都を移してシャムから離れ（1618）、広南阮氏と結んでプレイ・ノコール（サイゴン）に阮氏の税関を認めた（1623）。
    - from: 1648
      to: 1810
      text: アンコール朝の後のカンボジアは、ウドンを都とする小王国となり、王族の争いに東のベトナム（広南阮氏）と西のシャムが介入した。メコン・デルタ（プレイ・ノコール＝サイゴンなど）はベトナム人の移住で阮氏の領土となり、1794年には北西部（バッタンバン・シェムリアップ）をシャムに奪われた。
    - from: 1811
      to: 1862
      text: シャムとベトナムの争奪の場となり、1834–41年はベトナムに併合された（鎮西城）。1845年の和約でアン・ドゥオンが両国の宗主権のもとで王となった。
    - from: 1863
      to: 1952
      text: 1863年にフランスの保護国となり、1887年にフランス領インドシナ連邦に入った。1907年にシャムからバッタンバン・シェムリアップを取り戻した。
    - from: 1953
      to: 1969
      text: 1953年にシハヌークのもとで独立し、ベトナム戦争では中立政策をとった。
    - from: 1970
      to: 1975
      text: 1970年の親米派ロン・ノルのクーデタでクメール共和国となった。シハヌークは北京に亡命してクメール・ルージュと結び、内戦の中でアメリカ軍の爆撃とベトナム軍の進出を受けた。
    - from: 1979
      to: 1991
      text: ベトナム軍がクメール・ルージュの政権を倒し、ヘン・サムリンのカンプチア人民共和国を建てた。タイ国境ではクメール・ルージュ・シハヌーク派・ソン・サン派の三派連合が抵抗し、内戦が続いた。ベトナム軍は1989年に撤退した。
    - from: 1991
      to: 2025
      text: 1991年のパリ和平協定で内戦が終わり、国連カンボジア暫定統治機構（UNTAC）のもとの総選挙を経て王政が復活した（1993）。フン・センの人民党の長期政権が続いた。
  note: >-
    17–18世紀の王は在位と廃立が入り組んでいるので主な人だけを書いた（要確認）。宗主権：1594–1617年はシャム（1596–1602年はスペイン人の介入と内乱で実際には及んでいない）、1794–1811年はシャム、1812–1833年はベトナム、
    1846–1862年はシャム（ベトナムにも朝貢した）とした。1863–1952年はフランス（間接統治）、1975–78年は民主カンプチア（khmer_rouge）として塗る。
  source:
    - "https://ja.wikipedia.org/wiki/カンボジアの歴史"
    - "https://en.wikipedia.org/wiki/Post-Angkor_period"

- id: khmer_rouge
  name: 民主カンプチア
  names:
    - {to: 1975, name: カンプチア民族統一戦線（クメール・ルージュ）, short: クメール・ルージュ, kind: 共産主義勢力}
    - {from: 1976, to: 1978, name: 民主カンプチア, short: 民主カンプチア, kind: 共産主義国家（ポル・ポト政権）}
    - {from: 1979, name: 民主カンプチア（クメール・ルージュの残存勢力）, short: クメール・ルージュ, kind: 武装勢力}
  short: クメール・ルージュ
  color: "#7a6f80"
  kind: 共産主義勢力
  rulers:
    - {name: ポル・ポト, title: カンプチア共産党書記長（1976年から首相）, from: 1970, to: 1997, note: 国家元首はシハヌーク（1975–76）、キュー・サムファン（1976–79）, source: "https://ja.wikipedia.org/wiki/ポル・ポト"}
  periods:
    - from: 1970
      to: 1974
      text: ロン・ノル政権と戦い、北ベトナム軍の助けで農村の大半をおさえた。名目上の代表は北京に亡命したシハヌークだった。
    - from: 1975
      to: 1978
      text: 1975年4月にプノンペンを落とし、都市住民を農村に強制移住させた。貨幣・市場・宗教を廃止した極端な共産主義の政策と粛清・虐殺・飢餓で、人口約800万のうち少なくとも150万人以上が死んだとされる。
    - from: 1979
      to: 1998
      text: ベトナム軍に追われ、タイ国境の山地（パイリン・アンロンヴェンなど）に拠って抵抗した。1991年のパリ和平協定の後も武装闘争を続けたが、1996年から投降が相次ぎ、1998年に消滅した。
  note: 2006年に国連の支援で特別法廷が設けられ、指導者たちが人道に対する罪・ジェノサイドで裁かれた
  source:
    - "https://ja.wikipedia.org/wiki/民主カンプチア"
    - "https://ja.wikipedia.org/wiki/クメール・ルージュ"

