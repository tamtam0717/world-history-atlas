  periods:
    - from: 1510
      to: 1549
      text: アヴァ王国の臣下だったタウングーの領主ミンジーニョが自立し（1510）、子のタビンシュエーティーがモン人のペグー（1538）・マルタバン（1541）、プローム（1542）を征服してビルマの南半分を統一した（タウングー朝）。都はペグー。
    - from: 1550
      to: 1583
      text: バインナウン王が上ビルマ（アヴァ 1555）・シャン諸国（1557）・ランナー（1558）を征服し、アユタヤ（1564・1569）・ラーンサーン（1574）も従えて、東南アジア大陸部の大半を支配した。ポルトガル人の傭兵・鉄砲を使った。
    - from: 1584
      to: 1612
      text: ナンダバイン王のもとでアユタヤが独立し（1584）、諸侯の反乱が相次いだ。1599年に都ペグーがアラカン・タウングーの軍に落とされて王国は分裂し、シリアムはポルトガル人デ・ブリトが治めた。王の弟ニャウンヤンがアヴァで国を立て直した（復興タウングー朝）。
    - from: 1613
      to: 1647
      text: アナウッペッルン王がシリアムを落としてデ・ブリトを処刑し（1613）、下ビルマ・タヴォイ・ランナーを回復した。タールン王は都をアヴァに戻し（1635）、上ビルマを中心とする国づくりを進めた。
    - from: 1648
      to: 1739
      text: タウングー朝（後期、都はアヴァ）が上ビルマと下ビルマを治め、シャン諸州・ランナー（チェンマイ）を従えた。17世紀末から王権が弱まり、北からはマニプルの騎兵が侵入した。
    - from: 1740
      to: 1759
      text: 下ビルマのモン人が反乱を起こし（復興ハンターワディー王国）、1752年にアヴァを落としてタウングー朝を滅ぼした。シュエボーのアラウンパヤーがコンバウン朝を開いてビルマを再統一した（1757年にペグーを征服）。
    - from: 1760
      to: 1823
      text: コンバウン朝の最盛期。1767年にアユタヤを滅ぼし、清軍の4度の侵攻を退けた（1765–69）。ボードーパヤー王はアラカン（1784）を征服し、マニプル・アッサムにも進出して、イギリス領インドと境を接した。
    - from: 1824
      to: 1884
      text: 3度のイギリス＝ビルマ戦争のうち、第1次（1824–26）でアラカン・テナセリムを、第2次（1852）で下ビルマ（ペグー）を失った。ミンドン王はマンダレーに都を移して近代化を試みた。
    - from: 1885
      to: 1947
      text: 第3次イギリス＝ビルマ戦争（1885）でコンバウン朝が滅び、イギリス領インドの1州とされた（1937年にインドから分離）。タキン党などの民族運動が起こり、1942–45年は日本が占領した。
    - from: 1948
      to: 1961
      text: 1948年にイギリス連邦に加わらずに独立した（ビルマ連邦。首相ウー・ヌ）。独立直後からカレン人など少数民族と共産党の武装闘争が続き、シャン州には国民党軍の残党が入った。
    - from: 1962
      to: 1987
      text: ネ・ウィンのクーデタ（1962）で軍が実権を握り、「ビルマ式社会主義」をかかげて鎖国に近い体制をとった。
    - from: 1988
      to: 2010
      text: 1988年の民主化運動を軍が鎮圧し、国名をミャンマーに改めた（1989）。1990年の総選挙で勝ったアウンサンスーチーの国民民主連盟（NLD）に政権を渡さず、軍政が続いた。
    - from: 2011
      to: 2020
      text: 民政移管で改革と開放が進み、2015年の総選挙でNLDが勝った。2017年にはラカイン州のロヒンギャへの軍の掃討作戦で、70万人以上が隣のバングラデシュに逃れた。
    - from: 2021
      to: 2025
      text: 2021年2月に国軍がクーデタで実権を握った。民主派の国民統一政府（NUG）と少数民族の武装勢力が各地で国軍と戦い、内戦状態となった。2024年にはアラカン軍がラカイン州の大半をおさえた。
  note: >-
    名前は高校世界史の慣例に合わせて、1988年まではビルマ、1989年からはミャンマーとした。
    1885–1947年はイギリス領（britain）、1943–45年は日本がつくったビルマ国（burma_state）として塗る。
    1453–1509年の上ビルマはアヴァ王国（ava）、下ビルマはハンターワディー王国（hanthawaddy）として塗り、タウングー朝はタウングーが自立した1510年から。
    独立後の元首は実権者（首相・軍の指導者）とした。清への朝貢（1790年の乾隆帝への使節など）は断続的だったので、宗主権の帯は付けない。
  source:
    - "https://ja.wikipedia.org/wiki/コンバウン王朝"
    - "https://ja.wikipedia.org/wiki/タウングー王朝"
    - "https://ja.wikipedia.org/wiki/ミャンマーの歴史"

