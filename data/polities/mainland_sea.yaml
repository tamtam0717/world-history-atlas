    - from: 1955
      to: 1963
      text: アメリカの支援を受けたゴ・ディン・ジエムが国民投票でバオ・ダイを廃して共和国とした。ジュネーヴ協定の統一選挙を拒み、独裁と仏教徒の弾圧への反発が強まった。
    - from: 1964
      to: 1975
      text: 軍のクーデタが相次ぐ中、アメリカ軍が本格的に介入し（最大で約54万人）、南ベトナム解放民族戦線・北ベトナム軍と戦った。1973年にアメリカ軍が撤退し、1975年4月30日にサイゴンが落ちて滅んだ。
  note: 1949–1953年はフランス連合の協同国なので、宗主権（overlord）をフランスとした
  source: "https://ja.wikipedia.org/wiki/ベトナム共和国"

