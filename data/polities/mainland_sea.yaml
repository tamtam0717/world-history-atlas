# S4 大陸部東南アジア（MMR THA LAO KHM VNM）の政体（1648–2025）
# 他の担当が参照する ID：burma・siam・cambodia・vietnam・laos・north_vietnam・south_vietnam・khmer_rouge・arakan・lan_na
# 元首：前近代は君主（実権者がほかにいれば note）。独立後は実権者（党書記長・首相・軍の最高指導者など。方針は各政体の note）。

# ---- ビルマ（ミャンマー） ----

- id: burma
  name: ビルマ
  names:
    - {to: 1751, name: タウングー朝（ビルマ）, short: ビルマ, kind: 王国（タウングー朝）}
    - {from: 1752, to: 1885, name: コンバウン朝（ビルマ）, short: ビルマ, kind: 王国（コンバウン朝）}
    - {from: 1948, to: 1973, name: ビルマ連邦, short: ビルマ, kind: 共和国}
    - {from: 1974, to: 1988, name: ビルマ連邦社会主義共和国, short: ビルマ, kind: 社会主義共和国（ビルマ社会主義計画党の一党制）}
    - {from: 1989, to: 2010, name: ミャンマー連邦, short: ミャンマー, kind: 軍事政権}
    - {from: 2011, name: ミャンマー連邦共和国, short: ミャンマー, kind: 共和国（2021年から軍事政権）}
  short: ビルマ
  color: "#c9a8d8"
  kind: 王国
  rulers:
    - {name: ピンダレー, title: タウングー朝の王, from: 1648, to: 1661, note: 1661年に弟のピエに廃された, source: "https://en.wikipedia.org/wiki/Pindale_Min"}
    - {name: ピエ, title: タウングー朝の王, from: 1661, to: 1672, note: 1662年に南明の永暦帝を清の呉三桂に引き渡した, source: "https://en.wikipedia.org/wiki/Pye_Min"}
    - {name: ナラワラ, title: タウングー朝の王, from: 1672, to: 1673, source: "https://en.wikipedia.org/wiki/Narawara"}
    - {name: ミニェチョーディン, title: タウングー朝の王, from: 1673, to: 1698, source: "https://en.wikipedia.org/wiki/Minyekyawdin"}
    - {name: サネ, title: タウングー朝の王, from: 1698, to: 1714, source: "https://en.wikipedia.org/wiki/Sane_Min"}
    - {name: タニンガネー, title: タウングー朝の王, from: 1714, to: 1733, source: "https://en.wikipedia.org/wiki/Taninganway_Min"}
    - {name: マハーダンマヤーザ・ディパディ, title: タウングー朝の王, from: 1733, to: 1752, note: 1752年にペグー（復興ハンターワディー王国）の軍にアヴァを落とされ、捕らえられた, source: "https://en.wikipedia.org/wiki/Mahadhammaraza_Dipadi"}
    - {name: アラウンパヤー, title: コンバウン朝の王, from: 1752, to: 1760, note: コンバウン朝の創始者。ビルマを再統一し、ラングーン（ヤンゴン）を建設した。シャム遠征の途中で死去, source: "https://ja.wikipedia.org/wiki/アラウンパヤー"}
    - {name: ナウンドージー, title: コンバウン朝の王, from: 1760, to: 1763, source: "https://en.wikipedia.org/wiki/Naungdawgyi"}
    - {name: シンビューシン, title: コンバウン朝の王, from: 1763, to: 1776, note: 1767年にアユタヤを滅ぼし、清軍の侵攻（1765–69）を退けた, source: "https://ja.wikipedia.org/wiki/シンビューシン"}
    - {name: シングー, title: コンバウン朝の王, from: 1776, to: 1782, source: "https://en.wikipedia.org/wiki/Singu_Min"}
    - {name: ボードーパヤー, title: コンバウン朝の王, from: 1782, to: 1819, note: 1782年のパウンカーの短い在位の後に即位。1784年にアラカンを征服し、都をアマラプラに移した, source: "https://ja.wikipedia.org/wiki/ボードーパヤー"}
    - {name: バヂードー, title: コンバウン朝の王, from: 1819, to: 1837, note: 第1次イギリス＝ビルマ戦争（1824–26）に敗れた, source: "https://en.wikipedia.org/wiki/Bagyidaw"}
    - {name: ターヤーワディー, title: コンバウン朝の王, from: 1837, to: 1846, source: "https://en.wikipedia.org/wiki/Tharrawaddy_Min"}
    - {name: パガン, title: コンバウン朝の王, from: 1846, to: 1853, note: 第2次イギリス＝ビルマ戦争（1852）で下ビルマを失い、弟のミンドンに廃された, source: "https://en.wikipedia.org/wiki/Pagan_Min"}
    - {name: ミンドン, title: コンバウン朝の王, from: 1853, to: 1878, note: マンダレーを建設（1857）し、近代化を試みた, source: "https://ja.wikipedia.org/wiki/ミンドン"}
    - {name: ティーボー, title: コンバウン朝の王, from: 1878, to: 1885, note: 第3次イギリス＝ビルマ戦争でイギリスに捕らえられ、インドに流された, source: "https://ja.wikipedia.org/wiki/ティーボー"}
    - {name: ウー・ヌ, title: 首相, from: 1948, to: 1958, note: 1956–57年に一時退任。実権は首相にあった, source: "https://ja.wikipedia.org/wiki/ウー・ヌ"}
    - {name: ネ・ウィン, title: 選挙管理内閣の首相, from: 1958, to: 1960, source: "https://ja.wikipedia.org/wiki/ネ・ウィン"}
    - {name: ウー・ヌ, title: 首相, from: 1960, to: 1962, source: "https://ja.wikipedia.org/wiki/ウー・ヌ"}
    - {name: ネ・ウィン, title: 革命評議会議長・大統領・ビルマ社会主義計画党議長, from: 1962, to: 1988, note: 1962年のクーデタで実権を握り、「ビルマ式社会主義」をかかげた。1981年に大統領を退いた後も党議長として実権を持った, source: "https://ja.wikipedia.org/wiki/ネ・ウィン"}
    - {name: ソウ・マウン, title: 国家法秩序回復評議会（SLORC）議長, from: 1988, to: 1992, source: "https://ja.wikipedia.org/wiki/ソウ・マウン"}
    - {name: タン・シュエ, title: SLORC・国家平和発展評議会（SPDC）議長, from: 1992, to: 2011, source: "https://ja.wikipedia.org/wiki/タン・シュエ"}
    - {name: テイン・セイン, title: 大統領, from: 2011, to: 2016, note: 民政移管後の初代大統領。軍出身, source: "https://ja.wikipedia.org/wiki/テイン・セイン"}
    - {name: アウンサンスーチー, title: 国家顧問, from: 2016, to: 2021, note: 憲法の規定で大統領になれず、国家顧問として政権を率いた（大統領はティン・チョー、ウィン・ミン）, source: "https://ja.wikipedia.org/wiki/アウンサンスーチー"}
    - {name: ミン・アウン・フライン, title: 国軍総司令官・国家行政評議会議長, from: 2021, to: 2025, note: 2021年2月のクーデタで実権を握った。2024年から大統領代行も兼ねた, source: "https://ja.wikipedia.org/wiki/ミン・アウン・フライン"}
  periods:
    - from: 1648
      to: 1739
      text: タウングー朝（後期、都はアヴァ）が上ビルマと下ビルマを治め、シャン諸州・ランナー（チェンマイ）を従えた。17世紀末から王権が弱まり、北からはマニプルの騎兵が侵入した。
    - from: 1740
      to: 1759
      text: 下ビルマのモン人が反乱を起こし（復興ハンターワディー王国）、1752年にアヴァを落としてタウングー朝を滅ぼした。シュエボーのアラウンパヤーがコンバウン朝を開いてビルマを再統一した（1757年にペグーを征服）。
    - from: 1760
      to: 1823
      text: コンバウン朝の最盛期。1767年にアユタヤを滅ぼし、清軍の4度の侵攻を退けた（1765–69）。ボードーパヤー王はアラカン（1784）を征服し、マニプル・アッサムにも進出して、イギリス領インドと境を接した。
    - from: 1824
      to: 1884
      text: 3度のイギリス＝ビルマ戦争のうち、第1次（1824–26）でアラカン・テナセリムを、第2次（1852）で下ビルマ（ペグー）を失った。ミンドン王はマンダレーに都を移して近代化を試みた。
    - from: 1885
      to: 1947
      text: 第3次イギリス＝ビルマ戦争（1885）でコンバウン朝が滅び、イギリス領インドの1州とされた（1937年にインドから分離）。タキン党などの民族運動が起こり、1942–45年は日本が占領した。
    - from: 1948
      to: 1961
      text: 1948年にイギリス連邦に加わらずに独立した（ビルマ連邦。首相ウー・ヌ）。独立直後からカレン人など少数民族と共産党の武装闘争が続き、シャン州には国民党軍の残党が入った。
    - from: 1962
      to: 1987
      text: ネ・ウィンのクーデタ（1962）で軍が実権を握り、「ビルマ式社会主義」をかかげて鎖国に近い体制をとった。
    - from: 1988
      to: 2010
      text: 1988年の民主化運動を軍が鎮圧し、国名をミャンマーに改めた（1989）。1990年の総選挙で勝ったアウンサンスーチーの国民民主連盟（NLD）に政権を渡さず、軍政が続いた。
    - from: 2011
      to: 2020
      text: 民政移管で改革と開放が進み、2015年の総選挙でNLDが勝った。2017年にはラカイン州のロヒンギャへの軍の掃討作戦で、70万人以上が隣のバングラデシュに逃れた。
    - from: 2021
      to: 2025
      text: 2021年2月に国軍がクーデタで実権を握った。民主派の国民統一政府（NUG）と少数民族の武装勢力が各地で国軍と戦い、内戦状態となった。2024年にはアラカン軍がラカイン州の大半をおさえた。
  note: >-
    名前は高校世界史の慣例に合わせて、1988年まではビルマ、1989年からはミャンマーとした。
    1885–1947年はイギリス領（britain）、1943–45年は日本がつくったビルマ国（burma_state）として塗る。
    独立後の元首は実権者（首相・軍の指導者）とした。清への朝貢（1790年の乾隆帝への使節など）は断続的だったので、宗主権の帯は付けない。
  source:
    - "https://ja.wikipedia.org/wiki/コンバウン王朝"
    - "https://ja.wikipedia.org/wiki/タウングー王朝"
    - "https://ja.wikipedia.org/wiki/ミャンマーの歴史"

- id: hanthawaddy
  name: 復興ハンターワディー王国（ペグー）
  short: ペグー
  color: "#e8c49a"
  kind: 王国（モン人）
  rulers:
    - {name: スミン・トー・ブッダケティ, title: ペグー王, from: 1740, to: 1747, source: "https://en.wikipedia.org/wiki/Smim_Htaw_Buddhaketi"}
    - {name: ビンニャー・ダラ, title: ペグー王, from: 1747, to: 1757, note: 1752年にアヴァを落としてタウングー朝を滅ぼした。1757年にアラウンパヤーに敗れた, source: "https://en.wikipedia.org/wiki/Binnya_Dala"}
  periods:
    - from: 1740
      to: 1757
      text: 下ビルマのモン人がタウングー朝に反乱を起こして建てた王国。フランスの支援を受け、1752年にアヴァを落としたが、アラウンパヤーに反撃され、1757年に都ペグーが落ちて滅んだ。
  source: "https://en.wikipedia.org/wiki/Restored_Hanthawaddy_Kingdom"

- id: arakan
  name: アラカン王国（ミャウー朝）
  short: アラカン
  color: "#a8d0d8"
  kind: 王国
  rulers:
    - {name: サンダ・トゥダンマ, title: アラカン王, from: 1652, to: 1674, note: 1660年にムガル帝国の皇子シャー・シュジャーを迎え、のちに殺した, source: "https://en.wikipedia.org/wiki/Sanda_Thudhamma"}
    - {name: タマダ, title: アラカン王（最後の王）, from: 1782, to: 1784, source: "https://en.wikipedia.org/wiki/Maha_Thammada"}
  periods:
    - from: 1648
      to: 1666
      text: ベンガル湾に面した交易国家。仏教徒の王がポルトガル人の傭兵・海賊とともにベンガルを襲い、チッタゴンを支配した。
    - from: 1667
      to: 1784
      text: 1666年にムガル帝国にチッタゴンを奪われ、以後は王の廃立が相次いで衰えた。1784年にビルマのボードーパヤー王に征服された（マハムニ仏像はマンダレーに運ばれた）。
  note: 1648–1652年の王（ナラパティジー、タド）は省略した。チッタゴン（バングラデシュのピース）は S2 の担当
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Mrauk_U"

- id: burma_state
  name: ビルマ国
  short: ビルマ国
  color: "#b498cc"
  kind: 国（日本の後ろ盾による「独立」）
  rulers:
    - {name: バー・モウ, title: 国家代表（首相）, from: 1943, to: 1945, source: "https://ja.wikipedia.org/wiki/バー・モウ"}
  periods:
    - from: 1943
      to: 1945
      text: 日本は占領したビルマに1943年8月に「独立」を与え、バー・モウを国家代表とした。アウンサンのビルマ国民軍は1945年3月に日本に反旗をひるがえした。
  note: 地図では overlord を日本とする（日本の帯）。1945年にイギリスが再び占領して消滅した
  source: "https://ja.wikipedia.org/wiki/ビルマ国"

- id: wa_state
  name: ワ州連合軍（UWSA）の支配地域
  short: ワ
  color: "#b9a487"
  kind: 武装勢力の自治地域
  rulers:
    - {name: バオ・ヨウシャン（鮑有祥）, title: ワ州連合党・ワ州連合軍の指導者, from: 1989, to: 2025, source: "https://en.wikipedia.org/wiki/Bao_Youxiang"}
  periods:
    - from: 1989
      to: 2025
      text: ビルマ共産党の解体（1989）で生まれたワ人の武装勢力が、中国との国境地帯を事実上の自治地域として治めている。国軍と停戦協定を結び、中国の影響が強い。
  note: 法的にはミャンマーの「ワ自治管区」。実際の統治で塗る方針により独自の色（斜線）とした
  source: "https://en.wikipedia.org/wiki/Wa_State"

- id: arakan_army
  name: アラカン軍の支配地域
  short: アラカン軍
  color: "#93c3bd"
  kind: 武装勢力の支配地域
  rulers:
    - {name: トゥワン・ムラ・ナイン, title: アラカン軍司令官, from: 2024, to: 2025, source: "https://en.wikipedia.org/wiki/Arakan_Army"}
  periods:
    - from: 2024
      to: 2025
      text: 2023年秋からの少数民族武装勢力の攻勢（1027作戦）の中で、ラカイン人の武装勢力アラカン軍が国軍を破り、2024年末までにラカイン州17郡区のうち14郡区をおさえた。州都シットウェーとチャウピューなどは国軍が保った。
  note: ロヒンギャの人々がアラカン軍の側からも迫害を受けているとの報告がある
  source: "https://en.wikipedia.org/wiki/Arakan_Army"

# ---- シャム（タイ） ----

- id: siam
  name: シャム
  names:
    - {to: 1766, name: アユタヤ朝（シャム）, short: シャム, kind: 王国（アユタヤ朝）}
    - {from: 1767, to: 1781, name: トンブリー朝（シャム）, short: シャム, kind: 王国（トンブリー朝）}
    - {from: 1782, to: 1931, name: ラタナコーシン朝（シャム）, short: シャム, kind: 王国（ラタナコーシン朝〈チャクリー朝〉）}
    - {from: 1932, to: 1938, name: シャム, short: シャム, kind: 立憲君主国}
    - {from: 1939, name: タイ王国, short: タイ, kind: 立憲君主国}
  short: シャム
  color: "#7fc6b0"
  kind: 王国
  rulers:
    - {name: プラーサートトーン, title: アユタヤ朝の王, from: 1629, to: 1656, source: "https://ja.wikipedia.org/wiki/プラーサートトーン王"}
    - {name: ナーライ, title: アユタヤ朝の王, from: 1656, to: 1688, note: 1656年のチャイ王・シースタンマラーチャー王の短い在位の後に即位。フランスのルイ14世と使節を交わし、ギリシア人ファルコンを重用した, source: "https://ja.wikipedia.org/wiki/ナーライ王"}
    - {name: ペートラーチャー, title: アユタヤ朝の王, from: 1688, to: 1703, note: 1688年の政変（シャム革命）でフランス軍を追い出した, source: "https://ja.wikipedia.org/wiki/ペートラーチャー王"}
    - {name: スリエンタラーティボーディー（サンペット8世）, title: アユタヤ朝の王, from: 1703, to: 1709, source: "https://en.wikipedia.org/wiki/Suriyenthrathibodi"}
    - {name: プーミンタラーチャー（タイサ王）, title: アユタヤ朝の王, from: 1709, to: 1733, source: "https://en.wikipedia.org/wiki/Phumintharacha"}
    - {name: ボーロマコート, title: アユタヤ朝の王, from: 1733, to: 1758, note: アユタヤ朝最後の繁栄期。セイロンに僧を送って仏教を再興した, source: "https://ja.wikipedia.org/wiki/ボーロマコート王"}
    - {name: エーカタット, title: アユタヤ朝の王, from: 1758, to: 1767, note: 1758年のウトゥムポン王の短い在位の後に即位。1767年のアユタヤ陥落で死んだ, source: "https://ja.wikipedia.org/wiki/エーカタット王"}
    - {name: タークシン, title: トンブリー朝の王, from: 1767, to: 1782, note: 中国系の武将。ビルマ軍を追い、トンブリーに都を置いて国を再統一した, source: "https://ja.wikipedia.org/wiki/タークシン"}
    - {name: ラーマ1世（チャオプラヤー・チャクリー）, title: ラタナコーシン朝の王, from: 1782, to: 1809, note: ラタナコーシン朝（チャクリー朝）を開き、バンコクに都を置いた, source: "https://ja.wikipedia.org/wiki/ラーマ1世"}
    - {name: ラーマ2世, title: ラタナコーシン朝の王, from: 1809, to: 1824, source: "https://ja.wikipedia.org/wiki/ラーマ2世"}
    - {name: ラーマ3世, title: ラタナコーシン朝の王, from: 1824, to: 1851, note: バーニー条約（1826）。ラオ人の反乱（アヌウォンの乱）を鎮めた, source: "https://ja.wikipedia.org/wiki/ラーマ3世"}
    - {name: ラーマ4世（モンクット）, title: ラタナコーシン朝の王, from: 1851, to: 1868, note: ボウリング条約（1855）で開国した, source: "https://ja.wikipedia.org/wiki/ラーマ4世"}
    - {name: ラーマ5世（チュラロンコン）, title: ラタナコーシン朝の王, from: 1868, to: 1910, note: チャクリ改革で近代化を進め、独立を保った, source: "https://ja.wikipedia.org/wiki/ラーマ5世"}
    - {name: ラーマ6世（ワチラーウット）, title: ラタナコーシン朝の王, from: 1910, to: 1925, source: "https://ja.wikipedia.org/wiki/ラーマ6世"}
    - {name: ラーマ7世（プラチャーティポック）, title: 国王, from: 1925, to: 1935, note: 1932年の立憲革命で立憲君主となり、1935年に退位, source: "https://ja.wikipedia.org/wiki/ラーマ7世"}
    - {name: ラーマ8世（アーナンタマヒドン）, title: 国王, from: 1935, to: 1946, note: 幼少で即位し、スイスで育った。1946年に急死, source: "https://ja.wikipedia.org/wiki/ラーマ8世"}
    - {name: ラーマ9世（プミポン）, title: 国王, from: 1946, to: 2016, source: "https://ja.wikipedia.org/wiki/ラーマ9世"}
    - {name: ラーマ10世（ワチラロンコン）, title: 国王, from: 2016, to: 2025, source: "https://ja.wikipedia.org/wiki/ラーマ10世"}
  periods:
    - from: 1648
      to: 1766
      text: アユタヤ朝は東西交易の中継地として栄え、日本町・オランダ・フランスの商館が置かれた。ナーライ王はフランスと結んだが、1688年の政変で西洋人の勢力を退けた。18世紀にはビルマとの戦争がくり返された。
    - from: 1767
      to: 1850
      text: 1767年にアユタヤがビルマに滅ぼされたが、タークシンがトンブリー朝を開いて国を立て直し、1782年にラーマ1世がバンコクを都とするラタナコーシン朝を開いた。ラオス・カンボジア・ランナー・マレー北部の諸国を宗主権下に置いた。
    - from: 1851
      to: 1909
      text: ラーマ4世はボウリング条約（1855）で開国し、ラーマ5世はチャクリ改革で行政・軍・教育を近代化した。イギリス領ビルマ・マラヤとフランス領インドシナの間の緩衝国として、ラオス・カンボジア西部・マレー北部を譲りながら独立を保った。
    - from: 1910
      to: 1931
      text: 第一次世界大戦に連合国側で参戦し（1917）、戦後の条約改正で不平等条約を撤廃していった。
    - from: 1932
      to: 1944
      text: 1932年の立憲革命で絶対王政が終わった。ピブーン政権は1939年に国名をタイに改め、タイ＝フランス領インドシナ紛争（1940–41）で失地を回復し、太平洋戦争では日本と同盟を結んだ。
    - from: 1945
      to: 1972
      text: 戦後は抗日運動（自由タイ）の働きで敗戦国とされなかった。軍が実権を握る政権が続き（サリット・タノム）、冷戦期はアメリカと結んで東南アジア条約機構（SEATO）に加わり、ベトナム戦争ではアメリカ軍に基地を提供した。
    - from: 1973
      to: 2025
      text: 1973年の学生革命以後、民政と軍事クーデタ（1976・1991・2006・2014年）がくり返された。工業化で高い経済成長をとげたが、1997年のアジア通貨危機の発端ともなった。
  note: >-
    1945–1948年は国名がシャムに戻ったが、地図ではタイとした。立憲革命（1932）の後の主な首相：プリーディー、ピブーン（1938–44、1948–57）、
    サリット（1959–63）、タノム（1963–73）、タクシン（2001–06）、プラユット（2014–23）、ペートンタン（2024–25）、アヌティン（2025–）。
    清への朝貢は続いたが（ラタナコーシン朝は1850年代まで）、宗主権の帯は付けない。
  source:
    - "https://ja.wikipedia.org/wiki/アユタヤ王朝"
    - "https://ja.wikipedia.org/wiki/チャクリー王朝"
    - "https://ja.wikipedia.org/wiki/タイの歴史"

- id: lan_na
  name: ランナー（チェンマイ）
  short: ランナー
  color: "#d6e39a"
  kind: 王国
  rulers:
    - {name: カーウィラ, title: チェンマイ王（領主）, from: 1782, to: 1813, note: シャムと結んでビルマ軍を追い、1797年にチェンマイを復興した, source: "https://en.wikipedia.org/wiki/Kawila"}
    - {name: インタウィチャヤーノン, title: チェンマイ王, from: 1873, to: 1897, source: "https://en.wikipedia.org/wiki/Inthawichayanon"}
  periods:
    - from: 1648
      to: 1774
      text: 1558年からビルマの支配下にあった。1727年にチェンマイが反乱を起こして自立したが、1763年にコンバウン朝に再び征服された。
    - from: 1775
      to: 1898
      text: 1775年にシャムの援軍を得てビルマ軍を追い、シャムの宗主権のもとでカーウィラの一族（チェットトン家）が治めた。19世紀末からシャムが中央集権化を進め、1899年に州（モントン・パーヤップ）として組み込んだ。
  note: ナーン（ナーン県）・プレー（プレー県）は別の小王国だったが、地図ではランナーにまとめた。北部の小国の王の一覧は省略
  source: "https://en.wikipedia.org/wiki/Lan_Na"

- id: patani
  name: パタニ王国
  short: パタニ
  color: "#c7e0b0"
  kind: スルタン国
  periods:
    - from: 1648
      to: 1785
      text: マレー半島北東岸のイスラーム教のスルタン国。港市として栄え、アユタヤに金銀の花（ブンガ・マス）を贈ったが、たびたび自立した。
    - from: 1786
      to: 1808
      text: 1786年にラタナコーシン朝のシャムに征服され、シャムが王を立てた。1808年に7つの州に分けられた。
  note: 南タイのマレー系ムスリムの分離運動（20世紀後半から）の背景になった
  source: "https://en.wikipedia.org/wiki/Patani_Kingdom"

# ---- ラオス ----

- id: lan_xang
  name: ラーンサーン王国
  short: ラーンサーン
  color: "#f2c48a"
  kind: 王国
  rulers:
    - {name: スリニャウォンサー, title: ラーンサーン王, from: 1638, to: 1695, note: ラーンサーンの最盛期。オランダ商人ファン・ウストホフが都ヴィエンチャンを訪れた（1641）, source: "https://en.wikipedia.org/wiki/Sourigna_Vongsa"}
    - {name: セーターティラート2世（サイ・オン・フエ）, title: ラーンサーン王（ヴィエンチャン）, from: 1698, to: 1707, note: ベトナムの支援で王位に就いた, source: "https://en.wikipedia.org/wiki/Setthathirath_II"}
  periods:
    - from: 1648
      to: 1694
      text: スリニャウォンサー王のもとで、ラオスとタイ東北部（イサーン）を治めたラーオ人の王国の最盛期。
    - from: 1695
      to: 1707
      text: 王の死後に継承争いが起こり、1707年にルアンパバーン王国とヴィエンチャン王国に分かれた（1713年には南部がチャンパーサック王国として分かれた）。
  source: "https://ja.wikipedia.org/wiki/ラーンサーン王国"

- id: vientiane
  name: ヴィエンチャン王国
  short: ヴィエンチャン
  color: "#f2b878"
  kind: 王国
  rulers:
    - {name: セーターティラート2世（サイ・オン・フエ）, title: ヴィエンチャン王, from: 1707, to: 1730, source: "https://en.wikipedia.org/wiki/Setthathirath_II"}
    - {name: オン・ロン, title: ヴィエンチャン王, from: 1730, to: 1767, source: "https://en.wikipedia.org/wiki/Kingdom_of_Vientiane"}
    - {name: オン・ブン（シリブンニャサーン）, title: ヴィエンチャン王, from: 1767, to: 1779, note: 1779年にシャムのチャクリー（のちのラーマ1世）に都を落とされ、エメラルド仏がバンコクに運ばれた, source: "https://en.wikipedia.org/wiki/Ong_Boun"}
    - {name: ナンタセーン, title: ヴィエンチャン王, from: 1781, to: 1795, source: "https://en.wikipedia.org/wiki/Nanthasen"}
    - {name: インタウォン, title: ヴィエンチャン王, from: 1795, to: 1804, source: "https://en.wikipedia.org/wiki/Inthavong"}
    - {name: アヌウォン, title: ヴィエンチャン王, from: 1804, to: 1828, note: 1826–28年にシャムに反乱を起こして敗れ、都は破壊された, source: "https://ja.wikipedia.org/wiki/アヌウォン"}
  periods:
    - from: 1707
      to: 1778
      text: ラーンサーンの分裂で生まれた王国。メコン川中流の両岸（現在のラオス中部とタイ東北部）を治めた。
    - from: 1779
      to: 1828
      text: 1779年にシャムに征服されて宗主権下に入った。アヌウォン王の反乱（1826–28）が鎮められ、王国は滅んで都は破壊された。住民の多くはメコン川の西岸（タイ東北部）に移された。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Vientiane"

- id: luang_prabang
  name: ルアンパバーン王国
  short: ルアンパバーン
  color: "#f7dba6"
  kind: 王国
  rulers:
    - {name: キンキッサラート, title: ルアンパバーン王, from: 1707, to: 1713, source: "https://en.wikipedia.org/wiki/Kingkitsarath"}
    - {name: アヌルット, title: ルアンパバーン王, from: 1791, to: 1817, source: "https://en.wikipedia.org/wiki/Kingdom_of_Luang_Phrabang"}
    - {name: マンタトゥラート, title: ルアンパバーン王, from: 1817, to: 1836, source: "https://en.wikipedia.org/wiki/Manthaturath"}
    - {name: ウンカム, title: ルアンパバーン王, from: 1872, to: 1894, note: 1887年に黒旗軍（ホー）に都を荒らされ、フランスのパヴィに救われた, source: "https://en.wikipedia.org/wiki/Oun_Kham"}
    - {name: シーサワンウォン, title: ルアンパバーン王（1946年からラオス国王）, from: 1904, to: 1959, source: "https://ja.wikipedia.org/wiki/シーサワンウォン"}
  periods:
    - from: 1707
      to: 1778
      text: ラーンサーンの分裂で生まれた北部の王国。ビルマと清の侵入を受けた。
    - from: 1779
      to: 1892
      text: シャムの宗主権下にあった（ベトナムにも朝貢した）。1887年に中国系の黒旗軍（ホー）に都を荒らされた。
    - from: 1893
      to: 1945
      text: 1893年のフランス＝シャム条約でフランスの保護国となり、フランス領インドシナのラオスの中心となった。
  note: 王の一覧は一部のみ（要確認）
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Luang_Phrabang"

- id: champasak
  name: チャンパーサック王国
  short: チャンパーサック
  color: "#e3a27a"
  kind: 王国
  rulers:
    - {name: ノーカサット（ソイシーサムット）, title: チャンパーサック王, from: 1713, to: 1737, source: "https://en.wikipedia.org/wiki/Kingdom_of_Champasak"}
    - {name: サイヤクマーン, title: チャンパーサック王, from: 1737, to: 1791, source: "https://en.wikipedia.org/wiki/Sayakumane"}
    - {name: カムスック, title: チャンパーサック王, from: 1863, to: 1899, source: "https://en.wikipedia.org/wiki/Kham_Souk"}
  periods:
    - from: 1713
      to: 1778
      text: ラーンサーンの南部が分かれてできた王国。メコン川中流域とタイ東北部の南部を治めた。
    - from: 1779
      to: 1904
      text: 1779年にシャムの宗主権下に入った。1893年に東岸をフランスに譲り、1904年に西岸もフランス領となって、王家は地方の知事となった。
  note: 王の一覧は一部のみ（要確認）。王家のブン・ウム（1912–1980）は1946年にフランスと結び、ラオス王国の南部の実力者となった
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Champasak"

- id: phuan
  name: シエンクアン（プアン侯国）
  short: シエンクアン
  color: "#cdb98e"
  kind: 侯国
  periods:
    - from: 1707
      to: 1831
      text: ジャール平原のプアン人の小国。ヴィエンチャン・ルアンパバーンとベトナムの両方に貢納した。
    - from: 1832
      to: 1892
      text: 1832年にベトナム（阮朝の明命帝）に併合され（鎮寧府）、のちに王家が戻されたが、1870年代からは黒旗軍（ホー）の略奪とシャムの出兵にさらされた。
  source: "https://en.wikipedia.org/wiki/Muang_Phuan"

- id: laos
  name: ラオス
  names:
    - {to: 1945, name: ラオ・イサラ（自由ラオス）政府, short: ラオス, kind: 臨時政府}
    - {from: 1946, to: 1974, name: ラオス王国, short: ラオス, kind: 王国}
    - {from: 1975, name: ラオス人民民主共和国, short: ラオス, kind: 社会主義共和国（ラオス人民革命党の一党制）}
  short: ラオス
  color: "#f2c48a"
  kind: 国
  rulers:
    - {name: ペッサラート, title: ラオ・イサラ政府の首班, from: 1945, to: 1946, note: 1945年10月にラオスの独立を宣言したが、1946年にフランスが戻った, source: "https://ja.wikipedia.org/wiki/ペッサラート"}
    - {name: シーサワンウォン, title: ラオス国王, from: 1946, to: 1959, source: "https://ja.wikipedia.org/wiki/シーサワンウォン"}
    - {name: サワンワッタナー, title: ラオス国王, from: 1959, to: 1975, note: 1975年に退位させられ、再教育キャンプで死んだとされる, source: "https://ja.wikipedia.org/wiki/サワンワッタナー"}
    - {name: カイソーン・ポムウィハーン, title: ラオス人民革命党書記長・首相（1991年から国家主席）, from: 1975, to: 1992, note: 国家主席はスパーヌウォン（1975–91）, source: "https://ja.wikipedia.org/wiki/カイソーン・ポムウィハーン"}
    - {name: カムタイ・シーパンドーン, title: ラオス人民革命党議長・国家主席, from: 1992, to: 2006, source: "https://ja.wikipedia.org/wiki/カムタイ・シーパンドーン"}
    - {name: チュンマリー・サイニャソーン, title: ラオス人民革命党書記長・国家主席, from: 2006, to: 2016, source: "https://ja.wikipedia.org/wiki/チュンマリー・サイニャソーン"}
    - {name: ブンニャン・ウォーラチット, title: ラオス人民革命党書記長・国家主席, from: 2016, to: 2021, source: "https://ja.wikipedia.org/wiki/ブンニャン・ウォーラチット"}
    - {name: トンルン・シースリット, title: ラオス人民革命党書記長・国家主席, from: 2021, to: 2025, source: "https://ja.wikipedia.org/wiki/トンルン・シースリット"}
  periods:
    - from: 1945
      to: 1953
      text: 日本の降伏後にラオ・イサラ（自由ラオス）が独立を宣言したが、1946年にフランスが戻った。1949年にフランス連合内の協同国となり、1953年に完全に独立した。
    - from: 1954
      to: 1974
      text: ジュネーヴ協定の後、王国政府と共産主義勢力のパテート・ラーオ（ネオ・ラーオ・ハクサット）の対立が内戦となった。中立派・右派・左派の連合政府は長続きせず、ベトナム戦争の中で東部をホー・チ・ミン・ルートが通り、アメリカの大規模な爆撃を受けた。
    - from: 1975
      to: 1985
      text: 1975年12月に王政を廃してラオス人民民主共和国が成立し、ラオス人民革命党の一党支配となった。ベトナムと「特別な関係」を結んだ。
    - from: 1986
      to: 2025
      text: 新経済メカニズム（チンタナカーン・マイ）で市場経済を取り入れ、1997年にASEANに加盟した。中国の投資が増え、2021年に中国・ラオス鉄道が開通した。
  note: 1946–1948年はフランスの保護国（france・間接統治）、1949–1952年はフランス連合の協同国（overlord france）として塗る
  source: "https://ja.wikipedia.org/wiki/ラオスの歴史"

- id: pathet_lao
  name: パテート・ラーオ
  short: パテート・ラーオ
  color: "#c4826a"
  kind: 共産主義勢力（ネオ・ラーオ・ハクサット）
  rulers:
    - {name: スパーヌウォン, title: パテート・ラーオの指導者（「赤い殿下」）, from: 1950, to: 1975, note: 実際の指導者はラオス人民党（1955年結成）書記長のカイソーン・ポムウィハーン, source: "https://ja.wikipedia.org/wiki/スパーヌウォン"}
  periods:
    - from: 1954
      to: 1957
      text: ジュネーヴ協定で北東部のフアパン・ポンサーリー2州に集結地を与えられた。1957年の連合政府で一時、王国政府に統合された。
    - from: 1960
      to: 1975
      text: 1960年のコン・レーのクーデタ以後、内戦が再燃し、北ベトナムの支援で東部の山地を広くおさえた。1975年に全土を握り、ラオス人民民主共和国を建てた。
  source: "https://ja.wikipedia.org/wiki/パテート・ラーオ"

# ---- カンボジア ----

- id: cambodia
  name: カンボジア
  names:
    - {to: 1952, name: カンボジア王国, short: カンボジア, kind: 王国}
    - {from: 1953, to: 1969, name: カンボジア王国, short: カンボジア, kind: 王国（シハヌークの政権）}
    - {from: 1970, to: 1974, name: クメール共和国, short: カンボジア, kind: 共和国（ロン・ノル政権）}
    - {from: 1979, to: 1988, name: カンプチア人民共和国, short: カンボジア, kind: 社会主義共和国（ベトナムの後ろ盾）}
    - {from: 1989, to: 1992, name: カンボジア国, short: カンボジア, kind: 国}
    - {from: 1993, name: カンボジア王国, short: カンボジア, kind: 立憲君主国}
  short: カンボジア
  color: "#e8a0b4"
  kind: 王国
  rulers:
    - {name: ラーマーティパディー1世（ポニェ・チャン）, title: カンボジア王, from: 1642, to: 1658, note: イスラーム教に改宗した王。1658年に広南阮氏の軍に捕らえられた, source: "https://en.wikipedia.org/wiki/Ramathipadi_I"}
    - {name: アン・エン, title: カンボジア王, from: 1779, to: 1796, note: シャムで育てられ、1794年にシャムの後ろ盾で即位。西部（バッタンバン・シェムリアップ）はシャムの支配下に入った, source: "https://en.wikipedia.org/wiki/Ang_Eng"}
    - {name: アン・チャン2世, title: カンボジア王, from: 1806, to: 1834, note: 1812年からベトナムに頼った, source: "https://en.wikipedia.org/wiki/Ang_Chan_II"}
    - {name: アン・メイ, title: 女王（ベトナムの傀儡）, from: 1835, to: 1847, source: "https://en.wikipedia.org/wiki/Ang_Mey"}
    - {name: アン・ドゥオン, title: カンボジア王, from: 1848, to: 1860, note: シャムとベトナムの両方の宗主権を受けた。フランスに保護を求めた, source: "https://en.wikipedia.org/wiki/Ang_Duong"}
    - {name: ノロドム, title: カンボジア王, from: 1860, to: 1904, note: 1863年にフランスの保護国化を受け入れた, source: "https://ja.wikipedia.org/wiki/ノロドム"}
    - {name: シソワット, title: カンボジア王, from: 1904, to: 1927, source: "https://ja.wikipedia.org/wiki/シソワット"}
    - {name: モニヴォン, title: カンボジア王, from: 1927, to: 1941, source: "https://ja.wikipedia.org/wiki/シソワット・モニヴォン"}
    - {name: ノロドム・シハヌーク, title: 国王（1955年退位後は首相・国家元首）, from: 1941, to: 1970, note: 1953年に独立を達成。1955年に父スラマリットに譲位して政党（サンクム）を率い、1960年から国家元首。1970年のクーデタで追われた, source: "https://ja.wikipedia.org/wiki/ノロドム・シハヌーク"}
    - {name: ロン・ノル, title: 首相・大統領, from: 1970, to: 1975, source: "https://ja.wikipedia.org/wiki/ロン・ノル"}
    - {name: ヘン・サムリン, title: 人民革命評議会議長・国家評議会議長, from: 1979, to: 1991, note: 1985年からはフン・センが首相として実権を強めた, source: "https://ja.wikipedia.org/wiki/ヘン・サムリン"}
    - {name: フン・セン, title: 首相, from: 1991, to: 2023, note: 1985年から首相。1993–98年はラナリット（第一首相）と並ぶ第二首相, source: "https://ja.wikipedia.org/wiki/フン・セン"}
    - {name: フン・マネット, title: 首相, from: 2023, to: 2025, note: フン・センの長男, source: "https://ja.wikipedia.org/wiki/フン・マネット"}
  periods:
    - from: 1648
      to: 1810
      text: アンコール朝の後のカンボジアは、ウドンを都とする小王国となり、王族の争いに東のベトナム（広南阮氏）と西のシャムが介入した。メコン・デルタ（プレイ・ノコール＝サイゴンなど）はベトナム人の移住で阮氏の領土となり、1794年には北西部（バッタンバン・シェムリアップ）をシャムに奪われた。
    - from: 1811
      to: 1862
      text: シャムとベトナムの争奪の場となり、1834–41年はベトナムに併合された（鎮西城）。1845年の和約でアン・ドゥオンが両国の宗主権のもとで王となった。
    - from: 1863
      to: 1952
      text: 1863年にフランスの保護国となり、1887年にフランス領インドシナ連邦に入った。1907年にシャムからバッタンバン・シェムリアップを取り戻した。
    - from: 1953
      to: 1969
      text: 1953年にシハヌークのもとで独立し、ベトナム戦争では中立政策をとった。
    - from: 1970
      to: 1975
      text: 1970年の親米派ロン・ノルのクーデタでクメール共和国となった。シハヌークは北京に亡命してクメール・ルージュと結び、内戦の中でアメリカ軍の爆撃とベトナム軍の進出を受けた。
    - from: 1979
      to: 1991
      text: ベトナム軍がクメール・ルージュの政権を倒し、ヘン・サムリンのカンプチア人民共和国を建てた。タイ国境ではクメール・ルージュ・シハヌーク派・ソン・サン派の三派連合が抵抗し、内戦が続いた。ベトナム軍は1989年に撤退した。
    - from: 1991
      to: 2025
      text: 1991年のパリ和平協定で内戦が終わり、国連カンボジア暫定統治機構（UNTAC）のもとの総選挙を経て王政が復活した（1993）。フン・センの人民党の長期政権が続いた。
  note: >-
    17–18世紀の王は在位と廃立が入り組んでいるので主な人だけを書いた（要確認）。宗主権：1794–1811年はシャム、1812–1833年はベトナム、
    1846–1862年はシャム（ベトナムにも朝貢した）とした。1863–1952年はフランス（間接統治）、1975–78年は民主カンプチア（khmer_rouge）として塗る。
  source:
    - "https://ja.wikipedia.org/wiki/カンボジアの歴史"
    - "https://en.wikipedia.org/wiki/Post-Angkor_period"

- id: khmer_rouge
  name: 民主カンプチア
  names:
    - {to: 1975, name: カンプチア民族統一戦線（クメール・ルージュ）, short: クメール・ルージュ, kind: 共産主義勢力}
    - {from: 1976, to: 1978, name: 民主カンプチア, short: 民主カンプチア, kind: 共産主義国家（ポル・ポト政権）}
    - {from: 1979, name: 民主カンプチア（クメール・ルージュの残存勢力）, short: クメール・ルージュ, kind: 武装勢力}
  short: クメール・ルージュ
  color: "#9a7466"
  kind: 共産主義勢力
  rulers:
    - {name: ポル・ポト, title: カンプチア共産党書記長（1976年から首相）, from: 1970, to: 1997, note: 国家元首はシハヌーク（1975–76）、キュー・サムファン（1976–79）, source: "https://ja.wikipedia.org/wiki/ポル・ポト"}
  periods:
    - from: 1970
      to: 1974
      text: ロン・ノル政権と戦い、北ベトナム軍の助けで農村の大半をおさえた。名目上の代表は北京に亡命したシハヌークだった。
    - from: 1975
      to: 1978
      text: 1975年4月にプノンペンを落とし、都市住民を農村に強制移住させた。貨幣・市場・宗教を廃止した極端な共産主義の政策と粛清・虐殺・飢餓で、人口約800万のうち少なくとも150万人以上が死んだとされる。
    - from: 1979
      to: 1998
      text: ベトナム軍に追われ、タイ国境の山地（パイリン・アンロンヴェンなど）に拠って抵抗した。1991年のパリ和平協定の後も武装闘争を続けたが、1996年から投降が相次ぎ、1998年に消滅した。
  note: 2006年に国連の支援で特別法廷が設けられ、指導者たちが人道に対する罪・ジェノサイドで裁かれた
  source:
    - "https://ja.wikipedia.org/wiki/民主カンプチア"
    - "https://ja.wikipedia.org/wiki/クメール・ルージュ"

# ---- ベトナム ----

- id: trinh
