    - {name: 阮福溙（グエン・フック・タイ）, title: 阮主, from: 1687, to: 1691, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Thái"}
    - {name: 阮福淍（グエン・フック・チュー）, title: 阮主, from: 1691, to: 1725, note: チャンパーを併合し（1697）、嘉定府（サイゴン）を置いた（1698）, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Chu"}
    - {name: 阮福澍（グエン・フック・チュー）, title: 阮主, from: 1725, to: 1738, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Chú"}
    - {name: 阮福濶（グエン・フック・コアット）, title: 阮主（武王）, from: 1738, to: 1765, note: 王号を名のり、メコン・デルタの併合を完成した（1757）, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Khoát"}
    - {name: 阮福淳（グエン・フック・トゥアン）, title: 阮主, from: 1765, to: 1777, note: 1777年に西山軍に殺された, source: "https://en.wikipedia.org/wiki/Nguyễn_Phúc_Thuần"}
    - {name: 阮福映（グエン・フック・アイン）, title: 阮主（1780年から大元帥・王）, from: 1777, to: 1801, note: 1802年に嘉隆帝として阮朝を開いた, source: "https://ja.wikipedia.org/wiki/嘉隆帝"}
  periods:
    - from: 1648
      to: 1773
      text: 黎朝の臣下の形をとりながら、中部（広南〈コーチシナ〉）で独立した政権を築いた。都はフエ（富春）。会安（ホイアン）は日本人町・中国人町のある国際港だった。南のチャンパー・カンボジアに進出し、メコン・デルタまで領土を広げた。
    - from: 1774
      to: 1801
      text: 西山の反乱と鄭氏の侵攻で滅びかけたが、生き残った阮福映がサイゴン（嘉定）を拠点に、シャム・フランス人宣教師ピニョーの助けを得て反撃した。
  note: 清の冊封は受けていない（黎朝の臣下という形をとった）ので、宗主権の帯は付けない
  source:
    - "https://ja.wikipedia.org/wiki/広南国"

- id: tay_son
