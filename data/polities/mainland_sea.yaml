    - {name: グエン・ヴァン・チュー, title: 国家指導評議会議長・大統領, from: 1965, to: 1975, note: 1965–67年は首相グエン・カオ・キと並ぶ, source: "https://ja.wikipedia.org/wiki/グエン・ヴァン・チュー"}
    - {name: ズオン・ヴァン・ミン, title: 大統領, from: 1975, to: 1975, note: 1975年4月30日に降伏した, source: "https://ja.wikipedia.org/wiki/ズオン・ヴァン・ミン"}
