  periods:
    - from: 1648
      to: 1700
      text: 「黄金世紀」が終わり、国力が衰える。カタルーニャ（1640–52）とポルトガル（1640–68）の反乱、フランスとの戦争で領土を失う。病弱なカルロス2世に子がなく、王位継承が全ヨーロッパの問題になった。
    - from: 1700
      to: 1714
      text: スペイン継承戦争。ブルボン家のフェリペ5世が王位を守るが、ユトレヒト条約などでネーデルラント・イタリアの領土とジブラルタル・ミノルカを失う。
    - from: 1715
      to: 1788
      text: ブルボン朝のもとで、新組織王令（ヌエバ・プランタ王令）によりアラゴン諸王国の自治を廃して中央集権化を進める。カルロス3世が啓蒙改革を行った。
    - from: 1789
      to: 1807
      text: カルロス4世のもとで寵臣ゴドイが実権を握る。フランス革命戦争でフランスと戦ったが、1795年のバーゼルの和約で講和し、翌年からフランスと同盟してイギリスと戦った。1805年のトラファルガーの海戦で艦隊を失い、1807年のフォンテーヌブロー条約でフランス軍の領内通過（ポルトガル侵攻）を認めた。
    - from: 1808
      to: 1813
      text: ナポレオンが兄ジョゼフを王に立て、各地の民衆蜂起とイギリス軍の介入で半島戦争となる。1812年、抵抗派のカディス議会が自由主義的なカディス憲法を制定した。
    - from: 1814
      to: 1815
      text: フェルナンド7世が復位して絶対王政に戻り、カディス憲法を廃止した。中南米の植民地では独立運動が広がる。
    - from: 1816
      to: 1833
      text: 1820年のリエゴの反乱で立憲政治が復活したが（自由主義の3年間）、1823年にフランス軍の干渉で絶対王政に戻された。この間に中南米の植民地の大半が独立し、残ったのはキューバ・プエルトリコ・フィリピンなどだけになった。
    - from: 1833
      to: 1868
      text: 幼いイサベル2世の即位に、叔父ドン・カルロスを推す保守派（カルリスタ）が反乱を起こした（第一次カルリスタ戦争、1833–40）。その後も将軍たちのクーデタ（プロヌンシアミエント）で政権が交代する不安定な立憲王政が続いた。
    - from: 1868
      to: 1874
      text: 九月革命で女王が追放され、イタリアからアマデオ1世を迎えたが2年で退位し、第一共和政（1873）となった。連邦派の反乱と第三次カルリスタ戦争で混乱し、1874年末に王政が復古した。
    - from: 1875
      to: 1914
      text: 王政復古体制。保守党カノバスと自由党サガスタが交代で政権を担った。1898年の米西戦争でキューバ・プエルトリコ・フィリピンを失い（「98年の世代」）、以後はモロッコに進出した（1912年保護領）。バルセロナではカタルーニャ主義と労働運動が強まった。
    - from: 1914
      to: 1930
      text: 第一次世界大戦では中立を守り、輸出で好景気となったが、戦後は労働争議とテロが続いた。モロッコのリーフ戦争でアヌンヌの大敗（1921）を喫し、1923年にプリモ・デ・リベラ将軍が国王の承認のもとで軍事独裁を始めた。
    - from: 1931
      to: 1935
      text: 1931年4月に王政が倒れ、第二共和政が成立した。農地改革・政教分離・カタルーニャの自治を進めたが、右派と左派の対立が激しく、1934年にはアストゥリアスの炭鉱労働者の蜂起が軍に鎮圧された。
    - from: 1936
      to: 1939
      text: スペイン内戦。1936年2月の選挙で人民戦線政府が成立すると、7月にフランコ将軍らの軍がモロッコから反乱を起こした。ドイツ・イタリアが反乱軍を、ソ連と国際義勇軍が共和国政府を支援し、イギリス・フランスは不干渉政策をとった。1939年3月にマドリードが陥落し、反乱軍が勝利した。
    - from: 1940
      to: 1974
      text: フランコの独裁。第二次世界大戦では中立（一時は「非交戦国」）を保ったが、戦後は国際的に孤立した。冷戦の中でアメリカと協定を結び（1953）、国際連合に加盟した（1955）。1960年代には観光と工業化で高度成長した。バスクでは ETA が武装闘争を始めた。
    - from: 1975
      to: 1981
      text: フランコの死後、フアン・カルロス1世が即位して王政が復活し、首相スアレスのもとで民主化が進んだ。1978年の憲法で立憲君主制と自治州の制度が定まり、1981年2月の軍のクーデタ未遂も失敗した。
    - from: 1982
      to: 2025
      text: 社会労働党のゴンサレス政権がEC（1986）・NATO（1982）への加盟を実現し、バルセロナ五輪（1992）を開いた。2008年の金融危機で失業率が高まった。2017年にはカタルーニャ州政府が住民投票を強行して独立を宣言したが、中央政府に自治を停止された。
  note: 1975年以降は立憲君主制で、政治の実権は首相（政府首班）にあるため、国王と首相の両方を挙げる。1936–39年の内戦中は、この政体を共和国政府側とし、反乱軍側は nationalist_spain で描く。
  source: "ja.wikipedia: スペイン・ハプスブルク朝"

