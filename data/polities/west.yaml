- id: vichy_france
  name: フランス国（ヴィシー政府）
  short: ヴィシー政府
  color: "#b9c4d6"
  kind: 国家（ドイツへの協力体制）
  rulers:
    - {name: フィリップ・ペタン, title: フランス国主席, from: 1940, to: 1944, note: 第一次世界大戦のヴェルダンの英雄。1940年7月に議会から全権を委ねられた。1944年8月にドイツに連れ去られ、戦後は死刑判決（終身刑に減刑）を受けた。, source: "https://en.wikipedia.org/wiki/Philippe_Pétain"}
    - {name: ピエール・ラヴァル, title: 首相（政府首班）, from: 1942, to: 1944, note: 1940年にも副首相としてペタン政権を支えた。ドイツへの協力を進め、戦後に処刑された。, source: "https://en.wikipedia.org/wiki/Pierre_Laval"}
  periods:
    - from: 1940
      to: 1941
      text: 1940年6月の独仏休戦協定の後、温泉町ヴィシーに置かれた政府。第三共和政を廃し、「労働・家族・祖国」を掲げる権威主義の体制をとった。本土の南部（自由地域）と北アフリカ・西アフリカなどの植民地を治め、ドイツに協力した（コラボラシオン）。ユダヤ人を差別する法律をつくった。
    - from: 1942
      to: 1944
      text: 1942年11月、連合軍の北アフリカ上陸に対抗してドイツ・イタリア軍が南部も占領し、政府は名前だけのものになった。ユダヤ人の一斉検挙と移送に協力した。1944年8月、連合軍の進撃で崩壊した。
  note: 地図では、1940–42年の南部の自由地域と、1942年11月までの北アフリカ・西アフリカの植民地をこの政体の色で描く。1942–44年の南部はドイツ・イタリアの占領地（赤い斜線）として描く。
  source: "https://ja.wikipedia.org/wiki/ヴィシー政権"

