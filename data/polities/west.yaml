    - {name: ムハンマド・ブン・ハサン, title: デイ, from: 1718, to: 1724, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: クルド・アブディ, title: デイ, from: 1724, to: 1732, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: ババ・イブラーヒーム, title: デイ, from: 1732, to: 1745, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: イブラーヒーム・キュチュク, title: デイ, from: 1745, to: 1748, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: ムハンマド・ブン・バキル, title: デイ, from: 1748, to: 1754, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: ババ・アリー・ブー・セバア, title: デイ, from: 1754, to: 1766, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: ムハンマド・ブン・ウスマーン, title: デイ, from: 1766, to: 1791, source: "en.wikipedia: Mohamed ben-Osman", note: 1775年のスペイン軍のアルジェ攻撃を撃退した。}
    - {name: ババ・ハサン, title: デイ, from: 1791, to: 1798, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: ムスタファ, title: デイ, from: 1798, to: 1805, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: アフマド, title: デイ, from: 1805, to: 1808, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: アリー・アッラッサール, title: デイ, from: 1808, to: 1809, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: ハーッジ・アリー, title: デイ, from: 1809, to: 1815, source: "en.wikipedia: List of Ottoman governors of Algiers", note: 要確認。}
    - {name: ウマル・アガ, title: デイ, from: 1815, to: 1817, note: 1815年は短期間にムハンマド・ハズナジーをはさむ。要確認。, source: "en.wikipedia: List of Ottoman governors of Algiers"}
  note: 1659年まではオスマン帝国が任命するパシャ、1659–71年はイェニチェリ軍団の長（アガ）、1671年からは選挙で選ばれるデイが統治した。1710年以前の統治者は頻繁に交代したため省略。
  periods:
    - from: 1648
      to: 1709
      text: オスマン帝国の宗主権のもとにある「摂政領」。実権はイェニチェリ軍団と海賊（バルバリア私掠船）の船長たちが握り、統治者がしばしば交代した。
    - from: 1710
      to: 1815
      text: デイがパシャを兼ねて、オスマン帝国からほぼ独立した。地中海の私掠と、ヨーロッパ諸国からの貢納金が財源。1708年に奪ったオランをスペインに奪い返されたが（1732年）、1792年に回復した。
  source: "ja.wikipedia: オスマン帝国領アルジェリア"

