    - {name: イドリース1世, title: 国王, from: 1951, to: 1969, note: サヌーシー教団の長。1969年9月、外国で療養中にクーデタで廃された。, source: "https://en.wikipedia.org/wiki/Idris_of_Libya"}
    - {name: ムアンマル・カッザーフィー（カダフィ）, title: 革命指導評議会議長→革命指導者, from: 1969, to: 2011, note: 1969年9月の青年将校のクーデタで権力を握った。2011年10月、内戦の中で殺害された。, source: "https://en.wikipedia.org/wiki/Muammar_Gaddafi"}
    - {name: ムスタファ・アブドゥルジャリール, title: 国民評議会議長, from: 2011, to: 2012, source: "https://en.wikipedia.org/wiki/Mustafa_Abdul_Jalil"}
    - {name: ムハンマド・マガリアフ, title: 国民議会議長, from: 2012, to: 2013, source: "https://en.wikipedia.org/wiki/Mohammed_Magariaf"}
    - {name: ヌーリー・アブーサフマイン, title: 国民議会議長（トリポリ）, from: 2013, to: 2016, note: 2014年の選挙で生まれた代表議会（東部）を認めず、トリポリで政府を続けた。, source: "https://en.wikipedia.org/wiki/Nouri_Abusahmain"}
    - {name: ファーイズ・サッラージ, title: 国民合意政府（大統領評議会議長）, from: 2016, to: 2021, note: 国際連合の仲介でつくられた政府。, source: "https://en.wikipedia.org/wiki/Fayez_al-Sarraj"}
    - {name: アブドゥルハミード・ドベイバ, title: 国民統一政府の首相, from: 2021, note: 2022年以降、東部の代表議会は別の首相を立てた。大統領評議会議長はムハンマド・メンフィ。, source: "https://en.wikipedia.org/wiki/Abdul_Hamid_Dbeibeh"}
  periods:
    - from: 1951
      to: 1968
      text: 1951年12月、国際連合の決議によりトリポリタニア・キレナイカ・フェザーンの連邦王国として独立した。1959年に石油が見つかり、豊かになったが、英米の基地が置かれた。
    - from: 1969
      to: 2010
      text: カダフィの独裁。石油を国有化し、独自の「ジャマーヒリーヤ（大衆による国家）」を称した。反欧米の立場をとり、ロッカビー事件（1988）などで国際的に孤立したが、2003年に大量破壊兵器を放棄して欧米と和解した。
    - from: 2011
      to: 2013
      text: 「アラブの春」の反乱が内戦となり、NATOの空爆の支援を受けた反政府勢力がカダフィ政権を倒した。
    - from: 2014
      to: 2025
      text: 2014年から、トリポリを中心とする西部の政府と、トブルク・ベンガジの代表議会とハフタル将軍のリビア国民軍が治める東部に分かれた（第二次リビア内戦）。2019–20年にはハフタル軍がトリポリを攻めた。2020年の停戦の後も、東西に二つの政府が並び立っている。
  note: 2014年以降は西部（トリポリ）の政府をこの政体とし、東部の勢力は libya_east で描く。
  source: "https://ja.wikipedia.org/wiki/リビア"

- id: libya_east
  name: リビア東部の勢力（代表議会・リビア国民軍）
  short: リビア東部政府
  color: "#cdb48a"
  kind: 対立政府
  rulers:
    - {name: アギーラ・サーレハ, title: 代表議会議長, from: 2014, source: "https://en.wikipedia.org/wiki/Aguila_Saleh_Issa"}
    - {name: ハリーファ・ハフタル, title: リビア国民軍総司令官（実権者）, from: 2015, note: 2014年から「尊厳作戦」でベンガジのイスラーム主義勢力と戦った。, source: "https://en.wikipedia.org/wiki/Khalifa_Haftar"}
  periods:
    - from: 2014
      to: 2025
      text: 2014年の選挙で選ばれた代表議会はトブルクに移り、ハフタル将軍のリビア国民軍とともに東部を治めた。2017年にベンガジ、2019年に南部のフェザーン、2020年にシルトを押さえた。
  note: 地図では支配地を不確実（斜線）で描く。
  source: "https://en.wikipedia.org/wiki/Second_Libyan_Civil_War"

- id: algeria
  name: アルジェリア民主人民共和国
  short: アルジェリア
  color: "#c3dba0"
  kind: 共和国
  rulers:
    - {name: アフマド・ベン・ベラ, title: 首相→大統領（1963年〜）, from: 1962, to: 1965, note: 1965年のクーデタで追われた。, source: "https://en.wikipedia.org/wiki/Ahmed_Ben_Bella"}
    - {name: ウアリ・ブーメディエン, title: 革命評議会議長→大統領（1976年〜）, from: 1965, to: 1978, source: "https://en.wikipedia.org/wiki/Houari_Boumédiène"}
    - {name: ラバハ・ビタト, title: 大統領代行, from: 1978, to: 1979, source: "https://en.wikipedia.org/wiki/Rabah_Bitat"}
    - {name: シャドリ・ベンジェディード, title: 大統領, from: 1979, to: 1992, note: 1992年1月、軍の圧力で辞任した。, source: "https://en.wikipedia.org/wiki/Chadli_Bendjedid"}
    - {name: ムハンマド・ブーディアフ, title: 国家最高評議会議長, from: 1992, to: 1992, note: 1992年6月に暗殺された。, source: "https://en.wikipedia.org/wiki/Mohamed_Boudiaf"}
    - {name: アリー・カーフィー, title: 国家最高評議会議長, from: 1992, to: 1994, source: "https://en.wikipedia.org/wiki/Ali_Kafi"}
    - {name: リアミン・ゼルーアル, title: 大統領, from: 1994, to: 1999, source: "https://en.wikipedia.org/wiki/Liamine_Zéroual"}
    - {name: アブデルアジズ・ブーテフリカ, title: 大統領, from: 1999, to: 2019, note: 2019年、民衆の抗議（ヒラク）で辞任した。, source: "https://en.wikipedia.org/wiki/Abdelaziz_Bouteflika"}
    - {name: アブデルカーデル・ベンサーラ, title: 大統領代行, from: 2019, to: 2019, source: "https://en.wikipedia.org/wiki/Abdelkader_Bensalah"}
    - {name: アブデルマジド・テブン, title: 大統領, from: 2019, source: "https://en.wikipedia.org/wiki/Abdelmadjid_Tebboune"}
  periods:
    - from: 1962
      to: 1988
      text: 8年にわたるアルジェリア戦争の末、1962年7月にフランスから独立した。約100万人のヨーロッパ系住民（ピエ・ノワール）がフランスに去った。民族解放戦線（FLN）の一党体制のもとで、社会主義と石油・天然ガスの国有化を進め、非同盟諸国の中心の一つとなった。
    - from: 1988
      to: 2002
      text: 1988年の暴動の後に複数政党制を認めたが、1991年の選挙でイスラーム救国戦線が勝つと軍が選挙を中止し、10年に及ぶ内戦（「暗黒の10年」）で約15–20万人が死んだ。
    - from: 2002
      to: 2025
      text: ブーテフリカ大統領のもとで内戦後の和解を進め、天然ガスの収入で安定した。2019年の民衆の抗議運動（ヒラク）で大統領が辞任した。
  source: "https://ja.wikipedia.org/wiki/アルジェリア"

- id: tunisia
  name: チュニジア共和国
  names:
    - {to: 1956, name: チュニジア王国, kind: 王国}
  short: チュニジア
  color: "#ebb2a3"
  kind: 共和国
  rulers:
    - {name: ムハンマド・アミーン, title: 国王（ベイ）, from: 1956, to: 1957, note: 1957年7月に王政が廃止された。, source: "https://en.wikipedia.org/wiki/Muhammad_VIII_al-Amin"}
    - {name: ハビーブ・ブルギバ, title: 首相（1956）→大統領（1957年〜）, from: 1956, to: 1987, note: 独立運動の指導者。女性の地位向上など世俗的な近代化を進めた。1987年11月、首相ベン・アリーに解任された。, source: "https://en.wikipedia.org/wiki/Habib_Bourguiba"}
    - {name: ザイン・アル＝アービディーン・ベン・アリー, title: 大統領, from: 1987, to: 2011, note: 2011年1月、民衆の抗議（ジャスミン革命）でサウジアラビアに逃れた。, source: "https://en.wikipedia.org/wiki/Zine_El_Abidine_Ben_Ali"}
    - {name: フアード・ムバッザア, title: 暫定大統領, from: 2011, to: 2011, source: "https://en.wikipedia.org/wiki/Fouad_Mebazaa"}
    - {name: モンセフ・マルズーキ, title: 大統領, from: 2011, to: 2014, source: "https://en.wikipedia.org/wiki/Moncef_Marzouki"}
    - {name: ベジ・カーイド・セブシ, title: 大統領, from: 2014, to: 2019, note: 在職中の2019年7月に死去した。, source: "https://en.wikipedia.org/wiki/Beji_Caid_Essebsi"}
    - {name: ムハンマド・ナーセル, title: 暫定大統領, from: 2019, to: 2019, source: "https://en.wikipedia.org/wiki/Mohamed_Ennaceur"}
    - {name: カイス・サイード, title: 大統領, from: 2019, note: 2021年に議会を停止し、権力を集中させた。, source: "https://en.wikipedia.org/wiki/Kais_Saied"}
  periods:
    - from: 1956
      to: 1986
      text: 1956年3月にフランスから独立し、翌年共和国となった。ブルギバ大統領のもとで一夫多妻の禁止など世俗的な改革を進めた。1961年にはフランス軍の残るビゼルト基地をめぐって衝突した（1963年に撤退）。
    - from: 1987
      to: 2010
      text: ベン・アリー大統領の長期の独裁。観光と輸出産業で経済は伸びたが、言論は厳しく抑えられた。
    - from: 2011
      to: 2025
      text: 2010年12月に始まった民衆の抗議（ジャスミン革命）が独裁を倒し、「アラブの春」の出発点となった。新憲法（2014）で民主化が進んだが、2021年にサイード大統領が議会を停止して権力を集め、民主化は後退した。
  source: "https://ja.wikipedia.org/wiki/チュニジア"

- id: mauritania
  name: モーリタニア・イスラーム共和国
  short: モーリタニア
  color: "#bcd5cf"
  kind: 共和国
  rulers:
    - {name: モフタール・ウルド・ダッダ, title: 大統領, from: 1960, to: 1978, note: 1978年のクーデタで追われた。, source: "https://en.wikipedia.org/wiki/Moktar_Ould_Daddah"}
    - {name: ムスタファ・ウルド・サレク, title: 軍事評議会議長, from: 1978, to: 1979, source: "https://en.wikipedia.org/wiki/Mustafa_Ould_Salek"}
    - {name: ムハンマド・マフムード・ウルド・ルーリー, title: 軍事評議会議長, from: 1979, to: 1980, source: "https://en.wikipedia.org/wiki/Mohamed_Mahmoud_Ould_Louly"}
    - {name: ムハンマド・フーナ・ウルド・ハイダッラ, title: 軍事評議会議長, from: 1980, to: 1984, source: "https://en.wikipedia.org/wiki/Mohamed_Khouna_Ould_Haidalla"}
    - {name: マアウイヤ・ウルド・タヤ, title: 軍事評議会議長→大統領, from: 1984, to: 2005, source: "https://en.wikipedia.org/wiki/Maaouya_Ould_Sid%27Ahmed_Taya"}
    - {name: エリ・ウルド・ムハンマド・ヴァル, title: 軍事評議会議長, from: 2005, to: 2007, source: "https://en.wikipedia.org/wiki/Ely_Ould_Mohamed_Vall"}
    - {name: シディ・ウルド・シェイフ・アブダライ, title: 大統領, from: 2007, to: 2008, source: "https://en.wikipedia.org/wiki/Sidi_Ould_Cheikh_Abdallahi"}
    - {name: ムハンマド・ウルド・アブドゥルアズィーズ, title: 軍事評議会議長→大統領（2009年〜）, from: 2008, to: 2019, note: 2009年の選挙前の数か月はバ・ママドゥ・ムバレが暫定大統領。, source: "https://en.wikipedia.org/wiki/Mohamed_Ould_Abdel_Aziz"}
    - {name: ムハンマド・ウルド・ガズワーニー, title: 大統領, from: 2019, source: "https://en.wikipedia.org/wiki/Mohamed_Ould_Ghazouani"}
  periods:
    - from: 1960
      to: 1979
      text: 1960年11月にフランスから独立した。1976年にスペイン領サハラの南部を併合したが、ポリサリオ戦線との戦争に疲れ、1979年に放棄した。
    - from: 1980
      to: 2025
      text: クーデタがくり返されたが、2019年に初めて選挙による政権交代が行われた。北部のズエラット周辺の鉄鉱石が主な輸出品。
  note: 地図の範囲には北部（ティリス・ゼムール州）だけが入る。
  source: "https://ja.wikipedia.org/wiki/モーリタニア"

- id: mali
  name: マリ共和国
  short: マリ
  color: "#e2c08f"
  kind: 共和国
  rulers:
    - {name: モディボ・ケイタ, title: 大統領, from: 1960, to: 1968, note: 1968年のクーデタで追われた。, source: "https://en.wikipedia.org/wiki/Modibo_Keïta"}
    - {name: ムーサ・トラオレ, title: 国家解放軍事委員会議長→大統領, from: 1968, to: 1991, source: "https://en.wikipedia.org/wiki/Moussa_Traoré"}
    - {name: アマドゥ・トゥマニ・トゥーレ, title: 暫定政府首班, from: 1991, to: 1992, source: "https://en.wikipedia.org/wiki/Amadou_Toumani_Touré"}
    - {name: アルファ・ウマル・コナレ, title: 大統領, from: 1992, to: 2002, source: "https://en.wikipedia.org/wiki/Alpha_Oumar_Konaré"}
    - {name: アマドゥ・トゥマニ・トゥーレ（再任）, title: 大統領, from: 2002, to: 2012, note: 2012年3月のクーデタで追われた。, source: "https://en.wikipedia.org/wiki/Amadou_Toumani_Touré"}
    - {name: アマドゥ・サノゴ, title: 軍事政権の首班, from: 2012, to: 2012, source: "https://en.wikipedia.org/wiki/Amadou_Sanogo"}
    - {name: ディオンクンダ・トラオレ, title: 暫定大統領, from: 2012, to: 2013, source: "https://en.wikipedia.org/wiki/Dioncounda_Traoré"}
    - {name: イブラヒム・ブバカール・ケイタ, title: 大統領, from: 2013, to: 2020, note: 2020年8月のクーデタで追われた。, source: "https://en.wikipedia.org/wiki/Ibrahim_Boubacar_Keïta"}
    - {name: バ・ンダウ, title: 暫定大統領, from: 2020, to: 2021, source: "https://en.wikipedia.org/wiki/Bah_N%27daw"}
    - {name: アシミ・ゴイタ, title: 軍事政権の首班→暫定大統領（2021年〜）, from: 2020, note: 2020年・2021年のクーデタを指導した。, source: "https://en.wikipedia.org/wiki/Assimi_Go%C3%AFta"}
  periods:
    - from: 1960
      to: 2011
      text: 1960年、フランス領スーダンが独立した（セネガルとのマリ連邦が同年に分かれた）。北部のサハラではトゥアレグの反乱がくり返された。
    - from: 2012
      to: 2025
      text: 2012年、北部でトゥアレグの民族運動とイスラーム武装勢力が蜂起して「アザワド」の独立を宣言し、首都ではクーデタが起きた。2013年のフランスの軍事介入（セルヴァル作戦）で北部の都市は取り戻されたが、武装勢力との戦いは続き、2020・2021年のクーデタの後の軍事政権はフランス軍を撤退させてロシアと結んだ。
  note: 地図の範囲には北部のサハラ（トンブクトゥ州の北部）だけが入る。
  source: "https://ja.wikipedia.org/wiki/マリ共和国"

- id: azawad
  name: アザワド（北部マリの反政府勢力の支配地）
  short: アザワド
  color: "#d4c2a4"
  kind: 反政府勢力の支配地域
  periods:
    - from: 2012
      to: 2012
      text: 2012年4月、トゥアレグのアザワド解放民族運動（MNLA）がマリ北部の独立を宣言したが、まもなくアンサール・ディーンやイスラーム・マグリブのアル＝カーイダなどのイスラーム武装勢力が主導権を握り、トンブクトゥなどの都市を支配した。2013年1月、フランス軍の介入で都市を追われた。
  source: "https://en.wikipedia.org/wiki/Azawad"
