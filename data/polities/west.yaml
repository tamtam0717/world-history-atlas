    - {name: アブドゥッラフマーン, title: アラウィー朝スルタン, from: 1822, to: 1859, note: アルジェリアのアブド＝アルカーディルを支援してフランスと戦い、1844年のイスリーの戦いで敗れた。, source: "https://en.wikipedia.org/wiki/Abd_al-Rahman_of_Morocco"}
    - {name: ムハンマド4世, title: アラウィー朝スルタン, from: 1859, to: 1873, note: 即位直後にスペインとの戦争（1859–60）に敗れた。, source: "https://en.wikipedia.org/wiki/Mohammed_IV_of_Morocco"}
    - {name: ハサン1世, title: アラウィー朝スルタン, from: 1873, to: 1894, note: 軍の近代化と遠征で国内の統一を保ち、列強の干渉をおさえた。, source: "https://en.wikipedia.org/wiki/Hassan_I_of_Morocco"}
    - {name: アブドゥルアズィーズ, title: アラウィー朝スルタン, from: 1894, to: 1908, note: 少年で即位し、1900年まで宰相バー・アフマドが実権を握った。兄アブドゥルハフィーズに廃された。, source: "https://en.wikipedia.org/wiki/Abdelaziz_of_Morocco"}
