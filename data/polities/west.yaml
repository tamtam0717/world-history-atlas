      to: 1690
      note: 皇帝軍の将軍として第二次ウィーン包囲の救援やハンガリー奪回で活躍した。
      source: "ja.wikipedia: シャルル5世 (ロレーヌ公)"
    - name: レオポール
      title: ロレーヌ公
      from: 1690
      to: 1729
      note: 1697年のライスワイク条約で公国を回復（1698年に帰国）。
      source: "ja.wikipedia: レオポール (ロレーヌ公)"
    - name: フランソワ3世
      title: ロレーヌ公
      from: 1729
      to: 1737
      note: マリア・テレジアと結婚し、ロレーヌと引きかえにトスカーナ大公となった。のちの皇帝フランツ1世。
      source: "ja.wikipedia: フランツ1世 (神聖ローマ皇帝)"
    - name: スタニスワフ・レシチニスキ
      title: ロレーヌ公（前ポーランド王）
      from: 1737
      to: 1766
      note: ルイ15世の義父。統治の実権はフランスが送った官吏が握り、その死とともにロレーヌはフランスに併合された。
      source: "ja.wikipedia: スタニスワフ・レシチニスキ"
  periods:
    - from: 1648
      to: 1697
      text: 神聖ローマ帝国の西端にある公国。フランスとハプスブルク家のはざまにあり、公国は長くフランス軍に占領された（1633–61年、1670–97年）。
    - from: 1698
      to: 1737
      text: ライスワイク条約で独立を回復し、レオポール公のもとで復興する。
    - from: 1737
      to: 1766
      text: ポーランド継承戦争の講和で、前ポーランド王スタニスワフに一代限りで与えられた。実質はフランスの管理下にあり、その死後フランスに併合された。
  source: "ja.wikipedia: ロレーヌ公国"

