  periods:
    - from: 1648
      to: 1660
      text: ピューリタン革命。1649年にチャールズ1世を処刑して共和政となり、クロムウェルがアイルランドとスコットランドを征服、1653年から護国卿として独裁した。
    - from: 1660
      to: 1688
      text: 王政復古。チャールズ2世・ジェームズ2世のカトリック寄りの政治に議会が反発し、トーリ・ホイッグの二党が生まれた。
    - from: 1689
      to: 1714
      text: 名誉革命で立憲王政が確立。ルイ14世のフランスと戦い（ファルツ戦争・スペイン継承戦争）、1707年にスコットランドと合同してグレートブリテン王国となった。
    - from: 1714
      to: 1760
      text: ハノーヴァー朝のもとで、ウォルポール内閣以来の責任内閣制（議院内閣制）が発達。ジャコバイトの反乱（1715年、1745年）を鎮めた。
    - from: 1760
      to: 1815
      text: 七年戦争で植民地帝国の優位を確立する一方、アメリカ独立戦争で13植民地を失う。産業革命が進む。対仏大同盟の中心としてフランス革命・ナポレオンと戦い、1801年にアイルランドを合同した。
    - from: 1816
      to: 1846
      text: 自由主義的な改革の時代。審査法廃止（1828）とカトリック教徒解放法（1829）、第1回選挙法改正（1832）、奴隷制廃止（1833）、工場法が続いた。労働者は人民憲章を掲げてチャーティスト運動を起こした。1846年に穀物法を廃止し、自由貿易に転じた。
    - from: 1847
      to: 1873
      text: ヴィクトリア時代の繁栄。「世界の工場」として自由貿易を進め、ロンドン万国博覧会（1851）を開いた。アイルランドではジャガイモ飢饉（1845–49）で多くの死者と移民が出た。グラッドストン（自由党）とディズレーリ（保守党）の二大政党制のもとで、第2回選挙法改正（1867）が行われた。
    - from: 1874
      to: 1900
      text: 帝国主義の時代。スエズ運河会社の株を買い（1875）、インド帝国を成立させ（1877）、エジプトを占領した（1882）。アイルランド自治法案は2度否決され、保守党と自由党統一派が帝国の拡大を進めた。南アフリカ戦争（1899–1902）を戦う。
    - from: 1901
      to: 1914
      text: 「光栄ある孤立」を捨て、日英同盟（1902）・英仏協商（1904）・英露協商（1907）を結んでドイツに対抗した。自由党政府が社会保障を整え、議会法（1911）で下院の優越を定めた。1914年、アイルランド自治法が成立したが、第一次世界大戦への参戦で実施は延期された。
  source: "ja.wikipedia: イングランド王国"

- id: scotland
  name: スコットランド王国
  short: スコットランド
  color: "#c7b5e3"
  kind: 王国
  rulers:
    - {name: チャールズ1世, title: スコットランド王, from: 1625, to: 1649, source: "ja.wikipedia: チャールズ1世 (イングランド王)"}
    - {name: チャールズ2世, title: スコットランド王, from: 1649, to: 1651, note: 1649年にスコットランドで王と宣言され1651年に戴冠したが、クロムウェルに敗れて亡命。, source: "ja.wikipedia: チャールズ2世 (イングランド王)"}
    - {name: チャールズ2世（王政復古）, title: スコットランド王, from: 1660, to: 1685, source: "ja.wikipedia: チャールズ2世 (イングランド王)"}
    - {name: ジェームズ7世（イングランド王ジェームズ2世）, title: スコットランド王, from: 1685, to: 1688, source: "ja.wikipedia: ジェームズ2世 (イングランド王)"}
    - {name: ウィリアム2世（イングランド王ウィリアム3世）, title: スコットランド王, from: 1689, to: 1702, source: "ja.wikipedia: ウィリアム3世 (イングランド王)"}
    - {name: メアリ2世, title: スコットランド女王, from: 1689, to: 1694, source: "ja.wikipedia: メアリー2世 (イングランド女王)"}
    - {name: アン, title: スコットランド女王, from: 1702, to: 1707, source: "ja.wikipedia: アン (イギリス女王)"}
  periods:
    - from: 1648
      to: 1651
      text: イングランドと同じ王を持つ別の王国（同君連合）。チャールズ1世の処刑後、その子チャールズ2世を王に立ててイングランド共和国と戦った。
    - from: 1652
      to: 1659
      text: クロムウェルに征服され、イングランド共和国に統合された。
    - from: 1660
      to: 1706
      text: 王政復古で王国が復活。名誉革命後、長老派教会が国教となる。1707年の合同法でイングランドと合同した。
  source: "ja.wikipedia: スコットランド王国"

- id: ireland
  name: アイルランド王国
  short: アイルランド
  color: "#b9dfa8"
  kind: 王国
  rulers:
    - {name: チャールズ1世, title: アイルランド王, from: 1625, to: 1649, source: "ja.wikipedia: チャールズ1世 (イングランド王)"}
    - {name: チャールズ2世, title: アイルランド王, from: 1660, to: 1685, source: "ja.wikipedia: チャールズ2世 (イングランド王)"}
    - {name: ジェームズ2世, title: アイルランド王, from: 1685, to: 1690, note: 名誉革命後もアイルランドに拠って戦ったが、1690年のボイン川の戦いで敗れた。, source: "ja.wikipedia: ジェームズ2世 (イングランド王)"}
    - {name: ウィリアム3世, title: アイルランド王, from: 1689, to: 1702, source: "ja.wikipedia: ウィリアム3世 (イングランド王)"}
    - {name: メアリ2世, title: アイルランド女王, from: 1689, to: 1694, source: "ja.wikipedia: メアリー2世 (イングランド女王)"}
    - {name: アン, title: アイルランド女王, from: 1702, to: 1714, source: "ja.wikipedia: アン (イギリス女王)"}
    - {name: ジョージ1世, title: アイルランド王, from: 1714, to: 1727, source: "ja.wikipedia: ジョージ1世 (イギリス王)"}
    - {name: ジョージ2世, title: アイルランド王, from: 1727, to: 1760, source: "ja.wikipedia: ジョージ2世 (イギリス王)"}
    - {name: ジョージ3世, title: アイルランド王, from: 1760, to: 1800, source: "ja.wikipedia: ジョージ3世 (イギリス王)"}
  periods:
    - from: 1648
      to: 1651
      text: カトリック同盟（キルケニー連合）が自治を行っていたが、1649年からクロムウェルの遠征軍に征服された。
    - from: 1652
      to: 1659
      text: イングランド共和国に統合され、カトリック地主の土地が大規模に没収された。
    - from: 1660
      to: 1800
      text: イングランド（イギリス）王を君主とする別の王国だが、実際にはイギリスに従属し、プロテスタント地主が支配した。1798年の反乱の後、1801年にイギリスに合同された。
  source: "ja.wikipedia: アイルランド王国"

# ---------------------------------------------------------------- 北アフリカ
- id: morocco
  name: モロッコ
  names:
    - {to: 1667, name: モロッコ（サアド朝末期・分裂期）}
    - {from: 1668, name: モロッコ（アラウィー朝）}
  short: モロッコ
  color: "#e0c48e"
  kind: スルタン国
  rulers:
    - {name: ムハンマド・アッシャイフ・アッサギール, title: サアド朝スルタン（マラケシュ）, from: 1636, to: 1655, source: "ja.wikipedia: サアド朝", note: 在位年は要確認。}
    - {name: アフマド・アルアッバース, title: サアド朝スルタン（マラケシュ）, from: 1655, to: 1659, note: 暗殺され、サアド朝は断絶した。在位年は要確認。, source: "ja.wikipedia: サアド朝"}
    - {name: ムーレイ・ムハンマド, title: アラウィー家の首長（タフィラルト）, from: 1636, to: 1664, source: "ja.wikipedia: アラウィー朝", note: 要確認。}
    - {name: ムーレイ・ラシード, title: アラウィー朝スルタン, from: 1664, to: 1672, note: 1666年にフェズ、1668年ごろマラケシュを取ってモロッコを統一した。, source: "ja.wikipedia: アラウィー朝"}
    - {name: ムーレイ・イスマーイール, title: アラウィー朝スルタン, from: 1672, to: 1727, note: 黒人奴隷兵の常備軍を組織し、メクネスに首都を置いた。, source: "ja.wikipedia: ムーレイ・イスマーイール"}
    - {name: アフマド・アッザハビー, title: アラウィー朝スルタン, from: 1727, to: 1729, note: 1728年に一時アブドゥルマリクに位を奪われた。, source: "ja.wikipedia: アラウィー朝"}
    - {name: アブドゥッラー, title: アラウィー朝スルタン, from: 1729, to: 1757, note: 黒人奴隷兵の擁立・廃位により何度も退位と復位をくり返した（その間、兄弟のアリー、ムハンマド2世、ムスタディーらが一時即位）。要確認。, source: "ja.wikipedia: アラウィー朝"}
    - {name: ムハンマド3世（シーディー・ムハンマド）, title: アラウィー朝スルタン, from: 1757, to: 1790, note: 1769年にポルトガルからマザガンを奪回。1777年にアメリカ合衆国を承認した最初期の国となった。, source: "ja.wikipedia: ムハンマド3世 (モロッコ)"}
    - {name: ヤズィード, title: アラウィー朝スルタン, from: 1790, to: 1792, source: "ja.wikipedia: アラウィー朝"}
    - {name: スライマーン, title: アラウィー朝スルタン, from: 1792, to: 1822, source: "ja.wikipedia: アラウィー朝"}
  periods:
    - from: 1648
      to: 1667
      text: サアド朝が衰え、国内は分裂。北部・中部はディラーのザーウィヤ（宗教団体）、南東のタフィラルトはアラウィー家が支配した。
    - from: 1668
      to: 1727
      text: アラウィー朝がモロッコを統一。ムーレイ・イスマーイールの長い治世のもと、タンジールなどヨーロッパ人の拠点を次々に奪回した。オスマン帝国には属さない独立国。
    - from: 1728
      to: 1757
      text: 奴隷兵の軍団が君主を擁立・廃位し、内乱が続いた。
    - from: 1757
      to: 1815
      text: ムハンマド3世が国を立て直し、ヨーロッパ諸国と通商条約を結んだ。
  source: "ja.wikipedia: モロッコの歴史"

- id: algiers
  name: アルジェ（アルジェリア）
  short: アルジェ
  color: "#cfdc9a"
  kind: 太守領（オスマン帝国の摂政領）
  rulers:
