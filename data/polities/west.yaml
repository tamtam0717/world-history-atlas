  periods:
    - from: 1648
      to: 1660
      text: ピューリタン革命。1649年にチャールズ1世を処刑して共和政となり、クロムウェルがアイルランドとスコットランドを征服、1653年から護国卿として独裁した。
    - from: 1660
      to: 1688
      text: 王政復古。チャールズ2世・ジェームズ2世のカトリック寄りの政治に議会が反発し、トーリ・ホイッグの二党が生まれた。
    - from: 1689
      to: 1714
      text: 名誉革命で立憲王政が確立。ルイ14世のフランスと戦い（ファルツ戦争・スペイン継承戦争）、1707年にスコットランドと合同してグレートブリテン王国となった。
    - from: 1714
      to: 1760
      text: ハノーヴァー朝のもとで、ウォルポール内閣以来の責任内閣制（議院内閣制）が発達。ジャコバイトの反乱（1715年、1745年）を鎮めた。
    - from: 1760
      to: 1815
      text: 七年戦争で植民地帝国の優位を確立する一方、アメリカ独立戦争で13植民地を失う。産業革命が進む。対仏大同盟の中心としてフランス革命・ナポレオンと戦い、1801年にアイルランドを合同した。
    - from: 1816
      to: 1846
      text: 自由主義的な改革の時代。審査法廃止（1828）とカトリック教徒解放法（1829）、第1回選挙法改正（1832）、奴隷制廃止（1833）、工場法が続いた。労働者は人民憲章を掲げてチャーティスト運動を起こした。1846年に穀物法を廃止し、自由貿易に転じた。
    - from: 1847
      to: 1873
      text: ヴィクトリア時代の繁栄。「世界の工場」として自由貿易を進め、ロンドン万国博覧会（1851）を開いた。アイルランドではジャガイモ飢饉（1845–49）で多くの死者と移民が出た。グラッドストン（自由党）とディズレーリ（保守党）の二大政党制のもとで、第2回選挙法改正（1867）が行われた。
    - from: 1874
      to: 1900
      text: 帝国主義の時代。スエズ運河会社の株を買い（1875）、インド帝国を成立させ（1877）、エジプトを占領した（1882）。アイルランド自治法案は2度否決され、保守党と自由党統一派が帝国の拡大を進めた。南アフリカ戦争（1899–1902）を戦う。
    - from: 1901
      to: 1914
      text: 「光栄ある孤立」を捨て、日英同盟（1902）・英仏協商（1904）・英露協商（1907）を結んでドイツに対抗した。自由党政府が社会保障を整え、議会法（1911）で下院の優越を定めた。1914年、アイルランド自治法が成立したが、第一次世界大戦への参戦で実施は延期された。
    - from: 1914
      to: 1922
      text: 第一次世界大戦を総力戦で戦い、戦後は女性にも選挙権を与えた（1918）。アラブとユダヤ人に矛盾する約束をし（フサイン＝マクマホン協定・バルフォア宣言）、戦後はパレスチナ・イラクなどを委任統治領とした。アイルランド独立戦争の結果、1922年にアイルランド自由国が分かれ、北アイルランドだけが連合王国に残った。
    - from: 1923
      to: 1938
      text: 労働党が初めて政権をとり（1924）、ゼネスト（1926）が起きた。ウェストミンスター憲章（1931）で自治領が本国と対等になり、イギリス連邦が成立した。世界恐慌にはブロック経済（オタワ会議、1932）で対応し、ナチス・ドイツには宥和政策をとった。
    - from: 1939
      to: 1945
      text: 第二次世界大戦。1940年にフランスが降伏した後もチャーチルのもとで戦い続け、バトル・オブ・ブリテンでドイツの上陸を防いだ。アメリカ・ソ連とともに連合国の中心となった。
    - from: 1945
      to: 1972
      text: アトリーの労働党政府が「ゆりかごから墓場まで」の福祉国家をつくった。インド（1947）・アフリカ諸国などの独立で植民地帝国は解体し、スエズ戦争（1956）の失敗で大国の地位の低下が明らかになった。
    - from: 1973
      to: 2015
      text: EC に加盟した（1973）。経済の停滞（「英国病」）の後、サッチャー政権が民営化などの改革を進め、フォークランド戦争（1982）に勝った。北アイルランド紛争は1998年のベルファスト合意で和平に向かい、スコットランド・ウェールズに議会が置かれた（1999）。
    - from: 2016
      to: 2025
      text: 2016年の国民投票でEU離脱が決まり、2020年1月に離脱した（ブレグジット）。スコットランドでは独立を求める声が続いている。
  note: 立憲君主制で政治の実権は首相にあるため、1908年以降は国王と首相の両方を挙げる。
  source: "ja.wikipedia: イングランド王国"

