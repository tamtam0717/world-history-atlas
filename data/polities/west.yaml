    - {name: ジュール・グレヴィ, title: 大統領, from: 1879, to: 1887, note: 娘婿の勲章売買事件で辞任した。, source: "ja.wikipedia: ジュール・グレヴィ"}
    - {name: サディ・カルノー, title: 大統領, from: 1887, to: 1894, note: 1894年、リヨンでアナーキストに暗殺された。, source: "ja.wikipedia: サディ・カルノー"}
    - {name: ジャン・カジミール＝ペリエ, title: 大統領, from: 1894, to: 1895, source: "ja.wikipedia: ジャン・カジミール＝ペリエ"}
    - {name: フェリックス・フォール, title: 大統領, from: 1895, to: 1899, source: "ja.wikipedia: フェリックス・フォール"}
    - {name: エミール・ルーベ, title: 大統領, from: 1899, to: 1906, source: "ja.wikipedia: エミール・ルーベ"}
    - {name: アルマン・ファリエール, title: 大統領, from: 1906, to: 1913, source: "ja.wikipedia: アルマン・ファリエール"}
    - {name: レイモン・ポアンカレ, title: 大統領, from: 1913, to: 1920, source: "ja.wikipedia: レイモン・ポアンカレ"}
  periods:
    - from: 1648
      to: 1660
      text: 幼いルイ14世のもと、宰相マザランが政治を行う。貴族と高等法院がフロンドの乱（1648–53）を起こすが鎮圧され、王権が強まる。スペインとの戦争は1659年のピレネー条約まで続く。
    - from: 1661
      to: 1715
      text: ルイ14世の親政。「朕は国家なり」と言われる絶対王政の最盛期で、コルベールの重商主義政策とヴェルサイユ宮殿の造営が進む。自然国境（ライン・アルプス・ピレネー）をめざす侵略戦争をくり返し、北東部の国境を押し広げた。
    - from: 1715
      to: 1788
      text: ルイ15世・16世の時代。ポーランド継承戦争の結果ロレーヌ獲得が決まる（1766年に併合）。七年戦争でカナダやインドの植民地を失い、アメリカ独立戦争への参戦も重なって財政が悪化する。啓蒙思想が広まる。
    - from: 1789
      to: 1799
      text: フランス革命。1792年に王政が廃止されて第一共和政となり、ジャコバン派の恐怖政治、総裁政府と続く。革命戦争でサヴォイア・ニース・南ネーデルラント・ライン左岸を併合した。
    - from: 1799
      to: 1814
      text: ナポレオンの統領政府と第一帝政。ナポレオン法典を制定し、大陸の大半を支配下や同盟下に置くが、1812年のロシア遠征の失敗から崩れる。
    - from: 1814
      to: 1815
      text: ブルボン朝の復古。ナポレオンの百日天下をはさみ、ルイ18世が王位に戻る。第1次パリ条約（1814年5月）で国境はおおむね1792年の状態に戻されたが、百日天下の後の第2次パリ条約（1815年11月）では、ザールルイ・ランダウ・フィリップヴィル・マリアンブール・サヴォワの残りを失い、おおむね1790年の国境まで縮小された。
    - from: 1816
      to: 1829
      text: 復古王政。ルイ18世は憲章（シャルト）にもとづく制限選挙の立憲王政をとったが、弟シャルル10世は亡命貴族への賠償など反動的な政治を進めた。1830年にアルジェリアに出兵する。
    - from: 1830
      to: 1847
      text: 七月革命で成立した七月王政。「フランス人の王」ルイ＝フィリップのもとで、銀行家など大ブルジョワが政治を握った（ギゾー内閣）。産業革命が進むが、選挙権の拡大を求める運動は抑えられた。アルジェリアの征服を続ける。
    - from: 1848
      to: 1851
      text: 二月革命で第二共和政が成立し、男性普通選挙が実現した。六月蜂起で労働者が鎮圧され、12月の大統領選挙でルイ＝ナポレオンが当選。1851年12月のクーデタで独裁権を握った。
    - from: 1852
      to: 1870
      text: ナポレオン3世の第二帝政。パリの大改造と鉄道建設で経済が成長した。クリミア戦争・イタリア統一戦争に勝ってニース・サヴォワを得たが、メキシコ出兵に失敗し、普仏戦争のセダンで皇帝が捕らえられて帝政は倒れた。
    - from: 1871
      to: 1899
      text: 第三共和政。アルザス＝ロレーヌをドイツに奪われ、パリ＝コミューンを鎮圧した。1875年の憲法で共和政が固まり、ブーランジェ事件・ドレフュス事件で揺れながらも、チュニジア・インドシナ・西アフリカなどに植民地帝国を広げた。ロシアと同盟した（1894）。
    - from: 1900
      to: 1914
      text: 共和派の政府が政教分離法（1905）で教会と国家を分けた。イギリスと協商を結び（1904）、ドイツと争いながらモロッコを保護国にした（1912）。1914年8月、第一次世界大戦に参戦する。
  source: "ja.wikipedia: フランス王国"

- id: lorraine
  name: ロレーヌ公国
  short: ロレーヌ
  color: "#b8d8a8"
