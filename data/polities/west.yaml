    - from: 1710
      to: 1815
      text: デイがパシャを兼ねて、オスマン帝国からほぼ独立した。地中海の私掠と、ヨーロッパ諸国からの貢納金が財源。1708年に奪ったオランをスペインに奪い返されたが（1732年）、1792年に回復した。
    - from: 1816
      to: 1830
      text: 1816年に英蘭艦隊の砲撃を受けて私掠の力が衰えた。1830年、フランス軍がアルジェを占領してデイの政権は滅びた。
