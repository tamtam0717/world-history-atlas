    - {name: フランシスコ・フランコ, title: 総統（国家元首・軍の総司令官）, from: 1936, to: 1939, note: 1936年10月に元首となった。1937年にファランヘ党とカルリスタを統合した唯一の政党をつくった。, source: "https://en.wikipedia.org/wiki/Francisco_Franco"}
  periods:
    - from: 1936
      to: 1939
      text: 1936年7月、人民戦線政府に対し、モロッコ駐留軍を率いるフランコ将軍らが反乱を起こした。ブルゴスを拠点に、ドイツ（コンドル軍団）・イタリアの支援を受けて支配地を広げ、1937年に北部、1938年にアラゴンを押さえて共和国側の地域を二つに分け、1939年にカタルーニャとマドリードを落として勝利した。
  note: 地図では1936–38年の反乱軍の支配地を、各年の年末の前線で描く。勝利後（1939年〜）はスペイン（spain）の色に戻す。
