  periods:
    - from: 1776
      to: 1788
      text: イギリスの13植民地が独立を宣言し（1776年）、フランスの支援を得て独立戦争に勝った（パリ条約、1783年）。連合規約のもとの中央政府は弱く、1787年に合衆国憲法が作られた。
    - from: 1789
      to: 1828
      text: ワシントンを初代大統領として連邦政府が発足した。ルイジアナ購入（1803年）で領土を倍にし、米英戦争（1812–14年）の後は国民意識が高まった。モンロー宣言（1823年）でヨーロッパとの相互不干渉を唱えた。
    - from: 1829
      to: 1860
      text: ジャクソン大統領のもとで白人男性の民主政治が広がる一方、先住民は強制移住させられた（涙の道）。「明白な天命（マニフェスト・デスティニー）」を掲げてテキサス併合・オレゴン条約・アメリカ＝メキシコ戦争で太平洋岸に達した。奴隷制の拡大をめぐって南北の対立が深まった。
    - from: 1861
      to: 1877
      text: 南部11州が脱退してアメリカ連合国を作り、南北戦争（1861–65年）が起きた。北部が勝って奴隷制は廃止された（憲法修正第13条）。戦後の再建（リコンストラクション）で南部は連邦軍の占領下に置かれた。
    - from: 1878
      to: 1913
      text: 大陸横断鉄道（1869年）とともに西部の開拓が進み、1890年にフロンティアの消滅が宣言された。工業が急成長して世界一の工業国となり、移民が大量に来た。米西戦争（1898年）でフィリピン・プエルトリコ・グアムを得てハワイを併合し、カリブ海・太平洋に進出した。
    - from: 1914
      to: 1918
      text: 第一次世界大戦の初めは中立を保ったが（パナマ運河の開通は1914年）、ドイツの無制限潜水艦作戦をきっかけに連合国側で参戦し（1917年4月）、戦争の勝敗を決めた。
    - from: 1919
      to: 1940
      text: 上院がヴェルサイユ条約を批准せず、国際連盟に加わらなかった。1920年代の繁栄（大量生産・大衆消費）の後、1929年の株価の大暴落から世界恐慌が始まり、フランクリン・ローズヴェルトがニューディール政策を進めた。
    - from: 1941
      to: 1945
      text: 第二次世界大戦に参戦し（1941年12月）、ヨーロッパではイギリスとともに北アフリカ・イタリア・フランスに上陸してドイツを破った。
    - from: 1945
      to: 1990
      text: 戦後はドイツ南部・オーストリアの一部・ベルリンの西部を占領した。冷戦ではマーシャル・プラン（1947）・NATO（1949）で西ヨーロッパを支え、ソ連と対立した。
    - from: 1954
      to: 1975
      text: 国内では黒人差別の撤廃を求める公民権運動が広がり（キング牧師、1964年の公民権法）、対外的にはキューバ危機（1962年）・ベトナム戦争（1965–73年）があった。ドル危機（1971年）で戦後の金・ドル本位制が終わった。
    - from: 1991
      to: 2025
      text: 冷戦後は唯一の超大国として NATO の東方拡大を進めた。2022年からはロシアの侵攻を受けたウクライナを支援した。
  note: 本土・ハワイの領域は data/regions/usa.yaml（A1）。ヨーロッパの地図では、占領地区（1945–49年のドイツ南部、1945–55年のオーストリア西部など）とアイスランドの駐留（1941–44年）にも使う。準州は label に準州名を付けた。元首は大統領（1776–89年の連合会議の議長は省略）。
  source: "https://ja.wikipedia.org/wiki/アメリカ合衆国大統領の一覧"

