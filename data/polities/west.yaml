    - {name: ミホル・マーティン, title: 首相, from: 2020, to: 2022, source: "https://en.wikipedia.org/wiki/Micheál_Martin"}
    - {name: レオ・ヴァラッカー（再任）, title: 首相, from: 2022, to: 2024, source: "https://en.wikipedia.org/wiki/Leo_Varadkar"}
    - {name: サイモン・ハリス, title: 首相, from: 2024, to: 2025, source: "https://en.wikipedia.org/wiki/Simon_Harris"}
    - {name: ミホル・マーティン（再任）, title: 首相, from: 2025, source: "https://en.wikipedia.org/wiki/Micheál_Martin"}
  periods:
    - from: 1648
      to: 1651
      text: カトリック同盟（キルケニー連合）が自治を行っていたが、1649年からクロムウェルの遠征軍に征服された。
    - from: 1652
      to: 1659
      text: イングランド共和国に統合され、カトリック地主の土地が大規模に没収された。
    - from: 1660
      to: 1800
      text: イングランド（イギリス）王を君主とする別の王国だが、実際にはイギリスに従属し、プロテスタント地主が支配した。1798年の反乱の後、1801年にイギリスに合同された。
    - from: 1922
      to: 1936
      text: 1921年の英愛条約で、北アイルランドを除く26州がイギリス連邦の自治領「アイルランド自由国」となった。条約に反対する共和派との内戦（1922–23）は条約派が勝った。
    - from: 1937
      to: 1972
      text: デ・ヴァレラの新憲法（1937）で国名をエールとし、第二次世界大戦では中立を守った。1949年に共和国となってイギリス連邦を離れた。農業中心の経済で、移民の流出が続いた。
    - from: 1973
      to: 2007
      text: イギリスと同時にEC に加盟した（1973）。1990年代には外国企業の誘致で急成長し「ケルトの虎」と呼ばれた。1998年のベルファスト合意で、北アイルランドの領有を求める憲法の条項を改めた。
    - from: 2008
      to: 2025
      text: 2008年の金融危機で銀行が破綻し、EU・IMFの支援を受けた。その後は経済が回復した。2015年に同性婚、2018年に中絶を国民投票で認めた。イギリスのEU離脱では、北アイルランドとの国境の扱いが大きな問題になった。
  note: 1922年以降は首相（行政評議会議長、1937年からは首相 Taoiseach）を挙げる。元首は1936年まではイギリス王、1938年からは大統領（名目的）。
  source: "ja.wikipedia: アイルランド王国"

