  periods:
    - from: 1648
      to: 1660
      text: 幼いルイ14世のもと、宰相マザランが政治を行う。貴族と高等法院がフロンドの乱（1648–53）を起こすが鎮圧され、王権が強まる。スペインとの戦争は1659年のピレネー条約まで続く。
    - from: 1661
      to: 1715
      text: ルイ14世の親政。「朕は国家なり」と言われる絶対王政の最盛期で、コルベールの重商主義政策とヴェルサイユ宮殿の造営が進む。自然国境（ライン・アルプス・ピレネー）をめざす侵略戦争をくり返し、北東部の国境を押し広げた。
    - from: 1715
      to: 1788
      text: ルイ15世・16世の時代。ポーランド継承戦争の結果ロレーヌ獲得が決まる（1766年に併合）。七年戦争でカナダやインドの植民地を失い、アメリカ独立戦争への参戦も重なって財政が悪化する。啓蒙思想が広まる。
    - from: 1789
      to: 1799
      text: フランス革命。1792年に王政が廃止されて第一共和政となり、ジャコバン派の恐怖政治、総裁政府と続く。革命戦争でサヴォイア・ニース・南ネーデルラント・ライン左岸を併合した。
    - from: 1799
      to: 1814
      text: ナポレオンの統領政府と第一帝政。ナポレオン法典を制定し、大陸の大半を支配下や同盟下に置くが、1812年のロシア遠征の失敗から崩れる。
    - from: 1814
      to: 1815
      text: ブルボン朝の復古。ナポレオンの百日天下をはさみ、ルイ18世が王位に戻る。第1次パリ条約（1814年5月）で国境はおおむね1792年の状態に戻されたが、百日天下の後の第2次パリ条約（1815年11月）では、ザールルイ・ランダウ・フィリップヴィル・マリアンブール・サヴォワの残りを失い、おおむね1790年の国境まで縮小された。
    - from: 1816
      to: 1829
      text: 復古王政。ルイ18世は憲章（シャルト）にもとづく制限選挙の立憲王政をとったが、弟シャルル10世は亡命貴族への賠償など反動的な政治を進めた。1830年にアルジェリアに出兵する。
    - from: 1830
      to: 1847
      text: 七月革命で成立した七月王政。「フランス人の王」ルイ＝フィリップのもとで、銀行家など大ブルジョワが政治を握った（ギゾー内閣）。産業革命が進むが、選挙権の拡大を求める運動は抑えられた。アルジェリアの征服を続ける。
    - from: 1848
      to: 1851
      text: 二月革命で第二共和政が成立し、男性普通選挙が実現した。六月蜂起で労働者が鎮圧され、12月の大統領選挙でルイ＝ナポレオンが当選。1851年12月のクーデタで独裁権を握った。
    - from: 1852
      to: 1870
      text: ナポレオン3世の第二帝政。パリの大改造と鉄道建設で経済が成長した。クリミア戦争・イタリア統一戦争に勝ってニース・サヴォワを得たが、メキシコ出兵に失敗し、普仏戦争のセダンで皇帝が捕らえられて帝政は倒れた。
    - from: 1871
      to: 1899
      text: 第三共和政。アルザス＝ロレーヌをドイツに奪われ、パリ＝コミューンを鎮圧した。1875年の憲法で共和政が固まり、ブーランジェ事件・ドレフュス事件で揺れながらも、チュニジア・インドシナ・西アフリカなどに植民地帝国を広げた。ロシアと同盟した（1894）。
    - from: 1900
      to: 1914
      text: 共和派の政府が政教分離法（1905）で教会と国家を分けた。イギリスと協商を結び（1904）、ドイツと争いながらモロッコを保護国にした（1912）。1914年8月、第一次世界大戦に参戦する。
    - from: 1914
      to: 1918
      text: 第一次世界大戦。マルヌの戦い（1914）でパリを守ったが、北東部の工業地帯を4年間ドイツ軍に占領され、ヴェルダン・ソンムの戦い（1916）など塹壕戦で約140万人の兵士が死んだ。1918年11月の休戦でアルザス＝ロレーヌを取り戻した。
    - from: 1919
      to: 1939
      text: ヴェルサイユ条約でドイツに厳しい賠償を課し、ルール占領（1923–25）も行ったが、ロカルノ条約（1925）以後は協調に転じた。世界恐慌と右翼の騒乱（1934年2月）の中で、人民戦線内閣（ブルム、1936）が成立した。ミュンヘン会談（1938）ではドイツに譲歩した。
    - from: 1940
      to: 1944
      text: 1940年6月にドイツに降伏し、北部・西部はドイツの占領地域、南部はペタンのヴィシー政府の地域に分けられ、アルザス・ロレーヌはドイツに事実上併合された。ド・ゴールはロンドンで自由フランスを率いて抗戦を続け、国内ではレジスタンスが戦った。1942年11月にドイツ軍が全土を占領した。ユダヤ人約7万6千人が絶滅収容所などに送られた。1944年8月にパリが解放された。
    - from: 1945
      to: 1957
      text: 女性参政権を実現し、第四共和政（1946）が成立した。マーシャル・プランで復興し、ヨーロッパ石炭鉄鋼共同体（1952）・ヨーロッパ経済共同体（1958）の結成を主導した。インドシナ戦争（1946–54）に敗れ、アルジェリア戦争（1954–62）が始まると政権が不安定になった。
    - from: 1958
      to: 1969
      text: アルジェリア危機の中でド・ゴールが復帰し、大統領の権限の強い第五共和政を始めた。1962年にアルジェリアの独立を認め、核武装・NATO軍事機構からの脱退（1966）など独自の外交を進めた。1968年の五月危機（五月革命）で学生と労働者が抗議した。
    - from: 1969
      to: 2025
      text: ポンピドゥー以後の大統領のもとで、ヨーロッパ統合の中心となる。ミッテランの社会党政権（1981–95）、ドイツとともにマーストリヒト条約（1992）とユーロ（1999・2002）を推進した。2010年代以降は移民・テロ・格差をめぐって社会が分極化した。
  note: 第三共和政・第四共和政では大統領の権限は弱く、政治の実権は首相（閣僚評議会議長）にあったが、首相は頻繁に交代したため、ここでは大統領を挙げる（主な首相：クレマンソー 1906–09・1917–20、ポアンカレ 1912–13・1922–24・1926–29、ブルム 1936–37、ダラディエ 1938–40、マンデス＝フランス 1954–55）。第五共和政では大統領が実権を持つ。1940–44年のフランス本土の大半はヴィシー政府（vichy_france）とドイツ・イタリアの占領地として描き、この政体は自由フランス（とその支配した植民地）を表す。
  source: "ja.wikipedia: フランス王国"

