  periods:
    - from: 1648
      to: 1668
      text: 1640年にスペインから再独立し、ブラガンサ朝のもとで独立戦争を続ける。1668年のリスボン条約でスペインが独立を承認した。
    - from: 1669
      to: 1755
      text: イギリスとの同盟を軸にする（1703年メシュエン条約）。ブラジルの金がジョアン5世の豪華な宮廷を支えた。
    - from: 1755
      to: 1777
      text: リスボン大地震の後、宰相ポンバル侯が首都を再建し、イエズス会の追放など啓蒙改革を進めた。
    - from: 1778
      to: 1806
      text: マリア1世の即位でポンバル侯が失脚し、貴族と教会の力が戻った。女王が精神を病むと王子ジョアンが政治を代行した。イギリスとの同盟を守ったため、1801年にはスペインに攻め込まれ（オレンジ戦争）、オリベンサを失った。
    - from: 1807
      to: 1815
      text: ナポレオン軍の侵入を受け、王室はブラジルに移る。イギリス軍（ウェリントン）とともにフランス軍を撃退した（半島戦争）。
    - from: 1816
      to: 1834
      text: 王がブラジルにとどまる間に、1820年の自由主義革命で憲法が作られた。1822年にブラジルが独立。王の死後、自由主義派（マリア2世）と絶対王政派（ミゲル1世）が争う内戦（自由主義戦争、1828–34）となった。
    - from: 1834
      to: 1889
      text: 立憲王政が定着し、1851年からの「再生（レジェネラサン）」期に鉄道や道路が整備された。アフリカ（アンゴラ・モザンビーク）の植民地を広げようとした。
    - from: 1890
      to: 1910
      text: アンゴラとモザンビークを結ぶ計画（「バラ色地図」）がイギリスの最後通牒（1890）でつぶされ、王政の権威が落ちた。財政難の中で共和派が伸び、1908年に国王が暗殺された。
    - from: 1910
      to: 1914
      text: 十月革命（1910年）で王政が倒れ、共和政になった。教会と国家を分け、修道会を追放したが、政権は安定しなかった。
    - from: 1915
      to: 1925
      text: 第一次世界大戦に連合国側で参戦した（1916）。第一共和政は16年間に45の内閣が交代するほど不安定で、財政難とインフレが続いた。
    - from: 1926
      to: 1960
      text: 1926年の軍のクーデタで共和政が倒れ、蔵相から首相となったサラザールが、1933年の憲法でエスタド・ノヴォ（新国家体制）と呼ばれる独裁体制を築いた。秘密警察で反対派を抑え、スペイン内戦ではフランコを支援し、第二次世界大戦では中立を守った。NATOの原加盟国（1949）。
    - from: 1961
      to: 1973
      text: アンゴラ・モザンビーク・ギニアビサウで独立戦争（植民地戦争）が始まり、長い戦争が国を疲れさせた。1968年にサラザールの後をカエターノが継いだ。
    - from: 1974
      to: 1985
      text: 1974年4月、若手将校の「国軍運動」がカーネーション革命で独裁を倒した。翌年までにアフリカの植民地の独立を認め、1976年の憲法で議会制民主主義となった。
    - from: 1986
      to: 2025
      text: スペインとともにECに加盟し（1986）、ユーロを導入した。1999年にマカオを中国に返して植民地帝国が終わった。2010年代初めのユーロ危機では、EU・IMFの支援を受けて緊縮財政をとった。
  note: 1932–74年は首相（サラザール・カエターノ）が独裁の実権を握ったので、大統領とあわせて挙げる。1976年以降は議会で選ばれる首相が政治の中心なので首相を挙げる（大統領はエアネス 1976–86、ソアレス 1986–96、サンパイオ 1996–2006、カヴァコ・シルヴァ 2006–16、レベロ・デ・ソウザ 2016–）。
  source: "ja.wikipedia: ブラガンサ王朝"

