    - {name: フェルナンド6世, title: スペイン王, from: 1746, to: 1759, source: "ja.wikipedia: フェルナンド6世 (スペイン王)"}
    - {name: カルロス3世, title: スペイン王, from: 1759, to: 1788, note: 啓蒙専制君主。それまでナポリ・シチリア王。, source: "ja.wikipedia: カルロス3世 (スペイン王)"}
    - {name: カルロス4世, title: スペイン王, from: 1788, to: 1808, note: 寵臣ゴドイが実権を握った。, source: "ja.wikipedia: カルロス4世 (スペイン王)"}
