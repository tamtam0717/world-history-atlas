- id: andorra
  name: アンドラ
  color: "#d7a9cc"
  kind: 共同公国
  note: フランス王（もとフォワ伯の権利を継承）とスペインのウルジェル司教が共同の君主（共同大公）。革命期のフランスは1793年に共同君主の地位を放棄し、1806年にナポレオンが復活させた。
  periods:
    - from: 1648
      to: 1815
      text: ピレネー山中の小国。フランス王とウルジェル司教を共同の君主とし、自治を保った。
  source: "ja.wikipedia: アンドラ"

- id: corsica
  name: コルシカ独立政府（パオリ政権）
  short: コルシカ
  color: "#b5d8cf"
  kind: 共和国
  rulers:
    - name: パスクワーレ・パオリ
      title: 国民総督
      from: 1755
      to: 1769
      source: "ja.wikipedia: パスカル・パオリ"
  periods:
    - from: 1755
      to: 1768
      text: ジェノヴァの支配に反抗したコルシカ人が、パオリのもとで独立政府と憲法を持った。ジェノヴァは沿岸の要塞都市だけを保ち、1768年に島の権利をフランスに譲った。
  note: 沿岸の要塞都市（バスティア・カルヴィ・アジャクシオなど）はジェノヴァ、のちフランス軍が保持していた。
  source: "ja.wikipedia: コルシカ共和国"

