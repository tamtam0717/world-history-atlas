      to: 1839
      text: 第一次カルリスタ戦争。教会と地方の特権（フエロ）を守ろうとするバスク・ナバラの農村などがドン・カルロスを支持して蜂起した。1839年のベルガラ協定で主力が降伏した。
    - from: 1872
      to: 1876
      text: 第三次カルリスタ戦争。ナバラとバスクの内陸を支配し、エステーリャを都として独自の政府を置いた。1876年に敗れ、バスクの特権は廃止された。
  note: 地図では、ナバラとバスク3県の大半をカルリスタが支配した年（1834–38、1873–75）だけ、この政体を不確実（斜線）で描く。ビルバオ・サン・セバスティアン・パンプローナ・ビトリアなどの都市は政府側が保持した。
  source: "ja.wikipedia: カルリスタ戦争"

- id: abd_al_qadir
  name: アブド＝アルカーディルの政権
  short: アブド＝アルカーディル
  color: "#a9cf98"
  kind: アミール国
  rulers:
    - {name: アブド＝アルカーディル, title: アミール（信徒の長）, from: 1832, to: 1847, note: 宗教指導者の家に生まれ、1832年に西部の部族からアミールに推された。1847年にフランスに降伏した。, source: "ja.wikipedia: アブド・アルカーディル"}
  periods:
    - from: 1832
      to: 1838
      text: アルジェリア西部・中部の部族をまとめ、マスカラを拠点にフランスと戦った。1834年のデミシェル条約、1837年のタフナ条約で、フランスは内陸の大部分の支配を認めた。
    - from: 1839
      to: 1847
      text: 戦争が再開し、ビュジョー将軍の焦土作戦でマスカラ（1841）・トレムセン（1842）などを失った。モロッコに逃れて抵抗を続けたが、1847年に降伏した。
  source: "ja.wikipedia: アブド・アルカーディル"

- id: constantine
  name: コンスタンティーヌのベイ領
  short: コンスタンティーヌ
  color: "#d9c48c"
  kind: ベイ領
  rulers:
    - {name: アフマド・ベイ, title: コンスタンティーヌのベイ, from: 1826, to: 1848, note: アルジェ陥落後もオスマン帝国のスルタンを主君としてフランスに抵抗した。1837年にコンスタンティーヌを失い、オーレス山地で抵抗を続けて1848年に降伏した。, source: "https://en.wikipedia.org/wiki/Ahmed_Bey_ben_Mohamed_Chérif"}
  periods:
    - from: 1830
      to: 1837
      text: アルジェのデイが降伏した後も、アルジェリア東部を支配した。1836年のフランス軍の攻撃は退けたが、1837年10月にコンスタンティーヌを落とされた。
  note: 1830年以前はアルジェ（algiers）の一部として描く。
  source: "https://en.wikipedia.org/wiki/Beylik_of_Constantine"

- id: senussi
  name: サヌーシー教団
  short: サヌーシー
  color: "#c6d6a6"
  kind: 宗教教団（教団国家）
  rulers:
    - {name: ムハンマド・イブン・アリー・アッサヌーシー, title: 教団の創始者, from: 1837, to: 1859, note: 1837年にメッカで教団を創始し、1843年にキレナイカに最初の修道場（ザーウィヤ）を開いた。, source: "ja.wikipedia: サヌーシー教団"}
    - {name: ムハンマド・アルマフディー, title: 教団の長, from: 1859, to: 1902, note: 1895年に本拠をクフラに移した。, source: "ja.wikipedia: サヌーシー教団"}
    - {name: アフマド・シャリーフ, title: 教団の長, from: 1902, to: 1916, note: イタリアのリビア侵入に抵抗した。, source: "https://en.wikipedia.org/wiki/Ahmed_Sharif_as-Senussi"}
    - {name: ムハンマド・イドリース, title: 教団の長・キレナイカのアミール（1920年〜）, from: 1916, to: 1951, note: 1923年にエジプトに亡命した。第二次世界大戦ではイギリスと協力し、1949年にキレナイカのアミール、1951年にリビア王（libya）となった。, source: "https://en.wikipedia.org/wiki/Idris_of_Libya"}
    - {name: ウマル・ムフタール, title: 抵抗運動の指導者（キレナイカ）, from: 1923, to: 1931, note: 1931年9月にイタリア軍に捕らえられ、処刑された。, source: "https://en.wikipedia.org/wiki/Omar_Mukhtar"}
  periods:
    - from: 1843
      to: 1911
      text: キレナイカとサハラの遊牧民・オアシスに修道場の網を広げ、オスマン帝国の宗主権のもとで事実上の自治を行った。サハラ交易路を押さえた。
    - from: 1911
      to: 1914
      text: イタリアのリビア侵入に対し、オスマン帝国の軍人とともにキレナイカの内陸で抵抗を続けた。
    - from: 1915
      to: 1922
      text: 1914–15年の反乱でイタリア軍は沿岸の町に追い詰められた。イタリアはアクロマ協定（1917）・ラジマ協定（1920）でイドリースをキレナイカ内陸のアミールと認め、教団が内陸を治めた。
    - from: 1923
      to: 1931
      text: ファシスト政権のイタリアが協定を破棄して再征服を始めた。イドリースはエジプトに逃れ、ウマル・ムフタールがゲリラ戦を指導した。イタリアは住民を強制収容所に移して抵抗を断ち、1931年にクフラを占領してムフタールを処刑した。
  note: 地図では、教団の本拠クフラ（1895–1930年）と、教団がキレナイカの内陸を治めた時期（1915–22年）を不確実（斜線）で描く。
  source: "ja.wikipedia: サヌーシー教団"

