    - {name: アフマド・アッザハビー, title: アラウィー朝スルタン, from: 1727, to: 1729, note: 1728年に一時アブドゥルマリクに位を奪われた。, source: "ja.wikipedia: アラウィー朝"}
    - {name: アブドゥッラー, title: アラウィー朝スルタン, from: 1729, to: 1757, note: 黒人奴隷兵の擁立・廃位により何度も退位と復位をくり返した（その間、兄弟のアリー、ムハンマド2世、ムスタディーらが一時即位）。要確認。, source: "ja.wikipedia: アラウィー朝"}
