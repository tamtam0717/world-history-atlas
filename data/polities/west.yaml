    - {name: ホセ1世（ジョゼフ・ボナパルト）, title: スペイン王（ナポレオンの兄）, from: 1808, to: 1813, note: 反乱側はフェルナンド7世を正統の王とし、中央評議会・摂政会議とカディス議会が抵抗を指導した。, source: "ja.wikipedia: ジョゼフ・ボナパルト"}
    - {name: フェルナンド7世（復位）, title: スペイン王, from: 1813, to: 1833, note: 1813年12月のヴァランセ条約で王位を回復し、1814年3月に帰国。カディス憲法を廃止した。, source: "ja.wikipedia: フェルナンド7世 (スペイン王)"}
    - {name: イサベル2世, title: スペイン女王, from: 1833, to: 1868, note: 3歳で即位。母マリア・クリスティーナ（1833–40）、エスパルテロ将軍（1840–43）が摂政。1868年の九月革命でフランスに亡命した。, source: "ja.wikipedia: イサベル2世 (スペイン女王)"}
    - {name: フランシスコ・セラーノ, title: 臨時政府首班→摂政（1869–70）, from: 1868, to: 1870, source: "ja.wikipedia: フランシスコ・セラーノ"}
    - {name: アマデオ1世, title: スペイン王, from: 1871, to: 1873, note: イタリア王の次男。1870年11月に議会で王に選ばれたが、1873年2月に退位した。, source: "ja.wikipedia: アマデオ1世 (スペイン王)"}
    - {name: フィゲラス、ピ・イ・マルガル、サルメロン、カステラール, title: 第一共和政の行政権の長（順に交代）, from: 1873, to: 1873, source: "ja.wikipedia: スペイン第一共和政"}
    - {name: フランシスコ・セラーノ, title: 共和国の行政権の長, from: 1874, to: 1874, note: 1874年1月のパビア将軍のクーデタ後、軍の支持で権力を握った。, source: "ja.wikipedia: スペイン第一共和政"}
    - {name: アルフォンソ12世, title: スペイン王, from: 1874, to: 1885, note: イサベル2世の子。1874年12月のマルティネス・カンポス将軍の宣言で王に迎えられた（王政復古）。, source: "ja.wikipedia: アルフォンソ12世 (スペイン王)"}
    - {name: マリア・クリスティーナ（・デ・アブスブルゴ）, title: 摂政（アルフォンソ13世の母）, from: 1885, to: 1902, source: "ja.wikipedia: マリア・クリスティーナ・デ・アブスブルゴ"}
    - {name: アルフォンソ13世, title: スペイン王, from: 1886, to: 1931, note: 父の死後の1886年5月に生まれて即位。1902年に親政を始めた。, source: "ja.wikipedia: アルフォンソ13世 (スペイン王)"}
  periods:
    - from: 1648
      to: 1700
      text: 「黄金世紀」が終わり、国力が衰える。カタルーニャ（1640–52）とポルトガル（1640–68）の反乱、フランスとの戦争で領土を失う。病弱なカルロス2世に子がなく、王位継承が全ヨーロッパの問題になった。
    - from: 1700
      to: 1714
      text: スペイン継承戦争。ブルボン家のフェリペ5世が王位を守るが、ユトレヒト条約などでネーデルラント・イタリアの領土とジブラルタル・ミノルカを失う。
    - from: 1715
      to: 1788
      text: ブルボン朝のもとで、新組織王令（ヌエバ・プランタ王令）によりアラゴン諸王国の自治を廃して中央集権化を進める。カルロス3世が啓蒙改革を行った。
    - from: 1789
      to: 1807
      text: カルロス4世のもとで寵臣ゴドイが実権を握る。フランス革命戦争でフランスと戦ったが、1795年のバーゼルの和約で講和し、翌年からフランスと同盟してイギリスと戦った。1805年のトラファルガーの海戦で艦隊を失い、1807年のフォンテーヌブロー条約でフランス軍の領内通過（ポルトガル侵攻）を認めた。
    - from: 1808
      to: 1813
      text: ナポレオンが兄ジョゼフを王に立て、各地の民衆蜂起とイギリス軍の介入で半島戦争となる。1812年、抵抗派のカディス議会が自由主義的なカディス憲法を制定した。
    - from: 1814
      to: 1815
      text: フェルナンド7世が復位して絶対王政に戻り、カディス憲法を廃止した。中南米の植民地では独立運動が広がる。
    - from: 1816
      to: 1833
      text: 1820年のリエゴの反乱で立憲政治が復活したが（自由主義の3年間）、1823年にフランス軍の干渉で絶対王政に戻された。この間に中南米の植民地の大半が独立し、残ったのはキューバ・プエルトリコ・フィリピンなどだけになった。
    - from: 1833
      to: 1868
      text: 幼いイサベル2世の即位に、叔父ドン・カルロスを推す保守派（カルリスタ）が反乱を起こした（第一次カルリスタ戦争、1833–40）。その後も将軍たちのクーデタ（プロヌンシアミエント）で政権が交代する不安定な立憲王政が続いた。
    - from: 1868
      to: 1874
      text: 九月革命で女王が追放され、イタリアからアマデオ1世を迎えたが2年で退位し、第一共和政（1873）となった。連邦派の反乱と第三次カルリスタ戦争で混乱し、1874年末に王政が復古した。
    - from: 1875
      to: 1914
      text: 王政復古体制。保守党カノバスと自由党サガスタが交代で政権を担った。1898年の米西戦争でキューバ・プエルトリコ・フィリピンを失い（「98年の世代」）、以後はモロッコに進出した（1912年保護領）。バルセロナではカタルーニャ主義と労働運動が強まった。
  source: "ja.wikipedia: スペイン・ハプスブルク朝"

- id: portugal
  name: ポルトガル王国
  names:
    - {from: 1815, to: 1821, name: ポルトガル・ブラジル及びアルガルヴェ連合王国}
    - {from: 1910, name: ポルトガル共和国, kind: 共和国}
  short: ポルトガル
  color: "#a9d6a0"
  kind: 王国
  rulers:
    - {name: ジョアン4世, title: ポルトガル王, from: 1640, to: 1656, note: 1640年の再独立（スペインからの離脱）で即位したブラガンサ朝の祖。, source: "ja.wikipedia: ジョアン4世 (ポルトガル王)"}
    - {name: アフォンソ6世, title: ポルトガル王, from: 1656, to: 1683, note: 1667年に実権を奪われ、弟ペドロが1668年から摂政となった。, source: "ja.wikipedia: アフォンソ6世 (ポルトガル王)"}
    - {name: ペドロ（のちのペドロ2世）, title: 摂政（兄アフォンソ6世に代わって統治）, from: 1668, to: 1682, source: "ja.wikipedia: ペドロ2世 (ポルトガル王)"}
    - {name: ペドロ2世, title: ポルトガル王（1668–83年は摂政）, from: 1683, to: 1706, source: "ja.wikipedia: ペドロ2世 (ポルトガル王)"}
    - {name: ジョアン5世, title: ポルトガル王, from: 1706, to: 1750, source: "ja.wikipedia: ジョアン5世 (ポルトガル王)"}
    - {name: ジョゼ1世, title: ポルトガル王, from: 1750, to: 1777, note: 宰相ポンバル侯が実権を握った。, source: "ja.wikipedia: ジョゼ1世 (ポルトガル王)"}
    - {name: マリア1世, title: ポルトガル女王, from: 1777, to: 1816, note: 1792年ごろから精神を病み、王子ジョアンが政治を代行（1799年に正式に摂政）。, source: "ja.wikipedia: マリア1世 (ポルトガル女王)"}
    - {name: ペドロ3世, title: ポルトガル王（マリア1世の夫・共同統治者）, from: 1777, to: 1786, source: "ja.wikipedia: ペドロ3世 (ポルトガル王)"}
    - {name: ジョアン（のちジョアン6世）, title: 摂政王太子, from: 1799, to: 1816, note: 1807年のフランス軍侵入を前に、王室とともにブラジルのリオデジャネイロへ移った。, source: "ja.wikipedia: ジョアン6世 (ポルトガル王)"}
    - {name: ジョアン6世, title: ポルトガル王, from: 1816, to: 1826, note: 1821年にブラジルからリスボンに戻った。, source: "ja.wikipedia: ジョアン6世 (ポルトガル王)"}
    - {name: ペドロ4世, title: ポルトガル王（ブラジル皇帝ペドロ1世）, from: 1826, to: 1826, note: 即位後すぐ、娘マリアに譲位した。, source: "ja.wikipedia: ペドロ1世 (ブラジル皇帝)"}
    - {name: マリア2世, title: ポルトガル女王, from: 1826, to: 1828, note: 叔父ミゲルが摂政となったが、1828年にミゲルが自ら王位についた。, source: "ja.wikipedia: マリア2世 (ポルトガル女王)"}
    - {name: ミゲル1世, title: ポルトガル王, from: 1828, to: 1834, note: 絶対王政派に推されて即位。自由主義派との内戦（自由主義戦争）に敗れ、1834年に亡命した。, source: "ja.wikipedia: ミゲル1世 (ポルトガル王)"}
    - {name: マリア2世（復位）, title: ポルトガル女王, from: 1834, to: 1853, source: "ja.wikipedia: マリア2世 (ポルトガル女王)"}
    - {name: フェルナンド2世, title: ポルトガル王（マリア2世の夫・共同統治者）, from: 1837, to: 1853, source: "ja.wikipedia: フェルナンド2世 (ポルトガル王)"}
    - {name: ペドロ5世, title: ポルトガル王, from: 1853, to: 1861, note: 1855年まで父フェルナンド2世が摂政。, source: "ja.wikipedia: ペドロ5世 (ポルトガル王)"}
    - {name: ルイス1世, title: ポルトガル王, from: 1861, to: 1889, source: "ja.wikipedia: ルイス1世 (ポルトガル王)"}
    - {name: カルロス1世, title: ポルトガル王, from: 1889, to: 1908, note: 1908年2月、リスボンで王太子とともに暗殺された。, source: "ja.wikipedia: カルロス1世 (ポルトガル王)"}
    - {name: マヌエル2世, title: ポルトガル王, from: 1908, to: 1910, note: 1910年10月の革命でイギリスに亡命した。, source: "ja.wikipedia: マヌエル2世 (ポルトガル王)"}
    - {name: テオフィロ・ブラガ, title: 臨時政府首班, from: 1910, to: 1911, source: "ja.wikipedia: テオフィロ・ブラガ"}
    - {name: マヌエル・デ・アリアガ, title: 大統領, from: 1911, to: 1915, source: "https://en.wikipedia.org/wiki/Manuel_de_Arriaga"}
  periods:
    - from: 1648
      to: 1668
      text: 1640年にスペインから再独立し、ブラガンサ朝のもとで独立戦争を続ける。1668年のリスボン条約でスペインが独立を承認した。
    - from: 1669
      to: 1755
      text: イギリスとの同盟を軸にする（1703年メシュエン条約）。ブラジルの金がジョアン5世の豪華な宮廷を支えた。
    - from: 1755
      to: 1777
      text: リスボン大地震の後、宰相ポンバル侯が首都を再建し、イエズス会の追放など啓蒙改革を進めた。
    - from: 1778
      to: 1806
      text: マリア1世の即位でポンバル侯が失脚し、貴族と教会の力が戻った。女王が精神を病むと王子ジョアンが政治を代行した。イギリスとの同盟を守ったため、1801年にはスペインに攻め込まれ（オレンジ戦争）、オリベンサを失った。
    - from: 1807
      to: 1815
      text: ナポレオン軍の侵入を受け、王室はブラジルに移る。イギリス軍（ウェリントン）とともにフランス軍を撃退した（半島戦争）。
    - from: 1816
      to: 1834
      text: 王がブラジルにとどまる間に、1820年の自由主義革命で憲法が作られた。1822年にブラジルが独立。王の死後、自由主義派（マリア2世）と絶対王政派（ミゲル1世）が争う内戦（自由主義戦争、1828–34）となった。
    - from: 1834
      to: 1889
      text: 立憲王政が定着し、1851年からの「再生（レジェネラサン）」期に鉄道や道路が整備された。アフリカ（アンゴラ・モザンビーク）の植民地を広げようとした。
    - from: 1890
      to: 1910
      text: アンゴラとモザンビークを結ぶ計画（「バラ色地図」）がイギリスの最後通牒（1890）でつぶされ、王政の権威が落ちた。財政難の中で共和派が伸び、1908年に国王が暗殺された。
    - from: 1910
      to: 1914
      text: 十月革命（1910年）で王政が倒れ、共和政になった。教会と国家を分け、修道会を追放したが、政権は安定しなかった。
  source: "ja.wikipedia: ブラガンサ王朝"

