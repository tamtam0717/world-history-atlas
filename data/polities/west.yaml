      to: 1815
      text: フサイン朝が成立し、オスマン帝国からほぼ独立した。隣のアルジェとはしばしば戦い、1756年にはアルジェ軍にチュニスを占領されて貢納を課された。
    - from: 1816
      to: 1868
      text: アフマド・ベイらが西欧式の改革を進めた。奴隷制の廃止（1846）、憲法の制定（1861）を行ったが、改革の費用で借金がふくらんだ。
    - from: 1869
      to: 1880
      text: 財政が破綻し、フランス・イギリス・イタリアの国際財政委員会に財政を握られた。宰相ハイルッディーンが改革を試みた。
    - from: 1881
      to: 1914
      text: フランス軍が侵入し、バルドー条約（1881）でフランスの保護国となった。ベイは残ったが、実権はフランスの統監が握った。イタリア人の移民も多かった。
    - from: 1915
      to: 1955
      text: フランスの保護国。立憲運動のドゥストゥール党、ついでブルギバの新ドゥストゥール党（1934）が独立を求めた。第二次世界大戦中の1942年11月から翌年5月まで、ドイツ・イタリア軍が北東部を占領し、連合軍との戦場となった（チュニジアの戦い）。
  source: "ja.wikipedia: フサイン朝"

- id: tripoli
  name: トリポリ（リビア）
  short: トリポリ
  color: "#dccaa8"
  kind: 摂政領（オスマン帝国）
  rulers:
    - {name: アフメト・カラマンリー, title: パシャ（カラマンリー朝の祖）, from: 1711, to: 1745, source: "en.wikipedia: Karamanli dynasty"}
    - {name: メフメト・カラマンリー, title: パシャ, from: 1745, to: 1754, source: "en.wikipedia: Karamanli dynasty"}
    - {name: アリー1世・カラマンリー, title: パシャ, from: 1754, to: 1793, source: "en.wikipedia: Karamanli dynasty"}
    - {name: アリー・ブルグル, title: パシャ（簒奪者）, from: 1793, to: 1795, note: オスマン帝国の承認を得てトリポリを奪ったが、追われた。, source: "en.wikipedia: Karamanli dynasty"}
    - {name: ユースフ・カラマンリー, title: パシャ, from: 1795, to: 1832, note: 1795年は短期間、兄アフメト（ハーミト）が在位。アメリカ合衆国と第一次バーバリ戦争（1801–05）を戦った。, source: "en.wikipedia: Yusuf Karamanli"}
    - {name: アリー2世・カラマンリー, title: パシャ, from: 1832, to: 1835, note: 父ユースフの退位後、一族の内戦の中で在位した。1835年にオスマン帝国に廃された。, source: "en.wikipedia: Karamanli dynasty"}
  note: 1711年以前はオスマン帝国が任命するパシャやデイが統治した（頻繁に交代したため省略）。
  periods:
    - from: 1648
      to: 1710
      text: オスマン帝国のトリポリ州（摂政領）。イェニチェリの軍人と私掠船の船長たちが実権を握った。
    - from: 1711
      to: 1815
      text: カラマンリー朝が世襲のパシャとなり、オスマン帝国の宗主権のもとでほぼ独立した。私掠と貢納金で富み、アメリカ合衆国と戦った（第一次バーバリ戦争）。
    - from: 1816
      to: 1835
      text: 私掠が禁じられて財政が傾き、借金と内戦に苦しんだ。1835年、オスマン帝国が軍を送ってカラマンリー朝を廃し、直接の支配に戻した（以後は ottoman として描く）。
  source: "ja.wikipedia: カラマンリー朝"

- id: egypt
  name: エジプト（ムハンマド・アリー朝）
  names:
    - {from: 1867, to: 1913, name: エジプト（ヘディーヴ国）, kind: 副王国（オスマン帝国のヘディーヴ領）}
    - {from: 1914, to: 1921, name: エジプト・スルタン国, kind: スルタン国（イギリスの保護国）}
    - {from: 1922, to: 1952, name: エジプト王国, kind: 王国}
    - {from: 1953, to: 1957, name: エジプト共和国, kind: 共和国}
    - {from: 1958, to: 1970, name: アラブ連合共和国, short: エジプト, kind: 共和国}
    - {from: 1971, name: エジプト・アラブ共和国, kind: 共和国}
  short: エジプト
  color: "#d9d29a"
  kind: 総督領（オスマン帝国）
  rulers:
    - name: ムハンマド・アリー
      title: エジプト総督（パシャ）
      from: 1805
      to: 1848
      note: 1811年にマムルークを虐殺して権力を固め、近代化政策を進めた。晩年は病のため、1848年に子イブラーヒームが統治を代行した。
      source: "ja.wikipedia: ムハンマド・アリー"
    - {name: イブラーヒーム・パシャ, title: エジプト総督, from: 1848, to: 1848, note: 父の存命中に統治を代わり、同じ年に死去した。, source: "ja.wikipedia: イブラーヒーム・パシャ"}
    - {name: アッバース1世, title: エジプト総督, from: 1848, to: 1854, source: "ja.wikipedia: アッバース・ヒルミー1世"}
    - {name: サイード, title: エジプト総督, from: 1854, to: 1863, note: レセップスにスエズ運河の建設を許可した（1854年）。, source: "ja.wikipedia: サイード・パシャ"}
    - {name: イスマーイール, title: エジプト総督→ヘディーヴ（副王、1867年〜）, from: 1863, to: 1879, note: スエズ運河を開通させ（1869）、急速な近代化で巨額の借金を負った。列強の圧力で廃位された。, source: "ja.wikipedia: イスマーイール・パシャ"}
    - {name: タウフィーク, title: ヘディーヴ, from: 1879, to: 1892, note: ウラービー運動に対しイギリスに頼り、1882年からイギリスの占領下となった。, source: "ja.wikipedia: タウフィーク・パシャ"}
    - {name: アッバース2世, title: ヘディーヴ, from: 1892, to: 1914, note: イギリスに反発した。1914年12月、第一次世界大戦でオスマン帝国側についたとしてイギリスに廃された。, source: "ja.wikipedia: アッバース・ヒルミー2世"}
    - {name: フサイン・カーミル, title: スルタン（イギリスの保護国）, from: 1914, to: 1917, source: "https://en.wikipedia.org/wiki/Hussein_Kamel_of_Egypt"}
    - {name: フアード1世, title: スルタン→国王（1922年〜）, from: 1917, to: 1936, source: "https://en.wikipedia.org/wiki/Fuad_I_of_Egypt"}
    - {name: ファールーク1世, title: 国王, from: 1936, to: 1952, note: 1952年7月の自由将校団のクーデタで退位させられた。, source: "https://en.wikipedia.org/wiki/Farouk_of_Egypt"}
    - {name: フアード2世, title: 国王（幼少。摂政会議）, from: 1952, to: 1953, note: 1953年6月に王政が廃止された。, source: "https://en.wikipedia.org/wiki/Fuad_II_of_Egypt"}
    - {name: ムハンマド・ナギーブ, title: 革命評議会議長→大統領（1953年〜）, from: 1952, to: 1954, note: 1954年にナセルに解任された。, source: "https://en.wikipedia.org/wiki/Mohamed_Naguib"}
    - {name: ガマール・アブドゥル＝ナセル, title: 革命評議会議長→大統領（1956年〜）, from: 1954, to: 1970, note: 1956年にスエズ運河を国有化した。アラブ民族主義の指導者。1970年9月に急死した。, source: "https://en.wikipedia.org/wiki/Gamal_Abdel_Nasser"}
    - {name: アンワル・サダト, title: 大統領, from: 1970, to: 1981, note: 1979年にイスラエルと平和条約を結んだ。1981年10月に暗殺された。, source: "https://en.wikipedia.org/wiki/Anwar_Sadat"}
    - {name: ホスニー・ムバーラク, title: 大統領, from: 1981, to: 2011, note: 2011年2月、民衆の抗議（エジプト革命）で辞任した。, source: "https://en.wikipedia.org/wiki/Hosni_Mubarak"}
    - {name: ムハンマド・フセイン・タンターウィー, title: 軍最高評議会議長, from: 2011, to: 2012, source: "https://en.wikipedia.org/wiki/Mohamed_Hussein_Tantawi"}
    - {name: ムハンマド・ムルスィー, title: 大統領, from: 2012, to: 2013, note: ムスリム同胞団。2013年7月に軍に解任された。, source: "https://en.wikipedia.org/wiki/Mohamed_Morsi"}
    - {name: アドリー・マンスール, title: 暫定大統領, from: 2013, to: 2014, source: "https://en.wikipedia.org/wiki/Adly_Mansour"}
    - {name: アブドゥルファッターフ・シーシー, title: 大統領, from: 2014, note: 2013年のクーデタを国防相として指導した。, source: "https://en.wikipedia.org/wiki/Abdel_Fattah_el-Sisi"}
    - {name: クローマー卿（イヴリン・ベアリング）, title: イギリス総領事（事実上の支配者）, from: 1883, to: 1907, note: ヘディーヴの上に立ってエジプトの財政と行政を握った。後任はゴースト（1907–11）、キッチナー（1911–14）。, source: "ja.wikipedia: イヴリン・ベアリング (初代クローマー伯爵)"}
  periods:
    - from: 1805
      to: 1815
      text: アルバニア人の軍人ムハンマド・アリーがエジプト総督となり、オスマン帝国の宗主権のもとで事実上自立した。
    - from: 1816
      to: 1841
      text: ムハンマド・アリーが西欧式の軍隊・工場・学校をつくる富国強兵策を進め、スーダンを征服した（1820–22）。ギリシア独立戦争に出兵した後、2度のエジプト＝トルコ戦争でシリアを奪ったが、列強の干渉（1840年ロンドン条約）でシリアを返し、エジプト総督の世襲権だけを認められた。
    - from: 1842
      to: 1875
      text: 綿花の輸出で経済が伸び、フランス人レセップスがスエズ運河を建設した（1869年開通）。イスマーイールはカイロの改造などで近代化を急いだが、借金がふくらんだ。
    - from: 1876
      to: 1882
      text: 財政が破綻し、イギリス・フランスが財政を管理した（二重管理）。スエズ運河株はイギリスに売られた（1875）。「エジプト人のためのエジプト」を掲げるウラービー運動が起きたが、1882年にイギリス軍に鎮圧された。
    - from: 1883
      to: 1914
      text: 名目上はオスマン帝国の宗主権のもとにあるヘディーヴ国だが、実際にはイギリスの占領下にあり、総領事クローマーが統治を握った（「隠された保護国」）。1914年12月、イギリスはオスマン帝国の宗主権を否定して正式に保護国とした。
    - from: 1915
      to: 1921
      text: イギリスの保護国。第一次世界大戦ではスエズ運河を守る拠点となった。戦後、ワフド党のザグルールらが独立を求め、1919年に全国的な反英運動（1919年革命）が起きた。
    - from: 1922
      to: 1951
      text: 1922年にイギリスが保護権を廃し、エジプト王国として独立した。ただしスエズ運河の防衛・スーダンなどはイギリスが握り続けた（1936年の条約で運河地帯の駐兵を認めた）。第二次世界大戦ではエル・アラメインの戦い（1942）の舞台となった。第1次中東戦争（1948–49）に敗れた。
    - from: 1952
      to: 1970
      text: 1952年、ナギーブ・ナセルら自由将校団のクーデタ（エジプト革命）で王政が倒れ、翌年共和国となった。ナセルはスエズ運河を国有化し（1956）、スエズ戦争（第2次中東戦争）で英仏・イスラエルの出兵を退けた。アスワン・ハイダムを建設し、シリアと合同してアラブ連合共和国をつくった（1958–61）。第3次中東戦争（1967）でシナイ半島をイスラエルに占領された。
    - from: 1970
      to: 1981
      text: サダトが第4次中東戦争（1973）の後、アメリカに近づき、エジプト＝イスラエル平和条約（1979）を結んでシナイ半島を取り戻した（返還完了は1982年）。
    - from: 1981
      to: 2010
      text: ムバーラクの長期政権。アメリカとの協調を続け、非常事態法のもとで反対派を抑えた。
    - from: 2011
      to: 2025
      text: 「アラブの春」の民衆の抗議でムバーラクが辞任し、選挙でムスリム同胞団のムルスィーが大統領になったが、2013年に軍がクーデタで解任した。シーシー大統領のもとで、強い権威主義の体制が続いている。
  note: 1805年以前のエジプトはオスマン帝国（ottoman）の州として描く。実際にはマムルークのベイたちが実権を握っていた。1882–1921年のイギリスの占領・保護国の時期は、地図ではイギリスの色で描く。1958–61年のシリアとの合同（アラブ連合共和国）のシリア側は担当 E の地域で描く。1952年以降は大統領（実権者）を挙げる。
  source: "ja.wikipedia: ムハンマド・アリー朝"

# ---------------------------------------------------------------- 1815–1914 に加えた政体
- id: carlists
  name: カルリスタ（ドン・カルロス派）
  short: カルリスタ
  color: "#c9a77c"
  kind: 王位請求者の勢力
  rulers:
    - {name: カルロス・マリア・イシドロ（カルロス5世を称する）, title: 王位請求者, from: 1833, to: 1845, note: フェルナンド7世の弟。女子の王位継承を認めず、姪イサベル2世の即位に反対した。, source: "ja.wikipedia: カルロス・マリア・イシドロ・デ・ボルボン"}
    - {name: カルロス・ルイス（カルロス6世を称する）, title: 王位請求者, from: 1845, to: 1861, source: "https://en.wikipedia.org/wiki/Carlos,_Count_of_Montemolin"}
    - {name: フアン（フアン3世を称する）, title: 王位請求者, from: 1861, to: 1868, source: "https://en.wikipedia.org/wiki/Infante_Juan,_Count_of_Montizón"}
    - {name: カルロス（カルロス7世を称する）, title: 王位請求者, from: 1868, to: 1909, note: 第三次カルリスタ戦争（1872–76）を指導し、エステーリャに宮廷を置いた。, source: "https://en.wikipedia.org/wiki/Carlos,_Duke_of_Madrid"}
  periods:
