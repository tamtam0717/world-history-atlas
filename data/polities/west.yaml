    - from: 1816
      to: 1860
      text: サルデーニャ王国の保護下。1848年、領土の大半を占めるマントンとロクブリュヌが重税に反発して独立を宣言した。
    - from: 1861
      to: 1914
      text: 1861年のフランスとの条約で、マントン・ロクブリュヌを売り渡すかわりに独立を認められた。カジノの開設（1863年）でモンテカルロが保養地として栄えた。
