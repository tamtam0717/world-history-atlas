    - {name: ユースフ, title: アラウィー朝スルタン（保護国のもと）, from: 1912, to: 1927, note: 実権はフランスの統監（総督）リヨテが握った。, source: "https://en.wikipedia.org/wiki/Yusef_of_Morocco"}
    - {name: ムハンマド5世, title: スルタン→国王（1957年〜）, from: 1927, to: 1953, note: 独立運動を支持したため、1953年8月にフランスに廃位され、マダガスカルに流された。, source: "https://en.wikipedia.org/wiki/Mohammed_V_of_Morocco"}
    - {name: ムハンマド・ベン・アラファ, title: スルタン（フランスが擁立）, from: 1953, to: 1955, source: "https://en.wikipedia.org/wiki/Mohammed_Ben_Aarafa"}
    - {name: ムハンマド5世（復位）, title: スルタン→国王（1957年〜）, from: 1955, to: 1961, note: 1955年11月に帰国し、1956年に独立を達成した。, source: "https://en.wikipedia.org/wiki/Mohammed_V_of_Morocco"}
    - {name: ハサン2世, title: 国王, from: 1961, to: 1999, note: 強い王権のもとで反対派を抑えた（「鉛の時代」）。1975年に「緑の行進」を組織して西サハラを手に入れた。, source: "https://en.wikipedia.org/wiki/Hassan_II_of_Morocco"}
    - {name: ムハンマド6世, title: 国王, from: 1999, source: "https://en.wikipedia.org/wiki/Mohammed_VI_of_Morocco"}
  periods:
    - from: 1648
      to: 1667
      text: サアド朝が衰え、国内は分裂。北部・中部はディラーのザーウィヤ（宗教団体）、南東のタフィラルトはアラウィー家が支配した。
    - from: 1668
      to: 1727
      text: アラウィー朝がモロッコを統一。ムーレイ・イスマーイールの長い治世のもと、タンジールなどヨーロッパ人の拠点を次々に奪回した。オスマン帝国には属さない独立国。
    - from: 1728
      to: 1757
      text: 奴隷兵の軍団が君主を擁立・廃位し、内乱が続いた。
    - from: 1757
      to: 1815
      text: ムハンマド3世が国を立て直し、ヨーロッパ諸国と通商条約を結んだ。
    - from: 1816
      to: 1858
      text: スルタンの支配が及ぶ地域（マフゼン）と、山地や砂漠の部族が自立する地域（シーバ）に分かれていた。隣のアルジェリアをフランスが征服すると、アブド＝アルカーディルを支援してフランスと戦い、1844年のイスリーの戦いで敗れた。
    - from: 1859
      to: 1893
      text: スペインとの戦争（1859–60）に敗れて賠償金を払い、イギリスなどとの不平等な通商条約で経済が開かれた。ハサン1世が軍の近代化と遠征で独立を守った。
    - from: 1894
      to: 1911
      text: 列強がモロッコをめぐって争い、2度のモロッコ事件（1905・1911）が起きた。財政は破綻し、フランスがウジダ・カサブランカ（1907）、スペインがメリリャ周辺（1909）・ララシュ（1911）を占領した。
    - from: 1912
      to: 1914
      text: フェス条約でフランスの保護国となり、北部の地中海沿岸と南部のタルファヤはスペインの保護領に、タンジールは国際管理の予定地とされた。スルタンは残ったが、実権はフランスの統監リヨテが握った。山地や南部の部族はフランスの支配に抵抗を続けた。
    - from: 1915
      to: 1934
      text: フランスとスペインの保護国。北部のリーフ山地ではアブドゥルカリームがリーフ共和国を建てて抵抗し（リーフ戦争、1921–26）、仏西両軍に鎮圧された。フランスはアトラス山地の部族を1934年までに「平定」した。
    - from: 1935
      to: 1955
      text: 独立を求めるイスティクラール（独立）党が結成され（1943）、スルタンのムハンマド5世も独立を支持した。1953年にフランスがスルタンを廃位すると、反仏闘争が激しくなった。
    - from: 1956
      to: 1974
      text: 1956年にフランス・スペインから独立し、同年タンジールも統合した。1957年に王国となり、スペインからタルファヤ（1958）・イフニ（1969）を取り戻した。アルジェリアと国境をめぐって戦った（砂の戦争、1963）。
    - from: 1975
      to: 2025
      text: 1975年の「緑の行進」の後、スペイン領サハラ（西サハラ）を併合したが、独立を求めるポリサリオ戦線（サハラ・アラブ民主共和国）との紛争が続いている。1991年に国連の仲介で停戦した。2011年の「アラブの春」の後、憲法を改めて議会の権限を広げた。
  source: "ja.wikipedia: モロッコの歴史"

