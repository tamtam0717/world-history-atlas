  periods:
    - from: 1907
      to: 1918
      text: 自治領となった。セドン政権（1893–1906）以来の自由党の改革で、女性参政権（1893、国政では世界初）・老齢年金・労使の強制仲裁などが整い、「社会の実験室」と呼ばれた。第一次世界大戦ではオーストラリアとともにアンザック軍団としてガリポリで戦い、ドイツ領サモアを占領した。
    - from: 1919
      to: 1945
      text: 西サモアを委任統治した。世界恐慌で農産物の輸出が落ち込み、第一次労働党政権（1935–49）が社会保障法（1938）で福祉国家を作った。第二次世界大戦では北アフリカ・イタリアと太平洋で戦った。
    - from: 1946
      to: 1972
      text: ウェストミンスター憲章を採択した（1947）。ANZUS条約（1951）でアメリカと結び、西サモアの独立（1962）を認めた。マオリの都市への移住が進んだ。
    - from: 1973
      to: 1999
      text: イギリスのEC加盟で主な輸出先を失い、アジア・太平洋に目を向けた。ワイタンギ審判所（1975）が作られ、条約違反の土地の返還・補償が進んだ。ロンギ政権が非核政策をとり（1984–87）、アメリカの核艦船の寄港を拒んでANZUSの協力が止まった。レインボー・ウォーリア号事件（1985）でフランスと対立した。
    - from: 2000
      to: 2025
      text: マオリ語・マオリ文化の復興が進み、二文化の国という意識が広まった。クライストチャーチ地震（2011）とモスク銃撃事件（2019）に見舞われた。

- id: kingitanga
  name: マオリ王の運動（キーンギタンガ）
  short: マオリ王
  color: "#a68fc7"
  kind: マオリの部族連合（王を立てた運動）
  note: >-
    土地の売却に反対する北島中部のマオリの諸部族が、1858年にワイカトの首長ポタタウ・テ・フェロフェロを王に立てた。
    ワイカト戦争（1863–64）で中心地のワイカトを失い、ロヘ・ポタエ（キング・カントリー）に移った。1881年にタフィアオ王が政府と和解し、1885年に北島幹線鉄道の建設を受け入れるまで、この地域はヨーロッパ人を入れなかった。
    王位は今も続いている（地図では1885年まで）。範囲はおおよそ（王に従った部族は時期によって違う）。
  source:
    - "https://ja.wikipedia.org/wiki/マオリ王"
    - "https://en.wikipedia.org/wiki/M%C4%81ori_King_Movement"
  rulers:
