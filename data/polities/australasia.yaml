  periods:
    - from: 1858
      to: 1862
      text: 土地の売却を止め、マオリの自治（ランガティラタンガ）を守るために王を立てた。ワイカト川流域が中心で、タラナキ戦争（1860–61）ではタラナキの部族を支援した。
    - from: 1863
      to: 1864
      text: 総督グレイの軍がワイカトに侵攻し、ランギリリ・オラカウの戦いで王の軍を破った。ワイカトの土地は没収された。
    - from: 1865
      to: 1885
      text: タフィアオ王はロヘ・ポタエ（キング・カントリー）に退き、ヨーロッパ人を入れない境界（アウカティ）を守った。1881年に政府と和解し、1885年に鉄道の建設を受け入れた。
