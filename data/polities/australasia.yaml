# O1 オーストラリア・ニュージーランドの政体。
# 植民地の時期（ニューサウスウェールズ・ヴァン・ディーメンズ・ランド・ニュージーランド植民地など）は britain＋地域の label で描く。
# 1901 年のオーストラリア連邦、1907 年のニュージーランド自治領から独自の政体（australia・new_zealand）。
# クック諸島・ニウエ・トケラウ・西サモアなどのニュージーランドの属領、ナウル・ニューギニアのオーストラリアの統治は O2（pacific.yaml）。

- id: australia
