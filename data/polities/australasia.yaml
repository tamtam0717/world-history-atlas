  periods:
    - from: 1901
      to: 1913
      text: 6つの植民地が連邦を作り、自治領となった。移民制限法で有色人種の移民を締め出す白豪主義をとる一方、女性参政権（1902）や労働者保護など、当時としては進んだ社会立法を行った。首都はキャンベラに新しく造ることになった（それまではメルボルン）。
    - from: 1914
      to: 1918
      text: イギリスとともに第一次世界大戦を戦い、ニューギニアのドイツ領を占領した。ニュージーランドとのアンザック軍団（ANZAC）はガリポリの戦い（1915）で大きな犠牲を出し、国民意識が高まった。戦後、旧ドイツ領ニューギニアとナウルを委任統治した。
    - from: 1919
      to: 1938
      text: 議会がキャンベラに移った（1927）。羊毛・小麦の輸出に頼る経済は世界恐慌で大きな打撃を受け、オタワ会議（1932）でイギリス帝国の特恵関税に加わった。
    - from: 1939
      to: 1945
      text: 第二次世界大戦に参戦。日本軍がシンガポールを落とし、ダーウィンを空襲する（1942）と、カーティン首相はイギリスよりアメリカとの協力を重んじ、ニューギニアで日本軍と戦った。ウェストミンスター憲章を採択した（1942）。
    - from: 1946
      to: 1972
      text: 「人口を増やすか滅びるか」を合言葉に、ヨーロッパから大量の移民を受け入れた。アメリカ・ニュージーランドとANZUS条約（1951）を結び、朝鮮戦争・ベトナム戦争に派兵した。1967年の国民投票で先住民（アボリジニ）が国勢調査に数えられ、連邦が先住民の法律を作れるようになった。
    - from: 1973
      to: 1999
      text: ホイットラム政権が白豪主義を撤廃し、アジアからの移民も受け入れる多文化主義の国に変わった。イギリスのEC加盟で、経済の重心はアジア・太平洋に移り、APEC（1989）を提唱した。マボ判決（1992）で先住民の土地の権利（先住権原）が認められた。共和制への移行は国民投票で否決された（1999）。
    - from: 2000
      to: 2025
      text: 中国への資源の輸出で長い好景気が続いた。2008年、政府が「盗まれた世代」（先住民の子どもを親から引き離した同化政策）に公式に謝罪した。中国との対立が深まる中、アメリカ・イギリスとAUKUS（2021）を結んだ。先住民の声を議会に届ける機関を憲法に定める案は国民投票で否決された（2023）。

