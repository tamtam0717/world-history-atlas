    - from: 1983
      to: 1987
      text: 1983年、トマ・サンカラ大尉が革命を起こし、1984年に国名をブルキナファソと改めた。汚職の追放、女性の地位の向上、自給の農業を進めたが、1987年のクーデタで殺された。
