# F1 西アフリカ（セネガンビア・サヘル：MRT・SEN・GMB・GNB・GIN・SLE・LBR・MLI・BFA・CIV・NER・CPV）の政体（1648–2025）
# 他の担当が参照しうる ID：futa_toro・futa_jallon・kaarta・segu・massina・toucouleur（トゥクロール帝国）・wassoulou（サモリ帝国）
#   kenedougou・kong・gyaaman・mossi・gurma・liptako・dendi・zarma・tuareg・agadez・damagaram・gobir・maradi
#   senegal・gambia・guinea・guinea_bissau・cape_verde・sierra_leone・liberia・cote_divoire・upper_volta（ブルキナファソ）・niger
# mali（マリ共和国）・mauritania（モーリタニア）・azawad はヨーロッパの担当（data/polities/west.yaml）が定義済み。
# フランス（france）・イギリス（britain）・ポルトガル（portugal）・オランダ（netherlands）・ヴィシー政府（vichy_france）・モロッコ（morocco）は既存。
# ボルヌ（bornu）・ソコト・カリフ国（sokoto）・アシャンティ（ashanti）・ハウサ諸王国（hausa_states）は F2 の ID を参照する。
# 植民地の時期の元首は宗主国の元首を使うので書かない。小さな在地の国家は元首を省略した。

# ================================================================ モーリタニアのムーア人の首長国
- id: trarza
  name: トラルザ首長国
  short: トラルザ
  color: "#afcfbe"
  kind: 首長国（ムーア人）
  periods:
    - from: 1648
      to: 1854
      text: セネガル川下流の北岸（現在のモーリタニア南西部）のムーア人（ハッサーン系のアラブ戦士集団）の首長国。アラビアゴムの交易で、サン＝ルイのフランス商人と結びつき、南岸のワロ王国にもたびたび攻め込んだ。
    - from: 1855
      to: 1902
      text: セネガル総督フェデルブと戦い（1855–58）、セネガル川南岸への進出をあきらめた。1902–03年、フランスのコッポラーニの「平和的征服」で保護下に入った。
  note: 17世紀なかばの「シャル・ブッバ戦争」（1644–74）で、戦士集団（ハッサーン）が宗教者集団（ザワーヤ）を下し、ムーア人の社会の上下関係ができたとされる。
  source: "https://en.wikipedia.org/wiki/Emirate_of_Trarza"

- id: brakna
  name: ブラクナ首長国
  short: ブラクナ
  color: "#dae2ab"
  kind: 首長国（ムーア人）
  periods:
    - from: 1648
      to: 1903
      text: セネガル川中流の北岸のムーア人の首長国。アラビアゴムの交易でフランスと結び、南岸のフタ・トロとも争った。1903年にフランスの保護下に入った。
  source: "https://en.wikipedia.org/wiki/Brakna_Emirate"

- id: tagant
  name: タガント首長国
  short: タガント
  color: "#e2b1ab"
  kind: 首長国（ムーア人）
  periods:
    - from: 1700
      to: 1905
      text: モーリタニア中部のタガント高原を中心とするイダウ・アイシュ族の首長国。1905年、フランスのコッポラーニがティジクジャで殺されたのち、フランス軍に占領された。
  note: 成立の年は18世紀初めとされる（要確認）。
  source: "https://en.wikipedia.org/wiki/Emirate_of_Tagant"

- id: adrar_emirate
  name: アドラール首長国
  short: アドラール
  color: "#e6d6b7"
  kind: 首長国（ムーア人）
  periods:
    - from: 1745
      to: 1909
      text: モーリタニア北部のアドラール高原（都アタール）の首長国。ナツメヤシのオアシスと隊商路を押さえた。1909年、グロー大佐のフランス軍に占領された。
  note: 成立は18世紀なかばとされる（要確認）。
  source: "https://en.wikipedia.org/wiki/Emirate_of_Adrar"

# ================================================================ セネガンビアの王国
- id: waalo
  name: ワロ王国
  short: ワロ
  color: "#c9d9a3"
  kind: 王国（ウォロフ）
  rulers:
    - {name: ンダテ・ヤラ・ンボージュ, title: 女王（リンゲール）, from: 1846, to: 1855, note: フランスの進出に抵抗した。1855年にフェデルブがワロを併合した, source: "https://en.wikipedia.org/wiki/Ndaté_Yalla_Mbodj"}
  periods:
    - from: 1648
      to: 1854
      text: セネガル川下流の南岸のウォロフ人の王国（王はブラク）。河口のサン＝ルイのフランス人と交易したが、北のトラルザのムーア人にたびたび攻められた。
    - from: 1855
      to: 1855
      text: 1855年、セネガル総督フェデルブがワロを併合し、フランスが内陸に進む足場となった。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Waalo"

- id: cayor
  name: カヨール王国
  short: カヨール
  color: "#ceb083"
  kind: 王国（ウォロフ）
  rulers:
    - {name: アマリ・ンゴネ・ソベル・ファル, title: 王（ダメル）, from: 1549, to: 1593, note: ダンキの戦いでジョロフ王を破り、カヨールを自立させた最初のダメル。在位年は諸説, source: "https://en.wikipedia.org/wiki/Amari_Ngoone_Sobel_Fall"}
    - {name: ラト・ジョール・ジョップ, title: 王（ダメル）, from: 1862, to: 1886, note: 1864年にフランスに追われ、1871年に復位した。ダカール＝サン＝ルイ鉄道の建設に反対して1882年に廃され、1886年に戦死した, source: "https://en.wikipedia.org/wiki/Lat_Dior"}
  periods:
    - from: 1648
      to: 1854
      text: ヴェール岬半島からセネガル川の手前までの大西洋岸のウォロフ人の王国（王はダメル）。ジョロフ王国から16世紀に自立した。奴隷貿易と落花生で栄え、しばしばバオルの王を兼ねた。
    - from: 1855
      to: 1886
      text: フランスのフェデルブが沿岸を押さえ、ダメルのラト・ジョールが抵抗した。ダカール＝サン＝ルイ鉄道（1885年開通）の建設をめぐる戦いで、1886年にラト・ジョールが戦死し、カヨールは併合された。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Cayor"

- id: baol
  name: バオル王国
  short: バオル
  color: "#cfd896"
  kind: 王国（ウォロフ）
  periods:
    - from: 1648
      to: 1894
      text: カヨールの南東のウォロフ人の王国（王はテイン）。19世紀後半、ムリッド教団の創始者アマドゥ・バンバがトゥーバを開いた。1894年ごろフランスに併合された。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Baol"

- id: jolof
  name: ジョロフ王国
  short: ジョロフ
  color: "#92ce83"
  kind: 王国（ウォロフ）
  names:
    - {to: 1548, name: ジョロフ王国（ジョロフ帝国）}
  rulers:
    - {name: アルブリ・ンジャイ, title: 王（ブルバ・ジョロフ）, from: 1875, to: 1890, note: フランスに抵抗し、1890年に東へ逃れてトゥクロール帝国のアフマドゥを頼った, source: "https://en.wikipedia.org/wiki/Alboury_Ndiaye"}
  periods:
    - from: 1453
      to: 1548
      text: セネガル内陸のジョロフを本拠に、ワロ・カヨール・バオル・シン・サルームなどウォロフ人・セレール人の諸王国を従えた国（王はブルバ・ジョロフ）。15世紀なかばからポルトガル人と交易した。
    - from: 1549
      to: 1647
      text: ダンキの戦い（1549）でカヨールの王子アマリ・ンゴネ・ソベルに敗れ、海岸の諸王国が自立した。ジョロフは海に出られない内陸の小王国となった。
    - from: 1648
      to: 1890
      text: かつてウォロフ人の諸王国を従えたジョロフ帝国の後身。16世紀にカヨール・ワロ・バオルが自立した後は内陸の小王国となった。1890年、フランスに併合された。
  source: "https://en.wikipedia.org/wiki/Jolof_Empire"

- id: sine
  name: シン王国
  short: シン
  color: "#d3b17e"
  kind: 王国（セレール）
  rulers:
    - {name: クンバ・ンドッフェン・ファマク・ジューフ, title: 王（マード・ア・シニグ）, from: 1853, to: 1871, note: 1867年のファンダン＝ティウティウヌの戦いでマバ・ジャフ・バを破った, source: "https://en.wikipedia.org/wiki/Kumba_Ndoffene_Famak_Joof"}
  periods:
    - from: 1648
      to: 1890
      text: セネガル中西部のセレール人の王国。イスラームのジハード（マバ・ジャフ・バ）に抵抗した。1887年にフランスの保護下に入り、のちに併合された。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Sine"

- id: saloum
  name: サルーム王国
  short: サルーム
  color: "#e6c7b7"
  kind: 王国（セレール）
  periods:
    - from: 1648
      to: 1886
      text: サルーム川流域からガンビア川北岸にかけての王国（都カオラック）。塩と奴隷の交易で栄えた。1860年代にマバ・ジャフ・バのジハードに攻められ、1887年にフランスの保護下に入った。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Saloum"

- id: rip
  name: リップ（マバ・ジャフ・バのイスラーム国家）
  short: リップ
  color: "#bfd7b5"
  kind: イスラーム国家（ジハード）
  rulers:
    - {name: マバ・ジャフ・バ, title: アルマミ, from: 1861, to: 1867, note: ガンビア川北岸のバディブとリップでジハードを起こし、サルームを攻めた。1867年にシン王国との戦いで戦死した, source: "https://en.wikipedia.org/wiki/Maba_Diakhou_Bâ"}
  periods:
    - from: 1862
      to: 1886
      text: ガンビア川北岸とセネガル南部のリップ地方に、ウォロフ・マンディンカのイスラーム改革者マバ・ジャフ・バが建てた国。その死後も一族と弟子が治めたが、1887年にフランスに下った。
  source: "https://en.wikipedia.org/wiki/Maba_Diakhou_Bâ"

- id: lebou
  name: レブー共和国（ヴェール岬）
  short: レブー
  color: "#bcd6c8"
  kind: 共和国（漁民の連合）
  periods:
    - from: 1795
      to: 1856
      text: ヴェール岬半島のレブー人（漁民）が、カヨール王国から自立して作った長老たちの共和国。1857年にフランスがダカールを占め、町を建てた。
  note: 自立の年は1790年代（要確認）。
  source: "https://en.wikipedia.org/wiki/Lebou_people"

- id: futa_toro
  name: フタ・トロ
  names:
    - {to: 1489, name: フタ・トロ（タクルール）, kind: 王国}
    - {from: 1490, to: 1775, name: フタ・トロ（デニャンケ朝）, kind: 王国}
    - {from: 1776, name: フタ・トロのイマーム国, kind: イスラーム国家（イマーム国）}
  short: フタ・トロ
  color: "#d8b98e"
  kind: 王国
  rulers:
    - {name: コリ・テンゲラ, title: デニャンケ朝の創始者（サティギ）, from: 1490, to: 1512, note: フルベを率いてフータ・ジャロンからセネガル川流域に移り、フタ・トロを征服した。年代は諸説, source: "https://en.wikipedia.org/wiki/Koli_Tenguella"}
    - {name: アブドゥル・カーディル・カン, title: アルマミ（イマーム）, from: 1776, to: 1806, note: トロドベ（フルベのイスラーム学者層）の革命でデニャンケ朝を倒した後、選ばれた最初のアルマミ, source: "https://en.wikipedia.org/wiki/Abdul_Kader_Kane"}
  periods:
    - from: 1490
      to: 1647
      text: コリ・テンゲラの率いるフルベがフタ・トロを征服してデニャンケ朝を開いた。16世紀前半には「大フーロ」としてセネガル川流域の強国となり、ジョロフやソンガイと争った。
    - from: 1648
      to: 1775
      text: セネガル川中流の両岸の、フルベ（トゥクロール）の王国。デニャンケ朝の王（サティギ）が治めたが、18世紀にはモロッコの介入やムーア人の侵入で乱れた。
    - from: 1776
      to: 1858
      text: 1776年、イスラーム学者層（トロドベ）の革命でデニャンケ朝が倒れ、選挙で選ばれるアルマミが治めるイマーム国となった。西アフリカのジハード運動の先駆けとなった。
    - from: 1859
      to: 1891
      text: ウマル・タルのジハードに多くの住民が加わって東へ移った。フランスは下流のトロ地方（1859）を併合し、1891年までに中部も併合した。
  source: "https://en.wikipedia.org/wiki/Imamate_of_Futa_Toro"

- id: bundu
  name: ブンドゥ王国
  short: ブンドゥ
  color: "#cece83"
  kind: イスラーム国家（アルマミ）
  periods:
    - from: 1699
      to: 1886
      text: セネガル川上流のファレメ川流域に、イスラーム学者マリク・シがフルベの国として建てた。セネガル川の交易路を押さえた。1887年、フランスの保護下に入った。
  note: 成立は1690年代（要確認）。
  source: "https://en.wikipedia.org/wiki/Bundu_(state)"

- id: gajaaga
  name: ガジャーガ王国（ガラム）
  short: ガジャーガ
  color: "#b0c49c"
  kind: 王国（ソニンケ）
  periods:
    - from: 1648
      to: 1857
      text: セネガル川上流（バケル周辺）のソニンケ人の王国。フランス人はガラムと呼び、金・奴隷・アラビアゴムの交易のため、サン・ジョゼフ砦（1700年ごろ）やバケル砦（1820年ごろ）を置いた。
  source: "https://en.wikipedia.org/wiki/Gajaaga"

- id: kaabu
  name: カーブ王国（ガブ）
  short: カーブ
  color: "#e2bfa0"
  kind: 王国（マンディンカ）
  periods:
    - from: 1453
      to: 1647
      text: マリ王国の西の州として、ファリム・カーブ（王の代官）がガンビア川の南の諸国を治めた。マリの衰えとともに16世紀に自立し、ポルトガル人との奴隷・布の交易で力を伸ばした。
    - from: 1648
      to: 1867
      text: 現在のギニアビサウ東部（ガブ）からセネガル南部（カザマンス）にかけてのマンディンカ人の王国（都カンサラ）。かつてのマリ帝国の西の州から自立した。奴隷貿易で栄えたが、1867年、フータ・ジャロンのフルベにカンサラを落とされて滅んだ。
  source: "https://en.wikipedia.org/wiki/Kaabu"

- id: fuladu
  name: フラドゥ
  short: フラドゥ
  color: "#d7c4a4"
  kind: 王国（フルベ）
  rulers:
    - {name: アルファ・モロ, title: 王, from: 1867, to: 1881, source: "https://en.wikipedia.org/wiki/Alfa_Molo"}
    - {name: ムーサ・モロ, title: 王, from: 1881, to: 1903, note: 1883年にフランスの保護下に入った。1903年にイギリス領ガンビアへ逃れた, source: "https://en.wikipedia.org/wiki/Musa_Molo"}
  periods:
    - from: 1867
      to: 1903
      text: カーブ王国の滅亡後、フルベのアルファ・モロがカザマンス上流からガンビア川上流にかけて建てた国。子のムーサ・モロはフランスとイギリスの間で立ち回ったが、1903年に追われた。
  source: "https://en.wikipedia.org/wiki/Fuladu"

- id: niumi
  name: ニウミ王国
  short: ニウミ
  color: "#cfe0b8"
  kind: 王国（マンディンカ）
  periods:
    - from: 1648
      to: 1893
      text: ガンビア川河口の北岸のマンディンカ人の王国（バラ）。川の入り口を押さえ、ジェームズ島のヨーロッパ人から通行料を取った。1826年に川沿いの細長い土地（「割譲の1マイル」）をイギリスに譲った。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Niumi"

- id: kombo
  name: コンボ王国
  short: コンボ
  color: "#d1e6b7"
  kind: 王国（マンディンカ）
  periods:
    - from: 1648
      to: 1893
      text: ガンビア川河口の南岸のマンディンカ人の王国。1816年にセント・メアリー島（バンジュール）をイギリスに譲り、その後も少しずつ土地を割譲した。19世紀後半、イスラームの改革派（マラブー）と伝統派（ソニンケ）の戦争が続いた。
  source: "https://en.wikipedia.org/wiki/Kombo"

- id: mandinka_states
  name: セネガンビアのマンディンカ諸国
  short: マンディンカ諸国
  color: "#bde0d8"
  kind: 小王国の集まり
  periods:
    - from: 1648
      to: 1893
      text: ガンビア川の両岸には、キアン・ジャラ・バディブ・ニアニ・ウリ・カントラなどマンディンカ人の小王国が並んだ。川の交易（奴隷・象牙・蜜ろう・落花生）で栄えた。19世紀後半にはイスラーム改革派のジハードと内戦が続いた。
  note: 地図では、ガンビア川流域とカザマンスのマンディンカ人の小王国をまとめてこの政体で描く（範囲は不確実）。
  source: "https://en.wikipedia.org/wiki/Mandinka_people"

# ================================================================ ギニア・上ニジェールのイスラーム国家
- id: futa_jallon
  name: フータ・ジャロンのイマーム国
  short: フータ・ジャロン
  color: "#db9595"
  kind: イスラーム国家（イマーム国）
  rulers:
    - {name: カラモコ・アルファ, title: アルマミ, from: 1725, to: 1751, note: ジハードを率いてイマーム国を建てた。没年は1751年ごろ（要確認）, source: "https://en.wikipedia.org/wiki/Karamokho_Alfa"}
    - {name: イブラヒマ・ソリ, title: アルマミ, from: 1751, to: 1784, note: 軍事指導者として国を固めた。以後、カラモコ・アルファの家（アルファヤ）とイブラヒマ・ソリの家（ソリヤ）が交互にアルマミを出した, source: "https://en.wikipedia.org/wiki/Ibrahim_Sori"}
    - {name: ボカル・ビロ, title: アルマミ, from: 1895, to: 1896, note: 1896年11月、ポレダカの戦いでフランス軍に敗れて殺された, source: "https://en.wikipedia.org/wiki/Bokar_Biro_Barry"}
  periods:
    - from: 1725
      to: 1850
      text: ギニア中部のフータ・ジャロン高地で、フルベのイスラーム学者がジハードを起こして建てた国（都ティンボ）。9つの州（ディワル）からなり、ラベ州が最も大きかった。周りの非イスラームの民を襲って奴隷とし、沿岸の奴隷貿易と結びついた。
    - from: 1851
      to: 1896
      text: 二つの家がアルマミを交互に出す仕組みで争いが続いた。フランスと保護条約を結んだ（1881・1888）が、1896年、ポレダカの戦いで敗れて占領された。
  source: "https://en.wikipedia.org/wiki/Imamate_of_Futa_Jallon"

- id: toucouleur
  name: トゥクロール帝国
  short: トゥクロール帝国
  color: "#dcd8b2"
  kind: イスラーム国家（ジハード）
  rulers:
    - {name: ウマル・タル, title: 指導者（ティジャーニー教団のハリーファ）, from: 1852, to: 1864, note: フタ・トロ出身のイスラーム改革者。1852年にジハードを始め、カールタ・セグー・マシナを征服した。1864年、マシナの反乱の中で死んだ, source: "https://ja.wikipedia.org/wiki/ウマル・タル"}
    - {name: アフマドゥ（アマドゥ・セク）, title: 指導者（セグー）, from: 1864, to: 1893, note: ウマルの子。1890年にフランスにセグーを奪われ、1893年に東のソコト・カリフ国へ逃れた, source: "https://en.wikipedia.org/wiki/Ahmadu_Tall"}
  periods:
    - from: 1849
      to: 1854
      text: フタ・トロ出身のウマル・タルが、メッカ巡礼から戻ってディンギラエ（ギニア）を拠点にティジャーニー教団の信徒を集め、1852年にジハードを始めた。
    - from: 1855
      to: 1864
      text: カールタ（1855）・セグー（1861）・マシナ（1862）を征服し、ニジェール川上流域に大きな国を作った。セネガル川流域ではフランスと戦った（メディーヌの包囲、1857）。1864年、マシナの反乱の中でウマルは死んだ。
    - from: 1865
      to: 1893
      text: 子のアフマドゥがセグーを、甥のティジャーニがバンディアガラ（マシナ）を治めたが、一族の争いとバンバラの反乱で弱った。1890年からフランスのアルシナールに攻められ、1893年に滅んだ。
  source: "https://ja.wikipedia.org/wiki/トゥクロール帝国"

- id: wassoulou
  name: サモリ帝国（ワスル帝国）
  short: サモリ帝国
  color: "#cea583"
  kind: 帝国（イスラーム国家）
  rulers:
    - {name: サモリ・トゥーレ, title: アルマミ（ファアマ）, from: 1878, to: 1898, note: マンディンカ人の商人の出身。1898年9月に捕らえられ、ガボンに流されて1900年に死んだ, source: "https://ja.wikipedia.org/wiki/サモリ・トゥーレ"}
  periods:
    - from: 1875
      to: 1886
      text: ギニア東部の商人サモリ・トゥーレが鉄砲で武装した常備軍を作り、上ニジェール川流域（カンカン・ワスル）を征服して帝国を建てた（1878年にファアマを称する）。1884年にイスラームの国家としてアルマミを称した。
    - from: 1887
      to: 1891
      text: フランスとの条約（ケニエバ＝クル 1886、ビサンドゥグ 1887）でニジェール川左岸を譲った。シカソのケネドゥグと戦って敗れた（1887–88）。1891年、フランス軍が本拠のビサンドゥグを落とした。
    - from: 1892
      to: 1898
      text: 焦土作戦をとって東へ移り、コートジボワール北部・ガーナ北西部に「第二の帝国」を作った（コン・ブナを破壊）。1898年9月、ゲレムで捕らえられた。西アフリカで最も長くフランスに抵抗した指導者とされる。
  source: "https://ja.wikipedia.org/wiki/サモリ帝国"

- id: mali_empire
  name: マリ王国（末期）
  names:
    - {to: 1599, name: マリ王国}
  short: マリ王国
  color: "#e6c584"
  kind: 王国（マンディンカ）
  rulers:
    - {name: マフムード2世, title: マンサ（王）, from: 1481, to: 1496, note: ポルトガル王ジョアン2世と使節を交わした。この時期のマンサの名と在位年は不確実, source: "https://en.wikipedia.org/wiki/Mali_Empire"}
    - {name: マフムード3世, title: マンサ, from: 1496, to: 1559, note: 名と在位年は不確実（要確認）, source: "https://en.wikipedia.org/wiki/Mali_Empire"}
    - {name: マフムード4世, title: マンサ, from: 1590, to: 1610, note: 1599年にジェンネを攻めてアルマに敗れた。最後の大王とされる。在位年は要確認, source: "https://en.wikipedia.org/wiki/Mahmud_IV_of_Mali"}
  periods:
    - from: 1453
      to: 1493
      text: 14世紀のマンサ・ムーサの時代に栄えたマリ王国（マリ帝国）は、15世紀には東のトンブクトゥをトゥアレグ（1433）に、ジェンネ・内陸三角州をソンガイに奪われた。西のガンビア川方面とニジェール川上流はなお治めた。
    - from: 1494
      to: 1599
      text: ソンガイ帝国に押されて西へ縮んだ。ポルトガル人と使節を交わし、ガンビア川の交易を保った。1545年ごろソンガイのアスキア・ダーウードに都を略奪され、西の州カーブも自立した。1599年、モロッコの侵入で弱ったジェンネを攻めたが敗れた。
    - from: 1648
      to: 1669
      text: 14世紀に栄えたマリ王国（マリ帝国）の末期。1599年にジェンネでの戦いに敗れた後、ニジェール川上流のマンデン（カンガバ・ニアニ）に縮み、17世紀なかばにケイタ家の小さな首長国に分かれた。
  note: 終わりの年ははっきりしない（17世紀なかば）。地図では1669年までとした。
  source: "https://ja.wikipedia.org/wiki/マリ帝国"

# ================================================================ ニジェール川中流域
- id: arma
  name: トンブクトゥのパシャ領（アルマ）
  short: アルマ
  color: "#e2daab"
  kind: パシャ領（軍人の政権）
  periods:
    - from: 1612
      to: 1647
      text: 1591年にソンガイ帝国を滅ぼしたモロッコ軍の子孫（アルマ）が、1612年からパシャを自分たちで選ぶようになり、1618年ごろにはモロッコからのパシャの派遣も絶えた（1591–1611年はモロッコ領として描く）。トンブクトゥ・ジェンネ・ガオを中心にニジェール川沿いを治めた。
    - from: 1648
      to: 1736
      text: 1591年にソンガイ帝国を滅ぼしたモロッコ軍の子孫（アルマ）が、トンブクトゥ・ジェンネ・ガオを中心に治めた政権。1612年からはパシャを自分たちで選ぶようになり、モロッコのスルタンへの従属は名ばかりとなった。
    - from: 1737
      to: 1833
      text: 1737年、トゥアレグにトヤで大敗し、パシャ領はトンブクトゥの町の政権に縮んだ。トゥアレグに貢ぎ物を納めた。19世紀にはマシナに従った。
  note: モロッコの宗主権は名目的なので、帯（overlord）は付けない。
  source: "https://en.wikipedia.org/wiki/Pashalik_of_Timbuktu"

- id: segu
  name: セグー王国（バンバラ王国）
  short: セグー
  color: "#c2d37e"
  kind: 王国（バンバラ）
  rulers:
    - {name: ビトン・クリバリ（ママリ・クリバリ）, title: 王, from: 1712, to: 1755, note: 若者の結社（トン）を常備軍に変えて国を建てた, source: "https://en.wikipedia.org/wiki/Bamana_Empire"}
    - {name: ンゴロ・ジャラ, title: 王, from: 1766, to: 1795, note: クリバリ家の後の混乱を収め、ジャラ朝を開いた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Ngolo_Diarra"}
    - {name: モンソン・ジャラ, title: 王, from: 1795, to: 1808, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Bamana_Empire"}
    - {name: ダ・モンソン・ジャラ, title: 王, from: 1808, to: 1827, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Bamana_Empire"}
  periods:
    - from: 1712
      to: 1765
      text: ニジェール川上流のセグーを都に、バンバラ人のビトン・クリバリが建てた王国。戦争で得た捕虜を兵士や奴隷とし、ジェンネやマシナにも力を及ぼした。
    - from: 1766
      to: 1860
      text: ジャラ朝のもとでトンブクトゥ近くまで勢力を広げた。19世紀前半、イスラームのマシナと争った。
    - from: 1861
      to: 1861
      text: 1861年、ウマル・タルのジハードで征服された。
  note: 1755–66年はクリバリ家の後継者争いと軍の首長たちの時代。
  source: "https://ja.wikipedia.org/wiki/バンバラ帝国"

- id: kaarta
  name: カールタ王国
  short: カールタ
  color: "#cdb87e"
  kind: 王国（バンバラ）
  periods:
    - from: 1648
      to: 1854
      text: セグーの北西、現在のマリ西部（都ニョロなど）にバンバラ人のマサシ家が建てた王国。セグー王国と争った。1854–55年、ウマル・タルに征服された。
  note: 成立は17世紀なかば（1650年ごろ）とされる（要確認）。
  source: "https://en.wikipedia.org/wiki/Kaarta"

- id: massina
  name: マシナ
  names:
    - {to: 1817, name: マシナ（フルベのアルド家）, kind: 首長国}
    - {from: 1818, name: マシナのイスラーム国家（ディーナ）, kind: イスラーム国家}
  short: マシナ
  color: "#d3a87e"
  kind: 首長国
  rulers:
    - {name: セク・アマドゥ（アフマド・ロッボ）, title: 指導者, from: 1818, to: 1845, note: ジハードを起こし、新しい都ハムダライを建てた, source: "https://en.wikipedia.org/wiki/Seku_Amadu"}
    - {name: アマドゥ・セク（アマドゥ2世）, title: 指導者, from: 1845, to: 1853, source: "https://en.wikipedia.org/wiki/Massina_Empire"}
    - {name: アマドゥ・アマドゥ（アマドゥ3世）, title: 指導者, from: 1853, to: 1862, note: 1862年にウマル・タルに敗れて殺された, source: "https://en.wikipedia.org/wiki/Massina_Empire"}
  periods:
    - from: 1648
      to: 1817
      text: ニジェール川内陸三角州のフルベの牧畜民の首長（アルド）が治めた地方。アルマやセグー王国に貢ぎ物を納めた。
    - from: 1818
      to: 1862
      text: 1818年、フルベのイスラーム学者セク・アマドゥがジハードを起こしてイスラーム国家（ディーナ）を建て、都ハムダライを築いた。トンブクトゥも従えた。1862年、ウマル・タルに滅ぼされた。
  source: "https://en.wikipedia.org/wiki/Massina_Empire"

- id: kenedougou
  name: ケネドゥグ王国
  short: ケネドゥグ
  color: "#e2abae"
  kind: 王国（セヌフォ・ジュラ）
  rulers:
    - {name: ティエバ・トラオレ, title: 王（ファアマ）, from: 1866, to: 1893, note: シカソに大きな城壁を築き、サモリの包囲（1887–88）に耐えた。即位年は要確認, source: "https://en.wikipedia.org/wiki/Tieba_Traoré"}
    - {name: バベンバ・トラオレ, title: 王（ファアマ）, from: 1893, to: 1898, note: 1898年5月、フランス軍にシカソを落とされ、自害した, source: "https://en.wikipedia.org/wiki/Babemba_Traoré"}
  periods:
    - from: 1825
      to: 1898
      text: マリ南東部のシカソを都とする、トラオレ家の王国。城壁都市シカソはサモリの長い包囲に耐えた。1898年、フランス軍に落とされた。
  note: 王国の起こりは18世紀にさかのぼるが、地図では勢力が大きくなった19世紀前半（1825年）から描く。
  source: "https://en.wikipedia.org/wiki/Kénédougou_Kingdom"

- id: kong
  name: コン帝国
  short: コン
  color: "#b1be93"
  kind: 帝国（ジュラの交易国家）
  rulers:
    - {name: セク・ワタラ, title: 王, from: 1710, to: 1745, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Kong_Empire"}
  periods:
    - from: 1710
      to: 1894
      text: コートジボワール北部のコンを都とする、ジュラ（ディウラ）商人のワタラ家の国。金とコーラの実の交易路を押さえた。一族のファマガンがボボ＝ディウラソにグウィリコを建てた。1897年、サモリに町を焼かれた。
  source: "https://en.wikipedia.org/wiki/Kong_Empire"

- id: gyaaman
  name: ギャーマン王国
  short: ギャーマン
  color: "#e7c39b"
  kind: 王国（アカン）
  periods:
    - from: 1690
      to: 1894
      text: コートジボワール北東部のボンドゥクを中心とするアブロン人（アカン系）の王国。1740年にアシャンティ王国に敗れて属国となった。1895年にサモリに占領され、1898年にフランス領となった。
  source: "https://en.wikipedia.org/wiki/Gyaaman"

- id: sanwi
  name: サンウィ王国
  short: サンウィ
  color: "#d5cfa0"
  kind: 王国（アニ）
  periods:
    - from: 1700
      to: 1842
      text: コートジボワール南東部のアニ人の王国（都クリンジャボ）。アシニーの港でヨーロッパ人と交易した。1843年にフランスの保護下に入った。
  source: "https://en.wikipedia.org/wiki/Sanwi"

# ================================================================ ボルタ川上流（ブルキナファソ）
- id: mossi
  name: モシ諸王国
  short: モシ
  color: "#d3ca7e"
  kind: 王国（モシ）
  rulers:
    - {name: ワブゴ（ブカリ・クトゥ）, title: ワガドゥグ王（モロ・ナーバ）, from: 1889, to: 1897, note: 1896年9月、フランス軍のワガドゥグ占領で都を追われた。即位年は要確認, source: "https://en.wikipedia.org/wiki/Wobgo"}
  periods:
    - from: 1453
      to: 1647
      text: 15世紀後半にワガドゥグの王国が固まり、16世紀に北のヤテンガが分かれた。騎馬の軍でニジェール川湾曲部を襲い（1477年ごろトンブクトゥ周辺、1480年ワラタ）、ソンガイと争ったが、イスラームを受け入れずに独自の王国を保った。
    - from: 1648
      to: 1895
      text: ボルタ川上流の台地（現在のブルキナファソ中部）のモシ人の諸王国。最大のワガドゥグ王国（王はモロ・ナーバ）のほか、北のヤテンガ王国（都ウアイグヤ）、南東のテンコドゴなどが並んだ。騎馬の軍で知られ、イスラームの国々の侵入を長く防いだ。
    - from: 1896
      to: 1896
      text: 1895–96年、フランスのヴーレ・シャノワーヌらの軍が王国を占領し、保護下に置いた。モロ・ナーバの位はその後も続いている。
  note: 地図ではワガドゥグ・ヤテンガ・テンコドゴなどモシの王国をまとめてこの政体で描く。
  source: "https://ja.wikipedia.org/wiki/モシ王国"

- id: gurma
  name: グルマ王国
  short: グルマ
  color: "#c38d98"
  kind: 王国（グルマ）
  periods:
    - from: 1648
      to: 1896
      text: ブルキナファソ東部のファダ・ングルマを都とするグルマ人の王国（モシと同じ起源の伝承を持つ）。1895–97年にフランスの保護下に入った。
  source: "https://en.wikipedia.org/wiki/Gurma_people"

- id: liptako
  name: リプタコ首長国
  short: リプタコ
  color: "#c4b79b"
  kind: 首長国（フルベ）
  periods:
    - from: 1810
      to: 1896
      text: ブルキナファソ北東部のドリを都とするフルベの首長国。ソコト・カリフ国のジハードに呼応して建てられ、その宗主権（グワンドゥ）のもとにあった。1897年、フランスの支配下に入った。
  source: "https://en.wikipedia.org/wiki/Liptako"

# ================================================================ ニジェール
- id: dendi
  name: デンディ（ソンガイの後継国）
