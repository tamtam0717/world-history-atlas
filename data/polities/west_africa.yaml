      text: 1591年にモロッコに敗れたソンガイ帝国のアスキア家が、ニジェール川下流（現在のニジェール南西部）に逃れて建てた国。17世紀に分裂し、テラ・ドゥアルゴル・ガヤなどにソンガイの小さな首長国が並んだ。
  note: 地図ではソンガイ人の首長国をまとめてこの政体で描く（範囲は不確実）。
