    - from: 1994
      to: 2011
      text: 「イボワール人性」をめぐって北部出身者の排除が進み、1999年にクーデタ、2002年に内戦が起きて国が南北に分かれた。2010年の大統領選挙の後の危機（2010–11）で、国連とフランスの支援を受けたワタラが勝った。
    - from: 2012
      to: 2025
      text: ワタラ大統領のもとで経済は再び高い成長を続けている。
  note: 首都は1983年にアビジャンからヤムスクロに移されたが、政府の機関の多くはアビジャンにある。
