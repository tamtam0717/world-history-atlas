  periods:
    - from: 1648
      to: 1898
      text: ニジェール川の東の台地（ザルマガンダ・ボボイェ）のザルマ人の首長国。中心の一つドッソの首長（ザルマコイ）は、19世紀にソコト・カリフ国やトゥアレグと戦い、1898年にフランスと結んだ。
  note: 地図では範囲が不確実な首長国の集まりとして描く。
  source: "https://en.wikipedia.org/wiki/Zarma_people"

- id: tuareg
  name: トゥアレグの諸連合
  short: トゥアレグ
  color: "#c2dbd6"
  kind: 遊牧の部族連合
  periods:
    - from: 1648
      to: 1736
      text: サハラ南部の遊牧民トゥアレグの部族連合（ケル・アダグ、ウッレミンデン、ケル・アイルなど）。隊商交易と牧畜を営み、オアシスや南の農民から貢ぎ物を取った。
    - from: 1737
      to: 1899
      text: 1737年にトンブクトゥのアルマを破り、ニジェール川の湾曲部（トンブクトゥ・ガオ）に力を及ぼした。19世紀はマシナ・トゥクロール帝国と争った。
    - from: 1900
      to: 1917
      text: フランスに征服された。第一次世界大戦中の1916–17年、アイルのカオセン、ウッレミンデンのフィフルンが大反乱を起こしたが鎮圧された。
  note: 地図では、トゥアレグの部族連合が支配したサハラ南部をまとめてこの政体で描く（範囲は不確実）。
  source: "https://ja.wikipedia.org/wiki/トゥアレグ"

- id: agadez
  name: アガデス・スルタン国（アイル）
  short: アガデス
  color: "#e6dfb7"
  kind: スルタン国
  periods:
    - from: 1453
      to: 1647
      text: 15世紀前半にアイルのトゥアレグの諸部族がスルタンを迎えて成立した。サハラ交易の中継地として栄え、1500–01年にソンガイ帝国に従い、16世紀にはケッビとも貢納を争った。
    - from: 1648
      to: 1905
      text: アイル山地の南のオアシス都市アガデスのスルタン国。15世紀から続き、スルタンはトゥアレグの部族連合の調停者として、サハラ縦断の隊商路を押さえた。1906年にフランスに占領された。
  source: "https://en.wikipedia.org/wiki/Sultanate_of_Agadez"

- id: damagaram
  name: ダマガラム・スルタン国（ザンデール）
  short: ダマガラム
  color: "#dcbab2"
  kind: スルタン国
  rulers:
    - {name: タニムン, title: スルタン, from: 1851, to: 1884, note: 在位年は要確認。鉄砲と大砲で武装し、周りの国を従えて国を最も大きくした, source: "https://en.wikipedia.org/wiki/Tanimoun_Dan_Souleymane"}
    - {name: アフマドゥ（アマドゥ・クラン・ダガ）, title: スルタン, from: 1893, to: 1899, note: 1898年にフランスのカズマジュ大尉を殺させた。1899年にフランス軍と戦って死んだ。名前と在位年は要確認, source: "https://en.wikipedia.org/wiki/Sultanate_of_Damagaram"}
  periods:
    - from: 1731
      to: 1892
      text: ニジェール南部のザンデールを都とするスルタン国。ボルヌ帝国の属国として生まれ、サハラ縦断交易（トリポリ・カノ）の中継地として栄えた。
    - from: 1893
      to: 1899
      text: 宗主のボルヌがラービフに滅ぼされると自立した。1899年7月にフランス軍に占領され、のちニジェール植民地の最初の首都が置かれた（1926年までザンデール）。
  source: "https://en.wikipedia.org/wiki/Sultanate_of_Damagaram"

- id: gobir
  name: ゴビル王国
  short: ゴビル
  color: "#d3867e"
