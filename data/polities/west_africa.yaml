# ================================================================ 1453–1647（W4 が追加）
- id: songhai
  name: ソンガイ王国
  names:
    - {to: 1463, name: ソンガイ王国（ガオ）, short: ソンガイ, kind: 王国}
    - {from: 1464, to: 1590, name: ソンガイ王国（ソンガイ帝国）, short: ソンガイ}
    - {from: 1591, name: ソンガイ王国（デンディの残存勢力）, short: ソンガイ}
  short: ソンガイ
  color: "#c87a5a"
  kind: 王国（帝国）
  rulers:
    - {name: スライマーン・ダーマ, title: ソンニ（王）, from: 1453, to: 1463, note: ソンニ朝。在位年は要確認, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: ソンニ・アリ, title: ソンニ（王）, from: 1464, to: 1492, note: 騎兵と川の船団でトンブクトゥ（1468）・ジェンネ（1473ごろ）を征服し、帝国を築いた, source: "https://ja.wikipedia.org/wiki/ソンニ・アリ"}
    - {name: ソンニ・バル（アブー・バクル・ダーオ）, title: ソンニ, from: 1492, to: 1493, note: イスラームへの改宗を拒み、武将ムハンマド・トゥーレに倒された, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: アスキア・ムハンマド（ムハンマド・トゥーレ）, title: アスキア（王）, from: 1493, to: 1528, note: アスキア朝を開き、イスラームを重んじて国の制度を整えた。メッカに巡礼した（1496–97）, source: "https://ja.wikipedia.org/wiki/アスキア・ムハンマド"}
    - {name: アスキア・ムーサー, title: アスキア, from: 1528, to: 1531, note: 父ムハンマドを退位させた, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: アスキア・ムハンマド・ベンカン, title: アスキア, from: 1531, to: 1537, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: アスキア・イスマーイール, title: アスキア, from: 1537, to: 1539, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: アスキア・イスハーク1世, title: アスキア, from: 1539, to: 1549, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: アスキア・ダーウード, title: アスキア, from: 1549, to: 1582, note: 帝国の最盛期。マリの都を略奪した。タガーザの岩塩をめぐりモロッコと争った, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: アスキア・ムハンマド・アルハーッジュ, title: アスキア, from: 1582, to: 1586, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: アスキア・ムハンマド・バーニ, title: アスキア, from: 1586, to: 1588, source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"}
    - {name: アスキア・イスハーク2世, title: アスキア, from: 1588, to: 1591, note: トンディビの戦い（1591）でモロッコ軍に敗れた, source: "https://ja.wikipedia.org/wiki/トンディビの戦い"}
    - {name: アスキア・ヌーフ, title: アスキア（デンディ）, from: 1591, to: 1599, note: デンディに退いてモロッコ軍に抵抗を続けた, source: "https://en.wikipedia.org/wiki/Dendi_Kingdom"}
  periods:
    - from: 1453
      to: 1463
      text: ニジェール川中流のガオを都とするソンガイ人の小王国（ソンニ朝）。14世紀にはマリ王国に従っていたが、15世紀に自立した。
    - from: 1464
      to: 1492
      text: ソンニ・アリが騎兵と川の船団で周りの国々を征服し、トンブクトゥ（1468）・ジェンネ（1473ごろ）を奪って、マリ王国に代わる西アフリカ最大の国を築いた。
    - from: 1493
      to: 1582
      text: アスキア・ムハンマドがアスキア朝を開き、イスラームを重んじて州と軍を整えた。西はセネガル川上流から東はアガデス・ハウサの国々まで勢力を広げ、トンブクトゥはイスラームの学問の中心として栄えた。
    - from: 1583
      to: 1591
      text: 王位をめぐる争いで弱まったところへ、サハラ交易の金と塩を狙うモロッコ（サアド朝）の軍が火器を持って攻め込み、トンディビの戦い（1591）で滅んだ。
    - from: 1591
      to: 1599
      text: アスキア家の一部が南のデンディに退いて抵抗を続けた（アスキア・ヌーフ）。のちソンガイの後継国デンディとなった。
  note: 高校世界史では「ソンガイ王国」。1599年からは後継国 dendi で描く。
  source: "https://ja.wikipedia.org/wiki/ソンガイ帝国"

