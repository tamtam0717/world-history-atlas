      text: 1991年8月に独立を宣言し、12月にミンスク郊外のベロヴェーシの森でロシア・ウクライナとともにソ連の解体と独立国家共同体（CIS）の結成を決めた。CISの本部はミンスクに置かれた。
    - from: 1994
      to: 2019
      text: ルカシェンコ大統領が権限を強め、国営企業中心の経済を保ちながらロシアとの連合国家（1999年の条約）を進めた。「ヨーロッパ最後の独裁国家」と呼ばれ、欧米の制裁を受けた。
    - from: 2020
      text: 2020年8月の大統領選挙の不正に抗議する大規模なデモが起きたが、厳しく弾圧された。2022年のロシアのウクライナ侵攻では領土をロシア軍の出撃に使わせ、2023年にはロシアの戦術核兵器の配備を受け入れた。
  note: >-
    1918年3月のベラルーシ人民共和国はドイツ占領下で宣言されたが実効支配を持たず、地図には描かない。1919–1991年はソヴィエト・ロシア、のちソ連の一部（白ロシア社会主義ソヴィエト共和国。副ラベル）として描く。白ロシア共和国は1945年に国際連合の原加盟国となった。
  source:
    - "https://ja.wikipedia.org/wiki/ベラルーシ"
    - "https://ja.wikipedia.org/wiki/ベラルーシの歴史"

