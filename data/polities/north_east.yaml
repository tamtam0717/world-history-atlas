      to: 1828
      text: 北西カフカスのチェルケス人（アディゲ人）の諸部族。統一国家はなく、オスマン帝国とクリミア＝ハン国が宗主権を主張した。
    - from: 1829
      to: 1864
      text: アドリアノープル条約でオスマン帝国が黒海東岸をロシアに譲ったが、チェルケス人は服属せずに抵抗を続けた（カフカス戦争）。1864年に最後の抵抗が崩れ、数十万人がオスマン帝国へ追放・移住させられた。
  source: "https://ja.wikipedia.org/wiki/チェルケス人"

- id: kabarda
