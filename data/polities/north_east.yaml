    - {name: アラル・カリス, title: 大統領, from: 2021, source: "https://en.wikipedia.org/wiki/Alar_Karis"}
  periods:
    - from: 1918
      to: 1920
      text: 1918年2月にドイツ軍の進駐の前日に独立を宣言した。ドイツ軍の撤退後、赤軍の侵攻を退け（独立戦争）、1920年のタルトゥ条約でソヴィエト・ロシアに独立を認めさせた。
    - from: 1921
      to: 1939
      text: 土地改革でバルト・ドイツ人の貴族の大農場を農民に分けた。議会の力が強く政権が短命だったため、1934年にパッツがクーデターで権威主義体制をしいた。1939年9月、ソ連に迫られて相互援助条約を結び、ソ連軍の基地を受け入れた。
    - from: 1991
      text: 1988年からの「歌う革命」を経て、1991年8月のソ連のクーデター失敗の際に独立を回復した。急速な市場経済化と電子政府の整備で知られ、2004年にNATOとEUに加盟し、2011年にユーロを導入した。人口の約4分の1を占めるロシア系住民の国籍と言語が課題となっている。
  note: >-
    元首の欄：1920–1934年は首相を兼ねる「国家元首」、1992年以後は大統領を書いた（大統領は議会が選ぶ儀礼的な元首で、実権は首相にある。主な首相はラール 1992–1994・1999–2002、アンシプ 2005–2014、カヤ・カッラス 2021–2024）。1920年代の国家元首の任期は月単位で入れ替わるため、年は要確認。
    1940–1941年と1944–1991年はソ連（エストニア社会主義ソヴィエト共和国。副ラベル）として描く。欧米の多くの国はソ連の併合を認めなかった。
  source:
    - "https://ja.wikipedia.org/wiki/エストニアの歴史"
    - "https://en.wikipedia.org/wiki/State_Elder_of_Estonia"

