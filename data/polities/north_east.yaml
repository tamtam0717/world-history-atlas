    - from: 1768
      to: 1783
      text: 露土戦争の結果、キュチュク・カイナルジ条約でオスマン帝国から独立。ロシアの後押しでシャヒン・ギレイがハンとなるが反乱が続き、1783年にロシアに併合された。
  note: 在位年は記憶にもとづく。複数回在位したハンが多く、細部は要確認
  source: "https://ja.wikipedia.org/wiki/クリミア・ハン国"

- id: nogai
  name: ノガイ・オルダ（ノガイ人の遊牧諸集団）
  short: ノガイ
  color: "#dcd7ab"
  kind: 遊牧集団
  periods:
    - from: 1648
      to: 1783
      text: 黒海北岸からクバンにかけて遊牧するノガイ人の集団（ブジャク、イェディサン、イェディチクル、ジャンボイルク、クバンなど）。クリミア＝ハン国の支配下にあった。
  source: "https://ja.wikipedia.org/wiki/ノガイ・オルダ"

- id: cossack_hetmanate
  name: ヘトマン国家（ザポロージャ・コサック軍）
  short: ヘトマン国家
  color: "#a9c8e2"
  kind: コサック国家
  rulers:
    - {name: ボフダン・フメリニツキー, title: ヘトマン, from: 1648, to: 1657, source: "https://ja.wikipedia.org/wiki/ボフダン・フメリニツキー"}
    - {name: イヴァン・ヴィホウシキー, title: ヘトマン, from: 1657, to: 1659}
    - {name: ユーリー・フメリニツキー, title: ヘトマン, from: 1659, to: 1663}
    - {name: イヴァン・ブリュホヴェツキー, title: 左岸ヘトマン, from: 1663, to: 1668}
    - {name: デミヤン・ムノホフリシュヌイ, title: 左岸ヘトマン, from: 1669, to: 1672}
    - {name: イヴァン・サモイロヴィチ, title: 左岸ヘトマン, from: 1672, to: 1687}
    - {name: イヴァン・マゼパ, title: ヘトマン, from: 1687, to: 1708, source: "https://ja.wikipedia.org/wiki/イヴァン・マゼーパ"}
    - {name: イヴァン・スコロパツキー, title: ヘトマン, from: 1708, to: 1722}
    - {name: ダニーロ・アポストル, title: ヘトマン, from: 1727, to: 1734}
    - {name: キリロ・ロズモウシキー, title: ヘトマン, from: 1750, to: 1764}
  periods:
    - from: 1648
      to: 1657
      text: フメリニツキーの乱でポーランドの支配を脱し、コサックの国家をつくる。1654年のペレヤスラフ協定でロシアの保護下に入った。
    - from: 1657
      to: 1687
      text: 「荒廃（ルイーナ）」の時代。ヘトマンがポーランド・ロシア・オスマン帝国の間で揺れ、アンドルソヴォ条約（1667）でドニエプル川の左岸と右岸に分かれた。
    - from: 1687
      to: 1709
      text: マゼパがヘトマンとして左岸を治める。大北方戦争でスウェーデン側についたが、ポルタヴァの敗北で亡命した。
    - from: 1709
      to: 1764
      text: ロシアの統制が強まり、ヘトマンが置かれない時期もあった（小ロシア参議会・ヘトマン政府）。1764年にエカチェリーナ2世がヘトマン制を廃止した。
  note: 1722–1727年と1734–1750年はヘトマン空位（1722–23年はポルボトークが代行）。1663年以後は左岸のヘトマンを記した。右岸は right_bank_hetmanate を参照
  source: "https://ja.wikipedia.org/wiki/ヘーチマン国家"

- id: right_bank_hetmanate
  name: 右岸ヘトマン国家
  short: 右岸コサック
  color: "#bad5ea"
  kind: コサック国家
  rulers:
    - {name: パウロ・テテリャ, title: 右岸ヘトマン, from: 1663, to: 1665}
    - {name: ペトロ・ドロシェンコ, title: 右岸ヘトマン, from: 1665, to: 1676}
    - {name: ユーリー・フメリニツキー, title: 「サルマティア公」（オスマン帝国が擁立）, from: 1677, to: 1681}
  periods:
    - from: 1665
      to: 1676
      text: ドロシェンコがオスマン帝国の宗主権を受け入れて右岸ウクライナを支配し、左岸との統一を目指したが、1676年にロシアに降伏した。
  source: "https://ja.wikipedia.org/wiki/ペトロ・ドロシェンコ"

- id: zaporozhian_sich
  name: ザポロージャ・シーチ
  short: シーチ
  color: "#93bccb"
  kind: コサック共同体
  periods:
    - from: 1648
      to: 1709
      text: ドニエプル川の早瀬の下流にあるコサックの本営と、その周辺の草原。フメリニツキーの乱の拠点となった。
    - from: 1709
      to: 1734
      text: マゼパに従ったためロシア軍にシーチを破壊され、クリミア＝ハンの保護下（オレシキ）に移った。
    - from: 1734
      to: 1775
      text: ロシアの保護下に戻り（新シーチ）、草原の開拓を進めた。1775年、露土戦争後にロシア軍が解体した。
  source: "https://ja.wikipedia.org/wiki/ザポロージャ・シーチ"

- id: don_cossacks
  name: ドン・コサック軍
  short: ドン・コサック
  color: "#c2b294"
  kind: コサック共同体
  periods:
    - from: 1648
      to: 1815
      text: ドン川流域のコサックの自治共同体。1671年にロシア皇帝への忠誠を誓い、しだいにロシアの軍事組織に組み込まれた。ステンカ・ラージンの乱（1670–71）、ブラーヴィンの乱（1707–08）の拠点。
  source: "https://ja.wikipedia.org/wiki/ドン・コサック"

- id: kalmyk
  name: カルムイク＝ハン国
  short: カルムイク
  color: "#dbc79e"
  kind: ハン国
  periods:
    - from: 1648
      to: 1771
      text: 17世紀前半にジュンガリアから移ってきたオイラト系の遊牧民の国。ロシアの宗主権を受け入れて南の国境を守った。1771年に多くが中央アジアへ帰還し、ハン国は廃止された。
  source: "https://ja.wikipedia.org/wiki/カルムイク・ハン国"

- id: circassia
  name: チェルケス
  short: チェルケス
  color: "#b7c9a2"
  kind: 部族連合
  periods:
    - from: 1648
      to: 1815
      text: 北西カフカスのチェルケス人（アディゲ人）の諸部族。統一国家はなく、オスマン帝国とクリミア＝ハン国が宗主権を主張した。
  source: "https://ja.wikipedia.org/wiki/チェルケス人"

- id: kabarda
  name: カバルダ
  short: カバルダ
  color: "#abbd98"
  kind: 公国（諸侯連合）
  periods:
    - from: 1648
      to: 1815
      text: 中部カフカスのチェルケス系カバルダ人の諸侯の国。ロシアとクリミア＝ハン国の間で揺れ、1774年にロシアへの帰属が認められた。
  source: "https://ja.wikipedia.org/wiki/カバルダ"

- id: warsaw
  name: ワルシャワ公国
  short: ワルシャワ公国
  color: "#e6a2b7"
  kind: 公国
  rulers:
    - {name: フリードリヒ・アウグスト1世, title: ワルシャワ公（ザクセン王）, from: 1807, to: 1815, source: "https://ja.wikipedia.org/wiki/フリードリヒ・アウグスト1世_(ザクセン王)"}
  periods:
    - from: 1807
      to: 1809
      text: ティルジット条約で、プロイセンが第2・3回分割で得た地域からつくられた。ナポレオン法典が導入され、農奴制が廃止された。
    - from: 1809
      to: 1812
      text: オーストリアとの戦争に勝ち、シェーンブルン条約で西ガリツィア（クラクフ・ルブリン）とザモシチ地区を得た。
    - from: 1812
      to: 1815
      text: ロシア遠征に大軍を送った。ナポレオンの敗退後はロシア軍に占領され、ウィーン会議で分割された。
  source: "https://ja.wikipedia.org/wiki/ワルシャワ公国"

- id: congress_poland
  name: ポーランド立憲王国
  short: ポーランド王国
  color: "#e3b3c3"
  kind: 王国（ロシア皇帝が国王）
  rulers:
    - {name: アレクサンドル1世, title: ポーランド王（ロシア皇帝）, from: 1815, to: 1825, source: "https://ja.wikipedia.org/wiki/アレクサンドル1世"}
  periods:
    - from: 1815
      to: 1815
      text: ウィーン議定書でワルシャワ公国の大部分からつくられ、ロシア皇帝が国王を兼ねた。独自の憲法・議会・軍隊を持つ。
  source: "https://ja.wikipedia.org/wiki/ポーランド立憲王国"

- id: krakow
  name: クラクフ自由市
  short: クラクフ
  color: "#d5a0b9"
  kind: 共和国（自由市）
  periods:
    - from: 1815
      to: 1815
      text: ウィーン議定書で、ロシア・プロイセン・オーストリアの保護下の自由市とされた。
  source: "https://ja.wikipedia.org/wiki/クラクフ自由市"

- id: danzig
  name: ダンツィヒ自由市
  short: ダンツィヒ
  color: "#c4b4d4"
  kind: 共和国（自由市）
  periods:
    - from: 1807
      to: 1813
      text: ティルジット条約でプロイセンから切り離され、フランスの保護下の自由市となった。1813年、包囲戦の末にフランス軍が降伏した。
  source: "https://ja.wikipedia.org/wiki/ダンツィヒ自由市_(ナポレオン時代)"

- id: finland
  name: フィンランド大公国
  short: フィンランド
  color: "#bdcfb6"
  kind: 大公国（ロシア皇帝が大公）
  rulers:
    - {name: アレクサンドル1世, title: フィンランド大公（ロシア皇帝）, from: 1809, to: 1825, source: "https://ja.wikipedia.org/wiki/アレクサンドル1世"}
  periods:
    - from: 1809
      to: 1815
      text: フィンランド戦争の結果ロシアに割譲され、ポルヴォー議会でスウェーデン時代の法と身分制議会が保障された。1812年に「旧フィンランド」を編入し、首都をトゥルクからヘルシンキに移すことが決まった。
  source: "https://ja.wikipedia.org/wiki/フィンランド大公国"
