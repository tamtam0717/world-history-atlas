  source: "https://ja.wikipedia.org/wiki/中部リトアニア共和国"

- id: ukraine
  name: ウクライナ
  short: ウクライナ
  color: "#a9c8e2"
  kind: 共和国（大統領制）
  names:
    - {to: 1920, name: ウクライナ人民共和国, kind: 共和国（1918年4–12月はスコロパツキーのウクライナ国。1919年からペトリューラのディレクトーリア）}
    - {from: 1991, name: ウクライナ, kind: 共和国（大統領制）}
  rulers:
    - {name: ミハイロ・フルシェフスキー, title: 中央ラーダ議長, from: 1917, to: 1918, note: 歴史家。1917年11月に人民共和国を宣言し、1918年1月に独立を宣言した, source: "https://ja.wikipedia.org/wiki/ミハイロ・フルシェフスキー"}
    - {name: パウロ・スコロパツキー, title: ヘトマン（ウクライナ国）, from: 1918, to: 1918, note: 1918年4月、ドイツ軍の後押しで中央ラーダを倒した。12月にドイツ軍の撤退とともに倒れた, source: "https://ja.wikipedia.org/wiki/パウロ・スコロパドスキー"}
    - {name: シモン・ペトリューラ, title: ディレクトーリア（執政府）の首班, from: 1918, to: 1920, note: 1918年12月に人民共和国を回復。1919年以後は赤軍・白軍・ポーランドと戦って領土を失った, source: "https://ja.wikipedia.org/wiki/シモン・ペトリューラ"}
    - {name: レオニード・クラフチュク, title: 大統領, from: 1991, to: 1994, source: "https://ja.wikipedia.org/wiki/レオニード・クラフチュク"}
    - {name: レオニード・クチマ, title: 大統領, from: 1994, to: 2005, source: "https://ja.wikipedia.org/wiki/レオニード・クチマ"}
    - {name: ヴィクトル・ユシチェンコ, title: 大統領, from: 2005, to: 2010, note: オレンジ革命（2004）で就任, source: "https://ja.wikipedia.org/wiki/ヴィクトル・ユシチェンコ"}
    - {name: ヴィクトル・ヤヌコーヴィチ, title: 大統領, from: 2010, to: 2014, note: 2014年2月のマイダン革命でロシアへ逃れた, source: "https://ja.wikipedia.org/wiki/ヴィクトル・ヤヌコーヴィチ"}
    - {name: オレクサンドル・トゥルチノフ, title: 大統領代行, from: 2014, to: 2014, source: "https://en.wikipedia.org/wiki/Oleksandr_Turchynov"}
    - {name: ペトロ・ポロシェンコ, title: 大統領, from: 2014, to: 2019, source: "https://ja.wikipedia.org/wiki/ペトロ・ポロシェンコ"}
    - {name: ヴォロディミル・ゼレンスキー, title: 大統領, from: 2019, note: 2022年からの戦時体制（戒厳令）のもとで選挙は延期されている, source: "https://ja.wikipedia.org/wiki/ウォロディミル・ゼレンスキー"}
  periods:
    - from: 1917
      to: 1918
      text: ロシア革命のなかでキエフの中央ラーダがウクライナ人民共和国を宣言し、1918年1月に独立した。ブレスト＝リトフスク条約で同盟国に承認されてドイツ・オーストリア軍を迎えたが、4月にドイツの後押しでスコロパツキーのヘトマン政権に代わった。12月にペトリューラらが人民共和国を回復した。
    - from: 1919
      to: 1920
      text: 赤軍・白軍（デニーキン）・ポーランド・無政府主義者マフノの軍などが入り乱れて戦い、1920年までに大部分をボリシェヴィキが押さえてウクライナ社会主義ソヴィエト共和国が成立した（1922年にソ連の構成国となる）。ガリツィアなど西部はポーランド領となった。
    - from: 1991
      to: 2013
      text: 1991年8月に独立を宣言し、12月の国民投票で9割が独立を支持した。ソ連から受け継いだ核兵器を放棄した（1994年のブダペスト覚書）。親欧米と親ロシアの路線の間で揺れ、2004年の大統領選挙の不正をめぐってオレンジ革命が起きた。
    - from: 2014
      to: 2021
      text: EUとの連合協定を見送ったヤヌコーヴィチ政権がマイダン革命で倒れると、ロシアはクリミアを併合し、東部ドンバスでは親ロシア派の武装勢力が「人民共和国」を名乗って戦闘となった（ミンスク合意）。
    - from: 2022
      text: 2022年2月24日、ロシアが全面侵攻を始めた。首都キーウの攻略は退けたが、南部・東部の一部を占領され、多くの民間人が犠牲となり、数百万人が国外へ避難した。欧米の支援を受けて戦いが続いている。
  note: >-
    元首の欄には大統領を書いた（大統領と首相が権限を分け合う半大統領制だが、外交・軍事は大統領が握る）。
    1919–1991年のウクライナ（ウクライナ社会主義ソヴィエト共和国）は、ソ連（1922–）またはソヴィエト・ロシアの一部として描き、名前は副ラベルで示す。1918–1919年の西ウクライナ人民共和国は west_ukraine。
  source:
    - "https://ja.wikipedia.org/wiki/ウクライナ人民共和国"
    - "https://ja.wikipedia.org/wiki/ウクライナの歴史"

