    - {name: グスタフ3世, title: スウェーデン王, from: 1771, to: 1792, source: "https://ja.wikipedia.org/wiki/グスタフ3世_(スウェーデン王)"}
    - {name: グスタフ4世アドルフ, title: スウェーデン王, from: 1792, to: 1809, source: "https://ja.wikipedia.org/wiki/グスタフ4世アドルフ_(スウェーデン王)"}
    - {name: カール13世, title: スウェーデン王（1814年からノルウェー王を兼ねる）, from: 1809, to: 1818, source: "https://ja.wikipedia.org/wiki/カール13世_(スウェーデン王)"}
