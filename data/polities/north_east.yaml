    - {name: アントン・デニーキン, title: 義勇軍司令官・南ロシア軍総司令官, from: 1918, to: 1920, source: "https://ja.wikipedia.org/wiki/アントーン・デニーキン"}
    - {name: アレクサンドル・コルチャーク, title: 最高執政官（オムスク政府）, from: 1918, to: 1920, note: 1918年11月から。1920年2月にイルクーツクで処刑, source: "https://ja.wikipedia.org/wiki/アレクサンドル・コルチャーク"}
    - {name: ピョートル・ヴランゲリ, title: 南ロシア政府・ロシア軍総司令官, from: 1920, to: 1920, note: クリミアに拠ったが、11月に撤退した, source: "https://ja.wikipedia.org/wiki/ピョートル・ヴラーンゲリ"}
  periods:
    - from: 1917
      to: 1918
      text: 十月革命の後、旧軍の将校やドン・クバンのコサックが南ロシアで義勇軍を組織した。1918年5月のチェコ軍団の反乱を機に、ヴォルガ・ウラル・シベリアに反ボリシェヴィキの政府が生まれ、連合国（イギリス・フランス・アメリカ・日本）も干渉軍を送った。
    - from: 1919
      to: 1920
      text: 1919年、東のコルチャーク、南のデニーキン、北西のユデーニチがモスクワとペトログラードを目指したが、互いの連携を欠き、農民や少数民族の支持も得られずに赤軍に敗れた。1920年11月、ヴランゲリの軍がクリミアから撤退して内戦はほぼ終わった。
  note: >-
    地図では、白軍の各政府（南ロシアの義勇軍・ドン軍、オムスクのコルチャーク政府、北部州政府など）の支配地を、まとめて1つの勢力として年末の状態で描き、境界は前線が動いたため不確実（斜線）とした。
  source:
    - "https://ja.wikipedia.org/wiki/白軍"
    - "https://ja.wikipedia.org/wiki/ロシア内戦"

- id: mountain_republic
