    - {name: ニコライ1世, title: 皇帝, from: 1825, to: 1855, source: "https://ja.wikipedia.org/wiki/ニコライ1世"}
    - {name: アレクサンドル2世, title: 皇帝, from: 1855, to: 1881, source: "https://ja.wikipedia.org/wiki/アレクサンドル2世"}
    - {name: アレクサンドル3世, title: 皇帝, from: 1881, to: 1894, source: "https://ja.wikipedia.org/wiki/アレクサンドル3世"}
    - {name: ニコライ2世, title: 皇帝, from: 1894, to: 1917, source: "https://ja.wikipedia.org/wiki/ニコライ2世"}
    - {name: ゲオルギー・リヴォフ, title: 臨時政府首相, from: 1917, to: 1917, note: 二月革命（3月）で成立した臨時政府の首相。7月に辞任, source: "https://ja.wikipedia.org/wiki/ゲオルギー・リヴォフ"}
    - {name: アレクサンドル・ケレンスキー, title: 臨時政府首相, from: 1917, to: 1917, note: 社会革命党。7月から十月革命（11月）まで, source: "https://ja.wikipedia.org/wiki/アレクサンドル・ケレンスキー"}
