    - {name: クリスチャウン・エルドヤウルン, title: 大統領, from: 1968, to: 1980, source: "https://en.wikipedia.org/wiki/Kristján_Eldjárn"}
    - {name: ヴィグディス・フィンボガドゥティル, title: 大統領, from: 1980, to: 1996, note: 直接選挙で選ばれた世界初の女性の元首, source: "https://ja.wikipedia.org/wiki/ヴィグディス・フィンボガドゥティル"}
    - {name: オウラヴル・ラグナル・グリムソン, title: 大統領, from: 1996, to: 2016, source: "https://en.wikipedia.org/wiki/Ólafur_Ragnar_Grímsson"}
    - {name: グズニ・ヨハネソン, title: 大統領, from: 2016, to: 2024, source: "https://en.wikipedia.org/wiki/Guðni_Th._Jóhannesson"}
    - {name: ハトラ・トーマスドゥティル, title: 大統領, from: 2024, source: "https://en.wikipedia.org/wiki/Halla_Tómasdóttir"}
  periods:
    - from: 1918
      to: 1939
      text: 1918年12月のデンマーク＝アイスランド連合法で、デンマーク王を国王とする主権国家（アイスランド王国）となった。外交と沿岸警備はデンマークに任せ、永世中立を宣言した。
    - from: 1940
      to: 1945
      text: 1940年4月にデンマークがドイツに占領されると自ら外交を担い、5月にイギリス軍に占領された。1941年からは協定によりアメリカ軍が駐留を引き継いだ。1944年6月17日、国民投票を経て共和国となった。
    - from: 1946
      text: 1949年に北大西洋条約機構（NATO）に原加盟国として加わったが、軍隊は持たない。漁業水域をめぐってイギリスと「タラ戦争」（1958–1976）を戦い、200海里を認めさせた。2008年の金融危機で大手銀行が破綻した。EUには加盟していない。
  note: >-
    政体の定義は F、アイスランドのピース（地域 iceland）は西欧担当 A が書いた。元首の欄は国王・大統領を書いた（議会制で、実権は首相にある）。
  source:
    - "https://ja.wikipedia.org/wiki/アイスランド王国"
    - "https://ja.wikipedia.org/wiki/アイスランドの歴史"

