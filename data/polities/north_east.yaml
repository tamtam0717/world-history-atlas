    - from: 1809
      to: 1815
      text: フィンランド戦争の結果ロシアに割譲され、ポルヴォー議会でスウェーデン時代の法と身分制議会が保障された。1812年に「旧フィンランド」を編入し、首都をトゥルクからヘルシンキに移すことが決まった。
    - from: 1816
      to: 1862
      text: ロシア皇帝を大公とする自治の大公国。身分制議会は開かれなかったが、元老院（セナーッティ）が行政を担った。民族叙事詩『カレワラ』の刊行（1835）など、フィンランド人の民族意識が育った。
    - from: 1863
      to: 1898
      text: アレクサンドル2世が身分制議会を再開し、フィンランド語が公用語として認められた（1863）。独自の通貨マルッカ（1860）や軍隊を持ち、自治が最も広がった時期。
    - from: 1899
      to: 1914
      text: 二月宣言（1899）からロシア化政策が強まり、自治が脅かされた。1905年の大ストライキで譲歩を引き出し、1906年に男女普通選挙による一院制議会（エドゥスクンタ）が生まれた。その後ふたたびロシア化が進んだ。
    - from: 1917
      to: 1918
      text: ロシア革命のなかで1917年12月6日に独立を宣言した。1918年1–5月の内戦で、マンネルヘイムの白衛軍がドイツ軍の助けを得て赤衛軍を破った。同年秋にドイツの王子を国王に選んだが、ドイツの敗戦で辞退し、共和国となった。
    - from: 1919
      to: 1938
      text: 1919年の憲法で強い権限を持つ大統領制の共和国となった。1920年のタルトゥ条約でペツァモを得て北極海に出た。1921年、国際連盟の裁定でオーランド諸島の領有が認められた（自治と非武装が条件）。右翼のラプア運動が起きたが、議会政治は保たれた。
    - from: 1939
      to: 1944
      text: 1939年11月にソ連に攻め込まれ（冬戦争）、1940年3月の講和でカレリア地峡などを失った。1941年からドイツとともにソ連と戦い（継続戦争）、失地を取り戻して東カレリアを占領したが、1944年9月の休戦で再び割譲し、ペツァモも失った。
    - from: 1945
      to: 1990
      text: 賠償を払い終え、1948年にソ連と友好協力相互援助条約を結んだ。西側の議会制民主主義と市場経済を保ちながらソ連に配慮する外交（「フィンランド化」）をとり、パーシキヴィ・ケッコネン大統領のもとで中立を守った。1975年にヘルシンキで全欧安全保障協力会議が開かれた。
    - from: 1991
      text: ソ連の解体で深刻な不況に陥ったが、情報通信産業で立ち直った。1995年にヨーロッパ連合（EU）に加盟し、北欧で唯一ユーロを導入した。2000年の新憲法で大統領の権限を弱めた。ロシアのウクライナ侵攻を受けて2023年4月に北大西洋条約機構（NATO）に加盟した。
  note: 1917年の独立後の元首の欄には大統領を書いた（2000年の憲法改正までは外交などに強い権限を持った）。1920–1944年にフィンランド領だったペツァモは、ムルマンスク州のピースが大きすぎるため地図には描いていない。冬戦争後にソ連が租借したハンコ（1940–1941）と、継続戦争後のポルッカラ（1944–1956）もピースの都合で描いていない
  source:
    - "https://ja.wikipedia.org/wiki/フィンランド大公国"
    - "https://ja.wikipedia.org/wiki/フィンランドの歴史"

- id: caucasian_imamate
  name: コーカサス・イマーム国
  short: イマーム国
  color: "#a3c4a8"
  kind: イマーム国（イスラーム神権国家）
  rulers:
    - {name: ガーズィー・ムハンマド, title: イマーム, from: 1828, to: 1832, source: "https://en.wikipedia.org/wiki/Ghazi_Muhammad"}
    - {name: ガムザト・ベク, title: イマーム, from: 1832, to: 1834, source: "https://en.wikipedia.org/wiki/Hamzat_Bek"}
    - {name: シャミール, title: イマーム, from: 1834, to: 1859, source: "https://ja.wikipedia.org/wiki/イマーム・シャミール"}
  periods:
    - from: 1834
      to: 1845
      text: ダゲスタンとチェチェンの山岳民が、スーフィー教団（ナクシュバンディー教団）の指導者シャミールのもとでロシアへの聖戦を戦う。1840年にチェチェンが加わり、1840年代半ばに最大の勢力となった。
    - from: 1846
      to: 1859
      text: ロシア軍は森林を切り開き、要塞線を築いて山地を少しずつ囲い込んだ。クリミア戦争後に攻勢が強まり、1859年にシャミールがグニブで降伏してイマーム国は滅んだ。
  note: 地図ではダゲスタン山地（1834–）とチェチェン（1840–）をイマーム国として描く。領域は戦況で大きく変わった
  source: "https://ja.wikipedia.org/wiki/コーカサス・イマーム国"

