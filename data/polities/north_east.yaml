  rulers:
    - {name: アレクサンドル1世, title: ポーランド王（ロシア皇帝）, from: 1815, to: 1825, source: "https://ja.wikipedia.org/wiki/アレクサンドル1世"}
    - {name: ニコライ1世, title: ポーランド王（ロシア皇帝）, from: 1825, to: 1855, note: 1831年1月、蜂起側の議会が廃位を宣言した, source: "https://ja.wikipedia.org/wiki/ニコライ1世"}
    - {name: アレクサンドル2世, title: ポーランド王（ロシア皇帝）, from: 1855, to: 1881, note: 1867年に王国の独自の行政が廃止され、地図ではロシア（russia）として描く, source: "https://ja.wikipedia.org/wiki/アレクサンドル2世"}
  periods:
    - from: 1815
      to: 1829
      text: ウィーン議定書でワルシャワ公国の大部分からつくられ、ロシア皇帝が国王を兼ねた。独自の憲法・議会・軍隊を持つが、皇帝の弟コンスタンチン大公が軍を握り、憲法はしだいに守られなくなった。
    - from: 1830
      to: 1831
      text: 十一月蜂起。ワルシャワの士官候補生の蜂起から対ロシア戦争となり、議会はニコライ1世の廃位を宣言したが、1831年9月にワルシャワが陥落した。多くの指導者が国外に亡命した（大亡命）。
    - from: 1832
      to: 1862
      text: 「組織規程」で憲法・議会・軍隊が廃止され、総督パスケーヴィチのもとでロシアの直接の支配が強まった。ワルシャワ大学も閉鎖された。
    - from: 1863
      to: 1867
      text: 一月蜂起（1863–64）。ゲリラ戦はリトアニア・ベラルーシにも広がったが鎮圧された。ロシアは農民に土地を与えてシュラフタ（貴族）から切り離し、1867年までに王国の独自の機関を廃止した。
  source: "https://ja.wikipedia.org/wiki/ポーランド立憲王国"

