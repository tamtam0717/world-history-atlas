      to: 1821
      text: 中部カフカスのチェルケス系カバルダ人の諸侯の国。ロシアとクリミア＝ハン国の間で揺れ、1774年にロシアへの帰属が認められた。1820年代初めにエルモロフの遠征で自立を失った。
  source: "https://ja.wikipedia.org/wiki/カバルダ"

- id: warsaw
  name: ワルシャワ公国
  short: ワルシャワ公国
