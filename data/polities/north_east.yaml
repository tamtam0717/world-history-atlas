    - {name: アレクサンドラス・ストゥルギンスキス, title: 憲法制定議会議長（大統領代行）・大統領, from: 1920, to: 1926, source: "https://en.wikipedia.org/wiki/Aleksandras_Stulginskis"}
    - {name: カジス・グリニュス, title: 大統領, from: 1926, to: 1926, note: 1926年12月のクーデターで退いた, source: "https://en.wikipedia.org/wiki/Kazys_Grinius"}
    - {name: アンタナス・スメトナ, title: 大統領, from: 1926, to: 1940, note: 1926年12月のクーデターで復帰し、権威主義体制をしいた。1940年のソ連軍の進駐で亡命, source: "https://ja.wikipedia.org/wiki/アンタナス・スメトナ"}
    - {name: ヴィータウタス・ランズベルギス, title: 最高会議議長, from: 1990, to: 1992, note: 1990年3月11日、ソ連の構成国で最初に独立回復を宣言した, source: "https://ja.wikipedia.org/wiki/ヴィータウタス・ランズベルギス"}
    - {name: アルギルダス・ブラザウスカス, title: 大統領, from: 1993, to: 1998, note: 1992年11月から議長として元首を務めた, source: "https://en.wikipedia.org/wiki/Algirdas_Brazauskas"}
    - {name: ヴァルダス・アダムクス, title: 大統領, from: 1998, to: 2003, source: "https://ja.wikipedia.org/wiki/ヴァルダス・アダムクス"}
    - {name: ロランダス・パクサス, title: 大統領, from: 2003, to: 2004, note: 2004年4月に弾劾で罷免された, source: "https://en.wikipedia.org/wiki/Rolandas_Paksas"}
    - {name: ヴァルダス・アダムクス, title: 大統領, from: 2004, to: 2009, source: "https://ja.wikipedia.org/wiki/ヴァルダス・アダムクス"}
    - {name: ダリア・グリバウスカイテ, title: 大統領, from: 2009, to: 2019, source: "https://ja.wikipedia.org/wiki/ダリア・グリバウスカイテ"}
    - {name: ギタナス・ナウセーダ, title: 大統領, from: 2019, source: "https://en.wikipedia.org/wiki/Gitanas_Nausėda"}
  periods:
    - from: 1918
      to: 1922
      text: 1918年2月にドイツ占領下で独立を宣言した。ボリシェヴィキやポーランドと戦い、1920年のモスクワ条約でソヴィエト・ロシアに承認された。しかし同年10月に歴史的な首都ヴィリニュスをポーランド軍に奪われ（中部リトアニア）、カウナスを「臨時首都」とした。
    - from: 1923
      to: 1939
      text: 1923年にメーメル（クライペダ）地方を占領・編入した。1926年のクーデターの後、スメトナの権威主義体制となった。1939年3月、ドイツの最後通牒でメーメル地方を返し、10月にはソ連との相互援助条約でヴィリニュスを得るかわりにソ連軍の基地を受け入れた。
    - from: 1990
      text: 「サーユディス（改革運動）」を中心に、1990年3月、ソ連の構成国で最初に独立回復を宣言した。1991年1月のソ連軍の介入（「血の日曜日」）に耐え、8月のクーデター失敗の後に独立が国際的に認められた。2004年にNATOとEUに加盟し、2015年にユーロを導入した。
  note: >-
    元首の欄には大統領（1918–1920・1990–1992は議長）を書いた（大統領が外交などで実権を持つ半大統領制）。
    1940–1941年と1944–1991年はソ連（リトアニア社会主義ソヴィエト共和国。副ラベル）として描く。1990–1991年は独立を宣言したが実効支配はなく、地図ではソ連のまま。
  source:
    - "https://ja.wikipedia.org/wiki/リトアニアの歴史"

- id: iceland
  name: アイスランド
