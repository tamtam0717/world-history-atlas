    - {name: カール15世, title: スウェーデン王・ノルウェー王, from: 1859, to: 1872, source: "https://ja.wikipedia.org/wiki/カール15世_(スウェーデン王)"}
    - {name: オスカル2世, title: スウェーデン王（1905年までノルウェー王を兼ねる）, from: 1872, to: 1907, source: "https://ja.wikipedia.org/wiki/オスカル2世_(スウェーデン王)"}
    - {name: グスタフ5世, title: スウェーデン王, from: 1907, to: 1950, source: "https://ja.wikipedia.org/wiki/グスタフ5世_(スウェーデン王)"}
    - {name: グスタフ6世アドルフ, title: スウェーデン王, from: 1950, to: 1973, source: "https://ja.wikipedia.org/wiki/グスタフ6世アドルフ_(スウェーデン王)"}
    - {name: カール16世グスタフ, title: スウェーデン王, from: 1973, source: "https://ja.wikipedia.org/wiki/カール16世グスタフ_(スウェーデン王)"}
  periods:
    - from: 1648
      to: 1660
      text: ウェストファリア条約でドイツ北部に領土を得て、バルト海帝国が頂点を迎える。北方戦争（第一次）でポーランド・デンマークと戦い、ロスキレ条約でスコーネなどデンマークの旧領を得た。
    - from: 1660
      to: 1700
      text: カール11世のもとで王権が強まり（絶対王政）、王領の回収（大回収）で財政を立て直す。
    - from: 1700
      to: 1721
      text: 大北方戦争。カール12世はナルヴァで勝つがポルタヴァで大敗し、ニスタット条約でバルト海東岸の領土を失って大国の地位から転落した。
    - from: 1722
      to: 1771
      text: 「自由の時代」（1719年の統治法から）。王権が弱まり、議会（身分制議会）のハット党とキャップ党が政治を動かした。
    - from: 1772
      to: 1808
      text: グスタフ3世のクーデタで王権が復活。啓蒙専制君主として改革を進めたが、1792年に暗殺された。
    - from: 1809
      to: 1815
      text: フィンランドをロシアに奪われ、国王が廃位される。フランス元帥ベルナドットを王太子に迎え、1814年のキール条約でノルウェーを得た。
    - from: 1816
      to: 1844
      text: ベルナドット家のカール14世ヨハンの時代。ナポレオン戦争を最後に戦争をしない中立の方針をとり、ノルウェーと同君連合を組んだ（スウェーデン＝ノルウェー）。
    - from: 1844
      to: 1871
      text: 自由主義的な改革の時代。ギルドの廃止、営業の自由、初等教育の義務化が進み、1866年には4身分の身分制議会が二院制の議会に改められた。
    - from: 1872
      to: 1904
      text: 鉄道・林業・鉱業を軸に工業化が進む一方、農村の貧しさから多くの人が北アメリカへ移住した（約100万人）。ノルウェーとの対立が深まった。
    - from: 1905
      to: 1914
      text: ノルウェーとの同君連合を解消（カールスタード協定）。1909年に男子普通選挙が実現し、議会政治が根づいていった。第一次世界大戦では中立を保った。
    - from: 1915
      to: 1945
      text: 二つの世界大戦で中立を保った。1932年から社会民主労働党が長く政権を担い、「国民の家」をかかげて福祉国家の土台を築いた。第二次世界大戦ではドイツ軍の通過や鉄鉱石の輸出を認めながら中立を守り、デンマークやバルト諸国からの難民を受け入れた。
    - from: 1946
      to: 1991
      text: 社会民主労働党のもとで高い税と手厚い社会保障の福祉国家が完成した。冷戦では東西どちらの陣営にも加わらない非同盟・中立を保った。1974年の新憲法で国王は儀礼的な元首となった。1986年にパルメ首相が暗殺された。
    - from: 1992
      text: 金融危機を経て1995年にヨーロッパ連合（EU）に加盟した（ユーロは導入していない）。ロシアのウクライナ侵攻を受けて200年続いた中立の方針を改め、2024年3月に北大西洋条約機構（NATO）に加盟した。
  note: 1917年からは議会の多数派が内閣をつくり、実権は首相にある。元首の欄には国王を書いた（主な首相：ハンソン 1932–1946、エランデル 1946–1969、パルメ 1969–1976・1982–1986）
  source: "https://ja.wikipedia.org/wiki/スウェーデンの歴史"

