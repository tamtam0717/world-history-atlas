  periods:
    - from: 1918
      to: 1921
      text: 第一次世界大戦の終わりに123年ぶりに独立を回復した（11月11日）。ヴェルサイユ条約でポーランド回廊を得てバルト海に出た。東の国境をめぐってソ連と戦い（ポーランド＝ソヴィエト戦争）、1920年8月の「ヴィスワの奇跡」で反撃し、1921年のリガ条約でベラルーシ西部・ウクライナ西部を得た。シロンスク（シュレジエン）の住民投票と蜂起で東部を得た。
    - from: 1922
      to: 1938
      text: 1922年にヴィリニュス地方を併合した。人口の約3分の1をウクライナ人・ユダヤ人・ベラルーシ人・ドイツ人などの少数民族が占めた。議会政治が不安定で、1926年にピウスツキがクーデターで実権を握った。1938年、ミュンヘン協定に乗じてチェコスロヴァキアからテシン（ザオルジェ）を奪った。
    - from: 1939
      to: 1944
      text: 1939年9月1日にドイツが侵攻し（第二次世界大戦の始まり）、17日にはソ連も東から侵攻して、国土は独ソに分割された。ドイツはアウシュヴィッツなどの絶滅収容所を置き、ポーランドのユダヤ人約300万人を含む多くの人々が殺害された（ホロコースト）。ソ連はカティンの森などで将校らを処刑した。1944年8月のワルシャワ蜂起はドイツ軍に鎮圧された。
    - from: 1945
      to: 1955
      text: ヤルタ会談・ポツダム協定で国土が西へ移り、東部をソ連に渡す代わりにオーデル＝ナイセ線以東のドイツ領を得た。ドイツ人は追放され、東部のポーランド人が西へ移住した。ソ連の後ろ盾で共産党（1948年から統一労働者党）が権力を握り、1952年にポーランド人民共和国となった。
    - from: 1956
      to: 1979
      text: 1956年のポズナン暴動の後、ゴムウカが復帰して「ポーランドの道」を探り、農業の集団化をやめ、カトリック教会との妥協を図った。1970年に西ドイツとワルシャワ条約を結び、オーデル＝ナイセ線を認めさせた。1978年にクラクフ大司教がローマ教皇ヨハネ・パウロ2世に選ばれた。
    - from: 1980
      to: 1989
      text: 1980年、グダンスクの造船所のストライキから、ワレサを議長とする自主管理労組「連帯」が生まれた。1981年12月にヤルゼルスキが戒厳令をしいて連帯を非合法化したが、1989年の円卓会議を経た部分的な自由選挙で連帯が圧勝し、東欧革命の先がけとなった。
    - from: 1990
      text: 「ショック療法」で市場経済に移り、1999年に北大西洋条約機構（NATO）、2004年にヨーロッパ連合（EU）に加盟した。2015年から「法と正義」が政権を握り、司法の改革をめぐってEUと対立したが、2023年の選挙で政権が交代した。2022年からのロシアのウクライナ侵攻では、多くの避難民を受け入れた。
  note: >-
    元首の欄は実権を持つ人を書いた。1918–1922年は国家主席ピウスツキ、1926–1935年は実権者ピウスツキ、1939–1944年はロンドンの亡命政府の首相、共産党の時代（1944–1989）は党の第一書記、1989年の体制転換の後は首相（1997年の新憲法で首相が政治の中心と明確にされた）。
    体制転換後の大統領はヤルゼルスキ（1989–1990）、ワレサ（1990–1995。「連帯」の議長）、クファシニェフスキ（1995–2005）、レフ・カチンスキ（2005–2010）、コモロフスキ（2010–2015）、ドゥダ（2015–2025）、ナヴロツキ（2025–）。
    1939–1945年の国土は地図ではドイツ・ソ連の占領地として描く（政体は亡命政府として残る）。
  source:
    - "https://ja.wikipedia.org/wiki/ポーランドの歴史"
    - "https://ja.wikipedia.org/wiki/ポーランド人民共和国"

- id: general_government
