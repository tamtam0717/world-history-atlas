    - {name: エルンスト・ツィーム, title: 参事会議長, from: 1931, to: 1933, source: "https://en.wikipedia.org/wiki/Ernst_Ziehm"}
    - {name: ヘルマン・ラウシュニング, title: 参事会議長, from: 1933, to: 1934, note: ナチ党。のちにナチスと決別して亡命, source: "https://en.wikipedia.org/wiki/Hermann_Rauschning"}
    - {name: アルトゥール・グライザー, title: 参事会議長, from: 1934, to: 1939, note: ナチ党。実権はナチ党の大管区指導者フォルスターにあった, source: "https://en.wikipedia.org/wiki/Arthur_Greiser"}
