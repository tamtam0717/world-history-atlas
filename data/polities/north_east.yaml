    - from: 1709
      to: 1734
      text: マゼパに従ったためロシア軍にシーチを破壊され、クリミア＝ハンの保護下（オレシキ）に移った。
    - from: 1734
      to: 1775
      text: ロシアの保護下に戻り（新シーチ）、草原の開拓を進めた。1775年、露土戦争後にロシア軍が解体した。
  source: "https://ja.wikipedia.org/wiki/ザポロージャ・シーチ"

- id: don_cossacks
  name: ドン・コサック軍
  short: ドン・コサック
  color: "#c2b294"
  kind: コサック共同体
  periods:
    - from: 1648
      to: 1834
      text: ドン川流域のコサックの自治共同体。1671年にロシア皇帝への忠誠を誓い、しだいにロシアの軍事組織に組み込まれた。ステンカ・ラージンの乱（1670–71）、ブラーヴィンの乱（1707–08）の拠点。
  source: "https://ja.wikipedia.org/wiki/ドン・コサック"

- id: kalmyk
