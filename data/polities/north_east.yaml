  periods:
    - from: 1648
      to: 1682
      text: ロマノフ朝のもとで国家の再建が進む。1649年の会議法典で農奴制が確立。ウクライナのコサックを保護下に置き（1654）、ポーランドからスモレンスクとドニエプル左岸を得た。ステンカ・ラージンの反乱（1670–71）。
    - from: 1682
      to: 1725
      text: ピョートル1世の西欧化改革。大北方戦争でスウェーデンを破ってバルト海に進出し、新首都サンクト・ペテルブルクを建設。1721年に皇帝（インペラートル）を名乗る。
    - from: 1725
      to: 1762
      text: 女帝と幼帝の時代で、近衛連隊のクーデタが相次いだ。オスマン帝国と戦い（1735–39）、七年戦争ではプロイセンを追い詰めた。
    - from: 1762
      to: 1796
      text: エカチェリーナ2世の時代。プガチョフの乱（1773–75）を鎮圧し、露土戦争で黒海北岸とクリミアを獲得、3回のポーランド分割で西に大きく領土を広げた。
    - from: 1797
      to: 1800
      text: パーヴェル1世の時代。第2回対仏大同盟に加わり、スヴォーロフがイタリア・スイスで戦い、ウシャコフの艦隊がオスマン帝国と組んでイオニア諸島を占領した。1801年1月にカルトリ・カヘティ王国の併合を宣言し、3月に宮廷クーデタで殺された。
    - from: 1801
      to: 1815
      text: アレクサンドル1世の時代。ナポレオンと戦い、フィンランド（1809）とベッサラビア（1812）を獲得。1812年のロシア遠征を退け、ウィーン会議でポーランド立憲王国の王を兼ねた。
    - from: 1816
      to: 1825
      text: 神聖同盟を提唱し、ウィーン体制の柱となる。国内では改革の構想が立ち消えとなり、皇帝の死の直後にデカブリストの乱が起きた。
    - from: 1826
      to: 1855
      text: ニコライ1世の反動政治。秘密警察で自由主義を抑え、ポーランドの十一月蜂起（1830–31）やハンガリー革命（1849）を鎮圧して「ヨーロッパの憲兵」と呼ばれた。カフカスで山岳民と長い戦争を続け、南下政策はクリミア戦争の敗北に終わった。
    - from: 1856
      to: 1881
      text: アレクサンドル2世の「大改革」。農奴解放令（1861）、地方自治会（ゼムストヴォ）、司法・軍制の改革が行われた。一方でポーランドの一月蜂起（1863）を鎮圧し、カフカス・中央アジアを征服した。ナロードニキの運動が広がり、皇帝は1881年に暗殺された。
    - from: 1881
      to: 1894
      text: アレクサンドル3世の反動政治。革命運動を弾圧し、ポーランド・バルト地方・フィンランドなどでロシア化を進めた。ユダヤ人への迫害（ポグロム）が起き、多くが国外へ移住した。フランス資本を導入して工業化が始まり、露仏同盟を結んだ。
    - from: 1894
      to: 1914
      text: ニコライ2世の時代。ウィッテのもとでシベリア鉄道などの工業化が進む。日露戦争の敗北と1905年革命で、十月宣言により国会（ドゥーマ）が開かれた。ストルイピンの改革（農村共同体の解体）の後、1914年に第一次世界大戦に参戦した。
    - from: 1915
      to: 1917
      text: 第一次世界大戦で敗北が続き、1915年にポーランド・リトアニアを失った。物資不足と戦死者の多さで不満が高まり、1917年3月の二月革命で帝政が倒れた（ロマノフ朝の滅亡）。11月の十月革命でレーニンのボリシェヴィキが権力を握り、ソヴィエト政権を立てた。
    - from: 1918
      to: 1921
      text: ブレスト＝リトフスク条約でドイツと単独講和し、首都をモスクワに移した。白軍と連合国の干渉軍を相手に内戦を戦い、戦時共産主義で穀物を徴発した。1920年までに内戦に勝ち、1921年に新経済政策（ネップ）に転じた。1922年、ウクライナなどとソヴィエト社会主義共和国連邦（ソ連）を結成した。
    - from: 1991
      to: 1999
      text: ソ連の解体でロシア連邦として独立した。エリツィン大統領のもとで急激な市場経済化（ショック療法）が進み、物価の高騰と国有財産の私有化で一部の富豪（オリガルヒ）が生まれた。1993年に議会と対立して砲撃し新憲法を定めた。チェチェン紛争が起き、1998年には財政危機に陥った。
    - from: 2000
      to: 2013
      text: プーチン大統領のもとで、石油・天然ガスの輸出による経済成長と中央集権の強化が進んだ。第2次チェチェン紛争を終わらせる一方、報道や野党への統制が強まった。2008年にジョージアと戦った。
    - from: 2014
      text: ウクライナのクリミアを併合し、ウクライナ東部の分離派を支援して欧米の制裁を受けた。2022年2月にウクライナへの全面侵攻を始め、9月に4州の併合を宣言した（国際的には認められていない）。戦時体制のもとで反戦の言論は厳しく取り締まられた。
  note: 1682–1689年は姉ソフィアが摂政。ピョートル1世の単独統治は1696年から。1922–1991年はソヴィエト連邦（soviet_union）として描き、ロシア共和国（ロシア社会主義連邦ソヴィエト共和国）は地図の副ラベルで示す
  source:
    - "https://ja.wikipedia.org/wiki/ロシア帝国"
    - "https://ja.wikipedia.org/wiki/ロシア"

