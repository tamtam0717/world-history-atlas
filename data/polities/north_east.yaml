    - {name: ライモンツ・ヴェーヨニス, title: 大統領, from: 2015, to: 2019, source: "https://en.wikipedia.org/wiki/Raimonds_Vējonis"}
    - {name: エギルス・レヴィッツ, title: 大統領, from: 2019, to: 2023, source: "https://en.wikipedia.org/wiki/Egils_Levits"}
    - {name: エドガルス・リンケーヴィチ, title: 大統領, from: 2023, source: "https://en.wikipedia.org/wiki/Edgars_Rinkēvičs"}
  periods:
    - from: 1918
      to: 1920
      text: 1918年11月に独立を宣言した。赤軍、ドイツ義勇軍、白軍（ベルモント軍）と戦い（独立戦争）、エストニアの助けも得て、1920年のリガ条約でソヴィエト・ロシアに独立を認めさせた。
    - from: 1921
      to: 1939
      text: 土地改革でバルト・ドイツ人の大農場を農民に分けた。1934年にウルマニスがクーデターで議会を停止し、権威主義体制をしいた。1939年10月、ソ連に迫られて相互援助条約を結び、ソ連軍の基地を受け入れた。
    - from: 1991
      text: 1988年からの民族運動（「バルトの道」の人間の鎖、1989）を経て、1991年8月に独立を回復した。2004年にNATOとEUに加盟し、2014年にユーロを導入した。人口の約4分の1を占めるロシア系住民の国籍と言語が課題となっている。
  note: >-
    元首の欄：1918–1921年は臨時政府首相、1922年以後は大統領を書いた（1934–1940年はウルマニスの独裁。1993年以後の大統領は議会が選び、実権は首相にある）。
    1940–1941年と1944–1991年はソ連（ラトヴィア社会主義ソヴィエト共和国。副ラベル）として描く。
