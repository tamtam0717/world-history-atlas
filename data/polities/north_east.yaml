    - {name: クリスチャン7世, title: デンマーク＝ノルウェー王, from: 1766, to: 1808, source: "https://ja.wikipedia.org/wiki/クリスチャン7世_(デンマーク王)"}
    - {name: フレデリク6世, title: デンマーク王（1814年までノルウェー王を兼ねる）, from: 1808, to: 1839, source: "https://ja.wikipedia.org/wiki/フレデリク6世_(デンマーク王)"}
    - {name: クリスチャン8世, title: デンマーク王, from: 1839, to: 1848, source: "https://ja.wikipedia.org/wiki/クリスチャン8世_(デンマーク王)"}
    - {name: フレデリク7世, title: デンマーク王, from: 1848, to: 1863, source: "https://ja.wikipedia.org/wiki/フレデリク7世_(デンマーク王)"}
    - {name: クリスチャン9世, title: デンマーク王, from: 1863, to: 1906, source: "https://ja.wikipedia.org/wiki/クリスチャン9世_(デンマーク王)"}
    - {name: フレデリク8世, title: デンマーク王, from: 1906, to: 1912, source: "https://ja.wikipedia.org/wiki/フレデリク8世_(デンマーク王)"}
    - {name: クリスチャン10世, title: デンマーク王, from: 1912, to: 1947, source: "https://ja.wikipedia.org/wiki/クリスチャン10世_(デンマーク王)"}
    - {name: フレデリク9世, title: デンマーク王, from: 1947, to: 1972, source: "https://ja.wikipedia.org/wiki/フレゼリク9世_(デンマーク王)"}
    - {name: マルグレーテ2世, title: デンマーク女王, from: 1972, to: 2024, note: 2024年1月に退位, source: "https://ja.wikipedia.org/wiki/マルグレーテ2世_(デンマーク女王)"}
    - {name: フレデリク10世, title: デンマーク王, from: 2024, source: "https://ja.wikipedia.org/wiki/フレゼリク10世_(デンマーク王)"}
  periods:
    - from: 1648
      to: 1660
      text: スウェーデンとの戦争に敗れ、ロスキレ条約でスコーネ・ハッランド・ブレーキンゲなどスカンディナヴィア半島南部を失った。
    - from: 1660
      to: 1700
      text: 1660年に世襲王政・絶対王政が成立し、1665年の国王法で王権が法的に確定した。スコーネ奪回を目指すが果たせない。
    - from: 1700
      to: 1720
      text: 大北方戦争に参加。フレデリクスボー条約でゴットルプ家のシュレースヴィヒの持ち分を得た。
    - from: 1720
      to: 1800
      text: 長い平和の時代。中立貿易で栄え、ベルンストルフらの改革で農奴制（土地緊縛制）が廃止された。
    - from: 1801
      to: 1814
      text: イギリスにコペンハーゲンを攻撃され（1801・1807）、フランス側についた。敗戦の結果、キール条約でノルウェーをスウェーデンに譲った。
    - from: 1815
      to: 1847
      text: 国家破産（1813）と戦争の痛手から立ち直るまでの絶対王政の時代。シュレースヴィヒ・ホルシュタインではドイツ人の民族運動、デンマーク本土ではデンマーク人の国民意識（アイダー・デンマーク主義）が高まった。
    - from: 1848
      to: 1863
      text: 1848年に絶対王政が終わり、1849年の6月憲法で立憲君主制となった。シュレースヴィヒをめぐり、ドイツ系住民とプロイセンを相手に第1次シュレースヴィヒ戦争（1848–51）を戦った。
    - from: 1864
      to: 1900
      text: 第2次シュレースヴィヒ戦争（デンマーク戦争）でプロイセン・オーストリアに敗れ、シュレースヴィヒ・ホルシュタイン・ラウエンブルクを失って国土の約3分の1を失う。その後は酪農と協同組合で農業を立て直し、「外で失ったものを内で取り戻せ」が合言葉となった。
    - from: 1901
      to: 1914
      text: 1901年の「体制転換」で議会の多数派が内閣をつくる議会政治が確立した。第一次世界大戦では中立を守った。
    - from: 1915
      to: 1939
      text: 1915年の憲法で女性参政権を実現した。第一次世界大戦では中立。1918年にアイスランドが同君連合の王国として分かれ、1920年の住民投票で北シュレースヴィヒが戻った。社会民主党のスタウニング政権（1929–1942）が福祉政策を進めた。
    - from: 1940
      to: 1945
      text: 1940年4月にドイツ軍に占領された。国王と政府はとどまってドイツに協力しつつ自治を保ったが、1943年8月に協力政策が崩れて抵抗運動が強まった。同年10月、ユダヤ人のほとんどが市民の助けで中立国スウェーデンへ逃れた。1944年にアイスランドが共和国として離れた。
    - from: 1946
      to: 1972
      text: 1949年に北大西洋条約機構（NATO）に加わり、中立の方針を改めた。福祉国家が完成し、1953年の憲法改正で一院制となり女性の王位継承が認められた。
    - from: 1973
      text: 1973年にヨーロッパ共同体（EC）に加盟した。1992年の国民投票でマーストリヒト条約を一度否決し、ユーロは導入していない。グリーンランド（1979）とフェロー諸島に広い自治を認めた。
  note: 1770–1772年は侍医ストルーエンセが実権を握った。アイスランド・フェロー諸島・グリーンランドも領有。1901年以降の実権は議会の多数派がつくる内閣にあり、元首の欄には国王を書いた。アイスランドは1918–1944年に同君連合の王国（iceland）
  source: "https://ja.wikipedia.org/wiki/デンマーク＝ノルウェー"

- id: norway
  name: ノルウェー王国
  short: ノルウェー
  color: "#d7a7b4"
  kind: 王国
  names:
    - {to: 1904, name: ノルウェー王国, kind: 王国（スウェーデンと同君連合）}
  rulers:
    - {name: クリスチャン・フレデリク, title: ノルウェー王, from: 1814, to: 1814, source: "https://ja.wikipedia.org/wiki/クリスチャン8世_(デンマーク王)"}
    - {name: カール2世（スウェーデン王カール13世）, title: ノルウェー王, from: 1814, to: 1818, source: "https://ja.wikipedia.org/wiki/カール13世_(スウェーデン王)"}
    - {name: カール3世ヨハン（スウェーデン王カール14世ヨハン）, title: ノルウェー王, from: 1818, to: 1844, source: "https://ja.wikipedia.org/wiki/カール14世ヨハン_(スウェーデン王)"}
    - {name: オスカル1世, title: ノルウェー王（スウェーデン王）, from: 1844, to: 1859, source: "https://ja.wikipedia.org/wiki/オスカル1世_(スウェーデン王)"}
    - {name: カール4世（スウェーデン王カール15世）, title: ノルウェー王, from: 1859, to: 1872, source: "https://ja.wikipedia.org/wiki/カール15世_(スウェーデン王)"}
    - {name: オスカル2世, title: ノルウェー王（スウェーデン王）, from: 1872, to: 1905, source: "https://ja.wikipedia.org/wiki/オスカル2世_(スウェーデン王)"}
    - {name: ホーコン7世, title: ノルウェー王, from: 1905, to: 1957, note: デンマーク王子カール。国民投票で王に迎えられた, source: "https://ja.wikipedia.org/wiki/ホーコン7世"}
    - {name: オーラヴ5世, title: ノルウェー王, from: 1957, to: 1991, source: "https://ja.wikipedia.org/wiki/オーラヴ5世_(ノルウェー王)"}
    - {name: ハーラル5世, title: ノルウェー王, from: 1991, source: "https://ja.wikipedia.org/wiki/ハーラル5世_(ノルウェー王)"}
  periods:
    - from: 1814
      to: 1815
      text: キール条約でデンマークから切り離されると、アイスヴォルで憲法を制定して独立を宣言。スウェーデンとの短い戦争の後、独自の憲法と議会を保ったままスウェーデンと同君連合を結んだ。
    - from: 1816
      to: 1883
      text: スウェーデン王を国王とする同君連合のもとで、議会（ストーティング）と自前の行政を持つ。外交はスウェーデンが握った。農民・自由主義勢力が力を伸ばし、民族ロマン主義（イプセン、グリーグ）が国民意識を高めた。
    - from: 1884
      to: 1904
      text: 1884年に議会の多数派が内閣をつくる議会政治が実現。独自の領事館を求めてスウェーデンと対立した。
    - from: 1905
      to: 1914
      text: 議会が同君連合の解消を決議し、国民投票を経て完全に独立した。デンマーク王子をホーコン7世として迎える。1913年に女性参政権を実現した。
    - from: 1915
      to: 1939
      text: 第一次世界大戦では中立。1920年のスヴァールバル条約でスヴァールバル諸島の領有が認められた。1935年から労働党が政権を握り、福祉政策を進めた。
    - from: 1940
      to: 1945
      text: 1940年4月にドイツ軍に侵攻され、6月に国王と政府はロンドンに亡命した。ドイツは国家弁務官を置き、クヴィスリングの傀儡政権をつくった。抵抗運動が重水工場の破壊などを行った。1944年10月に北端のフィンマルクがソ連軍に解放され、1945年5月のドイツ降伏で解放された。
    - from: 1946
      to: 1969
      text: 1949年に北大西洋条約機構（NATO）に加わった。労働党のゲルハルセン首相のもとで復興と福祉国家づくりが進んだ。
    - from: 1970
      text: 北海油田の開発で豊かになり、石油収入を政府年金基金に積み立てた。ヨーロッパ共同体・連合への加盟は国民投票で2度否決した（1972・1994）。2011年にウトヤ島などで連続テロ事件が起きた。
  note: 1814年までのノルウェーは denmark（デンマーク＝ノルウェー）として描く。1884年以降の実権は内閣にあり、元首の欄には国王を書いた。1940–1945年のドイツ占領期は、国王と政府はロンドンに亡命していた
  source: "https://ja.wikipedia.org/wiki/スウェーデン＝ノルウェー"

