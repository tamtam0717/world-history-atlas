- id: soviet_union
  name: ソヴィエト社会主義共和国連邦
  short: ソ連
  color: "#d49c87"
  kind: 社会主義国（連邦。共産党の一党独裁）
  rulers:
    - {name: ウラジーミル・レーニン, title: 人民委員会議議長, from: 1922, to: 1924, note: 1922年に病に倒れ、1924年1月に死去, source: "https://ja.wikipedia.org/wiki/ウラジーミル・レーニン"}
    - {name: ヨシフ・スターリン, title: 共産党書記長（1941年から首相を兼ねる）, from: 1924, to: 1953, note: 1922年に書記長。レーニンの死後、トロツキーらとの権力闘争に勝ち、1920年代末に独裁を固めた, source: "https://ja.wikipedia.org/wiki/ヨシフ・スターリン"}
    - {name: ゲオルギー・マレンコフ, title: 首相, from: 1953, to: 1953, note: スターリンの死（1953年3月）の後、集団指導体制の中心となったが、党の第一書記の座はフルシチョフが握った（首相は1955年まで）, source: "https://ja.wikipedia.org/wiki/ゲオルギー・マレンコフ"}
    - {name: ニキータ・フルシチョフ, title: 共産党第一書記（1958年から首相を兼ねる）, from: 1953, to: 1964, note: 1964年10月に失脚, source: "https://ja.wikipedia.org/wiki/ニキータ・フルシチョフ"}
    - {name: レオニード・ブレジネフ, title: 共産党第一書記（1966年から書記長）, from: 1964, to: 1982, note: 首相はコスイギン（1964–1980）, source: "https://ja.wikipedia.org/wiki/レオニード・ブレジネフ"}
    - {name: ユーリ・アンドロポフ, title: 共産党書記長, from: 1982, to: 1984, source: "https://ja.wikipedia.org/wiki/ユーリ・アンドロポフ"}
    - {name: コンスタンティン・チェルネンコ, title: 共産党書記長, from: 1984, to: 1985, source: "https://ja.wikipedia.org/wiki/コンスタンティン・チェルネンコ"}
    - {name: ミハイル・ゴルバチョフ, title: 共産党書記長（1990年からソ連大統領）, from: 1985, to: 1991, note: 1991年12月25日に大統領を辞任し、ソ連は消滅した, source: "https://ja.wikipedia.org/wiki/ミハイル・ゴルバチョフ"}
  periods:
    - from: 1922
      to: 1927
      text: 1922年12月、ロシア・ウクライナ・ベラルーシ・ザカフカースの4つのソヴィエト共和国が連邦を結成した。新経済政策（ネップ）で経済が立ち直る一方、1924年のレーニンの死後、一国社会主義を唱えるスターリンが世界革命論のトロツキーらを退けた。
    - from: 1928
      to: 1938
      text: スターリンのもとで五か年計画による重工業化と農業の強制的な集団化（コルホーズ）が進んだ。ウクライナなどで数百万人が餓死する大飢饉が起き（1932–1933）、大粛清（1936–1938）では党・軍の幹部から一般の市民まで多くが処刑・収容所送りとなった。1934年に国際連盟に加盟した。
    - from: 1939
      to: 1940
      text: 1939年8月の独ソ不可侵条約（秘密議定書で勢力圏を分割）にもとづき、9月にポーランド東部を占領した。冬戦争（1939–1940）でフィンランドからカレリア地峡などを奪い、1940年にはバルト三国とベッサラビア・北ブコヴィナを併合した。
    - from: 1941
      to: 1945
      text: 1941年6月、ドイツの奇襲（バルバロッサ作戦）で独ソ戦が始まり、ウクライナ・ベラルーシ・ロシア西部が占領された。レニングラード包囲（約900日）やスターリングラードの戦い（1942–1943）を経て反攻に転じ、1945年5月にベルリンを落とした。戦死者・犠牲者は2000万人を超えた。8月には対日参戦した。
    - from: 1946
      to: 1953
      text: 戦後は東欧を勢力圏とし、各国に共産党の政権を立てた（衛星国）。アメリカと対立する冷戦が始まり、1949年に原爆の開発に成功し、経済相互援助会議（コメコン）をつくった。国内ではふたたび統制と粛清が強まった。
    - from: 1954
      to: 1964
      text: フルシチョフが1956年の党大会でスターリン批判を行い、雪どけが進んだ。同年のハンガリー事件は武力で鎮圧した。1957年に人工衛星スプートニク、1961年にガガーリンの有人宇宙飛行に成功した。1962年のキューバ危機の後、アメリカと部分的核実験禁止条約を結んだ。
    - from: 1965
      to: 1984
      text: ブレジネフの長期政権。1968年にチェコスロヴァキアの改革（プラハの春）を軍事介入でつぶし（ブレジネフ・ドクトリン）、1970年代には米ソのデタント（緊張緩和）が進んだ。経済は停滞し（「停滞の時代」）、1979年のアフガニスタン侵攻で再び米ソの対立が深まった。
    - from: 1985
      to: 1991
      text: ゴルバチョフがペレストロイカ（改革）とグラスノスチ（情報公開）を進め、新思考外交で冷戦を終わらせた。1986年にチェルノブイリ原子力発電所の事故が起きた。1989年の東欧革命で衛星国が離れ、民族運動が高まるなか、1991年8月の保守派のクーデターが失敗した後、12月に独立国家共同体（CIS）が結成されてソ連は解体した。
  note: >-
    元首の欄は実権を持つ共産党の指導者（書記長・第一書記）を書いた。地図ではソ連全体を1色で描き、構成共和国（ロシア・ウクライナ・ベラルーシ・バルト三国など）は副ラベルで示す。
    ソ連の成立前（1917–1921年）と解体後（1992年–）のロシアは russia として描く。
  source:
    - "https://ja.wikipedia.org/wiki/ソビエト連邦"
    - "https://ja.wikipedia.org/wiki/ソビエト連邦の崩壊"

