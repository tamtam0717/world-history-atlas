    - {name: ボリス・エリツィン, title: 大統領, from: 1991, to: 1999, note: 1991年6月にロシア共和国の大統領に当選。ソ連解体後のロシア連邦の初代大統領。1999年12月31日に辞任, source: "https://ja.wikipedia.org/wiki/ボリス・エリツィン"}
    - {name: ウラジーミル・プーチン, title: 大統領, from: 2000, to: 2008, note: 1999年8月に首相、12月に大統領代行, source: "https://ja.wikipedia.org/wiki/ウラジーミル・プーチン"}
    - {name: ドミートリー・メドヴェージェフ, title: 大統領, from: 2008, to: 2012, note: この間もプーチンが首相として実権を握った（「双頭体制」）, source: "https://ja.wikipedia.org/wiki/ドミートリー・メドヴェージェフ"}
