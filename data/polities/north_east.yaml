    - {name: イヴァン6世, title: 皇帝, from: 1740, to: 1741, source: "https://ja.wikipedia.org/wiki/イヴァン6世"}
    - {name: エリザヴェータ, title: 女帝, from: 1741, to: 1761, source: "https://ja.wikipedia.org/wiki/エリザヴェータ_(ロシア皇帝)"}
    - {name: ピョートル3世, title: 皇帝, from: 1762, to: 1762, source: "https://ja.wikipedia.org/wiki/ピョートル3世"}
    - {name: エカチェリーナ2世, title: 女帝, from: 1762, to: 1796, source: "https://ja.wikipedia.org/wiki/エカチェリーナ2世"}
    - {name: パーヴェル1世, title: 皇帝, from: 1796, to: 1801, source: "https://ja.wikipedia.org/wiki/パーヴェル1世"}
    - {name: アレクサンドル1世, title: 皇帝, from: 1801, to: 1825, source: "https://ja.wikipedia.org/wiki/アレクサンドル1世"}
  periods:
    - from: 1648
      to: 1682
      text: ロマノフ朝のもとで国家の再建が進む。1649年の会議法典で農奴制が確立。ウクライナのコサックを保護下に置き（1654）、ポーランドからスモレンスクとドニエプル左岸を得た。ステンカ・ラージンの反乱（1670–71）。
    - from: 1682
      to: 1725
      text: ピョートル1世の西欧化改革。大北方戦争でスウェーデンを破ってバルト海に進出し、新首都サンクト・ペテルブルクを建設。1721年に皇帝（インペラートル）を名乗る。
    - from: 1725
      to: 1762
      text: 女帝と幼帝の時代で、近衛連隊のクーデタが相次いだ。オスマン帝国と戦い（1735–39）、七年戦争ではプロイセンを追い詰めた。
    - from: 1762
      to: 1796
      text: エカチェリーナ2世の時代。プガチョフの乱（1773–75）を鎮圧し、露土戦争で黒海北岸とクリミアを獲得、3回のポーランド分割で西に大きく領土を広げた。
    - from: 1801
      to: 1815
      text: アレクサンドル1世の時代。ナポレオンと戦い、フィンランド（1809）とベッサラビア（1812）を獲得。1812年のロシア遠征を退け、ウィーン会議でポーランド立憲王国の王を兼ねた。
  note: 1682–1689年は姉ソフィアが摂政。ピョートル1世の単独統治は1696年から
  source: "https://ja.wikipedia.org/wiki/ロシア帝国"

