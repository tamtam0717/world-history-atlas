    - {name: サーヒブ2世ギレイ, title: ハン（ロシアの後押し）, from: 1771, to: 1775, source: "https://en.wikipedia.org/wiki/Sahib_II_Giray"}
    - {name: デヴレト4世ギレイ, title: ハン（2回目）, from: 1775, to: 1777, source: "https://en.wikipedia.org/wiki/Devlet_IV_Giray"}
    - {name: シャヒン・ギレイ, title: ハン（ロシアの後押し）, from: 1777, to: 1783, source: "https://en.wikipedia.org/wiki/Şahin_Giray"}
    - {name: バハドゥル2世ギレイ, title: ハン（シャヒン・ギレイに対する反乱で擁立）, from: 1782, to: 1782, source: "https://en.wikipedia.org/wiki/Bahadır_II_Giray"}
  periods:
    - from: 1648
      to: 1700
      text: オスマン帝国の宗主権のもとでポーランド・ロシア・ウクライナに騎馬軍を送り、奴隷狩りの遠征を繰り返した。フメリニツキーの乱ではコサックと同盟した。
    - from: 1700
      to: 1768
      text: ロシアの南下に直面する。1736年と1737年にはロシア軍がクリミアに侵入し、首都バフチサライを焼いた。
    - from: 1768
      to: 1783
      text: 露土戦争の結果、キュチュク・カイナルジ条約でオスマン帝国から独立。ロシアの後押しでシャヒン・ギレイがハンとなるが反乱が続き、1783年にロシアに併合された。
  note: 在位年は記憶にもとづく。複数回在位したハンが多く、細部は要確認
  source: "https://ja.wikipedia.org/wiki/クリミア・ハン国"

- id: nogai
  name: ノガイ・オルダ（ノガイ人の遊牧諸集団）
  short: ノガイ
  color: "#dcd7ab"
  kind: 遊牧集団
  periods:
    - from: 1648
      to: 1783
      text: 黒海北岸からクバンにかけて遊牧するノガイ人の集団（ブジャク、イェディサン、イェディチクル、ジャンボイルク、クバンなど）。クリミア＝ハン国の支配下にあった。
  source: "https://ja.wikipedia.org/wiki/ノガイ・オルダ"

- id: cossack_hetmanate
  name: ヘトマン国家（ザポロージャ・コサック軍）
  short: ヘトマン国家
  color: "#a9c8e2"
  kind: コサック国家
  rulers:
    - {name: ボフダン・フメリニツキー, title: ヘトマン, from: 1648, to: 1657, source: "https://ja.wikipedia.org/wiki/ボフダン・フメリニツキー"}
    - {name: イヴァン・ヴィホウシキー, title: ヘトマン, from: 1657, to: 1659, source: "https://en.wikipedia.org/wiki/Ivan_Vyhovsky"}
    - {name: ユーリー・フメリニツキー, title: ヘトマン, from: 1659, to: 1663, source: "https://en.wikipedia.org/wiki/Yurii_Khmelnytsky"}
    - {name: イヴァン・ブリュホヴェツキー, title: 左岸ヘトマン, from: 1663, to: 1668, source: "https://en.wikipedia.org/wiki/Ivan_Briukhovetsky"}
    - {name: デミヤン・ムノホフリシュヌイ, title: 左岸ヘトマン, from: 1669, to: 1672, source: "https://en.wikipedia.org/wiki/Demian_Mnohohrishny"}
    - {name: イヴァン・サモイロヴィチ, title: 左岸ヘトマン, from: 1672, to: 1687, source: "https://en.wikipedia.org/wiki/Ivan_Samoylovych"}
    - {name: イヴァン・マゼパ, title: ヘトマン, from: 1687, to: 1708, source: "https://ja.wikipedia.org/wiki/イヴァン・マゼーパ"}
    - {name: イヴァン・スコロパツキー, title: ヘトマン, from: 1708, to: 1722, source: "https://en.wikipedia.org/wiki/Ivan_Skoropadsky"}
    - {name: ダニーロ・アポストル, title: ヘトマン, from: 1727, to: 1734, source: "https://en.wikipedia.org/wiki/Danylo_Apostol"}
    - {name: キリロ・ロズモウシキー, title: ヘトマン, from: 1750, to: 1764, source: "https://en.wikipedia.org/wiki/Kirill_Razumovsky"}
  periods:
    - from: 1648
      to: 1657
      text: フメリニツキーの乱でポーランドの支配を脱し、コサックの国家をつくる。1654年のペレヤスラフ協定でロシアの保護下に入った。
    - from: 1657
      to: 1687
      text: 「荒廃（ルイーナ）」の時代。ヘトマンがポーランド・ロシア・オスマン帝国の間で揺れ、アンドルソヴォ条約（1667）でドニエプル川の左岸と右岸に分かれた。
    - from: 1687
      to: 1709
      text: マゼパがヘトマンとして左岸を治める。大北方戦争でスウェーデン側についたが、ポルタヴァの敗北で亡命した。
    - from: 1709
      to: 1764
      text: ロシアの統制が強まり、ヘトマンが置かれない時期もあった（小ロシア参議会・ヘトマン政府）。1764年にエカチェリーナ2世がヘトマン制を廃止した。
  note: 1722–1727年と1734–1750年はヘトマン空位（1722–23年はポルボトークが代行）。1663年以後は左岸のヘトマンを記した。右岸は right_bank_hetmanate を参照
  source: "https://ja.wikipedia.org/wiki/ヘーチマン国家"

- id: right_bank_hetmanate
