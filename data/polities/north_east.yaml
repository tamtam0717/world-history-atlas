    - from: 1920
      to: 1932
      text: ヴェルサイユ条約でドイツから切り離され、国際連盟の高等弁務官のもとの自由市となった。住民の大部分はドイツ人。ポーランドが関税・外交・港の利用の権利を持ち、両者の対立が続いた。ポーランドは近くのグディニャに新しい港を築いた。
    - from: 1933
      to: 1939
      text: ナチ党が議会の多数を握り、反対派やユダヤ人を締め出した。ヒトラーはダンツィヒの返還と回廊を通る交通路を要求し、1939年9月1日、ヴェステルプラッテのポーランド守備隊への攻撃で第二次世界大戦が始まった。ドイツはその日のうちに併合を宣言した。
  source:
    - "https://ja.wikipedia.org/wiki/ダンツィヒ自由市_(ナポレオン時代)"
    - "https://ja.wikipedia.org/wiki/自由都市ダンツィヒ"

