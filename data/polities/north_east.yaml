    - {name: スタニスワフ・レシチニスキ, title: ポーランド王・リトアニア大公, from: 1704, to: 1709, source: "https://ja.wikipedia.org/wiki/スタニスワフ・レシチニスキ"}
    - {name: アウグスト2世（復位）, title: ポーランド王・リトアニア大公, from: 1709, to: 1733, source: "https://ja.wikipedia.org/wiki/アウグスト2世_(ポーランド王)"}
    - {name: アウグスト3世, title: ポーランド王・リトアニア大公, from: 1733, to: 1763, source: "https://ja.wikipedia.org/wiki/アウグスト3世_(ポーランド王)"}
    - {name: スタニスワフ2世アウグスト（ポニャトフスキ）, title: ポーランド王・リトアニア大公, from: 1764, to: 1795, source: "https://ja.wikipedia.org/wiki/スタニスワフ2世アウグスト"}
  periods:
    - from: 1648
      to: 1667
      text: フメリニツキーの乱、スウェーデンの侵攻（「大洪水」）、ロシアとの戦争が重なり国土が荒廃。アンドルソヴォ条約でスモレンスクとドニエプル左岸を失った。
    - from: 1667
      to: 1699
      text: オスマン帝国と戦い、一時ポジーリャを奪われる。ヤン3世ソビェスキが第二次ウィーン包囲を破り、カルロヴィッツ条約でポジーリャを回復した。
    - from: 1697
      to: 1763
      text: ザクセン選帝侯が王を兼ねる時代（ザクセン朝）。大北方戦争の戦場となり、王位継承戦争も起きて、ロシアの影響力が強まった。
    - from: 1764
      to: 1795
      text: スタニスワフ2世アウグストのもとで改革が試みられたが、3回の分割で国家は消滅した。1791年に5月3日憲法を制定、1794年にコシチュシコの蜂起。
  note: 1704–1709年はアウグスト2世とスタニスワフ・レシチニスキの二重王位（大北方戦争中）。1733–1736年もスタニスワフが王位を主張
  source: "https://ja.wikipedia.org/wiki/ポーランド・リトアニア共和国"

