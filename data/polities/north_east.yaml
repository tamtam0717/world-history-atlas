      text: 首都グロズヌイは激しい戦闘で破壊された。1996年8月のハサヴユルト協定でロシア軍が撤退し、事実上の独立を保ったが、治安は乱れた。1999年、ダゲスタンへの武装勢力の侵入とモスクワなどの連続爆破事件を機にロシア軍がふたたび侵攻した（第2次チェチェン紛争）。
