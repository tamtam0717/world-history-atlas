  name: スウェーデン王国
  short: スウェーデン
  color: "#dcc583"
  kind: 王国
  rulers:
    - {name: クリスティーナ, title: スウェーデン女王, from: 1632, to: 1654, source: "https://ja.wikipedia.org/wiki/クリスティーナ_(スウェーデン女王)"}
    - {name: カール10世, title: スウェーデン王, from: 1654, to: 1660, source: "https://ja.wikipedia.org/wiki/カール10世_(スウェーデン王)"}
    - {name: カール11世, title: スウェーデン王, from: 1660, to: 1697, source: "https://ja.wikipedia.org/wiki/カール11世_(スウェーデン王)"}
    - {name: カール12世, title: スウェーデン王, from: 1697, to: 1718, source: "https://ja.wikipedia.org/wiki/カール12世_(スウェーデン王)"}
    - {name: ウルリカ・エレオノーラ, title: スウェーデン女王, from: 1719, to: 1720, source: "https://ja.wikipedia.org/wiki/ウルリカ・エレオノーラ_(スウェーデン女王)"}
    - {name: フレドリク1世, title: スウェーデン王, from: 1720, to: 1751, source: "https://ja.wikipedia.org/wiki/フレドリク1世_(スウェーデン王)"}
    - {name: アドルフ・フレドリク, title: スウェーデン王, from: 1751, to: 1771, source: "https://ja.wikipedia.org/wiki/アドルフ・フレドリク_(スウェーデン王)"}
    - {name: グスタフ3世, title: スウェーデン王, from: 1771, to: 1792, source: "https://ja.wikipedia.org/wiki/グスタフ3世_(スウェーデン王)"}
    - {name: グスタフ4世アドルフ, title: スウェーデン王, from: 1792, to: 1809, source: "https://ja.wikipedia.org/wiki/グスタフ4世アドルフ_(スウェーデン王)"}
    - {name: カール13世, title: スウェーデン王（1814年からノルウェー王を兼ねる）, from: 1809, to: 1818, source: "https://ja.wikipedia.org/wiki/カール13世_(スウェーデン王)"}
  periods:
    - from: 1648
      to: 1660
      text: ウェストファリア条約でドイツ北部に領土を得て、バルト海帝国が頂点を迎える。北方戦争（第一次）でポーランド・デンマークと戦い、ロスキレ条約でスコーネなどデンマークの旧領を得た。
    - from: 1660
      to: 1700
      text: カール11世のもとで王権が強まり（絶対王政）、王領の回収（大回収）で財政を立て直す。
    - from: 1700
      to: 1721
      text: 大北方戦争。カール12世はナルヴァで勝つがポルタヴァで大敗し、ニスタット条約でバルト海東岸の領土を失って大国の地位から転落した。
    - from: 1719
      to: 1772
      text: 「自由の時代」。王権が弱まり、議会（身分制議会）のハット党とキャップ党が政治を動かした。
    - from: 1772
      to: 1809
      text: グスタフ3世のクーデタで王権が復活。啓蒙専制君主として改革を進めたが、1792年に暗殺された。
    - from: 1809
      to: 1815
      text: フィンランドをロシアに奪われ、国王が廃位される。フランス元帥ベルナドットを王太子に迎え、1814年のキール条約でノルウェーを得た。
  source: "https://ja.wikipedia.org/wiki/スウェーデンの歴史"

- id: denmark
  name: デンマーク＝ノルウェー
  names:
    - {from: 1814, name: デンマーク王国}
  short: デンマーク
  color: "#e7a69c"
  kind: 王国
  rulers:
    - {name: クリスチャン4世, title: デンマーク＝ノルウェー王, from: 1588, to: 1648, source: "https://ja.wikipedia.org/wiki/クリスチャン4世_(デンマーク王)"}
    - {name: フレデリク3世, title: デンマーク＝ノルウェー王, from: 1648, to: 1670, source: "https://ja.wikipedia.org/wiki/フレデリク3世_(デンマーク王)"}
    - {name: クリスチャン5世, title: デンマーク＝ノルウェー王, from: 1670, to: 1699, source: "https://ja.wikipedia.org/wiki/クリスチャン5世_(デンマーク王)"}
    - {name: フレデリク4世, title: デンマーク＝ノルウェー王, from: 1699, to: 1730, source: "https://ja.wikipedia.org/wiki/フレデリク4世_(デンマーク王)"}
    - {name: クリスチャン6世, title: デンマーク＝ノルウェー王, from: 1730, to: 1746, source: "https://ja.wikipedia.org/wiki/クリスチャン6世_(デンマーク王)"}
    - {name: フレデリク5世, title: デンマーク＝ノルウェー王, from: 1746, to: 1766, source: "https://ja.wikipedia.org/wiki/フレデリク5世_(デンマーク王)"}
    - {name: クリスチャン7世, title: デンマーク＝ノルウェー王, from: 1766, to: 1808, source: "https://ja.wikipedia.org/wiki/クリスチャン7世_(デンマーク王)"}
    - {name: フレデリク6世, title: デンマーク王（1814年までノルウェー王を兼ねる）, from: 1808, to: 1839, source: "https://ja.wikipedia.org/wiki/フレデリク6世_(デンマーク王)"}
  periods:
    - from: 1648
      to: 1660
      text: スウェーデンとの戦争に敗れ、ロスキレ条約でスコーネ・ハッランド・ブレーキンゲなどスカンディナヴィア半島南部を失った。
    - from: 1660
      to: 1700
      text: 1660年に世襲王政・絶対王政が成立し、1665年の国王法で王権が法的に確定した。スコーネ奪回を目指すが果たせない。
    - from: 1700
      to: 1720
      text: 大北方戦争に参加。フレデリクスボー条約でゴットルプ家のシュレースヴィヒの持ち分を得た。
    - from: 1720
      to: 1800
      text: 長い平和の時代。中立貿易で栄え、ベルンストルフらの改革で農奴制（土地緊縛制）が廃止された。
    - from: 1801
      to: 1814
      text: イギリスにコペンハーゲンを攻撃され（1801・1807）、フランス側についた。敗戦の結果、キール条約でノルウェーをスウェーデンに譲った。
  note: 1770–1772年は侍医ストルーエンセが実権を握った。アイスランド・フェロー諸島・グリーンランドも領有
  source: "https://ja.wikipedia.org/wiki/デンマーク＝ノルウェー"

- id: norway
  name: ノルウェー王国
  short: ノルウェー
  color: "#d7a7b4"
  kind: 王国
  rulers:
    - {name: クリスチャン・フレデリク, title: ノルウェー王, from: 1814, to: 1814, source: "https://ja.wikipedia.org/wiki/クリスチャン8世_(デンマーク王)"}
    - {name: カール2世（スウェーデン王カール13世）, title: ノルウェー王, from: 1814, to: 1818, source: "https://ja.wikipedia.org/wiki/カール13世_(スウェーデン王)"}
  periods:
    - from: 1814
      to: 1815
      text: キール条約でデンマークから切り離されると、アイスヴォルで憲法を制定して独立を宣言。スウェーデンとの短い戦争の後、独自の憲法と議会を保ったままスウェーデンと同君連合を結んだ。
  note: 1814年までのノルウェーは denmark（デンマーク＝ノルウェー）として描く
  source: "https://ja.wikipedia.org/wiki/スウェーデン＝ノルウェー"

