  kind: 政府
  rulers:
    - {name: 孫文, title: 大元帥・非常大総統（1921）, from: 1917, to: 1925, note: 1918–1920年は広西派に追われて上海にいた。1922年に陳炯明の反乱で広州を追われ、1923年に大元帥として復帰。1925年3月に北京で死去, source: "https://ja.wikipedia.org/wiki/孫文"}
    - {name: 汪兆銘, title: 国民政府主席, from: 1925, to: 1926, source: "https://ja.wikipedia.org/wiki/汪兆銘"}
    - {name: 譚延闓, title: 国民政府主席, from: 1926, to: 1927, note: 実権は国民革命軍総司令の蔣介石。1927年4月に蔣介石が南京に国民政府を立て、武漢の国民政府（汪兆銘）と分かれた（寧漢分裂、9月に合流）, source: "https://ja.wikipedia.org/wiki/譚延闓"}
  periods:
    - from: 1917
      to: 1923
      text: 北京政府が国会と臨時約法を無視したのに反対して、孫文は広州で護法軍政府を作った（護法運動）。西南の軍閥に左右され、孫文は何度も広州を追われた。
    - from: 1924
      to: 1927
      text: 孫文はソ連の援助を受けて中国国民党を改組し、共産党員の入党を認め（第1次国共合作）、黄埔軍官学校を作った。孫文の死後、1925年に国民政府ができ、1926年から蔣介石の国民革命軍が北伐を進めた。1927年4月の上海クーデタで共産党と分かれ、南京に国民政府を置いた。
  note: 1928年の北伐の完了で、国民政府が中華民国（roc）の政府となる。地図では広東だけをこの政体で塗る（簡略化）。実際には護法軍政府に1917–1918年は雲南・広西・貴州の軍閥も加わり、1922年6月から1923年初めの広州は陳炯明が押さえていた
  source:
    - "https://ja.wikipedia.org/wiki/護法運動"
    - "https://ja.wikipedia.org/wiki/国民政府"

- id: chinese_soviet
  name: 中国共産党の政権（ソヴィエト区・辺区・解放区）
  names:
    - {to: 1936, name: 中華ソヴィエト共和国, short: 中華ソヴィエト, kind: 共和国（中国共産党）}
    - {from: 1937, to: 1944, name: 陝甘寧辺区（中国共産党）, short: 陝甘寧辺区, kind: 辺区（中国共産党）}
    - {from: 1945, name: 中国共産党の解放区, short: 解放区, kind: 中国共産党の支配地域}
  short: 中国共産党
  color: "#e0604f"
  kind: 中国共産党の政権
  rulers:
    - {name: 毛沢東, title: 中華ソヴィエト共和国中央執行委員会主席→中国共産党主席（1943）, from: 1931, to: 1949, note: 1931–1934年の党の実権はソ連帰りの指導部（博古ら）。1935年の遵義会議で毛沢東の指導権が固まった, source: "https://ja.wikipedia.org/wiki/毛沢東"}
  periods:
    - from: 1931
      to: 1936
      text: 国共合作の崩壊（1927）の後、中国共産党は農村に根拠地（ソヴィエト区）を作り、1931年に江西の瑞金で中華ソヴィエト共和国臨時政府を立てた。国民政府軍の包囲攻撃で1934年に瑞金を捨て、長征で陝西北部に移った（1935）。
    - from: 1937
      to: 1945
      text: 第2次国共合作で紅軍は国民革命軍の八路軍・新四軍となり、延安を中心とする陝甘寧辺区は国民政府の下の地方政府とされた。日本軍の後方の華北・華中に根拠地を広げ、土地改革（減租減息）で農民の支持を得た。
    - from: 1946
      to: 1949
      text: 国共内戦。人民解放軍は満洲を押さえ、三大戦役（遼瀋・淮海・平津）で国民政府軍を破った。1949年10月1日に中華人民共和国を建てた。
  note: 1949年10月の中華人民共和国（prc）の成立までの共産党の支配地をこの政体で描く。1937–1944年は国民政府の帯（overlord）を付ける。日本軍の後方の抗日根拠地（晋察冀など）は境界が定まらないので描いていない。1946–1948年の内モンゴル自治政府（inner_mongolia_ag、G2）には、この政体の帯（overlord）を付けて共産党の指導下にあることを示す
  source:
    - "https://ja.wikipedia.org/wiki/中華ソビエト共和国"
    - "https://ja.wikipedia.org/wiki/陝甘寧辺区"
    - "https://ja.wikipedia.org/wiki/国共内戦"

- id: prc
  name: 中華人民共和国
  short: 中国
  color: "#ee8f88"
  kind: 共和国（中国共産党の一党支配）
  rulers:
    - {name: 毛沢東, title: 中国共産党主席（中央人民政府主席 1949–1954、国家主席 1954–1959）, from: 1949, to: 1976, source: "https://ja.wikipedia.org/wiki/毛沢東"}
    - {name: 華国鋒, title: 中国共産党主席, from: 1976, to: 1978, note: 1981年まで党主席だが、1978年の三中全会から実権は鄧小平に移った, source: "https://ja.wikipedia.org/wiki/華国鋒"}
    - {name: 鄧小平, title: 最高指導者（党副主席・中央軍事委員会主席）, from: 1978, to: 1989, note: 党の総書記は胡耀邦（1982–1987）・趙紫陽（1987–1989）。1992年の南巡講話まで影響力を持った, source: "https://ja.wikipedia.org/wiki/鄧小平"}
    - {name: 江沢民, title: 中国共産党総書記（国家主席 1993–2003）, from: 1989, to: 2002, source: "https://ja.wikipedia.org/wiki/江沢民"}
    - {name: 胡錦濤, title: 中国共産党総書記・国家主席, from: 2002, to: 2012, source: "https://ja.wikipedia.org/wiki/胡錦濤"}
    - {name: 習近平, title: 中国共産党総書記・国家主席, from: 2012, source: "https://ja.wikipedia.org/wiki/習近平"}
  periods:
    - from: 1949
      to: 1957
      text: 毛沢東を主席として成立。中ソ友好同盟相互援助条約（1950）を結び、朝鮮戦争に人民義勇軍を送った。土地改革法（1950）で地主の土地を農民に分け、第1次五か年計画（1953）でソ連型の重工業化と農業の集団化を進めた。
    - from: 1958
      to: 1965
      text: 「大躍進」と人民公社で急激な増産をめざしたが失敗し、数千万人とされる餓死者を出した。中ソ対立が深まり、中印国境紛争（1962）が起こった。劉少奇・鄧小平が経済の立て直しを進め、原爆の実験に成功した（1964）。
    - from: 1966
      to: 1976
      text: 毛沢東が文化大革命を起こし、紅衛兵が「実権派」を攻撃して劉少奇らが失脚した。中ソ国境紛争（1969）の後、ニクソン訪中（1972）と日中国交正常化で西側に近づき、国際連合の代表権を得た（1971）。1976年に周恩来・毛沢東が死に、四人組が逮捕された。
    - from: 1977
      to: 1991
      text: 鄧小平のもとで改革・開放政策が始まり、人民公社の解体・経済特区（深圳など）・外資の導入で市場経済が広がった。一人っ子政策（1979–2015）。1989年の天安門事件で民主化運動を武力で抑えた。
    - from: 1992
      to: 2011
      text: 「社会主義市場経済」をかかげて高い経済成長を続け、香港（1997）・マカオ（1999）が返還された。世界貿易機関（WTO）に加盟し（2001）、北京オリンピック（2008）を開き、2010年に国内総生産（GDP）で日本を抜いて世界第2位となった。
    - from: 2012
      text: 習近平のもとで党の統制と国家主席の権限が強まった（2018年の任期制限の撤廃）。「一帯一路」構想で影響力を広げ、南シナ海の領有を主張する。香港国家安全維持法（2020）で香港の一国二制度は大きく変わり、台湾への圧力も強めている。新疆のウイグル人などへの政策は国際的な批判を受けている。
  note: 元首の欄には実権を持つ指導者（共産党の主席・総書記など）を書いた。国家主席は劉少奇（1959–1968）・李先念（1983–1988）・楊尚昆（1988–1993）など。首相（国務院総理）は周恩来（1949–1976）・李鵬・朱鎔基・温家宝・李克強・李強
  source:
    - "https://ja.wikipedia.org/wiki/中華人民共和国"

- id: manchukuo
  name: 満洲国
