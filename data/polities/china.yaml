# G1 中国（中国本土・東北・台湾）の政体（1648–2025）
# 君主・元首の在位年は「その年を含む」。記憶にもとづく項目で確かめていないものは note に「要確認」と書いた。

- id: qing
  name: 清
  short: 清
  color: "#ecc978"
  kind: 帝国（満洲人の王朝）
  rulers:
    - {name: 順治帝, title: 皇帝, from: 1643, to: 1661, note: 1650年まで叔父のドルゴンが摂政, source: "https://ja.wikipedia.org/wiki/順治帝"}
    - {name: 康熙帝, title: 皇帝, from: 1661, to: 1722, note: 1669年にオボイを除いて親政, source: "https://ja.wikipedia.org/wiki/康熙帝"}
    - {name: 雍正帝, title: 皇帝, from: 1722, to: 1735, source: "https://ja.wikipedia.org/wiki/雍正帝"}
    - {name: 乾隆帝, title: 皇帝, from: 1735, to: 1796, note: 1796年に譲位した後も1799年の死まで太上皇帝として実権を握った, source: "https://ja.wikipedia.org/wiki/乾隆帝"}
    - {name: 嘉慶帝, title: 皇帝, from: 1796, to: 1820, source: "https://ja.wikipedia.org/wiki/嘉慶帝"}
    - {name: 道光帝, title: 皇帝, from: 1820, to: 1850, source: "https://ja.wikipedia.org/wiki/道光帝"}
    - {name: 咸豊帝, title: 皇帝, from: 1850, to: 1861, source: "https://ja.wikipedia.org/wiki/咸豊帝"}
    - {name: 同治帝, title: 皇帝, from: 1861, to: 1875, note: 母の西太后（と東太后）が垂簾聴政, source: "https://ja.wikipedia.org/wiki/同治帝"}
    - {name: 光緒帝, title: 皇帝, from: 1875, to: 1908, note: 実権は西太后。1898年の戊戌の変法の失敗の後は幽閉された, source: "https://ja.wikipedia.org/wiki/光緒帝"}
    - {name: 宣統帝（溥儀）, title: 皇帝, from: 1908, to: 1912, note: 父の醇親王載灃が摂政。1912年2月に退位, source: "https://ja.wikipedia.org/wiki/愛新覚羅溥儀"}
  periods:
    - from: 1648
      to: 1683
      text: 1644年に北京に入った清は、南明・鄭成功の抵抗を退けて中国本土を平定した。辮髪を強制し、漢人の官僚も用いる（満漢併用制）。1673年からの三藩の乱を康熙帝が鎮め、1683年に台湾の鄭氏を降して中国全土を固めた。
    - from: 1684
      to: 1795
      text: 康熙・雍正・乾隆の3代の最盛期。ネルチンスク条約（1689）でロシアとの国境を定め、ジュンガルを滅ぼして新疆を得て（1759）、モンゴル・チベット・青海・新疆を藩部として理藩院に治めさせた。地丁銀制で税が簡素になり、人口は3億人を超えた。ヨーロッパとの貿易は広州1港に限った（1757）。
    - from: 1796
      to: 1860
      text: 白蓮教徒の乱（1796–1804）で国力が傾く。アヘンの密輸で銀が流出し、アヘン戦争（1840–1842）に敗れて南京条約で香港を割譲し5港を開いた。太平天国（1851–1864）が江南を押さえ、アロー戦争（1856–1860）で北京を占領されて北京条約を結んだ。
    - from: 1861
      to: 1894
      text: 西太后のもとで曽国藩・李鴻章ら漢人官僚が洋務運動（「中体西用」）を進め、太平天国・捻軍・回民の反乱を鎮めた（同治中興）。清仏戦争（1884–1885）でベトナムの宗主権を失い、新疆省（1884）・台湾省（1885）を置いた。
    - from: 1895
      to: 1911
      text: 日清戦争に敗れて朝鮮の宗主権と台湾を失い、列強が租借地と勢力範囲を広げた（中国分割）。戊戌の変法（1898）は失敗し、義和団戦争（1900）で北京議定書を結ばされた。光緒新政で科挙を廃止し（1905）、立憲の準備を進めたが、辛亥革命で1912年に滅びた。
  note: 1648–1661年の実権者は摂政ドルゴン（–1650）。藩部（モンゴル・チベット・青海・新疆）は地図では清の色を薄く塗る（間接統治）
  source:
    - "https://ja.wikipedia.org/wiki/清"

- id: southern_ming
  name: 南明
  short: 南明
  color: "#b9cf9a"
  kind: 王朝（明の亡命政権）
  rulers:
    - {name: 永暦帝（桂王朱由榔）, title: 皇帝, from: 1646, to: 1662, note: 1659年にビルマへ逃れ、1662年に呉三桂に引き渡されて昆明で殺された。先立つ南明の皇帝は弘光帝（1644–1645）・隆武帝（1645–1646）, source: "https://ja.wikipedia.org/wiki/永暦帝"}
  periods:
    - from: 1648
      to: 1650
      text: 1644年の明の滅亡の後、明の皇族が南方で清に抵抗した。1648年には広東の李成棟・江西の金声桓が清から寝返り、永暦帝の勢力は一時、華南の大半に及んだが、1649–1650年に清軍が江西・湖南・広東・広西東部を取り戻した。
    - from: 1651
      to: 1662
      text: 張献忠の部将だった孫可望・李定国が永暦帝を奉じ、雲南・貴州を拠点に抵抗した。1652年に李定国が桂林・衡州で清軍を破ったが、孫可望と李定国が争い、孫可望は清に降った（1657）。清軍は1659年に昆明を落とし、永暦帝はビルマに逃れたが、1662年に殺された。
  note: 地図では1648年の勢力圏を不確実（斜線）を交えて描く。明の遺臣の抵抗は鄭成功（tungning）・夔東十三家などに続いた
  source:
    - "https://ja.wikipedia.org/wiki/南明"

- id: tungning
  name: 東寧（鄭氏台湾）
  names:
    - {to: 1661, name: 鄭成功の勢力（明の遺臣）, short: 鄭氏, kind: 海上勢力}
  short: 鄭氏台湾
  color: "#9fd0c8"
  kind: 王国（鄭氏の政権）
  rulers:
    - {name: 鄭成功（国姓爺）, title: 延平王, from: 1646, to: 1662, note: 永暦帝から延平王に封じられた。1661年に台湾に渡り、1662年に死去, source: "https://ja.wikipedia.org/wiki/鄭成功"}
    - {name: 鄭経, title: 延平王, from: 1662, to: 1681, source: "https://ja.wikipedia.org/wiki/鄭経"}
    - {name: 鄭克塽, title: 延平王, from: 1681, to: 1683, note: 1683年に清に降る, source: "https://ja.wikipedia.org/wiki/鄭克塽"}
  periods:
    - from: 1648
      to: 1661
      text: 平戸生まれの鄭成功は、清に降った父の鄭芝竜と別れて金門・廈門を拠点に海上貿易の富で抵抗を続けた。1659年に長江をさかのぼって南京を囲んだが敗れた。
    - from: 1662
      to: 1683
      text: 1661年に台湾に渡り、翌年オランダ東インド会社をゼーランディア城から追って、承天府（台南）を中心に政権を立てた。清は遷界令で沿岸の住民を内陸に移して鄭氏の貿易を断った。三藩の乱では鄭経が福建に出兵したが退き、1683年に施琅の清軍に降った。
  note: 1662年まで南明の永暦帝に従ったので、地図では南明の帯（overlord）を付ける
  source:
    - "https://ja.wikipedia.org/wiki/鄭氏政権"

- id: three_feudatories
  name: 三藩（呉三桂の周）
  names:
    - {to: 1677, name: 三藩の反乱勢力（呉三桂・耿精忠・尚之信）, short: 三藩}
    - {from: 1678, name: 周（呉三桂の政権）, short: 周（呉三桂）, kind: 王朝（反乱政権）}
  short: 三藩
  color: "#d8b0d8"
  kind: 反乱政権
  rulers:
    - {name: 呉三桂, title: 平西王→周の皇帝（1678）, from: 1673, to: 1678, source: "https://ja.wikipedia.org/wiki/呉三桂"}
    - {name: 呉世璠, title: 周の皇帝, from: 1678, to: 1681, note: 呉三桂の孫。1681年に昆明で自害, source: "https://ja.wikipedia.org/wiki/呉世璠"}
  periods:
    - from: 1673
      to: 1681
      text: 清の中国平定に功のあった漢人の武将、雲南の呉三桂・広東の尚可喜・福建の耿継茂（耿精忠）は藩王として大きな力を持った。康熙帝が藩の廃止を決めると呉三桂が挙兵し（1673）、耿精忠・尚之信・陝西の王輔臣も呼応して長江以南の大半が反乱側についた。康熙帝は漢人の緑営を用いて各個に降し、1681年に昆明を落とした。
  note: 地図では呉三桂の勢力と、呼応した耿精忠（福建、1674–1676）・王輔臣（陝西・甘粛、1674–1676）をまとめてこの政体で描く。尚之信（広東）が呼応した1676年は年末までに清に降ったので描いていない
  source:
    - "https://ja.wikipedia.org/wiki/三藩の乱"

- id: taiping
  name: 太平天国
  short: 太平天国
  color: "#e8a87c"
  kind: 王朝（反乱政権）
  rulers:
    - {name: 洪秀全, title: 天王, from: 1851, to: 1864, note: キリスト教の影響を受けた上帝会を作った。1864年6月に病死, source: "https://ja.wikipedia.org/wiki/洪秀全"}
    - {name: 洪天貴福, title: 幼天王, from: 1864, to: 1864, source: "https://en.wikipedia.org/wiki/Hong_Tianguifu"}
  periods:
    - from: 1851
      to: 1856
      text: 洪秀全の上帝会が広西の金田村で挙兵し（1851）、「滅満興漢」を唱えて長江を下り、1853年に南京を落として天京とした。天朝田畝制度（土地の均分）を掲げ、辮髪・纏足・アヘンを禁じた。北伐軍は天津に迫ったが敗れた。
    - from: 1856
      to: 1864
      text: 1856年の天京事変で楊秀清らが殺され、石達開も離れて勢いが衰えた。李秀成・陳玉成が蘇州・杭州など江南を取ったが、曽国藩の湘軍・李鴻章の淮軍と、ウォードやゴードンの常勝軍に押され、1864年に天京が落ちて滅びた。
  source:
    - "https://ja.wikipedia.org/wiki/太平天国"

- id: pingnan
  name: 平南国（杜文秀の政権）
  short: 杜文秀政権
  color: "#c7b8e0"
  kind: 反乱政権（回民の政権）
  rulers:
    - {name: 杜文秀, title: 総統兵馬大元帥（スルタン・スレイマン）, from: 1856, to: 1872, source: "https://ja.wikipedia.org/wiki/杜文秀"}
  periods:
    - from: 1856
      to: 1872
      text: 雲南の漢人と回民（ムスリム）の争いから回民の蜂起が広がり、杜文秀が大理を都に雲南西部を治めた（ヨーロッパではパンゼーの乱と呼ばれる）。漢人や少数民族も加え、ビルマ経由の交易を保ったが、清軍に包囲されて1872年末に大理が落ちた。
  source:
    - "https://en.wikipedia.org/wiki/Panthay_Rebellion"
    - "https://ja.wikipedia.org/wiki/杜文秀"

- id: roc
  name: 中華民国
  names:
    - {to: 1927, name: 中華民国（北京政府）}
    - {from: 1928, to: 1948, name: 中華民国（国民政府）}
    - {from: 1949, name: 中華民国（台湾）}
  short: 中華民国
  color: "#8fb0dc"
  kind: 共和国
  rulers:
    - {name: 孫文, title: 臨時大総統, from: 1912, to: 1912, note: 1月に南京で就任、3月に袁世凱に譲る, source: "https://ja.wikipedia.org/wiki/孫文"}
    - {name: 袁世凱, title: 大総統, from: 1912, to: 1916, note: 1915年12月に帝政を宣言（洪憲帝）したが、護国戦争で翌年3月に取り消し、6月に死去, source: "https://ja.wikipedia.org/wiki/袁世凱"}
    - {name: 黎元洪, title: 大総統, from: 1916, to: 1917, source: "https://ja.wikipedia.org/wiki/黎元洪"}
    - {name: 馮国璋, title: 代理大総統, from: 1917, to: 1918, note: 実権は国務総理の段祺瑞（安徽派）, source: "https://ja.wikipedia.org/wiki/馮国璋"}
    - {name: 徐世昌, title: 大総統, from: 1918, to: 1922, source: "https://ja.wikipedia.org/wiki/徐世昌"}
    - {name: 黎元洪, title: 大総統, from: 1922, to: 1923, source: "https://ja.wikipedia.org/wiki/黎元洪"}
    - {name: 曹錕, title: 大総統, from: 1923, to: 1924, source: "https://ja.wikipedia.org/wiki/曹錕"}
    - {name: 段祺瑞, title: 臨時執政, from: 1924, to: 1926, source: "https://ja.wikipedia.org/wiki/段祺瑞"}
    - {name: 張作霖, title: 陸海軍大元帥, from: 1927, to: 1928, note: 1926–1927年は摂政内閣。1928年6月に北京を退き、奉天へ戻る途中で関東軍に爆殺された, source: "https://ja.wikipedia.org/wiki/張作霖"}
    - {name: 蔣介石, title: 国民政府主席, from: 1928, to: 1931, note: 1928年2–10月の主席は譚延闓, source: "https://ja.wikipedia.org/wiki/蔣介石"}
    - {name: 林森, title: 国民政府主席, from: 1931, to: 1943, note: 名目上の元首。実権は軍事委員会委員長の蔣介石, source: "https://ja.wikipedia.org/wiki/林森"}
    - {name: 蔣介石, title: 国民政府主席→総統（1948）, from: 1943, to: 1949, note: 1949年1月に下野し、李宗仁が代理総統となった, source: "https://ja.wikipedia.org/wiki/蔣介石"}
    - {name: 蔣介石, title: 総統, from: 1950, to: 1975, note: 1950年3月に台北で総統に復帰, source: "https://ja.wikipedia.org/wiki/蔣介石"}
    - {name: 厳家淦, title: 総統, from: 1975, to: 1978, note: 実権は行政院長の蔣経国, source: "https://ja.wikipedia.org/wiki/厳家淦"}
    - {name: 蔣経国, title: 総統, from: 1978, to: 1988, source: "https://ja.wikipedia.org/wiki/蔣経国"}
    - {name: 李登輝, title: 総統, from: 1988, to: 2000, note: 本省人で初の総統。1996年に初の総統直接選挙, source: "https://ja.wikipedia.org/wiki/李登輝"}
    - {name: 陳水扁, title: 総統, from: 2000, to: 2008, note: 民主進歩党。初の政権交代, source: "https://ja.wikipedia.org/wiki/陳水扁"}
    - {name: 馬英九, title: 総統, from: 2008, to: 2016, source: "https://ja.wikipedia.org/wiki/馬英九"}
    - {name: 蔡英文, title: 総統, from: 2016, to: 2024, source: "https://ja.wikipedia.org/wiki/蔡英文"}
    - {name: 頼清徳, title: 総統, from: 2024, source: "https://ja.wikipedia.org/wiki/頼清徳"}
  periods:
    - from: 1912
      to: 1916
      text: 辛亥革命で清が倒れ、アジア初の共和国が生まれた。臨時大総統の孫文は宣統帝の退位と引きかえに地位を袁世凱に譲った。袁世凱は国民党を弾圧し（第二革命）、日本の二十一か条要求の大半を受け入れ、帝政を試みて失敗した。
    - from: 1916
      to: 1927
      text: 袁世凱の死後、北京政府は安徽派・直隷派・奉天派の軍閥が争奪し、各地に軍閥が割拠した。五・四運動（1919）で民族運動が高まり、孫文は広州で中国国民党を立て直して共産党と手を結んだ（第1次国共合作、1924）。
    - from: 1928
      to: 1937
      text: 北伐を終えた蔣介石の南京国民政府が中国を統一し、関税自主権を回復し幣制を改革した（1935）。一方で共産党の根拠地を攻め（長征）、日本は満洲事変（1931）で東北を奪い華北に迫った。西安事件（1936）を機に内戦を止めた。
    - from: 1937
      to: 1945
      text: 日中戦争。国民政府は南京・武漢を失い、重慶に移って抗戦した（第2次国共合作）。アメリカ・イギリスの援助（援蔣ルート）を受け、太平洋戦争で連合国の一員となり、不平等条約の撤廃（1943）、カイロ会談に参加した。国際連合の安全保障理事会の常任理事国となった。
    - from: 1946
      to: 1949
      text: 国共内戦。インフレと腐敗で支持を失い、遼瀋・淮海・平津の三大戦役に敗れて、1949年12月に政府を台湾の台北に移した。
    - from: 1950
      to: 1987
      text: 台湾・澎湖・金門・馬祖を治め、「大陸反攻」を唱えた。アメリカと相互防衛条約を結び（1954）、戒厳令のもと国民党の一党支配が続いた（二・二八事件〈1947〉以後の白色テロ）。輸出主導の工業化で経済が成長し（アジアNIEs）、1971年に国際連合の代表権を失い、日本（1972）・アメリカ（1979）と断交した。
    - from: 1988
      text: 1987年の戒厳令の解除の後、李登輝のもとで民主化が進み、総統の直接選挙（1996）と政権交代（2000）が実現した。中国大陸との経済の結びつきが深まる一方、中華人民共和国は統一を求めて圧力を強めている。
  note: 1916–1928年の北京政府の元首は、軍閥の力関係で頻繁に交代した。広州の孫文の政府は canton_government として別に描く。1949年以後、中華人民共和国は台湾を自国の一部とし、中華民国（台湾）を承認する国は少ない（地図は実際の統治で塗る）
  source:
    - "https://ja.wikipedia.org/wiki/中華民国_(1912年-1949年)"
    - "https://ja.wikipedia.org/wiki/中華民国"

- id: canton_government
  name: 広州の革命政府（護法軍政府→国民政府）
  names:
    - {to: 1924, name: 護法軍政府（広州）, short: 広州政府, kind: 軍政府}
    - {from: 1925, name: 国民政府（広州→武漢・南京）, short: 国民政府, kind: 政府（中国国民党）}
  short: 広州政府
  color: "#9cc3c9"
  kind: 政府
  rulers:
    - {name: 孫文, title: 大元帥・非常大総統（1921）, from: 1917, to: 1925, note: 1918–1920年は広西派に追われて上海にいた。1922年に陳炯明の反乱で広州を追われ、1923年に大元帥として復帰。1925年3月に北京で死去, source: "https://ja.wikipedia.org/wiki/孫文"}
    - {name: 汪兆銘, title: 国民政府主席, from: 1925, to: 1926, source: "https://ja.wikipedia.org/wiki/汪兆銘"}
    - {name: 譚延闓, title: 国民政府主席, from: 1926, to: 1927, note: 実権は国民革命軍総司令の蔣介石。1927年4月に蔣介石が南京に国民政府を立て、武漢の国民政府（汪兆銘）と分かれた（寧漢分裂、9月に合流）, source: "https://ja.wikipedia.org/wiki/譚延闓"}
  periods:
    - from: 1917
      to: 1923
      text: 北京政府が国会と臨時約法を無視したのに反対して、孫文は広州で護法軍政府を作った（護法運動）。西南の軍閥に左右され、孫文は何度も広州を追われた。
    - from: 1924
      to: 1927
      text: 孫文はソ連の援助を受けて中国国民党を改組し、共産党員の入党を認め（第1次国共合作）、黄埔軍官学校を作った。孫文の死後、1925年に国民政府ができ、1926年から蔣介石の国民革命軍が北伐を進めた。1927年4月の上海クーデタで共産党と分かれ、南京に国民政府を置いた。
  note: 1928年の北伐の完了で、国民政府が中華民国（roc）の政府となる
  source:
    - "https://ja.wikipedia.org/wiki/護法運動"
    - "https://ja.wikipedia.org/wiki/国民政府"

- id: chinese_soviet
  name: 中国共産党の政権（ソヴィエト区・辺区・解放区）
  names:
    - {to: 1936, name: 中華ソヴィエト共和国, short: 中華ソヴィエト, kind: 共和国（中国共産党）}
    - {from: 1937, to: 1945, name: 陝甘寧辺区（中国共産党）, short: 陝甘寧辺区, kind: 辺区（中国共産党）}
    - {from: 1946, name: 中国共産党の解放区, short: 解放区, kind: 中国共産党の支配地域}
  short: 中国共産党
  color: "#f2a596"
  kind: 中国共産党の政権
  rulers:
    - {name: 毛沢東, title: 中華ソヴィエト共和国中央執行委員会主席→中国共産党主席（1943）, from: 1931, to: 1949, note: 1931–1934年の党の実権はソ連帰りの指導部（博古ら）。1935年の遵義会議で毛沢東の指導権が固まった, source: "https://ja.wikipedia.org/wiki/毛沢東"}
  periods:
    - from: 1931
      to: 1936
      text: 国共合作の崩壊（1927）の後、中国共産党は農村に根拠地（ソヴィエト区）を作り、1931年に江西の瑞金で中華ソヴィエト共和国臨時政府を立てた。国民政府軍の包囲攻撃で1934年に瑞金を捨て、長征で陝西北部に移った（1935）。
    - from: 1937
      to: 1945
      text: 第2次国共合作で紅軍は国民革命軍の八路軍・新四軍となり、延安を中心とする陝甘寧辺区は国民政府の下の地方政府とされた。日本軍の後方の華北・華中に根拠地を広げ、土地改革（減租減息）で農民の支持を得た。
    - from: 1946
      to: 1949
      text: 国共内戦。人民解放軍は満洲を押さえ、三大戦役（遼瀋・淮海・平津）で国民政府軍を破った。1949年10月1日に中華人民共和国を建てた。
  note: 1949年10月の中華人民共和国（prc）の成立までの共産党の支配地をこの政体で描く。1937–1945年は国民政府の帯（overlord）を付ける。日本軍の後方の抗日根拠地（晋察冀など）は境界が定まらないので描いていない
  source:
    - "https://ja.wikipedia.org/wiki/中華ソビエト共和国"
    - "https://ja.wikipedia.org/wiki/陝甘寧辺区"
    - "https://ja.wikipedia.org/wiki/国共内戦"

- id: prc
  name: 中華人民共和国
  short: 中国
  color: "#ee8f88"
  kind: 共和国（中国共産党の一党支配）
  rulers:
    - {name: 毛沢東, title: 中国共産党主席（国家主席 1949–1959）, from: 1949, to: 1976, source: "https://ja.wikipedia.org/wiki/毛沢東"}
    - {name: 華国鋒, title: 中国共産党主席, from: 1976, to: 1978, note: 1981年まで党主席だが、1978年の三中全会から実権は鄧小平に移った, source: "https://ja.wikipedia.org/wiki/華国鋒"}
    - {name: 鄧小平, title: 最高指導者（党副主席・中央軍事委員会主席）, from: 1978, to: 1989, note: 党の総書記は胡耀邦（1982–1987）・趙紫陽（1987–1989）。1992年の南巡講話まで影響力を持った, source: "https://ja.wikipedia.org/wiki/鄧小平"}
    - {name: 江沢民, title: 中国共産党総書記（国家主席 1993–2003）, from: 1989, to: 2002, source: "https://ja.wikipedia.org/wiki/江沢民"}
    - {name: 胡錦濤, title: 中国共産党総書記・国家主席, from: 2002, to: 2012, source: "https://ja.wikipedia.org/wiki/胡錦濤"}
    - {name: 習近平, title: 中国共産党総書記・国家主席, from: 2012, source: "https://ja.wikipedia.org/wiki/習近平"}
  periods:
    - from: 1949
      to: 1957
      text: 毛沢東を主席として成立。中ソ友好同盟相互援助条約（1950）を結び、朝鮮戦争に人民義勇軍を送った。土地改革法（1950）で地主の土地を農民に分け、第1次五か年計画（1953）でソ連型の重工業化と農業の集団化を進めた。
    - from: 1958
      to: 1965
      text: 「大躍進」と人民公社で急激な増産をめざしたが失敗し、数千万人とされる餓死者を出した。中ソ対立が深まり、中印国境紛争（1962）が起こった。劉少奇・鄧小平が経済の立て直しを進め、原爆の実験に成功した（1964）。
    - from: 1966
      to: 1976
      text: 毛沢東が文化大革命を起こし、紅衛兵が「実権派」を攻撃して劉少奇らが失脚した。中ソ国境紛争（1969）の後、ニクソン訪中（1972）と日中国交正常化で西側に近づき、国際連合の代表権を得た（1971）。1976年に周恩来・毛沢東が死に、四人組が逮捕された。
    - from: 1977
      to: 1991
      text: 鄧小平のもとで改革・開放政策が始まり、人民公社の解体・経済特区（深圳など）・外資の導入で市場経済が広がった。一人っ子政策（1979–2015）。1989年の天安門事件で民主化運動を武力で抑えた。
    - from: 1992
      to: 2011
      text: 「社会主義市場経済」をかかげて高い経済成長を続け、香港（1997）・マカオ（1999）が返還された。世界貿易機関（WTO）に加盟し（2001）、北京オリンピック（2008）を開き、2010年に国内総生産（GDP）で日本を抜いて世界第2位となった。
    - from: 2012
      text: 習近平のもとで党の統制と国家主席の権限が強まった（2018年の任期制限の撤廃）。「一帯一路」構想で影響力を広げ、南シナ海の領有を主張する。香港国家安全維持法（2020）で香港の一国二制度は大きく変わり、台湾への圧力も強めている。新疆のウイグル人などへの政策は国際的な批判を受けている。
  note: 元首の欄には実権を持つ指導者（共産党の主席・総書記など）を書いた。国家主席は劉少奇（1959–1968）・李先念（1983–1988）・楊尚昆（1988–1993）など。首相（国務院総理）は周恩来（1949–1976）・李鵬・朱鎔基・温家宝・李克強・李強
  source:
    - "https://ja.wikipedia.org/wiki/中華人民共和国"

- id: manchukuo
  name: 満洲国
  names:
    - {from: 1934, name: 満洲帝国, kind: 帝国（日本の傀儡国家）}
  short: 満洲国
  color: "#d9c27c"
  kind: 国家（日本の傀儡国家）
  rulers:
    - {name: 溥儀, title: 執政→皇帝（康徳帝、1934）, from: 1932, to: 1945, note: 清の最後の皇帝。実権は関東軍と日本人官吏が握った（内面指導）, source: "https://ja.wikipedia.org/wiki/愛新覚羅溥儀"}
  periods:
    - from: 1932
      to: 1945
      text: 満洲事変の後、関東軍が清の廃帝溥儀を執政として建てた国（首都は新京〈長春〉）。「五族協和」「王道楽土」を唱えたが、国際連盟のリットン調査団は日本の自衛と認めず、日本は連盟を脱退した（1933）。日本からの開拓団の移民と重工業化が進められた。1945年8月のソ連軍の進攻で崩れた。
  note: 地図では overlord を japan（日本）にする。内モンゴル東部（興安省）・熱河は G2・G1 のピース
  source:
    - "https://ja.wikipedia.org/wiki/満洲国"

- id: wang_jingwei
  name: 汪兆銘政権（南京国民政府）
  short: 汪兆銘政権
  color: "#bfc9a2"
  kind: 政府（日本の傀儡政権）
  rulers:
    - {name: 汪兆銘（汪精衛）, title: 国民政府主席, from: 1940, to: 1944, note: 1944年11月に名古屋で病死, source: "https://ja.wikipedia.org/wiki/汪兆銘"}
    - {name: 陳公博, title: 代理主席, from: 1944, to: 1945, source: "https://ja.wikipedia.org/wiki/陳公博"}
  periods:
    - from: 1940
      to: 1945
      text: 国民党の副総裁だった汪兆銘は重慶を脱出し、日本の「東亜新秩序」に応じて1940年3月に南京で国民政府を名のった。それまでの臨時政府（北京）・維新政府（南京）を合わせたが、実際は日本軍の占領地の都市と鉄道沿いを治めるだけで、農村には共産党の根拠地が広がった。1945年8月の日本の降伏で消えた。
  note: 地図では overlord を japan（日本）にする。華北は華北政務委員会として形の上でこの政権に属した。1940年以後に日本軍が占領した所（大陸打通作戦など）は日本の占領地として描く
  source:
    - "https://ja.wikipedia.org/wiki/汪兆銘政権"

- id: east_hebei
  name: 冀東防共自治政府
  short: 冀東政府
  color: "#c9b99a"
  kind: 自治政府（日本の傀儡政権）
  rulers:
    - {name: 殷汝耕, title: 委員長→政務長官, from: 1935, to: 1938, source: "https://ja.wikipedia.org/wiki/殷汝耕"}
  periods:
    - from: 1935
      to: 1937
      text: 日本の華北分離工作で、塘沽停戦協定の非武装地帯（河北省東部）に作られた政権（通州、のち唐山）。日本の密輸の窓口となった。1937年7月の通州事件の後、1938年2月に中華民国臨時政府に合流した。
  note: 地図では overlord を japan（日本）にする
  source:
    - "https://ja.wikipedia.org/wiki/冀東防共自治政府"
