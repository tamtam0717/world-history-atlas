- id: ming
  name: 明
  short: 明
  color: "#faae9f"
  kind: 帝国（漢人の王朝）
  rulers:
    - {name: 景泰帝, title: 皇帝, from: 1449, to: 1457, note: 土木の変（1449）で兄の正統帝がオイラトに捕らえられたため即位した。1457年の奪門の変で廃される, source: "https://ja.wikipedia.org/wiki/景泰帝"}
    - {name: 英宗（正統帝の復位、天順年間）, title: 皇帝, from: 1457, to: 1464, note: 1435–1449年の正統帝が奪門の変で復位した。この時期の年号から天順帝ともいう, source: "https://ja.wikipedia.org/wiki/正統帝"}
    - {name: 成化帝, title: 皇帝, from: 1464, to: 1487, source: "https://ja.wikipedia.org/wiki/成化帝"}
    - {name: 弘治帝, title: 皇帝, from: 1487, to: 1505, source: "https://ja.wikipedia.org/wiki/弘治帝"}
    - {name: 正徳帝, title: 皇帝, from: 1505, to: 1521, note: 宦官の劉瑾が権勢をふるった（1510年に処刑）, source: "https://ja.wikipedia.org/wiki/正徳帝"}
    - {name: 嘉靖帝, title: 皇帝, from: 1521, to: 1566, note: 晩年は道教に没頭し、厳嵩が実権を握った, source: "https://ja.wikipedia.org/wiki/嘉靖帝"}
    - {name: 隆慶帝, title: 皇帝, from: 1567, to: 1572, source: "https://ja.wikipedia.org/wiki/隆慶帝"}
    - {name: 万暦帝, title: 皇帝, from: 1572, to: 1620, note: 即位から1582年までは内閣大学士の張居正が政治を主導した, source: "https://ja.wikipedia.org/wiki/万暦帝"}
    - {name: 泰昌帝, title: 皇帝, from: 1620, to: 1620, note: 在位1か月で死去（紅丸の案）, source: "https://ja.wikipedia.org/wiki/泰昌帝"}
    - {name: 天啓帝, title: 皇帝, from: 1620, to: 1627, note: 宦官の魏忠賢が東林党を弾圧した, source: "https://ja.wikipedia.org/wiki/天啓帝"}
    - {name: 崇禎帝, title: 皇帝, from: 1627, to: 1644, note: 1644年4月、李自成軍が北京に入り、紫禁城の裏の景山で自害した, source: "https://ja.wikipedia.org/wiki/崇禎帝"}
  periods:
    - from: 1453
      to: 1505
      text: 土木の変（1449）で正統帝がオイラトのエセンに捕らえられ、明は守りに転じた。奪門の変（1457）で正統帝が復位。モンゴルのオルドス進出に備えて、成化年間から辺牆（長城）を築き（多くは土を突き固めたもの）、16世紀後半にかけて、今に残るれんが造りの長城に築き直していった。
    - from: 1506
      to: 1566
      text: 正徳帝・嘉靖帝のもとで宦官や権臣が政治を乱した。北からはアルタン＝ハンが毎年のように侵入して1550年には北京を包囲し（庚戌の変）、南の沿岸では海禁に背く密貿易の倭寇（後期倭寇、多くは中国人）が荒れた（北虜南倭）。
    - from: 1567
      to: 1582
      text: 隆慶帝が海禁をゆるめて民間の海外貿易を認め（1567）、1571年にはアルタン＝ハンと和議を結んで互市を開いた（隆慶和議）。万暦帝の初めの10年は張居正が財政を立て直し、一条鞭法を全国に広げ、検地を行った。日本とアメリカ大陸の銀が流れ込んだ。
    - from: 1583
      to: 1620
      text: 張居正の死後、万暦帝は政務を放り出し、寧夏の役・朝鮮の役（壬辰・丁酉倭乱）・播州の役（万暦の三大征）の出費と鉱税で民を苦しめた。官僚は東林派と非東林派に分かれて争った。1619年、サルフの戦いで後金のヌルハチに大敗した。
    - from: 1621
      to: 1644
      text: 天啓帝のもとで宦官の魏忠賢が東林党を弾圧。崇禎帝は立て直しを図ったが、後金（清）に遼東を奪われ、その軍費の増税（遼餉）と飢饉で陝西から農民反乱が広がった。1644年、李自成が北京を落として明は滅び、明の皇族は南方で南明の政権を立てた。
  note: 地図では、西南の土司の地（貴州・広西西部・雲南の辺境など）とチベット東部の羈縻の地は薄い色（間接統治）、遼東の外の女真やモンゴルの羈縻衛所は白い斜線（名目的な支配）で描く
  source:
    - "https://ja.wikipedia.org/wiki/明"

