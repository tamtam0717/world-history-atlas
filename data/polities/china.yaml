- id: wang_jingwei
  name: 汪兆銘政権（南京国民政府）
  short: 汪兆銘政権
  color: "#bfc9a2"
  kind: 政府（日本の傀儡政権）
  rulers:
    - {name: 汪兆銘（汪精衛）, title: 国民政府主席, from: 1940, to: 1944, note: 1944年11月に名古屋で病死, source: "https://ja.wikipedia.org/wiki/汪兆銘"}
