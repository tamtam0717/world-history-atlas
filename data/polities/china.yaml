  name: 後金
  names:
    - {to: 1615, name: 建州女真（ヌルハチの勢力）, short: 建州女真, kind: 部族連合（女真）}
  short: 後金
  color: "#ddb860"
  kind: 王国（女真人＝満洲人の国家）
  rulers:
    - {name: ヌルハチ（太祖）, title: 建州女真の首長→ハン（1616）, from: 1583, to: 1626, note: 1583年に挙兵し、1588年ごろ建州女真を統一。1616年にハンの位について国号を金（後金）とした。八旗を作り、満洲文字を作らせた, source: "https://ja.wikipedia.org/wiki/ヌルハチ"}
    - {name: ホンタイジ（太宗）, title: ハン, from: 1626, to: 1636, note: 1636年に皇帝を名のり、国号を清とした（以後は qing）, source: "https://ja.wikipedia.org/wiki/ホンタイジ"}
  periods:
    - from: 1583
      to: 1615
      text: 建州女真のヌルハチが挙兵し、明の遼東総兵の李成梁と結びながら周りの部族を統一した。海西女真（フルン四部）のハダ・ホイファ・ウラを次々に滅ぼし、毛皮と朝鮮人参の交易で力をつけた。八旗の制度を整えた。
    - from: 1616
      to: 1626
      text: ヌルハチは1616年にハンの位について後金を建て、1618年に「七大恨」を掲げて明に挑み、撫順を落とした。1619年のサルフの戦いで明・朝鮮の連合軍を破ってイェヘを滅ぼし、1621年に瀋陽・遼陽を取って遼東を手に入れた（1625年に瀋陽へ遷都）。1626年、寧遠城で袁崇煥に敗れ、まもなく死去。
    - from: 1627
      to: 1636
      text: ホンタイジは朝鮮に出兵して兄弟の盟を結ばせ（丁卯胡乱、1627）、長城を越えて北京近くまで侵入した。内モンゴルの諸部を従え、1635年にチャハルのリンダン＝ハンの子エジェイを降して元の玉璽を得た。民族名を女真から満洲に改めた。
  note: 1636年に清となるので、地図では1636年から qing で描く
  source:
    - "https://ja.wikipedia.org/wiki/後金"

- id: hulun
  name: 海西女真（フルン四部）
  short: フルン四部
  color: "#d4c49c"
  kind: 部族連合（女真）
  periods:
    - from: 1560
      to: 1619
      text: 松花江の流域の海西女真は、16世紀にハダ・イェヘ・ウラ・ホイファの4部（フルン＝グルン）にまとまり、明の開原と交易した。ハダのワン（王台）が強かったが、のちイェヘが中心となり、1593年に九部の連合軍でヌルハチを攻めて敗れた。ヌルハチはハダ（1599）・ホイファ（1607）・ウラ（1613）・イェヘ（1619）を順に滅ぼした。
  note: 地図では4部をまとめて1つの政体で描く。明の羈縻衛所でもあった
  source:
    - "https://en.wikipedia.org/wiki/Hulun_alliance"

- id: shun
  name: 大順（李自成の政権）
  short: 大順
  color: "#9bafe9"
  kind: 王朝（農民反乱の政権）
  rulers:
    - {name: 李自成, title: 新順王（1643）→大順王（1644）, from: 1643, to: 1645, note: 1644年の元日（旧暦。西暦では2月）に西安で国号を大順と定め、4月に北京を落とした。1645年に湖北の九宮山で殺された, source: "https://ja.wikipedia.org/wiki/李自成"}
  periods:
    - from: 1641
      to: 1645
      text: 陝西の飢民の反乱（明末の農民反乱）から頭角を現した李自成は、「均田免賦」を唱えて河南で勢いを増し、洛陽（1641）・襄陽（1643）・西安（1643）を取った（開封は3度囲んだが落とせず、1642年に黄河の堤が切られて水没した）。1644年4月に北京を落として明を滅ぼしたが、山海関で呉三桂と清の連合軍に敗れ、西安を経て湖北へ逃れ、1645年に殺された。残党は南明に合流した。
  source:
    - "https://ja.wikipedia.org/wiki/李自成の乱"

- id: daxi
  name: 大西（張献忠の政権）
  short: 大西
  color: "#c4c496"
  kind: 王朝（農民反乱の政権）
  rulers:
    - {name: 張献忠, title: 大西王→大西の皇帝（1644）, from: 1643, to: 1646, note: 1643年に武昌で大西王を名のり、1644年に成都で皇帝となった。1647年1月、西充で清軍に討たれた, source: "https://ja.wikipedia.org/wiki/張献忠"}
  periods:
    - from: 1643
      to: 1647
      text: 李自成と並ぶ明末の農民反乱の指導者張献忠は、1643年に武昌・長沙を取り、1644年に四川に入って成都で大西を建てた。抵抗する住民を大量に殺したと伝えられ、四川の人口は激減した。1647年の張献忠の死後、部将の孫可望・李定国は貴州を経て雲南に入り、明の黔国公沐天波を助けるという名目で昆明を押さえた（地図では1647年から南明の不確実な支配として描く）。
  source:
    - "https://ja.wikipedia.org/wiki/張献忠"
