  short: ボルヌ
  color: "#c49a74"
  kind: 王国（スルタン国）
  rulers:
    - {name: アリー・イブン・ウマル, title: マイ（王）, from: 1639, to: 1677, note: サイファワ朝。在位年は諸説, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: イドリース, title: マイ, from: 1677, to: 1696, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: ドゥナマ, title: マイ, from: 1696, to: 1715, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: ハムダン, title: マイ, from: 1715, to: 1729, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: ムハンマド, title: マイ, from: 1729, to: 1744, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: アリー・イブン・ドゥナマ, title: マイ, from: 1747, to: 1792, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: アフマド, title: マイ, from: 1792, to: 1808, note: ジハードのフルベ軍に都ンガザルガムを奪われた, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: ムハンマド・アル・アミーン・アル・カネミ, title: シェフ（実権者）, from: 1809, to: 1837, note: カネム出身の学者。フルベを退けてボルヌを救い、サイファワ朝のマイを名目の王として実権を握った, source: "https://en.wikipedia.org/wiki/Muhammad_al-Amin_al-Kanemi"}
    - {name: ウマル, title: シェフ（1846年から王）, from: 1837, to: 1881, note: 1846年にサイファワ朝が絶え、カネミ家が王家となった, source: "https://en.wikipedia.org/wiki/Umar_of_Borno"}
    - {name: ブカル・クラ, title: シェフ, from: 1881, to: 1884, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: イブラーヒーム, title: シェフ, from: 1884, to: 1885, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
    - {name: ハーシム, title: シェフ, from: 1885, to: 1893, note: ラービフに敗れた, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bornu"}
  periods:
    - from: 1648
      to: 1807
      text: チャド湖の西を中心とする古いイスラーム王国（サイファワ朝、都ンガザルガム）。サハラ交易（トリポリへの道）で栄えたが、18世紀には干ばつと周辺の反乱で弱まった。
    - from: 1808
      to: 1892
      text: ジハードのフルベに都を奪われたが、学者アル・カネミが立て直し、クカワを拠点とした。1846年からはカネミ家が王となった。
    - from: 1893
      to: 1902
      text: スーダンから来たラービフに征服された（1893年）。ラービフの死（1900年）の後、王家はイギリス・ドイツ・フランスの分割の下で復位した。
  note: 1902年以後、西部はイギリス（ボルヌ首長国。シェフの位は現在も続く）、東部（ディクワ）はドイツ、カネム・チャド湖東岸はフランスの支配下に入った。
  source: "https://ja.wikipedia.org/wiki/カネム・ボルヌ帝国"

- id: rabih
