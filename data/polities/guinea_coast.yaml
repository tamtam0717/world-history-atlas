  short: ボコ・ハラム
  color: "#8f8c7c"
  kind: イスラーム武装組織
  periods:
    - from: 2014
      to: 2015
      text: ナイジェリア北東部のイスラーム武装組織ボコ・ハラム（2002年ごろ結成。指導者シェカウ）がボルヌ州などを制圧し、「カリフ国」を宣言した（2014年8月）。2015年にナイジェリア・チャド・ニジェール・カメルーンの軍に押し返された。
    - from: 2016
      to: 2025
      text: 「イスラム国」に忠誠を誓った派（ISWAP）がボコ・ハラムから分かれ、チャド湖岸の農村と島々を支配している。シェカウ派（JAS）は2021年にISWAPとの戦いで指導者を失った。
  note: 地図では支配が及んだ範囲を不確実（斜線）で描く。範囲は変動が大きく、要確認。
  source: "https://ja.wikipedia.org/wiki/ボコ・ハラム"
