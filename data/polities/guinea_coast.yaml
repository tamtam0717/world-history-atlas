  short: バムン
  color: "#b597c8"
  kind: 王国
  rulers:
    - {name: ムブエンブエ, title: 王（ムフォン）, from: 1757, to: 1814, note: 王国の領域を広げた。在位年は諸説, source: "https://en.wikipedia.org/wiki/Bamum_Kingdom"}
    - {name: イブラヒム・ンジョヤ, title: 王, from: 1889, to: 1931, note: バムン文字を作り、ドイツと協調した。1931年にフランスに廃された, source: "https://en.wikipedia.org/wiki/Ibrahim_Njoya"}
  note: カメルーン西部の草原地帯、フンバンを都とする王国（14世紀末の建国とされる）。
  source: "https://en.wikipedia.org/wiki/Bamum_Kingdom"

- id: bagirmi
  name: バギルミ王国
  short: バギルミ
  color: "#cec7a1"
  kind: 王国（スルタン国）
  rulers:
    - {name: アブドゥッラフマーン・ガウラン1世, title: ムバン（王）, from: 1785, to: 1806, note: ワダイに敗れた, source: "https://en.wikipedia.org/wiki/Kingdom_of_Baguirmi"}
    - {name: アブドゥッラフマーン・ガウラン2世, title: ムバン, from: 1883, to: 1918, note: ラービフに追われ、1897年にフランスの保護を受け入れた, source: "https://en.wikipedia.org/wiki/Kingdom_of_Baguirmi"}
  periods:
    - from: 1648
