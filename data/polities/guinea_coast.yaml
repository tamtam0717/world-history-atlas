    - {name: イブラーヒーム, title: コラク, from: 1898, to: 1901, source: "https://en.wikipedia.org/wiki/Wadai_Empire"}
    - {name: ムハンマド・サーリフ（ドゥド・ムッラ）, title: コラク, from: 1902, to: 1911, note: フランス軍と戦い、1909年に都アベシェを失った。1911年に降伏, source: "https://en.wikipedia.org/wiki/Dud_Murra"}
