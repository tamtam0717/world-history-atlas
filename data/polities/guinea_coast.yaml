  note: マンダラ山地の北のモラ（のちドゥロ）を都とする王国。18世紀にイスラームを受け入れ、ボルヌ・アダマワのフルベと争った。1902年にドイツの支配下に入った。
  source: "https://en.wikipedia.org/wiki/Wandala"

- id: bamum
