  color: "#be93af"
  kind: 軍事国家
  rulers:
    - {name: ラービフ・ズバイル, title: 支配者, from: 1879, to: 1900, note: スーダンの奴隷商人ズバイルの部下。マフディー運動の時期に西へ移り、バギルミ・ボルヌを征服した。1900年4月にクセリの戦いでフランス軍に敗れて死んだ, source: "https://en.wikipedia.org/wiki/Rabih_az-Zubayr"}
    - {name: ファドルッラー, title: 支配者（ラービフの子）, from: 1900, to: 1901, source: "https://en.wikipedia.org/wiki/Rabih_az-Zubayr"}
  periods:
    - from: 1879
      to: 1892
      text: スーダンの奴隷商人ズバイルの部下ラービフが、ズバイルの失脚の後に兵を率いて西へ移り、バハル・アル＝ガザルからダール・アル＝クーティ（いまの中央アフリカ共和国北部）で奴隷狩りを行った。
    - from: 1893
      to: 1900
      text: スーダン出身の軍人ラービフがボルヌを征服し、ディクワを都とした軍事国家。奴隷狩りで南の人々を苦しめ、フランス・イギリスと対立した。
  note: 1880年代後半にはいまの中央アフリカ共和国北部（ダール・アル＝クーティ）を拠点に奴隷狩りを行った（地図では1886–90年）。
  source: "https://en.wikipedia.org/wiki/Rabih_az-Zubayr"

# ===== カメルーン・チャド =====
- id: mandara
  name: マンダラ王国（ワンダラ）
