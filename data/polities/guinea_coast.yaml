# F2 ギニア湾・ナイジェリア・カメルーン・チャド（GHA・TGO・BEN・NGA・CMR・TCD・GNQ・STP）の政体（1648–2025）
# 他の担当が参照しうる ID：ashanti・dahomey・oyo・benin_kingdom・sokoto・bornu・wadai・bagirmi・rabih・hausa_states・borgu
#   ghana・togo・benin・nigeria・biafra・cameroon・chad・equatorial_guinea・sao_tome・boko_haram
# イギリス（britain）・フランス（france）・ドイツ帝国（german_empire）・オランダ（netherlands）・デンマーク（denmark）・スウェーデン（sweden）
# ・プロイセン（prussia＝ブランデンブルク）・スペイン（spain）・ポルトガル（portugal）・リビア（libya）・サヌーシー教団（senussi）・オスマン帝国（ottoman）は他の担当の政体を使う。

# ===== 黄金海岸（ガーナ）=====
- id: ashanti
  name: アシャンティ王国
  short: アシャンティ
  color: "#d9b25a"
  kind: 王国（アカン人の連合王国）
  rulers:
    - {name: オセイ・トゥトゥ1世, title: アシャンティヘネ（王）, from: 1680, to: 1717, note: 1670–80年代にクマシの首長となり、神官オコンフォ・アノチェとともに諸首長国を「黄金の床几」のもとにまとめた。1701年にデンキラを破った。在位の始まりは諸説, source: "https://en.wikipedia.org/wiki/Osei_Kofi_Tutu_I"}
    - {name: オポク・ワレ1世, title: アシャンティヘネ, from: 1720, to: 1750, note: ボノ・ギャマン・アキェム・アクラを従え、王国を最大にした（1717–20年は空位）, source: "https://en.wikipedia.org/wiki/Opoku_Ware_I"}
    - {name: クシ・オボドム, title: アシャンティヘネ, from: 1750, to: 1764, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_the_Ashanti"}
    - {name: オセイ・クワドウォ, title: アシャンティヘネ, from: 1764, to: 1777, note: 官僚制を整えた, source: "https://en.wikipedia.org/wiki/Osei_Kwadwo"}
    - {name: オセイ・クワメ, title: アシャンティヘネ, from: 1777, to: 1803, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_the_Ashanti"}
    - {name: オポク・フォフィエ, title: アシャンティヘネ, from: 1803, to: 1804, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_the_Ashanti"}
    - {name: オセイ・ボンス（オセイ・トゥトゥ・クワメ）, title: アシャンティヘネ, from: 1804, to: 1823, note: 海岸のファンテに遠征し（1806–07年など）、イギリスと争った, source: "https://en.wikipedia.org/wiki/Osei_Bonsu"}
    - {name: オセイ・ヤウ・アコト, title: アシャンティヘネ, from: 1824, to: 1834, note: 1824年にイギリス軍を破ったが、1826年のカタマンソの戦いで敗れた, source: "https://en.wikipedia.org/wiki/Osei_Yaw_Akoto"}
    - {name: クワク・ドゥア1世, title: アシャンティヘネ, from: 1834, to: 1867, source: "https://en.wikipedia.org/wiki/Kwaku_Dua_I"}
    - {name: コフィ・カリカリ, title: アシャンティヘネ, from: 1867, to: 1874, note: 第3次アシャンティ戦争でクマシを焼かれた, source: "https://en.wikipedia.org/wiki/Kofi_Karikari"}
    - {name: メンサ・ボンス, title: アシャンティヘネ, from: 1874, to: 1883, source: "https://en.wikipedia.org/wiki/Mensa_Bonsu"}
    - {name: クワク・ドゥア2世, title: アシャンティヘネ, from: 1884, to: 1884, note: 即位後まもなく死去。1884–88年は内戦と空位, source: "https://en.wikipedia.org/wiki/Kwaku_Dua_II"}
    - {name: プレンペ1世, title: アシャンティヘネ, from: 1888, to: 1896, note: 1896年にイギリスに捕らえられ、セーシェルに流された。1924年に帰国し、1926年からクマシの首長, source: "https://en.wikipedia.org/wiki/Prempeh_I"}
  periods:
    - from: 1680
      to: 1750
      text: クマシを中心にアカン人の首長国が「黄金の床几」のもとに連合し、デンキラを破って自立（1701年）。金と奴隷の交易で、黄金海岸の内陸の大部分と北のゴンジャ・ダゴンバを従えた。
    - from: 1751
      to: 1873
      text: 道路網と官僚制を持つ中央集権の王国。海岸のファンテとイギリスの砦をめぐって何度も戦った（1824年にはイギリス軍を破る）。奴隷貿易の廃止の後は金・コーラの実の交易で栄えた。
    - from: 1874
      to: 1901
      text: 第3次アシャンティ戦争でクマシを焼かれ（1874年）、南部・周辺の諸国が離れた。1896年にイギリスが王を流し、1900年の黄金の床几戦争（ヤア・アサンテワの抵抗）の後、植民地として併合された。
  note: 1896年以後はイギリス領（地図ではイギリスの色）。1935年にイギリスはアシャンティ連合（王位）を復活させた（プレンペ2世、1931–70年）。王位は現在も続く（オセイ・トゥトゥ2世、1999年〜）。
  source: "https://ja.wikipedia.org/wiki/アシャンティ王国"

- id: denkyira
  name: デンキラ王国
  short: デンキラ
  color: "#d5c0b9"
  kind: 王国（アカン人）
  periods:
    - from: 1648
      to: 1701
      text: 黄金海岸の内陸の金産地を押さえ、オランダなど海岸の商人との交易で栄えたアカン人の王国。クマシ周辺の首長国も従えていた。
    - from: 1702
      to: 1874
      text: フェイアセの戦い（1701年）でアシャンティに敗れ、南のジュクワに移った小国として続いた。
  note: 1701年にアシャンティに敗れた後は小国（地図では1826年以後に南部で自立）。
  source: "https://en.wikipedia.org/wiki/Denkyira"

- id: akwamu
  name: アクワム王国
  short: アクワム
  color: "#d5c7b9"
  kind: 王国（アカン人）
  periods:
    - from: 1648
      to: 1730
      text: 黄金海岸東部の強国。アクラ（ガの王国）を征服し（1677–81年）、1693年にはデンマークのクリスチャンスボー城を一時奪った。
    - from: 1731
      to: 1874
      text: アキェムなどに敗れ、ヴォルタ川沿いのアクワムフィに退いた小国となった。
  source: "https://en.wikipedia.org/wiki/Akwamu"

- id: akyem
  name: アキェム
  short: アキェム
  color: "#bfc08e"
  kind: 首長国の連合（アカン人）
  periods:
    - from: 1730
      to: 1742
      text: アクワムを破って黄金海岸東部を押さえた。
    - from: 1742
      to: 1825
      text: アシャンティに敗れ、貢納した。
  note: アキェム・アブアクワ・コトク・ボソメの諸国。地図ではアクワピムなど周辺の国もまとめた。
  source: "https://en.wikipedia.org/wiki/Akyem"

- id: fante
  name: ファンテ諸国
  short: ファンテ
  color: "#97c8a9"
  kind: 首長国の連合
  periods:
    - from: 1648
      to: 1843
      text: マンケシムを中心とする黄金海岸中部の首長国の連合。ヨーロッパの砦と内陸のアシャンティとの交易を仲介し、19世紀初めにはアシャンティの攻撃を受けた。
    - from: 1868
      to: 1873
      text: イギリス・オランダの砦の交換とアシャンティの脅威に対して、ファンテ連合（1868–73年）を作り、憲法を定めた（アフリカの近代的な自治の試みの先がけ）。
  note: 1844年のボンドでイギリスの保護下に入った（地図ではイギリスの薄い色）。
  source: "https://en.wikipedia.org/wiki/Fante_Confederacy"

- id: bono
  name: ボノ王国
  short: ボノ
  color: "#dcc89a"
  kind: 王国（アカン人）
  note: ボノ・マンソを都とした。北の交易路（ジェンネ・トンブクトゥへ）の要。1723年にアシャンティに滅ぼされた。
  source: "https://en.wikipedia.org/wiki/Bono_state"

- id: gonja
  name: ゴンジャ王国
  short: ゴンジャ
  color: "#a2be93"
  kind: 王国
  periods:
    - from: 1648
      to: 1750
      text: マンデ系の騎兵が16世紀に建てた王国。サラガ・ボレなど、コーラの実の交易路の町を押さえた。
    - from: 1751
      to: 1873
      text: アシャンティに敗れて貢納した。サラガはアシャンティの北の交易の拠点として栄えた。
  source: "https://en.wikipedia.org/wiki/Gonja_Kingdom"

- id: dagbon
  name: ダゴンバ王国（ダグボン）
  short: ダゴンバ
  color: "#ba93be"
  kind: 王国
  periods:
    - from: 1648
      to: 1743
      text: イェンディを都とする王国（モシ・マンプルシと同系）。王はヤ・ナと呼ばれた。18世紀初めにイスラームが王家に広まった。
    - from: 1744
      to: 1873
      text: アシャンティに敗れ、奴隷を毎年貢納した。
  note: 1899年の英独協定で東西に分けられた（イェンディはドイツ領トーゴ、のちイギリス領トーゴランド）。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Dagbon"

- id: mamprusi
  name: マンプルシ王国
  short: マンプルシ
  color: "#cea1a8"
  kind: 王国
  note: ナレリグを都とする王国。ダゴンバ・モシの諸王国の「兄」とされる。1897年からイギリスの北部準州。
  source: "https://en.wikipedia.org/wiki/Mamprusi"

# ===== ダホメ・ヨルバ =====
- id: dahomey
  name: ダホメ王国
  short: ダホメ
  color: "#c888a8"
  kind: 王国（フォン人）
  rulers:
    - {name: ウェグバジャ, title: ダホメ王, from: 1645, to: 1685, note: 王国の制度を整えた（伝承上の年）, source: "https://en.wikipedia.org/wiki/Houegbadja"}
    - {name: アカバ, title: ダホメ王, from: 1685, to: 1716, source: "https://en.wikipedia.org/wiki/Akaba"}
    - {name: アガジャ, title: ダホメ王, from: 1718, to: 1740, note: アラダ（1724年）・ウィダ（1727年）を征服して海岸に出た。オヨの侵入を受けて貢納を受け入れた（1716–18年はハンベ女王が治めたとの伝承がある）, source: "https://en.wikipedia.org/wiki/Agaja"}
    - {name: テグベス, title: ダホメ王, from: 1740, to: 1774, source: "https://en.wikipedia.org/wiki/Tegbessou"}
    - {name: クペングラ, title: ダホメ王, from: 1774, to: 1789, source: "https://en.wikipedia.org/wiki/Kpengla"}
    - {name: アゴングロ, title: ダホメ王, from: 1789, to: 1797, source: "https://en.wikipedia.org/wiki/Agonglo"}
    - {name: アダンドザン, title: ダホメ王, from: 1797, to: 1818, note: ゲゾに廃された, source: "https://en.wikipedia.org/wiki/Adandozan"}
    - {name: ゲゾ, title: ダホメ王, from: 1818, to: 1858, note: オヨへの貢納をやめ（1823年）、女性の兵士（アマゾン）を整えた。奴隷貿易からパーム油の輸出への転換も進めた, source: "https://en.wikipedia.org/wiki/Ghezo"}
    - {name: グレレ, title: ダホメ王, from: 1858, to: 1889, source: "https://en.wikipedia.org/wiki/Glele"}
    - {name: ベハンジン, title: ダホメ王, from: 1889, to: 1894, note: フランスと戦い（1890年・1892–94年）、1894年に降伏してマルティニークに流された, source: "https://ja.wikipedia.org/wiki/ベハンジン"}
    - {name: アゴリ・アグボ, title: ダホメ王（フランスの保護下）, from: 1894, to: 1900, source: "https://en.wikipedia.org/wiki/Agoli-agbo"}
  periods:
    - from: 1648
      to: 1723
      text: アボメの高原に興ったフォン人の王国。海岸のアラダ・ウィダと奴隷を取り合った。
    - from: 1724
      to: 1822
      text: アラダ・ウィダを征服して奴隷貿易の大港を握る。王の独占のもとで奴隷を輸出したが、オヨの騎兵に敗れて貢納した。
    - from: 1823
      to: 1889
      text: ゲゾ王のもとでオヨから自立し、女性の兵士（アマゾン）を含む強い軍で周辺を攻めた。奴隷貿易の禁止後はパーム油の輸出に転じた。
    - from: 1890
      to: 1900
      text: コトヌーをめぐってフランスと戦い（ダホメ戦争）、1892年に都アボメを奪われ、1894年に植民地となった。
  source: "https://ja.wikipedia.org/wiki/ダホメ王国"

- id: allada
  name: アラダ王国
  short: アラダ
  color: "#d8b0a0"
  kind: 王国（アジャ人）
  note: 16–17世紀に奴隷貿易で栄えたアジャ人の王国。1724年にダホメに征服された。ポルトノヴォの王家はアラダの分かれとされる。
  source: "https://en.wikipedia.org/wiki/Allada"

- id: whydah
  name: ウィダ王国（フエダ）
  short: ウィダ
  color: "#c7b4c9"
  kind: 王国
  note: サヴィを都とし、外港ウィダにヨーロッパ諸国の商館が並んだ奴隷貿易の王国。1727年にダホメに征服された。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Whydah"

- id: porto_novo
  name: ポルトノヴォ王国
  short: ポルトノヴォ
  color: "#b9ced5"
  kind: 王国
  note: ホグボヌ（ポルトノヴォ）の王国。ダホメに対抗してフランスの保護を求めた（1863年・1882年）。トッファ王（1874–1908年）。
  source: "https://en.wikipedia.org/wiki/Porto-Novo"

- id: oyo
  name: オヨ王国
  short: オヨ
  color: "#8db098"
  kind: 王国（ヨルバ人）
  rulers:
    - {name: オジギ, title: アラーフィン（王）, from: 1724, to: 1735, note: ダホメを攻めて貢納させた。この時期の在位年は諸説, source: "https://en.wikipedia.org/wiki/Ojigi"}
    - {name: グベル, title: アラーフィン, from: 1735, to: 1750, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Oyo"}
    - {name: アグボルアジェ, title: アラーフィン, from: 1750, to: 1772, note: バショルン（宰相）ガハが実権を握った（1754–74年）, source: "https://en.wikipedia.org/wiki/Gaha"}
    - {name: アビオドゥン, title: アラーフィン, from: 1774, to: 1789, note: ガハを倒し、奴隷貿易で王国の最盛期を築いた, source: "https://en.wikipedia.org/wiki/Abiodun"}
    - {name: アウォレ, title: アラーフィン, from: 1789, to: 1796, note: アフォンジャらに追われて自殺し、王国は分裂に向かった, source: "https://en.wikipedia.org/wiki/Awole_Arogangan"}
    - {name: マジョトゥ, title: アラーフィン, from: 1802, to: 1830, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Oyo"}
    - {name: オルエウ, title: アラーフィン, from: 1833, to: 1835, note: イロリンとの戦いで死に、旧オヨは放棄された, source: "https://en.wikipedia.org/wiki/Oluewu"}
    - {name: アティバ, title: アラーフィン, from: 1837, to: 1859, note: 新オヨ（アゴ・オジャ）に都を置いた, source: "https://en.wikipedia.org/wiki/Atiba"}
    - {name: アデル, title: アラーフィン, from: 1859, to: 1875, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Oyo"}
    - {name: アデイェミ1世, title: アラーフィン, from: 1876, to: 1905, note: 1893年にイギリスの保護を受け入れた, source: "https://en.wikipedia.org/wiki/Adeyemi_I_Alowolodu"}
  periods:
    - from: 1648
      to: 1788
      text: 騎兵を持つヨルバ人の大国。サバンナの交易と、ポルトノヴォなどを通じた奴隷貿易で栄え、ダホメ（1730年〜）を貢納させた。
    - from: 1789
      to: 1836
      text: 王と貴族の争いで弱まり、イロリンの反乱（1817年）とフルベのジハードで崩れた。1835年ごろ都の旧オヨが放棄された。
    - from: 1837
      to: 1893
      text: 南の新オヨで続いたが、ヨルバの地はイバダン・エグバ・イジェブなどが争う戦乱の時代となった。
  note: 17世紀以前の王の在位年はよくわかっていない。
  source: "https://ja.wikipedia.org/wiki/オヨ王国"

- id: ibadan
  name: イバダン
  short: イバダン
  color: "#add37e"
  kind: 軍事国家（ヨルバ人）
  periods:
    - from: 1830
      to: 1877
      text: オヨ崩壊の混乱の中で生まれた軍人の町。オショグボの戦い（1840年）でイロリンの南進を止め、ヨルバの東部（イジェシャ・エキティ）まで従えた。
    - from: 1877
      to: 1893
      text: エキティパラポ（エキティ・イジェシャの連合）とのキリジ戦争（1877–86年）で力を失い、1893年にイギリスの保護を受け入れた。
  source: "https://en.wikipedia.org/wiki/Ibadan"

- id: egba
  name: エグバ（アベオクタ）
  short: エグバ
  color: "#c7dfaf"
  kind: 首長国の連合（ヨルバ人）
  note: 1830年にアベオクタを建てた。1893年にイギリスとの条約で独立を認められ、1898–1914年はエグバ連合政府として自治した。
  source: "https://en.wikipedia.org/wiki/Egba_United_Government"

- id: ijebu
  name: イジェブ王国
  short: イジェブ
  color: "#7ed3cf"
  kind: 王国（ヨルバ人）
  note: ラゴスと内陸を結ぶ交易を押さえた。1892年にイギリスの遠征で征服された。
  source: "https://en.wikipedia.org/wiki/Ijebu_Kingdom"

- id: yoruba_states
  name: ヨルバ諸王国
  short: ヨルバ諸国
  color: "#d3c27e"
  kind: 王国の集まり
  note: オヨ・イバダン・エグバ・イジェブ以外のヨルバ人の諸王国（イフェ・イジェシャ・エキティ・オンド・アクレ・オウォ・ケトゥなど）をまとめた。地図の副ラベルに地域の名前を出す。
  source: "https://ja.wikipedia.org/wiki/ヨルバ人"

- id: lagos
  name: ラゴス王国（エコ）
  short: ラゴス
  color: "#afc6cf"
  kind: 王国
  note: ベニン王国の宗主権の下にあった港の王国。19世紀前半に奴隷貿易の港として栄えた。1851年のイギリスの砲撃、1861年の併合でイギリス領となった。
  source: "https://en.wikipedia.org/wiki/Oba_of_Lagos"

# ===== ベニン・デルタ・中部 =====
- id: benin_kingdom
  name: ベニン王国
  short: ベニン
  color: "#b98a68"
  kind: 王国（エド人）
  rulers:
    - {name: アヘンザエ, title: オバ（王）, from: 1641, to: 1661, source: "https://en.wikipedia.org/wiki/List_of_Obas_of_Benin"}
    - {name: アケンザエ, title: オバ, from: 1661, to: 1669, source: "https://en.wikipedia.org/wiki/List_of_Obas_of_Benin"}
    - {name: アケングボイ, title: オバ, from: 1669, to: 1675, source: "https://en.wikipedia.org/wiki/List_of_Obas_of_Benin"}
    - {name: オレ・オゲネ, title: オバ, from: 1689, to: 1701, note: 1675–89年は短命な王が続いた, source: "https://en.wikipedia.org/wiki/List_of_Obas_of_Benin"}
    - {name: エウアクペ, title: オバ, from: 1701, to: 1712, note: 王位をめぐる内戦の時代, source: "https://en.wikipedia.org/wiki/List_of_Obas_of_Benin"}
    - {name: アケンズア1世, title: オバ, from: 1713, to: 1735, note: 内戦を収め、王権を立て直した, source: "https://en.wikipedia.org/wiki/Akenzua_I"}
    - {name: エレソイェン, title: オバ, from: 1735, to: 1750, source: "https://en.wikipedia.org/wiki/List_of_Obas_of_Benin"}
    - {name: アケングブダ, title: オバ, from: 1750, to: 1804, source: "https://en.wikipedia.org/wiki/Akengbuda"}
    - {name: オバノサ, title: オバ, from: 1804, to: 1816, source: "https://en.wikipedia.org/wiki/List_of_Obas_of_Benin"}
    - {name: オセムウェンデ, title: オバ, from: 1816, to: 1848, source: "https://en.wikipedia.org/wiki/Osemwende"}
    - {name: アドロ, title: オバ, from: 1848, to: 1888, source: "https://en.wikipedia.org/wiki/Adolo_of_Benin"}
    - {name: オヴォンラムウェン, title: オバ, from: 1888, to: 1897, note: 1897年のイギリスの懲罰遠征で都を焼かれ、カラバルに流された, source: "https://en.wikipedia.org/wiki/Ovonramwen"}
  periods:
    - from: 1648
      to: 1712
      text: 15–16世紀に強大だったエド人の王国。ポルトガル・オランダと胡椒・象牙・布・奴隷を交易した。17世紀末から王位をめぐる内戦で弱まった。
    - from: 1713
      to: 1896
      text: アケンズア1世のもとで王権を立て直し、ラゴスやエサン・イカの小国を従えた。宮廷の青銅・象牙の彫刻で知られる。
    - from: 1897
      to: 1897
      text: イギリスの懲罰遠征（ベニン遠征）で都が焼かれ、数千点の美術品（ベニン・ブロンズ）が持ち去られた。
  note: 1914年に王位が復活し（エウェカ2世）、現在も続く。
  source: "https://ja.wikipedia.org/wiki/ベニン王国"

- id: niger_delta_states
  name: ニジェール・デルタの都市国家
  short: デルタ諸国
  color: "#9fb7c7"
  kind: 交易都市国家の集まり
  periods:
    - from: 1648
      to: 1834
      text: ボニー・カラバリ・ネンベ（ブラス）・オールド・カラバル（エフィク）・ワリ（イツェキリ）などの都市国家が、内陸から集めた奴隷をヨーロッパ商人に売った。商人の「ハウス」（家）が政治の単位だった。
    - from: 1835
      to: 1884
      text: 奴隷貿易の禁止の後、パーム油（「油の川」）の交易に転じた。元奴隷の商人ジャジャがオポボを建てる（1869年）など、商人が力を持った。
  note: 地図の副ラベルにそれぞれの国の名前を出す。1884–85年の保護条約で油河保護領となった。
  source: "https://en.wikipedia.org/wiki/Oil_Rivers_Protectorate"

- id: igala
  name: イガラ王国
  short: イガラ
  color: "#e2bcab"
  kind: 王国
  note: イダを都とする王国（王はアタ）。ニジェール川の交易を押さえた。
  source: "https://en.wikipedia.org/wiki/Igala_Kingdom"

- id: nupe
  name: ヌペ王国
  short: ヌペ
  color: "#a6a3c7"
  kind: 王国
  note: ニジェール川中流の王国（王はエツ）。1830年代にフルベが実権を握り、1857年からビダ首長国（ソコト・カリフ国の一部。地図ではソコトの色）となった。
  source: "https://en.wikipedia.org/wiki/Nupe_Kingdom"

- id: borgu
  name: ボルグ諸王国
  short: ボルグ
  color: "#dbc2c2"
  kind: 王国の連合（バリバ人）
  note: ニッキ・ブッサ・カイアマ・クアンデなどバリバ人の諸王国。騎兵で知られ、ソコト・カリフ国のジハードを退けた。1894–98年に英仏が争い、英仏協定（1898年）で分けられた。
  source: "https://en.wikipedia.org/wiki/Borgu"

- id: kwararafa
  name: ジュクン（クワララファ）
  short: ジュクン
  color: "#c1c9a6"
  kind: 王国
  note: ベヌエ川流域のジュクン人の王国。17世紀にはカノ・ボルヌに遠征したが、18世紀に衰えて都ウカリの周辺の国となった。範囲はよくわかっていない。
  source: "https://en.wikipedia.org/wiki/Kwararafa"

# ===== ハウサ・ソコト・ボルヌ =====
- id: hausa_states
  name: ハウサ諸王国
  short: ハウサ諸国
  color: "#d3ca7e"
  kind: 都市国家の集まり
  periods:
    - from: 1648
      to: 1803
      text: カノ・カツィナ・ザザウ（ザリア）・ゴビル・ケッビ・ザムファラなど、城壁で囲まれた都市を中心とする王国。サハラ交易と手工業で栄え、互いに争った。18世紀にはゴビルが強まった。
    - from: 1804
      to: 1808
      text: ウスマン・ダン・フォディオのジハードでソコト・カリフ国に倒された（1808年にゴビルの都アルカラワが落ちる）。
  note: 地図ではジハードの前のハウサの王国をまとめてこの色で塗り、副ラベルにそれぞれの国の名前を出す。ジハードの後に逃れた王家の国（ケッビ〈アルグング〉・アブジャ・ゴビル〈ティビリ〉・マラディ）はそれぞれ別の政体。
  source: "https://ja.wikipedia.org/wiki/ハウサ諸王国"

- id: kebbi
  name: ケッビ王国（アルグング）
  short: ケッビ
  color: "#e3c7a0"
  kind: 王国（ハウサ）
  periods:
    - from: 1849
      to: 1901
      text: ジハードで都ビルニン・ケッビを追われたケッビの王家が、アルグングを拠点にソコト・カリフ国から独立を取り戻した国（「亡命ハウサ国家」）。ソコト・グワンドゥと戦い続け、1902年にイギリスの保護下に入った（アルグング首長国）。
  source: "https://en.wikipedia.org/wiki/Kebbi_Emirate"

- id: abuja
  name: アブジャ首長国（ザザウの亡命王朝）
  short: アブジャ
  color: "#c9b37c"
  kind: 王国（ハウサ）
  periods:
    - from: 1828
      to: 1901
      text: ジハードでザザウ（ザリア）を追われたハウサの王が、南のアブジャ（いまのスレジャ）に逃れて建てた国。フルベの首長国と戦いながら独立を保ち、1902年にイギリスの保護下に入った。いまの首都アブジャの名はこの国にちなむ。
  source: "https://en.wikipedia.org/wiki/Suleja_Emirate"

- id: sokoto
  name: ソコト・カリフ国（ソコト帝国）
  short: ソコト
  color: "#83ce9d"
  kind: カリフ国（首長国の連合）
  rulers:
    - {name: ウスマン・ダン・フォディオ, title: 信徒の長（アミール・アル・ムウミニーン）, from: 1804, to: 1817, note: フルベのイスラーム学者。1804年にゴビル王に対するジハードを始めた。1812年から統治を子のベロと弟アブドゥッラーヒに任せた, source: "https://ja.wikipedia.org/wiki/ウスマン・ダン・フォディオ"}
    - {name: ムハンマド・ベロ, title: スルタン（カリフ）, from: 1817, to: 1837, note: ソコトの町を建て（1809年）、カリフ国の制度を整えた, source: "https://en.wikipedia.org/wiki/Muhammed_Bello"}
    - {name: アブバカル・アティク, title: スルタン, from: 1837, to: 1842, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: アリユ・ババ, title: スルタン, from: 1842, to: 1859, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: アフマド・アティク, title: スルタン, from: 1859, to: 1866, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: アリユ・カラミ, title: スルタン, from: 1866, to: 1867, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: アフマド・ルファイ, title: スルタン, from: 1867, to: 1873, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: アブバカル2世, title: スルタン, from: 1873, to: 1877, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: ムアズ, title: スルタン, from: 1877, to: 1881, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: ウマル, title: スルタン, from: 1881, to: 1891, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: アブドゥッラフマーン, title: スルタン, from: 1891, to: 1902, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Sokoto"}
    - {name: アッタヒル1世, title: スルタン, from: 1902, to: 1903, note: イギリス軍のソコト占領（1903年3月）の後、東へ逃れてブルミで戦死した, source: "https://en.wikipedia.org/wiki/Muhammadu_Attahiru_I"}
  periods:
    - from: 1804
      to: 1817
      text: ウスマン・ダン・フォディオのジハードでハウサ諸王国が倒れ、フルベの首長（エミール）がカノ・カツィナ・ザリア・バウチなどを治める首長国の連合ができた。
    - from: 1817
      to: 1880
      text: 西アフリカ最大の国家の一つ。ソコトのスルタン（カリフ）と、西半分を治めるグワンドゥの首長の下に約30の首長国があった。イスラームの学問とサバンナの交易・奴隷制の農園で栄えた。
    - from: 1881
      to: 1903
      text: 南のアダマワ・イロリン・ヌペまで広がったが、王立ニジェール会社（1886年）、ついでルガードの北ナイジェリア保護領（1900年）の軍に1897–1903年に征服された。
  note: 1903年以後はイギリスの間接統治（地図ではイギリスの薄い色＋首長国の名前）。スルタンの位は現在も続き、ナイジェリアのムスリムの精神的な指導者とされる（ムハンマド・サアド・アブバカル3世、2006年〜）。
  source: "https://ja.wikipedia.org/wiki/ソコト帝国"

- id: bornu
