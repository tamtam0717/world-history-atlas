# F4 中部・南部アフリカとインド洋の島々の政体（1648–2025）
# 地域と所属の変遷は data/regions/southern_africa.yaml。
# 植民地の時期は宗主国（portugal・britain・france・belgium・german_empire・netherlands）の政体を使い、元首は書かない。
# 在地の国家の王の在位年は、史料によって数年ずれることが多い（とくに 17–18 世紀）。自信のないものは note に「要確認」。

# ================================================================ コンゴ川下流・アンゴラ

- id: kongo
  name: コンゴ王国
  short: コンゴ王国
  color: "#c9a3d6"
  kind: 王国（キリスト教）
  rulers:
    - {name: "ンクウ・ア・ントゥヌ", title: "コンゴ王（マニコンゴ）", from: 1453, to: 1470, note: "在位年は推定", source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Kongo"}
    - {name: "ンジンガ・ア・ンクウ（ジョアン1世）", title: "コンゴ王", from: 1470, to: 1509, note: "1491年にポルトガル人から洗礼を受けた。在位年の始まりは推定", source: "https://en.wikipedia.org/wiki/Jo%C3%A3o_I_of_Kongo"}
    - {name: "アフォンソ1世", title: "コンゴ王", from: 1509, to: 1542, note: "キリスト教を広め、ポルトガルと交流した。奴隷貿易の行き過ぎをポルトガル王に訴えた", source: "https://en.wikipedia.org/wiki/Afonso_I_of_Kongo"}
    - {name: "ペドロ1世", title: "コンゴ王", from: 1542, to: 1545, source: "https://en.wikipedia.org/wiki/Pedro_I_of_Kongo"}
    - {name: "フランシスコ1世", title: "コンゴ王", from: 1545, to: 1545, source: "https://en.wikipedia.org/wiki/Francisco_I_of_Kongo"}
    - {name: "ディオゴ1世", title: "コンゴ王", from: 1545, to: 1561, source: "https://en.wikipedia.org/wiki/Diogo_I_of_Kongo"}
    - {name: "アフォンソ2世", title: "コンゴ王", from: 1561, to: 1561, source: "https://en.wikipedia.org/wiki/Afonso_II_of_Kongo"}
    - {name: "ベルナルド1世", title: "コンゴ王", from: 1561, to: 1567, source: "https://en.wikipedia.org/wiki/Bernardo_I_of_Kongo"}
    - {name: "エンリケ1世", title: "コンゴ王", from: 1567, to: 1568, source: "https://en.wikipedia.org/wiki/Henrique_I_of_Kongo"}
    - {name: "アルヴァロ1世", title: "コンゴ王", from: 1568, to: 1587, note: "ジャガ（インバンガラ）の侵入で都を追われ、ポルトガル軍の助けで取り戻した（1570–71年）", source: "https://en.wikipedia.org/wiki/%C3%81lvaro_I_of_Kongo"}
    - {name: "アルヴァロ2世", title: "コンゴ王", from: 1587, to: 1614, source: "https://en.wikipedia.org/wiki/%C3%81lvaro_II_of_Kongo"}
    - {name: "ベルナルド2世", title: "コンゴ王", from: 1614, to: 1615, source: "https://en.wikipedia.org/wiki/Bernardo_II_of_Kongo"}
    - {name: "アルヴァロ3世", title: "コンゴ王", from: 1615, to: 1622, source: "https://en.wikipedia.org/wiki/%C3%81lvaro_III_of_Kongo"}
    - {name: "ペドロ2世", title: "コンゴ王", from: 1622, to: 1624, note: "ポルトガル領アンゴラの軍を破り（ムブンビの戦い）、オランダと結ぼうとした", source: "https://en.wikipedia.org/wiki/Pedro_II_of_Kongo"}
    - {name: "ガルシア1世", title: "コンゴ王", from: 1624, to: 1626, source: "https://en.wikipedia.org/wiki/Garcia_I_of_Kongo"}
    - {name: "アンブロジオ1世", title: "コンゴ王", from: 1626, to: 1631, source: "https://en.wikipedia.org/wiki/Ambr%C3%B3sio_I_of_Kongo"}
    - {name: "アルヴァロ4世", title: "コンゴ王", from: 1631, to: 1636, source: "https://en.wikipedia.org/wiki/%C3%81lvaro_IV_of_Kongo"}
    - {name: "アルヴァロ5世", title: "コンゴ王", from: 1636, to: 1636, source: "https://en.wikipedia.org/wiki/%C3%81lvaro_V_of_Kongo"}
    - {name: "アルヴァロ6世", title: "コンゴ王", from: 1636, to: 1641, source: "https://en.wikipedia.org/wiki/%C3%81lvaro_VI_of_Kongo"}
    - {name: ガルシア2世, title: コンゴ王, from: 1641, to: 1661, note: オランダと結んでポルトガルに対抗した, source: "https://en.wikipedia.org/wiki/Garcia_II_of_Kongo"}
    - {name: アントニオ1世, title: コンゴ王, from: 1661, to: 1665, note: ムブウィラの戦いでポルトガル軍に敗れて戦死, source: "https://en.wikipedia.org/wiki/António_I_of_Kongo"}
    - {name: 王位を争う諸王（内乱期）, title: コンゴ王, from: 1665, to: 1694, note: ムブウィラの戦いの後、キンラザ家・キンパンズ家などが王位を争い、サン・サルヴァドールは1678年に放棄された, source: "https://en.wikipedia.org/wiki/Kongo_Civil_War"}
    - {name: ペドロ4世, title: コンゴ王, from: 1695, to: 1718, note: 内乱の中で即位を主張し、1709年にサン・サルヴァドールを奪って王国を再統一した, source: "https://en.wikipedia.org/wiki/Pedro_IV_of_Kongo"}
    - {name: マヌエル2世, title: コンゴ王, from: 1718, to: 1743, note: 要確認, source: "https://en.wikipedia.org/wiki/Manuel_II_of_Kongo"}
    - {name: 歴代のコンゴ王（ガルシア4世・アルヴァロ11世・アンドレ2世など）, title: コンゴ王, from: 1743, to: 1858, note: 王家の諸家が交代で王位に就いたが、王の力は弱まり地方の首長が自立した, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Kongo"}
    - {name: ペドロ5世, title: コンゴ王, from: 1859, to: 1891, note: ポルトガルの支援で即位し、ポルトガル王に臣従した, source: "https://en.wikipedia.org/wiki/Pedro_V_of_Kongo"}
    - {name: アルヴァロ13世, title: コンゴ王, from: 1891, to: 1896, note: 要確認, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Kongo"}
    - {name: エンリケ3世, title: コンゴ王, from: 1896, to: 1901, note: 要確認, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Kongo"}
    - {name: ペドロ6世, title: コンゴ王, from: 1901, to: 1910, note: 要確認, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Kongo"}
    - {name: マヌエル3世, title: コンゴ王, from: 1911, to: 1914, note: 1913–14年の反乱の後に退位させられた。要確認, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Kongo"}
  periods:
    - {from: 1453, to: 1567, text: "コンゴ川の南の王国。1483年にポルトガル人が来航し、ンジンガ・ア・ンクウ（ジョアン1世）が洗礼を受け、アフォンソ1世がキリスト教を広めた。王はポルトガルと交流したが、奴隷貿易が国を乱した。"}
    - {from: 1568, to: 1647, text: "東から来たジャガ（インバンガラ）の侵入で都が落ち、ポルトガル軍の助けで取り戻した（1570–71年）。ポルトガル領アンゴラとは次第に対立し、オランダと結んだ（1641年）。"}
    - from: 1648
      to: 1665
      text: 都ムバンザ・コンゴ（サン・サルヴァドール）を中心に、コンゴ川の南に広がるキリスト教の王国。ガルシア2世はオランダと結んでポルトガルに対抗したが、1648年にオランダがルアンダを失うと孤立した。
    - from: 1665
      to: 1709
      text: ムブウィラの戦いでポルトガル軍に国王が殺され、王位を争う内乱で王国が分裂した。都は荒れ果て、ソヨなどの地方が自立した。女預言者キンパ・ヴィタ（ドナ・ベアトリス）の運動もこの混乱の中で起こった。
    - from: 1709
      to: 1856
      text: ペドロ4世の再統一の後は、王の力は弱く、地方の有力者がゆるく王を認める形が続いた。王国は大西洋奴隷貿易に多くの奴隷を送り出した。
    - from: 1857
      to: 1914
      text: ペドロ5世がポルトガルの支援で即位して臣従し、ベルリン会議で王国の北部はコンゴ自由国、南部はポルトガル領とされた。1913–14年の反乱の後、王国の自治は失われた。
  note: 王位は1975年まで名目的に続いた。
  source: "https://ja.wikipedia.org/wiki/コンゴ王国"

- id: loango
  name: ロアンゴ王国
  short: ロアンゴ
  color: "#bddba4"
  kind: 王国
  periods:
    - from: 1648
      to: 1883
      text: コンゴ川の北の海岸の王国。南のカコンゴ・ンゴヨ（カビンダ）とともに、象牙・銅・染料木の交易から、18世紀には大西洋奴隷貿易の大きな積み出し地になった。
  note: 地図ではカコンゴ・ンゴヨ（現在のカビンダ）もこの色で塗る（ロアンゴに従ったり自立したりした）。
  source: "https://ja.wikipedia.org/wiki/ロアンゴ王国"

- id: tio
  name: テケ（ティオ）王国
  short: テケ王国
  color: "#d2c29d"
  kind: 王国
  rulers:
    - {name: イロ1世（マココ）, title: テケ王, from: 1880, to: 1892, note: 1880年にブラザと条約を結んでフランスの保護下に入った。要確認, source: "https://en.wikipedia.org/wiki/Anziku_Kingdom"}
  periods:
    - from: 1648
      to: 1879
      text: スタンリー・プール（マレボ湖）の北の高原の王国。王はマココと称した。コンゴ川の上流と下流をつなぐ交易を仲立ちした。
  source: "https://en.wikipedia.org/wiki/Anziku_Kingdom"

- id: ndongo
  name: ンドンゴ王国
  short: ンドンゴ
  color: "#d3867e"
  kind: 王国
  rulers:
    - {name: "ンゴラ・キルアンジ・キア・サンバ", title: "ンドンゴ王（ンゴラ）", from: 1515, to: 1556, note: "ンドンゴ王国を建てたとされる。在位年は推定。要確認", source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"}
    - {name: "ンダンビ・ア・ンゴラ", title: "ンドンゴ王", from: 1556, to: 1561, note: "要確認", source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"}
    - {name: "ンゴラ・キルアンジ・キア・ンダンビ", title: "ンドンゴ王", from: 1561, to: 1575, note: "要確認", source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"}
    - {name: "ンゴラ・キロンボ・キア・カセンダ", title: "ンドンゴ王", from: 1575, to: 1592, note: "ポルトガルとの戦争が始まった（1579年）。要確認", source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"}
    - {name: "ムバンディ・ンゴラ・キルアンジ", title: "ンドンゴ王", from: 1592, to: 1617, note: "要確認", source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"}
    - {name: "ンゴラ・ムバンディ", title: "ンドンゴ王", from: 1617, to: 1624, note: "ンジンガの兄。ポルトガルとインバンガラに攻められた", source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"}
    - {name: "ンジンガ", title: "ンドンゴ女王", from: 1624, to: 1626, note: "ポルトガルに追われて東へ移り、1631年にマタンバを征服した", source: "https://ja.wikipedia.org/wiki/ンジンガ・ムバンデ"}
    - {name: アリ・キルアンジ（ンゴラ・アリ1世）, title: ンドンゴ王, from: 1626, to: 1664, note: ポルトガルがンジンガに対抗して立てた王。要確認, source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"}
    - {name: ンゴラ・アリ2世, title: ンドンゴ王, from: 1664, to: 1671, note: ポルトガルに背いて攻められ、プンゴ・アンドンゴが落ちた。要確認, source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"}
  periods:
    - {from: 1500, to: 1647, text: "ムブンドゥ人の王国。王の称号ンゴラがのちに「アンゴラ」の名のもととなった。1556年にコンゴから自立。1575年にポルトガル人が上陸し、翌年ルアンダを建てると戦争が続き、ンジンガ女王は1626年に東のマタンバへ移った。"}
    - from: 1648
      to: 1671
      text: 王の称号ンゴラが「アンゴラ」の名のもと。ンジンガ女王が東のマタンバに移った後、ポルトガルが立てた王がプンゴ・アンドンゴの岩山を都とした。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Ndongo"

- id: matamba
  name: マタンバ王国
  short: マタンバ
  color: "#e0b4a0"
  kind: 王国
  rulers:
    - {name: ンジンガ, title: ンドンゴ・マタンバの女王, from: 1631, to: 1663, note: ポルトガルと戦い、1656年に和約を結んだ, source: "https://ja.wikipedia.org/wiki/ンジンガ・ムバンデ"}
    - {name: バルバラ（カンブ）, title: 女王, from: 1663, to: 1666, note: ンジンガの妹, source: "https://en.wikipedia.org/wiki/Kambu_of_Ndongo_and_Matamba"}
    - {name: ヴェロニカ1世, title: 女王, from: 1681, to: 1721, note: 要確認, source: "https://en.wikipedia.org/wiki/Verónica_I_of_Ndongo_and_Matamba"}
  periods:
    - {from: 1530, to: 1647, text: "クワンゴ川の西の王国。コンゴ王に貢納し、女王が治めることもあった。1631年にンジンガが征服して都とし、ポルトガルと戦った。"}
    - from: 1648
      to: 1663
      text: ンジンガ女王はンドンゴを追われてマタンバを奪い、インバンガラの戦士と結んでポルトガルに抵抗した。1641–48年はルアンダを占領したオランダと同盟したが、ポルトガルがルアンダを奪い返すと、1656年に和約を結んだ。
    - from: 1664
      to: 1909
      text: ンジンガの後は女王・王が交代しながら続き、クワンゴ川流域の奴隷交易を仲立ちした。19世紀後半からポルトガルの圧力が強まり、20世紀初めに征服された。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Matamba"

- id: kasanje
  name: カサンジェ王国
  short: カサンジェ
  color: "#d8d7b6"
  kind: 王国（インバンガラ）
  periods:
    - from: 1648
      to: 1910
      text: 17世紀前半にインバンガラ人の首長カサンジェがクワンゴ川のほとりに建てた王国。内陸のルンダ王国とルアンダのポルトガル人の間の奴隷・象牙の取引を仲立ちして栄えた。1850年代からポルトガルと争い、20世紀初めに征服された。
  source: "https://en.wikipedia.org/wiki/Kasanje_Kingdom"

- id: ovimbundu
  name: オヴィンブンドゥ諸王国
  short: オヴィンブンドゥ
  color: "#cece83"
  kind: 王国群
  periods:
    - from: 1648
      to: 1902
      text: ベンゲラ高原のオヴィンブンドゥ人の王国（バイルンド・ワンボ・ビエ・ガランゲなど）。18–19世紀には隊商を組んで内陸のルンダ・ロジまで交易し、奴隷・象牙・ゴム・蜜蝋をベンゲラに運んだ。ビエは1890年、バイルンドは1902年にポルトガルに征服された。
  note: 地図ではいくつかの王国をまとめて1色で塗る。
  source: "https://en.wikipedia.org/wiki/Ovimbundu"

- id: ovambo
  name: オヴァンボ諸王国
  short: オヴァンボ
  color: "#d2cb8e"
  kind: 王国群
  rulers:
    - {name: マンドゥメ・ヤ・ンデムファヨ, title: クワニャマ王, from: 1911, to: 1917, note: ポルトガル・南アフリカと戦って死んだ, source: "https://en.wikipedia.org/wiki/Mandume_ya_Ndemufayo"}
  periods:
    - from: 1648
      to: 1915
      text: アンゴラ南部とナミビア北部の氾濫原の農牧民の王国（ンドンガ・クワニャマなど）。1886年にポルトガルとドイツの境界で分けられた。北はポルトガルに1915年、南は南アフリカに1915–17年に征服された。
  note: 地図ではいくつかの王国をまとめて1色で塗る。
  source: "https://en.wikipedia.org/wiki/Ovambo_people"

# ================================================================ コンゴ盆地・中部アフリカ

- id: lunda
  name: ルンダ王国
  short: ルンダ
  color: "#d4a96a"
  kind: 王国
  rulers:
    - {name: ナウェジ2世, title: ムワタ・ヤンヴォ（ルンダ王）, from: 1820, to: 1852, note: 要確認, source: "https://en.wikipedia.org/wiki/Kingdom_of_Lunda"}
    - {name: ムバンバ, title: ムワタ・ヤンヴォ, from: 1857, to: 1873, note: 要確認, source: "https://en.wikipedia.org/wiki/Kingdom_of_Lunda"}
  periods:
    - from: 1648
      to: 1850
      text: 都ムスンバを中心にした王国。王はムワタ・ヤンヴォ（ムワント・ヤーヴ）と称し、各地の首長から貢ぎ物を受けた。西はクワンゴ川、東はルアプラ川（カゼンベ王国）まで勢力を広げ、奴隷・象牙を大西洋岸とインド洋岸の両方に送った。
    - from: 1850
      to: 1890
      text: 西から勢力を広げたチョクウェ人に攻められ、1887年には都を落とされた。ベルリン会議の後、領域はコンゴ自由国とポルトガル領アンゴラに分けられた（1891年の協定）。
  note: 範囲は貢納国を含むおおよそのもの（uncertain）。
  source: "https://ja.wikipedia.org/wiki/ルンダ王国"

- id: luba
  name: ルバ王国
  short: ルバ
  color: "#95b8db"
  kind: 王国
  rulers:
    - {name: イルンガ・カバレ, title: ルバ王（ムロプウェ）, from: 1810, to: 1840, note: 王国を最も広げた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Luba_Empire"}
  periods:
    - {from: 1500, to: 1647, text: "伝承ではコンゴロ、ついでイルンガ・カララが建てた王国。ウペンバ盆地を中心とした。"}
    - from: 1648
      to: 1885
      text: ロマミ川とルアラバ川の間のウペンバ盆地を中心にした王国。王（ムロプウェ）は聖なる王権を持ち、秘密結社（ムブディエ）が王の記憶を伝えた。19世紀前半に最も広がったが、後半には王位争い、スワヒリ＝アラブ商人やムシリの圧迫で衰えた。
  source: "https://ja.wikipedia.org/wiki/ルバ王国"

- id: kuba
  name: クバ王国
  short: クバ
  color: "#c9a0a0"
  kind: 王国
  periods:
    - from: 1648
      to: 1899
      text: サンクル川とカサイ川の間の王国。17世紀初めのシャーム・ア・ンブルが建てたとされる。ラフィア布の織物や木彫の美術で知られる。1899–1900年にコンゴ自由国の軍に都を攻められた。
  source: "https://en.wikipedia.org/wiki/Kuba_Kingdom"

- id: kazembe
  name: カゼンベ王国
  short: カゼンベ
  color: "#9fd0c4"
  kind: 王国
  periods:
    - from: 1740
      to: 1898
      text: 18世紀前半にルンダ王国から東に出た首長カゼンベがルアプラ川の流域に建てた王国。カタンガの銅と塩を支配し、東アフリカ海岸のスワヒリ商人やモザンビークのポルトガル人と交易した。19世紀後半にムシリに東カタンガを奪われ、1899年にイギリス南アフリカ会社に敗れた。
  source: "https://ja.wikipedia.org/wiki/カゼンベ王国"

- id: yeke
  name: イェケ王国（ガランガンゼ）
  short: イェケ（ムシリ）
  color: "#d8b0c8"
  kind: 王国
  rulers:
    - {name: ムシリ, title: イェケ王, from: 1856, to: 1891, note: ニャムウェジ人の商人。銃と銅・奴隷・象牙の交易で王国を建てた。コンゴ自由国のステアーズ遠征隊に殺された, source: "https://en.wikipedia.org/wiki/Msiri"}
  periods:
    - from: 1856
      to: 1891
      text: 東アフリカ（タンザニア）のニャムウェジ人の商人ムシリが、カタンガのブンケヤを都に建てた王国。カタンガの銅を東西の海岸に送った。銅山をねらうレオポルド2世とイギリスのローズが争い、1891年にコンゴ自由国の遠征隊がムシリを殺した。
  source: "https://en.wikipedia.org/wiki/Yeke_Kingdom"

- id: tippu_tip
  name: ティップ・ティプの勢力圏（スワヒリ＝アラブ商人）
  short: ティップ・ティプ
  color: "#bfa6c9"
  kind: 商人の勢力圏
  rulers:
    - {name: ティップ・ティプ, title: スワヒリ＝アラブ商人の首領, from: 1870, to: 1890, note: 1887–90年はコンゴ自由国のスタンリー・フォールズ地区知事。その後ザンジバルに戻った, source: "https://ja.wikipedia.org/wiki/ティップー・ティプ"}
  periods:
    - from: 1870
      to: 1893
      text: ザンジバルのスルタンのもとの商人ティップ・ティプらが、タンガニーカ湖の西のマニエマ（ニャングウェ・カソンゴ）やスタンリー・フォールズに拠点を置き、象牙と奴隷を求めて銃で勢力を広げた。コンゴ自由国はいったんティップ・ティプを知事に任じたが、1892–94年のコンゴ・アラブ戦争で彼らの勢力を滅ぼした。
  note: 地域ははっきりしないので uncertain で塗る。ザンジバルのスルタンの宗主権（名目的）は帯で示す。
  source: "https://en.wikipedia.org/wiki/Congo_Arab_war"

- id: zande
  name: ザンデ諸王国
  short: ザンデ
  color: "#a0c49c"
  kind: 王国群（スルタン国）
  periods:
    - from: 1800
      to: 1905
      text: ウエレ川・ムボム川流域にアヴォンガラ家の王たちが建てたザンデ（アザンデ）人の王国群。19世紀後半には北のスーダンの奴隷商人・マフディー派と争い、また結んだ。ムボム川沿いのバンガスー・ラファイ・ゼミオのスルタン国は1890年代にフランスの保護下に、南のウエレはコンゴ自由国に入った。東のマンベトゥ王国も地図ではこの色で塗る。
  note: 南スーダンの西エクアトリア（グブドゥエの王国など。1905年にイギリスに征服）も同じ色で塗る。範囲はおおよそ（uncertain）。
  source: "https://en.wikipedia.org/wiki/Zande_people"

- id: dar_al_kuti
  name: ダール・アル＝クーティ・スルタン国
  short: ダール・アル＝クーティ
  color: "#b9d5d4"
  kind: スルタン国（イスラーム）
  rulers:
    - {name: ムハンマド・アッ＝サヌーシー, title: スルタン, from: 1890, to: 1911, note: ラービフと結び、奴隷狩りで栄えた。1897年にフランスと保護条約を結んだが、1911年にフランス軍に殺された, source: "https://en.wikipedia.org/wiki/Muhammad_al-Senoussi"}
  periods:
    - from: 1830
      to: 1911
      text: ワダイ（チャド）に従うイスラームのスルタン国。中央アフリカ北東部のンデレを都とし、南のバンダ人などの地で奴隷狩りを行って、奴隷を北のワダイ・エジプト方面に送った。
  note: ワダイの宗主権は帯で示す。1886–90年はラービフの拠点（地図ではラービフの色）。
  source: "https://en.wikipedia.org/wiki/Dar_al_Kuti"

# ================================================================ ザンベジ川流域・中南部アフリカの内陸

- id: lozi
  name: ロジ王国（バロツェ）
  short: ロジ王国
  color: "#8fc4d4"
  kind: 王国
  rulers:
    - {name: レワニカ, title: リトゥンガ（ロジ王）, from: 1878, to: 1916, note: 1884–85年に一時王位を追われた。1890年にイギリス南アフリカ会社に利権を与え、保護を受けた, source: "https://en.wikipedia.org/wiki/Lewanika"}
  periods:
    - from: 1648
      to: 1839
      text: ザンベジ川上流の氾濫原の王国。王（リトゥンガ）は洪水の季節に高台の都へ舟で移る儀式（クオンボカ）を行った。周りのトンガ・イラなどから貢ぎ物を受けた。
    - from: 1864
      to: 1890
      text: コロロ人の支配を倒して王国を再興した。レワニカ王は宣教師を受け入れ、ンデベレやポルトガルに対抗するためにイギリスの保護を求めた。
  note: 1891 年以後はイギリスの保護下（バロツェランド。britain の indirect）。
  source: "https://ja.wikipedia.org/wiki/バロツェランド"

- id: kololo
  name: コロロ王国
  short: コロロ
  color: "#cfd37e"
  kind: 王国
  rulers:
    - {name: セベトワネ, title: コロロ王, from: 1840, to: 1851, note: リヴィングストンが1851年に会った, source: "https://en.wikipedia.org/wiki/Sebetwane"}
    - {name: セケレトゥ, title: コロロ王, from: 1851, to: 1863, note: リヴィングストンのアフリカ横断を助けた, source: "https://en.wikipedia.org/wiki/Makololo"}
  periods:
    - from: 1840
      to: 1863
      text: ムフェカネの混乱の中で南アフリカの高原から北に移ったソト系のコロロ人が、セベトワネのもとでロジ王国を征服して建てた王国。リヴィングストンの探検の拠点となった。1864年にロジ人の反乱で滅んだ。
  source: "https://en.wikipedia.org/wiki/Makololo"

- id: bemba
  name: ベンバ王国
  short: ベンバ
  color: "#cea1cc"
  kind: 王国
  periods:
    - from: 1750
      to: 1898
      text: ザンビア北部の高原の王国。王はチティムクルと称した。19世紀には東アフリカ海岸のスワヒリ商人と象牙・奴隷を取引して強くなった。1898–99年にイギリス南アフリカ会社の支配を受け入れた。
  source: "https://en.wikipedia.org/wiki/Bemba_people"

- id: maravi
  name: マラヴィ王国
  short: マラヴィ
  color: "#dea0a9"
  kind: 王国（連合）
  periods:
    - {from: 1500, to: 1647, text: "カロンガ王のもとにチェワ人などが作った王国。1580–90年代にはその一派とされるジンバ人がザンベジ川からスワヒリ海岸まで攻め下った。"}
    - from: 1648
      to: 1799
      text: ニャサ湖（マラウイ湖）の南西に広がったチェワ人などの王国。カロンガ王を中心に、ウンディ（西）・ルンドゥ（シレ川下流）などの王が並んだ。象牙・鉄をポルトガル人やスワヒリ商人と取引した。18世紀後半に衰えて分裂した。マラウイの国名のもと。
  note: 範囲はおおよそ（uncertain）。
  source: "https://ja.wikipedia.org/wiki/マラヴィ王国"

- id: ngoni
  name: ンゴニ諸王国
  short: ンゴニ
  color: "#b3a07a"
  kind: 王国群
  rulers:
    - {name: ムベルワ1世, title: ンゴニ王（ムジンバ）, from: 1857, to: 1891, note: 要確認, source: "https://en.wikipedia.org/wiki/Ngoni_people"}
    - {name: ムペゼニ, title: ンゴニ王（ザンビア東部）, from: 1857, to: 1900, note: 1898年にイギリス南アフリカ会社に敗れた。要確認, source: "https://en.wikipedia.org/wiki/Mpezeni"}
  periods:
    - from: 1850
      to: 1904
      text: ムフェカネの中で南アフリカから北上したズワンゲンダバのンゴニ人が、ザンベジ川を越えて（1835）タンザニア南部・マラウイ・ザンビア東部・モザンビークのテテ高原に建てた軍事国家。ズールー式の軍制で周りのチェワ・トゥンブカなどを従えた。1890年代にイギリス・ポルトガルに征服された。
  note: いくつかの王国（ムベルワ・マセコ・ムペゼニ、タンザニア南部のソンゲアのンジェル・ムショペなど）をまとめて1色で塗る。
  source: "https://en.wikipedia.org/wiki/Ngoni_people"

- id: mutapa
  name: ムタパ王国（モノモタパ）
  short: ムタパ
  color: "#d6b56e"
  kind: 王国
  rulers:
    - {name: "ニャツィンバ・ムトタ", title: "ムタパ王（ムウェネ・ムタパ）", from: 1430, to: 1450, note: "ムタパ王国を建てた。在位年は推定", source: "https://en.wikipedia.org/wiki/Nyatsimba_Mutota"}
    - {name: "マトペ", title: "ムタパ王", from: 1450, to: 1480, note: "王国を東の海岸の方へ広げた。在位年は推定", source: "https://en.wikipedia.org/wiki/Kingdom_of_Mutapa"}
    - {name: "マヴラ・マオブウェ", title: "ムタパ王", from: 1480, to: 1480, note: "在位年は推定", source: "https://en.wikipedia.org/wiki/Kingdom_of_Mutapa"}
    - {name: "ムコンベロ・ニャフマ", title: "ムタパ王", from: 1480, to: 1490, note: "在位年は推定", source: "https://en.wikipedia.org/wiki/Kingdom_of_Mutapa"}
    - {name: "チャンガミレ", title: "ムタパ王（王位の簒奪）", from: 1490, to: 1494, note: "南のトルワの地から起こり、王位を奪った。在位年は推定", source: "https://en.wikipedia.org/wiki/Kingdom_of_Mutapa"}
    - {name: "カクヨ・コムニャカ", title: "ムタパ王", from: 1494, to: 1530, note: "在位年は推定", source: "https://en.wikipedia.org/wiki/Kingdom_of_Mutapa"}
    - {name: "ネシャングウェ・ムネンビレ", title: "ムタパ王", from: 1530, to: 1550, note: "在位年は推定", source: "https://en.wikipedia.org/wiki/Kingdom_of_Mutapa"}
    - {name: "チヴェレ・ニャソロ", title: "ムタパ王", from: 1550, to: 1560, note: "在位年は推定", source: "https://en.wikipedia.org/wiki/Kingdom_of_Mutapa"}
    - {name: "ネゴモ・チリサムフル", title: "ムタパ王", from: 1560, to: 1589, note: "イエズス会のシルヴェイラを殺させ（1561年）、ポルトガルのバレトの遠征を受けた", source: "https://en.wikipedia.org/wiki/Kingdom_of_Mutapa"}
    - {name: "ガツィ・ルセレ", title: "ムタパ王", from: 1589, to: 1623, note: "1607年に鉱山をポルトガルに譲る約束をした", source: "https://en.wikipedia.org/wiki/Gatsi_Rusere"}
    - {name: "ニャンボ・カパラリゼ", title: "ムタパ王", from: 1623, to: 1629, note: "ポルトガルに支えられたマヴラに追われた", source: "https://en.wikipedia.org/wiki/Nyambo_Kapararidze"}
    - {name: マヴラ2世, title: ムタパ王（ムウェネ・ムタパ）, from: 1629, to: 1652, note: ポルトガルの支援で即位し、臣従した, source: "https://en.wikipedia.org/wiki/Mavura_II_of_Mutapa"}
    - {name: チオコ・ダムブカ, title: ムタパ王, from: 1887, to: 1917, note: 最後のムタパ王。1917年の反乱で戦死。在位年は要確認, source: "https://ja.wikipedia.org/wiki/モノモタパ王国"}
  periods:
    - {from: 1453, to: 1647, text: "ムトタが建て、マトペが東の海岸の方へ広げたジンバブエ高原の北の王国。1490年代のチャンガミレの反乱の後、マニカ・キテヴェ・バルエが自立した。ポルトガル人は金を求めて市を開き、1629年にムタパを臣従させた。"}
    - from: 1648
      to: 1693
      text: ジンバブエ高原の北の王国。金と象牙の交易で知られ、1629年からポルトガルに臣従した。ポルトガル人は高原に市（フェイラ）を開き、金を求めた。
    - from: 1694
      to: 1902
      text: ロズウィ王国に高原を奪われ、ザンベジ川の谷（チディマ、現在のモザンビークのテテ州）を本拠とする小さな王国として続いた。20世紀初めにポルトガルに征服された。
  source: "https://ja.wikipedia.org/wiki/モノモタパ王国"

- id: torwa
  name: トルワ王国（ブトゥア）
  short: トルワ
  color: "#a6c9b4"
  kind: 王国
  periods:
    - {from: 1453, to: 1647, text: "グレート・ジンバブエが放棄された後、ジンバブエ高原の南西に起こった王国。カミに石造の都を築いた。"}
    - from: 1648
      to: 1683
      text: ジンバブエ高原の南西の王国。グレート・ジンバブエの後を継ぎ、カミ・ダナンゴンベ（ドロドロ）に石造の都を築いた。1683年ごろチャンガミレ・ドンボに滅ぼされた。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Butua"

- id: rozwi
  name: ロズウィ王国（チャンガミレ国）
  short: ロズウィ
  color: "#c4ae9c"
  kind: 王国
  rulers:
    - {name: チャンガミレ・ドンボ, title: ロズウィ王（チャンガミレ）, from: 1684, to: 1695, note: ポルトガル軍を破り、高原から追い出した。在位年は要確認, source: "https://en.wikipedia.org/wiki/Changamire_Dombo"}
  periods:
    - from: 1684
      to: 1834
      text: チャンガミレ・ドンボがトルワ王国を倒して建てた王国。1693–95年にポルトガル人を高原から追い出し、ジンバブエ高原の大部分を従えた。ダナンゴンベを都とした。1830年代に北上するンゴニ人・ンデベレ人の攻撃で崩れた。
  source: "https://en.wikipedia.org/wiki/Rozvi_Empire"

- id: manyika
  name: マニカ王国
  short: マニカ
  color: "#8dc3b6"
  kind: 王国
  periods:
    - from: 1648
      to: 1890
      text: ジンバブエとモザンビークの境の高原のショナ系の王国。王はムタサと称した。金の産地で、ポルトガル人の市（マシクエセ）があった。19世紀にはガザ王国に貢納した。1891年の英葡条約で東西に分けられた。
  source: "https://en.wikipedia.org/wiki/Manyika_people"

- id: teve
  name: キテヴェ王国
  short: キテヴェ
  color: "#cfb4d8"
  kind: 王国
  periods:
    - from: 1648
      to: 1890
      text: ソファラの内陸のショナ系の王国（ウテヴェ）。ソファラのポルトガル人から通行料を取り、内陸との交易を管理した。19世紀にはガザ王国に従った。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Uteve"

- id: barue
  name: バルエ王国
  short: バルエ
  color: "#cfd5b9"
  kind: 王国
  periods:
    - from: 1648
      to: 1901
      text: ムタパ王国から分かれたショナ系の王国。ザンベジ川の南で長く自立を保ち、1902年にポルトガルに征服された。1917年の大反乱（バルエの反乱）の中心となった。
  source: "https://en.wikipedia.org/wiki/Barue_Kingdom"

- id: gaza
  name: ガザ王国
  short: ガザ
  color: "#c9906e"
  kind: 王国
  rulers:
    - {name: ソシャンガネ, title: ガザ王, from: 1825, to: 1858, note: 在位の始まりは要確認, source: "https://en.wikipedia.org/wiki/Soshangane"}
    - {name: マウェワ, title: ガザ王, from: 1858, to: 1861, source: "https://en.wikipedia.org/wiki/Gaza_Empire"}
    - {name: ムジラ, title: ガザ王, from: 1862, to: 1884, note: ポルトガルの支援で兄から王位を奪った, source: "https://en.wikipedia.org/wiki/Mzila"}
    - {name: グングニャナ, title: ガザ王, from: 1884, to: 1895, note: 1895年にポルトガル軍に捕らえられ、アゾレス諸島に流された, source: "https://en.wikipedia.org/wiki/Gungunhana"}
  periods:
    - from: 1830
      to: 1895
      text: ズールーのシャカに敗れたンドワンドウェ系のソシャンガネが、モザンビーク南部に建てた軍事国家。ツォンガ・ショピ・ンダウなどを従え、リンポポ川からザンベジ川の南まで勢力を広げた。イギリス・ポルトガルの間で揺れたが、1895年にポルトガルに征服された。
  source: "https://en.wikipedia.org/wiki/Gaza_Empire"

- id: angoche
  name: アンゴシェ・スルタン国
  short: アンゴシェ
  color: "#7fb8b0"
  kind: スルタン国（スワヒリ）
  periods:
    - from: 1648
      to: 1909
      text: モザンビーク北部の海岸のスワヒリ系の港市国家。内陸のマクア人と結び、19世紀には奴隷交易で栄えた。1910年にポルトガルに征服された。
  source: "https://en.wikipedia.org/wiki/Angoche_Sultanate"

- id: ndebele
  name: ンデベレ王国（マタベレ）
  short: ンデベレ
  color: "#b79ad0"
  kind: 王国
  rulers:
    - {name: ムジリカジ, title: ンデベレ王, from: 1823, to: 1868, note: シャカに背いて北に移った, source: "https://ja.wikipedia.org/wiki/ムジリカジ"}
    - {name: ロベングラ, title: ンデベレ王, from: 1870, to: 1894, note: 1888年にラッド利権をローズの側に与え、1893年の戦争で敗れて逃れる途中に死んだ, source: "https://en.wikipedia.org/wiki/Lobengula"}
  periods:
    - from: 1827
      to: 1837
      text: ズールーのシャカに背いたムジリカジが、ムフェカネの中で北に移り、トランスヴァールの高原にソト・ツワナ系の人々を従えて王国を建てた。1837年にボーア人とグリクワ人に敗れ、北に去った。
    - from: 1840
      to: 1893
      text: ジンバブエ南西部のブラワヨを都に王国を建て、ショナ人の地を襲って貢ぎ物を取った。ロベングラ王はローズのイギリス南アフリカ会社に鉱山の利権を与え（ラッド利権）、1893年の戦争で征服された。
  source: "https://en.wikipedia.org/wiki/Northern_Ndebele_people"

# ================================================================ 南アフリカ

- id: zulu
  name: ズールー王国
  short: ズールー
  color: "#be93ad"
  kind: 王国
  rulers:
    - {name: シャカ, title: ズールー王, from: 1816, to: 1828, note: 異母弟ディンガネらに暗殺された, source: "https://ja.wikipedia.org/wiki/シャカ"}
    - {name: ディンガネ, title: ズールー王, from: 1828, to: 1840, note: ブラッド・リヴァーの戦いでボーア人に敗れた, source: "https://ja.wikipedia.org/wiki/ディンガネ"}
    - {name: ムパンデ, title: ズールー王, from: 1840, to: 1872, source: "https://en.wikipedia.org/wiki/Mpande_kaSenzangakhona"}
    - {name: ケツワヨ, title: ズールー王, from: 1872, to: 1879, note: ズールー戦争に敗れてケープに捕らわれた。1883–84年に一部の王に戻された, source: "https://ja.wikipedia.org/wiki/セテワヨ"}
    - {name: ディヌズル, title: ズールー王, from: 1884, to: 1887, note: 1887年のイギリスの併合の後、反乱を起こしてセントヘレナ島に流された, source: "https://en.wikipedia.org/wiki/Dinuzulu_kaCetshwayo"}
  periods:
    - from: 1816
      to: 1838
      text: シャカが年齢別の連隊と短い槍の戦法で軍を改め、周りの首長国を征服して強大な王国を作った。この戦争と人々の移動の連鎖（ムフェカネ）は南部アフリカ全体を揺るがした。
    - from: 1838
      to: 1878
      text: ディンガネはグレート・トレックのボーア人の指導者レティーフを殺したが、ブラッド・リヴァーの戦いで敗れ、トゥゲラ川の南を失った。ムパンデ・ケツワヨの時代はイギリス領ナタールとトランスヴァールの間で王国を保った。
    - from: 1879
      to: 1887
      text: イギリスの最後通牒を拒んでズールー戦争となり、イサンドルワナの戦いで大勝したが、ウルンディで敗れた。王国は13の首長領に分けられて内戦となり、1887年にイギリスに併合された。
  note: 王家（ズールー王）は南アフリカの伝統的指導者として現在まで続く。
  source: "https://ja.wikipedia.org/wiki/ズールー王国"

- id: xhosa
  name: コーサ（ホサ）諸首長国
  short: コーサ
  color: "#b9c48e"
  kind: 首長国群
  rulers:
