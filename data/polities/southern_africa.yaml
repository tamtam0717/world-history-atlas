    - {name: ムスワティ2世, title: スワジ王, from: 1840, to: 1868, note: 国名のもとになった王, source: "https://en.wikipedia.org/wiki/Mswati_II"}
    - {name: ムバンゼニ, title: スワジ王, from: 1875, to: 1889, note: ヨーロッパ人に多くの利権を与えた, source: "https://en.wikipedia.org/wiki/Mbandzeni"}
    - {name: ブヌ（ングワネ5世）, title: スワジ王, from: 1895, to: 1899, source: "https://en.wikipedia.org/wiki/Ngwane_V"}
    - {name: ソブーザ2世, title: スワジ王, from: 1899, to: 1982, note: 1921年まで祖母ラボツィベニが摂政。1973年に憲法を停止して絶対王政とした, source: "https://ja.wikipedia.org/wiki/ソブーザ2世"}
    - {name: ムスワティ3世, title: スワジ王, from: 1986, to: 2025, note: 1982–86年は摂政の時代。2018年に国名をエスワティニに改めた, source: "https://ja.wikipedia.org/wiki/ムスワティ3世"}
  periods:
    - from: 1750
      to: 1893
      text: ドラミニ家の王のもとで、ムフェカネの時代にズールーに対抗して大きくなった王国。ボーア人・イギリス人に土地や鉱山の利権を与え、多くの土地を失った。
    - from: 1968
      to: 2025
      text: 独立後もソブーザ2世・ムスワティ3世の王が強い権力を持ち、政党の活動は禁じられた。アフリカで最後の絶対君主制とされる。
  note: 1894–1899 年はトランスヴァールの保護下、1902–1968 年はイギリスの保護領（いずれも indirect）。
  source: "https://ja.wikipedia.org/wiki/エスワティニ"

- id: natalia
  name: ナタール共和国
  short: ナタール共和国
  color: "#e8b27a"
  kind: 共和国（ボーア人）
  periods:
    - from: 1839
      to: 1842
      text: グレート・トレックのボーア人が、ブラッド・リヴァーの戦いでズールー軍を破った後、ピーターマリッツバーグを首都に建てた共和国。港のダーバンをめぐってイギリスと争い、1843年にイギリスに併合された。多くのボーア人は内陸のオレンジ川・ヴァール川の北に去った。
  note: 元首は置かず、議会（フォルクスラート）が治めた。軍の司令官はアンドリース・プレトリウス。
  source: "https://en.wikipedia.org/wiki/Natalia_Republic"

- id: transvaal
  name: 南アフリカ共和国（トランスヴァール）
  names:
    - {to: 1851, name: トランスヴァールのボーア人共和国, short: トランスヴァール, kind: 共和国（ボーア人）}
  short: トランスヴァール
  color: "#d9a65c"
  kind: 共和国（ボーア人）
  rulers:
    - {name: マルティヌス・ヴェッセル・プレトリウス, title: 大統領, from: 1857, to: 1871, note: 1860–64年はオレンジ自由国の大統領を兼ねて職を離れ、その間トランスヴァールは代行・内戦（スフーマン、ファン・レンスブルフらが争う）となった, source: "https://en.wikipedia.org/wiki/Marthinus_Wessel_Pretorius"}
    - {name: トーマス・フランソワ・ブルヘルス, title: 大統領, from: 1872, to: 1877, source: "https://en.wikipedia.org/wiki/Thomas_François_Burgers"}
    - {name: ポール・クリューガー, title: 大統領, from: 1883, to: 1902, note: 1881–83年は3人の執政の一人。ボーア戦争中の1900年にヨーロッパに渡った, source: "https://ja.wikipedia.org/wiki/ポール・クリューガー"}
  periods:
    - from: 1838
      to: 1876
      text: グレート・トレックのボーア人がヴァール川の北に作った共和国。1852年のサンド・リヴァー協定でイギリスに独立を認められ、南アフリカ共和国と名乗った（首都プレトリア）。白人とアフリカ人の平等を認めない憲法を持った。
    - from: 1881
      to: 1899
      text: イギリスの併合（1877）に反抗した第1次ボーア戦争で自治を取り戻した。1886年にウィットウォーターズランドで金が見つかると、外国人（ユイトランダー）が押し寄せ、クリューガー大統領は彼らの政治参加を制限した。ジェームソン侵入事件（1895）でイギリスとの対立が深まった。
    - from: 1899
      to: 1902
      text: 南アフリカ戦争（ボーア戦争）でイギリスと戦った。首都を落とされた後もゲリラ戦を続けたが、焦土作戦と強制収容所の中で1902年に降伏した。
  note: 地図では 1838–1851 年のポチェフストルーム・リーデンブルフ・ザウトパンスベルフなどのボーア人の共和国もこの色で塗る。
  source: "https://ja.wikipedia.org/wiki/トランスヴァール共和国"

- id: orange_free_state
  name: オレンジ自由国
  short: オレンジ自由国
  color: "#c6d37e"
  kind: 共和国（ボーア人）
  rulers:
    - {name: ヨシアス・ホフマン, title: 大統領, from: 1854, to: 1855, source: "https://en.wikipedia.org/wiki/Josias_Philip_Hoffman"}
    - {name: ヤコブス・ボスホフ, title: 大統領, from: 1855, to: 1859, source: "https://en.wikipedia.org/wiki/Jacobus_Nicolaas_Boshoff"}
    - {name: マルティヌス・ヴェッセル・プレトリウス, title: 大統領, from: 1860, to: 1863, note: トランスヴァール大統領と兼ねた, source: "https://en.wikipedia.org/wiki/Marthinus_Wessel_Pretorius"}
    - {name: ヨハネス・ブラント, title: 大統領, from: 1864, to: 1888, source: "https://en.wikipedia.org/wiki/Johannes_Brand"}
    - {name: フランシス・レイツ, title: 大統領, from: 1889, to: 1895, source: "https://en.wikipedia.org/wiki/Francis_William_Reitz"}
    - {name: マルティヌス・ステイン, title: 大統領, from: 1896, to: 1902, source: "https://en.wikipedia.org/wiki/Martinus_Theunis_Steyn"}
  periods:
    - from: 1854
      to: 1898
      text: オレンジ川とヴァール川の間にボーア人が作った共和国（首都ブルームフォンテーン）。1854年のブルームフォンテーン協定でイギリスが手を引いて独立した。バソト王国と土地を争い、キンバリーのダイヤモンド産地はイギリスに取られた。
    - from: 1899
      to: 1902
      text: トランスヴァールと同盟して南アフリカ戦争（ボーア戦争）を戦い、1900年にイギリスに併合を宣言された。
  source: "https://ja.wikipedia.org/wiki/オレンジ自由国"

- id: south_africa
  name: 南アフリカ共和国
  names:
    - {to: 1960, name: 南アフリカ連邦, short: 南アフリカ連邦, kind: 自治領（イギリス連邦）}
  short: 南アフリカ
  color: "#e7a76c"
  kind: 共和国
  home_iso: [ZAF]
  rulers:
    - {name: ルイス・ボータ, title: 首相, from: 1910, to: 1919, source: "https://ja.wikipedia.org/wiki/ルイス・ボータ"}
    - {name: ヤン・スマッツ, title: 首相, from: 1919, to: 1924, source: "https://ja.wikipedia.org/wiki/ヤン・スマッツ"}
    - {name: ヘルツォーク, title: 首相, from: 1924, to: 1939, source: "https://ja.wikipedia.org/wiki/ジェームズ・バリー・ミューニック・ヘルツォーク"}
    - {name: ヤン・スマッツ, title: 首相, from: 1939, to: 1948, source: "https://ja.wikipedia.org/wiki/ヤン・スマッツ"}
    - {name: ダニエル・マラン, title: 首相, from: 1948, to: 1954, note: 国民党政権を作り、アパルトヘイトを始めた, source: "https://ja.wikipedia.org/wiki/ダニエル・フランソワ・マラン"}
    - {name: ストレイダム, title: 首相, from: 1954, to: 1958, source: "https://en.wikipedia.org/wiki/J._G._Strijdom"}
    - {name: フルヴールト, title: 首相, from: 1958, to: 1966, note: 「アパルトヘイトの設計者」。1966年に暗殺された, source: "https://ja.wikipedia.org/wiki/ヘンドリック・フルウールト"}
    - {name: フォルスター, title: 首相, from: 1966, to: 1978, source: "https://en.wikipedia.org/wiki/B._J._Vorster"}
    - {name: ピーター・ウィレム・ボータ, title: 首相・大統領, from: 1978, to: 1989, note: 1984年から執行権を持つ大統領, source: "https://ja.wikipedia.org/wiki/ピーター・ウィレム・ボータ"}
    - {name: デクラーク, title: 大統領, from: 1989, to: 1994, note: アパルトヘイトの撤廃を進め、マンデラとノーベル平和賞を受けた, source: "https://ja.wikipedia.org/wiki/フレデリック・ウィレム・デクラーク"}
    - {name: ネルソン・マンデラ, title: 大統領, from: 1994, to: 1999, note: 初の全人種参加の選挙で選ばれた黒人の大統領, source: "https://ja.wikipedia.org/wiki/ネルソン・マンデラ"}
    - {name: タボ・ムベキ, title: 大統領, from: 1999, to: 2008, source: "https://ja.wikipedia.org/wiki/タボ・ムベキ"}
    - {name: カレマ・モトランテ, title: 大統領, from: 2008, to: 2009, source: "https://ja.wikipedia.org/wiki/カレマ・モトランテ"}
    - {name: ジェイコブ・ズマ, title: 大統領, from: 2009, to: 2018, source: "https://ja.wikipedia.org/wiki/ジェイコブ・ズマ"}
    - {name: シリル・ラマポーザ, title: 大統領, from: 2018, to: 2025, source: "https://ja.wikipedia.org/wiki/シリル・ラマポーザ"}
  periods:
    - from: 1910
      to: 1947
      text: ボーア戦争の後、ケープ・ナタール・トランスヴァール・オレンジ川の4植民地が合わさったイギリスの自治領。ボーア系（アフリカーナー）のボータ・スマッツが国を率い、両大戦でイギリス側に立った。1913年の原住民土地法でアフリカ人の土地所有を限られた地域に押し込めた。1912年にアフリカ民族会議（ANC）の前身ができた。
    - from: 1948
      to: 1989
      text: アフリカーナーの国民党政権が人種隔離政策（アパルトヘイト）を法律で体系化した。人種の登録、居住地の分離、黒人の「ホームランド」への押し込めを進め、ANCを禁止した。シャープビル事件（1960）・ソウェト蜂起（1976）が起こり、国際的な制裁を受けた。1961年にイギリス連邦を離れて共和国になった。南西アフリカ（ナミビア）を統治し続け、アンゴラ内戦に介入した。
    - from: 1990
      to: 1994
      text: デクラーク大統領がANCを合法化してマンデラを釈放し、1991年にアパルトヘイトの基本法を廃止した。1994年に全人種が参加する初の選挙でマンデラが大統領に選ばれた。
    - from: 1994
      to: 2025
      text: 「虹の国」を掲げ、真実和解委員会で過去の人権侵害を明らかにした。ANCの政権が続いたが、失業・格差・汚職が問題となり、2024年の選挙でANCは過半数を失って連立政権となった。BRICSの一員。
  note: 元首は 1961 年まではイギリス国王（総督）、共和国の初期は名目的な大統領。ここでは実権を持つ首相（1984 年からは大統領）を載せる。ホームランド（トランスカイなど 4 つが「独立」させられた）は地図では描かない。
  source: "https://ja.wikipedia.org/wiki/南アフリカ共和国"

