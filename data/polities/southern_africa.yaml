  source: "https://en.wikipedia.org/wiki/Pedi_people"

- id: tswana
  name: ツワナ諸首長国
  short: ツワナ
  color: "#e2daab"
  kind: 首長国群
  rulers:
    - {name: カーマ3世, title: ングワトの首長, from: 1875, to: 1923, note: キリスト教徒の首長。1895年にロンドンに赴き、ローズの会社の支配を避けてイギリスの保護を保った, source: "https://en.wikipedia.org/wiki/Khama_III"}
  periods:
    - from: 1648
      to: 1884
      text: カラハリ砂漠の東の縁に並んだツワナ人の首長国（ングワト・クウェナ・ングワケツェ・カトラ・タワナ・ロロン・トラピンなど）。19世紀にはムフェカネ・ボーア人の進出に苦しみ、宣教師（リヴィングストンなど）を受け入れた。
  note: 地図ではいくつかの首長国をまとめて1色で塗る（範囲はおおよそ、uncertain）。1885 年以後はベチュアナランド保護領（britain の indirect）・イギリス領ベチュアナランド。
  source: "https://en.wikipedia.org/wiki/Tswana_people"

- id: lesotho
