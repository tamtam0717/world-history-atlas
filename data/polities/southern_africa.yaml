    - {name: モシェシュ2世, title: レソト王, from: 1966, to: 1990, note: 1970年からジョナサン首相に実権を奪われ、1990年に軍政に廃された, source: "https://en.wikipedia.org/wiki/Moshoeshoe_II_of_Lesotho"}
    - {name: レツィエ3世, title: レソト王, from: 1990, to: 1995, source: "https://en.wikipedia.org/wiki/Letsie_III"}
    - {name: モシェシュ2世, title: レソト王, from: 1995, to: 1996, note: 復位したが交通事故で死去, source: "https://en.wikipedia.org/wiki/Moshoeshoe_II_of_Lesotho"}
    - {name: レツィエ3世, title: レソト王, from: 1996, to: 2025, source: "https://en.wikipedia.org/wiki/Letsie_III"}
  periods:
    - from: 1824
      to: 1867
      text: モシェシュ1世がドラケンスバーグ山脈の西の高地に王国を作り、ズールー・ンデベレやボーア人の攻撃を外交と山の砦でしのいだ。カレドン川の西の肥えた土地をめぐってオレンジ自由国と戦い（1858・1865–68）、多くを失った。
    - from: 1966
      to: 2025
      text: 南アフリカに囲まれた山の王国として独立。実権は首相にあり、ジョナサン首相の独裁（1970–86）、軍政（1986–93）を経て民政に戻った。1998年の政治危機では南アフリカ・ボツワナ軍が介入した。経済は南アフリカへの出稼ぎと水の輸出に頼る。
  note: 1868–1966 年はイギリスの保護領バストランド（britain の indirect。1871–84 年はケープ植民地の管轄）。独立後の実権は首相（レアブア・ジョナサン 1966–86 など）。
  source: "https://ja.wikipedia.org/wiki/レソト"

- id: swaziland
