- id: grande_comore
  name: ンガジジャのスルタン国（グランド・コモロ）
  short: ンガジジャ
  color: "#c8a8b8"
  kind: スルタン国（複数）
  rulers:
    - {name: サイード・アリー, title: ンガジジャのスルタン, from: 1886, to: 1910, note: 島を統一してフランスの保護を受け入れた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Said_Ali_bin_Said_Omar"}
  periods:
    - from: 1648
      to: 1885
      text: コモロ最大の島ンガジジャには、いくつものスワヒリ系のスルタン国が並び立ち、争った。
  source: "https://en.wikipedia.org/wiki/Ngazidja"

- id: moheli
  name: モヘリ・スルタン国
  short: モヘリ
  color: "#b0c8a0"
  kind: スルタン国
  rulers:
    - {name: ジュンベ・ファティマ, title: 女王, from: 1842, to: 1878, note: メリナ系の王族。フランスと結んだ。在位年は要確認, source: "https://en.wikipedia.org/wiki/Djoumbé_Fatima"}
  periods:
    - from: 1648
      to: 1885
      text: コモロのいちばん小さな島のスルタン国。アンジュアンに従うこともあった。1830年代にマダガスカルから逃れたメリナ系の王族が王位についた。
  source: "https://en.wikipedia.org/wiki/Mohéli"

- id: mayotte_sultanate
  name: マヨット・スルタン国
  short: マヨット
  color: "#d0b890"
  kind: スルタン国
  rulers:
    - {name: アンドリアンツォリ, title: スルタン, from: 1832, to: 1843, note: ボイナ王国のサカラヴァの王で、メリナに追われて島に移った。1841年に島をフランスに売った, source: "https://en.wikipedia.org/wiki/Andriantsoli"}
  periods:
    - from: 1648
      to: 1840
      text: マヨット（マオレ）島のスルタン国。アンジュアン・モヘリ・マダガスカルのサカラヴァの争いの地になった。
  source: "https://en.wikipedia.org/wiki/Mayotte#History"

- id: comoros
  name: コモロ連合
  names:
    - {to: 1977, name: コモロ国, short: コモロ, kind: 共和国}
    - {from: 1978, to: 2001, name: コモロ・イスラーム連邦共和国, short: コモロ, kind: 連邦共和国（イスラーム）}
  short: コモロ
  color: "#88c4a0"
  kind: 連邦共和国
  home_iso: [COM]
  rulers:
    - {name: アフメド・アブダラ, title: 大統領, from: 1975, to: 1975, note: 独立宣言の直後にクーデタで退けられた, source: "https://en.wikipedia.org/wiki/Ahmed_Abdallah"}
    - {name: アリ・ソイリ, title: 大統領, from: 1976, to: 1978, note: 傭兵ボブ・ドナールのクーデタで殺された, source: "https://en.wikipedia.org/wiki/Ali_Soilih"}
    - {name: アフメド・アブダラ, title: 大統領, from: 1978, to: 1989, note: 暗殺された, source: "https://en.wikipedia.org/wiki/Ahmed_Abdallah"}
    - {name: サイード・モハメド・ジョハル, title: 大統領, from: 1989, to: 1996, source: "https://en.wikipedia.org/wiki/Said_Mohamed_Djohar"}
    - {name: モハメド・タキ・アブドゥルカリム, title: 大統領, from: 1996, to: 1998, source: "https://en.wikipedia.org/wiki/Mohamed_Taki_Abdoulkarim"}
    - {name: アザリ・アスマニ, title: 大統領, from: 1999, to: 2006, note: クーデタで権力を握った, source: "https://ja.wikipedia.org/wiki/アザリ・アスマニ"}
    - {name: アフメド・アブダラ・サンビ, title: 大統領, from: 2006, to: 2011, source: "https://en.wikipedia.org/wiki/Ahmed_Abdallah_Sambi"}
    - {name: イキリル・ドイニン, title: 大統領, from: 2011, to: 2016, source: "https://en.wikipedia.org/wiki/Ikililou_Dhoinine"}
    - {name: アザリ・アスマニ, title: 大統領, from: 2016, to: 2025, source: "https://ja.wikipedia.org/wiki/アザリ・アスマニ"}
  periods:
    - from: 1975
      to: 2025
      text: フランスからの独立を一方的に宣言した（マヨットは残留）。独立後20回以上のクーデタ・未遂がくり返され、フランス人傭兵ボブ・ドナールが何度も政変に関わった。1997年にアンジュアン・モヘリが分離を宣言し、2001年に各島に大きな自治を認める連合となった。
  source: "https://ja.wikipedia.org/wiki/コモロ"

- id: mauritius
  name: モーリシャス共和国
  names:
    - {to: 1991, name: モーリシャス, short: モーリシャス, kind: 立憲君主国（イギリス連邦王国）}
  short: モーリシャス
  color: "#e0a0b8"
  kind: 共和国
  home_iso: [MUS]
  rulers:
    - {name: シウサガル・ラングーラム, title: 首相, from: 1968, to: 1982, note: 「建国の父」, source: "https://ja.wikipedia.org/wiki/シウサガル・ラングーラム"}
    - {name: アネルード・ジュグノート, title: 首相, from: 1982, to: 1995, source: "https://ja.wikipedia.org/wiki/アネルード・ジュグノート"}
    - {name: ナヴィン・ラングーラム, title: 首相, from: 1995, to: 2000, source: "https://ja.wikipedia.org/wiki/ナヴィン・ラングーラム"}
    - {name: アネルード・ジュグノート, title: 首相, from: 2000, to: 2003, source: "https://ja.wikipedia.org/wiki/アネルード・ジュグノート"}
    - {name: ポール・ベランジェ, title: 首相, from: 2003, to: 2005, source: "https://en.wikipedia.org/wiki/Paul_Bérenger"}
    - {name: ナヴィン・ラングーラム, title: 首相, from: 2005, to: 2014, source: "https://ja.wikipedia.org/wiki/ナヴィン・ラングーラム"}
    - {name: アネルード・ジュグノート, title: 首相, from: 2014, to: 2017, source: "https://ja.wikipedia.org/wiki/アネルード・ジュグノート"}
    - {name: プラヴィン・ジュグノート, title: 首相, from: 2017, to: 2024, source: "https://ja.wikipedia.org/wiki/プラヴィン・ジュグノート"}
    - {name: ナヴィン・ラングーラム, title: 首相, from: 2024, to: 2025, source: "https://ja.wikipedia.org/wiki/ナヴィン・ラングーラム"}
  periods:
    - from: 1968
      to: 2025
      text: イギリスから独立（1992年に共和国）。インド系が多数を占める多民族の国で、砂糖から繊維・観光・金融へと経済を広げ、アフリカで最も安定した民主国家の一つとなった。チャゴス諸島の返還を求め、2025年にイギリスと主権の移譲に合意した。
  note: 実権は首相にあるので首相を載せる。
  source: "https://ja.wikipedia.org/wiki/モーリシャス"

- id: seychelles
  name: セーシェル共和国
  short: セーシェル
  color: "#90c8d8"
  kind: 共和国
  home_iso: [SYC]
  rulers:
    - {name: ジェームズ・マンチャム, title: 大統領, from: 1976, to: 1977, note: クーデタで退けられた, source: "https://en.wikipedia.org/wiki/James_Mancham"}
    - {name: フランス＝アルベール・ルネ, title: 大統領, from: 1977, to: 2004, note: 1979年から一党制, source: "https://ja.wikipedia.org/wiki/フランス＝アルベール・ルネ"}
    - {name: ジェームス・ミシェル, title: 大統領, from: 2004, to: 2016, source: "https://ja.wikipedia.org/wiki/ジェームス・ミシェル"}
    - {name: ダニー・フォール, title: 大統領, from: 2016, to: 2020, source: "https://en.wikipedia.org/wiki/Danny_Faure"}
    - {name: ウェーベル・ラムカラワン, title: 大統領, from: 2020, to: 2025, source: "https://en.wikipedia.org/wiki/Wavel_Ramkalawan"}
    - {name: パトリック・エルミニー, title: 大統領, from: 2025, to: 2025, source: "https://en.wikipedia.org/wiki/Patrick_Herminie"}
  periods:
    - from: 1976
      to: 2025
      text: イギリスから独立。翌年のクーデタでルネが政権を握り、一党制が1993年まで続いた。観光と漁業が経済の柱。
  source: "https://ja.wikipedia.org/wiki/セーシェル"
