  periods:
    - from: 1648
      to: 1878
      text: ケープ東部のコーサ人の首長国（ガレカ系・ラルハベ系）と、東のテンブ・ポンドなどの首長国。1779年から100年近く、東に広がるケープ植民地とケープ辺境戦争（コーサ戦争）を戦った。1856–57年には予言を信じて牛を殺した「牛殺し」で大飢饉となり、土地を失った。
  note: テンブ・ポンド（ムポンド）などの首長国も地図ではこの色で塗る（範囲はおおよそ、uncertain）。
  source: "https://ja.wikipedia.org/wiki/コサ人"

- id: pedi
  name: ペディ王国
  short: ペディ
  color: "#c0a6d4"
  kind: 王国
  rulers:
