    - {name: エドワード・モリス, title: 首相, from: 1909, to: 1917, source: "https://en.wikipedia.org/wiki/Edward_Patrick_Morris,_1st_Baron_Morris"}
    - {name: ジョン・クロスビー, title: 首相, from: 1917, to: 1918, source: "https://en.wikipedia.org/wiki/John_Chalker_Crosbie"}
    - {name: ウィリアム・ロイド, title: 首相, from: 1918, to: 1919, source: "https://en.wikipedia.org/wiki/William_F._Lloyd"}
    - {name: マイケル・キャッシン, title: 首相, from: 1919, to: 1919, source: "https://en.wikipedia.org/wiki/Michael_Patrick_Cashin"}
    - {name: リチャード・スクワイアズ, title: 首相, from: 1919, to: 1923, source: "https://en.wikipedia.org/wiki/Richard_Squires"}
    - {name: ウィリアム・ウォーレン, title: 首相, from: 1923, to: 1924, source: "https://en.wikipedia.org/wiki/William_Warren_(politician)"}
    - {name: アルバート・ヒックマン, title: 首相, from: 1924, to: 1924, source: "https://en.wikipedia.org/wiki/Albert_Hickman"}
    - {name: ウォルター・モンロー, title: 首相, from: 1924, to: 1928, source: "https://en.wikipedia.org/wiki/Walter_Stanley_Monroe"}
    - {name: フレデリック・オールダイス, title: 首相, from: 1928, to: 1928, source: "https://en.wikipedia.org/wiki/Frederick_C._Alderdice"}
    - {name: リチャード・スクワイアズ（再任）, title: 首相, from: 1928, to: 1932, note: 財政危機の中、1932年の暴動の後に退陣した。, source: "https://en.wikipedia.org/wiki/Richard_Squires"}
    - {name: フレデリック・オールダイス（再任）, title: 首相, from: 1932, to: 1934, note: 自治を停止して統治委員会に移すことを受け入れた。, source: "https://en.wikipedia.org/wiki/Frederick_C._Alderdice"}
  periods:
    - from: 1907
      to: 1918
      text: 1907年に自治領となった。タラ漁と製紙が主な産業。第一次世界大戦ではニューファンドランド連隊がソンムの戦い（ボーモン・アメル、1916）で壊滅的な損害を受けた。
    - from: 1919
      to: 1933
      text: 戦争の負債と漁業の不振、世界恐慌で財政が破綻し、1934年に自治を停止した。1927年にラブラドルの境界がニューファンドランドに有利に決まった。

- id: red_river
  name: レッド・リヴァー臨時政府
  short: レッド・リヴァー
  color: "#b9cf8f"
  kind: 臨時政府（メティ）
  rulers:
    - {name: ルイ・リエル, title: 臨時政府の議長, from: 1869, to: 1870, note: メティ（先住民とフランス系の混血の人々）の指導者。1870年にカナダ政府と交渉してマニトバ州をつくらせたが、亡命を強いられた。1885年の北西部の反乱の後に処刑された。, source: "https://ja.wikipedia.org/wiki/ルイ・リエル"}
  periods:
    - from: 1869
      to: 1870
      text: ハドソン湾会社がルパートランドをカナダに引き渡す際、住民に相談がなかったことにメティが反発し、リエルを指導者に臨時政府をつくった（レッド・リヴァーの反乱）。交渉の結果、マニトバ州が置かれた（1870）。
  source: "https://ja.wikipedia.org/wiki/レッド・リヴァーの反乱"

- id: huron
  name: ヒューロン連合（ウェンダット）
  short: ヒューロン
  color: "#b3c99a"
  kind: 部族連合
  periods:
    - from: 1648
      to: 1649
      text: ジョージア湾の南に住むイロコイ語系の4部族の連合。フランスの同盟者として毛皮交易の仲立ちをし、イエズス会が布教した。疫病で人口が半減したところにイロコイ連邦の攻撃を受け、1649年に崩壊した。生き残った人々はケベックの近く（ロレット）や五大湖西部に移った（のちのワイアンドット）。
  source: "https://ja.wikipedia.org/wiki/ヒューロン族"
