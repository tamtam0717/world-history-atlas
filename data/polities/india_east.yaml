    - {name: ビレンドラ, title: ネパール王, from: 1972, to: 2001, note: 1990年の民主化運動で立憲君主制に移った。2001年の王宮事件で殺された, source: "https://ja.wikipedia.org/wiki/ビレンドラ"}
    - {name: ギャネンドラ, title: ネパール王, from: 2001, to: 2008, note: 2005年に全権を握ったが、2006年の民主化運動で権限を失い、2008年に王政が廃止された, source: "https://ja.wikipedia.org/wiki/ギャネンドラ"}
    - {name: プシュパ・カマル・ダハル（プラチャンダ）, title: 首相（ネパール共産党毛沢東主義派）, from: 2008, to: 2009, note: 2016–2017年、2022–2024年にも首相, source: "https://ja.wikipedia.org/wiki/プシュパ・カマル・ダハル"}
    - {name: マダブ・クマール・ネパール／ジャラ・ナート・カナル／バブラム・バッタライ／キル・ラージ・レグミ, title: 首相, from: 2009, to: 2014, note: 首相が短い間隔で替わった（2013–2014年のレグミは選挙管理内閣の首班）, source: "https://en.wikipedia.org/wiki/List_of_prime_ministers_of_Nepal"}
    - {name: スシル・コイララ, title: 首相（ネパール会議派）, from: 2014, to: 2015, note: 2015年に新憲法を公布, source: "https://en.wikipedia.org/wiki/Sushil_Koirala"}
    - {name: カドガ・プラサード・シャルマ・オリ, title: 首相（統一共産党）, from: 2015, to: 2016, source: "https://ja.wikipedia.org/wiki/カドガ・プラサード・シャルマ・オリ"}
    - {name: プラチャンダ／シェール・バハドゥル・デウバ, title: 首相, from: 2016, to: 2018, source: "https://en.wikipedia.org/wiki/List_of_prime_ministers_of_Nepal"}
    - {name: カドガ・プラサード・シャルマ・オリ, title: 首相, from: 2018, to: 2021, source: "https://ja.wikipedia.org/wiki/カドガ・プラサード・シャルマ・オリ"}
    - {name: シェール・バハドゥル・デウバ, title: 首相（ネパール会議派）, from: 2021, to: 2022, source: "https://en.wikipedia.org/wiki/Sher_Bahadur_Deuba"}
    - {name: プラチャンダ, title: 首相, from: 2022, to: 2024, source: "https://ja.wikipedia.org/wiki/プシュパ・カマル・ダハル"}
    - {name: カドガ・プラサード・シャルマ・オリ, title: 首相, from: 2024, to: 2025, note: 2025年9月、SNS の禁止をきっかけにした若者の抗議運動（Z世代の抗議）で辞任した, source: "https://en.wikipedia.org/wiki/2025_Nepalese_Gen_Z_protests"}
    - {name: スシラ・カルキ, title: 暫定首相, from: 2025, note: 元最高裁長官。ネパール初の女性首相。総選挙の実施を任された, source: "https://en.wikipedia.org/wiki/Sushila_Karki"}
  periods:
    - from: 1648
      to: 1743
      text: ヒマラヤの山あいには数十の小王国があり、カトマンズ盆地ではマッラ朝の3王国（カトマンズ・パタン・バクタプル）がネワール人の都市文化を栄えさせていた。ゴルカはその西にある小さな王国だった。
    - from: 1744
      to: 1816
      text: ゴルカ王プリトヴィ・ナラヤン・シャハがカトマンズ盆地を征服して（1768–69）ネパールを統一し、後継者は東のシッキム、西のクマーウーン・ガルワールまで領土を広げた。チベットとの戦争では清の大軍に敗れ（1792）、清に5年ごとに朝貢することになった。イギリスとのグルカ戦争（1814–1816）に敗れ、スガウリ条約で西部・東部の山地とタライ（平野）の一部を失った。
    - from: 1846
      to: 1951
      text: 1846年の「コートの虐殺」でジャンガ・バハドゥルが権力を握り、ラナ家が世襲の首相として国王を名目だけにした。ラナ家はイギリスと手を結び、インド大反乱の鎮圧を助けて西部のタライを取り戻した（1860）。グルカ兵はイギリス軍の精鋭として両大戦で戦った。1923年の条約でイギリスはネパールの独立をはっきり認めた。
    - from: 1951
      to: 1990
      text: 1950–51年の革命でラナ家の専制が終わり、トリブバン国王のもとで王政が復活した。1959年に初の総選挙が行われたが、マヘンドラ国王は1960年に議会を解散し、政党を禁じた国王中心の「パンチャーヤト制」をしいた。
    - from: 1990
      to: 2008
      text: 1990年の民主化運動（ジャナ・アンドラン）で立憲君主制と複数政党制に移った。1996年から毛沢東主義派（マオイスト）の武装闘争（ネパール内戦）が続き、2001年には王宮で国王一家が殺される事件が起こった。2006年の民主化運動の後に内戦が終わり、2008年に制憲議会が王政を廃止した。
    - from: 2008
      text: 連邦民主共和国となった。2015年に大地震（ゴルカ地震）が起こり、同じ年に7州からなる連邦制の新憲法が公布された。政権交代が続き、2025年には若者の抗議運動で首相が辞任した。
  note: 1768年以前は、ゴルカ王国の時代（地図の名前も「ゴルカ」）。1792年から1908年ごろまで清に朝貢したが、断続的・儀礼的なので帯は付けない。ラナ家の首相（1846–1951）：ジャンガ・バハドゥル（1846–1877）、ラノーディープ・シンハ（1877–1885）、ビール・シャムシェル（1885–1901）、チャンドラ・シャムシェル（1901–1929）、ジュッダ・シャムシェル（1932–1945）、モハン・シャムシェル（1948–1951）など。1990–2008年の首相はギリジャ・プラサード・コイララ、シェール・バハドゥル・デウバなど。
  source:
    - "https://ja.wikipedia.org/wiki/ネパールの歴史"
    - "https://ja.wikipedia.org/wiki/ゴルカ朝"
    - "https://ja.wikipedia.org/wiki/スガウリ条約"

- id: malla
  name: マッラ朝（カトマンズ・パタン・バクタプル）
  short: マッラ朝
  color: "#e5c3e9"
  kind: 3つの王国（ネワール人の都市王国）
  rulers:
    - {name: プラターパ・マッラ, title: カトマンズ王, from: 1641, to: 1674, note: 学問と芸術を好み、王宮（ハヌマン・ドーカ）を整えた, source: "https://en.wikipedia.org/wiki/Pratap_Malla"}
    - {name: シッディナラシンハ・マッラ, title: パタン王, from: 1619, to: 1661, note: クリシュナ寺院（パタン）を建てた, source: "https://en.wikipedia.org/wiki/Siddhi_Narsingh_Malla"}
    - {name: ブパティンドラ・マッラ, title: バクタプル王, from: 1696, to: 1722, note: ニャタポラ寺院を建てた, source: "https://en.wikipedia.org/wiki/Bhupatindra_Malla"}
    - {name: ジャヤ・プラカーシュ・マッラ, title: カトマンズ王, from: 1735, to: 1768, note: 1768年にゴルカ軍にカトマンズを落とされた, source: "https://en.wikipedia.org/wiki/Jaya_Prakash_Malla"}
    - {name: ラナジット・マッラ, title: バクタプル王, from: 1722, to: 1769, note: 1769年にバクタプルが落ち、マッラ朝が終わった, source: "https://en.wikipedia.org/wiki/Ranajit_Malla"}
  periods:
    - from: 1648
      to: 1769
      text: カトマンズ盆地のマッラ朝は、カトマンズ・パタン（ラリトプル）・バクタプルの3王国に分かれて互いに争った。ネワール人の商人はチベット交易で栄え、寺院・王宮の建築や祭礼の文化が花開いた。1768–69年にゴルカに征服された。
  note: 3つの王国を1つの政体として描く（盆地の外の東の山地はバクタプル・カトマンズの支配地）。君主は主な王だけを書いた。
  source:
    - "https://ja.wikipedia.org/wiki/マッラ朝_(ネパール)"

- id: nepal_sen
  name: セーン朝の諸王国（マクワンプル・チャウダンディ・ヴィジャイプル）
  short: セーン朝諸国
  color: "#e9dc96"
  kind: 王国（セーン朝の分家）
  periods:
    - from: 1648
      to: 1774
      text: パルパから広がったセーン朝の分家が、ネパール東部の山すそとタライ（平野）にマクワンプル、チャウダンディ、ヴィジャイプルの王国を作っていた。ムガル帝国・ベンガル太守には貢納をして平野部の所領を保った。ゴルカのプリトヴィ・ナラヤン・シャハに、マクワンプル（1762）、チャウダンディ（1773）、ヴィジャイプル（1774）の順に征服された。
  note: 3つの王国を1つの政体として描く。境界はおおまか（要確認）。西のパルパ（セーン朝の本家）はチャウビセ諸国（nepal_chaubise）に含めた。
  source:
    - "https://en.wikipedia.org/wiki/Makwanpur_Gadhi"
    - "https://en.wikipedia.org/wiki/Vijaypur"

- id: nepal_kirat
  name: キラート（ライ・リンブーの首長たち）
  short: キラート
  color: "#e4d0aa"
  kind: 首長たちの連合
  periods:
    - from: 1648
      to: 1774
      text: ネパール東部の山地では、ライ人・リンブー人の首長たちが自治を保っていた。リンブー人の地（リンブワン）はヴィジャイプルのセーン朝やシッキムと結びついていた。1773–74年にゴルカに征服され、リンブーとの協定で一定の自治（キパット）が認められた。
  note: 境界・従属関係はあいまいなので、地図では不確実（斜線）として描く。
  source:
    - "https://en.wikipedia.org/wiki/Limbuwan"
    - "https://en.wikipedia.org/wiki/Kirata_Kingdom"

- id: nepal_chaubise
  name: チャウビセ諸国（24の小王国）
  short: チャウビセ諸国
  color: "#d6cf9f"
  kind: 小王国の連合
  periods:
    - from: 1648
      to: 1806
      text: ガンダキ川流域には「チャウビセ（24の王国）」と呼ばれる小王国（ラムジュン・タナフン・カスキ・パルパなど）が並び、ゴルカと争ったり手を結んだりした。1780年代にゴルカに征服され、ゴルカと同盟していたパルパも1806年に併合された。
  note: 多くの小王国を1つの政体として描く。境界はおおまか。
  source:
    - "https://en.wikipedia.org/wiki/Chaubisi_Rajya"

- id: nepal_baise
  name: バイセ諸国（22の小王国）
  short: バイセ諸国
  color: "#bfdcbd"
  kind: 小王国の連合
  periods:
    - from: 1648
      to: 1790
      text: カルナリ川流域の西ネパールには「バイセ（22の王国）」と呼ばれる小王国が並び、ジュムラとドティが有力だった。ムスタン（ロー王国）はジュムラに貢納した。1789–90年にゴルカに征服された。
  note: 多くの小王国を1つの政体として描く。境界はおおまか。
  source:
    - "https://en.wikipedia.org/wiki/Baise_Rajya"

- id: bhutan
  name: ブータン
  names:
    - {to: 1906, name: ブータン（ドゥク・デシ政権）, kind: 政教二重の政権（ドゥク派）}
    - {from: 1907, name: ブータン王国, kind: 王国（ワンチュク朝）}
  short: ブータン
  color: "#7fb6d9"
  kind: 王国
  rulers:
    - {name: シャブドゥン・ガワン・ナムゲル, title: シャブドゥン（宗教・政治の最高指導者）, from: 1616, to: 1651, note: チベットから逃れてブータンを統一した。死は1705年ごろまで隠された, source: "https://ja.wikipedia.org/wiki/ガワン・ナムゲル"}
    - {name: テンジン・ラプゲ, title: ドゥク・デシ（世俗の長）, from: 1680, to: 1695, note: 第4代のデシ。1651–1680年、1695年以後のデシは note を参照, source: "https://en.wikipedia.org/wiki/Tenzin_Rabgye"}
    - {name: ジグメ・ナムゲル, title: トンサ・ペンロプ（地方長官）→ドゥク・デシ（1870–1873）, from: 1853, to: 1881, note: ドゥアール戦争（1864–65）でイギリスと戦った。ワンチュク家の祖, source: "https://en.wikipedia.org/wiki/Jigme_Namgyal"}
    - {name: ウゲン・ワンチュク, title: トンサ・ペンロプ→国王（1907〜）, from: 1885, to: 1926, note: 1885年の内戦に勝って実権を握り、1904年のイギリスのチベット遠征を助けた。1907年に初代国王に選ばれた, source: "https://ja.wikipedia.org/wiki/ウゲン・ワンチュク"}
    - {name: ジグメ・ワンチュク, title: 国王, from: 1926, to: 1952, source: "https://en.wikipedia.org/wiki/Jigme_Wangchuck"}
    - {name: ジグメ・ドルジ・ワンチュク, title: 国王, from: 1952, to: 1972, note: 国会（1953）を開き、近代化を進めた。1971年に国連に加盟, source: "https://ja.wikipedia.org/wiki/ジグミ・ドルジ・ワンチュク"}
    - {name: ジグメ・シンゲ・ワンチュク, title: 国王, from: 1972, to: 2006, note: 「国民総幸福量（GNH）」を唱えた, source: "https://ja.wikipedia.org/wiki/ジグミ・シンゲ・ワンチュク"}
    - {name: ジグメ・ケサル・ナムゲル・ワンチュク, title: 国王, from: 2006, note: 2008年に憲法を定めて立憲君主制に移った, source: "https://ja.wikipedia.org/wiki/ジグミ・ケサル・ナムゲル・ワンチュク"}
  periods:
    - from: 1648
      to: 1906
      text: チベットから来たドゥク派の高僧シャブドゥン・ガワン・ナムゲルがブータンを統一し、宗教の長（ジェ・ケンポ）と世俗の長（ドゥク・デシ）の二重の政治のしくみを作った。各地の城塞（ゾン）を拠点にチベットの侵入を退けた。19世紀には地方長官（ペンロプ）どうしの内戦が続いた。
    - from: 1772
      to: 1865
      text: 南の平野（ドゥアール）とコーチ・ビハールをめぐってイギリス東インド会社と争った（1772–74年の戦争）。アッサム・ドゥアールは1841年、ベンガル・ドゥアールはドゥアール戦争（1864–65）の後のシンチュラ条約でイギリス領になった。
    - from: 1907
      to: 1971
      text: トンサの長官ウゲン・ワンチュクが初代国王に選ばれ、ワンチュク朝が始まった。1910年のプナカ条約で外交はイギリスの助言に従うとされ、1949年の条約でその役割をインドが引き継いだ。
    - from: 1972
      text: ジグメ・シンゲ・ワンチュク国王が「国民総幸福量」を掲げて独自の近代化を進めた。1990年代には南部のネパール系住民（ロツァンパ）の多くが国を追われて難民となった。2007年にインドとの条約が改められ、2008年に憲法を定めて立憲君主制・議会制民主主義に移った。
  note: >-
    ドゥク・デシ（世俗の長）は多くが短期間で、ここでは主な人だけを書いた（第1代テンジン・ドゥクギェ 1651–1656、第2代テンジン・ドゥクダ 1656–1667、第3代チョギェル・ミンジュル・テンパ 1667–1680 など）。
    地図では、1910–1947年はイギリスの、1949–2006年はインドの帯（外交の指導）を付けた。1971年に国連に加盟している。
  source:
    - "https://ja.wikipedia.org/wiki/ブータンの歴史"
    - "https://en.wikipedia.org/wiki/Treaty_of_Punakha"
    - "https://en.wikipedia.org/wiki/Indo-Bhutan_Friendship_Treaty"

- id: sikkim
  name: シッキム王国
  short: シッキム
  color: "#f3c6dd"
  kind: 王国（ナムギャル朝）
  rulers:
    - {name: プンツォ・ナムギャル, title: チョギャル（法王）, from: 1642, to: 1670, source: "https://en.wikipedia.org/wiki/Phuntsog_Namgyal"}
    - {name: テンスン・ナムギャル, title: チョギャル, from: 1670, to: 1700, source: "https://en.wikipedia.org/wiki/Tensung_Namgyal"}
    - {name: チャクドル・ナムギャル, title: チョギャル, from: 1700, to: 1717, note: 即位直後にブータンの侵入を受け、一時チベットに逃れた, source: "https://en.wikipedia.org/wiki/Chakdor_Namgyal"}
    - {name: ギュルメ・ナムギャル, title: チョギャル, from: 1717, to: 1733, source: "https://en.wikipedia.org/wiki/Gyurmed_Namgyal"}
    - {name: プンツォ・ナムギャル2世, title: チョギャル, from: 1733, to: 1780, source: "https://en.wikipedia.org/wiki/Phuntsog_Namgyal_II"}
    - {name: テンジン・ナムギャル, title: チョギャル, from: 1780, to: 1793, note: ネパール（ゴルカ）の侵入で西部を失い、チベットに逃れた, source: "https://en.wikipedia.org/wiki/Tenzing_Namgyal"}
    - {name: ツグプ・ナムギャル, title: チョギャル, from: 1793, to: 1863, note: 1817年のティタリヤ条約で失地を取り戻した。1835年にダージリンをイギリスに与えた, source: "https://en.wikipedia.org/wiki/Tsugphud_Namgyal"}
    - {name: シドケオン・ナムギャル, title: チョギャル, from: 1863, to: 1874, source: "https://en.wikipedia.org/wiki/Sidkeong_Namgyal"}
    - {name: トゥトブ・ナムギャル, title: チョギャル, from: 1874, to: 1914, note: 1889年からイギリスの政務官が実権を握った, source: "https://en.wikipedia.org/wiki/Thutob_Namgyal"}
    - {name: タシ・ナムギャル, title: チョギャル, from: 1914, to: 1963, note: 同じ年の前半にシドケオン・トゥルクが在位, source: "https://en.wikipedia.org/wiki/Tashi_Namgyal"}
    - {name: パルデン・トンドゥプ・ナムギャル, title: チョギャル, from: 1963, to: 1975, note: 1975年に王制が廃止され、シッキムはインドの州になった, source: "https://en.wikipedia.org/wiki/Palden_Thondup_Namgyal"}
  periods:
    - from: 1648
      to: 1816
      text: チベット系のナムギャル朝が、レプチャ人・ブティア人を治めた仏教王国。東のブータン、西のネパール（ゴルカ）にたびたび攻められ、1788年ごろからはティースタ川以西をネパールに奪われた。
    - from: 1817
      to: 1946
      text: グルカ戦争の後、ティタリヤ条約（1817）でイギリスの仲介のもと失地を取り戻したが、1835年にダージリンをイギリスに与え、1861年のトゥムロン条約で事実上イギリスの保護国になった。1890年の英清協約で清もこれを認めた。ネパールからの移民が増え、住民の多数を占めるようになった。
    - from: 1947
      to: 1975
      text: インドの独立後は、1950年の条約でインドの保護国となった（外交・防衛はインド）。1973年の反王制運動の後、1975年の住民投票で王制が廃止され、インドの22番目の州になった。
  note: 1861–1946年はイギリス、1947–1974年はインドの保護国として、宗主国の色を薄く（間接統治）＋副ラベルで描く。
  source:
    - "https://ja.wikipedia.org/wiki/シッキム王国"
    - "https://en.wikipedia.org/wiki/Kingdom_of_Sikkim"

# ================================================================ 北東インド
- id: ahom
  name: アホーム王国
  short: アホーム
  color: "#f1c08c"
  kind: 王国（タイ系のアホーム人の王朝）
  rulers:
    - {name: ジャヤドヴァジ・シンハ, title: スワルガデオ（王）, from: 1648, to: 1663, note: 1662年にムガル帝国のミール・ジュムラに都ガルガオンを奪われ、山地へ逃れた, source: "https://en.wikipedia.org/wiki/Jayadhwaj_Singha"}
    - {name: チャクラドヴァジ・シンハ, title: スワルガデオ, from: 1663, to: 1670, note: 1667年にグワーハーティーを取り戻した, source: "https://en.wikipedia.org/wiki/Chakradhwaj_Singha"}
    - {name: ウダヤーディティヤ・シンハ, title: スワルガデオ, from: 1670, to: 1672, note: 1671年のサライガートの戦いで、将軍ラチト・ボルプカンがムガル軍を破った, source: "https://en.wikipedia.org/wiki/Udayaditya_Singha"}
    - {name: ガダダル・シンハ, title: スワルガデオ, from: 1681, to: 1696, note: 1672–1681年は王が次々に廃される混乱が続いた（要確認）。1682年にイタクリの戦いでムガル軍を追い、グワーハーティーを取り戻した, source: "https://en.wikipedia.org/wiki/Gadadhar_Singha"}
    - {name: ルドラ・シンハ, title: スワルガデオ, from: 1696, to: 1714, note: 王国の最盛期, source: "https://en.wikipedia.org/wiki/Rudra_Singha"}
    - {name: シヴァ・シンハ, title: スワルガデオ, from: 1714, to: 1744, source: "https://en.wikipedia.org/wiki/Siva_Singha"}
    - {name: プラマッタ・シンハ, title: スワルガデオ, from: 1744, to: 1751, source: "https://en.wikipedia.org/wiki/Pramatta_Singha"}
    - {name: ラジェーシュワル・シンハ, title: スワルガデオ, from: 1751, to: 1769, source: "https://en.wikipedia.org/wiki/Rajeswar_Singha"}
    - {name: ラクシュミー・シンハ, title: スワルガデオ, from: 1769, to: 1780, note: 即位の年にモアモリアの反乱が起こった, source: "https://en.wikipedia.org/wiki/Lakshmi_Singha"}
    - {name: ガウリナート・シンハ, title: スワルガデオ, from: 1780, to: 1795, note: モアモリアの反乱で都を追われ、1792年にイギリス（ウェルシュ大尉）の援軍を求めた, source: "https://en.wikipedia.org/wiki/Gaurinath_Singha"}
    - {name: カマレーシュワル・シンハ, title: スワルガデオ, from: 1795, to: 1811, note: 実権は首相（ブルハゴハイン）プルナナンダ, source: "https://en.wikipedia.org/wiki/Kamaleswar_Singha"}
    - {name: チャンドラカンタ・シンハ, title: スワルガデオ, from: 1811, to: 1818, note: 1817年にビルマ軍の後押しで実権を取り戻した。1819–1821年にも王, source: "https://en.wikipedia.org/wiki/Chandrakanta_Singha"}
    - {name: プランダル・シンハ, title: スワルガデオ, from: 1818, to: 1819, note: 1833–1838年にイギリスの保護下で上アッサムの王, source: "https://en.wikipedia.org/wiki/Purandar_Singha"}
    - {name: ジョーゲーシュワル・シンハ, title: スワルガデオ（ビルマの傀儡）, from: 1821, to: 1825, source: "https://en.wikipedia.org/wiki/Jogeswar_Singha"}
  periods:
    - from: 1648
      to: 1682
      text: ブラマプトラ川流域（アッサム）を600年近く治めたタイ系のアホーム王国は、西から迫るムガル帝国と戦った。1662年にミール・ジュムラが都を占領したが、アホームは雨季と疫病でムガル軍を苦しめ、1671年のサライガートの戦い、1682年のイタクリの戦いでグワーハーティーを取り戻して、マナス川を西の境とした。
    - from: 1683
      to: 1768
      text: ルドラ・シンハとシヴァ・シンハのもとで王国は最も栄え、ヒンドゥー教（シャークタ派）が王家に広まり、首都ランプル（シヴァサーガル）に寺院や宮殿が建てられた。
    - from: 1769
      to: 1826
      text: ヴィシュヌ派の宗団に属する人々のモアモリアの反乱（1769–1805）で王国は荒れ、宮廷の争いからビルマ（コンバウン朝）の介入を招いた。1817年からビルマ軍が侵入し、1821年にはアッサムを占領した。第1次イギリス＝ビルマ戦争の後、ヤンダボ条約（1826）でアッサムはイギリスのものになった。
    - from: 1833
      to: 1838
      text: イギリスはプランダル・シンハを上アッサムの王として立てたが、1838年に貢納の滞りを理由に併合した。
  note: 地図では、1817–1820年はビルマの帯（ビルマが王を立てた時期）、1821–1825年はビルマの占領（斜線）として描く。
  source:
    - "https://ja.wikipedia.org/wiki/アホーム王国"
    - "https://en.wikipedia.org/wiki/Ahom_kingdom"

- id: koch_bihar
  name: コーチ・ビハール王国
  short: コーチ・ビハール
  color: "#c9a3e0"
  kind: 王国（コーチ朝）
  rulers:
