# 東インド・ベンガル・ヒマラヤ（担当 S2）の政体。
# 範囲：インドのビハール・ジャールカンド・西ベンガル・オディシャ・チャッティースガル・北東諸州・シッキム、
# およびバングラデシュ・ネパール・ブータン。
# ムガル帝国（mughal）・インド（india）・パキスタン（pakistan）は S1、マラーター（maratha）・ハイデラバード（hyderabad）・
# ゴールコンダは S3、ビルマ（burma）・アラカンは S4、チベット（tibet）は inner_asia.yaml、イギリス（britain）・フランス（france）は west.yaml。

# ================================================================ ベンガル
- id: bengal_nawab
  name: ベンガル太守（ナワーブ）
  short: ベンガル太守
  color: "#d3e08a"
  kind: 太守領（ムガル帝国から事実上自立）
  rulers:
    - {name: ムルシド・クリー・ハーン, title: ベンガル太守, from: 1717, to: 1727, note: 1700年からベンガルのディーワーン（財務長官）。1704年に役所をダッカからムルシダーバードへ移した。1717年に太守（ナーズィム）となり、世襲の太守政権を開いた, source: "https://ja.wikipedia.org/wiki/ムルシド・クリー・ハーン"}
    - {name: シュジャーウッディーン・ムハンマド・ハーン, title: ベンガル太守, from: 1727, to: 1739, note: 1733年にビハールも治めることになった, source: "https://en.wikipedia.org/wiki/Shuja-ud-Din_Muhammad_Khan"}
    - {name: サルファラーズ・ハーン, title: ベンガル太守, from: 1739, to: 1740, note: 1740年にアリーヴァルディー・ハーンに敗れて戦死, source: "https://en.wikipedia.org/wiki/Sarfaraz_Khan"}
    - {name: アリーヴァルディー・ハーン, title: ベンガル太守, from: 1740, to: 1756, note: 1742–1751年にマラーター（ナーグプルのボーンスレー家）の侵入に苦しみ、1751年にオリッサを譲った, source: "https://ja.wikipedia.org/wiki/アリーヴァルディー・ハーン"}
    - {name: シラージュ・ウッダウラ, title: ベンガル太守, from: 1756, to: 1757, note: 1757年のプラッシーの戦いでイギリス東インド会社に敗れ、殺された, source: "https://ja.wikipedia.org/wiki/シラージュ・ウッダウラ"}
    - {name: ミール・ジャアファル, title: ベンガル太守, from: 1757, to: 1760, note: 東インド会社に擁立された。1763–1765年に再び太守, source: "https://ja.wikipedia.org/wiki/ミール・ジャアファル"}
    - {name: ミール・カーシム, title: ベンガル太守, from: 1760, to: 1763, note: 会社と対立して追われ、1764年のブクサールの戦いでアワド太守・ムガル皇帝と組んで敗れた, source: "https://ja.wikipedia.org/wiki/ミール・カーシム"}
    - {name: ミール・ジャアファル, title: ベンガル太守（復位）, from: 1763, to: 1765, source: "https://ja.wikipedia.org/wiki/ミール・ジャアファル"}
  periods:
    - from: 1717
      to: 1741
      text: ムガル帝国の衰えとともに、ベンガル・ビハール・オリッサの太守が世襲の政権となった。都ムルシダーバードは豊かなベンガルの富で栄え、太守は皇帝への貢納を続けながら実質的に自立した。カルカッタ（イギリス）・シャンデルナゴル（フランス）・チンスラ（オランダ）などの商館が並んだ。
    - from: 1742
      to: 1756
      text: アリーヴァルディー・ハーンの時代、マラーターの騎兵（バルギー）が毎年のようにベンガル西部を荒らし、1751年の講和でオリッサを譲り、毎年の貢納（チャウト）を約束した。
    - from: 1756
      to: 1765
      text: 若い太守シラージュ・ウッダウラはカルカッタを攻め落としたが（1756）、1757年のプラッシーの戦いでクライヴの率いる東インド会社軍に敗れた。以後の太守は会社に擁立される傀儡となり、1764年のブクサールの戦いの後、1765年に会社がベンガル・ビハール・オリッサのディーワーニー（徴税権）を得て、太守は名目だけの存在になった。
  note: 地図では、ムルシド・クリー・ハーンが太守となった1717年から独自の色で描く（ビハールは1733年から）。ムガル皇帝の宗主権は名目的なので帯は付けない。1757–1764年は東インド会社に擁立された太守なので、イギリスの帯（overlord）を付けた。1765年以後の太守（ムルシダーバードのナワーブ）は年金を受ける名目だけの存在で、1793年に司法・警察の権限（ニザーマト）も会社に移った。
  source:
    - "https://ja.wikipedia.org/wiki/ベンガル太守"
    - "https://en.wikipedia.org/wiki/Nawab_of_Bengal"

- id: bangladesh
  name: バングラデシュ人民共和国
  short: バングラデシュ
  color: "#86c79c"
  kind: 共和国
  rulers:
    - {name: シェイク・ムジブル・ラフマン, title: 首相→大統領（1975〜）, from: 1971, to: 1975, note: アワミ連盟の指導者で「建国の父」。1971年3月の独立宣言の時はパキスタン軍に逮捕され、1972年1月に帰国。1975年8月のクーデタで家族とともに殺された, source: "https://ja.wikipedia.org/wiki/シェイク・ムジブル・ラフマン"}
    - {name: ジアウル・ラフマン, title: 陸軍参謀長→大統領（1977〜）, from: 1975, to: 1981, note: 1975年11月の政変の後に実権を握る。バングラデシュ民族主義党（BNP）を作った。1981年に暗殺された, source: "https://ja.wikipedia.org/wiki/ジアウル・ラフマン"}
    - {name: アブドゥス・サッタール, title: 大統領, from: 1981, to: 1982, source: "https://en.wikipedia.org/wiki/Abdus_Sattar"}
    - {name: フセイン・モハンマド・エルシャド, title: 戒厳令司令官→大統領（1983〜）, from: 1982, to: 1990, note: 1990年12月の民主化運動で辞任した, source: "https://ja.wikipedia.org/wiki/フセイン・モハンマド・エルシャド"}
    - {name: カレダ・ジア, title: 首相（BNP）, from: 1991, to: 1996, note: 1991年に議院内閣制に戻った, source: "https://ja.wikipedia.org/wiki/カレダ・ジア"}
    - {name: シェイク・ハシナ, title: 首相（アワミ連盟）, from: 1996, to: 2001, source: "https://ja.wikipedia.org/wiki/シェイク・ハシナ"}
    - {name: カレダ・ジア, title: 首相（BNP）, from: 2001, to: 2006, source: "https://ja.wikipedia.org/wiki/カレダ・ジア"}
    - {name: ファクルディン・アハメド, title: 選挙管理内閣の首席顧問, from: 2007, to: 2008, note: 2007年1月に軍の後押しで非常事態が宣言され、選挙が延期された, source: "https://en.wikipedia.org/wiki/Fakhruddin_Ahmed"}
    - {name: シェイク・ハシナ, title: 首相（アワミ連盟）, from: 2009, to: 2024, note: 2024年8月、学生の反政府運動（7月革命）で辞任してインドへ逃れた, source: "https://ja.wikipedia.org/wiki/シェイク・ハシナ"}
    - {name: ムハマド・ユヌス, title: 暫定政府の首席顧問, from: 2024, note: グラミン銀行の創設者（2006年ノーベル平和賞）。2026年2月の総選挙の後、BNP のタリク・ラーマンが首相になった（要確認）, source: "https://ja.wikipedia.org/wiki/ムハマド・ユヌス"}
  periods:
    - from: 1971
      to: 1975
      text: パキスタンからの独立戦争（1971年3–12月）の末に、インド軍の参戦で独立した。ムジブル・ラフマンの政府は戦争で荒れた国の再建に取り組んだが、1974年の飢饉などで行き詰まり、1975年に一党制に移った直後のクーデタで殺された。
    - from: 1975
      to: 1990
      text: 軍人のジアウル・ラフマン、エルシャドが続けて政権を握った。イスラームを重んじる方向に憲法が改められた。
    - from: 1991
      to: 2024
      text: 議会制民主主義に戻り、カレダ・ジア（BNP）とシェイク・ハシナ（アワミ連盟）の2人の女性指導者が交互に政権を担った。縫製業の輸出で経済は伸びたが、選挙のたびに対立が激しくなり、2009年以後のハシナ政権は強権的になった。
    - from: 2024
      text: 2024年の学生運動でハシナ政権が倒れ、ノーベル平和賞のユヌスを首席顧問とする暫定政府が改革と選挙の準備を進めた。
  note: 1947–1971年は「東ベンガル」（1955年から東パキスタン）としてパキスタンの一部（地図ではパキスタンの色＋副ラベル）。2017年以後、ミャンマーから逃れたロヒンギャの人々約100万人がコックスバザールの難民キャンプにいる。
  source:
    - "https://ja.wikipedia.org/wiki/バングラデシュ"
    - "https://ja.wikipedia.org/wiki/バングラデシュの歴史"

