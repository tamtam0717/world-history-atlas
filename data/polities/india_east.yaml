    - {name: モード・ナラヤン, title: 王, from: 1665, to: 1680, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Koch_dynasty"}
    - {name: ダイルジェンドラ・ナラヤン, title: 王, from: 1765, to: 1783, note: 1770–1774年はブータンに捕らえられて、弟ラジェンドラ・ナラヤン、ダレンドラ・ナラヤンが王位にあった（要確認）, source: "https://en.wikipedia.org/wiki/Koch_dynasty"}
    - {name: ハレンドラ・ナラヤン, title: 王, from: 1783, to: 1839, source: "https://en.wikipedia.org/wiki/Koch_dynasty"}
    - {name: ヌリペンドラ・ナラヤン, title: マハーラージャ, from: 1863, to: 1911, note: ブラフモ・サマージの指導者ケーシャブ・チャンドラ・セーンの娘と結婚し、近代化を進めた, source: "https://en.wikipedia.org/wiki/Nripendra_Narayan"}
    - {name: ジャガッディペンドラ・ナラヤン, title: マハーラージャ, from: 1922, to: 1949, note: 1949年にインドと合併協定を結んだ, source: "https://en.wikipedia.org/wiki/Jagaddipendra_Narayan"}
  periods:
    - from: 1648
      to: 1772
      text: 16世紀に北ベンガル・アッサム西部を広く治めたコーチ王国の西の分家。ムガル帝国に南部（ランプル方面）を奪われ（1687）、18世紀にはブータンの影響を強く受けた。
    - from: 1773
      to: 1949
      text: 1772年にブータン軍に王を連れ去られると、王家はイギリス東インド会社に助けを求め、1773年の条約で会社に貢納する藩王国となった。1949年にインドに合併し、1950年に西ベンガル州の一部になった。
  note: 1773–1946年はイギリス、1947–1948年はインドの藩王国として、宗主国の色を薄く（間接統治）＋副ラベルで描く。インド・バングラデシュの国境には、コーチ・ビハール王国の領地の名残の飛び地が多数あった（2015年に交換して解消）。
  source:
    - "https://ja.wikipedia.org/wiki/コーチ・ビハール"
    - "https://en.wikipedia.org/wiki/Cooch_Behar_State"

