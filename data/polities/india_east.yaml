  name: カチャーリー王国（ディマサ）
  short: カチャーリー
  color: "#b2c99e"
  kind: 王国
  rulers:
    - {name: タームラッドヴァジ・ナラヤン, title: 王, from: 1706, to: 1708, note: 1706年にアホームのルドラ・シンハに攻められた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Dimasa_Kingdom"}
    - {name: ゴービンダ・チャンドラ, title: 王, from: 1813, to: 1830, note: ビルマの侵入（1819–1824）で追われ、イギリスに戻された。1830年に殺され、跡継ぎがなく1832年にイギリスが併合した, source: "https://en.wikipedia.org/wiki/Govinda_Chandra_(Dimasa_king)"}
  periods:
    - from: 1648
      to: 1831
      text: ディマサ人の王国。アホームに追われてディマプルから山地のマイボンへ移り、17世紀末から南のバラク川の平野（カチャール）のカスプルに都を移した。ヒンドゥー教を受け入れた。
  note: 北カチャール山地（ディマ・ハサオ）は、1832年の併合の後もトゥララームが治め、1854年にイギリス領になった。
  source:
    - "https://en.wikipedia.org/wiki/Dimasa_Kingdom"

- id: jaintia
  name: ジャインティア王国
  short: ジャインティア
  color: "#a9c8de"
  kind: 王国
  rulers:
    - {name: ラジェンドラ・シンハ, title: 王, from: 1832, to: 1835, note: 最後の王。1835年にイギリスに平野部の領地を取り上げられ、王国は終わった, source: "https://en.wikipedia.org/wiki/Jaintia_Kingdom"}
  periods:
    - from: 1648
      to: 1834
      text: ジャインティア丘陵（パナール人）とシレットの北の平野を治めた王国。1835年にイギリスに併合された。
  source:
    - "https://en.wikipedia.org/wiki/Jaintia_Kingdom"

- id: khasi
  name: カシ諸国
  short: カシ諸国
  color: "#cbb69c"
  kind: 首長国（シエム）の集まり
  periods:
    - from: 1648
      to: 1832
      text: カシ丘陵には、シエム（首長）が治める20あまりの小国が並んでいた。1829–1833年のイギリスとの戦い（アングロ・カシ戦争）の後、条約でイギリスの保護下に入った。
  note: 1833–1949年はイギリス・インドの保護下の「カシ諸国」として、宗主国の色を薄く（間接統治）＋副ラベルで描く。シロンは1874年からアッサム州の州都。
  source:
    - "https://en.wikipedia.org/wiki/Khasi_people"
    - "https://en.wikipedia.org/wiki/Khasi_States"

- id: tripura
  name: トリプラ王国
  short: トリプラ
  color: "#e8b8a6"
  kind: 王国（マーニキヤ朝）
  rulers:
    - {name: カリヤン・マーニキヤ, title: 王, from: 1626, to: 1660, source: "https://en.wikipedia.org/wiki/Kalyan_Manikya"}
    - {name: ゴーヴィンダ・マーニキヤ, title: 王, from: 1660, to: 1676, note: 1661–1667年は弟チャトラ・マーニキヤ（ムガルの後ろ盾）が王位を奪った, source: "https://en.wikipedia.org/wiki/Govinda_Manikya"}
    - {name: ラトナ・マーニキヤ2世, title: 王, from: 1685, to: 1712, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Ratna_Manikya_II"}
    - {name: ビール・チャンドラ・マーニキヤ, title: マハーラージャ, from: 1862, to: 1896, note: タゴールと親しく、ベンガル文化を取り入れた, source: "https://en.wikipedia.org/wiki/Bir_Chandra_Manikya"}
    - {name: ラーダー・キショール・マーニキヤ, title: マハーラージャ, from: 1896, to: 1909, source: "https://en.wikipedia.org/wiki/Radha_Kishore_Manikya"}
    - {name: ビレンドラ・キショール・マーニキヤ, title: マハーラージャ, from: 1909, to: 1923, source: "https://en.wikipedia.org/wiki/Birendra_Kishore_Manikya"}
    - {name: ビール・ビクラム・キショール・マーニキヤ, title: マハーラージャ, from: 1923, to: 1947, source: "https://en.wikipedia.org/wiki/Bir_Bikram_Kishore_Manikya"}
    - {name: キリート・ビクラム・キショール・マーニキヤ, title: マハーラージャ, from: 1947, to: 1949, note: 幼王で、母カンチャン・プラバー・デーヴィーが摂政としてインドとの合併協定を結んだ, source: "https://en.wikipedia.org/wiki/Kirit_Bikram_Kishore_Manikya"}
  periods:
    - from: 1648
      to: 1870
      text: トリプラ人のマーニキヤ朝の王国。西の平野（コミッラ方面）を1733年にベンガル太守に奪われ、平野の所領（チャクラ・ロシャナバード）は1765年以後イギリス東インド会社に地代を払う領地となった。
    - from: 1871
      to: 1949
      text: 1871年にイギリスの政務官が置かれ、藩王国となった。王家はベンガル文化を好み、詩人タゴールと交流した。1949年10月にインドに合併した。
  note: 1871–1946年はイギリス、1947–1948年はインドの藩王国として、宗主国の色を薄く（間接統治）＋副ラベルで描く。イギリスの保護下に入った年ははっきりしない（1761年の平野部の割譲以後、徐々に）。
  source:
    - "https://ja.wikipedia.org/wiki/トリプラ王国"
    - "https://en.wikipedia.org/wiki/Tripura_(princely_state)"

- id: manipur
  name: マニプル王国
  short: マニプル
  color: "#9dc4e6"
  kind: 王国（ニントゥジャ朝）
  rulers:
    - {name: カゲンバ, title: 王, from: 1597, to: 1652, source: "https://en.wikipedia.org/wiki/Khagemba"}
    - {name: クンジャオバ, title: 王, from: 1652, to: 1666, source: "https://en.wikipedia.org/wiki/Khunjaoba"}
    - {name: パイコンバ, title: 王, from: 1666, to: 1697, source: "https://en.wikipedia.org/wiki/Paikhomba"}
    - {name: チャライロンバ, title: 王, from: 1697, to: 1709, source: "https://en.wikipedia.org/wiki/Charairongba"}
    - {name: パムヘイバ（ガリブ・ニワズ）, title: 王, from: 1709, to: 1748, note: ヴィシュヌ派のヒンドゥー教を国教とし、ビルマにたびたび攻め込んだ, source: "https://en.wikipedia.org/wiki/Pamheiba"}
    - {name: バーギャチャンドラ（チンタン・コンバ）, title: 王, from: 1763, to: 1798, note: ビルマの侵入（1758・1764）で一時アッサムに逃れた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Ching-Thang_Khomba"}
    - {name: ガンビール・シンハ, title: 王, from: 1825, to: 1834, note: イギリスの助けでビルマ軍を追い、王国を取り戻した, source: "https://en.wikipedia.org/wiki/Gambhir_Singh"}
    - {name: チャンドラキールティ, title: 王, from: 1850, to: 1886, source: "https://en.wikipedia.org/wiki/Chandrakirti_Singh"}
    - {name: クラチャンドラ, title: 王, from: 1890, to: 1891, note: 1891年のイギリスとの戦争に敗れて流された。実権は弟の将軍ティケンドラジット（処刑）, source: "https://en.wikipedia.org/wiki/Kulachandra_Singh"}
    - {name: チュラチャンド・シンハ, title: マハーラージャ, from: 1891, to: 1941, source: "https://en.wikipedia.org/wiki/Churachand_Singh"}
    - {name: ボーダチャンドラ, title: マハーラージャ, from: 1941, to: 1949, note: 1949年9月にインドとの合併協定に署名した（10月に合併）, source: "https://en.wikipedia.org/wiki/Bodhchandra_Singh"}
  periods:
    - from: 1648
      to: 1818
      text: インパール盆地のメイテイ人の王国。18世紀にヴィシュヌ派のヒンドゥー教を受け入れ、ビルマとの戦いを繰り返した。周りの山地のナガ人・クキ人の村々には、ゆるやかな支配しか及ばなかった。
    - from: 1819
      to: 1825
      text: ビルマ（コンバウン朝）に占領され、多くの住民が連れ去られたり逃げたりした（「7年の荒廃」）。
    - from: 1826
      to: 1949
      text: ガンビール・シンハがイギリスの助けで王国を取り戻し、ヤンダボ条約（1826）で独立が認められた。1891年の戦争（アングロ・マニプル戦争）の後はイギリスの藩王国となった。第二次世界大戦では1944年に日本軍のインパール作戦の戦場になった。1949年にインドに合併した。
  note: 山地は不確実（斜線）、1891–1946年はイギリス、1947–1948年はインドの藩王国として、宗主国の色を薄く（間接統治）＋副ラベルで描く。
  source:
    - "https://ja.wikipedia.org/wiki/マニプル王国"
    - "https://en.wikipedia.org/wiki/Kingdom_of_Manipur"

# ================================================================ 中部インド東部・オリッサ
- id: ratanpur
  name: ラタンプル王国（ハイハヤ朝）
  short: ラタンプル
  color: "#d7c8e8"
  kind: 王国
  rulers:
    - {name: ラグナート・シンハ, title: 王, from: 1732, to: 1745, note: 最後の王。1741年にナーグプルのマラーター（ボーンスレー家）の将軍バースカル・パントに降った, source: "https://en.wikipedia.org/wiki/Kalachuris_of_Ratnapura"}
  periods:
    - from: 1648
      to: 1740
      text: チャッティースガル（「36の城」）の平野を治めたハイハヤ（カラチュリ）朝の王国。北のラタンプルと南のライプルの2つの家に分かれ、ムガル帝国に貢納した。1741年からマラーターの支配下に入った。
  source:
    - "https://en.wikipedia.org/wiki/Kalachuris_of_Ratnapura"
    - "https://en.wikipedia.org/wiki/Chhattisgarh#History"

- id: bastar
  name: バスタール王国
  short: バスタール
  color: "#bfe0b4"
  kind: 王国（カーカティーヤ朝の子孫を名のる王家）
  periods:
    - from: 1648
      to: 1817
      text: ゴンド人などの森の民が多く住むチャッティースガル南部の王国。王家はワランガルのカーカティーヤ朝の子孫を名のった。1778年ごろからナーグプルのマラーターに貢納した。
  note: 1818–1946年はイギリスの藩王国として、宗主国の色を薄く（間接統治）＋副ラベルで描く。北のカーンケール藩王国も含めた。
  source:
    - "https://en.wikipedia.org/wiki/Bastar_State"

- id: chota_nagpur
  name: チョーター・ナーグプルの諸首長
  short: チョーター・ナーグプル
  color: "#d9d1ab"
  kind: 首長・小王国の集まり
  periods:
    - from: 1648
      to: 1771
      text: 森におおわれたチョーター・ナーグプル高原（ジャールカンド）とその西の山地では、ナーグヴァンシー家（ランチー）、チェーロ家（パラームー）、ラームガル家、スルグジャ家などの首長が、ムンダ人・オラオン人・ホー人などの森の民を治めた。ムガル帝国は1660年にパラームーを攻めるなどしたが、支配は名目的で、首長は貢納を約束するだけだった。
  note: 多くの首長領を1つの政体として描く。シングブームのホー人の地（コールハン）は1837年までどの首長にも従わなかった。
  source:
    - "https://en.wikipedia.org/wiki/Chota_Nagpur_Plateau"
    - "https://en.wikipedia.org/wiki/Nagvanshis_of_Chotanagpur"

- id: garhjat
  name: オリッサ山地の諸王国（ガルジャート）
  short: ガルジャート諸国
  color: "#c9dfc6"
  kind: 小王国の集まり
  periods:
    - from: 1648
      to: 1802
      text: オリッサの海岸平野の西の山地には、「ガルジャート（城の国々）」と呼ばれる小王国（マユールバンジ・ケーンジャル・ダーンケーナール・サンバルプル・パトナ・カーラーハンディなど）や、南のジェーポール王国が並んでいた。ムガル帝国やマラーターには貢納するだけで、内政は自立していた。
  note: 多くの小王国を1つの政体として描く。1803年以後（西部は1818年以後）はイギリスの藩王国（間接統治）。
  source:
    - "https://en.wikipedia.org/wiki/Garhjat_States"
    - "https://en.wikipedia.org/wiki/Eastern_States_Agency"
