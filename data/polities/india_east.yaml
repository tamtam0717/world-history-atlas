    - {name: ラジェンドラ・ビクラム・シャハ, title: ネパール王, from: 1816, to: 1847, source: "https://en.wikipedia.org/wiki/Rajendra_Bikram_Shah"}
    - {name: スレンドラ・ビクラム・シャハ, title: ネパール王, from: 1847, to: 1881, note: 実権はラナ家の首相ジャンガ・バハドゥル（1846–1877）, source: "https://en.wikipedia.org/wiki/Surendra_Bikram_Shah"}
    - {name: プリトヴィ・ビール・ビクラム・シャハ, title: ネパール王, from: 1881, to: 1911, note: 実権はラナ家の首相, source: "https://en.wikipedia.org/wiki/Prithvi_Bir_Bikram_Shah"}
    - {name: トリブバン・ビール・ビクラム・シャハ, title: ネパール王, from: 1911, to: 1955, note: 1950年にインドへ逃れ、1951年に王政復古（ラナ家の専制の終わり）, source: "https://ja.wikipedia.org/wiki/トリブバン"}
