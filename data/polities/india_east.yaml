    - {name: ルドラ・シャハ, title: ゴルカ王, from: 1661, to: 1673, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Gorkha_Kingdom"}
    - {name: プリトヴィパティ・シャハ, title: ゴルカ王, from: 1673, to: 1716, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Prithvipati_Shah"}
    - {name: ナラ・ブーパール・シャハ, title: ゴルカ王, from: 1716, to: 1743, source: "https://en.wikipedia.org/wiki/Nara_Bhupal_Shah"}
    - {name: プリトヴィ・ナラヤン・シャハ, title: ゴルカ王→ネパール王, from: 1743, to: 1775, note: カトマンズ盆地を征服し（1768–69）、ネパールを統一した, source: "https://ja.wikipedia.org/wiki/プリトビ・ナラヤン・シャハ"}
    - {name: プラタープ・シンハ・シャハ, title: ネパール王, from: 1775, to: 1777, source: "https://en.wikipedia.org/wiki/Pratap_Singh_Shah"}
    - {name: ラナ・バハドゥル・シャハ, title: ネパール王, from: 1777, to: 1799, note: 幼い時期は母・叔父バハドゥル・シャハが摂政。1799年に退位し、1806年に殺された, source: "https://en.wikipedia.org/wiki/Rana_Bahadur_Shah"}
