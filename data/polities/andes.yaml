      text: 1821年にサン・マルティンがリマで独立を宣言したが、山地には副王軍が残った。ボリバルとスクレが1824年のフニン・アヤクーチョの戦いで副王軍を破り、1826年にカヤオの要塞も降った。
    - from: 1827
      to: 1844
      text: 独立戦争の軍人（カウディーリョ）が争い、政権が次々に替わった。ボリビアのサンタ・クルスがペルー・ボリビア連合（1836–39）を作ったが、チリとペルーの亡命派に倒された。
    - from: 1845
      to: 1878
      text: 海鳥の糞の肥料（グアノ）の輸出ブームで国家の収入が増え、カスティージャは奴隷制と先住民の貢納を廃止した（1854）。中国人の契約労働者（クーリー）が導入された。鉄道建設の債務とグアノの枯渇で1870年代に財政が破綻した。
    - from: 1879
      to: 1895
      text: 硝石地帯をめぐる太平洋戦争（1879–84）でチリに敗れ、リマを占領された（1881–83）。アンコン条約でタラパカを失い、タクナ・アリカはチリの管理下に置かれた。
    - from: 1895
      to: 1930
      text: 輸出向けの砂糖・綿花・鉱山を握る少数の家が政治を動かした（「貴族共和政」）。1899年から日本人移民が来た。レギアの独裁（1919–30）でアメリカ資本が入り、1929年のリマ条約でタクナを取り戻した。
    - from: 1930
      to: 1967
      text: アヤ・デ・ラ・トーレの創ったアプラ党（APRA）は先住民の統合と反帝国主義を唱えたが、軍と寡頭制に抑えられた。1941年のエクアドルとの戦争に勝った。
    - from: 1968
      to: 1990
      text: ベラスコの軍事政権が農地改革と外国企業の国有化を進めた。1980年の民政復帰と同時に毛沢東主義のゲリラ「センデロ・ルミノソ」が武装闘争を始め、約7万人が死んだ（1980–2000）。ハイパーインフレが起こった。
    - from: 1990
      to: 2025
      text: 日系人のフジモリ大統領が経済を立て直し、ゲリラを抑えたが、1992年の自主クーデタと人権侵害で批判された（2000年に失脚）。鉱山の輸出で成長が続いた一方、2016年からは大統領の罷免・辞任が続く政治の混乱が起こった。
  source: "https://ja.wikipedia.org/wiki/ペルーの歴史"

