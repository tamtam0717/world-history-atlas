    - {name: ジャミル・マワド, title: 大統領, from: 1998, to: 2000, note: ペルーとの和平（1998）。金融危機の中、2000年1月の先住民と軍の反乱で追われた, source: "https://en.wikipedia.org/wiki/Jamil_Mahuad"}
    - {name: グスタボ・ノボア, title: 大統領, from: 2000, to: 2003, note: ドルを通貨とした（ドル化）, source: "https://en.wikipedia.org/wiki/Gustavo_Noboa"}
    - {name: ルシオ・グティエレス, title: 大統領, from: 2003, to: 2005, source: "https://en.wikipedia.org/wiki/Lucio_Gutiérrez"}
    - {name: アルフレド・パラシオ, title: 大統領, from: 2005, to: 2007, source: "https://en.wikipedia.org/wiki/Alfredo_Palacio"}
    - {name: ラファエル・コレア, title: 大統領, from: 2007, to: 2017, note: 「市民革命」。2008年憲法で自然の権利を定めた, source: "https://en.wikipedia.org/wiki/Rafael_Correa"}
    - {name: レニン・モレノ, title: 大統領, from: 2017, to: 2021, source: "https://en.wikipedia.org/wiki/Lenín_Moreno"}
    - {name: ギジェルモ・ラソ, title: 大統領, from: 2021, to: 2023, source: "https://en.wikipedia.org/wiki/Guillermo_Lasso"}
    - {name: ダニエル・ノボア, title: 大統領, from: 2023, to: 2025, note: 麻薬組織の暴力に対して「国内武力紛争」を宣言した（2024）, source: "https://en.wikipedia.org/wiki/Daniel_Noboa"}
  periods:
    - from: 1830
      to: 1859
      text: 1830年に大コロンビアから分離して独立。保守的な高地のキトと、カカオを輸出する港町グアヤキルの対立が政治の軸となった。初代大統領フローレスは1845年の三月革命で追われた。
    - from: 1860
      to: 1894
      text: ガルシア・モレノがカトリック教会を国の柱とする保守の独裁を敷き（1860–75）、教育と道路を整えたが、反対派を厳しく抑えた。
    - from: 1895
      to: 1924
      text: エロイ・アルファロの自由主義革命（1895）で政教分離・世俗教育・離婚の自由などが進み、キトとグアヤキルを結ぶ鉄道ができた（1908）。カカオの輸出ブームはグアヤキルの銀行家に富をもたらした。
    - from: 1925
      to: 1947
      text: カカオの衰退と世界恐慌で政治が混乱し、政権が次々に替わった。1941年のペルーとの戦争に敗れ、1942年のリオデジャネイロ議定書でアマゾン地方の広い主張を失った。
    - from: 1948
      to: 1979
      text: バナナの輸出ブームで経済が伸びた。ベラスコ・イバラのポピュリズムと軍事政権が交互に来た。1972年からアマゾン地方の石油の輸出が始まった。
    - from: 1979
      to: 2025
      text: 1979年に民政にもどった。先住民の運動が力をもち、政権を倒すこともあった（2000年）。1998年にペルーと国境を確定し、2000年には自国の通貨をやめてドルを使い始めた。2020年代は麻薬組織の暴力が深刻になった。
  source: "https://ja.wikipedia.org/wiki/エクアドルの歴史"

