    - {name: ニコラス・マドゥロ, title: 大統領, from: 2013, to: 2025, note: 2019年には国会議長グアイドが暫定大統領を名のり、多くの国が承認した（実効支配はマドゥロ）。2024年の選挙結果も国際的に争われた, source: "https://ja.wikipedia.org/wiki/ニコラス・マドゥロ"}
  periods:
    - from: 1811
      to: 1819
      text: 1811年7月5日に独立を宣言したが、第一共和国（1812）・第二共和国（1814）は王党派と平原の騎兵に倒された。ボリバルはジャマイカ・ハイチに逃れた後、オリノコ川流域のアンゴストゥーラを拠点に戦いを立て直した（第三共和国）。
    - from: 1830
      to: 1863
      text: 1830年に大コロンビアから分離。独立戦争の英雄パエスを中心とする保守派の寡頭制の後、モナガス兄弟の政権が続き、1854年に奴隷制を廃止した。連邦制をめぐる連邦戦争（1859–63）で多くの人が死んだ。
    - from: 1864
      to: 1908
      text: 地方の軍人（カウディーリョ）が争う時代。自由派のグスマン・ブランコの独裁（1870–87）でカラカスの近代化が進んだ。英領ギアナとの境界紛争（1895年のベネズエラ危機）、債務をめぐる欧州諸国の海上封鎖（1902–03）が起こった。
    - from: 1908
      to: 1935
      text: フアン・ビセンテ・ゴメスの独裁。1914年からマラカイボ湖で石油が開発され、1920年代末にベネズエラは世界最大級の石油輸出国となった。外国の石油会社が富を得て、農業は衰えた。
    - from: 1936
      to: 1958
      text: 民主化の動きと軍事政権が交互に来た。1945年のクーデタで民主行動党（ベタンクール）が改革を進めたが、1948年の軍のクーデタでペレス・ヒメネスの独裁となった。
    - from: 1958
      to: 1998
      text: 独裁の崩壊の後、民主行動党とキリスト教社会党（COPEI）が交互に政権を担った（プント・フィホ体制）。石油輸出国機構（OPEC）の創設を主導し（1960）、1976年に石油を国有化した。1980年代の石油価格の下落と債務危機で、1989年に暴動（カラカソ）が起こった。
    - from: 1999
      to: 2025
      text: チャベスが新憲法で「ボリバル共和国」とし、石油の富を貧困層に配る政策と反米外交を進めた。石油価格の下落とマドゥロ政権の下で、激しいインフレと物不足、政治的な弾圧が起こり、700万人以上が国外に出た。
  source: "https://ja.wikipedia.org/wiki/ベネズエラの歴史"

