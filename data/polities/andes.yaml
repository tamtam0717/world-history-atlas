    - {name: アルバロ・ウリベ, title: 大統領, from: 2002, to: 2010, source: "https://en.wikipedia.org/wiki/Álvaro_Uribe"}
    - {name: フアン・マヌエル・サントス, title: 大統領, from: 2010, to: 2018, note: 2016年にFARCと和平合意を結び、ノーベル平和賞, source: "https://ja.wikipedia.org/wiki/フアン・マヌエル・サントス"}
    - {name: イバン・ドゥケ, title: 大統領, from: 2018, to: 2022, source: "https://en.wikipedia.org/wiki/Iván_Duque"}
    - {name: グスタボ・ペトロ, title: 大統領, from: 2022, to: 2025, note: 初の左派の大統領, source: "https://en.wikipedia.org/wiki/Gustavo_Petro"}
  periods:
    - from: 1831
      to: 1862
      text: 大コロンビアの解体の後、ヌエバ・グラナダ共和国となる。中央集権とカトリック教会を重んじる保守党と、連邦制・政教分離・自由貿易を唱える自由党の二大政党ができ、内戦をくり返した。1851年に奴隷制を廃止した。
    - from: 1863
      to: 1885
      text: 自由党のリオネグロ憲法（1863）で、強い自治権をもつ9つの州からなるコロンビア合衆国となる。教会の土地を没収し、タバコ・コーヒーなどの輸出が伸びた。
    - from: 1886
      to: 1902
      text: ヌニェスの「再生」で中央集権の共和国にもどり（1886年憲法）、教会と協約を結んだ。自由党の反乱から千日戦争（1899–1902）が起こり、約10万人が死んだ。
    - from: 1903
      to: 1945
      text: 1903年、アメリカ合衆国の後押しでパナマが分離した（1921年に賠償で決着）。コーヒーの輸出で経済が伸び、1930年からは自由党が政権を握った。ペルーとはアマゾン地方の境を争った（レティシア紛争、1932–33）。
    - from: 1946
      to: 1957
      text: 1948年の自由党の指導者ガイタンの暗殺とボゴタの暴動（ボゴタソ）から、保守党と自由党の内戦「ラ・ビオレンシア」が広がり、約20万人が死んだ。1953年にロハス・ピニージャが軍事政権を作った。
    - from: 1958
      to: 1990
      text: 保守党と自由党が4年ごとに政権を交互に担う「国民戦線」（1958–74）で内戦を収めたが、排除された人々からFARC・ELNなどの左翼ゲリラが生まれた。1980年代にはコカインの密輸組織（メデジン・カルテルなど）が力をもった。
    - from: 1991
      to: 2025
      text: 1991年の新憲法で先住民などの権利を定めた。ゲリラ・右派の民兵（パラミリタール）・麻薬組織の争いで多くの人が国内避難民となった。アメリカ合衆国の支援（プラン・コロンビア）で軍が攻勢をとり、2016年にFARCと和平合意を結んだ。
  source: "https://ja.wikipedia.org/wiki/コロンビアの歴史"

