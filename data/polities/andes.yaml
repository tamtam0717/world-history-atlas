    - {name: ダビド・トロ, title: 大統領（軍事政権）, from: 1936, to: 1937, note: 「軍事社会主義」。スタンダード石油を国有化, source: "https://en.wikipedia.org/wiki/David_Toro"}
    - {name: ヘルマン・ブッシュ, title: 大統領, from: 1937, to: 1939, source: "https://en.wikipedia.org/wiki/Germán_Busch"}
