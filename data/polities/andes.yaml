    - {name: アルフレド・オバンド, title: 大統領（軍事政権）, from: 1969, to: 1970, source: "https://en.wikipedia.org/wiki/Alfredo_Ovando_Candía"}
    - {name: フアン・ホセ・トレス, title: 大統領（軍事政権）, from: 1970, to: 1971, note: 左派の軍人, source: "https://en.wikipedia.org/wiki/Juan_José_Torres"}
