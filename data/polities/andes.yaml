# A4 南米北部・アンデス（COL・VEN・ECU・PER・BOL・GUY・SUR・GUF）の政体（1648–2025）
# 他の担当が参照しうる ID：gran_colombia・colombia・venezuela・ecuador・peru・bolivia・peru_bolivia・guyana・suriname
#   （独立期の短命な政体：new_granada_united・cundinamarca・guayaquil）
# スペイン（spain）・オランダ（netherlands）・イギリス（britain）・フランス（france）・ポルトガル（portugal）は既存の政体を使う。
# チリ（chile）・リオ・デ・ラ・プラタ連合州（united_provinces_rio_plata）は A5、パナマ（panama）は A3 が定義する。
# 元首は実権者（大統領・最高指導者など）。在職が1年に満たない臨時の大統領や、内戦中の対立政府の多くは省略し、note に書いた。

