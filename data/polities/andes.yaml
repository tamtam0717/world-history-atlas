    - {name: エルナン・シレス・スアソ, title: 大統領, from: 1982, to: 1985, note: 民政への復帰。ハイパーインフレ, source: "https://en.wikipedia.org/wiki/Hernán_Siles_Zuazo"}
    - {name: ビクトル・パス・エステンソロ, title: 大統領, from: 1985, to: 1989, note: 新自由主義の経済政策で物価を抑えた, source: "https://en.wikipedia.org/wiki/Víctor_Paz_Estenssoro"}
    - {name: ハイメ・パス・サモラ, title: 大統領, from: 1989, to: 1993, source: "https://en.wikipedia.org/wiki/Jaime_Paz_Zamora"}
    - {name: ゴンサロ・サンチェス・デ・ロサダ, title: 大統領, from: 1993, to: 1997, source: "https://en.wikipedia.org/wiki/Gonzalo_Sánchez_de_Lozada"}
    - {name: ウゴ・バンセル, title: 大統領, from: 1997, to: 2001, note: 選挙で選ばれた。2000年にコチャバンバの「水戦争」, source: "https://en.wikipedia.org/wiki/Hugo_Banzer"}
    - {name: ホルヘ・キロガ, title: 大統領, from: 2001, to: 2002, source: "https://en.wikipedia.org/wiki/Jorge_Quiroga"}
    - {name: ゴンサロ・サンチェス・デ・ロサダ, title: 大統領, from: 2002, to: 2003, note: 天然ガスの輸出計画への抗議（ガス戦争）で辞任, source: "https://en.wikipedia.org/wiki/Gonzalo_Sánchez_de_Lozada"}
    - {name: カルロス・メサ, title: 大統領, from: 2003, to: 2005, note: 2005–06年はエドゥアルド・ロドリゲスが暫定大統領, source: "https://en.wikipedia.org/wiki/Carlos_Mesa"}
    - {name: エボ・モラレス, title: 大統領, from: 2006, to: 2019, note: 先住民（アイマラ）出身の初の大統領。天然ガスを国有化した。2019年の選挙の不正疑惑で辞任, source: "https://ja.wikipedia.org/wiki/エボ・モラレス"}
    - {name: ジャニネ・アニェス, title: 大統領（暫定）, from: 2019, to: 2020, source: "https://en.wikipedia.org/wiki/Jeanine_Áñez"}
    - {name: ルイス・アルセ, title: 大統領, from: 2020, to: 2025, source: "https://en.wikipedia.org/wiki/Luis_Arce"}
    - {name: ロドリゴ・パス, title: 大統領, from: 2025, to: 2025, note: 2025年11月に就任。約20年続いた社会主義運動（MAS）の政権が終わった, source: "https://en.wikipedia.org/wiki/Rodrigo_Paz_Pereira"}
  periods:
    - from: 1825
      to: 1839
      text: 1825年に独立し、解放者ボリバルにちなんで国名をつけた。初代大統領スクレの後、サンタ・クルスが国を整え、ペルー・ボリビア連合（1836–39）を作ったが崩れた。
    - from: 1840
      to: 1879
      text: 軍人の政権が次々に替わった（カウディーリョの時代）。ポトシの銀は衰え、メルガレホ（1864–71）は先住民の共同体の土地を奪った。太平洋岸のアタカマ（リトラル）では外国資本が硝石・銀を掘った。
    - from: 1879
      to: 1935
      text: 太平洋戦争（1879–84）でチリに敗れ、海への出口（リトラル）を失った（1904年の条約で確定）。銀と、のちに錫（スズ）の鉱業が経済を支え、アクレ戦争（1899–1903）でアクレをブラジルに譲った。チャコ戦争（1932–35）でパラグアイに敗れ、チャコの大半を失った。
    - from: 1936
      to: 1951
      text: チャコ戦争の敗北で旧来の寡頭制が揺らぎ、改革派の軍人（「軍事社会主義」）や民族革命運動（MNR）が力をもった。錫の大鉱山主（パティーニョら）が「錫の男爵」として政治を動かした。
    - from: 1952
      to: 1981
      text: 1952年のボリビア革命で MNR が政権を握り、錫鉱山の国有化・農地改革・先住民を含む普通選挙を行った。1964年からは軍事政権が続き、1967年にはキューバ革命の指導者ゲバラがここでゲリラ戦を試みて殺された。
    - from: 1982
      to: 2005
      text: 1982年に民政に戻った。ハイパーインフレを新自由主義の政策で抑えたが、水道（2000）・天然ガス（2003）の民営化・輸出に先住民と貧困層が強く抗議した。コカの栽培をめぐる対立も続いた。
    - from: 2006
      to: 2025
      text: 先住民出身のエボ・モラレスが大統領となり、天然ガスを国有化し、2009年の新憲法で「多民族国」とした。2019年の選挙をめぐる混乱でモラレスが辞任し、2020年にアルセが当選した。
  source: "https://ja.wikipedia.org/wiki/ボリビアの歴史"

# ===== ギアナ =====
- id: guyana
  name: ガイアナ
  names:
    - {from: 1970, name: ガイアナ協同共和国, kind: 共和国}
  short: ガイアナ
  color: "#93c8b2"
  kind: 立憲君主制（イギリス連邦）
  home_iso: [GUY]
  rulers:
    - {name: フォーブス・バーナム, title: 首相（1980年から大統領）, from: 1966, to: 1985, note: アフリカ系住民を基盤とする人民国民会議（PNC）。1970年に共和国とし、「協同社会主義」を唱えた, source: "https://en.wikipedia.org/wiki/Forbes_Burnham"}
    - {name: デズモンド・ホイト, title: 大統領, from: 1985, to: 1992, source: "https://en.wikipedia.org/wiki/Desmond_Hoyte"}
    - {name: チェディ・ジェーガン, title: 大統領, from: 1992, to: 1997, note: インド系住民を基盤とする人民進歩党（PPP）。独立前の1953年・1961–64年にも首相を務めた, source: "https://en.wikipedia.org/wiki/Cheddi_Jagan"}
    - {name: ジャネット・ジェーガン, title: 大統領, from: 1997, to: 1999, note: 1997年はサミュエル・ハインズが一時務めた, source: "https://en.wikipedia.org/wiki/Janet_Jagan"}
    - {name: バラット・ジャグデオ, title: 大統領, from: 1999, to: 2011, source: "https://en.wikipedia.org/wiki/Bharrat_Jagdeo"}
    - {name: ドナルド・ラモター, title: 大統領, from: 2011, to: 2015, source: "https://en.wikipedia.org/wiki/Donald_Ramotar"}
    - {name: デービッド・グレンジャー, title: 大統領, from: 2015, to: 2020, source: "https://en.wikipedia.org/wiki/David_A._Granger"}
    - {name: イルファーン・アリ, title: 大統領, from: 2020, to: 2025, note: 海底油田の生産が始まり、経済が急成長した, source: "https://en.wikipedia.org/wiki/Irfaan_Ali"}
  periods:
    - from: 1966
      to: 1991
      text: 1966年にイギリスから独立し、1970年に協同共和国となった。アフリカ系のバーナムの PNC が長く政権を握り、インド系の PPP（ジェーガン）と対立した。ベネズエラはエセキボ川の西の領有を主張し続けた。
    - from: 1992
      to: 2025
      text: 1992年の自由な選挙で PPP が政権をとった。2015年に沖合で大油田が見つかり、2019年からの石油生産で世界有数の高い成長率となった。ベネズエラとの係争は国際司法裁判所で審理されている。
  source: "https://ja.wikipedia.org/wiki/ガイアナ"

- id: suriname
  name: スリナム共和国
  short: スリナム
  color: "#cdb98c"
  kind: 共和国
  home_iso: [SUR]
  rulers:
    - {name: ヘンク・アロン, title: 首相, from: 1975, to: 1980, note: 独立時の首相。大統領はヨハン・フェリエ, source: "https://en.wikipedia.org/wiki/Henck_Arron"}
    - {name: デシ・ボーターセ, title: 軍の指導者（実権者）, from: 1980, to: 1987, note: 1980年の軍曹たちのクーデタ。1982年に反対派15人を殺害した「十二月殺人」, source: "https://en.wikipedia.org/wiki/Dési_Bouterse"}
    - {name: ラムセワク・シャンカル, title: 大統領, from: 1988, to: 1990, note: 1990年12月の「電話のクーデタ」で追われた（1991年はクラーフが暫定大統領）, source: "https://en.wikipedia.org/wiki/Ramsewak_Shankar"}
    - {name: ロナルド・ヴェネティアーン, title: 大統領, from: 1991, to: 1996, source: "https://en.wikipedia.org/wiki/Ronald_Venetiaan"}
    - {name: ジュール・ワイデンボス, title: 大統領, from: 1996, to: 2000, source: "https://en.wikipedia.org/wiki/Jules_Wijdenbosch"}
    - {name: ロナルド・ヴェネティアーン, title: 大統領, from: 2000, to: 2010, source: "https://en.wikipedia.org/wiki/Ronald_Venetiaan"}
    - {name: デシ・ボーターセ, title: 大統領, from: 2010, to: 2020, note: 選挙で選ばれた, source: "https://en.wikipedia.org/wiki/Dési_Bouterse"}
    - {name: チャン・サントキ, title: 大統領, from: 2020, to: 2025, source: "https://en.wikipedia.org/wiki/Chan_Santokhi"}
    - {name: ジェニファー・ヘールリングス＝シモンズ, title: 大統領, from: 2025, to: 2025, note: 初の女性大統領, source: "https://en.wikipedia.org/wiki/Jennifer_Geerlings-Simons"}
  periods:
    - from: 1975
      to: 1979
      text: 1975年にオランダから独立。独立前後に人口の約3分の1がオランダへ移住した。インド系・クレオール（アフリカ系）・ジャワ系・マルーンなど多民族の国。
    - from: 1980
      to: 1991
      text: 1980年のクーデタでボーターセが実権を握り、オランダの援助が止まった。1986–92年にはマルーンのジャングル・コマンドとの内戦が起こった。
    - from: 1991
      to: 2025
      text: 1991年に民政に戻った。ボーターセは2010年に選挙で大統領となった（2019年に十二月殺人で有罪）。沖合の油田の開発が始まった。
  source: "https://ja.wikipedia.org/wiki/スリナム"
