    - {name: ビクトル・パス・エステンソロ, title: 大統領, from: 1952, to: 1956, note: ボリビア革命（1952）。鉱山の国有化・農地改革・普通選挙, source: "https://en.wikipedia.org/wiki/Víctor_Paz_Estenssoro"}
