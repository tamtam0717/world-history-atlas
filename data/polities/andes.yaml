    - {name: グアルベルト・ビジャロエル, title: 大統領, from: 1943, to: 1946, note: 民族革命運動（MNR）と組んだ軍人。1946年に群衆に殺された, source: "https://en.wikipedia.org/wiki/Gualberto_Villarroel"}
