    - {name: 尚元王, title: 琉球国王, from: 1556, to: 1572, note: 1571年に奄美大島に出兵, source: "https://ja.wikipedia.org/wiki/尚元王"}
    - {name: 尚永王, title: 琉球国王, from: 1573, to: 1588, source: "https://ja.wikipedia.org/wiki/尚永王"}
    - {name: 尚寧王, title: 琉球国王, from: 1589, to: 1620, note: 1609年の薩摩藩の侵攻で捕らえられ、駿府・江戸に連れて行かれた（1611年に帰国）, source: "https://ja.wikipedia.org/wiki/尚寧王"}
