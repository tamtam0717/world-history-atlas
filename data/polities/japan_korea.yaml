    - {name: 足利義政, title: 室町幕府8代将軍, from: 1449, to: 1473, note: 将軍の後継ぎ争いが応仁の乱の一因となった。退いた後に東山に銀閣（慈照寺）を建てた（東山文化）, source: "https://ja.wikipedia.org/wiki/足利義政"}
    - {name: 足利義尚, title: 室町幕府9代将軍, from: 1473, to: 1489, note: 近江の六角氏を攻める陣中で死去, source: "https://ja.wikipedia.org/wiki/足利義尚"}
    - {name: 足利義材（義稙）, title: 室町幕府10代将軍, from: 1490, to: 1493, note: 1493年の明応の政変で細川政元に廃された。1508–21年に再び将軍, source: "https://ja.wikipedia.org/wiki/足利義稙"}
    - {name: 足利義澄, title: 室町幕府11代将軍, from: 1494, to: 1508, note: 管領細川政元が実権を握った, source: "https://ja.wikipedia.org/wiki/足利義澄"}
    - {name: 足利義稙, title: 室町幕府10代将軍（再任）, from: 1508, to: 1521, note: 大内義興に擁されて将軍に復帰, source: "https://ja.wikipedia.org/wiki/足利義稙"}
    - {name: 足利義晴, title: 室町幕府12代将軍, from: 1521, to: 1546, note: 細川氏・三好氏の争いで京都を何度も追われた, source: "https://ja.wikipedia.org/wiki/足利義晴"}
    - {name: 足利義輝, title: 室町幕府13代将軍, from: 1546, to: 1565, note: 1565年に三好三人衆・松永久通に殺された（永禄の変）, source: "https://ja.wikipedia.org/wiki/足利義輝"}
    - {name: 足利義栄, title: 室町幕府14代将軍, from: 1568, to: 1568, note: 三好三人衆に擁立されたが、京都に入らないまま死去。義輝が殺された1565年から義栄の将軍就任（1568年2月）までは将軍がいない（地図では1566–67年の君主が空になる）, source: "https://ja.wikipedia.org/wiki/足利義栄"}
    - {name: 足利義昭, title: 室町幕府15代将軍, from: 1568, to: 1573, note: 織田信長に擁されて将軍となったが、対立して1573年に京都から追放され、室町幕府は滅んだ（将軍職は1588年に辞した）, source: "https://ja.wikipedia.org/wiki/足利義昭"}
    - {name: 織田信長, title: 天下人（1577年から右大臣）, from: 1573, to: 1582, note: 1568年に足利義昭を奉じて京都に入った。楽市・楽座。1582年の本能寺の変で明智光秀に討たれた, source: "https://ja.wikipedia.org/wiki/織田信長"}
    - {name: 豊臣秀吉, title: 天下人（1585年から関白、1591年から太閤）, from: 1582, to: 1598, note: 1582年の山崎の戦いで明智光秀を破って信長の後継者となり、1590年に全国を統一した。太閤検地・刀狩。朝鮮に出兵した（文禄・慶長の役）, source: "https://ja.wikipedia.org/wiki/豊臣秀吉"}
    - {name: 豊臣秀頼, title: 豊臣家の当主（五大老・五奉行が補佐）, from: 1598, to: 1599, note: 秀吉の死のとき6歳。1600年の関ヶ原の戦いの後は摂津・河内・和泉の一大名となり、1615年の大坂夏の陣で滅んだ, source: "https://ja.wikipedia.org/wiki/豊臣秀頼"}
    - {name: 徳川家康, title: 江戸幕府初代将軍（1603–05）, from: 1600, to: 1605, note: 1600年の関ヶ原の戦いで石田三成らの西軍を破って実権を握った。将軍職を秀忠に譲った後も大御所として1616年まで実権, source: "https://ja.wikipedia.org/wiki/徳川家康"}
    - {name: 徳川秀忠, title: 江戸幕府2代将軍, from: 1605, to: 1623, note: 武家諸法度・禁中並公家諸法度（1615）。退いた後も大御所として1632年まで実権, source: "https://ja.wikipedia.org/wiki/徳川秀忠"}
    - {name: 徳川家光, title: 江戸幕府3代将軍, from: 1623, to: 1651, note: 参勤交代の制度化・「鎖国」の完成, source: "https://ja.wikipedia.org/wiki/徳川家光"}
    - {name: 徳川家綱, title: 江戸幕府4代将軍, from: 1651, to: 1680, note: 武断政治から文治政治へ, source: "https://ja.wikipedia.org/wiki/徳川家綱"}
    - {name: 徳川綱吉, title: 江戸幕府5代将軍, from: 1680, to: 1709, note: 元禄時代。生類憐みの令, source: "https://ja.wikipedia.org/wiki/徳川綱吉"}
    - {name: 徳川家宣, title: 江戸幕府6代将軍, from: 1709, to: 1712, note: 新井白石の正徳の治, source: "https://ja.wikipedia.org/wiki/徳川家宣"}
    - {name: 徳川家継, title: 江戸幕府7代将軍, from: 1713, to: 1716, source: "https://ja.wikipedia.org/wiki/徳川家継"}
    - {name: 徳川吉宗, title: 江戸幕府8代将軍, from: 1716, to: 1745, note: 享保の改革, source: "https://ja.wikipedia.org/wiki/徳川吉宗"}
    - {name: 徳川家重, title: 江戸幕府9代将軍, from: 1745, to: 1760, source: "https://ja.wikipedia.org/wiki/徳川家重"}
    - {name: 徳川家治, title: 江戸幕府10代将軍, from: 1760, to: 1786, note: 老中田沼意次の政治, source: "https://ja.wikipedia.org/wiki/徳川家治"}
    - {name: 徳川家斉, title: 江戸幕府11代将軍, from: 1787, to: 1837, note: 初期は老中松平定信の寛政の改革。将軍職を退いた後も大御所として1841年まで実権, source: "https://ja.wikipedia.org/wiki/徳川家斉"}
    - {name: 徳川家慶, title: 江戸幕府12代将軍, from: 1837, to: 1853, note: 老中水野忠邦の天保の改革。ペリー来航の直後に死去, source: "https://ja.wikipedia.org/wiki/徳川家慶"}
    - {name: 徳川家定, title: 江戸幕府13代将軍, from: 1853, to: 1858, note: 日米和親条約。大老井伊直弼が日米修好通商条約に調印, source: "https://ja.wikipedia.org/wiki/徳川家定"}
    - {name: 徳川家茂, title: 江戸幕府14代将軍, from: 1858, to: 1866, note: 公武合体で皇女和宮と結婚。第2次長州征討の途中に死去, source: "https://ja.wikipedia.org/wiki/徳川家茂"}
    - {name: 徳川慶喜, title: 江戸幕府15代将軍, from: 1867, to: 1867, note: 1867年に大政奉還。将軍に就いたのは慶応2年12月（西暦1867年1月）, source: "https://ja.wikipedia.org/wiki/徳川慶喜"}
    - {name: 明治天皇, title: 天皇, from: 1868, to: 1912, note: 1867年に践祚。明治維新・大日本帝国憲法・日清戦争・日露戦争, source: "https://ja.wikipedia.org/wiki/明治天皇"}
    - {name: 大正天皇, title: 天皇, from: 1912, to: 1926, note: 1921年から皇太子裕仁が摂政, source: "https://ja.wikipedia.org/wiki/大正天皇"}
    - {name: 昭和天皇, title: 天皇, from: 1926, to: 1989, note: 1947年の日本国憲法で「日本国の象徴」となった, source: "https://ja.wikipedia.org/wiki/昭和天皇"}
    - {name: 明仁（平成の天皇。現在の上皇）, title: 天皇, from: 1989, to: 2019, note: 2019年に退位, source: "https://ja.wikipedia.org/wiki/明仁"}
    - {name: 徳仁, title: 天皇, from: 2019, to: 2025, source: "https://ja.wikipedia.org/wiki/徳仁"}
  periods:
    - from: 1453
      to: 1466
      text: 室町幕府（足利将軍家）のもとで守護大名が各国を治めたが、将軍の力は弱まり、守護大名の家督争いや土一揆が相次いだ。明とは勘合貿易を行った。
    - from: 1467
      to: 1567
      text: 応仁の乱（1467–77）で京都が焼け、室町幕府の権威が失われて戦国時代となる。下剋上の風潮のなか、戦国大名が各地で領国をつくり、分国法を定めた。1543年に種子島に鉄砲が伝わり、1549年にフランシスコ＝ザビエルがキリスト教を伝えた（南蛮貿易）。
    - from: 1568
      to: 1598
      text: 織田信長が京都に入り（1568）、室町幕府を滅ぼして（1573）統一を進めた。本能寺の変（1582）の後、豊臣秀吉が全国を統一し（1590）、太閤検地・刀狩で兵農分離を進めた。秀吉は明の征服をめざして朝鮮に出兵した（文禄・慶長の役、1592–98）。
    - from: 1599
      to: 1647
      text: 関ヶ原の戦い（1600）に勝った徳川家康が江戸幕府を開き（1603）、大坂の陣（1614–15）で豊臣氏を滅ぼした。朱印船貿易で東南アジアに日本町ができたが、キリスト教の禁止、島原の乱（1637–38）を経て、ポルトガル船の来航を禁じ（1639）、オランダ商館を出島に移して（1641）「鎖国」体制をつくった。
    - from: 1648
      to: 1715
      text: 江戸幕府のもとで「鎖国」体制が完成。対外関係は長崎（オランダ・中国）、対馬（朝鮮）、薩摩（琉球）、松前（アイヌ）の「四つの口」に限られた。17世紀後半は文治政治に移り、元禄文化が栄えた。
    - from: 1716
      to: 1852
      text: 享保・寛政・天保の改革で幕府財政の立て直しを図る。18世紀末からロシア・イギリスの船が近海に現れ、幕府は蝦夷地の直轄や異国船打払令で対応した。
    - from: 1853
      to: 1867
      text: ペリー来航で開国し、不平等条約（日米修好通商条約など）を結ぶ。尊王攘夷運動から倒幕へと進み、1867年の大政奉還で江戸幕府が終わる。
    - from: 1868
      to: 1893
      text: 明治維新。廃藩置県・学制・徴兵令・地租改正で中央集権の近代国家をつくり、殖産興業・富国強兵を進めた。1889年に大日本帝国憲法を発布し、アジアで最初の立憲国家となった。
    - from: 1894
      to: 1918
      text: 日清戦争で台湾を、日露戦争で南樺太と遼東半島の租借権・南満洲鉄道を得て、1910年に韓国を併合した。条約改正も達成し、列強の一つとなった。
    - from: 1919
      to: 1930
      text: 第一次世界大戦後、国際連盟の常任理事国となり、ワシントン体制のもとで国際協調をとった。国内では政党内閣と普通選挙（1925年）が実現した（大正デモクラシー）。
    - from: 1931
      to: 1945
      text: 満洲事変から国際連盟を脱退し、日中戦争・太平洋戦争へと戦争を広げ、アジア・太平洋の広い地域を占領した。1945年8月にポツダム宣言を受け入れて降伏した。
    - from: 1946
      to: 1951
      text: 連合国軍（GHQ。実質はアメリカ）の占領下で、非軍事化と民主化（日本国憲法・農地改革・財閥解体）が行われた。1951年のサンフランシスコ平和条約で翌年独立を回復した。
    - from: 1952
      to: 1990
      text: 日米安全保障条約のもとで西側陣営に属し、1955年からは自由民主党の長期政権（55年体制）。高度経済成長で世界有数の経済大国となった。1972年に沖縄が返還された。
    - from: 1991
      to: 2025
      text: バブル経済の崩壊後、長い経済の停滞と少子高齢化に直面した。
  note: >-
    室町時代の元首は将軍とした。1573–1600年は将軍がいないので、実権を握った織田信長・豊臣秀吉（天下人）を書いた。
    1467–1589年（戦国時代）は国をひとつの「日本」として斜線（uncertain）で描き、大名の領国は分けない。
    江戸時代の地図上の元首は将軍とした（天皇と朝廷は京都にあり、将軍を任命する形式をとった）。
    明治以後の政治の実権は内閣にあり、主な首相は伊藤博文（初代、1885）・山県有朋・桂太郎・原敬（初の本格的政党内閣、1918）・
    犬養毅（1932年に五・一五事件で暗殺）・近衛文麿・東条英機（1941–44）・吉田茂（1946–54）・岸信介・池田勇人（所得倍増）・
    佐藤栄作（沖縄返還）・田中角栄（日中国交正常化）・中曽根康弘・小泉純一郎・安倍晋三（最長の在任）・石破茂（2024–25）・高市早苗（2025–）。
  source: "https://ja.wikipedia.org/wiki/日本の歴史"

- id: ezo_republic
  name: 蝦夷共和国（箱館政権）
  short: 箱館政権
  color: "#c9b4d6"
  kind: 旧幕府軍の政権
  rulers:
    - {name: 榎本武揚, title: 総裁, from: 1868, to: 1869, source: "https://ja.wikipedia.org/wiki/榎本武揚"}
  periods:
    - from: 1868
      to: 1869
      text: 戊辰戦争で新政府に降らなかった旧幕府海軍の榎本武揚らが箱館の五稜郭を占領し、蝦夷地に独自の政権をつくった。1869年5月、箱館戦争で降伏した。
  note: 「蝦夷共和国」は外国側の呼び方で、実態は旧幕臣の地方政権。入札（選挙）で総裁を選んだ
  source: "https://ja.wikipedia.org/wiki/蝦夷共和国"

