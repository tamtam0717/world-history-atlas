    - from: 1948
      to: 1960
      text: アメリカの占領地区に李承晩を大統領として建国。朝鮮戦争（1950–53）では一時、釜山周辺まで追いつめられた。休戦後も李承晩の強権的な政治が続き、1960年の四月革命で倒れた。
    - from: 1961
      to: 1987
      text: 朴正煕・全斗煥の軍人出身の政権のもとで、民主化運動を抑えながら輸出中心の工業化を進めた（開発独裁、「漢江の奇跡」）。1965年に日韓基本条約で日本と国交を結んだ。
    - from: 1987
      to: 2025
      text: 1987年の民主化宣言で大統領の直接選挙が実現した。1988年のソウルオリンピック、1991年の南北の国連同時加盟を経て、先進国の一つとなった。
  source: "https://ja.wikipedia.org/wiki/大韓民国"
