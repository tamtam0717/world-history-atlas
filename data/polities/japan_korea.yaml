    - {name: 尚宣威王, title: 琉球国王（第二尚氏）, from: 1477, to: 1477, note: 在位半年で退位, source: "https://ja.wikipedia.org/wiki/尚宣威王"}
    - {name: 尚真王, title: 琉球国王（第二尚氏）, from: 1477, to: 1526, note: 按司（地方の豪族）を首里に集めて中央集権を進め、八重山（1500）・久米島を従えた。琉球の最盛期, source: "https://ja.wikipedia.org/wiki/尚真王"}
