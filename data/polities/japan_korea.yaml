    - {name: 尚灝王, title: 琉球国王, from: 1804, to: 1834, source: "https://ja.wikipedia.org/wiki/尚灝王"}
    - {name: 尚育王, title: 琉球国王, from: 1835, to: 1847, source: "https://ja.wikipedia.org/wiki/尚育王"}
    - {name: 尚泰王, title: 琉球国王（1872年から琉球藩王）, from: 1848, to: 1879, note: 1879年の琉球処分で東京に移された, source: "https://ja.wikipedia.org/wiki/尚泰王"}
  periods:
    - from: 1453
      to: 1469
      text: 1429年に尚巴志が三山（北山・中山・南山）を統一してできた琉球王国（第一尚氏）。明の冊封を受けて朝貢し、日本・朝鮮・中国・東南アジアを結ぶ中継貿易で栄えた。
    - from: 1470
      to: 1608
      text: クーデターで第二尚氏が王位につき、尚真王のもとで按司を首里に集めて中央集権を進め、八重山・奄美を従えた。16世紀後半にはポルトガルや明の私貿易（倭寇）・日本の商人の進出で、中継貿易は衰えた。
    - from: 1609
      to: 1647
      text: 1609年に薩摩藩（島津氏）が侵攻して首里城を落とし、奄美群島を割き取った。王国は存続して明への朝貢を続けたが、薩摩藩の支配も受ける「両属」の状態となった。1644年の明の滅亡で冊封が途絶えた。
    - from: 1648
      to: 1871
      text: 中国（明、のち清）の冊封を受けて朝貢しながら、1609年の島津氏の侵攻以後は薩摩藩の支配も受ける「両属」の状態にあった。中継貿易の利益は薩摩藩にも流れた。
    - from: 1872
      to: 1879
      text: 明治政府は国王尚泰を琉球藩王とし（1872、琉球藩）、1875年に清への朝貢を禁じた。王府はなお清との関係を保とうとしたが、1879年に政府は軍と警察を送って琉球藩を廃し、沖縄県を設置した（琉球処分）。琉球王国は滅び、清はこれに抗議した。
  note: >-
    1609年に薩摩藩（島津氏）が侵攻し、奄美諸島は薩摩の直轄となった（ピースは鹿児島県に含まれ、日本として描く）。
    王国は存続し、中国への朝貢を続けたので、地図では独自の色に明の宗主権の帯（1644年まで）・清の宗主権の帯（1663年の冊封から）で描き、薩摩の支配は帯にしない。
    1872年の琉球藩の設置の後も王国は1879年の琉球処分まで存続したので、地図では1879年まで琉球として描き、朝貢を禁じられた1875年から帯を日本の色に替える。
  source:
    - "https://ja.wikipedia.org/wiki/琉球王国"
    - "https://ja.wikipedia.org/wiki/琉球処分"

- id: joseon
  name: 朝鮮
  names:
    - {to: 1896, name: 朝鮮（李氏朝鮮）, short: 朝鮮, kind: 王国}
    - {from: 1897, name: 大韓帝国, short: 韓国, kind: 帝国}
  short: 朝鮮
  color: "#b3d3a2"
  kind: 王国
  rulers:
    - {name: 端宗, title: 朝鮮国王, from: 1452, to: 1455, note: 12歳で即位。1453年に叔父の首陽大君（のちの世祖）が重臣を殺して実権を握り（癸酉靖難）、1455年に譲位させられた, source: "https://ja.wikipedia.org/wiki/端宗_(朝鮮王)"}
    - {name: 世祖, title: 朝鮮国王, from: 1455, to: 1468, note: 王権を強め、法典『経国大典』の編纂を始めた, source: "https://ja.wikipedia.org/wiki/世祖_(朝鮮王)"}
    - {name: 睿宗, title: 朝鮮国王, from: 1468, to: 1469, source: "https://ja.wikipedia.org/wiki/睿宗_(朝鮮王)"}
    - {name: 成宗, title: 朝鮮国王, from: 1469, to: 1494, note: 『経国大典』を完成・施行し（1485）、両班官僚による統治の仕組みを整えた, source: "https://ja.wikipedia.org/wiki/成宗_(朝鮮王)"}
    - {name: 燕山君, title: 朝鮮国王, from: 1494, to: 1506, note: 士林派を弾圧した（戊午・甲子士禍）。暴政のため廃位され、王の廟号がない, source: "https://ja.wikipedia.org/wiki/燕山君"}
    - {name: 中宗, title: 朝鮮国王, from: 1506, to: 1544, note: クーデター（中宗反正）で即位。1510年に三浦の乱, source: "https://ja.wikipedia.org/wiki/中宗_(朝鮮王)"}
    - {name: 仁宗, title: 朝鮮国王, from: 1544, to: 1545, source: "https://ja.wikipedia.org/wiki/仁宗_(朝鮮王)"}
    - {name: 明宗, title: 朝鮮国王, from: 1545, to: 1567, note: 母の文定王后の一族（外戚）が実権を握った。1555年に倭寇が全羅道を襲った（乙卯倭変）, source: "https://ja.wikipedia.org/wiki/明宗_(朝鮮王)"}
    - {name: 宣祖, title: 朝鮮国王, from: 1567, to: 1608, note: 両班の東人・西人の党争が始まった。壬辰・丁酉倭乱（1592–98）では義州まで逃れ、明の援軍を受けた, source: "https://ja.wikipedia.org/wiki/宣祖_(朝鮮王)"}
    - {name: 光海君, title: 朝鮮国王, from: 1608, to: 1623, note: 戦後の復興を進め、明と後金の間で中立外交をとった。1623年のクーデター（仁祖反正）で廃位された, source: "https://ja.wikipedia.org/wiki/光海君"}
    - {name: 仁祖, title: 朝鮮国王, from: 1623, to: 1649, note: 1637年に清に降伏し（丙子胡乱）、清の冊封を受けた, source: "https://ja.wikipedia.org/wiki/仁祖"}
    - {name: 孝宗, title: 朝鮮国王, from: 1649, to: 1659, note: 清を討つ「北伐」を計画した, source: "https://ja.wikipedia.org/wiki/孝宗_(朝鮮王)"}
    - {name: 顕宗, title: 朝鮮国王, from: 1659, to: 1674, source: "https://ja.wikipedia.org/wiki/顕宗_(朝鮮王)"}
    - {name: 粛宗, title: 朝鮮国王, from: 1674, to: 1720, source: "https://ja.wikipedia.org/wiki/粛宗_(朝鮮王)"}
    - {name: 景宗, title: 朝鮮国王, from: 1720, to: 1724, source: "https://ja.wikipedia.org/wiki/景宗_(朝鮮王)"}
    - {name: 英祖, title: 朝鮮国王, from: 1724, to: 1776, note: 党争をおさえる蕩平策, source: "https://ja.wikipedia.org/wiki/英祖"}
    - {name: 正祖, title: 朝鮮国王, from: 1776, to: 1800, note: 蕩平策を受け継ぎ、文化が栄えた, source: "https://ja.wikipedia.org/wiki/正祖"}
    - {name: 純祖, title: 朝鮮国王, from: 1800, to: 1834, note: 外戚（安東金氏）の勢道政治が始まる, source: "https://ja.wikipedia.org/wiki/純祖"}
    - {name: 憲宗, title: 朝鮮国王, from: 1834, to: 1849, source: "https://ja.wikipedia.org/wiki/憲宗_(朝鮮王)"}
    - {name: 哲宗, title: 朝鮮国王, from: 1849, to: 1863, source: "https://ja.wikipedia.org/wiki/哲宗_(朝鮮王)"}
    - {name: 高宗, title: 朝鮮国王（1897年から大韓帝国皇帝）, from: 1863, to: 1907, note: 即位当初は父の興宣大院君が実権（–1873）。のち王妃閔氏の一族が力を持った。1907年のハーグ密使事件で退位させられた, source: "https://ja.wikipedia.org/wiki/高宗_(朝鮮王)"}
    - {name: 純宗, title: 大韓帝国皇帝, from: 1907, to: 1910, note: 1910年の韓国併合で退位, source: "https://ja.wikipedia.org/wiki/純宗_(朝鮮王)"}
  periods:
    - from: 1453
      to: 1591
      text: 明の冊封を受け、両班（文班・武班）の官僚が科挙で選ばれて国を治めた。朱子学を国の学問とし、1485年に法典『経国大典』を施行した。16世紀には官僚の派閥争い（士禍、のち東人・西人の党争）が続き、倭寇や北方の女真の侵入に悩まされた。
    - from: 1592
      to: 1598
      text: 豊臣秀吉の軍が二度にわたって侵攻した（壬辰・丁酉倭乱、日本でいう文禄・慶長の役）。李舜臣の水軍（亀甲船）と各地の義兵、明の援軍が戦い、秀吉の死で日本軍は撤退したが、国土は大きく荒れた。
    - from: 1599
      to: 1647
      text: 光海君のもとで復興を進め、1607年に日本との国交を回復した（回答兼刷還使、のちの朝鮮通信使）。後金（清）の圧力が強まり、丁卯胡乱（1627）・丙子胡乱（1636–37）で清に降伏して、明との冊封関係を断たされた。
    - from: 1648
      to: 1799
      text: 丙子胡乱（1636–37）で清に服属し、清の冊封を受けて朝貢した。両班の党争が続いたが、18世紀の英祖・正祖の時代には政治が安定し、実学が発達した。日本とは対馬藩を通じて交易し、将軍の代替わりには朝鮮通信使を送った。
    - from: 1800
      to: 1875
      text: 外戚の勢道政治のもとで政治が乱れ、農民反乱が起こる。カトリックを弾圧し、大院君は欧米の艦隊を撃退して鎖国（攘夷）政策をとった。
    - from: 1876
      to: 1904
      text: 日朝修好条規で開国。清と日本の勢力争いの中で壬午軍乱・甲申政変・甲午農民戦争が起こり、日清戦争の結果、清の宗主権がなくなった。1897年に国号を大韓帝国とした。
    - from: 1905
      to: 1910
      text: 日露戦争後、日本の保護国となり（第2次日韓協約、統監府）、義兵闘争が広がった。1910年に日本に併合された。
  note: 地図では1636年まで明の宗主権の帯、1637年から1895年の下関条約まで清の宗主権の帯をつける（丙子胡乱は西暦1637年初めの降伏なので1637年から）。1905–1910年の保護国期は日本の色で塗り、副ラベルで示す
  source: "https://ja.wikipedia.org/wiki/李氏朝鮮"

- id: north_korea
  name: 朝鮮民主主義人民共和国
  short: 北朝鮮
  color: "#e2b08a"
  kind: 社会主義国（朝鮮労働党の一党支配）
  rulers:
    - {name: 金日成, title: 首相（1972年から国家主席）・朝鮮労働党委員長／総書記, from: 1948, to: 1994, source: "https://ja.wikipedia.org/wiki/金日成"}
    - {name: 金正日, title: 朝鮮労働党総書記・国防委員長, from: 1994, to: 2011, note: 父の死後に権力を継いだ（総書記就任は1997年）, source: "https://ja.wikipedia.org/wiki/金正日"}
    - {name: 金正恩, title: 朝鮮労働党第一書記（2021年から総書記）・国務委員長, from: 2011, to: 2025, source: "https://ja.wikipedia.org/wiki/金正恩"}
  periods:
    - from: 1948
      to: 1953
      text: ソ連の占領地区に、金日成を首相として建国。1950年に韓国に侵攻して朝鮮戦争を起こした。中国の人民志願軍の参戦を経て、1953年に休戦した。
    - from: 1954
      to: 1993
      text: 金日成の独裁と「主体思想」のもとで、中ソ両国と結びながら自立的な社会主義建設を進めた。冷戦の終わりで孤立が深まった。
    - from: 1994
      to: 2025
      text: 金正日・金正恩と世襲が続く。1990年代に深刻な飢饉が起こった。核兵器と弾道ミサイルの開発を進め、2006年から核実験を行い、国際的な制裁を受けている。
  note: 実権者として最高指導者（朝鮮労働党のトップ）を書いた
  source: "https://ja.wikipedia.org/wiki/朝鮮民主主義人民共和国"

- id: south_korea
  name: 大韓民国
  short: 韓国
  color: "#9fc4e4"
  kind: 共和国（大統領制）
  rulers:
    - {name: 李承晩, title: 大統領, from: 1948, to: 1960, note: 四月革命で辞任, source: "https://ja.wikipedia.org/wiki/李承晩"}
    - {name: 尹潽善, title: 大統領, from: 1960, to: 1962, note: 第二共和国は議院内閣制で、首相は張勉。1961年の軍事クーデタ後は実権がなかった, source: "https://ja.wikipedia.org/wiki/尹潽善"}
    - {name: 朴正煕, title: 国家再建最高会議議長（1963年から大統領）, from: 1961, to: 1979, note: 1961年の5・16軍事クーデタで実権を握る。開発独裁で「漢江の奇跡」。1979年に暗殺された, source: "https://ja.wikipedia.org/wiki/朴正煕"}
    - {name: 崔圭夏, title: 大統領, from: 1979, to: 1980, note: 実権は1979年12月の粛軍クーデタで全斗煥が握った, source: "https://ja.wikipedia.org/wiki/崔圭夏"}
    - {name: 全斗煥, title: 大統領, from: 1980, to: 1988, source: "https://ja.wikipedia.org/wiki/全斗煥"}
    - {name: 盧泰愚, title: 大統領, from: 1988, to: 1993, source: "https://ja.wikipedia.org/wiki/盧泰愚"}
    - {name: 金泳三, title: 大統領, from: 1993, to: 1998, note: 32年ぶりの文民大統領, source: "https://ja.wikipedia.org/wiki/金泳三"}
    - {name: 金大中, title: 大統領, from: 1998, to: 2003, note: 太陽政策。2000年に南北首脳会談, source: "https://ja.wikipedia.org/wiki/金大中"}
    - {name: 盧武鉉, title: 大統領, from: 2003, to: 2008, source: "https://ja.wikipedia.org/wiki/盧武鉉"}
    - {name: 李明博, title: 大統領, from: 2008, to: 2013, source: "https://ja.wikipedia.org/wiki/李明博"}
    - {name: 朴槿恵, title: 大統領, from: 2013, to: 2017, note: 2017年に弾劾で罷免, source: "https://ja.wikipedia.org/wiki/朴槿恵"}
    - {name: 文在寅, title: 大統領, from: 2017, to: 2022, source: "https://ja.wikipedia.org/wiki/文在寅"}
    - {name: 尹錫悦, title: 大統領, from: 2022, to: 2025, note: 2024年12月に非常戒厳を宣布し、2025年4月に弾劾で罷免, source: "https://ja.wikipedia.org/wiki/尹錫悦"}
    - {name: 李在明, title: 大統領, from: 2025, to: 2025, source: "https://ja.wikipedia.org/wiki/李在明"}
  periods:
    - from: 1948
      to: 1960
      text: アメリカの占領地区に李承晩を大統領として建国。朝鮮戦争（1950–53）では一時、釜山周辺まで追いつめられた。休戦後も李承晩の強権的な政治が続き、1960年の四月革命で倒れた。
    - from: 1961
      to: 1987
      text: 朴正煕・全斗煥の軍人出身の政権のもとで、民主化運動を抑えながら輸出中心の工業化を進めた（開発独裁、「漢江の奇跡」）。1965年に日韓基本条約で日本と国交を結んだ。
    - from: 1987
      to: 2025
      text: 1987年の民主化宣言で大統領の直接選挙が実現した。1988年のソウルオリンピック、1991年の南北の国連同時加盟を経て、先進国の一つとなった。
  source: "https://ja.wikipedia.org/wiki/大韓民国"
