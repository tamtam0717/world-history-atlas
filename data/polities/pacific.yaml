- id: tonga
  name: トンガ王国
  names:
    - {to: 1844, name: トンガ（トゥイ・トンガとトゥイ・カノクポルの国）, short: トンガ, kind: 首長国（聖なる王と世俗の王）}
  short: トンガ
  color: "#e4b7a0"
  kind: 王国（立憲君主政）
  home_iso: [TON]
  rulers:
    - {name: ジョージ・トゥポウ1世（タウファアハウ）, title: トンガ王, from: 1845, to: 1893, note: 内戦を終わらせて諸島を統一し、1875年に憲法を定めた, source: "https://ja.wikipedia.org/wiki/ジョージ・トゥポウ1世"}
    - {name: ジョージ・トゥポウ2世, title: トンガ王, from: 1893, to: 1918, note: 1900年にイギリスと友好条約を結び保護国となった, source: "https://ja.wikipedia.org/wiki/ジョージ・トゥポウ2世"}
    - {name: サローテ・トゥポウ3世, title: トンガ女王, from: 1918, to: 1965, source: "https://ja.wikipedia.org/wiki/サローテ・トゥポウ3世"}
    - {name: タウファアハウ・トゥポウ4世, title: トンガ王, from: 1965, to: 2006, note: 1970年に保護国の地位を終わらせた, source: "https://ja.wikipedia.org/wiki/タウファアハウ・トゥポウ4世"}
    - {name: ジョージ・トゥポウ5世, title: トンガ王, from: 2006, to: 2012, note: 2010年の選挙改革で国王の権限を縮めた, source: "https://ja.wikipedia.org/wiki/ジョージ・トゥポウ5世"}
    - {name: トゥポウ6世, title: トンガ王, from: 2012, source: "https://ja.wikipedia.org/wiki/トゥポウ6世"}
  periods:
    - from: 1648
      to: 1798
      text: 神聖な王トゥイ・トンガと、実際の政治を行うトゥイ・カノクポルが並び立つ首長国。かつてはサモアやフィジーの一部にも影響を及ぼした。1773–77年にクックが訪れ「フレンドリー諸島」と呼んだ。
    - from: 1799
      to: 1844
      text: トゥイ・カノクポルの暗殺（1799年）をきっかけに、首長たちが争う内戦が半世紀続いた。1820年代からメソジストの宣教師が布教し、キリスト教に改宗したタウファアハウが勢力を広げた。
    - from: 1845
      to: 1899
      text: タウファアハウがジョージ・トゥポウ1世として即位して諸島を統一し、1875年に憲法を定めて近代的な立憲王国とした。列強の太平洋分割の中で、独立を保った数少ない国。
    - from: 1900
      to: 1969
      text: 1900年の友好条約でイギリスの保護国となり、外交はイギリスが握ったが、王政と内政の自治は続いた。サローテ女王が長く治めた。
    - from: 1970
      text: 1970年に保護国の地位が終わり、イギリス連邦の中の独立王国となった。2006年の首都ヌクアロファの暴動の後、2010年の改革で議会の多くが選挙で選ばれるようになった。
  source: "https://ja.wikipedia.org/wiki/トンガ"

- id: tahiti
  name: タヒチ王国
  short: タヒチ
  color: "#ecc9a9"
