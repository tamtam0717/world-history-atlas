    - {name: ポマレ2世, title: タヒチ王, from: 1791, to: 1821, note: 1815年のフェイ・ピの戦いで対立する首長を破ってタヒチを統一し、キリスト教に改宗した, source: "https://ja.wikipedia.org/wiki/ポマレ2世"}
    - {name: ポマレ3世, title: タヒチ王, from: 1821, to: 1827, source: "https://en.wikipedia.org/wiki/Pōmare_III"}
    - {name: ポマレ4世, title: タヒチ女王, from: 1827, to: 1877, note: 1842年にフランスの保護国とされ、タヒチ戦争（1844–47年）で抵抗した, source: "https://ja.wikipedia.org/wiki/ポマレ4世"}
    - {name: ポマレ5世, title: タヒチ王, from: 1877, to: 1880, note: 1880年に王国をフランスに譲った, source: "https://ja.wikipedia.org/wiki/ポマレ5世"}
  periods:
    - from: 1788
      to: 1814
      text: タヒチ島の首長ポマレが、ヨーロッパの船乗りから得た銃とバウンティ号の反乱者の助けで勢力を広げ、王国を作った。1797年にロンドン伝道協会の宣教師が来た。
    - from: 1815
      to: 1841
      text: ポマレ2世がタヒチとモーレア島を統一し、キリスト教の王国とした（1819年に法典）。宣教師とイギリスの影響が強かった。
    - from: 1842
      to: 1880
      text: 1842年にフランスの提督デュプティ＝トゥアールが保護国化を押しつけた。ポマレ4世はイギリスの助けを求めて抵抗し（タヒチ戦争 1844–47年）、敗れて保護国を受け入れた。1880年にポマレ5世が王国をフランスに譲った。
  source: "https://ja.wikipedia.org/wiki/タヒチ王国"

- id: samoa_kingdom
  name: サモア王国
  short: サモア
  color: "#c3dbb5"
  kind: 王国（首長たちが王を立てる）
  rulers:
