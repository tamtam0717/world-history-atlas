    - {name: トゥプア・タマセセ・ティティマエア, title: サモア王, from: 1887, to: 1889, note: ドイツが立てた王, source: "https://en.wikipedia.org/wiki/Tupua_Tamasese_Titimaea"}
    - {name: マリエトア・ラウペパ（復位）, title: サモア王, from: 1889, to: 1898, note: ベルリン条約で英米独の三国が王と認めた, source: "https://en.wikipedia.org/wiki/Malietoa_Laupepa"}
    - {name: マリエトア・タヌマフィリ1世, title: サモア王, from: 1898, to: 1899, note: マタアファ・ヨセフォとの王位争い（第2次サモア内戦）の中で英米が支持した, source: "https://en.wikipedia.org/wiki/Malietoa_Tanumafili_I"}
  periods:
    - from: 1873
      to: 1888
      text: 首長たちがムリヌウ（アピア近郊）に政府を置いて王を立てたが、マリエトア家とトゥプア家などの王位争いが続いた。アピアに領事を置くイギリス・アメリカ・ドイツが、プランテーションと港をめぐって介入した。
    - from: 1889
      to: 1899
      text: 英米独の艦隊がアピアでにらみ合った末、1889年のベルリン条約で三国の共同の保護のもと王国の独立が認められた。王位争いの内戦が再び起こり、1899年の三国協定でサモアは東西に分割された。
  note: 王国が成立した年は諸説ある（ここでは首長たちが中央の政府を置いた1873年）。地図では境界と支配があいまいなので斜線（uncertain）で示す。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Samoa"

