    - {from: 1831, to: 1852, text: 諸州がゆるく連合し、ブエノスアイレス州知事ロサスが独裁的に力をふるった（連邦派と中央集権派の内戦が続いた）。}
    - {from: 1852, to: 1879, text: カセーロスの戦いでロサスが倒れ、1853年に連邦憲法ができた。ブエノスアイレス州は1861年まで分かれていた。ミトレ・サルミエントのもとで国家の基礎がつくられ、パラグアイ戦争（1864–70）に加わった。}
    - {from: 1879, to: 1929, text: 「砂漠の征服」でパンパとパタゴニアを征服し、ヨーロッパ（イタリア・スペイン）から大量の移民が来た。小麦・牛肉の輸出で世界有数の豊かな国となった。1912年に男子普通選挙。}
    - {from: 1930, to: 1945, text: 1930年の軍のクーデタから保守派の不正選挙の時代（忌まわしき10年）。1943年に再び軍が政権を握った。}
    - {from: 1946, to: 1955, text: ペロン政権。労働者の保護・産業の国有化を進めた（ペロニズム）。}
    - {from: 1955, to: 1982, text: 軍のクーデタと短い民政が繰り返された。1976–83年の軍事政権は左翼ゲリラの掃討を名目に多くの市民を拉致・殺害し（汚い戦争）、1982年にはフォークランド戦争でイギリスに敗れた。}
    - {from: 1983, to: 2025, text: 民政に戻った。たびたび経済危機（2001年の債務不履行など）とインフレに苦しんだ。}

