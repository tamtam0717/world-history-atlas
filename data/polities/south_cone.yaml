  periods:
    - {from: 1810, to: 1826, text: 1810年に自治政府ができたが、1814年にペルー副王の軍に敗れた。1817年にサン・マルティンとオイギンスのアンデス軍が解放し、1818年に独立を宣言。最後の王党派の拠点チロエは1826年に降伏した。}
    - {from: 1830, to: 1878, text: 保守派のポルタレスが築いた1833年憲法の体制で、ラテンアメリカでは珍しく安定した。ペルー・ボリビア連合との戦争（1836–39）に勝った。}
    - {from: 1879, to: 1891, text: 太平洋戦争（1879–84）でペルー・ボリビアに勝ち、硝石の産地（タラパカ・アントファガスタ）を得た。南ではマプーチェの地（アラウカニア）を占領した。}
    - {from: 1891, to: 1924, text: 1891年の内戦で議会派が勝ち、議会共和政となった。硝石と銅の輸出に頼り、労働運動が起こった。}
    - {from: 1925, to: 1969, text: 1925年憲法のもとで、人民戦線などの中道・左派政権と保守派が交代した。}
    - {from: 1970, to: 1973, text: アジェンデの人民連合政権が銅山の国有化など社会主義政策を進めたが、経済の混乱と対立の中で軍のクーデタに倒された。}
    - {from: 1973, to: 1989, text: ピノチェトの軍事独裁。多くの市民が殺害・行方不明となった。新自由主義の経済改革を進めた。}
    - {from: 1990, to: 2025, text: 1988年の国民投票でピノチェトの続投が否決され、民政に移った。2019年の大規模な抗議運動の後、新しい憲法がつくられようとしたが、国民投票で2度否決された。}

# ---- 先住民 ----

- id: mapuche
  name: マプーチェ（アラウカニア）
  short: マプーチェ
  color: "#c4a27a"
  kind: 先住民の諸部族
  periods:
    - {from: 1648, to: 1810, text: ビオビオ川の南のアラウカニアで、スペインの征服を退けて自立を保った（アラウコ戦争）。スペインは会議（パルラメント）を開いて境界と交易を取り決めた。18世紀からはアンデスの東のパンパにも広がった。}
    - {from: 1810, to: 1883, text: 独立後もアラウカニアとパンパで自立を保ち、牛や馬の交易・襲撃で力を持った（パンパのカルフクラなど）。1860年代からチリ軍のアラウカニア占領（1861–83）とアルゼンチンの「砂漠の征服」（1879–84）で征服された。}
  note: マプーチェは「大地の人」。スペイン人はアラウコ人（アラウカノ）と呼んだ。統一した国家ではなく、首長（ロンコ）たちが必要に応じて連合した。パンパのランケル人なども含めてこの色で塗る。
  source: "https://ja.wikipedia.org/wiki/マプチェ族"
