    - {from: 1850, to: 1888, text: ペドロ2世のもとで安定し、コーヒーの輸出で栄えた。パラグアイ戦争（1864–70）に勝った。奴隷貿易は1850年に禁じられ、奴隷制は1888年の黄金法で廃止された。}
    - {from: 1889, to: 1929, text: 軍のクーデタで共和政になる。サンパウロとミナスジェライスの大地主が交代で大統領を出す「カフェ・コン・レイテ（コーヒーとミルク）」の政治。ヨーロッパ・日本から移民が来た。}
    - {from: 1930, to: 1945, text: ヴァルガスが革命で政権を握り、1937年からエスタード・ノーヴォ（新国家）の独裁で工業化と労働者保護を進めた。第二次世界大戦では連合国側で参戦した。}
    - {from: 1946, to: 1963, text: 民主政。クビチェックの開発政策で内陸に新首都ブラジリアが建てられた（1960）。}
    - {from: 1964, to: 1984, text: 軍事政権。高度成長（ブラジルの奇跡）の一方で、反対派への弾圧と対外債務が膨らんだ。}
    - {from: 1985, to: 2025, text: 民政に戻り、1988年に新憲法。インフレを抑え、BRICS の一つとして新興国の大国となった。}

