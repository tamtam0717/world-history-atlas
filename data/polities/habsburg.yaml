  periods:
    - from: 1453
      to: 1455
      text: シュタイアーマルク南部（ツェリェ）を本拠に、ケルンテン・クライン・スラヴォニアに広い領地を持った大貴族。1436年に帝国諸侯となった。1456年にウルリヒ2世が殺されて断絶し、領地はハプスブルク家が継いだ。
  note: スラヴォニア・ザゴリエ（ヴァラジュディン）などハンガリー王冠の下の領地は、地図ではハンガリーの色のまま。
  source: "https://en.wikipedia.org/wiki/Counts_of_Celje"

