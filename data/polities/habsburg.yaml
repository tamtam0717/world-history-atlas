    - {name: ホルン・ジュラ, title: 首相（社会党）, from: 1994, to: 1998, source: "https://en.wikipedia.org/wiki/Gyula_Horn"}
    - {name: オルバーン・ヴィクトル, title: 首相（フィデス）, from: 1998, to: 2002, source: "https://ja.wikipedia.org/wiki/オルバーン・ヴィクトル"}
    - {name: メッジェシ・ペーテル, title: 首相（社会党）, from: 2002, to: 2004, source: "https://en.wikipedia.org/wiki/Péter_Medgyessy"}
    - {name: ジュルチャーニ・フェレンツ, title: 首相（社会党）, from: 2004, to: 2009, source: "https://en.wikipedia.org/wiki/Ferenc_Gyurcsány"}
    - {name: バイナイ・ゴルドン, title: 首相, from: 2009, to: 2010, source: "https://en.wikipedia.org/wiki/Gordon_Bajnai"}
    - {name: オルバーン・ヴィクトル, title: 首相（フィデス。2度目）, from: 2010, source: "https://ja.wikipedia.org/wiki/オルバーン・ヴィクトル"}
  periods:
    - from: 1453
      to: 1457
      text: 幼いラースロー5世の下で、摂政だったフニャディ・ヤーノシュがオスマン帝国と戦い、1456年にベオグラード（ナンドルフェヘールヴァール）の包囲を退けた。
    - from: 1458
      to: 1490
      text: マーチャーシュ1世が王権を強め、常備軍「黒軍」でボヘミア（モラヴィア・シュレジエン・ラウジッツ）とオーストリア（ウィーン）にまで進出した。ブダの宮廷はルネサンス文化の中心となった。
    - from: 1491
      to: 1526
      text: ヤゲウォ家のウラースロー2世・ラヨシュ2世の下で王権が弱まり、貴族が争った。1514年にドージャ・ジェルジの農民反乱が起こる。1521年にベオグラードを失い、1526年のモハーチの戦いで王が戦死した。
    - from: 1527
      to: 1540
      text: サポヤイ・ヤーノシュとフェルディナント1世の二人の王が争った。サポヤイはオスマン帝国の保護を受けてブダを保ち、1538年のヴァーラドの和約で、互いの領地を認め、サポヤイの死後はフェルディナントが全土を継ぐと約束した。
    - from: 1918
      to: 1919
      text: 敗戦と帝国の解体で、カーロイの民主的な共和国が生まれたが、周辺国の軍に国土を占領された。1919年3月、クン・ベーラらがハンガリー・ソヴィエト共和国を立てたが、ルーマニア軍の侵攻で8月に崩れ、ルーマニア軍がブダペストを一時占領した。
    - from: 1920
      to: 1937
      text: ホルティが摂政となり、国王のいない王国（摂政制）となった。トリアノン条約で国土の約3分の2と人口の約6割（ハンガリー人約300万人を含む）を失い、失地の回復（修正主義）が国の目標となった。ベトレン首相のもとで安定したが、世界恐慌後は右傾化した。
    - from: 1938
      to: 1944
      text: ドイツ・イタリアに近づき、ウィーン裁定（1938・1940）とユーゴスラヴィア侵攻（1941）で南スロヴァキア・カルパト＝ウクライナ・北トランシルヴァニア・バチュカなどを取り戻した。1941年にソ連と開戦し、ドン川の戦い（1943）で大敗。ひそかに講和を探ったため、1944年3月にドイツ軍に占領され、約43万人のユダヤ人がアウシュヴィッツなどへ移送された。
    - from: 1944
      to: 1948
      text: 10月にホルティが休戦を発表したがドイツに退けられ、矢十字党のサーラシが政権を握った。ソ連軍はブダペストを包囲し（1944–1945）、全土を占領した。戦後の選挙では小農業者党が勝ったが、ソ連の後ろ盾を受けた共産党が権力を握っていった。
    - from: 1949
      to: 1956
      text: ハンガリー人民共和国。ラーコシの独裁のもとで、農業の集団化・重工業化と粛清（ライク裁判）が進んだ。1956年10月、ブダペストの学生・市民の蜂起からナジ政権が中立を宣言したが、ソ連軍に鎮圧された（ハンガリー事件）。約20万人が国外へ逃れた。
    - from: 1957
      to: 1988
      text: カーダールの長期政権。弾圧の後、1960年代から「新経済メカニズム」で市場の要素を取り入れ、東側では比較的豊かで自由な「グヤーシュ共産主義」と呼ばれた。
    - from: 1989
      to: 2009
      text: 1989年に一党独裁をやめ、オーストリアとの国境の鉄条網を撤去して、東ドイツ市民の西側への脱出を許した（ベルリンの壁の崩壊につながる）。10月にハンガリー共和国となり、議会制民主主義と市場経済に移った。NATO（1999）・EU（2004）に加盟した。
    - from: 2010
      text: オルバーン首相のフィデスが議会の3分の2を握り、新憲法（2012、国名をハンガリーに）を定めた。移民の受け入れに反対し、メディアや司法への統制を強めたとして、EU と対立している。
  note: >-
    元首の欄は、その時期に実権を持つ人を書く。1920–1944年は摂政ホルティ、共産党の時代（1948–1989）は党の第一書記・書記長、1990年以後は首相（大統領は議会が選ぶ儀礼的な元首）。
    1918年末から1921年まで、南部（ペーチ・バヤ）はセルビア（ユーゴスラヴィア）軍に占領された。1919年8月〜1920年3月のルーマニア軍の占領（ブダペストとティサ川以東）は、1年に満たないので地図には描かない。
    1944年末は、ソ連軍が占領した東部・南部を占領地（ソ連の色・斜線）として描く。1944年3月からのドイツ軍の占領は、ハンガリー政府が続いたので描かない。
  source:
    - "https://ja.wikipedia.org/wiki/ハンガリーの歴史"
    - "https://ja.wikipedia.org/wiki/トリアノン条約"
    - "https://en.wikipedia.org/wiki/List_of_prime_ministers_of_Hungary"

- id: czechoslovakia
  name: チェコスロヴァキア
  names:
    - {to: 1937, name: チェコスロヴァキア共和国（第一共和国）}
    - {from: 1938, to: 1938, name: チェコ＝スロヴァキア共和国（第二共和国）, short: チェコ＝スロヴァキア}
    - {from: 1945, to: 1947, name: チェコスロヴァキア共和国}
