  periods:
    - from: 1453
      to: 1499
      text: ゴリツィア（ゲルツ）とプステル谷のリエンツを本拠とする伯家の領地。ツェリェ伯の遺領をめぐってフリードリヒ3世と争って敗れ（1460）、ケルンテンの領地を失った。1500年に断絶し、ハプスブルク家が継いだ。
  note: 伯領は現在のイタリアのゴリツィア県（担当 C）・スロヴェニアのゴリシュカ・オーストリアの東チロルにまたがる。
  source: "https://en.wikipedia.org/wiki/County_of_Gorizia"

- id: celje
