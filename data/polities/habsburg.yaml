    - {from: 1990, to: 1992, name: チェコおよびスロヴァキア連邦共和国, kind: 連邦共和国}
  short: チェコスロヴァキア
  color: "#9dc6e0"
  kind: 共和国
  rulers:
    - {name: トマーシュ・ガリッグ・マサリク, title: 大統領（建国の父）, from: 1918, to: 1935, source: "https://ja.wikipedia.org/wiki/トマーシュ・マサリク"}
    - {name: エドヴァルド・ベネシュ, title: 大統領（ミュンヘン協定の後、1938年10月に辞任）, from: 1935, to: 1938, source: "https://ja.wikipedia.org/wiki/エドヴァルド・ベネシュ"}
    - {name: エミール・ハーハ, title: 大統領（第二共和国。1938年11月〜1939年3月）, from: 1938, to: 1939, source: "https://ja.wikipedia.org/wiki/エミール・ハーハ"}
    - {name: エドヴァルド・ベネシュ, title: 大統領（1940–1945年はロンドンの亡命政府の大統領）, from: 1945, to: 1948, source: "https://ja.wikipedia.org/wiki/エドヴァルド・ベネシュ"}
    - {name: クレメント・ゴットワルト, title: 共産党議長・首相（1946〜）・大統領（1948〜）, from: 1948, to: 1953, source: "https://ja.wikipedia.org/wiki/クレメント・ゴットワルト"}
    - {name: アントニーン・ノヴォトニー, title: 共産党第一書記（1957–1968年は大統領を兼ねる）, from: 1953, to: 1968, source: "https://en.wikipedia.org/wiki/Antonín_Novotný"}
    - {name: アレクサンデル・ドプチェク, title: 共産党第一書記（「プラハの春」）, from: 1968, to: 1969, source: "https://ja.wikipedia.org/wiki/アレクサンデル・ドプチェク"}
    - {name: グスターウ・フサーク, title: 共産党第一書記（書記長）。1975年から大統領を兼ねる（〜1989）, from: 1969, to: 1987, source: "https://ja.wikipedia.org/wiki/グスターフ・フサーク"}
    - {name: ミロシュ・ヤケシュ, title: 共産党書記長, from: 1987, to: 1989, source: "https://en.wikipedia.org/wiki/Miloš_Jakeš"}
    - {name: ヴァーツラフ・ハヴェル, title: 大統領（1989年12月〜1992年7月）, from: 1989, to: 1992, source: "https://ja.wikipedia.org/wiki/ヴァーツラフ・ハヴェル"}
  periods:
    - from: 1918
      to: 1937
      text: マサリクのもとで独立したチェコ人とスロヴァキア人の国。工業の発達した中欧の民主国家として、戦間期の東欧では例外的に議会制民主主義を保った。一方、人口の約4分の1を占めるドイツ人（ズデーテン・ドイツ人）や、ハンガリー人・スロヴァキア人の自治の要求をかかえ、小協商とフランスとの同盟で安全を図った。
    - from: 1938
      to: 1938
      text: ヒトラーがズデーテン地方の割譲を求め、英仏独伊のミュンヘン会談（チェコスロヴァキアは招かれなかった）で割譲が決まった。さらにテッシェン地方をポーランドに、南スロヴァキアをハンガリーに奪われ、スロヴァキアの自治を認めた「第二共和国」となった。
    - from: 1945
      to: 1947
      text: 解放後、ベネシュ大統領のもとで戦前の国境（カルパト＝ウクライナはソ連へ）に戻った。ベネシュ布告にもとづき、約300万人のドイツ人がドイツ・オーストリアへ追放された。1946年の選挙では共産党が第一党となった。
    - from: 1948
      to: 1967
      text: 1948年2月の政変で共産党が権力を握り、ソ連型の社会主義国となった。スラーンスキー裁判（1952）などの粛清が行われ、1960年に社会主義共和国と改称した。
    - from: 1968
      to: 1988
      text: 1968年、ドプチェクが「人間の顔をした社会主義」をかかげて改革を進めた（プラハの春）が、8月にソ連などワルシャワ条約機構の軍が侵攻して鎮圧した。フサークの「正常化」のもとで改革派は追放され、ハヴェルらの「憲章77」が人権を訴えた。1969年に連邦制（チェコとスロヴァキア）となった。
    - from: 1989
      to: 1992
      text: 1989年11月の学生デモから始まった無血のビロード革命で共産党の支配が終わり、ハヴェルが大統領となった。民主化と市場経済への移行の中でチェコとスロヴァキアの対立が深まり、1992年末に連邦を解消した（ビロード離婚）。
  note: >-
    元首の欄は、その時期に実権を持つ人を書く。第一共和国と1945–1948年は大統領、共産党の時代（1948–1989）は党の第一書記・書記長、1989–1992年は大統領ハヴェル（実際の政府は首相チャルファ）。
    1939–1945年は、チェコがボヘミア＝モラヴィア保護領、スロヴァキアがスロヴァキア共和国（地図ではそれぞれの政体）。ロンドンの亡命政府（大統領ベネシュ）は連合国に承認されていた。
    ソ連軍は1968年の侵攻から1991年まで駐留したが、衛星国は占領として描かない方針。
  source:
    - "https://ja.wikipedia.org/wiki/チェコスロバキア"
    - "https://ja.wikipedia.org/wiki/プラハの春"
    - "https://ja.wikipedia.org/wiki/ビロード革命"

