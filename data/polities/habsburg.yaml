      source: "https://ja.wikipedia.org/wiki/カール6世_(神聖ローマ皇帝)"
    - name: マリア・テレジア
      title: オーストリア大公・ハンガリー女王・ボヘミア女王（皇帝ではない）
      from: 1740
      to: 1780
      source: "https://ja.wikipedia.org/wiki/マリア・テレジア"
    - name: フランツ1世（シュテファン）
      title: 神聖ローマ皇帝（マリア・テレジアの夫。共同統治者）
      from: 1745
      to: 1765
      source: "https://ja.wikipedia.org/wiki/フランツ1世_(神聖ローマ皇帝)"
    - name: ヨーゼフ2世
      title: 神聖ローマ皇帝（1765〜）。1780年まで母マリア・テレジアと共同統治
      from: 1765
      to: 1790
      source: "https://ja.wikipedia.org/wiki/ヨーゼフ2世"
    - name: レオポルト2世
      title: 神聖ローマ皇帝・オーストリア大公・ハンガリー王・ボヘミア王
      from: 1790
      to: 1792
      source: "https://ja.wikipedia.org/wiki/レオポルト2世_(神聖ローマ皇帝)"
    - name: フランツ2世（オーストリア皇帝としてはフランツ1世）
      title: 神聖ローマ皇帝（〜1806）・オーストリア皇帝（1804〜）
      from: 1792
      to: 1835
      source: "https://ja.wikipedia.org/wiki/フランツ2世_(神聖ローマ皇帝)"
  periods:
    - from: 1648
      to: 1682
      text: 三十年戦争後、ボヘミアとオーストリア諸邦でカトリック化と中央集権が進む。ハンガリーは西部・北部の王領ハンガリー、中部・南部のオスマン領、東のトランシルヴァニア公国に三分されたまま。
    - from: 1683
      to: 1699
      text: 第二次ウィーン包囲を退けた後、大トルコ戦争で反撃。ブダ奪回（1686）を経て、カルロヴィッツ条約でハンガリーのほぼ全域とトランシルヴァニアを手に入れ、ドナウの大国となる。
    - from: 1700
      to: 1739
      text: スペイン継承戦争で南ネーデルラント・ミラノ・ナポリを獲得。ハンガリーではラーコーツィの独立戦争（1703–1711）が起こる。パッサロヴィッツ条約（1718）でバナート・北セルビア（ベオグラード）・小ワラキアを得て、版図は最大となった。一方、ポーランド継承戦争でナポリ・シチリアをスペイン・ブルボン家に譲り（1735年、1738年のウィーン条約で確定）、ベオグラード条約（1739）で北セルビアと小ワラキアをオスマン帝国に返した。カール6世は国事詔書で娘マリア・テレジアの相続を各国に認めさせようと努めた。
    - from: 1740
      to: 1779
      text: マリア・テレジアの相続をめぐるオーストリア継承戦争でシュレジエンをプロイセンに奪われる。行政・軍制の改革を進め、外交革命でフランスと結んで七年戦争を戦ったが、シュレジエンは取り戻せなかった。
    - from: 1780
      to: 1791
      text: ヨーゼフ2世の啓蒙専制。宗教寛容令・農奴解放令などの急進的な改革を進めたが、ハンガリーや南ネーデルラントの反発を招き、多くは死後に撤回された。
    - from: 1792
      to: 1815
      text: 革命フランス・ナポレオンと繰り返し戦い、南ネーデルラント・チロル・ヴェネツィア・イリリアなどを次々に失う。1804年にオーストリア帝国を称し、1806年に神聖ローマ帝国が解体。ウィーン会議ではメッテルニヒが主導して領土を回復した。
  note: >-
    ハプスブルク家（1740年以降はハプスブルク＝ロートリンゲン家）の世襲領・ボヘミア王冠領・ハンガリー王冠領をまとめた政体。
    オーストリア諸邦とボヘミア王冠領は神聖ローマ帝国の内側、ハンガリー・クロアチア・トランシルヴァニアは外側（地図では overlord で区別）。
    マリア・テレジアは皇帝ではなく、1742–1745年の皇帝はバイエルンのカール7世、1745–1765年は夫フランツ1世。
    ハンガリー王としては、フェルディナント4世（1647–1654、父と共同）、レオポルト1世（1655〜）が戴冠。
    1690年代以降のトランシルヴァニア公（1765年から大公）位もハプスブルク家の君主が兼ねた。
  source:
    - "https://ja.wikipedia.org/wiki/ハプスブルク君主国"
    - "https://ja.wikipedia.org/wiki/オーストリア帝国"

- id: transylvania
  name: トランシルヴァニア公国
  short: トランシルヴァニア
  color: "#e7bf8f"
  kind: 公国
  rulers:
