  periods:
    - from: 1453
      to: 1492
      text: フリードリヒ3世の下で、ハプスブルク家の世襲領はオーストリア・内オーストリア・チロルに分かれていた。ハンガリー王マーチャーシュ1世との戦いでウィーンを奪われる（1485–1490）。
    - from: 1493
      to: 1519
      text: マクシミリアン1世が世襲領を再統一し、ブルゴーニュ公女マリとの結婚、スペイン王家との婚姻、ヤゲウォ家との二重結婚（1515年のウィーン会議）で、家の大発展の土台をつくった。
    - from: 1520
      to: 1563
      text: フェルディナント1世がオーストリアを継ぎ、モハーチの戦い（1526）の後にボヘミア王・ハンガリー王となる。オスマン帝国のスレイマン1世とハンガリーをめぐって戦い（1529年の第1次ウィーン包囲）、ハンガリーは三分された。1556年に兄カール5世が退位し、ハプスブルク家はスペイン系とオーストリア系に分かれる。
    - from: 1564
      to: 1617
      text: 世襲領はオーストリア（皇帝）・チロル・内オーストリアに分割された。オスマン帝国との長期戦争（1593–1606）、ルドルフ2世と弟マティアスの「兄弟争い」が続き、各地の新教徒の貴族が力を持った。内オーストリアでは対抗宗教改革が進んだ。
    - from: 1618
      to: 1647
      text: ボヘミアの反乱から三十年戦争が始まる。白山の戦い（1620）でボヘミアを屈服させ、カトリック化と中央集権を進めたが、戦争の後半はスウェーデン軍がボヘミア・モラヴィアに侵入し、ウィーンにも迫った（1645）。
    - from: 1648
      to: 1682
      text: 三十年戦争後、ボヘミアとオーストリア諸邦でカトリック化と中央集権が進む。ハンガリーは西部・北部の王領ハンガリー、中部・南部のオスマン領、東のトランシルヴァニア公国に三分されたまま。
    - from: 1683
      to: 1699
      text: 第二次ウィーン包囲を退けた後、大トルコ戦争で反撃。ブダ奪回（1686）を経て、カルロヴィッツ条約でハンガリーのほぼ全域とトランシルヴァニアを手に入れ、ドナウの大国となる。
    - from: 1700
      to: 1739
      text: スペイン継承戦争で南ネーデルラント・ミラノ・ナポリを獲得。ハンガリーではラーコーツィの独立戦争（1703–1711）が起こる。パッサロヴィッツ条約（1718）でバナート・北セルビア（ベオグラード）・小ワラキアを得て、版図は最大となった。一方、ポーランド継承戦争でナポリ・シチリアをスペイン・ブルボン家に譲り（1735年、1738年のウィーン条約で確定）、ベオグラード条約（1739）で北セルビアと小ワラキアをオスマン帝国に返した。カール6世は国事詔書で娘マリア・テレジアの相続を各国に認めさせようと努めた。
    - from: 1740
      to: 1779
      text: マリア・テレジアの相続をめぐるオーストリア継承戦争でシュレジエンをプロイセンに奪われる。行政・軍制の改革を進め、外交革命でフランスと結んで七年戦争を戦ったが、シュレジエンは取り戻せなかった。
    - from: 1780
      to: 1791
      text: ヨーゼフ2世の啓蒙専制。宗教寛容令・農奴解放令などの急進的な改革を進めたが、ハンガリーや南ネーデルラントの反発を招き、多くは死後に撤回された。
    - from: 1792
      to: 1815
      text: 革命フランス・ナポレオンと繰り返し戦い、南ネーデルラント・チロル・ヴェネツィア・イリリアなどを次々に失う。1804年にオーストリア帝国を称し、1806年に神聖ローマ帝国が解体。ウィーン会議ではメッテルニヒが主導して領土を回復した。
    - from: 1816
      to: 1847
      text: 宰相メッテルニヒのもとでウィーン体制の中心となり、ドイツ連邦の議長国として自由主義・ナショナリズムの運動をおさえた（三月前期）。ロンバルディア・ヴェネツィアを領有して北イタリアも支配した。一方、ハンガリーやボヘミアでは言語と文化の復興を通じて民族運動が育った。
    - from: 1848
      to: 1849
      text: 1848年革命でメッテルニヒが失脚し、ウィーン・プラハ・ブダペスト・ミラノなどで革命が起こる。農民は賦役から解放された。若いフランツ・ヨーゼフ1世が即位し、軍とクロアチアの協力でウィーンを鎮圧、独立を宣言したハンガリーもロシア軍の援助で屈服させた。
    - from: 1850
      to: 1866
      text: 新絶対主義（バッハ体制）で中央集権を進めたが、クリミア戦争で孤立し、イタリア統一戦争（1859）でロンバルディアを失った。十月勅書・二月勅令で立憲制に転じたのち、普墺戦争（1866）に敗れてヴェネトを失い、ドイツ統一から締め出された。
    - from: 1867
      to: 1877
      text: アウスグライヒ（妥協）でハンガリー王国に自治を認め、オーストリア＝ハンガリー帝国（二重帝国）となる。皇帝が両国の君主を兼ね、外交・軍事・財政だけを共通にした。オーストリア側では十二月憲法による立憲制がしかれた。
    - from: 1878
      to: 1914
      text: ベルリン会議でボスニア・ヘルツェゴヴィナの占領・行政権を得てバルカンに進出し、ドイツと同盟（独墺同盟・三国同盟）を結んでロシアやセルビアと対立した。国内ではチェコ人・南スラヴ人などの民族問題が深まり、1908年のボスニア併合を経て、1914年のサライェヴォ事件から第一次世界大戦に突入した。
    - from: 1914
      to: 1918
      text: >-
        第一次世界大戦では、ドイツとともに同盟国としてセルビア・ロシア・イタリア（1915年参戦）と戦った。ガリツィアでロシア軍に大敗し、ドイツへの依存を深める。
        1916年にフランツ・ヨーゼフ1世が死去し、カール1世が単独講和を探ったが（シクストゥス事件）失敗した。食料不足と民族運動の高まりのなか、1918年10月にチェコスロヴァキア・南スラヴ・ポーランドなどが次々に独立を宣言し、
        11月の休戦とカール1世の退位（国事の放棄）で、ハプスブルク家の帝国は解体した。
  note: >-
    ハプスブルク家（1740年以降はハプスブルク＝ロートリンゲン家）の世襲領・ボヘミア王冠領・ハンガリー王冠領をまとめた政体。
    オーストリア諸邦とボヘミア王冠領は神聖ローマ帝国の内側、ハンガリー・クロアチア・トランシルヴァニアは外側（地図では overlord で区別）。
    マリア・テレジアは皇帝ではなく、1742–1745年の皇帝はバイエルンのカール7世、1745–1765年は夫フランツ1世。
    ハンガリー王としては、フェルディナント4世（1647–1654、父と共同）、レオポルト1世（1655〜）が戴冠。
    1690年代以降のトランシルヴァニア公（1765年から大公）位もハプスブルク家の君主が兼ねた。
    1815–1866年は、オーストリア諸邦・ボヘミア王冠領などがドイツ連邦に属した（議長国）。
    1867年のアウスグライヒ以後は、オーストリア側（ツィスライタニア。帝国議会に代表を送る諸王国・諸邦）とハンガリー側（トランスライタニア。聖イシュトヴァーン王冠の諸邦で、クロアチア・スラヴォニアを含む）からなる。
    地図では両方とも owner を habsburg として1色で塗る。1848–1849年のハンガリーの独立宣言は、年末時点で描くため地図には出さない。
    1848–1867年の首相はシュヴァルツェンベルク、バッハ（内相）など。1867年以後のハンガリー首相はアンドラーシ、ティサ・カールマーンなど。
  source:
    - "https://ja.wikipedia.org/wiki/ハプスブルク君主国"
    - "https://ja.wikipedia.org/wiki/オーストリア帝国"
    - "https://ja.wikipedia.org/wiki/オーストリア＝ハンガリー帝国"
    - "https://ja.wikipedia.org/wiki/アウスグライヒ"

