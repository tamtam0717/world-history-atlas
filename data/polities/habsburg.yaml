      text: ドイツ農民戦争の波が及び、鉱夫と農民が蜂起して大司教マテウス・ラングをホーエンザルツブルク城に包囲した。
    - from: 1587
      to: 1619
      text: ヴォルフ・ディートリヒとマルクス・ジッティクスの両大司教が、町をローマ風のバロック都市に造り替えた（大聖堂の再建、ヘルブルン宮殿）。三十年戦争では中立を守った。
    - from: 1648
      to: 1730
      text: 塩の取引で栄えた帝国の聖界諸侯領。大司教たちはバロック様式でザルツブルクの町を整えた。
    - from: 1731
      to: 1732
      text: 大司教フィルミアンがプロテスタントの住民約2万人を追放。多くはプロイセン王の招きで東プロイセンへ移住した。
    - from: 1756
      to: 1803
      text: 1756年、宮廷楽団員の子としてモーツァルトが生まれる。大司教コロレドは啓蒙的な改革を進めたが、モーツァルトとは対立した。
    - from: 1803
      to: 1805
      text: 帝国代表者会議主要決議で世俗化され、トスカーナを失ったフェルディナント大公の選帝侯領となる。1805年のプレスブルク条約でオーストリアに併合された。
  note: 1805年オーストリア領、1810年バイエルン領、1816年のミュンヘン条約でオーストリア領に戻り、ザルツブルク公国としてオーストリアの一州となる（1849年から独立した王冠領）。
  source:
