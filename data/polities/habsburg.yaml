  periods:
    - from: 1918
      to: 1919
      text: 帝国の解体で、ドイツ語地域だけの小国「ドイツ＝オーストリア共和国」が生まれ、ドイツとの合併を望んだ。しかしサン＝ジェルマン条約（1919）で合併を禁じられ、南チロル・ズデーテン地方・南シュタイアーマルクなどを失い、国名もオーストリア共和国とされた。
    - from: 1920
      to: 1932
      text: 第一共和国。巨大な首都ウィーンと縮んだ国土の不釣り合いのなかで、インフレと失業に苦しんだ。社会民主党の「赤いウィーン」とキリスト教社会党の地方が対立し、両派の武装団体（防衛同盟・護国団）が衝突した（1927年の司法宮炎上）。
    - from: 1933
      to: 1938
      text: ドルフース首相が議会を停止し、1934年の内戦で社会民主党を弾圧して、カトリックとイタリアに頼る権威主義の身分制国家（オーストロファシズム）をつくった。ナチスの一揆でドルフースは暗殺され、後継のシュシュニックも1938年3月にドイツに併合された（アンシュルス）。
    - from: 1945
      to: 1955
      text: 第二次世界大戦の後、4月にレンナーの臨時政府が独立を回復したが、米英仏ソの4か国に分割占領された（ウィーンも4か国の共同占領）。国民党と社会党の大連立で復興を進め、1955年の国家条約で主権を回復し、永世中立を宣言した。
    - from: 1956
      to: 1994
      text: 東西の間の中立国として、国連の機関（ウィーン国際センター）や東西の会談の場となった。クライスキー首相（1970–1983）のもとで福祉国家が整った。ハンガリー事件（1956）やチェコ事件（1968）、1989年の東欧の変革では、多くの難民を受け入れた。
    - from: 1995
      text: 1995年に欧州連合（EU）に加盟し、ユーロも導入した（1999年。紙幣・硬貨は2002年）。中立は保ったまま、東欧の EU 加盟で中欧の中心としての役割が強まった。右派の自由党の伸長と連立の組み替えが続いている。
  note: >-
    元首の欄は、実権を持つ首相（連邦首相）を書く。大統領は国民の直接選挙で選ばれるが、ふだんの政治は首相と内閣が担う。
    1938–1945年はドイツの一部（地図では germany）で、オストマルク、のちアルプス・ドナウ帝国大管区と呼ばれた。
    1945–1955年の占領期は、地図では占領地区ごとに占領国の色（斜線）で塗る。この間もオーストリア政府はあった（大統領レンナー、首相フィーグル）。
    2016年5月のファイマン辞任後の約1週間は、副首相ミッターレーナーが首相代行を務めた。
  source:
    - "https://ja.wikipedia.org/wiki/オーストリア第一共和国"
    - "https://ja.wikipedia.org/wiki/連合軍軍政期_(オーストリア)"
    - "https://en.wikipedia.org/wiki/List_of_chancellors_of_Austria"

