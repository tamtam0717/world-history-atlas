      to: 1662
    - name: アパフィ・ミハーイ1世
      title: トランシルヴァニア公
      from: 1661
      to: 1690
      source: "https://en.wikipedia.org/wiki/Michael_I_Apafi"
    - name: テケリ・イムレ
      title: トランシルヴァニア公（オスマン帝国が擁立。実効支配は短期間）
      from: 1690
      to: 1690
    - name: アパフィ・ミハーイ2世
      title: トランシルヴァニア公（名目のみ。1697年に退位）
      from: 1690
      to: 1697
  periods:
    - from: 1648
      to: 1660
      text: オスマン帝国の宗主権の下で、カルヴァン派のラーコーツィ家が治める半独立の公国。ラーコーツィ・ジェルジ2世がスウェーデンと組んでポーランドに遠征して大敗し（1657）、オスマン帝国の懲罰を受けて国土が荒廃した。
    - from: 1661
      to: 1686
      text: オスマン帝国が擁立したアパフィ・ミハーイ1世の下で、宗主国への従属が強まる。
    - from: 1687
      to: 1699
      text: 大トルコ戦争の中で皇帝軍が進駐し、レオポルト1世の「ディプロマ・レオポルディヌム」（1690）でハプスブルク家の支配下に入る。カルロヴィッツ条約（1699）でオスマン帝国も承認した。
  note: >-
    1699年以降はハプスブルク家の君主がトランシルヴァニア公（1765年から大公）を兼ね、地図では owner を habsburg とする（ピースの所属は担当 E）。
    ラーコーツィ・フェレンツ2世が1704年に公に選ばれたが、独立戦争中の一時的なもの。
    ハンガリー東部の「パルティウム」（ビハール、サボルチ、サトマールなど）も一時この公国に属した。
  source:
    - "https://ja.wikipedia.org/wiki/トランシルヴァニア公国"

- id: thokoly
  name: 上部ハンガリー公国（テケリ・イムレ）
  short: テケリ
  color: "#e9b3a2"
  kind: 公国
  rulers:
    - name: テケリ・イムレ
      title: 上部ハンガリー公（オスマン帝国が承認）
      from: 1682
      to: 1685
      source: "https://en.wikipedia.org/wiki/Principality_of_Upper_Hungary"
  periods:
    - from: 1682
      to: 1685
      text: ハプスブルク家に反抗したクルツ（反乱軍）の指導者テケリが、オスマン帝国の後ろ盾で上部ハンガリー（現スロヴァキア東部・ハンガリー北東部）を支配した短命の国。1683年のウィーン包囲ではオスマン側に立った。
  note: 範囲はおおよそ（要確認）。1685年にテケリがオスマン側に捕らえられ、皇帝軍が上部ハンガリーを回復した。

