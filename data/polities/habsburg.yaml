      note: 首相はヴォイテフ・トゥカ（1939–1944）、シュテファン・ティソ（1944–1945）。戦後、ティソは処刑された。
      source: "https://en.wikipedia.org/wiki/Jozef_Tiso"
    - {name: ヴラジミール・メチアル, title: 首相（民主スロヴァキア運動）, from: 1993, to: 1994, source: "https://en.wikipedia.org/wiki/Vladimír_Mečiar"}
    - {name: ヨゼフ・モラフチーク, title: 首相, from: 1994, to: 1994, source: "https://en.wikipedia.org/wiki/Jozef_Moravčík"}
    - {name: ヴラジミール・メチアル, title: 首相（2度目）, from: 1994, to: 1998, source: "https://en.wikipedia.org/wiki/Vladimír_Mečiar"}
