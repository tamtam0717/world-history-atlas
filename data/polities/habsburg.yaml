      source: "https://ja.wikipedia.org/wiki/マーチャーシュ1世"
    - name: ルドヴィーク（ハンガリー王ラヨシュ2世）
      title: ボヘミア王
      from: 1516
      to: 1526
      source: "https://ja.wikipedia.org/wiki/ラヨシュ2世"
    - name: フェルディナント1世
      title: ボヘミア王（ハプスブルク家。神聖ローマ皇帝 1556〜）
      from: 1526
      to: 1564
      source: "https://ja.wikipedia.org/wiki/フェルディナント1世_(神聖ローマ皇帝)"
    - name: マクシミリアン2世
      title: ボヘミア王・神聖ローマ皇帝
      from: 1564
      to: 1576
      source: "https://ja.wikipedia.org/wiki/マクシミリアン2世_(神聖ローマ皇帝)"
    - name: ルドルフ2世
      title: ボヘミア王・神聖ローマ皇帝。プラハに宮廷を置く
      from: 1576
      to: 1611
      source: "https://ja.wikipedia.org/wiki/ルドルフ2世_(神聖ローマ皇帝)"
    - name: マティアス
      title: ボヘミア王・神聖ローマ皇帝
      from: 1611
      to: 1619
      source: "https://ja.wikipedia.org/wiki/マティアス_(神聖ローマ皇帝)"
    - name: フェルディナント2世
      title: ボヘミア王（1617年戴冠。1619年に反乱した諸身分が廃位を宣言）
      from: 1617
      to: 1619
      source: "https://ja.wikipedia.org/wiki/フェルディナント2世_(神聖ローマ皇帝)"
    - name: フリードリヒ5世（冬王）
      title: ボヘミア王（プファルツ選帝侯。反乱した諸身分が選ぶ。白山の戦いの後に亡命）
      from: 1619
      to: 1620
      source: "https://ja.wikipedia.org/wiki/フリードリヒ5世_(プファルツ選帝侯)"
  periods:
    - from: 1453
      to: 1471
      text: フス戦争の後、フス派（穏健派のウトラキスト）の貴族イジー・ス・ポジェブラトが摂政から王となった。教皇に破門され、カトリック派とハンガリー王マーチャーシュ1世との戦争（ボヘミア戦争 1468–1478）になる。
    - from: 1471
      to: 1525
      text: ヤゲウォ家のヴラジスラフ2世の下で、モラヴィア・シュレジエン・ラウジッツは1490年までマーチャーシュ1世が支配した。クトナー・ホラの宗教和議（1485）でカトリックとウトラキストの共存が認められ、王権は弱まり貴族と都市が国を動かした。
    - from: 1526
      to: 1617
      text: モハーチの戦いの後、諸身分がハプスブルク家のフェルディナント1世を王に選ぶ。ルター派・兄弟団などの新教徒が多数を占め、ルドルフ2世は宮廷をプラハに置いて学芸を保護し、1609年の勅許状で信仰の自由を認めた。
    - from: 1618
      to: 1620
      text: プラハ窓外投擲事件（1618）で新教徒の諸身分が反乱を起こし、三十年戦争が始まる。フェルディナント2世を廃してプファルツ選帝侯フリードリヒ5世を王に選んだが、1620年の白山の戦いで敗れた。以後はハプスブルク家の世襲王国（地図ではオーストリアの色）。
  note: >-
    ボヘミア王冠領（ボヘミア・モラヴィア・シュレジエン・上下ラウジッツ）の王国。神聖ローマ帝国の選帝侯国の一つ。
    1526年からはハプスブルク家の王だが、諸身分が王を選ぶ選挙王国だったので、地図では1619年まで独自の色で描き（同君連合）、
    白山の戦い（1620）の後はハプスブルク家の領域（habsburg）として描く。1469–1490年のモラヴィア・シュレジエン・ラウジッツはハンガリー（マーチャーシュ1世）の色。
  source:
    - "https://ja.wikipedia.org/wiki/ボヘミア王国"
    - "https://ja.wikipedia.org/wiki/ボヘミアの反乱"

