    - {name: ロベルト・フィツォ, title: 首相（2度目）, from: 2012, to: 2018, source: "https://en.wikipedia.org/wiki/Robert_Fico"}
    - {name: ペテル・ペッレグリーニ, title: 首相, from: 2018, to: 2020, source: "https://en.wikipedia.org/wiki/Peter_Pellegrini"}
    - {name: イゴル・マトヴィチ, title: 首相, from: 2020, to: 2021, source: "https://en.wikipedia.org/wiki/Igor_Matovič"}
    - {name: エドゥアルド・ヘゲル, title: 首相, from: 2021, to: 2023, source: "https://en.wikipedia.org/wiki/Eduard_Heger"}
    - {name: ルドヴィート・オードル, title: 首相（選挙管理内閣）, from: 2023, to: 2023, source: "https://en.wikipedia.org/wiki/Ľudovít_Ódor"}
    - {name: ロベルト・フィツォ, title: 首相（3度目）, from: 2023, source: "https://en.wikipedia.org/wiki/Robert_Fico"}
  periods:
    - from: 1939
      to: 1943
      text: チェコ解体の際、ヒトラーの圧力でティソが独立を宣言し、ドイツと「保護条約」を結んだ衛星国。スロヴァキア人民党の一党独裁のもとで、ポーランド・ソ連への侵攻に加わり、約7万人のユダヤ人を収容所へ移送した。
    - from: 1944
      to: 1945
      text: 1944年8月、反ファシズムの勢力がスロヴァキア民族蜂起を起こしたが、ドイツ軍に鎮圧され、国土はドイツ軍の占領下に置かれた。1945年4月までにソ連軍などが解放し、チェコスロヴァキアに戻った。
    - from: 1993
      to: 2003
      text: 1993年1月1日、チェコスロヴァキアの連邦解消で独立。メチアル首相の強権的な政治で欧米の統合から取り残されかけたが、1998年のズリンダ政権から改革を進めた。
    - from: 2004
      text: 2004年に NATO・EU に加盟し、2009年にユーロを導入した。自動車工業が成長した。フィツォ首相の政権が長く続き、2018年の記者殺害事件では大規模な抗議が起こった。2024年にはフィツォ首相が銃撃される事件があった。
  note: >-
    同じ政体で 1939–1945年のスロヴァキア共和国（ドイツの衛星国）と 1993年以後の独立国を表す（その間はチェコスロヴァキアの一部）。
    元首の欄は、1939–1945年はティソ、1993年以後は実権を持つ首相を書く（大統領は1999年から国民の直接選挙だが、権限は限られる）。
    1939–1945年は宗主権（overlord）を付けない。保護条約でドイツ軍の駐留を認めたが、国家として各国に承認されていた。
  source:
    - "https://en.wikipedia.org/wiki/Slovak_Republic_(1939–1945)"
    - "https://ja.wikipedia.org/wiki/スロバキア"

