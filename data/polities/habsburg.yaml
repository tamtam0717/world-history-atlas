    ハンガリー側（トランスライタニア）を示す。ハンガリー本土・トランシルヴァニア（1867年に統合）・現スロヴァキア・カルパト＝ウクライナ・
    バナート・バーチカ（ヴォイヴォディナ）・フィウメ（1868年から王冠に直属する「分離体」）と、自治を持つクロアチア＝スラヴォニア王国（1868年のナゴドバ）を含む。
    地図では owner を habsburg のまま1色で塗り、この外枠でハンガリー側を囲む。
    軍政国境地帯（クロアチア・スラヴォニアの部分）は1881年にクロアチア＝スラヴォニアへ統合された（地図ではリカ・バニヤを1881年から枠に入れる。
    ヴァラジュディン国境地帯（1871）・バナート国境地帯（1872–1873）の廃止は、ピースが混ざるため1867年から枠に入れている）。
    ダルマチア・イストリアはオーストリア側、ボスニア・ヘルツェゴヴィナ（1878年占領、1908年併合）は両国の共同統治領なので枠に入れない。
  rulers:
    - name: フランツ・ヨーゼフ1世
      title: ハンガリー王（1867年6月に戴冠）・オーストリア皇帝
      from: 1867
      to: 1916
      note: ハンガリー首相はアンドラーシ・ジュラ（1867–1871）、ティサ・カールマーン（1875–1890）、ティサ・イシュトヴァーン（1903–1905、1913–1917）など。
      source: "https://ja.wikipedia.org/wiki/フランツ・ヨーゼフ1世"
    - name: カーロイ4世（オーストリア皇帝カール1世）
      title: ハンガリー王（1916年12月に戴冠）。1918年11月13日に国事への関与を放棄
      from: 1916
      to: 1918
      source: "https://ja.wikipedia.org/wiki/カール1世_(オーストリア皇帝)"
  periods:
    - from: 1867
      to: 1889
      text: アウスグライヒでハンガリーは独自の議会と政府を持つ王国となり、オーストリアとは君主・外交・軍事・共通財政だけを共有した。1868年にはクロアチアと協定（ナゴドバ）を結び、トランシルヴァニアと軍政国境地帯も統合した。
    - from: 1890
      to: 1914
      text: 首都ブダペストが急速に発展する一方、マジャール化政策がスロヴァキア人・ルーマニア人・セルビア人・クロアチア人の反発を招いた。オーストリアとの関係（共通軍の言語、関税同盟の更新）をめぐる対立も続いた。
    - from: 1915
      to: 1918
      text: 第一次世界大戦では首相ティサ・イシュトヴァーンのもとで戦争に協力したが、戦況の悪化とともに独立派が力を増した。1918年10月末のアスター革命でハンガリーは二重帝国から離れ、王冠領の解体が始まった。
  source:
    - "https://ja.wikipedia.org/wiki/オーストリア＝ハンガリー帝国"
    - "https://ja.wikipedia.org/wiki/アウスグライヒ"
    - "https://en.wikipedia.org/wiki/Lands_of_the_Crown_of_Saint_Stephen"

