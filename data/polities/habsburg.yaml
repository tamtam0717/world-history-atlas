      text: ハイドリヒが恐怖政治を行い、亡命政府の送った落下傘部隊に暗殺された（1942）。報復としてリディツェ村などが破壊された。ユダヤ人はテレジーンを経て絶滅収容所へ送られた。1945年5月のプラハ蜂起とソ連軍の進攻で解放された。
  note: 地図では owner を保護領とし、宗主権（ドイツの色の帯）で描く。法的にはドイツ国（大ドイツ国）の一部とされた。
  source:
    - "https://ja.wikipedia.org/wiki/ベーメン・メーレン保護領"

