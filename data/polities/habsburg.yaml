  periods:
    - from: 1541
      to: 1570
      text: ブダ陥落の後、サポヤイ・ヤーノシュの幼い子ヤーノシュ・ジグモンドの「東ハンガリー王国」がトランシルヴァニアとティサ川以東を治めた。オスマン帝国に貢納し、ハプスブルク家と争った。1568年のトルダの議会で宗教の自由を定めた。1570年のシュパイアー条約で王号を捨て、トランシルヴァニア公国となる。
    - from: 1571
      to: 1604
      text: バートリ家の公国。バートリ・イシュトヴァーンはポーランド王も兼ねた。長期戦争（1593–1606）ではバートリ・ジグモンドが皇帝側に付き、ワラキアのミハイ勇敢公や皇帝軍（バスタ）の支配で国土が荒れた。
    - from: 1605
      to: 1647
      text: ボチカイの反乱をきっかけに、ベトレン・ガーボル、ラーコーツィ・ジェルジ1世のもとで新教（カルヴァン派）の公国として最盛期を迎える。三十年戦争では新教側に立って皇帝と戦い、上部ハンガリーの7県を一時手に入れた。
    - from: 1648
      to: 1660
      text: オスマン帝国の宗主権の下で、カルヴァン派のラーコーツィ家が治める半独立の公国。ラーコーツィ・ジェルジ2世がスウェーデンと組んでポーランドに遠征して大敗し（1657）、オスマン帝国の懲罰を受けて国土が荒廃した。
    - from: 1661
      to: 1686
      text: オスマン帝国が擁立したアパフィ・ミハーイ1世の下で、宗主国への従属が強まる。
    - from: 1687
      to: 1699
      text: 大トルコ戦争の中で皇帝軍が進駐し、レオポルト1世の「ディプロマ・レオポルディヌム」（1690）でハプスブルク家の支配下に入る。カルロヴィッツ条約（1699）でオスマン帝国も承認した。
  note: >-
    1699年以降はハプスブルク家の君主がトランシルヴァニア公（1765年から大公）を兼ね、地図では owner を habsburg とする（ピースの所属は担当 E）。
    ラーコーツィ・フェレンツ2世が1704年に公に選ばれたが、独立戦争中の一時的なもの。
    ハンガリー東部の「パルティウム」（ビハール、サボルチ、サトマールなど）も一時この公国に属した。
  source:
    - "https://ja.wikipedia.org/wiki/トランシルヴァニア公国"

