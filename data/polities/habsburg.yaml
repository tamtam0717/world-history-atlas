    - {name: アンテ・パヴェリッチ, title: ポグラヴニク（指導者。ウスタシャの首領）, from: 1941, to: 1945, source: "https://ja.wikipedia.org/wiki/アンテ・パヴェリッチ"}
    - {name: トミスラヴ2世（スポレート公アイモーネ）, title: 国王（名目上。イタリア王家の一員で、一度も国に入らなかった。1943年に退位）, from: 1941, to: 1943, source: "https://en.wikipedia.org/wiki/Prince_Aimone,_Duke_of_Aosta"}
  periods:
    - from: 1941
      to: 1945
      text: >-
        枢軸国のユーゴスラヴィア侵攻の後、ドイツ・イタリアの後ろ盾で、極右民族主義のウスタシャがつくった国。現在のクロアチアの大部分とボスニア・ヘルツェゴヴィナを含んだが、
        ダルマチア沿岸はイタリアに割譲した。セルビア人・ユダヤ人・ロマを迫害し、ヤセノヴァツなどの収容所で多くの人々を殺害した。
        国内ではティトーのパルチザンとセルビア人のチェトニクが抵抗し、激しい内戦となった。1945年5月にパルチザンがザグレブを解放して消滅した。
  note: >-
    地図では宗主権（overlord）を付けない。ドイツとイタリアの軍が駐留し、国土の南西半分は1943年までイタリア軍の占領地域だったが、国家としては枢軸国などに承認されていた。
    ボスニア・ヘルツェゴヴィナとスレム東部（ゼムン付近まで）のピースは担当 E が描く。
  source:
    - "https://ja.wikipedia.org/wiki/クロアチア独立国"

