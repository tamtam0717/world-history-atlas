  periods:
    - from: 1648
      to: 1730
      text: 塩の取引で栄えた帝国の聖界諸侯領。大司教たちはバロック様式でザルツブルクの町を整えた。
    - from: 1731
      to: 1732
      text: 大司教フィルミアンがプロテスタントの住民約2万人を追放。多くはプロイセン王の招きで東プロイセンへ移住した。
    - from: 1756
      to: 1803
      text: 1756年、宮廷楽団員の子としてモーツァルトが生まれる。大司教コロレドは啓蒙的な改革を進めたが、モーツァルトとは対立した。
    - from: 1803
      to: 1805
      text: 帝国代表者会議主要決議で世俗化され、トスカーナを失ったフェルディナント大公の選帝侯領となる。1805年のプレスブルク条約でオーストリアに併合された。
  note: 1805年オーストリア領、1810年バイエルン領、1816年にオーストリア領に戻る（このデータの範囲では1815年はバイエルン領）。
  source:
    - "https://ja.wikipedia.org/wiki/ザルツブルク大司教領"
    - "https://en.wikipedia.org/wiki/Prince-Archbishopric_of_Salzburg"

- id: brixen
  name: ブリクセン司教領
  short: ブリクセン
  color: "#bca6dc"
  kind: 司教領
  periods:
    - from: 1648
      to: 1802
      text: チロル伯領（ハプスブルク家）に囲まれた帝国の聖界諸侯領。実際にはチロルの強い影響下にあった。
  note: >-
    ピースは担当 C（イタリアの南チロル）。1803年に世俗化されてオーストリア（チロル）に併合、1805年プレスブルク条約でチロルとともにバイエルン領、
    1810年に南部がイタリア王国へ、1814年にオーストリアへ戻る。カルニオラのブレッド周辺も1803年までこの司教領の所領だったが、
    地図ではカルニオラ（オーストリア）として描く。
  source: "https://en.wikipedia.org/wiki/Prince-Bishopric_of_Brixen"

