    - name: イジー・ス・ポジェブラト
      title: ボヘミア王（フス派穏健派＝ウトラキストの貴族から選ばれた王）
      from: 1458
      to: 1471
      source: "https://ja.wikipedia.org/wiki/イジー・ス・ポジェブラト"
    - name: ヴラジスラフ2世
