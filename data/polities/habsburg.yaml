      text: オスマン帝国の宗主権の下で、カルヴァン派のラーコーツィ家が治める半独立の公国。ラーコーツィ・ジェルジ2世がスウェーデンと組んでポーランドに遠征して大敗し（1657）、オスマン帝国の懲罰を受けて国土が荒廃した。
    - from: 1661
      to: 1686
      text: オスマン帝国が擁立したアパフィ・ミハーイ1世の下で、宗主国への従属が強まる。
    - from: 1687
      to: 1699
      text: 大トルコ戦争の中で皇帝軍が進駐し、レオポルト1世の「ディプロマ・レオポルディヌム」（1690）でハプスブルク家の支配下に入る。カルロヴィッツ条約（1699）でオスマン帝国も承認した。
  note: >-
    1699年以降はハプスブルク家の君主がトランシルヴァニア公（1765年から大公）を兼ね、地図では owner を habsburg とする（ピースの所属は担当 E）。
    ラーコーツィ・フェレンツ2世が1704年に公に選ばれたが、独立戦争中の一時的なもの。
    ハンガリー東部の「パルティウム」（ビハール、サボルチ、サトマールなど）も一時この公国に属した。
  source:
    - "https://ja.wikipedia.org/wiki/トランシルヴァニア公国"

