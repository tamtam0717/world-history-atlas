  kind: 共和国（都市国家）
  rulers:
    - {name: リー・クアンユー, title: 首相, from: 1965, to: 1990, note: 1959年から自治州首相。人民行動党の長期政権で「開発独裁」型の経済成長を進めた, source: "https://ja.wikipedia.org/wiki/リー・クアンユー"}
    - {name: ゴー・チョクトン, title: 首相, from: 1990, to: 2004, source: "https://ja.wikipedia.org/wiki/ゴー・チョクトン"}
    - {name: リー・シェンロン, title: 首相, from: 2004, to: 2024, source: "https://ja.wikipedia.org/wiki/リー・シェンロン"}
    - {name: ローレンス・ウォン, title: 首相, from: 2024, to: 2025, source: "https://ja.wikipedia.org/wiki/ローレンス・ウォン"}
  periods:
    - from: 1965
      to: 2025
      text: 華人とマレー人の対立からマレーシアを離れて独立。人民行動党の政権のもとで外資を呼び込む輸出工業化・金融・中継貿易で急成長し、アジアNIEs（新興工業経済地域）の一つとなった。
  source: "https://ja.wikipedia.org/wiki/シンガポール"

- id: philippines
  name: フィリピン共和国
  names:
    - {to: 1945, name: フィリピン共和国（第一共和国・マロロス共和国）, short: フィリピン, kind: 共和国（革命政府）}
  short: フィリピン
  color: "#9ed1c0"
  kind: 共和国（大統領制）
  rulers:
    - {name: エミリオ＝アギナルド, title: 革命政府の首班→大統領, from: 1898, to: 1901, note: 1898年6月12日に独立を宣言し、1899年1月にマロロス憲法のもとで大統領となった。1901年にアメリカ軍に捕らえられた, source: "https://ja.wikipedia.org/wiki/エミリオ・アギナルド"}
    - {name: マヌエル・ロハス, title: 大統領, from: 1946, to: 1948, source: "https://ja.wikipedia.org/wiki/マヌエル・ロハス"}
    - {name: エルピディオ・キリノ, title: 大統領, from: 1948, to: 1953, source: "https://ja.wikipedia.org/wiki/エルピディオ・キリノ"}
    - {name: ラモン・マグサイサイ, title: 大統領, from: 1953, to: 1957, note: フク団の反乱を鎮めた, source: "https://ja.wikipedia.org/wiki/ラモン・マグサイサイ"}
    - {name: カルロス・ガルシア, title: 大統領, from: 1957, to: 1961, source: "https://ja.wikipedia.org/wiki/カルロス・ガルシア"}
    - {name: ディオスダド・マカパガル, title: 大統領, from: 1961, to: 1965, source: "https://ja.wikipedia.org/wiki/ディオスダド・マカパガル"}
    - {name: フェルディナンド・マルコス, title: 大統領, from: 1965, to: 1986, note: 1972年に戒厳令を出して独裁を行い、1986年の「ピープル・パワー革命」で亡命した, source: "https://ja.wikipedia.org/wiki/フェルディナンド・マルコス"}
    - {name: コラソン・アキノ, title: 大統領, from: 1986, to: 1992, source: "https://ja.wikipedia.org/wiki/コラソン・アキノ"}
    - {name: フィデル・ラモス, title: 大統領, from: 1992, to: 1998, source: "https://ja.wikipedia.org/wiki/フィデル・ラモス"}
    - {name: ジョセフ・エストラダ, title: 大統領, from: 1998, to: 2001, source: "https://ja.wikipedia.org/wiki/ジョセフ・エストラダ"}
    - {name: グロリア・マカパガル・アロヨ, title: 大統領, from: 2001, to: 2010, source: "https://ja.wikipedia.org/wiki/グロリア・マカパガル・アロヨ"}
    - {name: ベニグノ・アキノ3世, title: 大統領, from: 2010, to: 2016, source: "https://ja.wikipedia.org/wiki/ベニグノ・アキノ3世"}
    - {name: ロドリゴ・ドゥテルテ, title: 大統領, from: 2016, to: 2022, source: "https://ja.wikipedia.org/wiki/ロドリゴ・ドゥテルテ"}
    - {name: フェルディナンド・マルコス・ジュニア, title: 大統領, from: 2022, to: 2025, source: "https://ja.wikipedia.org/wiki/ボンボン・マルコス"}
  periods:
    - from: 1898
      to: 1901
      text: フィリピン革命。アギナルドがスペインからの独立を宣言し、アジアで最初の共和国（マロロス共和国）を立てたが、パリ条約でフィリピンを得たアメリカとの戦争（フィリピン＝アメリカ戦争）に敗れた。
    - from: 1946
      to: 1971
      text: 1946年7月4日に独立。アメリカとの軍事基地協定・相互防衛条約のもとで西側陣営に属し、地主層の寡頭支配が続いた。共産党系のフク団の反乱が起こった。
    - from: 1972
      to: 1985
      text: マルコス大統領が戒厳令を出して独裁を行った（開発独裁）。ミンダナオではモロ民族解放戦線（MNLF）が武装闘争を始めた。1983年に野党指導者ベニグノ・アキノが暗殺された。
    - from: 1986
      to: 2025
      text: ピープル・パワー革命（エドサ革命）で民主化。1992年に米軍基地が返還された。2016年の南シナ海の仲裁裁判で中国の主張を退ける判断を得た。2019年にミンダナオのイスラーム教徒の自治政府（バンサモロ）ができた。
  note: 1935–46年のアメリカ統治下の自治政府（コモンウェルス。大統領ケソン、1944年からオスメニャ）は、地図ではアメリカの間接統治（label）で描く。1943–45年の日本占領下の共和国は philippine_second_republic。
  source: "https://ja.wikipedia.org/wiki/フィリピン"

