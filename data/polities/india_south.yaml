      text: タープティー川の流域（都ブルハーンプル、要塞アシールガル）を治めたイスラーム王朝。北のマールワー、西のグジャラート、南のアフマドナガルという大国の間で、その時々の強国に従った。1601年にアクバルに併合された。
  note: 都ブルハーンプル（現在のマディヤ・プラデーシュ州）は北インドの担当（Z4）の範囲。在位年は要確認。
  source: "https://en.wikipedia.org/wiki/Farooqui_dynasty"
