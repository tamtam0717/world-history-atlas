    - {name: マウムーン・アブドゥル・ガユーム, title: 大統領, from: 1978, to: 2008, source: "https://en.wikipedia.org/wiki/Maumoon_Abdul_Gayoom"}
    - {name: モハメド・ナシード, title: 大統領, from: 2008, to: 2012, note: 初めての複数政党制の選挙で選ばれた, source: "https://en.wikipedia.org/wiki/Mohamed_Nasheed"}
    - {name: モハメド・ワヒード・ハサン, title: 大統領, from: 2012, to: 2013, source: "https://en.wikipedia.org/wiki/Mohammed_Waheed_Hassan"}
    - {name: アブドゥッラ・ヤーミーン, title: 大統領, from: 2013, to: 2018, source: "https://en.wikipedia.org/wiki/Abdulla_Yameen"}
    - {name: イブラーヒーム・モハメド・ソーリフ, title: 大統領, from: 2018, to: 2023, source: "https://en.wikipedia.org/wiki/Ibrahim_Mohamed_Solih"}
    - {name: モハメド・ムイズ, title: 大統領, from: 2023, to: 2025, source: "https://en.wikipedia.org/wiki/Mohamed_Muizzu"}
  periods:
    - from: 1453
      to: 1647
      text: インド洋のサンゴ礁の島々のイスラーム教のスルタン国。1558年にポルトガルがマーレを占領したが、1573年にムハンマド・タクルファーヌが追い出した。
    - from: 1648
      to: 1886
      text: インド洋のサンゴ礁の島々のイスラーム教のスルタン国。オランダ領セイロン、ついでイギリス領セイロンに貢ぎ物を送ったが、内政は自立していた。1752年にはマラバールのアラッカル家の軍に一時マーレを占領された。
    - from: 1887
      to: 1964
      text: 1887年の協定でイギリスの保護国となった（地図ではイギリスの色を薄く塗る）。第二次世界大戦中からイギリス軍が南端のガン島に基地を置いた。
    - from: 1965
      to: 2025
      text: 1965年に独立し、1968年に共和制となった。ガユーム大統領の30年の長期政権の後、2008年に複数政党制の選挙が行われた。海面の上昇で国土が水没する危険に直面している。
  note: 1648–1952年のスルタンは要確認のため省略（17世紀にはイブラーヒーム・イスカンダル1世、19世紀にはムハンマド・ムイーヌッディーン1世、ムハンマド・イマードゥッディーン4世など）
  source:
    - "https://ja.wikipedia.org/wiki/モルディブ"
    - "https://en.wikipedia.org/wiki/List_of_sultans_of_the_Maldives"

# ================================================================ 1453–1647（担当 Z5）

- id: vijayanagara
  name: ヴィジャヤナガル王国
  short: ヴィジャヤナガル
  color: "#d98a6a"
  kind: 王国（ヒンドゥー教の王国）
  rulers:
    - {name: マッリカールジュナ・ラーヤ, title: 王（サンガマ朝）, from: 1446, to: 1465, source: "https://en.wikipedia.org/wiki/Mallikarjuna_Raya"}
    - {name: ヴィルーパークシャ・ラーヤ2世, title: 王（サンガマ朝）, from: 1465, to: 1485, note: 治世中にバフマニー朝にゴア・ベルガウムを奪われた, source: "https://en.wikipedia.org/wiki/Virupaksha_Raya_II"}
    - {name: プラウダ・ラーヤ, title: 王（サンガマ朝）, from: 1485, to: 1485, source: "https://en.wikipedia.org/wiki/Sangama_dynasty"}
    - {name: サールヴァ・ナラシンハ, title: 王（サールヴァ朝）, from: 1485, to: 1491, note: 将軍から王位を奪った, source: "https://en.wikipedia.org/wiki/Saluva_Narasimha_Deva_Raya"}
    - {name: ティンマ・ブーパーラ, title: 王（サールヴァ朝）, from: 1491, to: 1491, source: "https://en.wikipedia.org/wiki/Saluva_dynasty"}
    - {name: ナラシンハ・ラーヤ2世, title: 王（サールヴァ朝）, from: 1491, to: 1505, note: 実権は将軍トゥルヴァ・ナラサ・ナーヤカにあった, source: "https://en.wikipedia.org/wiki/Narasimha_Raya_II"}
    - {name: ヴィーラナラシンハ・ラーヤ, title: 王（トゥルヴァ朝）, from: 1505, to: 1509, source: "https://en.wikipedia.org/wiki/Viranarasimha_Raya"}
    - {name: クリシュナデーヴァラーヤ, title: 王（トゥルヴァ朝）, from: 1509, to: 1529, note: 王国の最盛期。ライチュールの戦い（1520）に勝ち、カリンガ遠征で東海岸を取り戻した, source: "https://ja.wikipedia.org/wiki/クリシュナ・デーヴァ・ラーヤ"}
    - {name: アチュタ・デーヴァ・ラーヤ, title: 王（トゥルヴァ朝）, from: 1529, to: 1542, source: "https://en.wikipedia.org/wiki/Achyuta_Deva_Raya"}
    - {name: ヴェンカタ1世, title: 王（トゥルヴァ朝）, from: 1542, to: 1542, source: "https://en.wikipedia.org/wiki/Tuluva_dynasty"}
    - {name: サダーシヴァ・ラーヤ, title: 王（トゥルヴァ朝）, from: 1542, to: 1570, note: 実権は摂政ラーマ・ラーヤ（アーラヴィードゥ家。1565年のターリコータの戦いで戦死）にあった, source: "https://en.wikipedia.org/wiki/Sadasiva_Raya"}
    - {name: ティルマラ・デーヴァ・ラーヤ, title: 王（アーラヴィードゥ朝）, from: 1570, to: 1572, note: 都をペヌコンダに移した, source: "https://en.wikipedia.org/wiki/Tirumala_Deva_Raya"}
    - {name: シュリーランガ1世, title: 王（アーラヴィードゥ朝）, from: 1572, to: 1586, source: "https://en.wikipedia.org/wiki/Sriranga_I"}
    - {name: ヴェンカタ2世, title: 王（アーラヴィードゥ朝）, from: 1586, to: 1614, note: 都をチャンドラギリ、ついでヴェールールに移した。1639年のマドラスの土地の授与はその後の王の代, source: "https://en.wikipedia.org/wiki/Venkatapati_Raya"}
    - {name: シュリーランガ2世, title: 王（アーラヴィードゥ朝）, from: 1614, to: 1614, note: 即位直後に一族のジャッガ・ラーヤに殺された（継承戦争、1616年のトップールの戦い）, source: "https://en.wikipedia.org/wiki/Sriranga_II"}
    - {name: ラーマ・デーヴァ・ラーヤ, title: 王（アーラヴィードゥ朝）, from: 1617, to: 1632, source: "https://en.wikipedia.org/wiki/Rama_Deva_Raya"}
    - {name: ヴェンカタ3世, title: 王（アーラヴィードゥ朝）, from: 1632, to: 1642, note: 1639年にイギリス東インド会社にマドラスの土地を与えた（地元の領主を通じて）, source: "https://en.wikipedia.org/wiki/Venkata_III"}
    - {name: シュリーランガ3世, title: 王（アーラヴィードゥ朝）, from: 1642, to: 1646, note: ビジャープル・ゴールコンダに国を奪われ、マイソールなどに逃れた（1678年ごろまで王を名のった）, source: "https://en.wikipedia.org/wiki/Sriranga_III"}
  periods:
    - from: 1453
      to: 1508
      text: トゥンガバドラー川のほとりの都ヴィジャヤナガル（ハンピ）を中心に、南インドのほぼ全体を治めたヒンドゥー教の王国。北のバフマニー朝とライチュール地方（クリシュナ川とトゥンガバドラー川の間）を争い、15世紀後半にはゴア・ベルガウムや東海岸の一部を失った。
    - from: 1509
      to: 1564
      text: クリシュナデーヴァラーヤのもとで最盛期を迎えた。ポルトガルと馬の取引で結び、ナーヤカ（地方長官）に領地を与えて治めた（地図ではナーヤカの地も王国の色で塗る）。1565年、デカンのムスリム諸王国の連合軍にターリコータの戦いで大敗し、都は破壊された。
    - from: 1565
      to: 1646
      text: アーラヴィードゥ朝のもとでペヌコンダ・チャンドラギリ・ヴェールールに都を移して続いたが、マドゥライ・タンジャーヴール・ジンジー・マイソール・ケラディなどのナーヤカは事実上自立した（地図ではマドゥライ・タンジャーヴール・ジンジーに王国の帯を付ける）。1640年代にビジャープル・ゴールコンダに残りの領土を奪われ、滅んだ。
  source:
    - "https://ja.wikipedia.org/wiki/ヴィジャヤナガル王国"
    - "https://en.wikipedia.org/wiki/Vijayanagara_Empire"

- id: bahmani
  name: バフマニー朝
  short: バフマニー朝
  color: "#74beaa"
  kind: スルタン国
  rulers:
    - {name: アラーウッディーン・アフマド・シャー2世, title: スルタン, from: 1436, to: 1458, source: "https://en.wikipedia.org/wiki/Ala-ud-Din_Ahmad_Shah"}
    - {name: フマーユーン・シャー, title: スルタン, from: 1458, to: 1461, note: 「暴君（ザーリム）」と呼ばれた, source: "https://en.wikipedia.org/wiki/Ala-ud-Din_Humayun_Shah"}
    - {name: アフマド・シャー3世（ニザームッディーン）, title: スルタン, from: 1461, to: 1463, note: 幼い王。宰相マフムード・ガーワーンらが補佐した, source: "https://en.wikipedia.org/wiki/Nizam-ud-Din_Ahmad_III"}
    - {name: ムハンマド・シャー3世, title: スルタン, from: 1463, to: 1482, note: 宰相マフムード・ガーワーンのもとで領土が最大になったが、1481年に宰相を処刑した, source: "https://en.wikipedia.org/wiki/Muhammad_Shah_III_Lashkari"}
    - {name: マフムード・シャー, title: スルタン, from: 1482, to: 1518, note: 治世中に地方の長官が次々に自立した。実権は宰相カースィム・バリードにあった, source: "https://en.wikipedia.org/wiki/Mahmood_Shah_Bahmani_II"}
    - {name: アフマド・シャー4世, title: スルタン, from: 1518, to: 1521, source: "https://en.wikipedia.org/wiki/Bahmani_Sultanate"}
    - {name: アラーウッディーン・シャー, title: スルタン, from: 1521, to: 1522, source: "https://en.wikipedia.org/wiki/Bahmani_Sultanate"}
    - {name: ワリーウッラー・シャー, title: スルタン, from: 1522, to: 1525, source: "https://en.wikipedia.org/wiki/Bahmani_Sultanate"}
    - {name: カリームッラー・シャー, title: スルタン, from: 1525, to: 1527, note: 最後のスルタン。ビーダルから逃れた（1538年ごろまで名目上の王）, source: "https://en.wikipedia.org/wiki/Kalimullah_Shah_Bahmani"}
  periods:
    - from: 1453
      to: 1481
      text: デカン高原のイスラーム王朝で、都はビーダル。ヴィジャヤナガル王国とライチュール地方を争った。宰相マフムード・ガーワーン（ペルシア出身）のもとで西海岸のコンカン・ゴアや東のアーンドラに広がり、最大の領土になった。
    - from: 1482
      to: 1527
      text: 在来のデカン人と外来のペルシア・トルコ系の貴族の対立で弱まり、1490年ごろから地方の長官がアフマドナガル・ビジャープル・ベラール・ゴールコンダで自立した（デカンのムスリム5王国）。最後はビーダルの宰相バリード家に実権を奪われ、1527年に絶えた。
  note: 年代のずれはあるが、地図ではスルタンの名目の支配を1526年まで、ビーダル周辺に限って描く。後半のスルタンの在位は要確認。
  source:
    - "https://ja.wikipedia.org/wiki/バフマニー朝"
    - "https://en.wikipedia.org/wiki/Bahmani_Sultanate"

- id: ahmadnagar_sultanate
  name: アフマドナガル王国（ニザーム・シャーヒー朝）
  short: アフマドナガル
  color: "#c9a0c9"
  kind: スルタン国
  rulers:
    - {name: アフマド・ニザーム・シャー1世, title: スルタン, from: 1490, to: 1510, note: バフマニー朝の長官から自立し、アフマドナガルを建設した, source: "https://en.wikipedia.org/wiki/Ahmad_Nizam_Shah_I"}
    - {name: ブルハーン・ニザーム・シャー1世, title: スルタン, from: 1510, to: 1553, note: シーア派を国教とした, source: "https://en.wikipedia.org/wiki/Burhan_Nizam_Shah_I"}
    - {name: フサイン・ニザーム・シャー1世, title: スルタン, from: 1553, to: 1565, note: ターリコータの戦いに加わった, source: "https://en.wikipedia.org/wiki/Hussain_Nizam_Shah_I"}
    - {name: ムルタザー・ニザーム・シャー1世, title: スルタン, from: 1565, to: 1588, note: 1574年にベラール王国を併合した, source: "https://en.wikipedia.org/wiki/Murtaza_Nizam_Shah_I"}
    - {name: ミーラーン・フサイン, title: スルタン, from: 1588, to: 1589, source: "https://en.wikipedia.org/wiki/Ahmadnagar_Sultanate"}
    - {name: イスマーイール・ニザーム・シャー, title: スルタン, from: 1589, to: 1591, source: "https://en.wikipedia.org/wiki/Ahmadnagar_Sultanate"}
    - {name: ブルハーン・ニザーム・シャー2世, title: スルタン, from: 1591, to: 1595, source: "https://en.wikipedia.org/wiki/Burhan_Nizam_Shah_II"}
    - {name: バハードゥル・ニザーム・シャー, title: スルタン, from: 1596, to: 1600, note: 幼い王。大叔母チャーンド・ビービーがムガル軍に抵抗した。1600年のアフマドナガル陥落で捕らえられた, source: "https://en.wikipedia.org/wiki/Bahadur_Nizam_Shah"}
    - {name: ムルタザー・ニザーム・シャー2世, title: スルタン, from: 1600, to: 1610, note: エチオピア出身の宰相マリク・アンバルが立てた王, source: "https://en.wikipedia.org/wiki/Murtaza_Nizam_Shah_II"}
    - {name: ブルハーン・ニザーム・シャー3世, title: スルタン, from: 1610, to: 1631, note: 実権はマリク・アンバル（1626年没）、ついでその子ファトフ・ハーンにあった, source: "https://en.wikipedia.org/wiki/Burhan_Nizam_Shah_III"}
    - {name: フサイン・ニザーム・シャー3世, title: スルタン, from: 1631, to: 1633, note: 1633年のダウラターバード陥落で捕らえられた, source: "https://en.wikipedia.org/wiki/Ahmadnagar_Sultanate"}
    - {name: ムルタザー・ニザーム・シャー3世, title: スルタン（名目）, from: 1633, to: 1636, note: シャーハージー（シヴァージーの父）が立てた幼い王, source: "https://en.wikipedia.org/wiki/Shahaji"}
  periods:
    - from: 1490
      to: 1595
      text: バフマニー朝から自立したデカン北西部のイスラーム王朝。都アフマドナガル、1499年からはダウラターバードの要塞も持った。ビジャープル王国と争い、1565年のターリコータの戦いには連合して加わった。
    - from: 1596
      to: 1636
      text: ムガル帝国の南進を受け、1596年にベラールを割譲、1600年に都アフマドナガルが落ちた。エチオピア出身の宰相マリク・アンバルが西ガーツの山地でゲリラ戦を続けて国を保ったが、1633年にダウラターバードが落ち、1636年にムガル帝国とビジャープル王国に分けられて滅んだ。
  note: 1595–96年の短い在位の王（イブラーヒーム、アフマド2世）は省略。
  source:
    - "https://ja.wikipedia.org/wiki/ニザーム・シャーヒー朝"
    - "https://en.wikipedia.org/wiki/Ahmadnagar_Sultanate"

