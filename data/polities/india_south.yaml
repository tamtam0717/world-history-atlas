    - {name: アーディル・ハーン2世, title: スルタン, from: 1457, to: 1501, source: "https://en.wikipedia.org/wiki/Farooqui_dynasty"}
    - {name: ダーウード・ハーン, title: スルタン, from: 1501, to: 1508, source: "https://en.wikipedia.org/wiki/Farooqui_dynasty"}
    - {name: アーディル・ハーン3世, title: スルタン, from: 1509, to: 1520, note: 1508–09年の継承争いの短い在位の王（ガズニー・ハーン、アーラム・ハーン）は省略, source: "https://en.wikipedia.org/wiki/Farooqui_dynasty"}
    - {name: ミーラーン・ムハンマド・シャー1世, title: スルタン, from: 1520, to: 1537, source: "https://en.wikipedia.org/wiki/Farooqui_dynasty"}
    - {name: ミーラーン・ムバーラク・シャー, title: スルタン, from: 1537, to: 1566, source: "https://en.wikipedia.org/wiki/Farooqui_dynasty"}
    - {name: ミーラーン・ムハンマド・シャー2世, title: スルタン, from: 1566, to: 1576, source: "https://en.wikipedia.org/wiki/Farooqui_dynasty"}
    - {name: ラージャ・アリー・ハーン, title: スルタン, from: 1576, to: 1597, note: アクバルに従い、ムガル軍としてアフマドナガル攻めで戦死, source: "https://en.wikipedia.org/wiki/Raja_Ali_Khan"}
    - {name: バハードゥル・シャー, title: スルタン, from: 1597, to: 1601, note: アシールガルの城にこもったが、1601年1月にアクバルに降伏した, source: "https://en.wikipedia.org/wiki/Farooqui_dynasty"}
