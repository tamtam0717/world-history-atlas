# S3 南インド・スリランカ・モルディブ（IND の Maharashtra・Goa・Karnataka・Kerala・Tamil Nadu・Puducherry・
# Andhra Pradesh・Telangana・Andaman and Nicobar Islands・Lakshadweep、LKA、MDV）の政体（1648–2025）
# 他の担当が参照する ID：maratha・hyderabad・mysore・carnatic・travancore・kandy・sri_lanka・maldives

- id: maratha
  name: マラーター同盟
  names:
    - {to: 1673, name: マラーター（シヴァージーの勢力）, short: マラーター, kind: ビジャープル王国から自立した勢力}
    - {from: 1674, to: 1713, name: マラーター王国, short: マラーター, kind: 王国（チャトラパティ）}
    - {from: 1714, name: マラーター同盟, short: マラーター, kind: 宰相（ペーシュワー）が率いる諸侯の連合}
  short: マラーター
  color: "#f2b84b"
  kind: 王国
  rulers:
    - {name: シヴァージー, title: マラーター王（チャトラパティ）, from: 1674, to: 1680, note: 1640年代からビジャープル王国の城を奪って自立し、1674年にライガドで即位した, source: "https://ja.wikipedia.org/wiki/シヴァージー"}
    - {name: サンバージー, title: マラーター王, from: 1681, to: 1689, note: 1689年にムガル軍に捕らえられ処刑された, source: "https://en.wikipedia.org/wiki/Sambhaji"}
    - {name: ラージャーラーム, title: マラーター王, from: 1689, to: 1700, note: 南インドのジンジーにこもってムガル軍と戦った, source: "https://en.wikipedia.org/wiki/Rajaram_I"}
    - {name: シヴァージー2世（摂政ターラーバーイー）, title: マラーター王, from: 1700, to: 1707, note: 母ターラーバーイーが摂政として抗戦を指導。1710年からコールハープルの王家となった, source: "https://en.wikipedia.org/wiki/Tarabai"}
    - {name: シャーフー, title: マラーター王, from: 1707, to: 1749, note: アウラングゼーブの死後にムガルの捕囚から解放された。1713年からは宰相（ペーシュワー）が実権を握った, source: "https://en.wikipedia.org/wiki/Shahu_I"}
    - {name: バーラージー・ヴィシュヴァナート, title: ペーシュワー（宰相）, from: 1713, to: 1720, source: "https://en.wikipedia.org/wiki/Balaji_Vishwanath"}
    - {name: バージー・ラーオ1世, title: ペーシュワー, from: 1720, to: 1740, note: 北インドに勢力を広げ、1737年にデリーに迫った, source: "https://en.wikipedia.org/wiki/Baji_Rao_I"}
    - {name: バーラージー・バージー・ラーオ（ナーナー・サーヘブ）, title: ペーシュワー, from: 1740, to: 1761, note: 1749年のシャーフーの死後、王（サーターラー）は名目的になった。1761年のパーニーパットの戦いの直後に死去, source: "https://en.wikipedia.org/wiki/Balaji_Baji_Rao"}
    - {name: マーダヴ・ラーオ1世, title: ペーシュワー, from: 1761, to: 1772, source: "https://en.wikipedia.org/wiki/Madhavrao_I"}
    - {name: ナーラーヤン・ラーオ, title: ペーシュワー, from: 1772, to: 1773, note: 暗殺された, source: "https://en.wikipedia.org/wiki/Narayanrao"}
    - {name: ラグナート・ラーオ, title: ペーシュワー, from: 1773, to: 1774, note: 追われてイギリスを頼り、第1次マラーター戦争のきっかけとなった, source: "https://en.wikipedia.org/wiki/Raghunathrao"}
    - {name: サワーイー・マーダヴ・ラーオ, title: ペーシュワー, from: 1774, to: 1795, note: 幼少で、実権は大臣ナーナー・ファドナヴィースにあった, source: "https://en.wikipedia.org/wiki/Madhavrao_II"}
    - {name: バージー・ラーオ2世, title: ペーシュワー, from: 1795, to: 1818, note: 1802年のバセイン条約でイギリスの軍事保護下に入った。第3次マラーター戦争に敗れて退位させられた, source: "https://en.wikipedia.org/wiki/Baji_Rao_II"}
  periods:
    - from: 1648
      to: 1680
      text: デカン西部の山地で、シヴァージーがビジャープル王国とムガル帝国の城を奪って自立し、1674年に王として即位した。ヒンドゥー教徒の王国として、南インドのジンジーやヴェールールにも勢力を広げた。
    - from: 1681
      to: 1707
      text: アウラングゼーブがみずからデカンに来て攻めたが、マラーターは王サンバージーの処刑（1689）の後もゲリラ戦で抵抗を続けた（マラーター独立戦争）。地図ではこの時期の西デカンをムガル帝国の不確実な支配として描く。
    - from: 1708
      to: 1761
      text: 宰相（ペーシュワー）がプネーで実権を握り、シンディア・ホールカル・ガーイクワード・ボーンスレーなどの諸侯をまとめるマラーター同盟が、ムガル帝国に代わって北インドまで勢力を広げた。1761年の第3次パーニーパットの戦いでアフガン（ドゥッラーニー朝）に大敗した。
    - from: 1762
      to: 1802
      text: 勢力を立て直したが、イギリス東インド会社と第1次マラーター戦争（1775–82）を戦い、サルバイ条約で講和した。諸侯の自立が強まり、宰相の力は弱まった。
    - from: 1803
      to: 1818
      text: 宰相バージー・ラーオ2世がバセイン条約（1802）でイギリスの軍事保護を受け入れ、反発した諸侯は第2次マラーター戦争（1803–05）に敗れた。第3次マラーター戦争（1817–18）で宰相の領地はイギリスに併合され、マラーター同盟は解体した。
  note: >-
    地図では宰相（ペーシュワー）の直轄地だけでなく、シンディア（グワーリヤル）・ホールカル（インドール）・ガーイクワード（バローダ）・
    ナーグプルのボーンスレー家などの諸侯の領地も owner: maratha とし、諸侯の名を副ラベル（label）で出す。
    ナーグプルのボーンスレー家の君主：ラグージー1世（1739–55）、ジャーノージー（1755–72）、ムドージー1世（1775–88）、ラグージー2世（1788–1816）、
    アッパー・サーヘブ（1816–18）、ラグージー3世（1818–53。跡継ぎなく死去し、失権の原理で併合）。1749年のシャーフーの死後、王家はサーターラーで名目だけの存在となった。
    1802年末のバセイン条約から1817年までの宰相領は、イギリスの軍事保護下（owner: britain・indirect）として描く。
  source:
    - "https://ja.wikipedia.org/wiki/マラーター王国"
    - "https://ja.wikipedia.org/wiki/マラーター同盟"
    - "https://en.wikipedia.org/wiki/Maratha_Confederacy"

- id: kolhapur
  name: コールハープル王国
  short: コールハープル
  color: "#d9a35c"
  kind: 王国（マラーター王家の分家）
  rulers:
    - {name: シヴァージー2世（摂政ターラーバーイー）, title: コールハープルのチャトラパティ, from: 1710, to: 1714, source: "https://en.wikipedia.org/wiki/Kolhapur_State"}
    - {name: サンバージー2世, title: コールハープルのチャトラパティ, from: 1714, to: 1760, note: 1731年のワールナー条約でサーターラーのシャーフーと領地を分けた, source: "https://en.wikipedia.org/wiki/Sambhaji_II"}
  periods:
    - from: 1710
      to: 1811
      text: シヴァージーの孫をめぐる継承争いから、ターラーバーイーの系統がコールハープルに別の王家を立てた。プネーの宰相とはしばしば争った。
  note: 1812年にイギリスと条約を結んで保護下に入り、1947年まで藩王国（地図では イギリスの色を薄く塗る）。後半の君主は省略
  source: "https://en.wikipedia.org/wiki/Kolhapur_State"

- id: bijapur
  name: ビジャープル王国（アーディル・シャーヒー朝）
  short: ビジャープル
  color: "#a8c66c"
  kind: スルタン国
  rulers:
    - {name: ムハンマド・アーディル・シャー, title: スルタン, from: 1627, to: 1656, note: 巨大な墓廟ゴール・グンバズを建てた, source: "https://en.wikipedia.org/wiki/Mohammed_Adil_Shah"}
    - {name: アリー・アーディル・シャー2世, title: スルタン, from: 1656, to: 1672, source: "https://en.wikipedia.org/wiki/Ali_Adil_Shah_II"}
    - {name: シカンダル・アーディル・シャー, title: スルタン, from: 1672, to: 1686, note: 1686年にアウラングゼーブに降伏, source: "https://en.wikipedia.org/wiki/Sikandar_Adil_Shah"}
  periods:
    - from: 1648
      to: 1686
      text: デカンのイスラーム王朝。南のカルナータカやタミルの地（ジンジー）にも勢力を広げたが、シヴァージーの自立とムガル帝国の圧迫で弱まり、1686年にアウラングゼーブに滅ぼされた。
  source: "https://ja.wikipedia.org/wiki/アーディル・シャーヒー朝"

- id: golconda
  name: ゴールコンダ王国（クトゥブ・シャーヒー朝）
  short: ゴールコンダ
  color: "#6fa6c4"
  kind: スルタン国
  rulers:
    - {name: アブドゥッラー・クトゥブ・シャー, title: スルタン, from: 1626, to: 1672, note: 1656年にムガル帝国に貢納を約束した, source: "https://en.wikipedia.org/wiki/Abdullah_Qutb_Shah"}
    - {name: アブル・ハサン・クトゥブ・シャー（ターナー・シャー）, title: スルタン, from: 1672, to: 1687, note: 1687年にゴールコンダ城が落ちて捕らえられた, source: "https://en.wikipedia.org/wiki/Abul_Hasan_Qutb_Shah"}
  periods:
    - from: 1648
      to: 1687
      text: ハイデラバードを都とするデカンのイスラーム王朝。ダイヤモンドの産地で、マチリーパトナムの港はヨーロッパ商人の貿易で栄えた。1687年にアウラングゼーブに滅ぼされた。
  source: "https://ja.wikipedia.org/wiki/クトゥブ・シャーヒー朝"

- id: hyderabad
  name: ハイデラバード王国（ニザーム王国）
  short: ハイデラバード
  color: "#b7c25b"
  kind: 王国（ムガル帝国のデカン総督から自立）
  rulers:
    - {name: ニザーム・アルムルク（アーサフ・ジャー1世）, title: ニザーム, from: 1724, to: 1748, note: ムガル帝国のデカン総督。1724年にシャカル・ケーダの戦いで勝って事実上自立した, source: "https://en.wikipedia.org/wiki/Qamaruddin_Khan,_Asaf_Jah_I"}
    - {name: ナーシル・ジャング, title: ニザーム, from: 1748, to: 1750, source: "https://en.wikipedia.org/wiki/Nasir_Jung"}
    - {name: ムザッファル・ジャング, title: ニザーム, from: 1750, to: 1751, note: フランス（デュプレクス）の後ろ盾, source: "https://en.wikipedia.org/wiki/Muzaffar_Jung"}
    - {name: サラーバト・ジャング, title: ニザーム, from: 1751, to: 1762, note: フランスのビュシーが宮廷で力を持った, source: "https://en.wikipedia.org/wiki/Salabat_Jung"}
    - {name: ニザーム・アリー・ハーン（アーサフ・ジャー2世）, title: ニザーム, from: 1762, to: 1803, note: 1798年にイギリスと軍事保護条約を結んだ, source: "https://en.wikipedia.org/wiki/Nizam_Ali_Khan,_Asaf_Jah_II"}
    - {name: シカンダル・ジャー（アーサフ・ジャー3世）, title: ニザーム, from: 1803, to: 1829, source: "https://en.wikipedia.org/wiki/Sikandar_Jah,_Asaf_Jah_III"}
    - {name: ナーシル・ウッダウラ（アーサフ・ジャー4世）, title: ニザーム, from: 1829, to: 1857, note: 1853年にベラールをイギリスに委ねた, source: "https://en.wikipedia.org/wiki/Nasir-ud-Daulah,_Asaf_Jah_IV"}
    - {name: アフザル・ウッダウラ（アーサフ・ジャー5世）, title: ニザーム, from: 1857, to: 1869, note: インド大反乱ではイギリス側についた, source: "https://en.wikipedia.org/wiki/Afzal-ud-Daulah,_Asaf_Jah_V"}
    - {name: マフブーブ・アリー・ハーン（アーサフ・ジャー6世）, title: ニザーム, from: 1869, to: 1911, source: "https://en.wikipedia.org/wiki/Mahbub_Ali_Khan,_Asaf_Jah_VI"}
    - {name: ミール・オスマーン・アリー・ハーン（アーサフ・ジャー7世）, title: ニザーム, from: 1911, to: 1948, note: 当時世界有数の富豪といわれた。1948年のインド軍の侵攻（ポロ作戦）で降伏, source: "https://en.wikipedia.org/wiki/Mir_Osman_Ali_Khan"}
  periods:
    - from: 1724
      to: 1797
      text: ムガル帝国のデカン総督ニザーム・アルムルクが自立して開いた王国。名目上はムガル皇帝に従った（地図では帯を付けない）。カーナティック戦争ではフランスとイギリスがニザームの継承争いに介入し、マラーター同盟・マイソール王国とも争った。
    - from: 1798
      to: 1946
      text: 1798年にイギリスと軍事保護条約を結び、インド最大の藩王国となった（地図ではイギリスの色を薄く塗る）。1853年にはベラールをイギリスに委ねた。ニザームはイスラーム教徒、住民の多くはヒンドゥー教徒だった。
    - from: 1947
      to: 1948
      text: インドの独立に際してインドにもパキスタンにも加わらず独立を保とうとしたが、1948年9月にインド軍が侵攻し（ポロ作戦）、インドに併合された。テランガーナでは共産党が率いる農民の武装闘争も起きていた。
  source:
    - "https://ja.wikipedia.org/wiki/ニザーム王国"
    - "https://en.wikipedia.org/wiki/Hyderabad_State"

- id: mysore
  name: マイソール王国
  short: マイソール
  color: "#a98bd1"
  kind: 王国
  rulers:
    - {name: カンティーラヴァ・ナラサラージャ1世, title: マイソール王（ウォデヤル朝）, from: 1638, to: 1659, source: "https://en.wikipedia.org/wiki/Kanthirava_Narasaraja_I"}
    - {name: ドッダ・デーヴァラージャ, title: マイソール王, from: 1659, to: 1673, source: "https://en.wikipedia.org/wiki/Dodda_Devaraja"}
    - {name: チッカ・デーヴァラージャ, title: マイソール王, from: 1673, to: 1704, note: 領土を大きく広げ、1689年にムガル帝国からバンガロールを買い取った, source: "https://en.wikipedia.org/wiki/Chikka_Devaraja"}
    - {name: カンティーラヴァ・ナラサラージャ2世, title: マイソール王, from: 1704, to: 1714, source: "https://en.wikipedia.org/wiki/Mysore_Kingdom"}
    - {name: クリシュナラージャ1世, title: マイソール王, from: 1714, to: 1732, source: "https://en.wikipedia.org/wiki/Krishnaraja_Wadiyar_I"}
    - {name: クリシュナラージャ2世, title: マイソール王, from: 1734, to: 1766, note: 実権は大臣（ダラヴァーイー）兄弟、1761年からはハイダル・アリーにあった, source: "https://en.wikipedia.org/wiki/Krishnaraja_Wadiyar_II"}
    - {name: ハイダル・アリー, title: 実権者（サルヴァーディカーリー）, from: 1761, to: 1782, note: 軍人から実権を握り、王は名目的になった。第1次・第2次マイソール戦争, source: "https://ja.wikipedia.org/wiki/ハイダル・アリー"}
    - {name: ティプー・スルタン, title: スルタン, from: 1782, to: 1799, note: 1799年、都シュリーランガパトナで戦死, source: "https://ja.wikipedia.org/wiki/ティプー・スルタン"}
    - {name: クリシュナラージャ3世, title: マイソール王, from: 1799, to: 1868, note: イギリスが5歳でウォデヤル家を復位させた。1831年に統治をイギリスに取り上げられた, source: "https://en.wikipedia.org/wiki/Krishnaraja_Wadiyar_III"}
    - {name: チャーマラージャ10世, title: マイソール王, from: 1868, to: 1894, note: 1881年に統治権を返された, source: "https://en.wikipedia.org/wiki/Chamarajendra_Wadiyar_X"}
    - {name: クリシュナラージャ4世, title: マイソール王, from: 1894, to: 1940, note: 「模範藩王国」と呼ばれる近代化を進めた, source: "https://en.wikipedia.org/wiki/Krishna_Raja_Wadiyar_IV"}
    - {name: ジャヤチャーマラージャ, title: マイソール王, from: 1940, to: 1950, note: 1947年にインドに加わった, source: "https://en.wikipedia.org/wiki/Jayachamarajendra_Wadiyar"}
  periods:
    - from: 1648
      to: 1760
      text: ヴィジャヤナガル王国の滅亡後に自立したウォデヤル朝の王国。17世紀後半にチッカ・デーヴァラージャのもとでカルナータカ南部からタミルのコング地方まで広がった。
    - from: 1761
      to: 1799
      text: ハイダル・アリーとその子ティプー・スルタンが実権を握り、マラバール・カナラ・ベラリーなどに大きく広がった。フランスと結んでイギリスと4回戦った（マイソール戦争）が、1792年に領土の半分を失い、1799年に都が落ちてティプーは戦死した。
    - from: 1800
      to: 1946
      text: イギリスはウォデヤル家を復位させ、縮小したマイソールを軍事保護下の藩王国とした。1831–1881年はイギリスの弁務官が直接治めた。20世紀には産業・教育の近代化が進んだ。
  source:
    - "https://ja.wikipedia.org/wiki/マイソール王国"
    - "https://en.wikipedia.org/wiki/Kingdom_of_Mysore"

- id: keladi
  name: ケラディ・ナーヤカ朝（イッケリ）
  short: ケラディ
  color: "#9fc19a"
  kind: 王国（ナーヤカ）
  rulers:
    - {name: シヴァッパ・ナーヤカ, title: ケラディの王, from: 1645, to: 1660, note: ポルトガル人をカナラ海岸の港から追った, source: "https://en.wikipedia.org/wiki/Shivappa_Nayaka"}
    - {name: ケラディ・チェンナンマ, title: ケラディの女王, from: 1672, to: 1697, note: シヴァージーの子ラージャーラームをかくまい、ムガル軍と戦った, source: "https://en.wikipedia.org/wiki/Keladi_Chennamma"}
  periods:
    - from: 1648
      to: 1763
      text: ヴィジャヤナガル王国のナーヤカ（地方長官）から自立し、イッケリ・ベドヌールを都にカナラ海岸の胡椒・米の貿易で栄えた。1763年にハイダル・アリーに滅ぼされた。
  source: "https://en.wikipedia.org/wiki/Keladi_Nayaka"

- id: sonda
  name: スンダ（ソーデ）王国
  short: スンダ
  color: "#b3c9a0"
  kind: 王国（ナーヤカ）
  periods:
    - from: 1648
      to: 1763
      text: カナラ北部（ウッタラ・カンナダ）の山地の小王国。ビジャープル王国に貢納し、のちケラディ・マラーターと争った。1763年にハイダル・アリーに征服された。カールワールの港にはイギリスの商館もあった。
  source: "https://en.wikipedia.org/wiki/Sonda_Kingdom"

- id: chitradurga
  name: チトラドゥルガのナーヤカ
  short: チトラドゥルガ
  color: "#c7aaa4"
  kind: ナーヤカ（パーレーガール）の領国
  periods:
    - from: 1648
      to: 1779
      text: ヴィジャヤナガル王国のもとの地方領主（パーレーガール）が自立した小国。ビジャープル王国・ムガル帝国・マラーターに貢納しながら山城を守ったが、1779年にハイダル・アリーに滅ぼされた。
  note: ダーヴァナゲレ周辺のハラパナハッリなどの領主もここにまとめた
  source: "https://en.wikipedia.org/wiki/Nayakas_of_Chitradurga"

- id: coorg
  name: コダグ王国（クールグ）
  short: コダグ
  color: "#b590ad"
  kind: 王国（ハレーリ朝）
  rulers:
    - {name: ドッダ・ヴィーラ・ラージェーンドラ, title: コダグ王, from: 1780, to: 1809, note: 1788年にマイソールの支配から脱し、イギリスと同盟した, source: "https://en.wikipedia.org/wiki/Dodda_Vira_Rajendra"}
    - {name: チッカ・ヴィーラ・ラージェーンドラ, title: コダグ王, from: 1820, to: 1834, note: 1834年にイギリスに退位させられ、コダグは併合された, source: "https://en.wikipedia.org/wiki/Chikka_Virarajendra"}
  periods:
    - from: 1648
      to: 1834
      text: 西ガーツ山脈の山国。ハレーリ朝の王が治めた。1770年代からマイソールに占領されたが、1788–90年に回復した。1834年にイギリスに併合された。
  note: 1780–88年のマイソールの支配の後、地図では1790年からコダグとして描く
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Coorg"

- id: madurai
  name: マドゥライ・ナーヤカ朝
  short: マドゥライ
  color: "#e3b37c"
  kind: 王国（ナーヤカ）
  rulers:
    - {name: ティルマライ・ナーヤカ, title: マドゥライの王, from: 1623, to: 1659, note: マドゥライのミーナークシ寺院の塔門や宮殿を建てた, source: "https://en.wikipedia.org/wiki/Thirumalai_Nayak"}
    - {name: チョッカナータ・ナーヤカ, title: マドゥライの王, from: 1659, to: 1682, note: 都をティルチラーッパッリに移し、1673年にタンジャーヴールを滅ぼした, source: "https://en.wikipedia.org/wiki/Chokkanatha_Nayak"}
    - {name: ランガ・クリシュナ・ムットゥ・ヴィーラッパ, title: マドゥライの王, from: 1682, to: 1689, source: "https://en.wikipedia.org/wiki/Madurai_Nayak_dynasty"}
    - {name: マンガンマール, title: 女王（摂政）, from: 1689, to: 1706, source: "https://en.wikipedia.org/wiki/Rani_Mangammal"}
    - {name: ヴィジャヤ・ランガ・チョッカナータ, title: マドゥライの王, from: 1706, to: 1732, source: "https://en.wikipedia.org/wiki/Madurai_Nayak_dynasty"}
    - {name: ミーナークシ, title: 女王, from: 1732, to: 1736, note: カーナティックのチャンダー・サーヒブに捕らえられ、王朝は絶えた, source: "https://en.wikipedia.org/wiki/Meenakshi_(Madurai_Nayak)"}
  periods:
    - from: 1648
      to: 1736
      text: ヴィジャヤナガル王国の地方長官から自立したタミル南部の王国。ポリガール（地方領主）の制度で治めた。17世紀後半からはマイソールやマラーターに押され、1736年にカーナティック太守に滅ぼされた。
  source: "https://en.wikipedia.org/wiki/Madurai_Nayak_dynasty"

- id: thanjavur
  name: タンジャーヴール王国
  names:
    - {to: 1673, name: タンジャーヴール・ナーヤカ朝, short: タンジャーヴール, kind: 王国（ナーヤカ）}
    - {from: 1674, name: タンジャーヴール・マラーター王国, short: タンジャーヴール, kind: 王国（マラーターの王家）}
  short: タンジャーヴール
  color: "#d0a06e"
  kind: 王国
  rulers:
    - {name: ヴィジャヤラーガヴァ・ナーヤカ, title: タンジャーヴールの王, from: 1633, to: 1673, note: マドゥライのナーヤカとの戦いで敗死, source: "https://en.wikipedia.org/wiki/Thanjavur_Nayak_kingdom"}
    - {name: エーコージー（ヴェンコージー）, title: タンジャーヴールの王, from: 1675, to: 1684, note: シヴァージーの異母弟。ビジャープル王国の将としてタンジャーヴールを奪って王となった, source: "https://en.wikipedia.org/wiki/Venkoji"}
    - {name: シャーフージー1世, title: タンジャーヴールの王, from: 1684, to: 1712, source: "https://en.wikipedia.org/wiki/Thanjavur_Maratha_kingdom"}
    - {name: サルフォージー1世, title: タンジャーヴールの王, from: 1712, to: 1728, source: "https://en.wikipedia.org/wiki/Thanjavur_Maratha_kingdom"}
    - {name: プラタープシング, title: タンジャーヴールの王, from: 1739, to: 1763, source: "https://en.wikipedia.org/wiki/Pratapsingh_of_Thanjavur"}
    - {name: トゥラジャージー, title: タンジャーヴールの王, from: 1763, to: 1787, note: 1773–76年にカーナティック太守に国を奪われた, source: "https://en.wikipedia.org/wiki/Thuljaji"}
    - {name: アマル・シング, title: タンジャーヴールの王, from: 1787, to: 1798, source: "https://en.wikipedia.org/wiki/Amar_Singh_of_Thanjavur"}
    - {name: サルフォージー2世, title: タンジャーヴールの王, from: 1798, to: 1832, note: 1799年に統治をイギリスに譲り、城と年金だけが残された, source: "https://en.wikipedia.org/wiki/Serfoji_II"}
  periods:
    - from: 1648
      to: 1798
      text: カーヴェーリ川の三角州の豊かな米どころ。ナーヤカ朝がマドゥライに滅ぼされた後（1673）、ビジャープル王国の将エーコージー（シヴァージーの異母弟）が王となり、マラーター人の王家が続いた。1799年に統治をイギリスに譲った。
  note: 1676–1738年のほかの君主は省略
  source:
    - "https://en.wikipedia.org/wiki/Thanjavur_Nayak_kingdom"
    - "https://en.wikipedia.org/wiki/Thanjavur_Maratha_kingdom"

- id: ramnad
  name: ラームナード（セードゥパティ家）
  short: ラームナード
  color: "#d7c69b"
  kind: 領国（セードゥパティ）
  rulers:
    - {name: キラヴァン・セードゥパティ, title: ラームナードの領主, from: 1671, to: 1710, note: マドゥライ・ナーヤカ朝から事実上自立した, source: "https://en.wikipedia.org/wiki/Kilavan_Sethupathi"}
  periods:
    - from: 1648
      to: 1772
      text: ラーメーシュワラムへの巡礼路を守る「セードゥパティ」の家が治めたタミル南東部の領国。マドゥライ・ナーヤカ朝に従ったが、17世紀末に自立した。1730年ごろシヴァガンガが分かれた。1772年にカーナティック太守に攻め落とされた。
  source: "https://en.wikipedia.org/wiki/Ramnad_estate"

- id: pudukkottai
  name: プドゥッコーッタイ（トンダイマーン家）
  short: プドゥッコーッタイ
  color: "#c8a3d2"
  kind: 領国
  periods:
    - from: 1686
      to: 1800
      text: ラームナードのセードゥパティ家に仕えたトンダイマーン家が自立した小国。カーナティック戦争ではイギリス側についた。1801年以後はイギリスの保護下の藩王国となり、1948年にインドに合流した。
  source: "https://en.wikipedia.org/wiki/Pudukkottai_State"

- id: carnatic
  name: カーナティック太守領（アルコット太守）
  short: カーナティック
  color: "#8aa5d6"
  kind: 太守領（ナワーブ）
  rulers:
    - {name: サアーダトゥッラー・ハーン1世, title: カーナティック太守, from: 1710, to: 1732, source: "https://en.wikipedia.org/wiki/Saadatullah_Khan_I"}
    - {name: ドースト・アリー・ハーン, title: カーナティック太守, from: 1732, to: 1740, note: マラーター軍との戦いで戦死, source: "https://en.wikipedia.org/wiki/Dost_Ali_Khan"}
    - {name: サフダル・アリー・ハーン, title: カーナティック太守, from: 1740, to: 1742, source: "https://en.wikipedia.org/wiki/Safdar_Ali_Khan"}
    - {name: アンワルッディーン・ハーン, title: カーナティック太守, from: 1744, to: 1749, note: アンブールの戦いでフランス軍に敗死, source: "https://en.wikipedia.org/wiki/Anwaruddin_Muhammed_Khan"}
    - {name: チャンダー・サーヒブ, title: カーナティック太守（フランスが支持）, from: 1749, to: 1752, source: "https://en.wikipedia.org/wiki/Chanda_Sahib"}
    - {name: ムハンマド・アリー・ハーン・ワーラージャー, title: カーナティック太守（イギリスが支持）, from: 1749, to: 1795, note: イギリス東インド会社に巨額の借金をし、従属を深めた, source: "https://en.wikipedia.org/wiki/Muhammad_Ali_Khan_Wallajah"}
    - {name: ウムダト・ウル・ウマラー, title: カーナティック太守, from: 1795, to: 1801, source: "https://en.wikipedia.org/wiki/Umdat_ul-Umara"}
  periods:
    - from: 1710
      to: 1743
      text: ムガル帝国のカーナティック（南東インド）の太守が、アルコットを都に事実上自立した。1736年にマドゥライ・ナーヤカ朝を滅ぼした。名目上はハイデラバードのニザームに従った（地図では帯を付けない）。
    - from: 1744
      to: 1763
      text: 太守の継承争いにフランスとイギリスが介入し、カーナティック戦争（1744–63）が起きた。デュプレクスのフランスに対し、クライヴのアルコット防衛（1751）からイギリスが優位に立ち、1761年にポンディシェリが落ちてフランスの勢力は衰えた。
    - from: 1764
      to: 1801
      text: イギリスが支持するムハンマド・アリーが太守となったが、会社への借金と軍の駐留で従属が深まり、1792年の条約で統治の多くを会社に委ねた（地図では1792年からイギリスの色を薄く塗る）。1801年に会社が統治権を取り上げ、マドラス管区に組み入れた。
  note: 1692–1710年のズルフィカール・ハーン、ダーウード・ハーンはムガル帝国の将として地図では mughal に含める
  source:
    - "https://ja.wikipedia.org/wiki/カーナティック戦争"
    - "https://en.wikipedia.org/wiki/Carnatic_Sultanate"

- id: travancore
  name: トラヴァンコール王国
  names:
    - {to: 1728, name: ヴェーナード王国, short: ヴェーナード, kind: 王国}
  short: トラヴァンコール
  color: "#5fae7d"
  kind: 王国
  rulers:
    - {name: マールターンダ・ヴァルマ, title: トラヴァンコール王, from: 1729, to: 1758, note: 1741年のコラチェルの戦いでオランダ東インド会社を破り、周りの小王国を併合した, source: "https://en.wikipedia.org/wiki/Marthanda_Varma"}
    - {name: カールティカ・ティルナール・ラーマ・ヴァルマ（ダルマ・ラージャ）, title: トラヴァンコール王, from: 1758, to: 1798, note: ティプー・スルタンの攻撃（1789）を防いだ, source: "https://en.wikipedia.org/wiki/Dharma_Raja"}
    - {name: バララーマ・ヴァルマ, title: トラヴァンコール王, from: 1798, to: 1810, note: 1809年に大臣ヴェールタンピがイギリスに反乱を起こした, source: "https://en.wikipedia.org/wiki/Balarama_Varma"}
    - {name: ゴウリ・ラクシュミー・バーイー, title: トラヴァンコール女王（摂政）, from: 1810, to: 1815, source: "https://en.wikipedia.org/wiki/Gowri_Lakshmi_Bayi"}
    - {name: ゴウリ・パールヴァティー・バーイー, title: 摂政, from: 1815, to: 1829, source: "https://en.wikipedia.org/wiki/Gowri_Parvathi_Bayi"}
    - {name: スワーティ・ティルナール, title: トラヴァンコール王, from: 1829, to: 1846, note: 音楽家としても名高い, source: "https://en.wikipedia.org/wiki/Swathi_Thirunal_Rama_Varma"}
    - {name: ウットラム・ティルナール, title: トラヴァンコール王, from: 1846, to: 1860, source: "https://en.wikipedia.org/wiki/Uthram_Thirunal"}
    - {name: アーイリヤム・ティルナール, title: トラヴァンコール王, from: 1860, to: 1880, source: "https://en.wikipedia.org/wiki/Ayilyam_Thirunal"}
    - {name: ヴィシャーカム・ティルナール, title: トラヴァンコール王, from: 1880, to: 1885, source: "https://en.wikipedia.org/wiki/Visakham_Thirunal"}
    - {name: ムーラム・ティルナール, title: トラヴァンコール王, from: 1885, to: 1924, source: "https://en.wikipedia.org/wiki/Moolam_Thirunal"}
    - {name: セードゥ・ラクシュミー・バーイー, title: 摂政, from: 1924, to: 1931, source: "https://en.wikipedia.org/wiki/Sethu_Lakshmi_Bayi"}
    - {name: チッティラ・ティルナール, title: トラヴァンコール王, from: 1931, to: 1949, note: 1936年に寺院入場布告を出し、すべてのカーストのヒンドゥー教徒に寺院を開いた, source: "https://en.wikipedia.org/wiki/Chithira_Thirunal_Balarama_Varma"}
  periods:
    - from: 1648
      to: 1728
      text: インド南端のヴェーナード王国。小さな王国で、地方の豪族（ナーヤル）の力が強かった。
    - from: 1729
      to: 1794
      text: マールターンダ・ヴァルマが豪族を抑え、オランダ東インド会社を破り（コラチェルの戦い、1741）、北の小王国を併合して大きな王国にした。胡椒の専売で豊かになり、マイソールの侵攻も防いだ。
    - from: 1795
      to: 1946
      text: 1795年にイギリスと条約を結び、保護下の藩王国となった（地図ではイギリスの色を薄く塗る）。識字率の高い、教育の進んだ藩王国として知られた。1947年にインドに加わり、1949年にコーチンと合わさってトラヴァンコール＝コーチン州となった。
  source:
    - "https://ja.wikipedia.org/wiki/トラヴァンコール王国"
    - "https://en.wikipedia.org/wiki/Kingdom_of_Travancore"

- id: cochin
  name: コーチン王国
  short: コーチン
  color: "#b9d77d"
  kind: 王国
  periods:
    - from: 1648
      to: 1790
      text: ペリヤール川の河口の港町コーチンを中心とする王国。ポルトガル、ついで1663年からはオランダ東インド会社の保護を受けた（コーチンの要塞はオランダ領）。1770年代にマイソールに貢納した。
    - from: 1791
      to: 1946
      text: 1791年にイギリス東インド会社に貢納する条約を結び（1809年に軍事保護条約）、藩王国となった。1949年にトラヴァンコールと合わさった。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Cochin"

- id: calicut
  name: カリカット王国（ザモリン）
  short: カリカット
  color: "#e0a47c"
  kind: 王国
  periods:
    - from: 1648
      to: 1765
      text: ザモリン（サームーティリ）と呼ばれる王が治めたマラバール海岸の王国。カリカット（コーリコード）は胡椒・香辛料の貿易港で、1498年にヴァスコ＝ダ＝ガマが来航した。1766年にハイダル・アリーに征服された。
  note: パーラッカード（パールガート）の王国もここにまとめた
  source: "https://en.wikipedia.org/wiki/Zamorin_of_Calicut"

- id: kolathunadu
  name: コーラッティリ王国（コーラットゥナード）
  short: コーラッティリ
  color: "#cbc38c"
  kind: 王国
  periods:
    - from: 1648
      to: 1765
      text: マラバール北部の王国。王家が分かれて弱く、カンナノールのイスラーム教徒のアラッカル家、テリチェリーのイギリス商館、マーエのフランス商館などが並び立った。1766年にハイダル・アリーに征服された。
  note: ワヤナード（コッタヤム王家の領地）もここにまとめた
  source: "https://en.wikipedia.org/wiki/Kolathunadu"

- id: kerala_chiefs
  name: ケーララ中部の小王国
  short: ケーララ諸王国
  color: "#c6d9ab"
  kind: 小王国の集まり（カーヤンクラム・テックンクール・ヴァダックンクール・チェンパカッセーリなど）
  periods:
    - from: 1648
      to: 1753
      text: ケーララ中部には、カーヤンクラム、テックンクール、ヴァダックンクール、チェンパカッセーリ（アンバラップラ）などの小王国が並び、オランダ東インド会社と胡椒の取引をした。1740–50年代にトラヴァンコールに併合された。
  source: "https://en.wikipedia.org/wiki/Marthanda_Varma"

- id: arakkal
  name: アラッカル王国
  short: アラッカル
  color: "#9cc7c0"
  kind: 王国（イスラーム教徒の王家）
  periods:
    - from: 1648
      to: 1904
      text: カンナノール（カンヌール）のイスラーム教徒の王家。海上交易を営み、ラッカディヴ諸島（ラクシャドウィープ）を治めた。北部のアミンディヴィ諸島は1787年にティプー・スルタンに渡り、残りの島々も1908年までにイギリスの直接統治に移った。
  source: "https://en.wikipedia.org/wiki/Arakkal_kingdom"

- id: kandy
  name: キャンディ王国
  short: キャンディ
  color: "#8fbf7a"
  kind: 王国
  rulers:
    - {name: ラージャシンハ2世, title: キャンディ王, from: 1635, to: 1687, note: オランダと結んでポルトガル人を島から追った, source: "https://en.wikipedia.org/wiki/Rajasinghe_II"}
    - {name: ヴィマラダルマスーリヤ2世, title: キャンディ王, from: 1687, to: 1707, source: "https://en.wikipedia.org/wiki/Vimaladharmasuriya_II"}
    - {name: ヴィーラ・ナレーンドラシンハ, title: キャンディ王, from: 1707, to: 1739, note: シンハラ人の最後の王。後継は南インドのナーヤカ家の出身, source: "https://en.wikipedia.org/wiki/Vira_Narendrasinha"}
    - {name: シュリー・ヴィジャヤ・ラージャシンハ, title: キャンディ王, from: 1739, to: 1747, source: "https://en.wikipedia.org/wiki/Sri_Vijaya_Rajasinha"}
    - {name: キールティ・シュリー・ラージャシンハ, title: キャンディ王, from: 1747, to: 1782, note: タイから僧を招いて仏教の教団を立て直した。1766年にオランダに海岸地帯を譲った, source: "https://en.wikipedia.org/wiki/Kirti_Sri_Rajasinha"}
    - {name: ラージャーディ・ラージャシンハ, title: キャンディ王, from: 1782, to: 1798, source: "https://en.wikipedia.org/wiki/Rajadhi_Rajasinha"}
    - {name: シュリー・ヴィクラマ・ラージャシンハ, title: キャンディ王, from: 1798, to: 1815, note: 最後の王。貴族がイギリスと結んで王を退け、南インドに流された, source: "https://en.wikipedia.org/wiki/Sri_Vikrama_Rajasinha"}
  periods:
    - from: 1648
      to: 1765
      text: セイロン島中央の山地のシンハラ人の仏教王国。仏歯寺に仏陀の歯（仏歯）をまつった。ポルトガル、ついでオランダが海岸を支配する中で、内陸の独立を守った。
    - from: 1766
      to: 1815
      text: 1766年の条約でオランダに海岸地帯をすべて譲り、海への出口を失った。1796年に海岸地帯がイギリス領になると圧力が強まり、1815年に貴族がイギリスと結んで王を退け（キャンディ協定）、王国は滅んだ。
  source:
    - "https://ja.wikipedia.org/wiki/キャンディ王国"
    - "https://en.wikipedia.org/wiki/Kingdom_of_Kandy"

- id: sri_lanka
  name: スリランカ
  names:
    - {to: 1971, name: セイロン, short: セイロン, kind: 立憲君主国（イギリス連邦の自治領）}
    - {from: 1972, name: スリランカ民主社会主義共和国, short: スリランカ, kind: 共和国（1978年から大統領制）}
  short: スリランカ
  color: "#e7a75f"
  kind: 共和国
  rulers:
    - {name: D・S・セーナーナーヤカ, title: 首相, from: 1948, to: 1952, source: "https://en.wikipedia.org/wiki/D._S._Senanayake"}
    - {name: ダドリー・セーナーナーヤカ, title: 首相, from: 1952, to: 1953, source: "https://en.wikipedia.org/wiki/Dudley_Senanayake"}
    - {name: ジョン・コタラーワラ, title: 首相, from: 1953, to: 1956, source: "https://en.wikipedia.org/wiki/John_Kotelawala"}
    - {name: S・W・R・D・バンダラナイケ, title: 首相, from: 1956, to: 1959, note: シンハラ語だけを公用語とする法（1956）を定めた。暗殺された, source: "https://en.wikipedia.org/wiki/S._W._R._D._Bandaranaike"}
    - {name: シリマヴォ・バンダラナイケ, title: 首相, from: 1960, to: 1965, note: 世界で最初の女性首相, source: "https://ja.wikipedia.org/wiki/シリマヴォ・バンダラナイケ"}
    - {name: ダドリー・セーナーナーヤカ, title: 首相, from: 1965, to: 1970, source: "https://en.wikipedia.org/wiki/Dudley_Senanayake"}
    - {name: シリマヴォ・バンダラナイケ, title: 首相, from: 1970, to: 1977, note: 1972年に共和制に移り国名をスリランカとした, source: "https://ja.wikipedia.org/wiki/シリマヴォ・バンダラナイケ"}
    - {name: J・R・ジャヤワルダナ, title: 首相（1978年から大統領）, from: 1977, to: 1988, note: 経済を自由化した。1983年から内戦, source: "https://en.wikipedia.org/wiki/J._R._Jayewardene"}
    - {name: ラナシンハ・プレマダーサ, title: 大統領, from: 1989, to: 1993, note: LTTEの自爆攻撃で暗殺された, source: "https://en.wikipedia.org/wiki/Ranasinghe_Premadasa"}
    - {name: D・B・ウィジェートゥンガ, title: 大統領, from: 1993, to: 1994, source: "https://en.wikipedia.org/wiki/D._B._Wijetunga"}
    - {name: チャンドリカ・クマーラトゥンガ, title: 大統領, from: 1994, to: 2005, source: "https://en.wikipedia.org/wiki/Chandrika_Kumaratunga"}
    - {name: マヒンダ・ラージャパクサ, title: 大統領, from: 2005, to: 2015, note: 2009年に内戦を終わらせた, source: "https://en.wikipedia.org/wiki/Mahinda_Rajapaksa"}
    - {name: マイトリーパーラ・シリセーナ, title: 大統領, from: 2015, to: 2019, source: "https://en.wikipedia.org/wiki/Maithripala_Sirisena"}
    - {name: ゴーターバヤ・ラージャパクサ, title: 大統領, from: 2019, to: 2022, note: 経済危機への抗議で国外に逃れ辞任, source: "https://en.wikipedia.org/wiki/Gotabaya_Rajapaksa"}
    - {name: ラニル・ウィクラマシンハ, title: 大統領, from: 2022, to: 2024, source: "https://en.wikipedia.org/wiki/Ranil_Wickremesinghe"}
    - {name: アヌラ・クマーラ・ディサーナーヤカ, title: 大統領, from: 2024, to: 2025, source: "https://en.wikipedia.org/wiki/Anura_Kumara_Dissanayake"}
  periods:
    - from: 1948
      to: 1971
      text: 1948年にイギリス連邦の自治領セイロンとして独立した。シンハラ語の公用語化（1956）など、多数派のシンハラ人（仏教徒）を重んじる政策にタミル人が反発した。
    - from: 1972
      to: 1982
      text: 1972年の憲法で共和国となり、国名をスリランカとした。1977年からは経済の自由化が進んだ。タミル人の分離独立運動が武装化した。
    - from: 1983
      to: 2009
      text: 1983年の反タミル暴動から、北部・東部の分離独立を求める「タミル・イーラム解放のトラ」（LTTE）との内戦が続いた。インドの平和維持軍の派遣（1987–90）やノルウェーの仲介による停戦（2002）を経て、2009年に政府軍がLTTEを破って内戦が終わった。多くの民間人が犠牲になった。
    - from: 2010
      to: 2025
      text: 中国の援助による港などの建設で対外債務が膨らみ、2022年に債務不履行に陥った。大統領府を囲む大規模な抗議で大統領が辞任した。
  source:
    - "https://ja.wikipedia.org/wiki/スリランカ"
    - "https://ja.wikipedia.org/wiki/スリランカ内戦"

- id: tamil_eelam
  name: タミル・イーラム解放のトラ（LTTE）の支配地域
  short: LTTE支配地域
  color: "#c47f6c"
  kind: 武装組織の事実上の支配地域
  rulers:
    - {name: ヴェルピライ・プラバーカラン, title: LTTEの指導者, from: 1976, to: 2009, note: 2009年5月に戦死, source: "https://en.wikipedia.org/wiki/Velupillai_Prabhakaran"}
  periods:
    - from: 1990
      to: 2008
      text: インド平和維持軍の撤退（1990）の後、LTTEがスリランカ北部（ヴァンニ地方・ジャフナ半島）を事実上支配し、独自の行政・警察・裁判所を置いた。ジャフナは1995年に政府軍が奪回し、2009年1月にキリノッチ、5月に最後の拠点が落ちてLTTEは壊滅した。
  note: どの国にも承認されていない。支配地域は戦況で大きく変わったので、地図では年末の大まかな状態を斜線（不確実）で描く
  source: "https://ja.wikipedia.org/wiki/タミル・イーラム解放のトラ"

- id: maldives
  name: モルディブ
  names:
    - {to: 1952, name: モルディブ・スルタン国, short: モルディブ, kind: スルタン国}
    - {from: 1953, to: 1953, name: モルディブ共和国（第一共和政）, short: モルディブ, kind: 共和国}
    - {from: 1954, to: 1967, name: モルディブ・スルタン国, short: モルディブ, kind: スルタン国}
    - {from: 1968, name: モルディブ共和国, short: モルディブ, kind: 共和国（大統領制）}
  short: モルディブ
  color: "#6fc3c9"
  kind: スルタン国
  rulers:
    - {name: ムハンマド・アミーン・ディーディー, title: 大統領, from: 1953, to: 1953, source: "https://en.wikipedia.org/wiki/Mohamed_Amin_Didi"}
    - {name: ムハンマド・ファリード・ディーディー, title: スルタン, from: 1954, to: 1968, note: 最後のスルタン, source: "https://en.wikipedia.org/wiki/Muhammad_Fareed_Didi"}
    - {name: イブラーヒーム・ナーシル, title: 大統領, from: 1968, to: 1978, source: "https://en.wikipedia.org/wiki/Ibrahim_Nasir"}
    - {name: マウムーン・アブドゥル・ガユーム, title: 大統領, from: 1978, to: 2008, source: "https://en.wikipedia.org/wiki/Maumoon_Abdul_Gayoom"}
    - {name: モハメド・ナシード, title: 大統領, from: 2008, to: 2012, note: 初めての複数政党制の選挙で選ばれた, source: "https://en.wikipedia.org/wiki/Mohamed_Nasheed"}
    - {name: モハメド・ワヒード・ハサン, title: 大統領, from: 2012, to: 2013, source: "https://en.wikipedia.org/wiki/Mohammed_Waheed_Hassan"}
    - {name: アブドゥッラ・ヤーミーン, title: 大統領, from: 2013, to: 2018, source: "https://en.wikipedia.org/wiki/Abdulla_Yameen"}
    - {name: イブラーヒーム・モハメド・ソーリフ, title: 大統領, from: 2018, to: 2023, source: "https://en.wikipedia.org/wiki/Ibrahim_Mohamed_Solih"}
    - {name: モハメド・ムイズ, title: 大統領, from: 2023, to: 2025, source: "https://en.wikipedia.org/wiki/Mohamed_Muizzu"}
  periods:
    - from: 1648
      to: 1886
      text: インド洋のサンゴ礁の島々のイスラーム教のスルタン国。オランダ領セイロン、ついでイギリス領セイロンに貢ぎ物を送ったが、内政は自立していた。1752年にはマラバールのアラッカル家の軍に一時マーレを占領された。
    - from: 1887
      to: 1964
      text: 1887年の協定でイギリスの保護国となった（地図ではイギリスの色を薄く塗る）。第二次世界大戦中からイギリス軍が南端のガン島に基地を置いた。
    - from: 1965
      to: 2025
      text: 1965年に独立し、1968年に共和制となった。ガユーム大統領の30年の長期政権の後、2008年に複数政党制の選挙が行われた。海面の上昇で国土が水没する危険に直面している。
  note: 1648–1952年のスルタンは要確認のため省略（17世紀にはイブラーヒーム・イスカンダル1世、19世紀にはムハンマド・ムイーヌッディーン1世、ムハンマド・イマードゥッディーン4世など）
  source:
    - "https://ja.wikipedia.org/wiki/モルディブ"
    - "https://en.wikipedia.org/wiki/List_of_sultans_of_the_Maldives"
