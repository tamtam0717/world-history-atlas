    - {name: ダリヤー・イマード・シャー, title: スルタン, from: 1530, to: 1562, source: "https://en.wikipedia.org/wiki/Berar_Sultanate"}
    - {name: ブルハーン・イマード・シャー, title: スルタン, from: 1562, to: 1574, note: 宰相トゥファール・ハーンに実権を奪われ、1574年にアフマドナガルに併合された, source: "https://en.wikipedia.org/wiki/Berar_Sultanate"}
