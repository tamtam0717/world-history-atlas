    - {name: イブラーヒーム3世（カラアファーヌ）, title: スルタン, from: 1585, to: 1609, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_the_Maldives"}
    - {name: フサイン2世（ファムデリ）, title: スルタン, from: 1609, to: 1620, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_the_Maldives"}
    - {name: ムハンマド・イマードゥッディーン1世, title: スルタン, from: 1620, to: 1648, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_the_Maldives"}
    - {name: ムハンマド・アミーン・ディーディー, title: 大統領, from: 1953, to: 1953, source: "https://en.wikipedia.org/wiki/Mohamed_Amin_Didi"}
    - {name: ムハンマド・ファリード・ディーディー, title: スルタン, from: 1954, to: 1968, note: 最後のスルタン, source: "https://en.wikipedia.org/wiki/Muhammad_Fareed_Didi"}
