  short: ビーダル
  color: "#c7d7fc"
  kind: スルタン国
  rulers:
    - {name: カースィム・バリード1世, title: 宰相（バフマニー朝）, from: 1492, to: 1504, note: バフマニー朝のスルタンを操った, source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"}
    - {name: アミール・バリード1世, title: 宰相, from: 1504, to: 1542, note: 1527年ごろバフマニー朝のスルタンを追い、事実上の王となった, source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"}
    - {name: アリー・バリード・シャー1世, title: スルタン, from: 1542, to: 1580, note: 初めてシャーを名のった, source: "https://en.wikipedia.org/wiki/Ali_Barid_Shah_I"}
    - {name: イブラーヒーム・バリード・シャー, title: スルタン, from: 1580, to: 1587, source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"}
    - {name: カースィム・バリード・シャー2世, title: スルタン, from: 1587, to: 1591, source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"}
    - {name: アミール・バリード・シャー2世, title: スルタン, from: 1591, to: 1600, source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"}
    - {name: ミールザー・アリー・バリード・シャー, title: スルタン, from: 1600, to: 1609, source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"}
    - {name: アミール・バリード・シャー3世, title: スルタン, from: 1609, to: 1619, note: 1619年にビジャープル王国に滅ぼされた, source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"}
  periods:
    - from: 1527
      to: 1619
      text: バフマニー朝の都ビーダルを受け継いだ小王国（デカンのムスリム5王国の一つ）。1619年にビジャープル王国に併合された。
  note: 1580年以後の王の在位年は要確認。
  source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"

- id: gingee
  name: ジンジー・ナーヤカ朝
  short: ジンジー
  color: "#b3b38e"
  kind: 王国（ナーヤカ）
  rulers:
    - {name: クリシュナッパ・ナーヤカ, title: ジンジーのナーヤカ, from: 1580, to: 1620, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Gingee_Nayaks"}
  periods:
    - from: 1565
      to: 1648
      text: ヴィジャヤナガル王国のナーヤカ（地方長官）がジンジーの岩山の城を拠点に治めた、タミル北部の領国。王国の衰退後は事実上自立したが、1649年にビジャープル王国に城を落とされた。
  note: 1565年より前もナーヤカがいたが、地図ではヴィジャヤナガル王国の色で塗る。
  source: "https://en.wikipedia.org/wiki/Gingee_Nayaks"

- id: kotte
  name: コーッテ王国
  short: コーッテ
  color: "#e0a8a0"
  kind: 王国
  rulers:
    - {name: パラークラマバーフ6世, title: コーッテ王, from: 1412, to: 1467, note: セイロン島を最後に統一したシンハラ人の王。1450年ごろジャフナ王国も従えた, source: "https://en.wikipedia.org/wiki/Parakramabahu_VI"}
    - {name: ジャヤバーフ2世, title: コーッテ王, from: 1467, to: 1472, source: "https://en.wikipedia.org/wiki/Kingdom_of_Kotte"}
    - {name: ブヴァネーカバーフ6世（サプマル王子）, title: コーッテ王, from: 1472, to: 1480, note: ジャフナを治めていた王子, source: "https://en.wikipedia.org/wiki/Bhuvanekabahu_VI"}
    - {name: パラークラマバーフ7世, title: コーッテ王, from: 1480, to: 1484, source: "https://en.wikipedia.org/wiki/Kingdom_of_Kotte"}
    - {name: パラークラマバーフ8世, title: コーッテ王, from: 1484, to: 1508, source: "https://en.wikipedia.org/wiki/Kingdom_of_Kotte"}
    - {name: パラークラマバーフ9世（ダルマ・パラークラマバーフ）, title: コーッテ王, from: 1508, to: 1513, note: 在位中の1505年ごろポルトガル人が初めて来航した, source: "https://en.wikipedia.org/wiki/Dharma_Parakramabahu_IX"}
    - {name: ヴィジャヤバーフ6世, title: コーッテ王, from: 1513, to: 1521, note: 1521年に3人の王子に殺され、国が3つに分かれた（ヴィジャヤバー・コッラヤ）, source: "https://en.wikipedia.org/wiki/Vijayabahu_VI"}
    - {name: ブヴァネーカバーフ7世, title: コーッテ王, from: 1521, to: 1551, note: 弟マーヤーダンネ（シーターワカ）に対抗してポルトガルと結んだ, source: "https://en.wikipedia.org/wiki/Bhuvanekabahu_VII"}
    - {name: ダルマパーラ, title: コーッテ王, from: 1551, to: 1597, note: キリスト教に改宗し、ポルトガルの保護下でコロンボに住んだ。1580年に国をポルトガル王に譲る遺言を書いた, source: "https://en.wikipedia.org/wiki/Dharmapala_of_Kotte"}
  periods:
    - from: 1453
      to: 1520
      text: セイロン島西南部のコーッテ（コロンボの近く）を都とするシンハラ人の仏教王国。15世紀半ばにパラークラマバーフ6世が島全体を従えたが、その死後ジャフナとキャンディが離れた。
    - from: 1521
      to: 1597
      text: 1521年に国がコーッテ・シーターワカ・ライガマに分かれた。コーッテ王はポルトガルの保護に頼り、ダルマパーラはキリスト教徒になってコロンボの要塞に住んだ（地図では1551年からポルトガルの帯）。1597年に王が死ぬと、遺言で国はポルトガル領となった。
  note: 15世紀末–16世紀初めの王の在位年は史料で食い違いがある（要確認）。
  source:
    - "https://ja.wikipedia.org/wiki/コーッテ王国"
    - "https://en.wikipedia.org/wiki/Kingdom_of_Kotte"

- id: sitawaka
  name: シーターワカ王国
  short: シーターワカ
  color: "#c9b07a"
  kind: 王国
  rulers:
    - {name: マーヤーダンネ, title: シーターワカ王, from: 1521, to: 1581, note: コーッテ王ヴィジャヤバーフ6世の子。1538年にライガマを合わせた, source: "https://en.wikipedia.org/wiki/Mayadunne_of_Sitawaka"}
    - {name: ラージャシンハ1世, title: シーターワカ王, from: 1581, to: 1593, note: キャンディを併合し（1582）、コロンボのポルトガル要塞を包囲した（1587–88）, source: "https://en.wikipedia.org/wiki/Rajasinghe_I"}
  periods:
    - from: 1521
      to: 1593
      text: コーッテ王国から分かれ、内陸のシーターワカ（アヴィッサーウェッラ）を都とした王国。ポルトガルとそれに頼るコーッテ王と戦い、ラージャシンハ1世のもとで島の大部分を従えたが、その死（1593）とともに崩れた。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Sitawaka"

- id: jaffna
  name: ジャフナ王国
  short: ジャフナ
  color: "#a7c4e0"
  kind: 王国（タミル人の王国）
  rulers:
    - {name: カナカスーリヤ・チンカイアーリヤン, title: ジャフナ王（アーリヤチャクラヴァルティ家）, from: 1467, to: 1478, note: コーッテに追われていたが、1467年に王位を取り戻した, source: "https://en.wikipedia.org/wiki/Kanakasooriya_Cinkaiariyan"}
    - {name: パララーサセーカラン, title: ジャフナ王, from: 1478, to: 1519, source: "https://en.wikipedia.org/wiki/Pararasasekaram_VI"}
    - {name: サンキリ1世, title: ジャフナ王, from: 1519, to: 1561, note: ポルトガルに抵抗し、マンナールのキリスト教徒を迫害した（1544）, source: "https://en.wikipedia.org/wiki/Cankili_I"}
    - {name: プヴィラージャ・パンダーラム, title: ジャフナ王, from: 1561, to: 1565, source: "https://en.wikipedia.org/wiki/Jaffna_Kingdom"}
    - {name: カーシ・ナイナール, title: ジャフナ王, from: 1565, to: 1570, source: "https://en.wikipedia.org/wiki/Jaffna_Kingdom"}
    - {name: ペリヤピッライ, title: ジャフナ王, from: 1570, to: 1582, source: "https://en.wikipedia.org/wiki/Periyapillai"}
    - {name: プヴィラージャ・パンダーラム2世, title: ジャフナ王, from: 1582, to: 1591, note: 1591年のポルトガルの遠征で殺された, source: "https://en.wikipedia.org/wiki/Puviraja_Pandaram"}
    - {name: エティリマナ・チンカム, title: ジャフナ王, from: 1591, to: 1616, note: ポルトガルに立てられ、貢納した, source: "https://en.wikipedia.org/wiki/Ethirimana_Cinkam"}
    - {name: サンキリ2世, title: ジャフナ王, from: 1617, to: 1619, note: 最後の王。ポルトガルに捕らえられ、ゴアで処刑された, source: "https://en.wikipedia.org/wiki/Cankili_II"}
  periods:
    - from: 1467
      to: 1619
      text: セイロン島北部のジャフナ半島を中心とするタミル人のヒンドゥー教の王国。南のヴァンニ地方の首長も従えた。ポルトガルと争い、1591年からその保護下に入り（地図ではポルトガルの帯）、1619年に併合された。
  note: 1450–1467年はコーッテ王国に従えられた（サプマル王子が治めた）。在位年は要確認。
  source:
    - "https://ja.wikipedia.org/wiki/ジャフナ王国"
    - "https://en.wikipedia.org/wiki/Jaffna_Kingdom"

- id: khandesh
