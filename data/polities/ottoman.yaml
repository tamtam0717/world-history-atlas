    - {name: "ギオルギ2世", title: "イメレティ王", from: 1565, to: 1585, source: "https://en.wikipedia.org/wiki/George_II_of_Imereti"}
    - {name: "レヴァン", title: "イメレティ王", from: 1585, to: 1588, source: "https://en.wikipedia.org/wiki/Levan_of_Imereti"}
    - {name: "ロストム", title: "イメレティ王", from: 1588, to: 1605, note: "1589–1590年はバグラト4世。", source: "https://en.wikipedia.org/wiki/Rostom_of_Imereti"}
