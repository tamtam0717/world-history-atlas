    - from: 1648
      to: 1739
      text: ジャーン朝のもとで弱体化し、地方のウズベク諸部族が自立した。
    - from: 1740
      to: 1815
      text: ナーディル・シャーに服属したのち、マンギト部が実権を握った（マンギト朝）。シャー・ムラード（1785–1800）がアミールを称し、1785年ごろメルヴを奪った。
    - from: 1816
      to: 1867
      text: ナスルッラー（1827–1860）がコーカンドと争った。メルヴは1820年代からヒヴァ、のちトルクメンの手に移った。
    - from: 1868
      to: 1914
      text: ロシア軍にサマルカンドを奪われ（1868）、ロシアの保護国となった。
  source: "https://ja.wikipedia.org/wiki/ブハラ・ハン国"

- id: kokand
  name: コーカンド・ハン国
  short: コーカンド
  color: "#c9d6a0"
  kind: ハン国
  rulers:
    - {name: ウマル・ハン, title: ハン, from: 1810, to: 1822, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
    - {name: ムハンマド・アリー（マダリ・ハン）, title: ハン, from: 1822, to: 1842, note: 1842年にブハラのナスルッラーに攻められて殺された。, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
    - {name: シール・アリー・ハン, title: ハン, from: 1842, to: 1845, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
    - {name: フダーヤール・ハン, title: ハン, from: 1845, to: 1875, note: 1858–1865年は廃位と復位をくり返した（その間のハンはマッラー・ハン、シャー・ムラード、サイイド・スルタンなど。実権者はアリム・クリ。要確認）。1875年の反乱でロシア領に逃れた。, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
    - {name: ナスルッディーン・ハン, title: ハン, from: 1875, to: 1876, note: 1876年2月、ハン国はロシアに併合されフェルガナ州となった。, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
  periods:
    - from: 1816
      to: 1852
      text: フェルガナ盆地からシル川流域・タシケントに勢力を広げ、シル川下流にアク・メチェトなどの要塞を築いた。1842年にはブハラに一時征服された。
    - from: 1853
      to: 1876
      text: 1853年にロシアにアク・メチェトを奪われ、1865年にはタシケントを失った。1875年の反乱をきっかけにロシア軍が侵攻し、1876年にハン国は併合された（フェルガナ州）。
  note: フェルガナ盆地を本拠とするウズベクのハン国。19世紀前半にシル川中流・下流に勢力を広げ、1817年ごろアク・メチェト（現クズロルダ）に要塞を築いた。1853年にロシアがアク・メチェトを落とし、1876年にハン国はロシアに併合された。地図の範囲はシル川下流（クズロルダ）だけ。
  source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"

- id: kazakh
  name: カザフ＝ハン国（小ジュズ）
  names:
    - {to: 1717, name: カザフ＝ハン国, short: カザフ}
  short: カザフ（小ジュズ）
  color: "#ddd4ab"
  kind: 遊牧国家
  rulers:
    - {name: "ケレイ", title: "ハン", from: 1465, to: 1473, note: "ジャーニー・ベクとともにアブル＝ハイル＝ハンから離れ、ハン国を開いた。", source: "https://ja.wikipedia.org/wiki/カザフ・ハン国"}
    - {name: "ジャーニー・ベク", title: "ハン", from: 1473, to: 1480, source: "https://ja.wikipedia.org/wiki/カザフ・ハン国"}
    - {name: "ブルンドゥク", title: "ハン", from: 1480, to: 1511}
    - {name: "カースィム", title: "ハン", from: 1511, to: 1521, note: "カザフの勢力を最大に広げた。", source: "https://en.wikipedia.org/wiki/Kasym_Khan"}
    - {name: "ママシュ", title: "ハン", from: 1521, to: 1523}
    - {name: "ターヒル", title: "ハン", from: 1523, to: 1533}
    - {name: "ハク・ナザル", title: "ハン", from: 1538, to: 1580, note: "1533–1538年は混乱期（要確認）。", source: "https://en.wikipedia.org/wiki/Haq_Nazar_Khan"}
    - {name: "シガイ", title: "ハン", from: 1580, to: 1582}
    - {name: "タウケル", title: "ハン", from: 1582, to: 1598, note: "1598年にタシュケントとトルキスタンを取った。", source: "https://en.wikipedia.org/wiki/Tauekel_Khan"}
    - {name: "イシム", title: "ハン", from: 1598, to: 1628, source: "https://en.wikipedia.org/wiki/Esim_Khan"}
    - {name: "ジャハーンギール（サルカム・ジャハーンギール）", title: "ハン", from: 1628, to: 1652, source: "https://en.wikipedia.org/wiki/Jahangir_Khan"}
    - {name: タウケ・ハン, title: カザフのハン, from: 1680, to: 1715, note: 「七つの法典（ジェティ・ジャルグ）」を定め、3ジュズをまとめた最後の有力なハン。都はトルキスタン。在位の年は要確認。, source: "https://en.wikipedia.org/wiki/Tauke_Khan"}
    - {name: アブルハイル・ハン, title: 小ジュズのハン, from: 1718, to: 1748, note: 1731年にロシアの臣籍に入った。, source: "https://en.wikipedia.org/wiki/Abu%27l-Khayr_Khan"}
    - {name: ヌラリ・ハン, title: 小ジュズのハン, from: 1748, to: 1786, source: "https://en.wikipedia.org/wiki/Nurali_Khan"}
  note: カザフは大・中・小の3ジュズ（部族連合）に分かれ、地図の範囲（カザフスタン西部）はおもに小ジュズの遊牧地。1731年に小ジュズのアブルハイル・ハンがロシアの臣籍に入ったが、支配は名目的。
  periods:
    - from: 1465
      to: 1598
      text: ウズベクのアブル＝ハイル＝ハンから離れた遊牧民が、チュー川流域でカザフ＝ハン国を開いた。カースィム・ハンの時代に草原全体に広がり、シル川の町々をシャイバーニー朝と争った。
    - from: 1598
      to: 1647
      text: タウケル・ハンがタシュケントとトルキスタンを取り、シル川中流がカザフの政治の中心となった。東からはオイラト（のちジュンガル）の圧力が強まった。
    - from: 1648
      to: 1730
      text: カザフ諸部族の遊牧地。東からジュンガルの攻撃を受け（「大災厄」1723年）、西のカルムイクとも争った。
    - from: 1731
      to: 1815
      text: 小ジュズはロシアの保護を求めた。ロシアはオレンブルク（1743）などの要塞線を築いて草原に進出した。1801年にはヴォルガ・ウラル間にブケイ・オルダが置かれた。
    - from: 1816
      to: 1847
      text: ロシアは中ジュズ（1822）・小ジュズ（1824）のハン位を廃止して直接統治に移った。ケネサル・カスモフの反乱（1837–1847）を最後に、カザフ草原はロシアの支配下に入った。
  source: "https://ja.wikipedia.org/wiki/カザフ・ハン国"

- id: kazakh_middle
  name: カザフ＝ハン国（中ジュズ）
  short: カザフ（中ジュズ）
  color: "#d6c38e"
  kind: 遊牧国家
  note: カザフ草原の北部・中部（イシム川・ヌラ川・イルティシュ川の流域）の部族連合。タウケ・ハンの死（1715年ごろ）ののち3ジュズの分立がはっきりした。1740年にアブルマンベト・ハンとアブライがロシアの臣籍に入り、アブライは清にも朝貢した（両属）。1822年にロシアがハン位を廃止した。
  rulers:
    - {name: アブルマンベト・ハン, title: 中ジュズのハン, from: 1739, to: 1771, note: 在位の年は要確認。, source: "https://en.wikipedia.org/wiki/Middle_Jüz"}
    - {name: アブライ・ハン, title: 中ジュズのハン（3ジュズの盟主）, from: 1771, to: 1781, note: 1730年代からジュンガルとの戦いで名を上げ、実権を握っていた。, source: "https://en.wikipedia.org/wiki/Ablai_Khan"}
    - {name: ワリー・ハン, title: 中ジュズのハン, from: 1781, to: 1819, note: 1819年の死ののちロシアはハン位を置かず、1822年にシベリア・キルギス規約で廃止した。, source: "https://en.wikipedia.org/wiki/Middle_Jüz"}
  periods:
    - from: 1718
      to: 1757
      text: ジュンガルの侵攻（1723年の「大災厄」）で南の遊牧地を追われ、ロシアの要塞線（イルティシュ線）との間に押し込まれた。1730年代からジュンガルに反撃した。
    - from: 1758
      to: 1821
      text: ジュンガルの滅亡ののち、アブライのもとでロシアと清の両方に臣従しながら勢力を保った。
  source: "https://ja.wikipedia.org/wiki/カザフ・ハン国"

- id: kazakh_great
  name: カザフ＝ハン国（大ジュズ）
  short: カザフ（大ジュズ）
  color: "#e9dcae"
  kind: 遊牧国家
  note: カザフ草原の南東部（セミレチエ＝七河地方・シル川中流・タシケント周辺）の部族連合。1723年からジュンガルに服属し、ジュンガルの滅亡（1758年）ののちは清に名目的に朝貢した。19世紀にはコーカンド・ハン国が南部を押さえ、1846年からロシアの臣籍に入った。
  rulers:
    - {name: ジョルバルス・ハン, title: 大ジュズのハン（タシケントを本拠）, from: 1720, to: 1740, note: ジュンガルに服属した。在位の年は要確認。, source: "https://en.wikipedia.org/wiki/Senior_Jüz"}
    - {name: トレ・ビー, title: 大ジュズのビー（長老）・タシケントの支配者, from: 1740, to: 1756, note: 要確認。, source: "https://en.wikipedia.org/wiki/Tole_Bi"}
  periods:
    - from: 1723
      to: 1757
      text: ジュンガルの侵攻でタシケント・トルキスタンなどを奪われ、ジュンガルに服属した。
    - from: 1758
      to: 1853
      text: ジュンガルの滅亡ののち遊牧地を取り戻したが、19世紀初めからコーカンド・ハン国がシル川流域・セミレチエ南部に勢力を広げた。1846年にロシアの臣籍に入り、1854年のヴェールヌイ（アルマトイ）の要塞でロシアの支配が固まった。
  source: "https://ja.wikipedia.org/wiki/カザフ・ハン国"

- id: tashkent_state
  name: タシケント（ユーヌス・ホージャの政権）
  short: タシケント
  color: "#d9b59c"
  kind: 都市国家
  note: タシケントは18世紀半ばには4つの街区（ダハ）の長が争い、カザフの支配を受けた。1784年ごろユーヌス・ホージャが街区を統一して自立し、周りのカザフやコーカンドと争った。1809年ごろコーカンド・ハン国に併合された（年は要確認）。
  rulers:
    - {name: ユーヌス・ホージャ, title: タシケントの支配者（ハーキム）, from: 1784, to: 1801, note: 在位の年は要確認。, source: "https://en.wikipedia.org/wiki/Tashkent"}
  source: "https://en.wikipedia.org/wiki/Tashkent"

# ---------------------------------------------------------------- カフカース
- id: kartli_kakheti
  name: カルトリ王国
  names:
    - {from: 1762, name: カルトリ・カヘティ王国}
  short: カルトリ
  color: "#d7a5b7"
  kind: 王国
  note: ジョージア（グルジア）東部の王国。1762年までは東半分のカヘティ王国（kakheti）と別。ペルシアの宗主権下でイスラームに改宗した王（ヴァリー）も多い。1723–1735年はオスマン帝国、1735–1744年はペルシアの直接支配。1744年以前の王は要確認。
  rulers:
    - {name: "コンスタンティネ2世", title: "カルトリ王", from: 1490, to: 1505, source: "https://en.wikipedia.org/wiki/Constantine_II_of_Georgia"}
    - {name: "ダヴィト10世", title: "カルトリ王", from: 1505, to: 1525, source: "https://en.wikipedia.org/wiki/David_X_of_Kartli"}
    - {name: "ギオルギ9世", title: "カルトリ王", from: 1525, to: 1527, source: "https://en.wikipedia.org/wiki/George_IX_of_Kartli"}
    - {name: "ルアルサブ1世", title: "カルトリ王", from: 1527, to: 1556, note: "サファヴィー朝との戦いで戦死。", source: "https://en.wikipedia.org/wiki/Luarsab_I_of_Kartli"}
    - {name: "シモン1世", title: "カルトリ王", from: 1556, to: 1569, note: "1578–1600年に復位。オスマン帝国に捕らえられて死んだ。", source: "https://en.wikipedia.org/wiki/Simon_I_of_Kartli"}
    - {name: "ダヴィト11世（ダウド・ハン）", title: "カルトリ王", from: 1569, to: 1578, note: "イスラームに改宗してサファヴィー朝に従った。", source: "https://en.wikipedia.org/wiki/David_XI_of_Kartli"}
    - {name: "シモン1世（復位）", title: "カルトリ王", from: 1578, to: 1600, source: "https://en.wikipedia.org/wiki/Simon_I_of_Kartli"}
    - {name: "ギオルギ10世", title: "カルトリ王", from: 1600, to: 1606, source: "https://en.wikipedia.org/wiki/George_X_of_Kartli"}
    - {name: "ルアルサブ2世", title: "カルトリ王", from: 1606, to: 1614, source: "https://en.wikipedia.org/wiki/Luarsab_II_of_Kartli"}
    - {name: "バグラト7世", title: "カルトリ王", from: 1615, to: 1619, source: "https://en.wikipedia.org/wiki/Bagrat_VII_of_Kartli"}
    - {name: "シモン2世", title: "カルトリ王", from: 1619, to: 1630, source: "https://en.wikipedia.org/wiki/Simon_II_of_Kartli"}
    - {name: "テイムラズ1世", title: "カルトリ王（カヘティ王が兼ねる）", from: 1625, to: 1633, note: "シモン2世と争った。", source: "https://en.wikipedia.org/wiki/Teimuraz_I_of_Kakheti"}
    - {name: ロストム, title: カルトリ王, from: 1633, to: 1658, source: "https://en.wikipedia.org/wiki/Rostom_of_Kartli"}
    - {name: ヴァフタング5世（シャーナヴァーズ）, title: カルトリ王, from: 1658, to: 1675, source: "https://en.wikipedia.org/wiki/Vakhtang_V_of_Kartli"}
    - {name: ギオルギ11世, title: カルトリ王, from: 1676, to: 1688, note: 1703–1709年にも在位（カンダハールで戦死）, source: "https://en.wikipedia.org/wiki/George_XI_of_Kartli"}
    - {name: エレクレ1世（ナザル・アリー・ハン）, title: カルトリ王, from: 1688, to: 1703, source: "https://en.wikipedia.org/wiki/Heraclius_I_of_Kakheti"}
    - {name: ヴァフタング6世, title: カルトリ王（摂政・王）, from: 1703, to: 1724, note: 法典を編み、ティフリスに印刷所を開いた。オスマン軍の侵入でロシアへ亡命。, source: "https://en.wikipedia.org/wiki/Vakhtang_VI_of_Kartli"}
    - {name: テイムラズ2世, title: カルトリ王, from: 1744, to: 1762, source: "https://en.wikipedia.org/wiki/Teimuraz_II_of_Kakheti"}
    - {name: エレクレ2世, title: カルトリ・カヘティ王, from: 1762, to: 1798, note: 1744年からカヘティ王。, source: "https://ja.wikipedia.org/wiki/エレクレ2世"}
    - {name: ギオルギ12世, title: カルトリ・カヘティ王, from: 1798, to: 1800, source: "https://en.wikipedia.org/wiki/George_XII_of_Georgia"}
  periods:
    - from: 1490
      to: 1647
      text: ジョージア王国の分裂で生まれた東部の王国（都トビリシ）。アマスィヤの和約（1555）でサファヴィー朝の勢力圏とされ、オスマン帝国とサファヴィー朝の争いの場となった。王はしばしばイスラームに改宗してシャーに仕えた。
    - from: 1744
      to: 1782
      text: ナーディル・シャーのもとでテイムラズ2世とエレクレ2世父子がカルトリ・カヘティの王位を得て、ナーディルの死後は事実上独立。1762年に両国が統合された。
    - from: 1783
      to: 1800
      text: ゲオルギエフスク条約（1783）でロシアの保護国となったが、1795年にはアーガー・モハンマド・ハーンにティフリスを焼かれた。1801年にロシアに併合された。
  source: "https://ja.wikipedia.org/wiki/カルトリ・カヘティ王国"

- id: kakheti
  name: カヘティ王国
  short: カヘティ
  color: "#f6d9fa"
  kind: 王国
  note: ジョージア東部。ペルシアの直接支配の時期も多い。1744年からエレクレ2世が王、1762年にカルトリと統合。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Kakheti"
  rulers:
    - {name: "ギオルギ1世（ジョージア王ギオルギ8世）", title: "カヘティ王", from: 1465, to: 1476, source: "https://en.wikipedia.org/wiki/George_VIII_of_Georgia"}
    - {name: "アレクサンドレ1世", title: "カヘティ王", from: 1476, to: 1511, source: "https://en.wikipedia.org/wiki/Alexander_I_of_Kakheti"}
    - {name: "ギオルギ2世", title: "カヘティ王", from: 1511, to: 1513, note: "1513–1520年はカルトリ王の支配。", source: "https://en.wikipedia.org/wiki/George_II_of_Kakheti"}
    - {name: "レヴァン", title: "カヘティ王", from: 1520, to: 1574, source: "https://en.wikipedia.org/wiki/Levan_of_Kakheti"}
    - {name: "アレクサンドレ2世", title: "カヘティ王", from: 1574, to: 1605, note: "ロシアに使節を送った。子に殺された。", source: "https://en.wikipedia.org/wiki/Alexander_II_of_Kakheti"}
    - {name: "コンスタンティネ1世", title: "カヘティ王", from: 1605, to: 1605, source: "https://en.wikipedia.org/wiki/Constantine_I_of_Kakheti"}
    - {name: "テイムラズ1世", title: "カヘティ王", from: 1605, to: 1648, note: "1614–1616年にアッバース1世がカヘティを荒らし、多くの住民をイランへ移した。テイムラズは何度も追われては戻った。", source: "https://en.wikipedia.org/wiki/Teimuraz_I_of_Kakheti"}
  periods:
    - from: 1465
      to: 1647
      text: ジョージア王国から分かれた東端の王国。サファヴィー朝に従ったが、アッバース1世の遠征（1614–16、1624）で国土を荒らされた。

- id: imereti
  name: イメレティ王国
  short: イメレティ
  color: "#b6cc90"
  kind: 王国（オスマン帝国の宗主権下）
  note: ジョージア西部の王国。王位をめぐる内紛が続いた。
