    - from: 2006
      text: 2006年5月の住民投票（賛成55.5％）でセルビア・モンテネグロから独立した。観光業が経済の柱で、ユーロを通貨として使っている。2017年にNATOに加盟し、EU加盟の交渉を進めている。
