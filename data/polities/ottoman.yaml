  names:
    - {to: 1919, name: ヒヴァ・ハン国}
    - {from: 1920, to: 1924, name: ホラズム人民ソヴィエト共和国, short: ホラズム, kind: 人民ソヴィエト共和国（ソヴィエト・ロシアの同盟国）}

