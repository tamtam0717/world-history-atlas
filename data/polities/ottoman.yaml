  periods:
    - from: 1948
      to: 1966
      text: 独立宣言とともに周辺のアラブ諸国と戦い（第1次中東戦争）、分割案より広い地域を押さえた。約70万人のパレスチナ人が故郷を追われて難民となった（ナクバ）。世界各地からユダヤ人の移民を受け入れた。1956年のスエズ戦争ではシナイ半島に出兵した。
    - from: 1967
      to: 1992
      text: 第3次中東戦争でヨルダン川西岸・ガザ・シナイ半島・ゴラン高原を占領し、占領地に入植地を作った。第4次中東戦争（1973）ののちエジプトと平和条約を結び（1979）、シナイ半島を返した（1982）。1987年に占領地でインティファーダが起きた。
    - from: 1993
      to: 2022
      text: オスロ合意でパレスチナ自治が始まったが、ラビン首相の暗殺、第2次インティファーダ（2000）で和平は行き詰まった。2005年にガザから撤退し、2020年にはアラブ首長国連邦などと国交を結んだ（アブラハム合意）。
    - from: 2023
      text: 2023年10月7日、ガザのハマースなどの奇襲で約1,200人が殺され、約250人が人質となった。イスラエルはガザへの大規模な攻撃を続け、ガザ側の死者は6万人を超え、人道危機が深刻になった。レバノンのヒズボラ（2024）やイラン（2025）とも戦った。2025年10月に停戦した。
  source: "https://ja.wikipedia.org/wiki/イスラエル"

