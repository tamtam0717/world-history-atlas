    - {name: マフムード・アッバース, title: 自治政府大統領, from: 2005, note: ガザは2007年からハマース（指導者はハニーヤ、のちスィンワールなど）が支配した。, source: "https://ja.wikipedia.org/wiki/マフムード・アッバース"}
