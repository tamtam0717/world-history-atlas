    - {name: シャー・ナワーズ・ハン, title: カラートのハン（イギリスが擁立）, from: 1839, to: 1840, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: ナスィール・ハン2世, title: カラートのハン, from: 1840, to: 1857, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: フダーダード・ハン, title: カラートのハン, from: 1857, to: 1893, note: 1863–1864年に一時廃位された。1876年のマストゥング条約でイギリスの保護下に入った。1893年に退位させられた。, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: マフムード・ハン2世, title: カラートのハン, from: 1893, to: 1931, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: ミール・ムハンマド・アーザム・ジャーン, title: カラートのハン, from: 1931, to: 1933, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
