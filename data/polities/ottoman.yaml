  periods:
    - from: 1648
      to: 1795
      text: ツェティニェ周辺の山地を本拠とする部族社会で、オスマン帝国の宗主権は名目的。ダニーロ1世以来、ロシアと結んでオスマン帝国と戦った。
    - from: 1796
      to: 1815
      text: ペタル1世がクルシの戦い（1796）でスクタリのパシャを破り、北東の山地（ブルダ）を加えて事実上独立した。1813–1814年にはコトル湾を一時占領した。
    - from: 1816
      to: 1851
      text: ペタル2世ニェゴシュのもとで元老院や税制が整えられ、部族社会から国家への歩みが始まった。オスマン帝国とは国境の山地で小競り合いが続いた。
    - from: 1852
      to: 1877
      text: ダニーロ1世が世俗の公国とした。グラホヴァツの戦い（1858）でオスマン軍を破り、列強の仲介で国境が定められた（1859）。ニコラ1世はロシアと結び、1876年にセルビアとともにオスマン帝国と戦った。
    - from: 1878
      to: 1914
      text: ベルリン条約で独立が認められ、ニクシッチ・ポドゴリツァ・バールを得て領土が倍以上になり、海への出口を得た（ウルツィニは1880年）。1910年に王国となり、バルカン戦争でサンジャク東部とメトヒヤ（ペーチ・ジャコヴィツァ）を得た。
  source: "https://en.wikipedia.org/wiki/Prince-Bishopric_of_Montenegro"

