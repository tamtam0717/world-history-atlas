    - {name: ダニーロ1世, title: モンテネグロ公, from: 1852, to: 1860, note: 府主教位を捨てて世俗の公となった。1860年に暗殺。, source: "https://en.wikipedia.org/wiki/Danilo_I,_Prince_of_Montenegro"}
