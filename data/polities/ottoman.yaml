    - from: 1830
      to: 1862
      text: ロンドン議定書（1830）で独立国となり、バイエルン出身のオソン1世が王となった。首都はナフプリオから1834年にアテネへ。国境の外に多くのギリシア人が残り、「メガリ・イデア」（大ギリシア主義）が国の目標となった。
    - from: 1863
