    - {name: セリム3世, title: スルタン, from: 1789, to: 1807, source: "https://ja.wikipedia.org/wiki/セリム3世"}
    - {name: ムスタファ4世, title: スルタン, from: 1807, to: 1808, source: "https://ja.wikipedia.org/wiki/ムスタファ4世"}
    - {name: マフムト2世, title: スルタン, from: 1808, to: 1839, note: 1826年にイェニチェリを廃止した。, source: "https://ja.wikipedia.org/wiki/マフムト2世"}
    - {name: アブデュルメジト1世, title: スルタン, from: 1839, to: 1861, note: ギュルハネ勅令（1839）でタンジマートを始めた。, source: "https://ja.wikipedia.org/wiki/アブデュルメジト1世"}
    - {name: アブデュルアズィズ, title: スルタン, from: 1861, to: 1876, source: "https://ja.wikipedia.org/wiki/アブデュルアズィズ"}
    - {name: ムラト5世, title: スルタン, from: 1876, to: 1876, note: 精神の病を理由に3か月で廃位。, source: "https://ja.wikipedia.org/wiki/ムラト5世"}
    - {name: アブデュルハミト2世, title: スルタン, from: 1876, to: 1909, note: 1876年にミドハト憲法を発布したが、1878年に議会を停止して専制を行った。, source: "https://ja.wikipedia.org/wiki/アブデュルハミト2世"}
    - {name: メフメト5世, title: スルタン, from: 1909, to: 1918, note: 実権は「統一と進歩委員会」（青年トルコ人）が握った。, source: "https://ja.wikipedia.org/wiki/メフメト5世"}
    - name: メフメト6世
      title: スルタン
      from: 1918
      to: 1922
      note: 最後のスルタン。1922年11月1日にアンカラの大国民議会がスルタン制を廃止し、イギリスの軍艦で亡命した。いとこのアブデュルメジト2世がカリフ（宗教上の位）だけを1924年3月まで継いだ。
      source: "https://ja.wikipedia.org/wiki/メフメト6世"
  periods:
    - from: 1648
      to: 1683
      text: イブラヒムの廃位後、幼いメフメト4世のもとで混乱が続いたが、1656年からキョプリュリュ家の大宰相が立て直す。クレタ島（1669）、ポドリア（1672）を得て、ヨーロッパでの領土は最大となった。
    - from: 1683
      to: 1699
      text: 第二次ウィーン包囲に失敗し、神聖同盟（オーストリア・ポーランド・ヴェネツィア・ロシア）との大トルコ戦争に敗れる。カルロヴィッツ条約でハンガリーなどを失い、守勢に転じた。
    - from: 1700
      to: 1767
      text: プルート戦役でロシアに勝ち（1711）、ヴェネツィアからモレアを奪回（1715）。パッサロヴィッツ条約（1718）で北セルビアを失うが、ベオグラード条約（1739）で取り戻した。チューリップ時代（1718–1730）には西欧文化が取り入れられた。
    - from: 1768
      to: 1788
      text: ロシアとの戦争に続けて敗れ、キュチュク・カイナルジ条約（1774）で黒海北岸の支配が崩れ、クリミアも失った（1783）。地方では「アーヤーン」と呼ばれる有力者が自立していく。
    - from: 1789
      to: 1815
      text: セリム3世が西洋式の新軍（ニザーム・ジェディード）を創設するが、イェニチェリの反乱で廃位された（1807）。ボナパルトのエジプト遠征、セルビア蜂起、ヤニナのアリー・パシャやエジプトのムハンマド・アリーの自立など、帝国の統合は揺らいだ。
    - from: 1816
      to: 1838
      text: ギリシア独立戦争（1821–1829）に敗れてギリシアの独立を認め、セルビアに自治を与えた。マフムト2世はイェニチェリを廃止して（1826）軍を西洋化したが、エジプトのムハンマド・アリーにシリアを奪われた（1833）。
    - from: 1839
      to: 1875
      text: ギュルハネ勅令（1839）と改革勅令（1856）による近代化改革（タンジマート）。列強の支援でエジプトからシリアを取り戻し、クリミア戦争ではロシアに勝ったが、外国からの借款が膨らみ、1875年に財政が破綻した。
    - from: 1876
      to: 1907
      text: ミドハト憲法（1876）を発布したが、露土戦争（1877–1878）に敗れ、ベルリン条約でバルカンの大半を失った。アブデュルハミト2世は議会を停止し、パン＝イスラーム主義を掲げて専制を行った。キプロス（1878）・エジプト（1882）はイギリスの手に移った。
    - from: 1908
      to: 1914
      text: 青年トルコ人革命（1908）で憲法が復活したが、その混乱の中でブルガリアの独立とボスニアの併合を許した。イタリア＝トルコ戦争（1911–1912）でリビアとドデカネス諸島を、バルカン戦争（1912–1913）でヨーロッパ領の大半を失い、1914年にドイツ側で第一次世界大戦に加わった。
    - from: 1914
      to: 1918
      text: ドイツ側で第一次世界大戦に加わった。ガリポリ（ダーダネルス）の戦い（1915）で英仏軍を退けたが、東部ではロシア軍に、イラク・パレスチナではイギリス軍に押され、アラブの反乱（1916）も起きた。1915–1916年にはアルメニア人の強制移住と大量の殺害が行われた。1918年10月にムドロス休戦協定で降伏した。
    - from: 1918
      to: 1922
      text: 敗戦後、イスタンブルは連合国に占領され、イズミルにはギリシア軍、南部にはフランス・イタリア軍が入った。スルタンの政府はセーヴル条約（1920）を受け入れたが、ムスタファ・ケマルがアンカラに大国民議会を開いて抵抗し（国民闘争）、1922年にスルタン制が廃止されて帝国は終わった。
  source: "https://ja.wikipedia.org/wiki/オスマン帝国"

