- id: cyprus
  name: キプロス共和国
  short: キプロス
  color: "#e7c48e"
  kind: 共和国
  note: 1960年8月にイギリスから独立した（イギリスはアクロティリ・デケリアの基地を残した）。ギリシア系とトルコ系の住民の権力分担の憲法だったが、1963年末から衝突が起き、1964年から国連の平和維持部隊が駐留している。1974年のトルコの出兵で島の北部（約37％）がトルコの占領下に置かれ、1983年に北キプロス・トルコ共和国（トルコだけが承認）が宣言された。大統領制。
  rulers:
