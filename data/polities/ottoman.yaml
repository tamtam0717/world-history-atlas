  short: ヘルツェグ＝ボスナ
  color: "#c4d4ef"
  kind: 自称国家（内戦中）
  note: ボスニアのクロアチア人勢力がクロアチアの支援で作った政体（1991年に共同体、1993年に共和国を宣言）。1993–1994年にボシュニャク人と戦った。1994年3月のワシントン合意でボシュニャク人とともにボスニア連邦を作った。
  rulers:
    - {name: マテ・ボバン, title: 大統領, from: 1993, to: 1994, source: "https://en.wikipedia.org/wiki/Mate_Boban"}
  source: "https://en.wikipedia.org/wiki/Croatian_Republic_of_Herzeg-Bosnia"

- id: north_macedonia
  name: 北マケドニア
  names:
    - {to: 2018, name: マケドニア共和国, short: マケドニア, kind: 共和国}
    - {from: 2019, name: 北マケドニア共和国, short: 北マケドニア, kind: 共和国}
  short: 北マケドニア
  color: "#e9df92"
  kind: 共和国
  note: 1991年9月の住民投票でユーゴスラヴィアから平和的に独立した。国名をめぐってギリシアが反対し、1993年に「マケドニア旧ユーゴスラヴィア共和国」の暫定名で国連に加盟した。2018年のプレスパ協定で2019年2月に「北マケドニア共和国」と改めた。議院内閣制で首相が実権を持つ（元首の欄は初代大統領のほかは首相）。大統領はグリゴロフ（1991–1999）、トライコフスキ（1999–2004）、ツルヴェンコフスキ（2004–2009）、イヴァノフ（2009–2019）、ペンダロフスキ（2019–2024）、シリャノフスカ＝ダフコヴァ（2024–）。
  rulers:
    - {name: キロ・グリゴロフ, title: 大統領, from: 1991, to: 1999, note: 独立を主導し、ユーゴスラヴィア内戦に巻き込まれずに独立を保った。, source: "https://ja.wikipedia.org/wiki/キロ・グリゴロフ"}
    - {name: ブランコ・ツルヴェンコフスキ, title: 首相, from: 1992, to: 1998, source: "https://ja.wikipedia.org/wiki/ブランコ・ツルヴェンコフスキ"}
    - {name: リュプチョ・ゲオルギエフスキ, title: 首相, from: 1998, to: 2002, source: "https://en.wikipedia.org/wiki/Ljubčo_Georgievski"}
    - {name: ブランコ・ツルヴェンコフスキ（再任）, title: 首相, from: 2002, to: 2004, source: "https://ja.wikipedia.org/wiki/ブランコ・ツルヴェンコフスキ"}
    - {name: ヴラド・ブチコフスキ, title: 首相, from: 2004, to: 2006, note: 2004年はハリ・コストフが短期間首相。, source: "https://en.wikipedia.org/wiki/Vlado_Bučkovski"}
    - {name: ニコラ・グルエフスキ, title: 首相, from: 2006, to: 2016, note: 民族主義的な内政マケドニア革命組織（VMRO-DPMNE）。盗聴事件をきっかけに辞任し、のちハンガリーに亡命した。, source: "https://ja.wikipedia.org/wiki/ニコラ・グルエフスキ"}
    - {name: ゾラン・ザエフ, title: 首相, from: 2017, to: 2022, note: 社会民主同盟。プレスパ協定を結んだ。2016–2017年はディミトリエフ、2020年はスパソフスキの選挙管理内閣。, source: "https://ja.wikipedia.org/wiki/ゾラン・ザエフ"}
    - {name: ディミタル・コヴァチェフスキ, title: 首相, from: 2022, to: 2024, source: "https://en.wikipedia.org/wiki/Dimitar_Kovačevski"}
    - {name: フリスティヤン・ミツコスキ, title: 首相, from: 2024, note: VMRO-DPMNE。2024年はタラト・ジャフェリの選挙管理内閣ののち就任。, source: "https://en.wikipedia.org/wiki/Hristijan_Mickoski"}
  periods:
    - from: 1991
      to: 2000
      text: 平和的に独立したが、国名・国旗をめぐってギリシアに経済封鎖された（1994–1995）。1999年のコソヴォ紛争では多くのアルバニア人難民が流れ込んだ。
    - from: 2001
      to: 2016
      text: 2001年にアルバニア人の武装勢力と政府軍が衝突したが、オフリド合意でアルバニア語の公用語化など少数民族の権利を広げて収まった。2005年にEU加盟候補国となった。
    - from: 2017
      text: プレスパ協定（2018）でギリシアとの国名問題を解決して「北マケドニア」となり、2020年にNATOに加盟した。EU加盟の交渉はブルガリアとの歴史・言語の問題で遅れている。
  source: "https://ja.wikipedia.org/wiki/北マケドニア"

- id: kosovo
  name: コソヴォ
  names:
    - {from: 2008, name: コソヴォ共和国, short: コソヴォ, kind: 共和国（一部の国だけが承認）}
  short: コソヴォ
  color: "#9fb9e3"
  kind: 共和国
  note: 2008年2月17日に独立を宣言した。アメリカ・日本・EUの多くの国など100以上の国が承認しているが、セルビア・ロシア・中国などは認めていない（国連には未加盟）。2010年に国際司法裁判所は独立宣言が国際法に反しないとする意見を出した。議院内閣制で首相が実権を持つ（元首の欄は首相）。大統領はセイディウ（–2010）、ヤヒャガ（2011–2016）、サチ（2016–2020）、オスマニ（2021–）。
  rulers:
    - {name: ハシム・サチ, title: 首相, from: 2008, to: 2014, note: コソヴォ解放軍の元指導者。2016–2020年は大統領。2020年に戦争犯罪の罪で起訴されて辞任した。, source: "https://ja.wikipedia.org/wiki/ハシム・サチ"}
    - {name: イサ・ムスタファ, title: 首相, from: 2014, to: 2017, source: "https://en.wikipedia.org/wiki/Isa_Mustafa"}
    - {name: ラムシュ・ハラディナイ, title: 首相, from: 2017, to: 2020, source: "https://en.wikipedia.org/wiki/Ramush_Haradinaj"}
    - {name: アルビン・クルティ, title: 首相, from: 2020, to: 2020, source: "https://en.wikipedia.org/wiki/Albin_Kurti"}
    - {name: アヴドゥッラ・ホティ, title: 首相, from: 2020, to: 2021, source: "https://en.wikipedia.org/wiki/Avdullah_Hoti"}
    - {name: アルビン・クルティ（再任）, title: 首相, from: 2021, note: 自己決定運動。2025年2月の選挙後は議会の組閣が進まず、暫定の首相を続けた（要確認）。, source: "https://en.wikipedia.org/wiki/Albin_Kurti"}
  periods:
    - from: 2008
      text: 独立を宣言し、2013年のブリュッセル合意でセルビアとの関係の正常化を始めたが、セルビア人が多い北部では緊張が続いている。人口の約9割がアルバニア人。
  source: "https://ja.wikipedia.org/wiki/コソボ"

- id: unmik
  name: 国際連合コソヴォ暫定行政ミッション（UNMIK）
  short: コソヴォ（国連暫定統治）
  color: "#b9d3ec"
  kind: 国連の暫定統治
  note: 1999年6月、コソヴォ紛争でのNATOの空爆ののち、国連安保理決議1244で設けられた。セルビア（ユーゴスラヴィア）の主権を残したまま国連が行政を担い、NATO主体のコソヴォ治安維持部隊（KFOR）が駐留した。2001年から暫定自治政府が作られ、大統領はルゴヴァ（2002–2006）。元首の欄は国連事務総長特別代表。
  rulers:
    - {name: ベルナール・クシュネル, title: 国連事務総長特別代表, from: 1999, to: 2001, source: "https://ja.wikipedia.org/wiki/ベルナール・クシュネル"}
    - {name: ハンス・ヘッケルップ, title: 国連事務総長特別代表, from: 2001, to: 2001, source: "https://en.wikipedia.org/wiki/Hans_Hækkerup"}
    - {name: ミヒャエル・シュタイナー, title: 国連事務総長特別代表, from: 2002, to: 2003, source: "https://en.wikipedia.org/wiki/Michael_Steiner_(diplomat)"}
    - {name: ハリ・ホルケリ, title: 国連事務総長特別代表, from: 2003, to: 2004, source: "https://en.wikipedia.org/wiki/Harri_Holkeri"}
    - {name: セーレン・イェッセン＝ペーターセン, title: 国連事務総長特別代表, from: 2004, to: 2006, source: "https://en.wikipedia.org/wiki/Søren_Jessen-Petersen"}
    - {name: ヨアヒム・リュッカー, title: 国連事務総長特別代表, from: 2006, to: 2008, source: "https://en.wikipedia.org/wiki/Joachim_Rücker"}
  periods:
    - from: 1999
      to: 2007
      text: 紛争中に追われたアルバニア人難民が戻る一方、セルビア人の多くが逃れた（2004年3月には反セルビア人の暴動）。地位をめぐる交渉（アハティサーリ案）はセルビアの反対でまとまらなかった。
  source: "https://ja.wikipedia.org/wiki/国際連合コソボ暫定行政ミッション"

# ================================================================ 1914–2025：トルコ・キプロス
- id: turkey
  name: トルコ共和国
  names:
    - {to: 1919, name: アナトリア・ルメリ権利擁護委員会（国民闘争）, short: トルコ（国民闘争）, kind: 国民闘争の組織（ムスタファ・ケマルが指導）}
    - {from: 1920, to: 1922, name: トルコ大国民議会政府（アンカラ政府）, short: トルコ（アンカラ政府）, kind: 国民闘争の政府}
    - {from: 1923, name: トルコ共和国, short: トルコ, kind: 共和国}
  short: トルコ
  color: "#a9cf98"
  kind: 共和国
  note: >-
    1920年4月、ムスタファ・ケマルらがアンカラで大国民議会を開き、イスタンブルのスルタン政府に代わる政府を作った（国民闘争、ottoman から引き継ぐ）。1922年11月にスルタン制を廃止し、1923年7月のローザンヌ条約で国境が定まり、10月29日に共和国を宣言した。首都はアンカラ。
    元首の欄には実権を持つ人を書いた。1950–2014年は首相（1960・1980年の軍のクーデタの時期は軍の指導者）。2017年の国民投票で大統領制に移った。
  rulers:
    - name: ムスタファ・ケマル（アタテュルク）
      title: 大国民議会議長（1920–1923）、大統領（1923–1938）
      from: 1920
      to: 1938
      note: カリフ制の廃止（1924）、文字改革（ローマ字化、1928）、女性参政権（1934）などの近代化・世俗化を進めた。1934年に「アタテュルク（父なるトルコ人）」の姓を贈られた。
      source: "https://ja.wikipedia.org/wiki/ムスタファ・ケマル・アタテュルク"
    - {name: イスメト・イノニュ, title: 大統領, from: 1938, to: 1950, note: 第二次世界大戦では中立を保ち、1946年に複数政党制を認めた。, source: "https://ja.wikipedia.org/wiki/イスメト・イノニュ"}
    - {name: アドナン・メンデレス, title: 首相, from: 1950, to: 1960, note: 民主党。大統領はジェラル・バヤル。1960年の軍のクーデタで倒され、1961年に処刑された。, source: "https://ja.wikipedia.org/wiki/アドナン・メンデレス"}
    - {name: ジェマル・ギュルセル, title: 国家統一委員会議長（軍）、大統領（1961–1966）, from: 1960, to: 1961, source: "https://en.wikipedia.org/wiki/Cemal_Gürsel"}
    - {name: イスメト・イノニュ（首相）, title: 首相, from: 1961, to: 1965, source: "https://ja.wikipedia.org/wiki/イスメト・イノニュ"}
    - {name: スレイマン・デミレル, title: 首相, from: 1965, to: 1971, note: 公正党。1971年に軍の「書簡によるクーデタ」で辞任した。, source: "https://ja.wikipedia.org/wiki/スレイマン・デミレル"}
    - {name: 軍の後押しを受けた内閣, title: 首相（エリム・メレン・タル）, from: 1971, to: 1973, source: "https://en.wikipedia.org/wiki/1971_Turkish_military_memorandum"}
    - name: ビュレント・エジェヴィトとスレイマン・デミレル
      title: 首相（交互）
      from: 1974
      to: 1980
      note: 共和人民党のエジェヴィト（1974。キプロス出兵を命じた。1977、1978–1979）と公正党のデミレル（1975–1977、1977–1978、1979–1980）が交互に政権を担った。左右の政治暴力で多くの死者が出た。
      source: "https://en.wikipedia.org/wiki/List_of_prime_ministers_of_Turkey"
    - {name: ケナン・エヴレン, title: 国家保安評議会議長（軍）、大統領（1982–1989）, from: 1980, to: 1983, note: 1980年9月のクーデタで政党を解散させ、1982年に新憲法を定めた。, source: "https://ja.wikipedia.org/wiki/ケナン・エヴレン"}
    - {name: トゥルグト・オザル, title: 首相（1983–1989）、大統領（1989–1993）, from: 1983, to: 1991, note: 祖国党。経済の自由化を進めた。1991年まで政治の中心にいた。, source: "https://ja.wikipedia.org/wiki/トゥルグト・オザル"}
    - {name: スレイマン・デミレル（再任）, title: 首相, from: 1991, to: 1993, note: 1993–2000年は大統領。, source: "https://ja.wikipedia.org/wiki/スレイマン・デミレル"}
    - {name: タンス・チルレル, title: 首相, from: 1993, to: 1996, note: トルコ初の女性首相。, source: "https://ja.wikipedia.org/wiki/タンス・チルレル"}
    - {name: ネジメッティン・エルバカン, title: 首相, from: 1996, to: 1997, note: イスラーム系の福祉党。軍の圧力で辞任した（「ポストモダン・クーデタ」）。, source: "https://ja.wikipedia.org/wiki/ネジメッティン・エルバカン"}
    - {name: メスット・ユルマズ, title: 首相, from: 1997, to: 1999, source: "https://ja.wikipedia.org/wiki/メスット・ユルマズ"}
    - {name: ビュレント・エジェヴィト（再任）, title: 首相, from: 1999, to: 2002, source: "https://ja.wikipedia.org/wiki/ビュレント・エジェヴィト"}
    - {name: アブドゥッラー・ギュル, title: 首相, from: 2002, to: 2003, note: 2007–2014年は大統領。, source: "https://ja.wikipedia.org/wiki/アブドゥッラー・ギュル"}
    - name: レジェップ・タイイップ・エルドアン
      title: 首相（2003–2014）、大統領（2014–）
      from: 2003
      note: 公正発展党（AKP）。2016年7月のクーデタ未遂ののち非常事態のもとで反対派を大量に処分し、2017年の国民投票で強い大統領制に改めた。
      source: "https://ja.wikipedia.org/wiki/レジェップ・タイイップ・エルドアン"
  periods:
    - from: 1920
      to: 1922
      text: 大国民議会政府がセーヴル条約を拒み、東部でアルメニアを破り（1920）、ソヴィエト・ロシアと国境を定め（1921）、南部からフランス軍を去らせた。サカリヤの戦い（1921）・大攻勢（1922）でギリシア軍を小アジアから追い出した。
    - from: 1923
      to: 1938
      text: ローザンヌ条約で国境と主権を回復し、ギリシアとの住民交換を行った。アタテュルクが共和人民党の一党体制のもとで、カリフ制の廃止、イスラーム法に代わる民法、ローマ字の採用、女性参政権など近代化・世俗化を進めた。1925年のクルド人の反乱などは鎮圧された。
    - from: 1939
      to: 1949
      text: 第二次世界大戦では中立を保ち（1945年2月に名目的に参戦）、戦後はソ連の圧力に対してアメリカの援助を受けた（トルーマン・ドクトリン）。1946年に複数政党制となった。1939年にハタイ（アレクサンドレッタ）をシリアから編入した。
    - from: 1950
      to: 1979
      text: 民主党が選挙で政権をとり、1952年にNATOに加盟した。1960年・1971年に軍が政治に介入した。1974年にキプロスに出兵して島の北部を占領した。
    - from: 1980
      to: 2002
      text: 1980年の軍のクーデタののち、オザルのもとで経済の自由化が進み、多くの人が西ドイツなどに働きに出た。1984年からクルディスタン労働者党（PKK）との武力紛争が続いた。1999年にEU加盟候補国となった。
    - from: 2003
      text: エルドアンの公正発展党のもとで経済が成長したが、2010年代から権威主義を強めた。シリア内戦では約300万人の難民を受け入れ、シリア北部に出兵した。2023年2月の大地震で5万人以上が死亡した。2025年にPKKが武装解除を表明した。
  source:
    - "https://ja.wikipedia.org/wiki/トルコ"
    - "https://ja.wikipedia.org/wiki/トルコ革命"

- id: hatay_state
