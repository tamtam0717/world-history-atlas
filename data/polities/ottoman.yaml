  note: カザフは大・中・小の3ジュズ（部族連合）に分かれ、地図の範囲（カザフスタン西部）はおもに小ジュズの遊牧地。1731年に小ジュズのアブルハイル・ハンがロシアの臣籍に入ったが、支配は名目的。
  periods:
    - from: 1648
      to: 1730
      text: カザフ諸部族の遊牧地。東からジュンガルの攻撃を受け（「大災厄」1723年）、西のカルムイクとも争った。
    - from: 1731
      to: 1815
      text: 小ジュズはロシアの保護を求めた。ロシアはオレンブルク（1743）などの要塞線を築いて草原に進出した。1801年にはヴォルガ・ウラル間にブケイ・オルダが置かれた。
  source: "https://ja.wikipedia.org/wiki/カザフ・ハン国"

