    - {name: タフマースブ2世, title: シャー（サファヴィー朝）, from: 1722, to: 1732, note: アフガン支配下で北部に拠った。1726年からナーディル・クリー・ベグ（のちのナーディル・シャー）が軍を率いた。}
    - {name: アッバース3世, title: シャー（サファヴィー朝）, from: 1732, to: 1736, note: 幼児。実権はナーディル。}
    - {name: ナーディル・シャー, title: シャー（アフシャール朝）, from: 1736, to: 1747, source: "https://ja.wikipedia.org/wiki/ナーディル・シャー"}
    - {name: アーディル・シャー, title: シャー（アフシャール朝）, from: 1747, to: 1748}
    - {name: イブラーヒーム・シャー, title: シャー（アフシャール朝）, from: 1748, to: 1748}
