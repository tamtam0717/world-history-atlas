    - {name: ホラズム人民ソヴィエト共和国の政府, title: 人民代表会議の政府, from: 1920, to: 1924, note: 1924年の民族境界画定でウズベク・トルクメン両共和国などに分けられた。, source: "https://ja.wikipedia.org/wiki/ホラズム人民ソビエト共和国"}
  periods:
