  note: 1993年のオスロ合意で作られたパレスチナ人の自治政府（1994年からガザとエリコ、1995年から西岸の都市部）。2007年からガザはイスラーム主義組織ハマースが支配し、西岸のファタハ主導の自治政府と分かれている。2012年に国連のオブザーバー国家となり、約150の国がパレスチナ国を承認している（2025年にイギリス・フランスなども承認）。西岸は地域の大半（C地区）をイスラエル軍が支配しているので、地図ではイスラエルの占領地として描いた。
  rulers:
