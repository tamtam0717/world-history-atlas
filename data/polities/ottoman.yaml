    - {name: ブルハーヌッディーン・ラッバーニー, title: 大統領, from: 1992, to: 1996, note: ムジャーヒディーン諸派の内戦が続いた。1996年にカーブルを追われた後も国際的には正統な政府とされた。, source: "https://ja.wikipedia.org/wiki/ブルハーヌッディーン・ラッバーニー"}
    - {name: ムハンマド・ウマル, title: ターリバーンの最高指導者（信徒の長）, from: 1996, to: 2001, note: ヘラートなど西部は1995年からターリバーンが支配した。, source: "https://ja.wikipedia.org/wiki/ムハンマド・オマル"}
    - {name: ハーミド・カルザイ, title: 暫定行政機構議長・大統領, from: 2001, to: 2014, source: "https://ja.wikipedia.org/wiki/ハーミド・カルザイ"}
    - {name: アシュラフ・ガニー, title: 大統領, from: 2014, to: 2021, note: 2021年8月、ターリバーンのカーブル進攻で国外に逃れた。, source: "https://ja.wikipedia.org/wiki/アシュラフ・ガニー"}
    - {name: ハイバトゥッラー・アクンザダ, title: ターリバーンの最高指導者, from: 2021, note: ターリバーン政権を正式に承認した国はロシア（2025年7月）だけ。, source: "https://ja.wikipedia.org/wiki/ハイバトゥッラー・アクンザダ"}
  periods:
    - from: 1826
      to: 1878
      text: ドースト・モハンマドが国を立て直したが、ロシアの南下をおそれたイギリスが侵攻した（第一次アフガン戦争、1838–1842）。イギリス軍は大敗して撤退し、ドースト・モハンマドが復位してカンダハール・ヘラートを統合した。
    - from: 1879
      to: 1914
      text: 第二次アフガン戦争（1878–1880）ののち、ガンダマク条約で外交をイギリスに委ねる保護国となった。英露の緩衝国として国境が定められ（パンジデ事件1885、デュアランド・ライン1893）、アブドゥッラフマーンが中央集権化を進めた。
    - from: 1919
      to: 1972
      text: 第三次アフガン戦争でイギリスから完全な独立を取り戻した。アマーヌッラーの急な近代化は反発を招いたが、ザーヒル・シャーの長い治世のもとで中立を保ち、米ソ双方から援助を受けた。
    - from: 1973
      to: 1989
      text: ダーウードのクーデタで共和制となり、1978年に共産主義の人民民主党が政権を奪った（サウル革命）。反乱が広がると1979年12月にソ連が軍事介入し、ムジャーヒディーン（イスラーム戦士）とのゲリラ戦の末、1989年に撤退した。
    - from: 1990
      to: 2001
      text: 共産党政権の崩壊後、ムジャーヒディーン諸派の内戦となり、パキスタンの後押しを受けたターリバーンが1996年にカーブルを押さえた。ターリバーンはアル＝カーイダのビン・ラーディンをかくまった。
    - from: 2001
      to: 2020
      text: 同時多発テロ（2001年9月）ののち、アメリカなどの攻撃でターリバーン政権が倒れ、カルザイの政府が作られた。NATOの部隊が駐留したが、ターリバーンの反攻が続いた。
    - from: 2021
      text: アメリカ軍の撤退のさなかにターリバーンが全土を押さえ、イスラーム首長国を復活させた。女性の教育や就労が厳しく制限されている。
  source: "https://ja.wikipedia.org/wiki/バーラクザイ朝"
  names:
    - {to: 1925, name: アフガニスタン（バーラクザイ朝）, kind: 王国（アミール）}
    - {from: 1926, to: 1972, name: アフガニスタン王国, kind: 王国}
    - {from: 1973, to: 1977, name: アフガニスタン共和国, kind: 共和国}
    - {from: 1978, to: 1991, name: アフガニスタン民主共和国, kind: 社会主義国（人民民主党）}
    - {from: 1992, to: 1995, name: アフガニスタン・イスラーム国, kind: 共和国（内戦）}
    - {from: 1996, to: 2000, name: アフガニスタン・イスラーム首長国（ターリバーン）, kind: イスラーム首長国}
    - {from: 2001, to: 2020, name: アフガニスタン・イスラーム共和国, kind: 共和国}
    - {from: 2021, name: アフガニスタン・イスラーム首長国（ターリバーン）, kind: イスラーム首長国}

