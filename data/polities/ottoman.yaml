    - from: 1915
      to: 1922
      text: 参戦をめぐって国王と首相ヴェニゼロスが対立し（国家分裂）、1917年に協商国側で参戦した。戦後、セーヴル条約でイズミル地方と東トラキアを得たが、小アジアへの進軍はトルコの国民軍に敗れ（1922、「小アジアの破局」）、多くのギリシア人が難民となった。
    - from: 1923
      to: 1940
      text: ローザンヌ条約でトルコとの住民交換が行われ、約120万人の難民を受け入れた。共和制とクーデタがくり返され、1935年に王制が戻り、1936年からメタクサスの独裁となった。1940年10月、イタリアの侵攻を退けた。
    - from: 1941
      to: 1949
      text: 1941年にドイツ・イタリア・ブルガリアに分割占領され、飢餓と抵抗運動、ユダヤ人の強制移送が起きた。1944年の解放後、共産党系と政府軍の内戦（1946–1949）となり、アメリカの援助（トルーマン・ドクトリン）を受けた政府側が勝った。1947年にドデカネス諸島を得た。
    - from: 1950
      to: 1974
      text: NATOに加盟し（1952）、経済が成長した。1967年に軍がクーデタで実権を握り（大佐たちの政権）、1973年に王制を廃止した。1974年のキプロスでのクーデタの失敗で軍事政権は倒れた。
    - from: 1974
      to: 2009
      text: 民主政に戻り、国民投票で王制を廃止した（第三共和政）。1981年にEC（ヨーロッパ共同体）に加盟し、2001年にユーロを導入、2004年にアテネ・オリンピックを開いた。
    - from: 2010
      text: 財政危機（ギリシア危機）でEU・IMFの支援を受け、厳しい緊縮策のもとで失業が増えた。2015年には難民・移民が島々に押し寄せた。2019年に隣国の国名を「北マケドニア」とする合意（プレスパ協定）が発効した。
  source: "https://ja.wikipedia.org/wiki/ギリシャ王国"

- id: romania
  name: ルーマニア
  names:
    - {to: 1861, name: モルダヴィア・ワラキア連合公国, short: 連合公国, kind: 公国（オスマン帝国の宗主権下）}
    - {from: 1862, to: 1877, name: ルーマニア公国, kind: 公国（オスマン帝国の宗主権下）}
    - {from: 1878, to: 1880, name: ルーマニア公国, kind: 公国}
    - {from: 1881, to: 1946, name: ルーマニア王国, kind: 王国}
    - {from: 1947, to: 1964, name: ルーマニア人民共和国, kind: 社会主義国（共産党の一党独裁）}
    - {from: 1965, to: 1988, name: ルーマニア社会主義共和国, kind: 社会主義国（共産党の一党独裁）}
    - {from: 1989, name: ルーマニア, kind: 共和国}
  short: ルーマニア
  color: "#c2aee0"
  kind: 王国
  note: 1859年にモルダヴィアとワラキアがともにクザを公に選び、1862年に政府と議会を一つにしてルーマニアと名のった。首都はブカレスト。1878年のベルリン条約で独立が認められ、南ベッサラビアをロシアに返す代わりに北ドブルジャを得た。
  rulers:
    - {name: アレクサンドル・ヨアン・クザ, title: 連合公国の公, from: 1859, to: 1866, note: 修道院領の没収や農地改革を進めたが、クーデタで退位させられた。, source: "https://ja.wikipedia.org/wiki/アレクサンドル・ヨアン・クザ"}
    - {name: カロル1世, title: ルーマニア公（1881年から国王）, from: 1866, to: 1914, note: プロイセン王家の分家ホーエンツォレルン＝ジグマリンゲン家の出身。, source: "https://ja.wikipedia.org/wiki/カロル1世"}
    - {name: フェルディナンド1世, title: ルーマニア王, from: 1914, to: 1927, source: "https://ja.wikipedia.org/wiki/フェルディナンド1世_(ルーマニア王)"}
    - {name: ミハイ1世, title: ルーマニア王, from: 1927, to: 1930, note: 幼少のため摂政が統治した。, source: "https://ja.wikipedia.org/wiki/ミハイ1世"}
    - {name: カロル2世, title: ルーマニア王, from: 1930, to: 1940, note: 1938年から国王の独裁。1940年の領土喪失で退位した。, source: "https://ja.wikipedia.org/wiki/カロル2世"}
    - {name: イオン・アントネスク, title: 国家指導者（コンドゥカトル）, from: 1940, to: 1944, note: 国王はミハイ1世（復位）。ドイツ側で独ソ戦に加わった。1944年8月23日に国王のクーデタで逮捕された。, source: "https://ja.wikipedia.org/wiki/イオン・アントネスク"}
    - {name: ミハイ1世（復位）, title: ルーマニア王, from: 1944, to: 1947, note: 1945年からソ連が後押しするグローザ内閣。1947年12月に退位させられた。, source: "https://ja.wikipedia.org/wiki/ミハイ1世"}
    - {name: ゲオルゲ・ゲオルギウ＝デジ, title: ルーマニア労働者党第一書記, from: 1948, to: 1965, source: "https://ja.wikipedia.org/wiki/ゲオルゲ・ゲオルギウ＝デジ"}
    - {name: ニコラエ・チャウシェスク, title: 共産党書記長（1974年から大統領）, from: 1965, to: 1989, note: 1989年12月の革命で処刑された。, source: "https://ja.wikipedia.org/wiki/ニコラエ・チャウシェスク"}
    - {name: イオン・イリエスク, title: 救国戦線評議会議長・大統領, from: 1989, to: 1996, source: "https://ja.wikipedia.org/wiki/イオン・イリエスク"}
    - {name: エミル・コンスタンティネスク, title: 大統領, from: 1996, to: 2000, source: "https://en.wikipedia.org/wiki/Emil_Constantinescu"}
    - {name: イオン・イリエスク（再任）, title: 大統領, from: 2000, to: 2004, source: "https://ja.wikipedia.org/wiki/イオン・イリエスク"}
    - {name: トライアン・バセスク, title: 大統領, from: 2004, to: 2014, source: "https://ja.wikipedia.org/wiki/トライアン・バセスク"}
    - {name: クラウス・ヨハニス, title: 大統領, from: 2014, to: 2025, note: 2024年の大統領選挙は外国の干渉を理由に憲法裁判所が無効とし、ヨハニスは2025年2月に辞任した（ボロジャン上院議長が代行）。, source: "https://ja.wikipedia.org/wiki/クラウス・ヨハニス"}
    - {name: ニクショル・ダン, title: 大統領, from: 2025, note: 2025年5月のやり直し選挙で当選した。, source: "https://en.wikipedia.org/wiki/Nicușor_Dan"}
  periods:
    - from: 1859
      to: 1877
      text: クザのもとで二公国が合同し、近代国家の制度が整えられた。1866年に外国の王家からカロルを迎え、同年の憲法で立憲君主制となった。
    - from: 1878
      to: 1906
      text: 露土戦争でロシアとともに戦い（プレヴェン包囲）、ベルリン条約で独立が認められた。1881年に王国となり、穀物と石油の輸出で経済が伸びた。1883年に三国同盟と秘密の同盟を結んだ。
    - from: 1907
      to: 1914
      text: 1907年に大規模な農民反乱が起こり、軍が鎮圧した。第二次バルカン戦争（1913）でブルガリアに出兵し、ブカレスト条約で南ドブルジャを得た。トランシルヴァニアのルーマニア人の問題でオーストリア＝ハンガリーとの関係は冷え、1914年の大戦では中立を宣言した。
    - from: 1915
      to: 1918
      text: 1916年に協商国側で参戦してトランシルヴァニアに攻め込んだが、ドイツ・オーストリア＝ハンガリー・ブルガリアに反撃され、首都ブカレストを含むワラキアとドブルジャを占領された。政府はヤシに移って抵抗した。1918年、ベッサラビア・ブコヴィナ・トランシルヴァニアが合同を宣言した。
    - from: 1919
      to: 1939
      text: 講和条約で領土と人口がほぼ倍になった（大ルーマニア）。農地改革と普通選挙が行われたが、少数民族の問題をかかえ、1930年代には極右の「鉄衛団」が伸び、1938年に国王の独裁となった。
    - from: 1940
      to: 1944
      text: 1940年に、ソ連にベッサラビアと北ブコヴィナを、ハンガリーに北トランシルヴァニア（第2次ウィーン裁定）を、ブルガリアに南ドブルジャを奪われた。アントネスクの独裁のもとドイツ側で独ソ戦に加わり、ユダヤ人やロマの迫害・虐殺も行われた。1944年8月に国王のクーデタで連合国側に移った。
    - from: 1945
      to: 1964
      text: ソ連の後押しで共産党が実権を握り、1947年に王制を廃止して人民共和国となった。北トランシルヴァニアを取り戻した（パリ講和条約、1947）。土地の集団化と工業化が進められた。
    - from: 1965
      to: 1989
      text: チャウシェスクがソ連から距離を置く独自の外交を行ったが、国内では個人崇拝と秘密警察による支配を強め、対外債務の返済のための耐乏生活を強いた。1989年12月の革命で政権は倒れた。
    - from: 1990
      text: 民主化と市場経済への移行を進め、2004年にNATO、2007年にEUに加盟した。多くの人が西欧へ出稼ぎに出ている。
  source: "https://ja.wikipedia.org/wiki/ルーマニア王国"

- id: bulgaria
  name: ブルガリア
  names:
    - {to: 1877, name: ブルガリア（オスマン帝国領）, short: ブルガリア, kind: オスマン帝国の州（ドナウ州など）。公国の成立は1878年}
    - {from: 1878, to: 1907, name: ブルガリア公国, kind: 公国（オスマン帝国の宗主権下）}
    - {from: 1908, to: 1945, name: ブルガリア王国, kind: 王国（ツァール）}
    - {from: 1946, to: 1989, name: ブルガリア人民共和国, kind: 社会主義国（共産党の一党独裁）}
    - {from: 1990, name: ブルガリア共和国, kind: 共和国}
  short: ブルガリア
  color: "#e3a3a8"
  kind: 公国
  note: 1878年のサン＝ステファノ条約で大ブルガリアが約束されたが、ベルリン条約でバルカン山脈の北とソフィア周辺だけの公国（オスマン帝国の宗主権下）とされた。1885年に東ルメリを事実上併合し（1886年のトプハネ協定でブルガリア公が東ルメリ総督を兼ねる）、1908年に独立を宣言して王国（ツァール国）となった。
  rulers:
    - {name: ロシアの臨時統治（ドンドゥコフ＝コルサコフ）, title: ロシアの帝国全権委員, from: 1878, to: 1878, note: 1879年4月のタルノヴォ憲法制定とブルガリア公の選出まで。, source: "https://en.wikipedia.org/wiki/Alexander_Dondukov-Korsakov"}
    - {name: アレクサンドル1世（バッテンベルク）, title: ブルガリア公, from: 1879, to: 1886, note: ロシアの支持を失い、1886年のクーデタののち退位。, source: "https://ja.wikipedia.org/wiki/アレクサンダル1世_(ブルガリア公)"}
    - {name: フェルディナンド1世, title: ブルガリア公（1908年からツァール）, from: 1887, to: 1918, note: ザクセン＝コーブルク＝ゴータ家の出身。1887–1894年はスタンボロフ首相が実権を握った。, source: "https://ja.wikipedia.org/wiki/フェルディナンド1世_(ブルガリア王)"}
    - {name: ボリス3世, title: ツァール（国王）, from: 1918, to: 1943, note: 1934年の軍人のクーデタののち、1935年から国王の独裁。1943年8月に急死した。, source: "https://ja.wikipedia.org/wiki/ボリス3世"}
    - {name: シメオン2世, title: ツァール（国王）, from: 1943, to: 1946, note: 6歳で即位し、叔父キリルらの摂政団が統治した（摂政団は1945年に処刑）。1946年の国民投票で王制が廃止された。, source: "https://ja.wikipedia.org/wiki/シメオン2世"}
    - {name: ゲオルギ・ディミトロフ, title: 共産党の指導者・首相, from: 1946, to: 1949, note: コミンテルン（共産主義インターナショナル）の書記長だった。, source: "https://ja.wikipedia.org/wiki/ゲオルギ・ディミトロフ"}
    - {name: ヴァシル・コラロフ, title: 首相, from: 1949, to: 1950, source: "https://en.wikipedia.org/wiki/Vasil_Kolarov"}
    - {name: ヴァルコ・チェルヴェンコフ, title: 共産党書記長・首相, from: 1950, to: 1954, note: 「小スターリン」と呼ばれた。, source: "https://en.wikipedia.org/wiki/Valko_Chervenkov"}
    - {name: トドル・ジフコフ, title: 共産党第一書記（書記長）, from: 1954, to: 1989, note: 1971年から国家評議会議長も兼ねた。1989年11月に党内の改革派に退けられた。, source: "https://ja.wikipedia.org/wiki/トドル・ジフコフ"}
    - {name: ペタル・ムラデノフ, title: 共産党書記長・国家元首, from: 1989, to: 1990, source: "https://en.wikipedia.org/wiki/Petar_Mladenov"}
    - name: 首相（1990–2001）
      title: 首相
      from: 1990
      to: 2001
      note: 議院内閣制で首相が実権を持つ。ルカノフ（1990）、ポポフ（1990–1991）、フィリプ・ディミトロフ（1991–1992）、ベロフ（1992–1994）、インジョヴァ（1994–1995）、ヴィデノフ（1995–1997。財政破綻）、ソフィヤンスキ（1997）、イヴァン・コストフ（1997–2001）。大統領はジェレフ（1990–1997）、ストヤノフ（1997–2002）。
      source: "https://en.wikipedia.org/wiki/List_of_prime_ministers_of_Bulgaria"
    - {name: シメオン・サクスコブルクゴツキ（シメオン2世）, title: 首相, from: 2001, to: 2005, note: 元国王が政党を作って選挙に勝った。, source: "https://ja.wikipedia.org/wiki/シメオン2世"}
    - {name: セルゲイ・スタニシェフ, title: 首相, from: 2005, to: 2009, source: "https://en.wikipedia.org/wiki/Sergei_Stanishev"}
    - {name: ボイコ・ボリソフ, title: 首相, from: 2009, to: 2013, source: "https://ja.wikipedia.org/wiki/ボイコ・ボリソフ"}
    - {name: プラメン・オレシャルスキ, title: 首相, from: 2013, to: 2014, source: "https://en.wikipedia.org/wiki/Plamen_Oresharski"}
    - {name: ボイコ・ボリソフ（再任）, title: 首相, from: 2014, to: 2021, note: 2017年に一時選挙管理内閣（ゲルジコフ）をはさんだ。, source: "https://ja.wikipedia.org/wiki/ボイコ・ボリソフ"}
    - name: 首相（2021–）
      title: 首相
      from: 2021
      note: 2021年からくり返し議会選挙が行われ、選挙管理内閣が多い。ヤネフ（2021）、キリル・ペトコフ（2021–2022）、ドネフ（2022–2023）、デンコフ（2023–2024）、グラフチェフ（2024–2025）、ローゼン・ジェリャズコフ（2025年1月–。2025年12月に辞任を表明、要確認）。大統領はルメン・ラデフ（2017–）。2025年1月からシェンゲン圏に全面加盟し、2026年1月にユーロを導入した。
      source: "https://en.wikipedia.org/wiki/List_of_prime_ministers_of_Bulgaria"
  periods:
    - from: 1878
      to: 1885
      text: ベルリン条約で、ロシアの支援のもと自治公国として出発した（首都ソフィア、1879年のタルノヴォ憲法）。南の東ルメリはオスマン帝国の自治州として切り離された。
    - from: 1885
      to: 1907
      text: 東ルメリの統合（1885）に反発したセルビアの侵攻をスリヴニツァの戦いで退けた。ロシアと対立しながらフェルディナンド公とスタンボロフ首相のもとで国づくりを進め、マケドニアの獲得をめざした（1903年イリンデン蜂起）。
    - from: 1908
      to: 1914
      text: 青年トルコ人革命の混乱をついて独立を宣言し、王国となった。第一次バルカン戦争でトラキアに進んだが、マケドニアの分け方をめぐってセルビア・ギリシアと戦った第二次バルカン戦争（1913）に敗れ、南ドブルジャを失った（西トラキアは保った）。
    - from: 1915
      to: 1918
      text: マケドニアを求めてドイツ側で第一次世界大戦に加わり、セルビア領マケドニアや南ドブルジャを占領したが、1918年9月のサロニカ戦線の崩壊で降伏し、フェルディナンドは退位した。
    - from: 1919
      to: 1934
      text: ヌイイ条約で西トラキア（エーゲ海への出口）と西部の国境地帯を失い、賠償を課された。農民同盟のスタンボリスキが改革を進めたが、1923年のクーデタで殺され、政情が不安定になった。
    - from: 1935
      to: 1944
      text: ボリス3世の独裁のもと、1940年に南ドブルジャを取り戻し、1941年に枢軸国側に加わってマケドニアと西トラキアを占領した。本国のユダヤ人は移送を免れたが、占領地のユダヤ人は移送された。1944年9月、ソ連軍の進攻と祖国戦線のクーデタで連合国側に移った。
    - from: 1945
      to: 1989
      text: 共産党の一党独裁となり、1946年に王制を廃止した。ジフコフの長期政権のもとでソ連に最も忠実な衛星国の一つとなった。1980年代にはトルコ系住民に改名を強制し、約30万人がトルコへ移った（1989）。
    - from: 1990
      text: 複数政党制と市場経済に移った。1990年代後半の経済危機を経て、2004年にNATO、2007年にEUに加盟した。
  source: "https://ja.wikipedia.org/wiki/ブルガリア公国"

- id: eastern_rumelia
  name: 東ルメリ自治州
  short: 東ルメリ
  color: "#d8e3a4"
  kind: 自治州（オスマン帝国内）
  note: ベルリン条約でバルカン山脈の南に置かれた、キリスト教徒の総督が治めるオスマン帝国の自治州。州都プロヴディフ。1885年のプロヴディフの蜂起でブルガリアに統合された。
  rulers:
    - {name: ロシアの臨時統治, title: ロシア軍の占領行政, from: 1878, to: 1878, note: 1879年5月にロシア軍が撤退し、最初の総督が着任した。, source: "https://ja.wikipedia.org/wiki/東ルメリ自治州"}
    - {name: アレコ・ボゴリディ, title: 東ルメリ総督, from: 1879, to: 1884, source: "https://en.wikipedia.org/wiki/Alexander_Bogoridi"}
    - {name: ガヴリル・クラステヴィチ, title: 東ルメリ総督, from: 1884, to: 1885, source: "https://en.wikipedia.org/wiki/Gavril_Krastevich"}
  periods:
    - from: 1878
      to: 1885
      text: 住民の多くはブルガリア人で、ブルガリア公国との統合を求める運動が続き、1885年9月にプロヴディフで無血の蜂起が起きて統合が宣言された。
  source: "https://ja.wikipedia.org/wiki/東ルメリ自治州"

- id: albania
  name: アルバニア公国
  names:
