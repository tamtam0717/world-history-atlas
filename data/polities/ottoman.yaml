  periods:
    - from: 1912
      to: 1914
      text: 第一次バルカン戦争のさなかに独立を宣言したが、領土の大半はセルビア・モンテネグロ・ギリシアの軍に占領されていた。列強が独立を認めて公国としたが、1914年には南部（北イピロス）でギリシア系住民が自治を宣言し、大戦が始まるとギリシア軍とイタリア軍（ヴロラ）が再び進駐した。
    - from: 1915
      to: 1919
      text: 第一次世界大戦中、セルビア・モンテネグロ・ギリシア、のちにオーストリア＝ハンガリー（北部・中部）、イタリア（南部・ヴロラ）、フランス（コルチャ）の軍に占領され、国家はほとんど機能しなかった。
    - from: 1920
      to: 1938
      text: ルシュニャ会議（1920）で国家を立て直し、ヴロラからイタリア軍を追い出した。ゾグが共和国の大統領を経て国王となり（1928）、イタリアの経済的な支配が強まった。
    - from: 1939
      to: 1944
      text: 1939年4月にイタリアに占領され、イタリア王が王位を兼ねた。1941年にはコソヴォと西マケドニアがアルバニアに加えられた。1943年のイタリアの降伏後はドイツが占領した。1944年11月、共産党のパルチザンが国土を解放した。
    - from: 1945
      to: 1990
      text: ホジャの労働党による独裁で、ユーゴスラヴィア・ソ連・中国と次々に断交し、ヨーロッパで最も孤立した国となった。
    - from: 1991
      text: 複数政党制に移り、多くの人がイタリア・ギリシアに渡った。1997年にねずみ講の破綻で国が混乱した。2009年にNATOに加盟し、EU加盟の交渉を進めている。
  source: "https://ja.wikipedia.org/wiki/アルバニア公国"

