  periods:
    - from: 1648
      to: 1710
      text: オスマン帝国に貢納する付庸国。ポーランド、ロシア、トランシルヴァニアの間で揺れ、公の交代が相次いだ。
    - from: 1711
      to: 1773
      text: ディミトリエ・カンテミールがロシアと結んで敗れたのち、オスマン帝国はファナリオティスを公に任命するようになった（ファナリオティス時代）。
    - from: 1774
      to: 1815
      text: 1775年に北部のブコヴィナをオーストリアに奪われ、1812年のブカレスト条約でプルート川以東（ベッサラビア）をロシアに割譲した。
    - from: 1816
      to: 1852
      text: 1821年にアレクサンドロス・イプシランティがヤシで蜂起（ギリシア独立戦争の始まり）。ファナリオティス時代が終わり、アドリアノープル条約（1829）でロシアの保護下に入って組織規程のもとで治められた。
    - from: 1853
      to: 1858
      text: クリミア戦争後のパリ条約（1856）で、ロシアから南ベッサラビア（カフル・ボルフラド・イズマイル）を取り戻した。1859年にワラキアと同じ公クザを選んで合同した（→ルーマニア）。
  source: "https://ja.wikipedia.org/wiki/モルダヴィア"

