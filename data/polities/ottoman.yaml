    - from: 1804
      to: 1810
      text: 1804年にロシアの保護下に入り、1810年に併合された。
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Imereti"

- id: mingrelia
  name: ミングレリア公国
  short: ミングレリア
  color: "#c3d8a1"
  kind: 公国
  note: ジョージア西部、黒海沿岸の公国（ダディアニ家）。1803年にロシアの保護国となり、1857年にロシアの直接統治に移され、1867年に公国は廃止された。
  source: "https://en.wikipedia.org/wiki/Principality_of_Mingrelia"

- id: guria
