      to: 1862
      text: ペルシアはヘラートの奪回をめざして1837–1838年と1856年に攻めたが、イギリスが軍事介入して阻んだ（パリ条約、1857）。1863年にドースト・モハンマドが攻め落とし、アフガニスタンに統合された。
  source: "https://en.wikipedia.org/wiki/Emirate_of_Herat"

- id: afghanistan
  name: アフガニスタン（バーラクザイ朝）
  short: アフガニスタン
  color: "#d5c2a0"
  kind: 王国（アミール）
  note: 1818年以後、バーラクザイ家の兄弟がカーブル・カンダハールなどを分けて治めた。ドースト・モハンマドが1826年にカーブルを押さえ、1834年からアミールを称した。地図の範囲はアフガニスタン西部（ファラー・ニームルーズ・ヘラート）だけ。1879年のガンダマク条約から外交はイギリスが握った（保護国）。
  rulers:
    - {name: ドースト・モハンマド・ハーン, title: カーブルのアミール, from: 1826, to: 1839, source: "https://ja.wikipedia.org/wiki/ドースト・ムハンマド・ハーン"}
    - {name: シュジャー・シャー, title: シャー（イギリスが擁立）, from: 1839, to: 1842, note: 第一次アフガン戦争でイギリスが復位させたが、1842年に殺された。, source: "https://en.wikipedia.org/wiki/Shah_Shuja_Durrani"}
    - {name: ドースト・モハンマド・ハーン（再任）, title: アミール, from: 1842, to: 1863, note: 1855年にカンダハール、1863年にヘラートを併合した。, source: "https://ja.wikipedia.org/wiki/ドースト・ムハンマド・ハーン"}
    - {name: シール・アリー・ハーン, title: アミール, from: 1863, to: 1866, source: "https://en.wikipedia.org/wiki/Sher_Ali_Khan"}
    - {name: モハンマド・アフザル・ハーン, title: アミール, from: 1866, to: 1867, source: "https://en.wikipedia.org/wiki/Mohammad_Afzal_Khan"}
    - {name: モハンマド・アアザム・ハーン, title: アミール, from: 1867, to: 1868, source: "https://en.wikipedia.org/wiki/Mohammad_Azam_Khan"}
    - {name: シール・アリー・ハーン（再任）, title: アミール, from: 1868, to: 1879, source: "https://en.wikipedia.org/wiki/Sher_Ali_Khan"}
    - {name: モハンマド・ヤアクーブ・ハーン, title: アミール, from: 1879, to: 1879, note: ガンダマク条約を結んだ。, source: "https://en.wikipedia.org/wiki/Mohammad_Yaqub_Khan"}
    - {name: アブドゥッラフマーン・ハーン, title: アミール, from: 1880, to: 1901, note: 「鉄のアミール」。デュアランド・ライン（1893）を認めた。, source: "https://ja.wikipedia.org/wiki/アブドゥッラフマーン・ハーン"}
    - {name: ハビーブッラー・ハーン, title: アミール, from: 1901, to: 1919, source: "https://en.wikipedia.org/wiki/Habibullah_Khan"}
  periods:
    - from: 1826
      to: 1878
      text: ドースト・モハンマドが国を立て直したが、ロシアの南下をおそれたイギリスが侵攻した（第一次アフガン戦争、1838–1842）。イギリス軍は大敗して撤退し、ドースト・モハンマドが復位してカンダハール・ヘラートを統合した。
    - from: 1879
      to: 1914
      text: 第二次アフガン戦争（1878–1880）ののち、ガンダマク条約で外交をイギリスに委ねる保護国となった。英露の緩衝国として国境が定められ（パンジデ事件1885、デュアランド・ライン1893）、アブドゥッラフマーンが中央集権化を進めた。
  source: "https://ja.wikipedia.org/wiki/バーラクザイ朝"

- id: kalat
  name: カラート・ハン国
  short: カラート
  color: "#cbbf9b"
  kind: ハン国
  rulers:
    - {name: マフムード・ハン1世, title: カラートのハン, from: 1794, to: 1817, note: 要確認。, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: ミフラーブ・ハン2世, title: カラートのハン, from: 1817, to: 1839, note: 第1次アフガン戦争中の1839年、イギリス軍のカラート攻撃で戦死した。, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: シャー・ナワーズ・ハン, title: カラートのハン（イギリスが擁立）, from: 1839, to: 1840, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: ナスィール・ハン2世, title: カラートのハン, from: 1840, to: 1857, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: フダーダード・ハン, title: カラートのハン, from: 1857, to: 1893, note: 1863–1864年に一時廃位された。1876年のマストゥング条約でイギリスの保護下に入った。1893年に退位させられた。, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
    - {name: マフムード・ハン2世, title: カラートのハン, from: 1893, to: 1931, source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"}
  note: バローチスターンのハン国。ナーディル・シャー、のちドゥッラーニー朝に臣従したが、1758年のカラート条約で事実上自立した。1876年のマストゥング条約でイギリスの保護下に入った（バローチスターン管区）。地図の範囲はごく一部（要確認）。
  source: "https://en.wikipedia.org/wiki/Khanate_of_Kalat"

# ---------------------------------------------------------------- 中央アジア
- id: khiva
  name: ヒヴァ・ハン国
  short: ヒヴァ
  color: "#a9c3e1"
  kind: ハン国
  note: 1740–1747年はナーディル・シャーに服属。18世紀後半からウズベクのコングラト部のイナクが実権を握り、1804年に正式にハンとなった（コングラト朝）。
  rulers:
    - {name: エルトゥゼル, title: ハン（コングラト朝）, from: 1804, to: 1806, source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"}
    - {name: ムハンマド・ラヒーム・ハン1世, title: ハン, from: 1806, to: 1825, source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"}
    - {name: アッラー・クリ・ハン, title: ハン, from: 1825, to: 1842, source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"}
    - {name: ラヒーム・クリ・ハン, title: ハン, from: 1842, to: 1845, source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"}
    - {name: ムハンマド・アミーン・ハン, title: ハン, from: 1845, to: 1855, note: 1855年、トルクメンとの戦いで戦死。その後1856年まで短い在位のハンが続いた（要確認）。, source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"}
    - {name: サイイド・ムハンマド・ハン, title: ハン, from: 1856, to: 1864, source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"}
    - {name: ムハンマド・ラヒーム・ハン2世, title: ハン（1873年からロシアの保護国）, from: 1864, to: 1910, note: 1873年にロシア軍にヒヴァを落とされ、ガンデミアン条約を結んだ。, source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"}
    - {name: イスファンディヤール・ハン, title: ハン, from: 1910, to: 1918, source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"}
  periods:
    - from: 1648
      to: 1739
      text: アム川下流のホラズム地方を支配するウズベクのハン国。カスピ海東岸のトルクメン諸部族と争った。1717年にはロシアのベコヴィチ＝チェルカスキー遠征軍を全滅させた。
    - from: 1740
      to: 1815
      text: ナーディル・シャーに征服されたのち（1740）、内紛が続いた。1804年にコングラト朝が成立し、アラル海南岸のカラカルパクなどへ勢力を広げた。
    - from: 1816
      to: 1872
      text: ムハンマド・ラヒーム・ハン（1806–1825）らのもとで、トルクメン諸部族やメルヴに勢力を広げた。1839–1840年のロシアのペロフスキー遠征は冬の草原で失敗した。
    - from: 1873
      to: 1914
      text: 1873年にロシア軍に首都を落とされ、ガンデミアン条約でアム川右岸をロシアに割譲し、ロシアの保護国となった。
  source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"

- id: bukhara
  name: ブハラ・ハン国
  names:
    - {from: 1785, to: 1919, name: ブハラ・アミール国}
  short: ブハラ
  color: "#e2b2a1"
  kind: ハン国
  note: 1599–1747年はジャーン朝（アストラハン朝）、1747年（実質）／1785年（アミール称号）からマンギト朝。地図の範囲は西端（アム川中流・メルヴ）だけ。
  rulers:
    - {name: シャー・ムラード, title: アミール（マンギト朝）, from: 1785, to: 1800, source: "https://ja.wikipedia.org/wiki/ブハラ・ハン国"}
    - {name: ハイダル, title: アミール, from: 1800, to: 1826, source: "https://ja.wikipedia.org/wiki/ブハラ・ハン国"}
    - {name: ナスルッラー, title: アミール, from: 1827, to: 1860, note: 1826–1827年は兄弟の短い在位（フサイン、ウマル）。1842年にイギリスの使節ストッダートとコノリーを処刑し、同年コーカンドを一時征服した。, source: "https://ja.wikipedia.org/wiki/ブハラ・ハン国"}
    - {name: ムザッファル, title: アミール（1868年からロシアの保護国）, from: 1860, to: 1885, note: 1868年にサマルカンドを失い、ロシアの保護下に入った。, source: "https://ja.wikipedia.org/wiki/ブハラ・ハン国"}
    - {name: アブドゥルアハド, title: アミール, from: 1885, to: 1910, source: "https://ja.wikipedia.org/wiki/ブハラ・ハン国"}
    - {name: アーリム・ハン, title: アミール, from: 1910, to: 1920, source: "https://ja.wikipedia.org/wiki/ブハラ・ハン国"}
  periods:
    - from: 1648
      to: 1739
      text: ジャーン朝のもとで弱体化し、地方のウズベク諸部族が自立した。
    - from: 1740
      to: 1815
      text: ナーディル・シャーに服属したのち、マンギト部が実権を握った（マンギト朝）。シャー・ムラード（1785–1800）がアミールを称し、1785年ごろメルヴを奪った。
    - from: 1816
      to: 1867
      text: ナスルッラー（1827–1860）がコーカンドと争った。メルヴは1820年代からヒヴァ、のちトルクメンの手に移った。
    - from: 1868
      to: 1914
      text: ロシア軍にサマルカンドを奪われ（1868）、ロシアの保護国となった。
  source: "https://ja.wikipedia.org/wiki/ブハラ・ハン国"

- id: kokand
  name: コーカンド・ハン国
  short: コーカンド
  color: "#c9d6a0"
  kind: ハン国
  rulers:
    - {name: ウマル・ハン, title: ハン, from: 1810, to: 1822, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
    - {name: ムハンマド・アリー（マダリ・ハン）, title: ハン, from: 1822, to: 1842, note: 1842年にブハラのナスルッラーに攻められて殺された。, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
    - {name: シール・アリー・ハン, title: ハン, from: 1842, to: 1845, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
    - {name: フダーヤール・ハン, title: ハン, from: 1845, to: 1875, note: 1858–1865年は廃位と復位をくり返した（その間のハンはマッラー・ハン、シャー・ムラード、サイイド・スルタンなど。実権者はアリム・クリ。要確認）。1875年の反乱でロシア領に逃れた。, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
    - {name: ナスルッディーン・ハン, title: ハン, from: 1875, to: 1876, note: 1876年2月、ハン国はロシアに併合されフェルガナ州となった。, source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"}
  periods:
    - from: 1816
      to: 1852
      text: フェルガナ盆地からシル川流域・タシケントに勢力を広げ、シル川下流にアク・メチェトなどの要塞を築いた。1842年にはブハラに一時征服された。
    - from: 1853
      to: 1876
      text: 1853年にロシアにアク・メチェトを奪われ、1865年にはタシケントを失った。1875年の反乱をきっかけにロシア軍が侵攻し、1876年にハン国は併合された（フェルガナ州）。
  note: フェルガナ盆地を本拠とするウズベクのハン国。19世紀前半にシル川中流・下流に勢力を広げ、1817年ごろアク・メチェト（現クズロルダ）に要塞を築いた。1853年にロシアがアク・メチェトを落とし、1876年にハン国はロシアに併合された。地図の範囲はシル川下流（クズロルダ）だけ。
  source: "https://ja.wikipedia.org/wiki/コーカンド・ハン国"

- id: kazakh
  name: カザフ＝ハン国（小ジュズ）
  short: カザフ（小ジュズ）
  color: "#ddd4ab"
  kind: 遊牧国家
  note: カザフは大・中・小の3ジュズ（部族連合）に分かれ、地図の範囲（カザフスタン西部）はおもに小ジュズの遊牧地。1731年に小ジュズのアブルハイル・ハンがロシアの臣籍に入ったが、支配は名目的。
  periods:
    - from: 1648
      to: 1730
      text: カザフ諸部族の遊牧地。東からジュンガルの攻撃を受け（「大災厄」1723年）、西のカルムイクとも争った。
    - from: 1731
      to: 1815
      text: 小ジュズはロシアの保護を求めた。ロシアはオレンブルク（1743）などの要塞線を築いて草原に進出した。1801年にはヴォルガ・ウラル間にブケイ・オルダが置かれた。
    - from: 1816
      to: 1847
      text: ロシアは中ジュズ（1822）・小ジュズ（1824）のハン位を廃止して直接統治に移った。ケネサル・カスモフの反乱（1837–1847）を最後に、カザフ草原はロシアの支配下に入った。
  source: "https://ja.wikipedia.org/wiki/カザフ・ハン国"

