# ---------------------------------------------------------------- アドリア海沿岸・バルカン
- id: ragusa
  name: ラグーザ共和国
  short: ラグーザ
  color: "#e8a3a3"
  kind: 共和国（オスマン帝国に貢納）
  note: ドゥブロヴニク（現クロアチア）の都市共和国。地図のピースは担当 D（HRV）が描く。1808年にナポレオンにより廃止され、1815年にオーストリア領となった。
  periods:
    - from: 1648
      to: 1667
      text: オスマン帝国に貢納しつつ、バルカン内陸と地中海を結ぶ中継貿易で栄えた商業共和国。
    - from: 1667
      to: 1805
      text: 1667年の大地震で町の大半が壊れたが復興。ヴェネツィアに対抗するため、カルロヴィッツ条約（1699）ではオスマン領の回廊（ネウム、ストリナ）を両脇に置かせた。
    - from: 1806
      to: 1815
      text: フランス軍が占領し、1808年に共和国は廃止された。のちイリリア州に編入され、ウィーン会議でオーストリア領と決まった。
  source: "https://ja.wikipedia.org/wiki/ラグーザ共和国"

- id: montenegro
  name: モンテネグロ（主教公国）
  short: モンテネグロ
  color: "#cf9fa8"
  kind: 主教公国
  note: ツェティニェの府主教（ヴラディカ）が政治的な指導者を兼ねた。オスマン帝国の宗主権は名目的で、山地の部族社会として事実上自立していた。1697年からペトロヴィチ＝ニェゴシュ家が府主教位を世襲（叔父から甥へ）。1659–1673年ごろと1690年代の府主教は資料によって異なる（要確認）。
  rulers:
