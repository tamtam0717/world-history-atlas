      to: 2006
      text: オスロ合意で自治が始まったが、入植地の拡大とテロ、第2次インティファーダ（2000–2005）で和平は進まなかった。2005年にイスラエルがガザの入植地から撤退した。
    - from: 2007
      text: ハマースがガザを支配し、イスラエル・エジプトがガザを封鎖した。2023年10月からのイスラエルとハマースの戦争でガザは壊滅的な被害を受け、2025年10月の停戦後もイスラエル軍がガザの半分ほどを押さえている（要確認）。
  source: "https://ja.wikipedia.org/wiki/パレスチナ自治政府"

- id: jordan
