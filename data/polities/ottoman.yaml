    - {name: イブラーヒーム・シャー, title: シャー（アフシャール朝）, from: 1748, to: 1748, source: "https://en.wikipedia.org/wiki/Ebrahim_Afshar"}
    - {name: シャー・ロフ, title: シャー（アフシャール朝）, from: 1748, to: 1750, note: 1750年以降はホラーサーンだけを保った（1796年まで）。, source: "https://en.wikipedia.org/wiki/Shahrokh_Afshar"}
    - {name: カリーム・ハン・ザンド, title: ワキール（摂政。ザンド朝）, from: 1751, to: 1779, note: シャーの称号を名乗らず「民衆の代理人（ワキール）」と称した。名目上のシャーとしてサファヴィー家のイスマーイール3世を立てた。, source: "https://ja.wikipedia.org/wiki/カリーム・ハーン"}
    - {name: アボル・ファトフ・ハン／モハンマド・アリー・ハン, title: ザンド朝の君主, from: 1779, to: 1779}
    - {name: サーデク・ハン, title: ザンド朝の君主, from: 1779, to: 1782, source: "https://en.wikipedia.org/wiki/Sadeq_Khan_Zand"}
    - {name: アリー・モラード・ハン, title: ザンド朝の君主, from: 1782, to: 1785, source: "https://en.wikipedia.org/wiki/Ali-Morad_Khan_Zand"}
    - {name: ジャアファル・ハン, title: ザンド朝の君主, from: 1785, to: 1789, source: "https://en.wikipedia.org/wiki/Jafar_Khan_Zand"}
    - {name: ロトフ・アリー・ハン, title: ザンド朝の君主, from: 1789, to: 1794, source: "https://en.wikipedia.org/wiki/Lotf_Ali_Khan"}
    - {name: アーガー・モハンマド・ハーン, title: シャー（カージャール朝）, from: 1794, to: 1797, note: 1794年にザンド朝を滅ぼしてイランを統一し、1796年に正式に戴冠。それ以前は qajar_north（カージャール族）を参照。, source: "https://ja.wikipedia.org/wiki/アーガー・モハンマド・シャー"}
    - {name: ファトフ・アリー・シャー, title: シャー（カージャール朝）, from: 1797, to: 1834, source: "https://ja.wikipedia.org/wiki/ファトフ・アリー・シャー"}
    - {name: モハンマド・シャー, title: シャー（カージャール朝）, from: 1834, to: 1848, source: "https://ja.wikipedia.org/wiki/モハンマド・シャー"}
    - {name: ナーセロッディーン・シャー, title: シャー（カージャール朝）, from: 1848, to: 1896, note: 宰相アミール・キャビールの改革（1848–1851）。1896年に暗殺された。, source: "https://ja.wikipedia.org/wiki/ナーセロッディーン・シャー"}
    - {name: モザッファロッディーン・シャー, title: シャー（カージャール朝）, from: 1896, to: 1907, note: 1906年に憲法と議会を認めた。, source: "https://ja.wikipedia.org/wiki/モザッファロッディーン・シャー"}
    - {name: モハンマド・アリー・シャー, title: シャー（カージャール朝）, from: 1907, to: 1909, note: 1908年に議会を砲撃して解散したが、立憲派に追われて退位。, source: "https://ja.wikipedia.org/wiki/モハンマド・アリー・シャー"}
    - {name: アフマド・シャー, title: シャー（カージャール朝）, from: 1909, to: 1925, note: 即位時11歳。, source: "https://ja.wikipedia.org/wiki/アフマド・シャー"}
    - name: レザー・シャー
      title: シャー（パフラヴィー朝）
      from: 1925
      to: 1941
      note: コサック旅団の将校で、1921年のクーデタで実権を握り、1923年に首相、1925年に議会の決議でカージャール朝を廃して即位した。1941年に英ソの侵攻で退位させられた。
      source: "https://ja.wikipedia.org/wiki/レザー・シャー"
    - name: モハンマド・レザー・シャー
      title: シャー（パフラヴィー朝）
      from: 1941
      to: 1979
      note: 1951–1953年はモサッデグ首相が石油の国有化を進めたが、アメリカ・イギリスが後押ししたクーデタで失脚し、以後は国王の独裁が強まった。1979年1月に国外に出た。
      source: "https://ja.wikipedia.org/wiki/モハンマド・レザー・パフラヴィー"
    - name: ルーホッラー・ホメイニー
      title: 最高指導者
      from: 1979
      to: 1989
      note: イスラーム法学者による統治（法学者の統治）を唱えた。大統領はバニーサドル、ラジャーイー、ハーメネイー。
      source: "https://ja.wikipedia.org/wiki/ルーホッラー・ホメイニー"
    - name: アリー・ハーメネイー
      title: 最高指導者
      from: 1989
      note: 大統領はラフサンジャーニー（1989–1997）、ハータミー（1997–2005）、アフマディーネジャード（2005–2013）、ローハーニー（2013–2021）、ライースィー（2021–2024。ヘリコプター事故で死去）、ペゼシュキヤーン（2024–）。
      source: "https://ja.wikipedia.org/wiki/アリー・ハーメネイー"
  periods:
    - from: 1501
      to: 1524
      text: サファヴィー教団の長イスマーイールがキジルバシュ（トルコ系遊牧民の信徒）を率いて白羊朝を倒し、イランを統一して十二イマーム派を国教とした。1514年チャルディラーンの戦いでオスマン帝国の鉄砲隊に敗れた。
    - from: 1524
      to: 1587
      text: タフマースプ1世はオスマン帝国にイラク・東アナトリアを奪われたが、アマスィヤの和約（1555）で国境を定めた。東ではウズベク（シャイバーニー朝）とホラーサーンを争った。
    - from: 1587
      to: 1629
      text: アッバース1世が国を立て直し、ウズベクからホラーサーン（1598）、オスマン帝国からアゼルバイジャン・コーカサス（1603–07）とバグダード（1624）を取り、ホルムズ島からポルトガルを追った（1622）。都イスファハーンが栄えた。
    - from: 1629
      to: 1647
      text: サフィー1世の時代にバグダードを失い、1639年のカスレ・シーリーン条約でイラクはオスマン領と定まった。
    - from: 1648
      to: 1721
      text: サファヴィー朝の後期。首都イスファハーンは繁栄したが、王権は弱まり、宮廷の内紛と地方の反乱が続いた。オスマン帝国との国境は1639年のズハーブ条約の線でほぼ安定。
    - from: 1722
      to: 1735
      text: アフガン（ギルザイ族）にイスファハーンを奪われてサファヴィー朝は事実上崩壊。オスマン帝国とロシアが西部・北部を奪った。ナーディルが軍を率いてアフガンを追い（1729）、失地を回復した。
    - from: 1736
      to: 1747
      text: ナーディル・シャーがアフシャール朝を開き、ムガル帝国のデリーを略奪（1739）するなど大遠征を重ねた。オスマン帝国とはケルデン条約（1746）で旧国境を確認。1747年に暗殺された。
    - from: 1751
      to: 1779
      text: カリーム・ハン・ザンドがシーラーズを都に西部・南部を治め、比較的平穏な時代となった。
    - from: 1779
      to: 1793
      text: カリーム・ハンの死後、ザンド朝では王位をめぐる内紛が続いた。北部ではカージャール族のアーガー・モハンマド・ハーンが台頭し、ザンド朝の最後の君主ロトフ・アリー・ハンを追いつめた。
    - from: 1794
      to: 1815
      text: アーガー・モハンマド・ハーンがザンド朝を倒してイランを統一し、テヘランを都とした（カージャール朝）。ファトフ・アリー・シャーはロシアとの戦争に敗れ、グリスタン条約（1813）でカフカースの大半を失った。
    - from: 1816
      to: 1847
      text: 第二次イラン＝ロシア戦争に敗れ、トルコマンチャーイ条約（1828）でエレバン・ナヒチェヴァンを失い、治外法権と低関税を認めた。ヘラートの奪回をめざしたが（1837–1838年の包囲）、イギリスの干渉で果たせなかった。
    - from: 1848
      to: 1895
      text: ナーセロッディーン・シャーの長い治世。バーブ教徒の反乱（1848–1852）を鎮圧した。ヘラートを占領したが英国＝イラン戦争に敗れ、パリ条約（1857）でアフガニスタンへの権利を捨てた。ロシア・イギリスに利権を次々と与え、タバコ・ボイコット運動（1891–1892）で利権の撤回に追い込まれた。
    - from: 1896
      to: 1914
      text: イラン立憲革命（1905–1911）で議会と憲法（1906）ができたが、英露協商（1907）で北部はロシア、南東部はイギリスの勢力圏に分けられ、1911年にはロシア軍の介入で議会が閉鎖された。1908年に南西部で石油が見つかった。
    - from: 1915
      to: 1925
      text: 第一次世界大戦では中立を宣言したが、ロシア・イギリス・オスマン帝国の軍が国土で戦った。1921年にレザー・ハーンがクーデタで実権を握り、1925年にカージャール朝を廃してパフラヴィー朝を開いた。
    - from: 1926
      to: 1941
      text: レザー・シャーが軍・官僚・鉄道（イラン縦貫鉄道）を整え、トルコにならった近代化と世俗化を上から進めた。1935年に国名を外国向けにも「イラン」とした。
    - from: 1941
      to: 1953
      text: 1941年に英ソ両軍が進駐してレザー・シャーを退位させ、ソ連への補給路とした（北部はソ連、南部はイギリスの占領）。戦後、ソ連軍の撤退をめぐる危機（1946）を経て、モサッデグ首相が石油を国有化したが、1953年のクーデタで倒された。
    - from: 1954
      to: 1978
      text: 国王がアメリカと結び、農地改革などの「白色革命」（1963）で近代化を進めたが、秘密警察による弾圧と貧富の差への不満が高まった。
    - from: 1979
      to: 1988
      text: イラン革命で王制が倒れ、ホメイニーを最高指導者とするイスラーム共和国となった。アメリカ大使館人質事件（1979–1981）でアメリカと断交し、イラン＝イラク戦争（1980–1988）を戦った。
    - from: 1989
      text: ハーメネイーが最高指導者を継いだ。核開発をめぐって欧米の経済制裁が続き、2015年の核合意は2018年にアメリカが離脱した。周辺国の武装組織を支援してイスラエル・アメリカと対立し、2025年6月にはイスラエル・アメリカに核施設などを攻撃された。
  source: "https://ja.wikipedia.org/wiki/ガージャール朝"

- id: hotaki
  name: ホータキー朝（アフガン）
  short: アフガン（ホータキー朝）
  color: "#c5a6cf"
  kind: 王朝
  rulers:
    - {name: ミール・ワイス, title: カンダハールの支配者, from: 1709, to: 1715, source: "https://en.wikipedia.org/wiki/Mirwais_Hotak"}
    - {name: アブドゥルアズィーズ, title: カンダハールの支配者（ミール・ワイスの弟）, from: 1715, to: 1717, source: "https://en.wikipedia.org/wiki/Abdul_Aziz_Hotak"}
    - {name: マフムード, title: シャー, from: 1717, to: 1725, note: 1722年にイスファハーンを陥落させた。, source: "https://en.wikipedia.org/wiki/Mahmud_Hotak"}
    - {name: アシュラフ, title: シャー, from: 1725, to: 1729, source: "https://en.wikipedia.org/wiki/Ashraf_Hotak"}
  periods:
    - from: 1709
      to: 1729
      text: カンダハールのギルザイ族がサファヴィー朝から自立し、1722年にイスファハーンを占領してイラン中部・南部を支配した。1729年にナーディルに敗れてイランから追われ、1738年にはカンダハールも落ちた。
  source: "https://ja.wikipedia.org/wiki/ホータキー朝"

- id: afsharid_khorasan
  name: アフシャール朝（ホラーサーン）
  short: アフシャール朝
  color: "#d9c88f"
  kind: 王朝（残存政権）
  rulers:
    - {name: シャー・ロフ, title: シャー, from: 1750, to: 1796, note: 盲目にされたのちもマシュハドで在位。ドゥッラーニー朝の保護下にあった。, source: "https://en.wikipedia.org/wiki/Shahrokh_Afshar"}
  periods:
    - from: 1750
      to: 1796
      text: ナーディル・シャーの孫シャー・ロフがマシュハドを中心にホラーサーンを保った。1796年にアーガー・モハンマド・ハーンに滅ぼされた。
  source: "https://ja.wikipedia.org/wiki/アフシャール朝"

- id: qajar_north
  name: カージャール族（アーガー・モハンマド・ハーン）
  short: カージャール
  color: "#e9a98b"
  kind: 部族政権
  note: 1794年にザンド朝を滅ぼしてイランを統一し、地図では以後 persia（カージャール朝）として表示する。
  rulers:
    - {name: アーガー・モハンマド・ハーン, title: カージャール族の長（1789年から王を称する）, from: 1779, to: 1794, note: 1794年以降は persia（カージャール朝）の君主として表示。, source: "https://en.wikipedia.org/wiki/Agha_Mohammad_Khan_Qajar"}
  periods:
    - from: 1779
      to: 1793
      text: カリーム・ハン・ザンドの死後、人質だったアーガー・モハンマド・ハーンがマーザンダラーンに戻って挙兵。北部を固め、1786年にテヘランを都とした。
  source: "https://ja.wikipedia.org/wiki/ガージャール朝"

- id: herat_abdali
  name: ヘラートのアブダーリー部
  short: アブダーリー（ヘラート）
  color: "#cdb790"
  kind: 部族政権
  periods:
    - from: 1717
      to: 1731
      text: パシュトゥーン系アブダーリー族がサファヴィー朝から自立してヘラートを支配した。1732年にナーディルに降った。
  source: "https://en.wikipedia.org/wiki/Abdali_Afghans"

- id: durrani
  name: ドゥッラーニー朝
  short: ドゥッラーニー朝
  color: "#d5c2a0"
  kind: 王朝
  rulers:
    - {name: アフマド・シャー・ドゥッラーニー, title: シャー, from: 1747, to: 1772, source: "https://ja.wikipedia.org/wiki/アフマド・シャー・ドゥッラーニー"}
    - {name: ティムール・シャー, title: シャー, from: 1772, to: 1793, source: "https://en.wikipedia.org/wiki/Timur_Shah_Durrani"}
    - {name: ザマーン・シャー, title: シャー, from: 1793, to: 1801, source: "https://en.wikipedia.org/wiki/Zaman_Shah_Durrani"}
    - {name: マフムード・シャー, title: シャー, from: 1801, to: 1803, source: "https://en.wikipedia.org/wiki/Mahmud_Shah_Durrani"}
    - {name: シュジャー・シャー, title: シャー, from: 1803, to: 1809, source: "https://en.wikipedia.org/wiki/Shah_Shuja_Durrani"}
    - {name: マフムード・シャー（再任）, title: シャー, from: 1809, to: 1818, note: 1818年に宰相ファトフ・ハーン（バーラクザイ家）を殺したことで王国は分裂し、以後ヘラートだけを保った（herat）。, source: "https://en.wikipedia.org/wiki/Mahmud_Shah_Durrani"}
  periods:
    - from: 1747
      to: 1772
      text: ナーディル・シャーの部将だったアフマド・シャーがカンダハールで即位し、アフガニスタンの基礎を築いた。インドにもたびたび遠征した。
    - from: 1773
      to: 1815
      text: 首都をカーブルに移したが、ティムール・シャーの死後は王子たちの争いで弱体化した。ヘラートは王族が治める半ば独立の地となった。1818年に王国は分裂し、カーブル・カンダハールはバーラクザイ家の兄弟の手に移った。
  source: "https://ja.wikipedia.org/wiki/ドゥッラーニー朝"

- id: herat
  name: ヘラート侯国
  short: ヘラート
  color: "#cdb790"
  kind: 侯国
  note: ドゥッラーニー朝の分裂後、サドーザイ家のマフムード・シャー、カームラーン・シャーがヘラートを保った。1842年からは宰相ヤール・モハンマド・ハーンの一族が治め、ペルシアとアフガニスタンが奪い合った。
  rulers:
    - {name: マフムード・シャー, title: シャー, from: 1818, to: 1829, source: "https://en.wikipedia.org/wiki/Mahmud_Shah_Durrani"}
    - {name: カームラーン・シャー, title: シャー, from: 1829, to: 1842, note: 1837–1838年のペルシア軍の包囲に耐えた。, source: "https://en.wikipedia.org/wiki/Kamran_Shah_Durrani"}
    - {name: ヤール・モハンマド・ハーン, title: 宰相・支配者, from: 1842, to: 1851, source: "https://en.wikipedia.org/wiki/Yar_Mohammad_Khan_Alakozai"}
    - {name: サイード・モハンマド・ハーン, title: 支配者, from: 1851, to: 1855, note: 要確認}
    - {name: スルターン・アフマド・ハーン, title: 支配者（ペルシアの保護下）, from: 1857, to: 1863, note: 1855–1857年はペルシアの介入で支配者がめまぐるしく替わった（要確認）。, source: "https://en.wikipedia.org/wiki/Sultan_Ahmad_Khan"}
  periods:
    - from: 1818
      to: 1862
      text: ペルシアはヘラートの奪回をめざして1837–1838年と1856年に攻めたが、イギリスが軍事介入して阻んだ（パリ条約、1857）。1863年にドースト・モハンマドが攻め落とし、アフガニスタンに統合された。
  source: "https://en.wikipedia.org/wiki/Emirate_of_Herat"

- id: afghanistan
  name: アフガニスタン（バーラクザイ朝）
  short: アフガニスタン
  color: "#d5c2a0"
  kind: 王国（アミール）
  note: 1818年以後、バーラクザイ家の兄弟がカーブル・カンダハールなどを分けて治めた。ドースト・モハンマドが1826年にカーブルを押さえ、1834年からアミールを称した。地図の範囲はアフガニスタン西部（ファラー・ニームルーズ・ヘラート）だけ。1879年のガンダマク条約から外交はイギリスが握った（保護国）。
  rulers:
    - {name: ドースト・モハンマド・ハーン, title: カーブルのアミール, from: 1826, to: 1839, source: "https://ja.wikipedia.org/wiki/ドースト・ムハンマド・ハーン"}
    - {name: シュジャー・シャー, title: シャー（イギリスが擁立）, from: 1839, to: 1842, note: 第一次アフガン戦争でイギリスが復位させたが、1842年に殺された。, source: "https://en.wikipedia.org/wiki/Shah_Shuja_Durrani"}
    - {name: ドースト・モハンマド・ハーン（再任）, title: アミール, from: 1842, to: 1863, note: 1855年にカンダハール、1863年にヘラートを併合した。, source: "https://ja.wikipedia.org/wiki/ドースト・ムハンマド・ハーン"}
    - {name: シール・アリー・ハーン, title: アミール, from: 1863, to: 1866, source: "https://en.wikipedia.org/wiki/Sher_Ali_Khan"}
    - {name: モハンマド・アフザル・ハーン, title: アミール, from: 1866, to: 1867, source: "https://en.wikipedia.org/wiki/Mohammad_Afzal_Khan"}
    - {name: モハンマド・アアザム・ハーン, title: アミール, from: 1867, to: 1868, source: "https://en.wikipedia.org/wiki/Mohammad_Azam_Khan"}
    - {name: シール・アリー・ハーン（再任）, title: アミール, from: 1868, to: 1879, source: "https://en.wikipedia.org/wiki/Sher_Ali_Khan"}
    - {name: モハンマド・ヤアクーブ・ハーン, title: アミール, from: 1879, to: 1879, note: ガンダマク条約を結んだ。, source: "https://en.wikipedia.org/wiki/Mohammad_Yaqub_Khan"}
    - {name: アブドゥッラフマーン・ハーン, title: アミール, from: 1880, to: 1901, note: 「鉄のアミール」。デュアランド・ライン（1893）を認めた。, source: "https://ja.wikipedia.org/wiki/アブドゥッラフマーン・ハーン"}
    - {name: ハビーブッラー・ハーン, title: アミール, from: 1901, to: 1919, source: "https://en.wikipedia.org/wiki/Habibullah_Khan"}
