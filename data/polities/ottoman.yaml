# 担当 E：バルカン・オスマン・中東の政体（1648–1914）

# ---------------------------------------------------------------- オスマン帝国
- id: ottoman
  name: オスマン帝国
  short: オスマン帝国
  color: "#a9cf98"
  kind: 帝国
  rulers:
