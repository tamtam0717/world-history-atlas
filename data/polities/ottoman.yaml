  kind: 自称国家（内戦中）
  note: 1992年1月にボスニアのセルビア人が宣言した。内戦中は国土の約7割を押さえたが、ピースは現在のスルプスカ共和国（国土の49％）の範囲で描いた。1995年のデイトン合意でボスニア・ヘルツェゴヴィナの構成体の一つとして残った。
  rulers:
    - {name: ラドヴァン・カラジッチ, title: 大統領, from: 1992, to: 1996, note: 旧ユーゴスラヴィア国際刑事裁判所でジェノサイド（スレブレニツァ）などの罪で終身刑となった。, source: "https://ja.wikipedia.org/wiki/ラドヴァン・カラジッチ"}
  source: "https://ja.wikipedia.org/wiki/スルプスカ共和国"

- id: herzeg_bosnia
