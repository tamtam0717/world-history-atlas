  rulers:
    - {name: アッバース2世, title: シャー（サファヴィー朝）, from: 1642, to: 1666, source: "https://ja.wikipedia.org/wiki/アッバース2世"}
    - {name: スライマーン1世（サフィー2世）, title: シャー（サファヴィー朝）, from: 1666, to: 1694, source: "https://ja.wikipedia.org/wiki/スライマーン1世"}
    - {name: スルターン・フサイン, title: シャー（サファヴィー朝）, from: 1694, to: 1722, note: 1722年にイスファハーンがアフガン軍に陥落して退位。, source: "https://ja.wikipedia.org/wiki/スルターン・フサイン"}
