  short: アルバニア
  color: "#a99bd6"
  kind: 公国
  note: 1912年11月28日にヴロラでイスマイル・ケマルが独立を宣言した。列強はロンドン大使会議（1913）で独立を認め、国境はフィレンツェ議定書（1913年12月）などで定められた。コソヴォやチャメリア（イピロス南部）のアルバニア人は国境の外に残った。
  rulers:
    - {name: イスマイル・ケマル（ヴロラ）, title: 臨時政府の首班, from: 1912, to: 1914, source: "https://en.wikipedia.org/wiki/Ismail_Qemali"}
    - {name: ヴィルヘルム（ヴィード公）, title: アルバニア公, from: 1914, to: 1914, note: 列強が選んだドイツの貴族。1914年3月に着いたが、農民の反乱と大戦の勃発で9月に国を去った（退位はしていない）。, source: "https://en.wikipedia.org/wiki/William,_Prince_of_Albania"}
    - {name: エサト・パシャ・トプタニ, title: ドゥラス政府の首班, from: 1914, to: 1916, note: ヴィード公の出国後、中部アルバニアを押さえてセルビア・協商国と結んだ。, source: "https://en.wikipedia.org/wiki/Essad_Pasha_Toptani"}
    - {name: 摂政会議（ルシュニャ会議の政府）, title: 最高摂政会議, from: 1920, to: 1924, note: 1920年1月のルシュニャ会議で再建された政府。首都をティラナに定めた。, source: "https://en.wikipedia.org/wiki/Congress_of_Lushnjë"}
    - {name: アフメト・ゾグ（ゾグー）, title: 首相（1922–1924）, from: 1922, to: 1924, source: "https://ja.wikipedia.org/wiki/ゾグー1世"}
    - {name: ファン・ノリ, title: 首相, from: 1924, to: 1924, note: 6月革命で政権を取ったが、12月にゾグに追われた。, source: "https://en.wikipedia.org/wiki/Fan_Noli"}
    - {name: ゾグ1世（アフメト・ゾグ）, title: 大統領（1925–1928）、国王（1928–1939）, from: 1925, to: 1939, note: イタリアの資金と保護に頼った。1939年のイタリアの侵攻で亡命した。, source: "https://ja.wikipedia.org/wiki/ゾグー1世"}
    - {name: ヴィットーリオ・エマヌエーレ3世, title: アルバニア王（イタリア王が兼ねる）, from: 1939, to: 1943, source: "https://ja.wikipedia.org/wiki/ヴィットーリオ・エマヌエーレ3世"}
    - {name: エンヴェル・ホジャ, title: 労働党第一書記, from: 1944, to: 1985, note: ソ連（1961年に断交）、中国（1978年に断交）と次々に手を切り、鎖国に近い体制をとった。1967年に宗教を禁止した。, source: "https://ja.wikipedia.org/wiki/エンヴェル・ホッジャ"}
    - {name: ラミズ・アリア, title: 労働党第一書記・大統領, from: 1985, to: 1992, source: "https://ja.wikipedia.org/wiki/ラミズ・アリア"}
    - {name: サリ・ベリシャ, title: 大統領, from: 1992, to: 1997, note: 民主党。1997年のねずみ講の破綻による騒乱で退いた。, source: "https://ja.wikipedia.org/wiki/サリ・ベリシャ"}
    - name: 首相（1997–2005）
      title: 首相
      from: 1997
      to: 2005
      note: 1998年の憲法で議院内閣制となり、首相が実権を持つ。ファトス・ナノ（1997–1998）、パンデリ・マイコ（1998–1999）、イリル・メタ（1999–2002）、マイコ（2002）、ナノ（2002–2005）。いずれも社会党。
      source: "https://en.wikipedia.org/wiki/List_of_prime_ministers_of_Albania"
    - {name: サリ・ベリシャ（首相）, title: 首相, from: 2005, to: 2013, note: 2009年にNATOに加盟した。, source: "https://ja.wikipedia.org/wiki/サリ・ベリシャ"}
    - {name: エディ・ラマ, title: 首相, from: 2013, note: 社会党。元ティラナ市長。, source: "https://ja.wikipedia.org/wiki/エディ・ラマ"}
  periods:
    - from: 1912
      to: 1914
      text: 第一次バルカン戦争のさなかに独立を宣言したが、領土の大半はセルビア・モンテネグロ・ギリシアの軍に占領されていた。列強が独立を認めて公国としたが、1914年には南部（北イピロス）でギリシア系住民が自治を宣言し、大戦が始まるとギリシア軍とイタリア軍（ヴロラ）が再び進駐した。
    - from: 1915
      to: 1919
      text: 第一次世界大戦中、セルビア・モンテネグロ・ギリシア、のちにオーストリア＝ハンガリー（北部・中部）、イタリア（南部・ヴロラ）、フランス（コルチャ）の軍に占領され、国家はほとんど機能しなかった。
    - from: 1920
      to: 1938
      text: ルシュニャ会議（1920）で国家を立て直し、ヴロラからイタリア軍を追い出した。ゾグが共和国の大統領を経て国王となり（1928）、イタリアの経済的な支配が強まった。
    - from: 1939
      to: 1944
      text: 1939年4月にイタリアに占領され、イタリア王が王位を兼ねた。1941年にはコソヴォと西マケドニアがアルバニアに加えられた。1943年のイタリアの降伏後はドイツが占領した。1944年11月、共産党のパルチザンが国土を解放した。
    - from: 1945
      to: 1990
      text: ホジャの労働党による独裁で、ユーゴスラヴィア・ソ連・中国と次々に断交し、ヨーロッパで最も孤立した国となった。
    - from: 1991
      text: 複数政党制に移り、多くの人がイタリア・ギリシアに渡った。1997年にねずみ講の破綻で国が混乱した。2009年にNATOに加盟し、EU加盟の交渉を進めている。
  source: "https://ja.wikipedia.org/wiki/アルバニア公国"

