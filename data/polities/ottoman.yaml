    - from: 1996
      text: 二つの構成体とブルチコ行政区（2000）からなる分権的な国となり、国際社会の上級代表とEUの部隊が和平を見守っている。民族ごとの政党の対立で国の統合は進まず、2022年にEU加盟候補国となった。
