      text: ハッティ・シェリフ（1830）でオスマン帝国の宗主権のもとの自治公国として認められた。公位はオブレノヴィチ家とカラジョルジェヴィチ家の間で揺れたが、ミハイロ公のもとでオスマン軍の要塞からの撤退（1867）を実現した。
    - from: 1878
      to: 1902
      text: ベルリン条約で独立が認められ、ニシュ・ピロト・ヴラニェを得た。1882年に王国となったが、ミラン王はオーストリア＝ハンガリーに頼り、ブルガリアとの戦争（1885）には敗れた。
    - from: 1903
      to: 1914
      text: クーデタでカラジョルジェヴィチ家のペータル1世が王となり、ロシアに近づいた。オーストリア＝ハンガリーとの「豚戦争」（1906–1911）、ボスニア併合（1908）で対立が深まった。バルカン戦争でコソヴォとマケドニアを得て領土を倍近くに広げた。
    - from: 1914
      to: 1918
      text: サライェヴォ事件ののちオーストリア＝ハンガリーに宣戦され、1914年には侵攻を退けたが、1915年秋にドイツ・オーストリア＝ハンガリー・ブルガリアに攻められて全土を占領された。軍と政府はアルバニアの山を越えてコルフ島へ逃れ、サロニカ戦線から1918年に国土を取り戻した。1918年12月、セルブ＝クロアート＝スロヴェーン王国の中心となった（以後は yugoslavia）。
    - from: 2003
      to: 2005
      text: ユーゴスラヴィア連邦共和国がゆるやかな国家連合「セルビア・モンテネグロ」に改められた。コソヴォは国連の暫定統治下にあった。
    - from: 2006
      text: モンテネグロの独立で単独の共和国となった。2008年にコソヴォが独立を宣言したがセルビアは認めていない。2012年にEU加盟候補国となった。
