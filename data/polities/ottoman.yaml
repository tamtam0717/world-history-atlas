    - {name: ジャースィム・イブン・ムハンマド, title: 首長, from: 1878, to: 1913, note: 1893年のワジバの戦いでオスマン軍を破った。, source: "https://en.wikipedia.org/wiki/Jassim_bin_Mohammed_Al_Thani"}
    - {name: アブドゥッラー・イブン・ジャースィム, title: 首長, from: 1913, to: 1949, source: "https://en.wikipedia.org/wiki/Abdullah_bin_Jassim_Al_Thani"}
    - {name: アリー・イブン・アブドゥッラー, title: 首長, from: 1949, to: 1960, source: "https://en.wikipedia.org/wiki/Ali_bin_Abdullah_Al_Thani"}
    - {name: アフマド・イブン・アリー, title: 首長, from: 1960, to: 1972, note: 1971年に独立した。, source: "https://en.wikipedia.org/wiki/Ahmad_bin_Ali_Al_Thani"}
    - {name: ハリーファ・イブン・ハマド, title: 首長, from: 1972, to: 1995, source: "https://en.wikipedia.org/wiki/Khalifa_bin_Hamad_Al_Thani"}
    - {name: ハマド・イブン・ハリーファ, title: 首長, from: 1995, to: 2013, note: 父の外遊中に位を奪った。衛星放送アル＝ジャズィーラを作らせ、天然ガスの開発で国を豊かにした。, source: "https://ja.wikipedia.org/wiki/ハマド・ビン・ハリーファ・アール・サーニー"}
    - {name: タミーム・イブン・ハマド, title: 首長, from: 2013, note: 2017–2021年はサウジアラビアなどに断交された。2022年にサッカーのワールドカップを開いた。, source: "https://ja.wikipedia.org/wiki/タミーム・ビン・ハマド・アール・サーニー"}
  source: "https://ja.wikipedia.org/wiki/カタールの歴史"
  names:
    - {from: 1971, name: カタル国, short: カタル, kind: 首長国}
  periods:
    - from: 1915
      to: 1970
      text: 1915年にオスマン軍が撤退し、1916年の条約でイギリスの保護国となった。1949年から石油の輸出が始まった。
    - from: 1971
      text: 1971年に独立した。世界有数の天然ガスの輸出国となり、一人あたりの所得は世界最高の水準。
