  periods:
    - from: 1946
      to: 1957
      text: 独立後、第1次中東戦争（1948）の敗北をきっかけに軍のクーデタがくり返された。
    - from: 1958
      to: 1961
      text: ナセルのエジプトとアラブ連合共和国を作ったが、エジプト主導に不満が高まり、1961年のクーデタで離脱した。
    - from: 1962
      to: 2010
      text: 1963年にバアス党が政権を握り、1970年からアサド父子の独裁となった。第3次中東戦争（1967）でゴラン高原をイスラエルに占領され、1976–2005年はレバノンに軍を駐留させた。
    - from: 2011
      to: 2024
      text: 「アラブの春」の抗議運動を政府が武力で抑えて内戦となった。「イスラーム国」の台頭、ロシア・イランの政府側への軍事支援、トルコ・アメリカの介入で国土は分裂し、50万人以上が死亡、1,000万人以上が国内外に逃れた。
    - from: 2024
      text: 2024年12月に反体制派がダマスクスを押さえ、アサド政権が倒れた。シャラアの暫定政府のもとで国の再建が始まったが、クルド人勢力やドルーズ派・アラウィー派の地域との関係が課題となっている。
