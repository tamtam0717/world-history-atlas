- id: pakistan
  name: パキスタン
  names:
    - {to: 1955, name: パキスタン（自治領）, kind: 自治領（イギリス連邦）}
    - {from: 1956, name: パキスタン・イスラーム共和国, kind: 共和国}
  short: パキスタン
  color: "#a3c79b"
  kind: 共和国
  note: 1947年8月14日、イギリス領インドの分離独立で、ムスリムが多数を占める西のパンジャーブ西部・シンド・北西辺境州・バローチスターンと、東のベンガル東部（東パキスタン）からなる国として成立した。カラート・ハン国などの藩王国は1947–48年に加わり、1955年に西パキスタン州に統合された。カシミールは実効支配線の西側（アーザード・カシミール、ギルギット・バルティスターン）を治める。1971年に東パキスタンがバングラデシュとして独立した。元首の欄には実権を持つ人（総督・首相・軍の指導者・大統領）を書いた。データは南アジアの担当（india_north.yaml・india_east.yaml）と、バローチスターン西部（チャガイ・ケチ・グワーダル）の ottoman.yaml にある。
  rulers:
    - {name: ムハンマド・アリー・ジンナー, title: 総督, from: 1947, to: 1948, note: 「建国の父」。, source: "https://ja.wikipedia.org/wiki/ムハンマド・アリー・ジンナー"}
    - {name: リヤーカト・アリー・ハーン, title: 首相, from: 1948, to: 1951, note: 1951年に暗殺された。, source: "https://ja.wikipedia.org/wiki/リヤーカト・アリー・ハーン"}
    - {name: グラーム・ムハンマド／イスカンダル・ミールザー, title: 総督・大統領, from: 1951, to: 1958, note: 首相が短い間隔で替わった。, source: "https://en.wikipedia.org/wiki/Iskander_Mirza"}
    - {name: アユーブ・ハーン, title: 大統領（軍）, from: 1958, to: 1969, source: "https://ja.wikipedia.org/wiki/アユーブ・ハーン"}
    - {name: ヤヒヤー・ハーン, title: 大統領（軍）, from: 1969, to: 1971, source: "https://ja.wikipedia.org/wiki/ヤヒヤー・ハーン"}
    - {name: ズルフィカール・アリー・ブットー, title: 大統領・首相, from: 1971, to: 1977, source: "https://ja.wikipedia.org/wiki/ズルフィカール・アリー・ブットー"}
    - {name: ムハンマド・ズィヤーウル・ハック, title: 大統領（軍）, from: 1977, to: 1988, note: イスラーム化を進め、アフガニスタンのムジャーヒディーンを支援した。, source: "https://ja.wikipedia.org/wiki/ムハンマド・ジア＝ウル＝ハク"}
    - {name: ベーナズィール・ブットー, title: 首相, from: 1988, to: 1990, source: "https://ja.wikipedia.org/wiki/ベーナズィール・ブットー"}
    - {name: ナワーズ・シャリーフ, title: 首相, from: 1990, to: 1993, source: "https://ja.wikipedia.org/wiki/ナワーズ・シャリーフ"}
    - {name: ベーナズィール・ブットー（再任）, title: 首相, from: 1993, to: 1996, source: "https://ja.wikipedia.org/wiki/ベーナズィール・ブットー"}
    - {name: ナワーズ・シャリーフ（再任）, title: 首相, from: 1997, to: 1999, note: 1998年に核実験を行った。, source: "https://ja.wikipedia.org/wiki/ナワーズ・シャリーフ"}
    - {name: パルヴェーズ・ムシャラフ, title: 行政長官・大統領（軍）, from: 1999, to: 2008, source: "https://ja.wikipedia.org/wiki/パルヴェーズ・ムシャラフ"}
    - {name: アースィフ・アリー・ザルダーリー, title: 大統領, from: 2008, to: 2013, source: "https://ja.wikipedia.org/wiki/アースィフ・アリー・ザルダーリー"}
    - {name: ナワーズ・シャリーフ（3度目）, title: 首相, from: 2013, to: 2017, source: "https://ja.wikipedia.org/wiki/ナワーズ・シャリーフ"}
    - {name: イムラン・カーン, title: 首相, from: 2018, to: 2022, note: 2017–2018年はアッバースィー首相。, source: "https://ja.wikipedia.org/wiki/イムラン・カーン"}
    - {name: シャバズ・シャリーフ, title: 首相, from: 2022, note: 2023–2024年はカーカル選挙管理内閣。大統領はザルダーリー（2024–）。軍の影響力が強い。, source: "https://ja.wikipedia.org/wiki/シャバズ・シャリーフ"}
  periods:
    - from: 1947
      to: 1958
      text: インドとの分離独立で多くの人が移動・殺害された。カシミールをめぐってインドと戦い（第1次印パ戦争、1947–49）、国土は1,600km離れた東西に分かれていた。1956年の憲法でイスラーム共和国となった。
    - from: 1958
      to: 1971
      text: アユーブ・ハーンの軍事政権が開発を進めたが、第2次印パ戦争（1965）を戦い、政治・経済の中心の西に対する東パキスタン（ベンガル）の不満が強まった。1971年の内戦と第3次印パ戦争で東パキスタンがバングラデシュとして独立した。
    - from: 1972
      to: 1988
      text: ブットーが政権を握って核開発を始めたが、1977年にズィヤーウル・ハックがクーデタで倒した。軍事政権はイスラーム化を進め、ソ連のアフガニスタン侵攻（1979）に対してアメリカと組み、ムジャーヒディーンを支援した。
    - from: 1988
      to: 1999
      text: 民政に戻り、ベーナズィール・ブットーとナワーズ・シャリーフが交互に政権を担った。1998年にインドに続いて核実験を行い、1999年のカールギル紛争の後、ムシャラフのクーデタで再び軍が政権を握った。
    - from: 2000
