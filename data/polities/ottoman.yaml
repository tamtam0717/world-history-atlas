    - {from: 1992, to: 2002, name: ユーゴスラヴィア連邦共和国, kind: 連邦共和国（セルビアとモンテネグロ）}
  short: ユーゴスラヴィア
  color: "#dcab86"
  kind: 王国
  note: >-
    1918年12月1日、セルビア王国とオーストリア＝ハンガリーの南スラヴ人地域（スロヴェニア・クロアチア・ボスニアなど）、モンテネグロが合同してできた。1929年に国名をユーゴスラヴィア（南スラヴ人の国）とした。
    1941年4月に枢軸国に分割占領され、1944–1945年にティトーのパルチザンが国土を解放した。1991–1992年にスロヴェニア・クロアチア・マケドニア・ボスニアが独立し、残ったセルビアとモンテネグロが1992年にユーゴスラヴィア連邦共和国を作った（2003年にセルビア・モンテネグロ、serbia を参照）。
    元首の欄には実権を持つ人を書いた（1980–1991年は各共和国の代表による輪番の連邦幹部会）。
  rulers:
    - {name: ペータル1世, title: 国王, from: 1918, to: 1921, note: 高齢のため王太子アレクサンダルが摂政として統治した。, source: "https://ja.wikipedia.org/wiki/ペータル1世_(セルビア王)"}
    - name: アレクサンダル1世
      title: 国王
      from: 1921
      to: 1934
      note: 1929年1月に憲法を停止して国王の独裁を始め、国名をユーゴスラヴィアとした。1934年にマルセイユでクロアチアの民族主義者（ウスタシャ）らに暗殺された。
      source: "https://ja.wikipedia.org/wiki/アレクサンダル1世_(ユーゴスラビア王)"
    - {name: ペータル2世, title: 国王, from: 1934, to: 1945, note: 1941年3月までは叔父パヴレ王子が摂政。1941年4月にロンドンへ亡命し、1945年11月に王制が廃止された。, source: "https://ja.wikipedia.org/wiki/ペータル2世_(ユーゴスラビア王)"}
    - name: ヨシップ・ブロズ・ティトー
      title: パルチザンの最高司令官・首相（1945–1953）・大統領（1953–1980）
      from: 1944
      to: 1980
      note: 共産主義者同盟の書記長。1948年にスターリンと決裂し、自主管理社会主義と非同盟外交を進めた。
      source: "https://ja.wikipedia.org/wiki/ヨシップ・ブロズ・チトー"
    - name: 連邦幹部会（集団指導）
      title: 輪番の議長
      from: 1980
      to: 1991
      note: ティトーの死後、6共和国・2自治州の代表8人が1年交代で議長を務めた。1980年代後半からセルビア共和国のミロシェヴィチが力を伸ばした。
      source: "https://en.wikipedia.org/wiki/Presidency_of_Yugoslavia"
    - name: スロボダン・ミロシェヴィチ
      title: セルビア共和国大統領（1989–1997）、連邦大統領（1997–2000）
      from: 1992
      to: 2000
      note: 連邦大統領はチョシッチ（1992–1993）、リリッチ（1993–1997）だったが、実権はミロシェヴィチにあった。2000年の選挙の不正への抗議で倒れ、旧ユーゴスラヴィア国際刑事裁判所に引き渡されて裁判中に死去した。
      source: "https://ja.wikipedia.org/wiki/スロボダン・ミロシェヴィッチ"
    - {name: ヴォイスラヴ・コシュトゥニツァ, title: 連邦大統領, from: 2000, to: 2003, source: "https://ja.wikipedia.org/wiki/ヴォイスラヴ・コシュトゥニツァ"}
  periods:
    - from: 1918
      to: 1928
      text: セルビアの王家と中央集権の憲法（1921）のもとで、セルビア人と連邦制を求めるクロアチア人が対立し、1928年には議会でクロアチア農民党のラディチが撃たれた。
    - from: 1929
      to: 1940
      text: 国王アレクサンダルが独裁を行ったが1934年に暗殺された。1939年にクロアチア自治州を作って妥協を図った。
    - from: 1941
      to: 1945
      text: 1941年3月の三国同盟加入に反対するクーデタの直後、ドイツ・イタリア・ハンガリー・ブルガリアに侵攻され分割された。クロアチア独立国のウスタシャ政権はセルビア人・ユダヤ人・ロマを大量に殺害した。王党派のチェトニクと共産党のパルチザンが抵抗し、パルチザンが自力で国土を解放した。
    - from: 1946
      to: 1980
      text: ティトーのもとで6共和国の連邦となった。1948年にコミンフォルムから追放されてソ連と決裂し、労働者の自主管理と非同盟外交（1961年ベオグラードで第1回非同盟諸国首脳会議）を進めた。
    - from: 1981
      to: 1991
      text: ティトーの死後、対外債務と物価の高騰で経済が悪化し、コソヴォ問題をきっかけにセルビア民族主義が高まった。1991年にスロヴェニア・クロアチアが独立を宣言し、内戦が始まった。
    - from: 1992
      to: 2002
      text: セルビアとモンテネグロでユーゴスラヴィア連邦共和国を作ったが、ボスニア内戦への関与で国連の経済制裁を受けた。1999年にはコソヴォ紛争でNATOの空爆を受けた。2000年にミロシェヴィチ政権が倒れた。
  source:
    - "https://ja.wikipedia.org/wiki/ユーゴスラビア"
    - "https://ja.wikipedia.org/wiki/ユーゴスラビア王国"
    - "https://ja.wikipedia.org/wiki/ユーゴスラビア社会主義連邦共和国"

