  source: "https://en.wikipedia.org/wiki/Karamanids"

- id: candar
  name: ジャンダル侯国（イスフェンディヤール家）
  short: ジャンダル
  color: "#e3d6b9"
  kind: 侯国（ベイリク。オスマン帝国に従う）
  rulers:
    - {name: イスマーイール・ベイ, title: ジャンダル侯, from: 1443, to: 1461, note: スィノプをメフメト2世に明け渡した。, source: "https://en.wikipedia.org/wiki/İsmail_Bey_of_Isfendiyar"}
  source: "https://en.wikipedia.org/wiki/Isfendiyarids"

- id: dulkadir
  name: ドゥルカディル侯国
  short: ドゥルカディル
  color: "#ffb7b5"
  kind: 侯国（ベイリク。マムルーク朝またはオスマン帝国に従う）
  rulers:
    - {name: スレイマン・ベイ, title: ドゥルカディル侯, from: 1442, to: 1454, source: "https://en.wikipedia.org/wiki/Dulkadirids"}
    - {name: メリク・アルスラン, title: ドゥルカディル侯, from: 1454, to: 1465, source: "https://en.wikipedia.org/wiki/Dulkadirids"}
    - {name: シャー・ブダク, title: ドゥルカディル侯, from: 1465, to: 1467, note: 1472–1480年にも在位。, source: "https://en.wikipedia.org/wiki/Dulkadirids"}
    - {name: シャフスヴァル, title: ドゥルカディル侯, from: 1467, to: 1472, source: "https://en.wikipedia.org/wiki/Dulkadirids"}
    - {name: シャー・ブダク（再任）, title: ドゥルカディル侯, from: 1472, to: 1480, source: "https://en.wikipedia.org/wiki/Dulkadirids"}
    - {name: アラユッデヴレ・ボズクルト, title: ドゥルカディル侯, from: 1480, to: 1515, note: トゥルナダーの戦いでオスマン軍に敗れ、殺された。, source: "https://en.wikipedia.org/wiki/Alaüddevle_Bozkurt_Bey"}
    - {name: アリー・ベイ, title: ドゥルカディル侯, from: 1515, to: 1522, note: オスマン帝国が立てた。, source: "https://en.wikipedia.org/wiki/Dulkadirids"}
  periods:
    - from: 1453
      to: 1522
      text: マラシュ・エルビスタンを本拠とするトルクメンの侯国。マムルーク朝とオスマン帝国の間で揺れ、両国の戦争（1485–91年）のきっかけにもなった。1515年にオスマン帝国に屈し、1522年に併合された。
  source: "https://en.wikipedia.org/wiki/Dulkadirids"

- id: ramadanid
  name: ラマザン侯国
  short: ラマザン侯国
  color: "#ddd8ba"
  kind: 侯国（ベイリク）
  note: アダナを本拠とするトルクメンの侯国。1517年まではマムルーク朝、その後はオスマン帝国に従い、1608年に直轄化された。君主は省略。
  source: "https://en.wikipedia.org/wiki/Ramadanids"

- id: qara_qoyunlu
  name: 黒羊朝（カラ・コユンル）
  short: 黒羊朝
  color: "#a6aee1"
  kind: トルクメン系の王朝
  rulers:
    - {name: ジャハーン・シャー, title: スルタン, from: 1438, to: 1467, note: ティムール朝からイラン中部・南部を奪い、最大の領土を築いたが、ウズン・ハサンに敗れて殺された。, source: "https://en.wikipedia.org/wiki/Jahan_Shah"}
    - {name: ハサン・アリー, title: スルタン, from: 1467, to: 1468, source: "https://en.wikipedia.org/wiki/Hasan_Ali_(Qara_Qoyunlu)"}
  periods:
    - from: 1453
      to: 1468
      text: タブリーズを都に、アゼルバイジャン・イラク・イラン西部と中部を治めたトルクメン遊牧民の王朝。シーア派に近いとされる。1467年に白羊朝に敗れて崩れた。
  source: "https://ja.wikipedia.org/wiki/黒羊朝"

- id: aq_qoyunlu
  name: 白羊朝（アク・コユンル）
  short: 白羊朝
  color: "#d1ed91"
  kind: トルクメン系の王朝
  rulers:
    - {name: ウズン・ハサン, title: スルタン, from: 1453, to: 1478, note: 黒羊朝を滅ぼしたが、1473年のオトルクベリの戦いでメフメト2世に敗れた。, source: "https://ja.wikipedia.org/wiki/ウズン・ハサン"}
    - {name: ハリール, title: スルタン, from: 1478, to: 1478, source: "https://en.wikipedia.org/wiki/Aq_Qoyunlu"}
    - {name: ヤアクーブ, title: スルタン, from: 1478, to: 1490, source: "https://en.wikipedia.org/wiki/Yaqub_Beg"}
    - {name: バイスングル, title: スルタン, from: 1490, to: 1493, source: "https://en.wikipedia.org/wiki/Aq_Qoyunlu"}
    - {name: ルスタム, title: スルタン, from: 1493, to: 1497, source: "https://en.wikipedia.org/wiki/Aq_Qoyunlu"}
    - {name: アフマド・ギョデ, title: スルタン, from: 1497, to: 1497, source: "https://en.wikipedia.org/wiki/Aq_Qoyunlu"}
    - {name: アルヴァンド, title: スルタン（アゼルバイジャン）, from: 1497, to: 1504, note: 1501年にイスマーイール1世に敗れる。, source: "https://en.wikipedia.org/wiki/Alvand_Beg"}
    - {name: ムラード, title: スルタン（イラク・イラン中部）, from: 1497, to: 1508, note: 1503年ハマダーンの戦いで敗れ、バグダードに退いた。, source: "https://en.wikipedia.org/wiki/Sultan_Murad_(Aq_Qoyunlu)"}
  periods:
    - from: 1453
      to: 1478
      text: ディヤルバクルからおこったトルクメンの王朝。ウズン・ハサンが黒羊朝を滅ぼし（1467–68年）、タブリーズを都にイラン西半からイラクまでを治めた。ヴェネツィアと結んでオスマン帝国に対抗した。
    - from: 1479
      to: 1508
      text: ヤアクーブの死（1490）後に王族の争いで分裂し、サファヴィー教団のイスマーイールに敗れて1501年にタブリーズ、1508年にバグダードを失った。
  note: 在位年は要確認。
  source: "https://ja.wikipedia.org/wiki/白羊朝"

- id: timurid
  name: ティムール朝
  short: ティムール朝
  color: "#a9cbd9"
  kind: 王朝（ティムールの子孫の諸政権）
  rulers:
    - {name: アブー・サイード, title: スルタン（サマルカンド、1459年からヘラートも）, from: 1451, to: 1469, note: 白羊朝との戦いで捕らえられ殺された。, source: "https://ja.wikipedia.org/wiki/アブー・サイード_(ティムール朝)"}
    - {name: アブル・カースィム・バーブル, title: ヘラートのスルタン, from: 1449, to: 1457, source: "https://en.wikipedia.org/wiki/Abul-Qasim_Babur_Mirza"}
    - {name: スルタン・アフマド, title: サマルカンドのスルタン, from: 1469, to: 1494, source: "https://en.wikipedia.org/wiki/Sultan_Ahmed_Mirza"}
    - {name: フサイン・バイカラ, title: ヘラートのスルタン, from: 1469, to: 1506, note: 宰相アリー・シール・ナヴァーイーや画家ビフザードが活躍し、ヘラートはティムール朝文化の中心となった。, source: "https://ja.wikipedia.org/wiki/フサイン・バイカラ"}
    - {name: バディー・ウッザマーン, title: ヘラートのスルタン, from: 1506, to: 1507, note: シャイバーニーに追われた。, source: "https://en.wikipedia.org/wiki/Badi%27_al-Zaman_Mirza"}
    - {name: バーブル, title: フェルガナの君主→カーブルの王, from: 1494, to: 1525, note: 1500–01年と1511–12年にサマルカンドを取ったがウズベクに追われ、1504年にカーブルを取った。1526年からムガル帝国（mughal）の皇帝。, source: "https://ja.wikipedia.org/wiki/バーブル"}
  periods:
    - from: 1453
      to: 1500
      text: ティムールの子孫がサマルカンドとヘラートなどに分かれて治めた。政治は分裂したが、ヘラートを中心にペルシア語・チャガタイ語の文学や細密画が栄えた（ティムール朝文化）。
    - from: 1500
      to: 1507
      text: ウズベクのシャイバーニーが南下し、1500年にサマルカンド、1507年にヘラートを奪ってティムール朝は滅んだ。一族のバーブルはカーブルに逃れ、のちインドでムガル帝国を開く。
  note: 地図では、1504–1525年のバーブルのカーブル王国もティムール朝の色（label で区別）。1507年以降のバダフシャーンのバーブル一族の領地も同じ。
  source: "https://ja.wikipedia.org/wiki/ティムール朝"

- id: abulkhair
  name: ウズベク＝ハン国（アブル＝ハイル＝ハン）
  short: ウズベク
  color: "#9ce7c3"
  kind: 遊牧国家（ハン国）
  rulers:
    - {name: アブル＝ハイル＝ハン, title: ハン, from: 1428, to: 1468, note: ジョチの子シバンの子孫。シャイバーニーの祖父。, source: "https://en.wikipedia.org/wiki/Abu%27l-Khayr_Khan"}
  periods:
    - from: 1453
      to: 1468
      text: キプチャク草原の東部（いまのカザフスタン中部・北部）とシル川の町々を治めたウズベクの遊牧国家。1457年にオイラトに敗れて弱まり、ハンの死後に分裂した。孫のシャイバーニーがのちマー・ワラー・アンナフルに移る。
  source: "https://en.wikipedia.org/wiki/Abu%27l-Khayr_Khan"

- id: moghulistan
  name: モグーリスタン・ハン国
  short: モグーリスタン
  color: "#dec0df"
  kind: 遊牧国家（チャガタイ家のハン国）
  rulers:
    - {name: エセン・ブカ2世, title: ハン, from: 1429, to: 1462, source: "https://en.wikipedia.org/wiki/Esen_Buqa_II"}
    - {name: ユーヌス・ハン, title: ハン, from: 1462, to: 1487, note: バーブルの母方の祖父。, source: "https://en.wikipedia.org/wiki/Yunus_Khan"}
    - {name: マフムード・ハン, title: ハン（タシュケント）, from: 1487, to: 1508, note: シャイバーニーに敗れて殺された。, source: "https://en.wikipedia.org/wiki/Sultan_Mahmud_Khan"}
    - {name: マンスール・ハン, title: ハン（トルファン・東部）, from: 1503, to: 1543, source: "https://en.wikipedia.org/wiki/Mansur_Khan"}
    - {name: シャー・ハン, title: ハン（トルファン・東部）, from: 1543, to: 1570, note: マンスール・ハンの子。その死後、トルファン・ハミはヤルカンドのハン家の一族の支配に入った。在位年は要確認, source: "https://en.wikipedia.org/wiki/Shah_Khan"}
  note: 1514年からはスルターン・サイードがカシュガル・ヤルカンドでヤルカンド・ハン国（yarkent）を開き、天山の北の遊牧地はしだいにカザフとキルギスのものとなった。在位年は要確認。
  periods:
    - from: 1453
      to: 1514
      text: チャガタイ・ハン国の東部を継いだモンゴル系（モグール）の遊牧国家。天山の北（セミレチエ）からタリム盆地までを治め、タシュケントもしばらく支配した。
  source: "https://ja.wikipedia.org/wiki/モグーリスタン・ハン国"

- id: arghun
  name: アルグン朝（カンダハール）
  short: アルグン朝
  color: "#b1bda1"
  kind: 王朝
  rulers:
    - {name: ズンヌーン・ベグ・アルグン, title: カンダハールの総督, from: 1479, to: 1507, note: ヘラートのティムール朝の総督。, source: "https://en.wikipedia.org/wiki/Arghun_dynasty"}
    - {name: シャー・ベグ・アルグン, title: カンダハールの君主, from: 1507, to: 1522, note: バーブルにカンダハールを奪われ、シンドへ移った。, source: "https://en.wikipedia.org/wiki/Shah_Beg_Arghun"}
  source: "https://en.wikipedia.org/wiki/Arghun_dynasty"

- id: shirvan
  name: シルヴァン・シャー朝
  short: シルヴァン
  color: "#aae5b8"
  kind: 王国（シャー）
  rulers:
    - {name: ハリールッラー1世, title: シルヴァン・シャー, from: 1417, to: 1465, source: "https://en.wikipedia.org/wiki/Khalilullah_I"}
    - {name: ファッルフ・ヤッサール, title: シルヴァン・シャー, from: 1465, to: 1500, note: イスマーイール1世に敗れて殺された。, source: "https://en.wikipedia.org/wiki/Farrukh_Yassar"}
    - {name: バフラーム・ベグ／ガーズィー・ベグ, title: シルヴァン・シャー, from: 1500, to: 1501, note: 要確認}
    - {name: シャイフ・イブラーヒーム2世, title: シルヴァン・シャー, from: 1502, to: 1524, note: サファヴィー朝に従った。, source: "https://en.wikipedia.org/wiki/Shirvanshah"}
    - {name: ハリールッラー2世, title: シルヴァン・シャー, from: 1524, to: 1535, source: "https://en.wikipedia.org/wiki/Shirvanshah"}
    - {name: シャールフ, title: シルヴァン・シャー, from: 1535, to: 1538, source: "https://en.wikipedia.org/wiki/Shirvanshah"}
  periods:
    - from: 1453
      to: 1538
      text: カスピ海西岸のシャマヒとバクーを都とした古い王朝。黒羊朝・白羊朝、のちサファヴィー朝に従い、1538年にタフマースプ1世に併合された。
  source: "https://ja.wikipedia.org/wiki/シルヴァン・シャー朝"

- id: georgian_kingdoms
  name: ジョージア（グルジア）王国
  short: ジョージア
  color: "#d3a88b"
  kind: 王国（バグラティオニ家）
  rulers:
    - {name: ギオルギ8世, title: ジョージア王, from: 1446, to: 1465, note: 1465年からカヘティ王。, source: "https://en.wikipedia.org/wiki/George_VIII_of_Georgia"}
    - {name: バグラト6世, title: ジョージア王（イメレティ出身）, from: 1465, to: 1478, source: "https://en.wikipedia.org/wiki/Bagrat_VI_of_Georgia"}
    - {name: コンスタンティネ2世, title: ジョージア王, from: 1478, to: 1490, note: 1490年に統一を諦め、カルトリ王となる。, source: "https://en.wikipedia.org/wiki/Constantine_II_of_Georgia"}
  periods:
    - from: 1453
      to: 1490
      text: コンスタンティノープル陥落で西ヨーロッパと切り離され、王族と諸侯の争いが続いた。1460年代からイメレティ・カヘティ・サムツヘが自立し、1490年の会議で三王国と諸侯領への分裂が認められた。
  source: "https://ja.wikipedia.org/wiki/グルジア王国"

- id: samtskhe
  name: サムツヘ＝サータバゴ（ジャケリ家のアタベグ領）
  short: サムツヘ
  color: "#bcdbf3"
  kind: アタベグ領
  rulers:
    - {name: クヴァルクヴァレ2世, title: アタベグ, from: 1451, to: 1498, source: "https://en.wikipedia.org/wiki/Qvarqvare_II_Jaqeli"}
    - {name: カイホスロー1世, title: アタベグ, from: 1498, to: 1502, source: "https://en.wikipedia.org/wiki/Principality_of_Samtskhe"}
    - {name: ムザフラン, title: アタベグ, from: 1502, to: 1515, source: "https://en.wikipedia.org/wiki/Principality_of_Samtskhe"}
    - {name: ムゼチャバク, title: アタベグ, from: 1515, to: 1518, source: "https://en.wikipedia.org/wiki/Principality_of_Samtskhe"}
    - {name: クヴァルクヴァレ3世, title: アタベグ, from: 1518, to: 1535, source: "https://en.wikipedia.org/wiki/Principality_of_Samtskhe"}
    - {name: カイホスロー2世, title: アタベグ, from: 1545, to: 1573, note: 1535–1545年はイメレティ王バグラト3世がサムツヘを併合していた（ムルジャヘティの戦い〜ソホイスタの戦い）。, source: "https://en.wikipedia.org/wiki/Principality_of_Samtskhe"}
    - {name: クヴァルクヴァレ4世, title: アタベグ, from: 1573, to: 1582, note: オスマン帝国に降った。, source: "https://en.wikipedia.org/wiki/Principality_of_Samtskhe"}
  note: 在位年は要確認。1578年以降もジャケリ家はオスマン帝国のチルドゥル州の総督として続いた（1625年にイスラームに改宗した家系が世襲）。
  source: "https://en.wikipedia.org/wiki/Principality_of_Samtskhe"

- id: hormuz
  name: ホルムズ王国
  short: ホルムズ
  color: "#80e2d7"
  kind: 王国（港市国家）
  note: ペルシア湾の入口のホルムズ島を都に、イラン側とアラビア側の沿岸の港（マスカット・ソハール・バーレーンなど）を治めた交易国家。1515年からポルトガルの保護下（王はポルトガルに貢納）、1622年にホルムズ島がサファヴィー朝・イギリス東インド会社に落とされて滅んだ。君主は省略。
  periods:
    - from: 1453
      to: 1507
      text: インド洋と西アジアを結ぶ中継貿易の港として栄えた。
    - from: 1507
      to: 1622
      text: アルブケルケの攻撃（1507・1515年）でポルトガルの保護下に入り、要塞にポルトガル軍が置かれた。1622年にサファヴィー朝とイギリスの連合軍に落とされ、交易はバンダレ・アッバースに移った。
  source: "https://ja.wikipedia.org/wiki/ホルムズ王国"

- id: jabrid
  name: ジャブル朝
  short: ジャブル朝
  color: "#ffcacc"
  kind: 首長国
  rulers:
    - {name: アジュワド・ブン・ザーミル, title: 首長, from: 1470, to: 1507, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Ajwad_ibn_Zamil"}
    - {name: ムクリン・ブン・ザーミル, title: 首長, from: 1507, to: 1521, note: バーレーンでポルトガル軍に敗れて死んだ。, source: "https://en.wikipedia.org/wiki/Muqrin_ibn_Zamil"}
  periods:
    - from: 1453
      to: 1524
      text: アラビア半島東部のハサー（アフサー）を本拠としたベドウィンの王朝。バーレーンやカティーフも治め、ナジュドにも勢力を広げた。
  source: "https://en.wikipedia.org/wiki/Jabrids"

- id: tahirid
  name: ターヒル朝（イエメン）
  short: ターヒル朝
  color: "#faae9f"
  kind: スルタン国
  rulers:
    - {name: ザーフィル・アーミル1世, title: スルタン, from: 1454, to: 1460, note: 要確認, source: "https://en.wikipedia.org/wiki/Tahirid_Sultanate"}
    - {name: ムジャーヒド・アリー, title: スルタン, from: 1460, to: 1478, note: 要確認, source: "https://en.wikipedia.org/wiki/Tahirid_Sultanate"}
    - {name: マンスール・アブドゥルワッハーブ, title: スルタン, from: 1478, to: 1489, note: 要確認, source: "https://en.wikipedia.org/wiki/Tahirid_Sultanate"}
    - {name: ザーフィル・アーミル2世, title: スルタン, from: 1489, to: 1517, note: マムルーク朝の遠征軍に敗れて死んだ。, source: "https://en.wikipedia.org/wiki/Tahirid_Sultanate"}
    - {name: アーミル・ブン・ダーウード, title: アデンの支配者, from: 1517, to: 1538, note: ターヒル朝の残党。1538年にオスマン帝国のハドゥム・スレイマン・パシャに処刑された。在位年は要確認。, source: "https://en.wikipedia.org/wiki/Ottoman_conquest_of_Aden"}
  periods:
    - from: 1453
      to: 1538
      text: ラスール朝を継いでアデン・ザビード・タイズを治めたスンナ派の王朝。紅海に入ろうとするポルトガルを防ぐためマムルーク朝が送った遠征軍に1517年に本拠を奪われ、アデンだけが1538年まで残った（オスマン帝国の艦隊に取られる）。
  source: "https://en.wikipedia.org/wiki/Tahirid_Sultanate"

- id: mushasha
  name: ムシャアシャア朝
  short: ムシャアシャア朝
  color: "#9cb98a"
  kind: 宗教指導者の政権
