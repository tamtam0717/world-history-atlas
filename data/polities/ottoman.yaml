    - {name: アレクサンドル2世ギカ（代理）, title: カイマカム（公の代理）, from: 1856, to: 1858, source: "https://en.wikipedia.org/wiki/Alexandru_II_Ghica"}
  periods:
    - from: 1648
      to: 1715
      text: オスマン帝国に貢納する付庸国だが、在地の大貴族（ボヤール）から公が出た。ブルンコヴェアヌ（1688–1714）は文化を保護したが、ロシアと通じた疑いで処刑された。
    - from: 1716
      to: 1815
      text: オスマン帝国がファナリオティス（イスタンブルのギリシア系有力者）を公に任命する時代。露土戦争のたびにロシア軍やオーストリア軍に占領された。小ワラキア（オルテニア）は1718–1739年オーストリア領。
    - from: 1816
      to: 1828
      text: 1821年のトゥドル・ヴラディミレスクの蜂起とギリシア独立戦争ののち、ファナリオティスの任命は終わり、在地の大貴族から公が選ばれるようになった。
    - from: 1829
      to: 1852
      text: アドリアノープル条約（1829）でオスマン帝国の宗主権のもとロシアの保護下に入り、ブライラ・ジュルジュなどドナウ左岸の要塞も返された。ロシアの定めた組織規程（1831）のもとで近代的な行政が整えられた。1848年には革命が起きたが、オスマン・ロシア両軍に鎮圧された。
    - from: 1853
      to: 1858
      text: クリミア戦争でロシア軍、のちオーストリア軍に占領された。パリ条約（1856）でロシアの保護は終わり、列強の共同保障のもとに置かれた。パリ協定（1858）を経て、1859年にモルダヴィアと同じ公を選んで合同した（→ルーマニア）。
  source: "https://ja.wikipedia.org/wiki/ワラキア"

