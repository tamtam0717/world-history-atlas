    - from: 1974
      text: 1974年7月、ギリシアの軍事政権が後押しするクーデタに対してトルコが出兵し、島は南北に分かれた（多くの住民が避難民となった）。南のキプロス共和国は2004年にEUに加盟し、2008年にユーロを導入した。統一の交渉はまとまっていない。
