      text: 宗派の権力分担のもとで、ベイルートは中東の金融・観光の中心として栄えた。1970年代にはヨルダンを追われたパレスチナ解放機構（PLO）の拠点となった。
    - from: 1975
      to: 1990
      text: キリスト教徒とムスリム・PLOの対立から内戦となり、シリア軍の駐留（1976）、イスラエルの侵攻（1982）、シーア派の武装組織ヒズボラの結成が重なった。1989年のターイフ合意で内戦が終わった。
    - from: 1991
      to: 2018
      text: シリアの強い影響のもとで復興が進んだが、2005年のハリーリー元首相の暗殺ののち抗議運動（杉の革命）でシリア軍が撤退した。2006年にはヒズボラとイスラエルが戦った。シリア内戦で100万人以上の難民を受け入れた。
    - from: 2019
      text: 2019年に通貨が暴落して経済が破綻し、2020年8月にはベイルート港の大爆発が起きた。2024年にイスラエルとヒズボラの戦争が激しくなり、11月に停戦した。
