    - {name: ヴァレンティン・インツコ, title: 上級代表, from: 2009, to: 2021, source: "https://en.wikipedia.org/wiki/Valentin_Inzko"}
    - {name: クリスティアン・シュミット, title: 上級代表, from: 2021, source: "https://en.wikipedia.org/wiki/Christian_Schmidt_(politician)"}
