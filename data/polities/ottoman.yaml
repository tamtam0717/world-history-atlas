    - {name: ファイサル2世, title: 国王, from: 1939, to: 1958, note: 1953年まで叔父アブドゥルイラーフが摂政。親英派のヌーリー・サイード首相が長く実権を握った。1958年の革命で殺された。, source: "https://ja.wikipedia.org/wiki/ファイサル2世_(イラク王)"}
    - {name: アブドゥルカリーム・カースィム, title: 首相（軍）, from: 1958, to: 1963, note: 7月14日革命で王制を倒した。, source: "https://ja.wikipedia.org/wiki/アブドルカリーム・カーシム"}
    - {name: アブドゥッサラーム・アーリフ, title: 大統領, from: 1963, to: 1966, source: "https://en.wikipedia.org/wiki/Abdul_Salam_Arif"}
    - {name: アブドゥッラフマーン・アーリフ, title: 大統領, from: 1966, to: 1968, source: "https://en.wikipedia.org/wiki/Abdul_Rahman_Arif"}
    - {name: アフマド・ハサン・バクル, title: 大統領（バアス党）, from: 1968, to: 1979, source: "https://en.wikipedia.org/wiki/Ahmed_Hassan_al-Bakr"}
    - {name: サッダーム・フセイン, title: 大統領, from: 1979, to: 2003, note: 2003年のイラク戦争で政権を追われ、2006年に処刑された。, source: "https://ja.wikipedia.org/wiki/サッダーム・フセイン"}
    - {name: ポール・ブレマー, title: 連合国暫定当局の行政官（アメリカ）, from: 2003, to: 2004, source: "https://ja.wikipedia.org/wiki/ポール・ブレマー"}
    - {name: イヤード・アッラーウィー, title: 暫定政府の首相, from: 2004, to: 2005, source: "https://ja.wikipedia.org/wiki/イヤード・アッラーウィー"}
    - {name: イブラーヒーム・ジャアファリー, title: 首相, from: 2005, to: 2006, source: "https://en.wikipedia.org/wiki/Ibrahim_al-Jaafari"}
    - {name: ヌーリー・マーリキー, title: 首相, from: 2006, to: 2014, source: "https://ja.wikipedia.org/wiki/ヌーリー・マーリキー"}
    - {name: ハイダル・アバーディー, title: 首相, from: 2014, to: 2018, source: "https://ja.wikipedia.org/wiki/ハイダル・アル＝アバーディー"}
    - {name: アーディル・アブドゥルマフディー, title: 首相, from: 2018, to: 2020, source: "https://en.wikipedia.org/wiki/Adil_Abdul-Mahdi"}
    - {name: ムスタファ・カーズィミー, title: 首相, from: 2020, to: 2022, source: "https://en.wikipedia.org/wiki/Mustafa_Al-Kadhimi"}
    - {name: ムハンマド・シーア・スーダーニー, title: 首相, from: 2022, note: 2025年11月に議会選挙が行われた。, source: "https://en.wikipedia.org/wiki/Mohammed_Shia%27_Al_Sudani"}
  periods:
    - from: 1921
      to: 1957
      text: イギリスの委任統治のもとでハーシム家の王国となり、1932年に独立したが、石油と軍事基地を通じてイギリスの影響が続いた。
    - from: 1958
      to: 1978
      text: 1958年の革命で共和国となり、クーデタがくり返された。1968年からバアス党の政権。1972年に石油を国有化した。
    - from: 1979
      to: 2002
      text: サッダーム・フセインの独裁のもとでイラン＝イラク戦争（1980–1988）を戦い、クルド人を化学兵器で攻撃した（ハラブジャ、1988）。1990年にクウェートに侵攻して湾岸戦争（1991）に敗れ、国連の経済制裁を受けた。北部のクルド人地域は1991年から自治を得た。
    - from: 2003
      to: 2013
      text: アメリカなどの攻撃でフセイン政権が倒れ（イラク戦争）、占領統治ののちシーア派中心の政府ができた。宗派間の衝突とテロで多くの犠牲者が出た。アメリカ軍は2011年に撤退した。
    - from: 2014
      to: 2017
      text: 「イスラーム国」が北部・西部を押さえ、モースルを拠点とした。アメリカ主導の有志連合とイラク軍・クルド人部隊が2017年に奪い返した。
    - from: 2018
      text: 汚職と失業への抗議運動（2019）が起き、イランとアメリカの対立の舞台にもなった。
  source: "https://ja.wikipedia.org/wiki/イラク"

