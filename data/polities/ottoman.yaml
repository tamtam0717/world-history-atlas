      to: 2023
      text: 第2次ナゴルノ・カラバフ戦争（2020年9–11月）でシュシャと南部を失い、周りの7地区もアゼルバイジャンに返した。ロシアの平和維持部隊が駐留したが、2022年12月からラチン回廊が封鎖され、2023年9月のアゼルバイジャン軍の攻撃で降伏した。
