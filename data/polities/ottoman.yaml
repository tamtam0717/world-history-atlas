      text: アム川下流のホラズム地方を支配するウズベクのハン国。カスピ海東岸のトルクメン諸部族と争った。1717年にはロシアのベコヴィチ＝チェルカスキー遠征軍を全滅させた。
    - from: 1740
      to: 1815
      text: ナーディル・シャーに征服されたのち（1740）、内紛が続いた。1804年にコングラト朝が成立し、アラル海南岸のカラカルパクなどへ勢力を広げた。
    - from: 1816
      to: 1872
      text: ムハンマド・ラヒーム・ハン（1806–1825）らのもとで、トルクメン諸部族やメルヴに勢力を広げた。1839–1840年のロシアのペロフスキー遠征は冬の草原で失敗した。
    - from: 1873
      to: 1914
      text: 1873年にロシア軍に首都を落とされ、ガンデミアン条約でアム川右岸をロシアに割譲し、ロシアの保護国となった。
