    - {from: 1819, to: 1891, name: 第二次サウード王国（ナジュド首長国）}
    - {from: 1892, to: 1901, name: サウード家（クウェートに亡命）, kind: 亡命中の家門}
    - {from: 1902, to: 1920, name: リヤド首長国（第三次サウード王国）}
  short: サウード王国
  color: "#d9a6c0"
  kind: 首長国（ワッハーブ派）
  note: ディルイーヤ首長国、ワッハーブ王国とも呼ばれる。1818年にエジプトのムハンマド・アリーの軍に滅ぼされたが、1824年にトゥルキーがリヤドを都に再興した（第二次サウード王国）。1891年にラシード家に敗れて一族はクウェートに逃れ、1902年にアブドゥルアズィーズ（イブン・サウード）がリヤドを奪回した（のちのサウジアラビア王国）。
  rulers:
    - {name: ムハンマド・イブン・サウード, title: ディルイーヤのアミール, from: 1726, to: 1765, note: 1744年にイブン・アブドゥルワッハーブと盟約を結んだ。, source: "https://en.wikipedia.org/wiki/Muhammad_bin_Saud"}
    - {name: アブドゥルアズィーズ1世, title: アミール, from: 1765, to: 1803, source: "https://en.wikipedia.org/wiki/Abdulaziz_bin_Muhammad_Al_Saud"}
    - {name: サウード1世（サウード大王）, title: アミール, from: 1803, to: 1814}
    - {name: アブドゥッラー1世, title: アミール, from: 1814, to: 1818, note: 1818年にディルイーヤが落ち、イスタンブルで処刑された。, source: "https://en.wikipedia.org/wiki/Abdullah_bin_Saud"}
    - {name: トゥルキー・イブン・アブドゥッラー, title: ナジュドのイマーム, from: 1824, to: 1834, note: 1824年にリヤドを奪回し都とした。暗殺された。, source: "https://en.wikipedia.org/wiki/Turki_bin_Abdullah_Al_Saud"}
    - {name: ファイサル・イブン・トゥルキー, title: イマーム, from: 1834, to: 1838, note: エジプト軍に捕らえられた。, source: "https://en.wikipedia.org/wiki/Faisal_bin_Turki_Al_Saud"}
    - {name: ハーリド・イブン・サウード, title: イマーム（エジプトが擁立）, from: 1838, to: 1841, source: "https://en.wikipedia.org/wiki/Khalid_bin_Saud_Al_Saud"}
    - {name: アブドゥッラー・イブン・スナイヤーン, title: イマーム, from: 1841, to: 1843, source: "https://en.wikipedia.org/wiki/Abdullah_bin_Thunayan_Al_Saud"}
    - {name: ファイサル・イブン・トゥルキー（再任）, title: イマーム, from: 1843, to: 1865, source: "https://en.wikipedia.org/wiki/Faisal_bin_Turki_Al_Saud"}
    - {name: アブドゥッラー・イブン・ファイサル, title: イマーム, from: 1865, to: 1871, note: 1871–1889年は弟サウードらと王位を争い、何度も入れ替わった（要確認）。, source: "https://en.wikipedia.org/wiki/Abdullah_bin_Faisal_Al_Saud"}
    - {name: サウード・イブン・ファイサル, title: イマーム, from: 1871, to: 1875, source: "https://en.wikipedia.org/wiki/Saud_bin_Faisal_bin_Turki_Al_Saud"}
    - {name: アブドゥッラフマーン・イブン・ファイサル, title: イマーム, from: 1875, to: 1876, note: サウードの死後に短く在位し、兄アブドゥッラーに譲った。, source: "https://en.wikipedia.org/wiki/Abdul_Rahman_bin_Faisal_Al_Saud"}
    - {name: アブドゥッラー・イブン・ファイサル（再任）, title: イマーム, from: 1876, to: 1889, note: 晩年はラシード家の保護下にあった。}
    - {name: アブドゥッラフマーン・イブン・ファイサル, title: イマーム, from: 1889, to: 1891, note: ムライダの戦い（1891）でラシード家に敗れてクウェートへ逃れた。, source: "https://en.wikipedia.org/wiki/Abdul_Rahman_bin_Faisal_Al_Saud"}
    - {name: アブドゥルアズィーズ（イブン・サウード）, title: リヤドのアミール（のちサウジアラビア国王）, from: 1902, to: 1953, source: "https://ja.wikipedia.org/wiki/アブドゥルアズィーズ・イブン・サウード"}
  periods:
    - from: 1744
      to: 1786
      text: ムハンマド・イブン・サウードがイスラーム改革者イブン・アブドゥルワッハーブと盟約を結び、ディルイーヤを拠点にナジュドを統一していった（1773年リヤド征服）。
    - from: 1787
      to: 1811
      text: ハサー（1795）、ヒジャーズ（メッカ1803・1806、メディナ1805）を押さえ、アラビア半島の大半を支配した。1802年にはイラクのカルバラーを襲撃した。
    - from: 1811
      to: 1815
      text: オスマン帝国の命を受けたエジプトのムハンマド・アリーの軍がヒジャーズを奪回した（メディナ1812、メッカ1813）。
    - from: 1816
      to: 1823
      text: イブラーヒーム・パシャのエジプト軍がナジュドに攻め込み、1818年に都ディルイーヤを破壊した（第一次サウード王国の滅亡）。
    - from: 1824
      to: 1891
      text: トゥルキーがリヤドを都にサウード家の国を再興し（第二次サウード王国）、ハサーまで勢力を戻した。1838–1843年には再びエジプト軍が進駐した。1865年以後は王族の争いで弱まり、1871年にハサーをオスマン帝国に奪われ、1891年にジャバル・シャンマルのラシード家に滅ぼされた。
    - from: 1902
      to: 1914
      text: クウェートに亡命していたイブン・サウードがリヤドを奪回し、ラシード家からカスィームを奪い（1906）、1913年にはハサーからオスマン軍を追った。
  source: "https://ja.wikipedia.org/wiki/第一次サウード王国"

- id: rashidi
  name: ラシード朝（ジャバル・シャンマル首長国）
  short: ラシード朝
  color: "#c9b38f"
  kind: 首長国（オスマン帝国と結ぶ）
  note: ハーイルを都とするシャンマル族のラシード家の首長国。初めはサウード家に臣従したが自立し、オスマン帝国と結んで1891年にサウード家を倒し、ナジュドの大半を支配した。1921年にイブン・サウードに滅ぼされた。
  rulers:
    - {name: アブドゥッラー・イブン・ラシード, title: アミール, from: 1836, to: 1848, source: "https://en.wikipedia.org/wiki/Abdullah_bin_Rashid"}
    - {name: タラール・イブン・アブドゥッラー, title: アミール, from: 1848, to: 1868, source: "https://en.wikipedia.org/wiki/Talal_bin_Abdullah_Al_Rashid"}
    - {name: ミトアブ1世, title: アミール, from: 1868, to: 1869}
    - {name: バンダル, title: アミール, from: 1869, to: 1869}
    - {name: ムハンマド・イブン・ラシード, title: アミール, from: 1869, to: 1897, note: 1891年にムライダの戦いでサウード家を破った。, source: "https://en.wikipedia.org/wiki/Muhammad_bin_Abdullah_Al_Rashid"}
    - {name: アブドゥルアズィーズ・イブン・ミトアブ, title: アミール, from: 1897, to: 1906, note: 1906年にイブン・サウードとの戦いで戦死。, source: "https://en.wikipedia.org/wiki/Abdulaziz_bin_Mutaib_Al_Rashid"}
    - {name: ミトアブ2世, title: アミール, from: 1906, to: 1907}
    - {name: スルターン・イブン・ハンムード, title: アミール, from: 1907, to: 1908}
    - {name: サウード・イブン・ハンムード, title: アミール, from: 1908, to: 1910}
    - {name: サウード・イブン・アブドゥルアズィーズ, title: アミール, from: 1910, to: 1920, note: 幼少のため摂政が統治。}
  periods:
    - from: 1836
      to: 1890
      text: アブドゥッラー・イブン・ラシードがハーイルで首長となり、北アラビアの隊商路と遊牧民を押さえて力をつけた。
    - from: 1891
      to: 1914
      text: ムハンマド・イブン・ラシードがサウード家を倒してリヤドまで支配した（ナジュドの最大勢力）。オスマン帝国の支援を受けたが、1902年以後イブン・サウードに押し返された。
  source: "https://en.wikipedia.org/wiki/Emirate_of_Jabal_Shammar"

- id: banu_khalid
  name: バニー・ハーリド首長国（ハサー）
  short: バニー・ハーリド
  color: "#c5b2d1"
  kind: 部族首長国
  periods:
    - from: 1670
      to: 1795
      text: アラブのバニー・ハーリド族が1670年ごろオスマン帝国の守備隊を追ってハサー（アラビア半島東部）を支配した。1795年にサウード王国に征服された。
  source: "https://en.wikipedia.org/wiki/Emirate_of_Bani_Khalid"

- id: kuwait
  name: クウェート（サバーフ家）
  short: クウェート
  color: "#a8d0d8"
  kind: 首長国
  rulers:
    - {name: サバーフ1世, title: 首長, from: 1752, to: 1762, source: "https://en.wikipedia.org/wiki/Sabah_I_bin_Jaber"}
    - {name: アブドゥッラー1世, title: 首長, from: 1762, to: 1814, source: "https://en.wikipedia.org/wiki/Abdullah_I_Al-Sabah"}
    - {name: ジャービル1世, title: 首長, from: 1814, to: 1859, source: "https://en.wikipedia.org/wiki/Jaber_I_Al-Sabah"}
    - {name: サバーフ2世, title: 首長, from: 1859, to: 1866, source: "https://en.wikipedia.org/wiki/Sabah_II_Al-Sabah"}
    - {name: アブドゥッラー2世, title: 首長, from: 1866, to: 1892, note: 1871年にオスマン帝国のバスラ州の郡長（カイマカム）の称号を受けた。, source: "https://en.wikipedia.org/wiki/Abdullah_II_Al-Sabah"}
    - {name: ムハンマド, title: 首長, from: 1892, to: 1896, source: "https://en.wikipedia.org/wiki/Muhammad_bin_Sabah_Al-Sabah"}
    - {name: ムバーラク（大ムバーラク）, title: 首長, from: 1896, to: 1915, note: 兄弟を殺して位につき、1899年にイギリスと秘密協定を結んで保護下に入った。, source: "https://en.wikipedia.org/wiki/Mubarak_Al-Sabah"}
  periods:
    - from: 1871
      to: 1898
      text: オスマン帝国のミドハト・パシャのハサー遠征に協力し、名目上オスマン帝国のバスラ州に属した。
    - from: 1899
      to: 1914
      text: ドイツのバグダード鉄道の終点となることを警戒したイギリスと協定を結び、事実上イギリスの保護国となった。
  source: "https://ja.wikipedia.org/wiki/クウェートの歴史"

- id: bahrain
  name: バーレーン（ハリーファ家）
  short: バーレーン
  color: "#e9b9a1"
  kind: 首長国
  rulers:
    - {name: サルマーン・イブン・アフマドとアブドゥッラー・イブン・アフマド, title: 首長（共同統治）, from: 1796, to: 1825, note: 要確認。, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bahrain"}
    - {name: ハリーファ・イブン・サルマーンとアブドゥッラー・イブン・アフマド, title: 首長（共同統治）, from: 1825, to: 1834, note: 要確認。, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bahrain"}
    - {name: アブドゥッラー・イブン・アフマド, title: 首長, from: 1834, to: 1843, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bahrain"}
    - {name: ムハンマド・イブン・ハリーファ, title: 首長, from: 1843, to: 1868, note: 1867年にカタルを攻めたことからイギリスに追われた。, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bahrain"}
    - {name: アリー・イブン・ハリーファ, title: 首長, from: 1868, to: 1869, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bahrain"}
    - {name: イーサー・イブン・アリー, title: 首長, from: 1869, to: 1932, note: 1880年・1892年の協定で外交をイギリスに委ねた。, source: "https://en.wikipedia.org/wiki/List_of_rulers_of_Bahrain"}
  note: 1783年にカタル北部のズバーラを拠点とするハリーファ家がペルシア側の勢力からバーレーンを奪った。1820年の一般講和条約、1861年の「恒久平和友好条約」、1880年・1892年の協定でイギリスの保護下に入った。
  source: "https://ja.wikipedia.org/wiki/バーレーンの歴史"

- id: oman
  name: オマーン
  names:
    - {to: 1748, name: オマーン（ヤアーリバ朝）}
    - {from: 1749, to: 1969, name: オマーン（ブーサイード朝）}
  short: オマーン
  color: "#c48d8d"
  kind: イマーム国
  rulers:
    - {name: サイイド・サイード（サイード・イブン・スルターン）, title: スルタン（ブーサイード朝）, from: 1806, to: 1856, note: 1830年代からザンジバルに住み、東アフリカの丁子（クローブ）栽培と奴隷・象牙交易で栄えた。, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Oman"}
    - {name: トゥワイニー・イブン・サイード, title: スルタン（マスカット）, from: 1856, to: 1866, note: 弟マージドがザンジバルを継ぎ、1861年のカニング裁定で両国は分かれた。, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Oman"}
    - {name: サーリム・イブン・トゥワイニー, title: スルタン, from: 1866, to: 1868, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Oman"}
    - {name: アッザーン・イブン・カイス, title: イマーム, from: 1868, to: 1871, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Oman"}
    - {name: トゥルキー・イブン・サイード, title: スルタン, from: 1871, to: 1888, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Oman"}
    - {name: ファイサル・イブン・トゥルキー, title: スルタン, from: 1888, to: 1913, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Oman"}
    - {name: タイムール・イブン・ファイサル, title: スルタン, from: 1913, to: 1932, source: "https://en.wikipedia.org/wiki/List_of_sultans_of_Oman"}
  note: 1650年にマスカットからポルトガルを追い、インド洋西部の海上勢力となった。1749年からブーサイード朝。1784年にバローチスターンのグワーダルを得た。サイイド・サイード（1806–1856）は東アフリカのザンジバルに都を移したが、その死後ザンジバルは別の国となった（1861年）。19世紀後半にはイギリスの影響が強まった（1891年の協定）。
  source: "https://ja.wikipedia.org/wiki/オマーンの歴史"

- id: qawasim
  name: カワーシム（シャルジャ・ラアス・アル＝ハイマ）
  short: カワーシム
  color: "#b3a3c3"
  kind: 部族首長国
  note: ペルシア湾南岸の海上勢力。イギリスは「海賊海岸」と呼び、1809年と1819年に攻撃した。1820年の一般講和条約の後は、地図では trucial_states（休戦海岸の首長国）として表示する。
  source: "https://en.wikipedia.org/wiki/Al_Qasimi"

- id: trucial_states
  name: 休戦海岸の首長国（トルーシャル・ステーツ）
  short: 休戦海岸
  color: "#b3a3c3"
  kind: 首長国群（イギリスの保護下）
  note: シャルジャ・ラアス・アル＝ハイマ（カワーシム家）、アブダビ（ナヒヤーン家）、ドバイ（マクトゥーム家、1833年にアブダビから分かれる）などの首長国。1820年の一般講和条約、1853年の恒久海上休戦条約を結び、1892年の排他的協定でイギリスの保護国となった（現在のアラブ首長国連邦）。
  source: "https://en.wikipedia.org/wiki/Trucial_States"

- id: qatar
  name: カタル（サーニー家）
  short: カタル
  color: "#e3c47d"
  kind: 首長国
  note: ドーハのサーニー家の首長国。1868年にイギリスがムハンマド・イブン・サーニーと協定を結び、バーレーンのハリーファ家から切り離した。1871年からオスマン帝国の守備隊が置かれ、名目上はハサー県に属した（1913年の英土協定でオスマン帝国は権利を放棄）。
  rulers:
    - {name: ムハンマド・イブン・サーニー, title: 首長, from: 1851, to: 1878, source: "https://en.wikipedia.org/wiki/Mohammed_bin_Thani"}
    - {name: ジャースィム・イブン・ムハンマド, title: 首長, from: 1878, to: 1913, note: 1893年のワジバの戦いでオスマン軍を破った。, source: "https://en.wikipedia.org/wiki/Jassim_bin_Mohammed_Al_Thani"}
    - {name: アブドゥッラー・イブン・ジャースィム, title: 首長, from: 1913, to: 1949, source: "https://en.wikipedia.org/wiki/Abdullah_bin_Jassim_Al_Thani"}
  source: "https://ja.wikipedia.org/wiki/カタールの歴史"
