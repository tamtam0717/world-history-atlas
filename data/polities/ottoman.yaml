    - {name: トマス・パレオロゴス, title: モレア専制公, from: 1428, to: 1460, note: 西部（パトラ）を治めた。1460年にイタリアへ逃れる。, source: "https://en.wikipedia.org/wiki/Thomas_Palaiologos"}
