    - {name: ヴァシリイェ・ヴェリェクライスキ, title: ツェティニェ府主教, from: 1685, to: 1685, note: 要確認}
    - {name: ヴィサリオン・バイツァ, title: ツェティニェ府主教, from: 1685, to: 1692, note: 要確認}
