    - {name: アッバース3世, title: シャー（サファヴィー朝）, from: 1732, to: 1736, note: 幼児。実権はナーディル。, source: "https://en.wikipedia.org/wiki/Abbas_III"}
    - {name: ナーディル・シャー, title: シャー（アフシャール朝）, from: 1736, to: 1747, source: "https://ja.wikipedia.org/wiki/ナーディル・シャー"}
    - {name: アーディル・シャー, title: シャー（アフシャール朝）, from: 1747, to: 1748, source: "https://en.wikipedia.org/wiki/Adil_Shah"}
    - {name: イブラーヒーム・シャー, title: シャー（アフシャール朝）, from: 1748, to: 1748, source: "https://en.wikipedia.org/wiki/Ebrahim_Afshar"}
    - {name: シャー・ロフ, title: シャー（アフシャール朝）, from: 1748, to: 1750, note: 1750年以降はホラーサーンだけを保った（1796年まで）。, source: "https://en.wikipedia.org/wiki/Shahrokh_Afshar"}
    - {name: カリーム・ハン・ザンド, title: ワキール（摂政。ザンド朝）, from: 1751, to: 1779, note: シャーの称号を名乗らず「民衆の代理人（ワキール）」と称した。名目上のシャーとしてサファヴィー家のイスマーイール3世を立てた。, source: "https://ja.wikipedia.org/wiki/カリーム・ハーン"}
    - {name: アボル・ファトフ・ハン／モハンマド・アリー・ハン, title: ザンド朝の君主, from: 1779, to: 1779}
    - {name: サーデク・ハン, title: ザンド朝の君主, from: 1779, to: 1782, source: "https://en.wikipedia.org/wiki/Sadeq_Khan_Zand"}
    - {name: アリー・モラード・ハン, title: ザンド朝の君主, from: 1782, to: 1785, source: "https://en.wikipedia.org/wiki/Ali-Morad_Khan_Zand"}
    - {name: ジャアファル・ハン, title: ザンド朝の君主, from: 1785, to: 1789, source: "https://en.wikipedia.org/wiki/Jafar_Khan_Zand"}
    - {name: ロトフ・アリー・ハン, title: ザンド朝の君主, from: 1789, to: 1794, source: "https://en.wikipedia.org/wiki/Lotf_Ali_Khan"}
    - {name: アーガー・モハンマド・ハーン, title: シャー（カージャール朝）, from: 1794, to: 1797, note: 1794年にザンド朝を滅ぼしてイランを統一し、1796年に正式に戴冠。それ以前は qajar_north（カージャール族）を参照。, source: "https://ja.wikipedia.org/wiki/アーガー・モハンマド・シャー"}
    - {name: ファトフ・アリー・シャー, title: シャー（カージャール朝）, from: 1797, to: 1834, source: "https://ja.wikipedia.org/wiki/ファトフ・アリー・シャー"}
    - {name: モハンマド・シャー, title: シャー（カージャール朝）, from: 1834, to: 1848, source: "https://ja.wikipedia.org/wiki/モハンマド・シャー"}
    - {name: ナーセロッディーン・シャー, title: シャー（カージャール朝）, from: 1848, to: 1896, note: 宰相アミール・キャビールの改革（1848–1851）。1896年に暗殺された。, source: "https://ja.wikipedia.org/wiki/ナーセロッディーン・シャー"}
    - {name: モザッファロッディーン・シャー, title: シャー（カージャール朝）, from: 1896, to: 1907, note: 1906年に憲法と議会を認めた。, source: "https://ja.wikipedia.org/wiki/モザッファロッディーン・シャー"}
    - {name: モハンマド・アリー・シャー, title: シャー（カージャール朝）, from: 1907, to: 1909, note: 1908年に議会を砲撃して解散したが、立憲派に追われて退位。, source: "https://ja.wikipedia.org/wiki/モハンマド・アリー・シャー"}
