      to: 1891
      text: トゥルキーがリヤドを都にサウード家の国を再興し（第二次サウード王国）、ハサーまで勢力を戻した。1838–1843年には再びエジプト軍が進駐した。1865年以後は王族の争いで弱まり、1871年にハサーをオスマン帝国に奪われ、1891年にジャバル・シャンマルのラシード家に滅ぼされた。
    - from: 1902
      to: 1914
      text: クウェートに亡命していたイブン・サウードがリヤドを奪回し、ラシード家からカスィームを奪い（1906）、1913年にはハサーからオスマン軍を追った。
    - from: 1915
      to: 1932
      text: イブン・サウードはイギリスと条約を結び（1915）、ラシード家を滅ぼし（1921）、ヒジャーズ王国を征服した（1924–1925）。1932年に征服地をまとめてサウジアラビア王国とした。ワッハーブ派の戦士集団イフワーンが征服を支えた。
    - from: 1933
      to: 1972
      text: 1938年にアメリカの石油会社が大油田を見つけ、石油の収入で国家が作られていった。1945年にアメリカと結び、アラブ連盟の創設国となった。
    - from: 1973
      to: 2016
      text: 第4次中東戦争で石油輸出を制限し（石油危機）、OPECの中心となった。1979年のメッカの大モスク占拠事件ののち宗教的な統制を強めた。湾岸戦争（1991）ではアメリカ軍を受け入れた。
    - from: 2017
      text: ムハンマド皇太子のもとで石油に頼らない経済を目指す「ビジョン2030」を進め、女性の自動車運転を認めた（2018）。イエメン内戦に介入し、2023年に中国の仲介でイランと国交を戻した。
  source: "https://ja.wikipedia.org/wiki/第一次サウード王国"

