  note: ツェティニェの府主教（ヴラディカ）が政治的な指導者を兼ねた。オスマン帝国の宗主権は名目的で、山地の部族社会として事実上自立していた。1697年からペトロヴィチ＝ニェゴシュ家が府主教位を世襲（叔父から甥へ）。1852年にダニーロ1世が府主教位を捨てて世俗の公となった。独立が国際的に認められたのは1878年のベルリン条約。1659–1673年ごろと1690年代の府主教は資料によって異なる（要確認）。
