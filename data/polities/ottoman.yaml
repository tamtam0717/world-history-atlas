      text: ベオグラード州のイェニチェリの暴政に対してセルビア人が蜂起（第一次セルビア蜂起）。ロシアの支援を受けてベオグラードを押さえたが、ブカレスト条約（1812）でロシアが手を引き、1813年に鎮圧された。
    - from: 1815
      to: 1829
      text: ミロシュ・オブレノヴィチが第二次セルビア蜂起を起こし、オスマン帝国と交渉して自治を得た（1817年に公となる）。アッケルマン条約（1826）・アドリアノープル条約（1829）でロシアが自治を保障した。
    - from: 1830
      to: 1877
      text: ハッティ・シェリフ（1830）でオスマン帝国の宗主権のもとの自治公国として認められた。公位はオブレノヴィチ家とカラジョルジェヴィチ家の間で揺れたが、ミハイロ公のもとでオスマン軍の要塞からの撤退（1867）を実現した。
    - from: 1878
      to: 1902
      text: ベルリン条約で独立が認められ、ニシュ・ピロト・ヴラニェを得た。1882年に王国となったが、ミラン王はオーストリア＝ハンガリーに頼り、ブルガリアとの戦争（1885）には敗れた。
    - from: 1903
      to: 1914
      text: クーデタでカラジョルジェヴィチ家のペータル1世が王となり、ロシアに近づいた。オーストリア＝ハンガリーとの「豚戦争」（1906–1911）、ボスニア併合（1908）で対立が深まった。バルカン戦争でコソヴォとマケドニアを得て領土を倍近くに広げた。
