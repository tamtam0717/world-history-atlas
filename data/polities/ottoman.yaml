  periods:
    - from: 1648
      to: 1721
      text: サファヴィー朝の後期。首都イスファハーンは繁栄したが、王権は弱まり、宮廷の内紛と地方の反乱が続いた。オスマン帝国との国境は1639年のズハーブ条約の線でほぼ安定。
    - from: 1722
      to: 1735
      text: アフガン（ギルザイ族）にイスファハーンを奪われてサファヴィー朝は事実上崩壊。オスマン帝国とロシアが西部・北部を奪った。ナーディルが軍を率いてアフガンを追い（1729）、失地を回復した。
    - from: 1736
      to: 1747
      text: ナーディル・シャーがアフシャール朝を開き、ムガル帝国のデリーを略奪（1739）するなど大遠征を重ねた。オスマン帝国とはケルデン条約（1746）で旧国境を確認。1747年に暗殺された。
    - from: 1751
      to: 1779
      text: カリーム・ハン・ザンドがシーラーズを都に西部・南部を治め、比較的平穏な時代となった。
    - from: 1779
      to: 1793
      text: カリーム・ハンの死後、ザンド朝では王位をめぐる内紛が続いた。北部ではガージャール族のアーガー・モハンマド・ハーンが台頭し、ザンド朝の最後の君主ロトフ・アリー・ハンを追いつめた。
    - from: 1794
      to: 1815
      text: アーガー・モハンマド・ハーンがザンド朝を倒してイランを統一し、テヘランを都とした（ガージャール朝）。ファトフ・アリー・シャーはロシアとの戦争に敗れ、グリスタン条約（1813）でカフカースの大半を失った。
  source: "https://ja.wikipedia.org/wiki/サファヴィー朝"

