    - {name: ゲオルギオス1世, title: ギリシア王, from: 1863, to: 1913, note: デンマーク王子。イギリスはイオニア諸島を贈って即位を後押しした。1913年にテッサロニキで暗殺。, source: "https://ja.wikipedia.org/wiki/ゲオルギオス1世"}
    - {name: コンスタンディノス1世, title: ギリシア王, from: 1913, to: 1917, source: "https://ja.wikipedia.org/wiki/コンスタンティノス1世"}
