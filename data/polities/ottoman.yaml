    - {name: スピロス・キプリアヌ, title: 大統領, from: 1977, to: 1988, source: "https://en.wikipedia.org/wiki/Spyros_Kyprianou"}
    - {name: ゲオルギオス・ヴァシリウ, title: 大統領, from: 1988, to: 1993, source: "https://en.wikipedia.org/wiki/George_Vasiliou"}
    - {name: グラフコス・クレリデス, title: 大統領, from: 1993, to: 2003, source: "https://en.wikipedia.org/wiki/Glafcos_Clerides"}
    - {name: タソス・パパドプロス, title: 大統領, from: 2003, to: 2008, note: 2004年の国連の統一案（アナン案）に反対し、住民投票でギリシア系が否決した。, source: "https://en.wikipedia.org/wiki/Tassos_Papadopoulos"}
