    - {name: ラーナー・サングラーム・シング2世, title: メーワールのラーナー, from: 1710, to: 1734, source: "https://en.wikipedia.org/wiki/Sangram_Singh_II"}
    - {name: ラーナー・ジャガト・シング2世, title: メーワールのラーナー, from: 1734, to: 1751, source: "https://en.wikipedia.org/wiki/Jagat_Singh_II"}
