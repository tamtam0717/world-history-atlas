  source: "https://en.wikipedia.org/wiki/Kathiawar"

# ================================================================ 1453–1647 の北インドの政体（担当Z4）
- id: delhi_sultanate
  name: デリー・スルタン朝（ローディー朝）
  short: ローディー朝
  color: "#e3b778"
  kind: スルタン国（アフガン系）
  rulers:
    - {name: バフロール・ローディー, title: スルタン, from: 1451, to: 1489, note: アフガン人のローディー家の出で、パンジャーブの長官からデリーのスルタンとなった。1479年にジャウンプル・スルタン朝を滅ぼした。, source: "https://ja.wikipedia.org/wiki/バフロール・ローディー"}
    - {name: シカンダル・ローディー, title: スルタン, from: 1489, to: 1517, note: ビハールを取り（1495）、1504年ごろアーグラを都とした。, source: "https://ja.wikipedia.org/wiki/シカンダル・ローディー"}
    - {name: イブラーヒーム・ローディー, title: スルタン, from: 1517, to: 1526, note: アフガン貴族と対立し、1526年のパーニーパットの戦いでバーブルに敗れて戦死した。, source: "https://ja.wikipedia.org/wiki/イブラーヒーム・ローディー"}
  periods:
    - from: 1453
      to: 1488
      text: デリー・スルタン朝の最後の王朝。アフガン系のローディー家のバフロールがデリーに入り（1451）、東のジャウンプル・スルタン朝と長く戦って1479年に滅ぼした。
    - from: 1489
      to: 1516
      text: シカンダル・ローディーがビハールまで版図を広げ、アーグラを新しい都とした。
    - from: 1517
      to: 1525
      text: イブラーヒーム・ローディーはアフガン貴族の力を抑えようとして反発を招いた。パンジャーブの長官ダウラト・ハーン・ローディーらはカーブルのバーブルを招き、1526年のパーニーパットの戦いで王朝は滅んだ。
  source: "https://ja.wikipedia.org/wiki/ローディー朝"

- id: sur
  name: スール朝
  names:
    - {to: 1538, name: ビハールのアフガン政権（ローハーニー家・シェール・ハーン）, short: ビハール, kind: アフガン貴族の政権}
  short: スール朝
  color: "#e89bb2"
  kind: スルタン国（アフガン系）
  rulers:
    - {name: スルターン・ムハンマド（バハール・ハーン・ローハーニー）, title: ビハールの君主, from: 1526, to: 1528, note: ローディー朝のビハール長官の子。自立してスルターンを名のった。在位年は要確認, source: "https://en.wikipedia.org/wiki/Sher_Shah_Suri"}
    - {name: ジャラール・ハーン・ローハーニー, title: ビハールの君主（シェール・ハーンが後見）, from: 1528, to: 1533, note: 1533年にベンガルへ逃れた。, source: "https://en.wikipedia.org/wiki/Sher_Shah_Suri"}
    - {name: シェール・シャー（シェール・ハーン）, title: ビハールの実権者→皇帝（シャー）, from: 1533, to: 1545, note: 1539年のチャウサーの戦いの後にシャーを名のり、1540年にフマーユーンをインドから追った。ルピー銀貨・街道（グランド・トランク・ロード）・土地の測量による徴税など、のちのムガル帝国に受け継がれる制度を作った。1545年、カーリンジャル城の攻撃中に火薬の爆発で死去した。, source: "https://ja.wikipedia.org/wiki/シェール・シャー"}
    - {name: イスラーム・シャー, title: スルタン, from: 1545, to: 1553, source: "https://en.wikipedia.org/wiki/Islam_Shah_Suri"}
    - {name: フィールーズ・シャー, title: スルタン, from: 1553, to: 1553, note: 12歳で即位し、数日でおじに殺された。, source: "https://en.wikipedia.org/wiki/Firuz_Shah_Suri"}
    - {name: ムハンマド・アーディル・シャー, title: スルタン, from: 1553, to: 1557, note: 将軍ヘームーに政務を任せた。デリー・アーグラを失ったあともチュナールに拠ったが、1557年にベンガル軍に敗れて死んだ。, source: "https://en.wikipedia.org/wiki/Adil_Shah_Suri"}
    - {name: イブラーヒーム・シャー・スール, title: スルタン（デリー・アーグラ）, from: 1555, to: 1555, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Ibrahim_Shah_Suri"}
    - {name: シカンダル・シャー・スール, title: スルタン（パンジャーブ・デリー）, from: 1555, to: 1555, note: シルヒンドの戦い（1555年6月）でフマーユーンに敗れた。, source: "https://en.wikipedia.org/wiki/Sikandar_Shah_Suri"}
  periods:
    - from: 1526
      to: 1538
      text: ローディー朝の滅亡の後、ビハールのアフガン貴族ローハーニー家が自立し、その家臣シェール・ハーン（スール家）がしだいに実権を握った。チュナール城を手に入れ（1530ごろ）、ベンガルのスルタンを破った（1534・1538）。
    - from: 1539
      to: 1553
      text: シェール・シャーがムガル帝国のフマーユーンを破って北インドを治めた（スール朝）。短い治世に、街道と宿駅、ルピー銀貨、土地の測量に基づく税制など、のちにアクバルが受け継ぐ制度を整えた。
    - from: 1554
      to: 1556
      text: イスラーム・シャーの死（1553）の後、一族の争いで国が4つに分かれ、ベンガルも自立した。1555年にフマーユーンがデリーを取り戻し、1556年の第2次パーニーパットの戦いでアーディル・シャーの将軍ヘームーが敗れて、スール朝は滅んだ。
  note: 地図では、1526–1538年のビハールのアフガン政権（ローハーニー家・シェール・ハーン）もスール朝の色で描く。1553年以後の分裂（パンジャーブのシカンダル・シャー、デリー・アーグラのイブラーヒーム・シャー、東部のアーディル・シャー）は描き分けていない。
  source: "https://ja.wikipedia.org/wiki/スール朝"

- id: jaunpur
  name: ジャウンプル・スルタン朝（シャルキー朝）
  short: ジャウンプル
  color: "#63c0af"
  kind: スルタン国
  rulers:
    - {name: マフムード・シャー・シャルキー, title: スルタン, from: 1440, to: 1457, source: "https://en.wikipedia.org/wiki/Mahmud_Shah_Sharqi"}
    - {name: ムハンマド・シャー・シャルキー, title: スルタン, from: 1457, to: 1458, source: "https://en.wikipedia.org/wiki/Jaunpur_Sultanate"}
    - {name: フサイン・シャー・シャルキー, title: スルタン, from: 1458, to: 1479, note: デリーを何度も攻めたが、1479年にバフロール・ローディーに敗れてジャウンプルを失い、ビハールへ逃れた（1494年まで抵抗し、のちベンガルに亡命）。, source: "https://en.wikipedia.org/wiki/Husain_Shah_Sharqi"}
  periods:
    - from: 1453
      to: 1479
      text: ガンジス川中流（アワド・ジャウンプル・ベナレス）を治めたシャルキー朝の国。デリーのローディー朝と争った。都ジャウンプルにはアタラ・モスクなど独特の建築が残り、学問の都とされた。
  note: 1480–1494年にフサイン・シャーが拠ったビハール南部もジャウンプルの色で描く（不確実）。
  source: "https://en.wikipedia.org/wiki/Jaunpur_Sultanate"

- id: malwa_sultanate
  name: マールワー・スルタン朝
  names:
    - {to: 1530, name: マールワー・スルタン朝（ハルジー朝）, short: マールワー}
    - {from: 1537, to: 1541, name: マールワー（カーディル・シャー）, short: マールワー}
    - {from: 1555, name: マールワー（バーズ・バハードゥル）, short: マールワー}
  short: マールワー
  color: "#cec1fd"
  kind: スルタン国
  rulers:
    - {name: マフムード・ハルジー, title: スルタン, from: 1436, to: 1469, note: メーワール・グジャラート・デリー・バフマニー朝と戦い、マールワーを最も広げた。, source: "https://en.wikipedia.org/wiki/Mahmud_Khalji"}
    - {name: ギヤースッディーン・ハルジー, title: スルタン, from: 1469, to: 1500, note: 戦争を避け、マーンドゥに大きな後宮を構えたことで知られる。, source: "https://en.wikipedia.org/wiki/Ghiyath_Shah"}
    - {name: ナースィルッディーン・ハルジー, title: スルタン, from: 1500, to: 1510, source: "https://en.wikipedia.org/wiki/Nasir_Shah_Khalji"}
    - {name: マフムード・シャー2世, title: スルタン, from: 1510, to: 1531, note: 宰相メーディニー・ラーイと争い、1519年にラーナー・サーンガーに捕らえられた。1531年にグジャラートのバハードゥル・シャーに敗れて殺された。, source: "https://en.wikipedia.org/wiki/Mahmud_Shah_II_(Malwa)"}
    - {name: カーディル・シャー（マッル・ハーン）, title: スルタン, from: 1537, to: 1542, source: "https://en.wikipedia.org/wiki/Malwa_Sultanate"}
    - {name: バーズ・バハードゥル, title: スルタン, from: 1555, to: 1561, note: 音楽を好み、歌姫ループマティーとの恋物語で知られる。アクバルに敗れ、のちアクバルに仕えた。, source: "https://en.wikipedia.org/wiki/Baz_Bahadur"}
  periods:
    - from: 1453
      to: 1530
      text: ハルジー朝のマールワー・スルタン朝（都マーンドゥ）。中央インドの高原を治め、グジャラート・メーワールと争った。マーンドゥにはジャーミー・モスクやジャハーズ・マハル（船の宮殿）が残る。
    - from: 1531
      to: 1561
      text: グジャラートに征服され（1531）、その後はマッル・ハーン（カーディル・シャー）、スール朝の長官（1542–）、バーズ・バハードゥル（1555–）と支配者が替わり、1561年にアクバルに征服された。
  source: "https://en.wikipedia.org/wiki/Malwa_Sultanate"

- id: gujarat_sultanate
  name: グジャラート・スルタン朝
  short: グジャラート
  color: "#e8d08a"
  kind: スルタン国（ムザッファル朝）
  rulers:
    - {name: クトゥブッディーン・アフマド・シャー2世, title: スルタン, from: 1451, to: 1458, source: "https://en.wikipedia.org/wiki/Qutbuddin_Ahmad_Shah_II"}
    - {name: ダーウード・シャー, title: スルタン, from: 1458, to: 1458, note: 数日で廃された。, source: "https://en.wikipedia.org/wiki/Gujarat_Sultanate"}
    - {name: マフムード・ベーガダー, title: スルタン, from: 1458, to: 1511, note: ジュナーガド（1472）・チャーンパーネール（1484）を攻め落とし、国を最も広げた。マムルーク朝と結んでポルトガルと戦ったが、ディーウ沖の海戦（1509）で敗れた。, source: "https://en.wikipedia.org/wiki/Mahmud_Begada"}
    - {name: ムザッファル・シャー2世, title: スルタン, from: 1511, to: 1526, source: "https://en.wikipedia.org/wiki/Muzaffar_Shah_II"}
    - {name: シカンダル・シャー／マフムード・シャー2世, title: スルタン, from: 1526, to: 1526, note: 数か月ずつで殺された・廃された。, source: "https://en.wikipedia.org/wiki/Gujarat_Sultanate"}
    - {name: バハードゥル・シャー, title: スルタン, from: 1526, to: 1537, note: マールワー（1531）を征服し、チットールを攻め落とした（1535）。フマーユーンに敗れてポルトガルにディーウの城を許し、1537年にポルトガル人との会見で殺された。, source: "https://en.wikipedia.org/wiki/Bahadur_Shah_of_Gujarat"}
    - {name: ミーラーン・ムハンマド・シャー, title: スルタン, from: 1537, to: 1537, note: ハーンデーシュの王。即位の直後に死んだ。, source: "https://en.wikipedia.org/wiki/Gujarat_Sultanate"}
    - {name: マフムード・シャー3世, title: スルタン, from: 1537, to: 1554, source: "https://en.wikipedia.org/wiki/Mahmud_Shah_III"}
    - {name: アフマド・シャー3世, title: スルタン, from: 1554, to: 1561, source: "https://en.wikipedia.org/wiki/Ahmad_Shah_III"}
    - {name: ムザッファル・シャー3世, title: スルタン, from: 1561, to: 1573, note: 1573年にアクバルに降ったが、1583年に反乱してアフマダーバードを一時取り戻し、1593年に自殺した。, source: "https://en.wikipedia.org/wiki/Muzaffar_Shah_III"}
  periods:
    - from: 1453
      to: 1510
      text: アフマダーバードを都とするムザッファル朝のスルタン国。カンバートやスーラトの港は、紅海・ペルシア湾・東南アジアを結ぶインド洋交易の中心で、綿布や藍を輸出した。マフムード・ベーガダーが国を最も広げた。
    - from: 1511
      to: 1537
      text: バハードゥル・シャーがマールワーを併合し、メーワールのチットールを攻め落としたが、フマーユーンの遠征（1535–36）で一時国を追われ、ポルトガルにディーウを許した。
    - from: 1538
      to: 1572
      text: 幼いスルタンのもとで貴族が争い、1572–73年にアクバルに征服された。
  source: "https://en.wikipedia.org/wiki/Gujarat_Sultanate"

- id: kashmir_sultanate
  name: カシミール・スルタン朝
  names:
    - {to: 1560, name: カシミール・スルタン朝（シャー・ミール朝）, short: カシミール}
    - {from: 1561, name: カシミール・スルタン朝（チャク朝）, short: カシミール}
  short: カシミール
  color: "#8be5f5"
  kind: スルタン国
  rulers:
    - {name: ザイヌル・アービディーン（ブドシャー）, title: スルタン, from: 1418, to: 1470, note: 「大王（ブドシャー）」と呼ばれた名君。ヒンドゥー教徒を保護し、サンスクリット・ペルシア語の学問や手工業を育てた。, source: "https://en.wikipedia.org/wiki/Zain-ul-Abidin"}
    - {name: ハイダル・シャー, title: スルタン, from: 1470, to: 1472, source: "https://en.wikipedia.org/wiki/Shah_Mir_dynasty"}
    - {name: ハサン・シャー, title: スルタン, from: 1472, to: 1484, source: "https://en.wikipedia.org/wiki/Shah_Mir_dynasty"}
    - {name: ムハンマド・シャー（ファトフ・シャーと争う）, title: スルタン, from: 1484, to: 1537, note: いとこのファトフ・シャーと王位を奪い合い、何度も即位と廃位を繰り返した。在位年は要確認, source: "https://en.wikipedia.org/wiki/Muhammad_Shah_(Kashmir)"}
    - {name: ミールザー・ハイダル・ドゥグラト, title: 実権者（フマーユーンの名で統治）, from: 1540, to: 1551, note: バーブルのいとこ。歴史書『ターリーヒ・ラシーディー』を書いた。カシミールの貴族の反乱で殺された。, source: "https://en.wikipedia.org/wiki/Mirza_Muhammad_Haidar_Dughlat"}
    - {name: ガーズィー・シャー・チャク, title: スルタン, from: 1561, to: 1563, source: "https://en.wikipedia.org/wiki/Chak_dynasty"}
    - {name: フサイン・シャー・チャク, title: スルタン, from: 1563, to: 1570, source: "https://en.wikipedia.org/wiki/Chak_dynasty"}
    - {name: アリー・シャー・チャク, title: スルタン, from: 1570, to: 1578, source: "https://en.wikipedia.org/wiki/Chak_dynasty"}
    - {name: ユースフ・シャー・チャク, title: スルタン, from: 1578, to: 1586, note: 詩人ハッバ・ハートゥーンの夫。1586年にアクバルに捕らえられ、ビハールへ送られた。, source: "https://en.wikipedia.org/wiki/Yusuf_Shah_Chak"}
    - {name: ヤークーブ・シャー・チャク, title: スルタン, from: 1586, to: 1586, note: 山地で抵抗を続け、1589年に降った。, source: "https://en.wikipedia.org/wiki/Yaqub_Shah_Chak"}
  periods:
    - from: 1453
      to: 1470
      text: シャー・ミール朝のザイヌル・アービディーンの治世。宗教に寛容で、ペルシアや中央アジアからショール織り・紙すき・漆塗り・製本などの職人を招いた。
    - from: 1471
      to: 1560
      text: 王族と貴族が争って国が乱れ、1540–51年はバーブルのいとこミールザー・ハイダルがフマーユーンの名で治めた。
    - from: 1561
      to: 1586
      text: シーア派の貴族チャク家が王位を奪い（チャク朝）、1586年にアクバルに併合された。以後、カシミールはムガル皇帝の避暑地となった。
  source: "https://en.wikipedia.org/wiki/Kashmir_Sultanate"

- id: langah
