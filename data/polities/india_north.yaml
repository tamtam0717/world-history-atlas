    - {name: ミール・ヌール・ムハンマド・ハーン, title: ミール, from: 1833, to: 1840, source: "https://en.wikipedia.org/wiki/Talpur_dynasty"}
    - {name: ミール・ナスィール・ハーン, title: ミール, from: 1840, to: 1843, note: 1843年のミアーニーの戦いでネーピアの軍に敗れた。, source: "https://en.wikipedia.org/wiki/Talpur_dynasty"}
