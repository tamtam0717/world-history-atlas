    - {name: アバイ・シング, title: マールワール王, from: 1724, to: 1749, source: "https://en.wikipedia.org/wiki/Abhai_Singh"}
    - {name: ラーム・シング／バクト・シング, title: マールワール王, from: 1749, to: 1752, source: "https://en.wikipedia.org/wiki/Bakht_Singh"}
    - {name: ヴィジャイ・シング, title: マールワール王, from: 1752, to: 1793, source: "https://en.wikipedia.org/wiki/Vijay_Singh_of_Marwar"}
    - {name: ビーム・シング, title: マールワール王, from: 1793, to: 1803, source: "https://en.wikipedia.org/wiki/Bhim_Singh_of_Marwar"}
    - {name: マーン・シング, title: マールワール王, from: 1803, to: 1843, note: 1818年にイギリスと保護条約を結んだ。, source: "https://en.wikipedia.org/wiki/Man_Singh_of_Marwar"}
