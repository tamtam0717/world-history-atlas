    - {name: "センゲ・ナムギャル", title: "ラダック王", from: 1616, to: 1642, note: "グゲ王国を征服し（1630）、レーの王宮とヘミス僧院を建てた。在位年は要確認", source: "https://en.wikipedia.org/wiki/Sengge_Namgyal"}
    - {name: デルダン・ナムギャル, title: ラダック王, from: 1642, to: 1694, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Deldan_Namgyal"}
    - {name: ニマ・ナムギャル, title: ラダック王, from: 1694, to: 1729, note: 在位年は要確認。このあとデチョン・ナムギャル、プンツォク・ナムギャル、ツェワン・ナムギャルらが続いたが、18世紀の王は省略した, source: "https://en.wikipedia.org/wiki/Namgyal_dynasty_of_Ladakh"}
    - {name: ツェパル・ナムギャル, title: ラダック王, from: 1808, to: 1842, note: 1834年からドーグラー軍の侵入を受け、王国は失われた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Namgyal_dynasty_of_Ladakh"}
  periods:
