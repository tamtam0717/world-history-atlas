    - {name: ジャーム・フィールーズ, title: ジャーム（王）, from: 1508, to: 1524, note: 1520年にシャー・ベグ・アルグンに敗れ、のちグジャラートへ逃れた。, source: "https://en.wikipedia.org/wiki/Samma_dynasty"}
