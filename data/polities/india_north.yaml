# 北西インド・パキスタンの政体。担当 S1（1648–2025）。
# パキスタン（pakistan）は ottoman.yaml で定義済み（使うだけ）。イギリス（britain）・ポルトガル（portugal）・ペルシア（persia）・
# ドゥッラーニー朝（durrani）・アフガニスタン（afghanistan）・カラート（kalat）も既存。
# マラーター同盟（maratha）・ハイデラバード（hyderabad）は S3、ネパール（nepal）は S2 が定義する。
# シンディア家・ホールカル家・ガーイクワード家などマラーターの諸侯の領地は、owner: maratha と副ラベル（label）で表した。
# 藩王国（イギリスの保護下に入った在地政権）は owner: britain・certainty: indirect・label に藩王国名で描く（docs/agent-brief-south-asia.md）。

# ---------------------------------------------------------------- ムガル帝国
- id: mughal
  name: ムガル帝国
  short: ムガル帝国
  color: "#8cc4b0"
  kind: 帝国（パーディシャー）
  rulers:
    - {name: シャー・ジャハーン, title: 皇帝（パーディシャー）, from: 1628, to: 1658, note: タージ・マハル、デリーの新都シャージャハーナーバードを造営した。1658年に息子アウラングゼーブに幽閉された。, source: "https://ja.wikipedia.org/wiki/シャー・ジャハーン"}
    - {name: アウラングゼーブ, title: 皇帝, from: 1658, to: 1707, note: 帝国の最大版図を築いたが、厳格なイスラーム政策（1679年のジズヤ復活など）がラージプート・マラーター・シク教徒の反発を招いた。1681年からデカンに遠征し、そのまま陣中で没した。, source: "https://ja.wikipedia.org/wiki/アウラングゼーブ"}
    - {name: バハードゥル・シャー1世, title: 皇帝, from: 1707, to: 1712, source: "https://ja.wikipedia.org/wiki/バハードゥル・シャー1世"}
    - {name: ジャハーンダール・シャー, title: 皇帝, from: 1712, to: 1713, source: "https://ja.wikipedia.org/wiki/ジャハーンダール・シャー"}
    - {name: ファッルフシヤル, title: 皇帝, from: 1713, to: 1719, note: サイイド兄弟が実権を握った。1717年に東インド会社に関税免除の勅許を与えた。, source: "https://ja.wikipedia.org/wiki/ファッルフシヤル"}
    - {name: ラフィー・ウッダラジャート／シャー・ジャハーン2世, title: 皇帝, from: 1719, to: 1719, note: サイイド兄弟に擁立され、数か月ずつで亡くなった。, source: "https://en.wikipedia.org/wiki/Rafi_ud-Darajat"}
    - {name: ムハンマド・シャー, title: 皇帝, from: 1719, to: 1748, note: 在位中にデカン（ニザーム）・アワド・ベンガルの太守が自立し、1739年にナーディル・シャーがデリーを略奪した。, source: "https://ja.wikipedia.org/wiki/ムハンマド・シャー"}
    - {name: アフマド・シャー・バハードゥル, title: 皇帝, from: 1748, to: 1754, note: 宰相に廃位・失明させられた。, source: "https://en.wikipedia.org/wiki/Ahmad_Shah_Bahadur"}
    - {name: アーラムギール2世, title: 皇帝, from: 1754, to: 1759, note: 宰相イマード・ウルムルクに殺された。, source: "https://en.wikipedia.org/wiki/Alamgir_II"}
    - {name: シャー・アーラム2世, title: 皇帝, from: 1759, to: 1806, note: 1771年までアラーハーバードなどを流浪し、1765年に東インド会社にベンガル・ビハール・オリッサのディーワーニー（徴税権）を与えた。1771年にマラーターの保護でデリーに戻った。1788年にロヒラのグラーム・カーディルに失明させられた。1803年からイギリスの保護下。, source: "https://ja.wikipedia.org/wiki/シャー・アーラム2世"}
    - {name: アクバル2世, title: 皇帝（イギリスの年金を受ける）, from: 1806, to: 1837, source: "https://ja.wikipedia.org/wiki/アクバル2世"}
    - {name: バハードゥル・シャー2世, title: 皇帝, from: 1837, to: 1857, note: インド大反乱で反乱軍に皇帝として担がれた。1857年9月にデリーが陥落して捕らえられ、1858年にビルマのラングーンへ流された。ムガル帝国の最後の皇帝。, source: "https://ja.wikipedia.org/wiki/バハードゥル・シャー2世"}
  periods:
    - from: 1648
      to: 1657
      text: シャー・ジャハーンの治世。デリーに新都シャージャハーナーバード（赤い城）を、アーグラにタージ・マハルを築き、インド＝イスラーム文化が栄えた。北はカーブル・カシュミールから、南はデカン北部までを治めた。
    - from: 1658
      to: 1706
      text: アウラングゼーブが兄弟を倒して即位し、デカンのビジャープル・ゴールコンダを滅ぼして（1686・87）帝国は最大の版図となった。しかし非ムスリムへのジズヤ（人頭税）を復活し、ラージプートの反乱、シヴァージーのマラーター、シク教徒、ジャートとの戦いが続いて、財政が傾いた。
    - from: 1707
      to: 1760
      text: アウラングゼーブの死後、皇帝は短い間隔で替わり、デカン（ニザーム）・アワド・ベンガルの太守が事実上独立した。マラーターが北へ勢力を広げ、ナーディル・シャー（1739）とアフマド・シャー・ドゥッラーニー（1757）がデリーを略奪した。
    - from: 1761
      to: 1802
      text: 皇帝の力はデリー周辺に限られた。シャー・アーラム2世は1771年にマラーターの保護でデリーに戻り、1784年からはシンディア家（マハーダージー・シンディア）が摂政として帝国の実権を握った。
    - from: 1803
      to: 1857
      text: 第2次マラーター戦争でイギリス軍がデリーを占領し、皇帝はイギリスの年金を受ける名目的な存在となった（地図では赤い城のあるデリー中心部だけを描く）。1857年のインド大反乱で反乱軍がバハードゥル・シャー2世を皇帝に担いだが、鎮圧され、1858年に帝国は滅んだ。
  note: 1803年以後の皇帝は、デリーの赤い城の中だけを治める名目上の君主だった。地図では、デリー中心部のピース（IND-Central）だけをムガル帝国（イギリスの帯つき）として残した。
  source: "https://ja.wikipedia.org/wiki/ムガル帝国"

# ---------------------------------------------------------------- 独立後のインド
- id: india
  name: インド
  names:
    - {to: 1949, name: インド（自治領）, kind: 自治領（イギリス連邦）}
    - {from: 1950, name: インド共和国, kind: 連邦共和国}
  short: インド
  color: "#f2b36b"
  kind: 連邦共和国
  rulers:
    - {name: ジャワハルラール・ネルー, title: 首相, from: 1947, to: 1964, note: 国民会議派。非同盟・計画経済を進めた。総督はマウントバッテン（–1948）、ラージャゴーパーラーチャーリ（1948–50）。1950年からは大統領（ラージェンドラ・プラサード）が元首。, source: "https://ja.wikipedia.org/wiki/ジャワハルラール・ネルー"}
    - {name: ラール・バハードゥル・シャーストリー, title: 首相, from: 1964, to: 1966, note: 1966年1月、タシケントでの印パ首脳会談中に急死した。, source: "https://ja.wikipedia.org/wiki/ラール・バハードゥル・シャーストリー"}
    - {name: インディラ・ガンディー, title: 首相, from: 1966, to: 1977, note: 1975–77年に非常事態を宣言した。, source: "https://ja.wikipedia.org/wiki/インディラ・ガンディー"}
    - {name: モラルジー・デーサーイー, title: 首相, from: 1977, to: 1979, note: ジャナタ党。初の国民会議派以外の政権。, source: "https://ja.wikipedia.org/wiki/モラルジー・デーサーイー"}
    - {name: チャラン・シン, title: 首相, from: 1979, to: 1980, source: "https://ja.wikipedia.org/wiki/チャラン・シン"}
    - {name: インディラ・ガンディー（再任）, title: 首相, from: 1980, to: 1984, note: 1984年10月、シク教徒の護衛に暗殺された。, source: "https://ja.wikipedia.org/wiki/インディラ・ガンディー"}
    - {name: ラジーヴ・ガンディー, title: 首相, from: 1984, to: 1989, note: 1991年に暗殺された。, source: "https://ja.wikipedia.org/wiki/ラジーヴ・ガンディー"}
    - {name: V・P・シン／チャンドラ・シェーカル, title: 首相, from: 1989, to: 1991, source: "https://ja.wikipedia.org/wiki/V・P・シン"}
    - {name: P・V・ナラシンハ・ラーオ, title: 首相, from: 1991, to: 1996, note: 財務相マンモハン・シンとともに経済の自由化を進めた。, source: "https://ja.wikipedia.org/wiki/P・V・ナラシンハ・ラーオ"}
    - {name: デーヴェー・ガウダ／グジラール, title: 首相, from: 1996, to: 1998, note: 1996年5月にヴァージペーイーが13日間だけ首相を務めた。, source: "https://ja.wikipedia.org/wiki/H・D・デーヴェー・ガウダ"}
    - {name: アタル・ビハーリー・ヴァージペーイー, title: 首相, from: 1998, to: 2004, note: インド人民党（BJP）。1998年に核実験を行った。, source: "https://ja.wikipedia.org/wiki/アタル・ビハーリー・ヴァージペーイー"}
    - {name: マンモハン・シン, title: 首相, from: 2004, to: 2014, note: 国民会議派。初のシク教徒の首相。, source: "https://ja.wikipedia.org/wiki/マンモハン・シン"}
    - {name: ナレンドラ・モディ, title: 首相, from: 2014, note: インド人民党（BJP）。, source: "https://ja.wikipedia.org/wiki/ナレンドラ・モディ"}
  periods:
    - from: 1947
      to: 1949
      text: 1947年8月15日にイギリス連邦の自治領として独立した。パキスタンとの分離で大量の難民と暴力が起き、カシミールをめぐって第1次印パ戦争となった。500を超える藩王国の多くを1948–49年に統合した。1948年1月、ガンディーが暗殺された。
    - from: 1950
      to: 1964
      text: 1950年に憲法を施行して共和国となった。ネルー首相のもとで議会制民主主義・政教分離（セキュラリズム）・計画経済と非同盟外交を進めた。1954年に周恩来と平和五原則を確認したが、1962年に中国と国境で戦った。
    - from: 1965
      to: 1990
      text: 1965年・1971年にパキスタンと戦い、1971年はバングラデシュの独立を助けた。インディラ・ガンディーは「緑の革命」で食糧の自給を進め、1974年に核実験を行い、1975–77年に非常事態を敷いた。1984年にはパンジャーブのシク教徒の過激派と衝突し、首相が暗殺された。
    - from: 1991
      to: 2013
      text: 1991年の経済危機をきっかけに自由化を進め、IT産業などで高い成長を続けた。ヒンドゥー・ナショナリズムが強まり（1992年のアヨーディヤーのモスク破壊）、1998年に核兵器を持った。カシミールではパキスタンと対立が続いた（1999年カールギル紛争）。
    - from: 2014
      text: モディ政権のもとで経済大国となり、2023年には人口が世界最多となった。2019年にジャンムー・カシュミール州の自治権を廃止した。2025年5月、カシミールのテロ事件をきっかけにパキスタンと武力衝突した。
  note: 地図はインドが実際に統治している範囲（カシミールは実効支配線〈LoC〉の南・東側）で塗る。アクサイチン（中国が実効支配）はインドも領有を主張している。
  source: "https://ja.wikipedia.org/wiki/インド"

# ---------------------------------------------------------------- パンジャーブ
- id: sikh_misls
  name: シク教徒の諸ミスル（ダル・カールサ）
  short: シク諸ミスル
  color: "#efe0a0"
  kind: 軍事同盟（ミスル）
  periods:
    - from: 1765
      to: 1798
      text: ドゥッラーニー朝の侵入とムガル帝国の衰えのなかで、シク教徒の12の軍団（ミスル）がパンジャーブ各地を分けて治めた。年に2回アムリトサルに集まり、共同で戦った（ダル・カールサ）。1765年にラホールを取った。
  note: ミスルにはバンギー（ラホール・アムリトサル）、スケルチャキア（グジュラーンワーラー）、カンハイヤー、アフルワーリア、ラームガリア、プルキアン（パティヤーラー・ナーバー・ジーンド）などがあった。サトレジ川の南（シス・サトレジ）のミスルは、1809年からイギリスの保護下に入った。
  source: "https://en.wikipedia.org/wiki/Misl"

- id: sikh_empire
  name: シク王国
  short: シク王国
  color: "#e9c75f"
  kind: 王国（マハーラージャ）
  rulers:
    - {name: ランジート・シング, title: マハーラージャ, from: 1799, to: 1839, note: 1799年にラホールを取り、1801年にパンジャーブのマハーラージャを名のった。ムルターン（1818）・カシュミール（1819）・ペシャーワル（1834）を併合した。, source: "https://ja.wikipedia.org/wiki/ランジート・シング"}
    - {name: カラク・シング, title: マハーラージャ, from: 1839, to: 1840, source: "https://en.wikipedia.org/wiki/Kharak_Singh"}
    - {name: ナウ・ニハール・シング／チャンド・カウル（摂政）, title: マハーラージャ, from: 1840, to: 1841, source: "https://en.wikipedia.org/wiki/Nau_Nihal_Singh"}
    - {name: シェール・シング, title: マハーラージャ, from: 1841, to: 1843, note: 1843年に暗殺された。, source: "https://en.wikipedia.org/wiki/Sher_Singh_(Sikh_Empire)"}
    - {name: ドゥリープ・シング, title: マハーラージャ, from: 1843, to: 1849, note: 幼少で、母ジンド・カウルが摂政。1849年にイギリスに退位させられた。, source: "https://ja.wikipedia.org/wiki/ドゥリープ・シング"}
  periods:
    - from: 1799
      to: 1838
      text: ランジート・シングがシク教徒のミスルを統一し、ヨーロッパ式の軍隊を育ててアフガン人からムルターン・カシュミール・ペシャーワルを奪った。1809年のアムリトサル条約でサトレジ川をイギリスとの境とした。
    - from: 1839
      to: 1849
      text: ランジート・シングの死後、王位争いと軍の暴走で混乱した。第1次シク戦争（1845–46）に敗れてジャランダル・ドアーブとカシュミールを失い、第2次シク戦争（1848–49）の後にイギリスに併合された。
  note: ジャンムーのグラーブ・シング（ドーグラー家）はシク王国の臣下で、ラダック（1834–）・バルティスターン（1840）を征服した。第1次シク戦争の後、アムリトサル条約（1846）でイギリスからカシュミールを買い、ジャンムー・カシュミール藩王国を開いた。
  source: "https://ja.wikipedia.org/wiki/シク王国"

- id: bahawalpur
