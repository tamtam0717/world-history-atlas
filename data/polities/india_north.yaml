  note: スカルドゥのマクポン家などの小王国。1637年からムガル帝国に貢納した。1840年にジャンムーのドーグラー軍（ゾーラーワル・シング）に征服された。
  source: "https://en.wikipedia.org/wiki/Maqpon_dynasty"

