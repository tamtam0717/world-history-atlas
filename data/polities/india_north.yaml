    - {name: サワーイー・ジャイ・シング2世, title: アンベール（ジャイプル）王, from: 1699, to: 1743, note: 1727年に新都ジャイプルを築き、ジャンタル・マンタル（天文台）を建てた。, source: "https://ja.wikipedia.org/wiki/ジャイ・シング2世"}
