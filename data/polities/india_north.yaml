    - {name: "ラーオ・チャンドラセーン", title: "マールワールの王", from: 1562, to: 1581, note: "アクバルに従わず、ジョードプルを奪われた（1564）後も山地で抵抗した。", source: "https://en.wikipedia.org/wiki/Chandrasen_Rathore"}
    - {name: "ウダイ・シング（モーター・ラージャ）", title: "マールワールの王", from: 1583, to: 1595, note: "アクバルに臣従してジョードプルを与えられた。娘ジョーダー・バーイーはジャハーンギールの妃となり、シャー・ジャハーンを生んだ。", source: "https://en.wikipedia.org/wiki/Udai_Singh_of_Marwar"}
    - {name: "スール・シング", title: "マールワールの王", from: 1595, to: 1619, source: "https://en.wikipedia.org/wiki/Sur_Singh_of_Marwar"}
    - {name: "ガジ・シング1世", title: "マールワールの王", from: 1619, to: 1638, source: "https://en.wikipedia.org/wiki/Gaj_Singh_of_Marwar"}
