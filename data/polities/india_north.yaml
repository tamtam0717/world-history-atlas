    - {name: スルターン・アーダム・ハーン, title: ガッカル族の首長, from: 1546, to: 1563, note: フマーユーンの帰還を助けたが、アクバルに廃された。在位年は要確認, source: "https://en.wikipedia.org/wiki/Gakhars"}
