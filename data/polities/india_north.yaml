  rulers:
    - {name: サアーダト・ハーン（ブルハーン・ウルムルク）, title: アワドの太守（ナワーブ）, from: 1722, to: 1739, note: ペルシア系のシーア派。ムガル帝国の州長官として赴任し、事実上自立した。, source: "https://en.wikipedia.org/wiki/Saadat_Ali_Khan_I"}
    - {name: サフダル・ジャング, title: 太守・ムガル帝国の宰相, from: 1739, to: 1754, source: "https://en.wikipedia.org/wiki/Safdarjung"}
    - {name: シュジャー・ウッダウラ, title: 太守, from: 1754, to: 1775, note: 1764年のブクサールの戦いで東インド会社に敗れ、1765年のアラーハーバード条約で会社と同盟した。1774年にロヒルカンドを併合した。, source: "https://en.wikipedia.org/wiki/Shuja-ud-Daula"}
    - {name: アーサフ・ウッダウラ, title: 太守, from: 1775, to: 1797, note: 都をラクナウに移した。1775年にベナレスを会社に譲った。, source: "https://en.wikipedia.org/wiki/Asaf-ud-Daula"}
    - {name: ワズィール・アリー・ハーン, title: 太守, from: 1797, to: 1798, note: 会社に廃位された。, source: "https://en.wikipedia.org/wiki/Wazir_Ali_Khan"}
    - {name: サアーダト・アリー・ハーン2世, title: 太守, from: 1798, to: 1814, note: 1801年の条約で領土の約半分（ロヒルカンド・ドアーブ南部・ゴーラクプルなど）を会社に譲った。, source: "https://en.wikipedia.org/wiki/Saadat_Ali_Khan_II"}
    - {name: ガーズィー・ウッディーン・ハイダル, title: 太守→アワド王（1819〜）, from: 1814, to: 1827, note: イギリスのすすめでムガル皇帝から離れ、王を名のった。, source: "https://en.wikipedia.org/wiki/Ghazi-ud-Din_Haidar_Shah"}
    - {name: ナスィール・ウッディーン・ハイダル, title: アワド王, from: 1827, to: 1837, source: "https://en.wikipedia.org/wiki/Nasir-ud-Din_Haidar_Shah"}
    - {name: ムハンマド・アリー・シャー, title: アワド王, from: 1837, to: 1842, source: "https://en.wikipedia.org/wiki/Muhammad_Ali_Shah_(Awadh)"}
    - {name: アムジャド・アリー・シャー, title: アワド王, from: 1842, to: 1847, source: "https://en.wikipedia.org/wiki/Amjad_Ali_Shah"}
    - {name: ワージド・アリー・シャー, title: アワド王, from: 1847, to: 1856, note: 1856年、「失政」を理由にダルハウジー総督に王国を併合され、カルカッタへ移された。, source: "https://ja.wikipedia.org/wiki/ワージド・アリー・シャー"}
    - {name: ビルジース・カドル（母ハズラト・マハルが摂政）, title: アワド王（反乱軍が擁立）, from: 1857, to: 1858, note: インド大反乱で、ラクナウの反乱軍が擁立した。1858年3月にラクナウが奪い返され、ネパールへ逃れた。, source: "https://en.wikipedia.org/wiki/Begum_Hazrat_Mahal"}
  periods:
    - from: 1722
      to: 1764
      text: ムガル帝国の州長官サアーダト・ハーンが自立して開いた国。名目上はムガル皇帝に従い、歴代の太守は帝国の宰相も務めた（地図では宗主権の帯を付けない）。
    - from: 1765
      to: 1800
      text: ブクサールの戦い（1764）に敗れた後、東インド会社の同盟国となり、会社の軍隊を国内に置いて費用を払った（事実上の保護関係は始まっていたが、地図では領土の半分を譲った1801年から保護国として描く）。ラクナウはインド＝イスラーム文化の中心として栄えた。
    - from: 1801
      to: 1856
      text: 1801年の条約で領土の半分を会社に譲り、残りも会社の保護下に入った（地図ではイギリスの色を薄く塗る）。1856年に併合され、これがインド大反乱の一因となった。
  source: "https://ja.wikipedia.org/wiki/アワド太守"

- id: rohilla
  name: ロヒラ（ロヒルカンド）
  short: ロヒルカンド
  color: "#cfe0a8"
  kind: 首長国（アフガン系）
  rulers:
    - {name: アリー・ムハンマド・ハーン, title: ロヒラの首長, from: 1721, to: 1748, source: "https://en.wikipedia.org/wiki/Ali_Mohammed_Khan"}
    - {name: ハーフィズ・ラフマト・ハーン, title: ロヒルカンドの摂政, from: 1748, to: 1774, note: 1774年、アワドと東インド会社の軍とのミーラーンプル・カトラの戦いで戦死した。, source: "https://en.wikipedia.org/wiki/Hafiz_Rahmat_Khan_Barech"}
  note: アフガン系のロヒラ族がガンジス川上流の東側（ロヒルカンド）に建てた国。1774年のロヒラ戦争でアワドに併合された。ラームプルだけはロヒラの太守国として残った（のち藩王国）。
  source: "https://en.wikipedia.org/wiki/Rohilkhand"

# ---------------------------------------------------------------- ラージプーターナー
- id: rajput_mewar
  name: メーワール王国（ウダイプル）
  short: メーワール
  color: "#f0b090"
  kind: 王国（ラーナー）
  rulers:
  periods:
    - from: 1453
      to: 1527
      text: "シソーディア家のメーワールはラージプート諸国の盟主として、マールワー・グジャラートのスルタンやデリーのローディー朝と戦った。ラーナー・サーンガーの時代に最も強くなったが、1527年のハーヌアの戦いでバーブルに敗れた。"
    - from: 1528
      to: 1614
      text: "アクバルにチットールを奪われ（1568）、新しい都ウダイプルに移った。ラーナー・プラタープはハルディーガーティーの戦い（1576）に敗れた後も山地で抵抗を続け、ほかのラージプートの王家と違ってムガル帝国に従わなかった。"
    - from: 1615
      to: 1647
      text: "1615年にアマル・シング1世がジャハーンギールと和を結び、ムガル帝国に臣従した（地図ではムガル帝国の色を薄く塗る）。"
    - {name: "ラーナー・クンバ", title: "メーワールのラーナー", from: 1433, to: 1468, note: "マールワー・グジャラートのスルタンと戦い、チットールに戦勝の塔（ヴィジャイ・スタンブ）を建てた。", source: "https://en.wikipedia.org/wiki/Rana_Kumbha"}
    - {name: "ウダイ・シング1世", title: "メーワールのラーナー", from: 1468, to: 1473, source: "https://en.wikipedia.org/wiki/Udai_Singh_I"}
