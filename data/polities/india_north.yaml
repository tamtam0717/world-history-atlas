  short: シンド
  color: "#b8cfe8"
  kind: 太守国
  rulers:
    - {name: ヤール・ムハンマド・カルホーラ, title: シンドの支配者（ムガルの太守）, from: 1701, to: 1719, source: "https://en.wikipedia.org/wiki/Kalhora_dynasty"}
    - {name: ヌール・ムハンマド・カルホーラ, title: シンドの支配者, from: 1719, to: 1755, note: 1737年にムガル帝国からタッター（下シンド）も任された。1739年にナーディル・シャー、1747年からドゥッラーニー朝に服属した。, source: "https://en.wikipedia.org/wiki/Noor_Mohammad_Kalhoro"}
    - {name: グラーム・シャー・カルホーラ, title: シンドの支配者, from: 1757, to: 1772, note: ハイダラーバードの町を建てた（1768）。1755–57年は兄弟が争った。, source: "https://en.wikipedia.org/wiki/Ghulam_Shah_Kalhoro"}
    - {name: サルファラーズ・ハーンほか, title: シンドの支配者, from: 1772, to: 1783, note: カルホーラ家の内紛が続き、1783年のハーラーニーの戦いでタールプル家に倒された。, source: "https://en.wikipedia.org/wiki/Kalhora_dynasty"}
    - {name: ミール・ファテ・アリー・ハーン・タールプル, title: ミール（ハイダラーバード）, from: 1783, to: 1801, note: 兄弟と共同で治めた（「4人の友」）。ハイルプル・ミールプルにも一族のミールがいた。, source: "https://en.wikipedia.org/wiki/Talpur_dynasty"}
    - {name: ミール・グラーム・アリー・ハーン, title: ミール, from: 1801, to: 1811, source: "https://en.wikipedia.org/wiki/Talpur_dynasty"}
    - {name: ミール・カラム・アリー・ハーン, title: ミール, from: 1811, to: 1828, source: "https://en.wikipedia.org/wiki/Talpur_dynasty"}
    - {name: ミール・ムラード・アリー・ハーン, title: ミール, from: 1828, to: 1833, source: "https://en.wikipedia.org/wiki/Talpur_dynasty"}
    - {name: ミール・ヌール・ムハンマド・ハーン, title: ミール, from: 1833, to: 1840, source: "https://en.wikipedia.org/wiki/Talpur_dynasty"}
    - {name: ミール・ナスィール・ハーン, title: ミール, from: 1840, to: 1843, note: 1843年のミアーニーの戦いでネーピアの軍に敗れた。, source: "https://en.wikipedia.org/wiki/Talpur_dynasty"}
