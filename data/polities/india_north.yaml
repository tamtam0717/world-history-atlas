      to: 1647
      text: "チベット仏教の王国。15世紀後半にナムギャル朝が始まり、センゲ・ナムギャル（1616–42）のときに西チベットのグゲ王国を併合して最も広がった。カシミール・バルティスターンのムスリムの軍としばしば戦った。"
    - from: 1648
      to: 1683
      text: チベット仏教の王国。1679–84年のチベット・ラダック・ムガル戦争でチベット（ダライ・ラマ政権）に攻められ、ムガル帝国の援軍を得た。1684年のティンモスガン条約でチベットとの境を定め、以後チベットに定期的に使節を送った。
    - from: 1684
      to: 1833
      text: ムガル帝国に名目上従い、チベットとの交易（パシュミナの羊毛など）で栄えた。1834年からジャンムーのグラーブ・シングの部将ゾーラーワル・シングに攻められ、シク王国・ジャンムーの支配下に入った。
  source: "https://en.wikipedia.org/wiki/Namgyal_dynasty_of_Ladakh"

