  short: バハーワルプル
  color: "#e0c0dc"
  kind: 太守国（ナワーブ）
  rulers:
    - {name: バハーワル・ハーン2世, title: ナワーブ, from: 1772, to: 1809, note: 要確認, source: "https://en.wikipedia.org/wiki/Bahawalpur_(princely_state)"}
    - {name: サーディク・ムハンマド・ハーン2世, title: ナワーブ, from: 1809, to: 1826, note: 要確認, source: "https://en.wikipedia.org/wiki/Bahawalpur_(princely_state)"}
    - {name: バハーワル・ハーン3世, title: ナワーブ, from: 1826, to: 1852, note: 1833・1838年にイギリスと条約を結んだ。, source: "https://en.wikipedia.org/wiki/Bahawalpur_(princely_state)"}
  note: シンド出身のダーウードプトラ族のアッバース家が、18世紀半ばにサトレジ川の南に建てた国。ドゥッラーニー朝に名目上従った。1838年からイギリスの保護下（藩王国）、1947年にパキスタンに加わり、1955年に西パキスタン州に統合された。
  source: "https://en.wikipedia.org/wiki/Bahawalpur_(princely_state)"

