    - from: 1783
      to: 1843
      text: バローチ系のタールプル家がカルホーラ家を倒し、ハイダラーバード・ハイルプル・ミールプルのミールたちが分けて治めた。インダス川の航行を求めるイギリスと条約を結んだが（1832・1839）、1843年にネーピアの軍に敗れてイギリスに併合された（ハイルプルだけが藩王国として残った）。
