    - {name: "マヒパト・シャー", title: "ガルワール王", from: 1622, to: 1631, note: "在位年は要確認", source: "https://en.wikipedia.org/wiki/Garhwal_Kingdom"}
    - {name: "プリトヴィー・パト・シャー", title: "ガルワール王", from: 1640, to: 1664, note: "1640年まで母ラーニー・カルナーヴァティーが摂政としてムガル軍を退けた。在位年は要確認", source: "https://en.wikipedia.org/wiki/Garhwal_Kingdom"}
    - {name: プラディープ・シャー, title: ガルワール王, from: 1717, to: 1772, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Garhwal_Kingdom"}
    - {name: プラデュムナ・シャー, title: ガルワール王, from: 1785, to: 1804, note: 1804年、ゴルカ軍とのデヘラードゥーン近くの戦いで戦死した。, source: "https://en.wikipedia.org/wiki/Pradyumna_Shah"}
