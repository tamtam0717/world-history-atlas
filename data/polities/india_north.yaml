      to: 1563
      text: "ラートール家のラーオ・ジョーダーがジョードプルを開き（1459）、マールデーオの時代に西ラージャスターンの大国となった。1544年にシェール・シャーに敗れたが、すぐに取り戻した。"
    - from: 1564
      to: 1647
      text: "アクバルの軍がジョードプルを取り（1564）、1583年にウダイ・シングが臣従してからはムガル帝国の重臣の家となった（地図ではムガル帝国の色を薄く塗る）。"
    - {name: "ラーオ・ジョーダー", title: "マールワールの王", from: 1438, to: 1489, note: "1459年にジョードプルの町と城（メヘラーンガル）を築いた。", source: "https://en.wikipedia.org/wiki/Rao_Jodha"}
    - {name: "ラーオ・サータル", title: "マールワールの王", from: 1489, to: 1492, source: "https://en.wikipedia.org/wiki/Rao_Satal"}
    - {name: "ラーオ・スージャー", title: "マールワールの王", from: 1492, to: 1515, source: "https://en.wikipedia.org/wiki/Rao_Suja"}
    - {name: "ラーオ・ガーンガー", title: "マールワールの王", from: 1515, to: 1532, source: "https://en.wikipedia.org/wiki/Rao_Ganga"}
