    - {name: フサイン・ランガー1世, title: スルタン, from: 1469, to: 1498, note: バローチ人の首長たちに土地を与え、インダス川の西に移り住ませた。在位年は要確認, source: "https://en.wikipedia.org/wiki/Husayn_Langah_I"}
    - {name: マフムード・ランガー, title: スルタン, from: 1502, to: 1524, note: 在位年は要確認, source: "https://en.wikipedia.org/wiki/Langah_Sultanate"}
    - {name: フサイン・ランガー2世, title: スルタン, from: 1524, to: 1528, note: シンドのアルグン家に攻められ、王朝は滅んだ。在位年は要確認, source: "https://en.wikipedia.org/wiki/Langah_Sultanate"}
  periods:
    - from: 1453
