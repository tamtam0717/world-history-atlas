    - {name: "ルドラ・プラタープ", title: "オールチャーの王", from: 1501, to: 1531, note: "1531年にオールチャーを都とした。", source: "https://en.wikipedia.org/wiki/Rudra_Pratap_Singh"}
    - {name: "マドゥカル・シャー", title: "オールチャーの王", from: 1554, to: 1592, source: "https://en.wikipedia.org/wiki/Madhukar_Shah"}
    - {name: "ヴィール・シング・デーオ", title: "オールチャーの王", from: 1605, to: 1627, note: "ジャハーンギールの命でアクバルの重臣アブル・ファズルを殺し（1602）、ジャハーンギールの即位後に重んじられた。", source: "https://en.wikipedia.org/wiki/Vir_Singh_Deo"}
    - {name: "ジュジャール・シング", title: "オールチャーの王", from: 1627, to: 1635, note: "シャー・ジャハーンに反乱して敗死した。", source: "https://en.wikipedia.org/wiki/Jhujhar_Singh"}
    - {name: チャトラサール, title: パンナーの王, from: 1675, to: 1731, note: ムガル帝国に反乱してブンデールカンドに王国を開いた。1729年にムガル軍に攻められ、マラーターのバージーラーオ1世に助けられて、領土の3分の1を与えた。, source: "https://en.wikipedia.org/wiki/Chhatrasal"}
  note: オルチャー、パンナー、ダティアー、チャルカーリーなどブンデーラ家のラージプートの王国をまとめて描く。1803–1812年にイギリスの保護下に入った。
  source: "https://en.wikipedia.org/wiki/Bundelkhand"

- id: rewa
  name: レーワー（バゲールカンド）
  short: レーワー
  color: "#c6c0e6"
  kind: 王国
  rulers:
    - {name: "ラームチャンドラ", title: "バーンダヴガルの王", from: 1555, to: 1592, note: "音楽家ターンセーンを庇護し、アクバルの宮廷に送った。", source: "https://en.wikipedia.org/wiki/Ramchandra_Singh_of_Rewa"}
  note: バゲール家のラージプートの王国（バゲールカンド）。ムガル帝国に貢納した。1812年にイギリスの保護下に入った。
  source: "https://en.wikipedia.org/wiki/Rewa_State"

- id: gondwana
  name: ゴンド諸王国（ゴンドワナ）
  short: ゴンド諸王国
  color: "#c9d9a0"
  kind: 王国の集まり
  rulers:
  periods:
    - from: 1500
      to: 1564
      text: "ゴンド人のガルハ＝マンドラー王国が中央インドの森林に広がり、サングラーム・シャーは52の城を従えた。1564年にムガル軍に敗れ、以後は臣従する王国となった。"
    - {name: "サングラーム・シャー", title: "ガルハ＝マンドラー王", from: 1500, to: 1541, note: "在位年は要確認", source: "https://en.wikipedia.org/wiki/Sangram_Shah"}
    - {name: "ラーニー・ドゥルガーワティー", title: "ガルハ＝マンドラーの摂政", from: 1550, to: 1564, note: "子ヴィール・ナーラーヤンの摂政。1564年にアクバルの将軍アーサフ・ハーンと戦って死んだ。", source: "https://en.wikipedia.org/wiki/Rani_Durgavati"}
  note: 中央インドの森林地帯の先住民ゴンド人の王国（ガルハ＝マンドラー、デーオガル、ケールラなど）。ムガル帝国に貢納した。18世紀にマラーター（ナーグプルのボーンスレー家、サーガルのペーシュワーの代官）に併合された。
  source: "https://en.wikipedia.org/wiki/Gondwana_(India)"

