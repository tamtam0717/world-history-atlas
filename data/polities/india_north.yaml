  note: ジャンムー、チャンバ、カーングラ、マンディー、クッルー、ビラースプル、シルモール、ブシャハルなど、西ヒマラヤの山あいのラージプート系の小王国。ムガル帝国に貢納した。19世紀はじめにゴルカ（ネパール）・シク王国の侵入を受け、1815–46年にイギリスの保護下に入った。細密画（パハーリー派）で知られる。
