  short: カッチ
  color: "#e2b8a8"
  kind: 王国（ラーオ）
  rulers:
    - {name: "ラーオ・ケーンガールジー1世", title: "カッチのラーオ", from: 1548, to: 1585, note: "カッチを統一し、ブジを都とした。グジャラート・スルタン朝・ムガル帝国と友好を保った。", source: "https://en.wikipedia.org/wiki/Khengarji_I"}
  note: ジャーデージャー家の王国。ムガル帝国に貢納したが、ほぼ自立していた。1815–19年にイギリスの保護下に入った。
