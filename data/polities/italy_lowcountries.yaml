    - {name: ジャン＝ルイ＝シャルル・ドルレアン＝ロングヴィル, title: ヌーシャテル公, from: 1663, to: 1694, note: 精神の病のため、母や弟（シャルル＝パリ）が実際の統治を代行した。要確認, source: "https://en.wikipedia.org/wiki/Jean_Louis_Charles_d'Orléans,_Duke_of_Longueville"}
