    - from: 1814
      to: 1815
      text: エステ家の血を引くハプスブルク家のフランチェスコ4世が公位につき、オーストリアの強い影響下に置かれた。
    - from: 1816
      to: 1859
      text: オーストリアの保護下の保守的な公国。1831年にメノッティらの蜂起（カルボナリ）が起こったがオーストリア軍に鎮圧された。1829年にマッサ・カッラーラ、1847年にグアスタッラとルニジャーナの一部を得た。1859年のイタリア統一戦争で公は亡命し、1860年にサルデーニャ王国に併合された。
