    - {name: ジャン＝ルイ・デルデラン, title: リエージュ司教, from: 1688, to: 1694, source: "https://en.wikipedia.org/wiki/Jean-Louis_d'Elderen"}
    - {name: ヨーゼフ・クレメンス・フォン・バイエルン, title: リエージュ司教（ケルン大司教を兼ねる）, from: 1694, to: 1723, source: "https://en.wikipedia.org/wiki/Joseph_Clemens_of_Bavaria"}
    - {name: ジョルジュ＝ルイ・ド・ベルグ, title: リエージュ司教, from: 1724, to: 1743, source: "https://en.wikipedia.org/wiki/Georges-Louis_de_Berghes"}
    - {name: ヨハン・テオドール・フォン・バイエルン, title: リエージュ司教, from: 1744, to: 1763, source: "https://en.wikipedia.org/wiki/John_Theodore_of_Bavaria"}
    - {name: シャルル＝ニコラ・ドゥルトルモン, title: リエージュ司教, from: 1763, to: 1771, source: "https://en.wikipedia.org/wiki/Charles-Nicolas_d'Oultremont"}
    - {name: フランソワ＝シャルル・ド・ヴェルブリュック, title: リエージュ司教, from: 1772, to: 1784, source: "https://en.wikipedia.org/wiki/François-Charles_de_Velbrück"}
    - {name: セザール＝コンスタンタン・ド・オンスブルック, title: リエージュ司教, from: 1784, to: 1792, source: "https://en.wikipedia.org/wiki/César-Constantin-François_de_Hoensbroeck"}
    - {name: フランソワ＝アントワーヌ・ド・メアン, title: リエージュ司教, from: 1792, to: 1795, source: "https://en.wikipedia.org/wiki/François-Antoine-Marie_de_Méan"}
  periods:
    - from: 1648
      to: 1788
      text: 神聖ローマ帝国（ヴェストファーレン・クライス）の聖界諸侯領。マース（ムーズ）川に沿って南北に細長く伸び、スペイン領（のちオーストリア領）ネーデルラントを東西に分けていた。石炭・製鉄などの工業が早くから発達した。
    - from: 1789
      to: 1795
      text: フランス革命の影響でリエージュ革命が起こり、司教が追われる（1791年にオーストリア軍が復位させる）。1795年にフランスに併合された。
  source:
    - "https://ja.wikipedia.org/wiki/リエージュ司教領"
    - "https://en.wikipedia.org/wiki/Prince-Bishopric_of_Liège"

