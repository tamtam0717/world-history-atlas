    - {name: フランツ・ヨーゼフ1世, title: リヒテンシュタイン侯, from: 1772, to: 1781, source: "https://en.wikipedia.org/wiki/Franz_Joseph_I,_Prince_of_Liechtenstein"}
    - {name: アロイス1世, title: リヒテンシュタイン侯, from: 1781, to: 1805, source: "https://en.wikipedia.org/wiki/Aloys_I,_Prince_of_Liechtenstein"}
    - {name: ヨハン1世ヨーゼフ, title: リヒテンシュタイン侯, from: 1805, to: 1836, source: "https://en.wikipedia.org/wiki/Johann_I_Joseph,_Prince_of_Liechtenstein"}
