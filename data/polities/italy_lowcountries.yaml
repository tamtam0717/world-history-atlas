  kind: 大公国
  rulers:
    - {name: フェルディナンド2世・デ・メディチ, title: トスカーナ大公, from: 1621, to: 1670, source: "https://ja.wikipedia.org/wiki/フェルディナンド2世・デ・メディチ"}
    - {name: コジモ3世・デ・メディチ, title: トスカーナ大公, from: 1670, to: 1723, source: "https://ja.wikipedia.org/wiki/コジモ3世・デ・メディチ"}
    - {name: ジャン・ガストーネ・デ・メディチ, title: トスカーナ大公（メディチ家最後の大公）, from: 1723, to: 1737, source: "https://ja.wikipedia.org/wiki/ジャン・ガストーネ・デ・メディチ"}
    - {name: フランチェスコ2世（フランツ・シュテファン）, title: トスカーナ大公（1745年から神聖ローマ皇帝フランツ1世）, from: 1737, to: 1765, note: マリア・テレジアの夫。元ロレーヌ公。, source: "https://ja.wikipedia.org/wiki/フランツ1世_(神聖ローマ皇帝)"}
    - {name: ピエトロ・レオポルド, title: トスカーナ大公（のちの皇帝レオポルト2世）, from: 1765, to: 1790, source: "https://ja.wikipedia.org/wiki/レオポルト2世_(神聖ローマ皇帝)"}
    - {name: フェルディナンド3世, title: トスカーナ大公, from: 1790, to: 1801, note: 1799年にフランス軍に追われ、リュネヴィル条約で正式に退位。1803年にザルツブルク選帝侯、1806年にヴュルツブルク大公。, source: "https://ja.wikipedia.org/wiki/フェルディナンド3世_(トスカーナ大公)"}
    - {name: フェルディナンド3世, title: トスカーナ大公（復位）, from: 1814, to: 1824}
  periods:
    - from: 1648
      to: 1736
      text: メディチ家のトスカーナ大公国。首都フィレンツェ。自由港リヴォルノが地中海貿易で栄えたが、国全体としては停滞した。
    - from: 1737
      to: 1764
      text: メディチ家が断絶し、ポーランド継承戦争の講和にもとづき、ロレーヌ公フランツ・シュテファン（マリア・テレジアの夫）が大公となる（ハプスブルク＝ロートリンゲン家）。
    - from: 1765
      to: 1790
      text: 大公レオポルドが啓蒙改革を進め、1786年には世界で初めて死刑と拷問を廃止した。
    - from: 1791
      to: 1813
      text: ナポレオンの時代、エトルリア王国（1801–1807）を経てフランスに併合された（1809年からナポレオンの妹エリザが大公妃として治めた）。
    - from: 1814
      to: 1815
      text: フェルディナンド3世が復位した。
  source:
    - "https://ja.wikipedia.org/wiki/トスカーナ大公国"

- id: papal_states
