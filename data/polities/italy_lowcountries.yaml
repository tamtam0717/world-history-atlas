    - from: 1746
      to: 1768
      text: オーストリア継承戦争でオーストリア軍に占領されるが、市民の蜂起で追い出した（1746年）。コルシカ島の反乱（パオリら）を抑えきれず、1768年に島をフランスに譲った。
    - from: 1769
      to: 1796
      text: コルシカを失った後は、中立を保ちながら港と金融で細々と存続する小国となった。フランス革命戦争でも中立を守ろうとしたが、イギリスとフランスの双方から圧力を受けた。
    - from: 1797
      to: 1815
      text: 1797年、ナポレオンの介入でリグリア共和国に変わり、1805年にフランスに併合された。1814年に共和国の復活を宣言したが、ウィーン会議でサルデーニャ王国に併合された。
  note: ドージェの一覧は2年任期で人数が多く、名前・在位年は記憶にもとづく。要確認（it.wikipedia「Dogi della Repubblica di Genova」と照合すること）。
