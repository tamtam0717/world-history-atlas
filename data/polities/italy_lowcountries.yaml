# ================================================================ 低地諸国

- id: netherlands
  name: オランダ
  names:
    - {to: 1794, name: ネーデルラント連邦共和国（オランダ）}
    - {from: 1795, to: 1805, name: バタヴィア共和国}
    - {from: 1806, to: 1809, name: ホラント王国}
    - {from: 1810, to: 1812, name: オランダ（フランス帝国に併合）}
    - {from: 1813, to: 1814, name: ネーデルラント主権公国}
    - {from: 1815, name: ネーデルラント連合王国}
  short: オランダ
  color: "#f2a65a"
  kind: 共和国
  rulers:
    - name: ウィレム2世
