  source:
    - "https://ja.wikipedia.org/wiki/サンマリノ"

# ================================================================ 南イタリア・島々

- id: naples
  name: ナポリ王国
  short: ナポリ
  color: "#9fc4d0"
  kind: 王国（シチリア王国と同君連合）
  rulers:
    - {name: フェリペ4世, title: ナポリ王・シチリア王（スペイン王）, from: 1621, to: 1665}
    - {name: カルロス2世, title: ナポリ王・シチリア王（スペイン王）, from: 1665, to: 1700}
    - {name: フェリペ5世, title: ナポリ王（1707年まで）・シチリア王（1713年まで）（スペイン王）, from: 1700, to: 1713}
    - {name: カール6世, title: ナポリ王（1707–1734）・シチリア王（1720–1734）（神聖ローマ皇帝）, from: 1707, to: 1734}
    - name: カルロ（カルロス）
      title: ナポリ王・シチリア王
      from: 1734
      to: 1759
      note: スペイン王フェリペ5世とエリザベッタ・ファルネーゼの子。1759年にスペイン王カルロス3世となって去った。
      source: "https://ja.wikipedia.org/wiki/カルロス3世_(スペイン王)"
    - name: フェルディナンド4世
      title: ナポリ王・シチリア王（1816年から両シチリア王フェルディナンド1世）
      from: 1759
      to: 1825
      note: 1806年から1815年まではシチリア島だけを治めた。王妃マリア・カロリーナ（マリア・テレジアの娘）が実権を握った。
      source: "https://ja.wikipedia.org/wiki/フェルディナンド1世_(両シチリア王)"
  periods:
    - from: 1648
      to: 1706
      text: スペイン王が副王を通じて治める。1647–1648年にはマザニエッロの反乱が起こった。
    - from: 1707
      to: 1734
      text: スペイン継承戦争でオーストリアがナポリを占領し、ラシュタット条約でオーストリア領となる（シチリアは1720年から）。
    - from: 1735
      to: 1798
      text: スペイン・ブルボン家のカルロがナポリとシチリアを征服し、独立した王国となる（ナポリ・ブルボン家）。ポンペイの発掘やカゼルタ宮殿の建設が行われた。
    - from: 1799
      to: 1805
      text: 1799年にフランス軍がナポリに入り、パルテノペア共和国が建てられたが、半年で王党派の農民軍に倒された。
    - from: 1806
      to: 1815
      text: ナポレオンに本土を奪われ、国王はシチリア島に逃れてイギリス海軍に守られた。1815年に本土を回復し、翌年両シチリア王国となる。
  source:
    - "https://ja.wikipedia.org/wiki/ナポリ王国"
    - "https://ja.wikipedia.org/wiki/シチリア王国"

