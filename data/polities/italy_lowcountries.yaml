    - {name: フリードリヒ・ヴィルヘルム1世, title: ヌーシャテル公（プロイセン王）, from: 1713, to: 1740, source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム1世_(プロイセン王)"}
    - {name: フリードリヒ2世（大王）, title: ヌーシャテル公（プロイセン王）, from: 1740, to: 1786, source: "https://ja.wikipedia.org/wiki/フリードリヒ2世_(プロイセン王)"}
    - {name: フリードリヒ・ヴィルヘルム2世, title: ヌーシャテル公（プロイセン王）, from: 1786, to: 1797, source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム2世_(プロイセン王)"}
    - {name: フリードリヒ・ヴィルヘルム3世, title: ヌーシャテル公（プロイセン王）, from: 1797, to: 1806, source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム3世_(プロイセン王)"}
    - {name: ベルティエ, title: ヌーシャテル公（ナポレオンの元帥）, from: 1806, to: 1814, source: "https://en.wikipedia.org/wiki/Louis-Alexandre_Berthier"}
    - {name: フリードリヒ・ヴィルヘルム3世, title: ヌーシャテル公（プロイセン王）, from: 1814, to: 1840, source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム3世_(プロイセン王)"}
    - {name: フリードリヒ・ヴィルヘルム4世, title: ヌーシャテル公（プロイセン王）, from: 1840, to: 1848, note: 1848年の革命で共和国が宣言され、実際の支配を失った。1857年のパリ条約で権利を正式に放棄した。, source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム4世_(プロイセン王)"}
  periods:
    - from: 1648
      to: 1706
      text: フランスの貴族ロングヴィル家が治める公国。スイス盟約者団の同盟邦。
    - from: 1707
      to: 1805
      text: ロングヴィル家の断絶後、住民の代表がプロテスタントのプロイセン王を君主に選んだ。プロイセン王の飛び地の領地となる。
    - from: 1806
      to: 1815
      text: 1806年にプロイセンがナポレオンに譲り、元帥ベルティエの公国となる。1814年にプロイセン王のもとに戻り、1815年にスイスの州となった（プロイセン王の公国でもある状態が1857年まで続く）。
    - from: 1816
      to: 1857
      text: スイスの州でありながらプロイセン王の公国でもあった。1848年3月の革命で共和国が宣言され、王党派の反乱（1856年）をめぐってプロイセンとスイスが戦争寸前になった（ヌーシャテル事件）。1857年のパリ条約でプロイセン王が権利を放棄した。
  source:
    - "https://en.wikipedia.org/wiki/Principality_of_Neuchâtel"

