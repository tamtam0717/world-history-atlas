  periods:
    - from: 1648
      to: 1683
      text: 北イタリアの本土領（テッラフェルマ：パドヴァ・ヴェローナ・ベルガモ・ブレシアなど）と、ダルマチア・イオニア諸島などの海外領をもつ貴族共和国。オスマン帝国とクレタ島をめぐって戦い（1645–1669）、島を失った。
    - from: 1684
      to: 1718
      text: 神聖同盟に加わってペロポネソス半島を征服（カルロヴィッツ条約で確認）するが、1715年からの戦争で奪い返された。
    - from: 1718
      to: 1796
      text: 中立を守って平和が続き、カーニヴァルや芸術（ヴィヴァルディ、カナレット、ゴルドーニ）で知られる観光と文化の都となるが、政治・経済の力は衰えた。
    - from: 1797
      to: 1797
      text: ナポレオン軍の圧力で大評議会が解散し（5月）、千年以上続いた共和国は消滅。カンポ・フォルミオ条約で本土の東部とヴェネツィア市はオーストリア領になった。
