  color: "#b9c8e3"
  kind: 共和国（フランスの衛星国）
  periods:
    - from: 1797
      to: 1805
      text: ナポレオンの介入でジェノヴァ共和国が民主政に改められてできた共和国。1805年にフランス帝国に併合された。
  source:
    - "https://ja.wikipedia.org/wiki/リグリア共和国"

- id: roman_republic
  name: ローマ共和国
  short: ローマ共和国
  color: "#dcc3a2"
  kind: 共和国（フランスの衛星国）
  periods:
    - from: 1798
      to: 1799
      text: フランス軍がローマを占領して教皇領を廃止し、古代ローマにならった共和国をつくった。1799年にナポリ軍とオーストリア軍に倒された。
  source:
    - "https://en.wikipedia.org/wiki/Roman_Republic_(1798–1799)"

- id: etruria
  name: エトルリア王国
  short: エトルリア
  color: "#d1e2a8"
  kind: 王国（フランスの衛星国）
  rulers:
    - {name: ルドヴィーコ1世, title: エトルリア王（ブルボン＝パルマ家）, from: 1801, to: 1803}
    - {name: カルロ・ルドヴィーコ, title: エトルリア王, from: 1803, to: 1807, note: 幼少のため母マリア・ルイーザ（スペイン王カルロス4世の娘）が摂政。}
  periods:
    - from: 1801
      to: 1807
      text: ナポレオンがスペインとの取引（アランフエス条約・リュネヴィル条約）で、トスカーナ大公国をパルマ公の子に与えてつくった王国。1807年末にフランスに併合された。
