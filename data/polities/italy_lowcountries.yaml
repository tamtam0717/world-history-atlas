    - from: 1861
      to: 1870
      text: 1861年3月、トリノで最初のイタリア議会が開かれ、イタリア王国が成立した（首都はトリノ、1865年からフィレンツェ）。まだヴェネツィアとローマを欠き、「未回収」だった。1866年にプロイセンと結んでオーストリアと戦い（普墺戦争）、ヴェネトを得た。1870年、普仏戦争でフランス軍が引き上げたすきにローマを占領し、翌年首都とした。
    - from: 1871
      to: 1895
      text: 統一後も、豊かな北部と貧しい南部の格差（南部問題）、山賊の反乱、教皇との対立（ローマ問題）が続いた。1882年にドイツ・オーストリアと三国同盟を結び、紅海沿岸のエリトリア・ソマリアに植民地を得た。南部やヴェネトから南北アメリカへの移民が急増した。
    - from: 1896
      to: 1914
      text: 1896年にエチオピアのアドワの戦いで大敗した。20世紀初めの首相ジョリッティのもとで北部の工業化と選挙権の拡大（1912年に男子普通選挙に近い法）が進んだ。1911–12年のイタリア＝トルコ戦争でリビアとドデカネス諸島を得た。オーストリアに残るトレンティーノ・トリエステの回復を求める「未回収のイタリア」の運動が続き、1914年の第一次世界大戦では三国同盟から離れて中立を宣言した。
  source:
    - "https://ja.wikipedia.org/wiki/イタリア王国"
    - "https://ja.wikipedia.org/wiki/イタリア統一運動"

