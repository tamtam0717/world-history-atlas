    - {name: カルロス2世, title: ナポリ王・シチリア王（スペイン王）, from: 1665, to: 1700, source: "https://ja.wikipedia.org/wiki/カルロス2世_(スペイン王)"}
    - {name: フェリペ5世, title: ナポリ王（1707年まで）・シチリア王（1713年まで）（スペイン王）, from: 1700, to: 1713, source: "https://ja.wikipedia.org/wiki/フェリペ5世_(スペイン王)"}
    - {name: カール6世, title: ナポリ王（1707–1734）・シチリア王（1720–1734）（神聖ローマ皇帝）, from: 1707, to: 1734, source: "https://ja.wikipedia.org/wiki/カール6世_(神聖ローマ皇帝)"}
    - name: カルロ（カルロス）
      title: ナポリ王・シチリア王
      from: 1734
      to: 1759
      note: スペイン王フェリペ5世とエリザベッタ・ファルネーゼの子。1759年にスペイン王カルロス3世となって去った。
      source: "https://ja.wikipedia.org/wiki/カルロス3世_(スペイン王)"
    - name: フェルディナンド4世
      title: ナポリ王・シチリア王（1816年から両シチリア王フェルディナンド1世）
      from: 1759
      to: 1825
      note: 1806年から1815年まではシチリア島だけを治めた。王妃マリア・カロリーナ（マリア・テレジアの娘）が実権を握った。1820年の革命で憲法を認めたが、オーストリア軍の介入で撤回した。
      source: "https://ja.wikipedia.org/wiki/フェルディナンド1世_(両シチリア王)"
    - {name: フランチェスコ1世, title: 両シチリア王, from: 1825, to: 1830, source: "https://en.wikipedia.org/wiki/Francis_I_of_the_Two_Sicilies"}
    - {name: フェルディナンド2世, title: 両シチリア王, from: 1830, to: 1859, note: 1848年の革命の鎮圧でメッシーナを砲撃し、「砲弾王（レ・ボンバ）」とあだ名された。, source: "https://en.wikipedia.org/wiki/Ferdinand_II_of_the_Two_Sicilies"}
    - {name: フランチェスコ2世, title: 両シチリア王, from: 1859, to: 1861, note: 1860年にガリバルディにナポリを追われ、ガエータ要塞で抵抗したが1861年2月に降伏した。, source: "https://en.wikipedia.org/wiki/Francis_II_of_the_Two_Sicilies"}
  periods:
    - from: 1648
      to: 1706
      text: スペイン王が副王を通じて治める。1647–1648年にはマザニエッロの反乱が起こった。
    - from: 1707
      to: 1734
      text: スペイン継承戦争でオーストリアがナポリを占領し、ラシュタット条約でオーストリア領となる（シチリアは1720年から）。
    - from: 1735
      to: 1798
      text: スペイン・ブルボン家のカルロがナポリとシチリアを征服し、独立した王国となる（ナポリ・ブルボン家）。ポンペイの発掘やカゼルタ宮殿の建設が行われた。
    - from: 1799
      to: 1805
      text: 1799年にフランス軍がナポリに入り、パルテノペア共和国が建てられたが、半年で王党派の農民軍に倒された。
    - from: 1806
      to: 1815
      text: ナポレオンに本土を奪われ、国王はシチリア島に逃れてイギリス海軍に守られた。1815年に本土を回復し、翌年両シチリア王国となる。
    - from: 1816
      to: 1847
      text: ナポリとシチリアを一つにまとめた両シチリア王国（首都ナポリ）。1820年にカルボナリの革命が起きたが、オーストリア軍の介入（ライバッハ会議）で鎮圧された。シチリアではナポリ支配への反発が強かった。
    - from: 1848
      to: 1859
      text: 1848年1月のパレルモ蜂起がヨーロッパの1848年革命の先がけとなり、シチリアは1849年5月まで独立政府を保った。鎮圧後は専制が強まり、イギリスの政治家グラッドストンに「神の否定」と非難された。
    - from: 1860
      to: 1861
      text: 1860年5月、ガリバルディの千人隊（赤シャツ隊）がシチリアに上陸し、9月にナポリに入った。10月の住民投票でサルデーニャ王国への併合が決まり、1861年2月にガエータ要塞が降伏して王国は滅んだ。
  source:
    - "https://ja.wikipedia.org/wiki/ナポリ王国"
    - "https://ja.wikipedia.org/wiki/シチリア王国"
    - "https://ja.wikipedia.org/wiki/両シチリア王国"

- id: malta
  name: 聖ヨハネ騎士団（マルタ騎士団）
  short: マルタ騎士団
  color: "#e7ae9e"
  kind: 騎士修道会国家
  rulers:
    - {name: ジョヴァンニ・パオロ・ラスカリス, title: 騎士団総長, from: 1636, to: 1657, source: "https://en.wikipedia.org/wiki/Giovanni_Paolo_Lascaris"}
    - {name: マルティン・デ・レディン, title: 騎士団総長, from: 1657, to: 1660, source: "https://en.wikipedia.org/wiki/Martín_de_Redín"}
    - {name: アネ・ド・クレルモン＝ジェサン, title: 騎士団総長, from: 1660, to: 1660, source: "https://en.wikipedia.org/wiki/Annet_de_Clermont-Gessant"}
    - {name: ラファエル・コトネル, title: 騎士団総長, from: 1660, to: 1663, source: "https://en.wikipedia.org/wiki/Rafael_Cotoner"}
    - {name: ニコラス・コトネル, title: 騎士団総長, from: 1663, to: 1680, source: "https://en.wikipedia.org/wiki/Nicolás_Cotoner"}
    - {name: グレゴリオ・カラファ, title: 騎士団総長, from: 1680, to: 1690, source: "https://en.wikipedia.org/wiki/Gregorio_Carafa"}
    - {name: アドリアン・ド・ヴィニャクール, title: 騎士団総長, from: 1690, to: 1697, source: "https://en.wikipedia.org/wiki/Adrien_de_Wignacourt"}
    - {name: ラモン・ペレリョス, title: 騎士団総長, from: 1697, to: 1720, source: "https://en.wikipedia.org/wiki/Ramon_Perellos_y_Roccaful"}
    - {name: マルカントニオ・ゾンダダーリ, title: 騎士団総長, from: 1720, to: 1722, source: "https://en.wikipedia.org/wiki/Marc'Antonio_Zondadari"}
    - {name: アントニオ・マノエル・デ・ヴィリェーナ, title: 騎士団総長, from: 1722, to: 1736, source: "https://en.wikipedia.org/wiki/António_Manoel_de_Vilhena"}
    - {name: ラモン・デスプッチ, title: 騎士団総長, from: 1736, to: 1741, source: "https://en.wikipedia.org/wiki/Ramon_Despuig"}
    - {name: マヌエル・ピント・ダ・フォンセカ, title: 騎士団総長, from: 1741, to: 1773, source: "https://en.wikipedia.org/wiki/Manuel_Pinto_da_Fonseca"}
    - {name: フランシスコ・ヒメネス・デ・テハダ, title: 騎士団総長, from: 1773, to: 1775, source: "https://en.wikipedia.org/wiki/Francisco_Ximenes_de_Texada"}
    - {name: エマニュエル・ド・ロアン＝ポルデュック, title: 騎士団総長, from: 1775, to: 1797, source: "https://en.wikipedia.org/wiki/Emmanuel_de_Rohan-Polduc"}
    - {name: フェルディナント・フォン・ホンペッシュ, title: 騎士団総長, from: 1797, to: 1799, note: 1798年にナポレオンに島を明け渡した。, source: "https://en.wikipedia.org/wiki/Ferdinand_von_Hompesch_zu_Bolheim"}
  periods:
    - from: 1648
      to: 1797
      text: 1530年に神聖ローマ皇帝カール5世からマルタを与えられた聖ヨハネ騎士団が治める。オスマン帝国や北アフリカの海賊に対するキリスト教世界の前線基地。
    - from: 1798
      to: 1815
      text: エジプト遠征途中のナポレオンに占領され（1798年）、島民の反乱とイギリス軍の包囲で1800年にフランス軍が降伏。以後イギリスが支配し、1814年のパリ条約でイギリス領となった。
  note: 総長の在位年は記憶にもとづく。要確認。
  source:
    - "https://ja.wikipedia.org/wiki/マルタ騎士団"
    - "https://en.wikipedia.org/wiki/List_of_Grand_Masters_of_the_Knights_Hospitaller"

# ================================================================ ナポレオン期のイタリアの国々

- id: cispadane
  name: チスパダーナ共和国
  short: チスパダーナ
  color: "#bfe0c6"
  kind: 共和国（フランスの衛星国）
  periods:
    - from: 1796
      to: 1797
      text: ナポレオンの後押しで、モデナ・レッジョ・ボローニャ・フェラーラにつくられた共和国。緑・白・赤の三色旗を初めて国旗とした。1797年にチザルピーナ共和国に合流。
  source:
    - "https://ja.wikipedia.org/wiki/チスパダーナ共和国"

- id: cisalpine
  name: イタリア王国
  names:
    - {to: 1796, name: トランスパダーナ共和国, kind: 共和国（フランスの衛星国）}
    - {from: 1797, to: 1801, name: チザルピーナ共和国, kind: 共和国（フランスの衛星国）}
    - {from: 1802, to: 1804, name: イタリア共和国, kind: 共和国（フランスの衛星国）}
  color: "#a9d6b6"
  kind: 王国（フランスの衛星国）
  rulers:
    - name: ナポレオン・ボナパルト
      title: イタリア共和国大統領（1802–1805）→イタリア王（1805–1814）
      from: 1802
      to: 1814
      note: 共和国では副大統領メルツィ・デリル、王国では副王ウジェーヌ・ド・ボアルネ（ナポレオンの養子）が実際に統治した。
      source: "https://ja.wikipedia.org/wiki/イタリア王国_(1805年-1814年)"
  periods:
    - from: 1796
      to: 1801
      text: ナポレオンがロンバルディアを征服してつくったフランスの衛星国。1797年にチスパダーナ共和国などを合わせてチザルピーナ共和国となり、首都はミラノ。1799–1800年にはオーストリア・ロシア軍に一時奪われた。
    - from: 1802
      to: 1804
      text: イタリア共和国と改称し、ナポレオンが大統領となる。
    - from: 1805
      to: 1814
      text: ナポレオンがミラノでイタリア王として戴冠（1805年）。ヴェネツィア（1805年）、マルケ（1808年）、トレンティーノ（1810年）を加えて北東イタリアに広がった。ナポレオンの退位とともに消滅し、ロンバルディアとヴェネトはオーストリア領となった。
  source:
    - "https://ja.wikipedia.org/wiki/チザルピーナ共和国"
    - "https://ja.wikipedia.org/wiki/イタリア王国_(1805年-1814年)"

- id: ligurian_republic
  name: リグリア共和国
  short: リグリア
  color: "#b9c8e3"
  kind: 共和国（フランスの衛星国）
  periods:
    - from: 1797
      to: 1805
      text: ナポレオンの介入でジェノヴァ共和国が民主政に改められてできた共和国。1805年にフランス帝国に併合された。
  source:
    - "https://ja.wikipedia.org/wiki/リグリア共和国"

- id: roman_republic
  name: ローマ共和国
  short: ローマ共和国
  color: "#dcc3a2"
  kind: 共和国（フランスの衛星国）
  periods:
    - from: 1798
      to: 1799
      text: フランス軍がローマを占領して教皇領を廃止し、古代ローマにならった共和国をつくった。1799年にナポリ軍とオーストリア軍に倒された。
  source:
    - "https://en.wikipedia.org/wiki/Roman_Republic_(1798–1799)"

- id: etruria
  name: エトルリア王国
  short: エトルリア
  color: "#d1e2a8"
  kind: 王国（フランスの衛星国）
  rulers:
    - {name: ルドヴィーコ1世, title: エトルリア王（ブルボン＝パルマ家）, from: 1801, to: 1803, source: "https://en.wikipedia.org/wiki/Louis,_King_of_Etruria"}
    - {name: カルロ・ルドヴィーコ, title: エトルリア王, from: 1803, to: 1807, note: 幼少のため母マリア・ルイーザ（スペイン王カルロス4世の娘）が摂政。, source: "https://en.wikipedia.org/wiki/Charles_II,_Duke_of_Parma"}
  periods:
    - from: 1801
      to: 1807
      text: ナポレオンがスペインとの取引（アランフエス条約・リュネヴィル条約）で、トスカーナ大公国をパルマ公の子に与えてつくった王国。1807年末にフランスに併合された。
  source:
    - "https://ja.wikipedia.org/wiki/エトルリア王国"

- id: naples_bonaparte
  name: ナポリ王国（ナポレオン体制）
  short: ナポリ
  color: "#c9a6d6"
  kind: 王国（フランスの衛星国）
  rulers:
    - {name: ジョゼフ・ボナパルト（ジュゼッペ1世）, title: ナポリ王, from: 1806, to: 1808, note: ナポレオンの兄。1808年にスペイン王に移った。, source: "https://ja.wikipedia.org/wiki/ジョゼフ・ボナパルト"}
    - {name: ジョアシャン・ミュラ（ジョアッキーノ1世）, title: ナポリ王, from: 1808, to: 1815, note: ナポレオンの妹カロリーヌの夫で、騎兵の元帥。, source: "https://ja.wikipedia.org/wiki/ジョアシャン・ミュラ"}
  periods:
    - from: 1806
      to: 1815
      text: フランス軍がナポリ王国の本土を占領し、ナポレオンの兄ジョゼフ、ついで義弟ミュラを王とした。封建制の廃止などの改革が行われた。ミュラは1815年にイタリア統一を呼びかけてオーストリアと戦い、敗れて王位を失った。
  source:
    - "https://en.wikipedia.org/wiki/Kingdom_of_Naples_(Napoleonic)"

# ================================================================ 1848年革命のイタリアの国々

- id: san_marco_republic
  name: サン・マルコ共和国（ヴェネツィア共和国）
  short: サン・マルコ共和国
  color: "#e9b98b"
  kind: 共和国（1848年革命）
  rulers:
    - {name: ダニエーレ・マニン, title: 大統領, from: 1848, to: 1849, source: "https://en.wikipedia.org/wiki/Daniele_Manin"}
  periods:
    - from: 1848
      to: 1849
      text: 1848年3月、ヴェネツィアでマニンらがオーストリア軍を追い出して共和国を宣言した。オーストリア軍の包囲と砲撃、コレラに耐えたが、1849年8月に降伏した。
  source:
    - "https://en.wikipedia.org/wiki/Republic_of_San_Marco"

- id: sicily_1848
  name: シチリア王国（1848年革命）
  short: シチリア
  color: "#bcd8e2"
  kind: 王国（革命政府。国王は不在）
  rulers:
    - {name: ルッジェーロ・セッティモ, title: 臨時政府の首班（王国の摂政）, from: 1848, to: 1849, note: 議会はサルデーニャ王家のジェノヴァ公を国王に選んだが、ジェノヴァ公は受けなかった。, source: "https://en.wikipedia.org/wiki/Ruggero_Settimo"}
  periods:
    - from: 1848
      to: 1849
      text: 1848年1月12日のパレルモ蜂起でブルボン家の軍を追い出し、ナポリから独立した王国を宣言した。1848年9月にメッシーナが砲撃の末に奪い返され、1849年5月にパレルモが降伏して終わった。
  source:
    - "https://en.wikipedia.org/wiki/Sicilian_revolution_of_1848"
