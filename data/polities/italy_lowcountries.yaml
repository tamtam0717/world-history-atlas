      source: "https://ja.wikipedia.org/wiki/ウィレム1世_(オランダ王)"
    - name: ウィレム2世
      title: オランダ国王・ルクセンブルク大公
      from: 1840
      to: 1849
      note: ワーテルローの戦いで連合軍の部隊を率いた。1848年の革命の波を受けて、自由主義の憲法改正を認めた。
      source: "https://ja.wikipedia.org/wiki/ウィレム2世_(オランダ王)"
    - name: ウィレム3世
      title: オランダ国王・ルクセンブルク大公
      from: 1849
      to: 1890
      note: 男子の後継ぎがなく、死去でオランダとルクセンブルクの同君連合が終わった。
      source: "https://ja.wikipedia.org/wiki/ウィレム3世_(オランダ王)"
    - name: ウィルヘルミナ
      title: オランダ女王
      from: 1890
      to: 1948
      note: 1898年まで母エンマが摂政。
      source: "https://ja.wikipedia.org/wiki/ウィルヘルミナ_(オランダ女王)"
  periods:
    - from: 1648
      to: 1672
      text: ウェストファリア条約で独立が正式に承認される。アムステルダムを中心に世界の商業・金融の中心として繁栄する一方、イギリスと英蘭戦争を戦う。総督を置かず、ヤン・デ・ウィットが実権を握った（第1次無総督時代）。
    - from: 1672
      to: 1713
      text: フランスの侵入（「災厄の年」1672年）を機にオラニエ公ウィレム3世が総督となり、名誉革命後はイギリス王も兼ねて、ルイ14世に対抗する同盟の中心となる。
    - from: 1714
      to: 1786
      text: 南ネーデルラントに「防壁要塞」の守備権を得たが、戦費で財政が悪化し、商業の覇権はイギリスに移っていく。1747年にオラニエ家の世襲総督制が復活。
    - from: 1787
      to: 1794
      text: 総督派と愛国派の対立が激化。1787年、プロイセン軍が介入して総督ウィレム5世を支える。
    - from: 1795
      to: 1813
      text: フランス軍の侵入で総督が亡命し、フランスの衛星国バタヴィア共和国となる。1806年にナポレオンの弟ルイを王とするホラント王国、1810年にフランス帝国に併合された。
    - from: 1813
      to: 1815
      text: ナポレオンの敗退後に独立を回復し、ウィレム1世が帰国。ウィーン会議で旧オーストリア領ネーデルラント（ベルギー）を合わせ、ネーデルラント連合王国となった。
    - from: 1816
      to: 1829
      text: 南北を合わせた連合王国。国王ウィレム1世が産業・運河の振興を進めたが、オランダ語の強制やプロテスタント中心の政治に、カトリックでフランス語話者の多い南部（ベルギー）が反発した。
    - from: 1830
      to: 1847
      text: 1830年に南部がベルギーとして独立し、オランダは王国の北半分にもどる。国王は独立を認めず軍を置き続けたが、1839年のロンドン条約で承認し、リンブルフとルクセンブルクの東半分を保った。ジャワ島では強制栽培制度（1830年〜）で植民地から大きな利益を得た。
    - from: 1848
      to: 1889
      text: 1848年の革命の波の中で、トルベッケの起草した憲法で立憲君主制・議院内閣制となる。自由主義の時代で、1863年に植民地の奴隷制を廃止し、強制栽培制度も段階的に廃止された。
    - from: 1890
      to: 1914
      text: 女王ウィルヘルミナが即位し、ルクセンブルクとの同君連合が終わる。スマトラ北部のアチェ戦争（1873–1904ごろ）などで東インドの支配を広げ、20世紀初めには「倫理政策」を掲げた。第一次世界大戦では中立を守った。
  source:
    - "https://ja.wikipedia.org/wiki/ネーデルラント連邦共和国"
    - "https://ja.wikipedia.org/wiki/バタヴィア共和国"
    - "https://ja.wikipedia.org/wiki/ホラント王国"
    - "https://ja.wikipedia.org/wiki/ネーデルラント連合王国"
    - "https://ja.wikipedia.org/wiki/オランダの歴史"

- id: belgium
  name: ベルギー王国
  short: ベルギー
  color: "#e6c15c"
  kind: 王国（立憲君主制）
  rulers:
    - name: 臨時政府
      title: ベルギー臨時政府（集団の統治機関）
      from: 1830
      to: 1831
      note: 1830年9月の蜂起の後に成立し、10月4日に独立を宣言した。シャルル・ロジエらが加わった。
      source: "https://en.wikipedia.org/wiki/Provisional_Government_of_Belgium"
    - name: エラスム・シュルレ・ド・ショキエ
      title: 摂政
      from: 1831
      to: 1831
      note: 国王が決まるまでの摂政（1831年2月〜7月）。
      source: "https://en.wikipedia.org/wiki/Erasme_Louis_Surlet_de_Chokier"
    - name: レオポルド1世
      title: ベルギー国王
      from: 1831
      to: 1865
      note: ドイツのザクセン＝コーブルク家の出身。イギリス王女シャーロットの夫で、ヴィクトリア女王の叔父。
      source: "https://ja.wikipedia.org/wiki/レオポルド1世_(ベルギー王)"
    - name: レオポルド2世
      title: ベルギー国王（1885–1908 コンゴ自由国の元首を兼ねる）
      from: 1865
      to: 1909
      note: コンゴ自由国を私有地として支配し、住民への過酷な強制労働が国際的な非難を浴びた。
      source: "https://ja.wikipedia.org/wiki/レオポルド2世_(ベルギー王)"
    - name: アルベール1世
      title: ベルギー国王
      from: 1909
      to: 1934
      note: 第一次世界大戦ではドイツ軍に抵抗し、イーゼル川の前線で軍を率いた（「騎士王」）。
      source: "https://ja.wikipedia.org/wiki/アルベール1世_(ベルギー王)"
  periods:
    - from: 1830
      to: 1838
      text: 1830年、フランス七月革命の影響でブリュッセルで蜂起が起こり、オランダから独立を宣言。ロンドン会議で列強が独立を認め、1831年に当時もっとも自由主義的といわれた憲法を定めて立憲王国となった。オランダはなお独立を認めなかった。
    - from: 1839
      to: 1884
      text: 1839年のロンドン条約でオランダが独立を承認し、列強がベルギーの永世中立を保障した。石炭・鉄鋼をもとに、大陸ヨーロッパでいち早く産業革命が進んだ。カトリック派と自由主義派が交代で政権をになった。
    - from: 1885
      to: 1907
      text: ベルリン会議（1884–85）で国王レオポルド2世の私有地としてコンゴ自由国が認められ、天然ゴムなどの搾取が行われた。国内では労働運動が高まり、1893年に男子普通選挙（複数投票制つき）が実現した。
    - from: 1908
      to: 1914
      text: 国際的な非難を受けて、1908年にコンゴ自由国はベルギー政府の植民地（ベルギー領コンゴ）となった。1914年8月、ドイツ軍が中立を破って侵入し（シュリーフェン計画）、年末までに国土の大部分が占領された。
  source:
    - "https://ja.wikipedia.org/wiki/ベルギー"
    - "https://ja.wikipedia.org/wiki/ベルギー独立革命"

- id: luxembourg
  name: ルクセンブルク大公国
  short: ルクセンブルク
  color: "#8cc7bd"
  kind: 大公国
  rulers:
    - {name: ウィレム1世, title: ルクセンブルク大公（オランダ国王）, from: 1815, to: 1840, source: "https://ja.wikipedia.org/wiki/ウィレム1世_(オランダ王)"}
    - {name: ウィレム2世, title: ルクセンブルク大公（オランダ国王）, from: 1840, to: 1849, source: "https://ja.wikipedia.org/wiki/ウィレム2世_(オランダ王)"}
    - {name: ウィレム3世, title: ルクセンブルク大公（オランダ国王）, from: 1849, to: 1890, note: 1850–1879年は弟のヘンドリック王子が大公の代理（総督）として治めた。, source: "https://ja.wikipedia.org/wiki/ウィレム3世_(オランダ王)"}
    - {name: アドルフ, title: ルクセンブルク大公（ナッサウ＝ヴァイルブルク家）, from: 1890, to: 1905, note: 1866年にプロイセンに併合されたナッサウ公国の元公。ナッサウ家の家門協約により継いだ。, source: "https://en.wikipedia.org/wiki/Adolphe,_Grand_Duke_of_Luxembourg"}
    - {name: ギヨーム4世, title: ルクセンブルク大公, from: 1905, to: 1912, source: "https://en.wikipedia.org/wiki/William_IV,_Grand_Duke_of_Luxembourg"}
    - {name: マリー＝アデライド, title: ルクセンブルク女大公, from: 1912, to: 1919, source: "https://en.wikipedia.org/wiki/Marie-Adélaïde,_Grand_Duchess_of_Luxembourg"}
  periods:
    - from: 1815
      to: 1829
      text: ウィーン会議で大公国となり、オランダ国王が大公を兼ねた（同君連合）。同時にドイツ連邦にも加盟し、首都の要塞にはプロイセン軍が連邦軍として駐留した。
    - from: 1830
      to: 1838
      text: ベルギー独立革命で、首都の要塞を除く大公国のほぼ全域がベルギー側に加わった。
    - from: 1839
      to: 1866
      text: 1839年のロンドン条約で、西のフランス語圏（現ベルギーのリュクサンブール州）をベルギーに譲り、東のドイツ語系の地域だけになる。1842年からドイツ関税同盟に加わった。
    - from: 1867
      to: 1889
      text: ドイツ連邦の解体後、オランダ国王がルクセンブルクをフランスに売ろうとした（ルクセンブルク危機）。1867年のロンドン条約で永世中立国となり、要塞は取り壊され、プロイセン軍も撤退した。製鉄業が発展した。
    - from: 1890
      to: 1914
      text: 女性のウィルヘルミナがオランダ女王になると、男子相続のルクセンブルクではナッサウ＝ヴァイルブルク家のアドルフが大公となり、同君連合が終わった。1914年8月、ドイツ軍が中立を破って占領した。
  source:
    - "https://ja.wikipedia.org/wiki/ルクセンブルク"
    - "https://en.wikipedia.org/wiki/History_of_Luxembourg"

