    - {name: レオ13世, title: ローマ教皇（教皇領なし）, from: 1878, to: 1903, note: 1891年の回勅「レールム・ノヴァールム」で労働問題についての教会の立場を示した。, source: "https://en.wikipedia.org/wiki/Pope_Leo_XIII"}
    - {name: ピウス10世, title: ローマ教皇（教皇領なし）, from: 1903, to: 1914, source: "https://en.wikipedia.org/wiki/Pope_Pius_X"}
    - {name: ベネディクトゥス15世, title: ローマ教皇（教皇領なし）, from: 1914, to: 1922, source: "https://en.wikipedia.org/wiki/Pope_Benedict_XV"}
  periods:
    - from: 1648
      to: 1795
      text: ローマ教皇が君主として治める国家。ラツィオ・ウンブリア・マルケと、北のボローニャ・フェラーラ・ロマーニャ（「レガツィオーネ」）からなる。ウェストファリア条約に教皇は抗議したが無視され、国際政治での影響力は低下した。
    - from: 1796
      to: 1799
      text: ナポレオンのイタリア遠征で、トレンティーノ条約（1797年）によりボローニャ・フェラーラ・ロマーニャを失う。1798年にはローマにローマ共和国が建てられ、教皇ピウス6世はフランスへ連れ去られた。
    - from: 1800
      to: 1808
      text: ピウス7世のもとで復活し、1801年にナポレオンとコンコルダートを結ぶ。
    - from: 1808
      to: 1813
      text: 大陸封鎖への協力を拒んだため、1808年にマルケがイタリア王国に、1809年にローマとウンブリアがフランス帝国に併合され、教皇は幽閉された。
    - from: 1814
      to: 1815
      text: ウィーン会議でマルケとレガツィオーネを含む教皇領が回復された。
    - from: 1816
      to: 1848
      text: 聖職者が行政を独占する保守的な統治に、北のボローニャ・ロマーニャなどで不満が強く、1831年に革命が起きた。オーストリア軍がボローニャに、フランス軍がアンコーナに駐留した（1832–1838）。
    - from: 1849
      to: 1859
      text: 1848年の革命で教皇ピウス9世はローマを逃れ、1849年2月にマッツィーニらのローマ共和国が成立したが、7月にフランス軍が攻め落とした。以後、ローマにはフランス軍が、ボローニャなど北部にはオーストリア軍が駐留して教皇を守った。
    - from: 1860
      to: 1870
      text: 1859–60年に、ロマーニャ・レガツィオーネ、ついでマルケ・ウンブリアがサルデーニャ王国（イタリア）に併合され、教皇領はローマ周辺のラツィオだけになった。フランス軍の保護で残ったが、1870年9月、普仏戦争でフランス軍が去るとイタリア軍がローマを占領し、教皇領は消滅した。
    - from: 1871
      to: 1914
      text: 教皇は領土を失い、ヴァチカン宮殿に閉じこもってイタリア王国を認めなかった（ローマ問題。1929年のラテラノ条約で解決）。カトリック教徒に国政選挙への参加を禁じた。
  source:
    - "https://ja.wikipedia.org/wiki/教皇領"
    - "https://ja.wikipedia.org/wiki/ローマ教皇の一覧"
    - "https://ja.wikipedia.org/wiki/ローマ問題"

