    - name: ヤーコプ・カッツ
      title: ホラント州法律顧問（第1次無総督時代）
      from: 1650
      to: 1651
      source: "https://en.wikipedia.org/wiki/Grand_pensionary"
    - name: アドリアーン・パウ
      title: ホラント州法律顧問（第1次無総督時代）
      from: 1651
      to: 1653
      source: "https://en.wikipedia.org/wiki/Grand_pensionary"
    - name: ヤン・デ・ウィット
      title: ホラント州法律顧問（第1次無総督時代の実権者）
      from: 1653
      to: 1672
      source: "https://ja.wikipedia.org/wiki/ヨハン・デ・ウィット"
    - name: ウィレム3世
      title: 総督（1689年からイングランド王ウィリアム3世を兼ねる）
      from: 1672
      to: 1702
      source: "https://ja.wikipedia.org/wiki/ウィリアム3世_(イングランド王)"
    - name: アントニー・ヘインシウス
      title: ホラント州法律顧問（第2次無総督時代の実権者）
      from: 1702
      to: 1720
      source: "https://en.wikipedia.org/wiki/Anthonie_Heinsius"
    - name: イサーク・ファン・ホールンベーク
      title: ホラント州法律顧問
      from: 1720
      to: 1727
      source: "https://en.wikipedia.org/wiki/Grand_pensionary"
    - name: シモン・ファン・スリンゲラント
      title: ホラント州法律顧問
      from: 1727
      to: 1736
      source: "https://en.wikipedia.org/wiki/Simon_van_Slingelandt"
    - name: アントニー・ファン・デル・ヘイム
      title: ホラント州法律顧問
      from: 1737
      to: 1746
      source: "https://en.wikipedia.org/wiki/Grand_pensionary"
    - name: ウィレム4世
      title: 総督（1747年に全州の世襲総督）
      from: 1747
      to: 1751
      source: "https://en.wikipedia.org/wiki/William_IV,_Prince_of_Orange"
    - name: ウィレム5世
      title: 総督
      from: 1751
      to: 1795
      note: 1759年まで母アンナ（イギリス王ジョージ2世の娘）が摂政。1795年、フランス軍の侵入でイギリスへ亡命。
      source: "https://en.wikipedia.org/wiki/William_V,_Prince_of_Orange"
    - name: ルトガー・ヤン・シンメルペンニンク
      title: バタヴィア共和国の法律顧問（元首）
      from: 1805
      to: 1806
      source: "https://en.wikipedia.org/wiki/Rutger_Jan_Schimmelpenninck"
    - name: ローデウェイク1世（ルイ・ボナパルト）
      title: ホラント王
      from: 1806
      to: 1810
      note: ナポレオンの弟。大陸封鎖の徹底を拒んだため退位させられ、王国はフランスに併合された。
      source: "https://ja.wikipedia.org/wiki/ルイ・ボナパルト"
    - name: ウィレム1世
      title: 主権者公（1813–1815）→ネーデルラント国王（1815–1840）
      from: 1813
      to: 1840
      note: ウィレム5世の子。1815年からルクセンブルク大公を兼ねる。
      source: "https://ja.wikipedia.org/wiki/ウィレム1世_(オランダ王)"
  periods:
    - from: 1648
      to: 1672
      text: ウェストファリア条約で独立が正式に承認される。アムステルダムを中心に世界の商業・金融の中心として繁栄する一方、イギリスと英蘭戦争を戦う。総督を置かず、ヤン・デ・ウィットが実権を握った（第1次無総督時代）。
    - from: 1672
      to: 1713
      text: フランスの侵入（「災厄の年」1672年）を機にオラニエ公ウィレム3世が総督となり、名誉革命後はイギリス王も兼ねて、ルイ14世に対抗する同盟の中心となる。
    - from: 1714
      to: 1786
      text: 南ネーデルラントに「防壁要塞」の守備権を得たが、戦費で財政が悪化し、商業の覇権はイギリスに移っていく。1747年にオラニエ家の世襲総督制が復活。
    - from: 1787
      to: 1794
      text: 総督派と愛国派の対立が激化。1787年、プロイセン軍が介入して総督ウィレム5世を支える。
    - from: 1795
      to: 1813
      text: フランス軍の侵入で総督が亡命し、フランスの衛星国バタヴィア共和国となる。1806年にナポレオンの弟ルイを王とするホラント王国、1810年にフランス帝国に併合された。
    - from: 1813
      to: 1815
      text: ナポレオンの敗退後に独立を回復し、ウィレム1世が帰国。ウィーン会議で旧オーストリア領ネーデルラント（ベルギー）を合わせ、ネーデルラント連合王国となった。
  source:
    - "https://ja.wikipedia.org/wiki/ネーデルラント連邦共和国"
    - "https://ja.wikipedia.org/wiki/バタヴィア共和国"
    - "https://ja.wikipedia.org/wiki/ホラント王国"

- id: liege
  name: リエージュ司教領
  short: リエージュ
  color: "#b9a3d6"
  kind: 司教領
  rulers:
    - {name: フェルディナント・フォン・バイエルン, title: リエージュ司教（ケルン大司教を兼ねる）, from: 1612, to: 1650}
    - {name: マクシミリアン・ハインリヒ・フォン・バイエルン, title: リエージュ司教（ケルン大司教を兼ねる）, from: 1650, to: 1688}
    - {name: ジャン＝ルイ・デルデラン, title: リエージュ司教, from: 1688, to: 1694}
    - {name: ヨーゼフ・クレメンス・フォン・バイエルン, title: リエージュ司教（ケルン大司教を兼ねる）, from: 1694, to: 1723}
    - {name: ジョルジュ＝ルイ・ド・ベルグ, title: リエージュ司教, from: 1724, to: 1743}
    - {name: ヨハン・テオドール・フォン・バイエルン, title: リエージュ司教, from: 1744, to: 1763}
    - {name: シャルル＝ニコラ・ドゥルトルモン, title: リエージュ司教, from: 1763, to: 1771}
    - {name: フランソワ＝シャルル・ド・ヴェルブリュック, title: リエージュ司教, from: 1772, to: 1784}
    - {name: セザール＝コンスタンタン・ド・オンスブルック, title: リエージュ司教, from: 1784, to: 1792}
    - {name: フランソワ＝アントワーヌ・ド・メアン, title: リエージュ司教, from: 1792, to: 1795}
  periods:
    - from: 1648
      to: 1788
      text: 神聖ローマ帝国（ヴェストファーレン・クライス）の聖界諸侯領。マース（ムーズ）川に沿って南北に細長く伸び、スペイン領（のちオーストリア領）ネーデルラントを東西に分けていた。石炭・製鉄などの工業が早くから発達した。
    - from: 1789
      to: 1795
      text: フランス革命の影響でリエージュ革命が起こり、司教が追われる（1791年にオーストリア軍が復位させる）。1795年にフランスに併合された。
  note: 君主の在位年は記憶にもとづく。要確認。
  source:
    - "https://ja.wikipedia.org/wiki/リエージュ司教領"
    - "https://en.wikipedia.org/wiki/Prince-Bishopric_of_Liège"

# ================================================================ スイスとその周辺

- id: switzerland
  name: スイス
  names:
    - {to: 1797, name: スイス盟約者団（誓約同盟）}
    - {from: 1798, to: 1802, name: ヘルヴェティア共和国}
    - {from: 1803, name: スイス連邦（盟約者団）}
  short: スイス
  color: "#d39a86"
  kind: 国家連合（13邦）
  rulers:
    - name: ナポレオン1世
      title: 「スイスの調停者」（調停法による保護者）
      from: 1803
      to: 1813
      note: 調停期のスイスは、主要6州の長が1年交代で「スイス知事（ランダマン）」を務めた。
      source: "https://ja.wikipedia.org/wiki/調停法"
  periods:
    - from: 1648
      to: 1797
      text: ウェストファリア条約で神聖ローマ帝国からの独立が正式に認められた。13の邦（州）がゆるやかに結びつく国家連合で、共同支配地（ティチーノ・トゥールガウなど）と、従属地・同盟邦（グラウビュンデン、ヴァレー、ジュネーヴ、ヌーシャテルなど）をもつ。カトリック邦とプロテスタント邦の対立が続いた（フィルメルゲン戦争）。
    - from: 1798
      to: 1802
      text: フランス軍が侵入し、中央集権的なヘルヴェティア共和国（フランスの衛星国）が成立。1799年にはフランス軍とオーストリア・ロシア軍の戦場となった。
    - from: 1803
      to: 1813
      text: ナポレオンの調停法で連邦制に戻り、19州となる（ティチーノ・ヴォー・アールガウ・トゥールガウ・ザンクト・ガレン・グラウビュンデンが新しい州に）。
    - from: 1814
      to: 1815
      text: ウィーン会議でジュネーヴ・ヴァレー・ヌーシャテルが加わって22州となり、永世中立が国際的に認められた。
  source:
    - "https://ja.wikipedia.org/wiki/旧スイス連邦"
    - "https://ja.wikipedia.org/wiki/ヘルヴェティア共和国"
    - "https://ja.wikipedia.org/wiki/調停法"

- id: graubunden
  name: グラウビュンデン（三同盟）
  short: グラウビュンデン
  color: "#c9a28f"
  kind: 同盟（スイスの同盟邦）
  periods:
    - from: 1648
      to: 1797
      text: 灰色同盟・神の家同盟・十裁判区同盟の三同盟からなる共和国。スイス盟約者団の同盟邦で、南のヴァルテッリーナ・キアヴェンナ・ボルミオを従属地として支配した。
    - from: 1797
      to: 1799
      text: 1797年にヴァルテッリーナなどがチザルピーナ共和国に奪われ、1799年にヘルヴェティア共和国に編入された（1803年からグラウビュンデン州）。
  source:
    - "https://en.wikipedia.org/wiki/Three_Leagues"

- id: valais
  name: ヴァレー共和国
  names:
    - {from: 1802, to: 1810, name: ロダニア共和国（ヴァレー共和国）}
  short: ヴァレー
  color: "#deae96"
  kind: 共和国（スイスの同盟邦）
  periods:
    - from: 1648
      to: 1797
      text: 上ヴァレーの7つの十分の一区（ゼンデン）からなる共和国で、下ヴァレーを従属地として支配した。スイス盟約者団の同盟邦。
    - from: 1798
      to: 1815
      text: 1798年にヘルヴェティア共和国に編入、1802年にナポレオンのもとで独立のロダニア共和国、1810年にフランスに併合（シンプロン県）。1815年にスイスの州となる。
  note: アルプス越えのシンプロン峠を押さえるため、ナポレオンが重視した。
  source:
    - "https://en.wikipedia.org/wiki/Republic_of_the_Seven_Tithes"
    - "https://en.wikipedia.org/wiki/Rhodanic_Republic"

- id: geneva
  name: ジュネーヴ共和国
  short: ジュネーヴ
  color: "#e7bfae"
  kind: 共和国（スイスの同盟邦）
  periods:
    - from: 1648
      to: 1797
      text: カルヴァンの宗教改革の中心となったプロテスタントの都市共和国。スイスの同盟邦（ベルン・チューリヒと同盟）で、サヴォイア公に囲まれていた。
    - from: 1798
      to: 1815
      text: 1798年にフランスに併合（レマン県）。1813年末に独立を回復し、1815年にスイスの州となった。
  source:
    - "https://en.wikipedia.org/wiki/Republic_of_Geneva"

- id: neuchatel
  name: ヌーシャテル公国
  short: ヌーシャテル
  color: "#b9a196"
  kind: 公国（スイスの同盟邦）
  rulers:
