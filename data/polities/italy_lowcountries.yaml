    - from: 1859
      to: 1860
      text: 1859年4月、イタリア統一戦争の始まりとともにフィレンツェで市民が立ち上がり、大公は亡命。リカーゾリの臨時政府が治め、1860年3月の住民投票でサルデーニャ王国に併合された。
