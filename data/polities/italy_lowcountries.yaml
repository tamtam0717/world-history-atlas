      to: 1764
      text: メディチ家が断絶し、ポーランド継承戦争の講和にもとづき、ロレーヌ公フランツ・シュテファン（マリア・テレジアの夫）が大公となる（ハプスブルク＝ロートリンゲン家）。
    - from: 1765
      to: 1790
      text: 大公レオポルドが啓蒙改革を進め、1786年には近代国家として初めて死刑を廃止した（拷問も廃止）。
