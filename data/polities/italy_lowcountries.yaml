    - {name: クレメンス9世, title: ローマ教皇, from: 1667, to: 1669}
    - {name: クレメンス10世, title: ローマ教皇, from: 1670, to: 1676}
    - {name: インノケンティウス11世, title: ローマ教皇, from: 1676, to: 1689}
    - {name: アレクサンデル8世, title: ローマ教皇, from: 1689, to: 1691}
    - {name: インノケンティウス12世, title: ローマ教皇, from: 1691, to: 1700}
    - {name: クレメンス11世, title: ローマ教皇, from: 1700, to: 1721}
    - {name: インノケンティウス13世, title: ローマ教皇, from: 1721, to: 1724}
    - {name: ベネディクトゥス13世, title: ローマ教皇, from: 1724, to: 1730}
    - {name: クレメンス12世, title: ローマ教皇, from: 1730, to: 1740}
    - {name: ベネディクトゥス14世, title: ローマ教皇, from: 1740, to: 1758}
    - {name: クレメンス13世, title: ローマ教皇, from: 1758, to: 1769}
    - {name: クレメンス14世, title: ローマ教皇, from: 1769, to: 1774, note: 1773年にイエズス会を解散させた。}
    - {name: ピウス6世, title: ローマ教皇, from: 1775, to: 1799, note: 1798年にフランス軍に連れ去られ、1799年にフランスのヴァランスで没した。}
    - {name: ピウス7世, title: ローマ教皇, from: 1800, to: 1823, note: 1801年にナポレオンとコンコルダート（宗教協約）を結んだが、1809年から1814年までフランスに幽閉された。}
  periods:
    - from: 1648
      to: 1795
      text: ローマ教皇が君主として治める国家。ラツィオ・ウンブリア・マルケと、北のボローニャ・フェラーラ・ロマーニャ（「レガツィオーネ」）からなる。ウェストファリア条約に教皇は抗議したが無視され、国際政治での影響力は低下した。
    - from: 1796
      to: 1799
      text: ナポレオンのイタリア遠征で、トレンティーノ条約（1797年）によりボローニャ・フェラーラ・ロマーニャを失う。1798年にはローマにローマ共和国が建てられ、教皇ピウス6世はフランスへ連れ去られた。
    - from: 1800
      to: 1808
      text: ピウス7世のもとで復活し、1801年にナポレオンとコンコルダートを結ぶ。
    - from: 1808
      to: 1813
      text: 大陸封鎖への協力を拒んだため、1808年にマルケがイタリア王国に、1809年にローマとウンブリアがフランス帝国に併合され、教皇は幽閉された。
    - from: 1814
      to: 1815
      text: ウィーン会議でマルケとレガツィオーネを含む教皇領が回復された。
  source:
    - "https://ja.wikipedia.org/wiki/教皇領"
    - "https://ja.wikipedia.org/wiki/ローマ教皇の一覧"

- id: san_marino
