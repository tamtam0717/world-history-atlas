    - name: ヴィットーリオ・エマヌエーレ1世
      title: サルデーニャ王
      from: 1802
      to: 1821
      note: 1814年までサルデーニャ島だけを治めた。1821年のピエモンテ革命で退位した。
      source: "https://ja.wikipedia.org/wiki/ヴィットーリオ・エマヌエーレ1世"
    - name: カルロ・フェリーチェ
      title: サルデーニャ王
      from: 1821
      to: 1831
      note: 兄ヴィットーリオ・エマヌエーレ1世の退位で即位。オーストリア軍の助けで革命を鎮圧した。
      source: "https://en.wikipedia.org/wiki/Charles_Felix_of_Sardinia"
    - name: カルロ・アルベルト
      title: サルデーニャ王
      from: 1831
      to: 1849
      note: 分家のカリニャーノ家の出身。1848年に憲法（アルベルト憲章）を定め、オーストリアと戦ったが、1849年のノヴァーラの戦いに敗れて退位した。
      source: "https://en.wikipedia.org/wiki/Charles_Albert_of_Sardinia"
    - name: ヴィットーリオ・エマヌエーレ2世
      title: サルデーニャ王（1861年からイタリア国王）
      from: 1849
      to: 1861
      note: 首相カヴールとともにイタリア統一を進めた。1861年からは italy（イタリア王国）の欄を参照。
      source: "https://ja.wikipedia.org/wiki/ヴィットーリオ・エマヌエーレ2世"
  periods:
    - from: 1648
      to: 1712
      text: アルプスをはさんでサヴォイア・ニースとピエモンテを治める公国。フランスとスペイン（のちオーストリア）の間で同盟相手を変えながら、少しずつ領土を広げた。
    - from: 1713
      to: 1747
      text: スペイン継承戦争でオーストリア側について勝ち、ユトレヒト条約でシチリアと王号を得た。1720年にシチリアをサルデーニャと交換し、サルデーニャ王国となる。ミラノ公国の西部（ロメッリーナ・ノヴァーラなど）を段階的に獲得した。
    - from: 1748
      to: 1791
      text: 首都トリノを中心に絶対王政の官僚国家を整え、イタリアの有力国となる。
    - from: 1792
      to: 1813
      text: 革命フランスと戦って敗れ、1796年にサヴォイアとニースを失う。1798年末にピエモンテも追われ、国王はイギリス艦隊に守られたサルデーニャ島だけを保った。ピエモンテは1802年にフランスに併合された。
    - from: 1814
      to: 1815
      text: ウィーン会議でピエモンテ・サヴォイア・ニースを回復し、旧ジェノヴァ共和国も獲得した。のちのイタリア統一の中心となる。
    - from: 1816
      to: 1847
      text: 復古王政の保守的な王国。1821年にカルボナリ・自由主義の軍人の革命が起きたが、オーストリア軍の介入で鎮圧された。
    - from: 1848
      to: 1849
      text: 国王カルロ・アルベルトがアルベルト憲章（憲法）を定め、ミラノ・ヴェネツィアの蜂起に応えてオーストリアと戦った（第1次イタリア独立戦争）。クストーツァ（1848）・ノヴァーラ（1849）で敗れ、国王は退位した。
    - from: 1850
      to: 1858
      text: 憲法を保った唯一のイタリアの国として、統一運動（リソルジメント）の中心となる。首相カヴール（1852年〜）が鉄道・産業を整え、クリミア戦争に参戦してパリ講和会議でイタリア問題を訴えた。1858年、プロンビエールの密約でフランスのナポレオン3世と同盟した。
    - from: 1859
      to: 1861
      text: フランスとともにオーストリアと戦い（イタリア統一戦争）、1859年にロンバルディアを得た。1860年にはサヴォイア・ニースをフランスに譲るかわりに中部イタリアを併合し、ガリバルディ（千人隊）が征服した両シチリア王国、マルケ・ウンブリアも住民投票で合わせた。1861年3月、イタリア王国となった。
  source:
    - "https://ja.wikipedia.org/wiki/サヴォイア公国"
    - "https://ja.wikipedia.org/wiki/サルデーニャ王国"
    - "https://ja.wikipedia.org/wiki/イタリア統一運動"

