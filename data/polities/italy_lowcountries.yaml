    - {name: フリードリヒ・ヴィルヘルム1世, title: ヌーシャテル公（プロイセン王）, from: 1713, to: 1740}
    - {name: フリードリヒ2世（大王）, title: ヌーシャテル公（プロイセン王）, from: 1740, to: 1786}
    - {name: フリードリヒ・ヴィルヘルム2世, title: ヌーシャテル公（プロイセン王）, from: 1786, to: 1797}
    - {name: フリードリヒ・ヴィルヘルム3世, title: ヌーシャテル公（プロイセン王）, from: 1797, to: 1806}
    - {name: ベルティエ, title: ヌーシャテル大公（ナポレオンの元帥）, from: 1806, to: 1814}
    - {name: フリードリヒ・ヴィルヘルム3世, title: ヌーシャテル公（プロイセン王）, from: 1814, to: 1840}
  periods:
    - from: 1648
      to: 1706
      text: フランスの貴族ロングヴィル家が治める公国。スイス盟約者団の同盟邦。
    - from: 1707
      to: 1805
      text: ロングヴィル家の断絶後、住民の代表がプロテスタントのプロイセン王を君主に選んだ。プロイセン王の飛び地の領地となる。
    - from: 1806
      to: 1815
      text: 1806年にプロイセンがナポレオンに譲り、元帥ベルティエの公国となる。1814年にプロイセン王のもとに戻り、1815年にスイスの州となった（プロイセン王の公国でもある状態が1857年まで続く）。
  source:
    - "https://en.wikipedia.org/wiki/Principality_of_Neuchâtel"

- id: basel_bishopric
  name: バーゼル司教領
  short: バーゼル司教領
  color: "#ad9dcd"
  kind: 司教領
  periods:
    - from: 1648
      to: 1792
      text: 司教はポラントリュイ（ポラントルイ）に住んだ。北部は神聖ローマ帝国に属し、南部（エルゲル・ムーティエなど）はスイスの同盟者として扱われた。
    - from: 1792
      to: 1797
      text: 1792年に北部でラウラキア共和国が成立し、1793年にフランスに併合（モン＝テリブル県）。1797年に南部もフランスに併合された。1815年のウィーン会議でベルン州・バーゼル州に分けられた。
  source:
    - "https://en.wikipedia.org/wiki/Prince-Bishopric_of_Basel"

- id: liechtenstein
  name: リヒテンシュタイン侯国
  names:
    - {to: 1718, name: ファドゥーツ伯領・シェレンベルク}
  short: リヒテンシュタイン
  color: "#a3b9d4"
  kind: 侯国
  rulers:
    - {name: アントン・フロリアン, title: リヒテンシュタイン侯, from: 1719, to: 1721}
    - {name: ヨーゼフ・ヨハン・アダム, title: リヒテンシュタイン侯, from: 1721, to: 1732}
    - {name: ヨハン・ネポムク・カール, title: リヒテンシュタイン侯, from: 1732, to: 1748}
    - {name: ヨーゼフ・ヴェンツェル, title: リヒテンシュタイン侯, from: 1748, to: 1772}
    - {name: フランツ・ヨーゼフ1世, title: リヒテンシュタイン侯, from: 1772, to: 1781}
    - {name: アロイス1世, title: リヒテンシュタイン侯, from: 1781, to: 1805}
    - {name: ヨハン1世ヨーゼフ, title: リヒテンシュタイン侯, from: 1805, to: 1836}
  periods:
    - from: 1648
      to: 1718
      text: ホーエンエムス伯家の所領。オーストリアの貴族リヒテンシュタイン家が1699年にシェレンベルク、1712年にファドゥーツを買い取った。
    - from: 1719
      to: 1815
      text: 1719年、皇帝が二つの所領をあわせてリヒテンシュタイン侯国とした。1806年にライン同盟、1815年にドイツ連邦に加わる。
  note: 1712年より前は小さな帝国伯領（君主は省略）。侯家の当主は主にウィーンに住んだ。
  source:
    - "https://ja.wikipedia.org/wiki/リヒテンシュタイン"

# ================================================================ 北イタリア

- id: savoy
  name: サルデーニャ王国
