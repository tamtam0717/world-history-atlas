      from: 1848
      to: 1914
      note: 1848年の連邦憲法で置かれた7人の内閣が集団で元首の役を担う。連邦大統領は「同輩中の首席」で、毎年交代するため個人名は省略。
      source: "https://ja.wikipedia.org/wiki/連邦参事会_(スイス)"
  periods:
    - from: 1648
      to: 1797
      text: ウェストファリア条約で神聖ローマ帝国からの独立が正式に認められた。13の邦（州）がゆるやかに結びつく国家連合で、共同支配地（ティチーノ・トゥールガウなど）と、従属地・同盟邦（グラウビュンデン、ヴァレー、ジュネーヴ、ヌーシャテルなど）をもつ。カトリック邦とプロテスタント邦の対立が続いた（フィルメルゲン戦争）。
    - from: 1798
      to: 1802
      text: フランス軍が侵入し、中央集権的なヘルヴェティア共和国（フランスの衛星国）が成立。1799年にはフランス軍とオーストリア・ロシア軍の戦場となった。
    - from: 1803
      to: 1813
      text: ナポレオンの調停法で連邦制に戻り、19州となる（ティチーノ・ヴォー・アールガウ・トゥールガウ・ザンクト・ガレン・グラウビュンデンが新しい州に）。
    - from: 1814
      to: 1815
      text: ウィーン会議でジュネーヴ・ヴァレー・ヌーシャテルが加わって22州となり、永世中立が国際的に認められた。
    - from: 1816
      to: 1846
      text: 22州がゆるやかに結びつく国家連合（1815年の連邦条約）。1830年代から各州で自由主義の改革（「再生」）が進み、自由主義の州と保守的なカトリックの州の対立が深まった。
    - from: 1847
      to: 1848
      text: 保守的なカトリック7州が分離同盟（ゾンダーブント）を結び、1847年の分離同盟戦争（内戦）で連邦軍に敗れた。1848年に新憲法を定め、首都をベルンとする連邦国家となった。
    - from: 1849
      to: 1914
      text: 連邦国家として、関税・通貨・郵便を統一し、鉄道（1882年ゴッタルド鉄道トンネル）と観光・工業で発展した。1864年に赤十字国際委員会の主導でジュネーヴ条約が結ばれた。1874年の憲法改正で国民投票（レファレンダム）が導入され、直接民主制が広がった。第一次世界大戦では中立を守った。
  note: 1848年からの連邦国家では、7人の連邦参事会（内閣）が集団で元首の役を担い、連邦大統領は1年交代のため君主の欄には書かない。
  source:
    - "https://ja.wikipedia.org/wiki/旧スイス連邦"
    - "https://ja.wikipedia.org/wiki/ヘルヴェティア共和国"
    - "https://ja.wikipedia.org/wiki/調停法"
    - "https://ja.wikipedia.org/wiki/分離同盟戦争"
    - "https://ja.wikipedia.org/wiki/スイス"

- id: graubunden
