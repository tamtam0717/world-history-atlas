    - {from: 1713, to: 1719, name: サヴォイア公国（シチリア王国）}
  color: "#d8a6b6"
  kind: 王国
  rulers:
    - name: カルロ・エマヌエーレ2世
      title: サヴォイア公
      from: 1638
      to: 1675
      note: 1648年まで母クリスティーヌ（フランス王ルイ13世の妹）が摂政。
      source: "https://en.wikipedia.org/wiki/Charles_Emmanuel_II,_Duke_of_Savoy"
    - name: ヴィットーリオ・アメデーオ2世
      title: サヴォイア公（1713–1720 シチリア王、1720–1730 サルデーニャ王）
      from: 1675
      to: 1730
      note: 1684年まで母マリー・ジャンヌ・バティストが摂政。
      source: "https://ja.wikipedia.org/wiki/ヴィットーリオ・アメデーオ2世"
    - name: カルロ・エマヌエーレ3世
      title: サルデーニャ王
      from: 1730
      to: 1773
      source: "https://ja.wikipedia.org/wiki/カルロ・エマヌエーレ3世"
    - name: ヴィットーリオ・アメデーオ3世
      title: サルデーニャ王
      from: 1773
      to: 1796
      source: "https://ja.wikipedia.org/wiki/ヴィットーリオ・アメデーオ3世"
    - name: カルロ・エマヌエーレ4世
      title: サルデーニャ王
      from: 1796
      to: 1802
      note: 1798年末にピエモンテを追われ、サルデーニャ島へ逃れた。1802年に退位。
      source: "https://ja.wikipedia.org/wiki/カルロ・エマヌエーレ4世"
    - name: ヴィットーリオ・エマヌエーレ1世
      title: サルデーニャ王
      from: 1802
      to: 1821
      note: 1814年までサルデーニャ島だけを治めた。
      source: "https://ja.wikipedia.org/wiki/ヴィットーリオ・エマヌエーレ1世"
  periods:
    - from: 1648
      to: 1712
      text: アルプスをはさんでサヴォイア・ニースとピエモンテを治める公国。フランスとスペイン（のちオーストリア）の間で同盟相手を変えながら、少しずつ領土を広げた。
    - from: 1713
      to: 1747
      text: スペイン継承戦争でオーストリア側について勝ち、ユトレヒト条約でシチリアと王号を得た。1720年にシチリアをサルデーニャと交換し、サルデーニャ王国となる。ミラノ公国の西部（ロメッリーナ・ノヴァーラなど）を段階的に獲得した。
    - from: 1748
      to: 1791
      text: 首都トリノを中心に絶対王政の官僚国家を整え、イタリアの有力国となる。
    - from: 1792
      to: 1813
      text: 革命フランスと戦って敗れ、1796年にサヴォイアとニースを失う。1798年末にピエモンテも追われ、国王はイギリス艦隊に守られたサルデーニャ島だけを保った。ピエモンテは1802年にフランスに併合された。
    - from: 1814
      to: 1815
      text: ウィーン会議でピエモンテ・サヴォイア・ニースを回復し、旧ジェノヴァ共和国も獲得した。のちのイタリア統一の中心となる。
  source:
    - "https://ja.wikipedia.org/wiki/サヴォイア公国"
    - "https://ja.wikipedia.org/wiki/サルデーニャ王国"

