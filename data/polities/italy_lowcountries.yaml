    - from: 1719
      to: 1815
      text: 1719年、皇帝が二つの所領をあわせてリヒテンシュタイン侯国とした。1806年にライン同盟、1815年にドイツ連邦に加わる。
    - from: 1816
      to: 1914
      text: ドイツ連邦の加盟国（1866年の解体まで）。1852年にオーストリアと関税同盟を結び、オーストリアと強く結びついた。1862年に憲法を定め、1868年に軍隊を廃止した。
  note: 1712年より前は小さな帝国伯領（君主は省略）。侯家の当主は主にウィーンに住んだ。
