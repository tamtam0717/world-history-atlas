# 主な都市（1648–2025）。地図に点と名前を描くためのデータ。
# 座標：Natural Earth（ne_10m_populated_places）の LATITUDE / LONGITUDE。Natural Earth に無い町は近似（note に「座標は近似」）。
# 人口（pop）：Chandler・Bairoch などの都市人口推計の通説的な値をもとにした概数（人）。桁と順位の目安。
#   全体に推計の幅は大きい。特に自信のないものは note に「人口は概数・要確認」と書いた。
#   1850・1900・1914年の値は、市域の拡大や合併の扱いが都市ごとに違うため、特に幅のある概数（桁と順位の目安）。
#   1950・2000・2020年の値：大都市（おおむね100万人以上）は国連の World Urbanization Prospects の都市圏（urban agglomeration）の値を目安にした概数、
#   それ以外は市の人口の概数。都市圏か市域かで数字が数倍違うことがあるので、桁と順位の目安として扱う。
# capital：その政体の政府所在地だった期間（from/to はその年を含む。年末の状態で数える）。
# names：時期ごとの名前（from/to はその年を含む。上から順に最初に当てはまるものを使い、どれにも当てはまらなければ name）。

