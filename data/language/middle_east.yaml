      minor: armenian
      note: ザザ語とクルマンジー語のアレヴィー派の山地。

- id: lang_van_bitlis
  name: ヴァン・ビトリス
  select:
    pieces: [TUR-Van, TUR-Bitlis]
  timeline:
    - from: 1648
      main: kurdish
      minor: armenian
      note: ヴァン湖周辺はアルメニア人の古くからの中心地（ヴァスプラカン）。19世紀末でもヴァン州の住民の3〜4割がアルメニア人とされる。要確認

- id: lang_mus
  name: ムシュ平原
  select:
    pieces: [TUR-Mu]
  timeline:
    - from: 1648
      main: armenian
      minor: kurdish
      note: ムシュ平原とサスーンの山地はアルメニア人の農民が多かった。要確認

- id: lang_diyarbakir
  name: ディヤルバクル
  select:
    pieces: [TUR-Diyarbak_r]
  timeline:
    - from: 1648
      main: kurdish
      minor: armenian
      note: 町はトルコ語・アルメニア語・クルド語・アラム語（シリア正教会）。周辺の農村はクルド人。

- id: lang_mardin_urfa
  name: マルディン・ウルファ（北メソポタミア）
  select:
    pieces: [TUR-Mardin, TUR-anl_urfa]
  timeline:
    - from: 1648
      main: kurdish
