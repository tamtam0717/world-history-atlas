- id: lang_kirkuk
  name: キルクーク
  select:
    pieces: [IRQ-Kirkuk]
  timeline:
    - from: 1648
      main: kurdish
      minor: turkish
      note: キルクーク市とその周辺の町はトルクメン（トルコ語系）が多い。農村はクルド人とアラブ人。
    - from: 1975
      main: arabic
      minor: kurdish
      note: 1970年代以後、バアス党政権はクルド人・トルクメン人を追い出してアラブ人を入植させた（「アラブ化」）。1977年の調査でアラブ人約44%、クルド人約37%、トルクメン人約16%とされる。
      source: "https://en.wikipedia.org/wiki/Arabization_of_Kirkuk"
    - from: 2005
      main: kurdish
      minor: arabic
      note: 2003年のイラク戦争の後、追われたクルド人が戻り、アラブ人入植者の一部は去った。民族の割合ははっきりせず、争いが続いている（要確認）。

- id: lang_mosul
