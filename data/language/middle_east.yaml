# 言語（民族）の分布：アナトリア・東トラキア・コーカサス南部・メソポタミア・レヴァント・アラビア・イラン・アフガニスタン西部（1648–1914）
# 形式は docs/language-format.md。main = 住民（特に農村の民衆）の多数派の言語、minor = 2〜3割以上の少数派。
# 範囲は1914年まで（1915年のアルメニア人虐殺、1923年のギリシア・トルコの住民交換の前の状態）。
# ザザ語はクルド語に、ラズ語はジョージア語（カルトヴェリ系）に、ギーラーン語・マーザンダラーン語・ロル語はペルシア語に、
# ガシュガーイー語はアゼルバイジャン語に含める。

# ======== アナトリア・東トラキア ========
- id: lang_anatolia_base
  name: アナトリア（下地：トルコ語）
  select:
    iso: [TUR]
  timeline:
    - from: 1648
      main: turkish
      note: ムスリムの農民・遊牧民（ユルック、トゥルクメン）はトルコ語。カラマン地方などには、トルコ語を話しギリシア文字で書く正教徒（カラマンルデス）もいた。カッパドキアの一部の村はギリシア語。クリミア・タタール人、チェルケス人（1864年の追放）、バルカンのムスリム（1878年以後）など、ロシアとバルカンから数百万人のムスリム難民（ムハジル）がアナトリアに定住した。
      source: https://ja.wikipedia.org/wiki/ムハージル
    - from: 1923
      main: turkish
      note: 1923年の住民交換で、アナトリアの正教徒（カッパドキアのトルコ語を話すカラマンリを含む）はギリシアへ移され、ギリシアやバルカン半島のムスリムが移り住んだ。
      source: "https://en.wikipedia.org/wiki/Population_exchange_between_Greece_and_Turkey"

- id: lang_istanbul
  name: イスタンブル
  select:
    pieces: [TUR-stanbul]
  timeline:
    - from: 1648
      main: turkish
      minor: greek
      note: 住民の約4割が非ムスリム（ギリシア人・アルメニア人・ユダヤ人）で、フェネル地区にはコンスタンティノープル総主教座があった。ガラタ・ペラには西欧の商人も住む。
    - from: 1923
      main: turkish
      note: イスタンブルのギリシア人は住民交換の対象外になったが、1942年の富裕税、1955年の反ギリシア暴動、1964年のギリシア国籍者の追放で大きく減った（今は数千人）。アルメニア人・ユダヤ人の社会も小さくなった。戦後はアナトリア各地（クルド人を含む）から人口が流れ込んだ。
      source: "https://en.wikipedia.org/wiki/Istanbul_pogrom"

- id: lang_east_thrace
  name: 東トラキア（エディルネ・クルクラーレリ・テキルダー）
  select:
    pieces: [TUR-Edirne, TUR-K_rklareli, TUR-Tekirda]
  timeline:
    - from: 1648
      main: turkish
      minor: greek
      note: ギリシア語の村と町（ロドスト＝テキルダー、ヴィゼなど）が多い。ストランジャ山地にはブルガリア人の村、エディルネにはユダヤ人・アルメニア人もいる。
    - from: 1922
      main: turkish
      note: 1922年10月のムダニヤ休戦協定の後、東トラキアのギリシア人はギリシアへ避難した。バルカン半島から移されたムスリムが入植した。

- id: lang_aegean_coast
  name: エーゲ海沿岸（イズミル・アイドゥン・バルケスィル・チャナッカレ）
  select:
    pieces: [TUR-zmir, TUR-Ayd_n, TUR-Bal_kesir, TUR-Canakkale]
  timeline:
    - from: 1648
      main: turkish
      minor: greek
      note: スミルナ（イズミル）は西欧との貿易の港で、19世紀末には市内の住民の多数がギリシア人などの非ムスリム。エーゲ海の島々からギリシア人の移住が続いた。アイヴァルク・イムロズ島などはギリシア語の町。
      source: "https://ja.wikipedia.org/wiki/イズミル"
    - from: 1922
      main: turkish
      note: ギリシア＝トルコ戦争（1919–22）の終わり、1922年9月のスミルナ（イズミル）の大火とともに、アナトリア西部のギリシア人のほとんどがギリシアへ逃れた。翌1923年のローザンヌ条約で住民交換が決まり、残った正教徒も移された。
      source: "https://en.wikipedia.org/wiki/Population_exchange_between_Greece_and_Turkey"

- id: lang_pontus
  name: ポントス（黒海沿岸東部：トラブゾン・ギレスン・ギュミュシュハネ）
  select:
    pieces: [TUR-Trabzon, TUR-Giresun, TUR-Gumu_hane, TUR-Ordu, TUR-Samsun]
  timeline:
    - from: 1648
      main: turkish
      minor: greek
      note: ポントス・ギリシア語の正教徒の村。トラブゾン東部（オフ・トンヤ）にはギリシア語を話すムスリムの村もある。ギュミュシュハネの銀山にもギリシア人の鉱夫。
      source: "https://ja.wikipedia.org/wiki/ポントス人"
    - from: 1923
      main: turkish
      note: 第一次世界大戦中からポントスのギリシア人は強制移送や虐殺を受け、1923年の住民交換で残った人もギリシアへ移された。
      source: "https://en.wikipedia.org/wiki/Greek_genocide"

- id: lang_lazistan
  name: ラズィスタン（リゼ）
  select:
    pieces: [TUR-Rize]
  timeline:
    - from: 1648
      main: turkish
      minor: georgian
      note: 東部の沿岸（パザル・アルデシェン・フンドゥクル）はラズ人（カルトヴェリ系のラズ語）。山地のヘムシン人はアルメニア系。

- id: lang_artvin
  name: アルトヴィン（シャヴシェティ・クラルジェティ）
  select:
    pieces: [TUR-Artvin, TUR-Ardahan]
  timeline:
    - from: 1648
      main: georgian
      minor: turkish
      note: ムスリムのジョージア人（チヴェネブリ）とラズ人の地域。アルダハンにはトルコ人・テレケメ人も多い。1878–1918年はロシア領。要確認
    - from: 1950
      main: turkish
      minor: georgian
      note: 1921年にトルコ領。ムスリムのジョージア人（チュヴェネブリ）・ラズ人の多くはトルコ語を使うようになった。アルダハンはトルコ人・クルド人・アゼルバイジャン系（カラパパフ）が中心。

- id: lang_kars
  name: カルス
  select:
    pieces: [TUR-Kars]
  timeline:
    - from: 1648
      main: turkish
      minor: armenian
      note: 要塞都市カルス（アルメニアの古都）。周辺はトルコ人・クルド人・アルメニア人の村。
    - from: 1880
      main: turkish
      minor: armenian
      note: ベルリン条約（1878）でロシア領（カルス州）。ムスリムの一部（数万人）がオスマン帝国へ移り、アルメニア人（オスマン領から）・ギリシア人（コーカサス・ギリシア人）・ロシア人（モロカン派・ドゥホボール派）が入植した。1897年のカルス州ではアルメニア人約24%、トルコ人約22%、クルド人約15%、カラパパフ（テュルク系）約11%、ギリシア人約9%、ロシア人約8%で、アルメニア人とトルコ人がほぼ拮抗する。テュルク系の言葉を合わせると最大なので main はトルコ語のままとし、minor はアルメニア語。カルス市ではアルメニア人が多数。要確認
    - from: 1920
      main: turkish
      minor: kurdish
      note: 1918年にオスマン帝国、次いでアルメニア共和国。1920年のトルコ＝アルメニア戦争でトルコが取り、1921年のカルス条約で確定した。アルメニア人とロシア系・ギリシア系の住民は去った。
      source: "https://en.wikipedia.org/wiki/Treaty_of_Kars"

- id: lang_igdir
  name: スルマル（ウードゥル）
  select:
    pieces: [TUR-I_d_r]
  timeline:
    - from: 1648
      main: azerbaijani
      minor: armenian
      note: エレバン・ハン国（イラン）の一部。
    - from: 1830
      main: armenian
      minor: azerbaijani
      note: トルコマンチャーイ条約（1828）でロシア領。イランからアルメニア人が移住した。
    - from: 1920
      main: azerbaijani
      minor: kurdish
      note: 1920年にトルコ領。アルメニア人は去り、アゼルバイジャン人（テュルク系）とクルド人が多数になった。
      source: "https://en.wikipedia.org/wiki/Treaty_of_Kars"

- id: lang_armenian_plateau
  name: アルメニア高原（エルズルム・エルズィンジャン・スィヴァス・ハルプート）
  select:
    pieces: [TUR-Erzurum, TUR-Erzincan, TUR-Bayburt, TUR-Sivas, TUR-Elaz, TUR-Kayseri, TUR-Malatya, TUR-Tokat, TUR-Amasya]
  timeline:
    - from: 1648
      main: turkish
      minor: armenian
      note: アルメニア人の村と町（エルズルム、ハルプート、スィヴァス、カイセリなど）がムスリムの村と入りまじる。マラティヤ周辺はクルド人も多い。露土戦争（1828–29、1877–78）の後、エルズルムのアルメニア人の一部がロシア領へ移住した。1894–96年のアルメニア人虐殺（ハミディイェ虐殺）。
      source: "https://ja.wikipedia.org/wiki/西アルメニア"
    - from: 1915
      main: turkish
      note: 1915–16年、オスマン帝国政府（統一と進歩委員会の政権）はアナトリアのアルメニア人を強制移送し、移送の途中と虐殺で数十万〜100万人以上が死亡した（アルメニア人虐殺）。アナトリア東部・中部のアルメニア人社会はほぼ消えた。トルコ政府は「ジェノサイド」という呼び方を認めていない。
      source: "https://ja.wikipedia.org/wiki/アルメニア人虐殺"

- id: lang_kurdistan_tr
  name: クルディスタン（トルコ南東部）
  select:
    pieces: [TUR-Hakkari, TUR-rnak, TUR-Siirt, TUR-Batman, TUR-Bingol, TUR-Ad_yaman, TUR-A_r]
  timeline:
    - from: 1648
      main: kurdish
      minor: armenian
      note: クルド人の部族・首長国（ボフタン、ハッカーリなど）の地域。山地にはアッシリア人（ネストリウス派、アラム語）、アルメニア人の村がある。ビンギョルはザザ語。
    - from: 1915
      main: kurdish
      note: 1915–18年、アルメニア人とハッカリのアッシリア人（東方教会）は虐殺され、生き残りはペルシア・イラクへ逃れた。共和国では1920年代からクルド語の公の場での使用が制限され、1983–91年には法律で禁止された（2000年代に緩和）。1984年からはクルディスタン労働者党（PKK）と政府軍の紛争が続き、多くの村が退去させられ、住民は西部の大都市にも移った。
      source: "https://en.wikipedia.org/wiki/Kurds_in_Turkey"

- id: lang_dersim
  name: デルスィム（トゥンジェリ）
  select:
    pieces: [TUR-Tunceli]
  timeline:
    - from: 1648
      main: kurdish
      minor: armenian
      note: ザザ語とクルマンジー語のアレヴィー派の山地。
    - from: 1915
      main: kurdish
      note: アルメニア人は1915年に強制移送された（デルスィムのアレヴィーの一部はアルメニア人をかくまった）。1937–38年にはトルコ軍の鎮圧作戦（デルスィムの虐殺）で多くの住民が殺害・移住させられた。ザザ語もクルド語に含める。
      source: "https://en.wikipedia.org/wiki/Dersim_massacre"

- id: lang_van_bitlis
  name: ヴァン・ビトリス
  select:
    pieces: [TUR-Van, TUR-Bitlis]
  timeline:
    - from: 1648
      main: kurdish
      minor: armenian
      note: ヴァン湖周辺はアルメニア人の古くからの中心地（ヴァスプラカン）。19世紀末でもヴァン州の住民の3〜4割がアルメニア人とされる。要確認
    - from: 1915
      main: kurdish
      note: 1915年、アルメニア人は虐殺・強制移送された。ヴァンでは包囲戦の後ロシア軍が町を占領し、アルメニア人の生き残りはロシア軍の撤退とともにカフカスへ逃れた（1918年にも）。
      source: "https://ja.wikipedia.org/wiki/アルメニア人虐殺"

- id: lang_mus
  name: ムシュ平原
  select:
    pieces: [TUR-Mu]
  timeline:
    - from: 1648
      main: armenian
      minor: kurdish
      note: ムシュ平原とサスーンの山地はアルメニア人の農民が多かった。要確認
    - from: 1915
      main: kurdish
      note: 1915年、ムシュ平原のアルメニア人の村は虐殺と強制移送で失われた。
      source: "https://ja.wikipedia.org/wiki/アルメニア人虐殺"

- id: lang_diyarbakir
  name: ディヤルバクル
  select:
    pieces: [TUR-Diyarbak_r]
  timeline:
    - from: 1648
      main: kurdish
      minor: armenian
      note: 町はトルコ語・アルメニア語・クルド語・アラム語（シリア正教会）。周辺の農村はクルド人。
    - from: 1915
      main: kurdish
      note: 1915年、アルメニア人とシリア正教徒・アッシリア人（セイフォ）が虐殺・強制移送された。
      source: "https://en.wikipedia.org/wiki/Sayfo"

- id: lang_mardin_urfa
  name: マルディン・ウルファ（北メソポタミア）
  select:
    pieces: [TUR-Mardin, TUR-anl_urfa]
  timeline:
    - from: 1648
      main: kurdish
      minor: arabic
      note: マルディン・ウルファの町はアラビア語も話される。トゥール・アブディーン（ミドヤト）はシリア正教会のアラム語（トゥロヨ語）の村。ハッラーン平原はアラブ人の遊牧民。
    - from: 1915
      main: kurdish
      minor: arabic
      note: 1915年、アルメニア人とシリア正教徒（トゥル・アブディンのアッシリア人）の多くが虐殺された（セイフォ）。トゥル・アブディンのアラム語の村は、1970–90年代の紛争と国外移住で大きく減った。
      source: "https://en.wikipedia.org/wiki/Sayfo"

- id: lang_cilicia
  name: キリキア・南東部（アダナ・マラシュ・アインタブ）
  select:
    pieces: [TUR-Adana, TUR-Kahramanmara, TUR-Gaziantep, TUR-Osmaniye, TUR-Mersin, TUR-Kilis]
  timeline:
    - from: 1648
      main: turkish
      minor: armenian
      note: キリキア（かつての小アルメニア王国の地）のアルメニア人（ゼイトゥン・ハジン・アインタブ）。平野にはトゥルクメンの遊牧民、ヌサイリー派のアラブ人。1909年のアダナ虐殺。要確認
    - from: 1915
      main: turkish
      note: 1915年、キリキアのアルメニア人も強制移送された。1919–21年のフランスの占領中に一部が戻ったが、1921年のアンカラ条約でフランスが撤退すると、ほとんどがシリア・レバノンへ去った。
      source: "https://en.wikipedia.org/wiki/Franco-Turkish_War"

- id: lang_hatay
  name: アンティオキア（ハタイ）
  select:
    pieces: [TUR-Hatay]
  timeline:
    - from: 1648
      main: arabic
      minor: turkish
      note: アンティオキア（アンタキヤ）はアラビア語（スンナ派・アラウィー派・正教徒）。アムク平原にはトゥルクメン、ムーサー山にはアルメニア人の村。
    - from: 1939
      main: turkish
      minor: arabic
      note: フランス委任統治下のシリアのアレクサンドレッタ地区は、1938年のハタイ国を経て1939年にトルコへ併合された。アルメニア人やアラブ人の一部がシリアへ去った。アラビア語の住民（アラウィー派・キリスト教徒など）は今も多い。
      source: "https://ja.wikipedia.org/wiki/ハタイ県"


# ======== コーカサス南部 ========
- id: lang_georgia
  name: ジョージア（グルジア）
  select:
    iso: [GEO]
  timeline:
    - from: 1648
      main: georgian
      note: カルトリ・カヘティ・イメレティなどのジョージア人。西部はメグレル語・スヴァン語（同じカルトヴェリ系）。1801年からロシア領。

- id: lang_tbilisi
  name: トビリシ（ティフリス）
  select:
    pieces: [GEO-Tbilisi]
  timeline:
    - from: 1648
      main: georgian
      minor: armenian
      note: 商人・職人にアルメニア人が多い。
    - from: 1800
      main: armenian
      minor: georgian
      note: ロシアのカフカス総督府の所在地。1897年の調査で、アルメニア人約38%、ジョージア人約26%、ロシア人約25%。
    - from: 1925
      main: georgian
      minor: armenian
      note: ジョージアの首都になり、ジョージア人が増えた（1926年の調査でジョージア人約38%、アルメニア人約34%、ロシア人約15%）。
    - from: 1990
      main: georgian
      note: 2002年の調査でジョージア人が約85%。

- id: lang_abkhazia
  name: アブハジア
  select:
    pieces: [GEO-Abkhazia]
  timeline:
    - from: 1648
      main: caucasian
      minor: georgian
      note: アブハズ人（北西コーカサス系の言葉）。南部はメグレル人（ジョージア人）。1866年・1877年の反乱の後、多くのアブハズ人がオスマン帝国へ移住させられた（ムハジル）。空いた土地にメグレル人・ロシア人・アルメニア人・ギリシア人が入植した。
    - from: 1925
      main: georgian
      minor: caucasian
      note: ムハージル（19世紀）でアブハズ人が減ったうえに、ソ連時代にはジョージア人・ロシア人・アルメニア人の移住が進んだ（1989年でジョージア人約46%、アブハズ人約18%）。
    - from: 1993
      main: caucasian
      minor: georgian
      note: アブハジア紛争（1992–93）でジョージア人の大部分（約20万人以上）が追われた。ジョージア人が残るのは南東部のガリ地区。2011年の分離政権の調査でアブハズ人約51%、ジョージア人約19%、アルメニア人約17%。2008年にロシアが独立を承認した。
      source: "https://en.wikipedia.org/wiki/Ethnic_cleansing_of_Georgians_in_Abkhazia"

- id: lang_borchalo
  name: ボルチャロ（クヴェモ・カルトリ）
  select:
    pieces: [GEO-Kvemo_Kartli]
  timeline:
    - from: 1648
      main: azerbaijani
      minor: georgian
      note: テュルク系（アゼルバイジャン語）の牧畜民の地域。19世紀にアルメニア人・ギリシア人・ドイツ人の入植地も作られる。

- id: lang_samtskhe_javakheti
  name: サムツヘ・ジャヴァヘティ
  select:
    pieces: [GEO-Samtskhe_Javakheti]
  timeline:
    - from: 1648
      main: georgian
      minor: turkish
      note: オスマン帝国のチルドゥル州（アハルツィヘ）。ムスリムのメスヘティ人（トルコ語・ジョージア語）。
    - from: 1830
      main: armenian
      minor: georgian
      note: アドリアノープル条約（1829）でロシア領。エルズルムからアルメニア人が移住し、ジャヴァヘティはアルメニア人が多数になる。ドゥホボール派のロシア人の村も作られた。

- id: lang_shida_kartli
  name: シダ・カルトリ（南オセチアを含む）
  select:
    pieces: [GEO-Shida_Kartli, GEO-Mtskheta_Mtianeti]
  timeline:
    - from: 1648
      main: georgian
      minor: ossetian
      note: 北部の山地（ツヒンヴァリ北方・トゥルソ）にオセット人の村がある。
    - from: 1992
      main: georgian
      minor: ossetian
      note: 1991–92年の南オセチア紛争と、2008年の南オセチア戦争（ロシア＝ジョージア戦争）の後、南オセチアのジョージア人の村の住民は追われた。南オセチアはロシアの支援を受けた分離政権の支配下にある。
      source: "https://ja.wikipedia.org/wiki/南オセチア紛争_(2008年)"


- id: lang_armenia
  name: アルメニア（エレバン・ハン国など）
  select:
    iso: [ARM]
  timeline:
    - from: 1648
      main: azerbaijani
      minor: armenian
      note: イランのエレバン・ハン国。住民の多数はムスリム（テュルク系・クルド人）で、アルメニア人はエチミアジン（アルメニア教会の総本山）周辺などに住んだ。
    - from: 1830
      main: armenian
      minor: azerbaijani
      note: トルコマンチャーイ条約（1828）でロシア領になり、イランとオスマン帝国から約5万人以上のアルメニア人が移住し、多くのムスリムが去った。1897年の調査でエレバン県の住民はアルメニア人約53%、ムスリム約38%。
      source: "https://ja.wikipedia.org/wiki/トルコマンチャーイ条約"
    - from: 1950
      main: armenian
      note: 1918年にアルメニア共和国、1920年からソヴィエト・アルメニア。虐殺を逃れたアナトリアのアルメニア人と、戦後（1946–49）に国外から帰還したアルメニア人が住んだ。アゼルバイジャン人の一部は1948–50年にアゼルバイジャンへ移され、残りもナゴルノ・カラバフ紛争（1988–94）で去った。
      source: "https://ja.wikipedia.org/wiki/ナゴルノ・カラバフ紛争"

- id: lang_armenia_north
  name: アルメニア北部・南部の山地（ロリ・タヴシュ・シュニク）
  select:
    pieces: [ARM-Lori, ARM-Tavush, ARM-Syunik]
  timeline:
    - from: 1648
      main: armenian
      minor: azerbaijani
      note: ロリ・タヴシュはジョージアとの境界地帯。シュニク（ザンゲズル）はアルメニア人のメリク（領主）の地域。
    - from: 1990
      main: armenian
      note: ナゴルノ・カラバフ紛争（1988–94）で、アゼルバイジャン人はアゼルバイジャンへ去った。

- id: lang_nakhchivan
  name: ナヒチェヴァン
  select:
    pieces: [AZE-Nakhchivan_Autonomous_Republic]
  timeline:
    - from: 1648
      main: azerbaijani
      minor: armenian
      note: トルコ系（アゼルバイジャン人）の住民が多数で、アルメニア人の村も多い。1828年にロシア領になった後もムスリムが多数（1897年の調査で約6割）。
    - from: 1930
      main: azerbaijani
      note: ソ連のナヒチェヴァン自治共和国（アゼルバイジャン領、1924–）。アルメニア人は1926年の約11%から1979年の約1.4%へ減り、1980年代末にはほとんどいなくなった。宗教（rel_nakhchivan）と同じ年で切り替える。
      source: "https://en.wikipedia.org/wiki/Nakhchivan_Autonomous_Republic"

- id: lang_azerbaijan
  name: アゼルバイジャン（シルヴァン・カラバフ・ギャンジャ）
  select:
    iso: [AZE]
  timeline:
    - from: 1648
      main: azerbaijani
      minor: armenian
      note: テュルク系のアゼルバイジャン語（当時は「タタール語」と呼ばれた）。カラバフの山地はアルメニア人のメリク領。南東部はタリシュ人（イラン系）、北部はレズギン人など。1813年・1828年にロシア領。バクーは1870年代から石油の町になり、ロシア人・アルメニア人が増える。
    - from: 1990
      main: azerbaijani
      note: ナゴルノ・カラバフ紛争（1988–94）で、バクーなどのアルメニア人はアルメニアなどへ去り、アルメニアから来たアゼルバイジャン人の難民が入った。カラバフの山地は1994–2023年にアルメニア人の勢力が支配したが、2020年の戦争と2023年のアゼルバイジャンの攻撃で、アルメニア人（約10万人）のほぼ全員がアルメニアへ去った（ピースが分かれていないので地図には描いていない）。
      source: "https://ja.wikipedia.org/wiki/ナゴルノ・カラバフ紛争"

# ======== レヴァント・メソポタミア ========
- id: lang_levant
  name: シリア・レバノン・パレスチナ・ヨルダン
  select:
    iso: [SYR, LBN, ISR, JOR, "118", "124", "126", "129"]
  timeline:
    - from: 1648
