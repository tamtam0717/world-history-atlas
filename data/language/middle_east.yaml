  select:
    pieces: [IRQ-Ninawa, IRQ-Diyala]
  timeline:
    - from: 1648
      main: arabic
      minor: kurdish
      note: モスル北東のニネヴェ平原にはアッシリア人（アラム語）、シンジャル山にはヤズィーディー（クルド語）が住む。
    - from: 2014
      main: arabic
      minor: kurdish
      note: 2014–17年、「イスラム国」（IS）がモースルとニーナワー平原を支配し、キリスト教徒（アラム語）・ヤズィーディー教徒（クルド語）・シャバク人などが追われた。
