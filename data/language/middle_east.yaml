# 言語（民族）の分布：アナトリア・東トラキア・コーカサス南部・メソポタミア・レヴァント・アラビア・イラン・アフガニスタン西部（1648–1914）
# 形式は docs/language-format.md。main = 住民（特に農村の民衆）の多数派の言語、minor = 2〜3割以上の少数派。
# 範囲は1914年まで（1915年のアルメニア人虐殺、1923年のギリシア・トルコの住民交換の前の状態）。
# ザザ語はクルド語に、ラズ語はジョージア語（カルトヴェリ系）に、ギーラーン語・マーザンダラーン語・ロル語はペルシア語に、
# ガシュガーイー語はアゼルバイジャン語に含める。

# ======== アナトリア・東トラキア ========
- id: lang_anatolia_base
  name: アナトリア（下地：トルコ語）
  select:
    iso: [TUR]
  timeline:
    - from: 1648
      main: turkish
      note: ムスリムの農民・遊牧民（ユルック、トゥルクメン）はトルコ語。カラマン地方などには、トルコ語を話しギリシア文字で書く正教徒（カラマンルデス）もいた。カッパドキアの一部の村はギリシア語。クリミア・タタール人、チェルケス人（1864年の追放）、バルカンのムスリム（1878年以後）など、ロシアとバルカンから数百万人のムスリム難民（ムハジル）がアナトリアに定住した。
      source: https://ja.wikipedia.org/wiki/ムハージル

- id: lang_istanbul
  name: イスタンブル
  select:
    pieces: [TUR-stanbul]
  timeline:
    - from: 1648
      main: turkish
      minor: greek
      note: 住民の約4割が非ムスリム（ギリシア人・アルメニア人・ユダヤ人）で、フェネル地区にはコンスタンティノープル総主教座があった。ガラタ・ペラには西欧の商人も住む。

- id: lang_east_thrace
  name: 東トラキア（エディルネ・クルクラーレリ・テキルダー）
  select:
    pieces: [TUR-Edirne, TUR-K_rklareli, TUR-Tekirda]
  timeline:
    - from: 1648
      main: turkish
      minor: greek
      note: ギリシア語の村と町（ロドスト＝テキルダー、ヴィゼなど）が多い。ストランジャ山地にはブルガリア人の村、エディルネにはユダヤ人・アルメニア人もいる。

- id: lang_aegean_coast
  name: エーゲ海沿岸（イズミル・アイドゥン・バルケスィル・チャナッカレ）
  select:
    pieces: [TUR-zmir, TUR-Ayd_n, TUR-Bal_kesir, TUR-Canakkale]
  timeline:
    - from: 1648
      main: turkish
      minor: greek
      note: スミルナ（イズミル）は西欧との貿易の港で、19世紀末には市内の住民の多数がギリシア人などの非ムスリム。エーゲ海の島々からギリシア人の移住が続いた。アイヴァルク・イムロズ島などはギリシア語の町。
      source: "https://ja.wikipedia.org/wiki/イズミル"

- id: lang_pontus
  name: ポントス（黒海沿岸東部：トラブゾン・ギレスン・ギュミュシュハネ）
  select:
    pieces: [TUR-Trabzon, TUR-Giresun, TUR-Gumu_hane, TUR-Ordu, TUR-Samsun]
  timeline:
    - from: 1648
      main: turkish
      minor: greek
      note: ポントス・ギリシア語の正教徒の村。トラブゾン東部（オフ・トンヤ）にはギリシア語を話すムスリムの村もある。ギュミュシュハネの銀山にもギリシア人の鉱夫。
      source: "https://ja.wikipedia.org/wiki/ポントス人"

- id: lang_lazistan
  name: ラズィスタン（リゼ）
  select:
    pieces: [TUR-Rize]
  timeline:
    - from: 1648
      main: turkish
      minor: georgian
      note: 東部の沿岸（パザル・アルデシェン・フンドゥクル）はラズ人（カルトヴェリ系のラズ語）。山地のヘムシン人はアルメニア系。

- id: lang_artvin
  name: アルトヴィン（シャヴシェティ・クラルジェティ）
  select:
    pieces: [TUR-Artvin, TUR-Ardahan]
  timeline:
    - from: 1648
      main: georgian
      minor: turkish
      note: ムスリムのジョージア人（チヴェネブリ）とラズ人の地域。アルダハンにはトルコ人・テレケメ人も多い。1878–1918年はロシア領。要確認

- id: lang_kars
  name: カルス
  select:
    pieces: [TUR-Kars]
  timeline:
    - from: 1648
      main: turkish
      minor: armenian
      note: 要塞都市カルス（アルメニアの古都）。周辺はトルコ人・クルド人・アルメニア人の村。
    - from: 1880
      main: turkish
      minor: armenian
      note: ベルリン条約（1878）でロシア領（カルス州）。ムスリムの一部（数万人）がオスマン帝国へ移り、アルメニア人（オスマン領から）・ギリシア人（コーカサス・ギリシア人）・ロシア人（モロカン派・ドゥホボール派）が入植した。1897年のカルス州ではアルメニア人約24%、トルコ人約22%、クルド人約15%、カラパパフ（テュルク系）約11%、ギリシア人約9%、ロシア人約8%で、アルメニア人とトルコ人がほぼ拮抗する。テュルク系の言葉を合わせると最大なので main はトルコ語のままとし、minor はアルメニア語。カルス市ではアルメニア人が多数。要確認

- id: lang_igdir
  name: スルマル（ウードゥル）
  select:
    pieces: [TUR-I_d_r]
  timeline:
    - from: 1648
      main: azerbaijani
      minor: armenian
      note: エレバン・ハン国（イラン）の一部。
    - from: 1830
      main: armenian
      minor: azerbaijani
      note: トルコマンチャーイ条約（1828）でロシア領。イランからアルメニア人が移住した。

- id: lang_armenian_plateau
  name: アルメニア高原（エルズルム・エルズィンジャン・スィヴァス・ハルプート）
  select:
    pieces: [TUR-Erzurum, TUR-Erzincan, TUR-Bayburt, TUR-Sivas, TUR-Elaz, TUR-Kayseri, TUR-Malatya, TUR-Tokat, TUR-Amasya]
  timeline:
    - from: 1648
      main: turkish
      minor: armenian
      note: アルメニア人の村と町（エルズルム、ハルプート、スィヴァス、カイセリなど）がムスリムの村と入りまじる。マラティヤ周辺はクルド人も多い。露土戦争（1828–29、1877–78）の後、エルズルムのアルメニア人の一部がロシア領へ移住した。1894–96年のアルメニア人虐殺（ハミディイェ虐殺）。
      source: "https://ja.wikipedia.org/wiki/西アルメニア"

- id: lang_kurdistan_tr
  name: クルディスタン（トルコ南東部）
  select:
    pieces: [TUR-Hakkari, TUR-rnak, TUR-Siirt, TUR-Batman, TUR-Bingol, TUR-Ad_yaman, TUR-A_r]
  timeline:
    - from: 1648
      main: kurdish
      minor: armenian
      note: クルド人の部族・首長国（ボフタン、ハッカーリなど）の地域。山地にはアッシリア人（ネストリウス派、アラム語）、アルメニア人の村がある。ビンギョルはザザ語。

- id: lang_dersim
  name: デルスィム（トゥンジェリ）
  select:
