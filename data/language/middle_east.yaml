  select:
    pieces: [SYR-Al_Hasakeh, SYR-Aleppo]
  timeline:
    - from: 1648
      main: arabic
      minor: kurdish
      note: 北部の山地（クルド山＝アフリーン）とトルコとの境界地帯にクルド人の村。アレッポにはアルメニア人・トルコ語の住民も多い。

- id: lang_jerusalem
  name: エルサレム
  select:
    pieces: [ISR-Jerusalem_District]
  timeline:
