    - from: 1950
      main: kurdish
      note: 1950–51年、イラクのユダヤ人のほとんど（クルディスタンのアラム語を話すユダヤ人を含む）がイスラエルへ移った。アッシリア人（アラム語）の村も、1933年のシメレの虐殺、1988年のアンファル作戦などで減った。
