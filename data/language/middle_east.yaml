  select:
    pieces: [ARM-Lori, ARM-Tavush, ARM-Syunik]
  timeline:
    - from: 1648
      main: armenian
      minor: azerbaijani
      note: ロリ・タヴシュはジョージアとの境界地帯。シュニク（ザンゲズル）はアルメニア人のメリク（領主）の地域。

- id: lang_azerbaijan
  name: アゼルバイジャン（シルヴァン・カラバフ・ギャンジャ）
  select:
    iso: [AZE]
  timeline:
    - from: 1648
      main: azerbaijani
      minor: armenian
      note: テュルク系のアゼルバイジャン語（当時は「タタール語」と呼ばれた）。カラバフの山地はアルメニア人のメリク領。南東部はタリシュ人（イラン系）、北部はレズギン人など。1813年・1828年にロシア領。バクーは1870年代から石油の町になり、ロシア人・アルメニア人が増える。

