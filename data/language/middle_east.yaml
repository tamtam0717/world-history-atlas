    - from: 1948
      main: arabic
      note: 1948年の第1次中東戦争で約70万人のパレスチナ・アラブ人が避難・追放され、周りの国の難民キャンプに住んだ（イスラエルの地区は別に塗っている）。シリアとレバノンには、虐殺を逃れたアルメニア人の社会がある。2011年からのシリア内戦では、人口の半数近くが国内外へ避難した。
      source: "https://ja.wikipedia.org/wiki/パレスチナ難民"

- id: lang_jazira_sy
