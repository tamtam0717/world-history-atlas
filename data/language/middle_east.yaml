      main: arabic
      minor: yiddish
      note: 19世紀後半から東欧のユダヤ人の移住（第1次アリヤー1882–）が続き、エルサレム旧市街と新市街ではユダヤ人が多数になった（イディッシュ語・ラディーノ語・アラビア語。ベン・イェフダーのヘブライ語復興）。地区全体ではアラブ人の村が多い。
      source: "https://ja.wikipedia.org/wiki/アリヤー"
    - from: 1920
      main: arabic
      minor: hebrew
      note: イギリスの委任統治（1920–48）の下、ヘブライ語がユダヤ人の日常語として復活した（シオニズム）。エルサレム市ではユダヤ人が多数だが、周りの村を含めるとアラブ人が多い。
      source: "https://ja.wikipedia.org/wiki/パレスチナ委任統治領"
    - from: 1948
      main: hebrew
      note: 1948年の第1次中東戦争（イスラエルの独立）で、西エルサレムとその回廊の村のアラブ人は避難・追放された。残ったアラブ人の村はアブー・ゴーシュなど数か所だけ。
      source: "https://ja.wikipedia.org/wiki/パレスチナ難民"
    - from: 1967
      main: hebrew
      minor: arabic
      note: 1967年の第3次中東戦争で、旧市街を含む東エルサレムをイスラエルが占領・併合した（国際的には認められていない）。東エルサレムのパレスチナ人は地区の人口の約3分の1。
      source: "https://ja.wikipedia.org/wiki/エルサレム"

- id: lang_amman
