# 言語（民族）の分布：オセアニア（オーストラリア・ニュージーランド・ニューギニア・太平洋の島々）1648–2025（O3 担当、2026-11-23）
# 形式は docs/language-format.md（「オセアニア」の節）。main = 住民の多数派の民族の言語、minor = 2〜3割以上の少数派。
# - 先住民の言語は細かく分けず、オーストラリア先住民の諸語（aboriginal_australian）、パプア諸語（papuan。非オーストロネシア系）、
#   メラネシア諸語（melanesian）、フィジー語（fijian）、ポリネシア諸語（polynesian）、ミクロネシア諸語（micronesian）でまとめる。
#   パラオ語はチャモロ語（南北アメリカの担当のグアム・北マリアナ）と同じ austronesian_other。
# - 共通語のトク・ピシン（ニューギニア）・ビスラマ語（ヴァヌアツ）・ピジン（ソロモン）は民族の言語ではないので塗らず、note に書く。
# - 入植者が住民の多数になった年（オーストラリアの植民地ごと、ニュージーランドの地方ごと）で英語に切り替える。年は人口の推計にもとづく目安。
# - 宗教（data/religion/oceania.yaml）と同じ地域の分け方で、大きな変化はなるべく同じ年に切り替えている。
# - 無人島（南極・ハード島・マッコーリー島・ケルマデック諸島・ニュージーランドの亜南極諸島・クリッパートン島・
#   アメリカ領有小離島・南ライン諸島）は値を入れない。人が住みはじめた島は、その年から（ピトケアン 1790、ノーフォーク 1788、
#   ココス 1827、クリスマス島 1888、ライン諸島 1890、フェニックス諸島 1938）。

# ======== オーストラリア ========
- id: lang_nsw
  name: ニューサウスウェールズ（シドニー・キャンベラを含む）
  select:
    adm1: ["AUS/New South Wales", "AUS/Australian Capital Territory"]
    pieces: [AUS-Other_Territories]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: オーストラリア先住民（アボリジニ）の数百の言語（ダルグ語・ウィラジュリ語など。多くはパマ・ニュンガン語族）。人々は狩猟採集で暮らし、大陸全体の人口は 1788 年に 30 万〜100 万人と推計される。
      source: "https://ja.wikipedia.org/wiki/オーストラリア・アボリジニ"
    - from: 1830
      main: english
      minor: aboriginal_australian
      note: 1788 年にフィリップ総督の船団（第一船団）がシドニー湾に流刑植民地を開いた。天然痘（1789）と土地の収奪・暴力で先住民の人口は急減し、1820 年代に流刑囚と自由移民が内陸の牧羊地へ広がった（1830 年の植民者は約 4 万 6 千人）。流刑囚の約 3 割はアイルランド人。
      source: "https://ja.wikipedia.org/wiki/ニューサウスウェールズ州"
    - from: 1850
      main: english
      note: 流刑囚の送り込みは 1840 年に終わり、自由移民と 1851 年のゴールドラッシュで人口が急増した。先住民は保護区（リザーブ）に集められ、子どもを家族から引き離す政策（「盗まれた世代」、1910〜70 年ごろ）も行われた。第二次世界大戦後はイタリア・ギリシア・のちにアジア（中国・ベトナム・インドなど）からの移民が増え、シドニーは多文化の都市になった。
      source: "https://ja.wikipedia.org/wiki/盗まれた世代"
- id: lang_tasmania
  name: タスマニア（ヴァン・ディーメンズ・ランド）
  select:
    adm1: ["AUS/Tasmania"]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: タスマニア先住民（パラワ）の諸語。1642 年にタスマンが来航した。
    - from: 1820
      main: english
      minor: aboriginal_australian
      note: 1803 年にイギリスが流刑植民地を開いた（ホバート 1804）。流刑囚と入植者が増え、先住民との「ブラック・ウォー」（1824–31）が起きた。
      source: "https://ja.wikipedia.org/wiki/タスマニア州"
    - from: 1832
      main: english
      note: 生き残った先住民の多くはフリンダース島へ移され（1833–47）、人口は数百人から数十人に減った。現在は先住民の子孫がタスマニア・アボリジニとして共同体を保っている。
      source: "https://en.wikipedia.org/wiki/Black_War"
- id: lang_victoria
  name: ヴィクトリア（ポート・フィリップ）
  select:
    adm1: ["AUS/Victoria"]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: クリン人（ウルンジェリ語など）をはじめとする先住民の諸語。
    - from: 1840
      main: english
      minor: aboriginal_australian
      note: 1835 年にバットマンらがポート・フィリップ湾にメルボルンを建て、タスマニアとニューサウスウェールズから牧羊業者が押し寄せた（1840 年の植民者は約 1 万人）。
      source: "https://ja.wikipedia.org/wiki/ヴィクトリア州"
    - from: 1851
      main: english
      note: 1851 年のゴールドラッシュ（バララット・ベンディゴ）で人口は 10 年で 7 倍になった。中国人の金鉱労働者（1850 年代末に約 4 万人、成人男性の約 1 割）は note のみ。
      source: "https://ja.wikipedia.org/wiki/ゴールドラッシュ"
- id: lang_south_australia
  name: 南オーストラリア（アデレードとその周辺。東経135度以東）
  select:
    pieces: [AUS-South_Australia]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: カウルナ人・ナリンジェリ人などの先住民の諸語。
    - from: 1840
      main: english
      minor: aboriginal_australian
      note: 1836 年にウェークフィールドの組織的植民の理論にもとづく自由移民の植民地として建てられた（流刑囚を受け入れなかった）。1838 年からプロイセンの古ルター派の移民がバロッサ渓谷などに住んだ（ドイツ語を話す人は人口の 1 割弱）。
      source: "https://ja.wikipedia.org/wiki/南オーストラリア州"
    - from: 1850
      main: english
- id: lang_sa_west
  name: 南オーストラリア西部（東経132〜135度。エア半島西岸・クーバーペディ）
  select:
    pieces: [AUS-South_Australia_132_135E]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: ウィルル人・コカタ人・アナング（ピチャンチャチャラ人など）の諸語。
    - from: 1900
      main: english
      minor: aboriginal_australian
      note: エア半島西岸（セドゥナ・ストリーキーベイ）の小麦・牧羊の入植（1880〜1910 年代）、大陸横断鉄道（1917）、クーバーペディのオパール鉱山（1915–）。北部はアナング・ピチャンチャチャラ・ヤンクニチャチャラ（APY）の土地（1981 年に土地の権利が認められた）。
- id: lang_sa_far_west
  name: 南オーストラリア最西部（東経132度以西。ナラボー平原・APY の土地の西部）
  select:
    pieces: [AUS-South_Australia_west_of_132E]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: ピチャンチャチャラ語などの西部砂漠の言語。住民の多くはいまも先住民。1950〜60 年代にイギリスの核実験がマラリンガとエミュー・フィールドで行われ、住民は立ち退かされた。
      source: "https://en.wikipedia.org/wiki/British_nuclear_tests_at_Maralinga"
- id: lang_western_australia
  name: 西オーストラリア
  select:
    adm1: ["AUS/Western Australia"]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: ヌーンガー人・ワジャリ人・キンバリーの諸民族などの先住民の諸語。オランダの東インド会社の船が西海岸に来航・座礁した（ニューホランド）。
    - from: 1850
      main: aboriginal_australian
      minor: english
      note: 1829 年にスワン川植民地（パース）が開かれたが、入植者は少なく、労働力不足から 1850–68 年には流刑囚を受け入れた。
      source: "https://ja.wikipedia.org/wiki/西オーストラリア州"
    - from: 1895
      main: english
      minor: aboriginal_australian
      note: クールガーディー（1892）・カルグーリー（1893）のゴールドラッシュで、入植者の人口は 10 年で 4 倍（1901 年に約 18 万人）になった。北部のキンバリー・ピルバラには先住民が多い。
      source: "https://en.wikipedia.org/wiki/Western_Australian_gold_rushes"
    - from: 1910
      main: english
- id: lang_albany
  name: オールバニ（キング・ジョージ湾）
  select:
    pieces: [AUS-Albany]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: ヌーンガー人（ミナン）の土地。
    - from: 1830
      main: aboriginal_australian
      minor: english
      note: 1826 年にニューサウスウェールズがフランスの進出を防ぐため兵営を置いた（西オーストラリアで最初の入植地）。
    - from: 1850
      main: english
- id: lang_queensland
  name: クイーンズランド（東経141度以東）
  select:
    pieces: [AUS-Queensland]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: 先住民の諸語（ケープヨーク半島には多くの言語があった）。1770 年にクックが東海岸を北上して測量し、ポゼッション島で領有を宣言した。
    - from: 1860
      main: aboriginal_australian
      minor: english
      note: 1824 年にモートン湾に流刑植民地（のちのブリスベン）が開かれ、1842 年から自由入植が許された。1859 年にニューサウスウェールズから分かれて植民地になった。牧畜地の拡大に先住民は抵抗し、植民地の騎馬警察（ネイティヴ・ポリス）による虐殺が各地で起きた。
      source: "https://ja.wikipedia.org/wiki/クイーンズランド州"
    - from: 1875
      main: english
      minor: aboriginal_australian
      note: 入植者は 1870 年に約 11 万 5 千人。サトウキビ農園にはメラネシア（ヴァヌアツ・ソロモン）から労働者（カナカ）が集められ、強制的な徴募（ブラックバーディング）が問題になった（1863–1904。白豪主義のもとで大部分が送還された）。
      source: "https://ja.wikipedia.org/wiki/ブラックバーディング"
    - from: 1900
      main: english
- id: lang_queensland_west
  name: クイーンズランド西部（東経141度以西。マウントアイザ）
  select:
    pieces: [AUS-Queensland_west_of_141E]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: カルカドゥーン人などの先住民の諸語。
    - from: 1930
      main: english
      minor: aboriginal_australian
      note: 1880 年代からの牧畜と、マウントアイザの銅・鉛・亜鉛の鉱山（1923–）。
    - from: 1960
      main: english
- id: lang_torres_strait
  name: トレス海峡諸島
  select:
    pieces: [AUS-Torres_Strait_Islands_1872, AUS-Torres_Strait_Islands_1879]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: トレス海峡諸島民（メラネシア系）の言語。西部・中部のカラ・ラガウ・ヤ語はパマ・ニュンガン語族、東部（マレー島など）のメリアム語はパプア諸語（東トランスフライ語族）で、どちらもふつうアボリジニの諸語とは区別されるが、凡例では「オーストラリア先住民の諸語」にまとめる。1606 年にトレスが海峡を通った。クイーンズランドへの編入は 1872 年（南部）と 1879 年（北部の島々）。
      source: "https://ja.wikipedia.org/wiki/トレス海峡諸島"
    - from: 1880
      main: aboriginal_australian
      minor: japanese
      note: 木曜島の真珠貝の採取に、日本人（和歌山県などから）・マレー人・フィリピン人の潜水夫が集まった（1890 年代〜1941）。日常語はトレス海峡クレオール（英語系）が広まった。
      source: "https://en.wikipedia.org/wiki/Thursday_Island"
    - from: 1942
      main: aboriginal_australian
      note: 太平洋戦争で日本人は抑留され、住民の多くも避難した。戦後、多くの島民がクイーンズランド本土へ移った。マボ判決（1992）はマレー島の土地の権利を認め、「無主地（テラ・ヌリウス）」の考え方を否定した。
      source: "https://ja.wikipedia.org/wiki/マボ判決"
- id: lang_nt_west
  name: ノーザンテリトリー西部（東経135度以西。ダーウィン・アリススプリングス）
  select:
    pieces: [AUS-Northern_Territory_west_of_135E]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: ララキア人・ティウィ人・アランダ人・ワルピリ人などの先住民の諸語。
    - from: 1875
      main: aboriginal_australian
      minor: chinese
      note: 1869 年に南オーストラリア植民地がパーマストン（ダーウィン）を建て、陸上電信線（1872）の建設とパインクリークの金鉱に中国人の労働者が集まった（1888 年には非先住民の大多数が中国人）。
      source: "https://en.wikipedia.org/wiki/Chinese_Australians"
    - from: 1900
      main: aboriginal_australian
      minor: english
      note: 白豪主義の移民制限法（1901）で中国人は減った。1911 年にオーストラリア連邦の直轄領になった。アリススプリングスは 1929 年に鉄道が届いた。
    - from: 1970
      main: english
      minor: aboriginal_australian
      note: 第二次世界大戦（日本軍のダーウィン空襲 1942）の後、ダーウィンが成長した。1966 年のグリンジ人のストライキ（ウェーヴ・ヒル）から土地の権利の運動が広がり、1976 年の先住民土地権法で多くの土地が返還された。現在も住民の約 3 割が先住民（全国で最も高い）。
      source: "https://en.wikipedia.org/wiki/Gurindji_strike"
- id: lang_nt_east
  name: ノーザンテリトリー東部（東経135度以東。アーネムランド東部・バークリー台地）
  select:
    pieces: [AUS-Northern_Territory]
  timeline:
    - from: 1648
      main: aboriginal_australian
      note: ヨルング人などの先住民の諸語。17〜19 世紀にはスラウェシのマカッサルの漁民がナマコ（トレパン）を採りに毎年来航した（1907 年に禁止）。
      source: "https://en.wikipedia.org/wiki/Macassan_contact_with_Australia"
    - from: 1970
      main: aboriginal_australian
      minor: english
      note: ゴーヴ半島のボーキサイト鉱山とヌランバイの町（1970–）。ヨルング人のイルカラ樹皮請願（1963）は先住民の土地の権利を求めた最初の訴えの一つ。現在も住民の多数は先住民。
      source: "https://en.wikipedia.org/wiki/Yirrkala_bark_petitions"
- id: lang_norfolk
  name: ノーフォーク島
  select:
    pieces: [NFK-Norfolk_Island]
  timeline:
    - from: 1788
      main: english
      note: 1788 年にシドニーから流刑植民地が置かれた（1814 年に放棄、1825–55 年に再び重罪犯の流刑地）。それまでは無人島（かつてポリネシア人が住んだ跡がある）。
      source: "https://ja.wikipedia.org/wiki/ノーフォーク島"
    - from: 1856
      main: creole_english
      minor: english
      note: 1856 年にピトケアン島の住民（バウンティ号の反乱者とタヒチ人の子孫）194 人が移住し、英語とタヒチ語の混ざったノーフク語を話した。のちにオーストラリア本土からの移住者が増えた。
- id: lang_christmas_island
  name: クリスマス島
  select:
    pieces: [CXR-Christmas_Island]
  timeline:
    - from: 1888
      main: chinese
      minor: malay
      note: 1888 年にイギリスが併合し、燐鉱石の採掘のため中国人とマレー人の労働者が移り住んだ（それまでは無人島）。海峡植民地（シンガポール）に属し、1958 年にオーストラリアに移管された。現在も住民の多数は中国系。
      source: "https://ja.wikipedia.org/wiki/クリスマス島_(オーストラリア)"
- id: lang_cocos
  name: ココス（キーリング）諸島
  select:
    pieces: [CCK-Cocos_Keeling_Islands]
  timeline:
    - from: 1827
      main: malay
      note: 1826〜27 年にヘアとクルーニーズ＝ロスがヤシ園を開き、マレー人・ジャワ人などの労働者を住まわせた（それまでは無人島）。クルーニーズ＝ロス家の私領のような状態が 1978 年まで続いた。住民の多数はココス・マレー人。1955 年にオーストラリアに移管。
      source: "https://ja.wikipedia.org/wiki/ココス諸島"

# ======== ニュージーランド ========
# 入植者（パケハ）が全体で先住民（マオリ）を上回ったのは 1858 年ごろ。南島は早く、北島の内陸（ワイカト・キング・カントリー・
# ウレウェラ）は遅い。マオリ戦争（ニュージーランド戦争、1845–72）と土地の没収・売却で入植地が広がった。
- id: lang_north_island
  name: 北島（オークランド・ウェリントン以外のマオリの地域）
  select:
    adm1: ["NZL/Northland Region", "NZL/Waikato Region", "NZL/Bay of Plenty Region", "NZL/Gisborne Region", "NZL/Hawke's Bay Region", "NZL/Taranaki Region", "NZL/Manawatu-Wanganui Region"]
  timeline:
    - from: 1648
      main: polynesian
      note: マオリ（マオリ語）の諸部族（イウィ）。1642 年にタスマンが来航し、1769 年にクックが周航した。
      source: "https://ja.wikipedia.org/wiki/マオリ"
    - from: 1880
      main: english
      minor: polynesian
      note: 1840 年のワイタンギ条約でイギリスの植民地になった。入植者の増加と土地の売却・没収（マオリ戦争）で、内陸を除く北島の多くで入植者が多数になった。マオリの人口は 1896 年に約 4 万 2 千人まで減ったのち回復に向かった。
      source: "https://ja.wikipedia.org/wiki/ワイタンギ条約"
- id: lang_northland
  name: ノースランド（ベイ・オブ・アイランズ）
  select:
    adm1: ["NZL/Northland Region"]
  timeline:
    - from: 1648
      main: polynesian
      note: ンガプヒなどのマオリの諸部族。ベイ・オブ・アイランズのコロラレカ（ラッセル）は 1820〜30 年代に捕鯨船・交易の港としてにぎわい、1814 年に宣教師が最初に住んだ。
    - from: 1900
      main: english
      minor: polynesian
      note: 1840 年にワイタンギ条約が結ばれた地。首長ホネ・ヘケの反乱（北部戦争、1845–46）。カウリ樹脂の採取に入植者とダルマチア人が集まった。現在も住民の 3 割以上がマオリ。
      source: "https://en.wikipedia.org/wiki/Flagstaff_War"
- id: lang_auckland
  name: オークランド
  select:
    adm1: ["NZL/Auckland Region"]
  timeline:
    - from: 1648
      main: polynesian
      note: ンガーティ・ファトゥアなどのマオリの諸部族（タマキ・マカウラウ）。
    - from: 1845
      main: english
      minor: polynesian
      note: 1840 年にホブソン総督が首都オークランドを建てた（1865 年まで首都）。
      source: "https://ja.wikipedia.org/wiki/オークランド"
    - from: 1860
      main: english
    - from: 1980
      main: english
      minor: polynesian
