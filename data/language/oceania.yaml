  timeline:
    - from: 1938
      main: micronesian
      note: 1938 年からフェニックス諸島入植計画で、人口の多いギルバート諸島南部から住民が移された（それまでは無人島）。干ばつのため 1963–64 年に住民はソロモン諸島へ再び移され、いまはカントン島に数十人が住むだけ。
      source: "https://en.wikipedia.org/wiki/Phoenix_Islands_Settlement_Scheme"
- id: lang_marshall
  name: マーシャル諸島
  select:
