      note: 19 世紀後半からのヤシ園で、タヒチ人やギルバート諸島の人々が働いた（それまでは無人島）。タブアエラン（ファニング島）には太平洋横断の海底電信の中継所（1902）。キリスィマスィ（クリスマス島）では 1957–62 年にイギリスとアメリカの水爆実験が行われた。現在の住民はおもにギルバート諸島からの移住者。
      source: "https://en.wikipedia.org/wiki/Operation_Grapple"
- id: lang_phoenix_islands
