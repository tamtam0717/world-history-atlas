      note: キリバス語（ギルバート語）。1892 年にイギリスの保護領、1916 年にギルバート・エリス諸島植民地、1979 年に独立。首都タラワの南タラワに人口が集中している。
      source: "https://ja.wikipedia.org/wiki/キリバス"
- id: lang_banaba
