  select:
    pieces: [PYF-Windward_Islands]
  timeline:
    - from: 1648
      main: polynesian
      note: タヒチ語。ポマレ朝の王国（1788–1880）。1842 年にフランスの保護領、1880 年に併合。19 世紀後半には綿花農園の労働者として中国人（客家）が来た（現在も人口の約 1 割）。
