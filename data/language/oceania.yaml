      note: ナウル語（ミクロネシア諸語の中でも系統が独特）。1888 年にドイツが併合し、1906 年から燐鉱石の採掘。1920 年からオーストラリア・ニュージーランド・イギリスの委任統治（のち信託統治、実際の統治はオーストラリア）、1968 年に独立。キリバス・ツバル・中国からの労働者が多い時期もあった。
