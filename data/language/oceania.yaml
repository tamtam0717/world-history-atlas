  timeline:
    - from: 1648
      main: micronesian
      note: マーシャル語。1885 年にドイツの保護領、1914 年から日本（1920 年から南洋諸島の委任統治）、1947 年からアメリカの太平洋諸島信託統治領、1986 年に自由連合のもとで独立。ビキニ・エニウェトク環礁では 1946–58 年にアメリカの核実験が行われ（1954 年の第五福竜丸事件）、住民は移住させられた。
      source: "https://ja.wikipedia.org/wiki/マーシャル諸島"
- id: lang_fsm
  name: ミクロネシア連邦（チューク・ヤップ・コスラエ）
  select:
    iso: [FSM]
  timeline:
    - from: 1648
      main: micronesian
      note: チューク語・ヤップ語・コスラエ語など。1886 年にスペインが領有を確認し（カロリン諸島をめぐるドイツとの紛争を教皇が仲裁）、1899 年にドイツに売却、1914 年から日本の統治。
      source: "https://ja.wikipedia.org/wiki/ミクロネシア連邦"
