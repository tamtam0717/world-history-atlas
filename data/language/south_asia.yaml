# ---- 北東インド ----
- id: lang_assam
  name: アッサム
  select:
    adm1: ["IND/Assam"]
  timeline:
    - from: 1648
      main: assamese
      note: アッサム語。13 世紀にタイ系のアホーム人が王国を建てたが、支配層もしだいにアッサム語を話すようになった。上アッサムの茶園には、19 世紀からチョーター・ナーグプルの部族（ムンダ・サンタル・オラオン）の労働者が移された。
      source: "https://ja.wikipedia.org/wiki/アッサム語"
