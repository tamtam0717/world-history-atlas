      main: kannada
    - from: 1810
      main: kannada
      minor: tamil
      note: イギリスの軍の駐屯地（カントンメント、1809–）にタミル人が多く住んだ。現在は IT 産業の中心で、各地からの移住者が多い。
- id: lang_kerala
  name: ケーララ・ラクシャドウィープ・マーヘ
  select:
