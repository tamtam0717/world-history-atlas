- id: lang_tamil_nadu
  name: タミル・ナードゥ・プドゥチェリー
  select:
    adm1: ["IND/Tamil Nadu"]
    pieces: [IND-Puducherry, IND-Karaikal]
  timeline:
    - from: 1648
      main: tamil
      note: タミル語。2000 年以上の文学の伝統をもつ。北部と西部にはテルグ語・カンナダ語の話者もいる。
      source: "https://ja.wikipedia.org/wiki/タミル語"
    - from: 1920
      main: tamil
      note: ドラヴィダ運動（正義党、ペリヤールの自尊運動）がバラモン支配とヒンディー語に反対し、1967 年から DMK などドラヴィダ系の政党が州を治める。
      source: "https://en.wikipedia.org/wiki/Dravidian_movement"
- id: lang_nilgiris
  name: ニルギリ
  select:
    pieces: [IND-The_Nilgiris]
  timeline:
    - from: 1648
      main: kannada
      minor: tamil
      note: バダガ人（カンナダ語の方言）・トダ人などの高原。
    - from: 1900
      main: tamil
      minor: kannada
      note: 避暑地ウータカムンドと茶園の開発で、タミル人が多数になった。
- id: lang_telugu
  name: アーンドラ・テランガーナ
  select:
    adm1: ["IND/Andhra Pradesh", "IND/Telangana"]
  timeline:
    - from: 1648
      main: telugu
      note: テルグ語。ドラヴィダ系で話者が最も多い。1953 年に言語にもとづく最初の州（アーンドラ州）がつくられ、州再編のきっかけになった。テランガーナは 2014 年に分かれた。
      source: "https://ja.wikipedia.org/wiki/テルグ語"
- id: lang_hyderabad
  name: ハイデラバード（市）
  select:
    pieces: [IND-Hydrabad]
  timeline:
    - from: 1648
      main: telugu
      minor: hindustani
      note: ニザームの宮廷はウルドゥー語（ダッキニー）とペルシア語。ウルドゥー語を話すムスリムが市の3〜4割。

# ---- 東インド ----
