    - from: 1950
      main: bengali
      minor: assamese
      note: 東ベンガル出身のムスリムが多数になった（国勢調査ではアッサム語と答える人も多い）。
- id: lang_barak
  name: バラク渓谷（カチャール・カリムガンジ・ハイラカンディ）
