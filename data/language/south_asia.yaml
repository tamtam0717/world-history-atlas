# 言語（民族）の分布：南アジア（インド・パキスタン・バングラデシュ・スリランカ・ネパール・ブータン・モルディブ）1648–2025
# 形式は docs/language-format.md（「南アジア・東南アジア」の節）。main = 住民（特に農村）の多数派の民族の言語、minor = 2〜3割以上の少数派。
# - インドの国勢調査（1881 年から言語の集計、独立後は 1961・2011 年など）の母語の数を目安にした。
# - ヒンディー語圏の方言（ラージャスターニー・アワディー・ガルワーリー・チャッティースガリーなど）は hindustani にまとめ、note に書く。
#   ビハール州とネパールのタラーイ東部は、マイティリー語・ボージプリー語などのビハール諸語（bihari）で塗る。
# - ヒンドゥスターニー語（ヒンディー語とウルドゥー語）は、話し言葉はほぼ同じで、文字と語彙（サンスクリット系かペルシア・アラビア系か）が違う。
# - 1956 年の州再編でインドの州の境は言語にそってひかれた。地図の州のピースは、このおかげで言語の境とほぼ重なる。
# - 宗教（data/religion/south_asia.yaml）と、切り替えの年をできるだけそろえている。

# ======== インド（既定はヒンドゥスターニー語） ========
- id: lang_india
  name: 北インド（ヒンディー語圏）
  select:
    iso: [IND]
    pieces: [113-CH_IN, 119-Kalapani]   # 中印国境中部・カーラーパーニーの係争地
  timeline:
    - from: 1648
      main: hindustani
      note: ガンジス川流域のヒンディー語圏（ブラジ・アワディー・ラージャスターニーなどの方言を含む）。ムガル帝国の宮廷と行政の言葉はペルシア語で、北インドの都市と宮廷でウルドゥー語の文学が栄えた（ミール、ガーリブ）。
      source: "https://ja.wikipedia.org/wiki/ヒンドゥスターニー語"
    - from: 1950
      main: hindustani
      note: 1950 年の憲法でヒンディー語（デーヴァナーガリー文字）が連邦の公用語とされ、英語も使われ続けた。南インドではヒンディー語の押しつけに反対する運動が起きた（タミル・ナードゥ 1965）。
      source: "https://ja.wikipedia.org/wiki/インドの言語"

# ---- パンジャーブ・ハリヤーナー・デリー ----
- id: lang_punjab_in
  name: 東パンジャーブ
  select:
    adm1: ["IND/Punjab"]
  timeline:
    - from: 1648
      main: punjabi
      note: パンジャーブ語。シク教の聖典はグルムキー文字で書かれる。
      source: "https://ja.wikipedia.org/wiki/パンジャーブ語"
- id: lang_chandigarh
  name: チャンディーガル
  select:
    pieces: [IND-Chandigarh]
  timeline:
    - from: 1648
      main: punjabi
      minor: hindustani
    - from: 1953
      main: hindustani
      minor: punjabi
      note: 1953 年に州都として建設された新都市。各地から役人・商人が移り住み、母語はヒンディー語が約3分の2、パンジャーブ語は2割余り（2011）。
- id: lang_delhi
  name: デリー
  select:
    adm1: ["IND/Delhi"]
  timeline:
    - from: 1648
      main: hindustani
      note: ウルドゥー語の詩の中心地（ムガル宮廷）。
    - from: 1947
      main: hindustani
      minor: punjabi
      note: 西パンジャーブから来たパンジャーブ人（ヒンドゥー教徒・シク教徒）の難民が、デリーの人口の3分の1近くを占めた。
      source: "https://en.wikipedia.org/wiki/Punjabis_in_Delhi"
- id: lang_lahaul
  name: ラーホール・スピティ
  select:
    pieces: [IND-Lahul_Spiti]
  timeline:
    - from: 1648
      main: tibetan
      minor: hindustani
      note: スピティはチベット語。ラーホールはチベット語ではないチベット・ビルマ系の諸語（ガハリ語など）だが、郡を分けられないのでチベット語の色で塗る。
- id: lang_kinnaur
  name: キンナウル
  select:
    pieces: [IND-Kinnaur]
  timeline:
    - from: 1648
      main: tb_northeast
      minor: hindustani
      note: キンナウリ語（チベット・ビルマ系。チベット語とは別）。地図では北東インドなどのチベット・ビルマ系諸語の色で塗る。

