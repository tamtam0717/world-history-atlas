  timeline:
    - from: 1453
      main: tibetan
    - from: 1648
      main: tibetan
      note: ラダック語・バルティ語・プリグ語（チベット語の西部の方言）。バルティスターンとカルギルの住民はシーア派ムスリムだが、言語はチベット系。
      source: "https://ja.wikipedia.org/wiki/バルティ語"

# ---- グジャラート・マハーラーシュトラ・ゴア ----
- id: lang_gujarat
  name: グジャラート
  select:
    adm1: ["IND/Gujarat", "IND/Dadra and Nagar Haveli and Daman and Diu"]
  timeline:
    - from: 1648
      main: gujarati
      note: グジャラート語。スーラトは 17 世紀のムガル帝国最大の港で、イギリス・オランダの商館があった。商人（バニヤー・ジャイナ教徒・ボーホラー派のムスリム・パールシー）はインド洋の交易で活躍した。カッチはカッチー語（シンド語に近い）。
      source: "https://ja.wikipedia.org/wiki/グジャラート語"
- id: lang_maharashtra
  name: マハーラーシュトラ
  select:
    adm1: ["IND/Maharashtra"]
  timeline:
    - from: 1648
      main: marathi
      note: マラーティー語。シヴァージー（1630–80）とマラーター同盟の言葉。バクティの詩人トゥカーラーム（17 世紀）。
      source: "https://ja.wikipedia.org/wiki/マラーティー語"
- id: lang_mumbai
  name: ボンベイ（ムンバイ）
  select:
    pieces: [IND-Mumbai, IND-Mumbai_Suburban]
  timeline:
    - from: 1648
      main: marathi
      note: コーリー人（漁民）の島々。
    - from: 1700
      main: marathi
      minor: gujarati
      note: グジャラートの商人（パールシー・バニヤー・ボーホラー）が移り住んだ。1960 年のボンベイ州の分割（マハーラーシュトラとグジャラート）では、ボンベイの帰属が争われた。
      source: "https://en.wikipedia.org/wiki/Samyukta_Maharashtra_Movement"
    - from: 1990
      main: marathi
      minor: hindustani
      note: 北インドからの移住者が増え、ヒンディー語・ウルドゥー語を話す住民が4割近くになった。
- id: lang_goa
  name: ゴア
  select:
    adm1: ["IND/Goa"]
  timeline:
    - from: 1648
      main: konkani
      note: コーンカニー語。ポルトガル領の時代、行政と上流階級の言葉はポルトガル語。1987 年にコーンカニー語がゴアの公用語になった。
      source: "https://ja.wikipedia.org/wiki/コーンカニー語"

# ---- 南インド ----
