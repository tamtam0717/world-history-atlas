      minor: chinese
      note: チョロン（堤岸）は華人の商業の町。
    - from: 1978
      main: vietnamese
      note: 社会主義化（商業の国有化）と中越戦争（1979）の前後に、華人の多くがボート・ピープルとして国外へ逃れた。
