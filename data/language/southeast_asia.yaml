  name: メコン・デルタ東部（ヴィンロン・ベンチェ・ドンタップ）
  select:
    pieces: [VNM-V_nh_Long, VNM-B_n_Tre, VNM-ng_Thap]
  timeline:
    - from: 1648
      main: khmer
    - from: 1760
      main: vietnamese
      minor: khmer
      note: デルタ東部はベトナム人の入植が早かった（ヴィンロン 1732）。
    - from: 1850
      main: vietnamese
- id: lang_khmer_krom
