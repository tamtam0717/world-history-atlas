# 言語（民族）の分布：東南アジア 1648–2025
# 形式は docs/language-format.md（「南アジア・東南アジア」の節）。main = 住民（特に農村）の多数派の民族の言語、minor = 2〜3割以上の少数派。
# - 華人（中国語の諸方言：福建・潮州・広東・客家・海南）は、東アジアと同じ chinese で塗る。シャム・ジャワなどで同化が進んだ華人
#   （プラナカン）は、その時期に応じて note に書く。
# - インドネシアの共通語（インドネシア語＝マレー語）が広まった後も、「民族」の言語（ジャワ語・スンダ語など）で塗る。
# - 宗教（data/religion/southeast_asia.yaml）と、切り替えの年をできるだけそろえている。

# ======== ミャンマー ========
- id: lang_myanmar
  name: 上ビルマ（ビルマ語）
  select:
    iso: [MMR]
  timeline:
    - from: 1648
      main: burmese
      note: ビルマ語。エーヤワディー（イラワジ）川の中流域（アヴァ・マンダレーの周辺）がビルマ人の中心地。
      source: "https://ja.wikipedia.org/wiki/ビルマ語"
- id: lang_lower_burma
  name: 下ビルマ（ペグー・ラングーンとデルタ）
  select:
    pieces: [MMR-Bago, MMR-Yangon_East, MMR-Yangon_North, MMR-Yangon_South, MMR-Yangon_West, MMR-Hinthada, MMR-Maubin, MMR-Myaungmya, MMR-Pathein, MMR-Pyapon, MMR-Labutta]
  timeline:
    - from: 1648
      main: mon
      minor: burmese
      note: モン人の地（ペグー〈バゴー〉はかつてのモンの王都）。タウングー朝の支配下で、ビルマ人も住む。1740–57 年にはモン人の復興ペグー王国があった。
      source: "https://ja.wikipedia.org/wiki/モン族"
    - from: 1760
      main: burmese
      minor: mon
      note: コンバウン朝のアラウンパヤーがペグーを滅ぼし（1757）、ビルマ人の移住と同化が進んだ。
      source: "https://ja.wikipedia.org/wiki/コンバウン王朝"
    - from: 1880
      main: burmese
      minor: karen
      note: イギリス領になった下ビルマでは、デルタの開墾（米の輸出）で上ビルマからの移住が進んだ。デルタにはカレン人も多い。ラングーン市は 1931 年にインド系の住民が過半数だった。
      source: "https://en.wikipedia.org/wiki/Burmese_Indians"
- id: lang_lower_burma_cities
  name: ラングーン・ペグー（1880 年以後）
  select:
    pieces: [MMR-Bago, MMR-Yangon_East, MMR-Yangon_North, MMR-Yangon_South, MMR-Yangon_West]
  timeline:
    - from: 1880
      main: burmese
      note: ラングーン市の人口の過半数はインド系（ベンガル・タミル・テルグ・ヒンドゥスターニーなど。1931）だったが、日本軍の侵攻（1942）と独立後の国有化（1962–）で多くが去った。ラングーン市のインド系は下の lang_yangon で斜線にしている。
- id: lang_yangon
  name: ラングーン市（インド系の住民）
  select:
    pieces: [MMR-Yangon_East, MMR-Yangon_North, MMR-Yangon_South, MMR-Yangon_West]
  timeline:
    - from: 1880
      main: burmese
      minor: tamil
      note: 英領インドの一州として、インドから労働者・商人が流れ込み、1931 年にはラングーン市の人口の過半数がインド系だった。言語はテルグ語・タミル語・ベンガル語（チッタゴン方言）・ヒンドゥスターニー語などに分かれるので、斜線は南インドからの移民を代表してタミル語の色で示す（宗教の地図ではヒンドゥー教の斜線）。
      source: "https://en.wikipedia.org/wiki/Burmese_Indians"
    - from: 1942
      main: burmese
      note: 日本軍の侵攻（1942）でインド系の住民の多くがインドへ逃れ、1962 年以後の国有化でさらに去った。
- id: lang_mon
  name: モン州（モーラミャイン・タトン）
  select:
    pieces: [MMR-Mawlamyine, MMR-Thaton]
  timeline:
    - from: 1648
      main: mon
      minor: karen
      note: モン語。タトンは古いモンの都。
    - from: 1850
      main: mon
      minor: burmese
      note: モーラミャイン（モールメイン）は第1次英緬戦争（1824–26）の後、イギリス領テナセリムの中心になった。
- id: lang_kayin
  name: カイン州（カレン州）・カヤー州
  select:
    pieces: [MMR-Hpa_An, MMR-Hpapun, MMR-Kawkareik, MMR-Myawaddy, MMR-Loikaw, MMR-Bawlake]
  timeline:
    - from: 1648
      main: karen
      minor: burmese
      note: スゴー・カレン人・ポー・カレン人、カヤー（カレンニー）人。1949 年からカレン民族同盟（KNU）の武装闘争が続いた。
      source: "https://ja.wikipedia.org/wiki/カレン族"
- id: lang_shan
  name: シャン州
  select:
    pieces: [MMR-Taunggyi, MMR-Loilen, MMR-Langkho, MMR-Kengtung, MMR-Monghsat, MMR-Tachileik, MMR-Lashio, MMR-Muse, MMR-Kyaukme]
  timeline:
    - from: 1648
      main: shan
      minor: burmese
      note: シャン人（タイ系）の諸侯（ソーボワ）の国々。ビルマの王の宗主権のもとで自治を保った。パオ人・パラウン人・ラフ人なども住む。
      source: "https://ja.wikipedia.org/wiki/シャン族"
- id: lang_wa
  name: ワ地域
  select:
    pieces: [MMR-Matman, MMR-Hopang]
  timeline:
    - from: 1648
      main: mon_khmer_hill
      minor: shan
      note: ワ人（モン・クメール系のワ語）。現在はワ州連合軍の事実上の自治地域。
- id: lang_kokang
  name: コーカン
  select:
    pieces: [MMR-Laukkaing]
  timeline:
    - from: 1648
      main: chinese
      note: 中国語（雲南の方言）を話す漢人の地。
- id: lang_kachin
  name: カチン州・ナガ丘陵
  select:
    pieces: [MMR-Myitkyina, MMR-Bhamo, MMR-Mohnyin, MMR-Puta_O, MMR-Hkamti]
  timeline:
    - from: 1648
      main: tb_northeast
      minor: shan
      note: カチン人（ジンポー語・リス語・ラワン語など）・ナガ人の山地と、谷のシャン人。1961 年からカチン独立軍の武装闘争。
      source: "https://ja.wikipedia.org/wiki/カチン族"
- id: lang_chin
  name: チン州
  select:
    pieces: [MMR-Falam, MMR-Hakha, MMR-Mindat]
  timeline:
    - from: 1648
      main: tb_northeast
      note: チン人（ミゾ人と同系）の諸言語。
- id: lang_arakan
  name: アラカン（ラカイン）
  select:
    pieces: [MMR-Mrauk_U, MMR-Kyaukpyu, MMR-Thandwe]
  timeline:
    - from: 1648
      main: burmese
      note: ラカイン人（ラカイン語はビルマ語の古い方言）。ミャウー朝（–1785）は、ベンガル湾の交易とポルトガル人傭兵で栄えた。
      source: "https://ja.wikipedia.org/wiki/アラカン"
- id: lang_sittwe
  name: シットウェー
  select:
    pieces: [MMR-Sittwe]
  timeline:
    - from: 1648
      main: burmese
    - from: 1880
      main: burmese
      minor: rohingya
      note: ラカイン人とロヒンギャの混住地。
- id: lang_maungdaw
  name: ラカイン北部（マウンドー・ブティダウン）
  select:
    pieces: [MMR-Maungdaw]
  timeline:
    - from: 1648
      main: burmese
      minor: rohingya
      note: ロヒンギャ語（チッタゴン方言に近いインド・アーリア系）を話すムスリムが古くから住んだとされるが、その起源と時期はミャンマー政府との間で争点になっている。
      source: "https://ja.wikipedia.org/wiki/ロヒンギャ"
    - from: 1880
      main: rohingya
      minor: burmese
      note: イギリス領の時代にベンガルとの移住が増え、ロヒンギャが多数になった。1978 年・1991–92 年にも大量の難民がバングラデシュへ逃れた。
    - from: 2017
      main: rohingya
      minor: burmese
      note: 2017 年の国軍の掃討作戦で、70 万人以上がバングラデシュ（コックスバザール）へ逃れた。残る住民の構成ははっきりしない。

# ======== タイ ========
- id: lang_thailand
  name: タイ中部・南部（シャム）
  select:
    iso: [THA]
  timeline:
    - from: 1648
      main: thai
      note: タイ語（シャム語。南部は南タイ方言）。アユタヤ朝（–1767）、トンブリー朝、ラタナコーシン朝（1782–）。
      source: "https://ja.wikipedia.org/wiki/タイ語"
    - from: 1939
      main: thai
      note: ピブーン政権が国名をシャムからタイに改め（1939）、「タイ人」としての国民統合と華人の同化を進めた。
      source: "https://ja.wikipedia.org/wiki/プレーク・ピブーンソンクラーム"
- id: lang_bangkok
  name: バンコク
  select:
    adm1: ["THA/Bangkok", "THA/Samut Prakan Province", "THA/Nonthaburi Province"]
  timeline:
    - from: 1648
      main: thai
      note: アユタヤの外港の町。
    - from: 1782
      main: thai
      minor: chinese
      note: ラタナコーシン朝の都。米の輸出と精米業を担った華人（潮州人が多い）が、20 世紀初めには市の人口の半分近くを占めた。
      source: "https://ja.wikipedia.org/wiki/タイの華人"
    - from: 1960
      main: thai
      note: 華人の多くはタイ社会に同化し、タイ語を話すようになった（タイ人の多くが華人の祖先をもつ）。
- id: lang_lanna
  name: 北タイ（ランナー）
  select:
    adm1: ["THA/Chiang Mai Province", "THA/Chiang Rai Province", "THA/Lampang Province", "THA/Lamphun Province", "THA/Phrae Province", "THA/Nan Province", "THA/Phayao Province"]
  timeline:
    - from: 1648
      main: lanna
      note: 北タイ語（カム・ムアン）。ランナー王国は 1558–1775 年にビルマの支配下にあり、その後シャムの宗主権の下に入り、1899 年に直轄化された。山地にはカレン人・モン人・アカ人・ラフ人などの山地民が住む。
      source: "https://ja.wikipedia.org/wiki/ラーンナー王国"
- id: lang_mae_hong_son
  name: メーホンソン
  select:
    adm1: ["THA/Mae Hong Son Province"]
  timeline:
    - from: 1648
      main: shan
      minor: karen
      note: シャン人（タイ・ヤイ）とカレン人の地。
- id: lang_tak
  name: ターク
  select:
    adm1: ["THA/Tak Province"]
  timeline:
    - from: 1648
      main: thai
      minor: karen
- id: lang_isan
  name: タイ東北部（イサーン）
  select:
    adm1: ["THA/Amnat Charoen Province", "THA/Bueng Kan Province", "THA/Chaiyaphum Province", "THA/Kalasin", "THA/Khon Kaen Province", "THA/Loei Province", "THA/Maha Sarakham Province", "THA/Mukdahan Province", "THA/Nakhon Phanom Province", "THA/Nong Bua Lam Phu Province", "THA/Nong Khai Province", "THA/Roi Et Province", "THA/Sakon Nakhon Province", "THA/Ubon Ratchathani Province", "THA/Udon Thani Province", "THA/Yasothon Province"]
  timeline:
    - from: 1648
      main: lao
      note: ラーオ人の地（ラーオ語）。17 世紀のコーラート高原は人口のまばらな地域で、ラーオ人の大規模な移住は 18 世紀後半〜19 世紀前半。この時期、シャムはラオスの諸王国を服属させ、メコン川の東の住民をイサーンへ強制移住させた（ヴィエンチャンのアヌ王の反乱 1826–28 の後など）。
      source: "https://ja.wikipedia.org/wiki/イーサーン"
    - from: 1950
      main: lao
      minor: thai
      note: 学校とメディアで標準タイ語が広まり、住民は「コン・イサーン」（タイ国民）としての意識を強めた。言語はラーオ語（イサーン語）。
- id: lang_khorat
  name: ナコーンラーチャシーマー（コーラート）
  select:
    adm1: ["THA/Nakhon Ratchasima Province"]
  timeline:
    - from: 1648
      main: thai
      minor: lao
      note: コーラート方言（タイ語の一種）とラーオ語。
- id: lang_surin
  name: スリン
  select:
    adm1: ["THA/Surin Province"]
  timeline:
    - from: 1648
      main: khmer
      minor: lao
      note: 北クメール語の話者とクーイ人（モン・クメール系）が多い。
- id: lang_buriram
  name: ブリーラム・シーサケート
  select:
    adm1: ["THA/Buri Ram Province", "THA/Si Sa Ket Province"]
  timeline:
    - from: 1648
      main: lao
      minor: khmer
- id: lang_deep_south
  name: タイ深南部（パッターニー・ヤラー・ナラーティワート）
  select:
    adm1: ["THA/Pattani Province", "THA/Yala Province", "THA/Narathiwat Province"]
  timeline:
    - from: 1648
      main: malay
      minor: thai
      note: マレー語（パタニ方言）を話すマレー系ムスリム。
- id: lang_satun
  name: サトゥーン
  select:
    adm1: ["THA/Satun Province"]
  timeline:
    - from: 1648
      main: malay
      minor: thai
      note: クダのスルタンの領地。
    - from: 1909
      main: thai
      minor: malay
      note: シャム領となった後、住民の多くはタイ語を話すムスリムになった。

# ======== ラオス ========
- id: lang_laos
  name: ラオス（ラーオ語）
  select:
    iso: [LAO]
  timeline:
    - from: 1648
      main: lao
      note: ラーオ語。ラーンサーン王国は 1707 年にルアンパバーンとヴィエンチャン、1713 年にチャンパーサックの3王国に分かれた。フランス領の時代（1893–1953）には、ヴィエンチャンなどの都市にベトナム人の役人・商人が移り住み、1940 年代にはヴィエンチャンの人口の過半数がベトナム人だったとされる（地図では郡を分けていないので塗らない）。
      source: "https://ja.wikipedia.org/wiki/ラーオ語"
- id: lang_laos_north
  name: ラオス北部の山地（ポンサーリー・ルアンナムター・ウドムサイ）
  select:
    pieces: [LAO-Phongsaly, LAO-Luang_Namtha, LAO-Oudomxay]
  timeline:
    - from: 1648
      main: mon_khmer_hill
      minor: tibeto_burman
      note: クム人（モン・クメール系）、アカ人・プーノーイ人（チベット・ビルマ系）、タイ・ルー人などの山地。
- id: lang_laos_hmong
  name: シエンクアン・サイソンブン・フアパン
  select:
    pieces: [LAO-Xiangkhouang, LAO-Xaisomboun, LAO-Houaphan]
  timeline:
    - from: 1648
      main: lao
      minor: mon_khmer_hill
      note: プアン人（ラーオ系）のシエンクアン王国。
    - from: 1850
      main: lao
      minor: hmong_mien
      note: 19 世紀に中国南部からモン人（ミャオ族）が移り住んだ。ラオス内戦ではモン人の多くがアメリカの CIA の「秘密戦争」に動員され、1975 年以後、多くが難民としてタイ・アメリカへ逃れた。
      source: "https://ja.wikipedia.org/wiki/モン族_(東南アジア)"
- id: lang_laos_south_hills
  name: ラオス南部の山地（セコン・アッタプー）
  select:
    pieces: [LAO-Xekong, LAO-Attapeu]
  timeline:
    - from: 1648
      main: mon_khmer_hill
      minor: lao
      note: カトゥ人・タリアン人・ラヴェン人などのモン・クメール系の山地民。

# ======== カンボジア ========
- id: lang_cambodia
  name: カンボジア
  select:
    iso: [KHM]
  timeline:
    - from: 1648
      main: khmer
      note: クメール語（カンボジア語）。チャム人（チャム語）、ベトナム人、華人もいる。
      source: "https://ja.wikipedia.org/wiki/クメール語"
    - from: 1970
      main: khmer
      note: ロン＝ノル政権（1970）のもとでベトナム人の虐殺と追放が起き、クメール・ルージュ（1975–79）は少数民族と都市の住民を迫害した。人口の4分の1近くが命を落としたとされる。
      source: "https://ja.wikipedia.org/wiki/カンボジア大虐殺"
- id: lang_phnom_penh
  name: プノンペン
  select:
    pieces: [KHM-Phnom_Penh]
  timeline:
    - from: 1648
      main: khmer
    - from: 1880
      main: khmer
      minor: chinese
      note: フランス保護国の首都。華人とベトナム人がクメール人と並ぶ住民だった。
    - from: 1975
      main: khmer
- id: lang_cambodia_highlands
  name: カンボジア東北部の山地（ラタナキリ・モンドルキリ）
  select:
    adm1: ["KHM/Ratanakiri Province", "KHM/Mondulkiri"]
  timeline:
    - from: 1648
      main: mon_khmer_hill
      minor: khmer
      note: プノン人・タンプアン人・クルン人（モン・クメール系）とジャライ人（チャム系）。
    - from: 2000
      main: khmer
      minor: mon_khmer_hill
      note: 道路の整備と農園開発で、低地からクメール人が移り住んだ。

