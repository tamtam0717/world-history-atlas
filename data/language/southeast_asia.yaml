- id: lang_ho_chi_minh
  name: サイゴン・チョロン（ホーチミン）
  select:
    pieces: [VNM-Ho_Chi_Minh]
  timeline:
    - from: 1648
      main: khmer
    - from: 1700
      main: vietnamese
    - from: 1800
