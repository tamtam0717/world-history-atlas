    - from: 1900
      main: hungarian
    - from: 1944
      main: hungarian
      note: 1944年のドイツ占領の後、地方のユダヤ人（約44万人）がアウシュヴィッツへ送られた。ブダペストのユダヤ人も多くが殺害された。ハンガリーのユダヤ人の多くはハンガリー語を話していたので、言語の地図は変わらない。
      source: "https://en.wikipedia.org/wiki/The_Holocaust_in_Hungary"

