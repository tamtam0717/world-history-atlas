      minor: hungarian
      note: ブダはオスマン帝国のブダ州の州都。ムスリムの軍人・役人と、ハンガリー人・ユダヤ人・南スラヴ人の住民。
    - from: 1690
      main: german
      minor: hungarian
      note: 1686年の奪回の後、ムスリムは去り、ドイツ人の市民が町を再建した。19世紀前半のペスト・ブダは住民の多数がドイツ語。
    - from: 1870
