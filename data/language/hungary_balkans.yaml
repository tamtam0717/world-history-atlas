# 言語（民族）の分布：ハンガリー王国（ハンガリー・スロヴァキア・トランシルヴァニア・ヴォイヴォディナ・クロアチア）・
# ルーマニア・スロヴェニア・バルカン半島・ギリシア・キプロス（1648–1914）
# 形式は docs/language-format.md。main = 住民（特に農村の民衆）の多数派の言語、minor = 2〜3割以上の少数派。
# セルビア語・クロアチア語・ボスニア語（ボシュニャク人）・モンテネグロ語はセルボ・クロアチア語（serbocroatian）にまとめる。
# マケドニアのスラヴ語はブルガリア語・マケドニア語（bulgarian）。アルーマニア語（ヴラフ人）とメグレノ・ルーマニア語は romanian に含める。
# バルカンでは民族の帰属が言語より宗教（正教会の総主教座・ブルガリア総主教代理座・イスラーム）で決まることが多く、
# 19世紀末の統計は国ごとに大きく食い違う。とくにマケドニアは「要確認」が多い。

# ======== ハンガリー（現在の国境の内側） ========
- id: lang_hungary_base
  name: ハンガリー（下地：ハンガリー語）
  select:
    iso: [HUN]
  timeline:
    - from: 1648
      main: hungarian
      note: 1648年、中部・南部はオスマン帝国領（ブダ州など）で、150年の戦乱で人口が大きく減っていた。町にはドイツ語の市民、ユダヤ人も多い。カルロヴィッツ条約（1699）・パッサロヴィッツ条約（1718）の後、ハプスブルク家と領主が荒廃した土地にドイツ人（ドナウ・シュヴァーベン人）・スロヴァキア人・セルビア人などを入植させ、王国は多民族のモザイクになる。アウスグライヒ（1867）の後、ハンガリー政府はマジャル化政策（学校でのハンガリー語教育など）を進め、都市のドイツ人・ユダヤ人の多くがハンガリー語に移った。
      source: https://ja.wikipedia.org/wiki/ドナウ・シュヴァーベン人
    - from: 1920
      main: hungarian
      note: 1920年のトリアノン条約で、ハンガリーは領土の約3分の2を失い、約300万人のハンガリー人が国外（チェコスロヴァキア・ルーマニア・ユーゴスラヴィア）に残された。国内はハンガリー語がほとんどになる。
      source: "https://ja.wikipedia.org/wiki/トリアノン条約"

