# 言語（民族）の分布：東アジア（中国・台湾・日本・朝鮮・モンゴル）とシベリア・極東（1648–2025）
# 形式は docs/language-format.md。「民族」でそろえる：回族は中国語を話すので chinese（宗教の地図でイスラーム）、
# 満洲人は 19 世紀に多くが中国語に移ったが、民族として多い所は manchu_tungusic で示す。
# 切り替えの年は宗教（data/religion/east_asia.yaml）とそろえている。ゆっくり進む移住・同化の年は目安。

# ======== 中国 ========
- id: lang_china
  name: 中国本土
  select:
    iso: [CHN]
  timeline:
    - from: 1648
      main: chinese
      note: 漢語（中国語）。北方の官話のほか、呉語（上海・蘇州）・粤語（広東語）・閩語（福建・台湾）・客家語・湘語・贛語など、互いに通じにくい方言（方言群）に分かれる。書き言葉（文言・漢文）は共通。
      source: "https://ja.wikipedia.org/wiki/中国語"
    - from: 1920
      main: chinese
      note: 文学革命（白話運動）で口語の書き言葉が広まり、国語（北京語を基にした標準語）の普及が始まる。中華人民共和国では普通話と簡体字（1956）。
      source: "https://ja.wikipedia.org/wiki/文学革命"

# ---- チベット ----
- id: lang_tibet
  name: チベット（ウ・ツァン、カム、アムド）
