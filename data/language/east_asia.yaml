      source: "https://ja.wikipedia.org/wiki/盛京"
    - from: 1800
      main: chinese
      note: 山東・河北からの漢人の移住が続き、満洲人も多くが漢語を話すようになった（現在の遼寧省の満洲族は人口の1割あまり）。
