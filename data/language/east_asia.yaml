  timeline:
    - from: 1648
      main: tibetan
      note: チベット人。アムド（青海）・カム（四川西部）の方言は、ラサの言葉と大きく異なる。アバ（四川）にはチャン族（羌族）も住む。
      source: "https://ja.wikipedia.org/wiki/チベット語"
- id: lang_diqing
