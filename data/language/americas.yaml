- id: lang_nyc
  name: ニューヨーク市
  select:
    pieces: [USA-New_York_NY, USA-Kings_NY, USA-Queens_NY, USA-Bronx_NY, USA-Richmond_NY]
  timeline:
    - from: 1453
      main: algonquian
      note: レナペ人（マンシー語）
    - from: 1626
      main: algonquian
      minor: dutch
      note: ニューアムステルダム（1626）
    - from: 1640
      main: dutch
      minor: algonquian
    - from: 1648
      main: dutch
      minor: algonquian
      note: ニューアムステルダム。オランダ語のほか、フランス語（ワロン人）・英語など 18 の言語が話されたという。周辺はレナペ（マンシー）人の地。
      source: "https://ja.wikipedia.org/wiki/ニューアムステルダム"
    - from: 1700
      main: dutch
      minor: english
      note: 1664 年にイングランドが奪い、ヨーク公にちなんでニューヨークと改名した。
    - from: 1740
      main: english
      minor: dutch
      note: ブルックリン（キングズ郡）の農村では 19 世紀初めまでオランダ語が話された。
    - from: 1800
      main: english
    - from: 1850
      main: english
      minor: german
      note: ドイツ系（クラインドイッチュラント）とアイルランド系（英語）の移民が急増した。
    - from: 1900
      main: english
      minor: yiddish
      note: 東欧からのユダヤ人の大移民（1881–1924）。ロウアー・イースト・サイドではイディッシュ語の新聞・劇場が栄えた。イタリア系の移民も多い。
      source: "https://en.wikipedia.org/wiki/History_of_the_Jews_in_New_York_City"
    - from: 1950
      main: english
      minor: spanish
      note: ユダヤ人の 2 世以降は英語が日常語になった。プエルトリコからの移住（1950 年代の「大移住」）、のちにドミニカ人などの中南米の移民。
