# 言語（民族）の分布：南北アメリカ 1453–2025
# 1453–1647 は 2026-11-25 に W7 が追加（各地域の timeline の先頭の項目と、末尾の until: 1647 の地域）。1648 年以後の値は変えていない。
# 形式は docs/language-format.md（「南北アメリカ」の節）。main = 住民の多数派の民族の言語、minor = 2〜3割以上の少数派。
# - 先住民の言語は、語族ごとの大きな分け方（アルゴンキン・イロコイ・スー・マスコギ・ナ・デネ・ナワトル・マヤ・ケチュア・アイマラ・
#   トゥピ・グアラニーなど）で塗る。17 世紀の先住民の分布は、多くの集団が移動・合流した後の 18 世紀の知見による推定を含む目安。
# - 「民族」でそろえる方針の、アメリカ大陸での当てはめ（docs/language-format.md）：
#   - メスティーソ（先住民とヨーロッパ人の混血）・ムラート・パルド（ブラジル）は、スペイン語・ポルトガル語を話し、国民として自らを
#     とらえる人々として、spanish / portuguese で塗る。先住民の言語を話す・先住民として自らをとらえる人が多数の地域だけを先住民の色にする。
#   - アフリカ系の住民は、クレオール語を話す所（ジャマイカ・ハイチ・小アンティル・スリナム・ガラ）はクレオール語の色、ヨーロッパの言語を
#     話す所（アメリカ合衆国南部・ブラジル・キューバなど）はその言語の色にして note に書く。
#   - 移民の国（アメリカ合衆国・カナダ・アルゼンチン・ウルグアイ・ブラジル南部）では、移民の言語が日常に使われた 1〜2 世代の間だけ
#     minor（斜線）で示し、英語・スペイン語・ポルトガル語への同化が進んだ時点で外す（例：ブエノスアイレスのイタリア系 1880–1940）。
# - 先住民が多数だった土地に入植者が多数になる変化は、「入植者が住民の多数になった年」の目安で切り替える。
# - 宗教（data/religion/americas.yaml）と、地域の分け方と切り替えの年をできるだけそろえている。

# ================================================================
# アメリカ合衆国
# ================================================================
- id: lang_us_base
  name: 北アメリカの先住民の地（アメリカ合衆国の範囲。地域ごとの言語は下の小さい地域で示す）
  select:
    iso: [USA]
    exclude: [USA-Guam, USA-Commonwealth_of_the_Northern_Mariana_Islands, USA-American_Samoa]
  timeline:
    - from: 1453
      main: algonquian
    - from: 1648
      main: algonquian
      note: 下の小さい地域がない所の既定値。
- id: lang_new_england
  name: マサチューセッツ・コネティカット・ロードアイランド
  select:
    adm1: ["USA/Massachusetts", "USA/Connecticut", "USA/Rhode Island"]
  timeline:
    - from: 1453
      main: algonquian
    - from: 1630
      main: algonquian
      minor: english
      note: プリマス（1620）・マサチューセッツ湾（1630）
    - from: 1640
      main: english
      minor: algonquian
    - from: 1648
      main: english
      minor: algonquian
      note: ピューリタンの大移住（1630 年代、約 2 万人）。ワンパノアグ・ナラガンセット・ペクォート・マサチューセット（アルゴンキン系）の人々は疫病とペクォート戦争（1637）で減っていた。エリオットはマサチューセット語の聖書（1663）を出した。
      source: "https://ja.wikipedia.org/wiki/ニューイングランド"
    - from: 1680
      main: english
      note: フィリップ王戦争（1675–76）で先住民の多くが殺され、奴隷として売られた。
- id: lang_nne
  name: ニューハンプシャー・ヴァーモント・メイン
  select:
    adm1: ["USA/New Hampshire", "USA/Vermont", "USA/Maine"]
  timeline:
    - from: 1453
      main: algonquian
    - from: 1648
      main: algonquian
      note: アベナキ人などワバナキ連合の地。
    - from: 1760
      main: english
      note: ヌーヴェル・フランスの滅亡（1760）で、ニューイングランドからの入植が内陸へ進んだ。
    - from: 1890
      main: english
      minor: french
      note: フランス系カナダ人が繊維工場・製材所の労働者として移住した（ニューハンプシャー・メインの住民の 2 割前後）。
    - from: 1950
      main: english
- id: lang_new_hampshire
  name: ニューハンプシャー
  select:
    pieces: [USA-New_Hampshire]
  timeline:
    - from: 1453
      main: algonquian
    - from: 1630
      main: algonquian
      minor: english
    - from: 1648
      main: algonquian
      minor: english
      note: ペナクック・アベナキ人の地。海岸の 4 つの町（ポーツマス・ドーヴァー・エクセター・ハンプトン）にイングランド人が千人ほど住んでいた。
    - from: 1720
      main: english
      note: ワバナキ連合との戦争（1688–1725）の間も入植が内陸へ進んだ。
    - from: 1890
      main: english
      minor: french
      note: フランス系カナダ人が繊維工場（マンチェスターのアモスケグ）の労働者として移住した。
    - from: 1950
      main: english
