    - from: 1648
      main: iroquoian
      note: イロコイ連邦（ハウデノサウニー）の五部族（1722 年にタスカローラが加わり六部族）。「大いなる平和の法」による連合。毛皮交易をめぐるビーバー戦争（1640–1701）でヒューロン・エリーなどを滅ぼした。
      source: "https://ja.wikipedia.org/wiki/イロコイ連邦"
    - from: 1790
      main: english
      minor: iroquoian
      note: 独立戦争でイロコイの多く（オナイダ・タスカローラ以外）がイギリス側につき、サリヴァン遠征（1779）で村々が焼かれた。戦後、土地の大部分が売却された。
    - from: 1810
      main: english
      note: ニューイングランドからの入植が急増した（エリー運河 1825）。
