      minor: polish
      note: ルテニア人（ユニエイト）の農民、ポーランド語の貴族・町人、町のユダヤ人。リヴィウ（ルヴフ／レンベルク）はポーランド語とユダヤ人の都市。1772年からオーストリア領ガリツィア。
      source: "https://ja.wikipedia.org/wiki/ガリツィア・ロドメリア王国"

- id: lang_steppe_nogai
