    adm1: ["POL/West Pomeranian Voivodeship", "POL/Lubusz Voivodeship", "POL/Lower Silesian Voivodeship"]
    pieces: [POL-S_upsk, POL-powiat_s_upski, POL-powiat_l_borski, POL-powiat_bytowski, POL-powiat_cz_uchowski, POL-powiat_malborski, POL-powiat_nowodworski, POL-Sopot, POL-powiat_sztumski, POL-powiat_kwidzy_ski, POL-Elbl_g, POL-powiat_elbl_ski, POL-powiat_braniewski, POL-powiat_lidzbarski, POL-powiat_bartoszycki, POL-powiat_k_trzy_ski, POL-powiat_w_gorzewski, POL-powiat_go_dapski, POL-powiat_brzeski, POL-powiat_nyski, POL-powiat_namys_owski, POL-powiat_prudnicki, POL-powiat_pilski, POL-powiat_z_otowski]
  timeline:
