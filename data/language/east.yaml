# ======== ウクライナ ========
- id: lang_ukraine_base
  name: ウクライナ（下地：ウクライナ語）
  select:
    iso: [UKR]
  timeline:
    - from: 1648
      main: ukrainian
      note: 農民とコサックはウクライナ語（当時は「ルテニア語」「小ロシア語」）。右岸（ドニエプル川の西）の貴族はポーランド語。町にはユダヤ人が多い。1648年はフメリニツキーの乱の年。1863年のヴァルーエフ指令、1876年のエムス法で、ロシア帝国内のウクライナ語の出版が制限される。都市ではロシア語が広がる。
      source: "https://ja.wikipedia.org/wiki/フメリニツキーの乱"

- id: lang_galicia_ua
