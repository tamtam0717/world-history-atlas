# ======== ベラルーシ ========
- id: lang_belarus
  name: ベラルーシ（白ルテニア）
  select:
    iso: [BLR]
  timeline:
    - from: 1648
      main: belarusian
      note: 農民はベラルーシ語（当時は「ルテニア語」）。貴族（シュラフタ）はポーランド語化していた。町と小都市（シュテットル）にはユダヤ人が多い。1696年、リトアニア大公国の公用語がルテニア語からポーランド語に替わる。
    - from: 1800
      main: belarusian
      note: ポーランド分割（1772・1793・1795）でロシア領。農民はベラルーシ語のままで、貴族と町の上層はポーランド語、町と小都市にはユダヤ人が多い。ロシア語はまだ官吏と軍人の言葉。
    - from: 1863
      main: belarusian
      minor: russian
      note: 1863年の1月蜂起の後、ロシア化政策が強まり（ポーランド語の学校・出版の禁止、ユニエイトの正教への編入は1839年）、官吏・学校・都市の言葉としてロシア語が広がる。1897年の調査でもベラルーシ語を母語とする者は、ミンスク・ヴィテプスク・モギリョフ・グロドノの4県で多数派。ユダヤ人は町の住民の5〜6割。minor のロシア語は主に都市と官吏。
    - from: 1960
      main: belarusian
      minor: russian
      note: ソ連時代、特に1960年代以後のロシア語化で、都市ではロシア語が日常語になった（2009年の調査で家庭でロシア語を話す人は約7割）。農村ではベラルーシ語とロシア語の混ざった話し方（トラシャンカ）が多い。この地図は「民族」で塗るので、住民の多数（約8割）を占めるベラルーシ人の色にし、ロシア語は斜線で示す。1994年以後のルカシェンコ政権もロシア語を重んじ、1995年の国民投票でロシア語も国家語になった。
      source: "https://en.wikipedia.org/wiki/Russification_of_Belarus"

