# ======== ベラルーシ ========
- id: lang_belarus
  name: ベラルーシ（白ルテニア）
  select:
    iso: [BLR]
  timeline:
    - from: 1648
      main: belarusian
      note: 農民はベラルーシ語（当時は「ルテニア語」）。貴族（シュラフタ）はポーランド語化していた。町と小都市（シュテットル）にはユダヤ人が多い。1696年、リトアニア大公国の公用語がルテニア語からポーランド語に替わる。
    - from: 1800
      main: belarusian
      minor: russian
      note: ポーランド分割（1772・1793・1795）でロシア領。1863年の1月蜂起の後、ロシア化政策が強まり、官吏・都市の言葉としてロシア語が広がる。要確認（ロシア語は主に都市と官吏。1897年の調査では農村の多数派はベラルーシ語）
    - from: 1880
      main: belarusian
      note: 1897年の調査でベラルーシ語を母語とする者は、ミンスク・ヴィテプスク・モギリョフ・グロドノの4県で多数派。ユダヤ人は町の住民の5〜6割。

