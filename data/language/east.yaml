      note: 1920年代のウクライナ化政策の後、1932–33年の大飢饉（ホロドモール）で数百万人が死亡した。1930年代から都市ではロシア語が広がる。ホロコースト（1941–44）で町のユダヤ人の大部分が殺害された。
      source: "https://ja.wikipedia.org/wiki/ホロドモール"
    - from: 1991
      main: ukrainian
      note: 1991年に独立。都市部（特に東部・南部）ではロシア語の話者が多いが、2014年と2022年のロシアの侵攻の後、ウクライナ語に切り替える人が増えた。2022年以後、数百万人が国外へ避難している。

