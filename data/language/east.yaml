# 言語（民族）の分布：ポーランド・ベラルーシ・ウクライナ・モルドヴァ・ロシア西部・北カフカス・カスピ海東岸（1648–1914）
# 形式は docs/language-format.md。main = 住民（特に農村の民衆）の多数派の言語、minor = 2〜3割以上の少数派。
# ユダヤ人（イディッシュ語）は、ポーランド＝リトアニアとロシアの「ユダヤ人定住区域（パレ）」の町では住民の3〜6割を占めたが、
# 農村を含めた地域全体では1〜2割のため、大きな都市のピースだけ minor にして、ほかは note に書く。
# カシューブ語・シロンスク方言・マズーリ方言はポーランド語に、ルシン語（レムコ・ボイコ・フツル）はウクライナ語に、
# カレリア語・ヴェプス語・イングリア語はフィンランド語に、ノガイ語・クムク語・カラチャイ＝バルカル語は tatar（その他のテュルク系）に含める。

# ======== ポーランド（現在の国境の内側） ========
- id: lang_poland_base
  name: ポーランド（下地：ポーランド語）
  select:
    iso: [POL]
  timeline:
    - from: 1648
      main: polish
      note: 町にはユダヤ人（イディッシュ語）が多く、住民の3〜5割を占める町も多い。シュラフタ（貴族）・農民ともにポーランド語。
      source: "https://ja.wikipedia.org/wiki/ポーランドのユダヤ人の歴史"
    - from: 1942
      main: polish
      note: ホロコースト（1941–45）で、ポーランドのユダヤ人（戦前は約330万人、人口の約1割）の約9割が殺害された。町の住民の3〜5割を占めたユダヤ人の社会は失われた。1945年の国境の西方移動と住民の移動・追放の後、ポーランドはほぼポーランド語だけの国になる。
      source: "https://ja.wikipedia.org/wiki/ホロコースト"

- id: lang_pl_west_german
  name: ポンメルン・ノイマルク・下シュレジエン（ドイツ語の地域）
