      note: 中世の東方植民以来、ドイツ語が多数の地域（シュレジエンはハプスブルク家領、1742年からプロイセン領。ポンメルン・ノイマルクはブランデンブルク＝プロイセン領）。
      source: "https://ja.wikipedia.org/wiki/東方植民"
    - from: 1946
      main: polish
      note: 第二次世界大戦の末期（1945年）のドイツ人の避難と、1945–47年の追放で、オーデル・ナイセ線より東のドイツ人はほとんどいなくなった。代わりに、中央ポーランドからの移住者と、ソ連領になった東部（クレスィ）から移されたポーランド人が住んだ。追放の大部分は1946年に行われたので、1946年で切り替える。
