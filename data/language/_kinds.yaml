# ---- 追加（アフリカのデータ作成時） ----
#   アフロ・アジア系：アラビア語（黄）・ベルベル語（砂色）は既存。エチオピアのセム系＝金〜黄土（アムハラ語・ティグリニャ語・グラゲ語）、
#     クシ系＝橙〜茶（オロモ語・ソマリ語・アファール語・ベジャ語ほか）、オモ系＝カーキ、チャド系＝珊瑚色（ハウサ語ほか）。
#   ナイル・サハラ系＝れんが色〜赤茶（カヌリ・ソンガイ・テダ・フール・ヌビア・ナイル系・中央スーダン系）。
#   ニジェール・コンゴ系は広いので二つに分けた：西アフリカ（大西洋・マンデ・グル・クワ・ヴォルタ＝ニジェール・ウバンギ）＝紫〜赤紫、
#     バントゥー系（グラスフィールドを含む）＝緑〜青緑（地域ごとにまとめた）。
#   コイサン諸語＝くすんだ薔薇色、マダガスカル語＝オーストロネシア系の青緑、アフリカーンス語＝ゲルマン系の青、ポルトガル語系クレオール＝ポルトガル語の橙を濃くした色。
