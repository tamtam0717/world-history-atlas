# 言語（民族）の分布：アフリカ（サハラ以南・インド洋の島々。北アフリカは west.yaml）1648–2025
# 形式は docs/language-format.md（「アフリカ」の節に語族のまとめ方と色の方針）。
# - F5 担当（2026-11-21）。宗教（data/religion/africa.yaml）と同じ地域・同じ年で切り替えている。
# - 「民族」で塗る方針：都市の共通語（スワヒリ語・リンガラ語・ハウサ語・英語・フランス語など）ではなく、住民の多数の民族の言語を main にした。
# - ピースは現代の州・県なので、17–18 世紀の民族の分布は目安。移動の大きかった所（ムフェカネ、フラニ人・ソマリ人の移動、オロモ人の北上など）は note に書いた。

- id: lang_af_mauritania
  name: モーリタニア
  select:
    iso_all: [MRT]
  timeline:
    - from: 1648
      main: arabic
      minor: berber
      note: ハッサーニーヤ（アラビア語の方言）。シャル・ブッバ戦争（1644–74）の後、アラブ系の戦士集団が優位になり、ベルベル語（ゼナーガ語）は南西部の一部に残るだけになっていった。
      source: "https://ja.wikipedia.org/wiki/ハッサーニーヤ語"
    - from: 1750
      main: arabic
      note: ゼナーガ語の話者はごく少数になる。
