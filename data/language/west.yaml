      source: "https://ja.wikipedia.org/wiki/フランス領アルジェリア"
    - from: 1962
      main: arabic

- id: lang_algiers_capital
  name: アルジェ市
  select:
    pieces: [DZA-Alger]
  timeline:
    - from: 1648
      main: arabic
      minor: turkish
      note: アルジェはオスマン帝国の摂政領の首都で、支配層はトルコ系の軍人（イェニチェリ）。
    - from: 1830
      main: arabic
    - from: 1850
      main: arabic
      minor: french
      note: フランスの征服（1830–）のあと、フランス人・スペイン人・イタリア人・マルタ人の入植者がアルジェ市に集まる。
    - from: 1880
      main: french
      minor: arabic
      note: 1880年代にはアルジェ市の住民の約3分の2がヨーロッパ系（フランス人のほか、スペイン人・イタリア人・マルタ人。1870年のクレミュー令でフランス市民になったユダヤ人も多い）。スペイン語・イタリア語・マルタ語の住民もフランス語に同化していく。アラビア語・ベルベル語の住民は旧市街（カスバ）と周辺。要確認（ピースは現在のアルジェ県で、郊外の村を含む）
      source: "https://ja.wikipedia.org/wiki/フランス領アルジェリア"
    - from: 1950
      main: arabic
      minor: french
      note: 1930–50年代に農村から多くのアルジェリア人がアルジェに移り住み、ムスリムの住民がヨーロッパ系を上回った。
    - from: 1962
      main: arabic
      note: アルジェリア戦争（1954–62）の後、1962年の独立とともに、ヨーロッパ系の住民（ピエ・ノワール）約90万人とユダヤ人の大部分がフランスへ去った。
      source: "https://ja.wikipedia.org/wiki/ピエ・ノワール"

- id: lang_oran
  name: オラン
  select:
    regions: [oran]
  timeline:
    - from: 1648
      main: arabic
      minor: spanish
      note: オランは1509年以来スペインの要塞都市（1708–32年はアルジェ領）。周辺の部族はアラビア語。
    - from: 1792
      main: arabic
      note: 1792年、スペインがオランを手放す。
    - from: 1850
      main: arabic
      minor: spanish
      note: フランス領になったオラン地方にスペイン人の入植者が大量に入る。19世紀末にはオラン市のヨーロッパ人の多数がスペイン系。要確認
    - from: 1880
      main: spanish
      minor: arabic
      note: ピースはオラン市とその周辺（約1,500 km²）にあたり、19世紀後半にはヨーロッパ系（多くがスペイン語話者、次いでフランス語）が多数になる。宗教データ（カトリックが多数）と合わせた。比率は要確認
    - from: 1930
      main: french
      minor: arabic
      note: スペイン系の住民の子孫も多くはフランス語を使うようになり、ヨーロッパ系の住民が多数の町だった。
    - from: 1962
      main: arabic
      note: 1962年の独立でヨーロッパ系の住民はほとんどフランスへ去った。
      source: "https://ja.wikipedia.org/wiki/ピエ・ノワール"

