    pieces: [MAR-Province_de_Fquih_Ben_Saleh, MAR-Province_de_Khouribga]
  timeline:
    - from: 1648
      main: arabic
      note: 中世にアラブ系の遊牧部族が入ったため、早くからアラビア語化した平野。
    - from: 1907
      main: arabic
      minor: french
      note: 1907年にフランス軍がカサブランカに上陸、1912年にフランスの保護国。カサブランカにヨーロッパ人が急増する。要確認（州全体では少数）
    - from: 1960
      main: arabic
      note: 1956年の独立後、フランス系・スペイン系の住民の多くが去った。フランス語は教育・経済の言語として残る。

