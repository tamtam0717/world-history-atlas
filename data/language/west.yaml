# 言語（民族）の分布：フランス・イベリア半島・ブリテン諸島・アイスランド・北アフリカ・マルタ（1648–1914）
# 形式は docs/language-format.md。main = 住民（特に農村の民衆）の多数派の言語、minor = 2〜3割以上の少数派。
# 大きな地域（国全体）で下地を書き、小さな地域で例外を上書きする（いちばん小さい地域が優先）。
# 方言連続体の扱い：オイル諸語（ピカルディ語・ワロン語・ガロ語など）とフランコ・プロヴァンサル語は french に、
# アストゥリアス語・アラゴン語は spanish に、ガリシア語は galician（ポルトガル語に近い別の色）に、コルシカ語・モナコ語は italian に含める。

# ======== フランス ========
- id: lang_france_base
  name: フランス（下地：フランス語＝オイル諸語の地域）
  select:
    regions: [france_kingdom, savoy_duchy, nice_county, avignon_comtat, corsica, monaco]
    iso: [FRA]
  timeline:
    - from: 1648
      main: french
      note: 北フランスの民衆はピカルディ語・ノルマン語・ガロ語などのオイル諸語を話し、パリの標準フランス語とは差があった。リヨン・サヴォワ・フランシュ＝コンテ南部はフランコ・プロヴァンサル語（ここではフランス語に含める）。
    - from: 1950
      main: french
      note: 20世紀には学校・兵役・ラジオなどを通じて地域語の話者が急速に減り、ほとんどの地方でフランス語が日常語になった。イタリア・ポーランド・スペイン・ポルトガル、戦後はマグリブ・西アフリカからの移民が都市に住む。
      source: "https://en.wikipedia.org/wiki/Languages_of_France"

- id: lang_occitan
  name: 南フランス（オック語の地域）
  select:
    pieces: [FRA-Agen, FRA-Arcachon, FRA-Aubusson, FRA-Bellac, FRA-Bergerac, FRA-Blaye, FRA-Bordeaux, FRA-Brive_la_Gaillarde, FRA-Confolens, FRA-Dax, FRA-Gueret, FRA-Langon, FRA-Lesparre_Medoc, FRA-Libourne, FRA-Limoges, FRA-Marmande, FRA-Mont_de_Marsan, FRA-Nontron, FRA-Nerac, FRA-Pau, FRA-Perigueux, FRA-Rochechouart, FRA-Sarlat_la_Caneda, FRA-Tulle, FRA-Ussel, FRA-Villeneuve_sur_Lot, FRA-Ambert, FRA-Aurillac, FRA-Brioude, FRA-Clermont_Ferrand, FRA-Issoire, FRA-Largentiere, FRA-Le_Puy_en_Velay, FRA-Mauriac, FRA-Privas, FRA-Riom, FRA-Saint_Flour, FRA-Thiers, FRA-Yssingeaux, FRA-Die, FRA-Nyons, FRA-Valence, FRA-Montlucon, FRA-Aix_en_Provence, FRA-Apt, FRA-Arles, FRA-Avignon, FRA-Barcelonnette, FRA-Briancon, FRA-Brignoles, FRA-Carpentras, FRA-Castellane, FRA-Digne_les_Bains, FRA-Draguignan, FRA-Forcalquier, FRA-Gap, FRA-Grasse, FRA-Istres, FRA-Marseille, FRA-Toulon]
    adm1: ["FRA/Occitanie"]
    exclude: [FRA-Perpignan, FRA-Ceret, FRA-Prades]
  timeline:
    - from: 1648
      main: occitan
      minor: french
      note: 農村の民衆の言葉はオック語（ガスコーニュ語・ラングドック語・プロヴァンス語・リムーザン語・オーヴェルニュ語など）。1539年のヴィレル＝コトレの勅令以来、公文書と教養層の言葉はフランス語。フェリー法（1881–82）の無償・義務の初等教育で、学校ではフランス語だけが使われ、若い世代と都市からフランス語化が進む。それでも1914年の時点で、農村の多数派はまだオック語を日常に話していた。
    - from: 1950
      main: french
      minor: occitan
      note: 第一次世界大戦の後、農村でもフランス語化が進み、1950年代には子どもはほとんどフランス語で育つようになった。オック語は年配の人と農村に残る。
      source: "https://en.wikipedia.org/wiki/Occitan_language"
    - from: 1980
      main: french
      note: 今のオック語の話者は数十万人（地域の人口の数%）とされる。

- id: lang_nice
  name: ニース
  select:
    pieces: [FRA-Nice]
  timeline:
    - from: 1648
      main: occitan
      minor: italian
      note: ニース伯領（サヴォイア家領）の民衆はオック語のニース方言。行政と教養層の言葉はイタリア語。
    - from: 1860
      main: occitan
      minor: french
      note: トリノ条約（1860）でフランスに割譲され、イタリア語に代わってフランス語化が進む。
    - from: 1930
      main: french

- id: lang_basque_fr
  name: フランス領バスク（ラブール・低ナバラ）
  select:
    pieces: [FRA-Bayonne]
  timeline:
    - from: 1648
      main: basque
      minor: occitan
      note: 内陸の農村はバスク語。バイヨンヌ市とアドゥール川沿いはガスコーニュ語（オック語）。
    - from: 1960
      main: french
      minor: basque
      note: 北バスク（フランス領）のバスク語の話者は今は住民の約2割。

- id: lang_bearn_soule
  name: ベアルンとスール
  select:
    pieces: [FRA-Oloron_Sainte_Marie]
  timeline:
    - from: 1648
      main: occitan
      minor: basque
      note: ベアルンはガスコーニュ語（オック語）。西端のスール地方はバスク語。
    - from: 1950
      main: french
      minor: occitan
    - from: 1980
      main: french

- id: lang_roussillon
  name: ルシヨン（北カタルーニャ）
  select:
    pieces: [FRA-Perpignan, FRA-Ceret, FRA-Prades]
  timeline:
    - from: 1648
      main: catalan
      note: ピレネー条約（1659）でフランス領になるが、民衆はカタルーニャ語を話し続けた。
    - from: 1880
      main: catalan
      minor: french
      note: 学校教育と鉄道で、ペルピニャンを中心にフランス語化が進む。
    - from: 1950
      main: french
      minor: catalan

- id: lang_lower_brittany
  name: 低ブルターニュ（ブルトン語の地域）
  select:
    pieces: [FRA-Brest, FRA-Chateaulin, FRA-Quimper, FRA-Morlaix, FRA-Lannion, FRA-Guingamp, FRA-Lorient, FRA-Pontivy, FRA-Vannes]
  timeline:
    - from: 1648
      main: breton
      note: サン＝ブリユーからヴァンヌ東方を結ぶ線より西の農村は、ほぼブルトン語だけを話した。東の「高ブルターニュ」はガロ語（オイル諸語）。
    - from: 1880
      main: breton
      minor: french
      note: 学校でのブルトン語禁止（「シンボル」の罰）が広がり、港町・都市からフランス語化が進む。1914年でも農村はブルトン語が多数。
    - from: 1960
      main: french
      minor: breton
      note: 1950年ごろ、低ブルターニュでは住民の大部分がまだブルトン語を話したが、子どもへの継承は1950年代にほぼ止まった。
      source: "https://en.wikipedia.org/wiki/Breton_language"
    - from: 1990
      main: french
      note: ブルトン語の話者は約20万人（2010年代）に減り、その多くは高齢者。ディワン学校などの復興の動きもある。

- id: lang_saint_brieuc
  name: サン＝ブリユー（ブルトン語とガロ語の境界）
  select:
    pieces: [FRA-Saint_Brieuc]
  timeline:
    - from: 1648
      main: breton
      minor: french
      note: 言語境界がこの地域を通る。西半分はブルトン語、東半分はガロ語。
    - from: 1950
      main: french
      minor: breton
    - from: 1980
      main: french

- id: lang_westhoek
  name: フランス領フランドル（ヴェストフーク）
  select:
    pieces: [FRA-Dunkerque]
  timeline:
    - from: 1648
      main: dutch
      note: ダンケルク・アズブルック周辺の農村はフラマン語（西フラマン方言）。1662年にダンケルクがフランス領、1678年のナイメーヘン条約で周辺もフランス領になる。
    - from: 1800
      main: dutch
      minor: french
      note: ダンケルク市などの都市はフランス語化。農村は20世紀までフラマン語が多数。
    - from: 1950
      main: french
      note: フランス領フランドルのフラマン語は、20世紀に大きく後退した。

- id: lang_alsace
  name: アルザス
  select:
    pieces: [FRA-Altkirch, FRA-Colmar, FRA-Mulhouse, FRA-Thann, FRA-Selestat, FRA-Molsheim, FRA-Haguenau, FRA-Saverne]
  timeline:
    - from: 1648
      main: german
      note: アルザス語（アレマン方言）。ウェストファリア条約（1648）とストラスブール併合（1681）でフランス領になるが、民衆の言葉はドイツ語のまま。ヴォージュ山中の一部（ヴァル・ドルベなど）はロマンス系。
      source: "https://ja.wikipedia.org/wiki/アルザス語"
    - from: 1918
      main: german
      note: 1918年にフランス領（1940–44年はドイツが事実上併合）。日常語はドイツ語の方言（アルザス語）のままだが、学校と行政はフランス語になった。
      source: "https://ja.wikipedia.org/wiki/アルザス語"
    - from: 1970
      main: french
      minor: german
      note: 戦後、アルザス語の継承は急速に減り、1970年代以後は若い世代の多くがフランス語だけを話す。2012年の調査でアルザス語を話せる人は約43%。
      source: "https://ja.wikipedia.org/wiki/アルザス語"

- id: lang_strasbourg
  name: ストラスブール
  select:
    pieces: [FRA-Strasbourg]
  timeline:
    - from: 1648
      main: german
    - from: 1800
      main: german
      minor: french
      note: フランス革命後、都市の上・中層にフランス語が広がる。1871–1918年はドイツ帝国領でドイツ語が公用語。
    - from: 1960
      main: french
      minor: german

- id: lang_german_lorraine
  name: ドイツ語圏ロレーヌ（モーゼル東部）
  select:
    pieces: [FRA-Forbach, FRA-Sarreguemines, FRA-Thionville, FRA-Sarrebourg]
  timeline:
    - from: 1648
      main: german
      minor: french
      note: ロレーヌ・フランケン方言とルクセンブルク方言の地域。言語境界はティオンヴィル・サールブールの付近を通り、西側はフランス語。
    - from: 1970
      main: french
      minor: german
      note: モーゼルのドイツ語方言（フランケン方言）は戦後に急速に後退した。

- id: lang_metz
  name: メス
  select:
    pieces: [FRA-Metz]
  timeline:
    - from: 1648
      main: french
      minor: german
      note: メス市と周辺はフランス語（ロレーヌ方言）。東部の農村はドイツ語。
    - from: 1919
      main: french
      note: 1918年にフランス領。ドイツから来た住民はドイツへ去った。

- id: lang_corsica
  name: コルシカ島
  select:
    regions: [corsica]
  timeline:
    - from: 1648
      main: italian
      note: コルシカ語（トスカーナ方言に近いイタリア系の言葉）。ジェノヴァ領の時代は書き言葉もイタリア語。ヴェルサイユ条約（1768）でフランス領。19世紀後半からフランス語が公用語として広がるが、民衆はコルシカ語を話し続けた。
    - from: 1960
      main: french
      minor: italian
      note: 20世紀にフランス語が広まり、コルシカ語（イタリア語に近い。地図ではイタリア語の色）は二番目の言語になった。1970年代から言語・自治の運動が強まる。
      source: "https://en.wikipedia.org/wiki/Corsican_language"

- id: lang_monaco
  name: モナコ
  select:
    regions: [monaco]
  timeline:
    - from: 1648
      main: italian
      minor: occitan
      note: モナコ語（リグリア語＝イタリア系の方言）。周辺はオック語。
    - from: 1861
      main: italian
      minor: french
      note: ロクブリュヌとマントンをフランスに売却（1861）。カジノ開業（1863）とともにフランス語の住民が増える。要確認（19世紀末には外国人が多数）。
    - from: 1950
      main: french
      note: モネガスク語（リグリア方言）とイタリア語は後退し、フランス語が中心。


# ======== イベリア半島 ========
- id: lang_spain_base
  name: スペイン（下地：カスティーリャ語の地域）
  select:
    iso: [ESP]
  timeline:
    - from: 1648
      main: spanish
      note: アストゥリアス語・アラゴン語の山地の方言はここではカスティーリャ語（スペイン語）に含める。
    - from: 1939
      main: spanish
      note: フランコ政権（1939–75）はカスティーリャ語（スペイン語）以外の言語の公の場での使用を抑えた。1978年の憲法で、カタルーニャ語・バスク語・ガリシア語は自治州の公用語になった。
      source: "https://en.wikipedia.org/wiki/Francoist_Spain"

- id: lang_catalonia
  name: カタルーニャ
  select:
    adm1: ["ESP/Cataluña/Catalunya"]
  timeline:
    - from: 1648
      main: catalan
      note: 新国家基本令（1716）でカタルーニャの諸制度が廃止され、行政・法廷の言葉がカスティーリャ語になるが、民衆はカタルーニャ語を話し続けた。19世紀にはカタルーニャ語の文芸復興（ラナシェンサ）。
      source: "https://ja.wikipedia.org/wiki/新国家基本令"
    - from: 1970
      main: catalan
      minor: spanish
      note: 1950–70年代にアンダルシアなどから多くの人がバルセロナ周辺に移り住み、スペイン語を第一言語とする人が増えた（2018年の調査ではカタルーニャ全体で、第一言語がスペイン語の人が約52%、カタルーニャ語が約31%）。地方（ジローナ・リェイダ）ではカタルーニャ語が多数。1983年からカタルーニャ語を中心にした教育（言語の没入）が行われている。地図ではカタルーニャ語を主にし、スペイン語を斜線で示す（要確認）。
      source: "https://en.wikipedia.org/wiki/Catalan_language"

- id: lang_valencia
  name: バレンシア
  select:
    adm1: ["ESP/Comunitat Valenciana"]
  timeline:
    - from: 1648
      main: catalan
      minor: spanish
      note: 沿岸の平野はバレンシア語（カタルーニャ語）。西部の内陸（アラゴン・カスティーリャとの境）はカスティーリャ語を話す地域が帯状に続く。1609年のモリスコ追放のあと、空いた土地にアラゴンなどから入植者が入った。
    - from: 1970
      main: spanish
      minor: catalan
      note: バレンシア語（カタルーニャ語）は、カステリョ県と内陸北部ではまだ多数だが、バレンシア市とアリカンテ県南部ではスペイン語が中心になった。
      source: "https://en.wikipedia.org/wiki/Valencian"

- id: lang_balearics
  name: バレアレス諸島
  select:
    adm1: ["ESP/Illes Balears"]
  timeline:
    - from: 1648
      main: catalan
      note: マジョルカ語・メノルカ語（カタルーニャ語）。メノルカ島は1708–1802年の大部分がイギリス領だったが、言葉は変わらない。
    - from: 1970
      main: catalan
      minor: spanish
      note: 1960年代からの観光の発展で、スペイン本土と外国からの移住者が多くなった。

- id: lang_andorra
  name: アンドラ
  select:
    regions: [andorra]
  timeline:
    - from: 1648
      main: catalan

- id: lang_gipuzkoa
  name: ギプスコア・ビスカヤ（バスク語の地域）
  select:
    pieces: [ESP-Gipuzkoa, ESP-Bizkaia]
  timeline:
    - from: 1648
      main: basque
      minor: spanish
      note: 農村はほぼバスク語。ビルバオ市とビスカヤ西端（エンカルタシオネス）はカスティーリャ語。ビルバオ周辺の鉱山・製鉄業に各地から労働者が集まり、ビスカヤの工業地帯はカスティーリャ語が多数になる。農村はバスク語のまま。
    - from: 1950
      main: spanish
      minor: basque
      note: ビルバオなどの工業化とスペイン各地からの移住、フランコ政権の抑圧でバスク語の話者は減った。1980年代からバスク語の学校（イカストラ）と公教育での復興が進み、ギプスコアでは今も住民の約半数がバスク語を話す。ビスカヤはスペイン語が中心。
      source: "https://en.wikipedia.org/wiki/Basque_language"

- id: lang_alava_navarra
  name: アラバ・ナバラ
  select:
    pieces: [ESP-Alava, ESP-Navarra]
  timeline:
    - from: 1648
      main: spanish
      minor: basque
      note: ナバラ北部のピレネー山地とアラバ北部はバスク語。南部（リベラ地方、アラバ南部）はカスティーリャ語。18〜19世紀にバスク語の地域は北へ後退していく。
    - from: 1950
      main: spanish
      note: バスク語はナバラ北部の山地にだけ残る。

- id: lang_galicia
  name: ガリシア
  select:
    adm1: ["ESP/Galicia"]
  timeline:
    - from: 1648
      main: galician
      note: ガリシア語（ポルトガル語と同じ系統の言葉）。都市の上層と行政はカスティーリャ語。
    - from: 1970
      main: galician
      minor: spanish
      note: 都市（ア・コルーニャ・ビーゴ）ではスペイン語が広がったが、農村を中心にガリシア語が多数。


- id: lang_portugal
  name: ポルトガル
  select:
    iso: [PRT]
  timeline:
    - from: 1648
      main: portuguese
      note: 北東端のミランダ・ド・ドウロではミランダ語（アストゥリアス・レオン語系）が話される。

# ======== ブリテン諸島 ========
- id: lang_england
  name: イングランド
  select:
    adm1: ["GBR/England"]
    pieces: [GBR-Isles_of_Scilly]
  timeline:
    - from: 1648
      main: english

- id: lang_cornwall
  name: コーンウォール
  select:
    pieces: [GBR-Cornwall]
  timeline:
    - from: 1648
      main: english
      minor: cornish
      note: コーンウォール語は西部（ペンウィス・ケリア）にだけ残っていた。
    - from: 1750
      main: english
      note: コーンウォール語は18世紀後半に日常語として話されなくなる（「最後の話者」ドリー・ペントリース、1777年没）。
      source: "https://ja.wikipedia.org/wiki/コーンウォール語"

- id: lang_wales
  name: ウェールズ
  select:
    adm1: ["GBR/Wales"]
  timeline:
    - from: 1648
      main: welsh
      minor: english
      note: ウェールズのほぼ全域で民衆はウェールズ語を話した。英語はイングランドとの境界地帯と町の上層。南ウェールズの炭田・製鉄業にイングランドから労働者が流入。1891年の調査でウェールズ語の話者は約54%。
    - from: 1950
      main: welsh
      minor: english
      note: 1951年の調査でウェールズ全体のウェールズ語話者は約29%。北西部（グウィネズ・アングルシー）と西部（ケレディギオン・カーマーゼン）では過半数。1993年のウェールズ語法で公用語として英語と対等に扱われるようになった。
      source: "https://en.wikipedia.org/wiki/Welsh_language"

- id: lang_wales_west
  name: ウェールズ西部（ケレディギオン・カーマーゼンシャー）
  select:
    pieces: [GBR-Ceredigion, GBR-Carmarthenshire]
  timeline:
    - from: 2005
      main: english
      minor: welsh
