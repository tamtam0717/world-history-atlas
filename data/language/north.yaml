# ======== エストニア ========
- id: lang_estonia
  name: エストニア
  select:
    iso: [EST]
  timeline:
    - from: 1648
      main: estonian
      note: 農民はエストニア語（南部はヴォロ語・セト語）。領主（荘園主）と都市の上層はバルト・ドイツ人で、農奴制のもとで支配していた。1710年からロシア領だが、ドイツ系貴族の特権は続いた。
      source: "https://ja.wikipedia.org/wiki/バルト・ドイツ人"
    - from: 1860
      main: estonian
      note: 農奴解放（1816–19）の後、エストニア語の新聞（ヤンセン）と民族叙事詩「カレヴィポエク」で民族覚醒が進む。1880年代からロシア化政策。

- id: lang_tallinn
  name: タリン（レヴァル）
  select:
    pieces: [EST-Tallinna_linn]
  timeline:
    - from: 1648
      main: estonian
      minor: german
      note: ハンザ都市以来、市参事会・商人・職人の上層はドイツ語。下層はエストニア語。
    - from: 1880
      main: estonian
      minor: russian
      note: 工業化で農村からエストニア人が流入し、ドイツ人の割合は1割程度に下がる。ロシア人の官吏・労働者・軍人が増える。要確認

- id: lang_narva
  name: ナルヴァ
  select:
    pieces: [EST-Narva_linn]
  timeline:
    - from: 1648
      main: estonian
      minor: german
      note: スウェーデン領時代の国境の要塞都市。
    - from: 1720
      main: estonian
      minor: russian
      note: 大北方戦争（1700–21）でロシア領。クレーンホルムの紡績工場（1857）にロシア人労働者が集まる。

- id: lang_peipus_russian
  name: ペイプス湖西岸（古儀式派の村）
  select:
    pieces: [EST-Mustvee_linn, EST-Kasepem_vald]
  timeline:
    - from: 1648
      main: estonian
    - from: 1700
      main: russian
      minor: estonian
      note: 17世紀末から、ロシアの宗教的迫害を逃れた古儀式派（ラスコーリニキ）がペイプス湖の西岸に村を作った。
      source: "https://ja.wikipedia.org/wiki/古儀式派"

- id: lang_estonian_swedes
  name: エストニアのスウェーデン人の地域（ノアルートシ・ヴォルムシ・ルフヌ）
  select:
    pieces: [EST-Noarootsi_vald, EST-Vormsi_vald, EST-Ruhnu_vald]
  timeline:
    - from: 1648
      main: swedish
      minor: estonian
      note: 中世以来の沿岸スウェーデン人（エイボフォルク）の地域。
      source: "https://ja.wikipedia.org/wiki/エストニア・スウェーデン人"

- id: lang_hiiumaa_swedes
  name: ヒーウマー島西部・パルディスキ
  select:
    pieces: [EST-Hiiu_vald, EST-Paldiski_linn]
  timeline:
    - from: 1648
