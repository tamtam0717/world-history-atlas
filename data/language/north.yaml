# ======== リトアニア ========
- id: lang_lithuania
  name: リトアニア
  select:
    iso: [LTU]
  timeline:
    - from: 1648
      main: lithuanian
      note: 農民はリトアニア語（西部はジェマイティア方言）。貴族は16世紀からポーランド語化していた。町にはユダヤ人（イディッシュ語）が多い。1月蜂起（1863）の後、ロシア政府がラテン文字のリトアニア語出版を禁止（〜1904）。プロイセン領から本を運び込む「本の密輸人」が活躍した。
      source: https://ja.wikipedia.org/wiki/リトアニア語出版禁止令

- id: lang_vilnius_city
  name: ヴィリニュス（ヴィルノ）
  select:
    pieces: [LTU-Vilnius_city_municipality]
  timeline:
    - from: 1648
      main: polish
      minor: yiddish
      note: リトアニア大公国の首都だが、市民と貴族の言葉はポーランド語。ユダヤ人の学問の中心（「リトアニアのエルサレム」）。
      source: https://ja.wikipedia.org/wiki/ヴィリニュス
    - from: 1850
      main: yiddish
      minor: polish
      note: ロシア領（1795–）の県都。19世紀にはユダヤ人が住民の最大の集団になる。1897年の調査で、イディッシュ語約40%、ポーランド語約31%、ロシア語約20%、リトアニア語約2%。切り替えの年は19世紀半ばの目安。
      source: https://ja.wikipedia.org/wiki/ヴィリニュス
    - from: 1920
      main: polish
      minor: yiddish
      note: 1920年にポーランドが占領し、1922年に併合した（ヴィルノ）。1931年の調査でポーランド語約66%、イディッシュ語・ヘブライ語約28%、リトアニア語は1%前後。
    - from: 1941
      main: polish
      note: 1939年にリトアニアへ返還、1940年にソ連が併合。1941–44年のドイツ占領下で、市のユダヤ人のほとんどがパネリャイ（ポナリ）などで殺害された。
      source: "https://en.wikipedia.org/wiki/Ponary_massacre"
    - from: 1946
      main: lithuanian
      minor: russian
      note: 1944–46年にポーランド人の多くがポーランドへ移り、リトアニア人とロシア人などが移り住んだ。1959年の調査でリトアニア人約34%、ロシア人約29%、ポーランド人約20%。
    - from: 1990
      main: lithuanian
      note: 1989年の調査でリトアニア人が過半数（約51%）。2011年はリトアニア人約63%、ポーランド人約17%、ロシア人約12%。

