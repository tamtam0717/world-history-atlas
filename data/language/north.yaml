# 言語（民族）の分布：北欧・フィンランド・バルト地方・グリーンランド（1648–1914）
# 形式は docs/language-format.md。main = 住民（特に農村の民衆）の多数派の言語、minor = 2〜3割以上の少数派。
# バルト地方（エストニア・リヴォニア・クールラント）の領主と都市の上層はドイツ系（バルト・ドイツ人）。
# 人口の1割に満たないため、農村では minor にせず note に書く。

# ======== デンマーク ========
- id: lang_denmark
  name: デンマーク
  select:
    iso: [DNK]
  timeline:
    - from: 1648
      main: danish

- id: lang_north_schleswig
  name: 北シュレースヴィヒ（南ユトランド）
  select:
    regions: [schleswig_dk]
  timeline:
    - from: 1648
      main: danish
      minor: german
      note: 農村は南ユトランド方言のデンマーク語。トゥナー・オーベンロー・セナボーなどの町の上層はドイツ語。1864–1920年はプロイセン領で、ドイツ語化の政策がとられた。
    - from: 1920
      main: danish
      minor: german
      note: 1920年の住民投票で北シュレースヴィヒはデンマーク領になった。トゥナー・オーベンロー・ソナーボーなどの町にはドイツ系の住民が多く残った。
      source: "https://ja.wikipedia.org/wiki/シュレースヴィヒ住民投票"
    - from: 1946
      main: danish
      note: ドイツ系の少数派は今もいる（人口の数%）。


# ======== ノルウェー ========
- id: lang_norway
  name: ノルウェー
  select:
    iso: [NOR]
  timeline:
    - from: 1648
      main: norwegian
      note: 民衆はノルウェー語の諸方言。デンマークとの同君連合（〜1814）の時代、書き言葉はデンマーク語。19世紀にイーヴァル・オーセンの「ランスモール（ニーノシュク）」と、デンマーク語をノルウェー化した「リクスモール（ブークモール）」が生まれる。
      source: "https://ja.wikipedia.org/wiki/ノルウェー語"

- id: lang_sapmi_no_inner
  name: フィンマルク内陸（カウトケイノ・カラショーク）
  select:
    pieces: [NOR-Guovdageaidnu_sme_1, NOR-Kara_johka_sme_1]
  timeline:
    - from: 1648
      main: sami
      note: トナカイ遊牧の北サーミ人の地域。1751年のストレムスタード条約でノルウェーとスウェーデンの国境が引かれた。

- id: lang_sapmi_no_east
  name: フィンマルク東部（タナ・ネッセビー・ポルサンゲル）
  select:
    pieces: [NOR-Deatnu_sme_1, NOR-Unjarga_sme_1, NOR-Porsa_gu_sme_2]
  timeline:
    - from: 1648
      main: sami
      minor: norwegian
      note: フィヨルドと川沿いのサーミ人（海サーミ・川サーミ）。19世紀にはフィンランドから移住したクヴェン人（フィンランド語）も加わる。

- id: lang_finnmark_coast
  name: フィンマルクとトロムス北部の沿岸
  select:
    pieces: [NOR-Alta_nor, NOR-Hammerfest_nor, NOR-Hasvik_nor, NOR-Kvalsund_nor, NOR-Loppa_nor, NOR-Masy_nor, NOR-Nordkapp_nor, NOR-Lebesby_nor, NOR-Gamvik_nor, NOR-Berlevag_nor, NOR-Batsfjord_nor, NOR-Vard_nor, NOR-Sr_Varanger_nor, NOR-Kafjord_nor_2, NOR-Lyngen_nor, NOR-Omasvuotna_sme_2, NOR-Kvnangen_nor, NOR-Nordreisa_nor, NOR-Skjervy_nor, NOR-Loabak_sme_1, NOR-Divtasvuodna_smj_1, NOR-Fuossko_smj_2, NOR-Habmer_smj_2]
  timeline:
    - from: 1648
      main: norwegian
      minor: sami
      note: 漁村と交易地はノルウェー語。フィヨルドの奥にはサーミ人の村が多い。19世紀後半から「ノルウェー化」の政策で、学校でのサーミ語の使用が制限される。

- id: lang_vadso
  name: ヴァッソー（クヴェン人の町）
  select:
    pieces: [NOR-Vads_nor]
  timeline:
    - from: 1648
      main: norwegian
      minor: sami
    - from: 1800
      main: norwegian
      minor: finnish
      note: 18世紀末から19世紀に、北フィンランドとトルネ谷からクヴェン人が移住し、1870年代には住民の半数近くがフィンランド語を話した。要確認
    - from: 1950
      main: norwegian
      note: クヴェン語（フィンランド語）は、ノルウェー化政策で後退した。

# ======== スウェーデン ========
- id: lang_sweden
  name: スウェーデン
  select:
    iso: [SWE]
  timeline:
    - from: 1648
      main: swedish
      note: ヴェルムランドの森林地帯には16〜17世紀に移住した「森のフィン人」（フィンランド語）の村が点在する。

- id: lang_scania
  name: スコーネ・ブレーキンゲ・ハッランド
  select:
    regions: [scania, halland]
  timeline:
    - from: 1648
      main: danish
      note: 1658年のロスキレ条約（ハッランドは1645年のブレムセブルー条約）までデンマーク領。
    - from: 1700
      main: swedish
      note: 教会・学校のスウェーデン化（デンマーク語の聖書・讃美歌の禁止）が進み、18世紀初めまでに書き言葉はスウェーデン語に切りかわった。話し言葉のスコーネ方言は、もとはデンマーク語の東部方言。
      source: "https://ja.wikipedia.org/wiki/スコーネ地方"

- id: lang_bohuslan
  name: ボーヒュースレーン
  select:
    regions: [bohuslan]
  timeline:
    - from: 1648
      main: norwegian
      note: 1658年のロスキレ条約までノルウェー領。
    - from: 1700
      main: swedish
      note: スウェーデン化が進む（方言はノルウェー語と近い）。

- id: lang_tornedalen
  name: トルネ谷（スウェーデン側）
  select:
    pieces: [SWE-Haparanda, SWE-Overtornea, SWE-Pajala]
  timeline:
    - from: 1648
      main: finnish
      note: トルネ谷の住民はフィンランド語（のちのメアンキエリ語）。1809年のフレデリクスハムン条約でトルネ川が国境になり、谷が二つに分けられた。
      source: "https://ja.wikipedia.org/wiki/メアンキエリ語"
    - from: 1880
      main: finnish
      minor: swedish
      note: スウェーデン語だけの学校など、スウェーデン化の政策が始まる。
    - from: 1970
      main: swedish
      minor: finnish
      note: 学校でのスウェーデン語化で、メアンキエリ（トルネ谷のフィンランド語）の話者は減った。2000年に少数言語として認められた。

- id: lang_norrbotten_ore
  name: イェリヴァレ・キルナ（ラップランド北部）
  select:
    pieces: [SWE-Gallivare, SWE-Kiruna]
  timeline:
    - from: 1648
      main: sami
      minor: finnish
      note: トナカイ遊牧のサーミ人と、フィンランド語の入植者。
    - from: 1850
      main: finnish
      minor: sami
    - from: 1900
      main: swedish
      minor: finnish
      note: 鉄鉱山の開発とオーフォート線（1902）の開通で、キルナ・マルムベリェトに南からスウェーデン人の労働者が集まる。要確認

- id: lang_lappmark
  name: スウェーデン領ラップランド（ラップマルク）
  select:
    pieces: [SWE-Jokkmokk, SWE-Arjeplog, SWE-Arvidsjaur, SWE-Sorsele, SWE-Storuman, SWE-Vilhelmina, SWE-Dorotea, SWE-Lycksele, SWE-Mala, SWE-Asele]
  timeline:
    - from: 1648
      main: sami
      minor: swedish
      note: サーミ人の地域。17世紀にスウェーデン王国がラップマルクへの入植を奨励し（1673年・1695年の布告）、銀山の開発も始まる。
    - from: 1750
      main: swedish
      minor: sami
      note: 1749年の布告などで、ヴェステルボッテンのラップマルクにはスウェーデン人の入植者の村が広がる。要確認（ノールボッテン側のヨックモック・アリエプローグはサーミ人の割合が高いまま）

# ======== フィンランド ========
- id: lang_finland
  name: フィンランド
  select:
    iso: [FIN]
  timeline:
    - from: 1648
      main: finnish
      note: 民衆はフィンランド語。スウェーデン王国の時代、行政・教育・教会の上層の言葉はスウェーデン語。1863年の言語令でフィンランド語も公用語になる（実施は1883年まで）。フェンノマン運動（スネルマンら）。
      source: https://ja.wikipedia.org/wiki/フェンノマン運動
    - from: 1940
      main: finnish
      note: 冬戦争と継続戦争で失ったカレリアなどから、約40万人の避難民がフィンランド各地に移り住んだ。
      source: "https://en.wikipedia.org/wiki/Evacuation_of_Finnish_Karelia"

- id: lang_finland_swedish_coast
  name: フィンランドのスウェーデン語の沿岸（オストロボスニア・ウーシマー西部・トゥルク群島）
  select:
    pieces: [FIN-Pietarsaaren_seutukunta, FIN-Sydosterbotten, FIN-Vaasa_sub_region, FIN-Raseborgs_ekonomiska_region, FIN-Turunmaan_seutukunta]
  timeline:
    - from: 1648
      main: swedish
      minor: finnish
      note: 中世のスウェーデン人の入植以来、沿岸の農民・漁民はスウェーデン語。
      source: "https://ja.wikipedia.org/wiki/フィンランド・スウェーデン人"

- id: lang_aland
  name: オーランド諸島
  select:
    adm1: ["FIN/Åland Islands"]
  timeline:
    - from: 1648
      main: swedish

- id: lang_porvoo_loviisa
  name: ポルヴォー・ロヴィーサ（ウーシマー東部）
  select:
    pieces: [FIN-Porvoon_seutukunta, FIN-Loviisan_seutukunta]
  timeline:
    - from: 1648
      main: swedish
      minor: finnish
    - from: 1970
      main: finnish
      minor: swedish
      note: 2020年でポルヴォーのスウェーデン語話者は約3割。

- id: lang_helsinki
  name: ヘルシンキ周辺
  select:
    pieces: [FIN-Helsinki_sub_region]
  timeline:
    - from: 1648
      main: swedish
      minor: finnish
      note: ヘルシンキ（ヘルシングフォシュ）とその周辺の農村はスウェーデン語。1812年にフィンランド大公国の首都になる。
    - from: 1890
      main: finnish
      minor: swedish
      note: 内陸からの労働者の流入で、1890年代にヘルシンキ市ではフィンランド語の話者がスウェーデン語の話者を上回る。
    - from: 1950
      main: finnish
      note: スウェーデン語の住民の割合は下がり続け、1950年代には2割を切った（今は約6%）。

- id: lang_finland_mixed_coast
  name: トゥルク・コッコラ・キュロンマー（両言語の混在）
  select:
    pieces: [FIN-Turun_seutukunta, FIN-Kokkolan_seutukunta, FIN-Kyronmaan_seutukunta]
  timeline:
    - from: 1648
      main: finnish
      minor: swedish
      note: トゥルク（オーボ）は1812年までの首都で、上層と商人はスウェーデン語。コッコラ周辺の沿岸（クロノビーなど）はスウェーデン語の村。
    - from: 1970
      main: finnish

- id: lang_sapmi_fi
  name: フィンランド最北部（イナリ・ウツヨキ）
  select:
    pieces: [FIN-Pohjois_Lapin_seutukunta]
  timeline:
    - from: 1648
      main: sami
      minor: finnish
      note: イナリ・サーミ語、北サーミ語、スコルト・サーミ語の地域。

- id: lang_lapland_fell
  name: フィンランド・ラップランド西部（エノンテキエ・キッティラ）
  select:
    pieces: [FIN-Tunturi_Lapin_seutukunta]
  timeline:
    - from: 1648
      main: sami
      minor: finnish
    - from: 1800
      main: finnish
      minor: sami
      note: フィンランド人の入植で、サーミ人は少数派になる。要確認

# ======== エストニア ========
- id: lang_estonia
  name: エストニア
  select:
    iso: [EST]
  timeline:
    - from: 1648
      main: estonian
      note: 農民はエストニア語（南部はヴォロ語・セト語）。領主（荘園主）と都市の上層はバルト・ドイツ人で、農奴制のもとで支配していた。1710年からロシア領だが、ドイツ系貴族の特権は続いた。農奴解放（1816–19）の後、エストニア語の新聞（ヤンセン）と民族叙事詩「カレヴィポエク」で民族覚醒が進む。1880年代からロシア化政策。
      source: "https://ja.wikipedia.org/wiki/バルト・ドイツ人"
    - from: 1945
      main: estonian
      note: 1940年にソ連が併合（1941–44年はドイツの占領）。1941年と1949年の大量追放（シベリア送り）があり、戦後はロシア語の住民が移り住んだ。エストニア人の割合は1934年の約88%から1989年の約62%へ下がった。北東部（イダ・ヴィル県）ではロシア語が多数。
      source: "https://en.wikipedia.org/wiki/Soviet_deportations_from_Estonia"


- id: lang_tallinn
  name: タリン（レヴァル）
  select:
    pieces: [EST-Tallinna_linn]
  timeline:
    - from: 1648
      main: estonian
      minor: german
      note: ハンザ都市以来、市参事会・商人・職人の上層はドイツ語。下層はエストニア語。
    - from: 1880
      main: estonian
      minor: russian
      note: 工業化で農村からエストニア人が流入し、ドイツ人の割合は1割程度に下がる。ロシア人の官吏・労働者・軍人が増える。要確認

- id: lang_narva
  name: ナルヴァ
  select:
    pieces: [EST-Narva_linn]
  timeline:
    - from: 1648
      main: estonian
      minor: german
      note: スウェーデン領時代の国境の要塞都市。
    - from: 1720
      main: estonian
      minor: russian
      note: 大北方戦争（1700–21）でロシア領。クレーンホルムの紡績工場（1857）にロシア人労働者が集まる。
    - from: 1945
      main: russian
      note: 1944年の戦闘で町はほぼ破壊され、戦前の住民の多くは戻ることを許されなかった。代わりにロシアなどから労働者が移り住み、ロシア語の町になった（1989年でロシア人約86%）。
      source: "https://en.wikipedia.org/wiki/Narva"

- id: lang_peipus_russian
  name: ペイプス湖西岸（古儀式派の村）
  select:
    pieces: [EST-Mustvee_linn, EST-Kasepem_vald]
  timeline:
    - from: 1648
      main: estonian
    - from: 1700
      main: russian
      minor: estonian
      note: 17世紀末から、ロシアの宗教的迫害を逃れた古儀式派（ラスコーリニキ）がペイプス湖の西岸に村を作った。
      source: "https://ja.wikipedia.org/wiki/古儀式派"

- id: lang_estonian_swedes
  name: エストニアのスウェーデン人の地域（ノアルートシ・ヴォルムシ・ルフヌ）
  select:
    pieces: [EST-Noarootsi_vald, EST-Vormsi_vald, EST-Ruhnu_vald]
  timeline:
    - from: 1648
      main: swedish
      minor: estonian
      note: 中世以来の沿岸スウェーデン人（エイボフォルク）の地域。
      source: "https://ja.wikipedia.org/wiki/エストニア・スウェーデン人"
    - from: 1944
      main: estonian
      note: エストニアのスウェーデン人（エイボフォルク）のほとんどは、1943–44年にスウェーデンへ避難した。
      source: "https://en.wikipedia.org/wiki/Estonian_Swedes"

- id: lang_hiiumaa_swedes
  name: ヒーウマー島西部・パルディスキ
  select:
    pieces: [EST-Hiiu_vald, EST-Paldiski_linn]
  timeline:
    - from: 1648
      main: estonian
      minor: swedish
      note: ヒーウマー島のレイギ、パクリ半島・パクリ諸島にスウェーデン語の村があった。
    - from: 1781
      main: estonian
      note: 1781年、レイギのスウェーデン人はエカチェリーナ2世の命で南ウクライナへ移住させられた（「古スウェーデン村」）。

# ======== ラトヴィア ========
- id: lang_latvia
  name: ラトヴィア（リヴォニア南部・クールラント）
  select:
    iso: [LVA]
  timeline:
    - from: 1648
      main: latvian
      note: 農民はラトヴィア語。領主と都市の上層はバルト・ドイツ人。クールラント北西部の海岸にはリヴォニア語（フィン系）の漁村が残った。1850年代から「青年ラトヴィア人」の民族覚醒。

- id: lang_riga
  name: リガ
  select:
    pieces: [LVA-R_ga, LVA-J_rmalas]
  timeline:
    - from: 1648
      main: german
      minor: latvian
      note: ハンザ都市。市民権を持つ商人・職人はドイツ人で、ラトヴィア人は下層の労働者・使用人。スウェーデン領（1621–1710）、のちロシア領。
    - from: 1890
      main: latvian
      minor: german
      note: 工業化で農村からラトヴィア人が流入し、1890年代に最大の集団になる（1881年の調査ではドイツ人約40%・ラトヴィア人約29%・ロシア人約20%、1897年の調査ではラトヴィア人約42%・ドイツ人約25%・ロシア人約17%）。
      source: "https://ja.wikipedia.org/wiki/リガ"
    - from: 1920
      main: latvian
      minor: russian
      note: 独立したラトヴィアの首都。ドイツ人は減り、1939年の「再移住」（独ソ不可侵条約に基づく）でほとんどがドイツへ移った。1935年の調査でラトヴィア人約63%。
      source: "https://en.wikipedia.org/wiki/Baltic_Germans"
    - from: 1970
      main: russian
      minor: latvian
      note: ソ連時代にロシア・ウクライナ・ベラルーシから多くの労働者が移り住み、1970年の調査でロシア人約43%、ラトヴィア人約41%。1989年はロシア人約47%、ラトヴィア人約37%。
      source: "https://en.wikipedia.org/wiki/Russification"
    - from: 2010
      main: latvian
      minor: russian
      note: 1991年の独立後、ロシア系住民の一部の出国などで、2011年の調査ではラトヴィア人約46%、ロシア人約40%。

- id: lang_latgale
  name: ラトガレ（ポーランド領リヴォニア）
  select:
    regions: [latgale]
    pieces: [LVA-Ludzas_novads, LVA-R_zeknes, LVA-R_zeknes_novads, LVA-Kr_slavas_novads, LVA-Aug_daugavas_novads, LVA-Prei_u_novads, LVA-Balvu_novads]
  timeline:
    - from: 1648
      main: latvian
      minor: russian
      note: 農民はラトガレ語（ラトヴィア語の東部方言）でカトリック。1772年までポーランド領で、領主はポーランド系。17世紀末から古儀式派のロシア人の村が増える。要確認（東端にはベラルーシ語の村もある）

- id: lang_rezekne
  name: レーゼクネ（レジツァ）
  select:
    pieces: [LVA-R_zeknes]
  timeline:
    - from: 1648
      main: latvian
      minor: russian
    - from: 1850
      main: yiddish
      note: ヴィテプスク県の郡の町（1772年ロシア領）。ユダヤ人の定住区域（パレ）の内側で、ユダヤ人が住民の多数になった（1897年の調査でユダヤ人約6割、ロシア人・ラトヴィア人・ポーランド人がそれぞれ1〜2割弱）。2番目の集団が2割に届かないので minor は付けない。切り替えの年は19世紀半ばの目安。要確認
    - from: 1925
      main: latvian
      minor: yiddish
      note: 独立したラトヴィアで、ラトヴィア人（ラトガレ人）が多数になった。
    - from: 1941
