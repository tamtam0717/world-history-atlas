  timeline:
    - from: 1648
      main: swedish
      minor: finnish
      note: 中世のスウェーデン人の入植以来、沿岸の農民・漁民はスウェーデン語。
      source: "https://ja.wikipedia.org/wiki/フィンランド・スウェーデン人"

- id: lang_aland
  name: オーランド諸島
  select:
