# 宗教の分布：南アジア（インド・パキスタン・バングラデシュ・スリランカ・ネパール・ブータン・モルディブ）1648–2025
# 形式は docs/religion-format.md（「南アジア・東南アジア」の節に塗り分けの方針）。main = 住民の多数派、minor = 2〜3割以上の少数派。
# - 国勢調査（英領インドは 1872/1881 年から、独立後の 2011 年など）の宗教別人口を目安にした。それより前は推計で、note に書いた。
# - 1947 年の印パ分離では、パンジャーブ・ベンガル・デリー・シンド・ジャンムーで大規模な住民の移動と暴力が起き、
#   約 1,000〜1,500 万人が国境を越えて移り、数十万〜100 万人が犠牲になったとされる。地図では 1947 年に切り替える。
# - ジャイナ教（グジャラート・ラージャスターン）、パールシー（ゾロアスター教。ボンベイ）、ユダヤ教（コーチン）は少数なので note に書く。
# - キリスト教のプロテスタント（長老派・バプテストなど）は、韓国と同じく reformed で塗り、note に書く。
# - 言語（data/language/south_asia.yaml）と、切り替えの年をできるだけそろえている。

# ======== インド（全体の既定値） ========
- id: rel_india
  name: インド
  select:
    iso: [IND]
  timeline:
    - from: 1648
      main: hindu
      note: ヒンドゥー教が多数。ムガル帝国（イスラーム）の支配のもとでもヒンドゥー教徒が人口の4分の3ほどを占めた。ムスリムは北インドの都市と、西北（パンジャーブ・シンド）・東部（ベンガル）に多い。ジャイナ教徒はグジャラート・ラージャスターンの商人に多い。
      source: "https://ja.wikipedia.org/wiki/インドの宗教"
    - from: 1947
      main: hindu
      note: 印パ分離（1947）。ヒンドゥー教徒・シク教徒はパキスタンから、ムスリムはインドからパキスタンへ大規模に移った。2011 年の国勢調査では、ヒンドゥー教徒 79.8%、ムスリム 14.2%、キリスト教徒 2.3%、シク教徒 1.7%、仏教徒 0.7%、ジャイナ教徒 0.4%。
      source: "https://ja.wikipedia.org/wiki/インド・パキスタン分離独立"

