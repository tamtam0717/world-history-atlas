      note: ポルトガル領（1510–1961）。旧征服地（ゴア島・バルデス・サルセテ）では 16 世紀の宗教裁判（異端審問）と改宗政策でカトリックが多数になった。フランシスコ＝ザビエルの遺体を納めたボン・ジェズ教会がある。18 世紀後半に加わった新征服地はヒンドゥー教徒が多く、1900 年ごろには両者がほぼ半々。
