    - from: 1648
      main: hindu
      minor: sunni
      note: シワーリク丘陵のふもと。分離独立の前からヒンドゥー教徒が多く（1941 年に約5割）、ムスリムは約3分の1、シク教徒は2割弱。
    - from: 1947
      main: hindu
      minor: sikh
      note: 分離独立でムスリムがパキスタンへ去った。ヒンドゥー教徒（ダリトのアード・ダルム派を含む）がやや多く、シク教徒が3〜4割。
- id: rel_ludhiana
  name: ルディヤーナー
  select:
    pieces: [IND-Ludhiana]
  timeline:
    - from: 1648
      main: sunni
      minor: hindu
    - from: 1765
      main: sunni
      minor: sikh
      note: シク教徒のミスルの支配が及ぶ。
    - from: 1881
      main: sikh
      minor: sunni
      note: 英領時代にジャート農民のシク教化が進み、シク教徒が最も多くなった（1941 年でシク教徒約 42%、ムスリム約 37%）。
    - from: 1947
      main: sikh
      minor: hindu
      note: 分離独立でムスリムがパキスタンへ去った。

