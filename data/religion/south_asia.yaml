# ---- パンジャーブ（インド側） ----
- id: rel_punjab_in
  name: 東パンジャーブ（マージャ・ドアーバ。アムリトサル・ジャランダル・ルディヤーナー）
  select:
    adm1: ["IND/Punjab"]
  timeline:
    - from: 1648
      main: sunni
      minor: hindu
      note: パンジャーブの中部ではムスリムが最も多く、ヒンドゥー教徒が続く。シク教（ナーナク〈1469–1539〉が開いた）はジャート農民の間に広まりつつあった。アムリトサルの黄金寺院（ハリマンディル）はシク教の総本山。
      source: "https://ja.wikipedia.org/wiki/シク教"
    - from: 1765
      main: sunni
      minor: sikh
      note: シク教徒のミスル（軍事集団）がパンジャーブを支配し、ランジート＝シングのシク王国（1799–1849）につながる。19 世紀の国勢調査ではムスリム4割前後、シク教徒とヒンドゥー教徒がそれぞれ3割前後（郡ごとに差が大きい）。
      source: "https://ja.wikipedia.org/wiki/シク王国"
    - from: 1947
      main: sikh
      minor: hindu
      note: 分離独立でムスリムのほぼ全員がパキスタンへ去り、西パンジャーブからシク教徒・ヒンドゥー教徒が移ってきた。1966 年にパンジャーブ語の州として分けられ、シク教徒が多数（約 58%、2011）の唯一の州になった。1984 年には黄金寺院へ軍が突入し（ブルースター作戦）、インディラ＝ガンディー首相が暗殺された。
      source: "https://ja.wikipedia.org/wiki/ブルースター作戦"
- id: rel_punjab_malwa
  name: パンジャーブ南東部（マールワー。パティヤーラ・サングルール・バティンダー）
  select:
    pieces: [IND-Patiala, IND-Sangrur, IND-Barnala, IND-Bathinda, IND-Mansa, IND-Faridkot, IND-Muktsar, IND-Fatehgarh_Sahib, IND-Rupnagar, IND-Sahibzada_Ajit_Singh_Nagar]
  timeline:
    - from: 1648
      main: hindu
      minor: sunni
      note: マールワー（サトレジ川の南）。
    - from: 1765
      main: hindu
      minor: sikh
      note: パティヤーラ・ナーバ・ジーンドなどシク教徒の君主の藩王国（プルキアン諸国）の地。
      source: "https://en.wikipedia.org/wiki/Phulkian_Misl"
    - from: 1947
