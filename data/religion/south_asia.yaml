      source: "https://ja.wikipedia.org/wiki/シャージャハーナーバード"
    - from: 1947
      main: hindu
      note: 分離独立のときの暴動で多くのムスリムがパキスタンへ去り、パンジャーブからヒンドゥー教徒・シク教徒の難民が流れ込んだ。ムスリムは約 13%（2011）。
