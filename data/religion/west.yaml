- id: rel_dublin
  name: ダブリン市
  select:
    pieces: [IRL-NORTH_INNER_CITY_LEA_7, IRL-SOUTH_EAST_INNER_CITY_LEA_5, IRL-PEMBROKE_LEA_5, IRL-CABRA_GLASNEVIN_LEA_7, IRL-KIMMAGE_RATHMINES_LEA_6]
  timeline:
