# 宗教（宗派）の分布：西ヨーロッパ・北アフリカ（1648–1914）
# 形式は docs/religion-format.md。main = 住民の多数派、minor = 2〜3割以上の少数派。

# ---- フランス ----
- id: rel_france
  name: フランス
  select:
    iso: [FRA, MCO, AND]
  timeline:
    - from: 1453
      main: catholic
      note: "百年戦争の終わり（1453）。住民はほぼすべてカトリック。1516年のボローニャの政教協約で、国王が司教の任命権を得る（ガリカニスム）。1530年代からカルヴァン派（ユグノー）が広がるが、全国では人口の1割に届かない（多い地方は別の地域で示す）。"
    - from: 1648
      main: catholic
      note: カトリックが圧倒的多数。プロテスタント（ユグノー）は全人口の5％ほどで、南部・西部に集中する。
    - from: 1960
      main: catholic
      note: 1905年の政教分離法の後、20世紀後半に世俗化が進み、教会に通う人は少なくなった（地図は伝統的な帰属）。戦後のマグリブなどからの移民で、ムスリムが人口の1割近くになり、パリ・マルセイユ・リヨンの郊外に多い。
      source: "https://en.wikipedia.org/wiki/Religion_in_France"

- id: rel_france_huguenot_core
  name: セヴェンヌ・ヴィヴァレ（ユグノーの中心地）
  select:
    adm2: ["FRA/Gard", "FRA/Ardèche"]
    pieces: [FRA-Florac_Trois_Rivieres, FRA-Die]
  timeline:
    - from: 1453
      main: catholic
    - from: 1555
      main: catholic
      minor: reformed
      note: "1550年代にカルヴァン派（ユグノー）の教会が各地に組織される（1559年パリで全国教会会議）。セヴェンヌ・ニーム・ヴィヴァレでは改革派が住民の多くを占める。ユグノー戦争（1562–98）を経て、ナントの王令（1598）で信仰が公認される。"
      source: "https://ja.wikipedia.org/wiki/ユグノー戦争"
    - from: 1648
      main: catholic
      minor: reformed
      note: ナントの王令（1598）のもとで改革派（ユグノー）が公認されている。セヴェンヌ山地・ニーム・ヴィヴァレでは住民の多くが改革派。
    - from: 1685
      main: catholic
      minor: reformed
      note: フォンテーヌブローの王令（ナントの王令廃止）で改革派は禁止されるが、この地方では信徒が地下（「荒野の教会」）で信仰を続け、カミザールの反乱（1702–04）も起こる。
      source: "https://ja.wikipedia.org/wiki/フォンテーヌブローの勅令"
    - from: 1787
      main: catholic
      minor: reformed
      note: ヴェルサイユの寛容令でプロテスタントの戸籍が認められ、1789年の人権宣言で信教の自由が保障される。

- id: rel_france_huguenot_west_south
  name: ユグノーの多い地方（ポワトゥー・サントンジュ・カストル・モントーバン・ベアルン）
  select:
    pieces: [FRA-Niort, FRA-La_Rochelle, FRA-Saint_Jean_d_Angely, FRA-Castres, FRA-Montauban, FRA-Pau, FRA-Pamiers, FRA-Nyons]
  timeline:
    - from: 1453
      main: catholic
    - from: 1560
      main: catholic
      minor: reformed
      note: "ラ・ロシェル・ポワトゥー・サントンジュ、ベアルン（ジャンヌ・ダルブレが1571年に改革派を国教とする）、モントーバン・カストルなどにユグノーが多い。ナントの王令（1598）で安全保障地を認められるが、ラ・ロシェルは1628年に陥落。"
      source: "https://ja.wikipedia.org/wiki/ナントの勅令"
    - from: 1648
      main: catholic
      minor: reformed
      note: ユグノーの町や村が多い地方。ラ・ロシェルは1628年の陥落で勢力を失ったが、周辺の改革派は多い。（地方の範囲は大まかな目安。要確認）
    - from: 1685
      main: catholic
      note: ナントの王令廃止（1685）。竜騎兵による強制改宗（ドラゴナード）と国外亡命で、改革派は表向き消える（ポワトゥーなどに地下の信徒は残る）。
      source: "https://ja.wikipedia.org/wiki/フォンテーヌブローの勅令"

- id: rel_alsace_lutheran
  name: ストラスブールと下アルザスのルター派地域
  select:
    pieces: [FRA-Strasbourg]
  timeline:
    - from: 1453
      main: catholic
    - from: 1529
      main: lutheran
      minor: catholic
      note: "帝国都市ストラスブールは1520年代に宗教改革を受け入れ（1529年ミサ廃止。ブツァー）、のちにルター派となる。"
      source: "https://ja.wikipedia.org/wiki/マルティン・ブツァー"
    - from: 1648
      main: lutheran
      minor: catholic
      note: ストラスブールは宗教改革以来ルター派の都市。1681年のフランス併合後も信仰は認められ、カトリックが増えていく。
    - from: 1681
      main: lutheran
      minor: catholic
      note: フランス併合で大聖堂はカトリックに戻されるが、市民の多数はルター派のまま。

- id: rel_alsace_mixed
  name: アルザスの混在地域（ハーゲナウ・ザヴェルヌ・コルマール）
  select:
    pieces: [FRA-Haguenau, FRA-Saverne, FRA-Colmar]
  timeline:
    - from: 1453
      main: catholic
    - from: 1545
      main: catholic
      minor: lutheran
      note: "ハーナウ＝リヒテンベルク伯領（1545）、コルマール（1575）などがルター派となる。"
    - from: 1648
      main: catholic
      minor: lutheran
      note: ハーナウ＝リヒテンベルク伯領、コルマール市、ミュンスター渓谷、ヴュルテンベルク領リクヴィールなどにルター派が多い。

- id: rel_mulhouse
  name: ミュールーズ周辺
  select:
    pieces: [FRA-Mulhouse]
  timeline:
    - from: 1453
      main: catholic
    - from: 1529
      main: catholic
      minor: reformed
      note: "ミュールーズはスイスと同盟し、ツヴィングリ派（改革派）の宗教改革を受け入れる。"
    - from: 1648
      main: catholic
      minor: reformed
      note: ミュールーズ共和国（1798年までスイスの同盟者）は改革派の都市。周辺のズントガウはカトリック。

- id: rel_montbeliard
  name: モンベリアール
  select:
    pieces: [FRA-Montbeliard]
  timeline:
    - from: 1453
      main: catholic
    - from: 1538
      main: lutheran
      note: "ヴュルテンベルク公の伯領で、ルター派の宗教改革（ファレルの説教は1524年）。"
    - from: 1648
      main: lutheran
      note: ヴュルテンベルク家の伯領で、ルター派。1793年にフランスに併合された後もルター派が多い。

# ---- イベリア半島・イタリア以外の南欧の小国 ----
- id: rel_melilla_pre
  name: メリリャ（1497年のスペインの占領より前）
  select:
    pieces: [ESP-Melilla]
  until: 1496
  timeline:
    - from: 1453
      main: sunni
      note: "ワッタース朝の支配圏にあるムスリムの港町（リーフ地方）。1497年にメディナ・シドニア公の遠征でカスティリャに占領され、1497年からはスペイン本土と同じ（rel_iberia）。"
      source: "https://ja.wikipedia.org/wiki/メリリャ"

- id: rel_iberia
  name: スペインとポルトガル
  select:
    iso: [ESP, PRT]
    pieces: [PRT-RegiAo_AutA3noma_dos_AAores]   # アゾレス諸島（範囲外のピース）
  timeline:
    - from: 1453
      main: catholic
      note: "レコンキスタの最後の段階。カトリック両王は1478年に異端審問所を置き、1492年にユダヤ教徒を追放（ポルトガルも1496–97年に追放・強制改宗）。改宗したユダヤ人（コンベルソ）は異端審問の対象となる。ムスリムの多い地方（グラナダ・バレンシア・アラゴン）は別の地域で示す。"
      source: "https://ja.wikipedia.org/wiki/アルハンブラ勅令"
    - from: 1648
      main: catholic
      note: モリスコの追放（1609–14）以後、住民はほぼすべてカトリック。異端審問が続く。
    - from: 1975
      main: catholic
      note: フランコ政権（1939–75）はカトリックを国教とした。民主化の後、世俗化が進んだ（地図は伝統的な帰属）。

# ---- ブリテン諸島 ----
- id: rel_england_wales
  name: イングランドとウェールズ
  select:
    regions: [england_wales]
  timeline:
    - from: 1453
      main: catholic
      note: "ばら戦争（1455–85）のころ。ウィクリフ派（ロラード派）は少数で地下に残る。"
    - from: 1534
      main: anglican
      minor: catholic
      note: "首長法（1534）でヘンリ8世がイングランド教会の首長となり、ローマ教皇から離れる。修道院の解散（1536–40）。教義と民衆の信仰はなお伝統的。"
      source: "https://ja.wikipedia.org/wiki/国王至上法"
    - from: 1553
      main: catholic
      minor: anglican
      note: "メアリ1世がカトリックを復活させ、プロテスタントを弾圧する。"
    - from: 1559
      main: anglican
      minor: catholic
      note: "エリザベス1世の統一法（1559）で国教会が確立する。北部などにカトリックが残る。"
      source: "https://ja.wikipedia.org/wiki/礼拝統一法"
    - from: 1600
      main: anglican
      note: "国教会が住民の多数に定着する。カトリック（国教忌避者）は少数となり、ピューリタンが国教会の内部で改革を求める。"
    - from: 1648
      main: anglican
      note: ピューリタン革命期（1649–60）は国教会の主教制が廃止され、長老派・独立派が力を持つ。
    - from: 1660
      main: anglican
      note: 王政復古で国教会が復活。非国教徒（ピューリタン系）とカトリックは審査法（1673）などで公職から締め出される。1689年の寛容法で非国教徒の礼拝は認められる。
      source: "https://ja.wikipedia.org/wiki/寛容法"
    - from: 1828
      main: anglican
      note: 審査法の廃止（1828）とカトリック教徒解放法（1829）で、非国教徒とカトリックも公職に就けるようになる。19世紀にはメソジストなどの非国教徒が工業都市で増え、1851年の礼拝調査では、イングランドでも礼拝に出た人の半数近くが非国教会の信徒だった。アイルランドからの移民でカトリックも増える。
    - from: 1960
      main: anglican
      note: 20世紀後半に世俗化が進み、2021年の調査ではイングランドとウェールズで「宗教なし」が約37%（地図は伝統的な帰属）。南アジアなどからの移民で、ムスリムは約6.5%（都市部に多い）。
      source: "https://en.wikipedia.org/wiki/Religion_in_England"

- id: rel_wales
  name: ウェールズ
  select:
    adm1: ["GBR/Wales"]
  timeline:
    - from: 1453
      main: catholic
    - from: 1534
      main: anglican
      minor: catholic
      note: "ウェールズは合同法（1536・43）でイングランドに統合され、国教会の体制に入る。"
    - from: 1553
      main: catholic
      minor: anglican
    - from: 1559
      main: anglican
      minor: catholic
    - from: 1600
      main: anglican
      note: "1588年にウェールズ語訳の聖書が出て、国教会の信仰が民衆に広まる。"
    - from: 1648
      main: anglican
      note: 国教会の教区が置かれているが、ピューリタン革命期には独立派・バプテストの集会も生まれる。
    - from: 1811
      main: reformed
      minor: anglican
      note: 18世紀の信仰復興（ハウエル・ハリス、ダニエル・ローランド）から生まれたカルヴァン派メソジストが1811年に国教会から分かれ、独立派（会衆派）・バプテストとともに非国教徒（ノンコンフォーミスト）が多数になる。1851年の礼拝調査では、礼拝に出た人の約8割が非国教会の信徒だった。カルヴァン派メソジスト・会衆派などは教義が改革派に近いので、ここでは改革派の色で塗る（ウェスレー派メソジストも含む）。ウェールズの国教会の廃止は1914年に法律で決まった（実施は1920年）。
      source: "https://en.wikipedia.org/wiki/Presbyterian_Church_of_Wales"

- id: rel_scotland
  name: スコットランド
  select:
    regions: [scotland]
  timeline:
    - from: 1453
      main: catholic
    - from: 1560
      main: reformed
      minor: catholic
      note: "ノックスの指導で宗教改革議会（1560）が教皇の権威を否定し、カルヴァン派（長老派）のスコットランド教会が成立する。ハイランドの一部にはカトリックが残る。"
      source: "https://ja.wikipedia.org/wiki/スコットランド宗教改革"
    - from: 1648
      main: reformed
      note: 長老派（改革派）のスコットランド教会が多数。ハイランドの一部と西部の島々にカトリック、北東部に主教制派（監督派）が残る。
    - from: 1690
      main: reformed
      note: 名誉革命後、スコットランド教会は長老制に確定する。
    - from: 1843
      main: reformed
      note: スコットランド教会の大分裂（ディスラプション、1843）で、牧師の約3分の1が自由教会を作る。どちらも長老派（改革派）。グラスゴーなど西部の工業都市ではアイルランドからの移民でカトリックが増える。

- id: rel_ireland
  name: アイルランド
  select:
    regions: [ireland]
  timeline:
    - from: 1453
      main: catholic
      note: "ヘンリ8世はアイルランドでも首長法（1536）を定め、国教会（アイルランド教会）を置くが、住民はカトリックのまま。プロテスタントはダブリンなどのイングランド人の役人と、アルスター植民（1609–）の入植者に限られる。"
      source: "https://ja.wikipedia.org/wiki/アイルランドの宗教改革"
    - from: 1648
      main: catholic
      note: 住民の大多数はカトリック。支配層はアイルランド国教会（イギリス国教会系）。クロムウェルの征服（1649–53）後、土地の多くがプロテスタントに移る。18世紀には刑罰法でカトリックの権利が制限される。
    - from: 1990
      main: catholic
      note: 1990年代以後、聖職者による虐待の問題などで教会の影響力は大きく下がり、2015年に同性婚、2018年に人工妊娠中絶が国民投票で認められた（地図は伝統的な帰属）。


