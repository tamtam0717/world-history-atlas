# 宗教（宗派）の分布：西ヨーロッパ・北アフリカ（1648–1914）
# 形式は docs/religion-format.md。main = 住民の多数派、minor = 2〜3割以上の少数派。

# ---- フランス ----
- id: rel_france
  name: フランス
  select:
    iso: [FRA, MCO, AND]
  timeline:
    - from: 1648
      main: catholic
      note: カトリックが圧倒的多数。プロテスタント（ユグノー）は全人口の5％ほどで、南部・西部に集中する。
    - from: 1960
      main: catholic
      note: 1905年の政教分離法の後、20世紀後半に世俗化が進み、教会に通う人は少なくなった（地図は伝統的な帰属）。戦後のマグリブなどからの移民で、ムスリムが人口の1割近くになり、パリ・マルセイユ・リヨンの郊外に多い。
      source: "https://en.wikipedia.org/wiki/Religion_in_France"

- id: rel_france_huguenot_core
  name: セヴェンヌ・ヴィヴァレ（ユグノーの中心地）
  select:
    adm2: ["FRA/Gard", "FRA/Ardèche"]
    pieces: [FRA-Florac_Trois_Rivieres, FRA-Die]
  timeline:
    - from: 1648
      main: catholic
      minor: reformed
      note: ナントの王令（1598）のもとで改革派（ユグノー）が公認されている。セヴェンヌ山地・ニーム・ヴィヴァレでは住民の多くが改革派。
    - from: 1685
      main: catholic
      minor: reformed
      note: フォンテーヌブローの王令（ナントの王令廃止）で改革派は禁止されるが、この地方では信徒が地下（「荒野の教会」）で信仰を続け、カミザールの反乱（1702–04）も起こる。
      source: "https://ja.wikipedia.org/wiki/フォンテーヌブローの勅令"
    - from: 1787
      main: catholic
      minor: reformed
      note: ヴェルサイユの寛容令でプロテスタントの戸籍が認められ、1789年の人権宣言で信教の自由が保障される。

- id: rel_france_huguenot_west_south
  name: ユグノーの多い地方（ポワトゥー・サントンジュ・カストル・モントーバン・ベアルン）
  select:
    pieces: [FRA-Niort, FRA-La_Rochelle, FRA-Saint_Jean_d_Angely, FRA-Castres, FRA-Montauban, FRA-Pau, FRA-Pamiers, FRA-Nyons]
  timeline:
    - from: 1648
      main: catholic
      minor: reformed
      note: ユグノーの町や村が多い地方。ラ・ロシェルは1628年の陥落で勢力を失ったが、周辺の改革派は多い。（地方の範囲は大まかな目安。要確認）
    - from: 1685
      main: catholic
      note: ナントの王令廃止（1685）。竜騎兵による強制改宗（ドラゴナード）と国外亡命で、改革派は表向き消える（ポワトゥーなどに地下の信徒は残る）。
      source: "https://ja.wikipedia.org/wiki/フォンテーヌブローの勅令"

- id: rel_alsace_lutheran
  name: ストラスブールと下アルザスのルター派地域
  select:
    pieces: [FRA-Strasbourg]
  timeline:
    - from: 1648
      main: lutheran
      minor: catholic
      note: ストラスブールは宗教改革以来ルター派の都市。1681年のフランス併合後も信仰は認められ、カトリックが増えていく。
    - from: 1681
      main: lutheran
      minor: catholic
      note: フランス併合で大聖堂はカトリックに戻されるが、市民の多数はルター派のまま。

- id: rel_alsace_mixed
  name: アルザスの混在地域（ハーゲナウ・ザヴェルヌ・コルマール）
  select:
    pieces: [FRA-Haguenau, FRA-Saverne, FRA-Colmar]
  timeline:
    - from: 1648
      main: catholic
      minor: lutheran
      note: ハーナウ＝リヒテンベルク伯領、コルマール市、ミュンスター渓谷、ヴュルテンベルク領リクヴィールなどにルター派が多い。

- id: rel_mulhouse
  name: ミュールーズ周辺
  select:
    pieces: [FRA-Mulhouse]
  timeline:
    - from: 1648
      main: catholic
      minor: reformed
      note: ミュールーズ共和国（1798年までスイスの同盟者）は改革派の都市。周辺のズントガウはカトリック。

- id: rel_montbeliard
  name: モンベリアール
  select:
    pieces: [FRA-Montbeliard]
  timeline:
    - from: 1648
      main: lutheran
      note: ヴュルテンベルク家の伯領で、ルター派。1793年にフランスに併合された後もルター派が多い。

# ---- イベリア半島・イタリア以外の南欧の小国 ----
- id: rel_iberia
  name: スペインとポルトガル
  select:
    iso: [ESP, PRT]
    pieces: [PRT-RegiAo_AutA3noma_dos_AAores]   # アゾレス諸島（範囲外のピース）
  timeline:
    - from: 1648
      main: catholic
      note: モリスコの追放（1609–14）以後、住民はほぼすべてカトリック。異端審問が続く。
    - from: 1975
      main: catholic
      note: フランコ政権（1939–75）はカトリックを国教とした。民主化の後、世俗化が進んだ（地図は伝統的な帰属）。

# ---- ブリテン諸島 ----
- id: rel_england_wales
  name: イングランドとウェールズ
  select:
    regions: [england_wales]
  timeline:
    - from: 1648
      main: anglican
      note: ピューリタン革命期（1649–60）は国教会の主教制が廃止され、長老派・独立派が力を持つ。
    - from: 1660
      main: anglican
      note: 王政復古で国教会が復活。非国教徒（ピューリタン系）とカトリックは審査法（1673）などで公職から締め出される。1689年の寛容法で非国教徒の礼拝は認められる。
      source: "https://ja.wikipedia.org/wiki/寛容法"
    - from: 1828
      main: anglican
      note: 審査法の廃止（1828）とカトリック教徒解放法（1829）で、非国教徒とカトリックも公職に就けるようになる。19世紀にはメソジストなどの非国教徒が工業都市で増え、1851年の礼拝調査では、イングランドでも礼拝に出た人の半数近くが非国教会の信徒だった。アイルランドからの移民でカトリックも増える。
    - from: 1960
      main: anglican
      note: 20世紀後半に世俗化が進み、2021年の調査ではイングランドとウェールズで「宗教なし」が約37%（地図は伝統的な帰属）。南アジアなどからの移民で、ムスリムは約6.5%（都市部に多い）。
      source: "https://en.wikipedia.org/wiki/Religion_in_England"

- id: rel_wales
  name: ウェールズ
  select:
    adm1: ["GBR/Wales"]
  timeline:
    - from: 1648
      main: anglican
      note: 国教会の教区が置かれているが、ピューリタン革命期には独立派・バプテストの集会も生まれる。
    - from: 1811
      main: reformed
      minor: anglican
      note: 18世紀の信仰復興（ハウエル・ハリス、ダニエル・ローランド）から生まれたカルヴァン派メソジストが1811年に国教会から分かれ、独立派（会衆派）・バプテストとともに非国教徒（ノンコンフォーミスト）が多数になる。1851年の礼拝調査では、礼拝に出た人の約8割が非国教会の信徒だった。カルヴァン派メソジスト・会衆派などは教義が改革派に近いので、ここでは改革派の色で塗る（ウェスレー派メソジストも含む）。ウェールズの国教会の廃止は1914年に法律で決まった（実施は1920年）。
      source: "https://en.wikipedia.org/wiki/Presbyterian_Church_of_Wales"

- id: rel_scotland
  name: スコットランド
  select:
    regions: [scotland]
  timeline:
    - from: 1648
      main: reformed
      note: 長老派（改革派）のスコットランド教会が多数。ハイランドの一部と西部の島々にカトリック、北東部に主教制派（監督派）が残る。
    - from: 1690
      main: reformed
      note: 名誉革命後、スコットランド教会は長老制に確定する。
    - from: 1843
      main: reformed
      note: スコットランド教会の大分裂（ディスラプション、1843）で、牧師の約3分の1が自由教会を作る。どちらも長老派（改革派）。グラスゴーなど西部の工業都市ではアイルランドからの移民でカトリックが増える。

- id: rel_ireland
  name: アイルランド
  select:
    regions: [ireland]
  timeline:
    - from: 1648
      main: catholic
      note: 住民の大多数はカトリック。支配層はアイルランド国教会（イギリス国教会系）。クロムウェルの征服（1649–53）後、土地の多くがプロテスタントに移る。18世紀には刑罰法でカトリックの権利が制限される。
    - from: 1990
      main: catholic
      note: 1990年代以後、聖職者による虐待の問題などで教会の影響力は大きく下がり、2015年に同性婚、2018年に人工妊娠中絶が国民投票で認められた（地図は伝統的な帰属）。


- id: rel_ulster_east
  name: アルスター東部（アントリム・ダウン北部）
  select:
    pieces: [GBR-Antrim_and_Newtownabbey, GBR-Ards_and_North_Down, GBR-Belfast, GBR-Lisburn_and_Castlereagh, GBR-Mid_and_East_Antrim, GBR-Causeway_Coast_and_Glens]
  timeline:
    - from: 1648
      main: catholic
      minor: reformed
      note: アルスター植民（1609–）でスコットランド系の長老派（改革派）が入植している。
    - from: 1690
      main: reformed
      minor: catholic
      note: 1690年代にスコットランドから大規模な移住があり、長老派が多数になる。（時期は要確認）

- id: rel_ulster_west
  name: アルスター西部・南部（デリー・ティロン・アーマー・ファーマナ・ダウン南部）
  select:
    pieces: [GBR-Derry_City_and_Strabane, GBR-Mid_Ulster, GBR-Fermanagh_and_Omagh, GBR-Armagh_City_Banbridge_and_Craigavon, GBR-Newry_Mourne_and_Down]
  timeline:
    - from: 1648
      main: catholic
      minor: anglican
      note: アルスター植民で入植したイングランド系の国教会信徒とスコットランド系の長老派が、カトリックの住民と混在する。

- id: rel_dublin
  name: ダブリン市
  select:
    pieces: [IRL-NORTH_INNER_CITY_LEA_7, IRL-SOUTH_EAST_INNER_CITY_LEA_5, IRL-PEMBROKE_LEA_5, IRL-CABRA_GLASNEVIN_LEA_7, IRL-KIMMAGE_RATHMINES_LEA_6]
  timeline:
    - from: 1648
      main: catholic
      minor: anglican
    - from: 1660
      main: anglican
      minor: catholic
      note: 王政復古から18世紀半ばまで、ダブリン市内はプロテスタント（国教会）が多数。（要確認）
    - from: 1780
      main: catholic
      minor: anglican
      note: 農村からの移住で、18世紀後半にはカトリックが再び多数になる。（要確認）
    - from: 1925
      main: catholic
      note: アイルランド自由国の成立（1922）の後、プロテスタント（国教会）の住民の多くがイギリスへ移った。

# ---- 北大西洋 ----
- id: rel_iceland
  name: アイスランド
  select:
    regions: [iceland]
  timeline:
    - from: 1648
      main: lutheran

- id: rel_greenland
  name: 東グリーンランド
  select:
    regions: [east_greenland]
  timeline:
    - from: 1648
      main: other
      note: イヌイットの伝統的な信仰。西岸では1721年からハンス・エーゲデのルター派の伝道が始まる。
    - from: 1921
      main: lutheran
      note: 東グリーンランド（アンマサリク）への伝道は1894年に始まり、1920年代までに住民のほぼ全員がルター派の洗礼を受けた。
      source: "https://en.wikipedia.org/wiki/Religion_in_Greenland"

- id: rel_west_greenland
  name: 西グリーンランド
  select:
    regions: [west_greenland]
  timeline:
    - from: 1648
      main: other
      note: イヌイットの伝統的な信仰（アンガコック〈シャーマン〉）。
    - from: 1780
      main: lutheran
      note: ハンス・エーゲデ（1721–）のデンマーク＝ノルウェーのルター派と、モラヴィア兄弟団（1733–1900）の伝道で、18世紀末までに西岸のイヌイットの多くが洗礼を受けた。北西部のチューレのイヌイットへの伝道は1909年から。
      source: "https://en.wikipedia.org/wiki/Religion_in_Greenland"

# ---- 北アフリカ ----
- id: rel_maghreb
  name: マグリブ（モロッコ・アルジェリア・チュニジア・リビア）と西サハラ
  select:
    iso: [MAR, DZA, TUN, LBY, ESH, MRT, MLI]
  timeline:
    - from: 1648
      main: sunni
      note: スンナ派（マーリク派）。各地にユダヤ教徒の共同体がある。ムザブ（アルジェリア）とジェルバ島（チュニジア）にはイバード派が住む。

- id: rel_oran
  name: オラン
  select:
    regions: [oran]
  timeline:
    - from: 1648
      main: sunni
      note: スペインの要塞都市（1708–32年はアルジェ領）。後背地の住民はムスリム。
    - from: 1792
      main: sunni
      note: 1792年、スペインがオランを手放し、アルジェ領になる。
    - from: 1880
      main: catholic
      minor: sunni
      note: フランスの征服（1831年にオラン占領）の後、スペイン人を中心にヨーロッパ系の入植者が大量に入り、19世紀後半のオラン市とその周辺ではヨーロッパ系の住民（カトリック）が多数になる。クレミュー令（1870）でフランス市民になったユダヤ教徒も多い。（ピースはオラン県で、市とその周辺にあたる。比率は要確認）
    - from: 1962
      main: sunni
      note: 1962年の独立でヨーロッパ系の住民の大部分がフランスへ去った。
      source: "https://ja.wikipedia.org/wiki/ピエ・ノワール"

- id: rel_algiers_city
  name: アルジェ市
  select:
    pieces: [DZA-Alger]
  timeline:
    - from: 1648
      main: sunni
      note: アルジェ（オスマン帝国の摂政領の首都）。ユダヤ教徒の共同体があり、キリスト教徒の捕虜も多い。
    - from: 1880
      main: catholic
      minor: sunni
      note: フランスの征服（1830）の後、フランス人・スペイン人・イタリア人・マルタ人などのヨーロッパ系の住民が増え、1880年代にはアルジェ市の住民の約3分の2を占めた（ほとんどがカトリック）。クレミュー令（1870）でユダヤ教徒はフランス市民になる。アンナバ（ボーヌ）などの都市でもヨーロッパ系が多いが、ピースが県単位なのでここでは塗らない。（比率は要確認）
      source: "https://ja.wikipedia.org/wiki/フランス領アルジェリア"
    - from: 1950
      main: sunni
      minor: catholic
      note: 農村から移り住んだムスリムの住民がヨーロッパ系を上回った。
    - from: 1962
      main: sunni
      note: 1962年の独立でヨーロッパ系の住民（カトリック）とユダヤ人の大部分がフランスへ去った。
      source: "https://ja.wikipedia.org/wiki/ピエ・ノワール"

- id: rel_egypt
  name: エジプト
  select:
    iso: [EGY]
  timeline:
    - from: 1648
      main: sunni
      note: スンナ派が多数。コプト教会（東方諸教会）の信徒が人口の1割前後いる。

# ======== 1914–2025：移民によるイスラームの都市部での広がり ========
# 国勢調査で宗教を尋ねるイギリスと、推計のあるブリュッセルだけを塗る。フランス・ドイツ・オランダの都市（パリ郊外・マルセイユ・ベルリン・ロッテルダムなど）は信頼できる統計がないか、ムスリムが2割に届かないので塗らない。
- id: rel_tower_hamlets
  name: タワーハムレッツ（ロンドン東部）
  select:
    pieces: [GBR-Tower_Hamlets]
  timeline:
    - from: 1980
      main: anglican
      minor: sunni
      note: 1970年代からバングラデシュ（シレット地方）出身の移民が多く住んだ。
    - from: 2010
      main: sunni
      minor: anglican
      note: 2011年の調査でムスリム約35%、キリスト教徒約27%、宗教なし約19%（2021年はムスリム約40%）。地図の「イギリス国教会」はキリスト教徒全体を表す。
      source: "https://en.wikipedia.org/wiki/Religion_in_London"

- id: rel_uk_muslim_cities
  name: イギリスのムスリムの多い都市（ニューアム・バーミンガム・ブラッドフォード）
  select:
    pieces: [GBR-Newham, GBR-Birmingham, GBR-Bradford]
  timeline:
    - from: 2010
      main: anglican
      minor: sunni
      note: 1950–70年代からパキスタン・バングラデシュ・インドなどから移民が来た。2021年の調査でムスリムはニューアム約35%、ブラッドフォード約31%、バーミンガム約30%（キリスト教徒は3〜4割）。地図の「イギリス国教会」はキリスト教徒全体を表す。
      source: "https://en.wikipedia.org/wiki/Islam_in_England"

- id: rel_leicester
  name: レスター
  select:
    pieces: [GBR-Leicester]
  timeline:
    - from: 2020
      main: anglican
      minor: sunni
      note: 2021年の調査でキリスト教徒約25%、ムスリム約24%、ヒンドゥー教徒約18%（ヒンドゥー教は地図の種類にない）。
      source: "https://en.wikipedia.org/wiki/Leicester"
