      note: 1690年代にスコットランドから大規模な移住があり、長老派が多数になる。（時期は要確認）

- id: rel_ulster_west
  name: アルスター西部・南部（デリー・ティロン・アーマー・ファーマナ・ダウン南部）
  select:
    pieces: [GBR-Derry_City_and_Strabane, GBR-Mid_Ulster, GBR-Fermanagh_and_Omagh, GBR-Armagh_City_Banbridge_and_Craigavon, GBR-Newry_Mourne_and_Down]
  timeline:
