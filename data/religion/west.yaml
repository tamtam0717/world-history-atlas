  select:
    pieces: [GBR-Antrim_and_Newtownabbey, GBR-Ards_and_North_Down, GBR-Belfast, GBR-Lisburn_and_Castlereagh, GBR-Mid_and_East_Antrim, GBR-Causeway_Coast_and_Glens]
