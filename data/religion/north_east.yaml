      source: "https://ja.wikipedia.org/wiki/古儀式派"
    - from: 1922
      main: orthodox
      note: ソ連（1922–91）は無神論を国の方針とし、教会の財産を没収し、聖職者を逮捕・処刑した（1930年代に最も激しい）。地図の「正教会」は住民の伝統的な宗派の帰属を示す。第二次世界大戦中の1943年に教会の活動は一部認められた。1988年の「ルーシの洗礼1000年」の前後から宗教は復活し、ソ連解体後は正教会の信者を名乗る人が多数になった。
      source: "https://en.wikipedia.org/wiki/Religion_in_the_Soviet_Union"

