      note: ドイツ人入植者のルター派が多い。1772年のプロイセン併合後さらに増える。
    - from: 1946
      main: catholic

- id: rel_greater_poland_west
  name: 大ポーランド西部（レシュノ・フラウシュタット・メーゼリッツ）
  select:
