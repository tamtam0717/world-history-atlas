      source: "https://en.wikipedia.org/wiki/Religion_in_Ukraine"

- id: rel_crimea
  name: クリミア＝ハン国
  select:
    regions: [crimea]
  timeline:
    - from: 1648
      main: sunni
      note: クリミア・タタール人はスンナ派（ハナフィー派）。
    - from: 1783
      main: sunni
      minor: orthodox
      note: ロシアに併合され、タタール人の一部がオスマン帝国へ移住し、ロシア人などが入植する。（比率は要確認）
    - from: 1860
      main: sunni
      minor: orthodox
