      note: 1945–47年にドイツ人（ルター派・メノナイト）が避難・追放された。

- id: rel_danzig_thorn
  name: ダンツィヒ・トルン
  select:
    regions: [danzig, torun]
  timeline:
    - from: 1648
      main: lutheran
      minor: catholic
      note: ドイツ系市民のルター派都市。トルンでは1724年に宗派対立から「トルンの流血事件」が起きた。
    - from: 1946
      main: catholic
      note: トルンは1920年からポーランド領で、ドイツ人は減っていた。ダンツィヒのドイツ人は1945–47年に避難・追放された。

- id: rel_netze
  name: ネッツェ地区
  select:
