# ======== 1914–2025 で分けた地域 ========
- id: rel_east_prussia_pl
  name: 東プロイセン南部（ポーランド領ヴァルミア・マズーリ）
  select:
    pieces: [POL-powiat_bartoszycki, POL-powiat_dzia_dowski, POL-powiat_e_cki, POL-powiat_gi_ycki, POL-powiat_go_dapski, POL-powiat_i_awski, POL-powiat_k_trzy_ski, POL-powiat_kwidzy_ski, POL-powiat_mr_gowski, POL-powiat_nidzicki, POL-powiat_olecki, POL-powiat_ostrodzki, POL-powiat_piski, POL-powiat_szczycie_ski, POL-powiat_w_gorzewski]
  timeline:
    - from: 1946
      main: catholic
      note: 1945年にポーランド領。ドイツ人（ルター派）は避難・追放され、ルター派のマズーリ人の多くものちに西ドイツへ移った。カトリックのポーランド人と、ヴィスワ作戦（1947）で移されたギリシア・カトリックや正教徒のウクライナ人が住んだ。
      source: "https://en.wikipedia.org/wiki/Masurians"

- id: rel_kaliningrad
  name: カリーニングラード（東プロイセン北部）
  select:
    pieces: [RUS-Kaliningrad]
  timeline:
    - from: 1947
      main: orthodox
      note: 1945年にソ連領。ドイツ人は1947–48年に追放され、ロシア人などが移り住んだ（地図は伝統的な帰属）。
      source: "https://ja.wikipedia.org/wiki/カリーニングラード州"

- id: rel_memelland
  name: メーメル地方（クライペダ）
  select:
    pieces: [LTU-ilut_District_Municipality, LTU-Klaip_da_City_Municipality, LTU-Klaip_da_District_Municipality, LTU-Neringos_savivaldyb, LTU-Pag_gi_savivaldyb]
  timeline:
    - from: 1945
      main: catholic
      minor: orthodox
      note: 1923年にリトアニア領、1939年にドイツが併合。1945年にドイツ系・ルター派のメーメル人の多くが避難・追放され、カトリックのリトアニア人とロシア人（正教会）が移り住んだ。
    - from: 1990
      main: catholic

- id: rel_chechnya_ingushetia
  name: チェチェン・イングーシ
  select:
    pieces: [RUS-Chechnya, RUS-Ingushetia]
  timeline:
    - from: 1944
      main: orthodox
      note: 1944年2月、チェチェン人・イングーシ人の全員が中央アジアへ強制移住させられた。
      source: "https://en.wikipedia.org/wiki/Aardakh"
    - from: 1957
      main: orthodox
      minor: sunni
      note: 1957年に帰還が認められた。
    - from: 1970
      main: sunni
      minor: orthodox
    - from: 1995
      main: sunni
      note: チェチェン紛争（1994–96、1999–2009）までにロシア人の大部分が去った。
      source: "https://ja.wikipedia.org/wiki/チェチェン紛争"

- id: rel_karachay_cherkessia
  name: カラチャイ・チェルケス
  select:
    pieces: [RUS-Karachay_Cherkessia]
  timeline:
    - from: 1943
      main: orthodox
      minor: sunni
      note: 1943年11月、ムスリムのカラチャイ人が強制移住させられた（チェルケス人・アバザ人は残った）。
      source: "https://en.wikipedia.org/wiki/Deportation_of_the_Karachays"
    - from: 1957
      main: sunni
      minor: orthodox
      note: 1957年に帰還が認められた。2010年でカラチャイ人・チェルケス人・アバザ人・ノガイ人（ムスリム）が約6割、ロシア人が約3割。

- id: rel_ida_viru
  name: エストニア北東部（ナルヴァ・イダ・ヴィル県の工業都市）
  select:
    pieces: [EST-Narva_linn, EST-Narva_Jvesuu_linn, EST-Sillamae_linn, EST-Kohtla_Jlrve_linn, EST-Vaivara_vald, EST-Johvi, EST-Maardu]
  timeline:
    - from: 1960
      main: orthodox
      minor: lutheran
      note: 戦後、ロシアなどから移り住んだ労働者（伝統的に正教会）が多数になった（地図は伝統的な帰属）。
      source: "https://en.wikipedia.org/wiki/Ida-Viru_County"
