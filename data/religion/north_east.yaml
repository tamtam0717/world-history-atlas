      note: レシュノはボヘミア兄弟団（コメニウス）の中心で、ドイツ人のルター派の町も多い。
    - from: 1946
      main: catholic

- id: rel_lower_silesia
  name: 下シュレジエン
  select:
    pieces: [POL-Jelenia_Gora, POL-Legnica, POL-Wa_brzych, POL-Wroc_aw, POL-Zielona_Gora, POL-powiat_aga_ski, POL-powiat_redzki, POL-powiat_widnicki, POL-powiat_wiebodzi_ski, POL-powiat_boles_awiecki, POL-powiat_dzier_oniowski, POL-powiat_g_ogowski, POL-powiat_gorowski, POL-powiat_jaworski, POL-powiat_jeleniogorski, POL-powiat_kamiennogorski, POL-powiat_legnicki, POL-powiat_lubi_ski, POL-powiat_lwowecki, POL-powiat_milicki, POL-powiat_nowosolski, POL-powiat_o_awski, POL-powiat_ole_nicki, POL-powiat_polkowicki, POL-powiat_strzeli_ski, POL-powiat_trzebnicki, POL-powiat_wa_brzyski, POL-powiat_wo_owski, POL-powiat_wroc_awski, POL-powiat_z_otoryjski, POL-powiat_zielonogorski, POL-powiat_brzeski, POL-powiat_namys_owski, POL-powiat_kluczborski]
  timeline:
    - from: 1648
      main: lutheran
      minor: catholic
      note: ハプスブルク家の再カトリック化にもかかわらず、住民の多くはルター派。ウェストファリア条約で認められた3つの「平和教会」と、ピャスト家の諸公国（ブリーク・リーグニッツ・オェルス）がその拠り所。
      source: "https://ja.wikipedia.org/wiki/平和教会"
    - from: 1707
      main: lutheran
      minor: catholic
      note: アルトランシュテット協約で教会が返還され、「恩寵教会」6つが許される。1742年のプロイセン領化後は信仰の自由が保障された。
    - from: 1946
      main: catholic
      note: 1945–47年にドイツ人が避難・追放され、カトリックのポーランド人が移り住んだ。
      source: "https://en.wikipedia.org/wiki/Flight_and_expulsion_of_Germans_(1944%E2%80%931950)"

# ======== ベラルーシ・ウクライナ西部 ========
- id: rel_belarus
  name: ベラルーシ（東部・中部）
  select:
    iso: [BLR]
  timeline:
    - from: 1648
      main: orthodox
      minor: catholic
      note: ルーシ人の農民は正教徒とユニエイト（ブレスト合同1596）に分かれる。貴族はカトリックに改宗していく。
      source: "https://ja.wikipedia.org/wiki/ブレスト合同"
    - from: 1700
      main: catholic
      minor: orthodox
      note: 18世紀にはユニエイト（東方典礼カトリック）がベラルーシの農民の多数派になる。1772年以後のロシア領でもユニエイト教会は1839年まで存続した。（時期は要確認）
    - from: 1839
      main: orthodox
      note: ポロツク教会会議（1839）で、ロシア帝国内のユニエイト教会は廃止され、信徒（約160万人）は正教会に編入された。ローマ・カトリック（ポーランド人の貴族、北西部のベラルーシ人）は1割前後で、町にはユダヤ教徒が多い。
      source: "https://en.wikipedia.org/wiki/Synod_of_Polotsk"
    - from: 1922
      main: orthodox
      note: ソ連時代の無神論政策で教会は弾圧された（地図は伝統的な帰属）。

- id: rel_belarus_west
  name: ベラルーシ西部（グロドノ・ブレスト）
  select:
    adm1: ["BLR/Grodno", "BLR/Brest"]
  timeline:
    - from: 1648
      main: catholic
      minor: orthodox
      note: ローマ・カトリック（ポーランド人・リトアニア人）とユニエイトのルーシ人が多い。ブレストはブレスト合同の地。
    - from: 1839
      main: orthodox
      minor: catholic
      note: ポロツク教会会議（1839）でユニエイト教会が廃止され、ルーシ人の農民は正教会に移された。ポーランド人とカトリックのベラルーシ人が多いので、ローマ・カトリックは2〜3割ほど残る。
      source: "https://en.wikipedia.org/wiki/Synod_of_Polotsk"

- id: rel_belarus_nw
  name: ベラルーシ北西部（グロドノ・リダ・アシュミャニ・ブラスラフ）
  select:
    pieces: [BLR-Grodno, BLR-Lida, BLR-Iwye, BLR-Shchuchyn, BLR-Voranava, BLR-Ashmyany, BLR-Astravyets, BLR-Smarhon, BLR-Braslaw]
  timeline:
    - from: 1648
      main: catholic
      minor: orthodox
      note: リトアニアに近く、ローマ・カトリックのポーランド人・ベラルーシ人（リトアニア人を含む）が多い。ルーシ人の農民は正教徒とユニエイト。
    - from: 1839
      main: catholic
      minor: orthodox
      note: 1839年にユニエイトは正教会に移されたが、この地方ではローマ・カトリックが多数のまま（1897年の調査でも、ヴィリナ県・グロドノ県北部の郡ではカトリックが多い）。（郡の範囲は目安）

- id: rel_lith_1793
  name: ベラルーシ中部・ウクライナ北西部（1793年ロシア領）
  select:
    regions: [lith_1793]
  timeline:
    - from: 1648
      main: orthodox
      minor: catholic
    - from: 1700
      main: catholic
      minor: orthodox
      note: ユニエイトが広がる（ルーツク主教区の合同は1702年）。（時期は要確認）
    - from: 1795
      main: orthodox
      minor: catholic
      note: 第2次分割でロシア領になると、エカチェリーナ2世の政策で多くのユニエイトの村が正教会に移された（1794–96年）。
      source: "https://ja.wikipedia.org/wiki/ウクライナ東方カトリック教会"
    - from: 1839
      main: orthodox
      minor: catholic
      note: 残っていたユニエイトの教区も、ポロツク教会会議（1839）で正教会に編入された。ローマ・カトリックはポーランド人の貴族と一部の農民。1863年の1月蜂起の後はカトリック教会への圧力が強まる。

- id: rel_volhynia_west
  name: ヴォルィーニ西部
  select:
    regions: [volhynia_w]
  timeline:
    - from: 1648
      main: orthodox
      minor: catholic
    - from: 1702
      main: catholic
      minor: orthodox
      note: ルーツク主教区がユニエイトに加わる（1702）。（要確認）
    - from: 1796
      main: orthodox
      minor: catholic
      note: 第3次分割でロシア領になり、ユニエイトの多くが正教会に移された。
    - from: 1944
      main: orthodox
      note: 1943–44年、ウクライナ蜂起軍（UPA）によるポーランド人の虐殺（ヴォルィーニの虐殺）と、それに対する報復が起き、1944–46年の住民交換で残ったポーランド人（ローマ・カトリック）もポーランドへ移った。
      source: "https://en.wikipedia.org/wiki/Massacres_of_Poles_in_Volhynia_and_Eastern_Galicia"

- id: rel_right_bank
  name: ドニエプル右岸（キエフ県・ブラーツラフ県・ポドリア東部）
  select:
    regions: [r_north, r_south, podolia_e]
  timeline:
    - from: 1648
      main: orthodox
      note: コサックの反乱（フメリニツキーの乱）で正教徒の地となる。ポーランド人の貴族とユダヤ教徒も多い。
    - from: 1720
      main: catholic
      minor: orthodox
      note: ポーランド領に戻った右岸ではユニエイトが広がり、18世紀半ばには多数派になる。正教徒の反発は1768年のコリーイウシチナ（ハイダマキの反乱）に至る。（時期と比率は要確認）
    - from: 1795
      main: orthodox
      minor: catholic
      note: ロシア領になり、ユニエイトの大部分が正教会に移された（1794–96年）。

- id: rel_galicia_east
  name: ガリツィア東部・ポドリア西部（ルテニア）
  select:
    regions: [galicia_ua, tarnopol_rut, tarnopol_pod, podolia_w]
  timeline:
    - from: 1648
      main: orthodox
      minor: catholic
      note: ルーシ人（ウクライナ人）は正教徒が多い。都市にはポーランド人のカトリック、アルメニア人、ユダヤ教徒が住む。
    - from: 1700
      main: catholic
      minor: orthodox
      note: プシェミシル（1691）・リヴィウ（1700）・ルーツク（1702）の主教区がユニエイトに加わり、ルーシ人の多くがギリシア・カトリック（東方典礼カトリック）になる。
      source: "https://ja.wikipedia.org/wiki/ウクライナ東方カトリック教会"
    - from: 1772
      main: catholic
      note: オーストリア領ガリツィア。ルーシ人（ウクライナ人）はほとんどがギリシア・カトリック（カトリックに数える）で、正教徒はわずか。ポーランド人はローマ・カトリック。ユダヤ教徒が人口の1割前後（町では3〜5割）を占める。1808年にリヴィウ府主教座が置かれ、ギリシア・カトリック教会はウクライナ人の民族運動の拠り所になる。
    - from: 1946
      main: orthodox
      minor: catholic
      note: 1944–46年にポーランド人（ローマ・カトリック）はポーランドへ移された。1946年、ソ連当局が開かせた「リヴィウ教会会議」で、ギリシア・カトリック教会はロシア正教会に強制的に合同させられ、聖職者は逮捕された。教会は地下で続いた。
      source: "https://en.wikipedia.org/wiki/Ukrainian_Greek_Catholic_Church"
    - from: 1990
      main: catholic
      minor: orthodox
      note: 1989年にギリシア・カトリック教会が再び認められ、多くの教会が戻った。ガリツィアでは今もギリシア・カトリックが最大の宗派（カトリックに数える）。

- id: rel_zakarpattia
  name: ザカルパッチャ
  select:
    regions: [zakarpattia]
  timeline:
    - from: 1648
      main: catholic
      minor: reformed
      note: ルシン人はウジホロド合同（1646）でユニエイトに。ハンガリー人は改革派が多い。
    - from: 1949
      main: orthodox
      minor: catholic
      note: 1945年にソ連領。1949年にムカチェヴォのギリシア・カトリック教会は廃止され、正教会に合同させられた（1989年に復活）。ハンガリー人の改革派とカトリックも残る。1944年には町のユダヤ人がアウシュヴィッツへ送られた。
      source: "https://en.wikipedia.org/wiki/Ruthenian_Greek_Catholic_Church"

# ======== ウクライナ東部・南部 ========
- id: rel_ukraine
  name: ウクライナ（左岸・スロボダ・ザポロージャ・ブコヴィナ）
