# 宗教（宗派）の分布：北欧・バルト・ポーランド＝リトアニア・ロシア・ウクライナ・北カフカス（1648–1914）
# 形式は docs/religion-format.md。main = 住民の多数派、minor = 2〜3割以上の少数派。
# 東方典礼カトリック（ユニエイト。ブレスト合同1596）はカトリックに含め、note に書く。

# ======== 北欧・バルト ========
- id: rel_nordic
  name: 北欧（デンマーク・ノルウェー・スウェーデン・フィンランド）
  select:
    iso: [DNK, NOR, SWE, FIN]
  timeline:
    - from: 1453
      main: catholic
      note: "カルマル連合のもとの北欧。"
    - from: 1527
      main: catholic
      minor: lutheran
      note: "スウェーデンのグスタヴ1世がヴェステロース議会（1527）で教会の財産を没収し、宗教改革を始める。"
      source: "https://ja.wikipedia.org/wiki/スウェーデンの宗教改革"
    - from: 1540
      main: lutheran
      note: "デンマーク＝ノルウェーのクリスチャン3世が1536–37年にルター派の国教会を定める。フィンランドではアグリコラがフィンランド語の新約聖書を出す（1548）。北部のサーミ人のもとでは伝統的な信仰が強く残る。"
      source: "https://ja.wikipedia.org/wiki/デンマークの宗教改革"
    - from: 1648
      main: lutheran
      note: ルター派の国教会。北部のサーミ人への伝道は17〜18世紀に進む。
    - from: 1960
      main: lutheran
      note: 北欧の国教会（ルター派）には今も多くの人が属しているが、教会に通う人は少なく、世俗化が最も進んだ地域の一つ。スウェーデンは2000年に国教会を廃止した。

- id: rel_baltic_lutheran
  name: エストニア・リヴォニア・クールラント
  select:
    iso: [EST, LVA]
  timeline:
    - from: 1453
      main: catholic
      note: "リヴォニア騎士団と司教たちの国。エストニア人・ラトヴィア人の農民の信仰はうわべだけで、古い信仰が残る。"
    - from: 1525
      main: catholic
      minor: lutheran
      note: "リガ（1522）・レヴァル（1524）・ドルパト（1525）の町がルター派となる。"
    - from: 1560
      main: lutheran
      note: "リヴォニア騎士団国家の解体（1561）。北部はスウェーデン、クールラントはポーランドの封臣の公国となり、ルター派が定着する。"
    - from: 1648
      main: lutheran
      note: ドイツ人の領主・都市市民と、エストニア人・ラトヴィア人の農民はルター派。1710年以降のロシア支配でもルター派の教会は維持された。
    - from: 1845
      main: lutheran
      note: 1845–48年、リヴォニア・エストニア南部の農民の一部（地方によって1〜2割）が、土地をもらえるという噂から正教に改宗した。多数派はルター派のまま。1880年代からはロシア化政策で正教会の建設も進む。
    - from: 1945
      main: lutheran
      note: 1940年にソ連が併合し、戦後は教会が弾圧された。エストニアとラトヴィアは今もヨーロッパで最も世俗化が進んだ地域で、宗教を持たない人が多い（地図は伝統的な帰属）。ロシア語の住民（正教会）が増え、ラトヴィア東部（ラトガレ）はカトリック。
      source: "https://en.wikipedia.org/wiki/Religion_in_Estonia"

- id: rel_latgale
  name: ラトガレ（旧ポーランド領リヴォニア）
  select:
    regions: [latgale]
  timeline:
    - from: 1453
      main: catholic
      note: "リヴォニアのうちポーランド＝リトアニアに残った地方（ポーランド領リヴォニア 1561–）。イエズス会の布教でカトリックが保たれる。"
    - from: 1648
      main: catholic
      note: ポーランド＝リトアニア領のため、対抗宗教改革でカトリックが根付いた。ロシアからの古儀式派の移住者も多い。

- id: rel_lithuania
  name: リトアニア
  select:
    iso: [LTU]
  timeline:
    - from: 1453
      main: catholic
      note: "リトアニアは1387年（ジェマイティヤは1413年）にカトリックを受け入れた。16世紀なかばに大貴族（ラジヴィウ家など）にカルヴァン派が広がるが、ヴィルノのイエズス会の学院（1579、のち大学）を中心に対抗宗教改革が進む。"
      source: "https://ja.wikipedia.org/wiki/ヴィリニュス大学"
    - from: 1648
      main: catholic
      note: リトアニア人はカトリック。ヴィリニュスはユダヤ教の中心地の一つ（「北のエルサレム」）。
    - from: 1945
      main: catholic
      note: ソ連時代も、カトリック教会は民族の拠り所として信仰が保たれた（1972年の『リトアニア・カトリック教会年代記』など）。

- id: rel_memel_prussia
  name: 東プロイセン（旧プロイセン公国）とメーメル
  select:
    regions: [memel, ducal_prussia]
  timeline:
    - from: 1453
      main: catholic
      note: "ドイツ騎士団国家。"
    - from: 1525
      main: lutheran
      note: "騎士団総長アルブレヒトがルター派となり、ポーランドの封臣のプロイセン公国となる（最初のルター派の国）。"
      source: "https://ja.wikipedia.org/wiki/プロイセン公国"
    - from: 1648
      main: lutheran
      note: 1525年に世俗化した最初のルター派の国。南部のマズーリ人（ポーランド語を話す）もルター派。1732年にはザルツブルクを追われたプロテスタントが入植した。

# ======== ポーランド ========
- id: rel_poland
  name: ポーランド（王冠領）
  select:
    iso: [POL]
  timeline:
    - from: 1453
      main: catholic
      note: "16世紀に貴族（シュラフタ）の一部がカルヴァン派、都市のドイツ人がルター派となり、ワルシャワ連盟協約（1573）で宗派の平和が約束される。農民の多数はカトリックのままで、ジグムント3世（1587–1632）とイエズス会のもとで対抗宗教改革が進む。南東部のルーシ人（ウクライナ人）は正教徒。"
      source: "https://ja.wikipedia.org/wiki/ワルシャワ連盟協約"
    - from: 1648
      main: catholic
      note: カトリックが多数。ワルシャワ連盟協約（1573）の宗教寛容はしだいに後退し、1658年にはアリウス派（ポーランド兄弟団）が追放された。ユダヤ教徒の人口も多い。
    - from: 1942
      main: catholic
      note: ホロコーストで、ポーランドのユダヤ人（戦前の人口の約1割）の約9割が殺害された。戦後の国境の移動と住民の移動で、ポーランドはほぼカトリックだけの国になった。共産党政権の下でもカトリック教会は大きな力を保ち、1978年にクラクフ大司教がローマ教皇ヨハネ・パウロ2世となった。
      source: "https://ja.wikipedia.org/wiki/ホロコースト"

- id: rel_chelm_eparchy
  name: ヘウム（ホルム）地方・南ポドラシェ（ユニエイトのヘウム主教区）
  select:
    pieces: [POL-Che_m, POL-powiat_che_mski, POL-powiat_hrubieszowski, POL-powiat_w_odawski, POL-Bia_a_Podlaska, POL-powiat_bialski]
  timeline:
    - from: 1453
      main: orthodox
      minor: catholic
    - from: 1596
      main: catholic
      minor: orthodox
      note: "ブレスト合同（1596）でヘウム主教区は東方典礼カトリック（ユニエイト）に加わる（地図ではカトリックに含める）。"
      source: "https://ja.wikipedia.org/wiki/ブレスト合同"
    - from: 1648
      main: catholic
      note: ポーランド人のローマ・カトリックと、ユニエイト（ギリシア・カトリック）のルーシ人の村が混在する。どちらもカトリックに数える。町にはユダヤ教徒が多い。
    - from: 1875
      main: catholic
      minor: orthodox
      note: ロシア政府が会議王国に残ったヘウム主教区のユニエイト教会を廃止し（1875）、信徒を正教会に移した。抵抗した村（プラトゥリンなど）は弾圧された。1905年の寛容令の後、10万人以上がローマ・カトリックに移る。（比率は要確認）
      source: "https://ja.wikipedia.org/wiki/ウクライナ東方カトリック教会"
    - from: 1947
      main: catholic
      note: 1944–46年の住民交換で、正教徒・ギリシア・カトリックのウクライナ人の大部分がソ連領へ移され、残った人も1947年のヴィスワ作戦でポーランド西部・北部へ移された。
      source: "https://en.wikipedia.org/wiki/Operation_Vistula"


