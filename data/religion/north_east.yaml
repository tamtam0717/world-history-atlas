# ======== ベラルーシ・ウクライナ西部 ========
- id: rel_belarus
  name: ベラルーシ（東部・中部）
  select:
    iso: [BLR]
  timeline:
    - from: 1453
      main: orthodox
      note: "リトアニア大公国のルーシ（ベラルーシ）の地。16世紀なかばに貴族の一部がカルヴァン派となる（ネスヴィジのラジヴィウ家など）。"
    - from: 1596
      main: orthodox
      minor: catholic
      note: "ブレスト合同（1596）で、正教会の主教の多くがローマ教皇の首位を認める東方典礼カトリック（ユニエイト）を作る（地図ではカトリックに含める）。民衆の多くは正教会にとどまり、対立が続く。"
      source: "https://ja.wikipedia.org/wiki/ブレスト合同"
    - from: 1648
      main: orthodox
      minor: catholic
      note: ルーシ人の農民は正教徒とユニエイト（ブレスト合同1596）に分かれる。貴族はカトリックに改宗していく。
      source: "https://ja.wikipedia.org/wiki/ブレスト合同"
    - from: 1700
      main: catholic
      minor: orthodox
      note: 18世紀にはユニエイト（東方典礼カトリック）がベラルーシの農民の多数派になる。1772年以後のロシア領でもユニエイト教会は1839年まで存続した。（時期は要確認）
    - from: 1839
      main: orthodox
      note: ポロツク教会会議（1839）で、ロシア帝国内のユニエイト教会は廃止され、信徒（約160万人）は正教会に編入された。ローマ・カトリック（ポーランド人の貴族、北西部のベラルーシ人）は1割前後で、町にはユダヤ教徒が多い。
      source: "https://en.wikipedia.org/wiki/Synod_of_Polotsk"
    - from: 1922
      main: orthodox
      note: ソ連時代の無神論政策で教会は弾圧された（地図は伝統的な帰属）。

