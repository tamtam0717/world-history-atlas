- id: rel_derbent
  name: デルベント
  select:
    regions: [derbent]
  timeline:
    - from: 1648
      main: shia
      minor: sunni
      note: サファヴィー朝以来のシーア派の町。周辺の山地はスンナ派。

- id: rel_ossetia
  name: オセチア
  select:
    regions: [ossetia]
  timeline:
    - from: 1648
      main: orthodox
      minor: sunni
      note: オセット人の多くは名目上キリスト教徒（伝統的な信仰と混ざる）。ディゴル地方の貴族などはムスリム。1740年代からロシアの伝道団が活動する。（要確認）

- id: rel_kizlyar
  name: テレク川下流（キズリャル）
  select:
    regions: [kizlyar]
  timeline:
    - from: 1648
      main: orthodox
      minor: sunni
      note: テレク・コサック（古儀式派が多い）の地。ノガイ人・クムク人も住む。キズリャルにはアルメニア人も多い。

- id: rel_kuban
  name: クバン川右岸・北カフカスの草原
  select:
    regions: [kuban]
  timeline:
    - from: 1648
