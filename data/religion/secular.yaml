# 世俗化（無宗教・宗教離れ）の割合の目安（docs/religion-format.md の「世俗化」）
#
# ここに書く地域は「世俗化だけの地域」：timeline の項目に main を書かず secular だけを書く。
# 多数派（main / minor）の判定には使わず、地図では下の宗派の色を secular に応じて薄くする。
# 値は 0〜1 の大まかな目安（0.5 なら住民の半分程度が無宗教・宗教離れ）。統計・調査の数字をそのまま写すのではなく、
# 「信仰がどのくらい弱まったか」を地図で見せるための目安として丸めている。
# 重なったときは小さい地域が優先（secular: 0 と書けば、外側の大きい地域の値を打ち消せる）。
# 各項目の値は次の項目の年まで続くので、元に戻るときは項目を足して値を下げる。

# ---- ソ連（1922 年の成立以後。無神論の宣伝と教会の弾圧で、1930 年代に急速に進む） ----
- id: sec_russia
  name: ロシア（ソ連・ロシア連邦）
  select:
    iso: [RUS]
  timeline:
    - from: 1922
      secular: 0.15
      note: ソ連の成立。教会財産の没収と聖職者の弾圧が始まる
    - from: 1930
      secular: 0.4
      note: 農業集団化と「戦闘的無神論者同盟」の運動で、教会の多くが閉鎖される
    - from: 1937
      secular: 0.5
      note: 大粛清で聖職者の多くが処刑・投獄される（1937年の国勢調査でも、なお住民の過半が信者と答えた）
      source: "https://ja.wikipedia.org/wiki/ソビエト連邦における宗教"
    - from: 1943
      secular: 0.45
      note: 独ソ戦の中でスターリンが正教会と和解し、総主教座が復活する
    - from: 1959
      secular: 0.6
      note: フルシチョフの反宗教運動で、再び多くの教会が閉鎖される
    - from: 1988
      secular: 0.45
      note: ルーシの洗礼千年祭。ペレストロイカの中で教会の活動が認められる
    - from: 1991
      secular: 0.3
      note: ソ連の解体。正教会の復興が進むが、信仰を実践する人は少ない
