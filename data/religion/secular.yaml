    - from: 1949
      secular: 0
    - from: 1959
      secular: 0.2
      note: チベット蜂起の後、僧院の多くが閉鎖され、僧が還俗させられる
    - from: 1966
      secular: 0.6
      note: 文化大革命で寺院の大部分が破壊される
    - from: 1980
      secular: 0.25
      note: 寺院の再建が進み、信仰は根強く残る（宗教活動への規制は続く）
