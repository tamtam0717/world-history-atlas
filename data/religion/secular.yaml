# ======== 東南アジア（S6、2026-11-21） ========
# ベトナムは中国（sec_china）の考え方に合わせる：共産党政権の下で信仰の活動が制限され、国勢調査では8割以上が「無宗教」と答えるが、
# 祖先祭祀や寺・廟への参拝は広く続いているので、中国よりやや低めの値にする。
- id: sec_vietnam
  name: ベトナム（北ベトナム）
  select:
    iso: [VNM]
  timeline:
    - from: 1954
      secular: 0.25
      note: ベトナム民主共和国（北ベトナム）が北部を治める。土地改革（1953–56）で村の寺・廟の土地が没収された。
    - from: 1960
      secular: 0.45
      note: 合作社化と反宗教政策。カトリックの多くは 1954 年に南へ移った。
    - from: 1986
      secular: 0.4
      note: ドイモイ（刷新）政策の後、寺・廟の祭りや祖先祭祀が復活した。
