# ---- 東アジア（docs/religion-format.md の「東アジア」） ----
- id: sec_china
  name: 中国（中華人民共和国）
  select:
    iso: [CHN]
  timeline:
    - from: 1949
      secular: 0.2
      note: 中華人民共和国の成立。宗教団体は国家の管理下に置かれる
    - from: 1958
      secular: 0.4
      note: 大躍進と人民公社化で、廟や祠の多くが取り壊される
    - from: 1966
      secular: 0.7
      note: 文化大革命。「四旧打破」で寺院・教会・モスク・祖先の廟が破壊され、宗教活動はほぼ禁止された
      source: "https://ja.wikipedia.org/wiki/文化大革命"
    - from: 1978
      secular: 0.55
      note: 改革開放。1982 年の憲法で信仰の自由が認められ、寺院や教会が再開する
    - from: 2000
      secular: 0.5
      note: 無宗教と答える人が多数だが、祖先祭祀や民間信仰の行事は広く行われる
- id: sec_tibet_qinghai
  name: チベット仏教の地域（チベット・青海など）
  select:
    regions: [rel_tibet]
