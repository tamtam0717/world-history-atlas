# ======== 日本 ========
- id: rel_japan
  name: 日本
  select:
    iso: [JPN]
  timeline:
    - from: 1453
      main: shinbutsu
      note: 室町・戦国時代。神仏習合のもとで、浄土真宗（本願寺の蓮如が北陸・近畿に広める）・日蓮宗・禅宗が民衆や武士に広まった。一向一揆（加賀は 1488–1580 年に門徒が支配）や法華一揆が起こり、織田信長は延暦寺を焼き（1571）、石山本願寺と戦った（1570–80）。
      source: "https://ja.wikipedia.org/wiki/一向一揆"
    - from: 1549
      main: shinbutsu
      note: ザビエルが鹿児島に来てキリスト教を伝えた（1549）。キリシタンは九州・畿内に広がり、17 世紀初めに約 30 万人（人口の約 2％）。江戸幕府は禁教令（1612・1614）を出し、寺請制度で住民をどこかの寺の檀家にした。
      source: "https://ja.wikipedia.org/wiki/日本のキリスト教史"
    - from: 1648
      main: shinbutsu
      note: 神仏習合。江戸幕府はキリスト教を禁じ（島原・天草一揆の後、1639 年にポルトガル船の来航を禁止）、寺請制度ですべての人を寺の檀家にした。長崎の浦上・五島などに潜伏キリシタンが残った。
      source: "https://ja.wikipedia.org/wiki/寺請制度"
    - from: 1868
      main: shinbutsu
      note: 明治政府の神仏分離令（1868）で廃仏毀釈が起こり、神社は国家の祭祀とされた（国家神道）。1873 年にキリスト教の禁止の高札が撤去された。住民の多くは神社と寺の両方に関わり続けた。
      source: "https://ja.wikipedia.org/wiki/神仏分離"
    - from: 1945
      main: shinbutsu
      note: GHQ の神道指令（1945）で国家神道が廃止され、日本国憲法で政教分離が定められた。戦後は創価学会などの新宗教が広がる。信仰を持つと答える人は少ないが、初詣・墓参り・葬式などの行事は広く続く（世俗化は secular.yaml）。
      source: "https://ja.wikipedia.org/wiki/神道指令"
- id: rel_nagasaki_pre
  name: 長崎・大村・有馬（キリシタンの地、1453–1647）
  select:
    pieces: [JPN-Nagasaki_Prefecture]
  until: 1647
  timeline:
    - from: 1453
      main: shinbutsu
    - from: 1570
      main: shinbutsu
      minor: catholic
      note: ザビエルの来日（1549）の後、大村純忠（1563 年に洗礼）・有馬晴信らのキリシタン大名の領地で住民の多くがキリスト教徒になった。長崎は 1571 年に開港し、1580 年にイエズス会に寄進された。天正遣欧使節（1582–90）。日本全体のキリシタンは 17 世紀初めに 30 万人ほど（人口の約 2％）。
      source: "https://ja.wikipedia.org/wiki/キリシタン"
    - from: 1638
      main: shinbutsu
      note: 豊臣秀吉のバテレン追放令（1587）、江戸幕府の禁教令（1612・1614）、二十六聖人の殉教（1597）・元和の大殉教（1622）を経て、島原・天草一揆（1637–38）の後は寺請制度と絵踏で信者は表から消え、一部は潜伏キリシタンとして信仰を守った。
      source: "https://ja.wikipedia.org/wiki/島原の乱"
