      main: other
      minor: shinbutsu
      note: アイヌの信仰（カムイ、イオマンテ）。南西端の和人地（松前藩。別のピースで rel_japan の神仏習合）には和人の寺社がある。
      source: "https://ja.wikipedia.org/wiki/アイヌ"
    - from: 1869
      main: shinbutsu
      minor: other
      note: 蝦夷地を北海道と改め、開拓使を置いた（1869）。屯田兵や移民の入植が始まる。
      source: "https://ja.wikipedia.org/wiki/開拓使"
    - from: 1890
      main: shinbutsu
      note: 和人の人口が急増し、アイヌは人口の数％になった。北海道旧土人保護法（1899）で同化政策がとられた。
- id: rel_okinawa
