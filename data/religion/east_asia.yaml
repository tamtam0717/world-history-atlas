# ======== 朝鮮 ========
- id: rel_korea
  name: 朝鮮
  select:
    iso: [KOR, PRK]
  timeline:
    - from: 1453
      main: mahayana
      minor: confucian
      note: 朝鮮王朝は朱子学を国の教えとし、太宗・世宗が仏教の宗派と寺院を整理した。しかし民衆や王室の女性の間では仏教と巫俗（シャーマニズム）がなお中心だった。
      source: "https://ja.wikipedia.org/wiki/崇儒排仏"
    - from: 1550
      main: confucian
      minor: mahayana
      note: 士林派の両班が郷約・書院を通じて朱子学の礼（祖先祭祀・家礼）を地方に広め、李滉（退渓）・李珥（栗谷）が朝鮮の朱子学を大成した。燕山君（1504）・中宗のときに僧の試験が止められ、仏教は山の寺に退いた。
      source: "https://ja.wikipedia.org/wiki/李滉"
    - from: 1610
      main: confucian
      note: 壬辰・丁酉倭乱（1592–98）では僧兵（西山大師休静・四溟堂惟政）も戦ったが、戦後は朱子学の礼が民衆にも広まった。
      source: "https://ja.wikipedia.org/wiki/文禄・慶長の役"
    - from: 1648
      main: confucian
      note: 朝鮮王朝は朱子学（儒教）を国教とし、仏教を抑えた（崇儒抑仏）。両班は祖先祭祀（茶礼・祭祀）を重んじ、民衆の間では巫俗（ムーダン、シャーマニズム）と仏教も信じられた。
      source: "https://ja.wikipedia.org/wiki/朝鮮の儒教"
    - from: 1784
      main: confucian
      note: 李承薫が北京で洗礼を受けて帰国し、カトリックの信者の集まりが生まれた（1784）。辛酉迫害（1801）・丙寅迫害（1866）などで多くの信者が処刑された。1860 年に崔済愚が東学を開いた。
      source: "https://ja.wikipedia.org/wiki/東学"
    - from: 1910
      main: confucian
      note: 日本の植民地支配の下で神社参拝が強制された（1930 年代）。プロテスタント（長老派・メソジスト）は北部で特に広まり、平壌は「東洋のエルサレム」と呼ばれた。三・一独立運動（1919）では天道教・キリスト教・仏教の指導者が独立宣言に署名した。
      source: "https://ja.wikipedia.org/wiki/三・一運動"
    - from: 1948
      main: confucian
      note: 北朝鮮では宗教が弾圧され、キリスト教徒の多くが南へ逃れた。韓国では朝鮮戦争の後、キリスト教が急速に広まった。
