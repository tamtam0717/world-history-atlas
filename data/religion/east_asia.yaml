  timeline:
    - from: 1453
      main: other
      minor: tibetan_buddhism
      note: オイラト（エセン＝ハーンが 1449 年の土木の変で正統帝を捕らえた）の遊牧地。シャーマニズムが中心で、仏教は元の時代の名残程度。
      source: "https://ja.wikipedia.org/wiki/オイラト"
    - from: 1616
      main: tibetan_buddhism
      note: オイラトの諸侯が 1615 年ごろからゲルク派に帰依し、ザヤ・パンディタ（1599–1662）がオイラトに仏教を広めた。
      source: "https://ja.wikipedia.org/wiki/ザヤ・パンディタ"
    - from: 1648
      main: tibetan_buddhism
      note: オイラト（ジュンガル部など）の遊牧地。オイラトはチベット仏教（ゲルク派）を信仰した。
    - from: 1760
      main: sunni
      note: 清の乾隆帝がジュンガルを滅ぼし（1755–58）、オイラトの人口は戦争と天然痘で激減した。イリにはタリム盆地からタランチ（ウイグル人の農民）が移され、19 世紀にはカザフ人の遊牧民が入った。シベ・満洲・ソロン（エヴェンキ）・チャハルの駐屯兵も置かれた。（タルバガタイ・アルタイ・ボルタラは下の地域で別に塗る）
      source: "https://ja.wikipedia.org/wiki/ジュンガル"
