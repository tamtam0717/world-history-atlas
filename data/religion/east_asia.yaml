      source: "https://ja.wikipedia.org/wiki/ザナバザル"
    - from: 1648
      main: tibetan_buddhism
      note: ハルハ・モンゴルの活仏ジェブツンダンバ・ホトクト1世（ザナバザル）が仏教を広めた。シャーマニズムも残る。
      source: "https://ja.wikipedia.org/wiki/ザナバザル"
