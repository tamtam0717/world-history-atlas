      minor: shinbutsu
      note: アイヌの信仰（カムイ、イオマンテ）。南西端の和人地（松前藩。別のピースで rel_japan の神仏習合）には和人の寺社がある。
      source: "https://ja.wikipedia.org/wiki/アイヌ"
