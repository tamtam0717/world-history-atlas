# 宗教の分布：東アジア（中国・台湾・日本・朝鮮・モンゴル）とシベリア・極東（1648–2025）
# 形式は docs/religion-format.md（「東アジア」の節に塗り分けの方針）。main = 住民の多数派、minor = 2〜3割以上の少数派。
# 東アジアの宗教は重層的なので、中国の漢人は chinese_folk（儒・仏・道の民間信仰）、日本の和人は shinbutsu（神道・仏教）、
# 朝鮮は confucian（儒教）で塗る。言語（data/language/east_asia.yaml）と切り替えの年をそろえている。

# ======== 中国 ========
- id: rel_china
  name: 中国本土
  select:
    iso: [CHN]
  timeline:
    - from: 1453
      main: chinese_folk
      note: 明の時代。朱子学が科挙の正統の学問で、民衆は祖先祭祀・仏教・道教と民間の神々を合わせて信仰した。16 世紀には王守仁（王陽明）の陽明学が広まり、儒・仏・道の三教を一つとみる考え（三教合一）が流行した。
      source: "https://ja.wikipedia.org/wiki/陽明学"
    - from: 1583
      main: chinese_folk
      note: イエズス会のマテオ＝リッチが肇慶に入り（1583）、1601 年に北京に住むことを許された。徐光啓らの士大夫が入信したが、信者は明末でも数万人ほどで少数。回族（中国語を話すムスリム）は各地の都市や西北・雲南に住む。
      source: "https://ja.wikipedia.org/wiki/マテオ・リッチ"
    - from: 1648
      main: chinese_folk
      note: 漢人の信仰は、祖先祭祀（儒教）・仏教・道教と、関帝・媽祖などの民間の神々の信仰が混ざり合ったもの。科挙で朱子学が正統の学問とされた。イエズス会の宣教（マテオ＝リッチ以来）でカトリックの信者もいたが、少数。
      source: "https://ja.wikipedia.org/wiki/中国の宗教"
    - from: 1724
      main: chinese_folk
      note: 典礼問題をきっかけに、雍正帝がキリスト教の布教を禁止した（1724）。回族（中国語を話すムスリム）は全国の都市や西北・雲南に住む。
      source: "https://ja.wikipedia.org/wiki/典礼問題"
    - from: 1851
      main: chinese_folk
      note: 洪秀全の上帝会（キリスト教の影響を受けた宗教結社）が太平天国を建てた（1851–64）。北京条約（1860）でキリスト教の布教が公認され、各地で教案（反キリスト教の事件）が起こり、義和団事件（1900）に至った。
      source: "https://ja.wikipedia.org/wiki/太平天国"
    - from: 1949
      main: chinese_folk
      note: 中華人民共和国の成立。宗教は国家の管理下に置かれ、文化大革命（1966–76）では寺院・教会・モスクの多くが破壊・閉鎖された。改革開放の後、信仰の活動は一部回復した。現在のキリスト教徒は人口の数％とされる（地図は伝統的な帰属。世俗化は secular.yaml）。
      source: "https://ja.wikipedia.org/wiki/中華人民共和国の宗教"

# ---- チベット仏教の地域（チベット・青海・四川西部・甘粛南部・雲南北西部） ----
- id: rel_tibet
  name: チベット（ウ・ツァン、カム、アムド）
  select:
    adm1: ["CHN/Tibet Autonomous Region"]
    pieces: [CHN-Yushu, CHN-Guoluo, CHN-Huangnan, CHN-Hainanzhou, CHN-Haibei, CHN-Ganzi, CHN-Aba, CHN-Gannan, CHN-Diqing]
  timeline:
    - from: 1453
      main: tibetan_buddhism
      note: ツォンカパ（1357–1419）が開いたゲルク派が広がり、カギュ派・サキャ派と競った。1578 年、ゲルク派のソナム・ギャツォがアルタン＝ハンから「ダライ・ラマ」の称号を受けた。1642 年、グシ・ハン（ホシュート部）がダライ・ラマ5世にチベットの政権を与えた。
      source: "https://ja.wikipedia.org/wiki/ゲルク派"
    - from: 1648
      main: tibetan_buddhism
      note: ダライ・ラマ5世（1642 年にグシ・ハンの支援でチベットの政権を握る）の下でゲルク派が優勢。ラサのポタラ宮は 1645 年に建設が始まる。アムド（青海）・カム（四川西部）も同じチベット仏教圏。
      source: "https://ja.wikipedia.org/wiki/チベット仏教"
    - from: 1959
      main: tibetan_buddhism
      note: 1959 年のチベット蜂起の後、ダライ・ラマ14世がインドに亡命した。文化大革命で多くの寺院が破壊された。1980 年代から寺院の再建が進んだが、宗教活動への規制は続いている。
      source: "https://ja.wikipedia.org/wiki/1959年のチベット蜂起"
- id: rel_haibei
  name: 青海北部（海北）
  select:
    pieces: [CHN-Haibei]
  timeline:
    - from: 1648
      main: tibetan_buddhism
      note: チベット人とモンゴル人（ホシュート部）の牧地
    - from: 1960
      main: chinese_folk
      minor: tibetan_buddhism
      secular: 0.4
      note: 漢人の移住で漢人が最大になる。回族も多い（イスラーム）。世俗化は中国本土（sec_china）と同じ値にしている。
    - from: 1966
      main: chinese_folk
      minor: tibetan_buddhism
      secular: 0.7
    - from: 1978
      main: chinese_folk
      minor: tibetan_buddhism
      secular: 0.55
    - from: 2000
      main: chinese_folk
      minor: tibetan_buddhism
      secular: 0.5
- id: rel_haixi
  name: 青海のツァイダム盆地（海西・ゴルムド）
  select:
    pieces: [CHN-Haixi, CHN-Geermu]
  timeline:
    - from: 1453
      main: tibetan_buddhism
    - from: 1648
      main: tibetan_buddhism
      note: ホシュート部などのモンゴル人とチベット人の牧地
    - from: 1960
      main: chinese_folk
      minor: tibetan_buddhism
      note: 1950 年代から、青蔵公路の起点となったゴルムドの建設や油田・塩湖の開発で漢人が移り住み、多数派になった。
- id: rel_xining
  name: 西寧と湟水の谷（西寧・海東）
  select:
    pieces: [CHN-Xining, CHN-Haidong]
  timeline:
    - from: 1453
      main: chinese_folk
      minor: sunni
    - from: 1648
      main: chinese_folk
      minor: sunni
      note: 漢人・回族・サラール人（ムスリム）・土族（モンゴル系）・チベット人が混住する。ゲルク派の開祖ツォンカパの生地に建つタール寺（クンブム）がある。
      source: "https://ja.wikipedia.org/wiki/タール寺"
- id: rel_linxia
  name: 甘粛の臨夏（河州）
  select:
    pieces: [CHN-Linxia]
  timeline:
    - from: 1453
      main: sunni
      minor: chinese_folk
    - from: 1648
      main: sunni
      minor: chinese_folk
      note: 回族・東郷族・保安族・サラール人などのムスリムが多く、「中国の小メッカ」と呼ばれる。スーフィー教団（門宦）の中心地。
      source: "https://ja.wikipedia.org/wiki/臨夏回族自治州"
- id: rel_ningxia
  name: 寧夏
  select:
    adm1: ["CHN/Ningxia Ningxia Hui Autonomous Region"]
  timeline:
    - from: 1453
      main: chinese_folk
      minor: sunni
    - from: 1648
      main: chinese_folk
      minor: sunni
      note: 回族（ムスリム）が人口の3分の1ほど。南部（固原・呉忠）に多い。陝西・甘粛の回民蜂起（1862–77）の後、回族は寧夏南部・甘粛に移された。
      source: "https://ja.wikipedia.org/wiki/回民蜂起"

# ---- 新疆 ----
- id: rel_tarim
  name: タリム盆地（東トルキスタン南部：カシュガル・ホータン・アクス・トゥルファン）
  select:
