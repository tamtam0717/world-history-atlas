# ======== 日本 ========
- id: rel_japan
  name: 日本
  select:
    iso: [JPN]
  timeline:
    - from: 1648
      main: shinbutsu
      note: 神仏習合。江戸幕府はキリスト教を禁じ（島原・天草一揆の後、1639 年にポルトガル船の来航を禁止）、寺請制度ですべての人を寺の檀家にした。長崎の浦上・五島などに潜伏キリシタンが残った。
      source: "https://ja.wikipedia.org/wiki/寺請制度"
    - from: 1868
      main: shinbutsu
      note: 明治政府の神仏分離令（1868）で廃仏毀釈が起こり、神社は国家の祭祀とされた（国家神道）。1873 年にキリスト教の禁止の高札が撤去された。住民の多くは神社と寺の両方に関わり続けた。
      source: "https://ja.wikipedia.org/wiki/神仏分離"
    - from: 1945
      main: shinbutsu
      note: GHQ の神道指令（1945）で国家神道が廃止され、日本国憲法で政教分離が定められた。戦後は創価学会などの新宗教が広がる。信仰を持つと答える人は少ないが、初詣・墓参り・葬式などの行事は広く続く（世俗化は secular.yaml）。
      source: "https://ja.wikipedia.org/wiki/神道指令"
- id: rel_hokkaido
  name: 蝦夷地・北海道
  select:
    pieces: [JPN-Hokkaido]
  timeline:
