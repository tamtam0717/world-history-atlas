      note: モグーリスタン（東チャガタイ＝ハン国）のトゥグルク＝ティムール（14 世紀）の改宗以後、タリム盆地のオアシスのテュルク系住民はムスリムになった。16 世紀にはヤルカンド＝ハン国（1514–）の下でナクシュバンディー教団のホージャ家が力をもった。
      source: "https://ja.wikipedia.org/wiki/ヤルカンド・ハン国"
    - from: 1648
      main: sunni
      note: オアシス都市のテュルク系ムスリム（のちのウイグル人）。カシュガル・ホージャ家（ナクシュバンディー教団）が宗教と政治の権威をもった。
      source: "https://ja.wikipedia.org/wiki/ホージャ家"
- id: rel_akesu
  name: アクス
  select:
    pieces: [CHN-Akesu]
  timeline:
    - from: 1648
      main: sunni
    - from: 1980
      main: sunni
      minor: chinese_folk
      note: 新疆生産建設兵団などの移住で漢人が人口の3割近くになる。
- id: rel_hami
  name: ハミ（クムル）
  select:
    pieces: [CHN-Hami]
  timeline:
    - from: 1453
      main: mahayana
      minor: sunni
      note: ハミ（哈密）は明の羈縻の衛（哈密衛）で、王家と住民の多くはまだウイグル人の仏教徒で、ムスリムも混じった。
      source: "https://ja.wikipedia.org/wiki/哈密衛"
    - from: 1515
      main: sunni
      note: トゥルファンのハン（モグール）がハミを支配し（1513 年ごろ）、住民のイスラーム化が進んだ。
      source: "https://ja.wikipedia.org/wiki/トルファン"
    - from: 1648
      main: sunni
      note: ハミ王家（ウイグル人の王侯）が清に早くから服属した。
    - from: 1960
      main: chinese_folk
      minor: sunni
      note: 鉄道（蘭新線）の開通と移住で、漢人が多数になる。
- id: rel_turfan_pre
  name: トゥルファン（1453–1647）
  select:
    pieces: [CHN-Tulufan]
  until: 1647
  timeline:
    - from: 1453
      main: sunni
      minor: mahayana
      note: トゥルファンのウイグル人は 15 世紀にイスラームに改宗した。1414 年に明の使節陳誠が仏寺の多さを記したが、15 世紀半ばにはモグールのハンのもとでムスリムが多数になり、仏教徒は残った。
      source: "https://ja.wikipedia.org/wiki/トルファン"
    - from: 1500
      main: sunni
      note: トゥルファン＝ハン国（モグーリスタンの東部）のもとでイスラーム化が終わる。
- id: rel_bayingol
