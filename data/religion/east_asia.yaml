      note: アルタン＝ハンがソナム・ギャツォ（ダライ・ラマ3世）と青海で会見し（1578）、モンゴルにチベット仏教（ゲルク派）が再び広まった。ハルハのアバタイ＝ハンはエルデニ・ゾー寺を建てた（1586）。ダライ・ラマ4世（1589–1617）はアルタン＝ハンの曾孫。
      source: "https://ja.wikipedia.org/wiki/アルタン・ハーン"
    - from: 1630
