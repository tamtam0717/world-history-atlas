    - from: 1648
      main: tibetan_buddhism
      note: ジュンガル（オイラト）の本拠地
    - from: 1760
      main: sunni
      note: ジュンガルの滅亡の後、タランチ（ウイグル人の農民）が移され、19 世紀にはカザフ人の遊牧民が入った。満洲・シベ・ソロン・チャハルの駐屯兵も置かれた。
    - from: 1970
