      note: 漢人・回族・サラール人（ムスリム）・土族（モンゴル系）・チベット人が混住する。ゲルク派の開祖ツォンカパの生地に建つタール寺（クンブム）がある。
      source: "https://ja.wikipedia.org/wiki/タール寺"
- id: rel_linxia
  name: 甘粛の臨夏（河州）
  select:
    pieces: [CHN-Linxia]
  timeline:
    - from: 1648
      main: sunni
