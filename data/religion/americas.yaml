  name: プエルトリコ
  select:
    adm1: ["USA/Puerto Rico"]
  timeline:
    - from: 1648
      main: catholic
      note: スペインの植民地（サンフアン 1521）。
    - from: 1980
      main: catholic
      minor: evangelical
      note: 米西戦争（1898）でアメリカ領になった後、プロテスタントの伝道が進み、20 世紀後半にペンテコステ派が広がった。
- id: rel_usvi
  name: アメリカ領ヴァージン諸島（旧デンマーク領西インド諸島）
  select:
    adm1: ["USA/United States Virgin Islands"]
  timeline:
    - from: 1648
      main: anglican
      minor: reformed
      note: セント・クロイ島にイギリス人・オランダ人の小さな入植地があった。セント・トーマス島・セント・ジョン島はほぼ無人。
    - from: 1651
      main: catholic
      note: フランス（1651 年にマルタ騎士団、1665 年からフランス西インド会社）がセント・クロイ島に入植した。住民は数百人程度。
    - from: 1672
      main: lutheran
      note: デンマーク西インド会社のセント・トーマス島（1672）。デンマークの国教会（ルター派）。
    - from: 1690
      main: other
      minor: lutheran
      note: 砂糖の農園でアフリカ系の奴隷が住民の多数になった（1691 年のセント・トーマス島は奴隷 555 人、白人 389 人）。ルター派の国教会は奴隷への伝道に消極的で、奴隷の多くは故郷の信仰を保った。
    - from: 1760
      main: evangelical
      minor: anglican
      note: モラヴィア兄弟団の伝道（1732–）で、アフリカ系の奴隷の多くが改宗した。セント・クロイ島（1733 年にフランスから購入）はイギリス系の農園主が多く、国教会も広がった。
      source: "https://en.wikipedia.org/wiki/Moravian_Church_in_the_Virgin_Islands"
    - from: 1920
      main: evangelical
      minor: catholic
      note: 1917 年にアメリカ合衆国が購入した。

