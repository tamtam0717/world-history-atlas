      main: other
      note: カトーバ人・ワテリー人・コンガリー人などの地。
    - from: 1740
      main: anglican
      note: 内陸の「タウンシップ」（オレンジバーグ 1735、サックス＝ゴータ 1735 など）に、ドイツ系・スイス系・スコットランド系アイルランド人・ウェールズ系（バプテスト）が入植した。
    - from: 1790
      main: evangelical
      note: 大覚醒の後、白人・黒人の多くがバプテスト・メソジストになった。
- id: rel_sc_lowcountry
  name: サウスカロライナのロウカントリー（米のプランテーション）
  select:
    pieces: [USA-Charleston_SC, USA-Beaufort_SC, USA-Colleton_SC, USA-Georgetown_SC, USA-Jasper_SC, USA-Berkeley_SC, USA-Dorchester_SC]
  timeline:
    - from: 1648
      main: other
      note: カトーバ人・ヤマシー人などの地。
    - from: 1690
      main: anglican
      minor: other
      note: チャールストン（1670）を中心とする米・インディゴのプランテーション植民地。
      source: "https://ja.wikipedia.org/wiki/カロライナ植民地"
    - from: 1710
      main: other
      minor: anglican
      note: 1708 年には黒人奴隷が人口の過半数になり、米のプランテーションの郡では住民の 7〜8 割になった。農園主と国教会は奴隷への伝道に消極的で、西アフリカ（セネガンビア・シエラレオネ・コンゴ・アンゴラ）から連れてこられた人々の多くは故郷の信仰を保った（地図では「住民の多数派」の原則で、その他の色）。
    - from: 1790
      main: other
      minor: evangelical
      note: 独立後、白人の多くと、黒人の一部がバプテスト・メソジストになった（チャールストンのアフリカン・メソジスト監督教会 1817）。
    - from: 1830
      main: evangelical
      note: メソジストの「奴隷への伝道」（1829–）などで、奴隷の多くがバプテスト・メソジストの信者になった。シー・アイランズのガラの人々の信仰（「プレイズ・ハウス」）にはアフリカの要素が残る。
