# 宗教の分布：南北アメリカ（アメリカ合衆国・カナダ・メキシコ・中米・カリブ・南米・海外領土）1648–2025
# 形式は docs/religion-format.md（「南北アメリカ」の節）。main = 住民の多数派、minor = 2〜3割以上の少数派。
# - 先住民の伝統的な信仰（シャーマニズム・精霊信仰・プエブロの祭祀など）は other。ヨーロッパ人の植民地・伝道所（ミッション）が
#   住民の多数を改宗させた時期から、キリスト教の色にする。
# - プロテスタントの宗派：会衆派（ピューリタン）・長老派・オランダ改革派は reformed、イギリス国教会（独立後の監督派）は anglican、
#   ドイツ系・北欧系のルター派は lutheran、18 世紀末以後の信仰復興で広がったバプテスト・メソジスト（アフリカ系アメリカ人の教会を含む）と
#   20 世紀のペンテコステ派・福音派は evangelical、モルモン教は lds。モラヴィア兄弟団（ヘルンフート派）の伝道は evangelical とした。
# - アフリカ系の信仰（ハイチのヴードゥー、キューバのサンテリア、ブラジルのカンドンブレ・ウンバンダ、ジャマイカのラスタファリなど）は、
#   多くの人がカトリック・プロテスタントと重ねて信じる習合的な信仰なので、塗りはカトリックなどにして note に書く。
# - 世俗化（キューバの革命後・ウルグアイ・カナダ・アメリカ合衆国の近年など）は data/religion/secular.yaml の「南北アメリカ」。
# - 言語（data/language/americas.yaml）と、地域の分け方と切り替えの年をできるだけそろえている。
# - アメリカ合衆国の太平洋の領土（グアム・北マリアナ・米領サモア）はオセアニアの担当に残す。

# ================================================================
# アメリカ合衆国
# ================================================================
- id: rel_us_base
  name: 北アメリカの先住民の地（アメリカ合衆国の範囲）
  select:
    iso: [USA]
    exclude: [USA-Guam, USA-Commonwealth_of_the_Northern_Mariana_Islands, USA-American_Samoa]
  timeline:
    - from: 1648
      main: other
      note: 先住民の伝統的な信仰（精霊・祖先・自然の力をまつる儀礼、平原の太陽の踊り、プエブロのカチナの祭祀など）。地域ごとの変化は下の小さい地域で示す。
      source: "https://ja.wikipedia.org/wiki/ネイティブ・アメリカン"

# ---- ニューイングランド ----
- id: rel_new_england_south
  name: マサチューセッツ・コネティカット・ロードアイランド
  select:
    adm1: ["USA/Massachusetts", "USA/Connecticut", "USA/Rhode Island"]
  timeline:
    - from: 1648
      main: reformed
      note: ピューリタン（会衆派）の植民地。マサチューセッツ湾植民地（1630）・コネティカット・ニューヘイヴン。ロードアイランドはロジャー・ウィリアムズの信仰の自由の植民地で、バプテスト・クエーカーも住んだ。先住民はフィリップ王戦争（1675–76）で大きく減った。
      source: "https://ja.wikipedia.org/wiki/ピューリタン"
    - from: 1850
      main: reformed
      minor: catholic
      note: ジャガイモ飢饉（1845–49）の後、アイルランド系のカトリックがボストンなどに大量に移住した。
    - from: 1900
      main: catholic
      minor: reformed
      note: アイルランド系・イタリア系・ポルトガル系・フランス系カナダ人の移民で、カトリックが最大の宗派になった（1900 年代のボストンはカトリックが多数）。
- id: rel_new_hampshire
  name: ニューハンプシャー
  select:
    adm1: ["USA/New Hampshire"]
  timeline:
    - from: 1648
      main: other
      minor: reformed
      note: アベナキ人の地。ニューハンプシャーの海岸（ポーツマス・ドーヴァー・エクセター・ハンプトン）にはイングランド人の町があった。
    - from: 1720
      main: reformed
      note: 会衆派のニューイングランド人の入植。
    - from: 1900
      main: reformed
      minor: catholic
      note: フランス系カナダ人が繊維工場の労働者として移り住んだ。
    - from: 1950
      main: catholic
      minor: reformed
- id: rel_vermont
  name: ヴァーモント
  select:
    pieces: [USA-Vermont]
  timeline:
    - from: 1648
      main: other
      note: アベナキ人の地。イギリス人の最初の拠点はダマー砦（1724）。
    - from: 1760
      main: reformed
      note: 七年戦争の後、ニューイングランドからの入植が本格化した（ベニントン 1761）。ヴァーモント共和国（1777–91）を経て 1791 年に州。
    - from: 1900
      main: reformed
      minor: catholic
      note: フランス系カナダ人が移り住んだ。
    - from: 1950
      main: catholic
      minor: reformed
- id: rel_maine
  name: メイン
  select:
    adm1: ["USA/Maine"]
  timeline:
    - from: 1648
      main: other
      note: アベナキ人などワバナキ連合の地。海岸の南部（ヨーク・カスコ湾）にイングランド人の漁村がある。アベナキ人にはイエズス会のフランス人宣教師が伝道し、多くがカトリックになった。
    - from: 1760
      main: reformed
      note: ヌーヴェル・フランスの滅亡（1760）で、ニューイングランドからの入植が内陸へ進んだ。
    - from: 1900
      main: reformed
      minor: catholic
      note: フランス系カナダ人・アイルランド系の移住。
- id: rel_maine_south
  name: メイン南部の海岸（ヨーク・カンバーランド）
  select:
    pieces: [USA-York_ME, USA-Cumberland_ME]
  timeline:
    - from: 1648
      main: reformed
      note: キタリー・ヨーク・ファルマス（ポートランド）など、1640 年代からのイングランド人の町（1652 年にマサチューセッツに併合）。
    - from: 1900
      main: reformed
      minor: catholic
- id: rel_aroostook
  name: メイン北部（アルーストック、マダワスカ）
  select:
    pieces: [USA-Aroostook_ME]
  timeline:
    - from: 1648
      main: other
    - from: 1790
      main: catholic
      note: セントジョン川上流のマダワスカに、追放を逃れたアカディア人が住みついた（1785–）。
    - from: 1860
      main: catholic
      minor: reformed

# ---- 中部植民地 ----
- id: rel_nyc
  name: ニューヨーク市（マンハッタン・ブルックリン・クイーンズ・ブロンクス・スタテン島）
  select:
    pieces: [USA-New_York_NY, USA-Kings_NY, USA-Queens_NY, USA-Bronx_NY, USA-Richmond_NY]
  timeline:
    - from: 1648
      main: reformed
      note: オランダ西インド会社のニューアムステルダム（1626–）。オランダ改革派教会が公認の教会だったが、ユダヤ人（1654–）・ルター派・クエーカーなども住んだ。1664 年にイングランドが奪い、ニューヨークと改名した。
      source: "https://ja.wikipedia.org/wiki/ニューアムステルダム"
    - from: 1850
      main: reformed
      minor: catholic
      note: アイルランド系・ドイツ系のカトリックの移民が急増した。
    - from: 1880
      main: catholic
      minor: reformed
    - from: 1900
      main: catholic
      minor: jewish
      note: 東欧からのユダヤ人（1881–1924 年の大移民）とイタリア系の移民。1920〜50 年代のニューヨーク市の住民の約 4 分の 1 はユダヤ人で、世界最大のユダヤ人の都市だった。
      source: "https://en.wikipedia.org/wiki/History_of_the_Jews_in_New_York_City"
- id: rel_hudson
  name: ハドソン川流域・ロングアイランド
  select:
    pieces: [USA-Westchester_NY, USA-Rockland_NY, USA-Orange_NY, USA-Putnam_NY, USA-Dutchess_NY, USA-Ulster_NY, USA-Greene_NY, USA-Columbia_NY, USA-Albany_NY, USA-Rensselaer_NY, USA-Schenectady_NY, USA-Nassau_NY, USA-Suffolk_NY]
  timeline:
    - from: 1648
      main: other
      minor: reformed
      note: ニューネーデルラント（フォート・オラニエ〈オールバニー〉・エソプス〈キングストン〉）の点在する入植地と、レナペ人・マヒカン人の地。
    - from: 1680
      main: reformed
      note: オランダ系の農民（パトルーン制の荘園）とニューイングランド系の住民。
    - from: 1900
      main: reformed
      minor: catholic
    - from: 1950
      main: catholic
      minor: reformed
- id: rel_suffolk
  name: ロングアイランド東部（サフォーク）
  select:
    pieces: [USA-Suffolk_NY]
  timeline:
    - from: 1648
      main: reformed
      minor: other
      note: ニューイングランドからの会衆派の入植者の町（サウサンプトン・サウスオールド 1640、イーストハンプトン 1648）と、モンタウク人などの地。
    - from: 1700
      main: reformed
    - from: 1900
      main: reformed
      minor: catholic
    - from: 1950
      main: catholic
      minor: reformed
- id: rel_nyc_suburbs
  name: ニューヨークの郊外（ナッソー・ウェストチェスター・ロックランド）
  select:
    pieces: [USA-Nassau_NY, USA-Westchester_NY, USA-Rockland_NY]
  timeline:
    - from: 1950
      main: catholic
      minor: jewish
      note: 第二次世界大戦後の郊外化で、ニューヨーク市のカトリック・ユダヤ人の家族が移り住んだ。
- id: rel_upstate_ny
  name: ニューヨーク州北部・西部
  select:
    adm1: ["USA/New York"]
  timeline:
    - from: 1648
      main: other
      note: イロコイ連邦（モホーク・オナイダ・オノンダガ・カユガ・セネカ）の地。
    - from: 1790
      main: reformed
      note: 独立戦争でイロコイの多くがイギリス側についたため、戦後に土地を奪われ（スタンウィックス砦条約 1784 など）、ニューイングランドからの入植が急速に進んだ。
    - from: 1830
      main: evangelical
      minor: reformed
      note: 第2次大覚醒の中心地（「焼き尽くされた地域」）。メソジスト・バプテストが広がり、モルモン教（1830、パルマイラ）も生まれた。
      source: "https://ja.wikipedia.org/wiki/第二次大覚醒"
    - from: 1900
      main: catholic
      minor: evangelical
      note: バッファロー・ロチェスター・シラキュースなどの工業都市に、アイルランド・イタリア・ポーランドからの移民が増えた。
- id: rel_new_jersey
  name: ニュージャージー
  select:
    adm1: ["USA/New Jersey"]
  timeline:
    - from: 1648
      main: other
      minor: reformed
      note: レナペ人の地。ハドソン川の西岸（パヴォニア・ベルヘン）にオランダ人の入植地。
    - from: 1680
      main: reformed
      note: 東部はオランダ改革派・スコットランド系長老派、西部はクエーカーの植民地。
    - from: 1920
      main: catholic
      minor: reformed
- id: rel_pennsylvania_east
  name: ペンシルヴェニア南東部（フィラデルフィア）
  select:
    pieces: [USA-Philadelphia_PA, USA-Bucks_PA, USA-Chester_PA, USA-Delaware_PA, USA-Montgomery_PA]
  timeline:
    - from: 1648
      main: other
      note: レナペ人・サスケハノック人の地。デラウェア川の下流にスウェーデン人・オランダ人の小さな入植地。
    - from: 1690
      main: reformed
      note: ウィリアム・ペンのクエーカーの植民地（1681–）。信仰の自由を認めたので、クエーカー（地図では塗りに使う宗派がないので改革派の色にまとめ、note で示す）・長老派・バプテストなどが集まった。
      source: "https://ja.wikipedia.org/wiki/ペンシルベニア植民地"
    - from: 1740
      main: reformed
      minor: lutheran
      note: ドイツからの移民（ペンシルヴェニア・ダッチ。ジャーマンタウン 1683）。ルター派・ドイツ改革派・メノナイト。
    - from: 1900
      main: catholic
      minor: reformed
      note: フィラデルフィアに、アイルランド・イタリア・東欧からのカトリックの移民が増えた。
- id: rel_pennsylvania_dutch
  name: ペンシルヴェニア・ダッチの郡（ランカスター・バークスなど）
  select:
    pieces: [USA-Lancaster_PA, USA-Berks_PA, USA-Lehigh_PA, USA-Northampton_PA, USA-Lebanon_PA, USA-York_PA, USA-Dauphin_PA, USA-Schuylkill_PA, USA-Adams_PA, USA-Cumberland_PA, USA-Snyder_PA, USA-Union_PA]
  timeline:
    - from: 1648
      main: other
      note: サスケハノック人（1675 年にイロコイ連邦に敗れて離散）、のちショーニー人・レナペ人の地。
    - from: 1740
      main: reformed
      minor: lutheran
      note: ドイツ南西部・スイスからの移民（ペンシルヴェニア・ダッチ。ランカスター 1729、ヨーク 1741）。ドイツ改革派（地図では改革派）・ルター派・メノナイト・アーミッシュ。カンバーランド渓谷にはスコットランド系アイルランド人（長老派）。
      source: "https://ja.wikipedia.org/wiki/ペンシルベニア・ダッチ"
    - from: 1900
      main: lutheran
      minor: catholic
      note: ルター派が最大の宗派。スクールキルなどの炭鉱の町に、アイルランド・東欧からのカトリックの移民が増えた。
- id: rel_pennsylvania
  name: ペンシルヴェニア中部・西部
  select:
    adm1: ["USA/Pennsylvania"]
  timeline:
    - from: 1648
      main: other
      note: サスケハノック人（のちショーニー人・レナペ人）の地。西部のオハイオ川流域はフランスとイギリスが争った（デュケーヌ砦 1754）。
    - from: 1770
      main: reformed
      note: 七年戦争（フレンチ＝インディアン戦争）の後、スコットランド系アイルランド人（長老派）が入植した。
    - from: 1900
      main: catholic
      minor: reformed
      note: ピッツバーグの製鉄業と炭鉱に、東欧・イタリアからの移民が集まった。
- id: rel_delaware
  name: デラウェア
  select:
    adm1: ["USA/Delaware"]
  timeline:
    - from: 1648
      main: other
      minor: lutheran
      note: ニュースウェーデン（1638–55、クリスティーナ砦〈ウィルミントン〉）。スウェーデン人・フィンランド人のルター派の入植地は数百人で、住民の多くはレナペ人。
      source: "https://ja.wikipedia.org/wiki/ニュースウェーデン"
    - from: 1680
      main: anglican
      minor: reformed
    - from: 1800
      main: evangelical
      note: メソジストの拠点になった。
    - from: 1950
      main: evangelical
      minor: catholic

# ---- チェサピーク・南部 ----
- id: rel_maryland
  name: メリーランド・ワシントン D.C.
  select:
    adm1: ["USA/Maryland", "USA/District of Columbia"]
  timeline:
    - from: 1648
      main: anglican
      minor: catholic
      note: カトリックのボルティモア卿の植民地（1634）。信仰寛容法（1649）。住民の多くはプロテスタントで、1702 年にイギリス国教会が公認の教会になった。
      source: "https://ja.wikipedia.org/wiki/メリーランド植民地"
    - from: 1800
      main: evangelical
      minor: catholic
      note: 独立後、メソジストが広がった。ボルティモアはアメリカ最初のカトリックの司教座（1789）。
- id: rel_virginia
  name: ヴァージニア東部（タイドウォーター）
  select:
    adm1: ["USA/Virginia"]
  timeline:
    - from: 1648
      main: anglican
      note: ジェームズタウン（1607）以来のイギリス国教会の植民地。タバコのプランテーションで、1700 年ごろから黒人奴隷が増えた。
      source: "https://ja.wikipedia.org/wiki/バージニア植民地"
    - from: 1790
      main: evangelical
      minor: anglican
      note: 大覚醒の後、バプテスト・メソジストが広がり、黒人奴隷の多くもバプテスト・メソジストになった。ヴァージニア信教自由法（1786、ジェファソン）で国教会は公認を失った。
    - from: 1850
      main: evangelical
- id: rel_virginia_piedmont
  name: ヴァージニアのピードモント
  select:
    pieces: [USA-Albemarle_VA, USA-Amelia_VA, USA-Amherst_VA, USA-Appomattox_VA, USA-Brunswick_VA, USA-Buckingham_VA, USA-Campbell_VA, USA-Charlotte_VA, USA-Charlottesville_VA, USA-Culpeper_VA, USA-Cumberland_VA, USA-Fauquier_VA, USA-Fluvanna_VA, USA-Goochland_VA, USA-Greene_VA, USA-Greensville_VA, USA-Halifax_VA, USA-Loudoun_VA, USA-Louisa_VA, USA-Lunenburg_VA, USA-Lynchburg_VA, USA-Madison_VA, USA-Mecklenburg_VA, USA-Nelson_VA, USA-Nottoway_VA, USA-Orange_VA, USA-Powhatan_VA, USA-Prince_Edward_VA, USA-Rappahannock_VA, USA-Spotsylvania_VA]
  timeline:
    - from: 1648
      main: other
      note: モナカン人・サポニ人など（スー系）の地。
    - from: 1730
      main: anglican
      note: 滝線（フォール・ライン）より西のピードモントへ、タバコの農園主が奴隷を連れて進出した（1720〜30 年代）。
    - from: 1790
      main: evangelical
      minor: anglican
    - from: 1850
      main: evangelical
- id: rel_shenandoah
  name: シェナンドー渓谷
  select:
    pieces: [USA-Augusta_VA, USA-Rockingham_VA, USA-Shenandoah_VA, USA-Frederick_VA, USA-Clarke_VA, USA-Page_VA, USA-Warren_VA, USA-Winchester_VA, USA-Harrisonburg_VA, USA-Staunton_VA, USA-Waynesboro_VA]
