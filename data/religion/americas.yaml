      note: ハワイの伝統的な宗教（神々〈アクア〉とカプ〈タブー〉の制度）。
    - from: 1830
      main: reformed
      note: カメハメハ 2 世のカプの廃止（1819）の後、アメリカの会衆派の宣教師（1820–）が伝道し、カアフマヌ摂政らが改宗した。
      source: "https://ja.wikipedia.org/wiki/ハワイ王国"
    - from: 1860
      main: reformed
      minor: catholic
    - from: 1900
      main: shinbutsu
      minor: catholic
      note: サトウキビ農園の労働者として日本人が大量に移住し（1885 年の官約移民〜）、1900〜20 年代には人口の約 4 割が日系人だった。浄土真宗の本願寺派などの寺が各地に建てられた。カトリックはポルトガル系・フィリピン系など。
      source: "https://ja.wikipedia.org/wiki/日系アメリカ人"
    - from: 1960
      main: catholic
      minor: shinbutsu
      note: 日系人の 2 世・3 世の間でキリスト教や無宗教が増えた。
