      minor: anglican
      note: 1751 年に奴隷制が認められ、海岸の米のプランテーションでアフリカ系の奴隷が住民の多数になった（サウスカロライナのロウカントリーと同じく、奴隷の多くは故郷の信仰を保った）。
    - from: 1790
      main: other
      minor: evangelical
      note: サヴァナの第一アフリカン・バプテスト教会（1788）など、黒人のバプテストの教会が生まれた。
    - from: 1830
