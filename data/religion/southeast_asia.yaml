# ======== ベトナム ========
- id: rel_vietnam
  name: ベトナム
  select:
    iso: [VNM]
  timeline:
    - from: 1453
      main: vietnamese_folk
      note: 黎朝。黎聖宗（在位 1460–97）が明にならって朱子学・科挙を重んじ、洪徳律を定めた。民衆は祖先祭祀・仏教・道教と村の守り神（城隍）を合わせて信仰した。
      source: "https://ja.wikipedia.org/wiki/黎聖宗"
    - from: 1615
      main: vietnamese_folk
      note: イエズス会がホイアン（1615）・トンキン（1627）で布教を始め、アレクサンドル・ド・ロードがローマ字のベトナム語（クオック・グー）を整えた。信者は 17 世紀半ばに 10 万人をこえたが、人口からみれば少数。
      source: "https://ja.wikipedia.org/wiki/アレクサンドル・ドゥ・ロード"
    - from: 1648
      main: vietnamese_folk
      note: 祖先祭祀・儒教（黎朝・阮朝の国家の学問）・大乗仏教・道教と村の守護神（タインホアン）の信仰が重なる。17 世紀にイエズス会（アレクサンドル＝ド＝ロード）の宣教でカトリックが広がり、ローマ字表記（クオック・グー）が生まれた。
      source: "https://ja.wikipedia.org/wiki/ベトナムの宗教"
    - from: 1858
      main: vietnamese_folk
      note: 宣教師の迫害を口実にフランスが出兵し（1858）、植民地化が進んだ。カトリックは約7〜10%。20 世紀には南部で新宗教のカオダイ教（1926）・ホアハオ教（1939）が広がった。1963 年には南ベトナムで仏教徒が政権の弾圧に抗議した（ティック・クアン・ドックの焼身）。
      source: "https://ja.wikipedia.org/wiki/カオダイ教"
