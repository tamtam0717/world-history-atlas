# ======== タイ（シャム） ========
- id: rel_thailand
  name: タイ（シャム）
  select:
    iso: [THA]
  timeline:
    - from: 1453
      main: theravada
      note: アユタヤ朝の上座部仏教。トライローカナート王（在位 1448–88）が国の制度を整え、ランナー王国のティローカラート王（在位 1441–87）は第8回仏典結集（1477）を開いた。
      source: "https://ja.wikipedia.org/wiki/アユタヤ王朝"
    - from: 1648
      main: theravada
      note: 上座部仏教。王は仏教の保護者。ラーマ4世（モンクット）は即位前に戒律の厳しいタンマユット派を開いた（1833）。都市の華人は仏教と祖先祭祀を併せて信仰し、多くがタイ社会に同化した。
      source: "https://ja.wikipedia.org/wiki/タイの仏教"
- id: rel_patani
  name: タイ深南部（パッターニー・ヤラー・ナラーティワート・サトゥーン）
  select:
    adm1: ["THA/Pattani Province", "THA/Yala Province", "THA/Narathiwat Province", "THA/Satun Province"]
  timeline:
    - from: 1453
      main: theravada
      minor: sunni
      note: パタニはアユタヤに朝貢するマレー人の港市。
    - from: 1500
      main: sunni
      minor: theravada
      note: パタニの王が 15 世紀後半〜16 世紀初めにイスラームに改宗し、スルタン国になった。16〜17 世紀は女王たちのもとで交易で栄えた。
      source: "https://ja.wikipedia.org/wiki/パタニ王国"
    - from: 1648
      main: sunni
      minor: theravada
      note: マレー系ムスリムのパタニ王国。1785 年からシャムに服属し、1909 年の英シャム条約でシャム領と決まった。2004 年から分離独立派の武装闘争が激しくなった。
      source: "https://ja.wikipedia.org/wiki/パタニ王国"
- id: rel_andaman_coast
  name: タイ南部の海岸（ソンクラー・クラビー・パンガー）
  select:
    adm1: ["THA/Songkhla Province", "THA/Krabi Province", "THA/Phangnga Province"]
