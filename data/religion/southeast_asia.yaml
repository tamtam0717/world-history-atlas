  select:
    iso: [PHL]
  timeline:
    - from: 1453
      main: other
      note: フィリピン諸島の在来の信仰（アニト〈祖霊〉の崇拝）。南部のスールー・ミンダナオからイスラームが北へ広がり、マニラにもムスリムの首長（ラジャ・スレイマンなど）がいた。
      source: "https://ja.wikipedia.org/wiki/フィリピンの宗教"
    - from: 1580
      main: other
      minor: catholic
      note: レガスピがセブ（1565）、ついでマニラ（1571）を征服し、アウグスティノ会・フランシスコ会・イエズス会・ドミニコ会の修道士が布教した。マゼランの来航（1521）でセブの王が洗礼を受けたのが始まり。
      source: "https://ja.wikipedia.org/wiki/スペイン領東インド"
    - from: 1600
      main: catholic
      minor: other
      note: 低地の住民は教会を中心とする町（レドゥクシオン）に集められ、16 世紀末までに 50 万人ほどが洗礼を受けた。
    - from: 1630
      main: catholic
    - from: 1648
      main: catholic
      note: スペインの支配（1565–1898）のもとで、ルソン・ビサヤの低地はカトリックに改宗した。修道会（アウグスチノ会・フランシスコ会・ドミニコ会・イエズス会など）が教区を担った。
      source: "https://ja.wikipedia.org/wiki/フィリピンのカトリック"
    - from: 1902
      main: catholic
      note: アメリカの統治でプロテスタントの宣教が始まった。フィリピン独立教会（アグリパイ派、1902）、イグレシア・ニ・クリスト（1914）が生まれた。カトリックは約 80%（2015）。
      source: "https://en.wikipedia.org/wiki/Philippine_Independent_Church"
