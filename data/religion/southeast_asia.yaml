# 宗教の分布：東南アジア（ミャンマー・タイ・ラオス・カンボジア・ベトナム・マレーシア・シンガポール・ブルネイ・インドネシア・フィリピン・東ティモール）1648–2025
# 形式は docs/religion-format.md（「南アジア・東南アジア」の節）。main = 住民の多数派、minor = 2〜3割以上の少数派。
# - 大陸部は上座部仏教（theravada）。ベトナムは東アジアの方針に合わせて、儒教・仏教（大乗）・道教と祖先祭祀が重なる
#   民間信仰（vietnamese_folk）で塗る。山地の少数民族の在来の信仰（精霊信仰）は other。
# - 島嶼部はイスラーム（スンナ派。シャーフィイー派）、フィリピンはカトリック。インドネシアのキリスト教の地域は、
#   オランダ改革派の流れをくむ教会（ミナハサ・アンボン・トラジャ・パプアなど）を reformed、バタク人・ニアスの教会（HKBP など。
#   世界ルーテル連盟に加盟）を lutheran で塗る。
# - 東南アジアの華人の宗教（仏教・道教・祖先祭祀）は、中国と同じ chinese_folk で塗る。
# - 言語（data/language/southeast_asia.yaml）と、切り替えの年をできるだけそろえている。

# ======== ミャンマー（ビルマ） ========
- id: rel_myanmar
  name: ミャンマー（ビルマ）
  select:
    iso: [MMR]
  timeline:
    - from: 1453
      main: theravada
      note: 上座部仏教。ハンタワディー（ペグー）のダンマゼーディー王（在位 1472–92）がスリランカの大寺派にならって僧団を改革した（カルヤーニー碑文）。タウングー朝のバインナウン（在位 1551–81）は征服したシャンの地にも仏教を広めた。
      source: "https://ja.wikipedia.org/wiki/ダンマゼーディー"
    - from: 1648
      main: theravada
      note: ビルマ人・モン人・シャン人・ラカイン人の上座部仏教。パガン以来の仏塔（パゴダ）の信仰と、ナッ（精霊）の信仰が重なる。
      source: "https://ja.wikipedia.org/wiki/ミャンマーの仏教"
- id: rel_yangon
  name: ラングーン（ヤンゴン）
  select:
    pieces: [MMR-Yangon_East, MMR-Yangon_North, MMR-Yangon_South, MMR-Yangon_West]
  timeline:
    - from: 1648
      main: theravada
      note: シュエダゴン・パゴダの門前町（ダゴン）。
    - from: 1880
      main: theravada
      minor: hindu
      note: 英領インドの一州として、インドからの移民（ヒンドゥー教徒とムスリム）が流れ込み、1931 年にはラングーン市の人口の過半数がインド系だった。
      source: "https://en.wikipedia.org/wiki/Burmese_Indians"
    - from: 1942
      main: theravada
      note: 日本軍の侵攻（1942）でインド系の住民の多くがインドへ逃れ、1962 年以後の国有化でさらに去った。
- id: rel_maungdaw
  name: ラカイン北部（マウンドー・ブティダウン）
  select:
    pieces: [MMR-Maungdaw]
  timeline:
    - from: 1453
      main: theravada
      minor: sunni
    - from: 1648
      main: theravada
      minor: sunni
      note: アラカン（ラカイン）王国（ミャウー朝、–1785）。王国の宮廷にはムスリムもいた。
      source: "https://ja.wikipedia.org/wiki/アラカン"
    - from: 1880
      main: sunni
      minor: theravada
      note: イギリス領の時代にベンガル（チッタゴン）との行き来と移住が増え、ムスリムのロヒンギャが多数になった。1982 年の国籍法で多くが国籍を認められなかった。
      source: "https://ja.wikipedia.org/wiki/ロヒンギャ"
    - from: 2017
      main: sunni
      minor: theravada
      note: 2017 年の国軍の掃討作戦で、70 万人以上のロヒンギャがバングラデシュへ逃れた（国連の調査団はジェノサイドの意図を指摘）。残る住民の構成ははっきりしない。2024 年にはアラカン軍がこの地域の大部分を支配した。
      source: "https://ja.wikipedia.org/wiki/ロヒンギャ危機"
- id: rel_sittwe
  name: ラカイン中部（シットウェー）
  select:
    pieces: [MMR-Sittwe]
  timeline:
    - from: 1648
