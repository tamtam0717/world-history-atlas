    - from: 1922
      main: sunni
      note: 東トラキアのギリシア人は1922年にギリシアへ避難した。イスタンブルのギリシア人・アルメニア人は住民交換の対象外だったが、1955年の反ギリシア暴動（イスタンブル・ポグロム）と1964年の追放で大きく減った。世界総主教庁（コンスタンティノープル総主教）は今もイスタンブルにある。
