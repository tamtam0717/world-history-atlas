    adm1: ["SRB/Toplica District", "SRB/Jablanica District", "SRB/Pcinja District"]
  timeline:
    - from: 1648
      main: orthodox
      minor: sunni
    - from: 1690
      main: sunni
      minor: orthodox
      note: セルビア人の大移住（1690）の後、アルバニア人のムスリムが移り住み、多数派になったとされる。（要確認）

- id: rel_kosovo
  name: コソヴォ
  select:
    iso: [XKX]
  timeline:
