# ======== ドナウ二公国・トランシルヴァニア・バナト ========
- id: rel_romania
  name: ワラキア・モルダヴィア
  select:
    iso: [ROU]
  timeline:
    - from: 1648
      main: orthodox
      note: ルーマニア人は正教徒。

- id: rel_dobruja
  name: ドブルジャ
  select:
    regions: [dobruja_ro]
  timeline:
    - from: 1648
      main: sunni
      minor: orthodox
      note: タタール人・トルコ人のムスリムが多く、ルーマニア人・ブルガリア人・ギリシア人も住む。北部のドナウ・デルタには古儀式派のロシア人（リポヴァン人）が逃れてくる。

- id: rel_transylvania_romanian
  name: トランシルヴァニアのルーマニア人地域
  select:
    pieces: [ROU-HUNEDOARA, ROU-SALAJ, ROU-MARAMURES, ROU-CLUJ, ROU-BIHOR, ROU-BISTRITA_NASAUD]
  timeline:
    - from: 1648
      main: orthodox
      minor: reformed
      note: 農民の多くはルーマニア人の正教徒。領主・都市はハンガリー人で、改革派が多い（クルジュ＝コロジュヴァールにはユニテリアンも多い）。トランシルヴァニア侯国は1568年のトルダ勅令以来、カトリック・ルター派・改革派・ユニテリアンの4宗派を公認した。
      source: "https://ja.wikipedia.org/wiki/トルダ勅令"
    - from: 1701
      main: orthodox
      minor: catholic
      note: アルバ・ユリア合同（1698–1701）で、ルーマニア人の一部がギリシア・カトリック（ユニエイト）になる。正教徒の抵抗も強く（1760年代のソフロニエの運動）、両派が並ぶ。（比率は要確認）

- id: rel_alba_blaj
  name: アルバ（ブラジ）
  select:
    pieces: [ROU-ALBA]
  timeline:
    - from: 1648
      main: orthodox
      minor: reformed
    - from: 1701
      main: catholic
      minor: orthodox
      note: ブラジがルーマニア人のギリシア・カトリック（ユニエイト）教会の中心になる（1737–）。（多数派の判定は要確認）

- id: rel_transylvania_saxon
  name: トランシルヴァニアのザクセン人地域（シビウ・ブラショフ）
  select:
    pieces: [ROU-SIBIU, ROU-BRASOV]
  timeline:
    - from: 1648
      main: lutheran
      minor: orthodox
      note: ドイツ系のザクセン人はルター派。周辺の村にはルーマニア人の正教徒が多い。（多数派の判定は要確認）

- id: rel_szekely_reformed
  name: セーケイ地方（ハーロムセーク・マロシュセーク）
  select:
    pieces: [ROU-COVASNA, ROU-MURES]
  timeline:
    - from: 1648
      main: reformed
      minor: catholic
      note: セーケイ人（ハンガリー系）の改革派が多い。マロシュヴァーシャールヘイには改革派の学院がある。ウドヴァルヘイ周辺にはユニテリアンも多い。

- id: rel_szekely_catholic
  name: チーク（ハルギタ）
  select:
    pieces: [ROU-HARGHITA]
  timeline:
    - from: 1648
      main: catholic
      minor: reformed
      note: チーク地方のセーケイ人はカトリックを守った（シュムレウ・チュクの巡礼地）。ウドヴァルヘイにはユニテリアンと改革派も多い。

- id: rel_partium
  name: サトゥ・マーレ（サトマール）
  select:
    pieces: [ROU-SATU_MARE]
  timeline:
    - from: 1648
      main: reformed
      minor: orthodox
      note: ハンガリー人の改革派とルーマニア人の正教徒（のちユニエイト）が混在。1712年からはドイツ人カトリック（サトマール・シュヴァーベン人）が入植した。（多数派の判定は要確認）

- id: rel_banat_ro
  name: バナト（ティミショアラ・アラド）
  select:
    regions: [banat_ro, arad]
  timeline:
    - from: 1648
      main: orthodox
      note: ルーマニア人・セルビア人の正教徒が多い。オスマン帝国の町にはムスリムが住む。
    - from: 1720
      main: orthodox
      minor: catholic
      note: ハプスブルク領バナトでドイツ人カトリック（ドナウ・シュヴァーベン人）の大規模な入植が行われる（1720年代〜1780年代）。
      source: "https://ja.wikipedia.org/wiki/ドナウ・シュヴァーベン人"

