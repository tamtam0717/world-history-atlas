# 宗教（宗派）の分布：オスマン帝国（バルカン・アナトリア・東地中海・イラク）、アラビア、ペルシア、南カフカス、中央アジア（1648–1815）
# 形式は docs/religion-format.md。main = 住民の多数派、minor = 2〜3割以上の少数派。
# オスマン帝国では宗教ごとの共同体（ミッレト）が自治を認められ、キリスト教徒・ユダヤ教徒は人頭税（ジズヤ）を払って信仰を保った。

# ======== バルカン ========
- id: rel_serbia
  name: セルビア
  select:
    iso: [SRB]
  timeline:
    - from: 1648
      main: orthodox
      note: セルビア人は正教徒（ペーチ総主教座。1766年に廃止され、コンスタンティノープル総主教座の管轄に）。町にはトルコ人・改宗者のムスリムが住む。

- id: rel_vojvodina
  name: ヴォイヴォディナ（バーチカ・バナト・スレム）
  select:
    regions: [backa, banat_rs, east_syrmia]
  timeline:
    - from: 1648
      main: orthodox
      note: オスマン帝国の支配下で、セルビア人の正教徒が多い。
    - from: 1720
      main: orthodox
      minor: catholic
      note: セルビア人の大移住（1690、総主教アルセニエ3世）で正教徒が増え、カルロヴツィが府主教座になる。18世紀にはハンガリー人・ドイツ人（ドナウ・シュヴァーベン人）・ブニェヴツィのカトリックが入植する。
      source: "https://ja.wikipedia.org/wiki/セルビア人の大移住"

- id: rel_sandzak
  name: ラシュカ・ズラティボル（ノヴィ・パザル県）
  select:
    adm1: ["SRB/Raska District", "SRB/Zlatibor District"]
  timeline:
    - from: 1648
      main: orthodox
      minor: sunni
      note: ノヴィ・パザルなどにムスリム（スラヴ系の改宗者）が多い。

- id: rel_south_serbia
  name: 南セルビア（トプリツァ・ヤブラニツァ・プチニャ）
