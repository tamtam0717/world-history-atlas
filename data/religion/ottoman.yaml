# 宗教（宗派）の分布：オスマン帝国（バルカン・アナトリア・東地中海・イラク）、アラビア、ペルシア、南カフカス、中央アジア（1648–1914）
# 形式は docs/religion-format.md。main = 住民の多数派、minor = 2〜3割以上の少数派。
# オスマン帝国では宗教ごとの共同体（ミッレト）が自治を認められ、キリスト教徒・ユダヤ教徒は人頭税（ジズヤ）を払って信仰を保った。

# ======== バルカン ========
- id: rel_serbia
  name: セルビア
  select:
    iso: [SRB]
  timeline:
    - from: 1453
      main: orthodox
      note: "セルビア専制公国（–1459）。オスマン帝国の支配下でも住民の多数は正教徒のまま。ペーチ総主教座が復活する（1557）。"
    - from: 1648
      main: orthodox
      note: セルビア人は正教徒（ペーチ総主教座。1766年に廃止され、コンスタンティノープル総主教座の管轄に）。町にはトルコ人・改宗者のムスリムが住む。
    - from: 1830
      main: orthodox
      note: セルビア公国の自治（1830）で、ムスリムは要塞の町に限られる。1862年のベオグラード砲撃の後、町のムスリムはほぼ全員が退去し、1867年にオスマン帝国の守備隊も撤退した。セルビア正教会は1831年に自治、1879年に独立（独立教会）を認められる。

