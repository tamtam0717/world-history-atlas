    - from: 1995
      main: sunni
      note: ボスニア紛争（1992–95）で、各勢力による「民族浄化」が行われ、1995年7月にはスルプスカ共和国軍がスレブレニツァでボシュニャク人の男性約8000人を殺害した。デイトン合意（1995）の後、この地域（サラエヴォ・トゥズラ・ビハチ周辺）はボシュニャク人（ムスリム）が大多数。ブルチコ地区は三民族が混在する。
      source: "https://ja.wikipedia.org/wiki/スレブレニツァの虐殺"

