      main: orthodox
      minor: sunni
      note: ペーチ総主教座のある正教の中心地。アルバニア人のイスラーム改宗が進む。（比率は要確認）
    - from: 1690
      main: sunni
      minor: orthodox
      note: 大トルコ戦争でハプスブルク軍に協力したセルビア人の多くが北へ移住し（1690）、アルバニア人（多くはムスリム）が増える。（要確認）
      source: "https://ja.wikipedia.org/wiki/セルビア人の大移住"

