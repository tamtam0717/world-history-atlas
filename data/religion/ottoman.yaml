      main: sunni
      note: 1923年の住民交換で、アナトリアの正教徒（約120万人）はギリシアへ、ギリシアのムスリム（約40万人）はトルコへ移された。地図の「スンナ派」の地域には、アレヴィー派（地図ではシーア派の色にしていない）も各地に多い。1939年にはハタイ（アレクサンドレッタ）がシリアからトルコへ移った。
