# ======== ニュージーランド ========
# マオリは 1830〜40 年代に急速にキリスト教を受け入れた（聖書のマオリ語訳と識字の広まり、部族間の戦い〈マスケット銃戦争〉の終息）。
# のちにマオリの預言者による宗教が生まれた（パイ・マリーレ 1862、リンガトゥ 1868、ラタナ 1918）。数の上では多くないので塗らず note に書く。
- id: rel_north_island
  name: 北島（オークランド・ウェリントン以外）
  select:
    adm1: ["NZL/Northland Region", "NZL/Waikato Region", "NZL/Bay of Plenty Region", "NZL/Gisborne Region", "NZL/Hawke's Bay Region", "NZL/Taranaki Region", "NZL/Manawatu-Wanganui Region"]
  timeline:
    - from: 1453
      main: other
    - from: 1648
      main: other
      note: マオリの信仰（神々〈アトゥア〉・マナとタプ・祖先の系譜〈ファカパパ〉）。
      source: "https://en.wikipedia.org/wiki/M%C4%81ori_religion"
    - from: 1845
      main: anglican
      note: 1814 年に教会伝道協会（CMS）のマースデンがベイ・オブ・アイランズで初めて説教した。ウェスレー派（1822）、カトリックのポンパリエ司教（1838）も続き、1840 年代にはマオリの大多数が洗礼を受けた。
      source: "https://en.wikipedia.org/wiki/Christianity_in_New_Zealand"
    - from: 1880
      main: anglican
      minor: reformed
      note: 入植者の国教会と長老派。マオリ戦争の中から預言者テ・ウア・ハウメネのパイ・マリーレ（1862）、テ・コオティのリンガトゥ（1868）、のちにラタナ（1918）が生まれた。
      source: "https://en.wikipedia.org/wiki/Ringat%C5%AB"
