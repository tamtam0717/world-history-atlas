# 宗教の分布：オセアニア（オーストラリア・ニュージーランド・ニューギニア・太平洋の島々）1453–2025（O3 担当、2026-11-23）
# 1453–1647 は 2026-11-25 に W7 が追加（各地域の timeline の先頭の項目と、末尾の until: 1647 の地域）。1648 年以後の値は変えていない。
# 形式は docs/religion-format.md（「オセアニア」の節）。main = 住民の多数派、minor = 2〜3割以上の少数派。
# - 先住の信仰（祖先・精霊・マナとタプ〈タブー〉の信仰など）は other。宣教で住民の多数がキリスト教徒になった年から宗派の色にする。
#   ポリネシアは 19 世紀前半に首長・王の改宗とともに急速に、メラネシアは 19 世紀後半〜20 世紀、ニューギニア高地は 1950〜70 年代。
# - 宗派の色は伝道会の系統で：ロンドン伝道協会（LMS。会衆派）・アメリカン・ボード（ABCFM。会衆派）・長老派・パリ福音伝道会は reformed、
#   メソジスト（ウェスレー派）・南洋福音伝道会（SSEM）・セブンスデー・アドベンチスト・福音派の伝道会は evangelical、
#   イングランド国教会の伝道（CMS・メラネシア伝道会）は anglican、ルター派の伝道（ノイエンデッテルスアウ・ヘルマンスブルク）は lutheran、
#   マリスト会・聖心会（MSC）・神言会（SVD）・ピクプス会・カプチン会は catholic。合同教会（オーストラリア合同教会 1977、
#   パプアニューギニア合同教会 1968 など）は、もとの最大の教派の色のまま note に書く。
# - 入植者の宗派：オーストラリア・ニュージーランドはイングランド国教会（anglican）が最大、アイルランド系のカトリックと
#   スコットランド系の長老派（ニュージーランドのオタゴ・サウスランドでは多数）が続く。オーストラリアでは 1970〜90 年代に
#   カトリックが国教会を上回った（全国では 1986 年の国勢調査）。
# - フィジーのインド系はヒンドゥー教（約 8 割）とイスラーム（約 15％）。
# - 世俗化（secular.yaml の sec_australia・sec_new_zealand）：両国とも 1970 年代から「無宗教」が増え、2020 年代には住民の 4〜5 割。
#   先住民が多数の地域（ノーザンテリトリー東部・南オーストラリア最西部）は secular: 0 で打ち消している。
# - 言語（data/language/oceania.yaml）と同じ地域の分け方で、入植者が多数になった年などはなるべく同じ年に切り替えている。
# - 無人島には値を入れない（言語と同じ）。

# ======== オーストラリア ========
- id: rel_nsw
  name: ニューサウスウェールズ（シドニー・キャンベラを含む）
  select:
    adm1: ["AUS/New South Wales", "AUS/Australian Capital Territory"]
    pieces: [AUS-Other_Territories]
  timeline:
    - from: 1453
      main: other
    - from: 1648
      main: other
      note: オーストラリア先住民（アボリジニ）の信仰。祖先の精霊が大地と生き物をつくった「ドリーミング（夢の時）」の物語と儀礼が、土地との結びつきを支えた。
      source: "https://ja.wikipedia.org/wiki/ドリームタイム"
    - from: 1830
      main: anglican
      minor: catholic
      note: 流刑植民地の国教会（イングランド国教会）と、流刑囚の約 3 割を占めたアイルランド人のカトリック。1836 年の教会法で各教派が平等に扱われた。
      source: "https://en.wikipedia.org/wiki/Church_Act_1836"
    - from: 1990
      main: catholic
      minor: anglican
      note: 戦後のイタリア・ギリシア・レバノンなどからの移民で、カトリック（と正教会）が増えた。シドニーには正教会・イスラーム・仏教・ヒンドゥー教の共同体もある（それぞれ数％）。
      source: "https://en.wikipedia.org/wiki/Religion_in_Australia"
