#      20 世紀のペンテコステ派・福音派（ブラジル・中米など）をまとめて evangelical（赤紫。国教会の赤とカルヴァン派の紫の間で、プロテスタントの系統）。
#      モルモン教（lds）はユタなどで多数になるので塗る（青緑。カトリック・プロテスタントのどちらとも見分けられるよう）。----
- {id: evangelical, name: 福音派（バプテスト・メソジストなど）, color: "#c77bab"}
