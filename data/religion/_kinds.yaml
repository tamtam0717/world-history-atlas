# ---- 追加（アフリカのデータ作成時）：アフリカ独立教会（シオン派・使徒派・キンバング教会・ナザレ教会・ハリスト教会・アラドゥラなど）。
#      宣教師の教会から独立したアフリカ人の教会で、南部アフリカでは黒人のキリスト教徒の最大の集団。
#      プロテスタントの系統（赤紫の福音派・紫のカルヴァン派）に近いが見分けられるよう、くすんだ青紫（カルヴァン派の紫と ΔE 20 以上離すため、暗く青寄りに）----
- {id: african_initiated, name: アフリカ独立教会（シオン派・使徒派など）, color: "#6a72b4"}
# ---- 追加（1453–1647 のデータ作成時）：フス戦争後のボヘミア・モラヴィアで住民の多数を占めたフス派（ウトラキスト＝両形色派）と兄弟団。
#      宗教改革の先駆けなので、ルター派の青とカルヴァン派の紫の間の、くすんだ紺（どちらとも色差 ΔE 25 以上になるよう暗めに）----
- {id: hussite, name: フス派（ウトラキスト・兄弟団）, color: "#566c9c"}
