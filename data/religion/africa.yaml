# 宗教の分布：アフリカ（サハラ以南・インド洋の島々。北アフリカは west.yaml）1453–2025
# 1453–1647 は 2026-11-25 に W7 が追加（各地域の timeline の先頭の項目と、末尾の until: 1647 の地域）。1648 年以後の値は変えていない。
# 形式は docs/religion-format.md（「アフリカ」の節に塗り分けの方針）。main = 住民の多数派、minor = 2〜3割以上の少数派。
# - F5 担当（2026-11-21）。scratchpad の生成スクリプト（地域の定義を言語と共有）で作った。言語（data/language/africa.yaml）と同じ地域・同じ年で切り替えている。
# - 伝統的な信仰（祖先崇拝・精霊信仰など）は other。キリスト教・イスラームへの改宗は、住民の多数派が変わった年の目安で切り替えた（多くは推計。統計のある 20 世紀後半を除き「年は目安」）。
# - プロテスタントの色：メソジスト・バプテスト・ペンテコステ派・アドベンチスト・福音派の伝道会は evangelical、長老派・会衆派（ロンドン伝道協会）・オランダ改革派・パリ福音伝道会は reformed、
#   ルター派の伝道会（ライン・フィンランド・ベルリン・ライプツィヒ・メカネ・イエス）は lutheran、CMS・UMCA は anglican。
# - アフリカ独立教会（シオン派・使徒派・キンバング教会・ナザレ教会・レジオ・マリアなど）は african_initiated。

- id: rel_af_mauritania
  name: モーリタニア
  select:
    iso_all: [MRT]
  timeline:
    - from: 1453
      main: sunni
    - from: 1648
      main: sunni
      note: ムーア人（ベイダン・ハラティン）はスンナ派（マーリク派）。サハラの交易路とともに早くからイスラーム化した。
- id: rel_af_senegal
  name: セネガル（ウォロフ人の地域）
  select:
    iso: [SEN]
  timeline:
    - from: 1453
      main: other
      minor: sunni
    - from: 1648
      main: other
      minor: sunni
      note: ジョロフ・カヨール・バオル・ワーロなどウォロフ人の王国。王族と戦士層（チェド）は伝統的な信仰を守り、イスラームは商人と聖職者（マラブー）の宗教だった。
      source: "https://ja.wikipedia.org/wiki/ウォロフ人"
    - from: 1870
      main: sunni
      minor: other
      note: マラブーの運動（マ・バ・ジャフ・バのジハード 1861–67）、ラト・ジョールの改宗（1860 年代）など、王国の動揺のなかで農民の多くがムスリムになる。
    - from: 1890
      main: sunni
      note: フランスの征服（カヨールのラト・ジョール戦死 1886）の後、ムリッド教団（アマドゥ・バンバ、1883）・ティジャーニー教団を通じてイスラーム化がほぼ完了した。
      source: "https://ja.wikipedia.org/wiki/ムリッド教団"
