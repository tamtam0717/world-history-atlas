    - from: 1995
      main: catholic
      note: 第二次世界大戦中、クロアチア独立国（ウスタシャ政権）はセルビア人を虐殺・追放・強制改宗した。1991–95年のクロアチア紛争でセルビア人勢力が「クライナ・セルビア人共和国」を作ったが、1995年8月の「嵐作戦」で、セルビア人（約15万〜20万人）の大部分がセルビア・ボスニアへ逃れた。
      source: "https://en.wikipedia.org/wiki/Operation_Storm"

