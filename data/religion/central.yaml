# ======== ハプスブルク家の世襲領 ========
- id: rel_austria
  name: オーストリア・ボヘミア・モラヴィア
  select:
    iso: [AUT, CZE]
  timeline:
    - from: 1648
      main: catholic
      note: 白山の戦い（1620）以後の再カトリック化で、プロテスタントは国外に追われるか「隠れプロテスタント」になった。
    - from: 1781
      main: catholic
      note: ヨーゼフ2世の寛容令で、ルター派・改革派・正教徒の礼拝が認められる。届け出たプロテスタントはボヘミア・モラヴィアで数％、オーストリアの一部（上オーストリア・ケルンテン）でやや多い。
      source: "https://ja.wikipedia.org/wiki/寛容令"
    - from: 1946
      main: catholic
      note: ボヘミア・モラヴィアのドイツ人（多くはカトリック）は1945–46年に追放された。チェコでは共産党政権の下で教会離れが進み、今はヨーロッパで最も宗教を持たない人の多い国の一つ（地図は伝統的な帰属）。
      source: "https://en.wikipedia.org/wiki/Religion_in_the_Czech_Republic"

- id: rel_salzburg_pongau
