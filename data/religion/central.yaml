# ======== 低地諸国 ========
- id: rel_dutch_republic
  name: オランダ（北部・中部）
  select:
    iso: [NLD]
  timeline:
    - from: 1648
      main: reformed
      minor: catholic
      note: 改革派が公認の教会。カトリックは公の礼拝を禁じられたが「隠れ教会」で信仰を続け、人口の約3分の1を占める。メノー派・ルター派・ユダヤ教徒も多い。
      source: "https://ja.wikipedia.org/wiki/オランダ改革派教会"
    - from: 1796
      main: reformed
      minor: catholic
      note: バタヴィア共和国で政教分離が定められ、カトリックも平等になる。
    - from: 1970
      main: reformed
      minor: catholic
      note: 1960年代以後、宗派ごとに社会が分かれていた「柱状化」が崩れ、世俗化が急速に進んだ。今のオランダでは宗教を持たない人が過半数（地図は伝統的な帰属）。
      source: "https://en.wikipedia.org/wiki/Pillarisation"

