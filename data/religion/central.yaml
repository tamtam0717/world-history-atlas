      main: catholic
      minor: sunni
      note: オスマン帝国の支配下で、町にはムスリム、農村にはカトリック（ショクツィ）と正教徒が住む。
    - from: 1699
      main: catholic
      minor: orthodox
      note: カルロヴィッツ条約でハプスブルク領に。ムスリムは去り、セルビア人の正教徒（特に東部・軍政国境地帯）が増える。
    - from: 1995
      main: catholic
      note: 1991–95年の紛争で、西スラヴォニアのセルビア人の多くが去った（1995年の「閃光作戦」）。東スラヴォニア（ヴコヴァル）は1998年に平和的にクロアチアへ戻り、セルビア人が今も約1〜3割残る。
      source: "https://en.wikipedia.org/wiki/Croatian_War_of_Independence"

