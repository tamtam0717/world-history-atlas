# 宗教（宗派）の分布：神聖ローマ帝国（ドイツ）・低地諸国・スイス・イタリア・ハプスブルク領（1648–1914）
# 形式は docs/religion-format.md。main = 住民の多数派、minor = 2〜3割以上の少数派。
# ドイツは「ルター派」を下地にして、カトリック・改革派・混在の地域を小さい地域で上書きする。
# ウェストファリア条約（1648）は1624年を「基準年」として各領邦の宗派を固定し、改革派（カルヴァン派）も公認した。

# ======== ドイツ ========
- id: rel_germany_base
  name: ドイツ（下地：ルター派の地域）
  select:
    iso: [DEU]
  timeline:
    - from: 1453
      main: catholic
      note: "宗教改革の前。帝国の教会は司教領・修道院領として大きな領土を持つ。"
    - from: 1525
      main: catholic
      minor: lutheran
      note: "ルターの95か条の論題（1517）から、宗教改革が帝国都市や諸侯の領邦に広がる。"
      source: "https://ja.wikipedia.org/wiki/宗教改革"
    - from: 1540
      main: lutheran
      minor: catholic
      note: "多くの諸侯・帝国都市がルター派の教会規定を定める。"
    - from: 1560
      main: lutheran
      note: "アウクスブルクの和議（1555）で「支配者の宗教が、その地の宗教」（領邦教会制）が認められる。"
      source: "https://ja.wikipedia.org/wiki/アウクスブルクの和議"
    - from: 1648
      main: lutheran
      note: 北ドイツ・中部ドイツの大部分（ザクセン、ブランデンブルク、メクレンブルク、ハノーファー、ヴュルテンベルクなど）はルター派。
      source: "https://ja.wikipedia.org/wiki/ヴェストファーレン条約"
    - from: 1817
      main: lutheran
      note: 1817年、プロイセン王フリードリヒ・ヴィルヘルム3世がルター派と改革派の教会を合同させた（プロイセン合同教会）。ナッサウ・バーデン・プファルツなどでも合同教会ができる。地図ではルター派の色のままにする。1870年代にはビスマルクとカトリック教会の対立（文化闘争）が起きる。
      source: "https://ja.wikipedia.org/wiki/文化闘争"
    - from: 1946
      main: lutheran
      note: 戦後、東方からの被追放民（約1200万人）が各地に住み、宗派の境界は混ざった。東ドイツ（1949–90）では教会離れが進み、今の旧東ドイツの州では宗教を持たない人が多数（地図は伝統的な帰属）。西ドイツでも1960年代以後世俗化が進み、トルコなどからの移民でイスラームの信者が増えた（全国で約5〜6%）。
      source: "https://en.wikipedia.org/wiki/Religion_in_Germany"

