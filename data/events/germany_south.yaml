  text: ニュルンベルクのナチ党大会に合わせて開かれた国会で、ユダヤ人から公民権を奪い、ユダヤ人と「ドイツ人」との結婚を禁じる法律が定められた。ニュルンベルクでは1933–1938年に毎年党大会が開かれた。
  polities: [germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ニュルンベルク法"

- year: 1936
  date: "1936-02-06"
  title: ガルミッシュ＝パルテンキルヒェン冬季オリンピック
  text: バイエルン・アルプスで冬季オリンピックが開かれた。同じ年のベルリン夏季大会とともに、ナチス政権が国の威信を示す場とした。
  polities: [germany]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/1936年ガルミッシュ＝パルテンキルヒェンオリンピック"

- year: 1939
  date: "1939-11-08"
  title: エルザーのヒトラー暗殺未遂
  text: 家具職人ゲオルク・エルザーが、ミュンヘン一揆の記念集会が開かれるビアホール（ビュルガーブロイケラー）に時限爆弾を仕掛けたが、ヒトラーは予定より早く会場を去って難を逃れた。
  polities: [germany]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ゲオルク・エルザー"

- year: 1940
  date: "1940-01"
  title: グラーフェネックとハーダマーでの障害者の殺害
  text: 「T4作戦」と呼ばれる障害者・精神病患者の組織的な殺害が、ヴュルテンベルクのグラーフェネック（1940年）、ヘッセンのハーダマー（1941年）などの施設で行われた。殺害の方法と人員は、のちのユダヤ人の絶滅収容所に引き継がれた。
  polities: [germany]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/T4作戦"

- year: 1940
  date: "1940-10-22"
  title: バーデン・プファルツのユダヤ人の追放
  text: バーデン・プファルツ・ザールの大管区指導者の命令で、約6,500人のユダヤ人がフランス南部（ヴィシー政権の地域）のギュルス収容所へ送られた。多くはのちにアウシュヴィッツで殺害された。
  polities: [germany, vichy_france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Gurs_internment_camp"

- year: 1943
  date: "1943-02-22"
  title: 白バラのショル兄妹の処刑
  text: ミュンヘン大学の学生ハンス・ショルとゾフィー・ショルらの抵抗グループ「白バラ」が、ナチス体制を批判するビラをまいて逮捕され、民族法廷で死刑とされた。
  polities: [germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/白いバラ"

- year: 1943
  date: "1943-10-22"
  title: カッセル空襲
  text: イギリス空軍の夜間爆撃で軍需工業の町カッセルが焼き払われ、約1万人が死亡した。ドイツ各地の都市が連合国の戦略爆撃を受けた。
  polities: [germany, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Bombing_of_Kassel_in_World_War_II"

- year: 1945
  date: "1945-02-23"
  title: 南ドイツ諸都市の空襲
  text: 戦争の最後の数か月に、プフォルツハイム（2月23日、約1万7千人が死亡）やヴュルツブルク（3月16日、旧市街の大半が焼失）などが爆撃で壊滅した。前年9月にはダルムシュタットも焼かれた。
  polities: [germany, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Bombing_of_Pforzheim_in_World_War_II"

- year: 1945
  date: "1945-03-07"
  title: レマーゲン鉄橋の確保
  text: アメリカ軍が、爆破に失敗したレマーゲンのルーデンドルフ鉄橋を奪い、初めてライン川を渡った。3月中にはザール・プファルツも連合国軍に占領された。
  polities: [usa, germany]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Ludendorff_Bridge"

- year: 1945
  date: "1945-04-29"
  title: ダッハウ強制収容所の解放とミュンヘン占領
  text: ニュルンベルク（4月20日）に続き、アメリカ軍がダッハウ強制収容所を解放し、翌日ミュンヘンを占領した。南ドイツはアメリカ軍とフランス軍の占領下に入った。
  polities: [usa, france, germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ダッハウ強制収容所"

- year: 1945
  date: "1945-09-19"
  title: アメリカ占領地区の州の設置
  text: アメリカ軍政府が、占領地区にバイエルン・大ヘッセン（のちヘッセン）・ヴュルテンベルク＝バーデンの3州を置いた。南西ドイツは占領地区の境界で、旧来のバーデン・ヴュルテンベルクが南北に分かれた。
  polities: [usa]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Württemberg-Baden"

- year: 1946
  date: "1946-08-30"
  title: ラインラント＝プファルツ州の設置
  text: フランス軍政府が、バイエルン領だったプファルツ、ヘッセン領だったラインヘッセン、プロイセンのライン州南部とナッサウの一部を合わせてラインラント＝プファルツ州をつくった。州都は当初コブレンツ、1950年からマインツ。
  polities: [france]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラインラント＝プファルツ州"

- year: 1946
  date: "1946-09-06"
  title: バーンズのシュトゥットガルト演説
  text: アメリカの国務長官バーンズがシュトゥットガルトで演説し、ドイツの経済の復興と自治の回復を支持すると表明した。占領政策が懲罰から復興へと転じる節目とされる。
  polities: [usa]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Restatement_of_Policy_on_Germany"

- year: 1946
  date: "1946-12-01"
  title: バイエルン州とヘッセン州の憲法
  text: 住民投票でバイエルン州とヘッセン州の憲法が承認された。基本法（1949年）より前に定められた州の憲法で、どちらも現在まで効力を持つ。
  polities: [usa]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Verfassung_des_Freistaates_Bayern"

- year: 1947
  date: "1947-12-15"
  title: ザール保護領の成立
  text: フランスは前年12月にザールを占領地区から切り離して関税境界を設け、この日ザール憲法が発効した。ザールはフランスと経済・通貨・関税で統合され、ホフマン首相の政府ができた。
  polities: [saar, france]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Saar_Protectorate"

- year: 1948
  date: "1948-08-10"
  title: ヘレンキームゼー会議
  text: 西側占領国が7月にフランクフルトで西ドイツの州首相たちに憲法制定を求めた（フランクフルト文書）のを受けて、バイエルンのヘレンキームゼーに専門家が集まり、基本法の草案をまとめた。
  polities: [usa, france, britain]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Verfassungskonvent_auf_Herrenchiemsee"

- year: 1951
  date: "1951-09-28"
  title: 連邦憲法裁判所の設置
  text: 西ドイツの連邦憲法裁判所がカールスルーエに置かれた。連邦通常裁判所（1950年）とともに、カールスルーエは「法の都」と呼ばれる。
  polities: [west_germany]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/連邦憲法裁判所_(ドイツ)"

- year: 1952
  date: "1952-04-25"
  title: バーデン＝ヴュルテンベルク州の成立
  text: 占領期に分かれていたヴュルテンベルク＝バーデン・バーデン（南バーデン）・ヴュルテンベルク＝ホーエンツォレルンの3州が、前年の住民投票を受けて合併した。旧バーデンの住民の多くは反対だった。
  polities: [west_germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バーデン＝ヴュルテンベルク州"

- year: 1955
  date: "1955-09-01"
  title: リンダウ郡のバイエルン復帰
  text: 1945年からフランス軍の管理下でバイエルンから切り離されていたリンダウ郡が、バイエルン州の行政に戻った。
  polities: [west_germany]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Landkreis_Lindau_(Bodensee)"

- year: 1955
  date: "1955-10-23"
  title: ザール規約の住民投票
  text: 1954年のパリ協定で西ドイツとフランスが合意した、ザールを西ヨーロッパ連合のもとで「ヨーロッパ化」する規約が、住民投票で約68%の反対により否決された。ホフマン首相は辞任した。
  polities: [saar, france, west_germany]
  importance: 2
  source: "https://en.wikipedia.org/wiki/1955_Saar_Statute_referendum"

- year: 1957
  date: "1957-01-01"
  title: ザールの西ドイツ復帰（小さな再統一）
  text: ザール条約（1956年10月、ルクセンブルク）によって、ザールラントは西ドイツの10番目の州となった。経済面ではフランスとの統合が1959年まで続いた。
  polities: [saar, west_germany, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ザールラント州"

- year: 1963
  date: "1963-12-20"
  title: フランクフルト・アウシュヴィッツ裁判
  text: ヘッセン州の検事長フリッツ・バウアーの尽力で、アウシュヴィッツ強制収容所の看守ら22人がフランクフルトで裁かれた（1965年判決）。ドイツ人自身がナチスの犯罪と向き合うきっかけとなった。
  polities: [west_germany]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Frankfurt_Auschwitz_trials"

- year: 1972
  date: "1972-09-05"
  title: ミュンヘン・オリンピック事件
  text: ミュンヘン夏季オリンピックの選手村で、パレスチナの武装組織「黒い九月」がイスラエルの選手団を襲い、救出作戦の失敗も重なって選手・コーチ11人が死亡した。
  polities: [west_germany, israel]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ミュンヘンオリンピック事件"

- year: 1975
  date: "1975-02-18"
  title: ヴィール原発反対運動
  text: バーデンのカイザーシュトゥール地方ヴィールで、ブドウ農家や学生が原子力発電所の建設予定地を占拠した。建設は最終的に中止され、のちの緑の党につながる環境運動の出発点となった。
  polities: [west_germany]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Kernkraftwerk_Wyhl"

- year: 1980
  date: "1980-01-13"
  title: 緑の党の結成
  text: 環境運動・反原発運動・平和運動などのグループがカールスルーエで連邦政党「緑の党」を結成した。1983年に連邦議会に初めて議席を得た。
  polities: [west_germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/同盟90/緑の党"

- year: 1980
  date: "1980-09-26"
  title: オクトーバーフェスト爆弾テロ
  text: ミュンヘンのビール祭りの会場入口で爆弾が爆発し、13人が死亡した。実行犯は極右団体とつながりのある学生で、戦後ドイツで最悪のテロの一つとなった。
  polities: [west_germany]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Oktoberfest_bombing"

- year: 1986
  title: ヴァッカースドルフ再処理工場への反対運動
  text: オーバープファルツのヴァッカースドルフで建設が進んだ使用済み核燃料の再処理工場に対し、チェルノブイリ事故の後に大規模な反対運動が起こった。計画は1989年に放棄された。
  polities: [west_germany]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Wiederaufarbeitungsanlage_Wackersdorf"

- year: 1998
  date: "1998-06-01"
  title: 欧州中央銀行の設立（フランクフルト）
  text: 単一通貨ユーロの導入に向けて、欧州中央銀行がフランクフルトに設けられた。ドイツ連邦銀行も本店を置くフランクフルトは、ヨーロッパの金融の中心の一つとなった。
  polities: [germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/欧州中央銀行"

- year: 2020
  date: "2020-02-19"
  title: ハーナウ銃撃事件
  text: ヘッセン州ハーナウで、人種差別的な考えを持つ男が移民の背景を持つ9人を射殺した。極右テロへの対策が大きな課題となった。
  polities: [germany]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Hanau_shootings"

- year: 2021
  date: "2021-07-14"
  title: アール川の大洪水
  text: 記録的な豪雨でラインラント＝プファルツ州のアール川流域が洪水に襲われ、134人が死亡した（隣のノルトライン＝ヴェストファーレン州なども含めドイツで180人以上）。気候変動への対応が改めて議論された。
  polities: [germany]
  importance: 3
  source: "https://en.wikipedia.org/wiki/2021_European_floods"
