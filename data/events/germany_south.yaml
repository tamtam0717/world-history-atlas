# 南ドイツ（BS 担当：ヘッセン・ラインラント＝プファルツ・ザールラント・バーデン＝ヴュルテンベルク・バイエルン）の出来事（1453–2025）
# europe.yaml にある全体の出来事（ウェストファリア条約、帝国代表者会議主要決議、ライン同盟など）は重複して書かない。

# ---------------------------------------------------------------- 1453–1647
- year: 1455
  title: グーテンベルクの『42行聖書』
  text: マインツのグーテンベルクが金属活字による活版印刷で聖書を刷り上げた。1462年のマインツ占領で職人が各地に散り、印刷術はヨーロッパに急速に広まった。
  polities: [mainz]
  importance: 1
  at: [8.27, 50.0]
  source: "https://ja.wikipedia.org/wiki/グーテンベルク聖書"

- year: 1462
  date: "1462-06-30"
  title: ゼッケンハイムの戦い
  text: プファルツ選帝侯フリードリヒ1世（勝利公）が、バーデン辺境伯・ヴュルテンベルク伯・メッス司教の連合軍を破って3人を捕虜にし、身代金と領地を得た。
  polities: [palatinate, baden, wurttemberg]
  importance: 3
  at: [8.57, 49.46]
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Seckenheim"

- year: 1462
  date: "1462-07-19"
  title: ギーンゲンの戦い
  text: バイエルン＝ランツフート公ルートヴィヒ9世が、ブランデンブルク辺境伯アルブレヒト・アキレスの軍を破った。帝国の南部で諸侯が二派に分かれて戦った「諸侯戦争」の決戦。
  polities: [bavaria_landshut, ansbach]
  importance: 3
  at: [10.24, 48.62]
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Giengen"

- year: 1462
  date: "1462-10-28"
  title: マインツ司教区のフェーデとマインツ市の陥落
  text: 大司教の座をめぐるディーター・フォン・イーゼンブルクとアドルフ・フォン・ナッサウの争いで、アドルフの軍がマインツ市を攻め落とした。市は自由都市の特権を失い、大司教の領地となった。
  polities: [mainz, palatinate]
  importance: 3
  at: [8.27, 50.0]
  source: "https://de.wikipedia.org/wiki/Mainzer_Stiftsfehde"

- year: 1472
  title: インゴルシュタット大学の創設
  text: バイエルン＝ランツフート公ルートヴィヒ9世が創設。16世紀にはエック（ルターの論敵）やイエズス会が活動し、対抗宗教改革の拠点となった（のちミュンヘン大学）。
  polities: [bavaria_landshut]
  importance: 3
  at: [11.43, 48.77]
  source: "https://de.wikipedia.org/wiki/Universität_Ingolstadt"

- year: 1475
  date: "1475-11-14"
  title: ランツフートの結婚式
  text: バイエルン＝ランツフート公の子ゲオルクとポーランド王女ヤドヴィガの結婚式。皇帝フリードリヒ3世も列席し、1万人の客をもてなした空前の祝宴として知られる。
  polities: [bavaria_landshut, poland]
  importance: 3
  at: [12.15, 48.54]
  source: "https://de.wikipedia.org/wiki/Landshuter_Hochzeit_1475"

- year: 1476
  title: ニクラスハウゼンの太鼓たたき
  text: タウバー川沿いのニクラスハウゼン村（ヴュルツブルク司教区）で、羊飼いハンス・ベーハイムが聖母のお告げとして、税や十分の一税の廃止と身分の平等を説き、数万人の巡礼者を集めた。司教に捕らえられ火刑となった。農民戦争の先駆けの一つ。
  polities: [wurzburg]
  importance: 3
  at: [9.66, 49.68]
  source: "https://de.wikipedia.org/wiki/Hans_Böhm"

- year: 1477
  title: テュービンゲン大学の創設
  text: ヴュルテンベルク＝ウラハ伯エーバーハルト（髭公）が創設した。同じ年、マインツ大学も開かれた。
  polities: [wurttemberg_urach, mainz]
  importance: 3
  at: [9.06, 48.52]
  source: "https://de.wikipedia.org/wiki/Eberhard_Karls_Universität_Tübingen"

- year: 1479
  title: カッツェンエルンボーゲン伯家の断絶
  text: ライン通行税で富んだ伯家が絶え、娘婿のヘッセン＝マールブルク方伯が伯領を相続した。ヘッセンはライン川・マイン川に進出し、ダルムシュタットがヘッセン領となった。
  polities: [katzenelnbogen, hesse_marburg]
  importance: 3
  at: [7.72, 50.15]
  source: "https://de.wikipedia.org/wiki/Grafschaft_Katzenelnbogen"

- year: 1482
  date: "1482-12-14"
  title: ミュンジンゲン条約（ヴュルテンベルクの再統一）
  text: 1442年から二つに分かれていたヴュルテンベルク伯領が、ウラハ系のエーバーハルト髭公のもとで再統一され、以後は分割しないことが定められた。
  polities: [wurttemberg, wurttemberg_urach]
  importance: 3
  at: [9.49, 48.41]
  source: "https://de.wikipedia.org/wiki/Münsinger_Vertrag"

- year: 1486
  title: レーゲンスブルクがバイエルンに服属
  text: 財政難に陥った帝国都市レーゲンスブルクが、バイエルン＝ミュンヘン公アルブレヒト4世に服属した。皇帝フリードリヒ3世は反発してシュヴァーベン同盟とともに圧力をかけ、1492年に帝国都市に戻された。
  polities: [bavaria, hre]
  importance: 3
  at: [12.1, 49.02]
  source: "https://de.wikipedia.org/wiki/Reichsstadt_Regensburg"

- year: 1488
  date: "1488-02-14"
  title: シュヴァーベン同盟の結成
  text: 皇帝フリードリヒ3世の呼びかけで、シュヴァーベンの帝国都市・騎士・諸侯が結んだ同盟。バイエルンの拡張を抑え、のちヴュルテンベルク公ウルリヒの追放（1519）や農民戦争の鎮圧（1525）を行った。1534年に解散。
  polities: [other_hre, wurttemberg, hre]
  importance: 2
  at: [9.51, 48.84]
  source: "https://de.wikipedia.org/wiki/Schwäbischer_Bund"

- year: 1492
  title: ベハイムの地球儀
  text: ニュルンベルクの商人マルティン・ベハイムが、現存する最古の地球儀を作った。コロンブスの航海の直前で、アメリカ大陸はまだ描かれていない。
  polities: [nuremberg]
  importance: 3
  at: [11.08, 49.45]
  source: "https://ja.wikipedia.org/wiki/マルティン・ベハイム"

- year: 1495
  date: "1495-08-07"
  title: ヴォルムス帝国議会と永久ラント平和令
  text: マクシミリアン1世のもとでの帝国改造。私闘（フェーデ）を永久に禁じるラント平和令と、帝国最高法院（帝室裁判所、フランクフルト→1527年からシュパイアー）・一般帝国税が定められた。同じ議会でヴュルテンベルクが公国に昇格した。
  polities: [hre, mainz, wurttemberg]
  importance: 2
  at: [8.36, 49.63]
  source: "https://ja.wikipedia.org/wiki/永久ラント平和令"

- year: 1502
  title: ブントシューの陰謀（ウンターグロンバッハ）
  text: シュパイアー司教領の農民ヨス・フリッツが、農民の靴（ブントシュー）の旗のもとで領主制の廃止を目指す一揆を企てたが、事前に発覚した。1513年（レーエン）・1517年（オーバーライン）にも計画された。
  polities: [other_hre]
  importance: 3
  at: [8.55, 49.12]
  source: "https://de.wikipedia.org/wiki/Bundschuh-Bewegung"

- year: 1504
  title: ランツフート継承戦争
  text: 男子のないバイエルン＝ランツフート公ゲオルクが娘婿のプファルツのループレヒトに領地を遺したため、ミュンヘンのアルブレヒト4世が反対して戦争となった。皇帝マクシミリアン1世がミュンヘン側について勝ち、翌年のケルンの裁定でバイエルンは再統一され、ノイブルク（若プファルツ）がプファルツ家の遺児に与えられた。
  polities: [bavaria, bavaria_landshut, palatinate, palatinate_neuburg, nuremberg, wurttemberg]
  importance: 2
  at: [12.15, 48.54]
  source: "https://ja.wikipedia.org/wiki/ランツフート継承戦争"

- year: 1506
  title: バイエルンの長子相続令
  text: 再統一したバイエルン公アルブレヒト4世が、領国を分割せず長子が継ぐことを定めた。以後バイエルンは分割されなかった。
  polities: [bavaria]
  importance: 3
  at: [11.58, 48.14]
  source: "https://de.wikipedia.org/wiki/Primogeniturgesetz_(Bayern)"

- year: 1514
  title: 「貧しいコンラート」の反乱とテュービンゲン条約
  text: ヴュルテンベルク公ウルリヒの重税に農民が蜂起した。公は鎮圧の一方で、テュービンゲン条約で等族（領邦議会）に課税承認権を認め、これはヴュルテンベルクの「憲法」として長く続いた。
  polities: [wurttemberg]
  importance: 3
  at: [9.06, 48.52]
  source: "https://de.wikipedia.org/wiki/Armer_Konrad"

- year: 1516
  date: "1516-04-23"
  title: バイエルンのビール純粋令
  text: バイエルン公ヴィルヘルム4世と弟ルートヴィヒ10世がインゴルシュタットで、ビールは大麦・ホップ・水だけで造ると定めた。
  polities: [bavaria]
  importance: 3
  at: [11.43, 48.77]
  source: "https://ja.wikipedia.org/wiki/ビール純粋令"

- year: 1516
  title: フッゲライの創設
  text: アウクスブルクの大富豪ヤーコプ・フッガーが、貧しい市民のための集合住宅フッゲライを建てた（現存する世界最古の社会住宅）。フッガー家はハプスブルク家に融資し、カール5世の皇帝選挙（1519）の資金も出した。
  polities: [other_hre, habsburg]
  importance: 3
  at: [10.9, 48.37]
  source: "https://ja.wikipedia.org/wiki/フッゲライ"

- year: 1519
  title: ヴュルテンベルク公ウルリヒの追放
  text: 帝国都市ロイトリンゲンを奪ったウルリヒ公をシュヴァーベン同盟が追放した。翌1520年、同盟は国をカール5世に売り、ヴュルテンベルクは1534年までオーストリアの支配下に置かれた。
  polities: [wurttemberg, habsburg, other_hre]
  importance: 3
  at: [9.18, 48.78]
  source: "https://de.wikipedia.org/wiki/Ulrich_(Württemberg)"

- year: 1521
  date: "1521-04-17"
  title: ヴォルムス帝国議会（ルターの喚問）
  text: カール5世がヴォルムスの帝国議会にルターを呼び出し、説の撤回を求めた。ルターは拒み、ヴォルムス勅令で帝国追放となった（ザクセン選帝侯がヴァルトブルク城にかくまう）。
  polities: [hre, saxony]
  importance: 1
  at: [8.36, 49.63]
  source: "https://ja.wikipedia.org/wiki/ヴォルムス帝国議会_(1521年)"

- year: 1522
  title: 騎士戦争（ジッキンゲンのトリーア攻撃）
  text: 帝国騎士フランツ・フォン・ジッキンゲンが、フッテンとともに宗教改革と騎士身分の復権を唱えてトリーア大司教領を攻めたが失敗した。翌年、プファルツ・ヘッセン・トリーアの軍にランシュトゥール城を落とされて死んだ。
  polities: [trier, palatinate, hesse_kassel]
  importance: 2
  at: [6.64, 49.75]
  source: "https://ja.wikipedia.org/wiki/騎士戦争"

- year: 1525
  date: "1525-03"
  title: メミンゲンの十二か条
  text: シュヴァーベンの農民団がメミンゲンに集まり、農奴制の廃止、牧師の選任権、十分の一税の改革などを聖書にもとづいて求める「十二か条」をまとめた。印刷されてドイツ農民戦争の綱領となった。
  polities: [other_hre]
  importance: 2
  at: [10.18, 47.99]
  source: "https://ja.wikipedia.org/wiki/十二箇条"

- year: 1525
  date: "1525-04-16"
  title: ヴァインスベルクの惨劇
  text: 農民軍がヴァインスベルクを攻め落とし、領主のヘルフェンシュタイン伯らを殺した。これが諸侯側の厳しい弾圧のきっかけとなり、ルターも農民を激しく非難した。
  polities: [wurttemberg, habsburg]
  importance: 3
  at: [9.29, 49.15]
  source: "https://de.wikipedia.org/wiki/Weinsberger_Bluttat"

- year: 1525
  date: "1525-05-12"
  title: ベーブリンゲンの戦い
  text: シュヴァーベン同盟軍（トルフゼス・ゲオルク・フォン・ヴァルトブルク）がヴュルテンベルクの農民軍を破った。6月にはフランケンの農民軍もケーニヒスホーフェンで敗れ、ヴュルツブルクのマリエンベルク城の包囲も解かれた。
  polities: [wurttemberg, wurzburg, other_hre]
  importance: 3
  at: [9.01, 48.68]
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Böblingen"

- year: 1526
  title: ヘッセンの宗教改革（ホンベルク教会会議）
  text: ヘッセン方伯フィリップ寛大伯がホンベルクの教会会議で宗教改革を導入し、修道院を廃止した。翌1527年にはその財産でマールブルク大学（最初のプロテスタント大学）を創設した。
  polities: [hesse_kassel]
  importance: 3
  at: [9.4, 51.03]
  source: "https://de.wikipedia.org/wiki/Homberger_Synode"

- year: 1529
  date: "1529-04-19"
  title: シュパイアー帝国議会の「抗議」
  text: カール5世の弟フェルディナントがルター派への寛容を取り消すと、ザクセン選帝侯・ヘッセン方伯・アンスバッハ辺境伯や帝国都市が抗議書（プロテスタツィオ）を出した。「プロテスタント」の名の由来。
  polities: [hre, hesse_kassel, ansbach, other_hre]
  importance: 2
  at: [8.44, 49.32]
  source: "https://ja.wikipedia.org/wiki/シュパイアー帝国議会"

- year: 1529
  date: "1529-10"
  title: マールブルク会談
  text: ヘッセン方伯フィリップの仲介でルターとツヴィングリが会談したが、聖餐（最後の晩餐のパンとぶどう酒）の解釈で一致できず、プロテスタントは二つに分かれた。
  polities: [hesse_kassel]
  importance: 3
  at: [8.77, 50.81]
  source: "https://ja.wikipedia.org/wiki/マールブルク会談"

- year: 1530
  date: "1530-06-25"
  title: アウクスブルク信仰告白
  text: アウクスブルク帝国議会で、メランヒトンがまとめたルター派の信仰告白をプロテスタント諸侯が皇帝カール5世に提出した。皇帝が受け入れなかったため、翌年シュマルカルデン同盟が結ばれた。
  polities: [hre, hesse_kassel, ansbach]
  importance: 2
  at: [10.9, 48.37]
  source: "https://ja.wikipedia.org/wiki/アウクスブルク信仰告白"

- year: 1534
  date: "1534-05-13"
  title: ラウフェンの戦いとウルリヒ公の復帰
  text: ヘッセン方伯フィリップがフランスの資金で兵を集め、ラウフェンでオーストリア軍を破ってウルリヒ公をヴュルテンベルクに復帰させた。カーダン条約でオーストリアの後封とされ、ウルリヒはルター派を導入した。
  polities: [wurttemberg, hesse_kassel, habsburg]
  importance: 3
  at: [9.15, 49.07]
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Lauffen_(1534)"

- year: 1535
  title: バーデン辺境伯領の分割
  text: バーデンがバーデン＝バーデン（カトリック）とバーデン＝プフォルツハイム（のちドゥルラハ、プロテスタント）に分かれ、1771年まで再統一されなかった。
  polities: [baden, baden_baden]
  importance: 3
  at: [8.24, 48.76]
  source: "https://de.wikipedia.org/wiki/Markgrafschaft_Baden-Baden"

- year: 1546
  title: シュマルカルデン戦争（ドナウ方面の戦い）
  text: カール5世がシュマルカルデン同盟と開戦した。ドナウ川沿いのインゴルシュタット付近で両軍が対陣した後、皇帝は南ドイツの帝国都市とヴュルテンベルク・プファルツ＝ノイブルクを降伏させた。
  polities: [hre, wurttemberg, palatinate_neuburg, hesse_kassel, other_hre]
  importance: 2
  at: [11.43, 48.77]
  source: "https://ja.wikipedia.org/wiki/シュマルカルデン戦争"

- year: 1548
  title: アウクスブルク仮信条協定とコンスタンツの併合
  text: カール5世はアウクスブルク帝国議会で、プロテスタントに暫定の妥協案（仮信条協定）を押しつけた。これを拒んだ帝国都市コンスタンツは帝国追放となり、オーストリア領に併合された。
  polities: [hre, habsburg, other_hre]
  importance: 3
  at: [9.17, 47.66]
  source: "https://de.wikipedia.org/wiki/Augsburger_Interim"

- year: 1552
  date: "1552-08"
  title: 諸侯の反乱とパッサウ条約
  text: ザクセン選帝侯モーリッツらがフランス王アンリ2世と結んで皇帝に反乱を起こし（諸侯戦争）、カール5世はインスブルックから逃れた。パッサウ条約でヘッセン方伯フィリップが釈放され、アウクスブルクの和議への道が開かれた。
  polities: [hre, hesse_kassel, palatinate_neuburg]
  importance: 2
  at: [13.46, 48.57]
  source: "https://ja.wikipedia.org/wiki/パッサウ条約"

- year: 1553
  date: "1553-07-09"
  title: 第二次辺境伯戦争
  text: クルムバッハ辺境伯アルブレヒト・アルキビアデスがフランケンの司教領とニュルンベルクを荒らした（1552–54）。ザクセン選帝侯モーリッツがジーファースハウゼンで破ったが自らも戦死した。アルブレヒトは帝国追放となり、クルムバッハは荒廃した。
  polities: [bayreuth, bamberg, wurzburg, nuremberg]
  importance: 3
  at: [11.45, 50.1]
  source: "https://de.wikipedia.org/wiki/Zweiter_Markgrafenkrieg"

- year: 1562
  title: フランクフルトでの皇帝の戴冠
  text: マクシミリアン2世がフランクフルトでローマ王として戴冠した。以後、皇帝の選挙と戴冠はともにフランクフルトで行われた。
  polities: [frankfurt, hre]
  importance: 3
  at: [8.68, 50.11]
  source: "https://de.wikipedia.org/wiki/Kaiserdom_St._Bartholomäus"

- year: 1563
  title: ハイデルベルク信仰問答
  text: カルヴァン派に改宗したプファルツ選帝侯フリードリヒ3世のもとで作られた信仰問答。改革派（カルヴァン派）の代表的な教理書としてオランダなどにも広まった。
  polities: [palatinate]
  importance: 2
  at: [8.69, 49.41]
  source: "https://ja.wikipedia.org/wiki/ハイデルベルク信仰問答"

- year: 1567
  date: "1567-03-31"
  title: ヘッセン方伯領の分割
  text: フィリップ寛大伯の死後、遺言で領国がヘッセン＝カッセル・マールブルク・ラインフェルス・ダルムシュタットの4家に分けられた。マールブルク・ラインフェルスはまもなく断絶し、カッセルとダルムシュタットの2家が残った。
  polities: [hesse_kassel, hesse_darmstadt, hesse_marburg, hesse_rheinfels]
  importance: 3
  at: [9.49, 51.31]
  source: "https://de.wikipedia.org/wiki/Landgrafschaft_Hessen"

- year: 1582
  title: ヴュルツブルク大学の再興
  text: ユリウス・エヒター司教が対抗宗教改革の拠点として大学を創設した（ユリウス大学）。1576年には施療院（ユリウス施療院）も創っている。領内のプロテスタントは追放された。
  polities: [wurzburg]
  importance: 3
  at: [9.93, 49.79]
  source: "https://de.wikipedia.org/wiki/Julius_Echter_von_Mespelbrunn"

- year: 1607
  title: ドナウヴェルト事件
  text: プロテスタントの帝国都市ドナウヴェルトでカトリックの行列が妨げられたことを口実に、バイエルン公マクシミリアンが帝国追放を執行して市を占領し、1609年に併合した。プロテスタント諸侯の危機感が高まった。
  polities: [bavaria, other_hre]
  importance: 2
  at: [10.78, 48.72]
  source: "https://de.wikipedia.org/wiki/Donauwörther_Krise"

- year: 1608
  date: "1608-05-14"
  title: プロテスタント同盟（ウニオン）の結成
  text: アンスバッハ辺境伯領のアウハウゼン修道院で、プファルツ選帝侯フリードリヒ4世を盟主にプロテスタント諸侯・都市が同盟を結んだ。翌1609年、バイエルン公マクシミリアンを中心にカトリック連盟（リーガ）が結成された。
  polities: [palatinate, ansbach, wurttemberg, baden, bavaria]
  importance: 1
  at: [10.62, 48.98]
  source: "https://ja.wikipedia.org/wiki/プロテスタント同盟"

- year: 1614
  title: フェットミルヒの反乱
  text: フランクフルトで菓子職人フェットミルヒに率いられた手工業者が市参事会に反乱を起こし、ユダヤ人街（ゲットー）を襲ってユダヤ人を追放した。皇帝の命で鎮圧され、ユダヤ人は1616年に戻された。
  polities: [frankfurt]
  importance: 3
  at: [8.68, 50.11]
  source: "https://de.wikipedia.org/wiki/Fettmilch-Aufstand"

- year: 1620
  title: スペイン軍の左岸プファルツ占領
  text: ボヘミア王となったプファルツ選帝侯フリードリヒ5世に対し、スペイン領ネーデルラントからスピノラの軍がライン左岸のプファルツを占領した。三十年戦争が西ドイツに広がった。
  polities: [spain, palatinate]
  importance: 3
  at: [8.36, 49.75]
  source: "https://ja.wikipedia.org/wiki/三十年戦争"

- year: 1622
  date: "1622-05-06"
  title: ヴィンプフェンの戦い
  text: ティリーの率いるカトリック連盟軍とスペイン軍が、バーデン＝ドゥルラハ辺境伯ゲオルク・フリードリヒを破った。6月のヘーヒストの戦いでも勝ち、9月にハイデルベルクを落とした。
  polities: [bavaria, baden, palatinate, spain]
  importance: 3
  at: [9.16, 49.23]
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Wimpfen"

- year: 1623
  title: バイエルンの選帝侯位とパラティーナ文庫
  text: レーゲンスブルクの諸侯会議で、プファルツ選帝侯の位がバイエルン公マクシミリアン1世に移された。ハイデルベルクの宮廷図書館（パラティーナ文庫）は、戦利品としてローマ教皇に贈られた。
  polities: [bavaria, palatinate, hre]
  importance: 2
  at: [12.1, 49.02]
  source: "https://ja.wikipedia.org/wiki/パラティーナ文庫"

- year: 1626
  title: フランケンの魔女裁判
  text: 1626–31年、ヴュルツブルク司教エーレンベルクとバンベルク司教ドルンハイムのもとで大規模な魔女裁判が行われ、両司教領で合わせて千人以上が処刑された。
  polities: [wurzburg, bamberg]
  importance: 3
  at: [10.4, 49.9]
  source: "https://de.wikipedia.org/wiki/Hexenprozesse_in_Würzburg"

- year: 1631
  date: "1631-12"
  title: スウェーデン王グスタフ・アドルフのマインツ入城
  text: ブライテンフェルトの戦いに勝ったスウェーデン軍がフランケンを抜けてライン川に進み、マインツで冬営した。グスタフ・アドルフはここからドイツ全体の支配を構想した。
  polities: [sweden, mainz, wurzburg]
  importance: 2
  at: [8.27, 50.0]
  source: "https://de.wikipedia.org/wiki/Schwedische_Besetzung_von_Mainz"

- year: 1632
  date: "1632-04-15"
  title: レヒ川の戦い（ライン・アム・レヒ）
  text: グスタフ・アドルフがレヒ川を渡ってティリーの連盟軍を破り、ティリーは重傷で死んだ。スウェーデン軍はアウクスブルク・ミュンヘンに入った。
  polities: [sweden, bavaria]
  importance: 3
  at: [10.84, 48.68]
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Rain_am_Lech"

- year: 1632
  date: "1632-09-03"
  title: アルテ・フェステの戦い
  text: ニュルンベルクを守って陣を張ったグスタフ・アドルフが、近くのツィルンドルフに布陣したヴァレンシュタインの陣地を攻めたが落とせず、両軍はザクセンへ移った（11月のリュッツェンの戦い）。
  polities: [sweden, nuremberg, habsburg]
  importance: 3
  at: [10.96, 49.45]
  source: "https://de.wikipedia.org/wiki/Schlacht_an_der_Alten_Veste"

- year: 1634
  date: "1634-09-06"
  title: ネルトリンゲンの戦い
  text: 皇帝軍とスペイン軍がスウェーデン・プロテスタント軍に大勝し、スウェーデンは南ドイツから退いた。ヴュルテンベルクなどは皇帝軍に占領され、翌年のプラハの和約を経てフランスの直接参戦を招いた。
  polities: [sweden, habsburg, spain, wurttemberg, bavaria]
  importance: 1
  at: [10.49, 48.85]
  source: "https://ja.wikipedia.org/wiki/ネルトリンゲンの戦い_(1634年)"

- year: 1638
  date: "1638-12-17"
  title: ブライザッハの攻略
  text: フランスと結んだザクセン＝ヴァイマル公ベルンハルトが、ライン川の要塞ブライザッハを長い包囲の末に落とした。翌年ベルンハルトが死ぬと、その軍と占領地はフランスのものとなった（1648年にブライザッハはフランス領）。
  polities: [france, habsburg]
  importance: 3
  at: [7.58, 48.03]
  source: "https://de.wikipedia.org/wiki/Belagerung_von_Breisach"

- year: 1644
  date: "1644-08-03"
  title: フライブルクの戦い
  text: バイエルン軍（メルシー）とフランス軍（アンギャン公・テュレンヌ）がフライブルク郊外で数日にわたり戦った。決着はつかなかったが、フランス軍はその後フィリップスブルクやマインツなどライン中流を占領した。
  polities: [bavaria, france, habsburg, mainz]
  importance: 3
  at: [7.85, 47.99]
  source: "https://ja.wikipedia.org/wiki/フライブルクの戦い"

- year: 1645
  date: "1645-08-03"
  title: アラーハイムの戦い（第二次ネルトリンゲンの戦い）
  text: フランス軍（アンギャン公・テュレンヌ）がバイエルン軍を破り、バイエルンの将軍メルシーが戦死した。同じ年5月にはメルゲントハイムでバイエルン軍がテュレンヌを破っていた。
  polities: [france, bavaria]
  importance: 3
  at: [10.53, 48.87]
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Alerheim"

- year: 1645
  title: ヘッセン戦争の激化
  text: 1604年から続くマールブルクの相続争いが、スウェーデン・フランスと結んだヘッセン＝カッセル（方伯妃アマーリエ・エリーザベト）と皇帝側のダルムシュタットの戦争に発展した。カッセル軍がマールブルクを奪い、1648年の和約で北部はカッセル、ギーセンなど南部はダルムシュタットに分けられた。
  polities: [hesse_kassel, hesse_darmstadt]
  importance: 3
  at: [8.77, 50.81]
  source: "https://de.wikipedia.org/wiki/Hessenkrieg"

# ---------------------------------------------------------------- 1648–2025
- year: 1648
  title: プファルツ選帝侯の復位とバイエルンの選帝侯位確定
  text: ウェストファリア条約で、三十年戦争中に奪われたバイエルンの選帝侯位とオーバープファルツの領有が認められる一方、プファルツ選帝侯カール・ルートヴィヒには第8の選帝侯位が新設され、ライン沿いの下プファルツが返還された。
  polities: [bavaria, palatinate, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヴェストファーレン条約"

- year: 1658
  date: "1658-08-14"
  title: ライン同盟（第一次）の結成
  text: マインツ選帝侯シェーンボルンが主導し、ライン地方の諸侯がフランス（ルイ14世）・スウェーデンと結んで皇帝を牽制した。1668年に解消。
  polities: [mainz, trier, hesse_kassel, france, hre]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Rheinische_Allianz"

- year: 1663
  title: 永久帝国議会の開会
  text: レーゲンスブルクで開かれた帝国議会が閉会されないまま常設化し、1806年まで帝国の常設の議会となった（諸侯は使節を送った）。
  polities: [hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/帝国議会_(神聖ローマ帝国)"

- year: 1674
  title: テュレンヌのプファルツ荒廃
  text: オランダ戦争で、フランスのテュレンヌ元帥がプファルツに侵攻して焼き払い、ジンスハイムの戦いなどで帝国軍を破った。
  polities: [france, palatinate]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Sinsheim"

- year: 1680
  title: ザールルイの建設とザール地方の「再統合」
  text: ルイ14世は「再統合法廷」を設けて国境地帯の領地を次々と併合し、ザール川沿いに要塞都市ザールルイを建設した。ツヴァイブリュッケン・ザールブリュッケンなどもフランス領とされた（1697年に返還、ザールルイは保持）。
  polities: [france, zweibrucken, nassau, trier]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レユニオン政策"

- year: 1685
  title: プファルツ選帝侯家（ジンメルン系）の断絶
  text: 選帝侯カール2世が死去してジンメルン系が断絶し、カトリックのノイブルク系フィリップ・ヴィルヘルムが継承。ルイ14世は弟の妃リーゼロッテ（カール2世の姉）の相続権を主張し、プファルツ継承戦争の原因となった。
  polities: [palatinate, palatinate_neuburg, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/大同盟戦争"

- year: 1689
  title: プファルツの焦土化とハイデルベルク城の破壊
  text: フランス軍が撤退にあたってプファルツを組織的に破壊し、ハイデルベルク・マンハイム・シュパイアー・ヴォルムスなどが焼かれた。ハイデルベルク城は1693年の再占領で決定的に破壊された。
  polities: [france, palatinate]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ハイデルベルク城"

- year: 1693
  title: 帝国最高法院がヴェッツラーへ移転
  text: プファルツ継承戦争でシュパイアーが破壊されたため、帝国最高法院（帝国裁判所）は帝国都市ヴェッツラーに移った（1806年まで）。青年ゲーテも1772年にここで司法修習をした。
  polities: [hre]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/帝国最高法院"

- year: 1704
  date: "1704-08-13"
  title: ブレンハイム（ヘーヒシュテット）の戦い
  text: スペイン継承戦争で、マールバラ公とオイゲン公の連合軍が、バイエルン・フランス軍をドナウ河畔で破った。バイエルンはオーストリアに占領され、選帝侯マクシミリアン2世エマヌエルは亡命した。
  polities: [bavaria, france, britain, habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ブレンハイムの戦い"

- year: 1705
  date: "1705-12-25"
  title: ゼントリングの血のクリスマス
  text: オーストリアの占領と徴兵に反発したバイエルン農民の蜂起が、ミュンヘン近郊ゼントリングで鎮圧され、多数が殺された。
  polities: [bavaria, habsburg]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Sendlinger_Mordweihnacht"

- year: 1706
  title: バイエルン・ケルン選帝侯の帝国追放
  text: 皇帝ヨーゼフ1世が、フランス側についたバイエルン選帝侯とその弟のケルン選帝侯に帝国追放を宣告した。オーバープファルツは1708年にプファルツ選帝侯に与えられたが、1714年の講和で両選帝侯は復帰した。
  polities: [bavaria, cologne, hre, palatinate]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Maximilian_II._Emanuel_(Bayern)"

- year: 1715
  date: "1715-06-17"
  title: カールスルーエの建設
  text: バーデン＝ドゥルラハ辺境伯カール3世ヴィルヘルムが、宮殿を中心に道路が放射状に広がる計画都市カールスルーエを建設し、首都を移した。
  polities: [baden]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/カールスルーエ"

- year: 1720
  title: プファルツ選帝侯がマンハイムへ遷都・ヴュルツブルクのレジデンツ着工
  text: 選帝侯カール3世フィリップがハイデルベルクからマンハイムに宮廷を移した。同じ年、ヴュルツブルク司教シェーンボルンはバルタザール・ノイマンの設計でレジデンツ（司教館、世界遺産）の建設を始めた。
  polities: [palatinate, wurzburg]
  importance: 3
  source:
    - "https://ja.wikipedia.org/wiki/マンハイム宮殿"
    - "https://ja.wikipedia.org/wiki/ヴュルツブルクのレジデンツ"

- year: 1736
  title: ハーナウ伯家の断絶
  text: ハーナウ伯家が断絶し、ハーナウ＝ミュンツェンベルク伯領はヘッセン＝カッセルが、ハーナウ＝リヒテンベルク伯領（ライン左岸・アルザス北部）はヘッセン＝ダルムシュタットが相続した。
  polities: [hesse_kassel, hesse_darmstadt]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Grafschaft_Hanau"

- year: 1742
  date: "1742-01-24"
  title: バイエルン選帝侯カール・アルブレヒトの皇帝選出（カール7世）
  text: オーストリア継承戦争のさなか、フランスの支援でフランクフルトで皇帝に選ばれた。約300年ぶりのハプスブルク家以外の皇帝だが、その間に本国バイエルンはオーストリア軍に占領された。
  polities: [bavaria, hre, habsburg, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カール7世_(神聖ローマ皇帝)"

- year: 1745
  date: "1745-04-22"
  title: フュッセンの和約
  text: カール7世の死後、子のマクシミリアン3世ヨーゼフがオーストリアと講和。オーストリア継承（ハプスブルク家の遺領）への要求を放棄し、マリア・テレジアの夫フランツの皇帝選出を支持する代わりにバイエルンを回復した。
  polities: [bavaria, habsburg, hre]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Frieden_von_Füssen"

- year: 1749
  date: "1749-08-28"
  title: ゲーテがフランクフルトで誕生
  text: のちのドイツ古典主義文学の巨匠ゲーテが帝国都市フランクフルトの裕福な市民の家に生まれた。
  polities: [frankfurt]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヨハン・ヴォルフガング・フォン・ゲーテ"

- year: 1769
  title: アンスバッハとバイロイトの統合
  text: バイロイト辺境伯家が断絶し、アンスバッハ辺境伯カール・アレクサンダーが相続。フランケンのホーエンツォレルン家領が一つになった。
  polities: [ansbach, bayreuth]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Fürstentum_Bayreuth"

- year: 1771
  title: 両バーデンの統一
  text: バーデン＝バーデン辺境伯家が断絶し、バーデン＝ドゥルラハ辺境伯カール・フリードリヒが相続。16世紀以来分かれていたバーデンが統一された。
  polities: [baden, baden_baden]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/バーデン辺境伯領"

- year: 1776
  date: "1776-05-01"
  title: バイエルン啓明結社（イルミナティ）の創設
  text: インゴルシュタット大学教授ヴァイスハウプトが啓蒙思想の秘密結社を作った。1785年にバイエルン選帝侯により禁止された。
  polities: [bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/イルミナティ"

- year: 1777
  date: "1777-12-30"
  title: バイエルン系ヴィッテルスバッハ家の断絶
  text: 選帝侯マクシミリアン3世ヨーゼフが死去し、プファルツ選帝侯カール・テオドールがバイエルンを相続した（プファルツ＝バイエルン）。皇帝ヨーゼフ2世はバイエルンの一部の獲得を図った。
  polities: [bavaria, palatinate, habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バイエルン継承戦争"

- year: 1778
  title: バイエルン継承戦争（ジャガイモ戦争）
  text: オーストリアのバイエルン進出に対し、プロイセンのフリードリヒ2世がザクセンとともに出兵。大きな戦闘のないまま、1779年のテシェン条約でオーストリアはインフィアテルだけを得た。
  polities: [bavaria, habsburg, prussia, saxony]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バイエルン継承戦争"

- year: 1782
  title: シラーの『群盗』初演とヴュルテンベルクからの逃亡
  text: カール学院出身のシラーの戯曲『群盗』がマンハイムで初演され大評判となった。執筆を禁じられたシラーはヴュルテンベルクから逃れた（シュトゥルム・ウント・ドラング）。
  polities: [wurttemberg, bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フリードリヒ・フォン・シラー"

- year: 1785
  title: 諸侯同盟（フュルステンブント）
  text: ヨーゼフ2世がバイエルンとオーストリア領ネーデルラントの交換を企てると、フリードリヒ2世はハノーファー・ザクセン・マインツなどと諸侯同盟を結んでこれを阻止した。
  polities: [prussia, habsburg, bavaria, hanover, saxony, mainz]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Fürstenbund"

- year: 1791
  date: "1791-12-02"
  title: アンスバッハ＝バイロイトのプロイセン譲渡
  text: 辺境伯カール・アレクサンダーが退位し、フランケンの両辺境伯領はプロイセン王の直轄領となった（大臣ハルデンベルクが統治）。
  polities: [ansbach, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Fürstentum_Ansbach"

- year: 1793
  date: "1793-03-18"
  title: マインツ共和国
  text: 1792年にマインツを占領したフランス軍のもとで、ドイツ人ジャコバン派がドイツ最初の共和国を宣言し、フランスへの併合を決議した。7月にプロイセン軍などがマインツを奪回して崩壊。
  polities: [mainz, france, prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マインツ共和国"

- year: 1797
  title: ラシュタット会議
  text: カンポ・フォルミオ条約を受けて、帝国とフランスがライン左岸の割譲と諸侯への補償をラシュタットで協議した（1797–99）。会議は決裂し、1799年の解散時にフランス使節が殺害された。
  polities: [hre, france, baden]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Rastatter_Kongress"

- year: 1798
  title: ライン左岸にフランスの県を設置
  text: フランスは占領したライン左岸にモン＝トネール（マインツ）、ラン＝エ＝モゼル（コブレンツ）、サール（トリーア）、ロエル（アーヘン）の4県を置き、フランスの制度を導入した。
  polities: [france, mainz, trier, palatinate]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Linkes_Rheinufer"

- year: 1799
  title: マクシミリアン・ヨーゼフのバイエルン継承とモンジュラの改革
  text: カール・テオドールが死去し、ツヴァイブリュッケン家のマクシミリアン4世ヨーゼフが継承。大臣モンジュラが修道院の廃止、官僚制・徴兵制の整備など、上からの近代化を進めた。
  polities: [bavaria, zweibrucken]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マクシミリアン・フォン・モンジュラ"

- year: 1805
  date: "1805-12-26"
  title: 南ドイツ諸邦の王国化（プレスブルク条約）
  text: ナポレオンと結んだバイエルン・ヴュルテンベルク・バーデンは、プレスブルク条約でチロル・前方オーストリア・アウクスブルクなどを獲得し、バイエルンとヴュルテンベルクは1806年1月1日に王国となった。
  polities: [bavaria, wurttemberg, baden, habsburg, france]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/プレスブルクの和約"

- year: 1806
  title: 帝国諸侯・帝国騎士の陪臣化
  text: ライン同盟規約により、ホーエンローエ、フュルステンベルク、エッティンゲン、ライニンゲンなど多数の諸侯・伯と帝国騎士が主権を失い、バイエルン・ヴュルテンベルク・バーデン・ヘッセンなどの臣下となった。帝国都市ニュルンベルクもバイエルンに併合された。
  polities: [bavaria, wurttemberg, baden, hesse_darmstadt, nassau, other_hre, nuremberg]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Mediatisierung"

- year: 1806
  date: "1806-11-01"
  title: ヘッセン＝カッセルの占領
  text: プロイセンに味方したヘッセン選帝侯ヴィルヘルム1世の領国をフランス軍が占領。選帝侯は亡命し、翌1807年に本領はヴェストファーレン王国に編入された。
  polities: [hesse_kassel, france, westphalia_kingdom]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヘッセン選帝侯国"

- year: 1808
  date: "1808-05-01"
  title: バイエルン王国の憲法
  text: モンジュラのもとで、ライン同盟諸国で最初期の成文憲法が制定され、農奴制の廃止や法の前の平等が定められた。
  polities: [bavaria]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Konstitution_für_das_Königreich_Baiern"

- year: 1810
  title: 南ドイツの領土再編（フランクフルト大公国の成立など）
  text: ダールベルクの国家がフランクフルト大公国に再編され、バイエルンはレーゲンスブルク・バイロイト・ザルツブルクを得た。バイエルンとヴュルテンベルクの国境条約でウルムなどがヴュルテンベルクに移った。
  polities: [frankfurt_gd, bavaria, wurttemberg, baden]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フランクフルト大公国"

- year: 1813
  date: "1813-10-08"
  title: リート条約（バイエルンの連合国参加）
  text: バイエルンがライプツィヒの戦いの直前にオーストリアとリート条約を結び、ライン同盟を離脱して連合国側に移った。代わりに領土の保全が約束された。ヴュルテンベルク・バーデンなども続いた。
  polities: [bavaria, habsburg, rhine_confederation, wurttemberg, baden]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Vertrag_von_Ried"

- year: 1813
  title: ヘッセン選帝侯の復帰とフランクフルト大公国の解体
  text: ライプツィヒの戦いの後、ヴェストファーレン王国が崩壊してヘッセン選帝侯がカッセルに戻った。フランクフルト大公国も解体され、ダールベルクは退位した。
  polities: [hesse_kassel, frankfurt_gd, frankfurt, westphalia_kingdom]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フランクフルト大公国"

- year: 1815
  title: ドイツ連邦議会がフランクフルトに置かれる
  text: ウィーン会議で自由都市として復活したフランクフルトが、ドイツ連邦の連邦議会（1816年開会）の所在地に決まった。ライン左岸ではプファルツ（1816年バイエルン）、ラインヘッセン（1816年ヘッセン大公国）の帰属が翌年までに決まった。
  polities: [frankfurt, german_confederation, bavaria, hesse_darmstadt]
  importance: 3
  note: 連邦規約は1815年6月8日、連邦議会の開会は1816年11月。
  source: "https://ja.wikipedia.org/wiki/ドイツ連邦"

# ---------------------------------------------------------------- 1816–1914

- year: 1816
  title: 「夏のない年」と南ドイツの飢饉
  text: 前年のタンボラ山の噴火による冷夏で、ヴュルテンベルク・バーデンなどの南西ドイツは1816–17年に深刻な飢饉となった。ロシアやアメリカへの移民が急増した。
  polities: [wurttemberg, baden, bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/夏のない年"

- year: 1817
  date: "1817-04"
  title: ビルケンフェルト侯国がオルデンブルク領に
  text: ウィーン会議の取り決めにより、ナーエ川上流のビルケンフェルト一帯がプロイセンからオルデンブルク大公国に引き渡され、その飛び地となった。
  polities: [oldenburg, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Fürstentum_Birkenfeld"

- year: 1818
  title: バイエルン・バーデンの憲法制定
  text: バイエルン（5月）とバーデン（8月）が、二院制の議会をもつ憲法を定めた。南ドイツ諸国は、プロイセン・オーストリアより早く立憲君主国となった（ヴュルテンベルク1819年、ヘッセン大公国1820年）。
  polities: [bavaria, baden, wurttemberg, hesse_darmstadt]
  importance: 2
  source:
    - "https://de.wikipedia.org/wiki/Verfassung_des_Königreichs_Bayern_(1818)"
    - "https://de.wikipedia.org/wiki/Verfassung_des_Großherzogtums_Baden"

- year: 1819
  date: "1819-03-23"
  title: マンハイムでコッツェブー暗殺
  text: ブルシェンシャフト（学生組合）の学生ザントが、保守派の劇作家コッツェブーをマンハイムで刺殺した。メッテルニヒはこれを口実に、同年9月のカールスバート決議で大学と出版への取り締まりをドイツ連邦全体に広げた。
  polities: [baden, german_confederation, habsburg]
  importance: 2
  source:
    - "https://ja.wikipedia.org/wiki/アウグスト・フォン・コツェブー"
    - "https://ja.wikipedia.org/wiki/カールスバート決議"

- year: 1825
  date: "1825-10-13"
  title: ルートヴィヒ1世の即位とミュンヘンの改造
  text: ギリシア独立運動を支持したことでも知られるルートヴィヒ1世が即位。ランツフートの大学をミュンヘンに移し（1826）、ルートヴィヒ通り、アルテ・ピナコテーク、グリュプトテークなどでミュンヘンを「イーザル河畔のアテネ」に作り変えた。
  polities: [bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ルートヴィヒ1世_(バイエルン王)"

- year: 1828
  title: 南ドイツ関税同盟とヘッセン＝プロイセン関税同盟
  text: バイエルンとヴュルテンベルクが南ドイツ関税同盟を、ヘッセン大公国がプロイセンと関税同盟を結んだ。これらが1834年のドイツ関税同盟にまとまっていく。
  polities: [bavaria, wurttemberg, hesse_darmstadt, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Süddeutscher_Zollverein"

- year: 1831
  date: "1831-01-05"
  title: ヘッセン選帝侯国の憲法
  text: 七月革命の影響でカッセルなどで騒乱が起き、選帝侯ヴィルヘルム2世は憲法を認めた。当時のドイツで最も進んだ憲法の一つとされたが、その後も選帝侯と議会の対立が続いた。
  polities: [hesse_kassel]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Kurhessische_Verfassung_von_1831"

- year: 1832
  date: "1832-05-27"
  title: ハンバッハ祭
  text: バイエルン領プファルツのハンバッハ城に約3万人が集まり、ドイツの統一と自由、民衆の主権を訴えた。黒・赤・金の旗が掲げられた最初の大集会で、連邦は集会・結社の取り締まりを強めた。
  polities: [bavaria, german_confederation]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ハンバッハ祭"

- year: 1833
  date: "1833-04-03"
  title: フランクフルト衛兵所襲撃事件
  text: 学生ら約50人が連邦議会の所在地フランクフルトで警備隊の詰所を襲い、革命を起こそうとしたが失敗した。連邦は中央調査局を設けて、運動の取り締まりを強化した。
  polities: [frankfurt, german_confederation]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Frankfurter_Wachensturm"

- year: 1834
  title: リヒテンベルク侯国のプロイセンへの売却
  text: ザクセン＝コーブルク＝ゴータ公がザール地方の飛び地リヒテンベルク侯国（ザンクト・ヴェンデル）をプロイセンに売却し、ライン州に編入された。
  polities: [saxon_duchies, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Fürstentum_Lichtenberg"

- year: 1835
  date: "1835-12-07"
  title: ドイツ最初の鉄道（ニュルンベルク–フュルト）
  text: バイエルンのニュルンベルクとフュルトの間、約6キロにドイツで最初の鉄道（ルートヴィヒ鉄道）が開通した。機関車「アドラー号」はイギリス製だった。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ルートヴィヒ鉄道"

- year: 1847
  date: "1847-09-12"
  title: オッフェンブルク集会
  text: バーデンの急進派（ヘッカー、シュトルーヴェら）がオッフェンブルクに集まり、出版の自由、人民の武装、累進課税などを求める綱領を採択した。翌年の革命の先がけとなった。
  polities: [baden]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Offenburger_Programm"

- year: 1848
  date: "1848-03-20"
  title: ルートヴィヒ1世の退位
  text: 踊り子ローラ・モンテスへの寵愛が反発を招き、三月革命の騒乱の中でバイエルン王ルートヴィヒ1世が退位した。子のマクシミリアン2世が即位した。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ローラ・モンテス"

- year: 1848
  date: "1848-04"
  title: ヘッカー蜂起
  text: 準備議会で共和政の提案が退けられたヘッカーとシュトルーヴェが、バーデン南部で共和国をめざして蜂起したが、カンデルンで連邦軍に敗れた。
  polities: [baden, german_confederation]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Heckerzug"

- year: 1848
  date: "1848-05-18"
  title: フランクフルト国民議会の開会（パウロ教会）
  text: ドイツ連邦の各国で選ばれた議員が、フランクフルトのパウロ教会に集まった。ドイツの統一と基本権を議論し、6月にはオーストリアのヨハン大公を帝国摂政に選んだ。
  polities: [german_confederation, frankfurt]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/フランクフルト国民議会"

- year: 1849
  date: "1849-05"
  title: バーデン・プファルツの蜂起（憲法闘争）
  text: プロイセン王が帝冠を拒んだ後、フランクフルト憲法の実施を求めてバーデンとバイエルン領プファルツで蜂起が起き、バーデン大公は国外に逃れた。プロイセン軍が鎮圧し、7月23日にラシュタット要塞が降伏して、ドイツの1848年革命は終わった。
  polities: [baden, bavaria, prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バーデン革命"

- year: 1850
  title: ホーエンツォレルン両侯国のプロイセン編入
  text: 革命の騒乱を受けて、ホーエンツォレルン＝ジグマリンゲンとヘヒンゲンの両侯が1849年12月の条約で領国をプロイセン王に譲り、1850年からプロイセンのホーエンツォレルン諸邦となった。
  polities: [hohenzollern, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Hohenzollernsche_Lande"

- year: 1850
  title: ヘッセン選帝侯国の憲法紛争
  text: 選帝侯フリードリヒ・ヴィルヘルムと宰相ハッセンプフルークが議会の予算拒否に対して戒厳令を出し、官吏・将校も従わなかった。連邦（オーストリア）の介入にプロイセンが反発して開戦寸前となったが、11月のオルミュッツ協定でプロイセンが譲歩した。
  polities: [hesse_kassel, prussia, habsburg, german_confederation]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Kurhessischer_Verfassungskonflikt"

- year: 1862
  title: バーデンの営業の自由とユダヤ人の解放
  text: 自由主義の内閣のもとで、ツンフト（同業組合）の制限を廃止して営業の自由を認め、ユダヤ人に完全な市民権を与えた。
  polities: [baden]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Großherzogtum_Baden"

- year: 1863
  date: "1863-08"
  title: フランクフルト諸侯会議
  text: オーストリア皇帝フランツ・ヨーゼフがドイツ連邦の改革を議論するため諸侯をフランクフルトに招いたが、ビスマルクの説得でプロイセン王が欠席し、成果なく終わった。
  polities: [german_confederation, habsburg, frankfurt, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Frankfurter_Fürstentag"

- year: 1866
  date: "1866-06-14"
  title: 連邦議会がプロイセンに対する動員を決議
  text: オーストリアの提案で、連邦議会がプロイセンに対する連邦軍の動員を決議した。プロイセンは連邦からの脱退を宣言し、普墺戦争（ドイツ戦争）が始まった。バイエルン・ヴュルテンベルク・バーデン・ヘッセン・ナッサウなど南ドイツの大半がオーストリア側についた。
  polities: [german_confederation, prussia, habsburg, bavaria, wurttemberg, baden, hesse_darmstadt, hesse_kassel, nassau]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/普墺戦争"

- year: 1866
  date: "1866-07"
  title: マイン戦役（キッシンゲンの戦いなど）
  text: プロイセンのマイン軍が、キッシンゲン（7月10日）などでバイエルン軍を、タウバービショフスハイムなどで南ドイツ諸国の連邦第8軍団を破り、フランクフルト・ヴュルツブルクへ進んだ。
  polities: [prussia, bavaria, wurttemberg, baden, hesse_darmstadt]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Mainfeldzug"

- year: 1866
  date: "1866-08"
  title: 南ドイツ諸国とプロイセンの講和・秘密攻守同盟
  text: バイエルン・ヴュルテンベルク・バーデンは賠償金を払ってプロイセンと講和し、同時に戦時には軍をプロイセン王の指揮下に置く秘密の攻守同盟を結んだ。ヘッセン大公国はヘッセン＝ホンブルクなどを割譲した。
  polities: [prussia, bavaria, wurttemberg, baden, hesse_darmstadt]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Schutz-_und_Trutzbündnis"

- year: 1868
  title: 関税議会の選挙
  text: 関税同盟の改組で、北ドイツと南ドイツの代表が集まる関税議会が設けられた。バイエルンとヴュルテンベルクの選挙ではプロイセン主導の統一に反対する派が勝ち、統一に慎重な南ドイツの空気を示した。
  polities: [bavaria, wurttemberg, baden, hesse_darmstadt, north_german_confederation]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Zollparlament"

- year: 1869
  date: "1869-09-05"
  title: ノイシュヴァンシュタイン城の着工
  text: ルートヴィヒ2世が、ワーグナーの楽劇の世界をイメージした城をフュッセン近郊で着工した。王の築城は国費を圧迫し、のちの廃位の一因となった。
  polities: [bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ノイシュヴァンシュタイン城"

- year: 1870
  date: "1870-11"
  title: 南ドイツ諸国のドイツ帝国加盟条約（11月条約）
  text: 普仏戦争の最中、ヴェルサイユでバーデン・ヘッセン（11月15日）、ヴュルテンベルク（11月25日）、バイエルン（11月23日）が北ドイツ連邦との条約に調印した。バイエルンとヴュルテンベルクは軍・郵便・鉄道などに留保権を得た。
  polities: [bavaria, wurttemberg, baden, hesse_darmstadt, north_german_confederation, german_empire]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Novemberverträge"

- year: 1870
  date: "1870-11-30"
  title: ルートヴィヒ2世の「皇帝推戴の書簡」
  text: ビスマルクの求めで、バイエルン王ルートヴィヒ2世がドイツ諸侯を代表してプロイセン王に皇帝の位を申し出る書簡を送った。見返りに王はひそかに年金を受けた。
  polities: [bavaria, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Kaiserbrief"

- year: 1876
  date: "1876-08-13"
  title: 第1回バイロイト音楽祭
  text: ルートヴィヒ2世の援助で建てられたバイロイト祝祭劇場で、ワーグナーの『ニーベルングの指環』が初めて全曲上演された。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バイロイト音楽祭"

- year: 1886
  title: ベンツとダイムラーのガソリン自動車
  text: マンハイムのカール・ベンツが三輪のガソリン自動車の特許をとり（1月）、カンシュタット（シュトゥットガルト）のダイムラーとマイバッハも四輪車を完成させた。南西ドイツは自動車工業の発祥の地となった。
  polities: [baden, wurttemberg]
  importance: 2
  source:
    - "https://ja.wikipedia.org/wiki/カール・ベンツ"
    - "https://ja.wikipedia.org/wiki/ゴットリープ・ダイムラー"

- year: 1886
  date: "1886-06"
  title: ルートヴィヒ2世の廃位と死
  text: 政府は精神鑑定をもとに王を統治不能として廃位し、叔父ルイトポルトを摂政とした。王は数日後、シュタルンベルク湖で医師とともに水死体で見つかった。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ルートヴィヒ2世_(バイエルン王)"

- year: 1895
  date: "1895-11-08"
  title: レントゲンのX線発見（ヴュルツブルク）
  text: ヴュルツブルク大学の物理学者レントゲンがX線を発見した。1901年に最初のノーベル物理学賞を受けた。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヴィルヘルム・レントゲン"

- year: 1899
  title: ダルムシュタット芸術家村（マティルデンヘーエ）
  text: ヘッセン大公エルンスト・ルートヴィヒが芸術家を招いてマティルデンヘーエに芸術家村を開き、1901年の展覧会でユーゲントシュティール（アール・ヌーヴォー）の中心地となった。
  polities: [hesse_darmstadt]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Darmstädter_Künstlerkolonie"

- year: 1900
  date: "1900-07-02"
  title: ツェッペリン飛行船の初飛行
  text: ツェッペリン伯がヴュルテンベルクのボーデン湖畔（フリードリヒスハーフェン近く）で、硬式飛行船LZ1の初飛行に成功した。
  polities: [wurttemberg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フェルディナント・フォン・ツェッペリン"

- year: 1913
  date: "1913-11-05"
  title: ルートヴィヒ3世の即位
  text: 憲法を改めて摂政政治を終わらせ、摂政ルートヴィヒが、病の国王オットー1世に代わってバイエルン王となった。
  polities: [bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ルートヴィヒ3世_(バイエルン王)"

# ---------------------------------------------------------------- 1914–2025

- year: 1918
  date: "1918-11-07"
  title: バイエルン革命
  text: ミュンヘンで独立社会民主党のクルト・アイスナーが兵士・労働者を率いて共和国（バイエルン自由州）を宣言し、国王ルートヴィヒ3世は逃れた。ドイツの諸王家で最初に倒れた王政で、2日後のベルリンでの共和国宣言に先立った。
  polities: [bavaria, germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/クルト・アイスナー"

- year: 1918
  date: "1918-11"
  title: 南ドイツ諸国の君主の退位
  text: ドイツ革命の中で、ヘッセン大公（11月9日に廃位）、バーデン大公（11月22日）、ヴュルテンベルク王（11月30日）が相次いで位を去り、各国は共和政の州となった。
  polities: [wurttemberg, baden, hesse_darmstadt, germany]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ドイツ革命"

- year: 1918
  date: "1918-12"
  title: 連合国のラインラント占領
  text: 休戦協定にもとづき、ライン川左岸と右岸の橋頭堡（ケルン・コブレンツ・マインツ）を、イギリス・アメリカ・フランス・ベルギーの軍が占領した。ヴェルサイユ条約で15年までの占領と、ラインラントの永久非武装化が定められた。
  polities: [germany, france, usa, britain, belgium]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Occupation_of_the_Rhineland"

- year: 1919
  date: "1919-02-21"
  title: アイスナーの暗殺
  text: バイエルン首相アイスナーが、ミュンヘンで右翼の青年将校に射殺された。バイエルンは内乱状態となり、政府はバンベルクへ逃れた。
  polities: [germany]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/クルト・アイスナー"

- year: 1919
  date: "1919-04-07"
  title: バイエルン・レーテ共和国
  text: ミュンヘンで評議会（レーテ）政府が樹立され、のち共産党が主導したが、5月初めに中央政府の軍と義勇軍（フライコール）に鎮圧され、多くの犠牲者が出た。以後バイエルンは右翼・反共和国勢力の拠点となった。
  polities: [germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バイエルン・レーテ共和国"

- year: 1920
  date: "1920-01-10"
  title: ザール地域が国際連盟の管理下に
  text: ヴェルサイユ条約の発効により、ザール地域は15年間国際連盟の統治委員会が治め、その後の帰属を住民投票で決めることになった。炭鉱は戦争で壊された北フランスの炭鉱の償いとしてフランスの所有となった。
  polities: [saar, france, germany]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Territory_of_the_Saar_Basin"

- year: 1920
  date: "1920-02-24"
  title: ナチ党の25か条綱領
  text: ミュンヘンのビアホール、ホーフブロイハウスで、ドイツ労働者党（前年にヒトラーが入党）が25か条の綱領を発表し、まもなく国民社会主義ドイツ労働者党（ナチ党）と名を改めた。ヴェルサイユ条約の破棄や反ユダヤ主義を掲げた。
  polities: [germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/国家社会主義ドイツ労働者党"

- year: 1920
  date: "1920-04-06"
  title: フランス軍のフランクフルト占領
  text: ルール蜂起の鎮圧でドイツ軍が非武装地帯に入ったことへの対抗として、フランス軍がフランクフルト・ダルムシュタット・ハーナウなどを一時占領した（5月に撤退）。
  polities: [france, germany]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Occupation_of_the_Rhineland"

- year: 1920
  date: "1920-07-01"
  title: コーブルクのバイエルン編入
  text: 前年の住民投票でテューリンゲンではなくバイエルンへの合流を選んだコーブルク自由州が、バイエルン自由州に編入された。
  polities: [bavaria, germany]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Free_State_of_Coburg"

- year: 1923
  date: "1923-10"
  title: ライン地方の分離主義運動
  text: ルール占領とインフレの混乱の中で、フランスの後押しを受けた分離主義者が「ラインラント共和国」や「自治プファルツ」を宣言した。住民の支持は得られず、1924年2月のピルマゼンスの事件で自治プファルツも崩れた。
  polities: [germany, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Rhenish_Republic"

- year: 1923
  date: "1923-11-08"
  title: ミュンヘン一揆
  text: ヒトラーとルーデンドルフがミュンヘンのビアホールで「国民革命」を宣言し、ベルリンへの進軍を図ったが、翌日バイエルン州警察に鎮圧された。ナチ党は一時禁止された。
  polities: [germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ミュンヘン一揆"

- year: 1924
  date: "1924-04-01"
  title: ヒトラーがランツベルクに収監
  text: 一揆の裁判で禁錮5年の判決を受けたヒトラーは、ランツベルク・アム・レヒの刑務所で『わが闘争』を口述した。12月に釈放され、翌年ナチ党を再建して合法的な権力獲得の路線に転じた。
  polities: [germany]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/わが闘争"

- year: 1930
  date: "1930-06-30"
  title: ラインラント占領の終了
  text: ヤング案の受け入れと引きかえに、連合国軍が予定より5年早くラインラントから撤退した（マインツのフランス軍が最後）。非武装地帯は残った。
  polities: [germany, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Occupation_of_the_Rhineland"

- year: 1933
  date: "1933-03-22"
  title: ダッハウ強制収容所の開設
  text: ミュンヘン近郊のダッハウに、ナチス政権の最初の常設の強制収容所が開かれ、共産党員・社会民主党員など政治犯が送られた。のちの強制収容所の手本となり、1945年までに約20万人が収容され、4万人以上が死亡した。
  polities: [germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ダッハウ強制収容所"

- year: 1933
  date: "1933-03-09"
  title: 南ドイツ諸州の強制的同質化
  text: 国会選挙の後、ナチス政権は国家弁務官を送ってバイエルン・ヴュルテンベルク・バーデン・ヘッセンの州政府を奪い、州議会も解散させた。1934年1月の法律で州の自治は廃止された。
  polities: [germany]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/強制的同一化"

- year: 1934
  date: "1934-06-30"
  title: 長いナイフの夜（レーム事件）
  text: ヒトラーは突撃隊（SA）の幕僚長レームをバイエルンの保養地バート・ヴィースゼーで逮捕させ、ミュンヘンで処刑した。シュライヒャー元首相らも殺され、軍との協力が固まった。
  polities: [germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/長いナイフの夜"

- year: 1935
  date: "1935-01-13"
  title: ザールの住民投票
  text: 国際連盟の管理の終わりに行われた住民投票で、約91%がドイツへの復帰を選んだ（現状維持は約9%、フランス編入は0.4%）。3月1日にドイツに復帰し、ナチス政権の宣伝上の大きな成功となった。
  polities: [saar, germany, france]
  importance: 2
  source: "https://en.wikipedia.org/wiki/1935_Saar_status_referendum"

- year: 1935
  date: "1935-09-15"
