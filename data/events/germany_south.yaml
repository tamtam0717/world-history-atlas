# 南ドイツ（BS 担当：ヘッセン・ラインラント＝プファルツ・ザールラント・バーデン＝ヴュルテンベルク・バイエルン）の出来事（1648–1815）
# europe.yaml にある全体の出来事（ウェストファリア条約、帝国代表者会議主要決議、ライン同盟など）は重複して書かない。

- year: 1648
  title: プファルツ選帝侯の復位とバイエルンの選帝侯位確定
  text: ウェストファリア条約で、三十年戦争中に奪われたバイエルンの選帝侯位とオーバープファルツの領有が認められる一方、プファルツ選帝侯カール・ルートヴィヒには第8の選帝侯位が新設され、ライン沿いの下プファルツが返還された。
  polities: [bavaria, palatinate, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヴェストファーレン条約"

- year: 1658
  date: "1658-08-14"
  title: ライン同盟（第一次）の結成
  text: マインツ選帝侯シェーンボルンが主導し、ライン地方の諸侯がフランス（ルイ14世）・スウェーデンと結んで皇帝を牽制した。1668年に解消。
  polities: [mainz, trier, hesse_kassel, france, hre]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Rheinische_Allianz"

- year: 1663
  title: 永久帝国議会の開会
  text: レーゲンスブルクで開かれた帝国議会が閉会されないまま常設化し、1806年まで帝国の常設の議会となった（諸侯は使節を送った）。
  polities: [hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/帝国議会_(神聖ローマ帝国)"

- year: 1674
  title: テュレンヌのプファルツ荒廃
  text: オランダ戦争で、フランスのテュレンヌ元帥がプファルツに侵攻して焼き払い、ジンスハイムの戦いなどで帝国軍を破った。
  polities: [france, palatinate]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Schlacht_bei_Sinsheim"

- year: 1680
  title: ザールルイの建設とザール地方の「再統合」
  text: ルイ14世は「再統合法廷」を設けて国境地帯の領地を次々と併合し、ザール川沿いに要塞都市ザールルイを建設した。ツヴァイブリュッケン・ザールブリュッケンなどもフランス領とされた（1697年に返還、ザールルイは保持）。
  polities: [france, zweibrucken, nassau, trier]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レユニオン政策"

- year: 1685
  title: プファルツ選帝侯家（ジンメルン系）の断絶
  text: 選帝侯カール2世が死去してジンメルン系が断絶し、カトリックのノイブルク系フィリップ・ヴィルヘルムが継承。ルイ14世は弟の妃リーゼロッテ（カール2世の姉）の相続権を主張し、プファルツ継承戦争の原因となった。
  polities: [palatinate, palatinate_neuburg, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/大同盟戦争"

- year: 1689
  title: プファルツの焦土化とハイデルベルク城の破壊
  text: フランス軍が撤退にあたってプファルツを組織的に破壊し、ハイデルベルク・マンハイム・シュパイアー・ヴォルムスなどが焼かれた。ハイデルベルク城は1693年の再占領で決定的に破壊された。
  polities: [france, palatinate]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ハイデルベルク城"

- year: 1693
  title: 帝国最高法院がヴェッツラーへ移転
  text: プファルツ継承戦争でシュパイアーが破壊されたため、帝国最高法院（帝国裁判所）は帝国都市ヴェッツラーに移った（1806年まで）。青年ゲーテも1772年にここで司法修習をした。
  polities: [hre]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/帝国最高法院"

- year: 1704
  date: "1704-08-13"
  title: ブレンハイム（ヘーヒシュテット）の戦い
  text: スペイン継承戦争で、マールバラ公とオイゲン公の連合軍が、バイエルン・フランス軍をドナウ河畔で破った。バイエルンはオーストリアに占領され、選帝侯マクシミリアン2世エマヌエルは亡命した。
  polities: [bavaria, france, britain, habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ブレンハイムの戦い"

- year: 1705
  date: "1705-12-25"
  title: ゼントリングの血のクリスマス
  text: オーストリアの占領と徴兵に反発したバイエルン農民の蜂起が、ミュンヘン近郊ゼントリングで鎮圧され、多数が殺された。
  polities: [bavaria, habsburg]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Sendlinger_Mordweihnacht"

- year: 1706
  title: バイエルン・ケルン選帝侯の帝国追放
  text: 皇帝ヨーゼフ1世が、フランス側についたバイエルン選帝侯とその弟のケルン選帝侯に帝国追放を宣告した。オーバープファルツは1708年にプファルツ選帝侯に与えられたが、1714年の講和で両選帝侯は復帰した。
  polities: [bavaria, cologne, hre, palatinate]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Maximilian_II._Emanuel_(Bayern)"

- year: 1715
  date: "1715-06-17"
  title: カールスルーエの建設
  text: バーデン＝ドゥルラハ辺境伯カール3世ヴィルヘルムが、宮殿を中心に道路が放射状に広がる計画都市カールスルーエを建設し、首都を移した。
  polities: [baden]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/カールスルーエ"

- year: 1720
  title: プファルツ選帝侯がマンハイムへ遷都・ヴュルツブルクのレジデンツ着工
  text: 選帝侯カール3世フィリップがハイデルベルクからマンハイムに宮廷を移した。同じ年、ヴュルツブルク司教シェーンボルンはバルタザール・ノイマンの設計でレジデンツ（司教館、世界遺産）の建設を始めた。
  polities: [palatinate, wurzburg]
  importance: 3
  source:
    - "https://ja.wikipedia.org/wiki/マンハイム宮殿"
    - "https://ja.wikipedia.org/wiki/ヴュルツブルクのレジデンツ"

- year: 1736
  title: ハーナウ伯家の断絶
  text: ハーナウ伯家が断絶し、ハーナウ＝ミュンツェンベルク伯領はヘッセン＝カッセルが、ハーナウ＝リヒテンベルク伯領（ライン左岸・アルザス北部）はヘッセン＝ダルムシュタットが相続した。
  polities: [hesse_kassel, hesse_darmstadt]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Grafschaft_Hanau"

- year: 1742
  date: "1742-01-24"
  title: バイエルン選帝侯カール・アルブレヒトの皇帝選出（カール7世）
  text: オーストリア継承戦争のさなか、フランスの支援でフランクフルトで皇帝に選ばれた。約300年ぶりのハプスブルク家以外の皇帝だが、その間に本国バイエルンはオーストリア軍に占領された。
  polities: [bavaria, hre, habsburg, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カール7世_(神聖ローマ皇帝)"

- year: 1745
  date: "1745-04-22"
  title: フュッセンの和約
  text: カール7世の死後、子のマクシミリアン3世ヨーゼフがオーストリアと講和。オーストリア継承（ハプスブルク家の遺領）への要求を放棄し、マリア・テレジアの夫フランツの皇帝選出を支持する代わりにバイエルンを回復した。
  polities: [bavaria, habsburg, hre]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Frieden_von_Füssen"

- year: 1749
  date: "1749-08-28"
  title: ゲーテがフランクフルトで誕生
  text: のちのドイツ古典主義文学の巨匠ゲーテが帝国都市フランクフルトの裕福な市民の家に生まれた。
  polities: [frankfurt]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヨハン・ヴォルフガング・フォン・ゲーテ"

- year: 1769
  title: アンスバッハとバイロイトの統合
  text: バイロイト辺境伯家が断絶し、アンスバッハ辺境伯カール・アレクサンダーが相続。フランケンのホーエンツォレルン家領が一つになった。
  polities: [ansbach, bayreuth]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Fürstentum_Bayreuth"

- year: 1771
  title: 両バーデンの統一
  text: バーデン＝バーデン辺境伯家が断絶し、バーデン＝ドゥルラハ辺境伯カール・フリードリヒが相続。16世紀以来分かれていたバーデンが統一された。
  polities: [baden, baden_baden]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/バーデン辺境伯領"

- year: 1776
  date: "1776-05-01"
  title: バイエルン啓明結社（イルミナティ）の創設
  text: インゴルシュタット大学教授ヴァイスハウプトが啓蒙思想の秘密結社を作った。1785年にバイエルン選帝侯により禁止された。
  polities: [bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/イルミナティ"

- year: 1777
  date: "1777-12-30"
  title: バイエルン系ヴィッテルスバッハ家の断絶
  text: 選帝侯マクシミリアン3世ヨーゼフが死去し、プファルツ選帝侯カール・テオドールがバイエルンを相続した（プファルツ＝バイエルン）。皇帝ヨーゼフ2世はバイエルンの一部の獲得を図った。
  polities: [bavaria, palatinate, habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バイエルン継承戦争"

- year: 1778
  title: バイエルン継承戦争（ジャガイモ戦争）
  text: オーストリアのバイエルン進出に対し、プロイセンのフリードリヒ2世がザクセンとともに出兵。大きな戦闘のないまま、1779年のテシェン条約でオーストリアはインフィアテルだけを得た。
  polities: [bavaria, habsburg, prussia, saxony]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バイエルン継承戦争"

- year: 1782
  title: シラーの『群盗』初演とヴュルテンベルクからの逃亡
  text: カール学院出身のシラーの戯曲『群盗』がマンハイムで初演され大評判となった。執筆を禁じられたシラーはヴュルテンベルクから逃れた（シュトゥルム・ウント・ドラング）。
  polities: [wurttemberg, bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フリードリヒ・フォン・シラー"

- year: 1785
  title: 諸侯同盟（フュルステンブント）
  text: ヨーゼフ2世がバイエルンとオーストリア領ネーデルラントの交換を企てると、フリードリヒ2世はハノーファー・ザクセン・マインツなどと諸侯同盟を結んでこれを阻止した。
  polities: [prussia, habsburg, bavaria, hanover, saxony, mainz]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Fürstenbund"

- year: 1791
  date: "1791-12-02"
  title: アンスバッハ＝バイロイトのプロイセン譲渡
  text: 辺境伯カール・アレクサンダーが退位し、フランケンの両辺境伯領はプロイセン王の直轄領となった（大臣ハルデンベルクが統治）。
  polities: [ansbach, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Fürstentum_Ansbach"

- year: 1793
  date: "1793-03-18"
  title: マインツ共和国
  text: 1792年にマインツを占領したフランス軍のもとで、ドイツ人ジャコバン派がドイツ最初の共和国を宣言し、フランスへの併合を決議した。7月にプロイセン軍などがマインツを奪回して崩壊。
  polities: [mainz, france, prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マインツ共和国"

- year: 1797
  title: ラシュタット会議
  text: カンポ・フォルミオ条約を受けて、帝国とフランスがライン左岸の割譲と諸侯への補償をラシュタットで協議した（1797–99）。会議は決裂し、1799年の解散時にフランス使節が殺害された。
  polities: [hre, france, baden]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Rastatter_Kongress"

- year: 1798
  title: ライン左岸にフランスの県を設置
  text: フランスは占領したライン左岸にモン＝トネール（マインツ）、ラン＝エ＝モゼル（コブレンツ）、サール（トリーア）、ロエル（アーヘン）の4県を置き、フランスの制度を導入した。
  polities: [france, mainz, trier, palatinate]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Linkes_Rheinufer"

- year: 1799
  title: マクシミリアン・ヨーゼフのバイエルン継承とモンジュラの改革
  text: カール・テオドールが死去し、ツヴァイブリュッケン家のマクシミリアン4世ヨーゼフが継承。大臣モンジュラが修道院の廃止、官僚制・徴兵制の整備など、上からの近代化を進めた。
  polities: [bavaria, zweibrucken]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マクシミリアン・フォン・モンジュラ"

- year: 1805
  date: "1805-12-26"
  title: 南ドイツ諸邦の王国化（プレスブルク条約）
  text: ナポレオンと結んだバイエルン・ヴュルテンベルク・バーデンは、プレスブルク条約でチロル・前方オーストリア・アウクスブルクなどを獲得し、バイエルンとヴュルテンベルクは1806年1月1日に王国となった。
  polities: [bavaria, wurttemberg, baden, habsburg, france]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/プレスブルクの和約"

- year: 1806
  title: 帝国諸侯・帝国騎士の陪臣化
  text: ライン同盟規約により、ホーエンローエ、フュルステンベルク、エッティンゲン、ライニンゲンなど多数の諸侯・伯と帝国騎士が主権を失い、バイエルン・ヴュルテンベルク・バーデン・ヘッセンなどの臣下となった。帝国都市ニュルンベルクもバイエルンに併合された。
  polities: [bavaria, wurttemberg, baden, hesse_darmstadt, nassau, other_hre, nuremberg]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Mediatisierung"

- year: 1806
  date: "1806-11-01"
  title: ヘッセン＝カッセルの占領
  text: プロイセンに味方したヘッセン選帝侯ヴィルヘルム1世の領国をフランス軍が占領。選帝侯は亡命し、翌1807年に本領はヴェストファーレン王国に編入された。
  polities: [hesse_kassel, france, westphalia_kingdom]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヘッセン選帝侯国"

- year: 1808
  date: "1808-05-01"
  title: バイエルン王国の憲法
  text: モンジュラのもとで、ライン同盟諸国で最初期の成文憲法が制定され、農奴制の廃止や法の前の平等が定められた。
  polities: [bavaria]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Konstitution_für_das_Königreich_Baiern"

- year: 1810
  title: 南ドイツの領土再編（フランクフルト大公国の成立など）
  text: ダールベルクの国家がフランクフルト大公国に再編され、バイエルンはレーゲンスブルク・バイロイト・ザルツブルクを得た。バイエルンとヴュルテンベルクの国境条約でウルムなどがヴュルテンベルクに移った。
  polities: [frankfurt_gd, bavaria, wurttemberg, baden]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フランクフルト大公国"

- year: 1813
  date: "1813-10-08"
  title: リート条約（バイエルンの連合国参加）
  text: バイエルンがライプツィヒの戦いの直前にオーストリアとリート条約を結び、ライン同盟を離脱して連合国側に移った。代わりに領土の保全が約束された。ヴュルテンベルク・バーデンなども続いた。
  polities: [bavaria, habsburg, rhine_confederation, wurttemberg, baden]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Vertrag_von_Ried"

- year: 1813
  title: ヘッセン選帝侯の復帰とフランクフルト大公国の解体
  text: ライプツィヒの戦いの後、ヴェストファーレン王国が崩壊してヘッセン選帝侯がカッセルに戻った。フランクフルト大公国も解体され、ダールベルクは退位した。
  polities: [hesse_kassel, frankfurt_gd, frankfurt, westphalia_kingdom]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フランクフルト大公国"

- year: 1815
  title: ドイツ連邦議会がフランクフルトに置かれる
  text: ウィーン会議で自由都市として復活したフランクフルトが、ドイツ連邦の連邦議会（1816年開会）の所在地に決まった。ライン左岸ではプファルツ（1816年バイエルン）、ラインヘッセン（1816年ヘッセン大公国）の帰属が翌年までに決まった。
  polities: [frankfurt, german_confederation, bavaria, hesse_darmstadt]
  importance: 3
  note: 連邦規約は1815年6月8日、連邦議会の開会は1816年11月。
  source: "https://ja.wikipedia.org/wiki/ドイツ連邦"

# ---------------------------------------------------------------- 1816–1914

- year: 1816
  title: 「夏のない年」と南ドイツの飢饉
  text: 前年のタンボラ山の噴火による冷夏で、ヴュルテンベルク・バーデンなどの南西ドイツは1816–17年に深刻な飢饉となった。ロシアやアメリカへの移民が急増した。
  polities: [wurttemberg, baden, bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/夏のない年"

- year: 1817
  date: "1817-04"
  title: ビルケンフェルト侯国がオルデンブルク領に
  text: ウィーン会議の取り決めにより、ナーエ川上流のビルケンフェルト一帯がプロイセンからオルデンブルク大公国に引き渡され、その飛び地となった。
  polities: [oldenburg, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Fürstentum_Birkenfeld"

- year: 1818
  title: バイエルン・バーデンの憲法制定
  text: バイエルン（5月）とバーデン（8月）が、二院制の議会をもつ憲法を定めた。南ドイツ諸国は、プロイセン・オーストリアより早く立憲君主国となった（ヴュルテンベルク1819年、ヘッセン大公国1820年）。
  polities: [bavaria, baden, wurttemberg, hesse_darmstadt]
  importance: 2
  source:
    - "https://de.wikipedia.org/wiki/Verfassung_des_Königreichs_Bayern_(1818)"
    - "https://de.wikipedia.org/wiki/Verfassung_des_Großherzogtums_Baden"

- year: 1819
  date: "1819-03-23"
  title: マンハイムでコッツェブー暗殺
  text: ブルシェンシャフト（学生組合）の学生ザントが、保守派の劇作家コッツェブーをマンハイムで刺殺した。メッテルニヒはこれを口実に、同年9月のカールスバート決議で大学と出版への取り締まりをドイツ連邦全体に広げた。
  polities: [baden, german_confederation, habsburg]
  importance: 2
  source:
    - "https://ja.wikipedia.org/wiki/アウグスト・フォン・コツェブー"
    - "https://ja.wikipedia.org/wiki/カールスバート決議"

- year: 1825
  date: "1825-10-13"
  title: ルートヴィヒ1世の即位とミュンヘンの改造
  text: ギリシア独立運動を支持したことでも知られるルートヴィヒ1世が即位。ランツフートの大学をミュンヘンに移し（1826）、ルートヴィヒ通り、アルテ・ピナコテーク、グリュプトテークなどでミュンヘンを「イーザル河畔のアテネ」に作り変えた。
  polities: [bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ルートヴィヒ1世_(バイエルン王)"

- year: 1828
  title: 南ドイツ関税同盟とヘッセン＝プロイセン関税同盟
  text: バイエルンとヴュルテンベルクが南ドイツ関税同盟を、ヘッセン大公国がプロイセンと関税同盟を結んだ。これらが1834年のドイツ関税同盟にまとまっていく。
  polities: [bavaria, wurttemberg, hesse_darmstadt, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Süddeutscher_Zollverein"

- year: 1831
  date: "1831-01-05"
  title: ヘッセン選帝侯国の憲法
  text: 七月革命の影響でカッセルなどで騒乱が起き、選帝侯ヴィルヘルム2世は憲法を認めた。当時のドイツで最も進んだ憲法の一つとされたが、その後も選帝侯と議会の対立が続いた。
  polities: [hesse_kassel]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Kurhessische_Verfassung_von_1831"

- year: 1832
  date: "1832-05-27"
  title: ハンバッハ祭
  text: バイエルン領プファルツのハンバッハ城に約3万人が集まり、ドイツの統一と自由、民衆の主権を訴えた。黒・赤・金の旗が掲げられた最初の大集会で、連邦は集会・結社の取り締まりを強めた。
  polities: [bavaria, german_confederation]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ハンバッハ祭"

- year: 1833
  date: "1833-04-03"
  title: フランクフルト衛兵所襲撃事件
  text: 学生ら約50人が連邦議会の所在地フランクフルトで警備隊の詰所を襲い、革命を起こそうとしたが失敗した。連邦は中央調査局を設けて、運動の取り締まりを強化した。
  polities: [frankfurt, german_confederation]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Frankfurter_Wachensturm"

- year: 1834
  title: リヒテンベルク侯国のプロイセンへの売却
  text: ザクセン＝コーブルク＝ゴータ公がザール地方の飛び地リヒテンベルク侯国（ザンクト・ヴェンデル）をプロイセンに売却し、ライン州に編入された。
  polities: [saxon_duchies, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Fürstentum_Lichtenberg"

- year: 1835
  date: "1835-12-07"
  title: ドイツ最初の鉄道（ニュルンベルク–フュルト）
  text: バイエルンのニュルンベルクとフュルトの間、約6キロにドイツで最初の鉄道（ルートヴィヒ鉄道）が開通した。機関車「アドラー号」はイギリス製だった。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ルートヴィヒ鉄道"

- year: 1847
  date: "1847-09-12"
  title: オッフェンブルク集会
  text: バーデンの急進派（ヘッカー、シュトルーヴェら）がオッフェンブルクに集まり、出版の自由、人民の武装、累進課税などを求める綱領を採択した。翌年の革命の先がけとなった。
  polities: [baden]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Offenburger_Programm"

- year: 1848
  date: "1848-03-20"
  title: ルートヴィヒ1世の退位
  text: 踊り子ローラ・モンテスへの寵愛が反発を招き、三月革命の騒乱の中でバイエルン王ルートヴィヒ1世が退位した。子のマクシミリアン2世が即位した。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ローラ・モンテス"

- year: 1848
  date: "1848-04"
  title: ヘッカー蜂起
  text: 準備議会で共和政の提案が退けられたヘッカーとシュトルーヴェが、バーデン南部で共和国をめざして蜂起したが、カンデルンで連邦軍に敗れた。
  polities: [baden, german_confederation]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Heckerzug"

- year: 1848
  date: "1848-05-18"
  title: フランクフルト国民議会の開会（パウロ教会）
  text: ドイツ連邦の各国で選ばれた議員が、フランクフルトのパウロ教会に集まった。ドイツの統一と基本権を議論し、6月にはオーストリアのヨハン大公を帝国摂政に選んだ。
  polities: [german_confederation, frankfurt]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/フランクフルト国民議会"

- year: 1849
  date: "1849-05"
  title: バーデン・プファルツの蜂起（憲法闘争）
  text: プロイセン王が帝冠を拒んだ後、フランクフルト憲法の実施を求めてバーデンとバイエルン領プファルツで蜂起が起き、バーデン大公は国外に逃れた。プロイセン軍が鎮圧し、7月23日にラシュタット要塞が降伏して、ドイツの1848年革命は終わった。
  polities: [baden, bavaria, prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バーデン革命"

- year: 1850
  title: ホーエンツォレルン両侯国のプロイセン編入
  text: 革命の騒乱を受けて、ホーエンツォレルン＝ジグマリンゲンとヘヒンゲンの両侯が1849年12月の条約で領国をプロイセン王に譲り、1850年からプロイセンのホーエンツォレルン諸邦となった。
  polities: [hohenzollern, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Hohenzollernsche_Lande"

- year: 1850
  title: ヘッセン選帝侯国の憲法紛争
  text: 選帝侯フリードリヒ・ヴィルヘルムと宰相ハッセンプフルークが議会の予算拒否に対して戒厳令を出し、官吏・将校も従わなかった。連邦（オーストリア）の介入にプロイセンが反発して開戦寸前となったが、11月のオルミュッツ協定でプロイセンが譲歩した。
  polities: [hesse_kassel, prussia, habsburg, german_confederation]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Kurhessischer_Verfassungskonflikt"

- year: 1862
  title: バーデンの営業の自由とユダヤ人の解放
  text: 自由主義の内閣のもとで、ツンフト（同業組合）の制限を廃止して営業の自由を認め、ユダヤ人に完全な市民権を与えた。
  polities: [baden]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Großherzogtum_Baden"

- year: 1863
  date: "1863-08"
  title: フランクフルト諸侯会議
  text: オーストリア皇帝フランツ・ヨーゼフがドイツ連邦の改革を議論するため諸侯をフランクフルトに招いたが、ビスマルクの説得でプロイセン王が欠席し、成果なく終わった。
  polities: [german_confederation, habsburg, frankfurt, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Frankfurter_Fürstentag"

- year: 1866
  date: "1866-06-14"
  title: 連邦議会がプロイセンに対する動員を決議
  text: オーストリアの提案で、連邦議会がプロイセンに対する連邦軍の動員を決議した。プロイセンは連邦からの脱退を宣言し、普墺戦争（ドイツ戦争）が始まった。バイエルン・ヴュルテンベルク・バーデン・ヘッセン・ナッサウなど南ドイツの大半がオーストリア側についた。
  polities: [german_confederation, prussia, habsburg, bavaria, wurttemberg, baden, hesse_darmstadt, hesse_kassel, nassau]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/普墺戦争"

- year: 1866
  date: "1866-07"
  title: マイン戦役（キッシンゲンの戦いなど）
  text: プロイセンのマイン軍が、キッシンゲン（7月10日）などでバイエルン軍を、タウバービショフスハイムなどで南ドイツ諸国の連邦第8軍団を破り、フランクフルト・ヴュルツブルクへ進んだ。
  polities: [prussia, bavaria, wurttemberg, baden, hesse_darmstadt]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Mainfeldzug"

- year: 1866
  date: "1866-08"
  title: 南ドイツ諸国とプロイセンの講和・秘密攻守同盟
  text: バイエルン・ヴュルテンベルク・バーデンは賠償金を払ってプロイセンと講和し、同時に戦時には軍をプロイセン王の指揮下に置く秘密の攻守同盟を結んだ。ヘッセン大公国はヘッセン＝ホンブルクなどを割譲した。
  polities: [prussia, bavaria, wurttemberg, baden, hesse_darmstadt]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Schutz-_und_Trutzbündnis"

- year: 1868
  title: 関税議会の選挙
  text: 関税同盟の改組で、北ドイツと南ドイツの代表が集まる関税議会が設けられた。バイエルンとヴュルテンベルクの選挙ではプロイセン主導の統一に反対する派が勝ち、統一に慎重な南ドイツの空気を示した。
  polities: [bavaria, wurttemberg, baden, hesse_darmstadt, north_german_confederation]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Zollparlament"

- year: 1869
  date: "1869-09-05"
  title: ノイシュヴァンシュタイン城の着工
  text: ルートヴィヒ2世が、ワーグナーの楽劇の世界をイメージした城をフュッセン近郊で着工した。王の築城は国費を圧迫し、のちの廃位の一因となった。
  polities: [bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ノイシュヴァンシュタイン城"

- year: 1870
  date: "1870-11"
  title: 南ドイツ諸国のドイツ帝国加盟条約（11月条約）
  text: 独仏戦争の最中、ヴェルサイユでバーデン・ヘッセン（11月15日）、ヴュルテンベルク（11月25日）、バイエルン（11月23日）が北ドイツ連邦との条約に調印した。バイエルンとヴュルテンベルクは軍・郵便・鉄道などに留保権を得た。
  polities: [bavaria, wurttemberg, baden, hesse_darmstadt, north_german_confederation, german_empire]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Novemberverträge"

- year: 1870
  date: "1870-11-30"
  title: ルートヴィヒ2世の「皇帝推戴の書簡」
  text: ビスマルクの求めで、バイエルン王ルートヴィヒ2世がドイツ諸侯を代表してプロイセン王に皇帝の位を申し出る書簡を送った。見返りに王はひそかに年金を受けた。
  polities: [bavaria, prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Kaiserbrief"

- year: 1876
  date: "1876-08-13"
  title: 第1回バイロイト音楽祭
  text: ルートヴィヒ2世の援助で建てられたバイロイト祝祭劇場で、ワーグナーの『ニーベルングの指環』が初めて全曲上演された。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バイロイト音楽祭"

- year: 1886
  title: ベンツとダイムラーのガソリン自動車
  text: マンハイムのカール・ベンツが三輪のガソリン自動車の特許をとり（1月）、カンシュタット（シュトゥットガルト）のダイムラーとマイバッハも四輪車を完成させた。南西ドイツは自動車工業の発祥の地となった。
  polities: [baden, wurttemberg]
  importance: 2
  source:
    - "https://ja.wikipedia.org/wiki/カール・ベンツ"
    - "https://ja.wikipedia.org/wiki/ゴットリープ・ダイムラー"

- year: 1886
  date: "1886-06"
  title: ルートヴィヒ2世の廃位と死
  text: 政府は精神鑑定をもとに王を統治不能として廃位し、叔父ルイトポルトを摂政とした。王は数日後、シュタルンベルク湖で医師とともに水死体で見つかった。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ルートヴィヒ2世_(バイエルン王)"

- year: 1895
  date: "1895-11-08"
  title: レントゲンのX線発見（ヴュルツブルク）
  text: ヴュルツブルク大学の物理学者レントゲンがX線を発見した。1901年に最初のノーベル物理学賞を受けた。
  polities: [bavaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヴィルヘルム・レントゲン"

- year: 1899
  title: ダルムシュタット芸術家村（マティルデンヘーエ）
  text: ヘッセン大公エルンスト・ルートヴィヒが芸術家を招いてマティルデンヘーエに芸術家村を開き、1901年の展覧会でユーゲントシュティール（アール・ヌーヴォー）の中心地となった。
  polities: [hesse_darmstadt]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Darmstädter_Künstlerkolonie"

- year: 1900
  date: "1900-07-02"
  title: ツェッペリン飛行船の初飛行
  text: ツェッペリン伯がヴュルテンベルクのボーデン湖畔（フリードリヒスハーフェン近く）で、硬式飛行船LZ1の初飛行に成功した。
  polities: [wurttemberg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フェルディナント・フォン・ツェッペリン"

- year: 1913
  date: "1913-11-05"
  title: ルートヴィヒ3世の即位
  text: 憲法を改めて摂政政治を終わらせ、摂政ルートヴィヒが、病の国王オットー1世に代わってバイエルン王となった。
  polities: [bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ルートヴィヒ3世_(バイエルン王)"
