# A3 メキシコ・中米・カリブの出来事（1648–2025）
# 他のファイルにあるもの（重複させない）：モンロー宣言（1823）とキューバ危機（1962）は europe.yaml、
# フランスのメキシコ出兵（1861）と米西戦争（1898）は west.yaml。
# アメリカ＝メキシコ戦争の開戦・グアダルーペ・イダルゴ条約・テキサス独立・ガズデン購入はアメリカ合衆国側の出来事として A1 に任せた（ここではメキシコ市の占領だけ）。

- year: 1648
  date: "1648-03-23"
  title: コンコルディア条約（サン・マルタン島の分割）
  text: スペインが去ったサン・マルタン島を、フランスとオランダが南北に分けて治めることを取り決めた。今も島は仏領と蘭領に分かれている。
  polities: [france, netherlands]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/コンコルディア条約"
- year: 1655
  title: イギリスがジャマイカを奪う
  text: クロムウェルの「西方計画」で送られた遠征軍がイスパニョーラ島の攻略に失敗し、代わりにスペイン領ジャマイカを占領した。1670年のマドリード条約でスペインも領有を認め、ジャマイカはイギリスの砂糖植民地の中心となった。
  polities: [britain, spain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ジャマイカの歴史"
- year: 1654
  title: クールラント公国のトバゴ植民
  text: バルト海の小国クールラント公国のヤーコプ公がトバゴ島に入植者を送り、「新クールラント」の砦を築いた。1659年にオランダ人に奪われた。
  polities: [courland, netherlands]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Couronian_colonization"
- year: 1671
  title: モーガンのパナマ襲撃
  text: ジャマイカを根拠地とするイギリスの私掠船長（海賊）ヘンリー・モーガンが地峡を越えてパナマ市を襲い、町は焼け落ちた。カリブ海では17世紀後半に海賊（バッカニア）が全盛期を迎えた。
  polities: [britain, spain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヘンリー・モーガン"
- year: 1697
  title: ライスワイク条約でサン・ドマングがフランス領に
  text: スペインはイスパニョーラ島の西部3分の1をフランス領と認めた。サン・ドマングはアフリカ人奴隷による砂糖・コーヒーの大農園で、18世紀には世界でいちばん豊かな植民地となった。
  polities: [france, spain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Saint-Domingue"
- year: 1697
  date: "1697-03-13"
  title: イツァ王国の滅亡
  text: スペイン軍がペテン湖の島の都ノフペテンを攻め落とした。スペインの征服を逃れていた最後のマヤ人の独立王国が滅びた。
  polities: [itza, spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Spanish_conquest_of_Petén"
- year: 1698
  title: スコットランドのダリエン計画
  text: スコットランドの会社がパナマ地峡のダリエンに植民地カレドニアを築いたが、病気とスペインの攻撃で失敗した（1700）。国の富の多くを失ったスコットランドは、1707年にイングランドとの合同に向かった。
  polities: [scotland, spain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ダリエン計画"
- year: 1712
  title: チアパスのツェルタル人の反乱
  text: 聖母の出現を信じたマヤ系のツェルタル人などがスペイン人の支配と重い貢納に反乱を起こしたが、グアテマラ総督の軍に鎮圧された。
  polities: [spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Tzeltal_Rebellion_of_1712"
- year: 1739
  title: ジェンキンスの耳の戦争
  text: スペインの沿岸警備隊に耳を切られたというイギリス船長の訴えをきっかけに、密貿易をめぐって英西が戦った。イギリスのヴァーノン提督がパナマのポルトベロを落としたが、カルタヘナの攻撃は失敗した。オーストリア継承戦争へと続いた。
  polities: [britain, spain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ジェンキンスの耳の戦争"
- year: 1762
  date: "1762-08-13"
  title: イギリス軍のハバナ占領
  text: 七年戦争でイギリス軍がスペインのカリブ海の要塞ハバナを落とした。翌年のパリ条約でハバナは返されたが、スペインは代わりにフロリダをイギリスに譲った。
  polities: [britain, spain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Siege_of_Havana"
- year: 1784
  title: サン・バルテルミー島がスウェーデン領に
  text: フランスはヨーテボリでの交易の権利と引き換えに、小さなサン・バルテルミー島をスウェーデンに譲った。スウェーデン唯一の西インドの植民地で、1878年にフランスに戻った。
  polities: [sweden, france]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/サン・バルテルミー島"
- year: 1791
  date: "1791-08-22"
  title: ハイチ革命はじまる
  text: フランス革命の人権宣言の影響のもと、サン・ドマング北部の大農園で奴隷が一斉に蜂起した。トゥサン・ルヴェルチュールが指導者として頭角を現し、1793–94年に奴隷制が廃止された。
  polities: [france]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ハイチ革命"
- year: 1797
  title: ガリフナのロアタン島への追放
  text: 第2次カリブ戦争に敗れたセントビンセント島の「黒いカリブ（ガリフナ）」約2千人が、イギリスによってホンジュラス沖のロアタン島に移された。ガリフナはその後、中米のカリブ海岸に広がった。
  polities: [britain, kalinago]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ガリフナ"
- year: 1798
  date: "1798-09-10"
  title: セント・ジョージズ・キーの戦い
  text: ベリーズのイギリス人入植者と奴隷がスペイン艦隊の攻撃を退けた。ベリーズがイギリス領として残るきっかけとされる。
  polities: [britain, spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_St._George's_Caye"
- year: 1801
  title: トゥサン・ルヴェルチュールの全島支配と憲法
  text: トゥサンはスペイン領だった東部にも進軍して島全体を押さえ、自らを終身総督とする憲法を定めた。名目上はフランスの植民地のままだった。
  polities: [france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/トゥーサン・ルーヴェルチュール"
- year: 1802
  title: ルクレールの遠征とトゥサンの逮捕
  text: ナポレオンは奴隷制の復活をねらって義弟ルクレールの大軍を送った。トゥサンはだまされて捕らえられ、フランスの獄中で死んだ（1803）。しかし黄熱病と黒人軍の抵抗でフランス軍は壊滅し、1803年11月のヴェルティエールの戦いで敗れて撤退した。
  polities: [france, haiti]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ハイチ革命"
- year: 1804
  date: "1804-01-01"
  title: ハイチの独立
  text: デサリーヌがハイチの独立を宣言した。奴隷の反乱から生まれた世界で最初の黒人の共和国で、ラテンアメリカで最初の独立国。フランスがアメリカ大陸の植民地帝国をあきらめ、ルイジアナをアメリカ合衆国に売る一因ともなった。
  polities: [haiti, france]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ハイチ"
- year: 1806
  date: "1806-10-17"
  title: デサリーヌの暗殺とハイチの南北分裂
  text: 皇帝デサリーヌが暗殺され、北部のクリストフ（1811年に国王アンリ1世）と南部の共和国のペシオンが対立して、国は1820年まで二つに分かれた。
  polities: [haiti, haiti_north]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Haiti"
- year: 1810
  date: "1810-09-16"
  title: イダルゴの蜂起（ドローレスの叫び）
  text: ドローレス村のクリオーリョの司祭イダルゴが、先住民・メスティーソの農民を率いてスペインの支配に立ち上がった。蜂起は鎮圧されイダルゴは処刑された（1811）が、9月16日は今もメキシコの独立記念日である。
  polities: [spain, mexico]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ミゲル・イダルゴ"
- year: 1815
  date: "1815-12-22"
  title: モレーロスの処刑
  text: イダルゴの後を継いだ司祭モレーロスは、独立と奴隷制・身分制の廃止を宣言して南部で戦ったが、捕らえられ処刑された。独立運動はゲレロらのゲリラ戦として続いた。
  polities: [spain, mexico]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ホセ・マリア・モレーロス"
- year: 1816
  title: ハイチのペシオンがボリバルを援助
  text: 亡命中のシモン・ボリバルは、ハイチの大統領ペシオンから武器と兵の援助を受け、奴隷解放を約束して南米の独立戦争を再開した。
  polities: [haiti]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/アレクサンドル・ペション"
- year: 1821
  date: "1821-09-27"
  title: メキシコの独立
  text: スペインの自由主義革命に反発した王党派の軍人イトゥルビデが、独立派のゲレロと結んでイグアラ綱領（独立・カトリック・人種の平等）をかかげた。コルドバ条約を経てメキシコ市に入り、独立を果たした。翌年イトゥルビデは皇帝に即位した。
  polities: [mexico, spain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/メキシコ独立革命"
- year: 1821
  date: "1821-09-15"
  title: 中米の独立
  text: グアテマラ総督領（今の中米5か国とチアパス）がスペインからの独立を宣言した。翌年1月にメキシコ帝国に併合された。
  polities: [central_america, spain, mexico]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/中央アメリカの独立"
- year: 1822
  date: "1822-02-09"
  title: ハイチがイスパニョーラ島東部を統合
  text: 前年12月にスペインからの独立を宣言したばかりのサント・ドミンゴに、ボワイエ大統領のハイチ軍が進駐し、島全体を統一した。東部では奴隷制が廃止された。統一は1844年まで続いた。
  polities: [haiti, dominican_republic]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Haitian_occupation_of_Santo_Domingo"
- year: 1823
  date: "1823-07-01"
  title: 中米連合州の成立
  text: イトゥルビデの帝政が倒れると、中米5州はメキシコを離れて中米連合州（翌年から中米連邦共和国）を作った。チアパスはメキシコに残った。
  polities: [central_america, mexico]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/中央アメリカ連邦"
- year: 1825
  date: "1825-04-17"
  title: フランスがハイチの独立を承認
  text: 軍艦を背にしたフランスの要求に応じ、ハイチは旧農園主への「賠償金」1億5千万フラン（のち9千万に減額）を払うことを約束して独立を認めさせた。借金の返済は20世紀半ばまで続き、ハイチの発展を妨げた。
  polities: [haiti, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Haiti_indemnity_controversy"
- year: 1838
  title: 中米連邦の解体
  text: 自由派のモラサン大統領に、教会と結んだ保守派や先住民の農民（グアテマラのカレラ）が反乱を起こした。1838年にニカラグア・ホンジュラス・コスタリカが離脱し、1839年にグアテマラも離れて、連邦は解体した。
  polities: [central_america, guatemala, honduras, nicaragua, costa_rica, el_salvador]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/中央アメリカ連邦"
- year: 1841
  title: ユカタン共和国の分離
  text: メキシコの中央集権体制に反発したユカタン半島が独立を宣言した。1843年にいったん戻ったが1846年に再び離れ、カスタ戦争で追いつめられた1848年に復帰した。
  polities: [yucatan, mexico]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ユカタン共和国"
- year: 1844
  date: "1844-02-27"
  title: ドミニカ共和国の独立
  text: ドゥアルテらの秘密結社「ラ・トリニタリア」の流れをくむ人々がサント・ドミンゴで蜂起し、ハイチからの独立を宣言した。
  polities: [dominican_republic, haiti]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ドミニカ共和国の歴史"
- year: 1847
  date: "1847-09-14"
  title: アメリカ軍のメキシコ市占領
  text: アメリカ＝メキシコ戦争で、ベラクルスに上陸したスコット将軍の軍がメキシコ市を落とした。チャプルテペク城を守って死んだ士官学校生は「少年英雄（ニーニョス・エロエス）」として記憶されている。占領は翌年の講和まで続いた。
  polities: [usa, mexico]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/米墨戦争"
- year: 1847
  title: ユカタンのカスタ戦争
  text: ユカタン半島のマヤ人の農民が、土地を奪い重い税をかける白人（クリオーリョ）に対して蜂起した。1848年には半島の大部分を押さえたが押し戻され、東部の密林にチャン・サンタ・クルスの国を作って1901年まで抵抗した。
  polities: [yucatan, mexico, maya_independent]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カスタ戦争"
- year: 1850
  title: クレイトン＝ブルワー条約
  text: 中米の運河の建設をめぐって、アメリカとイギリスが、どちらも運河を独占せず中米に植民地を作らないことを約束した。1901年のヘイ＝ポンスフォート条約で廃止され、アメリカが単独で運河を建設できるようになった。
  polities: [usa, britain, nicaragua]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/クレイトン＝ブルワー条約"
- year: 1855
  title: アユトラ革命とレフォルマ
  text: アルバレス・コモンフォルトらの自由主義者がサンタ・アナの独裁を倒した。フアレス法・レルド法で教会と軍の特権や教会の土地を解体し、1857年に自由主義の憲法を定めた。
  polities: [mexico]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レフォルマ"
- year: 1856
  title: ウォーカーのニカラグア支配
  text: アメリカ人の傭兵（フィリバスター）ウィリアム・ウォーカーがニカラグアの内戦に乗じて大統領を名乗り、奴隷制を復活させた。コスタリカなど中米諸国の連合軍に敗れ、1860年にホンジュラスで処刑された。
  polities: [nicaragua, costa_rica]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ウィリアム・ウォーカー"
- year: 1858
  title: レフォルマ戦争
  text: 1857年憲法をめぐり、フアレスの自由派（ベラクルスに政府）と、教会・軍の保守派（メキシコ市に政府）が3年にわたって戦った。1861年に自由派が勝ったが、国家財政は破綻し、外国の干渉を招いた。
  polities: [mexico]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レフォルマ戦争"
- year: 1861
  title: スペインのドミニカ再併合
  text: ハイチの侵攻をおそれたサンタナ大統領の求めで、スペインがドミニカを再び植民地とした。1863年に再独立戦争（王政復古戦争）が起こり、スペインは1865年に撤退した。
  polities: [spain, dominican_republic]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Dominican_Restoration_War"
- year: 1864
  title: マクシミリアンのメキシコ皇帝即位
  text: フランス軍が押さえたメキシコ市に、保守派が招いたハプスブルク家のマクシミリアンが皇帝として迎えられた。自由主義的な政策をとって保守派とも溝ができ、フアレスの共和派は北部で抵抗を続けた。
  polities: [second_mexican_empire, france, mexico]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マクシミリアン_(メキシコ皇帝)"
- year: 1865
  date: "1865-10-11"
  title: モラント・ベイの反乱
  text: ジャマイカの解放奴隷の農民が土地と裁判の不正に抗議して蜂起し、総督エアの軍が数百人を処刑して鎮圧した。本国で論争を呼び、ジャマイカは議会を失って直轄植民地となった。
  polities: [britain, jamaica]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Morant_Bay_rebellion"
- year: 1867
  date: "1867-06-19"
  title: マクシミリアンの処刑と共和政の回復
  text: 南北戦争を終えたアメリカの圧力でフランス軍が撤退すると帝国は崩れ、マクシミリアンはケレタロで捕らえられ銃殺された。フアレスが首都に戻り、共和政が回復した（「復古共和政」）。
  polities: [second_mexican_empire, mexico, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/メキシコ第二帝政"
- year: 1868
  date: "1868-10-10"
  title: キューバの十年戦争
  text: 東部の農園主セスペデスが奴隷を解放して独立を宣言し、スペインと10年にわたって戦った（1868–78）。独立はならなかったが、1886年のキューバの奴隷制廃止へつながった。
  polities: [spain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/十年戦争"
- year: 1876
  title: ディアスの独裁はじまる
  text: フアレス派の将軍ポルフィリオ・ディアスがクーデタで政権を握り、1911年まで（1880–84年を除く）大統領として独裁した。「秩序と進歩」をかかげて外国資本による鉄道・鉱山開発を進めた。
  polities: [mexico]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ポルフィリオ・ディアス"
- year: 1881
  title: レセップスのパナマ運河着工
  text: スエズ運河を作ったレセップスのフランスの会社がパナマ運河の建設を始めたが、黄熱病・マラリアと工事の難しさで1889年に破産した（パナマ事件）。
  polities: [france, colombia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/パナマ運河"
- year: 1886
  title: キューバの奴隷制廃止
