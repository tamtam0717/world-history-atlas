# A2 カナダ・アラスカ（ヌーヴェル・フランス、英領北アメリカ、ルパートランド、ロシア領アメリカ、ニューファンドランド・サンピエール・バミューダを含む）の出来事。
# 植民地の時期の出来事は宗主国（france・britain・russia）を polities に書く。

# ---------------------------------------------------------------- ヌーヴェル・フランスとアカディア（1648–1763）
- year: 1649
  title: イロコイがヒューロン連合を滅ぼす
  text: 毛皮交易をめぐるビーバー戦争で、イロコイ連邦がヒューロン（ウェンダット）の村々を攻めた。フランスの同盟者だったヒューロン連合は崩壊し、イエズス会のブレブフらも殺された。
  polities: [huron, iroquois, france]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Huron%E2%80%93Iroquois_conflicts"
- year: 1654
  title: イングランドがアカディアを占領
  text: ニューイングランドの遠征隊がポール・ロワイヤルなどアカディアの砦を奪った。ブレダ条約（1667）でフランスに返され、1670年に引き渡された。
  polities: [britain, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Acadia"
- year: 1663
  title: ヌーヴェル・フランスが国王直轄の植民地に
  text: ルイ14世と財務総監コルベールは、会社に任せていたヌーヴェル・フランスを国王直轄の植民地とし、総督と地方長官（アンタンダン）を置いた。地方長官タロンのもとで入植者が増え、「王の娘たち」と呼ばれる女性も送られた。
  polities: [france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヌーベルフランス"
- year: 1665
  title: カリニャン＝サリエール連隊の派遣
  text: フランス本国の正規軍がケベックに着き、リシュリュー川に砦を築いてイロコイ（モホーク）を攻めた。1667年に和平が結ばれ、セントローレンス川沿いの入植が進んだ。
  polities: [france, iroquois]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Carignan-Sali%C3%A8res_Regiment"
- year: 1670
  date: "1670-05-02"
  title: ハドソン湾会社の設立
  text: イングランド王チャールズ2世が特許状を与え、ハドソン湾に注ぐ川の流域（ルパートランド）の交易の独占権と統治権を認めた。会社は湾岸に交易所を築き、先住民から毛皮を買い集めた。
  polities: [britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ハドソン湾会社"
- year: 1686
  title: フランスがジェームズ湾の交易所を奪う
  text: ド・トロワとイベルヴィルの遠征隊が陸路でジェームズ湾に達し、ハドソン湾会社のムース砦などを奪った。以後ハドソン湾をめぐる英仏の争いが続いた（1697年にはイベルヴィルがヨーク・ファクトリーを奪う）。
  polities: [france, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Hudson_Bay_expedition_(1686)"
- year: 1690
  title: フィップスのケベック攻撃
  text: ウィリアム王戦争で、ニューイングランドのフィップスがポール・ロワイヤルを落とした後ケベックを攻めたが、総督フロントナックに退けられた。
  polities: [britain, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Quebec_(1690)"
- year: 1701
  date: "1701-08-04"
  title: モントリオールの大講和
  text: フランスと、イロコイ連邦・五大湖地方の約40の先住民集団が和平を結び、ビーバー戦争が終わった。イロコイは英仏の争いで中立を約束した。
  polities: [france, iroquois]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Great_Peace_of_Montreal"
- year: 1713
  title: ユトレヒト条約でアカディア・ニューファンドランド・ハドソン湾がイギリス領に
  text: スペイン継承戦争（北アメリカではアン女王戦争）の講和で、フランスはアカディア（ノヴァスコシア）・ニューファンドランド・ハドソン湾地方をイギリスに譲った。フランスはケープブレトン島（イル・ロワイヤル）とセントローレンス川流域を保ち、ルイブール要塞を築いた。
  polities: [britain, france]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ユトレヒト条約"
- year: 1745
  title: ルイブールの陥落
  text: ジョージ王戦争（オーストリア継承戦争）で、ニューイングランドの民兵がフランスのルイブール要塞を落とした。アーヘンの和約（1748）でフランスに返され、ニューイングランドの人々は不満を持った。
  polities: [britain, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siege_of_Louisbourg_(1745)"
- year: 1749
  title: ハリファックスの建設
  text: イギリスはルイブールに対抗するため、ノヴァスコシアにハリファックスを築き、プロテスタントの移民を入植させた。
  polities: [britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ハリファックス_(ノバスコシア州)"
- year: 1755
  title: アカディア人の追放
  text: 英仏の対立が深まる中、ノヴァスコシアの総督は、無条件の忠誠の誓いを拒むフランス系のアカディア人を強制的に追放した（1755–64、グラン・デランジュマン）。1万人以上が土地を失い、各地に散らされた。一部はルイジアナに移り住んだ（ケイジャン）。
  polities: [britain, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アカディア人の追放"
- year: 1758
  title: ルイブールの再陥落
  text: フレンチ＝インディアン戦争で、アマースト・ウルフのイギリス軍がルイブールを落とし、セントローレンス川への道が開かれた。
  polities: [britain, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siege_of_Louisbourg_(1758)"
- year: 1759
  date: "1759-09-13"
  title: アブラハム平原の戦い（ケベックの陥落）
  text: ウルフのイギリス軍がケベックの郊外でモンカルムのフランス軍を破り、ケベックが降伏した。両将軍とも戦死した。フレンチ＝インディアン戦争の勝敗を決めた戦い。
  polities: [britain, france]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アブラハム平原の戦い"
- year: 1760
  date: "1760-09-08"
  title: モントリオールの降伏
  text: 総督ヴォードルイユがモントリオールでイギリス軍に降伏し、カナダ全体がイギリスの軍政下に入った。
  polities: [britain, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/モントリオールの降伏"
- year: 1763
  title: パリ条約でヌーヴェル・フランスがイギリス領に
  text: 七年戦争の講和で、フランスはカナダとミシシッピ川以東のルイジアナをイギリスに譲り、北アメリカ大陸の領土を失った（サンピエール島・ミクロン島だけが漁業の基地として残った）。国王宣言（1763）でケベック植民地が置かれ、アパラチア山脈より西は先住民の土地として入植が禁じられた。
  polities: [britain, france]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/パリ条約_(1763年)"

# ---------------------------------------------------------------- 英領北アメリカ（1763–1867）
- year: 1774
  title: ケベック法
  text: イギリスはケベック植民地でカトリックの信仰とフランス民法を認め、領域を五大湖・オハイオ川まで広げた。フランス系住民をつなぎとめる政策だったが、13植民地は「耐えがたい諸法」の一つとして反発した。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ケベック法"
- year: 1775
  title: 大陸軍のケベック侵攻
  text: アメリカ独立戦争の初めに、大陸軍がカナダに攻め込みモントリオールを占領したが、12月のケベック攻撃に失敗し、翌年撤退した。フランス系住民の多くは中立を保った。
  polities: [britain, usa]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Invasion_of_Quebec_(1775)"
- year: 1783
  title: 王党派（ロイヤリスト）のカナダ移住
  text: アメリカ独立戦争でイギリス側についた王党派約4–5万人が、ノヴァスコシア・ケベック（のちのオンタリオ）に移り住んだ。これをきっかけにニューブランズウィック植民地（1784）が分かれ、のちのアッパー・カナダの基礎ができた。イロコイのモホークもブラントに率いられてグランド川流域に移った。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/王党派_(アメリカ独立戦争)"
- year: 1784
  title: ロシアがコディアク島に入植
  text: 毛皮商人シェリホフがアラスカのコディアク島に、北アメリカで最初のロシアの恒久的な入植地を築いた。ラッコの毛皮を求めて、アレウトの人々を使役した。
  polities: [russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Russian_America"
- year: 1789
  title: ヌートカ湾事件
  text: スペインがヴァンクーヴァー島のヌートカ湾に砦を築き、イギリスの商船を拿捕した。英西は戦争寸前となったが、ヌートカ協定（1790）でスペインは北西海岸の独占を放棄した。
  polities: [spain, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Nootka_Crisis"
- year: 1791
  title: 1791年の立憲法（カナダ法）
  text: イギリスはケベック植民地を、英語系の王党派が多いアッパー・カナダ（のちのオンタリオ）と、フランス系が多いローワー・カナダ（のちのケベック）に分け、それぞれに議会を置いた。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/1791年憲法法"
- year: 1793
  title: マッケンジーが陸路で太平洋に到達
  text: 北西会社のアレグザンダー・マッケンジーが、ロッキー山脈を越えて北アメリカを横断し、太平洋岸に達した（メキシコ以北で最初の大陸横断）。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Alexander_Mackenzie_(explorer)"
- year: 1799
  title: 露米会社の設立
  text: パーヴェル1世の勅許で露米会社が設立され、ロシア領アメリカの独占権を得た。支配人バラノフはシトカ（ノヴォアルハンゲリスク）を築き、1804年にトリンギットを破って拠点とした。会社はカリフォルニアのフォート・ロス（1812）にも進出した。
  polities: [russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/露米会社"
- year: 1812
  title: アメリカ＝イギリス戦争（米英戦争）とカナダ侵攻
  text: アメリカ＝イギリス戦争（米英戦争）で、アメリカ軍がアッパー・カナダに攻め込んだが、ブロック将軍と先住民のテカムセがデトロイトを落とすなどして退けた。1813年にはアメリカ軍がヨーク（トロント）を焼いた。ガン条約（1814）で戦前の国境に戻った。
  polities: [britain, usa]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/米英戦争"
- year: 1812
  title: レッド・リヴァー植民地の建設
  text: ハドソン湾会社の大株主セルカーク卿が、スコットランドの移民をレッド川流域（のちのウィニペグ）に入植させた。毛皮交易を脅かされた北西会社やメティと対立し、1816年にセブン・オークスの戦いが起きた。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Red_River_Colony"
- year: 1818
  title: 1818年の英米協定
  text: 五大湖の西からロッキー山脈までの英米の国境を北緯49度と決め、ロッキー山脈の西のオレゴン・カントリーは両国の共同占有とした。前年のラッシュ＝バゴット協定で五大湖の非武装化も決まった。
  polities: [britain, usa]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_1818"
- year: 1821
  title: ハドソン湾会社と北西会社の合併
  text: 毛皮交易で激しく争った2社が合併し、ハドソン湾会社がルパートランドから太平洋岸までの交易を独占した。
  polities: [britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ハドソン湾会社"
- year: 1825
  title: 英露条約でアラスカの境が決まる
  text: イギリスとロシアが、ロシア領アメリカの南の境を北緯54度40分、東の境を西経141度と定めた（前年に露米協定）。のちのアラスカとカナダの境のもととなった。
  polities: [russia, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Anglo-Russian_Convention_of_1825"
- year: 1837
  title: アッパー・カナダとローワー・カナダの反乱
  text: 寡頭支配に反発して、ローワー・カナダではパピノーの愛国派、アッパー・カナダではマッケンジーの改革派が武装蜂起したが、鎮圧された。
  polities: [britain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Rebellions_of_1837%E2%80%931838"
- year: 1839
  title: ダラム報告
  text: 反乱の後に派遣されたダラム卿が、両カナダの統合と責任政府（議会の多数派による内閣）の導入を勧めた。フランス系住民の同化も唱えたため、反発を招いた。
  polities: [britain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Report_on_the_Affairs_of_British_North_America"
- year: 1841
  title: カナダ連合植民地の成立
  text: 連合法（1840）が施行され、アッパー・カナダとローワー・カナダが一つの植民地（カナダ州）となった。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/連合法_(1840年)"
- year: 1848
  title: 責任政府の実現
  text: ノヴァスコシアとカナダ連合植民地で、議会の多数派が内閣をつくる責任政府が認められ、内政の自治が実現した（カナダではラフォンテーヌとボールドウィンの内閣）。
  polities: [britain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Responsible_government_in_Canada"
- year: 1858
  title: フレーザー川のゴールドラッシュ
  text: 金の発見でアメリカなどから約3万人が押し寄せ、イギリスは本土にブリティッシュコロンビア植民地を置いた（1866年にヴァンクーヴァー島植民地と合同）。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Fraser_Canyon_Gold_Rush"
- year: 1864
  title: シャーロットタウン会議・ケベック会議
  text: 英領北アメリカの植民地の代表が集まり、連邦の結成を話し合った。ケベック会議の72か条の決議が、のちの英領北アメリカ法のもととなった。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Quebec_Conference,_1864"

# ---------------------------------------------------------------- カナダ連邦・自治領（1867–1945）
- year: 1867
  date: "1867-07-01"
  title: カナダ連邦（自治領）の成立
  text: 英領北アメリカ法により、オンタリオ・ケベック・ノヴァスコシア・ニューブランズウィックの4州からなるカナダ連邦が成立した。イギリス帝国で最初の自治領で、首相はマクドナルド。南北戦争後のアメリカの膨張への警戒が背景にあった。
  polities: [canada, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/カナダ連邦"
- year: 1869
  title: レッド・リヴァーの反乱
  text: ルパートランドのカナダへの移管に反発したメティが、ルイ・リエルを指導者に臨時政府をつくった。交渉の結果、1870年にマニトバ州が置かれた。
  polities: [red_river, canada]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レッド・リヴァーの反乱"
- year: 1870
  title: ルパートランドのカナダ移管・マニトバ州の成立
  text: ハドソン湾会社がルパートランドをイギリス政府に返し、カナダに移された。カナダの面積は数倍になり、ノースウェスト準州が置かれた。
  polities: [canada]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ルパート・ランド"
- year: 1871
  title: ブリティッシュコロンビアのカナダ加盟
  text: 10年以内に大陸横断鉄道を建設することを条件に、ブリティッシュコロンビアがカナダに加わり、カナダは大西洋から太平洋に広がった。
  polities: [canada]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブリティッシュコロンビア州"
- year: 1873
  title: プリンスエドワード島の加盟・北西騎馬警察の創設
  text: プリンスエドワード島がカナダに加わった。西部の治安と主権を守るため北西騎馬警察（のちの王立カナダ騎馬警察）がつくられ、翌年に平原へ進出した。
  polities: [canada]
  importance: 3
  source: "https://en.wikipedia.org/wiki/North-West_Mounted_Police"
- year: 1876
  title: インディアン法
  text: 先住民（ファースト・ネーション）の身分・保留地・自治を政府が管理する法律が定められた。同化政策の柱となり、のちに寄宿学校への通学も義務づけられた。
  polities: [canada]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Indian_Act"
- year: 1880
  title: 北極諸島のカナダ移管
  text: イギリスが北アメリカの北極諸島の権利をカナダに移した。
  polities: [canada, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Arctic_Archipelago"
- year: 1885
  title: 北西部の反乱とカナダ太平洋鉄道の完成
  text: サスカチュワンでメティと一部のクリーがリエルのもとで蜂起したが、鉄道で送られた軍に鎮圧され、リエルは処刑された。11月にはカナダ太平洋鉄道（大陸横断鉄道）が完成した。リエルの処刑はフランス系住民の強い反発を招いた。
  polities: [canada]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カナダ太平洋鉄道"
- year: 1896
  title: クロンダイクのゴールドラッシュ
  text: ユーコンのクロンダイク川で金が見つかり、10万人ともいわれる人々が北をめざした。1898年にユーコン準州が置かれた。アラスカでもノーム（1899）などでゴールドラッシュが続いた。
  polities: [canada, usa]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/クロンダイク・ゴールドラッシュ"
- year: 1903
  title: アラスカ境界紛争の決着
