  text: "隆慶帝が月港（漳州）からの民間の海外渡航・貿易を認めた（日本への渡航は禁止のまま）。中国の生糸・陶磁器がマニラ経由で新大陸の銀と交換された。"
  polities: [ming]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/海禁"
