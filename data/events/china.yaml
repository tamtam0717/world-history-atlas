  text: "清に降った父の鄭芝竜と別れた鄭成功（国姓爺）が、南澳・烈嶼（小金門）で兵を挙げ、清への抵抗を始めた。廈門は一族の鄭彩・鄭聯が押さえており、鄭成功が廈門を奪って本拠とするのは1650年。"
  polities: [tungning, southern_ming]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/鄭成功"
  at: [118.1, 24.45]
- year: 1647
