  text: "戚継光（戚家軍）・兪大猷が福建の平海衛などで倭寇を破り、1565年ごろまでに沿岸の倭寇はほぼ収まった。"
  polities: [ming]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/戚継光"
  at: [119.1, 25.3]
- year: 1567
