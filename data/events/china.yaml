  text: "李自成が潼関で孫伝庭の明軍を破り、西安を落とした。翌1644年の元日（旧暦。西暦では2月）、西安で国号を大順と定めた。同じ年、張献忠は武昌を落として大西王を名のった。"
  polities: [shun, daxi, ming]
  importance: 2
