# A5 ブラジル・南米南部の出来事（1648–2025）
# data/events/west.yaml にあるもの（ポルトガル王室のブラジル移転 1807、ブラジルの独立 1822、フォークランド戦争 1982）は重複して書かない。

# ---------------------------------------------------------------- 植民地時代
- year: 1654
  date: "1654-01-26"
  title: オランダ領ブラジルの終わり
  text: 1645年からのポルトガル系住民の反乱（グアララペスの戦いなど）で追いつめられたレシフェのオランダ軍が降伏した。オランダは1661年のハーグ条約でブラジルを正式に手放した。
  polities: [portugal, netherlands]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/オランダ領ブラジル"
- year: 1680
  title: コロニア・デル・サクラメントの建設
  text: ポルトガルがラ・プラタ川をはさんでブエノスアイレスの対岸に拠点を築いた。ブエノスアイレス向けの密貿易の基地となり、1777年まで両国が奪い合った。
  polities: [portugal, spain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/コロニア・デル・サクラメント"
- year: 1695
  title: ミナスジェライスの金鉱の発見
  text: バンデイランテス（奥地探検隊）が内陸で金鉱を見つけ、ポルトガル本国やブラジル北東部から人が押し寄せた（ゴールドラッシュ）。18世紀のブラジルの金はポルトガルを経てイギリスに流れ、その経済を支えた。
  polities: [portugal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブラジルのゴールドラッシュ"
- year: 1709
  title: エンボアバス戦争
  text: ミナスジェライスの金鉱をめぐり、先に来たサンパウロのバンデイランテスと、ポルトガル本国などから来た新参者（エンボアバ）が争った。本国の支配が強まり、1720年にミナスジェライスのカピタニアが置かれた。
  polities: [portugal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/War_of_the_Emboabas"
- year: 1721
  title: パラグアイのコムネロスの反乱
  text: アスンシオンの住民が、先住民の労働力をめぐってイエズス会と結ぶ総督に反抗し、自治を唱えた。1735年に鎮圧された。
  polities: [spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Revolt_of_the_Comuneros_(Paraguay)"
- year: 1726
  title: モンテビデオの建設
  text: ポルトガルの南下に備えて、スペインがラ・プラタ川の北岸にモンテビデオを建てた（1724年に砦、1726年に町）。
  polities: [spain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/モンテビデオ"
- year: 1750
  date: "1750-01-13"
  title: マドリード条約（スペインとポルトガルの南米の境界）
  text: 実際の占有にもとづいて境界を決め、ポルトガルはアマゾン流域や内陸の広い地域を認められた。代わりにコロニアをスペインに、ウルグアイ川東岸の伝道村をポルトガルに渡すことにしたが、グアラニー人の抵抗（グアラニー戦争）で実行されず、1761年に取り消された。
  polities: [spain, portugal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マドリード条約_(1750年)"
- year: 1754
  title: グアラニー戦争
  text: マドリード条約でポルトガル領とされた「七つの村」のグアラニー人が移住を拒み、スペイン・ポルトガル連合軍と戦って敗れた（1754–56年）。イエズス会への非難が強まるきっかけとなった。
  polities: [spain, portugal]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/グアラニー戦争"
- year: 1759
  title: ポンバル侯がイエズス会を追放
  text: ポルトガルの宰相ポンバル侯が、ブラジルを含むポルトガル領からイエズス会を追放し、植民地の行政と貿易を本国中心に改めた。1763年にはブラジルの首府がサルヴァドールからリオデジャネイロに移った。
  polities: [portugal]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/セバスティアン・デ・カルヴァーリョ"
- year: 1767
  title: スペイン領からのイエズス会の追放
  text: カルロス3世がスペインとその植民地からイエズス会を追放した。パラグアイ・ミシオネスのグアラニー人の伝道村は管理者を失って衰えた。
  polities: [spain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/グアラニーのイエズス会伝道所群"
- year: 1776
  title: リオ・デ・ラ・プラタ副王領の新設
  text: スペインはブエノスアイレスを都とする新しい副王領を置き、ラ・プラタ地方・パラグアイ・上ペルー（ポトシ銀山を含む）・クージョをまとめた。1778年には自由貿易規則でブエノスアイレス港が開かれた。
  polities: [spain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/リオ・デ・ラ・プラタ副王領"
- year: 1777
  date: "1777-10-01"
  title: サン・イルデフォンソ条約（南米）
  text: スペインとポルトガルが南米の境界を改めて決め、コロニア・デル・サクラメントと伝道村はスペインに、リオグランデ・ド・スルとサンタカタリーナはポルトガルに属することになった。
  polities: [spain, portugal]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/サン・イルデフォンソ条約_(1777年)"
- year: 1789
  title: ミナスの陰謀（チラデンテス）
  text: 重税に不満を持つミナスジェライスの人々が、アメリカ独立に刺激されて共和国を目指す陰謀を企てたが、密告で発覚した。指導者のチラデンテスは1792年に処刑され、のちに独立の英雄とされた。
  polities: [portugal]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ミナスの陰謀"
- year: 1806
  title: イギリス軍のラ・プラタ侵攻
  text: イギリス軍がブエノスアイレス（1806年）とモンテビデオ（1807年）を攻めたが、副王が逃げた後に住民の民兵が撃退した。クリオーリョ（植民地生まれの白人）が自信を深め、独立運動の下地となった。
  polities: [britain, spain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/British_invasions_of_the_River_Plate"

