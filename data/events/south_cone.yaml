  polities: [chile, spain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/チロエ島"
- year: 1828
  date: "1828-08-27"
  title: ウルグアイの独立
  text: イギリスの仲介によるモンテビデオ条約で、ブラジルとリオ・デ・ラ・プラタ連合州がともにバンダ・オリエンタルを手放し、両国の間の緩衝国としてウルグアイが独立した。1830年に憲法が定められた。
  polities: [uruguay, brazil, united_provinces_rio_plata, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ウルグアイの歴史"

