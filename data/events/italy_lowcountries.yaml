# ---------------------------------------------------------------- 低地諸国
- year: 1830
  date: "1830-08-25"
  title: ブリュッセルの蜂起（ベルギー独立革命）
  text: ブリュッセルの劇場でのオペラ『ポルティチの唖娘』の上演をきっかけに暴動が起こり、オランダ支配への反乱に広がった。9月の市街戦でオランダ軍を退け、10月4日に臨時政府が独立を宣言した。
  polities: [belgium, netherlands]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ベルギー独立革命"
- year: 1831
  date: "1831-07-21"
  title: ベルギー憲法とレオポルド1世の即位
  text: 国民会議が、国民主権・議会制・言論の自由を定めた当時もっとも自由主義的な憲法を制定し、ザクセン＝コーブルク家のレオポルドを国王に迎えた。
  polities: [belgium, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レオポルド1世_(ベルギー王)"
- year: 1831
  date: "1831-08"
  title: 十日間戦役
  text: オランダ軍がベルギーに攻め込んで勝ったが、フランス軍の介入で撤退した。翌1832年、フランス軍がアントウェルペンの城塞を包囲してオランダ守備隊を降伏させた。
  polities: [netherlands, belgium, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Ten_Days'_Campaign"
- year: 1830
  title: ジャワで強制栽培制度が始まる
  text: オランダ領東インドの総督ファン・デン・ボスが、農民にコーヒー・サトウキビ・藍などの輸出作物を栽培させて安く買い上げる制度を始めた。オランダ本国の財政を立て直したが、住民は飢饉に苦しんだ。
  polities: [netherlands]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/強制栽培制度"
- year: 1835
  date: "1835-05-05"
  title: ブリュッセル–メヘレン間の鉄道開通
  text: ヨーロッパ大陸で最初の蒸気機関車による旅客鉄道の一つ。ベルギーは国の事業として鉄道網を整え、大陸でいち早く工業化した。
  polities: [belgium]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Brussels–Mechelen_railway"
- year: 1839
  date: "1839-04-19"
  title: ロンドン条約（ベルギーの独立承認と永世中立）
  text: オランダがついにベルギーの独立を承認し、列強がベルギーの永世中立を保障した。リンブルフとルクセンブルクは東西に分けられた。1914年、ドイツはこの条約を「紙切れ」と呼んで中立を破った。
  polities: [belgium, netherlands, luxembourg, britain, france, prussia, habsburg, russia]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_London_(1839)"
- year: 1842
  title: ルクセンブルクがドイツ関税同盟に加盟
