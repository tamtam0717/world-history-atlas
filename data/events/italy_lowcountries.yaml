# 担当 C（低地諸国・スイス・イタリア）の出来事（1648–2025）
# europe.yaml にあるもの（ウェストファリア条約、ユトレヒト条約、カンポ・フォルミオ条約など）は重複して書かない。

# ---------------------------------------------------------------- 低地諸国
- year: 1652
  title: 第1次英蘭戦争
  text: イギリスの航海法（1651年）をきっかけに、海上貿易の覇権をめぐってイギリスとオランダが戦う（1654年まで）。
  polities: [netherlands, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/第一次英蘭戦争"
- year: 1661
  title: オーフェルマースの分割条約
  text: マース川東岸の諸地方（ファルケンブルフ・ダールヘム・ヘルトーヘンラート）をオランダとスペインで分けた。
  polities: [netherlands, spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Partition_Treaty_(1661)"
- year: 1665
  title: 第2次英蘭戦争
  text: 1667年のブレダの和約で終結。オランダは北アメリカのニューアムステルダム（ニューヨーク）をイギリスに譲り、南アメリカのスリナムを得た。
  polities: [netherlands, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/第二次英蘭戦争"
- year: 1672
  date: "1672-08-20"
  title: デ・ウィット兄弟の殺害
  text: フランス軍の侵入（「災厄の年」）の混乱の中、ハーグで群衆がヤン・デ・ウィットと兄コルネリスを殺害。オラニエ公ウィレム3世が総督となった。
  polities: [netherlands]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヨハン・デ・ウィット"
- year: 1684
  title: フランスがルクセンブルクを攻略
  text: ルイ14世の「再統合」政策で要塞都市ルクセンブルクを占領。レーゲンスブルクの休戦条約で20年間の領有が認められたが、1697年のライスワイク条約でスペインに返還した。
  polities: [france, spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Truce_of_Ratisbon"
- year: 1715
  title: 防壁条約
  text: オランダは、オーストリア領となった南ネーデルラントの要塞（ナミュール・トゥルネー・イーペルなど）に守備隊を置く権利を得た。フランスに対する「防壁」とするため。
  polities: [netherlands, habsburg, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Barrier_Treaty"
- year: 1787
  title: プロイセン軍のオランダ介入
  text: 総督ウィレム5世と、民主的な改革を求める愛国派が対立。総督妃の兄であるプロイセン王が軍を送り、愛国派を鎮圧した。
  polities: [netherlands, prussia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Prussian_invasion_of_Holland"
- year: 1789
  title: ブラバント革命とリエージュ革命
  text: オーストリア領ネーデルラントでヨーゼフ2世の改革に反対する反乱が起こり、1790年に「ベルギー合衆国」が独立を宣言（同年オーストリアが鎮圧）。リエージュでも市民が司教を追放した。
  polities: [habsburg, liege]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブラバント革命"
- year: 1795
  date: "1795-01"
  title: バタヴィア共和国の成立
  text: 凍った川を越えてフランス軍がオランダに侵入し、総督ウィレム5世はイギリスへ亡命。フランスの衛星国バタヴィア共和国が成立し、ハーグ条約でゼーラント・フランデレン、マーストリヒト、フェンローをフランスに割譲した。
  polities: [netherlands, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バタヴィア共和国"
- year: 1795
  date: "1795-10-01"
  title: フランスがベルギーとリエージュを併合
  text: フランスは旧オーストリア領ネーデルラントとリエージュ司教領を併合して9つの県を置いた。1797年のカンポ・フォルミオ条約でオーストリアがこれを認めた。
  polities: [france, habsburg, liege]
  importance: 2
  source: "https://en.wikipedia.org/wiki/French_period_in_Belgium"
- year: 1806
  title: ホラント王国の成立
  text: ナポレオンはバタヴィア共和国を王国に改め、弟ルイ（ローデウェイク1世）を王とした。
  polities: [netherlands, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ホラント王国"
- year: 1810
  date: "1810-07-09"
  title: オランダのフランス帝国への併合
  text: ルイ王が大陸封鎖の徹底を拒んで退位し、ナポレオンはオランダをフランス帝国に併合した。
  polities: [netherlands, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ホラント王国"
- year: 1813
  date: "1813-11-30"
  title: オランダの独立回復
  text: ライプツィヒの戦いの後、オランダで反フランスの蜂起が起こり、ウィレム5世の子ウィレム（のちの国王ウィレム1世）が亡命先から帰国した。
  polities: [netherlands, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ウィレム1世_(オランダ王)"

# ---------------------------------------------------------------- スイス
- year: 1707
  date: "1707-11-03"
  title: プロイセン王がヌーシャテル公に
  text: ロングヴィル家の断絶後、ヌーシャテルの身分制議会は、フランス系の候補ではなくプロテスタントのプロイセン王フリードリヒ1世を君主に選んだ。
  polities: [neuchatel, prussia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Principality_of_Neuchâtel"
- year: 1712
  title: 第2次フィルメルゲン戦争
  text: カトリック邦とプロテスタント邦（チューリヒ・ベルン）の内戦。プロテスタント邦が勝ち、盟約者団の主導権を握った。
  polities: [switzerland]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Toggenburg_War"
- year: 1798
  title: ヘルヴェティア共和国の成立
  text: フランス軍がスイスに侵入して旧体制を倒し、中央集権的なヘルヴェティア共和国をつくった。ジュネーヴはフランスに併合された。
  polities: [switzerland, france, geneva]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヘルヴェティア共和国"
- year: 1803
  date: "1803-02-19"
  title: 調停法
  text: ナポレオンがスイスの内紛を調停し、19州の連邦制に戻した。ティチーノ・ヴォーなど旧従属地が対等な州となった。
  polities: [switzerland, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/調停法"
- year: 1815
  date: "1815-11-20"
  title: スイスの永世中立の承認
  text: 第2次パリ条約に合わせて、列強がスイスの永世中立と領土の不可侵を正式に認めた。
  polities: [switzerland]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/永世中立国"

# ---------------------------------------------------------------- イタリア
- year: 1684
  date: "1684-05"
  title: フランス艦隊のジェノヴァ砲撃
  text: スペインに近いジェノヴァを屈服させるため、ルイ14世の艦隊が市街を砲撃。翌年ドージェがヴェルサイユに出向いて謝罪させられた。
  polities: [genoa, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Bombardment_of_Genoa"
- year: 1706
  date: "1706-09-07"
  title: トリノの戦い
  text: オーストリアのオイゲン公とサヴォイア公の軍が、トリノを包囲するフランス軍を破った。フランス軍は北イタリアから撤退し、ミラノはオーストリアの支配下に入った。
  polities: [savoy, habsburg, france]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Battle_of_Turin"
- year: 1708
  title: マントヴァ公国の没収
  text: スペイン継承戦争でフランスについたゴンザーガ家の公が皇帝に領地を没収され、マントヴァはオーストリア領、モンフェッラートはサヴォイア領となった。
  polities: [mantua, habsburg, savoy]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/マントヴァ公国"
- year: 1734
  date: "1734-05-25"
  title: カルロがナポリ・シチリアを征服
  text: ポーランド継承戦争で、スペイン王子カルロ（ドン・カルロス）がビトントの戦いでオーストリア軍を破り、ナポリ王となった。翌年シチリアも征服し、ナポリ・ブルボン家の王国が始まる。
  polities: [naples, spain, habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カルロス3世_(スペイン王)"
- year: 1737
  date: "1737-07-09"
  title: メディチ家の断絶
  text: トスカーナ大公ジャン・ガストーネが没してメディチ家が断絶。ロレーヌ公フランツ・シュテファン（マリア・テレジアの夫）が大公位を継いだ。
  polities: [tuscany, habsburg, lorraine]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ジャン・ガストーネ・デ・メディチ"
- year: 1746
  date: "1746-12"
  title: ジェノヴァ市民のオーストリア軍追放
  text: オーストリア継承戦争でジェノヴァを占領したオーストリア軍に対し、少年バリッラの投石をきっかけに市民が蜂起して追い出した。
  polities: [genoa, habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Balilla"
- year: 1773
  title: イエズス会の解散
  text: ブルボン家の諸国の圧力を受け、教皇クレメンス14世がイエズス会を解散させた（1814年に復活）。
  polities: [papal_states, spain, france, portugal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/イエズス会"
- year: 1786
  date: "1786-11-30"
  title: トスカーナで死刑廃止
  text: 啓蒙思想家ベッカリーアの影響を受けた大公レオポルドが刑法を改め、近代国家として初めて死刑を廃止した（拷問も廃止）。
  polities: [tuscany]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Leopoldine_Reform_of_Criminal_Law"
- year: 1796
  title: ナポレオンのイタリア遠征
  text: ナポレオンがイタリア方面軍司令官としてサルデーニャ王国を降伏させ（サヴォイアとニースを割譲）、ロディの戦い・アルコレの戦いでオーストリア軍を破ってミラノに入った。
  polities: [france, savoy, habsburg, cisalpine]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/イタリア戦役_(1796年-1797年)"
- year: 1797
  date: "1797-02-19"
  title: トレンティーノ条約
  text: トレンティーノ（マルケ地方の町。トレント地方とは別）で、教皇ピウス6世がナポレオンと講和し、ボローニャ・フェラーラ・ロマーニャを割譲し、多額の賠償金と美術品を差し出した。
  polities: [papal_states, france, cisalpine]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Tolentino"
- year: 1797
  date: "1797-06-29"
  title: チザルピーナ共和国とリグリア共和国の成立
  text: ナポレオンはミラノを首都とするチザルピーナ共和国をつくり、ジェノヴァ共和国をリグリア共和国に改めた。いずれもフランスの衛星国。
  polities: [cisalpine, ligurian_republic, genoa, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/チザルピーナ共和国"
- year: 1798
  date: "1798-02"
  title: ローマ共和国の成立
  text: フランス軍がローマを占領して教皇領を廃し、ローマ共和国をつくった。教皇ピウス6世はフランスへ連れ去られ、翌年に没した。
  polities: [roman_republic, papal_states, france]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Roman_Republic_(1798–1799)"
- year: 1798
  date: "1798-06"
  title: ナポレオンのマルタ占領
  text: エジプト遠征に向かうナポレオンが、ほとんど抵抗を受けずにマルタを占領し、聖ヨハネ騎士団による支配が終わった。1800年にはイギリス軍が島を奪った。
  polities: [malta, france, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マルタ騎士団"
- year: 1799
  title: パルテノペア共和国
  text: フランス軍がナポリに入り、啓蒙派の知識人がパルテノペア共和国を建てたが、フランス軍の撤退後、ルッフォ枢機卿の率いる王党派の農民軍（サンフェディスタ）に倒され、多くの共和派が処刑された。
  polities: [naples, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/パルテノペア共和国"
- year: 1800
  date: "1800-06-14"
  title: マレンゴの戦い
  text: アルプスを越えたナポレオンがオーストリア軍を破り、北イタリアを取り戻した。チザルピーナ共和国が復活した。
  polities: [france, habsburg, cisalpine]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マレンゴの戦い"
- year: 1801
  title: エトルリア王国の成立
  text: ナポレオンはトスカーナ大公国をエトルリア王国に改め、スペインとの取引でパルマ公の子ルドヴィーコに与えた。
  polities: [etruria, tuscany, spain, france]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/エトルリア王国"
- year: 1802
  title: イタリア共和国の成立とピエモンテの併合
  text: チザルピーナ共和国がイタリア共和国と改称し、ナポレオンが大統領となった。同年、ピエモンテはフランスに併合された。
  polities: [cisalpine, savoy, france]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/イタリア共和国_(1802年-1805年)"
- year: 1805
  date: "1805-05-26"
  title: ナポレオンがイタリア王に
  text: ナポレオンはミラノ大聖堂でロンバルディアの鉄王冠を戴いてイタリア王となり、養子ウジェーヌを副王とした。翌月、リグリア共和国をフランスに併合した。
  polities: [cisalpine, france, ligurian_republic]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/イタリア王国_(1805年-1814年)"
- year: 1806
  title: ジョゼフ・ボナパルトがナポリ王に
  text: フランス軍がナポリ王国の本土を占領し、ナポレオンの兄ジョゼフが王となった。ブルボン家の王はシチリア島へ逃れた。1808年にはミュラが王位を継いだ。
  polities: [naples_bonaparte, naples, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ジョゼフ・ボナパルト"
- year: 1809
  title: 教皇領のフランス併合
  text: ナポレオンはローマを含む教皇領をフランス帝国に併合した。これに抗議して破門を宣告した教皇ピウス7世は捕らえられ、1814年まで幽閉された。
  polities: [papal_states, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ピウス7世_(ローマ教皇)"
- year: 1815
  date: "1815-05-03"
  title: トレンティーノの戦いとミュラの没落
  text: マルケ地方の町トレンティーノでの戦い。百日天下に呼応してイタリア統一を呼びかけたナポリ王ミュラが、オーストリア軍に敗れて王位を失った。ブルボン家のフェルディナンド4世がナポリに戻った。
  polities: [naples_bonaparte, naples, habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Neapolitan_War"
- year: 1815
  title: ロンバルド＝ヴェネト王国の成立
  text: ウィーン会議の結果、ロンバルディアとヴェネトはオーストリア皇帝を王とするロンバルド＝ヴェネト王国となり、オーストリアがイタリアで優位に立った。ジェノヴァはサルデーニャ王国に併合された。
  polities: [habsburg, savoy, genoa]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ロンバルド＝ヴェネト王国"

