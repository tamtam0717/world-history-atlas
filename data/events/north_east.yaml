# F 北欧・東欧の出来事（1648–1815）。europe.yaml にあるものは書かない。

- year: 1648
  title: フメリニツキーの乱
  text: ボフダン・フメリニツキーの率いるザポロージャ・コサックがクリミア＝ハン国と結んでポーランドに反乱。ウクライナの大部分を制圧し、ヘトマン国家が生まれた。
  polities: [cossack_hetmanate, poland_lithuania, crimea]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/フメリニツキーの乱"
- year: 1649
  title: ズボリウ条約・ロシアの会議法典
  text: ポーランドはズボリウ条約でキエフ・ブラーツラフ・チェルニーヒウ県のコサック自治を認めた。同じ年、ロシアでは会議法典が制定され、農奴制が確立した。
  polities: [cossack_hetmanate, poland_lithuania, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ズボリウ条約"
- year: 1654
  title: ペレヤスラフ協定
  text: フメリニツキーがロシア皇帝の保護を受け入れる。これをきっかけにロシア・ポーランド戦争（1654–67）が始まった。
  polities: [cossack_hetmanate, russia, poland_lithuania]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ペレヤスラフ会議"
- year: 1655
  title: スウェーデンのポーランド侵攻（「大洪水」）
  text: カール10世がポーランドに侵攻し、ワルシャワとクラクフを占領。ロシアもリトアニアを占領し、ポーランドは存亡の危機に陥った（北方戦争）。
  polities: [sweden, poland_lithuania, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/大洪水時代"
- year: 1657
  title: ヴェーラウ条約
  text: ポーランドがブランデンブルク選帝侯にプロイセン公国の完全な主権を認めた。
  polities: [prussia, poland_lithuania]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヴェーラウ条約"
- year: 1658
  date: "1658-02-26"
  title: ロスキレ条約
  text: カール10世が凍った海峡を渡ってコペンハーゲンに迫り、デンマークはスコーネ・ハッランド・ブレーキンゲ・ボーンホルム・トロンデラーグ・ボーヒュースレーンを割譲した。
  polities: [sweden, denmark]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ロスキレ条約"
- year: 1660
  title: デンマークの絶対王政
  text: 戦後の危機の中で王が貴族を抑えて世襲王政を宣言。1665年の国王法で、ヨーロッパでも珍しい成文の絶対王政が成立した。
  polities: [denmark]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/国王法"
- year: 1667
  title: アンドルソヴォ条約
  text: ロシア・ポーランド戦争の休戦条約。スモレンスクとドニエプル左岸のウクライナがロシア領となり、キエフも（当初は2年の約束で）ロシアに渡された。
  polities: [russia, poland_lithuania, cossack_hetmanate]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アンドルソヴォ条約"
- year: 1670
  title: ステンカ・ラージンの反乱
  text: ドン・コサックのステンカ・ラージンがヴォルガ流域の農民を巻き込んで大反乱を起こした。翌年鎮圧された。
  polities: [russia, don_cossacks]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ステンカ・ラージンの乱"
- year: 1682
  title: ピョートル1世の即位
  text: 異母兄イヴァン5世と並んでツァーリとなる。はじめは姉ソフィアが摂政として実権を握った。
  polities: [russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ピョートル1世"
- year: 1686
  title: 永遠平和条約
  text: ポーランドはキエフとドニエプル左岸のロシア領有を正式に認め、ロシアは対オスマンの神聖同盟に加わった。
  polities: [russia, poland_lithuania]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/永遠平和条約_(1686年)"
- year: 1696
  title: ロシアのアゾフ占領
  text: ピョートル1世が艦隊を建造してオスマン帝国のアゾフ要塞を奪う。1711年のプルート条約で返還した。
  polities: [russia, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アゾフ遠征"
- year: 1697
  title: ピョートル1世の大使節団
  text: ピョートル1世が身分を隠して西欧諸国を視察し、オランダやイギリスで造船術などを学んだ。
  polities: [russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/大使節団"
- year: 1700
  date: "1700-11-30"
  title: ナルヴァの戦い
  text: カール12世が数で勝るロシア軍を破る。カール12世はその後ポーランドに転戦した。
  polities: [sweden, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ナルヴァの戦い_(1700年)"
- year: 1703
  title: サンクト・ペテルブルクの建設
  text: ピョートル1世がネヴァ川河口にペトロパヴロフスク要塞を築き、新しい都市の建設を始めた。1712年ごろから首都となる。
  polities: [russia, sweden]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/サンクトペテルブルク"
- year: 1708
  title: マゼパのスウェーデン側への寝返り
  text: ヘトマンのマゼパがロシアから離れてカール12世と結んだが、翌年のポルタヴァの敗戦でともにオスマン帝国へ逃れた。
  polities: [cossack_hetmanate, sweden, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/イヴァン・マゼーパ"
- year: 1718
  date: "1718-11-30"
  title: カール12世の戦死
  text: ノルウェーのフレドリクステン要塞を包囲中に戦死。スウェーデンでは王権が弱まり「自由の時代」が始まった。
  polities: [sweden, denmark]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カール12世_(スウェーデン王)"
- year: 1743
  title: オーボ条約
  text: 「ハットの戦争」（ロシア・スウェーデン戦争 1741–43）に敗れたスウェーデンが、フィンランド南東部のキュミ川以東をロシアに割譲した。
  polities: [sweden, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/オーボ条約"
- year: 1762
  title: エカチェリーナ2世の即位
  text: 近衛連隊のクーデタで夫のピョートル3世を廃し、女帝として即位した。
  polities: [russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/エカチェリーナ2世"
- year: 1764
  title: ポニャトフスキの国王選出・ヘトマン制の廃止
  text: エカチェリーナ2世の後押しでスタニスワフ・アウグスト・ポニャトフスキがポーランド王に選ばれた。同じ年、ロシアはウクライナのヘトマン制を廃止した。
  polities: [poland_lithuania, russia, cossack_hetmanate]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/スタニスワフ2世アウグスト"
- year: 1768
  title: バール連盟
  text: ロシアの干渉に反対するポーランド貴族がバール連盟を結成し、ロシア軍と戦った（1768–72）。混乱は第1回ポーランド分割の口実となった。
  polities: [poland_lithuania, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バール連盟"
- year: 1772
  date: "1772-08-19"
  title: グスタフ3世のクーデタ
  text: スウェーデン王グスタフ3世が議会を抑えて王権を回復し、「自由の時代」が終わった。
  polities: [sweden]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/グスタフ3世_(スウェーデン王)"
- year: 1773
  title: プガチョフの乱
  text: ドン・コサック出身のプガチョフがピョートル3世を名乗り、ヤイク・コサックや農民、バシキール人を率いて大反乱を起こした（1773–75）。
  polities: [russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/プガチョフの乱"
- year: 1775
  title: ザポロージャ・シーチの解体
  text: 露土戦争の後、ロシア軍がシーチを占領して解体し、その土地を新ロシア県に編入した。コサックの一部はオスマン帝国領のドナウ河口へ逃れた。
  polities: [zaporozhian_sich, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ザポロージャ・シーチ"
- year: 1788
  title: 四年セイムとロシア・スウェーデン戦争
  text: ポーランドで改革派の四年セイムが開かれる（1788–92）。北ではグスタフ3世がロシアに戦いを挑んだ（1788–90、現状維持で講和）。
  polities: [poland_lithuania, sweden, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/四年セイム"
- year: 1791
  date: "1791-05-03"
  title: 5月3日憲法
  text: ポーランドで、ヨーロッパ初の成文憲法とされる5月3日憲法が制定された。選挙王制と自由拒否権が廃止された。
  polities: [poland_lithuania]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/5月3日憲法"
- year: 1792
  title: タルゴヴィツァ連盟とポーランド＝ロシア戦争
  text: 5月3日憲法に反対する大貴族がタルゴヴィツァ連盟を結んでロシア軍を呼び入れ、ポーランドは敗れて憲法は廃止された。これが第2回分割につながった。
  polities: [poland_lithuania, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/タルゴヴィツァ連盟"
- year: 1794
  title: コシチュシコの蜂起
  text: アメリカ独立戦争にも参加したコシチュシコが分割に抵抗して蜂起したが、ロシア・プロイセン軍に鎮圧された。
  polities: [poland_lithuania, russia, prussia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/コシチュシコの蜂起"
- year: 1801
  date: "1801-04-02"
  title: コペンハーゲンの海戦
  text: 武装中立同盟に加わったデンマークを、ネルソンらのイギリス艦隊が攻撃した。1807年にもイギリスはコペンハーゲンを砲撃し、デンマーク艦隊を奪った。
  polities: [denmark, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/コペンハーゲンの海戦"
- year: 1809
  title: フィンランドのロシア割譲
  text: フィンランド戦争（1808–09）に敗れたスウェーデンが、フレデリクスハムンの和約でフィンランドとオーランド諸島をロシアに割譲。フィンランドはロシア皇帝を大公とする自治の大公国となった（ポルヴォー議会）。スウェーデンではグスタフ4世アドルフが廃位された。
  polities: [sweden, russia, finland]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/フィンランド戦争"
- year: 1810
  title: ベルナドットのスウェーデン王太子選出
  text: スウェーデン議会がフランスの元帥ベルナドットを王太子に選んだ。のちのカール14世ヨハンで、ナポレオンと戦う側に回った。
  polities: [sweden, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カール14世ヨハン_(スウェーデン王)"
- year: 1814
  date: "1814-01-14"
  title: キール条約
  text: ナポレオン側で敗れたデンマークが、ノルウェーをスウェーデンに譲った（アイスランド・フェロー諸島・グリーンランドはデンマークに残る）。
  polities: [denmark, sweden, norway]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/キール条約"
- year: 1814
  date: "1814-05-17"
  title: ノルウェー憲法とスウェーデンとの同君連合
  text: ノルウェーはアイスヴォルで憲法を定めて独立を宣言したが、スウェーデンとの短い戦争の後、憲法を保ったまま同君連合に入った（11月）。
  polities: [norway, sweden, denmark]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ノルウェー憲法"
