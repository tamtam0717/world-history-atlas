  title: エジプトの保護国化
  text: オスマン帝国がドイツ側で参戦したため、イギリスはエジプトに対するオスマン帝国の宗主権を否定して保護国とし、ヘディーヴのアッバース2世を廃してフサイン・カーミルをスルタンとした。
  polities: [egypt, britain, ottoman]
