# S4 大陸部東南アジア（ビルマ・シャム・ラオス・カンボジア・ベトナム）の出来事（1648–2025）
# ほかのファイルにあるもの（清仏戦争・北部仏印進駐・ASEANの結成・バンドン会議・英シャム条約〈1909〉・インパール作戦・
# ロヒンギャ難民・アジア通貨危機・インド洋大津波など）は書かない。

# ---- 17世紀 ----
- year: 1656
  title: ナーライ王の即位とアユタヤの国際交易
  text: アユタヤ朝のナーライ王が即位した。オランダ・イギリス・フランスの商館や日本町・ペルシア人の居留地が置かれ、アユタヤは東西交易の中継地として栄えた。
  polities: [siam]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ナーライ王"
- year: 1658
  title: 広南阮氏がカンボジアに出兵
  text: カンボジアの王位争いに阮氏が介入し、王を捕らえて臣従させた。これ以後、ベトナム人のメコン・デルタ（プレイ・ノコール＝サイゴン一帯）への移住が進んだ。
  polities: [nguyen_lords, cambodia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Post-Angkor_period"
- year: 1672
  title: 鄭阮紛争の終わり
  text: 北部の鄭氏と中部の阮氏の戦争（1627年から7度）が和約で終わった。以後約100年、ザイン川を境にベトナムは南北に分かれた。
  polities: [trinh, nguyen_lords]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Trịnh–Nguyễn_War"
- year: 1677
  title: 鄭氏が高平の莫氏を滅ぼす
  text: 清の保護のもとで中国国境の高平に残っていた莫朝の一族を、鄭氏の軍が滅ぼした。
  polities: [trinh, mac_cao_bang, qing]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/莫朝"
- year: 1686
  title: シャムとフランスの使節の交換
  text: ナーライ王はギリシア人の重臣ファルコンの勧めでフランスのルイ14世と使節を交わした（1685–86）。1687年にはフランス軍がバンコクとメルギーに駐留した。
  polities: [siam, france]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/コンスタンティン・フォールコン"
- year: 1688
  date: "1688-05"
  title: シャム革命（1688年の政変）
  text: ナーライ王の病中にペートラーチャーが実権を握り、ファルコンを処刑してフランス軍を追い出した。アユタヤは西洋との関係を絞ったが、中国・日本などとの交易は続いた。
  polities: [siam, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ペートラーチャー王"
- year: 1697
  title: 阮氏のチャンパー併合
  text: 広南阮氏が残るチャンパー（パーンドゥランガ）の王を捕らえ（1692）、順城鎮として従えた。チャンパーは1832年まで自治を保ったが、独立は失われた。
  polities: [nguyen_lords, champa]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/チャンパー"
- year: 1698
  title: 阮氏が嘉定府（サイゴン）を置く
  text: 阮氏がメコン・デルタ東部に嘉定府を置き、プレイ・ノコール（サイゴン）一帯を正式に領土とした。のちのサイゴン（ホーチミン市）のもととなった。
  polities: [nguyen_lords, cambodia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ホーチミン市"

# ---- 18世紀 ----
- year: 1707
  title: ラーンサーン王国の分裂
  text: 王位の継承争いから、ラーンサーン王国がヴィエンチャン王国とルアンパバーン王国に分かれた。1713年には南部がチャンパーサック王国として自立した。
  polities: [lan_xang, vientiane, luang_prabang, champasak]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ラーンサーン王国"
- year: 1708
  title: 河仙の莫玖が阮氏に従う
  text: カンボジアの港市河仙（ハティエン）を治めていた広東出身の莫玖が広南阮氏に臣従した。河仙は中国人の交易都市として栄えた。
  polities: [ha_tien, nguyen_lords, cambodia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/河仙"
- year: 1740
  date: "1740-11"
  title: モン人の反乱（復興ハンターワディー王国）
  text: 下ビルマのモン人がタウングー朝に反乱を起こしてペグーに王を立てた。フランスの支援も受けて勢力を広げた。
  polities: [hanthawaddy, burma]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Restored_Hanthawaddy_Kingdom"
- year: 1752
  title: タウングー朝の滅亡とコンバウン朝の成立
  text: ペグー軍がアヴァを落としてタウングー朝を滅ぼした。同じ年、シュエボーの首長アラウンパヤーが挙兵してコンバウン朝を開き、1754年にアヴァを取り戻した。
  polities: [burma, hanthawaddy]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/コンバウン王朝"
- year: 1755
  date: "1755-05"
  title: アラウンパヤーがラングーンを建設
  text: アラウンパヤーがモン人の町ダゴンを取り、「戦いの終わり」を意味するヤンゴン（ラングーン）と名づけた。
  polities: [burma, hanthawaddy]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヤンゴン"
- year: 1757
  date: "1757-05"
  title: アラウンパヤーのペグー征服
  text: アラウンパヤーがペグーを落とし、復興ハンターワディー王国を滅ぼしてビルマを再統一した。
  polities: [burma, hanthawaddy]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/アラウンパヤー"
- year: 1760
  title: アラウンパヤーのシャム遠征
  text: アラウンパヤーがアユタヤを包囲したが、陣中で負傷して退き、帰国の途中で死んだ。
  polities: [burma, siam]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Burmese–Siamese_War_(1759–1760)"
- year: 1765
  title: 清とビルマの戦争（1765–69）
  text: 国境のシャン諸国をめぐって、乾隆帝の清軍が4度ビルマに侵攻したが、コンバウン朝の軍に退けられた。1769年に和議が結ばれ、のちにビルマは清に朝貢した（乾隆帝の「十全武功」の一つとされる）。
  polities: [burma, qing]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/清緬戦争"
- year: 1767
  date: "1767-04"
  title: アユタヤの陥落
  text: シンビューシン王のビルマ軍が2年近い包囲の末にアユタヤを落とし、焼きはらった。417年続いたアユタヤ朝が滅んだ。
  polities: [burma, siam]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アユタヤ王朝"
- year: 1767
  title: タークシンのトンブリー朝
  text: 中国系の武将タークシンがチャンタブリーから兵を挙げてビルマ軍を追い、トンブリーに都を置いて王となった。1770年までに各地の政権を従えてシャムを再統一した。
  polities: [siam, burma]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/タークシン"
- year: 1771
  title: 西山の反乱
  text: 中部ベトナムの西山邑で、阮岳・阮恵・阮侶の3兄弟が重税と権臣の専横に反発して反乱を起こした（西山党の乱）。農民の支持を得て広がり、1777年に広南阮氏の一族をほぼ滅ぼした。
  polities: [tay_son, nguyen_lords]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/西山朝"
- year: 1775
  title: ランナーがビルマの支配を脱する
  text: チェンマイの貴族カーウィラらがシャムの軍とともにビルマ軍を追い、ランナーはシャムの宗主権下に入った。
  polities: [lan_na, siam, burma]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Kawila"
- year: 1779
  title: シャムのヴィエンチャン征服
  text: シャムの武将チャクリー（のちのラーマ1世）がヴィエンチャンを落とし、エメラルド仏をトンブリーに運んだ。ラオスの3王国はシャムの宗主権下に入った。
  polities: [siam, vientiane, luang_prabang, champasak]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/エメラルド仏"
- year: 1782
  date: "1782-04-06"
  title: ラタナコーシン朝の成立とバンコク遷都
  text: タークシンが廃された後、チャクリーがラーマ1世として即位し、ラタナコーシン朝（チャクリー朝）を開いた。都はチャオプラヤー川の東岸のバンコクに移された。
  polities: [siam]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/チャクリー王朝"
- year: 1784
  title: ビルマのアラカン征服
  text: ボードーパヤー王のビルマ軍がアラカン王国を滅ぼし、マハムニ仏をマンダレー（当時はアマラプラ）に運んだ。ビルマはイギリス領ベンガルと境を接するようになった。
  polities: [burma, arakan]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Konbaung_conquest_of_Arakan"
- year: 1785
  date: "1785-01"
  title: ラックガム・ソアイムットの戦い
  text: 阮福映の求めでメコン・デルタに入ったシャム軍を、西山軍の阮恵が破った。
  polities: [tay_son, siam, nguyen_lords]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Rạch_Gầm-Xoài_Mút"
- year: 1785
  title: ボードーパヤーのシャム侵攻（九軍の戦い）
  text: ビルマのボードーパヤー王が9つの軍でシャムに侵攻したが、ラーマ1世のシャム軍に敗れた。以後、ビルマとシャムの大規模な戦争はなくなった。
  polities: [burma, siam]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Burmese–Siamese_War_(1785–1786)"
- year: 1786
  title: 西山軍が鄭氏を滅ぼす
  text: 西山の阮恵が北に進んでフエ・昇竜（ハノイ）を取り、鄭氏を滅ぼした。南北の分立が終わった。
  polities: [tay_son, trinh]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/西山朝"
- year: 1789
  date: "1789-01-30"
  title: 棟多の戦い（清軍の撃退）
  text: 黎朝の最後の皇帝の求めで乾隆帝が送った清軍がハノイを占領したが、光中帝（阮恵）が正月の奇襲で破った。光中帝は清の冊封を受けて和を結んだ。
  polities: [tay_son, qing, trinh]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/光中帝"
- year: 1788
  title: 阮福映がサイゴンを取り戻す
  text: シャムに逃れていた阮福映がサイゴン（嘉定）を取り戻した。フランス人宣教師ピニョーが集めた義勇兵や西洋式の軍艦・城郭も使い、北に向けて反撃を始めた。
  polities: [nguyen_lords, tay_son, france]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/嘉隆帝"

# ---- 19世紀前半 ----
- year: 1802
  title: 阮朝の成立
  text: 阮福映が西山朝を滅ぼして南北を統一し、嘉隆帝として阮朝を開いた（都はフエ）。1804年に清から「越南国王」に冊封され、国号を越南とした。
  polities: [vietnam, tay_son, qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/阮朝"
- year: 1824
  title: 第1次イギリス＝ビルマ戦争
  text: アッサム・マニプルに進出したビルマとイギリス領インドが衝突した。イギリス軍がラングーンを占領し、ヤンダボ条約（1826）でビルマはアラカン・テナセリムを割譲し、賠償金を払った。
  polities: [burma, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/英緬戦争"
- year: 1826
  title: バーニー条約
  text: シャムがイギリス東インド会社と結んだ通商条約。シャムの王室による貿易の独占が一部ゆるめられ、マレー北部の諸国をめぐる勢力圏も定められた。
  polities: [siam, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Burney_Treaty"
- year: 1827
  title: アヌウォンの乱
  text: ヴィエンチャンのアヌウォン王がシャムからの独立を求めて反乱を起こし、コーラートまで進んだが敗れた。1828年にシャム軍はヴィエンチャンを破壊し、多くのラーオ人をメコン川の西岸（タイ東北部）に移した。
  polities: [vientiane, siam]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アヌウォン"
- year: 1832
  title: 明命帝の中央集権化とチャンパーの消滅
  text: 明命帝は南部の総督黎文悦の死後に南部の自治を廃し、チャンパーの残存の領域も併合した。1833年には南部で黎文𠐤の反乱が起こった。
  polities: [vietnam, champa]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/明命帝"
- year: 1834
  title: ベトナムのカンボジア併合
  text: シャム＝ベトナム戦争（1831–34）の後、ベトナムはカンボジアを併合して鎮西城とし、ベトナム化の政策を進めた。反発したカンボジア人の反乱とシャムの介入で、シャム＝ベトナム戦争（1841–45）が起こった。
  polities: [vietnam, cambodia, siam]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siamese–Vietnamese_War_(1841–1845)"
- year: 1845
  title: アン・ドゥオンの即位とカンボジアの両属
  text: シャムとベトナムの和約で、アン・ドゥオンがカンボジア王となり（1848年に戴冠）、両国に朝貢した。アン・ドゥオンはフランスに保護を求める使節を送った。
  polities: [cambodia, siam, vietnam]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Ang_Duong"

# ---- 19世紀後半 ----
- year: 1852
  title: 第2次イギリス＝ビルマ戦争
  text: イギリスがラングーンを占領し、下ビルマ（ペグー）を併合した。ビルマは海への出口を失った。パガン王は廃され、ミンドン王が即位した。
  polities: [burma, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/英緬戦争"
- year: 1855
  date: "1855-04-18"
  title: ボウリング条約
  text: シャムがイギリスと結んだ通商条約。領事裁判権の承認、低い関税、王室の独占貿易の廃止を認めた不平等条約で、シャムは米の輸出国として世界市場に組み込まれた。続いて欧米諸国とも同じような条約を結んだ。
  polities: [siam, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ボウリング条約"
- year: 1857
  title: ミンドン王のマンダレー建設
  text: ミンドン王が新しい都マンダレーを建設し（1857–59）、仏典結集を開き、近代化を試みた。
  polities: [burma]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/マンダレー"
- year: 1858
  date: "1858-09"
  title: フランス・スペインのダナン攻撃（コーチシナ戦争の始まり）
  text: ナポレオン3世のフランスは宣教師の迫害を口実にスペインと共同でダナンを攻め、ついでサイゴンを占領した（1859）。
  polities: [france, vietnam]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/コーチシナ戦争"
- year: 1862
  date: "1862-06-05"
  title: 第1次サイゴン条約
  text: 阮朝はコーチシナ東部3省とコンソン島をフランスに割譲し、キリスト教の布教の自由と賠償金を認めた。フランスは1867年に西部3省も占領し、コーチシナを直轄植民地とした。
  polities: [vietnam, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/サイゴン条約"
- year: 1863
  title: カンボジアがフランスの保護国となる
  text: ノロドム王がシャムの影響を逃れるためフランスの保護を受け入れた。1867年にシャムはカンボジアへの宗主権を放棄し、代わりにバッタンバン・シェムリアップの領有を認められた。
  polities: [cambodia, france, siam]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フランス領インドシナ"
- year: 1866
  title: メコン川探検隊
  text: フランスのドゥダール・ド・ラグレとガルニエがメコン川をさかのぼり、雲南に至った（1866–68）。メコン川は航行に向かないことがわかり、フランスの関心は紅河（トンキン）に向かった。アンコール・ワットもこのころヨーロッパに紹介された。
  polities: [france, cambodia, laos]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Mekong_expedition_of_1866–1868"
- year: 1868
  date: "1868-10-01"
  title: ラーマ5世の即位とチャクリ改革
  text: ラーマ5世（チュラロンコン）が即位し、奴隷制の廃止、中央集権的な州制度（モントン）、近代的な官僚・軍・学校・鉄道をつくる改革（チャクリ改革）を進めた。
  polities: [siam]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/チャクリー改革"
- year: 1873
  title: ガルニエのトンキン出兵と黒旗軍
  text: フランスのガルニエがハノイ城と紅河デルタの諸城を落としたが、劉永福の黒旗軍に討たれた。第2次サイゴン条約（1874）で阮朝はコーチシナ全域のフランス領有を認め、紅河を開放した。
  polities: [france, vietnam]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Tonkin_campaign"
- year: 1883
  date: "1883-08-25"
  title: ユエ条約（アルマン条約）
  text: 嗣徳帝の死後の混乱の中、フランスは阮朝にユエ（フエ）条約を結ばせ、ベトナムを保護国とした（1884年のパトノートル条約で確定）。宗主国の清はこれを認めず、清仏戦争が起こった。
  polities: [vietnam, france, qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/フエ条約"
- year: 1885
  date: "1885-11-28"
  title: 第3次イギリス＝ビルマ戦争とコンバウン朝の滅亡
  text: ビルマがフランスに近づいたことを警戒したイギリスが出兵し、マンダレーを占領してティーボー王をインドに流した。1886年1月、ビルマ全土がイギリス領インドに併合された。
  polities: [burma, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/英緬戦争"
- year: 1885
  date: "1885-07"
  title: 勤王運動（カンヴォン運動）
  text: フエのフランス軍を襲って敗れた咸宜帝が山地に逃れて勤王の詔を出し、文紳（儒学者・官僚）たちが各地で反フランスの武装抵抗を起こした（1896年ごろまで）。
