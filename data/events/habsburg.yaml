  text: 1944年12月末からソ連軍に包囲されたブダペストが、約50日の市街戦の末に陥落した。ドナウ川の橋はすべて落とされ、市は大きく破壊された。
  polities: [hungary, soviet_union, germany]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Siege_of_Budapest"

- year: 1945
  date: "1945-04-27"
