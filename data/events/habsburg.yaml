  polities: [yugoslavia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Croatian_Spring"

- year: 1977
  date: "1977-01"
  title: 憲章77
  text: 劇作家ハヴェルらチェコスロヴァキアの知識人が、ヘルシンキ宣言にうたわれた人権の保障を政府に求める文書を発表した。署名者は弾圧されたが、のちのビロード革命の中心となった。
  polities: [czechoslovakia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/憲章77"

- year: 1989
  date: "1989-08-19"
