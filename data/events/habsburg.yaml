# 担当 D（ハプスブルク領）の出来事（1648–1815）
# europe.yaml にあるもの（ウィーン包囲、カルロヴィッツ条約、パッサロヴィッツ条約、オーストリア継承戦争、七年戦争、ポーランド分割、
# カンポ・フォルミオ条約、プレスブルク条約、オーストリア帝国の成立など）は重複して書かない。

- year: 1648
  date: "1648-10-11"
  title: ラーコーツィ・ジェルジ2世がトランシルヴァニア公に
  text: 父ジェルジ1世の死を受けて即位。カルヴァン派のラーコーツィ家がオスマン帝国の宗主権の下で公国を治めた。
  polities: [transylvania, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラーコーツィ・ジェルジ2世"

- year: 1657
  title: ラーコーツィ・ジェルジ2世のポーランド遠征
  text: スウェーデンと結んでポーランド王位をねらったが大敗。宗主国オスマン帝国の許可を得ていなかったため、オスマン軍とクリミア＝タタールの懲罰遠征を招き、トランシルヴァニアは荒廃した。
  polities: [transylvania, poland_lithuania, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラーコーツィ・ジェルジ2世"

- year: 1658
  title: レオポルト1世が神聖ローマ皇帝に選ばれる
  text: 前年に父フェルディナント3世が死去。レオポルト1世は1705年まで47年間在位し、オスマン帝国・フランスとの戦いを指導した。
  polities: [habsburg, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レオポルト1世_(神聖ローマ皇帝)"

- year: 1660
  date: "1660-08-27"
  title: ヴァーラド（オラデア）の陥落
  text: オスマン軍がトランシルヴァニアの要衝ヴァーラドを奪い、ヴァーラド州を置いた。ハンガリー東部へのオスマン帝国の支配が広がる。
  polities: [ottoman, transylvania]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siege_of_Várad_(1660)"

- year: 1664
  date: "1664-08-01"
  title: ザンクト・ゴットハルトの戦いとヴァシュヴァール条約
  text: 皇帝軍がラーブ川のほとりでオスマン軍に勝利したが、直後のヴァシュヴァール条約ではオスマン帝国にエルシェクウーイヴァール（ノヴェー・ザームキ）などの領有を認めた。不利な講和はハンガリー貴族の不満を強めた。
  polities: [habsburg, ottoman, france]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Peace_of_Vasvár"

- year: 1671
  date: "1671-04-30"
  title: マグナート陰謀の鎮圧
  text: ハンガリー・クロアチアの大貴族（ヴェシェレーニ、ズリンスキ、フランコパンら）が皇帝に背く陰謀を企てたとして処刑された。以後レオポルト1世はハンガリーで強権的な統治とプロテスタントの弾圧を進め、クルツ（反乱軍）の抵抗が始まった。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Magnate_conspiracy"

- year: 1679
  title: ウィーンのペスト大流行
  text: ウィーンでペストが大流行し、多数の死者を出した。終息を感謝して、のちにグラーベン通りにペスト記念柱が建てられた。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Great_Plague_of_Vienna"

- year: 1682
  title: テケリが上部ハンガリー公となる
  text: クルツの指導者テケリ・イムレが、オスマン帝国の後ろ盾で上部ハンガリー（現スロヴァキア東部など）の公と認められた。翌年のウィーン包囲ではオスマン側についた。
  polities: [thokoly, ottoman, habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Principality_of_Upper_Hungary"

- year: 1684
  title: 神聖同盟の結成
  text: 教皇インノケンティウス11世の呼びかけで、皇帝・ポーランド・ヴェネツィアが対オスマン同盟を結んだ（1686年にロシアも参加）。大トルコ戦争の反撃が本格化する。
  polities: [habsburg, poland_lithuania, venice, russia, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Holy_League_(1684)"

- year: 1686
  date: "1686-09-02"
  title: ブダの奪回
  text: ロートリンゲン公カール5世の率いる皇帝軍が、約145年ぶりにブダをオスマン帝国から奪い返した。
  polities: [habsburg, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブダ包囲戦_(1686年)"

- year: 1687
  title: 第二次モハーチの戦いとハンガリー王位の世襲化
  text: 皇帝軍がモハーチ近郊でオスマン軍に大勝。同年のプレスブルク議会で、ハンガリー貴族はハプスブルク家（男系）の王位世襲を認め、抵抗権を放棄した。
  polities: [habsburg, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Battle_of_Mohács_(1687)"

- year: 1690
  title: ディプロマ・レオポルディヌムとセルビア人の大移住
  text: レオポルト1世がトランシルヴァニアの身分と宗教の特権を保証し、公国をハプスブルク家の支配下に置いた。同じ年、オスマン軍の反撃を逃れたセルビア人が総主教に率いられてハンガリー南部へ大量に移住した。
  polities: [habsburg, transylvania, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Diploma_Leopoldinum"

- year: 1697
  date: "1697-09-11"
  title: ゼンタの戦い
  text: オイゲン公（プリンツ・オイゲン）の率いる皇帝軍が、ティサ川を渡るオスマン軍を撃破。カルロヴィッツ条約への道を開いた。
  polities: [habsburg, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ゼンタの戦い"

- year: 1703
  title: ラーコーツィの独立戦争はじまる
  text: ラーコーツィ・フェレンツ2世がハンガリーの独立をめざしてハプスブルク家に反乱を起こし、一時はハンガリーの大半を支配した。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ラーコーツィ・フェレンツ2世"

- year: 1711
  date: "1711-04-30"
  title: サトマールの和約
  text: ラーコーツィの独立戦争が終結。反乱参加者は恩赦を受け、ハンガリー貴族の特権と議会は認められた。ラーコーツィは亡命した。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_Szatmár"

- year: 1713
  date: "1713-04-19"
  title: 国事詔書（プラグマティッシェ・ザンクツィオン）
  text: カール6世が、ハプスブルク家の領地は分割せず、男子がいなければ娘が相続すると定めた。のちにマリア・テレジアの相続の根拠となり、各国や国内の議会に承認を求めた。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/国事詔書"

- year: 1716
  date: "1716-08-05"
  title: ペーターヴァルダインの戦いとベオグラード攻略
  text: オイゲン公がオスマン軍を破り、1716年にテメシュヴァル、1717年にベオグラードを攻め落とした。この戦争はパッサロヴィッツ条約で終わる。
  polities: [habsburg, ottoman]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Petrovaradin"

- year: 1731
  title: ザルツブルクのプロテスタント追放
  text: 大司教フィルミアンが領内のプロテスタント約2万人に退去を命じた。多くはプロイセン王フリードリヒ・ヴィルヘルム1世に受け入れられ、東プロイセンに移住した。
  polities: [salzburg, prussia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Salzburg_Protestants"

- year: 1741
  date: "1741-09-11"
  title: マリア・テレジアがハンガリー議会に支援を訴える
  text: 四方から攻め込まれたマリア・テレジアは、プレスブルクのハンガリー議会に助けを求め、貴族たちは「命と血を捧げる」と応じて兵を出した。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マリア・テレジア"

- year: 1745
  date: "1745-09-13"
  title: フランツ1世が神聖ローマ皇帝に選ばれる
  text: バイエルンのカール7世の死後、マリア・テレジアの夫フランツ・シュテファンが皇帝に選ばれ、帝冠はハプスブルク＝ロートリンゲン家に戻った。
  polities: [habsburg, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フランツ1世_(神聖ローマ皇帝)"

- year: 1749
  title: ハウクヴィッツの行政改革
  text: シュレジエン喪失を受け、ハウクヴィッツがオーストリアとボヘミアの行政・財政を統合し、常備軍を支える税制を整えた。マリア・テレジアの改革の中心となる。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Friedrich_Wilhelm_von_Haugwitz"

- year: 1765
  date: "1765-08-18"
  title: ヨーゼフ2世の即位と共同統治
  text: フランツ1世の死後、長男ヨーゼフ2世が皇帝となり、母マリア・テレジアと世襲領を共同で統治した。
  polities: [habsburg, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヨーゼフ2世"

- year: 1772
  title: スピシュ（ツィプス）の質入れ都市の回収
  text: 1412年からポーランドに質入れされていたスピシュの13都市を、オーストリアが1769年に占領し、第1回ポーランド分割の際にハンガリーへ戻した。
  polities: [habsburg, poland_lithuania]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Spiš"

- year: 1774
  title: 一般学校令
  text: マリア・テレジアが義務教育を定めた一般学校令を出し、各地に初等学校が設けられた。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/General_School_Ordinance"

- year: 1779
  date: "1779-05-13"
  title: テシェン条約
  text: バイエルン継承戦争（ジャガイモ戦争）の講和。オーストリアはバイエルンの大部分を得ることをあきらめ、インフィアテルだけを獲得した。
  polities: [habsburg, bavaria, prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/テシェン条約"

- year: 1781
  title: 宗教寛容令と農奴解放令
  text: ヨーゼフ2世がプロテスタント・正教徒にも信仰の自由を認める寛容令を出し、ボヘミアなどで農奴の人格的な束縛を廃止した。啓蒙専制君主の改革の代表例。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/寛容令"

- year: 1784
  title: ドイツ語の公用語化
  text: ヨーゼフ2世がハンガリーを含む全領域で、ラテン語に代えてドイツ語を行政の言語とした。ハンガリー貴族の強い反発を招いた。
  polities: [habsburg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヨーゼフ2世"

- year: 1788
  title: オーストリア・トルコ戦争
  text: ロシアとの同盟によりオスマン帝国と開戦。1789年にベオグラードを占領したが、1791年のシストヴァ条約でほぼ戦前の国境に戻した。
  polities: [habsburg, ottoman, russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Sistova"

- year: 1790
  date: "1790-02-20"
  title: ヨーゼフ2世の死と改革の撤回
  text: ヨーゼフ2世が死去し、弟レオポルト2世が即位。ハンガリーや南ネーデルラントの反発を抑えるため、多くの改革が撤回された。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レオポルト2世_(神聖ローマ皇帝)"

- year: 1791
  date: "1791-08-27"
  title: ピルニッツ宣言
  text: レオポルト2世とプロイセン王フリードリヒ・ヴィルヘルム2世が、フランス王ルイ16世を守るために各国の共同行動を呼びかけた。革命フランスとの対立が深まる。
  polities: [habsburg, prussia, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ピルニッツ宣言"

- year: 1808
  date: "1808-01-31"
  title: ラグーザ共和国の消滅
  text: フランスのマルモン将軍が、数百年続いた商業国家ラグーザ（ドゥブロヴニク）共和国を廃止し、イタリア王国に併合した。
  polities: [ragusa, france]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラグーサ共和国"

- year: 1809
  date: "1809-07-06"
  title: アスペルンとヴァグラムの戦い
  text: オーストリアは単独でフランスと再び戦い、5月にアスペルン・エスリンクでナポレオンに初めて土をつけたが、7月のヴァグラムの戦いで敗れた。
  polities: [habsburg, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヴァグラムの戦い"

- year: 1809
  title: チロル蜂起
  text: アンドレアス・ホーファーの率いるチロルの農民が、バイエルンとフランスの支配に対して蜂起し、一時インスブルックを解放した。ホーファーは翌年に処刑された。
  polities: [bavaria, france, habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アンドレアス・ホーファー"

- year: 1809
  date: "1809-10-14"
  title: シェーンブルン条約とイリリア州の成立
  text: オーストリアはザルツブルク・インフィアテルをバイエルン（フランス経由）に、ガリツィアの一部をワルシャワ公国とロシアに、カルニオラ・ケルンテン西部・ゴリツィア・トリエステ・クロアチア南部をフランスに割譲し、海への出口を失った。フランスはこれらとダルマチアをあわせてイリリア州をつくった。
  polities: [habsburg, france, illyria, bavaria, warsaw, russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/シェーンブルンの和約"

- year: 1809
  date: "1809-10-08"
  title: メッテルニヒが外相に就任
  text: 敗戦後のオーストリアで外相となり、フランスとの協調に転じた。以後1848年までオーストリアの外交を指導する。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/クレメンス・フォン・メッテルニヒ"

- year: 1810
  date: "1810-04-01"
  title: マリー・ルイーズとナポレオンの結婚
  text: フランツ1世の娘マリー・ルイーズ（マリア・ルイーザ）がナポレオンと結婚。メッテルニヒの対仏協調政策の象徴となった。
  polities: [habsburg, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マリー・ルイーズ"

- year: 1811
  title: オーストリアの国家破産
  text: 戦費と賠償金で財政が破綻し、紙幣を5分の1に切り下げた。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Austrian_State_Bankruptcy_of_1811"

- year: 1813
  date: "1813-08-12"
  title: オーストリアが対仏大同盟に加わる
  text: プラハでの和平交渉が決裂し、オーストリアはフランスに宣戦。連合軍の総司令官にはオーストリアのシュヴァルツェンベルクがなった。
  polities: [habsburg, france, prussia, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/第六次対仏大同盟"
