  polities: [czechoslovakia, soviet_union]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/チェコスロバキア政変"

- year: 1955
  date: "1955-05-15"
  title: オーストリア国家条約
  text: 米英仏ソの4か国とオーストリアが条約を結び、オーストリアは独立と主権を回復した。占領軍は10月までに撤退し、オーストリア議会は永世中立を宣言した。
  polities: [austria, usa, britain, france, soviet_union]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/オーストリア国家条約"

- year: 1969
  date: "1969-01-01"
