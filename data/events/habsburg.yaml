# 担当 D（ハプスブルク領）の出来事（1648–1815）
# europe.yaml にあるもの（ウィーン包囲、カルロヴィッツ条約、パッサロヴィッツ条約、オーストリア継承戦争、七年戦争、ポーランド分割、
# カンポ・フォルミオ条約、プレスブルク条約、オーストリア帝国の成立など）は重複して書かない。

- year: 1648
  date: "1648-10-11"
  title: ラーコーツィ・ジェルジ2世がトランシルヴァニア公に
  text: 父ジェルジ1世の死を受けて即位。カルヴァン派のラーコーツィ家がオスマン帝国の宗主権の下で公国を治めた。
  polities: [transylvania, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラーコーツィ・ジェルジ2世"

- year: 1657
  title: ラーコーツィ・ジェルジ2世のポーランド遠征
  text: スウェーデンと結んでポーランド王位をねらったが大敗。宗主国オスマン帝国の許可を得ていなかったため、オスマン軍とクリミア＝タタールの懲罰遠征を招き、トランシルヴァニアは荒廃した。
  polities: [transylvania, poland_lithuania, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラーコーツィ・ジェルジ2世"

- year: 1658
  title: レオポルト1世が神聖ローマ皇帝に選ばれる
  text: 前年に父フェルディナント3世が死去。レオポルト1世は1705年まで47年間在位し、オスマン帝国・フランスとの戦いを指導した。
  polities: [habsburg, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レオポルト1世_(神聖ローマ皇帝)"

- year: 1660
  date: "1660-08-27"
  title: ヴァーラド（オラデア）の陥落
  text: オスマン軍がトランシルヴァニアの要衝ヴァーラドを奪い、ヴァーラド州を置いた。ハンガリー東部へのオスマン帝国の支配が広がる。
  polities: [ottoman, transylvania]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siege_of_Várad_(1660)"

- year: 1664
  date: "1664-08-01"
  title: ザンクト・ゴットハルトの戦いとヴァシュヴァール条約
  text: 皇帝軍がラーブ川のほとりでオスマン軍に勝利したが、直後のヴァシュヴァール条約ではオスマン帝国にエルシェクウーイヴァール（ノヴェー・ザームキ）などの領有を認めた。不利な講和はハンガリー貴族の不満を強めた。
  polities: [habsburg, ottoman, france]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Peace_of_Vasvár"

- year: 1671
  date: "1671-04-30"
  title: マグナート陰謀の鎮圧
  text: ハンガリー・クロアチアの大貴族（ヴェシェレーニ、ズリンスキ、フランコパンら）が皇帝に背く陰謀を企てたとして処刑された。以後レオポルト1世はハンガリーで強権的な統治とプロテスタントの弾圧を進め、クルツ（反乱軍）の抵抗が始まった。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Magnate_conspiracy"

- year: 1679
  title: ウィーンのペスト大流行
  text: ウィーンでペストが大流行し、多数の死者を出した。終息を感謝して、のちにグラーベン通りにペスト記念柱が建てられた。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Great_Plague_of_Vienna"

- year: 1682
  title: テケリが上部ハンガリー公となる
  text: クルツの指導者テケリ・イムレが、オスマン帝国の後ろ盾で上部ハンガリー（現スロヴァキア東部など）の公と認められた。翌年のウィーン包囲ではオスマン側についた。
  polities: [thokoly, ottoman, habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Principality_of_Upper_Hungary"

- year: 1684
  title: 神聖同盟の結成
  text: 教皇インノケンティウス11世の呼びかけで、皇帝・ポーランド・ヴェネツィアが対オスマン同盟を結んだ（1686年にロシアも参加）。大トルコ戦争の反撃が本格化する。
  polities: [habsburg, poland_lithuania, venice, russia, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Holy_League_(1684)"

- year: 1686
  date: "1686-09-02"
  title: ブダの奪回
  text: ロートリンゲン公カール5世の率いる皇帝軍が、約145年ぶりにブダをオスマン帝国から奪い返した。
  polities: [habsburg, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブダ包囲戦_(1686年)"

- year: 1687
  title: 第二次モハーチの戦いとハンガリー王位の世襲化
  text: 皇帝軍がモハーチ近郊でオスマン軍に大勝。同年のプレスブルク議会で、ハンガリー貴族はハプスブルク家（男系）の王位世襲を認め、抵抗権を放棄した。
  polities: [habsburg, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Battle_of_Mohács_(1687)"

- year: 1690
  title: ディプロマ・レオポルディヌムとセルビア人の大移住
  text: レオポルト1世がトランシルヴァニアの身分と宗教の特権を保証し、公国をハプスブルク家の支配下に置いた。同じ年、オスマン軍の反撃を逃れたセルビア人が総主教に率いられてハンガリー南部へ大量に移住した。
  polities: [habsburg, transylvania, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Diploma_Leopoldinum"

- year: 1697
  date: "1697-09-11"
  title: ゼンタの戦い
  text: オイゲン公（プリンツ・オイゲン）の率いる皇帝軍が、ティサ川を渡るオスマン軍を撃破。カルロヴィッツ条約への道を開いた。
  polities: [habsburg, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ゼンタの戦い"

- year: 1703
  title: ラーコーツィの独立戦争はじまる
  text: ラーコーツィ・フェレンツ2世がハンガリーの独立をめざしてハプスブルク家に反乱を起こし、一時はハンガリーの大半を支配した。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ラーコーツィ・フェレンツ2世"

- year: 1711
  date: "1711-04-30"
  title: サトマールの和約
  text: ラーコーツィの独立戦争が終結。反乱参加者は恩赦を受け、ハンガリー貴族の特権と議会は認められた。ラーコーツィは亡命した。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_Szatmár"

- year: 1713
  date: "1713-04-19"
  title: 国事詔書（プラグマティッシェ・ザンクツィオン）
  text: カール6世が、ハプスブルク家の領地は分割せず、男子がいなければ娘が相続すると定めた。のちにマリア・テレジアの相続の根拠となり、各国や国内の議会に承認を求めた。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/国事詔書"

- year: 1716
  date: "1716-08-05"
  title: ペーターヴァルダインの戦いとベオグラード攻略
  text: オイゲン公がオスマン軍を破り、1716年にテメシュヴァル、1717年にベオグラードを攻め落とした。この戦争はパッサロヴィッツ条約で終わる。
  polities: [habsburg, ottoman]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Petrovaradin"

- year: 1731
  title: ザルツブルクのプロテスタント追放
  text: 大司教フィルミアンが領内のプロテスタント約2万人に退去を命じた。多くはプロイセン王フリードリヒ・ヴィルヘルム1世に受け入れられ、東プロイセンに移住した。
  polities: [salzburg, prussia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Salzburg_Protestants"

- year: 1741
  date: "1741-09-11"
  title: マリア・テレジアがハンガリー議会に支援を訴える
  text: 四方から攻め込まれたマリア・テレジアは、プレスブルクのハンガリー議会に助けを求め、貴族たちは「命と血を捧げる」と応じて兵を出した。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マリア・テレジア"

- year: 1745
  date: "1745-09-13"
  title: フランツ1世が神聖ローマ皇帝に選ばれる
  text: バイエルンのカール7世の死後、マリア・テレジアの夫フランツ・シュテファンが皇帝に選ばれ、帝冠はハプスブルク＝ロートリンゲン家に戻った。
  polities: [habsburg, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フランツ1世_(神聖ローマ皇帝)"

- year: 1749
  title: ハウクヴィッツの行政改革
  text: シュレジエン喪失を受け、ハウクヴィッツがオーストリアとボヘミアの行政・財政を統合し、常備軍を支える税制を整えた。マリア・テレジアの改革の中心となる。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Friedrich_Wilhelm_von_Haugwitz"

- year: 1765
  date: "1765-08-18"
  title: ヨーゼフ2世の即位と共同統治
  text: フランツ1世の死後、長男ヨーゼフ2世が皇帝となり、母マリア・テレジアと世襲領を共同で統治した。
  polities: [habsburg, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヨーゼフ2世"

- year: 1772
  title: スピシュ（ツィプス）の質入れ都市の回収
  text: 1412年からポーランドに質入れされていたスピシュの13都市を、オーストリアが1769年に占領し、第1回ポーランド分割の際にハンガリーへ戻した。
  polities: [habsburg, poland_lithuania]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Spiš"

- year: 1774
  title: 一般学校令
  text: マリア・テレジアが義務教育を定めた一般学校令を出し、各地に初等学校が設けられた。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/General_School_Ordinance"

- year: 1779
  date: "1779-05-13"
  title: テシェン条約
  text: バイエルン継承戦争（ジャガイモ戦争）の講和。オーストリアはバイエルンの大部分を得ることをあきらめ、インフィアテルだけを獲得した。
  polities: [habsburg, bavaria, prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/テシェン条約"

- year: 1781
  title: 宗教寛容令と農奴解放令
  text: ヨーゼフ2世がプロテスタント・正教徒にも信仰の自由を認める寛容令を出し、ボヘミアなどで農奴の人格的な束縛を廃止した。啓蒙専制君主の改革の代表例。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/寛容令"

- year: 1784
  title: ドイツ語の公用語化
  text: ヨーゼフ2世がハンガリーを含む全領域で、ラテン語に代えてドイツ語を行政の言語とした。ハンガリー貴族の強い反発を招いた。
  polities: [habsburg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヨーゼフ2世"

- year: 1788
  title: オーストリア・トルコ戦争
  text: ロシアとの同盟によりオスマン帝国と開戦。1789年にベオグラードを占領したが、1791年のシストヴァ条約でほぼ戦前の国境に戻した。
  polities: [habsburg, ottoman, russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Sistova"

- year: 1790
  date: "1790-02-20"
  title: ヨーゼフ2世の死と改革の撤回
  text: ヨーゼフ2世が死去し、弟レオポルト2世が即位。ハンガリーや南ネーデルラントの反発を抑えるため、多くの改革が撤回された。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/レオポルト2世_(神聖ローマ皇帝)"

- year: 1791
  date: "1791-08-27"
  title: ピルニッツ宣言
  text: レオポルト2世とプロイセン王フリードリヒ・ヴィルヘルム2世が、フランス王ルイ16世を守るために各国の共同行動を呼びかけた。革命フランスとの対立が深まる。
  polities: [habsburg, prussia, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ピルニッツ宣言"

- year: 1808
  date: "1808-01-31"
  title: ラグーザ共和国の消滅
  text: フランスのマルモン将軍が、数百年続いた商業国家ラグーザ（ドゥブロヴニク）共和国を廃止し、イタリア王国に併合した。
  polities: [ragusa, france]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラグーサ共和国"

- year: 1809
  date: "1809-07-06"
  title: アスペルンとワグラムの戦い
  text: オーストリアは単独でフランスと再び戦い、5月にアスペルン・エスリンクでナポレオンに初めて土をつけたが、7月のワグラムの戦いで敗れた。
  polities: [habsburg, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヴァグラムの戦い"

- year: 1809
  title: チロル蜂起
  text: アンドレアス・ホーファーの率いるチロルの農民が、バイエルンとフランスの支配に対して蜂起し、一時インスブルックを解放した。ホーファーは翌年に処刑された。
  polities: [bavaria, france, habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アンドレアス・ホーファー"

- year: 1809
  date: "1809-10-14"
  title: シェーンブルン条約とイリリア州の成立
  text: オーストリアはザルツブルク・インフィアテルをバイエルン（フランス経由）に、ガリツィアの一部をワルシャワ公国とロシアに、カルニオラ・ケルンテン西部・ゴリツィア・トリエステ・クロアチア南部をフランスに割譲し、海への出口を失った。フランスはこれらとダルマチアをあわせてイリリア州をつくった。
  polities: [habsburg, france, illyria, bavaria, warsaw, russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/シェーンブルンの和約"

- year: 1809
  date: "1809-10-08"
  title: メッテルニヒが外相に就任
  text: 敗戦後のオーストリアで外相となり、フランスとの協調に転じた。以後1848年までオーストリアの外交を指導する。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/クレメンス・フォン・メッテルニヒ"

- year: 1810
  date: "1810-04-01"
  title: マリー・ルイーズとナポレオンの結婚
  text: フランツ1世の娘マリー・ルイーズ（マリア・ルイーザ）がナポレオンと結婚。メッテルニヒの対仏協調政策の象徴となった。
  polities: [habsburg, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マリー・ルイーズ"

- year: 1811
  title: オーストリアの国家破産
  text: 戦費と賠償金で財政が破綻し、紙幣を5分の1に切り下げた。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Austrian_State_Bankruptcy_of_1811"

- year: 1813
  date: "1813-08-12"
  title: オーストリアが対仏大同盟に加わる
  text: プラハでの和平交渉が決裂し、オーストリアはフランスに宣戦。連合軍の総司令官にはオーストリアのシュヴァルツェンベルクがなった。
  polities: [habsburg, france, prussia, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/第六次対仏大同盟"

# ===================== 1815–1914 =====================

- year: 1816
  date: "1816-04-14"
  title: ミュンヘン条約でザルツブルクがオーストリア領に
  text: バイエルンがザルツブルク（西部のルペルティウィンケルを除く）・インフィアテル・ハウスルックフィアテル西部をオーストリアに返し、代わりにライン左岸のプファルツなどを得た。
  polities: [habsburg, bavaria]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Munich_(1816)"

- year: 1825
  title: セーチェーニがハンガリー科学アカデミーの設立を提唱
  text: 改革派の貴族セーチェーニ・イシュトヴァーンが、一年分の収入を寄付してハンガリー語の学術振興を訴えた。この年から再開されたハンガリー議会とともに、「改革時代」と呼ばれるハンガリーの近代化と民族復興が始まる。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Hungarian_Academy_of_Sciences"

- year: 1835
  date: "1835-03-02"
  title: フランツ1世が死去し、フェルディナント1世が即位
  text: 新帝フェルディナント1世は病弱で、政治は大公ルートヴィヒ・メッテルニヒ・コロヴラートらの国家協議会が担った。
  polities: [habsburg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フェルディナント1世_(オーストリア皇帝)"

- year: 1835
  title: ガイがイリリア運動を始める
  text: リュデヴィト・ガイがザグレブでクロアチア語の新聞を創刊し、南スラヴ人の言語と文化の統一をめざす「イリリア運動」を広げた。クロアチアの民族運動の出発点となる。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Illyrian_movement"

- year: 1837
  date: "1837-11-23"
  title: オーストリア最初の蒸気鉄道
  text: ロスチャイルド家の出資による「皇帝フェルディナント北部鉄道」が開業し、のちにウィーンとブルノ（ブリュン）、さらにガリツィアのボフニャまで延びた。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Emperor_Ferdinand_Northern_Railway"

- year: 1844
  title: ハンガリー語がハンガリー王国の公用語に
  text: それまで行政・議会で使われていたラテン語に代わり、ハンガリー語が公用語となった。クロアチア人やスロヴァキア人などの反発を招き、民族間の対立のもとにもなった。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Hungarian_language#History"

- year: 1848
  date: "1848-03-13"
  title: ウィーン三月革命とメッテルニヒの失脚
  text: パリの二月革命の知らせを受けて、ウィーンの学生・市民が蜂起。宰相メッテルニヒはイギリスへ亡命し、ウィーン体制は崩れた。皇帝は憲法の制定を約束した。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/1848年革命"

- year: 1848
  date: "1848-03-15"
  title: ハンガリー革命（ペシュトの蜂起）と四月法
  text: ペシュトで詩人ペテーフィらが蜂起し、コシュート・ラヨシュらの議会が責任内閣・封建制の廃止などの「四月法」を成立させた。ハンガリーはバッチャーニを首相とする自前の政府を持つ。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ハンガリー革命"

- year: 1848
  date: "1848-06-02"
  title: プラハのスラヴ会議と六月蜂起
  text: パラツキーらがオーストリア内のスラヴ民族の連帯をめざす会議を開き、帝国の連邦化（オーストリア・スラヴ主義）を唱えた。直後のプラハの蜂起はヴィンディシュグレーツ将軍の軍に鎮圧された。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Prague_Slavic_Congress,_1848"

- year: 1848
  date: "1848-09-07"
  title: オーストリアで農民の賦役が廃止される
  text: 帝国議会の決議で、領主に対する賦役と貢租が廃止された（農民解放）。農民は革命から離れ、政府は秩序の回復に向かうことができた。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Hans_Kudlich"

- year: 1848
  date: "1848-09-11"
  title: イェラチッチがハンガリーに侵攻
  text: クロアチア総督（バン）イェラチッチが、ハンガリーからの分離をめざしてドラヴァ川を渡った。ハンガリーはコシュートのもとで国防軍を組織して戦った。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Josip_Jelačić"

- year: 1848
  date: "1848-10-31"
  title: ウィーン十月蜂起の鎮圧
  text: ハンガリー出兵に反対してウィーンの民衆が再び蜂起したが、ヴィンディシュグレーツとイェラチッチの軍が市を包囲して制圧した。オーストリアの革命はここで事実上終わった。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Vienna_Uprising"

- year: 1848
  date: "1848-12-02"
  title: フランツ・ヨーゼフ1世の即位
  text: 首相シュヴァルツェンベルクの主導でフェルディナント1世が退位し、18歳の甥フランツ・ヨーゼフが即位した。在位は68年に及び、ハプスブルク帝国の最後の時代を象徴する皇帝となる。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/フランツ・ヨーゼフ1世"

- year: 1849
  date: "1849-03-04"
  title: 三月憲法（欽定憲法）とクレムジール議会の解散
  text: 政府はモラヴィアのクレムジール（クロムニェジーシュ）で審議中の議会を解散し、上から憲法を与えた。帝国の一体化をめざすもので、ハンガリーの特権は否定された。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/March_Constitution_of_Austria"

- year: 1849
  date: "1849-04-14"
  title: ハンガリーの独立宣言
  text: デブレツェンに移ったハンガリー議会がハプスブルク家の廃位を宣言し、コシュートが執政となった。ハンガリー軍は一時ブダを奪回した。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/コシュート・ラヨシュ"

- year: 1849
  date: "1849-08-13"
  title: ヴィラーゴシュの降伏
  text: ロシア皇帝ニコライ1世の派遣した軍がオーストリア軍とともにハンガリーに攻め込み、ハンガリー軍はヴィラーゴシュで降伏した。10月にはアラドで13人の将軍が処刑された。コシュートはオスマン帝国へ亡命した。
  polities: [habsburg, russia]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Surrender_at_Világos"

- year: 1849
  date: "1849-11-20"
  title: ブダペストのセーチェーニ鎖橋が開通
  text: ドナウ川をはさむブダとペシュトを結ぶ初めての常設の橋。セーチェーニの提唱で建設された。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Széchenyi_Chain_Bridge"

- year: 1851
  date: "1851-12-31"
  title: ジルヴェスター勅令（新絶対主義）
  text: 皇帝が三月憲法を廃止し、議会なしに統治する体制に戻った。内相バッハのもとで中央集権・ドイツ語による行政が進められた（バッハ体制）。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Sylvester_Patent"

- year: 1854
  date: "1854-04-24"
  title: フランツ・ヨーゼフとエリーザベトの結婚
  text: バイエルン公家の娘エリーザベト（シシィ）が皇后となった。のちにハンガリーへの好意で知られ、アウスグライヒにも影響を与えたといわれる。
  polities: [habsburg, bavaria]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/エリーザベト_(オーストリア皇后)"

- year: 1857
  date: "1857-12-20"
  title: ウィーンの市壁撤去とリングシュトラーセの建設
  text: 皇帝の命令で旧市街を囲む城壁が取り壊され、跡地に環状道路と国会議事堂・歌劇場・美術館などが建てられた。
  polities: [habsburg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/リングシュトラーセ"

- year: 1860
  date: "1860-10-20"
  title: 十月勅書
  text: イタリア戦争の敗北を受けて、皇帝は新絶対主義をやめ、諸邦の議会に権限を与える連邦的な憲法を示した。翌1861年の二月勅令では、中央集権的な帝国議会がつくられた。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/October_Diploma"

- year: 1866
  date: "1866-07-20"
  title: リッサ沖の海戦
  text: アドリア海のリッサ島（ヴィス島）沖で、テゲトフの率いるオーストリア艦隊がイタリア艦隊を破った。装甲艦どうしの最初の大海戦の一つ。
  polities: [habsburg, italy]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/リッサ海戦"

- year: 1867
  title: アウスグライヒとオーストリア＝ハンガリー帝国の成立
  text: 首相ボイストとハンガリーのデアーク・アンドラーシの交渉で、ハンガリー王国に独自の政府と議会を認める「妥協（アウスグライヒ）」が成立。6月にフランツ・ヨーゼフがブダでハンガリー王として戴冠した。外交・軍事と、その財政だけを共通にする二重帝国となった。
  polities: [habsburg]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アウスグライヒ"

- year: 1867
  date: "1867-12-21"
  title: 十二月憲法
  text: 帝国のオーストリア側（ツィスライタニア）の憲法。基本的人権と、各民族の言語の平等をうたった。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/December_Constitution"

- year: 1868
  title: クロアチア＝ハンガリー協約（ナゴドバ）
  text: クロアチア・スラヴォニア王国は、ハンガリー王国の中で内政・司法・教育の自治を認められた。フィウメ（リエカ）の帰属は争点として残された。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Croatian–Hungarian_Settlement"

- year: 1873
  date: "1873-05-09"
  title: ウィーン万国博覧会と株式市場の暴落
  text: 万博の開幕直後にウィーン証券取引所で株価が大暴落し、ヨーロッパ全体に広がる長い不況（大不況）の始まりとなった。日本の明治政府が初めて公式に参加した万博でもある。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ウィーン万国博覧会"

- year: 1873
  date: "1873-11-17"
  title: ブダペスト市の誕生
  text: ドナウ川西岸のブダ・オーブダと東岸のペシュトが合併してブダペストとなった。以後、ハンガリーの首都として急成長する。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブダペスト"

- year: 1878
  date: "1878-07-29"
  title: オーストリア＝ハンガリーがボスニア・ヘルツェゴヴィナを占領
  text: ベルリン会議で認められた占領・行政権に基づき、軍がボスニアに進駐した。ムスリム住民などの激しい抵抗を受け、制圧に約3か月を要した。主権は名目上オスマン帝国に残った。
  polities: [habsburg, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Austro-Hungarian_campaign_in_Bosnia_and_Herzegovina_in_1878"

- year: 1881
  date: "1881-07-15"
  title: 軍政国境地帯の廃止
  text: 16世紀からオスマン帝国に備えてウィーンの陸軍が直接治めてきたクロアチア・スラヴォニアの軍政国境地帯が、クロアチア・スラヴォニア王国に編入された（ヴァラジュディン国境地帯は1871年に先に廃止）。セルビア人の多い国境地帯の編入は、クロアチアの民族構成にも影響した。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/軍政国境地帯"

- year: 1881
  date: "1881-06-11"
  title: プラハの国民劇場の開場
  text: チェコ人の寄付で建てられた劇場がスメタナのオペラ『リブシェ』で開場したが、まもなく火災で焼け、再び募金で再建された（1883年）。チェコ民族運動の象徴。
  polities: [habsburg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/国民劇場_(プラハ)"

- year: 1889
  date: "1889-01-30"
  title: マイヤーリンク事件
  text: 皇太子ルドルフが、ウィーン郊外のマイヤーリンクの狩猟館で愛人とともに死んでいるのが見つかった（心中とされる）。帝位継承者は皇帝の甥フランツ・フェルディナントに移った。
  polities: [habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/マイヤーリンク事件"

- year: 1896
  title: ハンガリー建国千年祭
  text: マジャール人のカルパチア盆地への定住から千年を祝う大博覧会がブダペストで開かれ、ヨーロッパ大陸初の地下鉄が開業した。ハンガリーの国力の頂点を示す行事。
  polities: [habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Millennium_Celebrations_(Hungary)"

- year: 1897
  date: "1897-04-05"
  title: バデーニ言語令
  text: 首相バデーニが、ボヘミア・モラヴィアの役所でドイツ語とチェコ語を対等に扱うよう命じた。ドイツ人が激しく反発して帝国議会が大混乱に陥り、バデーニは辞任、言語令も撤回された。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Badeni_Language_Ordinance"

- year: 1897
  title: ウィーン分離派の結成と「世紀末ウィーン」
  text: 画家クリムトらが保守的な美術界から分離して新しい芸術をめざした。この時代のウィーンでは、フロイトの精神分析（1900年『夢判断』）、マーラーの音楽など、近代文化が花開いた。
  polities: [habsburg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ウィーン分離派"

- year: 1898
  date: "1898-09-10"
  title: 皇后エリーザベトの暗殺
  text: スイスのジュネーヴで、イタリア人の無政府主義者に刺されて亡くなった。
  polities: [habsburg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/エリーザベト_(オーストリア皇后)"

- year: 1907
  title: オーストリアで男子普通選挙
  text: 帝国のオーストリア側の帝国議会選挙で、男子の普通・平等選挙が初めて行われた。社会民主党やキリスト教社会党が伸び、民族ごとの政党が議会に並ぶようになった。ハンガリー側では普通選挙は導入されなかった。
  polities: [habsburg]
  importance: 2
  source: "https://en.wikipedia.org/wiki/1907_Cisleithanian_legislative_election"
