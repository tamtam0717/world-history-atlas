  text: ハンガリーが連合国とひそかに講和を探ったため、ドイツ軍がハンガリーを占領した。5–7月に約43万人のユダヤ人がアウシュヴィッツなどへ移送され、その多くが殺害された。
  polities: [hungary, germany]
  importance: 1
  source: "https://en.wikipedia.org/wiki/The_Holocaust_in_Hungary"

- year: 1944
  date: "1944-08-29"
  title: スロヴァキア民族蜂起
  text: スロヴァキア軍の一部と共産党・民主派の抵抗勢力がバンスカー・ビストリツァを拠点に蜂起したが、ドイツ軍に2か月で鎮圧された。
  polities: [slovakia, germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/スロバキア民衆蜂起"

- year: 1944
  date: "1944-10-15"
