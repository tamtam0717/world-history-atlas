  text: エルドゥット協定（1995）にもとづく国連の暫定統治を経て、ヴコヴァルなど東スラヴォニア・バラニャがクロアチアに戻った。武力によらずに紛争地を返還した例とされる。
  polities: [croatia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/United_Nations_Transitional_Authority_for_Eastern_Slavonia,_Baranja_and_Western_Sirmium"

- year: 1999
  date: "1999-03-12"
