  polities: [croatia, yugoslavia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siege_of_Dubrovnik"

- year: 1995
  date: "1995-01-01"
  title: "オーストリア・スウェーデン・フィンランドのEU加盟"
  text: "オーストリア（1994年の国民投票で賛成約67％）・スウェーデン・フィンランドが欧州連合に加盟した。オーストリアは永世中立を保った。ノルウェーは国民投票で加盟を否決した（1994年）。"
  polities: [austria, sweden, finland, norway]
  importance: 2
  source: "https://en.wikipedia.org/wiki/1995_enlargement_of_the_European_Union"

- year: 1995
