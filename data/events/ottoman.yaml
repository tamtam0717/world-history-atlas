# 担当 E：バルカン・オスマン・中東の出来事（1648–1914）
# europe.yaml にあるもの（第二次ウィーン包囲、カルロヴィッツ条約、パッサロヴィッツ条約、ベオグラード条約、
# キュチュク・カイナルジ条約、ロシアのクリミア併合など）は重複して書かない。

- year: 1648
  date: "1648-08-08"
  title: スルタン・イブラヒムの廃位
  text: イェニチェリと宗教指導者がイブラヒムを廃位・処刑し、6歳のメフメト4世が即位。宮廷の混乱が続いた。
  polities: [ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/イブラヒム_(オスマン皇帝)"

- year: 1656
  date: "1656-09-15"
  title: キョプリュリュ・メフメト・パシャが大宰相に
  text: 全権を与えられて財政と軍を立て直した。以後キョプリュリュ家の大宰相が続き、帝国は一時的に勢いを取り戻した（キョプリュリュ時代）。
  polities: [ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/キョプリュリュ・メフメト・パシャ"

- year: 1669
  date: "1669-09-06"
  title: カンディア開城（クレタ戦争の終結）
  text: 20年以上包囲されたカンディア（イラクリオン）が降伏し、クレタ島全体がヴェネツィアからオスマン帝国の手に移った。
  polities: [ottoman, venice]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/クレタ戦争_(1645年-1669年)"

- year: 1672
  title: ブチャチ条約（ポドリアの獲得）
  text: オスマン帝国がポーランドに侵攻し、ポドリア（カームヤネツィ）を得た。オスマン帝国のヨーロッパでの領土は最大となった（1699年に返還）。
  polities: [ottoman, poland_lithuania]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブチャチ条約"

- year: 1687
  title: モレア戦争とアテネのパルテノン神殿の破壊
  text: ヴェネツィア軍（モロジーニ）がペロポネソス半島を征服。アテネ包囲中の砲撃で、火薬庫として使われていたパルテノン神殿が爆発した。
  polities: [venice, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/モレア戦争"

- year: 1687
  date: "1687-11-08"
  title: メフメト4世の廃位
  text: 第二次モハーチの戦いの敗北を受けて軍が反乱し、メフメト4世が廃位され、スレイマン2世が即位した。
  polities: [ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/メフメト4世"

- year: 1711
  date: "1711-07-21"
  title: プルート条約
  text: ピョートル1世のロシア軍がモルダヴィアのプルート川でオスマン軍に包囲されて降伏。ロシアはアゾフを返還した。ロシアと結んだモルダヴィア公カンテミールは亡命した。
  polities: [ottoman, russia, moldavia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/プルート川の戦い"

- year: 1715
  title: オスマン帝国のモレア奪回
  text: オスマン帝国がヴェネツィアに宣戦し、ペロポネソス半島とティノス島を短期間で奪回した（1718年のパッサロヴィッツ条約で確定）。
  polities: [ottoman, venice]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Ottoman–Venetian_War_(1714–1718)"

- year: 1716
  title: ドナウ二公国のファナリオティス支配の始まり
  text: オスマン帝国はワラキア公にもイスタンブルのギリシア系有力者（ファナリオティス）のニコラエ・マヴロコルダトを任命した（モルダヴィアは1711年から）。
  polities: [wallachia, moldavia, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ファナリオティス"

- year: 1718
  title: チューリップ時代の始まり
  text: 大宰相ネヴシェヒルリ・イブラヒム・パシャのもとで平和が続き、宮廷ではチューリップが愛好され、西欧の文化が取り入れられた。1727年にはイブラヒム・ミュテフェッリカが最初のトルコ語の印刷所を開いた。
  polities: [ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/チューリップ時代"

- year: 1722
  date: "1722-10-23"
  title: イスファハーン陥落（サファヴィー朝の崩壊）
  text: アフガン（ギルザイ族）のマフムードが半年の包囲の末にイスファハーンを占領。シャー・スルターン・フサインは退位し、サファヴィー朝は事実上崩壊した。
  polities: [persia, hotaki]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/サファヴィー朝"

- year: 1723
  title: ロシアとオスマン帝国のペルシア侵攻
  text: ピョートル1世がカスピ海西岸・南岸を占領し（ペテルブルク条約でギーラーンなどを得る）、オスマン帝国はティフリス・エレバン・ハマダーンなどペルシア西部を占領した。両国は1724年のコンスタンティノープル条約で占領地を分け合った。
  polities: [persia, russia, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Russo-Persian_War_(1722–1723)"

- year: 1727
  title: ハマダーン条約
  text: アフガンのアシュラフがオスマン帝国と講和し、オスマン帝国によるペルシア西部の占領を認めた。
  polities: [ottoman, hotaki]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Hamedan"

- year: 1729
  title: ナーディルがアフガン軍を破る
  text: タフマースブ2世の将軍ナーディル・クリー・ベグがダームガーン、ムールチェホルトでアフガン軍を破り、イスファハーンを奪回した。
  polities: [persia, hotaki]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ナーディル・シャー"

- year: 1730
  date: "1730-09-28"
  title: パトロナ・ハリルの乱
  text: ペルシア戦線の敗北に怒ったイスタンブルの民衆とイェニチェリが反乱し、大宰相イブラヒム・パシャが殺され、アフメト3世は退位した。チューリップ時代の終わり。
  polities: [ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/パトロナ・ハリルの乱"

- year: 1736
  date: "1736-03-08"
  title: ナーディル・シャーの即位（アフシャール朝）
  text: ナーディルがムガーン平原の大集会でシャーに推され、サファヴィー朝に代わってアフシャール朝を開いた。
  polities: [persia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アフシャール朝"

- year: 1739
  date: "1739-03-20"
  title: ナーディル・シャーのデリー略奪
  text: ナーディル・シャーがカルナールの戦いでムガル帝国軍を破ってデリーを占領・略奪し、「孔雀の玉座」などの財宝を持ち帰った。
  polities: [persia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カルナールの戦い"

- year: 1744
  title: ディルイーヤの盟約（第一次サウード王国）
  text: ナジュドのディルイーヤの首長ムハンマド・イブン・サウードが、イスラーム改革運動（ワッハーブ派）の指導者イブン・アブドゥルワッハーブと盟約を結んだ。のちのサウジアラビアの起源。
  polities: [saudi]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/第一次サウード王国"

- year: 1746
  date: "1746-09-04"
  title: ケルデン条約
  text: オスマン帝国とナーディル・シャーが講和し、1639年のズハーブ条約の国境を確認した。
  polities: [ottoman, persia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Kerden"

- year: 1747
  date: "1747-06-19"
  title: ナーディル・シャーの暗殺とドゥッラーニー朝の成立
  text: ナーディル・シャーが部下に暗殺され、ペルシアは分裂した。アフガン人部将アフマド・シャーがカンダハールで即位し、ドゥッラーニー朝（アフガニスタン）を開いた。
  polities: [persia, durrani]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ドゥッラーニー朝"

- year: 1751
  title: カリーム・ハン・ザンドの台頭（ザンド朝）
  text: カリーム・ハンがイラン西部・南部を押さえ、サファヴィー家の幼いイスマーイール3世を立てて「ワキール（摂政）」として統治した。のちシーラーズを都とした。
  polities: [persia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ザンド朝"

- year: 1762
  title: カルトリ・カヘティ王国の統合
  text: カヘティ王エレクレ2世が父テイムラズ2世の死によりカルトリ王位も継ぎ、ジョージア東部を統一した。
  polities: [kartli_kakheti, kakheti]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/エレクレ2世"

- year: 1768
  title: 露土戦争（1768–1774）はじまる
  text: ポーランド問題をめぐってオスマン帝国がロシアに宣戦。ロシア軍はドナウ二公国を占領した。
  polities: [ottoman, russia, moldavia, wallachia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/露土戦争_(1768年-1774年)"

- year: 1770
  date: "1770-07-07"
  title: チェシュメの海戦
  text: バルト海から地中海に回航したロシア艦隊が、アナトリア西岸のチェシュメでオスマン艦隊を全滅させた。ロシアはペロポネソスのギリシア人の蜂起（オルロフの乱）も支援した。
  polities: [ottoman, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/チェシュメの海戦"

- year: 1775
  title: ブコヴィナのオーストリアへの割譲
  text: 露土戦争の講和に乗じて、オーストリアがモルダヴィア北部のブコヴィナをオスマン帝国から譲り受けた。
  polities: [habsburg, moldavia, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ブコヴィナ"

- year: 1779
  title: カリーム・ハン・ザンドの死とガージャール族の挙兵
  text: カリーム・ハンの死後ザンド朝は内紛に陥り、シーラーズで人質となっていたアーガー・モハンマド・ハーンがマーザンダラーンで挙兵した。
  polities: [persia, qajar_north]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ガージャール朝"

- year: 1783
  date: "1783-07-24"
  title: ゲオルギエフスク条約
  text: カルトリ・カヘティ王エレクレ2世がロシアの保護を受け入れ、ペルシアの宗主権を否認した。
  polities: [kartli_kakheti, russia, persia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ゲオルギエフスク条約"

- year: 1787
  title: 露土戦争（1787–1792）はじまる
  text: クリミア併合の撤回を求めてオスマン帝国がロシアに宣戦。オーストリアもロシア側で参戦した（1791年シストヴァ条約でオーストリアと講和）。
  polities: [ottoman, russia, habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/露土戦争_(1787年-1792年)"

- year: 1792
  date: "1792-01-09"
  title: ヤッシー条約
  text: ロシアのクリミア併合が承認され、ブーフ川とドニエストル川の間（イェディサン）がロシア領となった。ロシアの国境はドニエストル川に達した。
  polities: [ottoman, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヤッシー条約"

- year: 1793
  title: セリム3世の新軍（ニザーム・ジェディード）
  text: セリム3世が西洋式の新しい軍隊と財源を設け、ヨーロッパ各国に常駐大使を置くなど改革を進めた。
  polities: [ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ニザーム・ジェディード"

- year: 1795
  date: "1795-09-11"
  title: ティフリスの劫掠（クルツァニシの戦い）
  text: アーガー・モハンマド・ハーンがジョージアに侵攻してエレクレ2世を破り、ティフリスを焼き払った。ロシアは援軍を送らなかった。
  polities: [persia, kartli_kakheti]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Battle_of_Krtsanisi"

- year: 1796
  title: ガージャール朝の成立
  text: ザンド朝を滅ぼしてイランを統一したアーガー・モハンマド・ハーンがシャーとして戴冠した。都はテヘラン。
  polities: [persia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ガージャール朝"

- year: 1796
  title: クルシの戦い（モンテネグロの事実上の独立）
  text: モンテネグロの府主教ペタル1世が、スクタリ（シュコドラ）のパシャ、カラ・マフムード・ブシャトリを破った。
  polities: [montenegro, ottoman]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Krusi"

- year: 1800
  date: "1800-03-21"
  title: 七島連邦共和国の成立
  text: ロシアとオスマン帝国がフランスから奪ったイオニア諸島に、オスマン帝国の宗主権下の共和国を建てた。
  polities: [septinsular, ottoman, russia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/七島連邦共和国"

- year: 1801
  title: ロシアのカルトリ・カヘティ王国併合
  text: 王ギオルギ12世の死後、ロシア皇帝パーヴェル1世（ついでアレクサンドル1世）が王国の併合を宣言した。
  polities: [russia, kartli_kakheti]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カルトリ・カヘティ王国"

- year: 1803
  title: サウード王国のメッカ占領
  text: ワッハーブ派のサウード王国がメッカを占領した（1805年にメディナ）。聖地の巡礼が妨げられ、オスマン帝国の権威は大きく傷ついた。
  polities: [saudi, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/第一次サウード王国"

- year: 1804
  date: "1804-02-14"
  title: 第一次セルビア蜂起
  text: カラジョルジェ（黒ジョルジェ）を指導者に、ベオグラード州のセルビア人がイェニチェリの支配に対して蜂起した。1806年末にベオグラードを占領。
  polities: [serbia, ottoman]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/第一次セルビア蜂起"

- year: 1804
  title: ロシア・ペルシア戦争（1804–1813）はじまる
  text: ロシアがガンジャ・ハン国を攻略し、カフカースの支配をめぐってペルシアと戦争になった。
  polities: [russia, persia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ロシア・ペルシャ戦争_(1804年-1813年)"

- year: 1806
  title: 露土戦争（1806–1812）はじまる
  text: ナポレオンの影響を受けたオスマン帝国がドナウ二公国の公を解任したことをきっかけに、ロシア軍が二公国を占領した。
  polities: [ottoman, russia, moldavia, wallachia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/露土戦争_(1806年-1812年)"

- year: 1807
  date: "1807-05-29"
  title: セリム3世の廃位
  text: 新軍に反発するイェニチェリが反乱し、セリム3世を廃位した（翌年殺害）。改革派のアレムダル・ムスタファ・パシャが1808年にマフムト2世を擁立した。
  polities: [ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/セリム3世"

- year: 1812
  date: "1812-05-28"
  title: ブカレスト条約
  text: 露土戦争が終結。ナポレオンの侵攻を前にしたロシアは、ベッサラビアを得るだけで講和した。セルビアには自治を与える規定があったが守られなかった。
  polities: [ottoman, russia, moldavia, serbia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブカレスト条約_(1812年)"

- year: 1812
  title: エジプト軍のヒジャーズ奪回
  text: オスマン帝国の命を受けたエジプト総督ムハンマド・アリーの軍が、サウード王国からメディナ（1812）とメッカ（1813）を奪回した。
  polities: [ottoman, saudi]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Ottoman–Wahhabi_war"

- year: 1813
  date: "1813-10-24"
  title: グリスタン（ゴレスターン）条約
  text: ロシア・ペルシア戦争が終結。ペルシアはジョージア、ダゲスタン、アゼルバイジャン北部（ガンジャ、カラバフ、シルヴァン、バクーなど）をロシアに割譲した。
  polities: [russia, persia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ゴレスターン条約"

- year: 1813
  title: 第一次セルビア蜂起の鎮圧
  text: ロシアの支援を失ったセルビアにオスマン軍が侵攻し、カラジョルジェはオーストリアへ逃れた。
  polities: [serbia, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/第一次セルビア蜂起"

- year: 1814
  title: フィリキ・エテリア（友愛協会）の結成
  text: オデッサでギリシア人商人らがギリシア独立を目指す秘密結社を作った。1821年のギリシア独立戦争の母体となる。
  polities: [ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フィリキ・エテリア"

- year: 1815
  date: "1815-04-23"
  title: 第二次セルビア蜂起
  text: ミロシュ・オブレノヴィチが蜂起を指導し、オスマン帝国との交渉でセルビア人の自治を事実上認めさせた（1817年に自治公国、1830年に正式承認）。
  polities: [serbia, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/第二次セルビア蜂起"

# ---------------------------------------------------------------- 1816–1914
# europe.yaml にあるもの（ギリシア独立戦争の開始、ナヴァリノの海戦、ロンドン議定書、エジプト＝トルコ戦争、
# 1840年のロンドン条約、クリミア戦争、パリ条約、スエズ運河、露土戦争、サン＝ステファノ条約、ベルリン会議、
# 英露協商、ボスニア併合とブルガリアの独立、イタリア＝トルコ戦争、第1次・第2次バルカン戦争など）は重複して書かない。

- year: 1817
  date: "1817-11"
  title: ミロシュ・オブレノヴィチがセルビア公となる
  text: 第二次セルビア蜂起の指導者ミロシュが、亡命から戻ったカラジョルジェを暗殺させ、セルビア人の議会で世襲の公に選ばれた。オブレノヴィチ家とカラジョルジェヴィチ家の対立の始まり。
  polities: [serbia, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ミロシュ・オブレノヴィチ"

- year: 1821
  date: "1821-01"
  title: トゥドル・ヴラディミレスクの蜂起
  text: ワラキアでトゥドル・ヴラディミレスクがファナリオティスの支配に反対して蜂起し、ブカレストに入った。フィリキ・エテリアと対立して殺されたが、この後オスマン帝国は在地の貴族から公を選ぶようになった。
  polities: [wallachia, moldavia, ottoman]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Wallachian_uprising_of_1821"

- year: 1822
  date: "1822-04"
  title: キオス島の虐殺
  text: 独立戦争に加わったキオス島をオスマン軍が鎮圧し、住民の多くが殺されるか奴隷として売られた。ドラクロワの絵「キオス島の虐殺」などでヨーロッパの世論がギリシアに同情した。
  polities: [ottoman, greece]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/キオス島の虐殺"

- year: 1824
  date: "1824-04-19"
  title: バイロンがミソロンギで死去
  text: ギリシア独立戦争を支援したイギリスの詩人バイロンが、ミソロンギで熱病のため死去。西欧の親ギリシア主義（フィルヘレニズム）を高めた。
  polities: [greece, britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ジョージ・ゴードン・バイロン"

- year: 1826
  date: "1826-04"
  title: ミソロンギの陥落
  text: エジプトのイブラーヒーム・パシャとオスマン軍の長い包囲の末、ミソロンギの住民が脱出を図って多くが殺された。独立戦争は存続の危機に陥った。
  polities: [greece, ottoman, egypt]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Third_siege_of_Missolonghi"

- year: 1826
  date: "1826-06-15"
  title: イェニチェリの廃止
  text: マフムト2世が反乱を起こしたイェニチェリを砲撃して壊滅させ、軍団を廃止した（「吉事」）。西洋式の新しい軍隊がつくられ、改革への道が開けた。
  polities: [ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/イェニチェリ"

- year: 1828
  date: "1828-02-21"
  title: トルコマンチャーイ条約
  text: 第二次イラン＝ロシア戦争に敗れたガージャール朝が、エレバン・ナヒチェヴァンをロシアに割譲し、治外法権と低い関税を認めた不平等条約。イランが列強に従属していく始まり。
  polities: [persia, russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/トルコマンチャーイ条約"

- year: 1829
  date: "1829-09-14"
  title: アドリアノープル条約
  text: 露土戦争（1828–1829）に敗れたオスマン帝国が、ギリシアの自治、セルビアの自治の拡大、ドナウ二公国のロシアの保護下での自治を認めた。ロシアはドナウ河口と、アナパ・ポティなど黒海東岸、アハルツィヘ・アハルカラキを得た（チェルケス人の地も名目上ロシア領とされたが、抵抗が続いた）。
  polities: [ottoman, russia, greece, serbia, wallachia, moldavia, circassia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アドリアノープル条約"

- year: 1830
  date: "1830-11"
  title: セルビア公国の自治の承認
  text: スルタンのハッティ・シェリフ（勅令）で、セルビアはオスマン帝国の宗主権のもとの自治公国となり、ミロシュの公位の世襲が認められた。1833年には南東の6つの郡が加えられた。
  polities: [serbia, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/セルビア公国"

- year: 1831
  date: "1831-10-09"
  title: カポディストリアスの暗殺
  text: ギリシア総督カポディストリアスが、中央集権的な政策に反発するマニ半島の有力者の一族に暗殺され、ギリシアは内乱状態となった。
  polities: [greece]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/イオアニス・カポディストリアス"

- year: 1832
  date: "1832-07-21"
  title: コンスタンティノープル条約とオソン1世の即位
  text: 列強が選んだバイエルン王子オットー（オソン1世）がギリシア王となり、オスマン帝国との条約で北の国境がアルタ＝ヴォロス線と決まった。国王は1833年にナフプリオに着き、1834年にアテネを首都とした。
  polities: [greece, ottoman, bavaria]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_Constantinople_(1832)"

- year: 1833
  date: "1833-07-08"
  title: ウンキャル・スケレッシ条約
  text: エジプトのムハンマド・アリーに追いつめられたオスマン帝国がロシアに助けを求めて結んだ相互援助条約。秘密条項でダーダネルス海峡をロシア以外の軍艦に閉ざすとされ、イギリス・フランスが警戒した。
  polities: [ottoman, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ウンキャル・スケレッシ条約"

- year: 1834
  title: サモス公国の成立
  text: 独立戦争に加わりながらギリシアから外されたサモス島が、列強の保障のもとでオスマン帝国に貢納するキリスト教徒の自治公国となった。
  polities: [samos, ottoman]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Principality_of_Samos"

- year: 1838
  title: ペルシア軍のヘラート包囲
  text: ガージャール朝のモハンマド・シャーがロシアの後押しでヘラートを10か月包囲したが、イギリスがペルシア湾のハールク島を占領して圧力をかけ、撤退させた。イギリスはこれを機に第一次アフガン戦争を始めた。
  polities: [persia, herat, afghanistan, britain, russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siege_of_Herat_(1837–1838)"

- year: 1839
  date: "1839-11-03"
  title: ギュルハネ勅令（タンジマートの開始）
  text: アブデュルメジト1世が、宗教にかかわらない臣民の生命・財産の保障、公正な徴税と徴兵を約束した。外相レシト・パシャが主導した西欧式の近代化改革「タンジマート（恩恵改革）」の始まり。
  polities: [ottoman]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ギュルハネ勅令"

- year: 1843
  date: "1843-09-03"
  title: ギリシアの9月3日革命
  text: アテネの軍と市民の無血の蜂起で、オソン1世が憲法の制定を受け入れ、バイエルン人の官僚が退けられた。1844年に憲法ができた。
  polities: [greece]
  importance: 3
  source: "https://en.wikipedia.org/wiki/3rd_of_September_1843_Revolution"

- year: 1847
  date: "1847-05-31"
  title: 第2次エルズルム条約
  text: イギリス・ロシアの仲介で、オスマン帝国とガージャール朝が国境を定め直した。シャットゥルアラブ川の東岸ホッラムシャフルはイランに属するとされた。
  polities: [ottoman, persia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Erzurum"

- year: 1848
  date: "1848-06"
  title: ワラキア・モルダヴィアの1848年革命
  text: ブカレストでバルチェスク・ブラティアヌらが農奴解放と憲法を掲げて臨時政府を作ったが、9月にオスマン軍とロシア軍に鎮圧された。指導者の多くは亡命し、のちの二公国合同の担い手となった。
  polities: [wallachia, moldavia, ottoman, russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Wallachian_Revolution_of_1848"

- year: 1848
  title: バーブ教徒の反乱
  text: サイイド・アリー・ムハンマド（バーブ）の新しい教えに従う人々がイラン各地で蜂起した（1848–1852）。ガージャール朝は1850年にバーブを処刑し、反乱を鎮めた。のちのバハーイー教につながる。
  polities: [persia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バーブ教"

- year: 1856
  date: "1856-02-18"
  title: オスマン帝国の改革勅令
  text: クリミア戦争の講和に先立ち、ムスリムと非ムスリムの法の前の平等を改めて約束した勅令。列強の介入を防ぐねらいもあった。
  polities: [ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/改革勅令"

- year: 1857
  date: "1857-03-04"
  title: 英国＝イラン戦争とパリ条約（1857）
  text: 1856年にペルシア軍がヘラートを占領すると、イギリスはペルシア湾岸に出兵した。パリ条約でガージャール朝はヘラートから撤退し、アフガニスタンへの権利を捨てた。
  polities: [persia, herat, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Anglo-Persian_War"

- year: 1858
  date: "1858-05-01"
  title: グラホヴァツの戦い
  text: モンテネグロ軍がグラホヴォでオスマン軍を破った。翌年、列強の委員会がモンテネグロとオスマン帝国の国境を初めて定め、モンテネグロは事実上の国家として扱われるようになった。
  polities: [montenegro, ottoman]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Grahovac"

- year: 1859
  date: "1859-01-24"
  title: クザの二重選出（ルーマニアの誕生）
  text: モルダヴィア（1月17日）とワラキア（1月24日）の議会が、ともにアレクサンドル・ヨアン・クザを公に選び、1858年のパリ協定の「別々の公」という決まりをすり抜けて二公国を合同させた。1862年に統一国家ルーマニアとなった。
  polities: [romania, moldavia, wallachia, ottoman]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アレクサンドル・ヨアン・クザ"

- year: 1860
  date: "1860-07"
  title: レバノン山地の内戦とダマスクスの虐殺
  text: レバノン山地でドルーズ派とマロン派キリスト教徒が衝突し、ダマスクスでもキリスト教徒が多数殺された。フランスが出兵し、1861年にレバノン山地は列強の保障するオスマン帝国内の自治県となった。
  polities: [ottoman, france, lebanon_mutasarrifate]
  importance: 2
  source: "https://en.wikipedia.org/wiki/1860_civil_conflict_in_Mount_Lebanon_and_Damascus"

- year: 1862
  date: "1862-10-23"
  title: オソン1世の退位
  text: 軍の蜂起でギリシア王オソン1世が国を追われた。翌1863年、列強はデンマーク王子をゲオルギオス1世として即位させた。
  polities: [greece]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/オソン1世"

- year: 1864
  date: "1864-05-21"
  title: イオニア諸島のギリシア編入
  text: 新国王ゲオルギオス1世の即位を後押しするため、イギリスが保護国としていたイオニア諸島をギリシアに譲った。ギリシアの初めての領土拡大。
  polities: [greece, britain, ionian_islands]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_London_(1864)"

- year: 1866
  date: "1866-05-10"
  title: カロル1世の即位とルーマニア憲法
  text: クーデタで退位させられたクザに代わり、ホーエンツォレルン家のカロルがルーマニア公に迎えられ、ベルギー憲法にならった憲法が制定された。
  polities: [romania, prussia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/カロル1世"

- year: 1866
  title: クレタ島の大反乱（アルカディ修道院）
  text: クレタのキリスト教徒がギリシアとの統合を求めて蜂起した（1866–1869）。アルカディ修道院に立てこもった人々が火薬庫を爆発させて自決した事件はヨーロッパに衝撃を与えた。
  polities: [ottoman, greece]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Cretan_revolt_(1866–1869)"

- year: 1867
  date: "1867-04"
  title: セルビアの要塞からオスマン軍が撤退
  text: ミハイロ公の外交と列強の圧力で、ベオグラードなどセルビアの要塞に残っていたオスマン軍が撤退し、セルビアは事実上独立した。
  polities: [serbia, ottoman]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ミハイロ・オブレノヴィチ3世"

- year: 1870
  date: "1870-03-11"
  title: ブルガリア総主教代理座（エクザルフ教会）の設置
  text: スルタンの勅令で、ブルガリア人がギリシア人主導のコンスタンティノープル総主教庁から独立した教会を持つことが認められた。ブルガリアの民族運動の大きな一歩で、マケドニアをめぐる争いの始まりにもなった。
  polities: [ottoman, bulgaria]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Bulgarian_Exarchate"

- year: 1873
  date: "1873-05"
  title: ロシアのヒヴァ攻略
  text: カウフマン率いるロシア軍がヒヴァを落とし、ヒヴァ・ハン国はアム川右岸を割譲してロシアの保護国となった。ブハラ（1868）に続き、中央アジアのハン国がロシアに従った。
  polities: [russia, khiva]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヒヴァ・ハン国"

- year: 1875
  date: "1875-07"
  title: ヘルツェゴヴィナ蜂起（東方危機の始まり）
  text: 重税に苦しむヘルツェゴヴィナのキリスト教徒の農民が蜂起し、ボスニアに広がった。1876年にはセルビア・モンテネグロがオスマン帝国に宣戦し、露土戦争へとつながった。
  polities: [ottoman, serbia, montenegro]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Herzegovina_uprising_(1875–1877)"

- year: 1876
  date: "1876-04"
  title: ブルガリアの四月蜂起
  text: ブルガリア人の蜂起をオスマン帝国の非正規軍が鎮圧し、多くの住民が殺された。イギリスのグラッドストンが「ブルガリアの恐怖」を非難し、ヨーロッパの世論がオスマン帝国に厳しくなった。
  polities: [ottoman, bulgaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/四月蜂起"

- year: 1876
  date: "1876-12-23"
  title: ミドハト憲法の発布
  text: 大宰相ミドハト・パシャの主導で、アジア初の近代憲法が発布され、翌年に議会が開かれた。しかしアブデュルハミト2世は露土戦争を理由に1878年に議会を停止し、憲法も事実上停止された。
  polities: [ottoman]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ミドハト憲法"

- year: 1878
  date: "1878-06-04"
  title: キプロス協定
  text: ロシアに対抗してオスマン帝国のアジア領を守ることと引き換えに、イギリスがキプロス島の行政権を得た（主権はオスマン帝国に残る）。スエズ運河への道を守る拠点となった。
  polities: [britain, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/キプロスの歴史"

- year: 1881
  date: "1881-01-24"
  title: ギョクテペの戦い
  text: スコベレフ率いるロシア軍がテケ・トルクメンの要塞ギョクテペを落とし、住民を多数殺した。トルクメン地方がロシアに併合され（1884年メルヴ）、ロシアとイギリス（インド）の勢力圏が近づいた。
  polities: [russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Geok_Tepe_(1881)"

- year: 1881
  date: "1881-07-02"
  title: テッサリア・アルタのギリシア編入
  text: ベルリン会議で約束された国境の修正として、オスマン帝国はコンスタンティノープル協定でテッサリアとアルタ地方をギリシアに譲った。
  polities: [greece, ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Convention_of_Constantinople_(1881)"

- year: 1885
  date: "1885-09-18"
  title: 東ルメリの統合とセルビア＝ブルガリア戦争
  text: プロヴディフの無血の蜂起で東ルメリがブルガリアに統合された。勢力の均衡が崩れることを嫌ったセルビアがブルガリアに攻め込んだが、スリヴニツァの戦いで敗れた。
  polities: [bulgaria, eastern_rumelia, serbia, ottoman]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブルガリア統一"

- year: 1891
  title: タバコ・ボイコット運動
  text: ナーセロッディーン・シャーがイギリス人にタバコの専売権を与えたことに対し、ウラマー（宗教指導者）の呼びかけで全国的な喫煙ボイコットが起こり、利権は撤回された（1892）。イランの民族運動の始まりとされる。
  polities: [persia, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/タバコ・ボイコット運動"

- year: 1894
  title: アルメニア人の虐殺（ハミディエ虐殺）
  text: 東アナトリアでアルメニア人の抵抗をきっかけに、1894–1896年にかけてオスマン帝国の軍やクルド人の非正規騎兵がアルメニア人を多数殺した。列強の非難を招いたが、介入は行われなかった。
  polities: [ottoman]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Hamidian_massacres"

- year: 1897
  date: "1897-04"
  title: 希土戦争（ギリシア＝トルコ戦争）
  text: クレタの反乱を支援したギリシアがオスマン帝国と戦い、30日ほどで大敗した。しかし列強が介入し、クレタは1898年にオスマン帝国の宗主権下の自治国となった。
  polities: [greece, ottoman, crete_state]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/希土戦争_(1897年)"

- year: 1902
  date: "1902-01-15"
  title: イブン・サウードのリヤド奪回
  text: クウェートに亡命していたサウード家のアブドゥルアズィーズ（イブン・サウード）が、少数の部下とリヤドのラシード家の守備隊を襲って町を奪い返した。のちのサウジアラビア王国の出発点。
  polities: [saudi, rashidi, kuwait]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アブドゥルアズィーズ・イブン・サウード"

- year: 1903
  date: "1903-06-11"
  title: セルビアの五月クーデタ
  text: 将校団がアレクサンダル・オブレノヴィチ王と王妃を殺し、カラジョルジェヴィチ家のペータル1世を王に迎えた。セルビアはオーストリア＝ハンガリー寄りからロシア寄りへと転じた。
  polities: [serbia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/May_Overthrow"

- year: 1903
  date: "1903-08-02"
  title: イリンデン蜂起
  text: 内部マケドニア革命組織（IMRO）がマケドニアでオスマン帝国に対して蜂起し、クルシェヴォに共和国を宣言したが、まもなく鎮圧された。列強はマケドニアの改革（ミュルツシュテーク綱領）をオスマン帝国に求めた。
  polities: [ottoman, bulgaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/イリンデン蜂起"

- year: 1906
  date: "1906-08"
  title: イラン立憲革命（憲法と議会）
  text: 1905年から専制と外国への利権譲渡に抗議する運動が広がり、1906年にモザッファロッディーン・シャーが議会の開設を認め、憲法が発布された。1908年の国王の反撃、1911年のロシアの介入で革命は挫折した。
  polities: [persia, russia, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/イラン立憲革命"

- year: 1908
  date: "1908-07-24"
  title: 青年トルコ人革命
  text: マケドニアの軍の将校を中心とする「統一と進歩委員会」が蜂起し、アブデュルハミト2世にミドハト憲法の復活を認めさせた（第二次立憲政）。翌年の反革命（3月31日事件）ののちスルタンは廃位された。
  polities: [ottoman]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/青年トルコ人革命"

- year: 1912
  date: "1912-11-28"
  title: アルバニアの独立宣言
  text: 第一次バルカン戦争でセルビア・モンテネグロ・ギリシアの軍がアルバニア人の地に進むなか、イスマイル・ケマルらがヴロラで独立を宣言した。列強は1913年のロンドン大使会議でアルバニアの独立を認めた。
  polities: [albania, ottoman, serbia, montenegro, greece]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アルバニア独立宣言"

- year: 1913
  date: "1913-01-23"
  title: オスマン帝国のクーデタ（大宰相府襲撃事件）
  text: エンヴェルら統一と進歩委員会の将校が大宰相府を襲い、エディルネの放棄に傾いた政府を倒した。以後エンヴェル・タラート・ジェマルの3人のパシャが実権を握り、1914年にドイツと同盟して大戦に加わった。
  polities: [ottoman]
  importance: 3
  source: "https://en.wikipedia.org/wiki/1913_Ottoman_coup_d'état"

- year: 1913
  date: "1913-12-14"
  title: クレタのギリシア統合
  text: クレタ自治国の議会がたびたび宣言してきたギリシアとの統合（エノシス）が、ロンドン条約でのオスマン帝国の権利放棄を受けて正式に実現した。
  polities: [greece, crete_state]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Cretan_State"
