# 北ドイツの出来事（担当 BN）。europe.yaml にあるものは書かない。

- year: 1664
  title: マインツ大司教がエアフルトを制圧
  text: 自立していたエアフルト市を、マインツ大司教がフランス軍の助けを借りて服属させた。
  polities: [mainz]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Reduktion_Erfurts"
- year: 1666
  title: クレーヴェ条約
  text: ユーリヒ＝クレーヴェ継承問題が最終的に決着。クレーヴェ・マルク・ラーヴェンスベルクはブランデンブルク、ユーリヒ・ベルクはプファルツ＝ノイブルク家の領地と確定した。
  polities: [prussia, palatinate_neuburg]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Jülich-Klevischer_Erbfolgestreit"
- year: 1667
  title: オルデンブルク伯家の断絶
  text: アントン・ギュンター伯が死去し、オルデンブルクとデルメンホルストはデンマーク王の領地となった。
  polities: [oldenburg, denmark]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Anton_Günther_(Oldenburg)"
- year: 1675
  date: "1675-06-28"
  title: フェールベリンの戦い
  text: ブランデンブルク選帝侯（大選帝侯）の軍が、侵入したスウェーデン軍を破る。ブランデンブルクの軍事力が知られるようになった。
  polities: [prussia, sweden]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フェールベリンの戦い"
- year: 1679
  title: サン＝ジェルマン条約
  text: ルイ14世の圧力で、ブランデンブルクは占領していたスウェーデン領ポンメルンのほぼ全部をスウェーデンに返還した。
  polities: [prussia, sweden, france]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Saint-Germain-en-Laye_(1679)"
- year: 1680
  title: マグデブルクがブランデンブルク領に
  text: 管理者アウグストの死去により、ウェストファリア条約の取り決めどおりマグデブルク大司教領がブランデンブルクのものとなった。
  polities: [prussia, magdeburg]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/マクデブルク大司教領"
- year: 1685
  date: "1685-10-29"
  title: ポツダム勅令
  text: ナントの勅令の廃止を受けて、大選帝侯がフランスのユグノー（新教徒）をブランデンブルクに招いた。約2万人が移住し、ベルリンの産業の発展を助けた。
  polities: [prussia, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ポツダム勅令"
- year: 1692
  title: ハノーファーが選帝侯国に
  text: 皇帝レオポルト1世が、大トルコ戦争への協力の見返りとしてカレンベルク侯エルンスト・アウグストに9番目の選帝侯位を与えた（帝国議会の承認は1708年）。
  polities: [hanover, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ハノーファー選帝侯領"
- year: 1697
  title: ザクセン選帝侯がポーランド王に
  text: ザクセン選帝侯フリードリヒ・アウグスト1世（アウグスト強健王）がカトリックに改宗してポーランド王アウグスト2世に選ばれ、ザクセン＝ポーランドの同君連合が始まった。
  polities: [saxony, poland_lithuania]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アウグスト2世_(ポーランド王)"
- year: 1701
  title: ハンブルク協定（メクレンブルクの分割）
  text: ギュストロー系断絶後の継承争いが決着し、メクレンブルク＝シュヴェリーンとメクレンブルク＝シュトレーリッツの二つの公国に分かれた。
  polities: [mecklenburg, mecklenburg_strelitz]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Hamburger_Vergleich"
- year: 1702
  title: プロイセンがオラニエ家の遺領を継承
  text: イギリス王ウィリアム3世（オラニエ公）の死後、プロイセン王がその母方の継承権によりリンゲン・メールスなどを得た。1707年にはテクレンブルク伯領も獲得。
  polities: [prussia]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Oranische_Erbschaft"
- year: 1705
  title: ハノーファーとリューネブルク（ツェレ）の統合
  text: ツェレ公ゲオルク・ヴィルヘルムが死去し、リューネブルク侯領は甥で娘婿のハノーファー選帝侯ゲオルク・ルートヴィヒに受け継がれた。
  polities: [hanover, celle]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ゲオルク・ヴィルヘルム_(ブラウンシュヴァイク＝リューネブルク公)"
- year: 1709
  title: マイセン磁器の誕生
  text: アウグスト強健王のもとで錬金術師ベトガーがヨーロッパで初めて硬質磁器の製法を発見し、翌1710年にマイセンに王立磁器工場が作られた。
  polities: [saxony]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/マイセン磁器"
- year: 1712
  title: デンマークがブレーメン＝フェルデンを占領
  text: 大北方戦争で、デンマーク軍がスウェーデン領のブレーメン公領・フェルデン公領を占領した。1715年にハノーファーに売却される。
  polities: [denmark, sweden, hanover]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Herzogtümer_Bremen_und_Verden"
- year: 1713
  title: 兵隊王フリードリヒ・ヴィルヘルム1世の即位
  text: 軍隊を大幅に増やし、倹約と官僚制の整備で「軍国プロイセン」の基礎を築いた。
  polities: [prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フリードリヒ・ヴィルヘルム1世_(プロイセン王)"
- year: 1719
  title: ストックホルム条約（スウェーデン＝ハノーファー）
  text: スウェーデンがブレーメン＝フェルデンをハノーファーに正式に割譲した。
  polities: [sweden, hanover]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ストックホルム条約_(1719年)"
- year: 1720
  title: ストックホルム条約（スウェーデン＝プロイセン）
  text: スウェーデンがポンメルンのペーネ川以南とシュテッティン、ウーゼドム・ヴォリン島をプロイセンに割譲した。ペーネ川以北とリューゲン島はスウェーデン領に残った。
  polities: [sweden, prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ストックホルム条約_(1720年)"
- year: 1720
  title: フレデリクスボー条約
  text: スウェーデンとデンマークが講和。デンマークは大北方戦争中に占領したゴットルプ家のシュレースヴィヒ領を併合した。
  polities: [denmark, sweden, holstein_gottorp]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Frederiksborg"
- year: 1737
  title: ゲッティンゲン大学の開学
  text: ハノーファー選帝侯（イギリス王ジョージ2世）が創立。啓蒙時代のドイツを代表する大学となった。
  polities: [hanover]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ゲオルク・アウグスト大学ゲッティンゲン"
- year: 1744
  title: プロイセンが東フリースラントを併合
  text: ツィルクセナ家の断絶により、継承権を持っていたプロイセンが東フリースラントとエムデン港を得た。
  polities: [prussia, east_frisia]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Ostfriesland"
- year: 1745
  title: サンスーシ宮殿の建設はじまる
  text: フリードリヒ2世がポツダムにロココ様式の夏の宮殿を建て（1747年完成）、ヴォルテールらを招いた。
  polities: [prussia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/サンスーシ宮殿"
- year: 1756
  title: プロイセン軍のザクセン侵攻
  text: フリードリヒ2世が先手を打ってザクセンに侵攻し、ピルナでザクセン軍を降伏させた。七年戦争の始まり。
  polities: [prussia, saxony]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/七年戦争"
- year: 1757
  date: "1757-11-05"
  title: ロスバッハの戦い
  text: フリードリヒ2世が、ザクセン南部のロスバッハでフランス・帝国軍の連合軍に大勝した。
  polities: [prussia, france, hre]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ロスバッハの戦い"
- year: 1759
  date: "1759-08-12"
  title: クーネルスドルフの戦い
  text: フランクフルト（オーダー）近郊で、プロイセン軍がロシア・オーストリア軍に大敗。フリードリヒ2世は一時自殺を考えたとされる。
  polities: [prussia, russia, habsburg]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/クーネルスドルフの戦い"
- year: 1760
  title: ロシア・オーストリア軍がベルリンを一時占領
  polities: [prussia, russia, habsburg]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Raid_on_Berlin_(1760)"
- year: 1762
  title: 「ブランデンブルク家の奇跡」
  text: ロシアのエリザヴェータ女帝が死去し、フリードリヒ2世を崇拝するピョートル3世がプロイセンと講和。窮地のプロイセンは救われた。
  polities: [prussia, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブランデンブルク家の奇跡"
- year: 1773
  title: ツァールスコエ・セロー条約（ホルシュタインとオルデンブルクの交換）
  text: ロシア大公パーヴェルがゴットルプ家のホルシュタイン領をデンマークに譲り、代わりにオルデンブルクを得て一族に与えた。ホルシュタイン全体がデンマーク王の領地となった。
  polities: [holstein_gottorp, denmark, oldenburg, russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Tsarskoye_Selo_(1773)"
- year: 1785
  title: ドイツ諸侯同盟
  text: バイエルン継承をねらうヨーゼフ2世に対抗して、フリードリヒ2世がザクセン・ハノーファーなどと同盟を結んだ。
  polities: [prussia, saxony, hanover, habsburg]
  importance: 3
  source: "https://de.wikipedia.org/wiki/Deutscher_Fürstenbund"
- year: 1795
  date: "1795-04-05"
  title: バーゼルの和約（プロイセン・フランス）
  text: プロイセンが対仏大同盟から離脱し、ライン左岸のフランス占領を事実上認めた。北ドイツは中立地帯となった。
  polities: [prussia, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バーゼルの和約"
- year: 1803
  title: フランス軍のハノーファー占領
  text: 英仏戦争の再開を受け、ナポレオンがイギリス王の領地ハノーファーを占領した（アルトレンブルク協定）。
  polities: [france, hanover, britain]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Konvention_von_Artlenburg"
- year: 1806
  date: "1806-10-14"
  title: イエナ・アウエルシュテットの戦い
  text: プロイセン軍がナポレオンに大敗。ナポレオンはベルリンに入城し、11月にベルリンで大陸封鎖令を出した。
  polities: [prussia, france, saxony]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/イエナ・アウエルシュテットの戦い"
- year: 1806
  date: "1806-12-11"
  title: ポーゼン条約（ザクセン王国の成立）
  text: ザクセンがナポレオンと講和してライン同盟に加わり、王国に昇格した。
  polities: [saxony, france, rhine_confederation]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_Posen"
- year: 1807
  title: ヴェストファーレン王国の成立
  text: ナポレオンがプロイセンのエルベ川以西の領土、ヘッセン＝カッセル、ブラウンシュヴァイクなどを合わせ、弟ジェロームを王とする王国を作った。首都はカッセル。
  polities: [westphalia_kingdom, prussia, hesse_kassel, brunswick, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヴェストファーレン王国"
- year: 1807
  date: "1807-10-09"
  title: シュタインの十月勅令（農民解放）
  text: プロイセンで世襲隷農制の廃止を定めた。シュタイン・ハルデンベルクの改革の始まりで、都市自治・軍制改革などが続いた。
  polities: [prussia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/プロイセン改革"
- year: 1807
  title: フィヒテ「ドイツ国民に告ぐ」
  text: フランス占領下のベルリンで哲学者フィヒテが連続講演を行い（1807–08年）、教育による国民の再生を訴えた。
  polities: [prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ドイツ国民に告ぐ"
- year: 1810
  title: ベルリン大学の創設
  text: フンボルトの構想により創設され、研究と教育の一致を掲げる近代大学の模範となった。
  polities: [prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ベルリン・フンボルト大学"
- year: 1810
  date: "1810-12-13"
  title: フランスが北西ドイツを併合
  text: 大陸封鎖を徹底するため、ナポレオンがハンブルク・ブレーメン・リューベック、オルデンブルク、ヴェストファーレン王国とベルク大公国の北部などを元老院議決でフランス帝国に併合した。
  polities: [france, hamburg, bremen, lubeck, oldenburg, westphalia_kingdom, berg]
  importance: 2
  source: "https://de.wikipedia.org/wiki/Hanseatische_Departements"
- year: 1813
  date: "1813-03-17"
  title: プロイセンの対仏宣戦（解放戦争）
  text: ロシアとカリシュ条約を結んだプロイセンがフランスに宣戦し、国王は「わが国民に告ぐ」を発した。
  polities: [prussia, russia, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/解放戦争_(ドイツ)"
- year: 1813
  title: ヴェストファーレン王国とベルク大公国の崩壊
  text: ライプツィヒの戦いの後、ナポレオンの衛星国は崩れ、ハノーファー・ブラウンシュヴァイク・ヘッセン＝カッセルなどの旧君主が戻った。
  polities: [westphalia_kingdom, berg, hanover, brunswick, hesse_kassel, prussia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヴェストファーレン王国"
- year: 1814
  title: ハノーファー王国の成立
  text: ハノーファー選帝侯国が王国に昇格した（王はイギリス王ジョージ3世）。
  polities: [hanover, britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ハノーファー王国"
- year: 1815
  title: ザクセンの分割
  text: ウィーン会議で、ナポレオン側に残ったザクセンは国土の北半分（約6割）をプロイセンに割譲した。プロイセンはさらにラインラント・ヴェストファーレン・スウェーデン領ポンメルンを得た。
  polities: [saxony, prussia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ウィーン議定書"
