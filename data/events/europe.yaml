- year: 1648
  date: "1648-10-24"
  title: ウェストファリア条約
  text: 三十年戦争が終結。スイスとオランダの独立が正式に認められ、帝国諸侯はほぼ完全な領邦主権を得た。フランスはアルザスの大半を、スウェーデンは西ポンメルンなどを獲得。
  polities: [hre, france, sweden, habsburg, netherlands, switzerland]
  importance: 1
