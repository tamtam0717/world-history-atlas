- year: 1659
  date: "1659-11-07"
  title: ピレネー条約
  text: フランス・スペイン戦争が終結。フランスはルシヨンとアルトワなどを獲得し、ルイ14世とスペイン王女マリー＝テレーズの結婚が決まった。
