  polities: [sri_lanka, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/スリランカ"
  images:
    - file: "SL Independence.jpg"
      caption: "自治の始まりを記念する最初の議会の開会式（コロンボの独立広場）"
    - file: "First Cabinet of Ceylon.jpg"
      caption: "セナナヤケ首相（前列中央）の最初の内閣（1947年）"

- year: 1948
  date: "1948-09"
  title: インドのハイデラバード併合（ポロ作戦）
  text: 独立を保とうとしたニザームのハイデラバードにインド軍が侵攻し、5日でニザームを降伏させて併合した。前後の混乱で多くの住民が犠牲になった。
  polities: [india, hyderabad]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ポロ作戦"

- year: 1954
