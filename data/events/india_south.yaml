  text: モルディブがイギリスの保護から離れて独立した。1968年に共和制に移った。
  polities: [maldives, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/モルディブ"

- year: 1972
  title: セイロンがスリランカ共和国となる
  text: 新しい憲法で共和制に移り、国名をスリランカとした。仏教に特別な地位を与えた。
  polities: [sri_lanka]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/スリランカ"

- year: 1983
  date: "1983-07"
  title: 「黒い7月」とスリランカ内戦の始まり
  text: LTTE（タミル・イーラム解放のトラ）の兵士殺害をきっかけに、コロンボなどでタミル人が襲われる暴動が起き、多数が殺された。これを機に、北部・東部の分離独立を求めるタミル人の武装組織と政府軍の内戦が本格化した。
  polities: [sri_lanka, tamil_eelam]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/スリランカ内戦"

- year: 1987
  title: インド・スリランカ協定とインド平和維持軍
  text: インドのラジーヴ・ガンディー首相とスリランカのジャヤワルダナ大統領が協定を結び、インド平和維持軍が北部・東部に送られた。しかしLTTEと戦うことになり、1990年に撤退した。
  polities: [india, sri_lanka, tamil_eelam]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Indian_Peace_Keeping_Force"

- year: 1991
  date: "1991-05-21"
  title: ラジーヴ・ガンディーの暗殺
  text: インドの前首相ラジーヴ・ガンディーが、タミル・ナードゥ州での選挙運動中にLTTEの自爆攻撃で殺された。
  polities: [india, tamil_eelam]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ラジーヴ・ガンディー"

- year: 2008
  date: "2008-11-26"
  title: ムンバイ同時多発テロ
  text: パキスタンのイスラーム過激派組織の戦闘員がムンバイの駅やホテルなどを襲い、160人以上が死亡した。
  polities: [india]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ムンバイ同時多発テロ"

- year: 2009
  date: "2009-05"
  title: スリランカ内戦の終結
  text: 政府軍がLTTEの最後の拠点を攻め落とし、指導者プラバーカランが戦死して、26年に及ぶ内戦が終わった。最後の戦闘では多くの民間人が犠牲になり、国連などが人権侵害の調査を求めた。
  polities: [sri_lanka, tamil_eelam]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/スリランカ内戦"

- year: 2014
  date: "2014-06-02"
  title: テランガーナ州の成立
  text: アーンドラ・プラデーシュ州の北西部（旧ハイデラバード藩王国の地）が分かれて、テランガーナ州ができた。
  polities: [india]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Telangana"

- year: 2022
  title: スリランカの経済危機と大統領の辞任
  text: 外貨が尽きて燃料・食料・薬が不足し、スリランカは対外債務の支払いを止めた。大統領府を囲む大規模な抗議（アラガラヤ）でゴーターバヤ・ラージャパクサ大統領が国外に逃れて辞任した。
  polities: [sri_lanka]
  importance: 3
  source: "https://en.wikipedia.org/wiki/2022_Sri_Lankan_protests"

