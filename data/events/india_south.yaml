  text: 州再編法で、インドの州が主に言語に沿って分け直された。テルグ語のアーンドラ州（1953）に続き、マラヤーラム語のケーララ州、カンナダ語のマイソール州（1973年からカルナータカ州）などができた。1960年にはボンベイ州がマハーラーシュトラ州とグジャラート州に分かれた。
  polities: [india]
  importance: 2
  source: "https://en.wikipedia.org/wiki/States_Reorganisation_Act,_1956"

- year: 1956
  title: シンハラ語公用語法
  text: バンダラナイケ政権が、それまでの英語に代えてシンハラ語だけを公用語とする法を定めた。タミル人の強い反発を招き、民族対立のもとになった。
  polities: [sri_lanka]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Sinhala_Only_Act"

- year: 1957
  title: ケーララで共産党政権
  text: ケーララ州の選挙でインド共産党が勝ち、E・M・S・ナンブーディリッパードが首相となった。選挙で生まれた世界でも早い時期の共産党政権の一つ。
  polities: [india]
  importance: 3
  source: "https://en.wikipedia.org/wiki/E._M._S._Namboodiripad"

- year: 1960
  date: "1960-07"
  title: 世界最初の女性首相
  text: 暗殺されたバンダラナイケ首相の妻シリマヴォ・バンダラナイケがセイロンの首相となった。世界で最初の女性首相。
  polities: [sri_lanka]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/シリマヴォ・バンダラナイケ"

- year: 1961
  date: "1961-12-19"
  title: インドのゴア併合
