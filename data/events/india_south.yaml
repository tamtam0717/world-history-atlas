# S3 南インド・スリランカ・モルディブの出来事（1648–2025）

- year: 1656
  title: シヴァージーがジャーヴリーを奪う
  text: ビジャープル王国の武将の子シヴァージーが、西ガーツ山脈のジャーヴリーの領主を倒し、ライガドなどの城を手に入れて自立の基盤を固めた。
  polities: [maratha, bijapur]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/シヴァージー"

- year: 1656
  date: "1656-05"
  title: オランダがコロンボを落とす
  text: オランダ東インド会社がキャンディ王ラージャシンハ2世と結んでポルトガルのコロンボを攻め落とした。1658年にはジャフナ・マンナールも落とし、ポルトガル人をセイロンから追った。
  polities: [netherlands, portugal, kandy]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Dutch_Ceylon"

- year: 1659
  title: プラタープガドの戦い
  text: シヴァージーが、討伐に来たビジャープル王国の将アフザル・ハーンを会見の場で倒し、その軍を破った。
  polities: [maratha, bijapur]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Pratapgarh"

- year: 1661
  title: ボンベイがイギリスに渡る
  text: ポルトガル王女キャサリンがイギリス王チャールズ2世と結婚し、持参金としてボンベイ（ムンバイ）とタンジールがイギリスに与えられた（1665年に引き渡し）。1668年に東インド会社に貸し与えられ、のち西インドの拠点となった。
  polities: [britain, portugal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ムンバイ"

- year: 1663
  title: オランダがコーチンを奪う
  text: オランダ東インド会社がポルトガルからコーチン・カンナノールなどマラバール海岸の拠点を奪い、胡椒の貿易を握った。
  polities: [netherlands, portugal, cochin]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Dutch_Malabar"

- year: 1664
  title: シヴァージーがスーラトを襲う
  text: シヴァージーがムガル帝国の最大の港スーラトを襲って略奪した（1670年にも）。アウラングゼーブはラージプートの将ジャイ・シングを送り、1665年のプランダル条約でシヴァージーを従わせた。
  polities: [maratha, mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Surat"

- year: 1666
  title: シヴァージーのアーグラ脱出
  text: アーグラの宮廷に呼ばれたシヴァージーは冷遇されて軟禁されたが、果物かごに隠れて脱出し、デカンに戻ってまもなく失った城を取り戻した。
  polities: [maratha, mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Shivaji"

- year: 1674
  date: "1674-06-06"
  title: シヴァージーの即位（マラーター王国）
  text: シヴァージーがライガド城でヒンドゥー教の儀式に従って王（チャトラパティ）として即位した。ムガル帝国に抵抗するヒンドゥー教徒の王国として、のちのマラーター同盟のもとになった。
  polities: [maratha]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/マラーター王国"
  images:
    - file: "The Coronation Durbar with over 100 characters depicted in attendance.jpg"
      caption: "ドゥランダル「シヴァージーの戴冠式」（20世紀の絵）"
    - file: "Shivaji British Museum.jpg"
      caption: "シヴァージーの肖像（1680年代、大英博物館）"

- year: 1674
  title: フランスがポンディシェリを開く
  text: フランス東インド会社のフランソワ・マルタンが、ビジャープル王国の長官から得たポンディシェリに商館を築いた。のちフランス領インドの中心となった。
  polities: [france, bijapur]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ポンディシェリ"

- year: 1677
  title: シヴァージーの南インド遠征
  text: シヴァージーがゴールコンダ王国と結んで南に遠征し、ジンジー・ヴェールールを奪った。のち異母弟エーコージーのタンジャーヴール王国とも争った。
  polities: [maratha, golconda, thanjavur]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Gingee_Fort"

- year: 1686
  date: "1686-09"
  title: アウラングゼーブがビジャープル王国を滅ぼす
  text: デカンに移ったアウラングゼーブが、1年あまりの包囲でビジャープルを落とし、アーディル・シャーヒー朝を滅ぼした。
  polities: [mughal, bijapur]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アーディル・シャーヒー朝"

- year: 1687
  date: "1687-09"
  title: ゴールコンダ王国の滅亡
  text: アウラングゼーブがゴールコンダ城を8か月の包囲の末に落とし、クトゥブ・シャーヒー朝を滅ぼした。ムガル帝国の領土は南インドのほぼ全体に広がり、最大となった。
  polities: [mughal, golconda]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/クトゥブ・シャーヒー朝"

- year: 1689
  title: マラーター王サンバージーの処刑
  text: シヴァージーの子サンバージーがムガル軍に捕らえられて処刑され、都ライガドも落ちた。弟ラージャーラームは南のジンジーに逃れ、マラーターはゲリラ戦で抵抗を続けた（マラーター独立戦争、1681–1707）。
  polities: [maratha, mughal]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Mughal–Maratha_Wars"

- year: 1698
  date: "1698-01"
  title: ジンジーの陥落
  text: ムガル軍が8年に及ぶ包囲の末に南インドのジンジー城を落とした。ラージャーラームはデカンに戻って抵抗を続けた。長い戦いはムガル帝国の財政を大きく傷めた。
  polities: [mughal, maratha]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siege_of_Jinji"

- year: 1707
  title: シャーフーの帰還
  text: アウラングゼーブの死の後、ムガルの捕囚だったサンバージーの子シャーフーが解放されてデカンに戻り、ターラーバーイーとの争いに勝ってマラーター王となった。
  polities: [maratha, mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Shahu_I"

- year: 1713
  title: バーラージー・ヴィシュヴァナートが宰相（ペーシュワー）となる
  text: シャーフー王の宰相（ペーシュワー）が実権を握るようになり、のち宰相の地位はその家の世襲となった。1719年にはムガル皇帝からデカンでの徴税権（チャウト・サルデーシュムキー）を認めさせた。
  polities: [maratha, mughal]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Balaji_Vishwanath"

- year: 1724
  title: ニザーム王国（ハイデラバード）の自立
  text: ムガル帝国のデカン総督ニザーム・アルムルクが、皇帝の送った軍をシャカル・ケーダの戦いで破り、事実上自立した。ハイデラバードを都とするニザーム王国は1948年まで続いた。
  polities: [hyderabad, mughal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ニザーム王国"

- year: 1736
  title: マドゥライ・ナーヤカ朝の滅亡
  text: カーナティック太守の一族チャンダー・サーヒブが、マドゥライのナーヤカ朝の女王ミーナークシを捕らえて国を奪った。
  polities: [carnatic, madurai]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Madurai_Nayak_dynasty"

- year: 1739
  title: マラーターがバセインを奪う
  text: マラーター軍がポルトガルの北部州の中心バセイン（ヴァサイ）を攻め落とし、ボンベイの北の海岸地帯をポルトガルから奪った。
  polities: [maratha, portugal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Vasai"

- year: 1741
  date: "1741-08"
  title: コラチェルの戦い
  text: トラヴァンコール王マールターンダ・ヴァルマがオランダ東インド会社の軍を破った。アジアの国がヨーロッパの軍に勝った例として知られる。オランダの捕虜の将デ・ラノワはトラヴァンコール軍の近代化に仕えた。
  polities: [travancore, netherlands]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Battle_of_Colachel"

- year: 1744
  title: カーナティック戦争（1744–63）
  text: オーストリア継承戦争・七年戦争と連動して、南インドのカーナティック地方でイギリスとフランスの東インド会社が、太守やニザームの継承争いに介入して3度戦った。フランスのデュプレクスが優位に立ったが、最後はイギリスが勝ち、インドでのフランスの勢力は衰えた。
  polities: [britain, france, carnatic, hyderabad]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/カーナティック戦争"
  images:
    - file: "Bombardement de Pondichery en 1748 par la flotte anglaise.jpg"
      caption: "イギリス艦隊のポンディシェリ砲撃（1748年。1756年の版画）"
    - file: "Dupleix meeting the Soudhabar of the Deccan.jpg"
      caption: "ド・ヌヴィル「デカンの太守ムザッファル・ジャングと会うデュプレクス」（19世紀）"

- year: 1746
  date: "1746-09"
  title: フランス軍がマドラスを占領
  text: フランス軍（ラ・ブルドネ）がイギリスのマドラスを占領した。アーヘンの和約（1748）でルイブールと交換に返された。カーナティック太守の軍はアディヤールの戦いでフランス軍に敗れた。
  polities: [france, britain, carnatic]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Madras"

- year: 1751
  title: クライヴのアルコット防衛
  text: イギリス東インド会社の書記だったクライヴが、カーナティック太守の都アルコットを奪って守り抜き、フランスが支持するチャンダー・サーヒブの側に打撃を与えた。
  polities: [britain, france, carnatic]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Siege_of_Arcot"

- year: 1752
  title: マラバールの軍がモルディブの首都を占領
  text: マラバール海岸のカンナノールのアラッカル家の軍がモルディブのマーレを占領し、スルタンを連れ去った。モルディブの人々は数か月で占領軍を追い出した。
  polities: [maldives, arakkal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/History_of_the_Maldives"

- year: 1760
  date: "1760-01-22"
  title: ヴァンディヴァッシュの戦い
  text: イギリス軍（クート）がフランス軍（ラリー）をカーナティックのヴァンディヴァッシュで破り、翌1761年1月にポンディシェリが落ちた。インドでの英仏の争いの決着がついた。
  polities: [britain, france]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Battle_of_Wandiwash"

- year: 1760
  title: ウドギールの戦い
  text: 宰相の従兄弟サダーシヴラーオ・バーウの率いるマラーター軍がニザームの軍を破り、アフマドナガル・ビジャープルなどを割譲させた。マラーター同盟の勢いは最盛期を迎えたが、翌年パーニーパットで大敗した。
  polities: [maratha, hyderabad]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Udgir"

- year: 1761
  title: ハイダル・アリーがマイソールの実権を握る
  text: マイソール王国の軍人ハイダル・アリーが大臣を追って実権を握った。フランス人の将校を使って軍を近代化し、ケラディ（1763）・マラバール（1766）などを征服して南インド最強の国にした。
  polities: [mysore, keladi, calicut]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ハイダル・アリー"

- year: 1766
  title: 北サルカールがイギリスに渡る
  text: ムガル皇帝の勅許とニザームとの条約で、アーンドラ海岸の北サルカールがイギリス東インド会社のものになった。ベンガルとマドラスを海岸沿いに結ぶ地だった。
  polities: [britain, hyderabad, mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Northern_Circars"

- year: 1766
  title: キャンディ王国が海岸地帯をオランダに譲る
  text: オランダ軍にキャンディの都を攻め落とされたキャンディ王が、条約でセイロン島の海岸地帯をすべてオランダに譲った。王国は海への出口を失った。
  polities: [kandy, netherlands]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Kingdom_of_Kandy"

- year: 1767
  title: マイソール戦争（1767–99）
  text: ハイダル・アリーと子のティプー・スルタンのマイソール王国が、イギリス東インド会社と4回戦った。第1次（1767–69）はマドラスに迫ったマイソールが有利な講和を結び、第2次（1780–84）もイギリスを苦しめた。
  polities: [mysore, britain, hyderabad, maratha]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/マイソール戦争"
  images:
    - file: "The definitive treaty by the hostage princes into the hands of Lord Cornwallis (cropped).jpg"
      caption: "第3次マイソール戦争の講和で人質となったティプーの王子たちとコーンウォリス（1792年。1793年の版画）"
    - file: "Tipu Sultan's Tiger.JPG"
      caption: "「ティプーの虎」（イギリス兵を襲う虎のからくり人形、ヴィクトリア＆アルバート博物館）"

- year: 1775
  title: マラーター戦争（1775–1818）
  text: 宰相の座を追われたラグナート・ラーオがイギリス（ボンベイ）を頼ったことから第1次マラーター戦争が始まった。マラーター側は1779年にワドガーオンでイギリス軍を降伏させ、1782年のサルバイ条約で戦前の状態に戻して講和した。
  polities: [maratha, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/マラーター戦争"
  images:
    - file: "Battle of Assaye.jpeg"
      caption: "アッサイェの戦い（第2次マラーター戦争、1803年。1815年の版画）"
    - file: "Col Wellesley leading the 78th Regiment at Assaye.jpg"
      caption: "アッサイェで第78連隊を率いるウェルズリー（のちのウェリントン公）（1852年の版画）"

- year: 1780
  title: 第2次マイソール戦争
  text: ハイダル・アリーがカーナティックに侵入し、ポッリルールの戦いでイギリス軍を全滅させた。ハイダルは1782年に陣中で病死し、子のティプー・スルタンが戦いを続けて1784年のマンガロール条約で講和した。
  polities: [mysore, britain, carnatic]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Second_Anglo-Mysore_War"

- year: 1792
  title: 第3次マイソール戦争とシュリーランガパトナ条約
  text: ティプー・スルタンのトラヴァンコール攻撃（1789）から、イギリス・ニザーム・マラーターの連合とマイソールの戦争となった。総督コーンウォリスが都シュリーランガパトナに迫り、ティプーは領土の半分（マラバール・バーラーマハル・ディンディグルなど）を割譲した。
  polities: [mysore, britain, hyderabad, maratha, travancore]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Third_Anglo-Mysore_War"

- year: 1795
  title: ハルダの戦い
  text: マラーター同盟の諸侯が最後に力を合わせてニザームの軍を破った。ニザームはこの後イギリスに頼り、1798年に軍事保護条約を結んだ。
  polities: [maratha, hyderabad]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Kharda"

- year: 1796
  date: "1796-02"
  title: イギリスがオランダ領セイロンを占領
  text: フランス革命軍がオランダを占領してバタヴィア共和国ができたことから、イギリスがオランダの海外領を押さえた。1795年のトリンコマリー・ジャフナに続き、1796年2月にコロンボが降伏した。1802年のアミアンの和約でセイロンはイギリス領と認められた。
  polities: [britain, netherlands]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Invasion_of_Ceylon_(1795)"

- year: 1798
  title: ハイデラバードの軍事保護条約
  text: 総督ウェルズリーが、ニザームにフランス人の軍を解散させ、イギリスの軍を国内に置いてその費用を払わせる軍事保護条約（軍事保護同盟）を結ばせた。インドの諸国はこの方式で次々にイギリスの保護下に入り、藩王国となった。
  polities: [britain, hyderabad]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Subsidiary_alliance"

- year: 1799
  date: "1799-05-04"
  title: 第4次マイソール戦争・ティプー・スルタンの戦死
  text: フランス（ナポレオン）と結ぼうとしたティプー・スルタンを、総督ウェルズリーが攻めた。都シュリーランガパトナが落ちてティプーは戦死し、イギリスはウォデヤル家を復位させて縮小したマイソールを保護下に置いた。
  polities: [mysore, britain, hyderabad]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ティプー・スルタン"
  images:
    - file: "General Sir David Baird Discovering the Body of Sultan Tippoo Sahib.jpg"
      caption: "デヴィッド・ウィルキー「ティプー・スルタンの遺体を見つけるベアード将軍」（1839年）"
    - file: "The storming of Seringapatam - John Vendramini, 1802 - BL P779.jpg"
      caption: "ヴェンドラミーニ「シュリーランガパトナの攻略」（1802年の版画、大英図書館）"

- year: 1799
  title: ポリガール戦争（1799–1801）
  text: タミル南部の地方領主（ポリガール）がイギリスの徴税に抵抗した。パーンチャーラングリッチのカッタボンマンは1799年に処刑され、1801年までに反乱は鎮められた。
  polities: [britain, carnatic]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Polygar_Wars"

- year: 1801
  title: カーナティックの併合
  text: イギリス東インド会社が、ティプー・スルタンとの内通を理由にカーナティック太守から統治権を取り上げ、マドラス管区に組み入れた。南インドの東海岸はイギリスの直轄領となった。
  polities: [britain, carnatic]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Carnatic_Sultanate"

- year: 1802
  date: "1802-12-31"
  title: バセイン条約
  text: 諸侯ホールカルに敗れてプネーを追われた宰相バージー・ラーオ2世が、イギリスと軍事保護条約を結んで復帰した。これに反発したシンディア家・ボーンスレー家が第2次マラーター戦争（1803–05）を起こしたが、アッサイェの戦い（1803）などでウェルズリー兄弟に敗れた。
  polities: [maratha, britain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_Bassein"

- year: 1806
  date: "1806-07-10"
  title: ヴェールールの反乱
  text: 南インドのヴェールールで、服装や髭の規則に反発したインド人兵士（シパーヒー）が反乱を起こした。シパーヒーの反乱（1857）に先立つ大きな兵士の反乱だった。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Vellore_mutiny"

- year: 1809
  title: ヴェールタンピの反乱
  text: トラヴァンコールの大臣ヴェールタンピが、イギリスの重い負担に抗議して反乱を呼びかけたが敗れて自害した。
  polities: [travancore, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Velu_Thampi_Dalawa"

- year: 1815
  date: "1815-03-02"
  title: キャンディ協定（キャンディ王国の滅亡）
  text: 王と対立したキャンディの貴族がイギリスと結び、王シュリー・ヴィクラマ・ラージャシンハを退けた。キャンディ協定で王国はイギリス領になり、セイロン島全体がイギリスの支配下に入った。1817–18年にはウヴァで大反乱が起きた。
  polities: [kandy, britain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Kandyan_Convention"

- year: 1817
  title: 第3次マラーター戦争（1817–18）
  text: 宰相バージー・ラーオ2世とナーグプル・インドールの諸侯が、イギリスの支配に反発して戦ったが、総督ヘースティングズの軍に敗れた。宰相の地位は廃され、領地はボンベイ管区に併合された。マラーター同盟は解体し、イギリスのインド支配が確立した。
  polities: [maratha, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/マラーター戦争"
  images:
    - file: "Battle of Kirki, 1817.jpg"
      caption: "キルキーの戦い（1817年。20世紀初めの挿絵）"
    - file: "The Last Charge of the 6th Regment of Bengal and the 6th Regiment of Madras Light Cavalry on the 16th December 1817 (cropped).jpg"
      caption: "ナーグプルの戦いの騎兵の突撃（1817年12月。1818年の石版画）"

- year: 1820
  title: マドラス管区のライヤットワーリー制
  text: マドラス知事マンローらが、農民（ライヤット）に直接土地の保有権を認め、直接に地税を納めさせるライヤットワーリー制を広めた（1820年ごろ）。ボンベイ管区などにも広がった。ベンガルのザミンダーリー制とならぶイギリスのインドの地税制度。
  polities: [britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ライヤットワーリー制"
  images:
    - file: "Sir Thomas Munro, 1st Bt by Sir Martin Archer Shee.jpg"
      caption: "マーティン・アーチャー・シー「トマス・マンロー」（ライヤットワーリー制を進めたマドラス知事）"
- year: 1824
  title: キットゥールの女王チェンナンマの抵抗
  text: 跡継ぎの養子を認めずキットゥール（カルナータカ北部）を併合しようとしたイギリスに対し、女王チェンナンマが兵を挙げた。のちのインド独立運動で抵抗の象徴とされた。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Kittur_Chennamma"

- year: 1834
  title: コダグの併合
  text: イギリスが王チッカ・ヴィーラ・ラージェーンドラを退位させ、西ガーツ山脈の山国コダグ（クールグ）を併合した。
  polities: [coorg, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Coorg_War"

- year: 1848
  title: 失権の原理によるサーターラーの併合
  text: 総督ダルハウジーは、跡継ぎのない藩王国の養子相続を認めず併合する「失権の原理」を進め、サーターラー（1848）・ジャーンシー（1853）・ナーグプル（1854）などを併合した。藩王の不満はシパーヒーの反乱の一因となった。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/失権の原理"

- year: 1853
  date: "1853-04-16"
  title: インド最初の鉄道
  text: ボンベイとターネーの間（約34km）にインド最初の旅客鉄道が開通した。鉄道は綿花などの原料をイギリスに運び出し、イギリス製品を内陸に運び込む役割を果たした。
  polities: [britain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Rail_transport_in_India"

- year: 1853
  title: ベラールがイギリスに委ねられる
  text: ニザームが、駐留するイギリス軍（ハイデラバード分遣隊）の費用の代わりにベラールの統治をイギリスに委ねた。1903年にベラールは中央州に合わされた。
  polities: [hyderabad, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Berar_Province"

- year: 1858
  title: アンダマン諸島の流刑地
  text: シパーヒーの反乱の参加者を送るため、イギリスがアンダマン諸島のポートブレアに流刑地を開いた。のち独立運動の政治犯がセルラー刑務所（1906年完成）に送られた。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Cellular_Jail"

- year: 1885
  date: "1885-12-28"
  title: インド国民会議の創立
  text: ボンベイで、イギリスの支持のもとに、インド人の知識人の意見を集める場としてインド国民会議が開かれた。のちに独立運動の中心となった。
  polities: [britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/インド国民会議"
  images:
    - file: "First meeting session of the Indian National Congress in Bombay, 1885.jpg"
      caption: "ボンベイで開かれた第1回インド国民会議（1885年）"

- year: 1887
  title: モルディブがイギリスの保護国になる
  text: モルディブのスルタンがイギリス領セイロン総督と協定を結び、外交をイギリスに委ねた。内政は自治が保たれた。
  polities: [maldives, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Maldives"

- year: 1921
  title: マラバール（マーッピラ）の反乱
  text: マラバールのイスラーム教徒の農民（マーッピラ）が、ヒラーファト運動の高まりの中で、イギリスとヒンドゥー教徒の地主に対して蜂起した。鎮圧の中で多くの死者が出た。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Malabar_rebellion"

- year: 1924
  title: ヴァイコム・サティヤーグラハ
  text: トラヴァンコールのヴァイコム寺院の周りの道を「不可触民」が通ることを求める非暴力の運動。ガンディーも支持した。1936年の寺院入場布告につながった。
  polities: [travancore]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Vaikom_Satyagraha"

- year: 1931
  title: セイロンで普通選挙
  text: ドナモア憲法により、セイロンでアジアで最も早い男女の普通選挙が行われ、自治が大きく進んだ。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Donoughmore_Constitution"

- year: 1942
  title: 日本軍のアンダマン占領とセイロン空襲
  text: 日本軍がアンダマン・ニコバル諸島を占領し（3月）、日本の機動部隊がセイロンのコロンボ・トリンコマリーを空襲した（4月、セイロン沖海戦）。
  polities: [japan, britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/セイロン沖海戦"

- year: 1946
  date: "1946-02"
  title: インド海軍の反乱
  text: ボンベイでインド人水兵が待遇とインド国民軍の裁判に抗議して反乱を起こし、各地に広がった。イギリスがインドからの撤退を急ぐ一因となった。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Royal_Indian_Navy_mutiny"

- year: 1948
  date: "1948-02-04"
  title: セイロンの独立
