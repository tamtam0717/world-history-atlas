  title: フランス領インドがインドに渡る
  text: ポンディシェリ・カライカル・マーエ・ヤナムの施政権がフランスからインドに移った（1962年に正式に割譲）。シャンデルナゴルは1950年に先に移っていた。
  polities: [india, france]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フランス領インド"

- year: 1956
