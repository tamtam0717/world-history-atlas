  date: "1510-11-25"
  title: アルブケルケがゴアを占領
  text: ポルトガルのインド総督アルブケルケがビジャープル王国からゴアを奪い、アジア貿易の拠点とした。ゴアは1530年からポルトガル領インドの首都となり、「東洋のローマ」と呼ばれた。
  polities: [portugal, bijapur]
  importance: 1
  at: [73.91, 15.5]
  source: "https://ja.wikipedia.org/wiki/アフォンソ・デ・アルブケルケ"
  images:
    - file: "AMH-6577-KB Bird's eye view of the city of Goa.jpg"
      caption: "リンスホーテン『東方案内記』のゴアの鳥瞰図（1596年ごろ）"
    - file: "Afonso de Albuquerque (Livro de Lisuarte de Abreu).jpg"
      caption: "アルブケルケの肖像（『リズアルテ・デ・アブレウの書』、1565年ごろ）"

- year: 1514
  title: クリシュナデーヴァラーヤのカリンガ遠征
  text: クリシュナデーヴァラーヤがガジャパティ朝からウダヤギリ（1514）・コンダヴィードゥ（1515）などを奪った。1519年の和約で、クリシュナ川より南を王国の領土とした。
  polities: [vijayanagara, gajapati]
  importance: 3
  at: [79.3, 14.87]
  source: "https://en.wikipedia.org/wiki/Krishnadevaraya"

- year: 1518
  title: ゴールコンダ王国の自立
  text: バフマニー朝のテランガーナ長官スルターン・クリーがゴールコンダで自立し、クトゥブ・シャーヒー朝を開いた。
  polities: [golconda, bahmani]
  importance: 3
  at: [78.4, 17.38]
  source: "https://ja.wikipedia.org/wiki/クトゥブ・シャーヒー朝"

- year: 1520
  date: "1520-05"
  title: ライチュールの戦い
  text: クリシュナデーヴァラーヤがビジャープル王国のイスマーイール・アーディル・シャーを破り、長く争われてきたライチュールの城を奪った。ポルトガル人の傭兵も加わった。
  polities: [vijayanagara, bijapur]
  importance: 2
  at: [77.36, 16.2]
  source: "https://en.wikipedia.org/wiki/Battle_of_Raichur"

- year: 1521
  title: コーッテ王国の分裂
  text: コーッテ王ヴィジャヤバーフ6世が3人の王子に殺され（ヴィジャヤバー・コッラヤ）、国はコーッテ・シーターワカ・ライガマに分かれた。
  polities: [kotte, sitawaka]
  importance: 3
  at: [79.9, 6.89]
  source: "https://en.wikipedia.org/wiki/Vijayabā_Kollaya"

- year: 1527
  title: バフマニー朝の終わり
  text: 最後のスルタン、カリームッラー・シャーがビーダルを逃れ、宰相のバリード家が実権を握った（ビーダル王国）。約180年続いたバフマニー朝は事実上滅んだ。
  polities: [bahmani, bidar_sultanate]
  importance: 3
  at: [77.52, 17.91]
  source: "https://en.wikipedia.org/wiki/Bahmani_Sultanate"

- year: 1529
  title: マドゥライにナーヤカが置かれる
  text: ヴィジャヤナガル王国がヴィシュヴァナータ・ナーヤカをマドゥライの長官とした。ポリガール（地方領主）の制度で治め、のちのマドゥライ・ナーヤカ朝の始まりとなった。
  polities: [vijayanagara, madurai]
  importance: 3
  at: [78.12, 9.92]
  source: "https://en.wikipedia.org/wiki/Viswanatha_Nayak"

- year: 1534
  date: "1534-12-23"
  title: バセイン条約（ポルトガルとグジャラート）
  text: ムガル帝国に攻められたグジャラート王バハードゥル・シャーがポルトガルと条約を結び、バセイン（ヴァサイ）とボンベイ（ムンバイ）の島々を譲った。
  polities: [portugal, gujarat_sultanate]
  importance: 3
  at: [72.84, 19.33]
  source: "https://en.wikipedia.org/wiki/Treaty_of_Bassein_(1534)"

- year: 1542
  title: ザビエルがゴアに到着
  text: イエズス会のフランシスコ＝ザビエルがゴアに着き、南インドの真珠漁海岸（パラヴァ人）やマラッカでキリスト教を伝えた。のち日本にも渡った。
  polities: [portugal]
  importance: 2
  at: [73.91, 15.5]
  source: "https://ja.wikipedia.org/wiki/フランシスコ・ザビエル"

- year: 1558
  title: ポルトガルがモルディブを占領
  text: ポルトガルがマーレを攻め、スルタンのアリー6世が戦死した。ポルトガルはモルディブを15年間支配した。
  polities: [portugal, maldives]
  importance: 3
  at: [73.51, 4.17]
  source: "https://en.wikipedia.org/wiki/Muhammad_Thakurufaanu_Al_Auzam"

- year: 1560
  title: ゴアに異端審問所が置かれる
  text: ポルトガルがゴアに異端審問所を置き、改宗したユダヤ人やヒンドゥー教徒の信仰を厳しく取り締まった（1812年に廃止）。
  polities: [portugal]
  importance: 3
  at: [73.91, 15.5]
  source: "https://en.wikipedia.org/wiki/Goa_Inquisition"

- year: 1565
  date: "1565-01-23"
  title: ターリコータの戦い
  text: ビジャープル・アフマドナガル・ゴールコンダ・ビーダルの連合軍がヴィジャヤナガル王国の軍を破り、摂政ラーマ・ラーヤが戦死した。都ヴィジャヤナガル（ハンピ）は略奪・破壊され、王国は南に退いた。
  polities: [vijayanagara, bijapur, ahmadnagar_sultanate, golconda, bidar_sultanate]
  importance: 1
  at: [76.47, 16.27]
  source: "https://ja.wikipedia.org/wiki/ターリコータの戦い"
  images:
    - file: "Battle of Talikota (formatted).jpg"
      caption: "ターリコータの戦い（アフマドナガル王国の年代記の挿絵、1565–69年ごろ）"
    - file: "Ruins of Vijianuggur, the Volkonda Ramachandra temple in Hampi, Vijayanagara, 1868 photo.jpg"
      caption: "破壊されたヴィジャヤナガルの都ハンピの遺跡（1868年の写真）"

- year: 1573
  title: モルディブがポルトガル人を追う
  text: ムハンマド・タクルファーヌがゲリラ戦の末にマーレのポルトガル人を追い出し、スルタンとなった。モルディブでは今も国民的英雄とされる。
  polities: [maldives, portugal]
  importance: 3
  at: [73.51, 4.17]
  source: "https://en.wikipedia.org/wiki/Muhammad_Thakurufaanu_Al_Auzam"

- year: 1574
  title: アフマドナガル王国がベラールを併合
  text: アフマドナガル王ムルタザー・ニザーム・シャー1世がベラール王国を滅ぼした。デカンのムスリム諸王国は4つになった。
  polities: [ahmadnagar_sultanate, berar_sultanate]
  importance: 3
  at: [77.51, 21.26]
  source: "https://en.wikipedia.org/wiki/Berar_Sultanate"

- year: 1582
  title: シーターワカ王国がキャンディを併合
  text: シーターワカ王ラージャシンハ1世がキャンディ王国を併合し、セイロン島の大部分を従えた。1587–88年にはコロンボのポルトガル要塞を包囲したが落とせなかった。
  polities: [sitawaka, kandy, portugal]
  importance: 3
  at: [80.15, 6.95]
  source: "https://en.wikipedia.org/wiki/Rajasinghe_I"

- year: 1591
  title: ハイデラバードの建設
  text: ゴールコンダ王ムハンマド・クリー・クトゥブ・シャーがムーシー川のほとりに新しい都ハイデラバードを建て、中心にチャールミナール（4本の塔の門）を建てた。
  polities: [golconda]
  importance: 2
  at: [78.47, 17.36]
  source: "https://ja.wikipedia.org/wiki/チャールミナール"

- year: 1594
  title: ダントゥレの戦い
  text: ポルトガルがキャンディに傀儡の女王を立てようと攻め込んだが、ヴィマラダルマスーリヤ1世が山地で迎え撃ち、ポルトガル軍をほぼ全滅させた。
  polities: [kandy, portugal]
  importance: 3
  at: [80.55, 7.27]
  source: "https://en.wikipedia.org/wiki/Campaign_of_Danture"

- year: 1596
  title: チャーンド・ビービーがベラールを割譲
  text: アフマドナガルの城を守ったチャーンド・ビービーが、包囲したアクバルの子ムラードと和を結び、ベラールをムガル帝国に譲った。
  polities: [ahmadnagar_sultanate, mughal]
  importance: 3
  at: [74.73, 19.09]
  source: "https://en.wikipedia.org/wiki/Chand_Bibi"

- year: 1597
  title: コーッテ王国がポルトガル領に
  text: キリスト教徒のコーッテ王ダルマパーラが死に、遺言で国はポルトガル王（スペイン王フェリペ2世）のものとなった。ポルトガル領セイロンが成立した。
  polities: [portugal, kotte]
  importance: 2
  at: [79.85, 6.93]
  source: "https://en.wikipedia.org/wiki/Portuguese_Ceylon"

- year: 1600
  date: "1600-08"
  title: ムガル軍がアフマドナガルを落とす
  text: アクバルの軍がアフマドナガルの城を落とし、幼い王バハードゥル・ニザーム・シャーを捕らえた（チャーンド・ビービーはその直前に殺された）。翌年1月にはハーンデーシュのアシールガル要塞も降伏した。
  polities: [mughal, ahmadnagar_sultanate, khandesh]
  importance: 2
  at: [74.73, 19.09]
  source: "https://en.wikipedia.org/wiki/Siege_of_Ahmednagar"

- year: 1610
  title: マイソールのウォデヤル家の自立
  text: ラージャ・ウォデヤルがヴィジャヤナガル王国の長官の拠点シュリーランガパトナを奪って都とし、マイソール王国が自立した。
  polities: [mysore, vijayanagara]
  importance: 3
  at: [76.68, 12.42]
  source: "https://en.wikipedia.org/wiki/Raja_Wodeyar_I"

- year: 1610
  title: マリク・アンバルの抵抗
  text: エチオピア出身の奴隷から宰相になったマリク・アンバルが、アフマドナガル王国を立て直し、ハドキー（のちのアウランガーバード）を都とした。マラーターの騎兵を使ったゲリラ戦でムガル帝国の南進を長く食い止めた（1626年没）。
  polities: [ahmadnagar_sultanate, mughal]
  importance: 2
  at: [75.34, 19.88]
  source: "https://ja.wikipedia.org/wiki/マリク・アンバル"

- year: 1616
  title: トップールの戦い
  text: ヴィジャヤナガル王家の継承争いで、タンジャーヴールのラグナータ・ナーヤカが支える王子ラーマ・デーヴァ・ラーヤがマドゥライ・ジンジーのナーヤカの側を破った。王国の内部の分裂が深まった。
  polities: [vijayanagara, thanjavur, madurai, gingee]
  importance: 3
  at: [78.9, 10.85]
  source: "https://en.wikipedia.org/wiki/Battle_of_Toppur"

- year: 1619
  title: ポルトガルがジャフナ王国を併合
  text: ポルトガルが最後の王サンキリ2世を捕らえ（ゴアで処刑）、ジャフナ王国を併合した。セイロン島の海岸の大部分がポルトガル領となった。
  polities: [portugal, jaffna]
  importance: 3
  at: [80.02, 9.66]
  source: "https://en.wikipedia.org/wiki/Cankili_II"

- year: 1619
  title: ビジャープル王国がビーダルを併合
  text: ビジャープル王イブラーヒーム・アーディル・シャー2世がビーダル王国を滅ぼした。
  polities: [bijapur, bidar_sultanate]
  importance: 3
  at: [77.52, 17.91]
  source: "https://en.wikipedia.org/wiki/Bidar_Sultanate"

- year: 1620
  title: デンマークのトランケバル
  text: デンマーク東インド会社がタンジャーヴールのナーヤカからトランケバル（タランガンバーディ）を得て、ダンスボー要塞を築いた（1845年にイギリスに売却）。
  polities: [denmark, thanjavur]
  importance: 3
  at: [79.86, 11.03]
  source: "https://en.wikipedia.org/wiki/Tranquebar"

- year: 1633
  title: ダウラターバードの陥落
  text: ムガル軍がアフマドナガル王国の要塞ダウラターバードを落とし、スルタンを捕らえた。シャーハージー（シヴァージーの父）は幼い王族を立てて抵抗を続けた。
  polities: [mughal, ahmadnagar_sultanate]
  importance: 3
  at: [75.21, 19.94]
  source: "https://en.wikipedia.org/wiki/Daulatabad_Fort"

- year: 1636
  title: アフマドナガル王国の滅亡
  text: シャー・ジャハーンがデカンに遠征し、ビジャープル・ゴールコンダを従わせて条約を結んだ。アフマドナガル王国は分けられ、北部はムガル帝国、プネー・コンカンなど南西部はビジャープル王国のものとなった。ゴールコンダはムガル皇帝に貢納を約束した。
  polities: [mughal, ahmadnagar_sultanate, bijapur, golconda]
  importance: 2
  at: [75.34, 19.88]
  source: "https://en.wikipedia.org/wiki/Ahmadnagar_Sultanate"

- year: 1638
  title: キャンディとオランダの同盟
  text: キャンディ王ラージャシンハ2世がガンノルワの戦いでポルトガル軍を破り、オランダ東インド会社と条約を結んだ。オランダはバッティカロア（1638）・トリンコマリー（1639）・ゴール（1640）などのポルトガルの拠点を落としていった。
  polities: [kandy, netherlands, portugal]
  importance: 2
  at: [80.6, 7.28]
  source: "https://en.wikipedia.org/wiki/Battle_of_Gannoruwa"

- year: 1638
  title: ビジャープル王国のカルナータカ遠征
  text: ビジャープル王国の将ランドゥッラー・ハーンとシャーハージーが南に進み、バンガロール・シラ・コーラールなどを奪った。バンガロールはシャーハージーの領地となった。
  polities: [bijapur, vijayanagara]
  importance: 3
  at: [77.59, 12.97]
  source: "https://en.wikipedia.org/wiki/Shahaji"

- year: 1640
  title: マドラスにセント・ジョージ要塞
  text: イギリス東インド会社がヴィジャヤナガル王の地方領主から海岸の土地を得て（1639）、セント・ジョージ要塞を築いた。のちのマドラス（チェンナイ）の始まりで、南インドのイギリスの拠点となった。
  polities: [britain, vijayanagara]
  importance: 2
  at: [80.29, 13.08]
  source: "https://ja.wikipedia.org/wiki/チェンナイ"

- year: 1640
  date: "1640-03"
  title: オランダがゴールを奪う
  text: オランダ東インド会社がポルトガルからセイロン島南部の港ゴールを奪い、セイロンの拠点とした。
  polities: [netherlands, portugal]
  importance: 3
  at: [80.22, 6.03]
  source: "https://en.wikipedia.org/wiki/Dutch_Ceylon"

- year: 1646
  title: ヴィジャヤナガル王国の滅亡
  text: ゴールコンダ王国の軍（将ミール・ジュムラ）がチャンドラギリなどを、ビジャープル王国の軍がヴェールール（1647）を落とし、最後の王シュリーランガ3世は国を失った。約300年続いた南インドのヒンドゥー教の王国は滅んだ。
  polities: [vijayanagara, golconda, bijapur]
  importance: 2
  at: [79.32, 13.59]
  source: "https://ja.wikipedia.org/wiki/ヴィジャヤナガル王国"
