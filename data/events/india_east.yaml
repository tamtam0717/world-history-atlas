# 東インド・ベンガル・ヒマラヤ（担当 S2）の出来事（1648–2025）。
# インド全体にかかわる事件（シパーヒーの反乱、国民会議の結成、分離独立など）は S1（india_north.yaml）が書く。
# ここでは、ベンガル・ビハール・オリッサ・北東インド・ネパール・ブータン・シッキム・バングラデシュを舞台にした事件を書く。

# ---------------------------------------------------------------- 17世紀
- year: 1651
  title: イギリス東インド会社がフーグリに商館を開く
  text: ベンガル総督シャー・シュジャー（シャー・ジャハーンの子）の許しを得て、会社がガンジス川（フーグリ川）の河口近くに商館を開いた。ベンガルの綿布・生糸・硝石を買い付けた。
  polities: [britain, mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Hooghly-Chinsurah"
- year: 1662
  date: "1662-03"
  title: ミール・ジュムラのアッサム遠征
  text: ベンガル総督ミール・ジュムラがコーチ・ビハールを経てアッサムに攻め込み、アホーム王国の都ガルガオンを占領した。雨季の洪水と疫病に苦しみ、翌年の講和で西部を割譲させて引き揚げたが、ミール・ジュムラは帰途に病死した。
  polities: [mughal, ahom, koch_bihar]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Mir_Jumla's_invasion_of_Assam"
- year: 1666
  date: "1666-01"
  title: ムガル帝国がアラカンからチッタゴンを奪う
  text: ベンガル総督シャーイスタ・ハーンが、ベンガルの沿岸を荒らしていたアラカン王国とポルトガル人の海賊の拠点チッタゴンを攻め落とした。
  polities: [mughal, arakan]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Mughal_conquest_of_Chittagong"
- year: 1671
  title: サライガートの戦い
  text: アホーム王国の将軍ラチト・ボルプカンが、グワーハーティー近くのブラマプトラ川でムガル帝国の大軍を破った。アッサムがムガル帝国に併合されなかった決め手の戦いとされる。
  polities: [ahom, mughal]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Battle_of_Saraighat"
- year: 1682
  title: イタクリの戦いでアホームがグワーハーティーを取り戻す
  text: アホーム王ガダダル・シンハの軍がムガル軍を破り、マナス川までのアッサム西部を取り戻した。これがアホームとムガルの最後の戦いとなった。
  polities: [ahom, mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Itakhuli"
- year: 1686
  title: イギリス東インド会社とムガル帝国の戦争
  text: 会社の総裁ジョサイア・チャイルドがムガル帝国に戦争を仕掛けたが大敗し（チャイルドの戦争、1686–90）、ベンガルの商館も追われた。1690年に許されて、ジョブ・チャーノックがフーグリ川のほとりのスターヌティに商館を置いた（カルカッタの始まり）。
  polities: [britain, mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Child's_War"
- year: 1690
  date: "1690-08-24"
  title: カルカッタの建設が始まる
  text: ジョブ・チャーノックがスターヌティに商館を置いた。1696年からウィリアム要塞を築き、1698年に周りの3村のザミーンダーリー（地代を取る権利）を買い取って、カルカッタの町ができた。
  polities: [britain, mughal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/コルカタ"

# ---------------------------------------------------------------- 18世紀
- year: 1704
  title: ベンガルの役所がムルシダーバードへ移る
  text: ベンガルのディーワーン（財務長官）ムルシド・クリー・ハーンが、役所をダッカからムルシダーバード（自分の名にちなむ）へ移した。1717年に太守となり、世襲の太守政権を開いた。
  polities: [mughal, bengal_nawab]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ムルシド・クリー・ハーン"
- year: 1717
  title: ファッルフシヤルの勅令
  text: ムガル皇帝ファッルフシヤルが、毎年わずかな金を払うだけでベンガルでの関税を免除する特権（ダスタク）をイギリス東インド会社に与えた。会社の社員がこの特権を私的な商売に使ったことが、のちに太守との争いのもとになった。
  polities: [britain, mughal, bengal_nawab]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Farrukhsiyar"
- year: 1742
  title: マラーターのベンガル侵入（バルギーの襲撃）
  text: ナーグプルのボーンスレー家の騎兵（バルギー）がベンガル西部に毎年のように侵入し、略奪を繰り返した（1742–1751）。多くの人がガンジス川の東やカルカッタへ逃れた。1751年の講和で、ベンガル太守はオリッサを譲り、貢納（チャウト）を約束した。
  polities: [maratha, bengal_nawab]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Maratha_invasions_of_Bengal"
- year: 1744
  title: ゴルカがヌワコットを落とす
  text: ゴルカ王プリトヴィ・ナラヤン・シャハが、カトマンズ盆地の西の要地ヌワコットを奪い、盆地とチベットを結ぶ交易路を押さえた。ネパール統一の始まり。
  polities: [nepal, malla]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/プリトビ・ナラヤン・シャハ"
- year: 1756
  date: "1756-06-20"
  title: シラージュ・ウッダウラがカルカッタを攻め落とす
  text: 会社が太守の許しなく要塞を強めたことに怒ったベンガル太守シラージュ・ウッダウラが、カルカッタを攻め落とした。捕虜が狭い牢で多数死んだとされる「ブラックホール事件」は、のちイギリスの報復の口実とされた（死者の数は誇張とされる）。
  polities: [bengal_nawab, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/シラージュ・ウッダウラ"
- year: 1757
  date: "1757-06-23"
  title: プラッシーの戦い
  text: クライヴの率いるイギリス東インド会社軍が、ベンガル太守シラージュ・ウッダウラとフランスの連合軍を破った。太守の軍の将軍ミール・ジャアファルが寝返ったためで、会社は彼を太守に立て、ベンガルの実権を握るきっかけをつかんだ。
  polities: [britain, bengal_nawab, france]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/プラッシーの戦い"
- year: 1760
  title: ミール・カーシムが3県を会社に譲る
  text: 会社に立てられた新しい太守ミール・カーシムが、バルダマン・メディニープル・チッタゴンの3県の地租を会社に譲った。のちミール・カーシムは会社の社員の特権商売を抑えようとして会社と戦った（1763）。
  polities: [bengal_nawab, britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ミール・カーシム"
- year: 1764
  date: "1764-10-22"
  title: ブクサールの戦い
  text: ビハールのブクサールで、イギリス東インド会社軍が、ベンガルの元太守ミール・カーシム・アワド太守・ムガル皇帝シャー・アーラム2世の連合軍を破った。会社の北インドでの優位が決まった。
  polities: [britain, bengal_nawab, awadh, mughal]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ブクサールの戦い"
- year: 1765
  date: "1765-08-12"
  title: 会社がベンガルのディーワーニーを得る（アラーハーバード条約）
  text: ムガル皇帝シャー・アーラム2世が、イギリス東インド会社にベンガル・ビハール・オリッサのディーワーニー（地租を集める権利）を与えた。会社は商事会社から、広い土地を治める支配者へと変わり始めた。
  polities: [britain, mughal, bengal_nawab, awadh]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アラーハーバード条約"
- year: 1768
  date: "1768-09"
  title: ゴルカがカトマンズ盆地を征服
  text: プリトヴィ・ナラヤン・シャハがカトマンズとパタンを落とし（1768）、翌年バクタプルも落としてマッラ朝を滅ぼした。カトマンズを都とするネパール王国（シャハ朝）が成立した。
  polities: [nepal, malla]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ネパールの歴史"
- year: 1769
  title: アッサムでモアモリアの反乱が始まる
  text: アホーム王家に冷遇されたヴィシュヌ派の宗団（モアモラ・サトラ）の信徒が反乱を起こし、都ランプルを2度占領した。反乱は1805年まで続き、王国は大きく弱った。
  polities: [ahom]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Moamoria_rebellion"
- year: 1770
  title: ベンガル大飢饉
  text: 不作に加え、会社の厳しい地租の取り立てと米の買い占めで、ベンガル・ビハールで大飢饉が起こった。人口の3分の1にあたる約1000万人が死んだとされる。
  polities: [britain, bengal_nawab]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Great_Bengal_famine_of_1770"
- year: 1773
  title: ノース規制法とベンガル総督
  text: イギリス議会が東インド会社の統治を監督する規制法を定め、ベンガル知事ウォーレン・ヘースティングズが初代ベンガル総督となった（カルカッタに最高法院）。同じ年、ブータン軍を退けたコーチ・ビハールが会社の保護下に入った。
  polities: [britain, koch_bihar, bhutan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ノース規制法"
- year: 1774
  title: ボーグルのチベット使節
  text: ヘースティングズ総督がジョージ・ボーグルをブータン経由でチベットのパンチェン・ラマのもとへ送り、交易の道を開こうとした。
  polities: [britain, bhutan, tibet]
  importance: 3
  source: "https://en.wikipedia.org/wiki/George_Bogle_(diplomat)"
- year: 1793
  title: ベンガルの永代ザミーンダーリー制
  text: コーンウォリス総督が、ザミーンダール（地主）に土地の所有権を認め、地租の額を永久に固定した。会社の収入は安定したが、地租を払えない旧家が多く没落し、農民は重い小作料に苦しんだ。
  polities: [britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ザミンダーリー制"

# ---------------------------------------------------------------- 19世紀
- year: 1803
  title: イギリスがオリッサを征服
  text: 第2次マラーター戦争で会社の軍がオリッサ沿岸を占領し、ナーグプルのボーンスレー家がデーオガーオン条約で譲った。プリーのジャガンナート寺院も会社の管理下に入った。山地の小王国（ガルジャート）は会社の藩王国となった。
  polities: [britain, maratha, garhjat]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Deogaon"
- year: 1814
  date: "1814-11"
  title: グルカ戦争（イギリス＝ネパール戦争）
  text: タライ（平野）の境界をめぐってイギリス東インド会社とネパールが戦った（1814–1816）。ネパール軍は山地で善戦したが敗れた。その勇敢さに感心したイギリスは、ネパールの兵（グルカ兵）を雇うようになった。
  polities: [britain, nepal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ネパール・イギリス戦争"
- year: 1816
  date: "1816-03-04"
  title: スガウリ条約
  text: ネパールがクマーウーン・ガルワール・シッキム方面などの征服地と、タライの一部をイギリスに譲り、カトマンズにイギリスの駐在官を置くことを認めた。今のネパールの国境のもととなった。
  polities: [nepal, britain, sikkim]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/スガウリ条約"
- year: 1817
  title: ビルマ軍のアッサム侵入
  text: アホーム王国の宮廷の争いに介入したビルマ（コンバウン朝）の軍がアッサムに入った。1819年にはマニプルも占領し（「7年の荒廃」）、1821年にはアッサムを支配下に置いた。これがイギリスとビルマの衝突を招いた。
  polities: [burma, ahom, manipur]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Burmese_invasions_of_Assam"
- year: 1826
  date: "1826-02-24"
  title: ヤンダボ条約でアッサム・マニプルがビルマから切り離される
  text: 第1次イギリス＝ビルマ戦争に敗れたビルマが、アッサム・カチャール・ジャインティアへの干渉をやめ、マニプルの独立を認めた。アッサムはイギリスの支配下に入った。
  polities: [britain, burma, ahom, manipur]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヤンダボ条約"
- year: 1828
  title: ラーム・モーハン・ローイがブラフマ協会を作る
  text: カルカッタでラーム・モーハン・ローイが、偶像崇拝やカーストの差別を否定するヒンドゥー教の改革団体ブラフマ協会（ブラフモ・サマージ）を作った。ベンガルの近代の文化運動（ベンガル・ルネサンス）の始まりとされる。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ラーム・モーハン・ローイ"
- year: 1829
  title: サティー（寡婦殉死）の禁止
  text: ベンティンク総督が、ラーム・モーハン・ローイらの訴えを受けて、夫の火葬の火に妻が身を投じるサティーの風習を禁じた（ベンガル管区）。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/サティー_(ヒンドゥー教)"
- year: 1831
  title: コール人の反乱
  text: チョーター・ナーグプルのムンダ人・オラオン人などが、よそから来た金貸し・地主と会社の支配に反乱を起こした（1831–32）。鎮圧の後、この地方は南西辺境管轄区として特別に治められた。
  polities: [britain, chota_nagpur]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Kol_uprising"
- year: 1835
  title: シッキムがダージリンをイギリスに贈る
  text: シッキム王が、療養地を求めるイギリスにダージリンの山地を贈った。ダージリンは避暑地・紅茶の産地として発展し、1849年にはシッキムとの争いの後にイギリスがさらに南の平野を併合した。
  polities: [sikkim, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Darjeeling"
- year: 1838
  title: イギリスがアッサムを併合し、茶の栽培が始まる
  text: イギリスは上アッサムの王プランダル・シンハを廃して併合した。自生の茶の木が見つかったアッサムでは、1839年にアッサム会社が作られ、チョーター・ナーグプルなどから連れてこられた労働者が茶園で働いた。
  polities: [britain, ahom]
  importance: 2
  source: "https://en.wikipedia.org/wiki/History_of_tea_in_India"
- year: 1846
  date: "1846-09-14"
  title: コートの虐殺とラナ家の専制
  text: カトマンズの王宮の武器庫（コート）で、軍人ジャンガ・バハドゥル・クンワルが政敵の貴族を多数殺して首相となった。以後1951年まで、ラナ家が世襲の首相として国王を名目だけの存在にした。
  polities: [nepal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ジャンガ・バハドゥル・ラナ"
- year: 1855
  date: "1855-06-30"
  title: サンタル人の反乱
  text: ラージマハル丘陵のサンタル人が、シドゥとカーヌの兄弟に率いられて、金貸し・地主と会社の支配に反乱を起こした（サンタル・フール）。鎮圧の後、サンタル・パルガナ県が置かれた。
  polities: [britain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Santal_rebellion"
- year: 1857
  date: "1857-03-29"
  title: バラックポールのマンガル・パンデーの事件
  text: カルカッタ近くのバラックポールで、シパーヒー（インド人傭兵）のマンガル・パンデーが新しい銃の弾薬包に反発してイギリス人士官を襲い、処刑された。5月のメーラトの反乱（シパーヒーの反乱）の前ぶれとなった。
  polities: [britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/マンガル・パンデー"
- year: 1859
  title: ベンガルの藍一揆
  text: ヨーロッパ人の藍（インディゴ）の農園主に、損な作付けを強いられたベンガルの農民が、藍の栽培を拒んで立ち上がった（1859–60）。劇『ニール・ダルパン（藍の鏡）』が反響を呼んだ。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Indigo_revolt"
- year: 1860
  title: ネパールが西部のタライを取り戻す
  text: インド大反乱（シパーヒーの反乱）の鎮圧にジャンガ・バハドゥルがグルカ兵を送って助けた礼として、イギリスはスガウリ条約で取った西部のタライ（ナヤ・ムルク）をネパールに返した。
  polities: [nepal, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Naya_Muluk"
- year: 1861
  title: トゥムロン条約でシッキムがイギリスの保護下に
  text: イギリス人の拘束事件をきっかけにイギリスがシッキムに出兵し、トゥムロン条約でシッキムを事実上の保護国とした。
  polities: [britain, sikkim]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Tumlong"
- year: 1865
  date: "1865-11-11"
  title: ドゥアール戦争とシンチュラ条約
  text: イギリスとブータンが南の平野（ドゥアール）をめぐって戦い（1864–65）、ブータンはシンチュラ条約でベンガル・ドゥアールとカリンポンをイギリスに譲り、毎年の補償金を受けることになった。
  polities: [britain, bhutan]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Duar_War"
- year: 1891
  title: アングロ・マニプル戦争
  text: マニプルの王位争いに介入したイギリスの弁務官らが殺されたことから、イギリスが出兵してマニプルを破り、将軍ティケンドラジットを処刑した。マニプルは藩王国となった。
  polities: [britain, manipur]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Anglo-Manipur_War"
- year: 1897
  title: ヴィヴェーカーナンダがラーマクリシュナ・ミッションを作る
  text: アメリカでの宗教会議（1893）で名を上げたヴィヴェーカーナンダが、師ラーマクリシュナの教えを広める団体をカルカッタで作り、ヒンドゥー教の改革と社会奉仕を進めた。
  polities: [britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ヴィヴェーカーナンダ"
