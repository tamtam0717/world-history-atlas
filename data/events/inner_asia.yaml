# G2 内陸アジア（モンゴル・内モンゴル・新疆・チベット・青海・アムール・沿海州）の出来事（1648–2025）。
# 清・ロシアの国境条約（ネルチンスク・キャフタ・アイグン・北京・イリ）はここに置く（G1 と重複しないように申し送り）。

- year: 1652
  title: ダライ・ラマ5世が北京を訪れる
  text: ダライ・ラマ5世が順治帝に招かれて北京を訪れた（1652–1653）。清はチベット仏教の最高位の僧を厚くもてなし、モンゴル人の信仰を通じた支配に役立てた。
  polities: [tibet, qing]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ダライ・ラマ5世"
- year: 1667
  title: ジュンガルがアルタン・ハンを滅ぼす
  text: ジュンガルのセンゲがハルハ北西部のアルタン・ハン（ホトゴイト部）を破り、トゥヴァやエニセイ川上流のキルギス人を従えた。
  polities: [dzungar, khalkha]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Altan_Khan_of_the_Khalkha"
- year: 1671
  title: ガルダンがジュンガルの君主となる
  text: チベットで修行していたガルダンが、兄センゲの殺害の後に帰国して実権を握った。1679年にダライ・ラマ5世からボショクト・ハンの称号を受けた。
  polities: [dzungar]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ガルダン"
- year: 1680
  title: ジュンガルがタリム盆地を征服
  text: ガルダンが白山党のホージャ（アーファーク・ホージャ）の求めに応じてタリム盆地に出兵し、ヤルカンド・ハン国を滅ぼした。オアシス都市はホージャ家を通じてジュンガルに治められた。
  polities: [dzungar, yarkent]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヤルカンド・ハン国"
- year: 1682
  title: ダライ・ラマ5世の死と摂政サンギェ・ギャツォ
  text: ダライ・ラマ5世が死んだが、摂政サンギェ・ギャツォはその死を15年近く隠して政治を握り、ポタラ宮の造営を続けた。
  polities: [tibet]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/サンギェ・ギャツォ"
- year: 1685
  title: 清がアルバジン砦を攻める
  text: 康熙帝はアムール川流域に進出したロシアのアルバジン砦を攻め（1685・1686）、ロシアに国境の交渉を迫った。
  polities: [qing, russia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/アルバジン"
- year: 1688
  title: ガルダンのハルハ侵入
  text: ジュンガルのガルダンがハルハ（外モンゴル）に攻め込み、トゥシェート・ハンとジェブツンダンバ・ホトクトは内モンゴルへ逃れて清に助けを求めた。
  polities: [dzungar, khalkha, qing]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ガルダン"
- year: 1689
  date: "1689-09-07"
  title: ネルチンスク条約
  text: 清とロシアがアルグン川とスタノヴォイ山脈（外興安嶺）を国境と定め、アムール川流域を清の領土とした。清が対等な形でヨーロッパの国と結んだ最初の条約で、イエズス会士が通訳を務めた。
  polities: [qing, russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ネルチンスク条約"
- year: 1690
  title: ウラーン・ブトゥンの戦い
  text: 内モンゴルに攻め込んだガルダンの軍を、清軍が北京の北約350kmのウラーン・ブトゥンで退けた。
  polities: [qing, dzungar]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Ulan_Butung"
- year: 1691
  title: ドローン・ノール会盟
  text: 康熙帝が内モンゴルのドローン・ノールでハルハの諸侯の服属を受け、ハルハを旗に編成した。外モンゴルが清の藩部となった。
  polities: [qing, khalkha]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ドロンノール会盟"
- year: 1696
  title: ジョーン・モドの戦い
  text: 康熙帝が自ら軍を率いて外モンゴルに遠征し、ジョーン・モド（ウランバートルの東）でガルダンの軍を破った。ガルダンは翌1697年に死んだ。
  polities: [qing, dzungar]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ジョーン・モドの戦い"
- year: 1706
  title: ラサン・ハンがダライ・ラマ6世を廃す
  text: ホシュートのラサン・ハンは摂政サンギェ・ギャツォを殺し（1705）、恋愛詩で知られるダライ・ラマ6世を「偽物」として廃した。6世は清へ送られる途中で死んだ。
  polities: [khoshut, tibet]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ダライ・ラマ6世"
- year: 1717
  title: ジュンガルのチベット侵入
  text: ジュンガルのツェワン・アラブタンが送った軍がラサを占領してラサン・ハンを殺した。略奪でチベットの人々の支持を失った。
  polities: [dzungar, khoshut, tibet]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Dzungar_conquest_of_Tibet"
- year: 1720
  title: 清軍のラサ進駐
  text: 清の遠征軍がジュンガル軍をチベットから追い、ダライ・ラマ7世を即位させた。チベットは清の保護下に入った（1727年から駐蔵大臣）。
  polities: [qing, tibet, dzungar]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Chinese_expedition_to_Tibet_(1720)"
- year: 1724
  title: 青海の平定
  text: 雍正帝の時代、青海ホシュートのロブサン・ダンジンの反乱（1723）を年羹堯・岳鍾琪が鎮めた。青海は清の藩部となり、モンゴル人は旗に編成された。
  polities: [qing, khoshut]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Lobzang_Danjin"
- year: 1727
  title: キャフタ条約
  text: 清とロシアが外モンゴルとシベリアの国境を定め、キャフタでの交易を認めた。
  polities: [qing, russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/キャフタ条約"
- year: 1731
  title: ホトン・ノールの戦い
  text: 清軍がジュンガルの領内に攻め込んだが、ホブド近くのホトン・ノールでガルダン・ツェリンの軍に大敗した。翌年にはジュンガル軍がハルハに攻め込み、エルデニ・ゾーで退けられた。1739年に講和し、アルタイ山脈が境とされた。
  polities: [qing, dzungar]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Dzungar–Qing_Wars"
- year: 1750
  title: ラサの騒乱
  text: チベットの政務を執っていたギュルメ・ナムギャルを駐蔵大臣が殺し、怒った群衆が大臣たちを殺した。乾隆帝は軍を送り、ダライ・ラマ7世を政務の長とするカシャ（政府）の制度を定めた（1751）。
  polities: [qing, tibet]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Lhasa_riot_of_1750"
- year: 1755
  title: 清がジュンガルを征服
  text: 乾隆帝はジュンガルの内紛に乗じて軍を送り、イリを占領した。協力者のアムルサナが背くと再び遠征し（1757）、ジュンガルの人々の多くが戦乱・虐殺と天然痘で死んで国は滅んだ。
  polities: [qing, dzungar]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ジュンガル"
- year: 1759
  title: 東トルキスタンの征服と「新疆」
  text: 清軍が大小ホージャの反乱を鎮めてタリム盆地を征服した。ジュンガル盆地とあわせて「新疆（新しい領土）」と呼ばれ、1762年にイリ将軍が置かれた。清の領土は最大となった。
  polities: [qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/新疆"
- year: 1771
  title: トルグートの帰還
  text: ヴォルガ川下流のカルムイク（トルグート部）の多くが、ロシアの圧迫を逃れてカザフ草原を越え、清領のイリへ戻った。途中で多くの人が死んだ。
  polities: [qing, russia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/カルムイク・ハン国"
- year: 1792
  title: 清・ネパール戦争（グルカ戦争）
  text: ネパールのゴルカ朝のチベット侵入に対して、乾隆帝は福康安の軍を送ってカトマンズの近くまで攻め込んだ。翌1793年、清は駐蔵大臣の権限を強め、活仏の選定に金瓶掣籤を導入した。
  polities: [qing, tibet]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/清・ネパール戦争"
- year: 1826
  title: ジャハーンギールの聖戦
  text: コーカンドに逃れていたホージャ家の子孫ジャハーンギールがカシュガルなど南新疆の4都市を一時占領した。清は1828年に鎮めたが、ホージャ家の侵入はこの後も続いた。
  polities: [qing, kokand]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Afaqi_Khoja_revolts"
- year: 1851
  title: イリ通商条約（クルジャ条約）
  text: 清がロシアにイリ（グルジャ）とタルバガタイ（チュグチャク）での交易と領事の駐在を認めた。
  polities: [qing, russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Kulja"
- year: 1858
  date: "1858-05-28"
  title: アイグン条約
  text: 東シベリア総督ムラヴィヨフが、アロー戦争で苦しむ清に迫って、アムール川（黒竜江）以北をロシア領とし、ウスリー川以東を両国の共同管理地とさせた。
  polities: [russia, qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アイグン条約"
- year: 1860
  title: 北京条約で沿海州がロシア領に
  text: アロー戦争の講和を仲介したロシアは、清との北京条約でウスリー川以東の沿海州を得た。ウラジオストク（「東方を支配せよ」の意）の建設が始まった。
  polities: [russia, qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/北京条約"
- year: 1864
  title: 新疆の回民・ウイグル人の反乱
  text: 陝西・甘粛で始まった回民（ドンガン）の反乱が新疆に広がり、クチャ・ウルムチ・イリなどで清の支配が崩れた。各地にムスリムの政権が立った。
  polities: [qing]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Dungan_Revolt_(1862–1877)"
- year: 1865
  title: ヤークーブ・ベクがカシュガルに入る
  text: コーカンド・ハン国の軍人ヤークーブ・ベクがカシュガルに入り、数年でタリム盆地からトルファン・ウルムチまでを支配する政権を作った。イギリス・ロシアやオスマン帝国と外交関係を結んだ。
  polities: [kashgaria, qing, kokand]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヤクブ・ベク"
- year: 1871
  title: ロシアのイリ占領（イリ事件）
  text: 新疆の混乱に乗じて、ロシア軍がイリ地方を占領した。
  polities: [russia, qing]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/イリ事件"
- year: 1877
  title: 左宗棠の新疆回復
  text: 海防か塞防（内陸の防衛）かの論争の後、左宗棠が新疆に遠征した。1876年にウルムチを奪い、1877年にヤークーブ・ベクが急死すると、年末までに南新疆を取り戻した。
  polities: [qing, kashgaria]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/左宗棠"
- year: 1881
  date: "1881-02-24"
  title: イリ条約（ペテルブルク条約）
  text: 1879年のリヴァディア条約を清が拒み、曾紀沢が交渉し直した。ロシアはイリ地方の大部分を清に返し、清は賠償金を払って西部をロシアに譲った。
  polities: [qing, russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/イリ条約"
- year: 1884
  title: 新疆省の設置
  text: 清は新疆を省とし、郡県制による直接統治に改めた。初代巡撫は劉錦棠。藩部の新疆は内地と同じ統治の形になった。
  polities: [qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/新疆省"
- year: 1904
  title: イギリスのチベット遠征
  text: ロシアの進出を警戒したイギリス領インドのヤングハズバンドが軍を率いてラサに入り、ラサ条約を結ばせた。ダライ・ラマ13世はモンゴルへ逃れた。
  polities: [britain, tibet, qing]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/イギリスのチベット遠征"
- year: 1910
  title: 清軍のラサ進駐
  text: カムで直接統治を進めた趙爾豊の後を受けて、清の四川軍がラサに入った。ダライ・ラマ13世はインドへ逃れた。
  polities: [qing, tibet]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ダライ・ラマ13世"
- year: 1911
