- year: 1454
  title: エセンが殺される
  text: ハンを名のったオイラトのエセンが、部下のアラク・テムルに殺された。オイラトの覇権は崩れ、東モンゴル（タタール）の有力者が争う時代になった。
  polities: [dzungar, northern_yuan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/エセン"
- year: 1465
  title: ドゥグラト部のアブー・バクルがカシュガルで自立
  text: モグーリスタン・ハン国の有力者ドゥグラト部のミールザー・アブー・バクルが、ヤルカンド・カシュガル・ホータンをハンから切り離して治めた（年はおおよそ）。
  polities: [dughlat, moghulistan]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Mirza_Abu_Bakr_Dughlat"
