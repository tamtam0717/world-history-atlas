  polities: [mongolia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/モンゴル人民共和国"
- year: 1933
  title: 東トルキスタン・イスラーム共和国
  text: ハミの反乱（1931）から新疆全体に内乱が広がり、カシュガルで東トルキスタン・イスラーム共和国が建てられた。翌1934年に回民の馬仲英の軍に滅ぼされ、ソ連の後押しを受けた盛世才が新疆の実権を握った。
  polities: [east_turkestan_islamic, roc]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/東トルキスタン・イスラム共和国"
- year: 1936
  title: 蒙古軍政府の成立と綏遠事件
  text: 内モンゴルの徳王が関東軍の後押しで蒙古軍政府を作った（5月）。11月には綏遠に攻め込んだが、傅作義の軍に百霊廟で敗れ、中国の抗日の気運を高めた。
  polities: [mengjiang, japan, roc]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/綏遠事件"
- year: 1937
  title: 蒙疆政権の成立
