  polities: [mongolia, roc, russia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Kyakhta_(1915)"
- year: 1919
  title: 外モンゴルの自治の取り消し
  text: ロシア革命でロシアの後ろ盾を失った外モンゴルに、北京政府の徐樹錚が軍を率いて入り、自治を取り消させた。
  polities: [mongolia, roc]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Occupation_of_Mongolia"
- year: 1921
  date: "1921-07-11"
  title: モンゴル人民革命
  text: 白軍のウンゲルンが中国軍を追ってフレーを占領した（2月）のに対し、スフバートルらのモンゴル人民党がソヴィエト赤軍とともにこれを破り、人民政府を立てた。ボグド・ハーンは権限を制限された君主として残った。
  polities: [mongolia, roc, soviet_union, white_movement]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/モンゴル人民革命"
- year: 1924
  date: "1924-11-26"
  title: モンゴル人民共和国の成立
