  text: 東モンゴルのベグ・アルスラン・モーリハイらが黄河の湾曲部の内側（オルドス、河套）に住みつき、ここを足場に明の陝西・山西の辺境を襲った。明は延綏の長城を築いて備えた（1474）。
  polities: [northern_yuan, ming]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/オルドス"
  at: [108.5, 39.4]
- year: 1473
  title: トルファンがハミを攻め取る
  text: トルファンのスルターン・アリーが明の羈縻のハミ（哈密衛）を攻め、ハミの王家の者を連れ去った。ハミは1482年に明の助けで王家に戻ったが、その後もトルファンとの間で奪い合われた。
  polities: [moghulistan, ming]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Kara_Del"
  at: [93.5, 42.8]
- year: 1479
  title: ダヤン＝ハンの即位
  text: マンドゥールン・ハンの死後、妃のマンドゥハイ（満都海）がチンギス・カンの子孫の幼いバト・モンケを立ててハーンとし（ダヤン＝ハン）、自ら軍を率いてオイラトを退けた。
  polities: [northern_yuan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ダヤン・ハーン"
- year: 1498
  title: リンプン派がラサを押さえる
  text: ツァンのリンプン派がウーに攻め込んでラサ一帯を支配し、ゲルク派の僧をラサの大祈願祭（モンラム）から締め出した。1517年にパクモドゥ派が取り戻した。
  polities: [rinpungpa, phagmodrupa]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Rinpungpa"
  at: [91.1, 29.65]
- year: 1510
  title: ダヤン＝ハンのモンゴル再統一
  text: ダヤン＝ハンが右翼（オルドス・トゥメト・ヨンシエブ）の反乱をダラン・テリグンの戦いで破り、東モンゴルを再統一した（年はおおよそ）。諸子を6つのトゥメン（万戸）に分け、のちの内外モンゴルの諸侯の祖となった。
  polities: [northern_yuan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ダヤン・ハーン"
- year: 1510
  title: モンゴルの右翼の諸侯が青海に逃れる
  text: ダヤン＝ハンに敗れた右翼のイブラーヒーム（亦不剌）らが青海に逃れて住みつき、明の西の羈縻衛所（関西七衛）は崩れていった。
  polities: [northern_yuan, ming]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Qinghai"
  at: [100.2, 36.9]
- year: 1514
  title: ヤルカンド・ハン国の成立
  text: モグーリスタンのハン家のスルターン・サイードが、カシュガルのアブー・バクルを追い、ヤルカンドを都にハン国を開いた。タリム盆地西部のオアシス都市は、1680年ごろまでチャガタイ家のハンが治めた。
  polities: [yarkent, dughlat]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヤルカンド・ハン国"
  at: [77.25, 38.4]
- year: 1532
  title: ヤルカンド・ハン国のチベット西部遠征
  text: スルターン・サイード・ハンとドゥグラト部のミールザー・ハイダルがラダック・チベット西部に遠征した。サイードは帰路に死に（1533）、ハイダルはのちカシミールを治めて歴史書『ラシード史』を書いた。
  polities: [yarkent]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Mirza_Muhammad_Haidar_Dughlat"
  at: [79.5, 33.5]
- year: 1542
  title: アルタン＝ハンが右翼の盟主となる
  text: ダヤン＝ハンの孫アルタン＝ハンがトゥメト部を率いてモンゴル右翼の盟主となった（1540年代）。オイラトや青海に遠征し、明に交易（馬市）を求めて毎年のように長城を越えた。
  polities: [tumed, northern_yuan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アルタン・ハーン"
  at: [111.7, 40.8]
- year: 1547
  title: チャハルの東遷
  text: モンゴルのハーンのダライスン・ハンが、アルタン＝ハンの圧迫を避けてチャハル部を率いて東の遼河上流へ移った。ハーン家の権威はさらに弱まり、明の遼東・薊州の辺境が襲われるようになった。
  polities: [northern_yuan, tumed]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Darayisung_Gödeng_Khan"
  at: [119.5, 43.5]
- year: 1559
  title: アルタン＝ハンの青海遠征
  text: アルタン＝ハンが青海に遠征し、一族を青海に住まわせた。モンゴルとチベットの結びつきが強まるきっかけとなった。
  polities: [tumed]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/アルタン・ハーン"
  at: [100.2, 36.9]
- year: 1565
  title: ツァン王（ツァンパ）の自立
  text: リンプン家の家臣シンシャクパ・ツェテン・ドルジェが主家を倒し、シガツェでツァン王を名のった。カルマ派を保護してゲルク派と争った。
  polities: [tsangpa, rinpungpa]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Tsangpa"
  at: [88.88, 29.27]
- year: 1572
  title: フフホト（帰化城）の建設
  text: アルタン＝ハンが陰山山脈の南に城を築き始めた（フフホト＝「青い城」。明は1575年に帰化城の名を与えた）。長城の外に逃れた漢人の農民も住み、モンゴルとの交易の町となった。
  polities: [tumed]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フフホト市"
  at: [111.65, 40.82]
- year: 1578
  title: アルタン＝ハンが「ダライ・ラマ」の称号を贈る
  text: アルタン＝ハンは青海のチャプチャルでチベットのゲルク派の高僧ソナム・ギャツォに会い、「ダライ・ラマ」の称号を贈った（ソナム・ギャツォは3世とされ、前の2人が1世・2世とされた）。モンゴルにチベット仏教が広まるきっかけとなった。
  polities: [tumed, phagmodrupa]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ダライ・ラマ3世"
  images:
    - file: "Sonam Gyatso.jpg"
      caption: ダライ・ラマ3世ソナム・ギャツォ（チベットの絵画）
    - file: "Altankhan.jpg"
      caption: アルタン＝ハン
  at: [100.6, 36.3]
- year: 1585
  title: エルデネ・ゾー寺の建立
  text: ハルハのアブタイ・ハンが、モンゴル帝国の都カラコルムの跡にモンゴル最初のチベット仏教の大寺院エルデネ・ゾーを建てた。翌1586年にはフフホトでダライ・ラマ3世に会った。
  polities: [khalkha]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/エルデニ・ゾー"
  at: [102.84, 47.2]
- year: 1588
  title: ダライ・ラマ3世の死と4世の選定
  text: ダライ・ラマ3世がモンゴルへの布教の旅の途中で死んだ。生まれ変わりとして、アルタン＝ハンの曾孫のモンゴル人ヨンテン・ギャツォが4世に選ばれ（1589年生まれ）、モンゴルとゲルク派の結びつきはさらに深まった。
  polities: [tumed]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ダライ・ラマ4世"
- year: 1603
  title: ベント・デ・ゴイスのヤルカンド訪問
  text: インドのムガル帝国から「キタイ（中国）」を探しに出たポルトガル人のイエズス会士ベント・デ・ゴイスがヤルカンドに着き、天山南路を通って甘粛の粛州にたどり着いた（1605）。キタイと中国が同じ国だと確かめられた。
  polities: [yarkent]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Bento_de_Góis"
  at: [77.25, 38.4]
- year: 1604
  title: リンダン＝ハンの即位
  text: 北元のハーンの家（チャハル）のリンダン＝ハンが即位した。ハーンの権威を取り戻そうとしたが、強引なやり方で内モンゴルの諸部の離反を招いた。
  polities: [northern_yuan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/リンダン・ハーン"
  at: [119.5, 43.5]
- year: 1618
  title: ツァン王がウーを征服
  text: ツァン王カルマ・プンツォク・ナムギャルがウーに攻め込んでラサを押さえ、チベットの大部分をまとめた。ゲルク派はモンゴルに助けを求めた。
  polities: [tsangpa, phagmodrupa]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Karma_Phuntsok_Namgyal"
  at: [91.1, 29.65]
- year: 1623
  title: ショロイ・ウバシがオイラトに敗れる
  text: ハルハ北西部のホトゴイト部のショロイ・ウバシ（アルタン・ハン）が、長く争ったオイラトとの戦いで殺された（年は要確認）。オイラトの諸部はこのころ西のジュンガル盆地・イルティシ川・ヴォルガ川へ移っていった。
  polities: [khalkha, dzungar]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Altan_Khan_of_the_Khalkha"
  at: [92.0, 50.0]
- year: 1624
  title: アンドラーデがグゲに来る
  text: ポルトガル人のイエズス会士アントニオ・デ・アンドラーデがインドからヒマラヤを越えてグゲ王国の都ツァパランに着き、教会を建てた。チベットに入った最初のヨーロッパ人宣教師だった。
  polities: [guge]
  importance: 3
  source: "https://en.wikipedia.org/wiki/António_de_Andrade"
  at: [79.7, 31.5]
- year: 1624
