  polities: [mongolia, roc, soviet_union]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/中ソ友好同盟条約"
- year: 1947
  date: "1947-05-01"
  title: 内モンゴル自治政府の成立
  text: 中国共産党のウランフーの指導で、王爺廟（ウランホト）に内モンゴル自治政府が作られた。1949年以後の中華人民共和国の民族区域自治の先がけとなった。
