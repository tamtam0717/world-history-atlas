  text: イギリス・中華民国・チベットがインドのシムラでチベットの地位を話し合った。中国は条約に署名せず、イギリスとチベットだけがインドとチベットの境界（マクマホン・ライン）に合意した。のちの中印国境紛争の原因となった。
  polities: [britain, tibet, roc]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/シムラ条約"
- year: 1915
  title: キャフタ協定
