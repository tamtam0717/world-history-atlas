  text: 辛亥革命で清の支配が崩れると、ハルハの諸侯は活仏ジェブツンダンバ・ホトクト8世をボグド・ハーン（皇帝）に推して独立を宣言した。ロシアが後ろ盾となった。
  polities: [mongolia, qing, russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ボグド・ハーン政権"
- year: 1913
  title: チベットの独立宣言
  text: 中国軍を追ってラサに戻ったダライ・ラマ13世が独立を宣言した。同じ年、チベットとモンゴルは互いの独立を認める条約を結んだ（その有効性は議論がある）。
  polities: [tibet, mongolia, roc]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/チベット_(1912-1951)"
- year: 1914
