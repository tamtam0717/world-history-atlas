# G2 内陸アジア（モンゴル・内モンゴル・新疆・チベット・青海・アムール・沿海州）の出来事（1648–2025）。
# 清・ロシアの国境条約（ネルチンスク・キャフタ・アイグン・北京・イリ）はここに置く（G1 と重複しないように申し送り）。

