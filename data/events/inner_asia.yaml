  text: 内モンゴル東部のホルチン部がリンダン＝ハンに対抗して後金のヌルハチと同盟した。翌年リンダンに攻められると後金が援軍を送り、ホルチンは清の皇室と婚姻を重ねる最も近い同盟者となった。
  polities: [northern_yuan, later_jin]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Khorchin_Mongols"
  at: [122.0, 44.5]
- year: 1628
  title: リンダン＝ハンの西進
  text: ハラチン・アオハンなど内モンゴル東部の諸部が後金に付いたため、リンダン＝ハンは西へ移り、トゥメトを破ってフフホトを奪った（1627–1628）。
  polities: [northern_yuan, tumed, later_jin]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/リンダン・ハーン"
  at: [111.65, 40.82]
- year: 1630
  title: ラダックがグゲ王国を滅ぼす
  text: ラダックのセンゲ・ナムギャルがグゲに攻め込み、王を捕らえて王国を滅ぼし、西チベット（ガリ）を併合した（年はおおよそ）。ツァパランのイエズス会の伝道所も閉ざされた。ガリは1679–84年のチベット・ラダック・ムガル戦争までラダックの支配下にあった。
  polities: [ladakh, guge]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/グゲ王国"
  at: [79.7, 31.5]
- year: 1630
  title: トルグート部のヴォルガ移住
  text: オイラトのトルグート部がホー・ウルロクに率いられて西へ移り、ヴォルガ川下流に住みついた（カルムイク）。1771年にその一部がイリへ戻った。
  polities: [dzungar]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/カルムイク"
  at: [46.0, 47.0]
- year: 1632
  title: ホンタイジのフフホト遠征
  text: 後金のホンタイジが内モンゴルの諸部を率いてチャハルに遠征し、フフホトに入った。リンダン＝ハンは戦わずに西の青海へ逃れ、1634年に甘粛のシラ・タラで病死した。
  polities: [later_jin, northern_yuan, tumed]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/リンダン・ハーン"
  at: [111.65, 40.82]
- year: 1634
  title: リンダン＝ハンの死
  text: 青海へ向かう途中、リンダン＝ハンが甘粛のシラ・タラで天然痘で死んだ。北元のハーンの権威はこれで失われた。
  polities: [northern_yuan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/リンダン・ハーン"
  at: [102.6, 37.9]
- year: 1635
  title: ジュンガルのエルデニ・バートルが即位
  text: ハラ・フラの子エルデニ・バートルがジュンガル部を継ぎ（1634）、イリを本拠にオイラトをまとめる遊牧国家を築いていった（ジュンガルの成立）。
  polities: [dzungar]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ジュンガル"
  at: [81.3, 43.9]
- year: 1637
  title: グシ・ハンが青海を征服
  text: ゲルク派の求めを受けたオイラトのホシュート部のグシ・ハンが青海に入り、カルマ派を保護していたハルハのチョクト・ホンタイジを破った（ウラーン・ホシューの戦い）。青海はホシュートの本拠となった。
  polities: [khoshut, khalkha]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/グシ・ハン"
  at: [100.2, 36.9]
- year: 1640
  title: モンゴル・オイラト法典の制定
  text: ジュンガルのエルデニ・バートルの呼びかけで、ハルハとオイラトの諸侯がタルバガタイに集まり、モンゴル・オイラト法典を定めた。ゲルク派の保護と、諸侯どうしの争いをやめることを約束した。
  polities: [dzungar, khalkha]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Mongol-Oirat_Code"
  at: [83.0, 46.7]
- year: 1640
  title: グシ・ハンがベリ王を倒す
  text: グシ・ハンがカム（東チベット）でゲルク派を迫害していたボン教徒のベリ王ドニョ・ドルジェを倒し、カムを従えた。
  polities: [khoshut]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Donyo_Dorje_(Beri)"
  at: [98.6, 31.6]
- year: 1642
  title: ガンデンポタンの成立（ダライ・ラマ政権）
  text: グシ・ハンがツァンのシガツェを落としてツァン王を倒し、チベットの統治権をダライ・ラマ5世に献じた。ダライ・ラマを頂点とする政教一致の政権（ガンデンポタン）が成立し、グシ・ハンはチベット王として軍事を握った。
  polities: [tibet, khoshut, tsangpa]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ガンデンポタン"
  images:
    - file: "5th Dalai Lama and Gushi Khan Lach van Kley (3756446).jpg"
      caption: ラサの宮殿にあったダライ・ラマ5世とグシ・ハンの像（キルヒャー『中国図説』、1667年）
    - file: "Thangka of the 5th Dalai Lama.jpg"
      caption: ダライ・ラマ5世のタンカ
  at: [91.1, 29.65]
- year: 1645
  title: ポタラ宮の建設が始まる
  text: ダライ・ラマ5世がラサのマルポリの丘にポタラ宮の建設を始めた（白宮は1648年に完成）。ダライ・ラマ政権の政治と宗教の中心となった。
  polities: [tibet]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ポタラ宮"
