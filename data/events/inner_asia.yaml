  polities: [mengjiang, japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/蒙古聯合自治政府"
- year: 1937
  title: モンゴルの大粛清
  text: チョイバルサンがソ連の求めに応じて、仏教の僧侶や「日本のスパイ」とされた政治家・ブリヤート人などを大量に処刑した（1937–1939）。数百の寺院が破壊された。
  polities: [mongolia, soviet_union]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Stalinist_repressions_in_Mongolia"
- year: 1944
  date: "1944-11-12"
  title: 東トルキスタン共和国（三区革命）
  text: ソ連の支援を受けたイリ地方のウイグル人・カザフ人などが蜂起し、グルジャで東トルキスタン共和国を建てた。翌年にはイリ・タルバガタイ・アルタイの「三区」を押さえた。
  polities: [east_turkestan, roc, soviet_union]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/東トルキスタン共和国_(1944年-1949年)"
- year: 1945
