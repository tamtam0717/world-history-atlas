# S1 北西インド・パキスタンの出来事（1648–2025）。
# インド大反乱（1857）・インド帝国の成立（1877）は europe.yaml、ナーディル・シャーのデリー略奪（1739）は ottoman.yaml、中印国境紛争（1962）は inner_asia.yaml にある。

# ---------------------------------------------------------------- ムガル帝国
- year: 1648
  title: デリーの新都シャージャハーナーバードと赤い城の完成
  text: シャー・ジャハーンがアーグラからデリーに都を移した。赤い城（ラール・キラー）とジャーマー・マスジドを中心とする新都は、ムガル帝国の繁栄を示した。
  polities: [mughal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ラール・キラー"
- year: 1653
  title: タージ・マハルの完成
  text: シャー・ジャハーンが亡き妃ムムターズ・マハルのためにアーグラに建てた墓廟。インド＝イスラーム建築の代表作。
  polities: [mughal]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/タージ・マハル"
- year: 1658
  title: アウラングゼーブの即位
  text: シャー・ジャハーンの病をきっかけに皇子たちが帝位を争い、アウラングゼーブがサムーガルの戦いで兄ダーラー・シコーを破って即位した。父はアーグラ城に幽閉された。
  polities: [mughal]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アウラングゼーブ"
- year: 1669
  title: マトゥラー周辺でジャート農民の反乱
  text: 重い税とヒンドゥー寺院の破壊に反発したジャート農民がゴークラの指導で反乱した。ジャートの反乱はくり返され、のちのバラトプル王国につながった。
  polities: [mughal, bharatpur]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Jat_uprising_of_Mathura"
- year: 1675
  title: シク教第9代グル、テーグ・バハードゥルの処刑
  text: カシミールのヒンドゥー教徒への改宗の強制に抗議したグル・テーグ・バハードゥルが、アウラングゼーブの命でデリーで処刑された。
  polities: [mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Guru_Tegh_Bahadur"
- year: 1679
  title: アウラングゼーブがジズヤを復活
  text: アクバルが廃止した非ムスリムへの人頭税（ジズヤ）を復活した。同じ年、マールワール王国を直轄にしようとしてラージプートの反乱（1679–1707）を招いた。
  polities: [mughal, rajput_marwar, rajput_mewar]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ジズヤ"
- year: 1699
  title: グル・ゴービンド・シングがカールサーを結成
  text: シク教第10代グルが、アーナンドプルで信徒の共同体カールサー（純粋な者）を作った。男性はシング（獅子）の名を名のり、武装した信仰共同体としてムガル帝国と戦った。
  importance: 2
  source: "https://ja.wikipedia.org/wiki/カールサー"
- year: 1707
  date: "1707-03-03"
  title: アウラングゼーブの死
  text: デカン遠征の陣中で没した。帝位をめぐる争いが続き、以後ムガル帝国は急速に衰え、各地の太守やラージプート・マラーター・シク教徒が自立していった。
  polities: [mughal]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アウラングゼーブ"
- year: 1716
  title: バンダ・シング・バハードゥルの処刑
  text: グル・ゴービンド・シングの死後、パンジャーブで農民を率いてムガル帝国に反乱したバンダ・シングが捕らえられ、デリーで処刑された。
  polities: [mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Banda_Singh_Bahadur"
- year: 1722
  title: サアーダト・ハーンがアワドの州長官に
  text: ペルシア系のサアーダト・ハーンがアワドに赴任し、事実上の独立国（アワド太守国）の基礎を築いた。
  polities: [awadh, mughal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アワド太守"
- year: 1727
  title: ジャイ・シング2世が新都ジャイプルを築く
  text: 天文学を好んだジャイ・シング2世は、碁盤の目の計画都市ジャイプルを築き、デリー・ジャイプルなどに天文台ジャンタル・マンタルを建てた。
  polities: [rajput_amber]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ジャンタル・マンタル"
- year: 1737
  title: バージーラーオ1世のデリー襲撃
  text: マラーターの宰相（ペーシュワー）バージーラーオ1世がデリーの近くまで攻め込んだ。翌1738年、ボーパールの戦いに敗れたニザームとの講和で、マラーターはマールワーを得た。
  polities: [maratha, mughal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バージー・ラーオ"
- year: 1752
  title: ドゥッラーニー朝がパンジャーブ・カシミールを得る
  text: アフマド・シャー・ドゥッラーニーの第3次インド遠征。ムガル帝国はラホール・ムルターンを譲り、カシミールもアフガン人の支配下に入った。
  polities: [durrani, mughal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アフマド・シャー・ドゥッラーニー"
- year: 1757
  title: アフマド・シャー・ドゥッラーニーのデリー略奪
  text: 第4次インド遠征でデリー・マトゥラー・アーグラを略奪した。翌年マラーター軍がパンジャーブまで進み、両者の決戦が近づいた。
  polities: [durrani, mughal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アフマド・シャー・ドゥッラーニー"
- year: 1761
  date: "1761-01-14"
  title: 第3次パーニーパットの戦い
  text: デリーの北のパーニーパットで、アフマド・シャー・ドゥッラーニーの軍がマラーター軍を大敗させた。マラーターの北インド進出は一時止まり、ムガル帝国の衰えは決定的になった。
  polities: [durrani, maratha, mughal, awadh, rohilla]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/第三次パーニーパットの戦い"
- year: 1765
  title: シク教徒のミスルがラホールを取る
  text: アフガン人の撤退の後、シク教徒の軍団（ミスル）がラホールを押さえ、パンジャーブを分けて治めた。
  polities: [sikh_misls, durrani]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Misl"
- year: 1771
  title: シャー・アーラム2世がデリーに戻る
  text: アラーハーバードで東インド会社の保護下にあった皇帝が、マラーター（マハーダージー・シンディア）の保護を受けてデリーに戻った。
  polities: [mughal, maratha]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/シャー・アーラム2世"
- year: 1774
  title: ロヒラ戦争
  text: アワドの太守シュジャー・ウッダウラが東インド会社の軍の助けを借りてロヒラを破り、ロヒルカンドを併合した。会社の軍を貸したベンガル総督ヘースティングズは、のちにイギリス議会で弾劾された。
  polities: [awadh, rohilla, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Rohilla_War"
- year: 1784
  title: マハーダージー・シンディアがムガル帝国の摂政に
  text: マラーターのシンディア家の当主マハーダージーが皇帝から摂政（ワキーレ・ムトラク）に任じられ、デリーと北インドの実権を握った。1788年にロヒラのグラーム・カーディルが皇帝を失明させると、デリーを奪い返した。
  polities: [maratha, mughal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Mahadaji_Shinde"
- year: 1799
  date: "1799-07-07"
  title: ランジート・シングがラホールを取る
  text: スケルチャキア・ミスルのランジート・シングがラホールに入り、1801年にパンジャーブのマハーラージャを名のった。シク王国の始まり。
  polities: [sikh_empire, sikh_misls]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ランジート・シング"
- year: 1801
  title: アワドが領土の半分を会社に譲る
  text: ウェルズリー総督がアワドに迫り、軍事保護同盟の費用としてロヒルカンド・ドアーブ南部・ゴーラクプルを割譲させた。残りのアワドも会社の保護下に入った。
  polities: [awadh, britain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Ceded_and_Conquered_Provinces"
- year: 1803
  date: "1803-09-11"
  title: イギリス軍がデリーに入る
  text: 第2次マラーター戦争で、レイク将軍の軍がデリーの戦い・ラスワーリーの戦いでシンディア軍を破った。皇帝シャー・アーラム2世はイギリスの保護下に入り、デリー周辺とガンジス・ヤムナー両河間がイギリス領となった。
  polities: [britain, maratha, mughal]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Battle_of_Delhi_(1803)"
- year: 1809
  date: "1809-04-25"
  title: アムリトサル条約（イギリスとシク王国）
  text: サトレジ川をイギリスとシク王国の境とした。川の南のパティヤーラーなどのシク諸侯はイギリスの保護下に入り、ランジート・シングは北西（アフガン人の地）へ勢力を広げた。
  polities: [britain, sikh_empire]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_Amritsar_(1809)"
- year: 1818
  title: ラージプートの諸王国がイギリスの保護下に
  text: 第3次マラーター戦争・ピンダーリー戦争のなかで、メーワール・マールワール・ジャイプルなどのラージプート諸国、ホールカル家・シンディア家・ボーパールがイギリスと保護条約を結んだ。イギリスはインドの最高権力となった。
  polities: [britain, rajput_mewar, rajput_marwar, rajput_amber, rajput_bikaner, maratha, bhopal]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Rajputana_Agency"
- year: 1819
  title: シク王国がカシミールを取る
  text: ショーピヤーンの戦いでシク軍がアフガン人の総督を破り、カシミールを併合した。前年にはムルターンも落としていた。
  polities: [sikh_empire, durrani]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Shopian"
- year: 1834
  title: シク王国がペシャーワルを併合
  text: シク王国の将軍ハリ・シング・ナルワーがペシャーワルを併合した。同じ年、ジャンムーのグラーブ・シングの部将ゾーラーワル・シングがラダックに攻め込んだ。
  polities: [sikh_empire, afghanistan, ladakh]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Hari_Singh_Nalwa"
- year: 1839
  date: "1839-06-27"
  title: ランジート・シングの死
  text: 「パンジャーブの獅子」ランジート・シングが没すると、シク王国は王位争いと軍の暴走で混乱した。
  polities: [sikh_empire]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ランジート・シング"
- year: 1843
  date: "1843-02-17"
  title: イギリスのシンド征服
  text: ネーピア将軍の軍がミアーニーの戦いでタールプル家のミールたちを破り、シンドを併合した。征服の正当性はイギリス国内でも批判された。
  polities: [britain, sindh]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ミアーニーの戦い"
- year: 1846
  date: "1846-03-09"
  title: 第1次シク戦争の終結（ラホール条約・アムリトサル条約）
  text: 第1次シク戦争（1845–46）に敗れたシク王国はジャランダル・ドアーブを失った。カシミールはイギリスがジャンムーのグラーブ・シングに売り、ジャンムー・カシミール藩王国が生まれた。
  polities: [sikh_empire, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/シク戦争"
- year: 1849
  date: "1849-03-29"
  title: イギリスがパンジャーブを併合
  text: 第2次シク戦争（1848–49）の後、シク王国は滅び、パンジャーブはイギリス領となった。幼いマハーラージャのドゥリープ・シングは退位させられ、ダイヤモンド「コーイヌール」はヴィクトリア女王に贈られた。
  polities: [britain, sikh_empire]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/シク戦争"
- year: 1853
  title: ジャーンシー・ナーグプル・アワドの併合（ダルハウジー総督）
  text: 跡継ぎのない藩王国を併合する原則によって、サーターラー（1848）・ジャーンシー（1853）・ナーグプル（1854）などを併合し、1856年には「失政」を理由にアワドも併合した。藩王や旧支配層の反発がインド大反乱につながった。
  polities: [britain, awadh]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/失権の原理"
- year: 1857
  date: "1857-05-10"
  title: メーラトの蜂起と反乱軍のデリー占領
  text: 新式銃の弾薬包に牛と豚の脂が使われているという噂をきっかけに、メーラトのシパーヒーが蜂起してデリーに向かい、皇帝バハードゥル・シャー2世を担いだ。反乱はアワド・ロヒルカンド・ブンデールカンドに広がった。
  polities: [britain, mughal, awadh]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/インド大反乱"
- year: 1857
  date: "1857-09-20"
  title: イギリス軍がデリーを奪い返す
  text: 4か月の包囲の末にイギリス軍がデリーを取り、皇帝を捕らえた。皇子たちは殺され、皇帝は翌年ビルマのラングーンへ流されて、ムガル帝国は滅んだ。
  polities: [britain, mughal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/バハードゥル・シャー2世"
- year: 1858
  date: "1858-06-17"
  title: ラクシュミー・バーイーの戦死
  text: ジャーンシーの王妃ラクシュミー・バーイーは反乱軍を率いて戦い、グワーリオル近くで戦死した。のちにインドの民族運動の象徴となった。
  polities: [britain, maratha]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラクシュミー・バーイー"

# ---------------------------------------------------------------- 英領インド
- year: 1875
  title: アリーガルにムスリムの学校（のちのアリーガル・ムスリム大学）
  text: サイイド・アフマド・ハーンが、ムスリムに西洋の学問を教える学校を開いた。のちのムスリムの政治運動（全インド・ムスリム連盟）の担い手を育てた。
  polities: [britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/サイイド・アフマド・ハーン"
- year: 1893
  date: "1893-11-12"
  title: デュアランド・ライン協定
  text: 英領インドとアフガニスタンの境（デュアランド・ライン）を定めた。パシュトゥーン人の住む地域が二つに分けられ、のちのパキスタンとアフガニスタンの対立の種となった。
  polities: [britain, afghanistan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/デュアランド・ライン"
- year: 1919
  date: "1919-04-13"
  title: アムリトサル事件
  text: 令状なしの逮捕・投獄を認めるローラット法に抗議してアムリトサルのジャリヤーンワーラー・バーグに集まった人々に、イギリス軍が発砲し、数百人が死んだ。インドの反英運動が大きく高まった。
  polities: [britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アムリトサル事件"
- year: 1920
  title: ガンディーの非協力運動
  text: 国民会議派がガンディーの指導で非暴力・非協力の運動を始めた（ヒラーファト運動とも協力）。1922年、ウッタル・プラデーシュのチャウリ・チャウラで農民が警察署を襲う事件が起きると、ガンディーは運動を中止した。
  polities: [britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/非暴力・不服従"
- year: 1929
  date: "1929-12-31"
  title: 国民会議派ラホール大会で「プールナ・スワラージ」を決議
  text: ネルーを議長とする国民会議派のラホール大会が、完全独立（プールナ・スワラージ）を目標に掲げた。
  polities: [britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/プールナ・スワラージ"
- year: 1930
  date: "1930-03-12"
  title: 塩の行進
  text: ガンディーがイギリスの塩の専売に抗議して、アフマダーバードのアーシュラムからダーンディーの海岸まで約380kmを歩き、海水から塩を作った。第2次非暴力・不服従運動の始まり。
  polities: [britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/塩の行進"
- year: 1935
  title: 1935年インド統治法
  text: 州の自治を広げ、藩王国を含む連邦制をめざした。1937年の州議会選挙では国民会議派が多くの州で勝った。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/インド統治法"
- year: 1940
  date: "1940-03-23"
  title: ラホール決議（パキスタン決議）
  text: ジンナーの率いる全インド・ムスリム連盟がラホールの大会で、ムスリムが多数を占める地域に独立した国を作ることを求めた。
  polities: [britain, pakistan]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/パキスタン決議"
- year: 1942
  date: "1942-08-08"
  title: 「インドから出て行け」運動
  text: 国民会議派がイギリスの即時撤退を求める決議をし、ガンディー・ネルーらが逮捕された。各地で暴動が起きたが、鎮圧された。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/インドから出て行け運動"

# ---------------------------------------------------------------- 独立後
- year: 1947
  date: "1947-08-15"
  title: インド・パキスタンの分離独立
  text: インド独立法により、イギリス領インドはヒンドゥー教徒の多いインドと、ムスリムの多いパキスタン（東西に分かれる）として独立した。パンジャーブとベンガルが分割され、約1000万人以上が国境を越えて移動し、数十万から100万人ともいわれる人が宗教対立の暴力で死んだ。
  polities: [india, pakistan, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/インド・パキスタン分離独立"
- year: 1947
  date: "1947-10-26"
  title: カシミールのインド帰属と第1次印パ戦争
  text: パキスタンの部族民がカシミールに攻め込むと、藩王ハリ・シングはインドへの帰属に署名し、インド軍が送られた。1949年1月の国連の仲介による停戦で、カシミールは停戦ラインで分けられた。
  polities: [india, pakistan]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/第一次印パ戦争"
- year: 1948
  date: "1948-01-30"
  title: ガンディーの暗殺
  text: ムスリムとの融和を説いたガンディーが、デリーでヒンドゥー至上主義者に暗殺された。
  polities: [india]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/マハトマ・ガンディー"
- year: 1948
  date: "1948-09-11"
