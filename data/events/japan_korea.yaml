# G3 日本・朝鮮の出来事（1648–2025）。europe.yaml にあるもの（日英同盟・日露戦争の開戦・日独伊三国同盟・太平洋戦争の開戦・日本の降伏）は書かない。

# ---- 江戸時代・朝鮮王朝後期 ----
- year: 1655
  title: 朝鮮通信使（明暦の通信使）
  text: 将軍の代替わりを祝う朝鮮の使節が江戸を訪れた。通信使は1607年から1811年まで12回送られ、対馬藩が朝鮮との外交・貿易を担った。
  polities: [joseon, japan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/朝鮮通信使"
- year: 1663
  title: 清が琉球国王を冊封
  text: 清の冊封使が琉球に来て尚質王を国王に封じた。琉球は清に朝貢しながら薩摩藩の支配も受ける「両属」の状態を続けた。
  polities: [ryukyu, qing, japan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/冊封使"
- year: 1669
  title: シャクシャインの戦い
  text: 松前藩の交易の独占に反発したアイヌの首長シャクシャインが蜂起したが、松前藩にだまし討ちにされた。以後、アイヌへの支配が強まった。
  polities: [japan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/シャクシャインの戦い"
- year: 1709
  title: 新井白石の正徳の治
  text: 6代将軍家宣のもとで新井白石が政治を主導し、長崎貿易を制限して金銀の流出を抑えた（海舶互市新例、1715年）。
  polities: [japan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/正徳の治"
- year: 1712
  title: 白頭山定界碑
  text: 清と朝鮮が白頭山（長白山）に境界の碑を立て、碑文で「西は鴨緑、東は土門」とし、鴨緑江と土門江（豆満江とされる）を両国の境とした。土門江の解釈はのちに間島問題の原因となった。
  polities: [joseon, qing]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/白頭山定界碑"
- year: 1716
  title: 享保の改革
  text: 8代将軍徳川吉宗が倹約・新田開発・上げ米・目安箱・公事方御定書などで幕府財政を立て直した。1720年には漢訳洋書の輸入制限をゆるめ、蘭学の発達のきっかけとなった。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/享保の改革"
- year: 1725
  title: 英祖の蕩平策
  text: 朝鮮の英祖が、両班の党派（老論・少論など）から公平に人材を登用して党争をおさえる蕩平策を進めた。正祖も受け継ぎ、朝鮮王朝後期の安定期となった。
  polities: [joseon]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/英祖"
- year: 1774
  title: 『解体新書』の刊行
  text: 杉田玄白・前野良沢らがオランダ語の解剖書を翻訳して刊行した。蘭学（洋学）が広まった。
  polities: [japan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/解体新書"
- year: 1787
  title: 寛政の改革
  text: 天明の大飢饉と打ちこわしの後、老中松平定信が倹約と農村の立て直し、朱子学以外の学問の禁止（寛政異学の禁）などを行った。
  polities: [japan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/寛政の改革"
- year: 1792
  title: ラクスマンの根室来航
  text: ロシアの使節ラクスマンが漂流民の大黒屋光太夫を連れて根室に来航し、通商を求めた。幕府は長崎への入港許可証を渡して帰らせた。
  polities: [russia, japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アダム・ラクスマン"
- year: 1804
  title: レザノフの長崎来航
  text: ロシアの使節レザノフが長崎で通商を求めたが、幕府は拒んだ。その後ロシア船が樺太・択捉島を襲い、幕府は蝦夷地全体を直轄にした（1807年）。
  polities: [russia, japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ニコライ・レザノフ"
- year: 1808
  title: フェートン号事件
  text: ナポレオン戦争でオランダと敵対していたイギリスの軍艦フェートン号が長崎に侵入し、オランダ商館員を人質にとった。同じ年から間宮林蔵が樺太を探検した。
  polities: [britain, japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/フェートン号事件"
- year: 1811
  title: 洪景来の乱
  text: 朝鮮北西部の平安道で、地方差別と勢道政治に反発した洪景来らが反乱を起こした。19世紀の朝鮮では各地で民衆の反乱が続いた。
  polities: [joseon]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/洪景来の乱"
- year: 1825
  title: 異国船打払令
  text: 幕府は日本の沿岸に近づく外国船を、ためらわずに撃退するよう命じた（無二念打払令）。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/異国船打払令"
- year: 1837
  title: 大塩平八郎の乱・モリソン号事件
  text: 天保の飢饉の中、大坂で元幕府役人の大塩平八郎が貧民救済をかかげて挙兵した。同じ年、漂流民を送り届けに来たアメリカ船モリソン号が打ち払われ、渡辺崋山・高野長英らが幕府を批判して処罰された（蛮社の獄、1839年）。
  polities: [japan, usa]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/モリソン号事件"
- year: 1842
  title: 天保の薪水給与令
  text: アヘン戦争で清がイギリスに敗れたことを知った幕府は、異国船打払令をやめ、外国船に燃料・水・食料を与えて帰らせることにした。老中水野忠邦は天保の改革を進めていた（1841–43年）。
  polities: [japan, qing, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/天保の薪水給与令"
- year: 1853
  date: "1853-07-08"
  title: ペリーの来航
  text: アメリカ東インド艦隊司令長官ペリーが4隻の軍艦（黒船）を率いて浦賀に来航し、開国を求める大統領の国書を渡した。ペリーは琉球にも立ち寄った。
  polities: [usa, japan, ryukyu]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/黒船来航"
- year: 1854
  date: "1854-03-31"
  title: 日米和親条約（開国）
  text: ペリーが再び来航し、下田・箱館の開港、燃料・食料の供給、アメリカへの最恵国待遇を認める条約を結んだ。イギリス・ロシア・オランダとも同様の条約を結び、「鎖国」が終わった。同じ年、ペリーは琉米修好条約も結んだ。
  polities: [usa, japan, ryukyu]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/日米和親条約"
- year: 1855
  date: "1855-02-07"
  title: 日露和親条約
  text: 下田で結ばれ、千島列島では択捉島と得撫島の間を国境とし、樺太は国境を定めず両国民の雑居の地とした。
  polities: [japan, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/日露和親条約"
- year: 1858
  date: "1858-07-29"
  title: 日米修好通商条約
  text: 大老井伊直弼が勅許を得ないまま調印した。神奈川・長崎・新潟・兵庫の開港と自由貿易を定め、領事裁判権を認め関税自主権がない不平等条約だった。オランダ・ロシア・イギリス・フランスとも結んだ（安政の五か国条約）。
  polities: [japan, usa, britain, france, russia, netherlands]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/日米修好通商条約"
- year: 1860
  date: "1860-03-24"
  title: 桜田門外の変
  text: 安政の大獄で尊王攘夷派を弾圧した大老井伊直弼が、江戸城の桜田門外で水戸藩の浪士らに暗殺された。幕府の権威が大きく揺らいだ。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/桜田門外の変"
- year: 1860
  title: 東学の創始
  text: 朝鮮の崔済愚が、西学（キリスト教）に対抗して儒・仏・道と民間信仰をあわせた東学を始めた。のちの甲午農民戦争の母体となった。
  polities: [joseon]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/東学"
- year: 1863
  title: 大院君の執政と攘夷
  text: 朝鮮で高宗が即位し、父の興宣大院君が実権を握った。大院君は勢道政治をおさえて王権を強める一方、カトリックを弾圧し、フランス（丙寅洋擾、1866年）・アメリカ（辛未洋擾、1871年）の艦隊を撃退して鎖国を守った。
  polities: [joseon, france, usa]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/興宣大院君"
- year: 1864
  title: 四国艦隊下関砲撃事件
  text: 攘夷を実行して外国船を砲撃した長州藩に、イギリス・フランス・オランダ・アメリカの艦隊が報復して下関の砲台を占領した。前年の薩英戦争とともに、薩摩・長州は攘夷の不可能をさとり、倒幕と開国に向かった。
  polities: [japan, britain, france, netherlands, usa]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/下関戦争"
- year: 1866
  title: 薩長同盟
  text: 坂本竜馬らの仲立ちで、薩摩藩と長州藩が倒幕に向けて手を結んだ。幕府の第2次長州征討は失敗した。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/薩長同盟"
- year: 1867
  title: 大政奉還と王政復古の大号令
  text: 15代将軍徳川慶喜が政権を朝廷に返した（10月）。倒幕派は王政復古の大号令を出して天皇中心の新政府をつくり、約260年続いた江戸幕府が終わった。
  polities: [japan]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/王政復古_(日本)"
- year: 1868
  title: 戊辰戦争と明治維新
  text: 鳥羽・伏見の戦いで新政府軍と旧幕府軍の戦争が始まり、江戸城は無血開城した。新政府は五箇条の御誓文で政治の方針を示し、元号を明治と改め、江戸を東京とした。
  polities: [japan, ezo_republic]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/明治維新"
- year: 1869
  title: 版籍奉還・箱館戦争の終結
  text: 諸藩が土地と人民を天皇に返した。五稜郭の旧幕府軍が降伏して戊辰戦争が終わり、蝦夷地は北海道と改められて開拓使が置かれた。
  polities: [japan, ezo_republic]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/版籍奉還"
- year: 1871
  title: 廃藩置県と岩倉使節団
  text: 藩を廃止して府県を置き、中央集権の体制ができた。岩倉具視を大使とする使節団が欧米を回り（–1873年）、条約改正の予備交渉と近代国家の視察を行った。清とは対等な日清修好条規を結んだ。
  polities: [japan, qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/廃藩置県"
- year: 1872
  title: 琉球藩の設置
  text: 明治政府が琉球国王尚泰を琉球藩王とし、琉球を日本の藩とした。王府は存続し、清への進貢も1874年まで続いたが、1875年に政府は清への朝貢を禁じた（王国が滅んだのは1879年の琉球処分）。
  polities: [japan, ryukyu, qing]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/琉球処分"
- year: 1873
  title: 徴兵令・地租改正・明治六年の政変
  text: 国民皆兵の徴兵令と、土地の価格に応じて現金で税をとる地租改正を行った。朝鮮への出兵（征韓論）をめぐって政府が分裂し、西郷隆盛・板垣退助らが政府を去った。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/地租改正"
- year: 1874
  title: 台湾出兵
  text: 琉球の漂流民が台湾で殺された事件を理由に、日本が台湾に出兵した。清は賠償金を払い、日本は琉球の帰属を有利に進めた。
  polities: [japan, qing, ryukyu]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/台湾出兵"
- year: 1875
  date: "1875-05-07"
  title: 樺太・千島交換条約
  text: 日本は樺太の権利をロシアにゆずり、かわりに千島列島全体を得た。
  polities: [japan, russia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/樺太・千島交換条約"
- year: 1875
  title: 江華島事件
  text: 日本の軍艦雲揚が朝鮮の江華島付近で挑発的な測量を行い、砲台と交戦した。
  polities: [japan, joseon]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/江華島事件"
- year: 1876
  date: "1876-02-26"
  title: 日朝修好条規
  text: 江華島事件をきっかけに、日本が朝鮮に釜山など3港の開港と日本の領事裁判権を認めさせた不平等条約。朝鮮を「自主の邦」とし、清の宗主権を否定しようとした。
  polities: [japan, joseon, qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/日朝修好条規"
- year: 1877
  title: 西南戦争
  text: 鹿児島の士族が西郷隆盛を立てて反乱を起こしたが、徴兵制の政府軍に敗れた。最後の士族反乱で、以後、政府への批判は自由民権運動に移った。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/西南戦争"
- year: 1879
  title: 琉球処分（沖縄県の設置）
  text: 明治政府が軍と警察を送って琉球藩を廃止し、沖縄県を置いた。琉球王国は滅び、清はこれに抗議した。
  polities: [japan, ryukyu, qing]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/琉球処分"
- year: 1882
  title: 壬午軍乱
  text: 朝鮮の漢城で、日本式の軍制改革に不満をもつ旧軍の兵士が反乱を起こし、日本公使館を襲った。清が軍を送って鎮圧し、朝鮮への影響力を強めた。同じ年、朝鮮はアメリカと条約を結んだ。
  polities: [joseon, qing, japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/壬午事変"
- year: 1884
  title: 甲申政変
  text: 日本と結んで近代化を急ぐ金玉均ら開化派（独立党）がクーデタを起こしたが、清軍に鎮圧された。1885年、日清両国は天津条約で朝鮮から撤兵し、出兵するときは互いに通知することを約束した。
  polities: [joseon, qing, japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/甲申政変"
- year: 1889
  date: "1889-02-11"
  title: 大日本帝国憲法の発布
  text: ドイツ（プロイセン）の憲法を手本に、伊藤博文らが起草した。天皇が統治権を総攬し、二院制の帝国議会を置いた。翌1890年に最初の総選挙と帝国議会が開かれ、日本はアジアで最初の立憲国家となった。
  polities: [japan]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/大日本帝国憲法"
- year: 1894
  title: 甲午農民戦争と日清戦争
  text: 朝鮮で東学の信徒を中心とする農民が蜂起した（甲午農民戦争、東学党の乱）。鎮圧のため清と日本が出兵し、日清戦争が始まった。日本は陸と海で勝ち進んだ。同じ年、日英通商航海条約で領事裁判権の撤廃が決まった（陸奥宗光外相。1899年に施行）。
  polities: [joseon, qing, japan, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/日清戦争"
- year: 1895
  date: "1895-04-17"
  title: 下関条約と三国干渉
  text: 清は朝鮮の独立を認め、遼東半島・台湾・澎湖諸島を日本にゆずり、賠償金2億両を払った。ロシア・フランス・ドイツの三国干渉で、日本は遼東半島を清に返した。10月には日本の公使らが朝鮮の王妃閔妃を殺害した（乙未事変）。
  polities: [japan, qing, joseon, russia, france, german_empire]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/下関条約"
- year: 1897
  title: 大韓帝国の成立
  text: 高宗がロシア公使館から王宮に戻り、国号を大韓帝国と改めて皇帝に即位した。清との宗属関係が終わったことを示した。
  polities: [joseon, russia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/大韓帝国"
- year: 1905
  date: "1905-09-05"
  title: ポーツマス条約
  text: アメリカのセオドア・ローズヴェルト大統領の仲介で日露戦争を終えた。ロシアは日本の韓国での優越を認め、遼東半島南部（関東州）の租借権と長春以南の鉄道（のちの南満洲鉄道）、北緯50度以南の樺太を日本にゆずった。賠償金がなかったので、東京では日比谷焼打ち事件が起きた。
  polities: [japan, russia, usa, joseon]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ポーツマス条約"
- year: 1905
  date: "1905-11-17"
  title: 第2次日韓協約（韓国の保護国化）
  text: 日本は韓国の外交権を奪って保護国とし、漢城に統監府を置いた（初代統監は伊藤博文）。アメリカ（桂・タフト協定）とイギリス（第2次日英同盟）は、日本の韓国支配を認めていた。
  polities: [japan, joseon]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/第二次日韓協約"
- year: 1907
  title: ハーグ密使事件と義兵闘争
