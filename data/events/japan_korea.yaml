  title: 55年体制の成立
  text: 社会党の統一に対抗して保守政党が合同し、自由民主党ができた。以後1993年まで、自民党が政権を握り社会党が野党第一党となる体制が続いた。
  polities: [japan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/55年体制"
- year: 1956
  date: "1956-10-19"
  title: 日ソ共同宣言と国際連合加盟
  text: 鳩山一郎首相がモスクワでソ連と国交を回復した。平和条約の締結後に歯舞・色丹を引き渡すとされたが、平和条約は結ばれていない。ソ連の支持で日本は国際連合に加盟した。
  polities: [japan, soviet_union]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/日ソ共同宣言"
  images:
    - file: "Ichiro Hatoyama 1953.jpg"
      caption: 鳩山一郎（1953年）
- year: 1960
  title: 日米安保条約の改定と韓国の四月革命
  text: 岸信介内閣が日米安全保障条約を改定し、激しい反対運動（安保闘争）が起こった。続く池田勇人内閣は所得倍増計画をかかげ、高度経済成長が進んだ。韓国では不正選挙に抗議する学生らの四月革命で李承晩が退陣した。
  polities: [japan, usa, south_korea]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/安保闘争"
- year: 1961
  date: "1961-05-16"
  title: 韓国の5・16軍事クーデタ
  text: 朴正煕らの軍人がクーデタで政権を握った。朴正煕は1963年に大統領となり、開発独裁のもとで輸出中心の工業化を進めた（「漢江の奇跡」）。
  polities: [south_korea]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/5・16軍事クーデター"
- year: 1964
  title: 東京オリンピックと東海道新幹線
  text: アジアで最初のオリンピックが東京で開かれ、東海道新幹線が開通した。日本はOECDに加盟し、1968年には国民総生産（GNP）が資本主義国でアメリカに次ぐ2位となった。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/高度経済成長"
- year: 1965
  date: "1965-06-22"
  title: 日韓基本条約
  text: 日本と韓国が国交を結んだ。韓国併合以前の条約の無効を確認し、日本は経済協力を約束した。韓国はベトナム戦争にも派兵した。
  polities: [japan, south_korea]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/日韓基本条約"
  images:
    - file: "A copy of Treaty on Basic Relations between Japan and the Republic of Korea.jpg"
      caption: 日韓基本条約（写し、大韓民国歴史博物館）
- year: 1968
  title: 小笠原諸島の返還
  text: アメリカの施政権下にあった小笠原諸島が日本に返された（地図では東京都のピースに含まれるので描いていない）。
  polities: [japan, usa]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/小笠原諸島"
- year: 1972
  date: "1972-05-15"
  title: 沖縄返還
  text: 佐藤栄作内閣のもとで、沖縄の施政権がアメリカから日本に返された。アメリカ軍の基地は残り、日本の米軍専用施設の多くが沖縄に集中している。
  polities: [japan, usa]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/沖縄返還"
  images:
    - file: "President Nixon and Prime Minister Eisaku Sato of Japan at San Clemente - NARA - 194752.jpg"
      caption: ニクソン大統領と佐藤栄作首相（1972年1月、サンクレメンテ）
    - file: "Map of US Military Bases in Okinawa in 1969.jpg"
      caption: 沖縄のアメリカ軍基地（1969年）
- year: 1972
  date: "1972-09-29"
  title: 日中国交正常化
  text: アメリカのニクソン大統領の訪中を受けて、田中角栄首相が北京を訪れ、日中共同声明で中華人民共和国と国交を結んだ。台湾の中華民国とは断交した。1978年には日中平和友好条約を結んだ。
  polities: [japan, prc, roc]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/日中共同声明"
  images:
    - file: "Joint Communique of Japan and China.jpg"
      caption: 日中共同声明（1972年9月29日）
- year: 1972
  title: 南北共同声明と維新体制
  text: 南北朝鮮が自主・平和・民族的団結の統一の原則を発表した。同じ年、韓国の朴正煕は維新憲法で独裁を強め、北朝鮮では金日成が国家主席となった。
  polities: [south_korea, north_korea]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/南北共同声明"
- year: 1973
  title: 石油危機と高度経済成長の終わり
  text: 第4次中東戦争をきっかけとする石油危機で、日本の高度経済成長は終わった。日本は省エネルギーと技術革新で不況を乗り切り、安定成長に移った。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/オイルショック"
- year: 1980
  date: "1980-05-18"
  title: 光州事件
  text: 朴正煕の暗殺（1979年）の後、全斗煥らの軍が実権を握り、民主化を求める光州の市民・学生を武力で鎮圧して多数の死者を出した。
  polities: [south_korea]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/光州事件"
- year: 1985
  title: プラザ合意
  text: 先進5か国がドル高を是正することで合意し、急速な円高が進んだ。日本は低金利政策のもとで地価・株価が高騰するバブル経済となった（1991年ごろに崩壊）。
  polities: [japan, usa, britain, france, west_germany]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/プラザ合意"
- year: 1987
  title: 韓国の民主化宣言
  text: 全国的な民主化運動（六月民主抗争）を受けて、与党の盧泰愚が大統領の直接選挙制を受け入れた（6・29民主化宣言）。翌1988年にはソウルオリンピックが開かれた。
  polities: [south_korea]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/6・29民主化宣言"
- year: 1991
  date: "1991-09-17"
  title: 南北朝鮮の国際連合同時加盟
  text: 冷戦の終わりで、韓国はソ連（1990年）・中国（1992年）と国交を結び、南北朝鮮がそろって国連に加盟した。
  polities: [south_korea, north_korea, soviet_union, prc]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/南北基本合意書"
- year: 1993
  title: 55年体制の終わりと北朝鮮の核危機
  text: 日本では自民党が分裂して総選挙で過半数を失い、細川護熙の非自民連立内閣ができた。北朝鮮は核拡散防止条約（NPT）からの脱退を表明し、第1次核危機となった（1994年の米朝枠組み合意で一時収まる。同年、金日成が死去）。
  polities: [japan, north_korea, usa]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/北朝鮮核問題"
- year: 1995
  title: 阪神・淡路大震災と地下鉄サリン事件
  text: 神戸を中心とする大地震で6400人以上が亡くなった。3月にはオウム真理教が東京の地下鉄にサリンをまいた。
  polities: [japan]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/阪神・淡路大震災"
- year: 1997
  title: アジア通貨危機
  text: タイの通貨の暴落から始まった危機がアジアに広がり、韓国はIMFの支援を受けた。日本でも大手の金融機関の破綻が相次いだ。
  polities: [south_korea, japan, siam, indonesia, malaysia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アジア通貨危機"
- year: 2000
  date: "2000-06-13"
  title: 南北首脳会談
  text: 韓国の金大中大統領が平壌を訪れ、金正日と初の南北首脳会談を行った（太陽政策）。金大中はノーベル平和賞を受けた。
  polities: [south_korea, north_korea]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/南北首脳会談"
- year: 2002
  date: "2002-09-17"
  title: 日朝首脳会談
  text: 小泉純一郎首相が平壌を訪れ、金正日と会談した（日朝平壌宣言）。北朝鮮は日本人の拉致を認め、被害者の一部が帰国した。日朝の国交はいまも結ばれていない。
  polities: [japan, north_korea]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/日朝首脳会談"
- year: 2006
  date: "2006-10-09"
  title: 北朝鮮の核実験
  text: 北朝鮮が最初の核実験を行い、国連安全保障理事会は制裁を決議した。北朝鮮は2017年までに6回の核実験を行い、弾道ミサイルの開発も進めた。
  polities: [north_korea]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/北朝鮮の核実験_(2006年)"
- year: 2011
  date: "2011-03-11"
  title: 東日本大震災と福島第一原子力発電所の事故
  text: 東北地方の太平洋沖でマグニチュード9.0の地震と大津波が起き、死者・行方不明者は約2万2000人にのぼった。福島第一原子力発電所で炉心溶融事故が起こり、多くの住民が避難した。
  polities: [japan]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/東日本大震災"
- year: 2018
  date: "2018-06-12"
  title: 南北首脳会談と米朝首脳会談
  text: 韓国の文在寅大統領と金正恩が板門店で会談し（4月）、6月にはシンガポールでアメリカのトランプ大統領と金正恩が初めての米朝首脳会談を行った。非核化の交渉は2019年に行きづまった。
  polities: [south_korea, north_korea, usa]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/2018年米朝首脳会談"
- year: 2024
  date: "2024-12-03"
  title: 韓国の非常戒厳
  text: 尹錫悦大統領が非常戒厳を宣布したが、国会が数時間で解除を議決した。尹錫悦は弾劾され、2025年4月に罷免された。6月の選挙で李在明が大統領となった。
  polities: [south_korea]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/2024年大韓民国非常戒厳"
