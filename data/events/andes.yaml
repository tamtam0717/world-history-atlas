  text: 国際通貨基金（IMF）の求める緊縮政策（燃料・運賃の値上げ）に反対する暴動がカラカスで起こり、鎮圧で数百人が死んだ。
  polities: [venezuela]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Caracazo"

- year: 1992
  date: "1992-04-05"
  title: フジモリの自主クーデタ
  text: ペルーのフジモリ大統領が軍の支持を得て議会を停止し、新憲法を作った。9月にはセンデロ・ルミノソの指導者グスマンを逮捕した。
  polities: [peru]
  importance: 2
  source: "https://en.wikipedia.org/wiki/1992_Peruvian_self-coup"

- year: 1993
  date: "1993-12-02"
  title: パブロ・エスコバルの死
  text: コカインの密輸で巨富を得てテロをくり返したメデジン・カルテルの首領が、コロンビアの警察に射殺された。
  polities: [colombia]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/パブロ・エスコバル"

- year: 1995
  title: セネパ紛争
  text: エクアドルとペルーがコンドル山脈の未画定の国境で戦った。1998年のブラジリア議定書で国境が確定した。
  polities: [ecuador, peru]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Cenepa_War"

- year: 1996
  date: "1996-12-17"
