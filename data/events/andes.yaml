  text: 半世紀続いた内戦を終わらせる合意。国民投票で一度否決された後、修正して結ばれた。サントス大統領はノーベル平和賞を受けた。
  polities: [colombia]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Colombian_peace_process"

- year: 2016
