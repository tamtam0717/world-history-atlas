  importance: 2
  source: "https://en.wikipedia.org/wiki/Revolutionary_Government_of_the_Armed_Forces"

- year: 1969
  title: アンデス協定（アンデス共同体）
  text: ボリビア・コロンビア・チリ・エクアドル・ペルーがカルタヘナ協定で地域統合を始めた（ベネズエラは1973年に参加）。
  polities: [colombia, peru, ecuador, bolivia, chile]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/アンデス共同体"

- year: 1975
  date: "1975-11-25"
