  importance: 2
  source: "https://ja.wikipedia.org/wiki/スリナム"

- year: 1976
  title: ベネズエラの石油国有化
  text: カルロス・アンドレス・ペレス政権が外国の石油会社を国有化し、国営石油会社（PDVSA）を作った。
  polities: [venezuela]
  importance: 3
  source: "https://en.wikipedia.org/wiki/PDVSA"

- year: 1978
  date: "1978-11-18"
  title: ジョーンズタウン事件
  text: ガイアナの奥地に移ったアメリカの宗教団体「人民寺院」の信者900人以上が集団で死亡した。
  polities: [guyana, usa]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/人民寺院"

- year: 1980
  title: センデロ・ルミノソの武装闘争
  text: 毛沢東主義のゲリラがアヤクーチョで武装闘争を始めた。軍との戦いで2000年までに約7万人が死に、犠牲者の多くは先住民の農民だった。
  polities: [peru]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/センデロ・ルミノソ"

- year: 1980
  date: "1980-02-25"
  title: スリナムの軍事クーデタ
  text: ボーターセらの軍曹たちが政権を倒した。1982年に反対派15人が殺され（十二月殺人）、オランダは援助を止めた。
  polities: [suriname]
  importance: 3
  source: "https://en.wikipedia.org/wiki/1980_Surinamese_coup_d'état"

- year: 1985
  date: "1985-11"
  title: 最高裁判所の占拠事件とアルメロの悲劇
  text: コロンビアでゲリラ M-19 が最高裁判所を占拠し、軍の突入で約100人が死んだ。その一週間後、ネバド・デル・ルイス火山の泥流でアルメロの町が埋まり、約2万3000人が死んだ。
  polities: [colombia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Palace_of_Justice_siege"

- year: 1989
  date: "1989-02-27"
