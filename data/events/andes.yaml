  text: 民衆に人気のあった自由党の指導者ガイタンの暗殺で、ボゴタで大暴動が起こった。保守党と自由党の内戦「ラ・ビオレンシア」（約20万人が死亡）が広がった。米州機構（OAS）の憲章を採択したボゴタ会議の最中だった。
