  importance: 1
  source: "https://ja.wikipedia.org/wiki/ウゴ・チャベス"
  images:
    - file: "Hugo Chávez crop.jpg"
      caption: "チャベス大統領（2008年）"

- year: 2000
  title: プラン・コロンビア
  text: アメリカ合衆国がコロンビアの麻薬対策・ゲリラ対策に巨額の軍事援助を始めた。
  polities: [colombia, usa]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Plan_Colombia"

- year: 2000
  title: エクアドルのドル化
  text: 金融危機の中、自国の通貨スクレをやめてアメリカのドルを法定通貨とした。
  polities: [ecuador]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Dollarization#Ecuador"

- year: 2000
