# A4 南米北部・アンデス（COL・VEN・ECU・PER・BOL・GUY・SUR・GUF）の出来事（1648–2025）

# ===== 植民地期 =====
- year: 1650
  title: ウィロビー卿がスリナムに入植地を開く
  text: バルバドスのイギリス人がパラマリボを拠点にサトウキビのプランテーションを始めた。
  polities: [britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Willoughbyland"

- year: 1667
  title: ブレダの和約でスリナムがオランダ領に
  text: 第2次英蘭戦争の講和。オランダが占領したスリナムを得て、イギリスはニューアムステルダム（ニューヨーク）を保った。
  polities: [netherlands, britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ブレダの和約"

- year: 1682
  title: イエズス会がモホスに布教村を開く
  text: アマゾン低地のモホス（ベニ）とチキートス（1691–）で、イエズス会が先住民を集めた布教村（レドゥクシオン）を作った。1767年のイエズス会の追放まで続いた。
  polities: [spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Jesuit_Missions_of_Moxos"

- year: 1717
  title: ヌエバ・グラナダ副王領の設置
  text: ペルー副王領の北部（今のコロンビア・エクアドル・ベネズエラ・パナマ）を分けて副王領とした。1723年にいったん廃止され、1739年に再び置かれた。
  polities: [spain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ヌエバ・グラナダ副王領"

- year: 1741
  date: "1741-03"
  title: カルタヘナの戦い
  text: ジェンキンズの耳の戦争で、ヴァーノンの率いるイギリスの大艦隊がカルタヘナを攻めたが、ブラス・デ・レソの守備隊と病気のために敗退した。
  polities: [britain, spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Cartagena_de_Indias"

- year: 1742
  title: フアン・サントス・アタワルパの反乱
  text: ペルー中部のアマゾン側で先住民アシャニンカなどが蜂起し、約100年スペイン人をこの地域から締め出した。
  polities: [spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Juan_Santos_Atahualpa"

- year: 1746
  date: "1746-10-28"
  title: リマ・カヤオの大地震
  text: 大地震と津波でカヤオの港が壊滅し、リマも大きな被害を受けた。
  polities: [spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/1746_Lima–Callao_earthquake"

- year: 1763
  date: "1763-02-23"
  title: ベルビセの奴隷反乱
  text: オランダ領ベルビセでクフィー（コフィ）らの奴隷が蜂起し、植民地の大半を押さえた。翌年、援軍に鎮圧された。ガイアナでは2月23日が共和国の日とされている。
  polities: [netherlands]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Berbice_slave_uprising"

- year: 1777
  title: ベネズエラ総監領の設置
  text: カラカス・クマナ・マラカイボ・ギアナなどの州を一人の総監の下にまとめた。今のベネズエラの範囲のもとになった。
  polities: [spain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ベネズエラ総督領"

- year: 1780
  date: "1780-11-04"
  title: トゥパク・アマルの反乱
  text: インカ皇帝の子孫を名のるトゥパク・アマル2世（ホセ・ガブリエル・コンドルカンキ）が、強制的な商品の割当や鉱山の労役（ミタ）に反対して蜂起した。翌年処刑されたが、反乱はアンデス南部に広がった。
  polities: [spain]
  importance: 1
  source: "https://en.wikipedia.org/wiki/Rebellion_of_Túpac_Amaru_II"
  images:
    - file: "Rebelión de Tupac Amaru, de Tadeo Escalante (1802-1840).jpg"
      caption: "タデオ・エスカランテ「トゥパク・アマルの反乱」（19世紀前半の壁画）"

- year: 1781
  title: トゥパク・カタリのラパス包囲
  text: アイマラの指導者トゥパク・カタリがラパスを半年近く包囲したが、捕らえられて処刑された。
  polities: [spain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Siege_of_La_Paz"

- year: 1781
  title: ヌエバ・グラナダのコムネーロスの反乱
  text: 増税に反対してソコロの住民が蜂起し、ボゴタに迫った。副王側は譲歩の約束をした後に指導者を処刑した。
  polities: [spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Revolt_of_the_Comuneros_(New_Granada)"

- year: 1802
  title: マイナスがペルー副王領に移される
  text: アマゾン上流のマイナスの統治をキトからリマに移す勅令が出された。独立後のエクアドルとペルーの長い国境紛争のもとになった。
  polities: [spain, peru, ecuador]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Real_Cédula_of_1802"

- year: 1806
  title: ミランダのベネズエラ遠征
  text: 独立運動の先駆者ミランダがアメリカ合衆国・イギリスの支援を受けてコロに上陸したが、住民は呼応せず失敗した。
  polities: [spain, venezuela]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フランシスコ・デ・ミランダ"

# ===== 独立戦争 =====
- year: 1809
  date: "1809-08-10"
  title: キトの「最初の叫び」
  text: スペイン本国がナポレオンに占領されたのを機に、5月のチュキサカ、7月のラパスに続いて、キトのクリオーリョが評議会を作った。いずれも年内に鎮圧された。
  polities: [spain, ecuador]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/キト自治宣言"

- year: 1810
  date: "1810-04-19"
  title: カラカスの最高評議会
  text: カラカスの市参事会が総監を退けて評議会を作った。名目上はフェルナンド7世に忠誠を誓ったが、独立への第一歩となった。
  polities: [venezuela, spain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Venezuelan_Declaration_of_Independence"

- year: 1810
  date: "1810-07-20"
  title: ボゴタの評議会（コロンビアの独立記念日）
  text: ボゴタの市民が副王を退けて評議会を作った。ヌエバ・グラナダの各地の都市もこれに続いたが、互いに争った。
  polities: [new_granada_united, spain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/コロンビア独立宣言"

- year: 1811
  date: "1811-07-05"
  title: ベネズエラの独立宣言
  text: ミランダとボリバルらの議会が、スペイン領アメリカで最初に独立を宣言した（第一共和国）。
  polities: [venezuela]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ベネズエラ独立宣言"
  images:
    - file: "Firma del acta de independencia de Venezuela.jpg"
      caption: "トバル・イ・トバル「ベネズエラ独立宣言の署名」（下絵、1876年）"

- year: 1812
  date: "1812-03-26"
  title: カラカス大地震と第一共和国の崩壊
  text: 大地震でカラカスなど独立派の町が壊れ、教会は「神の罰」と説いた。スペイン軍の反攻でミランダは降伏し、ボリバルはカルタヘナに逃れて「カルタヘナ宣言」を書いた。
  polities: [venezuela, spain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/1812_Caracas_earthquake"

- year: 1813
  title: ボリバルの「感嘆すべき遠征」
  text: ボリバルはヌエバ・グラナダからアンデスを越えてカラカスを奪回し、「解放者」の称号を得た（第二共和国）。1814年にボベスの平原の騎兵に敗れた。
  polities: [venezuela, spain]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Admirable_Campaign"

- year: 1814
  title: クスコの反乱（プマカワ）
  text: 先住民の首長プマカワとクリオーリョのアングロ兄弟がクスコで蜂起し、アレキパ・ラパスまで攻めたが、1815年に鎮圧された。
  polities: [spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Cuzco_Rebellion_of_1814"

- year: 1815
  date: "1815-09-06"
  title: ボリバルの「ジャマイカ書簡」
  text: 亡命先のジャマイカで、スペイン領アメリカの独立の正当性と、共和国の連合という将来の構想を書いた。
  polities: [venezuela]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Jamaica_Letter"

- year: 1815
  date: "1815-12-06"
  title: モリーリョの遠征軍がカルタヘナを落とす
  text: ナポレオン戦争後のスペインが送った約1万人の遠征軍が、105日の包囲でカルタヘナを落とし、1816年にボゴタに入って独立派を処刑した。
  polities: [spain, new_granada_united]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Siege_of_Cartagena_(1815)"

- year: 1819
  date: "1819-08-07"
  title: ボヤカの戦い
  text: ボリバルは雨季の平原と冬のアンデスを越えてヌエバ・グラナダに入り、副王軍を破ってボゴタを解放した。
  polities: [gran_colombia, venezuela, spain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ボヤカの戦い"
  images:
    - file: "Batalla de Boyaca de Martin Tovar y Tovar.jpg"
      caption: "トバル・イ・トバル「ボヤカの戦い」（1890年）"

- year: 1819
  date: "1819-12-17"
  title: アンゴストゥーラ会議と大コロンビアの成立
  text: オリノコ川岸のアンゴストゥーラの議会が、ベネズエラとヌエバ・グラナダを合わせた「コロンビア共和国」（大コロンビア）を宣言し、ボリバルを大統領とした。
  polities: [gran_colombia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アンゴストゥーラ会議"
  images:
    - file: "House of the Congress of Angostura.jpg"
      caption: "アンゴストゥーラ会議が開かれた建物（シウダー・ボリバル）"

- year: 1820
  date: "1820-10-09"
  title: グアヤキルの独立
  text: 港町グアヤキルが独立を宣言し、キト解放の拠点となった。
  polities: [guayaquil, spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Free_Province_of_Guayaquil"

- year: 1821
  date: "1821-06-24"
  title: カラボボの戦い
  text: ボリバルとパエスが王党派の主力を破り、ベネズエラの独立を事実上決めた。
  polities: [gran_colombia, spain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/カラボボの戦い"
  images:
    - file: "Batalla de Carabobo.JPG"
      caption: "トバル・イ・トバル「カラボボの戦い」（1887年、ベネズエラ国会議事堂の天井画）"

- year: 1821
  title: ククタ憲法
  text: 大コロンビアの憲法。首都をボゴタとし、奴隷の子を解放する「出生の自由」の法も定めた。
  polities: [gran_colombia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Congress_of_Cúcuta"

- year: 1821
  date: "1821-07-28"
  title: ペルーの独立宣言
  text: サン・マルティンがリマで独立を宣言し、護民官（プロテクトール）となった。山地にはなお副王軍が残った。
  polities: [peru, spain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ペルーの独立"
  images:
    - file: "La Independencia del Perú.jpg"
      caption: "レピアニ「ペルーの独立宣言」（リマで独立を宣言するサン・マルティン、1904年）"

- year: 1822
  date: "1822-05-24"
  title: ピチンチャの戦い
  text: スクレの軍がキトの郊外の火山の斜面で王党派を破り、キトを解放した。エクアドルは大コロンビアに入った。
  polities: [gran_colombia, spain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ピチンチャの戦い"

- year: 1822
  date: "1822-07-26"
  title: グアヤキル会談
  text: 南北の解放者ボリバルとサン・マルティンが会談した。内容は伝わらないが、その後サン・マルティンは身を引き、ペルーの解放はボリバルに委ねられた。
  polities: [gran_colombia, peru]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/グアヤキル会談"
  images:
    - file: "Entrevista de Guayaquil.jpg"
      caption: "グアヤキルで会うボリバルとサン・マルティン（1843年の版画）"

- year: 1824
  date: "1824-08-06"
  title: フニンの戦い
  text: ボリバルの騎兵がペルー中部の高原で副王軍を破った。
  polities: [peru, gran_colombia, spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Junín"

- year: 1824
  date: "1824-12-09"
  title: アヤクーチョの戦い
  text: スクレの率いる独立軍が副王ラ・セルナの軍を破り、副王が降伏した。南アメリカのスペイン支配は事実上終わった。
  polities: [peru, gran_colombia, spain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/アヤクーチョの戦い"
  images:
    - file: "Batalla de Ayacucho by Martín Tovar y Tovar (1827 - 1902).jpg"
      caption: "トバル・イ・トバル「アヤクーチョの戦い」"

- year: 1825
  date: "1825-08-06"
  title: ボリビアの独立
  text: アルト・ペルーの議会が独立を宣言し、解放者ボリバルにちなんで国名をボリバル共和国（のちボリビア）とした。初代大統領はスクレ。
  polities: [bolivia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ボリビアの歴史"
  images:
    - file: "Independence treaty of Bolivia.jpg"
      caption: "ボリビアの独立宣言（1825年）"

- year: 1826
  date: "1826-01-23"
  title: カヤオ要塞の降伏
  text: 王党派のロディルが1年以上の包囲の末に降伏した。南アメリカ本土でスペインが最後まで守った拠点だった。
  polities: [peru, spain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Siege_of_Callao_(1825–1826)"

- year: 1829
  title: 大コロンビアとペルーの戦争
  text: グアヤキルなどの帰属をめぐって戦い（1828–29）、タルキの戦いの後に講和した。
  polities: [gran_colombia, peru]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Gran_Colombia–Peru_War"

- year: 1830
  title: 大コロンビアの解体とボリバルの死
  text: ベネズエラ（パエス）とエクアドル（フローレス）が分離し、残りはヌエバ・グラナダ共和国となった。ボリバルは12月17日にサンタ・マルタ近くで病死した。
  polities: [gran_colombia, venezuela, ecuador, colombia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/大コロンビア"
  images:
    - file: "La Muerte del Libertador - Antonio Herrera Toro.jpg"
      caption: "エレーラ・トロ「解放者の死」（1889年）"
    - file: "Gran Colombia map.jpg"
      caption: "大コロンビアの地図（コダッツィ、1840年）"

# ===== 19世紀 =====
- year: 1831
  title: デメララとベルビセが英領ギアナになる
  text: 1814年にオランダから割譲された植民地がまとまった。1834年に奴隷制が廃止され（1838年に年季奉公も廃止）、その後インドなどから契約労働者が移住した。
  polities: [britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/イギリス領ギアナ"

- year: 1836
  date: "1836-10-28"
  title: ペルー・ボリビア連合の成立
  text: ボリビアのサンタ・クルスがペルーの内戦に介入し、ペルーを南北に分けてボリビアと合わせた連合国家を作った。勢力の均衡が崩れることを恐れたチリが12月に宣戦し、アルゼンチンも加わった（連合戦争。1839年のユンガイの戦いで連合は解体）。
  polities: [peru_bolivia, peru, bolivia, chile, argentina]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ペルー・ボリビア連合"

- year: 1839
  date: "1839-01-20"
  title: ユンガイの戦い
  text: チリとペルーの亡命派の「復古軍」がサンタ・クルスの軍を破り、ペルー・ボリビア連合が崩れた。
  polities: [peru_bolivia, chile, peru]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ペルー・ボリビア連合戦争"

- year: 1841
  date: "1841-11-18"
  title: インガビの戦い
  text: ボリビアに攻め入ったペルーのガマラ大統領が戦死し、ボリビアの独立が保たれた。
  polities: [bolivia, peru]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Ingavi"

- year: 1845
  title: グアノ・ブームの始まり
  text: 海鳥の糞が積もった肥料（グアノ）がヨーロッパに大量に輸出され、ペルー政府の収入の大半を占めた（1840年代–70年代）。チンチャ諸島では中国人の契約労働者（クーリー）が過酷な労働を強いられた。
  polities: [peru]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Guano_Era"

- year: 1851
  title: ヌエバ・グラナダとエクアドルの奴隷制廃止
  text: ヌエバ・グラナダ（ロペス政権、1852年施行）とエクアドル（ウルビナ政権）が奴隷制を廃止した。ベネズエラ・ペルーは1854年に続いた。
  polities: [colombia, ecuador]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Slavery_in_Colombia"

- year: 1854
  title: ベネズエラ・ペルーの奴隷制廃止
  text: ベネズエラ（モナガス政権）とペルー（カスティージャ）が奴隷制を廃止した。ペルーは先住民の貢納も廃止した。
  polities: [venezuela, peru]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Ramón_Castilla"

- year: 1859
  title: ベネズエラの連邦戦争
  text: 連邦制を唱える自由派と中央集権の保守派の内戦（1859–63）。数万人が死に、連邦派が勝ってベネズエラ合衆国となった。
  polities: [venezuela]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Federal_War"

- year: 1863
  title: リオネグロ憲法（コロンビア合衆国）
  text: 内戦に勝った自由派が、強い自治をもつ9つの州からなる連邦国家とした。
  polities: [colombia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Rionegro_Constitution"

- year: 1863
  date: "1863-07-01"
  title: スリナムの奴隷制廃止
  text: オランダ領スリナムで奴隷が解放された（さらに10年の国の監督下の労働）。のちインド・ジャワから契約労働者が来た。
  polities: [netherlands]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Keti_Koti"

- year: 1866
  date: "1866-05-02"
  title: カヤオの戦い（スペイン＝南太平洋戦争）
  text: 1864年にペルーのチンチャ諸島を占拠したスペイン艦隊に対し、ペルー・チリ・エクアドル・ボリビアが同盟して戦った。スペイン艦隊はカヤオを砲撃した後に引き上げた。
  polities: [peru, spain, chile]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Chincha_Islands_War"

- year: 1879
  date: "1879-10-08"
  title: アンガモスの海戦
  text: ペルーの装甲艦ワスカルがチリ艦隊に捕らえられ、艦長グラウが戦死した。チリが制海権を握った。
  polities: [chile, peru]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Battle_of_Angamos"

- year: 1881
  date: "1881-01-17"
  title: チリ軍のリマ占領
  text: チョリーヨス・ミラフローレスの戦いの後、チリ軍がリマに入り、1883年まで占領した。中部の山地ではカセレスがゲリラ戦を続けた。
  polities: [chile, peru]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Occupation_of_Lima"

- year: 1884
  title: ボリビアとチリの休戦協定
  text: ボリビアはアタカマの海岸（リトラル）をチリの支配に委ね、海への出口を失った（1904年の平和友好条約で確定）。
  polities: [bolivia, chile]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Treaty_of_Valparaíso"

- year: 1886
  title: コロンビアの1886年憲法（「再生」）
  text: ヌニェス大統領が連邦制をやめて中央集権の共和国とし、カトリックを国の宗教とした。この憲法は1991年まで続いた。
  polities: [colombia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Colombian_Constitution_of_1886"

- year: 1895
  date: "1895-06-05"
  title: エクアドルの自由主義革命
  text: エロイ・アルファロが政権を握り、政教分離・世俗教育・市民婚などの改革を進めた。
  polities: [ecuador]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Liberal_Revolution_of_1895"

- year: 1895
  title: ベネズエラ危機（英領ギアナとの境界紛争）
  text: 金の産地をめぐるベネズエラとイギリスの境界紛争に、アメリカ合衆国のクリーヴランド政権がモンロー主義を掲げて介入し、仲裁を受け入れさせた。
  polities: [venezuela, britain, usa]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Venezuela_Crisis_of_1895"

- year: 1899
  date: "1899-10-03"
  title: パリ仲裁裁定（英領ギアナとベネズエラの国境）
  text: 仲裁裁判がエセキボ川の西の大半をイギリス領とした。ベネズエラは1962年から裁定は無効だと主張している。
  polities: [venezuela, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Guayana_Esequiba"

- year: 1899
  title: 千日戦争
  text: コロンビアの自由党と保守党の内戦（1899–1902）。約10万人が死に、国が疲弊した中でパナマが1903年に分離した。
  polities: [colombia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/千日戦争"

- year: 1899
  title: ボリビアの連邦革命
  text: ラパスの自由党が南部スクレの保守党政府を倒し、政府・議会がラパスに移った（憲法上の首都はスクレのまま）。
  polities: [bolivia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Federal_Revolution"

- year: 1902
  date: "1902-12"
  title: ベネズエラの海上封鎖
  text: 債務の支払いを止めたカストロ政権に対し、イギリス・ドイツ・イタリアが港を封鎖した。アルゼンチンのドラゴ外相は武力による債権取り立てに反対した（ドラゴ主義）。
  polities: [venezuela, britain, germany]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Venezuelan_crisis_of_1902–1903"

- year: 1912
  title: プトゥマヨ事件
  text: ペルーのゴム会社がアマゾンの先住民に強制労働を課し、数万人が死んだことが、イギリスのケースメントの報告で明らかになった。
  polities: [peru, colombia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Putumayo_genocide"

- year: 1922
  title: ベネズエラの石油ブーム
  text: マラカイボ湖のバロソ2号井が大噴出し、外国の石油会社の開発が急に進んだ。1928年にはベネズエラは世界最大の石油輸出国となった。
  polities: [venezuela]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Petroleum_industry_in_Venezuela"

- year: 1922
  date: "1922-03-24"
  title: サロモン＝ロサノ条約
  text: ペルーとコロンビアがアマゾン地方の国境を決め、レティシアをコロンビアに渡すことにした（1928年批准、1930年引き渡し）。
  polities: [peru, colombia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Salomón–Lozano_Treaty"

- year: 1924
  title: アプラ（アメリカ人民革命同盟）の結成
  text: ペルーのアヤ・デ・ラ・トーレが亡命先のメキシコで作った運動。反帝国主義とインディオの統合（インディヘニスモ）を唱え、のちペルーの大政党となった。
  polities: [peru]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/アメリカ革命人民同盟"

- year: 1928
  date: "1928-12-06"
  title: バナナ農園の虐殺
  text: コロンビアのシエナガで、アメリカのユナイテッド・フルーツ社の労働者のストライキを軍が銃撃した。ガルシア＝マルケスの『百年の孤独』にも描かれた。
  polities: [colombia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Banana_massacre"

- year: 1929
  date: "1929-06-03"
  title: リマ条約（タクナ・アリカ問題の解決）
  text: アメリカ合衆国の仲介で、タクナはペルーに、アリカはチリに分けることが決まった。
  polities: [peru, chile]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Treaty_of_Lima_(1929)"

- year: 1932
  date: "1932-09-01"
  title: レティシア紛争
  text: ペルー人がコロンビア領のレティシアを占拠し、両国が戦った（1932–33）。国際連盟の委員会が初めて紛争地を管理し、1934年にコロンビアに戻った。
  polities: [peru, colombia]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Colombia–Peru_war"

- year: 1941
  date: "1941-07"
  title: エクアドル＝ペルー戦争
  text: アマゾン地方の国境をめぐる戦争で、ペルー軍がエル・オロ州を占領した。1942年のリオデジャネイロ議定書で、エクアドルは主張していたアマゾン地方の大半を失った。
  polities: [ecuador, peru]
  importance: 2
  source: "https://en.wikipedia.org/wiki/Ecuadorian–Peruvian_War"

# ===== 第二次世界大戦後 =====
- year: 1948
