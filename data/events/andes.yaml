  importance: 1
  source: "https://ja.wikipedia.org/wiki/ボゴタソ"
  images:
    - file: "Bogotazo.jpg"
      caption: "ボゴタソで燃える路面電車（1948年4月、国会議事堂の前）"

- year: 1952
  date: "1952-04-09"
  title: ボリビア革命
  text: 民族革命運動（MNR）と鉱山労働者・農民が軍を破り、パス・エステンソロ政権が錫鉱山の国有化・農地改革・普通選挙（先住民に投票権）を行った。
  polities: [bolivia]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ボリビア革命"
  images:
    - file: "Víctor Paz Estenssoro (1964) - CROPPED.jpg"
      caption: "革命で大統領になったパス・エステンソロ（1964年）"

- year: 1958
  date: "1958-01-23"
  title: ベネズエラの民主化（ペレス・ヒメネスの追放）
  text: 民衆蜂起と軍の離反で独裁者が追われた。主要政党がプント・フィホ協定を結び、二大政党の民主政が始まった。
  polities: [venezuela]
  importance: 2
  source: "https://en.wikipedia.org/wiki/1958_Venezuelan_coup_d'état"

- year: 1958
  title: コロンビアの国民戦線
  text: 自由党と保守党が大統領職を4年ごとに交代し、閣僚を分け合う協定。ラ・ビオレンシアを収めたが、ほかの勢力を排除した。
  polities: [colombia]
  importance: 2
  source: "https://en.wikipedia.org/wiki/National_Front_(Colombia)"

- year: 1960
  date: "1960-09-14"
  title: 石油輸出国機構（OPEC）の結成
  text: ベネズエラのペレス・アルフォンソの呼びかけで、ベネズエラとイラン・イラク・クウェート・サウジアラビアがバグダードで結成した。
  polities: [venezuela]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/石油輸出国機構"
  images:
    - file: "Juan Pablo Pérez Alfonzo (1964).jpg"
      caption: "OPEC の設立を主導したベネズエラのペレス・アルフォンソ（1964年）"

- year: 1964
  title: コロンビア革命軍（FARC）の結成
  text: 農民の自衛組織から生まれた左翼ゲリラ。同じころ民族解放軍（ELN）もできた。内戦は半世紀続き、約45万人が死んだとされる。
  polities: [colombia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/コロンビア革命軍"

- year: 1966
  date: "1966-05-26"
  title: ガイアナの独立
  text: 英領ギアナがガイアナとして独立した。直前のジュネーヴ協定で、ベネズエラとの係争は話し合いに委ねられた。
  polities: [guyana, britain, venezuela]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ガイアナ"

- year: 1967
  date: "1967-10-09"
  title: ゲバラの死
  text: キューバ革命の指導者チェ・ゲバラがボリビアでゲリラ戦を試みたが、アメリカの支援を受けたボリビア軍に捕らえられ処刑された。
  polities: [bolivia]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/チェ・ゲバラ"

- year: 1968
  date: "1968-10-03"
  title: ペルーのベラスコの軍事革命
  text: 軍が改革派の政府を作り、大農園を分ける農地改革と、アメリカ資本の石油会社などの国有化を進めた。
