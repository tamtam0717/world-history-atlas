# F4 中部・南部アフリカとインド洋の島々の出来事（1648–2025）
# ベルリン会議（1884）・南アフリカ戦争の開戦（1899）・ベルギー領コンゴの成立（1908）・コンゴ独立（1960）・
# アフリカの年（1960）・カーネーション革命（1974）・新カメルーン（1911）は他のファイルにあるので書かない。
# 場所がはっきりしたものには at: [経度, 緯度] を付けた。

# ===== 17–18世紀
- year: 1648
  date: "1648-08"
  title: ポルトガルがオランダからルアンダを奪い返す
  text: ブラジルから来たサルヴァドール・コレイア・デ・サーの艦隊がルアンダのオランダ軍を降伏させた。オランダと結んでいたンジンガ女王はマタンバに退き、ポルトガルはアンゴラの奴隷貿易の拠点を取り戻した。
  polities: [portugal, netherlands, matamba]
  importance: 2
  at: [13.23, -8.81]
  source: "https://ja.wikipedia.org/wiki/ルアンダ"

- year: 1652
  date: "1652-04-06"
  title: オランダ東インド会社がケープ植民地を建設
  text: ファン・リーベックが喜望峰の近くにアジア航路の補給基地を築いた。のちに入植者（ボーア人）が内陸に広がり、先住のコイコイ人・サン人の土地を奪っていった。
  polities: [netherlands]
  importance: 1
  at: [18.42, -33.92]
  source: "https://ja.wikipedia.org/wiki/ケープ植民地"

- year: 1656
  title: ンジンガ女王がポルトガルと和約を結ぶ
  text: 30年以上ポルトガルと戦ったマタンバのンジンガ女王が和約を結んだ。女王は1663年に死去した。
  polities: [matamba, portugal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ンジンガ・ムバンデ"

- year: 1665
  date: "1665-10-29"
  title: ムブウィラ（アンブイラ）の戦い
  text: コンゴ王国の軍がポルトガル軍に大敗し、国王アントニオ1世が戦死した。王国は王位を争う内乱に陥り、40年以上分裂した。
  polities: [kongo, portugal]
  importance: 2
  at: [14.45, -7.6]
  source: "https://en.wikipedia.org/wiki/Battle_of_Mbwila"

- year: 1688
  title: ユグノーがケープに入植
  text: ナントの王令の廃止でフランスを逃れたユグノー（プロテスタント）約200人がケープに着き、ドラケンステインでぶどう栽培を始めた。
  polities: [netherlands]
  importance: 3
  at: [19.12, -33.91]
  source: "https://en.wikipedia.org/wiki/Huguenots_in_South_Africa"

- year: 1693
  title: ロズウィ王国がポルトガル人を高原から追う
  text: チャンガミレ・ドンボのロズウィ軍がダンバラレなどポルトガル人の市を攻め落とし、ジンバブエ高原からポルトガル人を追い出した。ムタパ王国はザンベジ川の谷に退いた。
  polities: [rozwi, mutapa, portugal]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Rozvi_Empire"

- year: 1706
  date: "1706-07-02"
  title: キンパ・ヴィタの処刑
  text: コンゴの女預言者キンパ・ヴィタ（ドナ・ベアトリス）は聖アントニオが乗り移ったと説き、内乱の終わりと王国の再統一を訴えたが、火刑にされた。1709年にペドロ4世が王国を再統一した。
  polities: [kongo]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Kimpa_Vita"

- year: 1715
  title: フランスがモーリシャスを領有（フランス島）
  text: オランダが去ったモーリシャスをフランスが領有し、1721年から入植した。1735年からラ・ブルドネ総督がポール・ルイを建設し、インド洋のフランスの拠点とした。
  polities: [france]
  importance: 3
  at: [57.5, -20.16]
  source: "https://ja.wikipedia.org/wiki/モーリシャス"

- year: 1779
  title: ケープ辺境戦争（コーサ戦争）の始まり
  text: 東に広がるケープ植民地の入植者とコーサ人が、グレート・フィッシュ川一帯の牧草地をめぐって戦った。戦争は1879年まで9次にわたって続いた。
  polities: [netherlands, xhosa, britain]
  importance: 2
  at: [26.9, -33.2]
  source: "https://ja.wikipedia.org/wiki/コサ戦争"

- year: 1787
  title: アンドリアナンプイニメリナがメリナ王に
  text: マダガスカル中央高地で4つに分かれていたメリナの王国を統一し、「海が田の境」と全島の統一を目標に掲げた。
  polities: [merina]
  importance: 2
  at: [47.52, -18.91]
  source: "https://ja.wikipedia.org/wiki/アンドリアナンプイニメリナ"

- year: 1795
  title: イギリスがケープを占領
  text: フランス革命軍がオランダを占領すると、イギリス軍がケープを押さえた。いったんオランダ（バタヴィア共和国）に返したが、1806年に再び占領し、1814年に正式にイギリス領とした。
  polities: [britain, netherlands]
  importance: 2
  at: [18.47, -34.1]
  source: "https://ja.wikipedia.org/wiki/ケープ植民地"

# ===== 19世紀前半
- year: 1816
  title: シャカがズールーの首長になる
  text: シャカは年齢別の連隊と短い槍・盾の戦法で軍を改め、周りの首長国を征服してズールー王国を作った。
  polities: [zulu]
  importance: 1
  at: [31.4, -28.4]
  source: "https://ja.wikipedia.org/wiki/シャカ"

- year: 1817
  title: ラダマ1世がイギリスと条約を結ぶ
  text: メリナ王ラダマ1世は奴隷の輸出をやめる代わりに、イギリスから武器と軍事顧問を受け、「マダガスカル王」と認められた。これを背景に島の大部分を征服した。
  polities: [merina, britain]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/ラダマ1世"

- year: 1820
  title: ムフェカネ（ディファカネ）
  text: ズールー王国の台頭をきっかけに、南部アフリカの高原で戦争と人々の大移動が連鎖的に起こった（1815–40年ごろ）。ンデベレ・ガザ・ンゴニ・コロロなどの新しい国が遠くまで移って建てられ、バソト・スワジの王国が山や谷に拠って作られた。
  polities: [zulu, ndebele, gaza, ngoni, lesotho, swaziland]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/ムフェカネ"

- year: 1820
  title: イギリス人移民（1820年移民）
  text: イギリス政府が約4,000人の移民をケープ東部のオールバニに送り、コーサ人との境の守りとした。
  polities: [britain]
  importance: 3
  at: [26.53, -33.31]
  source: "https://en.wikipedia.org/wiki/1820_Settlers"

- year: 1824
  title: モシェシュがタバ・ボシウに拠る
  text: ムフェカネの混乱の中で、モシェシュがタバ・ボシウの山に拠って散った人々を集め、バソト王国（のちのレソト）を作った。
  polities: [lesotho]
  importance: 2
  at: [27.68, -29.36]
  source: "https://ja.wikipedia.org/wiki/モシェシュ1世"

- year: 1828
  date: "1828-09-22"
  title: シャカの暗殺
  text: シャカが異母弟ディンガネらに殺され、ディンガネがズールー王となった。
  polities: [zulu]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/シャカ"

- year: 1834
  date: "1834-12-01"
  title: ケープ植民地で奴隷制が廃止される
  text: 大英帝国の奴隷制廃止法が施行され、ケープの奴隷が解放された（4年間の「年季奉公」の期間つき）。奴隷の補償や英語化などへのボーア人の不満が、グレート・トレックの一因になった。
  polities: [britain]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/奴隷制度廃止法"

- year: 1835
  title: グレート・トレックが始まる
  text: イギリスの支配を嫌ったボーア人が牛車を連ねてケープ植民地から内陸に移住し（〜1840年代）、ナタール共和国・トランスヴァール・オレンジ自由国を作った。途中でンデベレ・ズールーと戦った。
  polities: [britain, ndebele, zulu, natalia, transvaal, orange_free_state]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/グレート・トレック"

- year: 1838
  date: "1838-12-16"
  title: ブラッド・リヴァーの戦い
  text: プレトリウスの率いるボーア人がズールー軍を破った。翌年、ボーア人はナタール共和国を建てた。
  polities: [natalia, zulu]
  importance: 2
  at: [30.54, -28.1]
  source: "https://ja.wikipedia.org/wiki/ブラッド・リバーの戦い"

- year: 1840
  title: ムジリカジがブラワヨに王国を建てる
  text: トランスヴァールを追われたムジリカジのンデベレ人がリンポポ川を越え、ジンバブエ南西部に王国を建てた。
  polities: [ndebele]
  importance: 3
  at: [28.58, -20.15]
  source: "https://ja.wikipedia.org/wiki/ムジリカジ"

- year: 1843
  title: イギリスがナタールを併合
  text: 港ダーバンをめぐる争いの末、イギリスがナタール共和国を併合した。ボーア人の多くは内陸に去った。
  polities: [britain, natalia]
  importance: 2
  at: [30.38, -29.6]
  source: "https://ja.wikipedia.org/wiki/ナタール植民地"

# ===== 19世紀後半
- year: 1852
  date: "1852-01-17"
  title: サンド・リヴァー協定
  text: イギリスがヴァール川以北のボーア人の独立を認めた（トランスヴァール、南アフリカ共和国）。1854年のブルームフォンテーン協定でオレンジ自由国の独立も認めた。
  polities: [transvaal, orange_free_state, britain]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/サンド・リヴァー協定"

- year: 1855
  date: "1855-11-16"
  title: リヴィングストンがヴィクトリアの滝に到達
  text: 宣教師リヴィングストンは1853–56年にアフリカ大陸を西のルアンダから東のケリマネまで横断し、途中でザンベジ川の大瀑布をヴィクトリアの滝と名づけた。彼の旅行記はヨーロッパ人のアフリカへの関心を高めた。
  polities: [kololo, britain]
  importance: 1
  at: [25.86, -17.92]
  source: "https://ja.wikipedia.org/wiki/デイヴィッド・リヴィングストン"

- year: 1857
  title: コーサの「牛殺し」
  text: 牛を殺し穀物を焼けば祖先がよみがえり白人を追い払う、という少女ノンガウセの予言を信じたコーサ人が牛を殺し、大飢饉で数万人が死んだ。生き残った人々の土地の多くはケープ植民地に取られた。
  polities: [xhosa, britain]
  importance: 3
  source: "https://en.wikipedia.org/wiki/Xhosa_cattle-killing_movement"

- year: 1867
  title: ダイヤモンドの発見（キンバリー）
  text: オレンジ川のほとりでダイヤモンドが見つかり、キンバリーに鉱山ができた。イギリスは1871年に産地のグリクワランド・ウェストを併合した。鉱山で財を成したセシル・ローズはデ・ビアス社でダイヤモンドを独占した。
  polities: [britain, orange_free_state]
  importance: 1
  at: [24.77, -28.74]
  source: "https://ja.wikipedia.org/wiki/キンバリー_(南アフリカ)"

- year: 1868
  title: バストランドがイギリスの保護下に入る
  text: オレンジ自由国との戦争で土地を失ったモシェシュがイギリスに保護を求めた。バストランド（レソト）は南アフリカ連邦に加わらず、のちに独立国となった。
  polities: [lesotho, britain, orange_free_state]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/バストランド"

- year: 1877
  title: スタンリーがコンゴ川を下る
  text: ジャーナリストのスタンリーは1874年にザンジバルを出てアフリカを横断し、1877年にコンゴ川を河口まで下った。その後レオポルド2世の依頼でコンゴの首長たちと条約を結び、コンゴ自由国のもとを作った。
  polities: [congo_free_state]
  importance: 2
  at: [13.4, -5.85]
  source: "https://ja.wikipedia.org/wiki/ヘンリー・モートン・スタンリー"

- year: 1877
  title: イギリスがトランスヴァールを併合
  text: 財政難とペディ王国との戦争に苦しむトランスヴァールをイギリスが併合した。ボーア人は1880年に反乱を起こした。
  polities: [britain, transvaal, pedi]
  importance: 2
  at: [28.19, -25.75]
  source: "https://ja.wikipedia.org/wiki/第一次ボーア戦争"

- year: 1879
  date: "1879-01-22"
  title: ズールー戦争（イサンドルワナの戦い）
  text: イギリスが最後通牒をつきつけてズールー王国に攻め込んだ。イサンドルワナの戦いではズールー軍がイギリス軍を全滅させたが、7月のウルンディの戦いで王国は敗れ、ケツワヨ王は捕らえられた。
  polities: [zulu, britain]
  importance: 1
  at: [30.65, -28.36]
  source: "https://ja.wikipedia.org/wiki/ズールー戦争"

- year: 1880
  title: ブラザとマココ王の条約
  text: フランスの探検家ブラザがテケ王マココと条約を結び、コンゴ川右岸をフランスの保護下に置いた。拠点はのちにブラザヴィルと呼ばれた。
  polities: [france, tio]
  importance: 3
  at: [15.28, -4.27]
  source: "https://ja.wikipedia.org/wiki/ピエール・サヴォルニャン・ド・ブラザ"

- year: 1881
  date: "1881-02-27"
  title: 第1次ボーア戦争（マジュバの戦い）
  text: ボーア人がマジュバ・ヒルの戦いでイギリス軍を破り、プレトリア協定（1881）でトランスヴァールは自治を取り戻した。
  polities: [transvaal, britain]
  importance: 2
  at: [29.87, -27.46]
  source: "https://ja.wikipedia.org/wiki/第一次ボーア戦争"

- year: 1884
  title: ドイツ領南西アフリカの成立
  text: ブレーメンの商人リューデリッツが買い取ったアングラ・ペケーナ湾の土地を、ビスマルクがドイツの保護領とした。ドイツ最初の植民地となった。
  polities: [german_empire, nama]
  importance: 1
  at: [15.16, -26.65]
  source: "https://ja.wikipedia.org/wiki/ドイツ領南西アフリカ"

- year: 1885
  title: 第1次フランス・メリナ戦争の講和
  text: 1883年から戦ったフランスとメリナ王国が講和した。メリナはディエゴ・スアレス湾をフランスに割譲し、外交をフランスにゆだねた（フランスは保護国と解釈した）。
  polities: [france, merina]
  importance: 3
  source: "https://ja.wikipedia.org/wiki/フランス・メリナ戦争"

- year: 1886
  title: ウィットウォーターズランドで金が見つかる
  text: トランスヴァールで世界最大の金鉱脈が見つかり、ヨハネスブルクが急速に大きくなった。外国人（ユイトランダー）とアフリカ人の出稼ぎ労働者が押し寄せた。
  polities: [transvaal, britain]
  importance: 1
  at: [28.05, -26.2]
  source: "https://ja.wikipedia.org/wiki/ヨハネスブルグ"

- year: 1889
  title: イギリス南アフリカ会社の設立
  text: セシル・ローズの会社がイギリス政府から特許を得て、リンポポ川の北の統治と開発を任された。1888年にンデベレ王ロベングラから得たラッド利権をもとに、翌年マショナランドに「パイオニア・コラム」を送った。ローズはケープからカイロまでをイギリス領で結ぶ構想（縦断政策）を描いた。
  polities: [britain, ndebele]
  importance: 1
  source: "https://ja.wikipedia.org/wiki/イギリス南アフリカ会社"

- year: 1890
  title: セシル・ローズがケープ植民地の首相に
  text: ダイヤモンド・金の鉱山王ローズがケープ植民地の首相となり、イギリス南アフリカ会社の拡大を進めた。会社の領地はのちにローデシアと名づけられた。
  polities: [britain]
  importance: 2
  at: [18.42, -33.93]
  source: "https://ja.wikipedia.org/wiki/セシル・ローズ"

- year: 1891
  date: "1891-12-20"
  title: ムシリが殺される（カタンガ）
  text: コンゴ自由国のステアーズ遠征隊が、カタンガのイェケ王ムシリを殺した。銅の豊かなカタンガはコンゴ自由国のものとなった。
  polities: [yeke, congo_free_state]
  importance: 3
  at: [26.97, -10.4]
  source: "https://en.wikipedia.org/wiki/Msiri"

- year: 1892
  title: コンゴ・アラブ戦争
  text: コンゴ自由国の公安軍が、マニエマ・スタンリー・フォールズのスワヒリ＝アラブ商人の勢力と戦い（〜1894年）、ニャングウェ・カソンゴを落とした。
  polities: [congo_free_state, tippu_tip]
  importance: 3
  at: [26.2, -4.2]
  source: "https://en.wikipedia.org/wiki/Congo_Arab_war"

- year: 1893
  title: 第1次マタベレ戦争
  text: イギリス南アフリカ会社の軍が機関銃でンデベレ王国の軍を破り、ブラワヨを落とした。
  polities: [britain, ndebele]
  importance: 2
  at: [28.58, -20.15]
  source: "https://en.wikipedia.org/wiki/First_Matabele_War"

- year: 1895
  date: "1895-09-30"
  title: フランスがマダガスカルを征服
  text: フランス軍がアンタナナリヴを落とし、メリナ王国を保護国とした。翌1896年に併合して植民地とし、1897年に女王ラナヴァルナ3世を廃して王制を終わらせた。ガリエニ総督が抵抗（メナランバの反乱）を鎮めた。
  polities: [france, merina]
  importance: 1
  at: [47.52, -18.91]
  source: "https://ja.wikipedia.org/wiki/フランス領マダガスカル"

- year: 1895
  date: "1895-12-28"
  title: ガザ王国の滅亡
  text: ポルトガルのムジーニョ・デ・アルブケルケがガザ王グングニャナを捕らえた。モザンビーク南部はポルトガルの支配下に入った。
  polities: [gaza, portugal]
  importance: 2
  at: [33.4, -24.6]
  source: "https://en.wikipedia.org/wiki/Gungunhana"

- year: 1895
  date: "1895-12-29"
  title: ジェームソン侵入事件
  text: ローズの部下ジェームソンがトランスヴァール政府を倒そうと攻め込んで失敗した。ローズは首相を辞め、ドイツ皇帝がクリューガー大統領を祝う電報を送って英独関係が悪化した。
  polities: [britain, transvaal]
  importance: 2
  source: "https://ja.wikipedia.org/wiki/ジェームソン侵入事件"

- year: 1896
  title: 第1次チムレンガ（ンデベレ・ショナの反乱）
  text: 土地と牛の収奪、強制労働に反発したンデベレ人とショナ人がイギリス南アフリカ会社に対して蜂起し、1897年に鎮圧された。
