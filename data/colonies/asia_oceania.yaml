      to: 1930
      text: 港としては香港ほど栄えず、本国にとって重要性は小さかった。ワシントン会議（1921–22年）で返還が約束され、交渉が長引いたのち、1930年10月に中華民国へ返された（海軍は1940年まで一部の施設を借りた）。
      source: "https://en.wikipedia.org/wiki/Weihaiwei_under_British_rule"
  source:
