    - from: 1898
      to: 1940
      text: 日清戦争後の列強の中国分割の中で、イギリスは1898年に九龍の北の新界を99年間租借した（期限は1997年）。辛亥革命では孫文ら革命派の拠点の一つになり、1925–26年には反英の省港ストライキで経済が止まった。
