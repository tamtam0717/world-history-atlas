      text: マラヤは自動車のタイヤに使うゴムと缶詰のスズで世界一の産地になり、本国にドルを稼ぐ植民地になったが、世界恐慌で大きな打撃を受けた。マレー人の間では教育を受けた人々の民族運動が、中国人の間では国民党と共産党の運動が育った（マラヤ共産党、1930年）。1941年12月、日本軍がコタバルに上陸した。
