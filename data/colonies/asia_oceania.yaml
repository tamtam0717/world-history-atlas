- id: british_ceylon
  name: イギリス領セイロン
  names:
    - { to: 1801, name: セイロン沿岸部（イギリス軍の占領）, kind: 占領地（東インド会社のマドラス管区が管理） }
    - { from: 1802, name: イギリス領セイロン, kind: 直轄植民地 }
  parent: britain
  # 1795–1801 はオランダから奪った沿岸部（副ラベルなし）。1802 年から「セイロン（イギリス領）」
  match:
    labels: [セイロン（イギリス領）]
    regions: [lk_west, lk_south, lk_east, lk_jaffna_mannar, lk_wanni, lk_coast_1766]
  from: 1795
  to: 1947
  polities: [sri_lanka, kandy]
  governors:
    - { name: フレデリック・ノース, title: 初代総督, from: 1798, to: 1805, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Ceylon" }
    - { name: ロバート・ブラウンリッグ, title: 総督, from: 1812, to: 1820, note: 1815年にキャンディ王国を併合, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Ceylon" }
    - { name: ヘンリー・モンク＝メイソン・ムーア, title: 最後の総督, from: 1944, to: 1948, note: 独立後は総督（ガヴァナー・ジェネラル）, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Ceylon" }
  periods:
    - from: 1795
      to: 1814
      text: 本国の革命戦争で、オランダはフランスの支配下（バタヴィア共和国）に入った。イギリスはフランスにインド航路の要所を握られないよう、1795–96年にオランダ領セイロンの沿岸部を占領し、アミアンの和約（1802年）で正式に獲得して直轄植民地にした。内陸には仏教徒のシンハラ人のキャンディ王国が残った。
      source: "https://ja.wikipedia.org/wiki/イギリス領セイロン"
    - from: 1815
      to: 1869
      text: 1815年、王に反発するキャンディの貴族と結んでキャンディ王国を滅ぼし、島の全体を支配した（1818年の反乱は鎮圧）。1830年代の改革で行政と司法が一本化され、英語教育が広まった。高地ではコーヒーの栽培が始まり、南インドからタミル人の労働者が連れてこられた。
      source: "https://en.wikipedia.org/wiki/British_Ceylon"
    - from: 1870
      to: 1930
      text: 1870年代からさび病でコーヒーが壊滅すると、高地は紅茶の大農園（プランテーション）に変わり、ゴムとココヤシも加わって、セイロンはイギリス資本の輸出作物の島になった。英語教育を受けた現地のエリートが育ち、仏教の復興運動とともにセイロン国民会議（1919年）が自治を求めた。
      source: "https://ja.wikipedia.org/wiki/イギリス領セイロン"
    - from: 1931
      to: 1947
      text: 1931年のドナモア憲法でアジアの植民地として初めて男女の普通選挙が行われ、国家評議会が生まれた。第二次世界大戦ではトリンコマリーとコロンボがイギリス東洋艦隊の基地となり、日本軍の空襲（1942年）を受けた。戦後のインド独立に続き、1948年2月にイギリス連邦の自治領セイロンとして独立した。
      source: "https://ja.wikipedia.org/wiki/スリランカの歴史"
  source:
    - "https://ja.wikipedia.org/wiki/イギリス領セイロン"
    - "https://en.wikipedia.org/wiki/British_Ceylon"

- id: british_maldives
  name: モルディブ（イギリスの保護国）
  parent: britain
  kind: 保護国（スルタンが統治。セイロン総督が管轄）
  match:
    labels: [モルディブ（イギリスの保護国）]
  from: 1887
  to: 1965
  polities: [maldives]
  periods:
    - from: 1887
      to: 1931
      text: 17世紀からオランダ領セイロンに貢ぎ物を送っていたモルディブのスルタンは、1887年にイギリスのセイロン総督と協定を結び、外交と防衛をイギリスに任せる保護国になった。内政はスルタンと有力な家が握り、イギリスは駐在官を置かなかった。
      source: "https://en.wikipedia.org/wiki/Maldives#British_protectorate"
    - from: 1932
      to: 1965
      text: 1932年に最初の憲法ができ、スルタンは選挙で選ばれるようになった。第二次世界大戦ではアッドゥ環礁のガン島にイギリスの基地が置かれ、戦後も空軍基地として使われた。1953年の一時的な共和制ののちスルタン制に戻り、1965年7月に完全に独立した（1968年に共和国）。
      source: "https://ja.wikipedia.org/wiki/モルディブの歴史"
  source:
    - "https://ja.wikipedia.org/wiki/モルディブの歴史"
    - "https://en.wikipedia.org/wiki/Maldives"

- id: british_burma
  name: イギリス領ビルマ
  names:
    - { to: 1936, name: イギリス領インドのビルマ州, kind: 英領インドの州 }
    - { from: 1937, name: イギリス領ビルマ, kind: 直轄植民地（インドから分離） }
  parent: britain
  # 1824–1936 の「英領インド（ビルマ州）」などは asia_africa.yaml の british_india（contains: 英領インド）が先に当たる。
  # シャン諸州など辺境の丘陵地帯（藩侯・首長が治める地域）もビルマの一部として含める（カレンニー諸州は名目上独立なので除く）
  match:
    labels: [英領ビルマ, 英領インド（ビルマ州）, 英領インド（ペグー州）, アラカン（英領インド）, テナセリム（英領インド）, アラカン（イギリス軍の占領）, テナセリム（イギリス軍の占領）, 上ビルマ（イギリス軍の占領）, シャン諸州, ワ州, ケントゥン, チン丘陵, カチン丘陵]
  from: 1824
  to: 1947
  polities: [burma]
  governors:
    - { name: アーチボルド・コクラン, title: 総督, from: 1936, to: 1941, note: インドから分かれた最初の総督, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Burma" }
    - { name: レジナルド・ドーマン＝スミス, title: 総督, from: 1941, to: 1946, note: 日本軍の侵攻でインドのシムラに逃れた, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Burma" }
  periods:
    - from: 1824
      to: 1851
      text: ビルマのコンバウン朝はアッサムからベンガルへ勢力を伸ばし、イギリス東インド会社とぶつかった。第1次ビルマ戦争（1824–26年）に敗れ、ヤンダボ条約でアラカンとテナセリムを割譲した。両地方は英領インドの一部としてベンガル総督の下に置かれた。
      source: "https://ja.wikipedia.org/wiki/英緬戦争"
    - from: 1852
      to: 1885
      text: 第2次ビルマ戦争（1852年）でイギリスは下ビルマ（ペグー）を奪い、1862年にアラカン・テナセリムと合わせて英領インドのビルマ州とした。ラングーンは米の輸出港として栄え、イラワディ川のデルタが開墾された。上ビルマに残ったミンドン王は近代化を進めた。
      source: "https://en.wikipedia.org/wiki/British_rule_in_Burma"
    - from: 1885
      to: 1919
      text: フランスがインドシナから上ビルマに近づくと、イギリスは第3次ビルマ戦争（1885年）でマンダレーを占領してティーボー王をインドへ流し、コンバウン朝を滅ぼした（1886年、ビルマ全土を英領インドに併合）。平野は直接統治、シャン・カチン・チンなどの丘陵地帯は首長を通じた間接統治とし、インド人の官吏・金貸し・労働者が多く移り住んだ。
      source: "https://ja.wikipedia.org/wiki/コンバウン王朝"
    - from: 1920
      to: 1941
      text: 仏教青年会から始まった民族運動は、学生のストライキ（1920年）やサヤー・サンの農民反乱（1930–32年）に広がった。1935年のビルマ統治法により、1937年にビルマはインドから切り離されて直轄植民地となり、議会と首相が置かれた。アウン・サンらのタキン党（われらビルマ人連盟）は完全独立を求めた。
      source: "https://ja.wikipedia.org/wiki/イギリス領ビルマ"
    - from: 1942
      to: 1947
      text: 1942年、アウン・サンのビルマ独立義勇軍とともに日本軍が侵攻し、イギリスはインドへ退いた（1943年に日本の後押しでバー・モウのビルマ国）。アウン・サンは1945年3月に日本に反旗をひるがえした（抗日蜂起）。戦後、反ファシスト人民自由連盟がイギリスと交渉し、アウン・サンは1947年7月に暗殺されたが、1948年1月にビルマ連邦として独立し、イギリス連邦には加わらなかった。
      source: "https://ja.wikipedia.org/wiki/アウンサン"
  note: カレンニー諸州（名目上はイギリスの保護下の独立国）は含めない。
  source:
    - "https://ja.wikipedia.org/wiki/イギリス領ビルマ"
    - "https://en.wikipedia.org/wiki/British_rule_in_Burma"

- id: aden_colony
  name: アデン
  names:
    - { to: 1936, name: アデン（英領インドの一部）, kind: 英領インドのボンベイ管区に属する入植地 }
    - { from: 1937, name: アデン植民地, kind: 直轄植民地 }
  parent: britain
  # 1839–1936 の「アデン（英領インドの一部）」は british_india の contains（英領インド）が先に当たる
  match:
    labels: [アデン（英領インドの一部）, アデン（イギリスの植民地）]
  from: 1839
  to: 1967
  polities: [south_yemen]
  governors:
    - { name: スタッフォード・ヘインズ, title: 政務官（ポリティカル・エージェント）, from: 1839, to: 1854, note: アデンを攻め取った東インド会社の海軍士官, source: "https://en.wikipedia.org/wiki/Stafford_Bettesworth_Haines" }
  periods:
    - from: 1839
      to: 1868
      text: インドとスエズを結ぶ汽船の石炭補給地を求めたイギリス東インド会社は、1839年にラヘジュのスルタンからアデンを奪い、ボンベイ管区の下に置いた。紅海の入口を押さえる港は、ムハンマド・アリーのエジプトの勢力が南アラビアに伸びるのを抑える意味もあった。
      source: "https://ja.wikipedia.org/wiki/アデン"
    - from: 1869
      to: 1936
      text: 1869年にスエズ運河が開くと、アデンはヨーロッパとインド・極東を結ぶ航路の中継港として大きく育った。後背地の首長たちとは保護条約を結んでアデン保護領とし、北のイエメンを支配するオスマン帝国と20世紀の初めに境界を定めた。
      source: "https://en.wikipedia.org/wiki/Aden_Settlement"
    - from: 1937
      to: 1967
      text: 1937年に英領インドから切り離されて直轄植民地となった。戦後は石油精製所と軍の基地で人口が増え、労働組合とアラブ民族主義が強まった。イギリスは1963年にアデンを南アラビア連邦に入れたが、民族解放戦線（NLF）などの武装闘争が続き、1967年11月にイギリス軍が撤退して南イエメン人民共和国が独立した。
      source: "https://ja.wikipedia.org/wiki/アデン非常事態"
  source:
    - "https://ja.wikipedia.org/wiki/アデン"
    - "https://en.wikipedia.org/wiki/Colony_of_Aden"

- id: aden_protectorate
  name: アデン保護領
  names:
    - { from: 1959, name: 南アラビア連邦, kind: イギリスの保護下の連邦（首長国の連合） }
  parent: britain
  kind: 保護領（首長・スルタンとの保護条約）
  match:
    labels: [アデン保護領, 南アラビア連邦（イギリスの保護下）]
  from: 1886
  to: 1967
  polities: [south_yemen]
  periods:
    - from: 1886
      to: 1936
      text: アデンの港を守るため、イギリスは後背地のラヘジュ・ファドリ・アウラキなどの首長・スルタンと次々に保護条約を結び、外交を握る代わりに内政は任せた。北のイエメンを治めるオスマン帝国とは20世紀の初めに境界を定めた（第一次世界大戦ではオスマン軍がラヘジュまで攻め込んだ）。
      source: "https://en.wikipedia.org/wiki/Aden_Protectorate"
    - from: 1937
      to: 1958
      text: アデンが直轄植民地になると、保護領は西部（アデン寄り）と東部（ハドラマウト）に分けて治められた。イギリスは首長たちとの「助言条約」で支配を強め、空軍による威圧で部族の反乱を抑えた。北イエメンのイマームは南の全体を自分の領土だと主張した。
      source: "https://en.wikipedia.org/wiki/Aden_Protectorate"
    - from: 1959
      to: 1967
      text: 1959年、西部の首長国が南アラビア連邦（はじめは南アラビア首長国連邦）を作り、1963年にアデンも加わった。しかしナセルのアラブ民族主義に影響された民族解放戦線（NLF）などが武装闘争を始め（アデン非常事態）、1967年に首長たちの政府は崩れて、イギリスの撤退とともに南イエメン人民共和国が成立した。
      source: "https://ja.wikipedia.org/wiki/南アラビア連邦"
  source:
    - "https://en.wikipedia.org/wiki/Aden_Protectorate"
    - "https://ja.wikipedia.org/wiki/南アラビア連邦"

