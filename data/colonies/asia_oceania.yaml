      text: 1944年、アメリカ軍は日本の委任統治領だったマーシャル諸島・マリアナ諸島・パラオを攻め取った。戦後、1947年に国際連合の信託統治領となり、アメリカが「戦略地区」として治めた。マーシャル諸島のビキニ環礁とエニウェトク環礁では核実験が行われ（1946–58年）、1954年の水爆実験では日本の漁船第五福竜丸も被曝した。
      source: "https://ja.wikipedia.org/wiki/太平洋諸島信託統治領"
    - from: 1963
      to: 1993
      text: 1960年代から教育と援助が増え、ミクロネシア議会（1965年）で自治が進んだ。島々は一つにまとまらず、北マリアナ諸島はアメリカの自治領（コモンウェルス）を選び、ミクロネシア連邦・マーシャル諸島（1979年）・パラオ（1981年）はそれぞれ自治政府を作って、アメリカと自由連合盟約を結んで独立した（1986年、パラオは1994年）。
