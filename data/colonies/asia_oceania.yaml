      source: "https://ja.wikipedia.org/wiki/フランス領インド"
    - from: 1742
      to: 1763
      text: 総督デュプレクスは、インドの王侯の跡継ぎ争いに介入し、インド人の兵士（シパーヒー）を使ってイギリスと争った（カーナティック戦争）。オーストリア継承戦争中の1746年にはマドラスを占領し、北サルカールの徴税権も得た。しかし本国はデュプレクスを呼び戻し、七年戦争でイギリスに敗れて、パリ条約（1763年）でインドでの軍備を禁じられた。
