      source: "https://en.wikipedia.org/wiki/Portuguese_Timor"
    - from: 1942
      to: 1975
      text: 中立国の領土だったが、1941年12月にオランダ・オーストラリア軍が、続いて1942年に日本軍が上陸し、戦場となって多くの住民が死んだ。戦後ポルトガルの支配が戻った。本国のカーネーション革命（1974年）で脱植民地化が始まると内戦になり、1975年11月にフレティリンが独立を宣言したが、12月にインドネシアが侵攻して併合した（2002年に東ティモールとして独立）。
      source: "https://ja.wikipedia.org/wiki/東ティモールの歴史"
  source:
