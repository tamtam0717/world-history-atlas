      text: 日本の降伏で、朝鮮は北緯38度線を境に北をソ連軍、南をアメリカ軍が占領した。アメリカは軍政庁を置き、朝鮮人の作った朝鮮人民共和国を認めなかった。モスクワ三国外相会議（1945年12月）の信託統治案をめぐって左右の勢力が激しく対立し、米ソ共同委員会も決裂した。1948年5月、国際連合の監視のもと南だけで選挙が行われ、8月に李承晩を大統領とする大韓民国が成立した（済州島四・三事件などの混乱が続いた）。
      source: "https://ja.wikipedia.org/wiki/在朝鮮アメリカ陸軍司令部軍政庁"
  source:
