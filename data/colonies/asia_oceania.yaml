      text: 明の海禁のもとで、倭寇の取締りに協力したポルトガル人は1557年ごろマカオに住むことを許された（毎年地代を払う）。マカオは広州の絹・生糸と日本の銀をつなぐ南蛮貿易の中継地として栄え、イエズス会の東アジア布教の拠点になった（聖パウロ天主堂）。
      source: "https://ja.wikipedia.org/wiki/マカオの歴史"
    - from: 1640
      to: 1840
      text: 江戸幕府がポルトガル船の来航を禁じ（1639年）、マラッカもオランダに奪われて、マカオは大きな市場を失った。18世紀からは広州で貿易するヨーロッパ各国の商人が、取引の季節以外に住む町になった。
      source: "https://en.wikipedia.org/wiki/History_of_Macau"
    - from: 1841
      to: 1948
      text: アヘン戦争後、香港がイギリス領になると、ポルトガルもマカオの主権を主張し、総督アマラルは1849年に清の役人を追い出して地代の支払いをやめた。1887年の中葡和好通商条約で清はポルトガルの統治を認めた。賭博と苦力（クーリー）貿易で知られた。第二次世界大戦では中立国の領土として日本の占領を免れた。
      source: "https://ja.wikipedia.org/wiki/マカオの歴史"
    - from: 1949
      to: 1999
      text: 1966年、文化大革命の影響を受けた暴動（一二・三事件）で、ポルトガルの統治は事実上中国の影響下に入った。本国のカーネーション革命（1974年）後、ポルトガルは返還を申し出、1987年の中葡共同声明で1999年12月20日に中国へ返された（一国二制度）。
      source: "https://ja.wikipedia.org/wiki/マカオ返還"
  source:
    - "https://ja.wikipedia.org/wiki/ポルトガル領マカオ"
    - "https://en.wikipedia.org/wiki/Portuguese_Macau"

