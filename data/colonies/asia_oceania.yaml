      text: 1945年8月、対日参戦したソ連軍が朝鮮北部に入り、北緯38度線以北を占領した。ソ連は各地の人民委員会を通じて治め、1946年に金日成を委員長とする北朝鮮臨時人民委員会を作らせて、土地改革（地主の土地の無償没収）と重要産業の国有化を進めた。1948年9月、朝鮮民主主義人民共和国が成立し、ソ連軍は年末に撤退した。
