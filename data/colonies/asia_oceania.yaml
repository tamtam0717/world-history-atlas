      text: キャンディ王と結んだオランダ東インド会社は、1640年のゴールを手始めに、コロンボ（1656年）・ジャフナ（1658年）とポルトガルの拠点を奪った。しかし会社は約束の土地をキャンディ王に返さず、沿岸部を自分の領土にしてシナモンの貿易を独占した。
      source: "https://ja.wikipedia.org/wiki/オランダ領セイロン"
    - from: 1689
      to: 1765
      text: 会社は沿岸部をオランダ法（ローマ＝オランダ法）で治め、シナモンの皮をはぐ仕事をシンハラ人のカーストに割り当てた。オランダ人とその子孫（バーガー）の社会がコロンボやゴールに育ち、カトリックにかわってプロテスタントが広められた。
      source: "https://en.wikipedia.org/wiki/Dutch_Ceylon"
    - from: 1766
      to: 1796
      text: キャンディとの戦争（1760–66年）に勝った会社は、1766年の条約で島の海岸線をすべて手に入れ、キャンディを海から切り離した。しかし本国がフランス革命軍に占領されると、1795–96年にイギリス軍が沿岸部を占領した（1802年のアミアンの和約で正式にイギリス領）。
      source: "https://en.wikipedia.org/wiki/Dutch_Ceylon"
  source:
