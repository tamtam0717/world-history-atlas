    - { name: マリオ・レモス・ピレス, title: 最後の総督, from: 1974, to: 1975, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Portuguese_Timor" }
  periods:
    - from: 1556
      to: 1701
      text: 白檀を求めるポルトガル人とドミニコ会の宣教師が、16世紀半ばにソロール島に砦を築き、フローレス島東部とティモールの王たちに布教した。実際に力を持ったのは、ポルトガル人と現地の人の混血の「トパス（黒いポルトガル人）」だった。オランダは1653年にクパンを奪い、ティモール西部へ勢力を伸ばした。
      source: "https://en.wikipedia.org/wiki/Portuguese_Timor"
    - from: 1702
      to: 1858
      text: 1702年に初めて総督が置かれたが、トパスとの争いで1769年に首府をリファウからディリに移した。支配は海岸の拠点と、ポルトガルに従う王たちとの結びつきにとどまった。島の分け方はオランダとの間で長くはっきりしなかった。
