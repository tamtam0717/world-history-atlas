    - from: 1895
      to: 1918
      text: 1895年、ペラ・スランゴール・ヌグリスンビラン・パハンがマレー連合州になり、クアラルンプールに総駐在官が置かれた。1909年のバンコク条約でシャムからクダ・クランタン・トレンガヌ・プルリスを譲られ、ジョホールも1914年に顧問官を受け入れた（マレー非連合州）。スズ鉱山には中国人、ゴム農園には南インドのタミル人が働き手として移り住み、のちの複合社会の形ができた。
      source: "https://ja.wikipedia.org/wiki/イギリス領マラヤ"
    - from: 1919
