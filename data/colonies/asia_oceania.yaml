  polities: [japan, ryukyu]
  governors:
    - { name: ポール・キャラウェイ, title: 高等弁務官, from: 1961, to: 1964, note: 「沖縄の自治は神話」と述べた, source: "https://ja.wikipedia.org/wiki/ポール・W・キャラウェイ" }
  periods:
    - from: 1945
      to: 1951
      text: 1945年4–6月の沖縄戦で、県民の4人に1人が亡くなったといわれる。アメリカ軍は沖縄を占領して軍政を敷き、住民の土地を取り上げて基地を作った。日本本土とは切り離され、通貨もB円（軍票）が使われた。
      source: "https://ja.wikipedia.org/wiki/沖縄戦"
    - from: 1952
      to: 1964
      text: サンフランシスコ平和条約（1952年発効）で、沖縄・奄美などはアメリカの施政権の下に残された（奄美は1953年に返還）。琉球政府が置かれたが、最終的な権限は琉球列島米国民政府の高等弁務官にあった。「銃剣とブルドーザー」による土地の強制収用に反対する島ぐるみ闘争（1956年）が起きた。
      source: "https://ja.wikipedia.org/wiki/アメリカ合衆国による沖縄統治"
    - from: 1965
      to: 1972
      text: ベトナム戦争で沖縄の基地は出撃と補給の拠点となり、B-52が飛び立った。祖国復帰運動が高まり、1968年には主席の公選で屋良朝苗が選ばれた。佐藤栄作首相とニクソン大統領の合意で、1972年5月15日に沖縄は日本に復帰したが、アメリカ軍の基地の多くは残った。
      source: "https://ja.wikipedia.org/wiki/沖縄返還"
  source:
