      source: "https://ja.wikipedia.org/wiki/ニュージーランド戦争"
    - from: 1873
      to: 1906
      text: 冷凍船（1882年）で羊肉とバターをイギリスへ輸出できるようになり、「イギリスの農場」として栄えた。自由党内閣のもとで、1893年に世界で初めて国政で女性の参政権を認め、老齢年金や労働争議の調停などの社会政策を進めた。1901年のオーストラリア連邦には加わらず、1907年に自治領ニュージーランドになった。
