      text: 文化大革命の影響で1967年に左派の暴動が起きたのち、政庁は汚職の取締りや公共住宅などの改革を進め、香港はアジアNIEsの一つとして金融の中心地に育った。1984年の中英共同声明で、新界の租借期限の1997年に香港全体を中国へ返すことが決まり、「一国二制度」で50年間は資本主義の制度を保つと約束された。1997年7月1日に返還された。
