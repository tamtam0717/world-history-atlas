      text: 綿花ブームで白人の入植者が増え、カコバウのフィジー王国は借金と混乱に苦しんだ。1874年、首長たちはフィジーをイギリスに譲った。総督ゴードンはフィジー人の土地の売買を禁じ、首長会議を通じて治める一方、サトウキビの農園の働き手として、インドから年季契約の労働者を連れてきた（1879–1916年）。
      source: "https://ja.wikipedia.org/wiki/フィジーの歴史"
    - from: 1920
      to: 1970
      text: 契約の期限が切れたインド系の人々は農地を借りて残り、やがて人口でフィジー系を上回った。土地を持つフィジー系と、商業・サトウキビ栽培を担うインド系の対立が、のちの政治の火種になった。第二次世界大戦では連合軍の基地となった。1970年10月10日、イギリス連邦の中で独立した。
      source: "https://en.wikipedia.org/wiki/Colony_of_Fiji"
  source:
