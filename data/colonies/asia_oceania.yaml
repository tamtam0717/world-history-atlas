      text: 1863年に北部準州（ノーザンテリトリー）の管轄を得て、大陸を南北に結ぶ陸上電信線（1872年、ダーウィンで海底電線につながる）を引いた。1894年にはオーストラリアで初めて、世界でも早く女性の参政権を認めた。1901年、オーストラリア連邦の州になった（北部準州は1911年に連邦へ）。
