      text: ヴァスコ・ダ・ガマのインド航路の開拓（1498年）ののち、ポルトガルはアルメイダを副王として送り、ディーウ沖の海戦（1509年）でマムルーク朝とグジャラートの艦隊を破った。アルブケルケが1510年にゴアを攻め取って首府とし、要塞と通行証（カルタス）の制度でインド洋の香辛料貿易を支配しようとした。1542年にはザビエルがゴアに来て、アジアの布教の拠点になった。
      source: "https://ja.wikipedia.org/wiki/ポルトガル領インド"
    - from: 1580
      to: 1660
      text: 本国がスペインと同君連合になる（1580–1640年）と、スペインの敵のオランダとイギリスがアジアに進出し、ポルトガルの拠点を次々に奪った（ホルムズ1622年、マラッカ1641年、セイロン1658年）。ゴアは宗教裁判所が置かれたカトリックの町として栄えたが、貿易の中心ではなくなっていった。
