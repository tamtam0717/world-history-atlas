  to: 1900
  polities: [australia]
  governors:
    - { name: アーサー・フィリップ, title: 初代総督, from: 1788, to: 1792, note: 第1船団で流刑囚を連れてシドニー湾に上陸, source: "https://ja.wikipedia.org/wiki/アーサー・フィリップ" }
    - { name: ウィリアム・ブライ, title: 総督, from: 1806, to: 1808, note: ラム酒の反乱で軍に追われる, source: "https://en.wikipedia.org/wiki/List_of_governors_of_New_South_Wales" }
    - { name: ラクラン・マコーリー, title: 総督, from: 1810, to: 1821, note: 刑期を終えた人の社会復帰と町づくり, source: "https://en.wikipedia.org/wiki/Lachlan_Macquarie" }
  periods:
    - from: 1770
      to: 1787
      text: 1770年、クックがオーストラリア東岸を探検し、イギリス国王の領土と宣言してニューサウスウェールズと名づけた。アメリカ独立戦争で北アメリカに流刑囚を送れなくなったイギリスは、新しい流刑地としてこの土地を選んだ。
      source: "https://ja.wikipedia.org/wiki/オーストラリアの歴史"
    - from: 1788
      to: 1820
      text: 1788年1月26日、フィリップの第1船団がシドニー湾に着き、流刑植民地を開いた。先住民アボリジニーの土地は「無主の地」とされ、天然痘の流行と土地の奪い合いで先住民の社会は打撃を受けた。軍の将校たちはラム酒の取引で力をふるい、総督ブライを追い出した（1808年）。マコーリー総督の時代にブルー・マウンテンズを越える道が開かれた。
      source: "https://en.wikipedia.org/wiki/History_of_New_South_Wales"
    - from: 1821
      to: 1850
      text: 内陸の草原で牧羊が広がり、羊毛はイギリスの毛織物工業の原料として最大の輸出品になった。自由移民が増え、1840年に本土への流刑は廃止された。北のモートン湾、南のポート・フィリップ、ニュージーランドも一時はこの植民地の一部だった。
      source: "https://en.wikipedia.org/wiki/History_of_New_South_Wales"
    - from: 1851
      to: 1900
      text: 1851年、バサーストの近くで金が見つかってゴールドラッシュが起き、移民が殺到した。1855年に責任政府（自治）が認められた。中国人の金鉱労働者への反感から移民を制限する動きが強まり、これがのちの白豪主義につながる。1901年、他の植民地とともにオーストラリア連邦の州になった。
      source: "https://ja.wikipedia.org/wiki/ゴールドラッシュ"
  source:
    - "https://ja.wikipedia.org/wiki/ニューサウスウェールズ州"
    - "https://en.wikipedia.org/wiki/History_of_New_South_Wales"

