    - { name: アンドルー・クラーク, title: 総督, from: 1873, to: 1875, note: パンコール条約（1874年）でペラに駐在官を置く, source: "https://en.wikipedia.org/wiki/Governor_of_the_Straits_Settlements" }
    - { name: シェントン・トーマス, title: 最後の総督, from: 1934, to: 1946, note: 1942年のシンガポール陥落で日本軍の捕虜になる, source: "https://en.wikipedia.org/wiki/Governor_of_the_Straits_Settlements" }
  periods:
    - from: 1786
      to: 1823
      text: インドと中国を結ぶ航路の中継地と、ベンガル湾東側の海軍基地を求めたイギリス東インド会社は、1786年にフランシス・ライトがクダのスルタンからペナン島を得た。ナポレオン戦争中はオランダ領のマラッカも占領した。1819年、ラッフルズがジョホール王家の内紛につけこんでシンガポールに商館を置き、関税のない自由港とした。
      source: "https://ja.wikipedia.org/wiki/海峡植民地"
    - from: 1824
      to: 1866
      text: 1824年の英蘭協約でマラッカ海峡を境に勢力圏を分け、イギリスはマラッカを得てスマトラのベンクーレンを手放した。1826年、ペナン・マラッカ・シンガポールが海峡植民地としてまとめられた（1832年から首府はシンガポール）。自由貿易港シンガポールにはアヘン・茶・綿布を扱う中国人やインド人の商人が集まり、中国人の移民が人口の多数を占めるようになった。
      source: "https://en.wikipedia.org/wiki/Straits_Settlements"
    - from: 1867
      to: 1918
      text: 1867年に英領インドの管轄から外れ、本国の植民地省が治める直轄植民地になった。スエズ運河の開通（1869年）と汽船の時代でシンガポールの重要性は増し、マレー半島のスズとゴムの積み出し港として栄えた。総督はマレー諸国の高等弁務官を兼ね、ここを拠点にイギリスの支配は半島全体へ広がった。
      source: "https://ja.wikipedia.org/wiki/海峡植民地"
    - from: 1919
      to: 1941
      text: 第一次世界大戦後、日本の海軍力に備えて、イギリスはシンガポールに大きな海軍基地を築いた（1938年完成）。中国人社会では辛亥革命や日中戦争をきっかけに中国の民族主義が高まり、抗日の募金運動が行われた。1941年12月、日本軍がマレー半島に上陸し、1942年2月にシンガポールは陥落した。
      source: "https://ja.wikipedia.org/wiki/シンガポールの戦い"
  source:
    - "https://ja.wikipedia.org/wiki/海峡植民地"
    - "https://en.wikipedia.org/wiki/Straits_Settlements"

