    - from: 1860
      to: 1897
      text: アロー戦争（第2次アヘン戦争）の北京条約（1860年）で、対岸の九龍半島の南端も割譲された。香港上海銀行（1865年）が作られ、香港は中国とイギリス帝国を結ぶ金融と中継貿易の町になった。中国人の移民が東南アジアやアメリカへ渡る出口でもあった。
