      source: "https://ja.wikipedia.org/wiki/タスマニアの歴史"
    - from: 1825
      to: 1852
      text: 1825年にニューサウスウェールズから分かれた。牧羊地を広げる入植者と先住民の争い（ブラック・ウォー、1820年代–1832年）で、先住民はほとんど滅ぼされ、生き残った人々はフリンダーズ島に移された。ポート・アーサーの監獄など、帝国の流刑囚の多くがここに送られた。
      source: "https://en.wikipedia.org/wiki/Black_War"
    - from: 1853
      to: 1900
      text: 住民の反対運動で1853年に流刑囚の受け入れが終わり、流刑地の暗い印象をぬぐうため、1856年にタスマニアと名を改めて責任政府を持つ植民地になった。1901年、オーストラリア連邦の州になった。
      source: "https://en.wikipedia.org/wiki/History_of_Tasmania"
  source:
