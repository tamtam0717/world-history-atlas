      text: 捕鯨やアザラシ猟の基地、宣教師の布教地だったニュージーランドに、ウェイクフィールドのニュージーランド会社が移民を送り出すと、イギリスは1840年にマオリの首長たちとワイタンギ条約を結んで主権を得た（はじめはニューサウスウェールズの一部、1841年に独立の植民地）。条約は英語版とマオリ語版で意味が違い、土地の売買をめぐる争いのもとになった。
