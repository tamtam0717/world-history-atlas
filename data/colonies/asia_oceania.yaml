      source: "https://en.wikipedia.org/wiki/Swan_River_Colony"
    - from: 1850
      to: 1889
      text: 働き手を得るため、ほかの植民地とは逆に1850年から流刑囚を受け入れた（1868年まで）。羊毛と真珠貝、白檀が主な産物だった。
      source: "https://ja.wikipedia.org/wiki/西オーストラリア州"
    - from: 1890
      to: 1900
      text: 1890年に責任政府が認められ、1890年代にクールガーディーとカルグーリーで金が見つかって人口が急に増えた。連邦への参加にはためらったが、金鉱の移民の後押しもあって1901年にオーストラリア連邦の州になった。
