      source: "https://en.wikipedia.org/wiki/Portuguese_India"
    - from: 1815
      to: 1946
      text: 周りをすべてイギリス領インドに囲まれ、ゴアは小さな植民地として残った。ゴアの人々はボンベイやアフリカのポルトガル領へ働きに出た。本国でサラザールの独裁（新国家体制）が始まると、自由を求める運動は弾圧された。
      source: "https://ja.wikipedia.org/wiki/ゴア州"
    - from: 1947
      to: 1961
      text: 1947年に独立したインドは返還を求めたが、サラザール政権は「海外州」だとして拒んだ。1954年に内陸のダードラーとナガル・ハヴェーリーが住民の蜂起でポルトガルから離れ、1961年12月、インド軍がゴア・ダマン・ディーウに進攻して、450年続いたポルトガルの支配は終わった。
