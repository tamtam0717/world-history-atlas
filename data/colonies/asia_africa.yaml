    - { name: ヨースト・ファン・フォレンホーフェン, title: 総督, from: 1917, to: 1918, source: "https://en.wikipedia.org/wiki/French_West_Africa" }
    - { name: ジュール・ブレヴィエ, title: 総督, from: 1930, to: 1936, source: "https://en.wikipedia.org/wiki/French_West_Africa" }
    - { name: ピエール・ボワソン, title: 総督（ヴィシー政府）, from: 1940, to: 1943, note: ダカールで自由フランス軍を退ける, source: "https://en.wikipedia.org/wiki/French_West_Africa" }
    - { name: ベルナール・コルニュ＝ジャンティーユ, title: 高等弁務官, from: 1951, to: 1956, source: "https://en.wikipedia.org/wiki/French_West_Africa" }
  periods:
    - from: 1895
      to: 1903
      text: アフリカ分割（ベルリン会議、1884–85年）の中で、フランスは西アフリカの海岸から内陸へ進み、サハラを通って北アフリカのアルジェリアとつなぐアフリカ横断政策をとった。1895年、セネガル・ギニア・コートジボワール・スーダン（いまのマリ）をまとめて総督を置き、1902年に首府をダカールに移す。内陸ではサモリ・トゥーレが抵抗を続けたが、1898年に捕らえられた。
      source: "https://ja.wikipedia.org/wiki/フランス領西アフリカ"
    - from: 1904
      to: 1918
      text: 1904年にダホメ（いまのベナン）も加わり、連邦の形が整った。住民には人頭税と強制労働が課され、落花生など本国向けの作物が作られた。第一次世界大戦では、多くの兵士（「セネガル歩兵」）が本国の戦線へ送られた。
      source: "https://en.wikipedia.org/wiki/French_West_Africa"
    - from: 1919
      to: 1939
      text: オートボルタ植民地（1919年）・ニジェール植民地（1922年）が置かれ、オートボルタは1932年に分割されて隣の植民地に編入された。フランスは同化政策をとったが、市民権はセネガルの4つの自治市の住民などに限られた（1914年、セネガルのブレーズ・ジャーニュがアフリカ人で初めて本国の議員に）。
      source: "https://en.wikipedia.org/wiki/French_West_Africa"
    - from: 1940
      to: 1945
      text: 本国がドイツに敗れると、総督ボワソンはヴィシー政府に従い、1940年9月にダカールを攻めた自由フランスとイギリスの艦隊を退けた。1942年11月に連合軍が北アフリカに上陸すると、連合国側に移った。
      source: "https://en.wikipedia.org/wiki/Battle_of_Dakar"
    - from: 1946
      to: 1957
      text: 1946年、フランス連合のもとで各地は「海外領土」となり、住民に市民権が与えられ、本国の議会に代表を送った。ウフェ＝ボワニらのアフリカ民主連合が生まれ、1956年の基本法で各領土に自治政府が置かれた。1958年の国民投票でギニアだけが独立を選び、ほかもフランス共同体の自治共和国をへて、1960年に相次いで独立した（「アフリカの年」）。
      source: "https://ja.wikipedia.org/wiki/アフリカの年"
  source:
    - "https://ja.wikipedia.org/wiki/フランス領西アフリカ"
    - "https://en.wikipedia.org/wiki/French_West_Africa"

- id: dutch_cape
  name: ケープ植民地（オランダ東インド会社）
  names:
