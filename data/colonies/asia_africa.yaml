  to: 1909
  polities: [xhosa, south_africa]
  governors:
    - { name: マカートニー伯, title: 総督, from: 1797, to: 1798, note: 中国に使節として行ったマカートニー, source: "https://en.wikipedia.org/wiki/List_of_governors_of_the_Cape_Colony" }
    - { name: チャールズ・サマセット, title: 総督, from: 1814, to: 1826, note: 英語を公用語に, source: "https://en.wikipedia.org/wiki/List_of_governors_of_the_Cape_Colony" }
    - { name: ベンジャミン・ダーバン, title: 総督, from: 1834, to: 1838, source: "https://en.wikipedia.org/wiki/List_of_governors_of_the_Cape_Colony" }
    - { name: ハリー・スミス, title: 総督, from: 1847, to: 1852, source: "https://en.wikipedia.org/wiki/List_of_governors_of_the_Cape_Colony" }
    - { name: ジョージ・グレイ, title: 総督, from: 1854, to: 1861, source: "https://en.wikipedia.org/wiki/List_of_governors_of_the_Cape_Colony" }
    - { name: バートル・フリア, title: 総督, from: 1877, to: 1880, note: ズールー戦争（1879年）を起こす, source: "https://en.wikipedia.org/wiki/List_of_governors_of_the_Cape_Colony" }
    - { name: セシル・ローズ, title: 首相, from: 1890, to: 1896, note: ジェームソン侵入事件で辞任, source: "https://ja.wikipedia.org/wiki/セシル・ローズ" }
    - { name: アルフレッド・ミルナー, title: 総督・高等弁務官, from: 1897, to: 1901, note: 南アフリカ戦争を指導, source: "https://en.wikipedia.org/wiki/List_of_governors_of_the_Cape_Colony" }
  periods:
    - from: 1795
      to: 1814
      text: 本国オランダがフランス革命軍に占領されてフランス側（バタヴィア共和国）になると、イギリスはインド航路の要所を守るため1795年にケープを占領した。アミアンの和約で一度返したが（1803–06年）、1806年に再び占領し、1814年の英蘭条約で正式にイギリス領になった（ウィーン会議で確認）。
      source: "https://ja.wikipedia.org/wiki/ケープ植民地"
    - from: 1815
      to: 1853
      text: 英語が公用語になり、1820年にはイギリスから多くの移民が来た。本国の奴隷制廃止（1833年の法律、1834年施行）で奴隷が解放されると、不満を持ったブール人（ボーア人）が1830年代後半から内陸へ大移動し（グレート・トレック）、のちにトランスヴァール共和国やオレンジ自由国をつくった。東の境界ではコサ人との戦争（ケープ辺境戦争）がくり返された。
      source: "https://ja.wikipedia.org/wiki/グレート・トレック"
    - from: 1854
      to: 1889
      text: 1853年に議会が開かれ、1872年には議会に責任を負う内閣（責任政府）が認められて自治が進んだ。1867年にオレンジ川の近くでダイヤモンドが見つかり、キンバリーを含むグリクワランド・ウェストは1880年にケープに組み込まれた。
      source: "https://en.wikipedia.org/wiki/Cape_Colony"
    - from: 1890
      to: 1902
      text: ダイヤモンド業で富を築いたセシル・ローズが首相（1890–96年）になり、北のローデシアへ勢力を広げた。本国のケープタウン・カイロ・カルカッタを結ぶ3C政策の一角。ローズはトランスヴァールを倒そうとしたジェームソン侵入事件（1895年）で辞任し、1899–1902年にはイギリスとブール人の国々との南アフリカ戦争が起きた。
      source: "https://ja.wikipedia.org/wiki/南アフリカ戦争"
    - from: 1903
      to: 1909
      text: 戦後、征服したトランスヴァール・オレンジ川植民地とともに統合が話し合われ、1910年、ケープはナタール・トランスヴァール・オレンジとともにイギリスの自治領・南アフリカ連邦の州（ケープ州）になった。
      source: "https://ja.wikipedia.org/wiki/南アフリカ連邦"
  source:
    - "https://ja.wikipedia.org/wiki/ケープ植民地"
    - "https://en.wikipedia.org/wiki/Cape_Colony"
