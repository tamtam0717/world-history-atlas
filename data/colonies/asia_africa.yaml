  parent: netherlands
  kind: オランダ東インド会社の補給地・植民地
  match:
    labels: [ケープ植民地（オランダ東インド会社）, ケープ植民地（バタヴィア共和国）]
  from: 1652
  to: 1806
  polities: []
  governors:
    - { name: ヤン・ファン・リーベック, title: 司令官, from: 1652, to: 1662, note: 補給地を開く, source: "https://ja.wikipedia.org/wiki/ヤン・ファン・リーベック" }
    - { name: シモン・ファン・デル・ステル, title: 司令官（1691年から総督）, from: 1679, to: 1699, source: "https://en.wikipedia.org/wiki/Dutch_Cape_Colony" }
    - { name: ウィレム・アドリアーン・ファン・デル・ステル, title: 総督, from: 1699, to: 1707, source: "https://en.wikipedia.org/wiki/Dutch_Cape_Colony" }
    - { name: ヤン・ウィレム・ヤンセンス, title: 総督（バタヴィア共和国）, from: 1803, to: 1806, note: ブラウベルクの戦いでイギリスに降る, source: "https://en.wikipedia.org/wiki/Dutch_Cape_Colony" }
  periods:
    - from: 1652
      to: 1678
      text: 本国のアジア貿易が最も盛んなころ、1652年にオランダ東インド会社のファン・リーベックが、インドへ向かう船に水・野菜・肉を補給する基地をテーブル湾に開いた（ケープタウン）。牧畜をする先住民のコイコイ人から家畜を手に入れ、やがて土地をめぐって争った。
      source: "https://ja.wikipedia.org/wiki/ケープ植民地"
    - from: 1679
      to: 1749
      text: 会社の社員をやめた農民（ブール人）の入植が進み、ステレンボッシュ（1679年）などの町ができた。1688年には、ナントの王令の廃止でフランスを追われたユグノーも入植し、ワイン作りを広めた。働き手として、アジアやアフリカから奴隷が連れてこられた。
      source: "https://en.wikipedia.org/wiki/Dutch_Cape_Colony"
    - from: 1750
      to: 1795
      text: 牧畜をするブール人（トレックブール）が内陸へ広がり、東の境界でコサ人と衝突した（1779年からケープ辺境戦争）。18世紀末には会社の経営が傾き、本国がフランス革命軍に占領されると、1795年にイギリスがケープを占領した。
      source: "https://en.wikipedia.org/wiki/Dutch_Cape_Colony"
    - from: 1803
      to: 1806
      text: アミアンの和約（1802年）で、フランスの影響下のバタヴィア共和国にケープが返された。しかしナポレオン戦争が再び始まると、1806年にイギリス軍が上陸し（ブラウベルクの戦い）、再びイギリス領になった。
      source: "https://en.wikipedia.org/wiki/Battle_of_Blaauwberg"
  source:
    - "https://ja.wikipedia.org/wiki/ケープ植民地"
    - "https://en.wikipedia.org/wiki/Dutch_Cape_Colony"

- id: cape_colony
  name: ケープ植民地
  names:
