# アジア・アフリカの植民地（docs/data-format.md の「植民地」）

- id: british_india
  name: イギリス領インド
  names:
    - { to: 1857, name: イギリス東インド会社領インド, kind: 東インド会社の統治領 }
    - { from: 1858, to: 1876, name: イギリス領インド, kind: 直轄植民地（本国のインド省と副王） }
    - { from: 1877, name: インド帝国（イギリス領インド）, kind: 直轄植民地（イギリス国王がインド皇帝を兼ねる） }
  parent: britain
  # 直轄領だけ。藩王国（certainty: indirect）は除く（地図では薄い色で、データのない植民地として選べる）
  match:
    iso: [IND, PAK, BGD]
    contains: [英領インド]
    # ビルマ（1824–1936 は英領インドの州）とアデンは asia_oceania.yaml の british_burma・aden_colony で別に選ぶ
    exclude_labels: [英領インド（ビルマ州）, 英領インド（ペグー州）, アラカン（英領インド）, テナセリム（英領インド）, アデン（英領インドの一部）]
    exclude_certainty: [indirect]
  from: 1757
  to: 1947
  polities: [india, pakistan, bangladesh]
  governors:
    - { name: ロバート・クライヴ, title: ベンガル知事, from: 1758, to: 1760, note: プラッシーの戦いの勝者, source: "https://ja.wikipedia.org/wiki/ロバート・クライヴ" }
    - { name: ロバート・クライヴ, title: ベンガル知事（2度目）, from: 1765, to: 1767, note: ディーワーニー（徴税権）を得る, source: "https://ja.wikipedia.org/wiki/ロバート・クライヴ" }
    - { name: ウォーレン・ヘースティングズ, title: 初代ベンガル総督, from: 1773, to: 1785, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: コーンウォリス, title: ベンガル総督, from: 1786, to: 1793, note: 永代ザミンダーリー制（1793年）, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: リチャード・ウェルズリー, title: ベンガル総督, from: 1798, to: 1805, note: マイソール戦争・マラーター戦争で支配を広げる, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: ウィリアム・ベンティンク, title: ベンガル総督（1833年からインド総督）, from: 1828, to: 1835, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: ダルハウジー, title: インド総督, from: 1848, to: 1856, note: 失権の原則などで藩王国を併合, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: カニング, title: インド総督（1858年から初代副王）, from: 1856, to: 1862, note: インド大反乱のときの総督, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: リットン, title: 副王, from: 1876, to: 1880, note: 1877年のインド帝国の成立を宣言, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: カーゾン, title: 副王, from: 1899, to: 1905, note: ベンガル分割令（1905年）, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: ハーディング, title: 副王, from: 1910, to: 1916, note: ベンガル分割を取り消し、首都をデリーへ, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: アーウィン, title: 副王, from: 1926, to: 1931, note: 塩の行進のときの副王, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: リンリスゴー, title: 副王, from: 1936, to: 1943, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: ウェーヴェル, title: 副王, from: 1943, to: 1947, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
    - { name: マウントバッテン, title: 最後の副王, from: 1947, to: 1947, note: インドとパキスタンの分離独立, source: "https://en.wikipedia.org/wiki/Governor-General_of_India" }
  periods:
    - from: 1757
      to: 1772
      text: プラッシーの戦い（1757年）で、イギリス東インド会社のクライヴがベンガル太守とそれを助けるフランスを破った。本国は七年戦争（1756–63年）でフランスに勝ち、北アメリカとインドでの優位が決まる。1765年、会社はムガル皇帝からベンガル・ビハール・オリッサのディーワーニー（徴税権）を得て、商社から領土の支配者になった。
      source: "https://ja.wikipedia.org/wiki/プラッシーの戦い"
    - from: 1773
      to: 1818
      text: 本国議会は規制法（1773年）でベンガル総督を置いて会社を監督した。会社はマイソール戦争（ティプー・スルタンの戦死、1799年）、マラーター戦争（1818年に終わる）で支配を広げ、従わせた王侯は藩王国として残した。ベンガルではザミンダーリー制（1793年）、南インドではライヤットワーリー制で地税を取った。
      source: "https://ja.wikipedia.org/wiki/イギリス東インド会社"
    - from: 1819
      to: 1856
      text: 本国の産業資本家の自由貿易の主張で、会社のインド貿易の独占は1813年に、中国貿易の独占も1833年に廃止され、会社は統治の機関になった。機械で作ったイギリスの綿布が流れ込み、インドの綿織物業は打撃を受け、綿花などの原料を輸出する立場に変わる。総督ダルハウジーは、跡継ぎのいない藩王国を取り上げる失権の原則などで併合を進めた（アワド、1856年）。
      source: "https://en.wikipedia.org/wiki/Company_rule_in_India"
    - from: 1857
      to: 1876
      text: 1857年、会社のインド人傭兵（シパーヒー）の反乱がインド大反乱に広がり、反乱軍はムガル皇帝を立てたが鎮圧された。1858年、ムガル帝国は滅び、インド統治改善法で東インド会社は解散、本国政府（インド省）と副王による直接統治に変わった。
      source: "https://ja.wikipedia.org/wiki/インド大反乱"
    - from: 1877
      to: 1918
      text: 1877年、ヴィクトリア女王がインド皇帝を兼ねてインド帝国が成立した（ディズレーリ内閣）。鉄道と運河が整えられる一方、飢饉がくり返された。1885年にインド国民会議が開かれ、ベンガル分割令（1905年）への反対運動の中で、国民会議派はカルカッタ大会（1906年）で英貨排斥・スワデーシ（国産品愛用）・スワラージ（自治）・民族教育を決議。イギリスは全インド＝ムスリム連盟（1906年）を支援して分断をはかった。
      source: "https://ja.wikipedia.org/wiki/イギリス領インド帝国"
    - from: 1919
      to: 1947
      text: 第一次世界大戦に協力した見返りの自治は与えられず、ローラット法（1919年）とアムリットサール事件が怒りを広げた。ガンディーの非暴力・不服従運動、国民会議派の完全独立（プールナ・スワラージ、1929年）、塩の行進（1930年）。1935年のインド統治法で州の自治が認められた。第二次世界大戦後、本国の労働党政府のもとで1947年にインドとパキスタンが分かれて独立した。
      source: "https://ja.wikipedia.org/wiki/インドの独立運動"
  source:
    - "https://ja.wikipedia.org/wiki/イギリス領インド帝国"
    - "https://en.wikipedia.org/wiki/British_Raj"

- id: dutch_east_indies
  name: オランダ領東インド
  names:
    - { to: 1799, name: オランダ東インド会社領（東インド）, kind: オランダ東インド会社の領土 }
  parent: netherlands
  kind: 植民地（首府バタヴィア）
  match:
    iso: [IDN]
  from: 1605
  to: 1949
  polities: [indonesia, mataram]
  governors:
    - { name: ピーテル・ボット, title: 初代総督, from: 1610, to: 1614, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
    - { name: ヤン・ピーテルスゾーン・クーン, title: 総督, from: 1619, to: 1623, note: ジャカルタを奪ってバタヴィアと名づける, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
    - { name: ヤン・ピーテルスゾーン・クーン, title: 総督（2度目）, from: 1627, to: 1629, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
    - { name: アントニオ・ファン・ディーメン, title: 総督, from: 1636, to: 1645, note: タスマンの探検を送り出す, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
    - { name: ヘルマン・ウィレム・ダーンデルス, title: 総督, from: 1808, to: 1811, note: 本国はナポレオンの弟の治めるホラント王国, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
    - { name: ヨハネス・ファン・デン・ボス, title: 総督, from: 1830, to: 1833, note: 強制栽培制度を始める, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
    - { name: ヨハネス・ベネディクトゥス・ファン・ハーツ, title: 総督, from: 1904, to: 1909, note: アチェ戦争の指揮官, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
    - { name: チャルダ・ファン・スタルケンボルフ・スタハウエル, title: 総督, from: 1936, to: 1945, note: 1942年に日本軍に捕らえられる, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
    - { name: フベルトゥス・ファン・モーク, title: 副総督, from: 1942, to: 1948, note: 戦後、オランダの復帰と連邦案を進める, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_the_Dutch_East_Indies" }
  periods:
    - from: 1602
      to: 1679
      text: 本国はスペインからの独立戦争のさなか、海運と金融で栄えた。1602年にオランダ東インド会社が設立され、1619年に総督クーンがジャワのジャカルタを奪ってバタヴィアと名づけ、アジア貿易の本拠にした。モルッカ諸島の香辛料を独占しようとし、アンボイナ事件（1623年）でイギリスの勢力を東南アジアから退けた。
      source: "https://ja.wikipedia.org/wiki/オランダ東インド会社"
    - from: 1680
      to: 1799
      text: 会社はジャワのマタラム王国の王位争いに介入して内陸へ支配を広げ、ギヤンティ条約（1755年）でマタラムを二つに分けた。住民にコーヒーなどを納めさせたが、18世紀には腐敗と英蘭戦争で会社の財政が悪化し、1799年に解散した。
      source: "https://ja.wikipedia.org/wiki/オランダ東インド会社"
    - from: 1800
      to: 1829
      text: 会社の領土は本国政府の植民地になった。本国がフランスに支配されると（ホラント王国）、総督ダーンデルスが軍用道路などを建設し、1811–16年にはイギリスが占領した（ラッフルズ）。返還後、ジャワ戦争（1825–30年、ディポヌゴロの反乱）が起きる。
      source: "https://en.wikipedia.org/wiki/Dutch_East_Indies"
    - from: 1830
      to: 1900
      text: ベルギーの独立で財政が苦しくなった本国のため、総督ファン・デン・ボスが強制栽培制度（政府栽培制度、1830年〜）を始め、ジャワの農民にコーヒー・サトウキビ・藍を作らせて安く買い上げた。本国の財政は立ち直ったが、飢饉も起きた。1870年代からは民間の農園経営に移り、スマトラ北端ではアチェ戦争（1873年〜）が続いた。
      source: "https://ja.wikipedia.org/wiki/強制栽培制度"
    - from: 1901
      to: 1941
      text: 本国は「倫理政策」（1901年〜）で教育や灌漑を進め、島々のほぼ全体を支配下に置いた。教育を受けた人々から民族運動が起こり、ブディ・ウトモ（1908年）、イスラーム同盟（サレカット・イスラーム、1911年）、インドネシア共産党（1920年）、スカルノのインドネシア国民党（1927年）が生まれた。
      source: "https://ja.wikipedia.org/wiki/インドネシアの歴史"
    - from: 1942
      to: 1949
      text: 1942年に日本軍が占領して軍政を敷いた。1945年8月17日、スカルノとハッタがインドネシア共和国の独立を宣言。戻ってきたオランダとの独立戦争になり、各地に連邦の構成国がつくられたが、国際世論にも押されて、1949年のハーグ協定でオランダは主権を移した。
      source: "https://ja.wikipedia.org/wiki/インドネシア独立戦争"
  source:
    - "https://ja.wikipedia.org/wiki/オランダ領東インド"
    - "https://en.wikipedia.org/wiki/Dutch_East_Indies"

- id: french_indochina
  name: フランス領インドシナ連邦
  parent: france
  kind: 植民地連邦（直轄植民地のコーチシナと、保護国・保護領）
  # トンキン・アンナン・コーチシナ・カンボジア・ラオスの副ラベルを1つにまとめる（構成はカードの「構成」に出る）
  match:
    iso: [VNM, KHM, LAO]
    labels: [広州湾（フランスの租借地）, トラート（フランス領インドシナ）, 南沙諸島（仏領インドシナ）, 西沙諸島（仏領インドシナ）]
  from: 1887
  to: 1954
  polities: [vietnam, cambodia, laos]
  governors:
    - { name: エルネスト・コンスタン, title: 初代総督, from: 1887, to: 1888, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_French_Indochina" }
    - { name: ポール・ドゥメール, title: 総督, from: 1897, to: 1902, note: 財政と専売制度を整え、鉄道を建設。のちの大統領, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_French_Indochina" }
    - { name: アルベール・サロー, title: 総督, from: 1911, to: 1914, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_French_Indochina" }
    - { name: アルベール・サロー, title: 総督（2度目）, from: 1917, to: 1919, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_French_Indochina" }
    - { name: ピエール・パスキエ, title: 総督, from: 1928, to: 1934, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_French_Indochina" }
    - { name: ジョルジュ・カトルー, title: 総督, from: 1939, to: 1940, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_French_Indochina" }
    - { name: ジャン・ドクー, title: 総督（ヴィシー政府）, from: 1940, to: 1945, note: 日本軍の進駐を受け入れ、共同支配, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_French_Indochina" }
    - { name: ティエリー・ダルジャンリュー, title: 高等弁務官, from: 1945, to: 1947, source: "https://en.wikipedia.org/wiki/List_of_governors-general_of_French_Indochina" }
  periods:
    - from: 1887
      to: 1896
      text: 第三共和政のフランスは、清仏戦争（1884–85年）の天津条約で清にベトナムの宗主権を放棄させた。1887年、直轄植民地のコーチシナ、保護領のトンキン・アンナン、保護国のカンボジア（1863年〜）をまとめてインドシナ連邦をつくり、1893年にはタイ（シャム）からラオスを奪って加えた。
      source: "https://ja.wikipedia.org/wiki/フランス領インドシナ"
    - from: 1897
      to: 1913
      text: 総督ドゥメールが首府をハノイに置き、アヘン・塩・酒の専売で財政を立て、鉄道（雲南への滇越鉄道など）を建設した。コーチシナでは米、のちにゴムのプランテーションが広がる。1900年には広州湾の租借地も加わった。日露戦争の日本に学ぼうと、ファン・ボイ・チャウが留学運動（ドンズー運動、1905年〜）を起こした。
      source: "https://ja.wikipedia.org/wiki/ドンズー運動"
    - from: 1914
      to: 1939
      text: 第一次世界大戦では多くの兵士と労働者が本国へ送られた。戦後、民族運動が強まり、ホー・チ・ミンがベトナム青年革命同志会（1925年）、インドシナ共産党（1930年）をつくった。同じ1930年、ベトナム国民党のイエンバイ蜂起と、農民のゲティン・ソヴィエトが鎮圧された。
      source: "https://ja.wikipedia.org/wiki/ホー・チ・ミン"
    - from: 1940
      to: 1945
      text: 本国がドイツに降伏すると、ヴィシー政府の総督ドクーは日本軍の北部仏印進駐（1940年）・南部仏印進駐（1941年）を受け入れ、日本とフランスが共同で支配した。1941年にホー・チ・ミンがベトナム独立同盟（ベトミン）を結成。1945年3月、日本軍がフランスの支配を倒し（明号作戦）、日本の敗戦後の9月2日、ホー・チ・ミンがベトナム民主共和国の独立を宣言した。
      source: "https://ja.wikipedia.org/wiki/仏印進駐"
    - from: 1946
      to: 1954
      text: 支配の回復をはかるフランスとベトナム民主共和国との間でインドシナ戦争（1946–54年）が起きた。フランスは1949年にバオダイを元首とするベトナム国をつくり、ラオス・カンボジアもフランス連合の中の国とした。1954年、ディエンビエンフーの戦いに敗れ、ジュネーヴ休戦協定で撤退（北緯17度線で南北に分かれる）。
      source: "https://ja.wikipedia.org/wiki/第一次インドシナ戦争"
  source:
    - "https://ja.wikipedia.org/wiki/フランス領インドシナ"
    - "https://en.wikipedia.org/wiki/French_Indochina"

