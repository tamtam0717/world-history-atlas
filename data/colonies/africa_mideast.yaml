      text: 1839年、イギリス東インド会社の軍がアデンを占領し、英領インドのボンベイ管区の一部とした。インドとの間の蒸気船の石炭補給地として重要になり、1869年のスエズ運河の開通後は世界有数の港となった。周りのスルタンや首長と保護条約を結び（アデン保護領）、北のオスマン帝国、のちイエメン王国との境界を決めた。
