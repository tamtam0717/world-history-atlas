  polities: [palestine, egypt, syria, jordan, lebanon]
  periods:
    - from: 1967
      to: 1981
      text: 1967年の第3次中東戦争（六日戦争）で、イスラエルはエジプトからガザ地区とシナイ半島、ヨルダンからヨルダン川西岸と東エルサレム、シリアからゴラン高原を占領した。国際連合安全保障理事会の決議242は占領地からの撤退を求めた。イスラエルは占領地にユダヤ人の入植地を作り始め、東エルサレムを併合した（1980年の基本法）。1973年の第4次中東戦争の後、1978年のキャンプ・デーヴィッド合意でエジプトと和平し、シナイ半島は1982年に返された。
      source: "https://ja.wikipedia.org/wiki/第三次中東戦争"
    - from: 1982
      to: 1993
      text: 1981年にゴラン高原を併合した（国際的には認められない）。1982年にはパレスチナ解放機構（PLO）を追ってレバノンに侵攻し、南レバノンを占領した。1987年、ガザと西岸でパレスチナ人の民衆の蜂起（インティファーダ）が起きた。
      source: "https://ja.wikipedia.org/wiki/インティファーダ"
    - from: 1994
      to: 2025
      text: 1993年のオスロ合意でパレスチナ暫定自治が始まり、ガザと西岸の都市がパレスチナ自治政府に移された。しかし和平交渉は行き詰まり、2000年の第2次インティファーダの後、イスラエルは西岸に分離壁を造った。2005年にガザから撤退したが、ハマースが支配したガザを封鎖した。西岸では入植地の拡大が続き、2023年10月のハマースの攻撃の後、イスラエル軍がガザで大規模な戦争を行った。
      source: "https://ja.wikipedia.org/wiki/オスロ合意"
  source:
