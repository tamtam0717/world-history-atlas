      text: エジプトのムハンマド・アリーは、金と奴隷（兵士にする）を求めて1820年にスーダンへ軍を送り、フンジ王国を滅ぼした。1820年代にハルツームが総督の町として建てられ、重い税と奴隷狩りが住民を苦しめた。
      source: "https://ja.wikipedia.org/wiki/トルコ・エジプト領スーダン"
    - from: 1863
      to: 1880
      text: ヘディーヴのイスマーイールは、ナイル川の上流と紅海沿岸に支配を広げ、1874年にダルフールを征服した。奴隷貿易の取り締まりを求めるイギリスの圧力で、ベーカーやゴードンらヨーロッパ人を州の長官や総督に雇った。
      source: "https://en.wikipedia.org/wiki/Turco-Egyptian_Sudan"
    - from: 1881
      to: 1888
      text: 1881年、ムハンマド・アフマドが救世主（マフディー）を名のって蜂起し、重税と外国人の支配に不満をもつ人々が加わった（マフディー運動）。本国エジプトはイギリスに占領されており、1885年にハルツームが落ちてゴードンが戦死した。南のエクアトリア州ではエミン・パシャが孤立したまま残り、1889年に救出された。
      source: "https://ja.wikipedia.org/wiki/マフディー戦争"
  source:
