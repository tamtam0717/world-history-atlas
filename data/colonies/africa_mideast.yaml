  to: 1959
  polities: [somalia]
  periods:
    - from: 1884
      to: 1919
      text: 紅海の出口をおさえ、インドへの航路の要地アデンに肉を送るため、イギリスは1884年からソマリ人の諸部族と保護条約を結び、ベルベラなどの港を手に入れた（エジプト軍の撤退の後）。1899年から、宗教指導者ムハンマド・アブドゥッラー・ハサン（イギリス人は「狂気のムッラー」と呼んだ）が内陸で抵抗を続け、1920年に飛行機を使った攻撃で倒された。
      source: "https://en.wikipedia.org/wiki/British_Somaliland"
    - from: 1920
      to: 1949
      text: 遊牧の地でほとんど開発されず、統治は最小限だった。1940年8月にイタリア軍に占領されたが、翌年イギリスが取り戻し、イタリア領ソマリアやエチオピアのオガデンもイギリス軍政のもとに置かれた。
      source: "https://en.wikipedia.org/wiki/Italian_conquest_of_British_Somaliland"
    - from: 1950
      to: 1959
      text: 1954年、イギリスは放牧地のハウド地方をエチオピアに引き渡し、ソマリ人の反発を招いた。1960年6月26日に独立し、5日後に南のソマリア信託統治領と合わさってソマリア共和国となった。1991年の内戦の後、この地域は「ソマリランド共和国」として独立を宣言している。
      source: "https://en.wikipedia.org/wiki/State_of_Somaliland"
  source:
