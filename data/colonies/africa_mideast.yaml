      text: 1890年、紅海沿岸と高原をまとめてエリトリア植民地とした（名は紅海のラテン語名から）。イタリアはウッチャリ条約を盾にエチオピアを保護国と主張したが、メネリク2世はこれを退け、1896年、アドワの戦いでイタリア軍を大敗させた。エチオピアの独立は守られ、エリトリアだけがイタリアに残った。
      source: "https://ja.wikipedia.org/wiki/アドワの戦い"
    - from: 1897
      to: 1935
      text: 首府をアスマラに移し、マッサワとの鉄道やロープウェイを造った。多くのエリトリア人がイタリア植民地軍の兵士（アスカリ）となり、リビアの戦争にも送られた。1930年代にはエチオピア侵攻の基地としてイタリア人の移住と工事が増えた。
