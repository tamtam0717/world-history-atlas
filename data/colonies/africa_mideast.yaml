    labels: [スーダン（英・エジプト軍の占領）, スーダン（英・エジプト軍の再征服）, ダール・マサリート（スルタン国。英・エジプトの間接統治）]
  from: 1891
  to: 1955
  polities: [sudan, south_sudan, mahdist, darfur]
  governors:
    - { name: ハーバート・キッチナー, title: 総督, from: 1899, to: 1899, note: オムドゥルマンの戦いでマフディー国家を倒す, source: "https://ja.wikipedia.org/wiki/ハーバート・キッチナー" }
    - { name: レジナルド・ウィンゲート, title: 総督, from: 1899, to: 1916, source: "https://en.wikipedia.org/wiki/Reginald_Wingate" }
    - { name: リー・スタック, title: 総督, from: 1917, to: 1924, note: カイロで暗殺され、エジプト軍はスーダンから追い出される, source: "https://en.wikipedia.org/wiki/Lee_Stack" }
  periods:
    - from: 1891
      to: 1898
      text: アフリカ分割でナイル川の上流を狙うフランスやイタリアに先んじるため、イギリスはエジプト軍を率いてスーダンの再征服に乗り出した。1898年、キッチナーの軍は機関銃でマフディー国家の軍をオムドゥルマンで破り、続いて南のファショダでフランスのマルシャン隊と向き合った（ファショダ事件。フランスが退く）。
      source: "https://ja.wikipedia.org/wiki/ファショダ事件"
    - from: 1899
      to: 1923
      text: 1899年の協定で、イギリスとエジプトの共同統治とされたが、総督はイギリス人で実権もイギリスにあった。北部のアラブ・イスラーム地域と南部のキリスト教・伝統宗教の地域は別々に治められた（南部政策）。1916年にダルフールのスルタン国も併合した。
      source: "https://en.wikipedia.org/wiki/Anglo-Egyptian_Sudan"
    - from: 1924
      to: 1945
      text: 1924年、総督スタックがカイロで暗殺されると、イギリスはエジプトの軍と役人をスーダンから追い出した。ゲジラ地方で灌漑による綿花の栽培が大規模に始まり（1925年のセンナール・ダム）、スーダン経済の柱になった。第二次世界大戦では、隣のイタリア領東アフリカとの戦場になった。
      source: "https://en.wikipedia.org/wiki/Anglo-Egyptian_Sudan"
    - from: 1946
      to: 1955
      text: 戦後、エジプトはスーダンとの統合を、スーダンの政党は独立を求めた。1952年のエジプト革命の後、1953年の英・エジプト協定で自治と自決が決まり、1956年1月に独立した。独立の直前の1955年、北部中心の政府に反発する南部で反乱が起き、長い内戦の始まりとなった（2011年に南スーダンが分離）。
      source: "https://ja.wikipedia.org/wiki/第一次スーダン内戦"
  source:
    - "https://ja.wikipedia.org/wiki/アングロ・エジプト・スーダン"
    - "https://en.wikipedia.org/wiki/Anglo-Egyptian_Sudan"

