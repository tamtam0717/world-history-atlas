# アフリカ・中東の植民地・保護国・委任統治領・占領地（docs/data-format.md の「植民地」。担当 C3）
# match の副ラベルは、地域の timeline の label（owner が parent のもの）の1行目。
# 副ラベルのない土地（アルジェリア 1940 年以降・モロッコ・エジプト・湾岸など）は iso・regions で拾う（owner が parent のピースだけが当てはまる）。
# このファイルは asia_africa.yaml より先に読まれる（ファイル名の順）ので、そちらの植民地と同じピース・年が重ならないようにしている。

# ---------------------------------------------------------------- 北アフリカ

- id: french_algeria
  name: フランス領アルジェリア
  parent: france
  kind: 植民地（1848年から本国の県）
  match:
    iso: [DZA]
  from: 1830
  to: 1961
  polities: [algeria, algiers]
  governors:
    - { name: トマ・ロベール・ビュジョー, title: 総督, from: 1840, to: 1847, note: 焦土戦術でアブド・アルカーディルの抵抗を抑える, source: "https://en.wikipedia.org/wiki/Thomas_Robert_Bugeaud" }
    - { name: パトリス・ド・マクマオン, title: 総督, from: 1864, to: 1870, note: のちの第三共和政の大統領, source: "https://en.wikipedia.org/wiki/List_of_French_governors_of_Algeria" }
    - { name: シャルル・ジョナール, title: 総督, from: 1903, to: 1911, source: "https://en.wikipedia.org/wiki/List_of_French_governors_of_Algeria" }
    - { name: ジャック・スーステル, title: 総督, from: 1955, to: 1956, source: "https://en.wikipedia.org/wiki/List_of_French_governors_of_Algeria" }
    - { name: ロベール・ラコスト, title: 駐在相, from: 1956, to: 1958, note: アルジェの戦いで軍に警察権を与える, source: "https://en.wikipedia.org/wiki/List_of_French_governors_of_Algeria" }
  periods:
    - from: 1830
      to: 1847
      text: 復古王政のシャルル10世は、国内の不満をそらすため、1830年にアルジェを攻め落とした（オスマン帝国のもとのアルジェ太守を倒す）。七月王政も占領を続け、内陸ではアブド・アルカーディルが部族をまとめて15年にわたり抵抗した。総督ビュジョーの焦土戦術で抵抗は抑えられ、1847年にアブド・アルカーディルは降伏した。
      source: "https://ja.wikipedia.org/wiki/フランス領アルジェリア"
    - from: 1848
      to: 1870
      text: 二月革命後の1848年、北部はアルジェ・オラン・コンスタンティーヌの3県として本国に組み込まれた。没収した土地にフランス・スペイン・イタリアなどからの入植者（コロン）が入り、ブドウ畑や小麦の農園を開いた。ナポレオン3世は「アラブ王国」を唱えて先住民の土地を守ろうとしたが、入植者は反発した。
      source: "https://en.wikipedia.org/wiki/French_Algeria"
    - from: 1871
      to: 1918
      text: 普仏戦争の敗北の年（1871年）、カビリーで大反乱が起き、鎮圧後さらに土地が奪われた。第三共和政のもとで入植者が政治を握り、ユダヤ教徒には市民権が与えられた（クレミュー法）一方、ムスリムは「原住民法」で差別された。20世紀初めに南のサハラへ領域を広げた。第一次世界大戦では多くのアルジェリア人が兵士・労働者として本国へ送られた。
      source: "https://en.wikipedia.org/wiki/French_Algeria"
    - from: 1919
      to: 1953
      text: 本国へ出稼ぎに出た労働者の中からメッサーリー・ハーッジの独立運動が生まれ、ウラマー（イスラーム学者）の改革運動も広がった。第二次世界大戦では、1940年からヴィシー政府のもとに置かれ、1942年に連合軍が上陸した。1945年5月8日、ヨーロッパの戦勝の日にセティフで起きた暴動は激しく弾圧され、多くの死者が出た。
      source: "https://en.wikipedia.org/wiki/Sétif_and_Guelma_massacre"
    - from: 1954
      to: 1961
      text: 1954年11月、民族解放戦線（FLN）が武装蜂起し、アルジェリア戦争が始まった。フランスは50万人近い兵を送り、拷問も行われた。1958年、入植者と軍がアルジェで反乱を起こすと、本国では第四共和政が倒れてド・ゴールが復帰した（第五共和政）。ド・ゴールは民族自決を認める方へ転じ、1962年のエヴィアン協定と住民投票で独立が決まった。約100万人の入植者（ピエ・ノワール）が本国へ引き揚げた。
      source: "https://ja.wikipedia.org/wiki/アルジェリア戦争"
  source:
    - "https://ja.wikipedia.org/wiki/フランス領アルジェリア"
    - "https://en.wikipedia.org/wiki/French_Algeria"

- id: french_tunisia
  name: チュニジア（フランスの保護国）
  parent: france
  kind: 保護国（ベイの政府を残し、フランスの総駐在官が実権を握る）
  match:
    iso: [TUN]
  from: 1881
  to: 1955
  polities: [tunisia, tunis]
  governors:
    - { name: ムハンマド・サーディク, title: ベイ（君主）, from: 1859, to: 1882, note: バルドー条約で保護国化を認める, source: "https://en.wikipedia.org/wiki/Muhammad_III_as-Sadiq" }
    - { name: ポール・カンボン, title: 総駐在官, from: 1882, to: 1886, note: マルサ協定（1883年）で保護国の統治の形を作る, source: "https://en.wikipedia.org/wiki/Paul_Cambon" }
    - { name: ムハンマド・アミーン, title: 最後のベイ, from: 1943, to: 1957, source: "https://en.wikipedia.org/wiki/Muhammad_VIII_al-Amin" }
  periods:
    - from: 1881
      to: 1913
      text: チュニスのベイ政権は、近代化の改革で借金がふくらみ、1869年から英・仏・伊の国際財務委員会の管理を受けていた。ベルリン会議（1878年）でイギリスとドイツの了解を得たフランスは、1881年、アルジェリアとの国境の部族の侵入を理由に出兵し、バルドー条約で保護国とした。チュニジアに多くの移民を送っていたイタリアは反発し、翌年ドイツ・オーストリアと三国同盟を結んだ。
      source: "https://ja.wikipedia.org/wiki/チュニジアの歴史"
    - from: 1914
      to: 1939
      text: ベイの政府は形だけ残り、フランス人の官吏と入植者が政治と良い土地を握った。1920年に立憲を求めるドゥストゥール党ができ、1934年にはブルギバらが新ドゥストゥール党を作って独立運動の中心になった。
      source: "https://en.wikipedia.org/wiki/French_protectorate_of_Tunisia"
    - from: 1940
      to: 1945
      text: 本国の降伏後はヴィシー政府に従った。1942年11月、連合軍の北アフリカ上陸に対し、ドイツ・イタリア軍がチュニジアに入り、最後の拠点となった（チュニジアの戦い）。1943年5月に枢軸軍が降伏した。
      source: "https://en.wikipedia.org/wiki/Tunisian_campaign"
    - from: 1946
      to: 1955
      text: 戦後、新ドゥストゥール党と労働組合が独立を求め、1952年からはゲリラ闘争も起きた。インドシナで敗れたフランスのマンデス＝フランス内閣は1954年に内政自治を認め、1956年3月に独立した。翌年、ブルギバがベイを退けて共和国の大統領になった。
      source: "https://ja.wikipedia.org/wiki/ハビーブ・ブルギーバ"
  source:
    - "https://ja.wikipedia.org/wiki/チュニジアの歴史"
    - "https://en.wikipedia.org/wiki/French_protectorate_of_Tunisia"

- id: french_morocco
  name: フランス保護領モロッコ
  names:
    - { to: 1911, name: モロッコ（フランス軍の占領地）, kind: 占領地（ウジダ・カサブランカ周辺） }
  parent: france
  kind: 保護国（スルタンの政府を残し、フランスの総駐在官が実権を握る）
  match:
    iso: [MAR]
  from: 1907
  to: 1955
  polities: [morocco, rif_republic]
  governors:
    - { name: ユベール・リヨテ, title: 総駐在官, from: 1912, to: 1925, note: スルタンの権威を立てる間接統治と都市計画で知られる, source: "https://ja.wikipedia.org/wiki/ユベール・リヨテ" }
    - { name: アルフォンス・ジュアン, title: 総駐在官, from: 1947, to: 1951, source: "https://en.wikipedia.org/wiki/Alphonse_Juin" }
    - { name: ムハンマド5世, title: スルタン, from: 1927, to: 1955, note: 1953–55年はフランスに退位させられ、マダガスカルに流される, source: "https://ja.wikipedia.org/wiki/ムハンマド5世_(モロッコ王)" }
  periods:
    - from: 1907
      to: 1911
      text: 英仏協商（1904年）でエジプトとモロッコの勢力圏を認め合ったフランスに対し、ドイツは皇帝ヴィルヘルム2世のタンジール訪問で異を唱えた（第1次モロッコ事件、1905年）。アルヘシラス会議（1906年）でドイツは孤立し、フランスは1907年にウジダとカサブランカを占領した。1911年、フランスのフェズ出兵にドイツが軍艦をアガディールに送った（第2次モロッコ事件）。
      source: "https://ja.wikipedia.org/wiki/モロッコ事件"
    - from: 1912
      to: 1925
      text: ドイツにコンゴの一部を譲って了解をとり、1912年のフェズ条約でモロッコを保護国とした（北部はスペインの保護領、タンジールは国際管理）。総駐在官リヨテはスルタンの権威を立てつつ、新しい都ラバトや港カサブランカを整えた。山地の部族の平定は1934年まで続き、北部ではアブド・アルカリームのリーフ共和国（1921–26年）が独仏の連合軍に敗れた。
      source: "https://en.wikipedia.org/wiki/French_protectorate_in_Morocco"
    - from: 1926
      to: 1945
      text: 入植者が平野の農地を広げ、燐鉱石の採掘も進んだ。1930年、ベルベル人をイスラーム法でなく慣習法で裁く「ベルベル勅令」がアラブ人とベルベル人を分ける政策とみられ、民族運動が広がった。1943年のカサブランカ会談のときスルタンはアメリカのローズヴェルトと会い、1944年に独立党（イスティクラール）が独立を求めた。
      source: "https://en.wikipedia.org/wiki/French_protectorate_in_Morocco"
    - from: 1946
      to: 1955
      text: スルタンのムハンマド5世が独立運動に近づくと、フランスは1953年に彼を退位させてマダガスカルへ流した。かえって反仏の暴動とテロが広がり、アルジェリア戦争も始まったフランスは1955年にスルタンを復位させ、1956年3月に保護国は終わって独立した（翌年から国王）。
      source: "https://ja.wikipedia.org/wiki/ムハンマド5世_(モロッコ王)"
  source:
    - "https://ja.wikipedia.org/wiki/フランス保護領モロッコ"
    - "https://en.wikipedia.org/wiki/French_protectorate_in_Morocco"

- id: spanish_morocco
  name: スペイン保護領モロッコ
  names:
    - { to: 1911, name: メリリャ・ララシュ周辺（スペイン軍の占領） }
  parent: spain
  kind: 保護領（北部。テトゥアンにスルタンの代理ハリーファとスペインの高等弁務官）
  match:
    regions: [morocco_spanish_rif, morocco_spanish_zone, larache, melilla_hinterland]
    labels: [タンジール（スペインの占領）]
  from: 1909
  to: 1955
  polities: [morocco, rif_republic, nationalist_spain]
  governors:
    - { name: ダマソ・ベレンゲール, title: 高等弁務官, from: 1919, to: 1922, note: アンワールの敗戦の責任を問われる, source: "https://en.wikipedia.org/wiki/Dámaso_Berenguer" }
    - { name: ムーレイ・ハサン・ビン・マフディー, title: ハリーファ（スルタンの代理）, from: 1925, to: 1956, source: "https://en.wikipedia.org/wiki/Spanish_protectorate_in_Morocco" }
  periods:
    - from: 1909
      to: 1920
      text: 米西戦争（1898年）で海外領土の多くを失ったスペインは、古くからの拠点メリリャ・セウタの背後に勢力を広げた。1909年のメリリャ周辺の戦いでは、本国で予備兵の動員に反対するバルセロナの暴動（悲劇の一週間）が起きた。1912年、フランスとの条約でモロッコ北部の保護領を得た。
      source: "https://en.wikipedia.org/wiki/Spanish_protectorate_in_Morocco"
    - from: 1921
      to: 1926
      text: 1921年、リーフ地方の指導者アブド・アルカリームがアンワールでスペイン軍を大敗させ、リーフ共和国を立てた。この敗戦は本国の政治を揺るがし、1923年のプリモ・デ・リベラの軍事独裁につながった。1925年のアルホセイマ上陸作戦とフランス軍の協力で、1926年にリーフ共和国は倒れた。
      source: "https://ja.wikipedia.org/wiki/第3次リーフ戦争"
    - from: 1927
      to: 1955
      text: 保護領の軍（アフリカ軍）はスペイン軍の精鋭となり、1936年にはここからフランコが反乱を起こした（スペイン内戦）。内戦中はフランコ派が治め、多くのモロッコ兵が本国の戦場に送られた。第二次世界大戦中の1940–45年にはタンジールも占領した。フランス領が独立した1956年、スペインも北部の保護領を返した。
      source: "https://en.wikipedia.org/wiki/Spanish_protectorate_in_Morocco"
  source:
    - "https://ja.wikipedia.org/wiki/スペイン保護領モロッコ"
    - "https://en.wikipedia.org/wiki/Spanish_protectorate_in_Morocco"

- id: spanish_sahara
  name: スペイン領サハラ
  names:
    - { from: 1946, to: 1957, name: スペイン領西アフリカ（サハラ・イフニ・タルファヤ）, kind: 植民地（総督はイフニのシディ・イフニ） }
  parent: spain
  kind: 植民地（リオ・デ・オロとサギア・エル・ハムラ）
  match:
    iso: [ESH]
    regions: [tarfaya_strip, sidi_ifni]
  from: 1884
  to: 1975
  polities: [morocco, mauritania]
  periods:
    - from: 1884
      to: 1933
      text: アフリカ分割のなか、1884年にスペインは大西洋岸のリオ・デ・オロ（ビリャ・シスネロス、いまのダフラ）を保護領とした。フランスとの条約（1900・1904・1912年）で内陸の境界が決まったが、遊牧民の住む内陸にはほとんど手が及ばず、海岸の数か所の拠点だけだった。
      source: "https://ja.wikipedia.org/wiki/スペイン領サハラ"
    - from: 1934
      to: 1957
      text: 1934年に内陸のスマラなどを占め、イフニ（1934年）も実際に統治し始めた。1946年、サハラ・イフニ・タルファヤ地帯をスペイン領西アフリカとしてまとめた。独立したモロッコは1957年にイフニとサハラを攻め（イフニ戦争）、1958年にスペインはタルファヤ地帯を返した。
      source: "https://en.wikipedia.org/wiki/Ifni_War"
    - from: 1958
      to: 1975
      text: 1958年にサハラは本国の県（海外州）となった。1960年代にブー・クラーで燐鉱石の採掘が始まると重要性が増し、1973年には独立を求めるポリサリオ戦線が武装闘争を始めた。イフニは1969年にモロッコへ返された。1975年、フランコの死の直前に、モロッコの「緑の行進」を受けてマドリード協定でモロッコとモーリタニアに引き渡したが、住民の自決は決まらず、いまも係争地として残る。
      source: "https://ja.wikipedia.org/wiki/西サハラ問題"
  source:
    - "https://ja.wikipedia.org/wiki/スペイン領サハラ"
    - "https://en.wikipedia.org/wiki/Spanish_Sahara"

- id: italian_libya
  name: イタリア領リビア
  names:
    - { to: 1933, name: イタリア領トリポリタニア・キレナイカ, kind: 植民地（トリポリタニアとキレナイカの2つの植民地） }
  parent: italy
  kind: 植民地（1934年に1つにまとめる）
  match:
    iso: [LBY]
  from: 1911
  to: 1942
  polities: [libya, senussi, tripolitania_republic]
  governors:
    - { name: ピエトロ・バドリオ, title: 総督, from: 1929, to: 1933, source: "https://en.wikipedia.org/wiki/Pietro_Badoglio" }
    - { name: ロドルフォ・グラツィアーニ, title: キレナイカ副総督, from: 1930, to: 1934, note: 遊牧民を収容所に入れ、ウマル・ムフタールを処刑, source: "https://en.wikipedia.org/wiki/Rodolfo_Graziani" }
    - { name: イタロ・バルボ, title: 総督, from: 1934, to: 1940, note: ファシスト党の幹部。農民の大量入植を進める, source: "https://en.wikipedia.org/wiki/Italo_Balbo" }
  periods:
    - from: 1911
      to: 1922
      text: アドワの戦い（1896年）でエチオピアに敗れたイタリアは、地中海の対岸のオスマン帝国領を狙い、1911年にイタリア＝トルコ戦争を起こした。1912年のローザンヌ条約でトリポリタニアとキレナイカを得たが、内陸ではサヌーシー教団などの抵抗が続き、第一次世界大戦中には海岸の数都市しか保てなかった。
      source: "https://ja.wikipedia.org/wiki/伊土戦争"
    - from: 1923
      to: 1932
      text: ムッソリーニのファシスト政権は「再征服」を始め、総督バドリオと副総督グラツィアーニはキレナイカの遊牧民を強制収容所に移して抵抗を断ち切った。サヌーシー教団の指導者ウマル・ムフタールは1931年に捕らえられて処刑され、翌年に抵抗は終わった。
      source: "https://ja.wikipedia.org/wiki/ウマル・ムフタール"
    - from: 1933
      to: 1942
      text: 1934年に「リビア」として1つにまとめ、総督バルボはイタリアの農民を大量に入植させ、海岸道路を造った。1939年に海岸部はイタリア本国に組み込まれた。第二次世界大戦では、北アフリカ戦線の戦場となり、ドイツのロンメルの軍とイギリス軍がキレナイカを奪い合った。1942年のエル・アラメインの戦いの後、1943年までにイギリス・自由フランス軍に占領された。
      source: "https://en.wikipedia.org/wiki/Italian_Libya"
  note: 1943–51年はイギリス（トリポリタニア・キレナイカ）とフランス（フェザーン）の軍政。1951年に連合王国として独立した。
  source:
    - "https://ja.wikipedia.org/wiki/イタリア領リビア"
    - "https://en.wikipedia.org/wiki/Italian_Libya"

