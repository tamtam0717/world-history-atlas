    - { name: アッバース2世, title: ヘディーヴ, from: 1892, to: 1914, note: 大戦の開始で廃位, source: "https://en.wikipedia.org/wiki/Abbas_II_of_Egypt" }
    - { name: フサイン・カーミル, title: スルタン, from: 1914, to: 1917, source: "https://en.wikipedia.org/wiki/Hussein_Kamel_of_Egypt" }
  periods:
    - from: 1882
      to: 1906
      text: スエズ運河の建設などで借金を重ねたエジプトは、1875年に運河の株をイギリスに売り、英仏の財政管理を受けた。外国の支配に反対するウラービー運動が起きると、イギリスは1882年に単独で出兵してエジプトを占領した。名目上はオスマン帝国の宗主権とヘディーヴの政府が残ったが、総領事クローマーが実権を握り、綿花の輸出と財政の立て直しを進めた。
      source: "https://ja.wikipedia.org/wiki/ウラービー革命"
    - from: 1907
      to: 1913
      text: 1906年、イギリス将校の鳩撃ちから起きたディンシャワイ事件で村人が処刑され、ムスタファー・カーミルらの民族運動が強まった。英仏協商（1904年）でフランスはイギリスのエジプト支配を認めていた。
      source: "https://en.wikipedia.org/wiki/History_of_Egypt_under_the_British"
    - from: 1914
      to: 1921
      text: 第一次世界大戦でオスマン帝国が敵になると、イギリスはヘディーヴを退け、1914年にエジプトをオスマン帝国から切り離して保護国とした。スエズ運河を守る基地となり、住民は労働や物資を徴発された。戦後、ワフド党のサアド・ザグルールが独立を求めて流刑にされると1919年革命が起き、イギリスは1922年に保護国をやめて独立を認めた（ただしスエズ運河・スーダン・防衛などは留保）。
      source: "https://ja.wikipedia.org/wiki/エジプト革命_(1919年)"
  source:
    - "https://ja.wikipedia.org/wiki/エジプト・スルタン国"
    - "https://en.wikipedia.org/wiki/History_of_Egypt_under_the_British"

- id: egyptian_sudan
