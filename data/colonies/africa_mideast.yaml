    - { name: チャールズ・ゴードン, title: スーダン総督, from: 1877, to: 1880, note: 1884年に再び送られ、翌年ハルツームでマフディー軍に殺される, source: "https://ja.wikipedia.org/wiki/チャールズ・ゴードン" }
    - { name: エミン・パシャ, title: エクアトリア州の長官, from: 1878, to: 1889, note: マフディー国家に囲まれて南部で孤立, source: "https://en.wikipedia.org/wiki/Emin_Pasha" }
  periods:
