      to: 1696
      text: スペインが住民を移して空いたイスパニョーラ島の西部に、野生の牛を狩るフランス人のバッカニア（海賊）が住みつき、北のトルトゥーガ島を根城にスペイン船を襲った。1665年に西インド会社の総督が置かれ、海賊たちはタバコや藍を作る入植者になっていった。1697年のライスワイク条約で、スペインは島の西3分の1をフランスに認めた。
