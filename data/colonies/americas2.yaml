    - { name: ジョン・ウィンスロップ, title: マサチューセッツ湾植民地の総督, from: 1630, to: 1649, note: 「丘の上の町」を説いたピューリタンの指導者。何度も選ばれた, source: "https://en.wikipedia.org/wiki/John_Winthrop" }
    - { name: エドマンド・アンドロス, title: ニューイングランド王領の総督, from: 1686, to: 1689, note: 名誉革命の報せでボストン市民に捕らえられる, source: "https://en.wikipedia.org/wiki/Edmund_Andros" }
    - { name: ウィリアム・フィップス, title: 初代の王領総督, from: 1692, to: 1694, note: セイラムの魔女裁判のときの総督, source: "https://en.wikipedia.org/wiki/William_Phips" }
    - { name: トマス・ハッチンソン, title: 総督, from: 1771, to: 1774, note: ボストン茶会事件のときの総督, source: "https://en.wikipedia.org/wiki/Thomas_Hutchinson_(governor)" }
    - { name: トマス・ゲイジ, title: 最後の王領総督, from: 1774, to: 1775, note: 北アメリカのイギリス軍司令官を兼ねる, source: "https://en.wikipedia.org/wiki/Thomas_Gage" }
  periods:
    - from: 1620
      to: 1629
      text: 1620年、本国の国教会から離れた分離派のピューリタン（ピルグリム・ファーザーズ）が、メイフラワー号でプリマスに着き、船の中で自分たちで政治を行う誓約（メイフラワー誓約）を結んだ。最初の冬に半数が死んだが、先住民ワンパノアグの助けで生き延びた。
      source: "https://ja.wikipedia.org/wiki/ピルグリム・ファーザーズ"
    - from: 1630
      to: 1659
      text: チャールズ1世の専制とピューリタンへの圧迫を逃れて、1630年からウィンスロップらのピューリタンが大挙して移住し、ボストンを建てた（大移住）。会社の特許状を植民地に持ってきて、教会員の男子が総督を選ぶ自治を行い、ハーヴァード大学（1636年）を建てた。異端とされたロジャー・ウィリアムズはロードアイランドへ追われた。本国のピューリタン革命では議会派の側だった。
      source: "https://en.wikipedia.org/wiki/Massachusetts_Bay_Colony"
    - from: 1660
      to: 1691
      text: 王政復古の本国は航海法で植民地の貿易を縛り、マサチューセッツはそれを無視した。1675–76年、ワンパノアグのメタコメット（フィリップ王）との戦争で、先住民も入植者も多くが死んだ。1684年に特許状が取り消され、ジェームズ2世はニューイングランド王領を置いてアンドロスに治めさせたが、名誉革命の報せで市民がアンドロスを捕らえた。
      source: "https://en.wikipedia.org/wiki/King_Philip's_War"
    - from: 1692
      to: 1763
      text: 1691年の新しい特許状で、プリマスとメインを合わせた王領植民地になり、総督は国王が任命し、議会の議員の資格は教会員でなく財産で決まるようになった。1692年にセイラムの魔女裁判。ボストンは漁業・造船と、ラム酒・奴隷・糖蜜の三角貿易で栄えた。英仏の植民地戦争ではフランスのルイブール要塞を落とした（1745年）。
      source: "https://en.wikipedia.org/wiki/Province_of_Massachusetts_Bay"
    - from: 1764
      to: 1775
      text: 七年戦争後、本国は砂糖法・印紙法（1765年）・タウンゼンド諸法で課税を強め、ボストンは反対運動の中心になった。ボストン虐殺事件（1770年）、ボストン茶会事件（1773年）に対して、本国は港を閉じ自治を取り上げる「耐えがたき諸法」で応じた。1775年4月、レキシントン・コンコードの戦いで独立戦争が始まった。
      source: "https://ja.wikipedia.org/wiki/ボストン茶会事件"
  source:
    - "https://en.wikipedia.org/wiki/Massachusetts_Bay_Colony"
    - "https://en.wikipedia.org/wiki/Province_of_Massachusetts_Bay"

- id: province_of_new_york
  name: ニューヨーク植民地
  parent: britain
  kind: 植民地（1664–85年はヨーク公の領地、のち王領植民地）
  match:
    labels: [ニューヨーク植民地, ヨーク公領, ヨーク公領（デラウェア）, ニューヨーク植民地（ナイアガラ砦）, ニューヨーク植民地（係争地）, ニューヨーク（イギリス軍の占領）]
  from: 1664
  to: 1783
  polities: [usa, iroquois]
  governors:
    - { name: リチャード・ニコルズ, title: 初代総督, from: 1664, to: 1668, note: オランダからニューアムステルダムを奪う, source: "https://en.wikipedia.org/wiki/Richard_Nicolls" }
    - { name: エドマンド・アンドロス, title: 総督, from: 1674, to: 1681, source: "https://en.wikipedia.org/wiki/Edmund_Andros" }
    - { name: ジェイコブ・ライスラー, title: 総督代行（反乱）, from: 1689, to: 1691, note: 名誉革命に乗じて実権を握り、のち処刑される, source: "https://en.wikipedia.org/wiki/Leisler's_Rebellion" }
    - { name: ウィリアム・トライオン, title: 最後の文官総督, from: 1771, to: 1780, source: "https://en.wikipedia.org/wiki/William_Tryon" }
  periods:
    - from: 1664
      to: 1688
      text: 1664年、国王チャールズ2世は弟のヨーク公（のちのジェームズ2世）にオランダ領ニューネーデルラントを与え、艦隊がニューアムステルダムを無血で奪ってニューヨークと名づけた（第二次英蘭戦争）。1673年にオランダがいったん奪い返したが、翌年のウェストミンスター条約で戻った。オランダ系の住民と商人はそのまま残った。
      source: "https://en.wikipedia.org/wiki/Province_of_New_York"
    - from: 1689
      to: 1753
      text: 名誉革命の報せを受けて、ライスラーの反乱が起きた（1689–91年）。ニューヨーク港は毛皮・小麦粉の輸出と私掠船・密貿易で栄え、イロコイ連邦との同盟（「盟約の鎖」）がフランス領カナダに対する北の守りになった。1735年、ゼンガー事件で出版の自由が争われた。
      source: "https://en.wikipedia.org/wiki/Leisler's_Rebellion"
    - from: 1754
      to: 1775
      text: 1754年のオールバニ会議で、フランクリンが植民地の連合を提案したが実らなかった。フレンチ＝インディアン戦争ではニューヨークが北の戦場になり、ナイアガラ砦を奪った（1759年）。戦後、印紙法会議（1765年）がニューヨークで開かれ、課税への反対で植民地がまとまった。
      source: "https://ja.wikipedia.org/wiki/オールバニ会議"
    - from: 1776
      to: 1783
      text: 1776年、イギリス軍がワシントン軍を破ってニューヨーク市を占領し、独立戦争の間ずっとイギリス軍の本拠と王党派（ロイヤリスト）の避難所になった。北のサラトガの戦い（1777年）でイギリス軍が降伏したのが、フランス参戦のきっかけになった。1783年のパリ条約の後、イギリス軍は撤退し、多くの王党派がカナダへ移った。
      source: "https://en.wikipedia.org/wiki/New_York_and_New_Jersey_campaign"
  source:
    - "https://en.wikipedia.org/wiki/Province_of_New_York"

