    - { name: アレハンドロ・オライリー, title: 総督, from: 1769, to: 1770, note: 反乱の指導者を処刑し、スペインの統治を固める, source: "https://en.wikipedia.org/wiki/Alejandro_O'Reilly" }
    - { name: ベルナルド・デ・ガルベス, title: 総督, from: 1777, to: 1785, note: アメリカ独立戦争で西フロリダのイギリス領を攻め落とす, source: "https://ja.wikipedia.org/wiki/ベルナルド・デ・ガルベス" }
    - { name: フランシスコ・ルイス・エクトル・デ・カロンデレ, title: 総督, from: 1791, to: 1797, source: "https://en.wikipedia.org/wiki/Francisco_Luis_Héctor_de_Carondelet" }
    - { name: フアン・マヌエル・デ・サルセド, title: 最後の総督, from: 1801, to: 1803, source: "https://en.wikipedia.org/wiki/Juan_Manuel_de_Salcedo" }
  periods:
    - from: 1763
      to: 1776
      text: 七年戦争の終わりに、フランスはミシシッピ川の西のルイジアナを、同盟国スペインに秘密に譲った（フォンテーヌブロー条約、1762年）。イギリスに渡す代わりに、メキシコへの緩衝地帯として持たせたのである。1768年、フランス系の住民（クレオール）が初代総督ウジョアを追い出し、翌年オライリーが軍を率いて反乱を鎮めた。
      source: "https://en.wikipedia.org/wiki/Louisiana_(New_Spain)"
    - from: 1777
      to: 1795
      text: アメリカ独立戦争では、総督ガルベスがニューオーリンズからアメリカの独立派に武器を送り、スペインが参戦すると西フロリダのイギリス領を落とした。独立後は、ミシシッピ川を下ってニューオーリンズで荷を積み替える合衆国の西部の農民との関係が問題になった。カナダを追われたアカディア人（ケイジャン）も移り住んだ。
      source: "https://ja.wikipedia.org/wiki/ベルナルド・デ・ガルベス"
    - from: 1796
      to: 1802
      text: 1795年のピンクニー条約で、スペインは合衆国にミシシッピ川の航行とニューオーリンズの利用を認めた。1800年、ナポレオンに迫られたスペインは、サン・イルデフォンソの秘密条約でルイジアナをフランスに返した。引き渡しは1803年で、フランスは同じ年にルイジアナを合衆国に売った（ルイジアナ購入）。
      source: "https://ja.wikipedia.org/wiki/ルイジアナ買収"
  source:
    - "https://en.wikipedia.org/wiki/Louisiana_(New_Spain)"

