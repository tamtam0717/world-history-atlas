  from: 1663
  to: 1781
  polities: [usa, cherokee, creek]
  governors:
    - { name: ジェームズ・グレン, title: 総督, from: 1743, to: 1756, source: "https://en.wikipedia.org/wiki/James_Glen" }
  periods:
    - from: 1663
      to: 1711
      text: 1663年、チャールズ2世が、王政復古に功のあった8人の貴族（領主）にカロライナ（国王の名にちなむ）を与えた。1670年、バルバドスの砂糖農園主の子弟が多く移ってチャールストンを建て、カリブ海式の奴隷制を持ち込んだ。先住民との鹿皮の交易と、先住民を捕らえて売る奴隷貿易で栄え、南のスペイン領フロリダの布教村を荒らした。
      source: "https://en.wikipedia.org/wiki/Province_of_Carolina"
    - from: 1712
      to: 1762
      text: 北と南が分かれた。ヤマシー戦争（1715–17年）で領主の守りが頼りにならないとわかり、入植者が領主を拒んで、1729年に王領植民地になった。米と藍の大農園で黒人奴隷が人口の多数を占めるようになり、1739年にはストノの奴隷反乱が起きた。チャールストンは南部で最も豊かな港町だった。
      source: "https://en.wikipedia.org/wiki/Province_of_South_Carolina"
    - from: 1763
      to: 1781
      text: 本国の課税に反対し、1776年に独立派が政府をつくった。独立戦争の後半、イギリス軍は南部の王党派を頼りに南へ戦場を移し、1780年にチャールストンを落としたが、奥地のゲリラ戦に苦しみ、1781年にヨークタウンで降伏した。
      source: "https://en.wikipedia.org/wiki/Siege_of_Charleston"
  source:
    - "https://en.wikipedia.org/wiki/Province_of_Carolina"
    - "https://en.wikipedia.org/wiki/Province_of_South_Carolina"

- id: province_of_north_carolina
  name: ノースカロライナ植民地
  names:
    - { to: 1711, name: ノースカロライナ（カロライナ植民地の北部）, kind: 領主植民地の一部（副総督） }
  parent: britain
  kind: 植民地（1729年から王領植民地）
  match:
    labels: [ノースカロライナ植民地]
  from: 1663
  to: 1775
  polities: [usa, cherokee]
  governors:
    - { name: ウィリアム・トライオン, title: 総督, from: 1765, to: 1771, note: 奥地の農民の反乱（レギュレーター運動）をアラマンスの戦いで鎮める, source: "https://en.wikipedia.org/wiki/William_Tryon" }
    - { name: ジョサイア・マーティン, title: 最後の王領総督, from: 1771, to: 1775, source: "https://en.wikipedia.org/wiki/Josiah_Martin" }
  periods:
    - from: 1663
      to: 1728
      text: カロライナの北部（アルベマール湾の周り）は、ヴァージニアから移った小農が多く、良い港がなかった。1711–15年のタスカローラ戦争で入植者と先住民が争い、敗れたタスカローラの多くは北へ逃れてイロコイ連邦に加わった。1712年に南と別の総督を持つ植民地になった。
      source: "https://en.wikipedia.org/wiki/Province_of_North_Carolina"
    - from: 1729
      to: 1763
      text: 1729年、国王が領主から買い取り、王領植民地になった。海岸ではタールなどの船の資材（海軍用品）やタバコを産し、奥地にはスコットランド系アイルランド人やドイツ系の人々が移り住んだ。
      source: "https://en.wikipedia.org/wiki/Province_of_North_Carolina"
    - from: 1764
      to: 1775
      text: 奥地の農民は、海岸の役人や議会の不正と重税に反発して「レギュレーター」を名のって立ち上がり、1771年のアラマンスの戦いで総督トライオンに鎮められた。本国の課税への反対はここでも強く、1775年に総督マーティンは逃れた。
      source: "https://en.wikipedia.org/wiki/Regulator_Movement"
  source:
    - "https://en.wikipedia.org/wiki/Province_of_North_Carolina"

- id: province_of_georgia
