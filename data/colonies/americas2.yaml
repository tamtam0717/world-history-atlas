      text: 1609年、オランダ東インド会社に雇われたハドソンがハドソン川をさかのぼった。オランダ人は毛皮の交易所を建て、1621年からは西インド会社の植民地になった。1626年、ミヌイットがマンハッタン島を先住民から買ってニューアムステルダムを建てた。
      source: "https://en.wikipedia.org/wiki/New_Netherland"
    - from: 1638
