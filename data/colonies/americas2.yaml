    - { name: ジャン＝バティスト・ル・モワーヌ・ド・ビエンヴィル, title: 総督, from: 1718, to: 1725, note: ニューオーリンズを建てる（1701–13年・1733–43年にも総督）, source: "https://en.wikipedia.org/wiki/Jean-Baptiste_Le_Moyne_de_Bienville" }
