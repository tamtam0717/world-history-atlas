      source: "https://en.wikipedia.org/wiki/Invasion_of_Jamaica"
    - from: 1692
      to: 1807
      text: 砂糖のプランテーションが島を覆い、18世紀にはイギリスで最も稼ぐ植民地になった。アフリカから連れてこられた奴隷が人口の9割を占め、マルーン戦争（1730年代・1795年）や、タッキーの反乱（1760年）が起きた。不在地主の農園主たちは本国の議会で「西インド派」として力をもった。
      source: "https://en.wikipedia.org/wiki/Colony_of_Jamaica"
    - from: 1808
      to: 1865
      text: 1807年に本国が奴隷貿易を禁じ、1831年の大きな奴隷反乱（バプテスト戦争）の後、1833年の奴隷制廃止法で奴隷が解放された（徒弟制を経て1838年に完全解放）。本国が砂糖の関税の特恵をやめると（1846年）、砂糖の経済は衰えた。
      source: "https://ja.wikipedia.org/wiki/奴隷制度廃止法"
    - from: 1866
      to: 1937
      text: 1865年、土地と選挙権を奪われた黒人の不満からモラント・ベイの反乱が起き、総督エアが数百人を処刑した。本国は植民地議会を廃し、総督が治める直轄植民地にした。バナナの輸出が砂糖に代わり、多くの人がパナマ運河の工事やアメリカへ出稼ぎに出た。ガーヴィーがアフリカ回帰運動を起こした。
      source: "https://en.wikipedia.org/wiki/Morant_Bay_rebellion"
    - from: 1938
      to: 1961
      text: 世界恐慌の中、1938年に労働者の暴動とストライキが起き、バスタマンテとマンリーが労働組合と政党をつくった。1944年に普通選挙が認められ、自治が進んだ。1958年、イギリス領の島々をまとめた西インド連邦に加わったが、1961年の住民投票で抜けることを決め、1962年に独立した。
      source: "https://ja.wikipedia.org/wiki/西インド連邦"
  source:
