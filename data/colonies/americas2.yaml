  polities: [trinidad_tobago]
  governors:
    - { name: トマス・ピクトン, title: 総督, from: 1797, to: 1803, note: 苛酷な統治で本国の裁判にかけられる, source: "https://en.wikipedia.org/wiki/Thomas_Picton" }
  periods:
    - from: 1797
      to: 1837
      text: スペイン領のトリニダードは、1783年の植民令でフランス系のカトリックの入植者を招いて砂糖の農園を広げていた。1797年、フランス革命戦争中にイギリスが奪い、1802年のアミアンの和約で正式に得た。本国は植民地議会を置かず、総督が直接治める新しい型の植民地とした。
      source: "https://en.wikipedia.org/wiki/Trinidad_and_Tobago#History"
    - from: 1838
      to: 1937
      text: 奴隷の解放（1834–38年）の後、農園の働き手として英領インドから年季契約の労働者が来て（1845–1917年）、アフリカ系とインド系がほぼ半々の社会になった。1889年にトバゴを合わせた。ピッチ湖のアスファルトに続いて、20世紀初めに石油の生産が始まった。
      source: "https://en.wikipedia.org/wiki/Indo-Trinidadian_and_Tobagonian"
    - from: 1938
      to: 1961
      text: 1937年の油田労働者のストライキが労働運動を起こし、1946年に普通選挙が入った。1956年、エリック・ウィリアムズ（『資本主義と奴隷制』の著者）の人民国民運動が政権を握り、西インド連邦（首都はポートオブスペイン）に加わったが、ジャマイカの脱退で連邦が崩れ、1962年に独立した。
      source: "https://ja.wikipedia.org/wiki/エリック・ウィリアムズ"
  source:
    - "https://en.wikipedia.org/wiki/Crown_Colony_of_Trinidad_and_Tobago"

- id: dutch_essequibo
  name: エセキボ・ベルビセ（オランダ領ギアナ）
  parent: netherlands
  kind: 植民地（西インド会社の経営。ベルビセはベルビセ協会）
  match:
    labels: [エセキボ（オランダ）, エセキボ（オランダ西インド会社）, ベルビセ（オランダ）, デメララ（オランダ西インド会社）, ベルビセ奴隷反乱]
  from: 1616
  to: 1813
  polities: [guyana]
  governors:
    - { name: ラウレンス・ストルム・ファン・スフラーフェサンデ, title: エセキボの長官, from: 1743, to: 1772, note: デメララ川の流域を開き、イギリス人の農園主も招く, source: "https://en.wikipedia.org/wiki/Laurens_Storm_van_%27s_Gravesande" }
  periods:
    - from: 1616
      to: 1745
      text: オランダ人は1616年ごろエセキボ川に交易所（のちキク・オヴェル・アル砦）を、1627年にベルビセ川に入植地を建て、先住民と染料や木材を交易した。やがて黒人奴隷を使う砂糖の農園が開かれた。
      source: "https://en.wikipedia.org/wiki/Essequibo_(colony)"
    - from: 1746
      to: 1780
      text: 1746年、エセキボの長官がデメララ川の流域を開き、イギリス領の島々の農園主も移ってきて、綿・コーヒー・砂糖が伸びた。1763年、ベルビセで奴隷のコフィの大反乱が起き、植民地のほとんどを1年近く奴隷が握った（2月23日はいまのガイアナの共和国記念日）。
      source: "https://en.wikipedia.org/wiki/Berbice_slave_uprising"
    - from: 1781
      to: 1813
      text: アメリカ独立戦争とフランス革命戦争・ナポレオン戦争のたびにイギリス・フランスに占領され（1781–84年、1796–1802年、1803年〜）、その間に農園主の多くはイギリス人になった。1814年の英蘭条約で正式にイギリスに渡り、のち英領ギアナになった。
      source: "https://en.wikipedia.org/wiki/Demerara"
  source:
    - "https://en.wikipedia.org/wiki/Essequibo_(colony)"
    - "https://en.wikipedia.org/wiki/Berbice"

- id: dutch_antilles
  name: オランダ領アンティル
  names:
    - { to: 1953, name: キュラソーとその属領（オランダ領西インド）, kind: 植民地（1791年まで西インド会社） }
  parent: netherlands
  kind: 王国の構成国（自治）
  match:
    labels: [キュラソー, アルバ, ボネール, シント・ユースタティウス, シント・マールテン, オランダ領アンティル]
  from: 1634
  to: 2009
  governors:
    - { name: ペーター・ストイフェサント, title: キュラソーの長官, from: 1642, to: 1644, note: のちニューネーデルラントの長官, source: "https://ja.wikipedia.org/wiki/ピーター・ストイフェサント" }
  periods:
    - from: 1634
      to: 1790
      text: 1634年、スペインと戦う西インド会社がキュラソーを奪い、アルバ・ボネールも得た。乾いた島で農業には向かず、キュラソーはカリブ海の奴隷貿易と、スペイン領との密貿易の中継地として栄えた。シント・ユースタティウスは中立の自由港で、1776年、アメリカの独立派の船に初めて礼砲で答えたとされ（「最初の礼砲」）、1781年にイギリスのロドニー提督に略奪された。
      source: "https://en.wikipedia.org/wiki/Curaçao_and_Dependencies"
    - from: 1791
      to: 1915
      text: 1791年に西インド会社が解散して国の植民地になった。ナポレオン戦争中はイギリスに占領された（1800–03年、1807–16年）。1795年にキュラソーでトゥーラの奴隷反乱が起き、奴隷制は1863年に廃止された。
      source: "https://en.wikipedia.org/wiki/Tula_(rebel_leader)"
    - from: 1916
      to: 2009
      text: ベネズエラの石油を精製する工場がキュラソー（シェル、1918年）とアルバに建てられ、島は豊かになった。1954年の王国憲章で、6つの島はオランダ領アンティルとして本国と対等な構成国になった。アルバは1986年に抜けて単独の構成国になり、2010年にアンティルは解体された（キュラソー・シント・マールテンは構成国、残りは本国の特別自治体）。
      source: "https://ja.wikipedia.org/wiki/オランダ領アンティル"
  source:
    - "https://ja.wikipedia.org/wiki/オランダ領アンティル"

- id: french_antilles
  name: フランス領アンティル（マルティニーク・グアドループ）
  parent: france
  kind: 植民地（1946年から海外県）
  # マルティニークとグアドループは別々の植民地だが、ここでは1つにまとめる
  match:
    labels: [マルティニーク, グアドループ, サン・マルタン（グアドループの属領）, サン・バルテルミー（グアドループの属領）]
  from: 1635
  to: 1945
  governors:
    - { name: ピエール・ブラン・デスナンビュック, title: 創設者, from: 1635, to: 1636, note: セント・クリストファー島からマルティニークに入植, source: "https://en.wikipedia.org/wiki/Pierre_Belain_d'Esnambuc" }
    - { name: ヴィクトール・ユーグ, title: 国民公会の委員（グアドループ）, from: 1794, to: 1798, note: 奴隷制廃止の法令を持ち込み、イギリス軍を追い出す, source: "https://en.wikipedia.org/wiki/Victor_Hugues" }
  periods:
    - from: 1635
      to: 1762
      text: 1635年、フランスの諸島会社がマルティニークとグアドループに入植し、先住民カリブ（カリナゴ）を追い払った。コルベールの重商主義のもとで砂糖のプランテーションが広がり、黒人奴隷の扱いを定める黒人法典（1685年）が出された。島の砂糖はボルドー・ナントの港を通じて本国を富ませた。
      source: "https://en.wikipedia.org/wiki/Code_Noir"
    - from: 1763
      to: 1815
      text: 七年戦争に負けたフランスは、1763年のパリ条約でカナダを手放しても、砂糖の島グアドループ・マルティニークは取り戻した。フランス革命で1794年に奴隷制が廃止されたが、ナポレオンは1802年に復活させ、グアドループではデルグレスが抵抗して自決した。マルティニークはイギリスの占領で廃止を免れた。
      source: "https://en.wikipedia.org/wiki/Louis_Delgrès"
    - from: 1816
      to: 1945
      text: 1848年、二月革命の臨時政府でシュルシェールが奴隷制を最終的に廃止した。そのあとインドから年季契約の労働者が来た。1902年、マルティニークのプレー山の噴火でサン・ピエールの町が全滅した。第二次世界大戦ではヴィシー政府についた総督が島を治めた。1946年、エメ・セゼールらの求めで本国の海外県になった。
      source: "https://ja.wikipedia.org/wiki/マルティニーク"
  source:
    - "https://en.wikipedia.org/wiki/History_of_Martinique"
    - "https://en.wikipedia.org/wiki/History_of_Guadeloupe"
