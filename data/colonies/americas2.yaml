  from: 1664
  to: 1775
  polities: [usa]
  governors:
    - { name: ウィリアム・フランクリン, title: 最後の王領総督, from: 1763, to: 1776, note: ベンジャミン・フランクリンの子。王党派として父と決裂, source: "https://en.wikipedia.org/wiki/William_Franklin" }
  periods:
    - from: 1664
      to: 1701
      text: ニューネーデルラントを奪った1664年、ヨーク公はハドソン川とデラウェア川の間の土地を2人の家臣に与えた（ジャージー島にちなむ名）。1674年に東ジャージーと西ジャージーに分かれ、西ジャージーはクエーカー教徒が買って入植した。
      source: "https://en.wikipedia.org/wiki/Province_of_New_Jersey"
    - from: 1702
      to: 1775
      text: 1702年、領主たちが統治権を国王に返し、2つが合わさって王領植民地になった（1738年まではニューヨークの総督が兼ねた）。小麦の農業が栄え、プリンストン大学（1746年）ができた。独立戦争ではトレントン・プリンストン（1776–77年）など多くの戦いの舞台になった。
      source: "https://en.wikipedia.org/wiki/Province_of_New_Jersey"
  source:
    - "https://en.wikipedia.org/wiki/Province_of_New_Jersey"

- id: british_floridas
  name: 東フロリダ・西フロリダ（イギリス領）
  parent: britain
  kind: 植民地（王領植民地2つ）
  match:
    labels: [東フロリダ, 西フロリダ]
  from: 1763
  to: 1783
  polities: [seminole, creek, choctaw]
  governors:
    - { name: ジョージ・ジョンストン, title: 西フロリダ総督, from: 1763, to: 1767, source: "https://en.wikipedia.org/wiki/George_Johnstone_(Royal_Navy_officer)" }
    - { name: ジェームズ・グラント, title: 東フロリダ総督, from: 1764, to: 1771, source: "https://en.wikipedia.org/wiki/James_Grant_(British_Army_officer,_born_1720)" }
  periods:
    - from: 1763
      to: 1775
      text: 七年戦争の後、1763年のパリ条約で、イギリスはスペインからフロリダを、フランスからミシシッピ川の東のルイジアナの一部を得て、首府セント・オーガスティンの東フロリダと、ペンサコーラの西フロリダの2つの植民地を置いた。スペイン系の住民はほとんどキューバへ去った。
      source: "https://en.wikipedia.org/wiki/British_West_Florida"
    - from: 1776
      to: 1783
      text: 独立戦争に加わらなかった植民地で、王党派の避難先になった。しかしスペインが参戦すると、ルイジアナ総督ガルベスが西フロリダを攻め落とし（ペンサコーラ 1781年）、1783年のパリ条約で両フロリダはスペインに返された。
      source: "https://en.wikipedia.org/wiki/Siege_of_Pensacola"
  source:
    - "https://en.wikipedia.org/wiki/British_West_Florida"
    - "https://en.wikipedia.org/wiki/East_Florida"

- id: british_nova_scotia
  name: ノヴァスコシア植民地
  names:
    - { to: 1712, name: アカディア（イギリスの占領）, kind: 占領地 }
  parent: britain
  kind: 植民地（王領植民地）
  match:
    labels: [アカディア（イングランドの占領）, アカディア（イギリスの占領）, ノヴァスコシア, ケープブレトン植民地, イル・ロワイヤル（イギリスの占領）]
  from: 1654
  to: 1866
  polities: [canada]
  governors:
    - { name: エドワード・コーンウォリス, title: 総督, from: 1749, to: 1752, note: ハリファックスを建てる, source: "https://en.wikipedia.org/wiki/Edward_Cornwallis" }
    - { name: チャールズ・ローレンス, title: 総督（1753年から副総督）, from: 1754, to: 1760, note: アカディア人の追放を命じる, source: "https://en.wikipedia.org/wiki/Charles_Lawrence_(British_Army_officer)" }
  periods:
    - from: 1654
      to: 1712
      text: フランスのアカディアは、英仏の争いのたびにイギリスに占領された（1654–70年、1690年、1710年）。1710年にポール・ロワイヤルが落ちてアナポリス・ロイヤルと改められ、1713年のユトレヒト条約でイギリスのものになった。
      source: "https://en.wikipedia.org/wiki/Acadia"
    - from: 1713
      to: 1763
      text: フランス系のカトリックのアカディア人は、イギリス国王への無条件の忠誠を拒み「中立」を守った。フランスがルイブール要塞を築いたのに対抗し、イギリスは1749年にハリファックスを建てた。フレンチ＝インディアン戦争が始まると、1755年から約1万人のアカディア人を追放し（大追放）、一部はルイジアナに移ってケイジャンになった。
      source: "https://ja.wikipedia.org/wiki/アカディア人の追放"
    - from: 1764
      to: 1866
      text: アメリカ独立戦争の後、数万人の王党派が移り住み、1784年にニューブランズウィックとケープブレトン（1820年に再び合わさる）が分かれた。1848年、イギリスの植民地で最初に責任政府が認められた。1867年、カナダ連邦の4つの州の一つになった。
      source: "https://en.wikipedia.org/wiki/Nova_Scotia"
  source:
    - "https://en.wikipedia.org/wiki/History_of_Nova_Scotia"

- id: british_newfoundland
  name: ニューファンドランド植民地
  names:
    - { from: 1934, name: ニューファンドランド（統治委員会）, kind: 本国の任命する委員会の統治 }
  parent: britain
  kind: 植民地（1907年から自治領）
  match:
    labels: [ニューファンドランド, ニューファンドランド（統治委員会）, ラブラドル（ニューファンドランド）, ラブラドル（ニューファンドランド統治委員会）]
  from: 1583
  to: 1948
  polities: [canada]
  periods:
    - from: 1583
      to: 1712
      text: 1497年のジョン・カボットの航海以来、グランドバンクスのタラ漁にヨーロッパ各国の漁船が来た。1583年、ハンフリー・ギルバートがセント・ジョンズでエリザベス1世の領有を宣言した。夏だけの漁場で、定住は本国の漁業商人に嫌われ、南のプラセンティアにはフランスの拠点があった。
      source: "https://en.wikipedia.org/wiki/Newfoundland_Colony"
    - from: 1713
      to: 1854
      text: 1713年のユトレヒト条約で全島がイギリスのものになったが、フランスは島の海岸で漁をする権利（フレンチ・ショア）を残した。干しダラは南ヨーロッパやカリブ海の奴隷の食料として売られた。1824年に正式な植民地になり、1832年に議会が開かれた。
      source: "https://en.wikipedia.org/wiki/Newfoundland_Colony"
    - from: 1855
      to: 1933
      text: 1855年に責任政府を得たが、1867年のカナダ連邦には加わらなかった。1907年に自治領になり（地図ではニューファンドランドの色）、第一次世界大戦ではボーモン＝アメルの戦い（1916年）で連隊が壊滅した。
      source: "https://en.wikipedia.org/wiki/Dominion_of_Newfoundland"
    - from: 1934
      to: 1948
      text: 世界恐慌で財政が破綻し、1934年に自治をやめて本国が任命する統治委員会の統治を受けた。第二次世界大戦ではアメリカ・カナダの基地が置かれた。1948年の住民投票でカナダとの合併が選ばれ、1949年にカナダの10番目の州になった。
      source: "https://en.wikipedia.org/wiki/Newfoundland_Commission_of_Government"
  source:
    - "https://en.wikipedia.org/wiki/Newfoundland_Colony"

