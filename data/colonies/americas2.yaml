    - { name: フロントナック伯, title: 総督, from: 1672, to: 1682, note: 1689–98年にも総督。イギリス植民地とイロコイと戦う, source: "https://en.wikipedia.org/wiki/Louis_de_Buade_de_Frontenac" }
    - { name: フィリップ・ド・リゴー・ド・ヴォードルイユ, title: 総督, from: 1703, to: 1725, source: "https://en.wikipedia.org/wiki/Philippe_de_Rigaud_de_Vaudreuil" }
    - { name: ピエール・ド・リゴー・ド・ヴォードルイユ＝カヴァニャル, title: 最後の総督, from: 1755, to: 1760, note: モントリオールで降伏, source: "https://en.wikipedia.org/wiki/Pierre_de_Rigaud,_Marquis_de_Vaudreuil-Cavagnial" }
  periods:
    - from: 1541
      to: 1607
      text: 1534年からジャック・カルティエがセントローレンス川を探検し、1541年にケベックの近くに入植を試みたが（シャルルブール・ロワイヤル）、寒さと先住民との争いで翌年捨てた。本国はイタリア戦争とユグノー戦争で植民地どころではなく、漁民と毛皮の商人が夏に来るだけだった。1604–05年、アカディア（いまのノヴァスコシア）にポール・ロワイヤルが建てられた。
      source: "https://ja.wikipedia.org/wiki/ヌーベルフランス"
    - from: 1608
      to: 1662
      text: 1608年、シャンプランがケベックを建て、ヒューロン族などと同盟して毛皮の交易を始めた。同盟のためにイロコイ連邦と敵対し、イロコイは1649年にヒューロンを滅ぼした。宰相リシュリューのつくった百人会社が経営したが、入植者は少なく、イエズス会の宣教師が布教に入った。モントリオールは1642年に建てられた。
      source: "https://en.wikipedia.org/wiki/New_France"
    - from: 1663
      to: 1712
      text: 1663年、ルイ14世と財務総監コルベールは会社から取り上げて国王の植民地とし、軍を送ってイロコイを抑えた。地方長官タロンは移民と産業を勧め、領主制（セニョリー）の農村が広がった。毛皮商人と宣教師は五大湖からミシシッピ川へ進んだ。英仏の植民地戦争（ウィリアム王戦争・アン女王戦争）が続き、1713年のユトレヒト条約でアカディアとハドソン湾・ニューファンドランドをイギリスに渡した。
      source: "https://ja.wikipedia.org/wiki/ユトレヒト条約"
    - from: 1713
      to: 1753
      text: フランスはケープブレトン島（イル・ロワイヤル）にルイブール要塞を築いて、セントローレンス川の入り口を守った。人口は約6万人で、150万人を超えるイギリスの13植民地との差は開くばかりだった。オハイオ川の流域に砦を並べ、カナダとルイジアナをつなごうとした。
      source: "https://en.wikipedia.org/wiki/Fortress_of_Louisbourg"
    - from: 1754
      to: 1762
      text: オハイオ川の分かれ目（デュケーヌ砦）をめぐる衝突からフレンチ＝インディアン戦争が始まった。イギリスはアカディア人を追放し（1755年）、ピットの戦争指導のもとで大軍を送って、ルイブール（1758年）、ケベック（1759年）、モントリオール（1760年）を落とした。1763年のパリ条約でカナダはイギリスのものになった。
      source: "https://ja.wikipedia.org/wiki/フレンチ・インディアン戦争"
  source:
