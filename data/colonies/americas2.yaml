- id: nueva_granada
  name: ヌエバ・グラナダ副王領
  names:
    - { to: 1541, name: ヌエバ・グラナダ（征服地）, kind: 征服地（総督領） }
  parent: spain
  kind: 副王領（首府サンタフェ・デ・ボゴタ）
  # 1542–1716 と 1723–38 は地図の副ラベルが「（ペルー副王領）」で、ペルー副王領（americas.yaml）に入る
  match:
    contains: [ヌエバ・グラナダ副王領]
    labels: [ヌエバ・グラナダ, カルタヘナ, サンタ・マルタ, ポパヤン（ベナルカサルの総督領）, ヌエバ・グラナダ（諸都市の評議会）, カルタヘナ（評議会）, キト（評議会）]
  from: 1525
  to: 1821
  polities: [colombia, ecuador, new_granada_united, gran_colombia, muisca]
  governors:
    - { name: ゴンサロ・ヒメネス・デ・ケサーダ, title: 征服者, from: 1536, to: 1539, note: ムイスカの地を征服し、サンタフェ・デ・ボゴタを建設（1538年）, source: "https://en.wikipedia.org/wiki/Gonzalo_Jiménez_de_Quesada" }
    - { name: ホルヘ・デ・ビジャロンガ, title: 初代副王, from: 1719, to: 1724, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Granada" }
    - { name: セバスティアン・デ・エスラバ, title: 副王, from: 1740, to: 1749, note: イギリスのヴァーノン提督のカルタヘナ攻撃（1741年）を退ける, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Granada" }
    - { name: ペドロ・メシア・デ・ラ・セルダ, title: 副王, from: 1761, to: 1772, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Granada" }
    - { name: マヌエル・アントニオ・フロレス, title: 副王, from: 1776, to: 1782, note: コムネロスの反乱（1781年）のときの副王, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Granada" }
    - { name: アントニオ・カバジェロ・イ・ゴンゴラ, title: 副王（ボゴタ大司教）, from: 1782, to: 1789, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Granada" }
    - { name: アントニオ・アマル・イ・ボルボン, title: 副王, from: 1803, to: 1810, note: 1810年7月20日、ボゴタの評議会に退けられる, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Granada" }
    - { name: フアン・デ・サマノ, title: 副王, from: 1818, to: 1819, note: ボヤカの戦いの後、ボゴタから逃れる, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Granada" }
  periods:
    - from: 1525
      to: 1541
      text: カリブ海岸にサンタ・マルタ（1525年）とカルタヘナ（1533年）が建てられ、ここから内陸へ征服が進んだ。1536年に出発したケサーダはマグダレナ川をさかのぼってムイスカの地を征服し、1538年にサンタフェ・デ・ボゴタを建てた。南からはペルーを征服したピサロの部下ベナルカサルがポパヤンに入った。
      source: "https://ja.wikipedia.org/wiki/ヌエバ・グラナダ副王領"
    - from: 1542
      to: 1716
      text: 1549年にサンタフェ・デ・ボゴタに聴訴院（アウディエンシア）が置かれたが、全体はペルー副王の下に属した（地図ではこの時期はペルー副王領として選ばれる）。アンデスの金と、カリブ海の港カルタヘナが要で、カルタヘナはアフリカの黒人奴隷の大きな陸揚げ港であり、イギリス・フランスの海賊にたびたび襲われた。
      source: "https://en.wikipedia.org/wiki/New_Kingdom_of_Granada"
    - from: 1717
      to: 1738
      text: スペイン継承戦争で本国の王家がブルボン朝に替わると、本国は広すぎるペルー副王領を分け、1717年にボゴタを首府とするヌエバ・グラナダ副王領を置いた。密貿易を抑えカリブ海の守りを固めるのがねらいだったが、財政が続かず1723年にいったん廃止された。
      source: "https://en.wikipedia.org/wiki/Viceroyalty_of_New_Granada"
    - from: 1739
      to: 1780
      text: 1739年に副王領が再び置かれ、いまのコロンビア・エクアドル・パナマ・ベネズエラ（1777年に総監領として分かれる）を治めた。同じ年にイギリスとのジェンキンスの耳の戦争が始まり、1741年にはヴァーノン提督の大艦隊がカルタヘナを攻めたが、副王エスラバが守り抜いた。
      source: "https://en.wikipedia.org/wiki/Battle_of_Cartagena_de_Indias"
    - from: 1781
      to: 1809
      text: ブルボン改革の増税と専売に反発し、1781年にソコロでコムネロスの反乱が起き、数万人がボゴタに迫った。副王側はいったん要求を認めて反乱を解いた。啓蒙思想も入り、植物学者ムティスの探検や、人権宣言を訳したナリーニョの逮捕（1794年）があった。クリオーリョは本国生まれの役人の独占に不満を強めた。
      source: "https://en.wikipedia.org/wiki/Revolt_of_the_Comuneros_(New_Granada)"
    - from: 1810
      to: 1821
      text: ナポレオンの本国侵攻で王権が揺らぐと、1810年にカルタヘナ・ボゴタなどの都市が評議会をつくって副王を退けた。しかし中央集権派と連邦派が争う「愚かな祖国」の時期に、1815–16年、本国から来たモリーリョの遠征軍が再征服した。1819年、ボリバルがボヤカの戦いで勝ってボゴタに入り、大コロンビアが生まれた。
      source: "https://ja.wikipedia.org/wiki/コロンビア独立戦争"
  source:
    - "https://ja.wikipedia.org/wiki/ヌエバ・グラナダ副王領"
    - "https://en.wikipedia.org/wiki/Viceroyalty_of_New_Granada"

- id: venezuela_captaincy
  name: ベネズエラ総監領
  names:
    - { to: 1776, name: ベネズエラ州など（ベネズエラの諸州）, kind: 州（総督領）。サント・ドミンゴやボゴタの聴訴院の下 }
  parent: spain
  kind: 総監領（首府カラカス。1777年に諸州をまとめる）
  match:
    labels: [ベネズエラ州, ベネズエラ州（ヴェルザー家）, ベネズエラ総監領, ベネズエラ（カラカスの評議会）, マルガリータ州, ヌエバ・アンダルシア州（クマナ）, マラカイボ州（ヌエバ・グラナダ）, ギアナ州, メリダ（ヌエバ・グラナダ）, クマナ, クバグア（真珠海岸）]
  from: 1516
  to: 1821
  polities: [venezuela, gran_colombia]
  governors:
    - { name: アンブロジウス・エーインガー, title: ヴェルザー家の総督, from: 1529, to: 1533, source: "https://en.wikipedia.org/wiki/Klein-Venedig" }
    - { name: ルイス・デ・ウンサガ, title: 初代総監, from: 1777, to: 1782, source: "https://en.wikipedia.org/wiki/Captaincy_General_of_Venezuela" }
    - { name: ビセンテ・エンパラン, title: 総監, from: 1809, to: 1810, note: 1810年4月19日、カラカスの評議会に退けられる, source: "https://en.wikipedia.org/wiki/Vicente_Emparan" }
    - { name: ドミンゴ・デ・モンテベルデ, title: 総監（王党派の司令官）, from: 1812, to: 1813, note: 第一共和国を倒し、ミランダを捕らえる, source: "https://en.wikipedia.org/wiki/Domingo_de_Monteverde" }
    - { name: パブロ・モリーリョ, title: 遠征軍の司令官, from: 1815, to: 1820, source: "https://en.wikipedia.org/wiki/Pablo_Morillo" }
  periods:
    - from: 1516
      to: 1545
      text: 1500年代初め、マルガリータ島沖のクバグア島で真珠が採られ、先住民が潜水させられた。1528年、借金の返済にあてるため、国王カルロス1世（カール5世）はアウクスブルクの大商人ヴェルザー家にベネズエラの植民を任せた。ヴェルザー家の総督は黄金郷（エル・ドラド）を求めて奥地を荒らし、1546年に権利を取り上げられた。
      source: "https://en.wikipedia.org/wiki/Klein-Venedig"
    - from: 1546
      to: 1727
      text: 1567年にカラカスが建てられ、海岸のベネズエラ州のほか、マルガリータ・クマナ（ヌエバ・アンダルシア）・マラカイボ・ギアナの州がばらばらに、サント・ドミンゴやボゴタの聴訴院の下に置かれた。金銀は乏しく、黒人奴隷を使うカカオの農園が育ったが、カカオの多くはオランダ領キュラソーとの密貿易で流れた。
      source: "https://en.wikipedia.org/wiki/Province_of_Venezuela"
    - from: 1728
      to: 1776
      text: 1728年、本国はバスク人のギプスコア会社（カラカス会社）にカカオの貿易を独占させ、密貿易を締めつけた。会社への反発から、1749年にフアン・フランシスコ・デ・レオンの反乱が起きた。カカオの輸出は伸び、それを握る大農園主（マントゥアーノ）がカラカスの有力者になった。
      source: "https://en.wikipedia.org/wiki/Guipuzcoan_Company_of_Caracas"
    - from: 1777
      to: 1809
      text: ブルボン改革のなかで、1777年にベネズエラの諸州が一つの総監領にまとめられ、1786年にはカラカスに聴訴院ができて、いまのベネズエラの枠組みが生まれた。1797年のグアルとエスパーニャの陰謀、1806年のミランダの上陸作戦と、独立をめざす動きが始まる。
      source: "https://en.wikipedia.org/wiki/Captaincy_General_of_Venezuela"
    - from: 1810
      to: 1821
      text: 1810年4月19日、カラカスの評議会が総監を退け、1811年7月5日に独立を宣言した（第一共和国）。地震（1812年）と王党派の反撃で共和国は倒れ、ボリバルの第二共和国もボベスの率いるリャノの騎兵に敗れた。1815年に本国からモリーリョの軍が来たが、ボリバルはオリノコ川流域から盛り返し、1821年のカラボボの戦いで勝敗を決めた。
      source: "https://ja.wikipedia.org/wiki/ベネズエラ独立戦争"
  source:
    - "https://en.wikipedia.org/wiki/Captaincy_General_of_Venezuela"

