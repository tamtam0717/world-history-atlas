    - { name: ジョージ・シンプソン, title: ルパートランドの総督（会社の現地の長）, from: 1821, to: 1860, source: "https://en.wikipedia.org/wiki/George_Simpson_(HBC_administrator)" }
  periods:
    - from: 1670
      to: 1712
      text: 1670年、チャールズ2世は、ハドソン湾に流れ込む川の流域すべての土地と交易の独占を、ハドソン湾会社に与えた。会社は湾の岸に砦をつくり、クリーなどの先住民がビーバーの毛皮を運んでくるのを待った。ヌーヴェル・フランスはこれを攻め、湾の砦を奪い合った（1686–1713年）。
      source: "https://ja.wikipedia.org/wiki/ハドソン湾会社"
    - from: 1713
      to: 1820
      text: 1713年のユトレヒト条約で、フランスは湾を正式にイギリスに認めた。1763年にフランスがカナダから去ると、モントリオールのスコットランド系商人が北西会社をつくって西へ進み、会社と激しく争った。1812年、セルカーク伯が会社の土地にスコットランド人のレッド・リヴァー植民地を開き、北西会社とメティ（先住民とヨーロッパ人の混血の人々）と衝突した。
      source: "https://en.wikipedia.org/wiki/Red_River_Colony"
    - from: 1821
      to: 1869
      text: 1821年、ハドソン湾会社は北西会社を吸収し、北アメリカの北半分の毛皮交易を独占した。毛皮の流行が終わり、入植の時代になると、1869年に会社は領地をカナダ自治領に売り渡した。それを知らされなかったレッド・リヴァーのメティは、リエルのもとで抵抗した（レッド・リヴァーの反乱）。
      source: "https://en.wikipedia.org/wiki/Rupert's_Land"
  source:
    - "https://en.wikipedia.org/wiki/Rupert's_Land"

