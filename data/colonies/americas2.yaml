  from: 1667
  to: 1974
  polities: [suriname]
  governors:
    - { name: コルネリス・ファン・アールセン・ファン・ソメルスデイク, title: 総督, from: 1683, to: 1688, note: 兵士の反乱で殺される, source: "https://en.wikipedia.org/wiki/Cornelis_van_Aerssen_van_Sommelsdijck" }
  periods:
    - from: 1667
      to: 1759
      text: イギリスの砂糖植民地だったスリナムを、第二次英蘭戦争中にゼーラント州の艦隊が奪い、1667年のブレダの和約でニューネーデルラントと引き換えにオランダのものになった。砂糖・コーヒーの農園で黒人奴隷が働かされ、その扱いは特に過酷だった。森へ逃げた奴隷はマルーンとして自分たちの村をつくり、農園を襲った。
      source: "https://en.wikipedia.org/wiki/Surinam_(Dutch_colony)"
    - from: 1760
      to: 1862
      text: 植民地政府はマルーンを討ちきれず、1760年代にンジュカ・サラマカなどのマルーンと条約を結んで自治を認めた。フランス革命戦争・ナポレオン戦争の間はイギリスに占領され（1799–1802年・1804–16年）、戦後に返された。
      source: "https://en.wikipedia.org/wiki/Maroons#Suriname"
    - from: 1863
      to: 1953
      text: 1863年、イギリスやフランスより遅れて奴隷制が廃止された（10年間の国の監督つき）。農園の働き手として、英領インドから、のち蘭領東インドのジャワから年季契約の労働者が来て、多民族の社会ができた。20世紀にはボーキサイトの採掘が始まった。
      source: "https://en.wikipedia.org/wiki/History_of_Suriname"
    - from: 1954
      to: 1974
      text: インドネシアの独立の後、1954年の王国憲章で、スリナムはオランダ本国・アンティルと対等な王国の構成国になり、自治を得た。1975年に独立したが、その前後に多くの住民がオランダ本国へ移った。
      source: "https://ja.wikipedia.org/wiki/スリナム"
  source:
    - "https://en.wikipedia.org/wiki/Surinam_(Dutch_colony)"

# ---------------- ロシア・デンマーク・スウェーデン ----------------

- id: russian_america
