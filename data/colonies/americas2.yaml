  match:
    labels: [ニューイングランド, プリマス植民地, マサチューセッツ湾植民地, マサチューセッツ湾植民地（メイン）, マサチューセッツ植民地, マサチューセッツ植民地（メイン地区）, マサチューセッツ植民地（フランスとの係争地）, セイラム（ニューイングランド会社）, ペノブスコットの交易所（プリマス植民地）]
  from: 1620
  to: 1775
  polities: [usa]
  governors:
