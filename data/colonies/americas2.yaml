  from: 1681
  to: 1777
  polities: [usa]
  governors:
    - { name: ウィリアム・ペン, title: 領主, from: 1681, to: 1718, note: クエーカー教徒。国王が父への借りを返すために土地を与えた, source: "https://ja.wikipedia.org/wiki/ウィリアム・ペン" }
    - { name: ジョン・ペン, title: 副総督（ペン家の孫）, from: 1773, to: 1776, note: 1763–71年にも副総督, source: "https://en.wikipedia.org/wiki/John_Penn_(governor)" }
  periods:
    - from: 1681
      to: 1720
      text: 1681年、チャールズ2世がクエーカー教徒のウィリアム・ペンに広い土地を与えた。ペンは信教の自由を約束する「聖なる実験」を掲げてフィラデルフィア（兄弟愛の町）を建て、先住民レナペと条約を結んで土地を買った。本国で迫害されたクエーカーのほか、ドイツ・オランダの宗派の人々も移り住んだ。
      source: "https://en.wikipedia.org/wiki/Province_of_Pennsylvania"
    - from: 1721
      to: 1763
      text: 小麦や小麦粉を西インド諸島へ輸出して豊かになり、フィラデルフィアは北アメリカの植民地で最大の都市の一つになった。ドイツ系（ペンシルヴェニア・ダッチ）やスコットランド系アイルランド人が奥地を開いた。フランクリンが図書館・大学・新聞を興した。一方、オハイオ川の分かれ目（いまのピッツバーグ）をめぐりフランスと争い、フレンチ＝インディアン戦争の始まりの地になった。
      source: "https://ja.wikipedia.org/wiki/ベンジャミン・フランクリン"
    - from: 1764
      to: 1777
      text: 本国の課税に反対する運動が広がり、1774年の第1回大陸会議、1775年の第2回大陸会議がフィラデルフィアで開かれ、1776年7月4日、独立宣言がここで採択された。1777年から翌年まで、イギリス軍がフィラデルフィアを占領した。
      source: "https://ja.wikipedia.org/wiki/アメリカ独立宣言"
  source:
    - "https://en.wikipedia.org/wiki/Province_of_Pennsylvania"

- id: province_of_carolina
  name: サウスカロライナ植民地
