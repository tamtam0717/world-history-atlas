    - { name: シデナム男爵, title: 連合植民地の初代総督, from: 1839, to: 1841, source: "https://en.wikipedia.org/wiki/Charles_Poulett_Thomson,_1st_Baron_Sydenham" }
    - { name: エルギン伯, title: 総督, from: 1847, to: 1854, note: 責任政府を認め、アメリカと互恵条約（1854年）を結ぶ, source: "https://en.wikipedia.org/wiki/James_Bruce,_8th_Earl_of_Elgin" }
  periods:
    - from: 1759
      to: 1773
      text: 七年戦争（フレンチ＝インディアン戦争）で、イギリス軍は1759年にケベック（アブラハム平原の戦い）、1760年にモントリオールを落とし、1763年のパリ条約でフランスはカナダを手放した。イギリスは約7万人のフランス系カトリック住民を抱えることになり、国王宣言（1763年）でケベック植民地を置き、西の土地を先住民の保留地とした。
      source: "https://en.wikipedia.org/wiki/Province_of_Quebec_(1763–1791)"
    - from: 1774
      to: 1790
      text: 1774年のケベック法で、カトリックの信仰とフランス式の民法を認めて住民をつなぎとめ、植民地の範囲をオハイオ川まで広げた。南の13植民地はこれを「耐えがたき諸法」の一つとして怒った。独立戦争では大陸軍がケベックに攻め込んだが敗れ、戦後は数万人の王党派（ロイヤリスト）が北へ逃れてきた。
      source: "https://ja.wikipedia.org/wiki/ケベック法"
    - from: 1791
      to: 1837
      text: 1791年の立憲法で、英語を話す王党派の多い西のアッパー・カナダ（いまのオンタリオ）と、フランス系の東のローワー・カナダ（いまのケベック）に分け、それぞれに議会を置いた。1812年からの米英戦争では、アメリカ軍の侵攻をイギリス軍・民兵・先住民（テカムセ）で退けた。
      source: "https://ja.wikipedia.org/wiki/1791年立憲法"
    - from: 1838
      to: 1848
      text: 総督と少数の有力者が政治を握ることに不満がたまり、1837–38年、パピノー（ローワー）とマッケンジー（アッパー）の反乱が起きた。鎮圧の後、ダラム伯は報告で、責任政府と、フランス系を英語の社会に同化させるための統合を勧めた。1841年に2つが合わさってカナダ連合植民地になり、1848年に議会の多数派が内閣をつくる責任政府が認められた。
      source: "https://en.wikipedia.org/wiki/Durham_Report"
    - from: 1849
      to: 1866
      text: 本国が自由貿易に移ると、カナダはアメリカとの互恵条約（1854年）で市場を求め、鉄道を敷いた。英語系とフランス系の対立で政治が行き詰まり、アメリカの南北戦争後の脅威もあって、1864年のシャーロットタウン会議・ケベック会議で植民地の連邦が話し合われた。1867年、英領北アメリカ法でカナダ連邦（自治領）が生まれた。
      source: "https://ja.wikipedia.org/wiki/カナダ連邦結成"
  source:
    - "https://en.wikipedia.org/wiki/Province_of_Quebec_(1763–1791)"
    - "https://en.wikipedia.org/wiki/Province_of_Canada"

