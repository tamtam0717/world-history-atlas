  periods:
    - from: 1627
      to: 1659
      text: 1627年に無人の島に入植が始まり、初めはタバコと綿を作った。1640年代、オランダ領ブラジルから技術を学んでサトウキビを作り始めると、島は小さな土地に大農園が並ぶ「砂糖革命」の舞台になり、働き手は白人の年季奉公人からアフリカの奴隷へ替わった。本国のピューリタン革命では王党派が島を握り、1652年に議会派の艦隊に降った。
      source: "https://en.wikipedia.org/wiki/Sugar_Revolution"
    - from: 1660
      to: 1833
      text: 17世紀後半、バルバドスはイギリスの植民地で最も豊かになり、奴隷を使うその農園のしくみ（奴隷法典、1661年）はジャマイカやカロライナに広まった。土地が足りなくなった農園主たちは他の島や大陸へ移っていった。1816年、奴隷のブッサの反乱が起きた。
      source: "https://en.wikipedia.org/wiki/History_of_Barbados"
    - from: 1834
      to: 1957
      text: 1834年に奴隷制が廃止されたが、土地の空いていない島では解放された人々も農園で働き続けるしかなかった。古い植民地議会は白人の農園主が握り続けた。1937年の暴動をきっかけに、グラントリー・アダムズらが労働組合と政党をつくり、1951年に普通選挙が認められた。
      source: "https://en.wikipedia.org/wiki/History_of_Barbados"
    - from: 1958
      to: 1966
      text: 1958年に西インド連邦に加わり、アダムズがその首相になったが、ジャマイカ・トリニダードが抜けて連邦は1962年に解散した。バルバドスは1966年に独立した。
      source: "https://ja.wikipedia.org/wiki/西インド連邦"
  source:
    - "https://en.wikipedia.org/wiki/History_of_Barbados"

