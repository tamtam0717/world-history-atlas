      text: 1862年に正式に植民地（英領ホンジュラス）になり、1871年に直轄植民地になった。木材の輸出が衰えると貧しい植民地のままで、1950年代にプライスの人民統一党が独立を求める運動を起こした。
      source: "https://en.wikipedia.org/wiki/British_Honduras"
    - from: 1973
      to: 1981
      text: 1973年に名をベリーズに改めた。グアテマラが侵攻を口にしたため独立が遅れたが、国連の支持を得て1981年に独立し、イギリス軍がしばらく駐留した。
      source: "https://ja.wikipedia.org/wiki/ベリーズ"
  source:
