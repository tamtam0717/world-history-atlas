  periods:
    - from: 1682
      to: 1716
      text: 1682年、ラ・サールがミシシッピ川を河口まで下り、流域全体を国王ルイ14世の名にちなんでルイジアナと名づけた。1699年、ディベルヴィルがメキシコ湾岸のビロクシに砦を建て、のちモービルを拠点にした。カナダから五大湖・ミシシッピ川を通ってメキシコ湾に至る線で、イギリスの植民地を海岸に閉じ込めるねらいだった。
      source: "https://ja.wikipedia.org/wiki/ルイジアナ_(ヌーベルフランス)"
    - from: 1717
      to: 1731
      text: 摂政時代の本国で、財政家ジョン・ローのミシシッピ会社が開発を任され、1718年にニューオーリンズが建てられた。会社の株は熱狂的に買われたが、1720年に暴落した（ミシシッピ・バブル）。アフリカから奴隷が運ばれ、黒人法典（1724年）が定められた。1729年、ナチェズ族が蜂起して砦の入植者を殺し、フランスはナチェズを滅ぼした。
      source: "https://en.wikipedia.org/wiki/Mississippi_Company"
    - from: 1732
      to: 1762
      text: 国王の植民地に戻ったが、入植者は少なく、本国にとって負担の多い植民地だった。チカソー族とは戦い、チョクトー族とは同盟した。七年戦争に負けると、1762年のフォンテーヌブロー条約でミシシッピ川の西とニューオーリンズをスペインに、1763年のパリ条約で川の東をイギリスに渡した。
      source: "https://en.wikipedia.org/wiki/Louisiana_(New_France)"
  source:
    - "https://ja.wikipedia.org/wiki/ルイジアナ_(ヌーベルフランス)"
    - "https://en.wikipedia.org/wiki/Louisiana_(New_France)"

