    - { name: ビセンテ・マヌエル・デ・セスペデス, title: 東フロリダ総督, from: 1784, to: 1790, source: "https://en.wikipedia.org/wiki/Vicente_Manuel_de_Céspedes" }
    - { name: ホセ・コッピンジャー, title: 最後の東フロリダ総督, from: 1816, to: 1821, source: "https://en.wikipedia.org/wiki/José_María_Coppinger" }
  periods:
    - from: 1565
      to: 1680
      text: 1565年、本国はメキシコの銀を運ぶ船団の航路（フロリダ海峡）を守るため、セント・オーガスティンを建て、近くにあったフランスのユグノーの植民地を滅ぼした。北のサンタ・エレナ（いまのサウスカロライナ）が最初の首府だったが1587年に捨てられた。フランシスコ会の布教村が、ティムクア・グアレ・アパラチーの村々に広がった。
      source: "https://en.wikipedia.org/wiki/Spanish_Florida"
    - from: 1681
      to: 1763
      text: 北にイギリスのカロライナ植民地（1670年）ができると、イギリス人と組んだ先住民が奴隷狩りで布教村を襲い、1704年ごろまでに布教村はほとんど壊された。スペインは逃げてきた奴隷に自由を約束し、黒人の町モーセ砦（1738年）をつくった。七年戦争で負けたスペインは、1763年のパリ条約でフロリダをイギリスに渡した（キューバのハバナを返してもらう代わり）。
      source: "https://en.wikipedia.org/wiki/Fort_Mose_Historic_State_Park"
    - from: 1779
      to: 1782
      text: 1763–83年はイギリス領（東フロリダ・西フロリダ）。アメリカ独立戦争にスペインがフランスの側で加わると（1779年）、ルイジアナ総督ガルベスがバトンルージュ・モービル（1780年）・ペンサコーラ（1781年）を落とし、西フロリダを占領した。
      source: "https://en.wikipedia.org/wiki/Siege_of_Pensacola"
    - from: 1783
      to: 1821
      text: 1783年のパリ条約でフロリダはスペインに戻ったが、アメリカ合衆国の入植者が押し寄せた。西フロリダの一部は1810年の反乱の後、合衆国に併合された。逃亡奴隷をかくまうセミノールを攻めて、ジャクソン将軍が1818年に侵攻し（第一次セミノール戦争）、守りきれないと見たスペインは1819年のアダムズ＝オニス条約でフロリダを売り渡した（1821年に引き渡し）。
      source: "https://ja.wikipedia.org/wiki/アダムズ＝オニス条約"
  source:
    - "https://en.wikipedia.org/wiki/Spanish_Florida"

- id: spanish_louisiana
  name: スペイン領ルイジアナ
  parent: spain
  kind: 植民地（総督領。キューバ総監の下）
  match:
    labels: [ルイジアナ（スペイン領）]
  from: 1763
  to: 1802
  polities: [usa]
  governors:
