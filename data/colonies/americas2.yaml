    - from: 1697
      to: 1788
      text: 砂糖とコーヒーのプランテーションが広がり、18世紀後半には世界の砂糖の約4割・コーヒーの半分を産する、世界で最も富んだ植民地になった（「アンティル諸島の真珠」）。50万人の奴隷は白人の10倍以上で、過酷な労働で死ぬ数を補うためにアフリカから運ばれ続けた。自由な有色人（ムラート）も多く、財産を持つ者もいたが差別された。
      source: "https://en.wikipedia.org/wiki/Saint-Domingue"
    - from: 1789
      to: 1801
      text: フランス革命が人権宣言を出すと、有色人が平等を求め、1791年8月、北部の奴隷が一斉に蜂起した（ハイチ革命）。1793年、本国の委員ソントナが奴隷を解放し、国民公会は1794年に奴隷制を廃止した。元奴隷のトゥサン・ルヴェルチュールは、攻め込んだイギリス軍・スペイン軍を退け、植民地の実権を握った。
      source: "https://ja.wikipedia.org/wiki/ハイチ革命"
    - from: 1802
      to: 1803
      text: 1801年、トゥサンは島全体を治める憲法をつくり、終身の総督になった。ナポレオンは奴隷制を戻そうと義弟ルクレールの大軍を送り、トゥサンを捕らえてフランスで獄死させたが、遠征軍は黄熱病と黒人の抵抗で崩れた。1803年に降伏し、1804年1月、デサリーヌがハイチの独立を宣言した。ナポレオンはこの失敗もあってルイジアナを売った。
      source: "https://ja.wikipedia.org/wiki/ハイチ革命"
    - from: 1804
      to: 1808
      text: 島の東部（もとスペイン領のサント・ドミンゴ。1795年にフランス領）にはフランス軍が残った。1808年、本国のスペイン侵攻に反発した住民が蜂起し、翌年フランス軍は退いた。
      source: "https://en.wikipedia.org/wiki/Battle_of_Palo_Hincado"
