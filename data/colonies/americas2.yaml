  governors:
    - { name: ミゲル・ロペス・デ・レガスピ, title: 初代総督, from: 1565, to: 1572, note: セブに上陸し、1571年にマニラを建てる, source: "https://ja.wikipedia.org/wiki/ミゲル・ロペス・デ・レガスピ" }
    - { name: セバスティアン・ウルタド・デ・コルクエラ, title: 総督, from: 1635, to: 1644, note: ミンダナオ・スールーのイスラーム勢力を攻める, source: "https://en.wikipedia.org/wiki/Sebastián_Hurtado_de_Corcuera" }
    - { name: シモン・デ・アンダ, title: 総督, from: 1770, to: 1776, note: イギリスのマニラ占領（1762–64年）のとき、地方で抵抗を続けた, source: "https://en.wikipedia.org/wiki/Simón_de_Anda_y_Salazar" }
    - { name: ホセ・バスコ・イ・バルガス, title: 総督, from: 1778, to: 1787, note: タバコの専売を始める, source: "https://en.wikipedia.org/wiki/José_Basco_y_Vargas" }
    - { name: ナルシソ・クラベリア, title: 総督, from: 1844, to: 1849, note: フィリピン人にスペイン式の姓を付けさせる, source: "https://en.wikipedia.org/wiki/Narciso_Clavería_y_Zaldúa" }
    - { name: カミロ・デ・ポラビエハ, title: 総督, from: 1896, to: 1897, note: ホセ・リサールを処刑, source: "https://en.wikipedia.org/wiki/Camilo_García_de_Polavieja" }
    - { name: フェルナンド・プリモ・デ・リベラ, title: 総督, from: 1897, to: 1898, note: アギナルドとビアク・ナ・バトの協定を結ぶ, source: "https://en.wikipedia.org/wiki/Fernando_Primo_de_Rivera" }
  periods:
    - from: 1565
      to: 1600
      text: 1565年、メキシコから来たレガスピがセブに上陸し、1571年にマニラを建てた。島々の名は皇太子フェリペ（フェリペ2世）にちなむ。マニラとアカプルコを結ぶガレオン貿易で、メキシコの銀と中国の絹・陶磁器が交換され、マニラには福建の商人（サングレー）が集まった。
      source: "https://ja.wikipedia.org/wiki/スペイン領東インド"
    - from: 1601
      to: 1761
      text: 植民地の統治は修道会に頼り、修道士が村々でカトリックを広めた（フィリピンはアジアで数少ないキリスト教国になる）。南のミンダナオ・スールーのイスラーム教徒（モロ）とは長く戦い続けた。華人は反乱と虐殺（1603年・1639年）を繰り返し経験した。オランダ艦隊の攻撃（1646年など）も退けた。
      source: "https://en.wikipedia.org/wiki/Spanish_East_Indies"
    - from: 1762
      to: 1814
      text: 七年戦争でイギリスがマニラを占領した（1762–64年）。シモン・デ・アンダが地方で抵抗を続け、各地で反乱も起きた。返還後、本国はタバコの専売（1782年）や王立フィリピン会社（1785年）で植民地を稼げるものにしようとした。1815年、最後のガレオン船がアカプルコから帰り、ガレオン貿易は終わった。
      source: "https://en.wikipedia.org/wiki/British_occupation_of_Manila"
    - from: 1815
      to: 1871
      text: メキシコの独立（1821年）で、フィリピンは本国が直接治めるようになった。1834年にマニラが外国の船に開かれ、サトウキビ・マニラ麻・タバコの輸出が伸びて、地主の混血（メスティーソ）の中から教育を受けた人々（イルストラード）が育った。1869年のスエズ運河の開通で、本国との行き来も速くなった。
      source: "https://en.wikipedia.org/wiki/Philippines_under_Spanish_rule"
    - from: 1872
      to: 1898
      text: 1872年のカビテの反乱の後、フィリピン人の神父3人が処刑され、改革を求める運動（プロパガンダ運動）が始まった。ホセ・リサールは小説『ノリ・メ・タンヘレ』で修道士の支配を描いた。1892年、ボニファシオが秘密結社カティプナンをつくり、1896年に独立の戦い（フィリピン革命）を始めた。リサールは処刑され、1898年の米西戦争でアメリカに渡された。
      source: "https://ja.wikipedia.org/wiki/フィリピン革命"
  source:
    - "https://ja.wikipedia.org/wiki/スペイン領東インド"
    - "https://en.wikipedia.org/wiki/Spanish_East_Indies"

- id: spanish_florida
  name: スペイン領フロリダ
  names:
    - { to: 1763, name: ラ・フロリダ }
