  periods:
    - from: 1630
      to: 1636
      text: スペインと独立戦争（八十年戦争）を戦うオランダは、スペイン王が王を兼ねていたポルトガルの植民地を狙い、1621年に西インド会社をつくった。1630年、会社はブラジルの砂糖の中心ペルナンブーコを攻めてオリンダとレシフェを奪った。
      source: "https://en.wikipedia.org/wiki/Dutch_Brazil"
    - from: 1637
      to: 1644
      text: 総督ヨハン・マウリッツのもとで、レシフェ（マウリッツスタット）が整えられ、ポルトガル人の農園主とも折り合い、ユダヤ教徒にも信仰の自由を認めた。砂糖農園の働き手を得るため、アフリカのポルトガルの拠点（エルミナ・ルアンダ）も奪って奴隷貿易を始めた。
      source: "https://en.wikipedia.org/wiki/John_Maurice,_Prince_of_Nassau-Siegen"
    - from: 1645
      to: 1654
      text: 1640年にポルトガルがスペインから独立を回復すると、1645年、借金に苦しむポルトガル人の農園主が反乱を起こし、グアララペスの戦い（1648・49年）でオランダ軍を破った。本国は第一次英蘭戦争（1652年）で手が回らず、1654年にレシフェが落ちた。追われたユダヤ教徒の一部はニューアムステルダムへ、砂糖の技術はカリブ海の島々へ広がった。
      source: "https://en.wikipedia.org/wiki/Battles_of_Guararapes"
  source:
    - "https://en.wikipedia.org/wiki/Dutch_Brazil"

