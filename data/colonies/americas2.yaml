      to: 1762
      text: 1643年からフランス人がカイエンヌに入植を試み、オランダとも取り合ったが、1664年からフランスのものになった。湿った熱帯の土地で病気が多く、入植者は増えず、黒人奴隷を使う砂糖・藍・ロクー（染料）の小さな農園の植民地だった。
      source: "https://en.wikipedia.org/wiki/History_of_French_Guiana"
    - from: 1763
      to: 1851
      text: カナダを失ったフランスは、1763–65年にギアナに1万人以上を送る入植計画（クールー遠征）を行ったが、ほとんどが熱病で死んだ。フランス革命では政敵の流刑地にされた。ナポレオン戦争中の1809–17年はポルトガル（ブラジル）軍に占領された。1848年に奴隷制が廃止された。
      source: "https://en.wikipedia.org/wiki/Kourou_expedition"
    - from: 1852
      to: 1945
      text: ナポレオン3世は1852年からギアナに流刑地を置き、悪魔島などに囚人を送った（ドレフュスも流された）。内陸では金が見つかり（1855年）、ブラジルとの国境は1900年の仲裁で決まった。流刑地は1938年に新しい囚人を受け入れなくなり、1946年、ギアナは本国の海外県になった。
      source: "https://ja.wikipedia.org/wiki/悪魔島"
  source:
