  from: 1784
  to: 1866
  polities: [usa]
  governors:
    - { name: アレクサンドル・バラノフ, title: 露米会社の支配人（初代）, from: 1790, to: 1818, note: シトカ（ノヴォアルハンゲリスク）を拠点にする, source: "https://en.wikipedia.org/wiki/Alexander_Andreyevich_Baranov" }
    - { name: フェルディナント・フォン・ヴランゲリ, title: 支配人, from: 1830, to: 1835, source: "https://en.wikipedia.org/wiki/Ferdinand_von_Wrangel" }
  periods:
    - from: 1784
      to: 1798
      text: 1741年、ロシア政府に仕えるベーリングの探検でアラスカが見つかり、シベリアの毛皮商人がラッコの毛皮を求めてアリューシャン列島に来た。アレウトの人々は毛皮の狩りを強いられた。1784年、商人シェリホフがコディアク島に最初の常設の拠点を置いた。
      source: "https://en.wikipedia.org/wiki/Russian_America"
    - from: 1799
      to: 1840
      text: 1799年、皇帝パーヴェル1世が露米会社に独占を認めた。支配人バラノフはトリンギットと戦ってシトカを拠点にし（1804年）、食料を得るためカリフォルニアにフォート・ロス（1812年）を建てた。1824–25年の条約で、アメリカ・イギリスとの境を北緯54度40分と決めた。
      source: "https://ja.wikipedia.org/wiki/露米会社"
    - from: 1841
      to: 1866
      text: ラッコはとり尽くされ、1841年にフォート・ロスも売った。クリミア戦争（1853–56年）でイギリスに奪われる心配が生まれ、遠すぎて守れない植民地を、ロシアは1867年にアメリカ合衆国へ720万ドルで売った（アラスカ購入）。
      source: "https://ja.wikipedia.org/wiki/アラスカ購入"
  source:
    - "https://en.wikipedia.org/wiki/Russian_America"

- id: danish_west_indies
  name: デンマーク領西インド諸島
  parent: denmark
  kind: 植民地（1755年まで西インド・ギニア会社の経営）
  match:
    labels: [デンマーク領西インド諸島]
  from: 1733
  to: 1916
  polities: [usa]
  governors:
    - { name: ペーター・フォン・ショルテン, title: 総督, from: 1827, to: 1848, note: 1848年の奴隷の蜂起を受けて、独断で奴隷の解放を宣言, source: "https://en.wikipedia.org/wiki/Peter_von_Scholten" }
  periods:
    - from: 1733
      to: 1847
      text: デンマークの西インド・ギニア会社は、セント・トーマス島（1672年〜）・セント・ジョン島に続き、1733年にフランスからセント・クロイ島を買った。セント・クロイ島の砂糖農園で黒人奴隷が働き、セント・トーマス島のシャーロット・アマリーは中立国の自由港として栄えた。1792年、デンマークは奴隷貿易を禁じた最初のヨーロッパの国になった（1803年から実施）。
      source: "https://en.wikipedia.org/wiki/Danish_West_Indies"
    - from: 1848
      to: 1916
      text: 1848年、セント・クロイ島の奴隷が蜂起し、総督ショルテンが奴隷の解放を宣言した。砂糖の経済は衰え、デンマークは島を売ろうとした。第一次世界大戦中、ドイツの潜水艦の基地になることを恐れたアメリカ合衆国が、1917年に2500万ドルで買い取った（アメリカ領ヴァージン諸島）。
      source: "https://en.wikipedia.org/wiki/Treaty_of_the_Danish_West_Indies"
  source:
    - "https://en.wikipedia.org/wiki/Danish_West_Indies"

- id: danish_greenland
  name: デンマーク領グリーンランド
  parent: denmark
  kind: 植民地（王立グリーンランド交易会社が交易を独占）
  match:
    labels: [グリーンランド]
  from: 1721
  to: 1952
  periods:
    - from: 1721
      to: 1813
      text: 中世のノルウェー人の入植地は15世紀に消えていた。1721年、ノルウェー人の牧師ハンス・エーゲデが、かつての入植者の子孫を探して布教に行った。1728年にゴットホーブ（いまのヌーク）が建てられた。デンマーク＝ノルウェー王国はイヌイットとの交易を独占し、アザラシの油などを得た。
      source: "https://ja.wikipedia.org/wiki/ハンス・エーゲデ"
    - from: 1814
      to: 1939
      text: 1814年のキール条約でノルウェーはスウェーデンに渡されたが、グリーンランドはデンマークに残った。島は外国人の立ち入りを制限した閉ざされた植民地だった。1931年、ノルウェーが東グリーンランドの一部を占領したが、1933年に常設国際司法裁判所がデンマークの主権を認めた。
      source: "https://en.wikipedia.org/wiki/Legal_Status_of_Eastern_Greenland"
    - from: 1940
      to: 1952
      text: 1940年に本国がドイツに占領されると、グリーンランドはアメリカ合衆国の保護を受け、アメリカ軍の基地が置かれた（戦後のチューレ基地）。1953年のデンマークの憲法改正で植民地の地位をやめ、本国の一部になった（1979年に自治政府）。
      source: "https://en.wikipedia.org/wiki/History_of_Greenland"
  source:
    - "https://en.wikipedia.org/wiki/History_of_Greenland"

- id: new_sweden
  name: ニュースウェーデン
  parent: sweden
  kind: 植民地（ニュースウェーデン会社）
  match:
    labels: [ニュースウェーデン]
  from: 1638
  to: 1654
  governors:
    - { name: ペーター・ミヌイット, title: 最初の遠征の指揮官, from: 1638, to: 1638, note: もとニューネーデルラントの長官, source: "https://ja.wikipedia.org/wiki/ピーター・ミヌイット" }
    - { name: ヨハン・プリンツ, title: 総督, from: 1643, to: 1653, source: "https://en.wikipedia.org/wiki/Johan_Björnsson_Printz" }
    - { name: ヨハン・リーシング, title: 最後の総督, from: 1654, to: 1655, source: "https://en.wikipedia.org/wiki/Johan_Risingh" }
  periods:
    - from: 1638
      to: 1654
      text: 三十年戦争で大国になったスウェーデンは、1638年にデラウェア川にクリスティナ砦（女王の名にちなむ）を建て、毛皮やタバコの交易を始めた。スウェーデン人とフィンランド人の入植者は丸太小屋の作り方を持ち込んだ。しかし本国からの支援は乏しく、1655年、ニューネーデルラントのストイフェサントに降伏した。
      source: "https://ja.wikipedia.org/wiki/ニュースウェーデン"
  source:
    - "https://ja.wikipedia.org/wiki/ニュースウェーデン"

# ---------------- 追加（イギリス・オランダ・フランスのその他の主な植民地） ----------------

- id: colony_of_connecticut
  name: コネティカット植民地
  parent: britain
  kind: 自治植民地（1662年の特許状で総督も住民が選ぶ）
  match:
    labels: [コネティカット植民地, ニューヘイヴン植民地, ニューヘイヴン・コネティカットの町]
  from: 1635
  to: 1775
  polities: [usa]
  governors:
    - { name: ジョン・ウィンスロップ（子）, title: 総督, from: 1659, to: 1676, note: 国王から自治の特許状（1662年）を得る。1657年にも総督, source: "https://en.wikipedia.org/wiki/John_Winthrop_the_Younger" }
  periods:
    - from: 1635
      to: 1661
      text: 1630年代、マサチューセッツ湾植民地からトマス・フッカーらのピューリタンがコネティカット川の流域に移り、ハートフォードなどの町を建てた。1637年のピクォート戦争で先住民ピクォートを滅ぼした。1639年の「基本法」は、住民が自分たちで定めた最初の成文の統治の決まりの一つとされる。南の海岸にはより厳格なニューヘイヴン植民地（1638年）ができた。
      source: "https://en.wikipedia.org/wiki/Connecticut_Colony"
    - from: 1662
      to: 1775
      text: 1662年、王政復古のチャールズ2世から特許状を得て、ニューヘイヴンを合わせた。総督も議会も住民が選ぶ自治植民地で、ジェームズ2世のニューイングランド王領（1687–89年）のときも、特許状を木のうろに隠して守ったと伝えられる（チャーター・オーク）。独立戦争ではそのまま州になった。
      source: "https://en.wikipedia.org/wiki/Connecticut_Colony"
  source:
    - "https://en.wikipedia.org/wiki/Connecticut_Colony"

- id: province_of_new_jersey
  name: ニュージャージー植民地
  names:
    - { from: 1674, to: 1701, name: 東ジャージー・西ジャージー, kind: 領主植民地（2つに分かれる） }
  parent: britain
  kind: 植民地（1702年から王領植民地）
  match:
