      text: 本国と同じく宗教にも商売にも寛容で、さまざまな国の人が集まった（ユダヤ教徒も1654年に来た）。長官キーフトの先住民との戦争の後、ストイフェサントが立て直し、1655年にスウェーデンのニュースウェーデンを奪った。しかし人口は少なく、隣のイギリス植民地に押された。
      source: "https://ja.wikipedia.org/wiki/ニューネーデルラント"
    - from: 1664
      to: 1674
      text: 1664年、イギリスの艦隊が来てニューアムステルダムは戦わずに降り、ニューヨークと改名された（第二次英蘭戦争）。1667年のブレダの和約で、オランダはスリナムを得る代わりにニューネーデルラントを手放した。第三次英蘭戦争でいったん奪い返したが（1673年）、翌年のウェストミンスター条約で最終的に返した。
      source: "https://ja.wikipedia.org/wiki/ブレダの和約"
  source:
