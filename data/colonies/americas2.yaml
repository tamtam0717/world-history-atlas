  polities: [guatemala, central_america, el_salvador, honduras, nicaragua, costa_rica, miskito]
  governors:
    - { name: ペドロ・デ・アルバラード, title: 総督, from: 1524, to: 1541, note: コルテスの部下。キチェ・カクチケルなどのマヤ諸国を征服, source: "https://ja.wikipedia.org/wiki/ペドロ・デ・アルバラード" }
    - { name: ホセ・デ・ブスタマンテ・イ・ゲラ, title: 総監, from: 1811, to: 1818, note: 中米の独立の動きを抑える, source: "https://en.wikipedia.org/wiki/José_de_Bustamante_y_Guerra" }
    - { name: ガビノ・ガインサ, title: 最後の総監, from: 1821, to: 1821, note: 1821年9月15日の独立宣言に加わる, source: "https://en.wikipedia.org/wiki/Gabino_Gaínza" }
  periods:
    - from: 1524
      to: 1542
      text: 1524年、メキシコから南下したアルバラードがキチェ・カクチケルなどのマヤ諸国を征服した。パナマから北上した別の征服者たちはニカラグアやホンジュラスを征服し、取り合った。先住民は奴隷としてペルーなどへ売られ、人口が激減した。
      source: "https://en.wikipedia.org/wiki/Spanish_conquest_of_Guatemala"
    - from: 1543
      to: 1699
      text: インディアス新法（1542年）で中米を治める聴訴院が置かれ、のちサンティアゴ・デ・グアテマラ（いまのアンティグア）に移った。ヌエバ・エスパーニャ副王の下にあるが、実際には総監が独自に治めた。ラス・カサスがベラパスで武力によらない布教を試みた。藍（インディゴ）とカカオが主な産物で、カリブ海岸はイギリスとミスキートに脅かされた。
      source: "https://ja.wikipedia.org/wiki/グアテマラ総督領"
    - from: 1700
      to: 1807
      text: ブルボン朝の本国は、カリブ海岸のイギリス人（ベリーズの伐採者・ミスキート海岸）と争った。1773年の地震でサンティアゴが壊れ、首府はいまのグアテマラ市に移った。1786年にインテンデンシア制が入り、エルサルバドルの藍の生産者は、グアテマラ市の商人の独占に不満を強めた。
      source: "https://en.wikipedia.org/wiki/Captaincy_General_of_Guatemala"
    - from: 1808
      to: 1821
      text: 本国がナポレオンに占領されると、1811年のサンサルバドルの反乱などが起きたが、総監ブスタマンテが抑えた。メキシコでイトゥルビデが独立すると、1821年9月15日、グアテマラ市の会議が独立を宣言した。中米はいったんメキシコ帝国に併合され（1822年）、1823年に中央アメリカ連邦として離れる。
      source: "https://ja.wikipedia.org/wiki/中央アメリカ連邦"
  source:
    - "https://ja.wikipedia.org/wiki/グアテマラ総督領"
    - "https://en.wikipedia.org/wiki/Captaincy_General_of_Guatemala"

- id: spanish_cuba
  name: スペイン領キューバ
  parent: spain
  kind: 植民地（総監領）
  match:
    labels: [キューバ]
  from: 1516
  to: 1898
  polities: [cuba, taino]
  governors:
    - { name: ディエゴ・ベラスケス, title: 総督, from: 1511, to: 1524, note: キューバを征服し、ハバナなどの町を建てる。コルテスのメキシコ遠征を送り出した, source: "https://en.wikipedia.org/wiki/Diego_Velázquez_de_Cuéllar" }
    - { name: ミゲル・タコン, title: 総監, from: 1834, to: 1838, source: "https://en.wikipedia.org/wiki/Miguel_Tacón_y_Rosique" }
    - { name: アルセニオ・マルティネス・カンポス, title: 総監, from: 1876, to: 1879, note: サンホン協定（1878年）で十年戦争を終わらせる, source: "https://en.wikipedia.org/wiki/Arsenio_Martínez_Campos" }
    - { name: バレリアーノ・ウェイレル, title: 総監, from: 1896, to: 1897, note: 農民を強制収容所に集める集住政策で多くの死者を出す, source: "https://en.wikipedia.org/wiki/Valeriano_Weyler" }
    - { name: ラモン・ブランコ, title: 最後の総監, from: 1897, to: 1898, source: "https://en.wikipedia.org/wiki/Ramón_Blanco_y_Erenas" }
  periods:
    - from: 1516
      to: 1599
      text: 1511年からベラスケスが征服し、タイノの首長アトゥエイは火あぶりにされた。先住民はエンコミエンダの酷使と疫病でほとんど死に絶えた。キューバはメキシコ征服の出発点となり、その後はハバナの港が、アメリカの銀を積んでセビリャへ帰る船団の集まる所になった。
      source: "https://ja.wikipedia.org/wiki/キューバの歴史"
    - from: 1600
      to: 1761
      text: ハバナはモロ要塞などで固められ、スペイン帝国の大西洋航路の要になった。島の経済はタバコ・牛と船団への補給が中心で、たばこの専売（1717年）に農民が反発した。カリブ海では、イギリス・フランス・オランダの植民地と海賊がスペインの独占を崩していった。
      source: "https://en.wikipedia.org/wiki/Captaincy_General_of_Cuba"
    - from: 1762
      to: 1837
      text: 七年戦争でイギリスがハバナを占領し（1762–63年）、港を開いて奴隷を大量に持ち込んだ。返還後、本国は守りを固めて貿易をゆるめた。1791年からのハイチ革命でサン＝ドマングの砂糖が止まると、キューバが代わりに世界一の砂糖の産地になり、黒人奴隷の輸入が急増した。大陸の植民地が独立しても、奴隷の反乱を恐れるクリオーリョは本国に残った（「いつも忠実な島」）。
      source: "https://en.wikipedia.org/wiki/British_occupation_of_Havana"
    - from: 1838
      to: 1878
      text: 砂糖の農園に鉄道（1837年、スペイン本国より早い）と蒸気の製糖機が入った。本国は島を特別法で治め、議会に代表を送らせなかった。アメリカ合衆国の南部には島を買おう・奪おうという動きもあった。1868年、セスペデスが奴隷を解放して独立を叫び（十年戦争）、1878年のサンホン協定で終わった。
      source: "https://ja.wikipedia.org/wiki/十年戦争_(キューバ)"
    - from: 1879
      to: 1898
      text: 1886年に奴隷制が廃止され、砂糖の輸出先はアメリカ合衆国が中心になった。1895年、ホセ・マルティが独立戦争を起こして戦死し、総監ウェイレルの集住政策で多くの住民が死んだ。1898年、ハバナでアメリカの戦艦メイン号が爆沈して米西戦争になり、パリ条約でスペインはキューバを手放した。
      source: "https://ja.wikipedia.org/wiki/キューバ独立戦争"
  source:
    - "https://ja.wikipedia.org/wiki/キューバの歴史"
    - "https://en.wikipedia.org/wiki/Captaincy_General_of_Cuba"

- id: spanish_santo_domingo
  name: サント・ドミンゴ（スペイン領イスパニョーラ島）
  parent: spain
  kind: 植民地（総監領。首府サント・ドミンゴ）
  match:
    labels: [サント・ドミンゴ, イスパニョーラ島西部]
  from: 1516
  to: 1865
  polities: [dominican_republic, haiti, taino]
  governors:
    - { name: ニコラス・デ・オバンド, title: 総督, from: 1502, to: 1509, note: タイノの首長たちを殺し、エンコミエンダを広める, source: "https://en.wikipedia.org/wiki/Nicolás_de_Ovando" }
    - { name: ディエゴ・コロン, title: 総督（インディアス提督）, from: 1509, to: 1523, note: コロンブスの子, source: "https://en.wikipedia.org/wiki/Diego_Columbus" }
    - { name: フアン・サンチェス・ラミレス, title: 総督, from: 1809, to: 1811, note: フランス軍を追い出し、スペインに戻す（再征服）, source: "https://en.wikipedia.org/wiki/Juan_Sánchez_Ramírez" }
    - { name: ペドロ・サンタナ, title: 総監, from: 1861, to: 1862, note: ドミニカ共和国の大統領から、スペインへの再併合を求めて総監に, source: "https://en.wikipedia.org/wiki/Pedro_Santana" }
  periods:
    - from: 1516
      to: 1605
      text: コロンブスの来航（1492年）からカスティーリャが治めた最初の植民地で、サント・ドミンゴには新大陸で最初の聴訴院（1511年）と大学が置かれた。タイノは酷使と疫病で激減し、ラス・カサスがその惨状を告発した。サトウキビの農園のためアフリカから奴隷が運ばれたが、メキシコ・ペルーの征服後は人が去り、島は寂れた。
      source: "https://ja.wikipedia.org/wiki/サント・ドミンゴ総監領"
    - from: 1606
      to: 1794
      text: 密貿易を断つため、1605–06年に総督が島の北西部の住民を首府の近くへ移した（オソリオの過疎化）。空いた西部には牛を狩るフランス人のバッカニア（海賊）が住みつき、1697年のライスワイク条約で西部はフランス領サン＝ドマングになった。東部は牛を育てる貧しい植民地のまま、西の砂糖植民地に牛を売った。
      source: "https://en.wikipedia.org/wiki/Devastaciones_de_Osorio"
    - from: 1795
      to: 1821
      text: 1795年のバーゼルの和約で、スペインは島の東部もフランスに渡した。1809年に地元の人々がフランス軍を追い出してスペインに戻ったが（再征服）、本国は顧みず（「愚かなスペイン」の時代）、1821年に独立を宣言し、翌年ハイチに併合された。
      source: "https://en.wikipedia.org/wiki/España_Boba"
    - from: 1861
      to: 1865
      text: 1844年にハイチから独立したドミニカ共和国は、ハイチの再侵攻を恐れ、大統領サンタナが1861年にスペインへの再併合を求めた。アメリカ合衆国は南北戦争中でモンロー主義を守れなかった。しかし本国の役人と軍の横暴に反発して復古戦争が起き、スペインは1865年に撤退した。
      source: "https://en.wikipedia.org/wiki/Dominican_Restoration_War"
  source:
    - "https://ja.wikipedia.org/wiki/サント・ドミンゴ総監領"
    - "https://en.wikipedia.org/wiki/Captaincy_General_of_Santo_Domingo"

- id: spanish_puerto_rico
  name: スペイン領プエルトリコ
  parent: spain
  kind: 植民地（総監領）
  match:
    labels: [プエルトリコ]
  from: 1516
  to: 1898
  polities: [taino]
  governors:
    - { name: フアン・ポンセ・デ・レオン, title: 総督, from: 1509, to: 1511, note: 島を征服し、のちフロリダに到達, source: "https://ja.wikipedia.org/wiki/フアン・ポンセ・デ・レオン" }
  periods:
    - from: 1516
      to: 1764
      text: 1508年からポンセ・デ・レオンが征服し、タイノは1511年に反乱を起こしたが敗れ、疫病と酷使で激減した。サン・フアンの港はカリブ海の入り口を守る要塞（エル・モロ）で固められ、イギリス（ドレーク 1595年）やオランダ（1625年）の攻撃を退けた。島はメキシコの銀からの補助金（シトゥアド）に頼る軍事拠点だった。
      source: "https://ja.wikipedia.org/wiki/プエルトリコの歴史"
    - from: 1765
      to: 1867
      text: 1765年の巡察の後、本国は貿易をゆるめ、コーヒーや砂糖の農園が広がった。大陸の植民地が独立すると、1815年の勅令（恩恵の勅令）で外国のカトリック教徒の移住を認め、王党派の亡命者も流れ込んで人口が増えた。キューバとともに、スペインに残った「いつも忠実な」植民地だった。
      source: "https://en.wikipedia.org/wiki/Real_Cédula_de_Gracias_of_1815"
    - from: 1868
      to: 1898
      text: 1868年、独立を求めるラレスの叫びが起きたがすぐ鎮圧された。1873年に奴隷制が廃止される。1897年、本国は自治を認める憲章を与えたが、翌1898年の米西戦争でアメリカ軍が上陸し、パリ条約でアメリカ合衆国の領土になった。
      source: "https://en.wikipedia.org/wiki/Grito_de_Lares"
  source:
    - "https://ja.wikipedia.org/wiki/プエルトリコの歴史"

