  name: リオ・デ・ラ・プラタ副王領
  names:
    - { to: 1541, name: リオ・デ・ラ・プラタ（メンドーサの総督領）, kind: 征服地（総督領） }
  parent: spain
  kind: 副王領（首府ブエノスアイレス）
  # 1542–1775 は副ラベルが「ペルー副王領」で、ペルー副王領（americas.yaml）に入る
  match:
    contains: [ラ・プラタ副王領]
    labels: [リオ・デ・ラ・プラタ, リオ・デ・ラ・プラタ（アスンシオン）, モンテビデオ（スペイン王党派）]
  from: 1536
  to: 1824
  polities: [united_provinces_rio_plata, argentina, uruguay, paraguay, bolivia, liga_federal]
  governors:
    - { name: ペドロ・デ・メンドーサ, title: 先遣総督（アデランタード）, from: 1536, to: 1537, note: 最初のブエノスアイレスを建てる, source: "https://en.wikipedia.org/wiki/Pedro_de_Mendoza" }
    - { name: ペドロ・デ・セバリョス, title: 初代副王, from: 1776, to: 1778, note: ポルトガルからコロニア・ド・サクラメントを奪う, source: "https://en.wikipedia.org/wiki/Pedro_de_Cevallos" }
    - { name: フアン・ホセ・デ・ベルティス, title: 副王, from: 1778, to: 1784, source: "https://en.wikipedia.org/wiki/Juan_José_de_Vértiz_y_Salcedo" }
    - { name: ラファエル・デ・ソブレモンテ, title: 副王, from: 1804, to: 1807, note: イギリス軍の侵攻（1806年）でブエノスアイレスから逃れ、市民の評判を落とす, source: "https://en.wikipedia.org/wiki/Rafael_de_Sobremonte" }
    - { name: サンティアゴ・デ・リニエルス, title: 副王, from: 1807, to: 1809, note: イギリス軍を撃退した民兵の指揮官, source: "https://en.wikipedia.org/wiki/Santiago_de_Liniers" }
    - { name: バルタサル・イダルゴ・デ・シスネロス, title: 副王, from: 1809, to: 1810, note: 五月革命で退けられる, source: "https://en.wikipedia.org/wiki/Baltasar_Hidalgo_de_Cisneros" }
    - { name: フランシスコ・ハビエル・デ・エリオ, title: 副王（モンテビデオ）, from: 1811, to: 1811, source: "https://en.wikipedia.org/wiki/Francisco_Javier_de_Elío" }
  periods:
    - from: 1536
      to: 1541
      text: 1536年、メンドーサが銀の山（ラ・プラタ）への道を求めてラ・プラタ川に最初のブエノスアイレスを建てたが、先住民の攻撃と飢えで捨てられた。一行は川をさかのぼり、グアラニーの地にアスンシオン（1537年）を建てて拠点とした。
      source: "https://en.wikipedia.org/wiki/Governorate_of_the_Río_de_la_Plata"
    - from: 1542
      to: 1775
      text: ラ・プラタ地方はペルー副王領に属した（地図ではこの時期はペルー副王領として選ばれる）。銀はリマとパナマを経て運ぶ決まりで、ブエノスアイレス（1580年に再建）の港は表向き閉じられ、ポトシの銀はポルトガル人やイギリス人との密貿易で流れ出た。ポルトガルは対岸にコロニア・ド・サクラメント（1680年）を築いて争った。
      source: "https://en.wikipedia.org/wiki/Viceroyalty_of_Peru"
    - from: 1776
      to: 1805
      text: ブルボン朝の本国はポルトガル・イギリスの進出に備え、1776年にブエノスアイレスを首府とする副王領を置き、ポトシのあるチャルカス（アルト・ペルー）もこちらに移した。1778年の自由貿易規則で港が開かれ、ブエノスアイレスは銀と牛の皮の積み出しで大きくなった。
      source: "https://ja.wikipedia.org/wiki/リオ・デ・ラ・プラタ副王領"
    - from: 1806
      to: 1810
      text: 1806・07年、ナポレオン戦争中のイギリスがブエノスアイレスを攻めた（ラ・プラタ侵攻）。副王は逃げたが、リニエルスの率いる市民の民兵が追い返し、クリオーリョは自分たちの力に自信をもった。本国がナポレオンに占領されると、1810年の五月革命で副王を退け、評議会（プリメラ・フンタ）が政権を握った。
      source: "https://ja.wikipedia.org/wiki/五月革命_(アルゼンチン)"
    - from: 1811
      to: 1824
      text: 副王の称号はモンテビデオに移ったが、王党派のモンテビデオは1814年に落ちた。パラグアイは1811年に独立し、アルト・ペルー（チャルカス）はペルー副王領の軍が押さえ続けた。1816年、トゥクマンの会議が独立を宣言し（ラ・プラタ連合州）、アルト・ペルーは1825年にボリビアとして独立する。
      source: "https://en.wikipedia.org/wiki/Viceroyalty_of_the_Río_de_la_Plata"
  source:
    - "https://ja.wikipedia.org/wiki/リオ・デ・ラ・プラタ副王領"
    - "https://en.wikipedia.org/wiki/Viceroyalty_of_the_Río_de_la_Plata"

- id: chile_captaincy
  name: チリ総督領
  parent: spain
  kind: 総督領（総監領。ペルー副王の下）
  match:
    labels: [チリ総督領, チロエ（スペイン王党派）]
  from: 1541
  to: 1826
  polities: [chile, mapuche]
  governors:
    - { name: ペドロ・デ・バルディビア, title: 初代総督, from: 1541, to: 1553, note: サンティアゴを建てる。トゥカペルの戦いでマプチェに敗れて殺される, source: "https://ja.wikipedia.org/wiki/ペドロ・デ・バルディビア" }
    - { name: ガルシア・ウルタド・デ・メンドーサ, title: 総督, from: 1557, to: 1561, source: "https://en.wikipedia.org/wiki/García_Hurtado_de_Mendoza,_5th_Marquis_of_Cañete" }
    - { name: アンブロシオ・オイギンス, title: 総督, from: 1788, to: 1796, note: のちペルー副王。独立の指導者ベルナルド・オイギンスの父, source: "https://en.wikipedia.org/wiki/Ambrosio_O'Higgins,_1st_Marquis_of_Osorno" }
    - { name: フランシスコ・カシミロ・マルコ・デル・ポント, title: 最後の総督, from: 1815, to: 1817, note: チャカブコの戦いで捕らえられる, source: "https://en.wikipedia.org/wiki/Francisco_Casimiro_Marcó_del_Pont" }
  periods:
    - from: 1541
      to: 1598
      text: ペルーを征服したピサロの部下バルディビアが南へ進み、1541年にサンティアゴを建てた。南の森と川の地に住むマプチェ（アラウコ族）は激しく抵抗し、1553年にバルディビアを討ち取った。この戦いはエルシーリャの叙事詩『ラ・アラウカーナ』に歌われた。
      source: "https://ja.wikipedia.org/wiki/アラウコ戦争"
    - from: 1599
      to: 1700
      text: 1598年のクラララバの戦いの後、マプチェは南部の7つの町を壊し、ビオビオ川が事実上の境になった。総督領はペルー副王からの補助金（シトゥアド）で常備軍を養い、川の北で小麦や牛を育ててリマに送った。1641年のキリンの会談で、スペインはマプチェの自立を事実上認めた。
      source: "https://en.wikipedia.org/wiki/Arauco_War"
    - from: 1701
      to: 1809
      text: ブルボン朝の本国のもとで、銀・銅の採掘と農業が広がり、大農園主のクリオーリョが社会を握った。1778年の自由貿易規則で港が開かれ、総督オイギンス（1788–96）は道や町を整えた。
      source: "https://en.wikipedia.org/wiki/Captaincy_General_of_Chile"
    - from: 1810
      to: 1826
      text: 1810年9月18日、サンティアゴの評議会が政権を握ったが（パトリア・ビエハ）、1814年のランカグアの戦いでペルー副王の軍に敗れた（再征服）。1817年、サン・マルティンとオイギンスがアンデスを越えてチャカブコで勝ち、1818年に独立を宣言した。南のチロエ島には王党派が1826年まで残った。
      source: "https://ja.wikipedia.org/wiki/チリ独立戦争"
  source:
    - "https://en.wikipedia.org/wiki/Captaincy_General_of_Chile"

