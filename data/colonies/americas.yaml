  polities: [usa, powhatan]
  governors:
    - { name: ジョン・スミス, title: 参事会議長, from: 1608, to: 1609, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Virginia" }
    - { name: ウィリアム・バークリー, title: 総督, from: 1642, to: 1652, note: ピューリタン革命では王党派, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Virginia" }
    - { name: ウィリアム・バークリー, title: 総督（復帰）, from: 1660, to: 1677, note: ベーコンの反乱（1676年）, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Virginia" }
    - { name: アレクサンダー・スポッツウッド, title: 副総督, from: 1710, to: 1722, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Virginia" }
    - { name: ロバート・ディンウィディー, title: 副総督, from: 1751, to: 1758, note: オハイオ川流域へ若いワシントンを送り、フレンチ＝インディアン戦争のきっかけに, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Virginia" }
    - { name: ダンモア伯, title: 最後の王領総督, from: 1771, to: 1775, source: "https://en.wikipedia.org/wiki/List_of_colonial_governors_of_Virginia" }
  periods:
    - from: 1607
      to: 1623
      text: 1607年、ロンドンのヴァージニア会社がジェームズタウンを建てた。イギリスで初めて長く続いた植民地で、飢えと病気に苦しみながら、ポウハタン族と交易し、争った。1610年代にタバコの栽培が成功して本国への輸出品になり、1619年には最初の植民地議会が開かれ、同じ年にアフリカ人が初めて連れてこられた。
      source: "https://en.wikipedia.org/wiki/Colony_of_Virginia"
    - from: 1624
      to: 1688
      text: 1624年に会社の特許が取り消され、国王が総督を任命する王領植民地になった。本国のピューリタン革命では王党派が多く、本国は航海法（1651年〜）で植民地の貿易をイギリス船・本国経由に限った。1676年、先住民への対応や総督の政治に不満な入植者がベーコンの反乱を起こした。
      source: "https://en.wikipedia.org/wiki/Colony_of_Virginia"
    - from: 1689
      to: 1763
      text: タバコのプランテーションの働き手は、年季奉公人から黒人奴隷へ移り、大農園主が植民地議会を握った。首府はウィリアムズバーグ（1699年〜）。西のオハイオ川流域をめぐってフランスと争い、フレンチ＝インディアン戦争（1754–63年）でイギリスが勝った。
      source: "https://ja.wikipedia.org/wiki/フレンチ・インディアン戦争"
    - from: 1764
      to: 1775
      text: 戦争で財政が苦しくなった本国は植民地への課税を強め（印紙法、1765年）、ヴァージニア議会ではパトリック・ヘンリーが反対を訴えた（「代表なくして課税なし」）。1774年の大陸会議にワシントンらを送り、1775年に独立戦争が始まると総督ダンモアは逃れた。1776年、ジェファソンが独立宣言を起草する。
      source: "https://ja.wikipedia.org/wiki/アメリカ独立革命"
