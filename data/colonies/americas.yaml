    - { name: ブラスコ・ヌニェス・ベラ, title: 初代副王, from: 1544, to: 1546, note: インディアス新法を強行しようとして征服者の反乱にあい、戦死, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_Peru" }
    - { name: フランシスコ・デ・トレド, title: 副王, from: 1569, to: 1581, note: ミタ制とレドゥクシオンを整え、最後のインカ皇帝トゥパク・アマルを処刑（1572年）, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_Peru" }
    - { name: マヌエル・デ・アマト, title: 副王, from: 1761, to: 1776, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_Peru" }
    - { name: アグスティン・デ・ハウレギ, title: 副王, from: 1780, to: 1784, note: トゥパク・アマル2世の反乱のときの副王, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_Peru" }
    - { name: ホセ・フェルナンド・デ・アバスカル, title: 副王, from: 1806, to: 1816, note: 南アメリカの王党派の中心として各地の独立運動を抑えた, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_Peru" }
    - { name: ホアキン・デ・ラ・ペスエラ, title: 副王, from: 1816, to: 1821, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_Peru" }
    - { name: ホセ・デ・ラ・セルナ, title: 最後の副王, from: 1821, to: 1824, note: アヤクーチョの戦いで捕らえられる, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_Peru" }
  periods:
    - from: 1532
      to: 1541
      text: ピサロが少人数の兵でインカ皇帝アタワルパを捕らえて処刑し（1533年）、首都クスコを占領した。1535年に海岸にリマを建設。マンコ・インカの反乱（1536年）や、征服者どうしの内戦（ピサロ派とアルマグロ派）が続いた。
      source: "https://ja.wikipedia.org/wiki/インカ帝国の征服"
    - from: 1542
      to: 1568
      text: 本国は先住民の保護とエンコミエンダの世襲の制限を定めたインディアス新法（1542年）を出し、副王領を置いた。征服者たちは反発して反乱を起こし、初代副王は戦死した。1545年にポトシ（いまのボリビア）で巨大な銀山が見つかる。
      source: "https://en.wikipedia.org/wiki/Viceroyalty_of_Peru"
    - from: 1569
      to: 1716
      text: 副王トレドが、先住民を村に集めるレドゥクシオンと、交代で鉱山などに働かせるミタ制を整え、水銀アマルガム法でポトシの銀の産出が激増した。銀はリマから船団でパナマを経てセビリャへ運ばれ、本国の戦費とヨーロッパの価格革命を支えた。副王領は、南アメリカのスペイン領のほとんどを治めた。
      source: "https://ja.wikipedia.org/wiki/ポトシ"
    - from: 1717
      to: 1779
      text: 本国のブルボン朝は広すぎる副王領を分け、北にヌエバ・グラナダ副王領（1717年、再設置1739年）、南東にリオ・デ・ラ・プラタ副王領（1776年）を置いた。ポトシのあるチャルカス（いまのボリビア）もラ・プラタ側に移り、ペルー副王領は小さくなった。
      source: "https://en.wikipedia.org/wiki/Viceroyalty_of_Peru"
    - from: 1780
      to: 1807
      text: ブルボン改革の課税強化に反発し、1780年、インカ皇帝の子孫を名乗るトゥパク・アマル2世が先住民の大反乱を起こした。反乱は翌年鎮圧されたが、クリオーリョは先住民の反乱を恐れ、独立には慎重になった。
      source: "https://ja.wikipedia.org/wiki/トゥパク・アマル2世"
    - from: 1808
      to: 1824
      text: 本国がナポレオンに占領されると、南アメリカ各地に自治の評議会ができたが、リマは副王アバスカルのもとで王党派の拠点であり続けた。アルゼンチン・チリを解放したサン・マルティンが1821年にリマに入って独立を宣言し、1824年、ボリバルの部下スクレがアヤクーチョの戦いで副王軍を破った。
      source: "https://ja.wikipedia.org/wiki/アヤクーチョの戦い"
  source:
    - "https://ja.wikipedia.org/wiki/ペルー副王領"
    - "https://en.wikipedia.org/wiki/Viceroyalty_of_Peru"

