    labels: [ヌエボ・メヒコ（エル・パソ・デル・ノルテ）]
  from: 1521
  to: 1821
  polities: [mexico, aztec]
  governors:
    - { name: エルナン・コルテス, title: 総督・総司令官, from: 1522, to: 1524, note: アステカ王国を征服, source: "https://ja.wikipedia.org/wiki/エルナン・コルテス" }
    - { name: アントニオ・デ・メンドーサ, title: 初代副王, from: 1535, to: 1550, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: ルイス・デ・ベラスコ, title: 副王, from: 1550, to: 1564, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: アントニオ・マリア・デ・ブカレリ, title: 副王, from: 1771, to: 1779, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: ベルナルド・デ・ガルベス, title: 副王, from: 1785, to: 1786, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: レビジャヒヘド伯（2代）, title: 副王, from: 1789, to: 1794, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: ホセ・デ・イトゥリガライ, title: 副王, from: 1803, to: 1808, note: 本国の混乱のなか、自治を求めるクリオーリョに近づいたとして本国生まれの人々に解任される, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: フランシスコ・ハビエル・ベネガス, title: 副王, from: 1810, to: 1813, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: フェリクス・マリア・カジェハ, title: 副王, from: 1813, to: 1816, note: イダルゴ・モレーロスの反乱を鎮圧した軍人, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: フアン・ルイス・デ・アポダカ, title: 副王, from: 1816, to: 1821, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
    - { name: フアン・オドノフー, title: 最後の上級政務長官, from: 1821, to: 1821, note: コルドバ条約でメキシコの独立を認める, source: "https://en.wikipedia.org/wiki/List_of_viceroys_of_New_Spain" }
  periods:
    - from: 1521
      to: 1534
      text: 1521年、コルテスがアステカ王国の首都テノチティトランを征服し、その上にメキシコ市を建てた。征服者には、先住民の労働と貢納を任せるエンコミエンダが与えられた。本国はカルロス1世（神聖ローマ皇帝カール5世）の時代で、アメリカの富がハプスブルク家の戦争を支えていく。
      source: "https://ja.wikipedia.org/wiki/アステカ帝国の征服"
    - from: 1535
      to: 1599
      text: 1535年に副王領を置く。サカテカス（1546年）・グアナフアトなどの銀山が開かれ、ラテンアメリカの銀がヨーロッパの物価を押し上げた（価格革命）。先住民は天然痘などの疫病と酷使で激減した。1565年からはアカプルコとマニラを結ぶガレオン貿易でメキシコ銀がアジアへ渡り、明の銀を使う経済とも結びついた。
      source: "https://ja.wikipedia.org/wiki/ガレオン貿易"
    - from: 1600
      to: 1700
      text: 本国スペインが17世紀に衰えていくなか、副王領では大農園（アシエンダ）が広がり、植民地生まれの白人（クリオーリョ）が力をつけた。北へは布教村（ミシオン）と砦で広がり、ヌエボ・メヒコ（1598年〜）ではプエブロの反乱（1680年）でいったん追い出される。
      source: "https://en.wikipedia.org/wiki/New_Spain"
    - from: 1701
      to: 1807
      text: スペイン継承戦争で本国の王家がブルボン朝に替わり、カルロス3世のもとで本国の統制と課税を強める改革（ブルボン改革）が進む。巡察使ガルベスの改革、インテンデンシア制（1786年）。北のカリフォルニアにも布教村を建てた（1769年〜）。要職は本国生まれの人（ペニンスラール）に与えられ、クリオーリョの不満がたまった。
      source: "https://en.wikipedia.org/wiki/Bourbon_Reforms"
    - from: 1808
      to: 1821
      text: ナポレオンの本国侵攻（1808年）で王権が揺らぐと、1810年にイダルゴ神父が「ドロレスの叫び」で先住民・メスティーソとともに蜂起し、モレーロスが受け継いだが鎮圧された。1820年に本国で自由主義の革命（スペイン立憲革命）が起きると、それを嫌った保守派のイトゥルビデが独立派と結び、1821年にメキシコが独立した。
      source: "https://ja.wikipedia.org/wiki/メキシコ独立戦争"
  source:
    - "https://ja.wikipedia.org/wiki/ヌエバ・エスパーニャ"
    - "https://en.wikipedia.org/wiki/New_Spain"

