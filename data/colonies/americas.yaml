  governors:
    - { name: トメ・デ・ソウザ, title: 初代総督, from: 1549, to: 1553, note: サルヴァドールに総督府を置く, source: "https://en.wikipedia.org/wiki/Tomé_de_Sousa" }
    - { name: ドゥアルテ・ダ・コスタ, title: 総督, from: 1553, to: 1557, source: "https://en.wikipedia.org/wiki/Duarte_da_Costa" }
    - { name: メン・デ・サ, title: 総督, from: 1557, to: 1572, note: フランスの入植地を追い出し、リオデジャネイロを建設, source: "https://en.wikipedia.org/wiki/Mem_de_Sá" }
    - { name: ヴァスコ・フェルナンデス・セザール・デ・メネゼス, title: 副王, from: 1720, to: 1735, source: "https://en.wikipedia.org/wiki/Colonial_Brazil" }
    - { name: クーニャ伯, title: 副王, from: 1763, to: 1767, note: 首府をリオデジャネイロに移してから最初の副王, source: "https://en.wikipedia.org/wiki/Colonial_Brazil" }
    - { name: ラヴラディオ侯, title: 副王, from: 1769, to: 1779, source: "https://en.wikipedia.org/wiki/Colonial_Brazil" }
    - { name: アルコス伯, title: 最後の副王, from: 1806, to: 1808, source: "https://en.wikipedia.org/wiki/Colonial_Brazil" }
    - { name: ジョアン（のちのジョアン6世）, title: 摂政・国王（リオデジャネイロの宮廷）, from: 1808, to: 1821, note: ナポレオンの侵攻を逃れて王室ごとブラジルへ, source: "https://ja.wikipedia.org/wiki/ジョアン6世_(ポルトガル王)" }
    - { name: ペドロ（のちのペドロ1世）, title: 摂政, from: 1821, to: 1822, note: 1822年に独立を宣言し、ブラジル皇帝に, source: "https://ja.wikipedia.org/wiki/ペドロ1世_(ブラジル皇帝)" }
  periods:
    - from: 1500
      to: 1548
      text: 1500年、インドへ向かうカブラルの艦隊が漂着し、トルデシリャス条約（1494年）の境界線の東側としてポルトガル領を宣言した。本国はアジアの香辛料貿易を重視しており、初めは染料になるブラジルボクを積み出す程度だった。1530年代、海岸を区切って貴族に分け与えるカピタニア制で入植を始める。
      source: "https://ja.wikipedia.org/wiki/ブラジルの歴史"
    - from: 1549
      to: 1579
      text: 1549年、サルヴァドールに総督府を置き、イエズス会が先住民への布教を始める。北東部（ペルナンブーコ・バイーア）でサトウキビのプランテーションが広がり、労働力は先住民からアフリカの黒人奴隷へ移った。砂糖はリスボンを経てヨーロッパに売られた。
      source: "https://en.wikipedia.org/wiki/Colonial_Brazil"
    - from: 1580
      to: 1654
      text: 1580年から1640年まで、スペイン王がポルトガル王を兼ねた（同君連合）。スペインと独立戦争を戦うオランダは砂糖の産地を狙い、1630年にペルナンブーコを占領した（オランダ領ブラジル）。1640年に本国が独立を回復した後、現地の入植者の反乱で1654年にオランダを追い出す。
      source: "https://en.wikipedia.org/wiki/Dutch_Brazil"
    - from: 1655
      to: 1749
      text: カリブ海のイギリス領・フランス領の砂糖に押されて北東部が伸び悩むなか、1690年代にミナス・ジェライスで金が見つかり、ゴールドラッシュが起きる。ブラジルの金は、メシュエン条約（1703年）で結びつきを強めた本国を通って、多くがイギリスへ流れた。奥地の開拓者（バンデイランテス）が境界線の西へ領域を広げ、1750年のマドリード条約でスペインに認めさせる。
      source: "https://en.wikipedia.org/wiki/Brazilian_Gold_Rush"
    - from: 1750
      to: 1807
      text: 本国の宰相ポンバル侯（1750–77）が、会社をつくって貿易を統制し、イエズス会を追放した（1759年）。1763年、金の積み出し港に近いリオデジャネイロに首府を移す。1789年、アメリカ独立に刺激されたミナスの独立の陰謀（チラデンテス）が摘発された。
      source: "https://ja.wikipedia.org/wiki/ポンバル侯爵"
    - from: 1808
      to: 1822
      text: ナポレオン軍の侵攻（1807年）を逃れて王室がリオデジャネイロに移り、ブラジルが帝国の中心になった。港はイギリスなどに開かれ、1815年にはポルトガルと対等の王国に。1821年に国王ジョアン6世が帰国し、本国の議会が植民地への逆戻りを求めると、残った王子ペドロが1822年に独立を宣言した（ブラジル帝国）。
      source: "https://ja.wikipedia.org/wiki/ブラジル独立"
  source:
    - "https://ja.wikipedia.org/wiki/ブラジルの歴史"
    - "https://en.wikipedia.org/wiki/Colonial_Brazil"

