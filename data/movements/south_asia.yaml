# 潮流：南アジア・東南アジア（1648–2025）。形式は docs/movements-format.md
# spread の書き方：
# - 独立後の国は政体（india・pakistan・indonesia など）で書く。
# - 植民地の時代は、政体（britain・netherlands・france）で書くと既定では本国だけが光り、include_colonies: true では他の植民地まで光るので、政治の地域（data/regions の
#   india_*.yaml・mainland_sea.yaml・maritime_sea.yaml）の ID の一覧で書く。一覧は YAML のアンカーで一度だけ書き、ほかの項目では参照する
#   （&british_india・&bengal・&punjab・&maharashtra・&hindustan・&vietnam_regions・&indies・&java・&philippine_regions・&burma_regions）。
#   2026-11-21 の時点の地域 ID。地域 ID が変わったら、ここも直す（npm run data で「未定義の地域」の警告が出る）。
# - 英領インドの一覧（&british_india）は、ネパール・ブータン・シッキム・スリランカ・モルディブを除いた、現在のインド・パキスタン・バングラデシュの地域。

