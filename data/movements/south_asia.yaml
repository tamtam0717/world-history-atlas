  text: 15〜17 世紀の東南アジア・東アジアの海は、香辛料・胡椒・絹・陶磁器・銀を運ぶ交易で栄えた。マラッカ・琉球・アユタヤなどの港市が中継し、ポルトガルはゴア（1510）・マラッカ（1511）・マカオ（1557）を結ぶ拠点の網（「海の帝国」）を築いた。スペインはマニラ（1571）とアメリカ大陸の銀を結び、明は海禁をゆるめ（1567）、日本の銀も流れ込んだ。倭寇・南蛮貿易・朱印船貿易と日本町もこの時代である。17 世紀にはオランダがバタヴィア（1619）を拠点に香辛料を独占し、日本の「鎖国」（1639）・明清交代で時代は終わりに向かった。
  source: "https://ja.wikipedia.org/wiki/大航海時代"
