  text: ムガル帝国の宮廷で、ペルシアの文化とインドの伝統が融合した。フマーユーンがイランから連れてきたミール・サイイド・アリー・アブドゥッサマド（ビフザードに代表されるイランの細密画の流れをくむ画家）のもとで、インドの画家たちが工房で写本の挿絵を描き（ムガル絵画）、ペルシア語が公用語となり、北インドの言葉と混ざってウルドゥー語が生まれた。シャー・ジャハーンが亡き妃のために造ったタージ＝マハルは、インド＝イスラーム建築の代表である。デカンのビジャープル・ゴールコンダでも独自の建築・絵画が栄えた。
