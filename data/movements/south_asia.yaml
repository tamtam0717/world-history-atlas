  text: ナーナク（1469–1539）がヒンドゥー教のバクティとイスラームのスーフィズムの影響のもとに開いた一神教。偶像崇拝とカーストを否定する。ムガル帝国の迫害（第9代グルの処刑、1675）に対し、第10代グルのゴービンド＝シングが 1699 年に信徒の共同体カールサーを結成して武装し、18 世紀にはシク教徒の軍事集団（ミスル）がパンジャーブを支配して、ランジート＝シングのシク王国（1799–1849）が生まれた。印パ分離でパキスタン側のシク教徒はインドへ移り、1984 年には自治を求める運動と政府の衝突（黄金寺院事件）が起きた。
  source: "https://ja.wikipedia.org/wiki/シク教"

