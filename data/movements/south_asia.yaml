  text: 1885 年にイギリスの協力のもとで生まれたインド国民会議は、当初は穏健な請願の団体だったが、1905 年のベンガル分割令をきっかけに、ティラクらの急進派のもとで英貨排斥・スワデーシ（国産品愛用）・スワラージ（自治）・民族教育の4綱領を掲げた（1906 年カルカッタ大会）。第一次世界大戦後はガンディーの指導で大衆運動となり、1929 年のラホール大会で完全独立（プールナ・スワラージ）を決議した。1947 年にインドとパキスタンが分かれて独立した。
