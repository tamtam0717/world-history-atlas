  text: 「真理の把握」を意味するサティヤーグラハは、暴力を使わずに不正な法や命令に従わないことで相手の良心に訴える抵抗の方法。ガンディーが南アフリカのインド人の差別撤廃運動（1906–）で始め、インドでは非協力運動（1920–22）、塩の行進（1930）、「インドを立ち去れ」運動（1942）で民衆を動員した。チャルカー（糸車）による手紡ぎを奨励し、不可触民の差別やヒンドゥーとムスリムの対立にも取り組んだ。アメリカの公民権運動（キング牧師）など、世界の非暴力の運動に影響を与えた。
  source: "https://ja.wikipedia.org/wiki/サティヤーグラハ"

