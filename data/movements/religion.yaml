  people: [ツヴィングリ, カルヴァン, ベーズ, ノックス]
  works: [『キリスト教綱要』, 『ハイデルベルク信仰問答』]
  events: [ツヴィングリの宗教改革, カルヴァンのジュネーヴ改革, 聖像破壊運動（ネーデルラント）, スコットランドの宗教改革, ハイデルベルク信仰問答, ナントの王令, ドルトレヒト会議とオルデンバルネフェルトの処刑]
  text: スイスのツヴィングリとジュネーヴのカルヴァンが進めた宗教改革。神の救いはあらかじめ定められているとする予定説を説き、勤勉な職業生活を肯定したので、商工業者に広まった。長老制の教会を作り、フランス（ユグノー）・ネーデルラント（ゴイセン）・スコットランド（プレスビテリアン）・イングランド（ピューリタン）・ハンガリーなどに広がり、各地で君主の支配への抵抗とも結びついた。
  source: "https://ja.wikipedia.org/wiki/カルヴァン主義"
