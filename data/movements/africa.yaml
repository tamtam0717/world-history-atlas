  text: イギリスのケープ植民地の支配と奴隷制の廃止（1834）に反発したオランダ系のボーア人（アフリカーナー）が、1835 年から内陸へ集団で移住した動き。ズールー王国と戦い（ブラッド・リヴァーの戦い）、ナタール共和国・トランスヴァール（南アフリカ共和国）・オレンジ自由国を建てた。ダイヤモンドと金の発見の後、イギリスとの南アフリカ戦争（1899–1902）に敗れて併合されたが、アフリカーナーの民族意識はのちのアパルトヘイトの政治につながった。
