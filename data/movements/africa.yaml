  text: 宣教師の教会から独立して、アフリカ人自身が指導し、アフリカの文化（癒し・預言・歌と踊り）を取り入れた教会の運動。19 世紀末の南アフリカの「エチオピア主義」の教会に始まり、シオン派（ZCC など）・ナザレ教会（シェンベ）、コンゴのキンバング教会（1921）、西アフリカの預言者ハリスの運動・アラドゥラ教会などが広がった。植民地支配への抵抗とも結びつき、今日では南部アフリカで最大のキリスト教の集団になっている。
