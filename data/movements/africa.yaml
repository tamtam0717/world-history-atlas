  text: 南アフリカの国民党政権（1948–）が進めた人種隔離政策（アパルトヘイト）に反対した運動。アフリカ民族会議（ANC）は自由憲章（1955）を掲げたが、シャープビル事件（1960）の後に非合法化され、マンデラは終身刑を受けた。ソウェト蜂起（1976）・黒人意識運動を経て、国際的な経済制裁・スポーツ交流の断絶が強まり、1990 年にマンデラが釈放され、1994 年の全人種選挙でマンデラが大統領になった。
