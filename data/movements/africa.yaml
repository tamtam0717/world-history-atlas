  text: ベルリン会議（1884–85）の後の「アフリカ分割」に対し、アフリカの諸国家・人々が武力で抵抗した動き。エチオピアはアドワの戦い（1896）でイタリア軍を破って独立を守った。サモリ・トゥーレのワスル帝国、アシャンティ、ショナ・ンデベレの蜂起（チムレンガ）、ドイツ領東アフリカのマジ・マジ反乱（1905–07）、ヘレロ・ナマの蜂起は鎮圧され、多くの犠牲を出した。1914 年までにアフリカで独立を保ったのはエチオピアとリベリアだけになった。
