  text: 19 世紀初め、シャカのズールー王国の拡大をきっかけに南部アフリカで起きた戦乱と大移動。追われた集団が次々に周りの人々を襲い、ンデベレ人（ムジリカジ）はジンバブエへ、ンゴニ人はマラウイ・タンザニアへ、マコロロ人はザンベジ川上流へ移った。一方でモシェシュのソト王国（レソト）やスワジ王国のように、避難民を集めて新しい国が生まれた。ボーア人のグレート・トレックはこの混乱の直後に進められた。
