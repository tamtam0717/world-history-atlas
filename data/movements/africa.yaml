  text: 19 世紀、オマーンのサイイド・サイードが都をザンジバルに移すと、丁子のプランテーションと、象牙・奴隷を求める隊商交易が東アフリカの内陸へ広がった。スワヒリ・アラブ商人の隊商はタボラ・ウジジを経てコンゴ東部（ティップ・ティプ）や大湖地方、ニヤサ湖まで進み、スワヒリ語とイスラームを内陸に広めた。リヴィングストンらが奴隷貿易の惨状を伝え、イギリスの圧力で 1873 年にザンジバルの奴隷市場は閉鎖された。
  source: "https://ja.wikipedia.org/wiki/ザンジバル・スルタン国"

