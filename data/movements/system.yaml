  text: 大航海時代に、ヨーロッパの商業の中心が地中海（イタリア諸都市）から大西洋岸（リスボン・セビリャ・アントウェルペン、のちアムステルダム・ロンドン）に移った変化（商業革命）。アメリカ大陸の銀が大量に流れ込んで物価が上がり（価格革命）、南ドイツのフッガー家などの大商人が栄える一方、地代に頼る領主層が力を失った。
