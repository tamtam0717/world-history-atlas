  text: 15世紀後半から17世紀前半にかけて、ポルトガルとスペインを先頭に、ヨーロッパの国々がアジアの香辛料や新しい土地を求めて外洋に乗り出した時代。インド航路の開拓とアメリカ大陸への到達で世界の諸地域が海で結ばれ、ヨーロッパの商業の中心は地中海から大西洋岸へ移った（商業革命）。のちにオランダ・イギリス・フランスが加わった。
  source: "https://ja.wikipedia.org/wiki/大航海時代"

