  people: [ウィリアム3世, ウォルポール, ピット（小）, ディズレーリ, グラッドストン]
  works: [権利の章典]
  events: [王政復古, 名誉革命, グレートブリテン王国の成立, ハノーヴァー朝の始まり, ウォルポール内閣の成立, ノルウェー憲法とスウェーデンとの同君連合]
  text: 名誉革命と権利の章典によって議会主権が確立したイギリスの政治体制。「王は君臨すれども統治せず」とされ、ウォルポールのもとで内閣が議会に責任を負う責任内閣制が始まった。19世紀には選挙法改正で選挙権が広がり、保守党と自由党の二大政党が交代で政権を担った（ディズレーリ・グラッドストン）。議院内閣制はベルギー・オランダ・フランス第三共和政・北欧などにも広がった。第一次世界大戦後に多くの国が議会制民主主義を採用したが、世界恐慌のなかでイタリア・ドイツなどでは独裁に取って代わられた。第二次世界大戦後に西欧で定着し、1970年代に南欧、1989年以降に東欧へ広がった。
  source: "https://ja.wikipedia.org/wiki/議院内閣制"

