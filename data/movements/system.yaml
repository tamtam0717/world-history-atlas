  text: マルクス主義にもとづき、共産党の一党独裁のもとで土地・工場を国有化し、国家の計画で経済を動かす体制。ロシア革命で生まれ、スターリンの時代に五か年計画・農業集団化と大規模な粛清をともなって確立した。第二次世界大戦後は東欧・中国・北朝鮮などに広がったが、経済の停滞と自由への要求から、1989年の東欧革命と1991年のソ連解体で崩れた。中国（改革開放で市場経済を取り入れた）・北朝鮮・ベトナム・キューバなどでは、その後も共産党の一党支配が続いている。
