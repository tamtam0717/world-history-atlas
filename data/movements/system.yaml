  text: 第一次世界大戦後のイタリアでムッソリーニが始めた、議会制民主主義と共産主義の両方を否定し、強い指導者と一党独裁、国家への全体の奉仕、対外膨張をかかげる運動と体制。世界恐慌後にヨーロッパ各地に広がった。オーストリアのドルフス・シュシュニクの体制（オーストロ・ファシズム、1934–38）、ギリシアのメタクサス体制（1936–41）、スロヴァキア国（1939–45）なども影響を受けた。スペインのフランコやポルトガルのサラザールの独裁はファシズムに近い権威主義体制とされ、第二次世界大戦後も1970年代まで続いた。日本でも満洲事変（1931）の後、五・一五事件・二・二六事件を経て軍部が政治の主導権を握り、国家総動員法（1938）・大政翼賛会（1940）で戦時の体制がつくられ、日独伊三国同盟（1940）で枢軸国の一員となった（軍国主義・超国家主義）。
