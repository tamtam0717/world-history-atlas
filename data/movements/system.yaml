  text: 1870年代の大不況の後、列強が資源・市場・投資先を求めて、アジア・アフリカを武力で植民地や勢力圏に分割した動き。イギリスの3C政策、フランスのアフリカ横断政策、ドイツの3B政策などが衝突し、列強の対立は第一次世界大戦へつながった。社会進化論や「文明化の使命」が支配を正当化した。第一次世界大戦後も英仏は委任統治領を加えて植民地帝国を保ったが、第二次世界大戦後の脱植民地化で1960年代までにほぼ解体した。
