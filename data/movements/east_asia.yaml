# 潮流：東アジア（1648–2025）。形式は docs/movements-format.md
# spread はふつう政体で書く（qing・roc・prc・japan・joseon など）。ただし政体で書くと、その年の領域全体（藩部・植民地を含む）が光る。
# - 清の学問・改革（考証学・洋務運動・変法運動など）は、藩部（モンゴル・チベット・新疆・青海）や台湾を光らせないよう、
#   中国本土と満洲の政治の地域（data/regions/china.yaml）を regions で書く。一覧は考証学の項目で &china_proper として一度だけ書き、
#   ほかの項目では *china_proper で参照する（YAML のアンカー。同じファイルの中でだけ使える）。
#   一覧は、2026-11-21 の時点で中国本土・満洲のピースを持つ政治の地域から、チベット系の地域（アバ・カンゼ・甘南・迪慶）を除いたもの。
#   data/regions/china.yaml の地域 ID を変えたら、ここも直す（npm run data で「未定義の地域」の警告が出る）。
# - 日本の国内の運動（文明開化・大正デモクラシーなど）は、植民地（台湾・朝鮮・樺太）を光らせないよう、
#   日本本土の政治の地域（japan_main・hokkaido・okinawa）を regions で書く。

