  text: 文化大革命の後、鄧小平の指導で始まった経済改革と対外開放。人民公社を解体して農家の生産請負制を導入し、深圳などに経済特区を設けて外国資本を招いた。天安門事件（1989）で政治の民主化は抑えられたが、南巡講話（1992）で「社会主義市場経済」が掲げられ、WTO 加盟（2001）を経て中国は「世界の工場」となり、2010年に GDP で世界第2位になった。
