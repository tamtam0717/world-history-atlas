  text: 農民を主力とする革命と農村の根拠地を重んじた毛沢東の思想と、それにもとづく中華人民共和国の社会主義建設。土地改革・第1次五か年計画の後、大躍進政策（1958–60）と人民公社化で数千万人の餓死者を出した。1966年からの文化大革命では紅衛兵が「走資派」とされた劉少奇・鄧小平らを攻撃し、伝統文化が破壊され、社会は大混乱した。毛沢東の死と四人組の逮捕（1976）で終わった。
