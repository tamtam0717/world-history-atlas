  text: 孫文が唱えた民族主義・民権主義・民生主義。1905年に東京で中国同盟会を結成し、辛亥革命（1911）で清を倒した。孫文は中国国民党を改組して「連ソ・容共・扶助工農」を掲げ（1924）、その死後、蔣介石の国民政府が北伐で中国を統一して三民主義を国是とした。1949年以後は台湾の中華民国に受け継がれた。
  source: "https://ja.wikipedia.org/wiki/三民主義"

