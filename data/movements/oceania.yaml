  text: 第二次世界大戦後、アメリカはマーシャル諸島のビキニ・エニウェトク環礁（1946–58）、イギリスはオーストラリアのモンテベロ諸島・マラリンガ（1952–63）とクリスマス島（1957–62）、フランスはフランス領ポリネシアのムルロア・ファンガタウファ環礁（1966–96）で核実験を行い、島民の移住や被曝を引き起こした。1954 年のビキニ水爆実験では日本の第五福竜丸も被曝した。反対運動は太平洋全体に広がり、1985 年に南太平洋非核地帯条約（ラロトンガ条約）が結ばれた。同年、フランスの情報機関がオークランド港でグリーンピースの船レインボー・ウォーリア号を爆破し、ニュージーランドは 1987 年に非核法を定めて核艦船の寄港を拒んだ。フランスの最後の実験（1995–96）にはパペーテで暴動が起きた。
  source: "https://ja.wikipedia.org/wiki/ラロトンガ条約"
