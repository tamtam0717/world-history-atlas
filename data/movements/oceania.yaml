  text: 太平洋の島々の独立は、アジア・アフリカより遅れて 1960〜80 年代に進んだ。ニュージーランドの委任統治下の西サモアでは 1920〜30 年代にマウ運動が起こり、1962 年に太平洋の島々で最初に独立した。続いてナウル（1968）・フィジー（1970）・パプアニューギニア（1975）・ソロモン諸島（1978）・ツバル（1978）・キリバス（1979）・ヴァヌアツ（1980）が独立し、アメリカの信託統治領はマーシャル諸島・ミクロネシア連邦（1986）・パラオ（1994）が自由連合のもとで独立した。クック諸島・ニウエはニュージーランドとの自由連合を選んだ。フランス領のニューカレドニアではカナクの独立運動が続き、ブーゲンヴィルは 2019 年の住民投票で独立を選んだ。
  source: "https://en.wikipedia.org/wiki/Decolonisation_of_Oceania"

