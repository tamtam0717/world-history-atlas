# 潮流：オセアニア（O3 担当、2026-11-23）。形式は docs/movements-format.md。
# 植民地の時代のオーストラリア・ニュージーランド・太平洋の島々は、政体で書くとイギリス・フランスなどの本国しか光らないので、
# 多くは iso・adm1（現代の国・州のピース）で書いた。連邦・自治領・独立国の成立後のものは政体（australia・new_zealand など）でもよいが、
# 年によって所属が変わらない地域なので iso で統一している。
# 既存の潮流（帝国主義・女性参政権・ヨーロッパからの大移民・総力戦・冷戦・脱植民地化・移民と多文化社会）にもオセアニアの spread を足している。

