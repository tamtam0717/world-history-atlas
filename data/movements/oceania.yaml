  text: 1797 年のロンドン伝道協会のタヒチ伝道に始まり、プロテスタント（会衆派・メソジスト・長老派・聖公会・ルター派）とカトリック（マリスト会・ピクプス会・聖心会など）の宣教師が太平洋の島々に広がった。ポリネシアではタヒチのポマレ 2 世・トンガのトゥポウ 1 世・フィジーのザコンバウら首長の改宗とともに 19 世紀前半〜半ばに島ぐるみでキリスト教化し、教会は政治や法（「宣教師の法」）にも深くかかわった。メラネシアでは改宗は 19 世紀後半〜20 世紀になり、ニューギニア高地では 1950〜70 年代だった。サモア人・フィジー人・トンガ人などの島民の伝道者が多く働いた。伝道は識字と聖書の翻訳を広めたが、伝統の文化を否定することも多かった。
  source: "https://en.wikipedia.org/wiki/Christianity_in_Oceania"

