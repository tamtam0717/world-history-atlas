  text: アメリカ独立で流刑先を失ったイギリスは、1788 年からオーストラリアに囚人を送り、植民地を開いた。1868 年までに約 16 万人が送られ、刑期を終えた元囚人（エマンシピスト）と自由移民が植民地社会をつくった。重罪犯はノーフォーク島・ポート・アーサー（タスマニア）・モートン湾に送られた。自由移民の植民地の成長と反対運動で、ニューサウスウェールズへの流刑は 1840 年、タスマニアへは 1853 年に終わり、最後は西オーストラリア（1850–68）だった。植民地の拡大は、先住民の土地の収奪と暴力をともなった。
  source: "https://ja.wikipedia.org/wiki/流刑植民地"

