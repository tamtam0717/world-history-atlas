  text: オーストラリアで、アジア系・太平洋島民の移民を制限し「白人のオーストラリア」を保とうとした政策。ゴールドラッシュ期の中国人排斥（ヴィクトリア 1855）に始まり、1901 年の連邦成立直後の移民制限法（ヨーロッパ言語の書き取り試験）で国の方針となった。パリ講和会議では、日本の人種差別撤廃案にヒューズ首相が強く反対した。第二次世界大戦後の大量移民計画で南欧・東欧の移民を受け入れ、1966 年に緩められ、1973 年のホイットラム政権で撤廃されて多文化主義へ転じた。ニュージーランドも中国人に人頭税（1881）を課した。
  source: "https://ja.wikipedia.org/wiki/白豪主義"

