  events: [先住民に関する憲法改正の国民投票, マボ判決, 「盗まれた世代」への公式の謝罪, 「先住民の声」の国民投票が否決される]
  text: オーストラリアの先住民（アボリジニとトレス海峡諸島民）が、市民としての権利と土地の権利を求めた運動。入植 150 年の 1938 年 1 月 26 日を「追悼の日」とした抗議に始まり、1965 年の「フリーダム・ライド」、1966 年のグリンジ人のウェーヴ・ヒルでのストライキ、1967 年の国民投票（先住民を国勢調査に数え、連邦が先住民のための法を作れるようにした）、1972 年のキャンベラの「アボリジニ・テント大使館」と続いた。1976 年の先住民土地権法（ノーザンテリトリー）、1992 年のマボ判決（先住権原の承認）、家族から引き離された「盗まれた世代」への連邦政府の公式の謝罪（2008）が実現した。2023 年の「先住民の声」を憲法に定める国民投票は否決された。
  source: "https://ja.wikipedia.org/wiki/アボリジニ"

