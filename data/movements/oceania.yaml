  text: ワイタンギ条約（1840）の後、入植者への土地の売却に反対するマオリの諸部族は、1858 年に王を立てる王運動（キーンギタンガ）を起こし、マオリ戦争（1845–72）を戦った。敗れて土地を没収された後も、テ・コオティのリンガトゥ、テ・フィティのパリハカの非暴力の抵抗、20 世紀のラタナ運動などが続いた。1970 年代からは都市に移ったマオリの若者を中心に「マオリ・ルネサンス」が起こり、土地の行進（1975）・バスティオン・ポイントの占拠（1977–78）を経て、ワイタンギ審判所（1975）による条約違反の調査と賠償、マオリ語の公用語化（1987）、マオリ語の幼児教育（コハンガ・レオ）が進んだ。
  source: "https://ja.wikipedia.org/wiki/マオリ王運動"

