  text: 19 世紀後半のオーストラリア・ニュージーランドでは、ヨーロッパより早く民主的な制度と社会政策が実現し、「社会の実験室」と呼ばれた。ヴィクトリア・南オーストラリアは 1856 年に秘密投票（「オーストラリア式投票」）と男性の普通選挙を導入し、8 時間労働も広まった。ニュージーランドは 1867 年にマオリの議席を設け、1893 年に世界で初めて国政で女性参政権を認めた（ケイト・シェパードの署名運動）。セドン政権の老齢年金（1898）、労働争議の強制仲裁、1904 年にはオーストラリアで世界初の労働党政権が生まれた。ただし先住民の選挙権は長く制限された（オーストラリア連邦の選挙で全面的に認められたのは 1962 年）。
  source: "https://ja.wikipedia.org/wiki/女性参政権"

