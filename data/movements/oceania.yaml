  text: 1851 年にニューサウスウェールズとヴィクトリアで金が発見されると、イギリス・アイルランド・中国・アメリカなどから人々が押し寄せ、オーストラリアの人口は 10 年で約 3 倍になった。採掘許可料に反対する鉱夫のユリーカ砦の反乱（1854）は、普通選挙や秘密投票の導入につながった。ゴールドラッシュはニュージーランドのオタゴ（1861）・西海岸（1864）、クイーンズランド、西オーストラリア（1890 年代）へと続いた。一方、中国人の鉱夫に対する暴動と入国制限は、のちの白豪主義のもとになった。
  source: "https://ja.wikipedia.org/wiki/ゴールドラッシュ"

