  text: 言語や文化を共有する「国民」が国家の主人公であるという考え方。フランス革命の国民軍がその力を示し、ナポレオンの支配への抵抗の中で各地に広がった。19世紀には、ウィーン体制に抗してギリシア・ベルギーが独立し、1848年革命（諸国民の春）を経て、イタリア（1861年）とドイツ（1871年）が統一された。一方、多民族国家のオーストリアやオスマン帝国では民族の自立を求める運動が強まり、19世紀末には排外的な愛国主義も生んだ。20世紀には、第一次世界大戦後に民族自決の原則で東欧に多くの国民国家が生まれ、ファシズムなどの排外的なナショナリズムも広がった。冷戦の終わりには、ソ連・ユーゴスラヴィアの解体とともに再び高まった。
  source: "https://ja.wikipedia.org/wiki/ナショナリズム"

