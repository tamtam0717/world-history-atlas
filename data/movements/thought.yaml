  works: [フィヒテ「ドイツ国民に告ぐ」]
  events: [フランス革命戦争はじまる・第一共和政, コシチュシコの蜂起, スペイン反乱（半島戦争）, フィヒテ「ドイツ国民に告ぐ」, チロル蜂起, プロイセンの対仏宣戦（解放戦争）, ライプツィヒの戦い（諸国民戦争）, 第一次セルビア蜂起, ギリシア独立戦争はじまる, 七月革命, 1848年革命（諸国民の春）, イタリア王国の成立, ドイツ帝国の成立, ベルリン会議（ベルリン条約）, サライェヴォ事件, 三・一独立運動, 五・四運動]
  text: 言語や文化を共有する「国民」が国家の主人公であるという考え方。フランス革命の国民軍がその力を示し、ナポレオンの支配への抵抗の中で各地に広がった。19世紀には、ウィーン体制に抗してギリシア・ベルギーが独立し、1848年革命（諸国民の春）を経て、イタリア（1861年）とドイツ（1871年）が統一された。一方、多民族国家のオーストリアやオスマン帝国では民族の自立を求める運動が強まり、19世紀末には排外的な愛国主義も生んだ。東アジアでは、列強の進出と日本の支配に抗して、中国の変法・革命運動や朝鮮の義兵闘争が起こった。20世紀には、第一次世界大戦後に民族自決の原則で東欧に多くの国民国家が生まれ、朝鮮の三・一独立運動や中国の五・四運動（1919）など、アジアでも反帝国主義の民族運動が高まり、ファシズムなどの排外的なナショナリズムも広がった。冷戦の終わりには、ソ連・ユーゴスラヴィアの解体とともに再び高まった。21世紀のロシアでは大国としての復活をめざすナショナリズムが強まり、2014年のクリミア併合と2022年のウクライナ侵攻につながった。
  source: "https://ja.wikipedia.org/wiki/ナショナリズム"

