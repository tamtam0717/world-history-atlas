  text: 産業革命が生んだ貧困や格差を、協同組合や理想の共同体によって解決しようとした思想。オーウェンはニューラナークの工場で労働条件の改善を試み、フランスではサン＝シモンやフーリエが新しい社会を構想した。マルクスとエンゲルスはこれを「空想的」と呼んだ。
  source: "https://ja.wikipedia.org/wiki/空想的社会主義"

