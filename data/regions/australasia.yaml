# O1 オーストラリア・ニュージーランド（AUS・NZL・NFK・CXR・CCK・HMD・ATA）の地域と所属の変遷（1648–2025）。
# 方針：植民地の中心（首府のあるピース）は植民地の設置の年から britain（certainty なし）＋label。
# 主張だけで入植・行政が及んでいない所は britain の nominal（斜線）。
# 1788 年のニューサウスウェールズの主張は東経135度以東（ケープ・ヨークからタスマニアの南端まで）、1825 年に東経129度まで広げた。
# 1829 年のスワン川植民地の設置で、東経129度以西（西オーストラリア）もイギリスが主張した。
# どの国の主張も及ばない所（1788 年より前のオーストラリア、1840 年より前のニュージーランド）は owner なし（アボリジニ・マオリの土地）。
# 1901 年からオーストラリア連邦（australia）、1907 年からニュージーランド自治領（new_zealand）。
# ピースの分け方（東経135度・132度・141度、トレス海峡、オールバニ、ワイカト盆地、ロヘ・ポタエなど）は tools/pieces_config.json の _why を参照。

# ================================================================ オーストラリア東部
- id: au_new_south_wales
  name: ニューサウスウェールズ
  select:
    pieces: [AUS-New_South_Wales]
  timeline:
    - from: 1453
      owner: null
      note: アボリジニの土地。どの国の主張も及んでいない
    - from: 1770
      owner: britain
      certainty: nominal
      label: ニューサウスウェールズ（クックの領有宣言）
      cause: クックがボタニー湾に上陸し、東海岸をニューサウスウェールズと名づけてイギリスの領有を宣言する
      source: "https://ja.wikipedia.org/wiki/ジェームズ・クック"
    - from: 1788
      owner: britain
      label: ニューサウスウェールズ
      cause: フィリップ総督の第1船団がシドニー湾に着き、流刑植民地ニューサウスウェールズを開く（1月26日）
      note: 入植地はシドニーの周りだけで、ブルー・マウンテンズ（1813年に横断）の西に広がるのは1810年代以降。植民地の中心なのでピース全体を濃く塗る
      source: "https://ja.wikipedia.org/wiki/ニューサウスウェールズ州の歴史"
    - from: 1901
      owner: australia
      cause: オーストラリア連邦の成立。ニューサウスウェールズ州となる
      source: "https://ja.wikipedia.org/wiki/オーストラリア連邦"

