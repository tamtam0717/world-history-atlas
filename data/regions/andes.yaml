# アンコン条約後のタクナ・タラタのチリの管理（1884–1929/1925）は chile・uncertain。
# パナマ地峡（PAN）は A3 の担当（1821–30 は gran_colombia、1831–1903 は colombia で塗る約束）。

- id: col_bogota
  name: "ボゴタ・クンディナマルカ"
  select:
    pieces: [COL-Bogota_Capital_District, COL-Cundinamarca]
  timeline:
    - from: 1648
      owner: "spain"
      label: "ヌエバ・グラナダ（ペルー副王領）"
      note: "スペイン領。サンタフェ・デ・ボゴタの聴訴院（アウディエンシア）が治め、ペルー副王に属した"
      source: "https://ja.wikipedia.org/wiki/ヌエバ・グラナダ副王領"
    - from: 1717
      owner: "spain"
      label: "ヌエバ・グラナダ副王領"
      cause: "ヌエバ・グラナダ副王領が置かれる（1723年にいったん廃止）"
      source: "https://ja.wikipedia.org/wiki/ヌエバ・グラナダ副王領"
    - from: 1723
      owner: "spain"
      label: "ヌエバ・グラナダ（ペルー副王領）"
      cause: "ヌエバ・グラナダ副王領がいったん廃止され、ペルー副王領に戻る"
    - from: 1739
      owner: "spain"
      label: "ヌエバ・グラナダ副王領"
      cause: "ヌエバ・グラナダ副王領が再び置かれる（ボゴタが都）"
      source: "https://ja.wikipedia.org/wiki/ヌエバ・グラナダ副王領"
    - from: 1810
      owner: "spain"
      certainty: "uncertain"
      label: "ヌエバ・グラナダ（諸都市の評議会）"
      cause: "7月20日、ボゴタで評議会（フンタ）が副王を退ける。各地の都市も評議会を作る（名目上はフェルナンド7世に忠誠）"
      source: "https://ja.wikipedia.org/wiki/コロンビア独立宣言"
    - from: 1811
      owner: "cundinamarca"
      cause: "クンディナマルカ国が成立する（ナリーニョ）。連合州に加わらず、連邦派と内戦になる"
      source: "https://en.wikipedia.org/wiki/Free_and_Independent_State_of_Cundinamarca"
    - from: 1814
      owner: "new_granada_united"
      cause: "ボリバルの率いる連合州の軍がボゴタを占め、クンディナマルカが連合州に加わる（12月）"
      source: "https://en.wikipedia.org/wiki/United_Provinces_of_New_Granada"
    - from: 1816
      owner: "spain"
      label: "ヌエバ・グラナダ副王領"
      cause: "モリーリョの遠征軍が独立派を破り、ボゴタに入る（5月）"
      source: "https://en.wikipedia.org/wiki/Spanish_reconquest_of_New_Granada"
    - from: 1819
      owner: "gran_colombia"
      cause: "ボヤカの戦い（8月7日）でボリバルが勝ち、ボゴタを解放。12月にアンゴストゥーラ会議がコロンビア共和国（大コロンビア）の成立を宣言"
      source: "https://ja.wikipedia.org/wiki/ボヤカの戦い"
    - from: 1831
      owner: "colombia"
      cause: "大コロンビアが解体し、ヌエバ・グラナダ共和国となる（11月）"
      source: "https://ja.wikipedia.org/wiki/大コロンビア"

