# F1 西アフリカ（MRT・SEN・GMB・GNB・GIN・SLE・LBR・MLI・BFA・CIV・NER・CPV）の地域と所属の変遷（1648–2025）
# scratchpad/f1/gen_regions.py で生成した（各ピースはちょうど1つの地域に属する）。手で直してもよい。
# ヨーロッパの担当（data/regions/west.yaml の western_sahara・mali_north）が持つ zone=eu のピース（MRT-Bir_Moghrein・MRT-Zoueratt）は含めない。
#   MLI-Tombouctou は 1893 年までをこのファイルの mli_timbuktu で描く（1894 年からは west.yaml の mali_north が優先される）。
# フランス領は、在地の国家の征服・保護条約から濃く塗る。勢力圏だけの奥地（砂漠・森林）は certainty: nominal。
# フランス領西アフリカの各植民地は label に時期の名前（セネガル植民地、フランス領スーダン、上セネガル・ニジェール、オートボルタ など）。
# 在地の小さな首長国・国家を作らなかった人々の地は owner なし（note に説明）。範囲のあいまいな国家は uncertain。

- id: mrt_trarza
  name: "トラルザ（モーリタニア南西部）"
  select:
    pieces: [MRT-Trarza, MRT-Nouakchott]
  timeline:
    - from: 1648
      owner: "trarza"
      note: "セネガル川下流の北岸のムーア人の首長国。アラビアゴムの交易でサン＝ルイのフランス人と結んだ"
      source: "https://en.wikipedia.org/wiki/Emirate_of_Trarza"
    - from: 1903
      owner: "france"
      label: "モーリタニア（フランスの保護領）"
      cause: "コッポラーニの「平和的征服」でトラルザがフランスの保護下に入る（1902–03）"
      source: "https://en.wikipedia.org/wiki/Xavier_Coppolani"
    - from: 1904
      owner: "france"
      label: "モーリタニア民政地域"
      cause: "モーリタニア民政地域の設置"
      source: "https://en.wikipedia.org/wiki/Colonial_Mauritania"
    - from: 1920
      owner: "france"
      label: "モーリタニア植民地（フランス領西アフリカ）"
      cause: "モーリタニア植民地の設置"
      source: "https://en.wikipedia.org/wiki/Colonial_Mauritania"
    - from: 1940
      owner: "vichy_france"
      label: "モーリタニア植民地（フランス領西アフリカ）"
      cause: "フランスの降伏。フランス領西アフリカはヴィシー政府に従う（9月、ダカールで自由フランスとイギリスの軍を退ける）"
      source: "https://ja.wikipedia.org/wiki/ダカール沖海戦"
    - from: 1942
      owner: "france"
      label: "モーリタニア植民地（フランス領西アフリカ）"
      cause: "連合軍の北アフリカ上陸（トーチ作戦）の後、フランス領西アフリカが連合国側に移る（11月）"
      source: "https://ja.wikipedia.org/wiki/フランス領西アフリカ"
    - from: 1958
      owner: "france"
      label: "モーリタニア（フランス共同体の自治共和国）"
      cause: "フランス共同体の発足（国民投票で自治共和国となる）"
      source: "https://ja.wikipedia.org/wiki/フランス共同体"
    - from: 1960
      owner: "mauritania"
      cause: "モーリタニアの独立（11月）"
      source: "https://ja.wikipedia.org/wiki/モーリタニア"

