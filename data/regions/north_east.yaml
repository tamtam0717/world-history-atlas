- id: schleswig_dk
  name: 北シュレースヴィヒ
  select:
    pieces: [DNK-Aabenraa, DNK-Haderslev, DNK-Snderborg, DNK-Tnder]
  timeline:
    - from: 1648
      owner: denmark
      note: "シュレースヴィヒ公国（帝国外）。1713/1720年まではゴットルプ家の持ち分が散在（地図では省略）"
    - from: 1864
      owner: prussia
      certainty: uncertain
      cause: "デンマーク戦争（第2次シュレースヴィヒ戦争）に敗れたデンマークが、ウィーン条約でシュレースヴィヒをプロイセン・オーストリアに割譲"
      source: "https://ja.wikipedia.org/wiki/第二次シュレースヴィヒ＝ホルシュタイン戦争"
      note: "プロイセン・オーストリアの共同管理。割譲のとき、王国の飛び地とエーロ島などの交換があった（地図では省略）"
    - from: 1865
      owner: prussia
      certainty: uncertain
      cause: "ガスタイン協定（主権は共同のまま、シュレースヴィヒはプロイセンが管理）"
      source: "https://ja.wikipedia.org/wiki/ガシュタイン協定"
    - from: 1866
      owner: prussia
      cause: "普墺戦争後のプラハ条約でプロイセンに併合（北部の住民投票の条項は1878年に削除）"
      source: "https://ja.wikipedia.org/wiki/プラハ条約_(1866年)"
    - from: 1867
      owner: prussia
      overlord: north_german_confederation
      cause: "北ドイツ連邦の成立"
      source: "https://ja.wikipedia.org/wiki/北ドイツ連邦"
    - from: 1871
      owner: german_empire
      cause: "ドイツ帝国の成立"
      source: "https://ja.wikipedia.org/wiki/ドイツ帝国"
      note: "プロイセン王国シュレースヴィヒ＝ホルシュタイン州（ドイツ帝国の構成国）。1920年の住民投票でデンマークに戻る"
    - from: 1918
      owner: germany
      cause: "ドイツ革命で帝政が倒れ、共和国となる（11月）"
      source: "https://ja.wikipedia.org/wiki/ドイツ革命"
    - from: 1920
      owner: denmark
      cause: "住民投票の結果、北シュレースヴィヒがデンマークに復帰"
      source: "https://ja.wikipedia.org/wiki/シュレースヴィヒ住民投票"
    - from: 1940
      owner: germany
      certainty: occupied
      label: "デンマーク（ドイツ占領）"
      cause: "ドイツ軍がデンマークを占領（4月9日、ヴェーザー演習作戦）"
      source: "https://ja.wikipedia.org/wiki/ヴェーザー演習作戦"
    - from: 1945
      owner: denmark
      cause: "ドイツの降伏で占領が終わる（5月）"
      source: "https://ja.wikipedia.org/wiki/デンマークの歴史"

