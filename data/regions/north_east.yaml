    # ---- 1648– ----
    - from: 1648
      owner: denmark
    - from: 1658
      owner: sweden
      cause: "ロスキレ条約でスウェーデンに割譲"
      source: "https://ja.wikipedia.org/wiki/ロスキレ条約"
    - from: 1660
      owner: denmark
      cause: "島民の反乱を受け、コペンハーゲン条約でデンマークに返還"
      source: "https://ja.wikipedia.org/wiki/コペンハーゲン条約_(1660年)"
    - from: 1940
      owner: germany
      certainty: occupied
      label: "デンマーク（ドイツの占領）"
      cause: "ドイツ軍がデンマークを占領（4月9日、ヴェーザー演習作戦）"
      source: "https://ja.wikipedia.org/wiki/ヴェーザー演習作戦"
    - from: 1945
      owner: soviet_union
      certainty: occupied
      label: "ボーンホルム島（ソ連軍が駐留）"
      cause: "ソ連軍がボーンホルム島のドイツ軍を降伏させて駐留（5月）"
      source: "https://en.wikipedia.org/wiki/Soviet_occupation_of_Bornholm"
    - from: 1946
      owner: denmark
      cause: "ソ連軍が撤退し、デンマークに返還（4月）"
      source: "https://en.wikipedia.org/wiki/Soviet_occupation_of_Bornholm"

- id: norway
  name: ノルウェー
  select:
    iso: [NOR]
  timeline:
    # ---- 1453–1647 ----
    - from: 1453
      owner: "norway"
      overlord: "kalmar_union"
      note: "ノルウェー王国（デンマーク王が王を兼ねるカルマル連合の一員。独自の国務院を持つ）"
    - from: 1523
      owner: "norway"
      cause: "スウェーデンの離脱でカルマル連合が解体。ノルウェーはデンマークとの同君連合として残る"
      source: "https://ja.wikipedia.org/wiki/カルマル同盟"
    - from: 1537
      owner: "denmark"
      cause: "伯爵戦争に勝ったクリスチャン3世がノルウェーの国務院を廃し、デンマーク王国の一部とする（宗教改革も導入）"
      source: "https://ja.wikipedia.org/wiki/デンマーク＝ノルウェー"
    # ---- 1648– ----
    - from: 1648
      owner: denmark
    - from: 1814
      owner: norway
      cause: "キール条約でデンマークがノルウェーを放棄。独立宣言の後、11月にスウェーデンと同君連合"
      source: "https://ja.wikipedia.org/wiki/キール条約"
    - from: 1905
      owner: norway
      cause: "スウェーデンとの同君連合を解消して完全に独立（カールスタード協定）"
      source: "https://ja.wikipedia.org/wiki/スウェーデン＝ノルウェー"
    - from: 1940
      owner: germany
      certainty: occupied
      label: "ノルウェー（ドイツの占領）"
      cause: "ドイツ軍がノルウェーを占領（4–6月）。国王と政府はロンドンに亡命し、クヴィスリングの傀儡政権が置かれた"
      source: "https://ja.wikipedia.org/wiki/ノルウェーの戦い"
    - from: 1945
      owner: norway
      cause: "ドイツ軍の降伏で解放（5月）"
      source: "https://ja.wikipedia.org/wiki/ノルウェーの歴史"

