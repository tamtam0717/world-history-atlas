- id: sweden
  name: スウェーデン本土
  note: "ゴットランド・イェムトランド・ヘリエダーレンは1645年ブレムセブルー条約でスウェーデン領"
  names:
    - {to: 1647, name: "スウェーデン"}
  select:
    iso: [SWE]
  timeline:
    # ---- 1453–1647 ----
    - from: 1453
      owner: "sweden"
      note: "カール8世（カール・クヌートソン）の王国。カルマル連合からの離脱をめぐり、連合王（デンマーク王）派と争った"
    - from: 1457
      owner: "sweden"
      overlord: "kalmar_union"
      cause: "カール8世が追われ、デンマーク王クリスチャン1世がスウェーデン王に選ばれる（カルマル連合の復活）"
      source: "https://ja.wikipedia.org/wiki/クリスチャン1世_(デンマーク王)"
    - from: 1464
      owner: "sweden"
      cause: "クリスチャン1世が追われ、カール8世が復位。以後は摂政ステン・ストゥーレ（大）らが連合王を認めずに国を治める"
      source: "https://ja.wikipedia.org/wiki/ステン・ストゥーレ_(大)"
    - from: 1497
      owner: "sweden"
      overlord: "kalmar_union"
      cause: "デンマーク王ハンスがスウェーデン王となる（カルマル連合の復活）"
      source: "https://ja.wikipedia.org/wiki/ハンス_(デンマーク王)"
    - from: 1501
      owner: "sweden"
      cause: "スウェーデン貴族がハンスに反乱。ステン・ストゥーレ（大）、続いてスヴァンテ・ニルソン、ステン・ストゥーレ（小）が摂政として治める"
      source: "https://ja.wikipedia.org/wiki/カルマル同盟"
    - from: 1520
      owner: "sweden"
      overlord: "kalmar_union"
      cause: "クリスチャン2世がスウェーデンを征服して王となり、反対派の貴族を処刑する（ストックホルムの血浴、11月）"
      source: "https://ja.wikipedia.org/wiki/ストックホルムの血浴"
    - from: 1521
      owner: "sweden"
      cause: "グスタフ・ヴァーサがダーラナで蜂起し、摂政となる（8月）。1523年に国王に選ばれ、スウェーデンはカルマル連合から離脱した"
      source: "https://ja.wikipedia.org/wiki/グスタフ1世_(スウェーデン王)"
    # ---- 1648– ----
    - from: 1648
      owner: sweden

