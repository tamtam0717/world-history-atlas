# ---------------------------------------------------------------- ボスニア・ヘルツェゴヴィナ
- id: bosnia_herzegovina
  name: ボスニア・ヘルツェゴヴィナ
  select:
    iso: [BIH]
  timeline:
    - from: 1878
      owner: habsburg
      certainty: occupied
      cause: ベルリン条約でオーストリア＝ハンガリーがボスニア・ヘルツェゴヴィナを占領し、行政権を得る（主権はオスマン帝国に残る）
