    - {from: 1918, owner: yugoslavia, cause: "セルビア王国を中心に南スラヴ人の国が合同し、セルブ＝クロアート＝スロヴェーン王国が成立（12月1日）", source: "https://ja.wikipedia.org/wiki/ユーゴスラビア王国"}
    - {from: 1941, owner: italy, certainty: occupied, label: "コソヴォ（イタリアの保護下のアルバニアに編入）", cause: "枢軸国のユーゴスラヴィア侵攻（4月）。アルバニア人の多い地域を、イタリアの保護下のアルバニアに編入", source: "https://en.wikipedia.org/wiki/Greater_Albania"}
