# 担当 E：バルカン・オスマン・中東の地域と所属の変遷（1648–1815 試作）
# 大きな地域でおおまかに書き、小さな地域で例外を上書きする（小さい地域が優先）。
# 小さな地域も 1648 年から書き始めているので、その期間は大きな地域より常に優先される。

# ================================================================ 基本：オスマン帝国の本土
- id: ottoman_core
  name: オスマン帝国の本土（バルカン・アナトリア・東地中海・イラク）
  select:
    iso: [BIH, SRB, XKX, MNE, ALB, MKD, GRC, BGR, TUR, CYP, SYR, LBN, ISR, JOR, IRQ]
    pieces: [118-Gaza_Strip, 124-No_Man_s_Land, 126-Sanafir_Tiran_Is, 129-West_Bank]
  timeline:
    - from: 1648
      owner: ottoman

# ================================================================ ルーマニア・モルドバ
- id: wallachia_proper
  name: ワラキア（大ワラキア＝ムンテニア）
  select:
    adm1: [ROU/ARGES, ROU/BUCURESTI, ROU/BUZAU, ROU/CALARASI, ROU/DAMBOVITA, ROU/GIURGIU, ROU/IALOMITA, ROU/ILFOV, ROU/PRAHOVA, ROU/TELEORMAN]
  timeline:
    - from: 1648
      owner: wallachia
      overlord: ottoman
    - from: 1859
      owner: romania
      overlord: ottoman
      cause: モルダヴィアとワラキアが同じ君主（クザ）を選び、連合公国（ルーマニア）となる
      source: "https://ja.wikipedia.org/wiki/アレクサンドル・ヨアン・クザ"
    - from: 1878
      owner: romania
      cause: ベルリン条約でルーマニアの独立が承認される
      source: "https://ja.wikipedia.org/wiki/ベルリン条約_(1878年)"
  note: ジュルジュとトゥルヌ（トゥルヌ・マグレレ）の要塞とその周辺は、ブライラと同じく1829年までオスマン帝国の直轄地（ラヤ）だったが、県全体をオスマン領にすると過大になるので描かない。

- id: braila
  name: ブライラ（オスマン帝国の直轄地）
  select:
    adm1: [ROU/BRAILA]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1829
      owner: wallachia
      overlord: ottoman
      cause: アドリアノープル条約（ブライラ・ジュルジュ・トゥルヌの要塞がワラキアに返還される）
      source: "https://ja.wikipedia.org/wiki/アドリアノープル条約"
    - from: 1859
      owner: romania
      overlord: ottoman
      cause: モルダヴィアとワラキアが同じ君主（クザ）を選び、連合公国（ルーマニア）となる
      source: "https://ja.wikipedia.org/wiki/アレクサンドル・ヨアン・クザ"
    - from: 1878
      owner: romania
      cause: ベルリン条約でルーマニアの独立が承認される
      source: "https://ja.wikipedia.org/wiki/ベルリン条約_(1878年)"
  note: ブライラは1540–1829年オスマン帝国の直轄地（ラヤ）。県の全域が直轄地だったわけではない（近似）。
  source: "https://en.wikipedia.org/wiki/Brăila"

