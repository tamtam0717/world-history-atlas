  name: ブコヴィナ（南部）
  select:
    adm1: [ROU/SUCEAVA]
  timeline:
    - from: 1648
      owner: moldavia
      overlord: ottoman
    - from: 1775
      owner: habsburg
      cause: コンスタンティノープル協定（ブコヴィナのオーストリアへの割譲）
      source: "https://ja.wikipedia.org/wiki/ブコヴィナ"
  note: 現スチャヴァ県は南ブコヴィナと旧モルダヴィア領の一部からなる。面積の大きいブコヴィナ側に合わせたので、1775年以降、県の南部（ファルティチェニ周辺など、モルダヴィアに残った地域）までオーストリア領に見える（ピースの粒度による近似）。

