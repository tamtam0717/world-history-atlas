      owner: ottoman
    - from: 1878
      owner: romania
      cause: ベルリン条約で北ドブルジャがルーマニア領に（南ベッサラビアをロシアに返す代わり）
      source: "https://ja.wikipedia.org/wiki/ベルリン条約_(1878年)"
    # ---- 1915–2025 ----
    - {from: 1916, owner: bulgaria, certainty: occupied, label: "北ドブロジャ（同盟国の共同占領）", cause: "ブルガリア・ドイツ軍がドブロジャを占領（10–12月。コンスタンツァは10月）", source: "https://en.wikipedia.org/wiki/Romanian_Campaign_(World_War_I)"}
    - {from: 1918, owner: romania, cause: "ルーマニアが再び参戦し（11月）、同盟国軍が撤退", source: "https://en.wikipedia.org/wiki/Treaty_of_Bucharest_(1918)"}
  note: ドナウ・デルタ（河口の島々）は1829年のアドリアノープル条約でロシア領となり、1856年のパリ条約でオスマン帝国に戻された（1857年に画定）。トゥルチャ県のピースからデルタだけを切り出せないため、地図には描いていない。

