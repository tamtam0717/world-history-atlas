# 担当 E：バルカン・オスマン・中東の地域と所属の変遷（1648–1815 試作）
# 大きな地域でおおまかに書き、小さな地域で例外を上書きする（小さい地域が優先）。
# 小さな地域も 1648 年から書き始めているので、その期間は大きな地域より常に優先される。

# ================================================================ 基本：オスマン帝国の本土
- id: ottoman_core
  name: オスマン帝国の本土（バルカン・アナトリア・東地中海・イラク）
  select:
    iso: [BIH, SRB, XKX, MNE, ALB, MKD, GRC, BGR, TUR, CYP, SYR, LBN, ISR, JOR, IRQ]
    pieces: [118-Gaza_Strip, 124-No_Man_s_Land, 126-Sanafir_Tiran_Is, 129-West_Bank]
  timeline:
    - from: 1648
      owner: ottoman

# ================================================================ ルーマニア・モルドバ
- id: wallachia_proper
  name: ワラキア（大ワラキア＝ムンテニア）
  select:
    adm1: [ROU/ARGES, ROU/BUCURESTI, ROU/BUZAU, ROU/CALARASI, ROU/DAMBOVITA, ROU/GIURGIU, ROU/IALOMITA, ROU/ILFOV, ROU/PRAHOVA, ROU/TELEORMAN]
  timeline:
    - from: 1648
      owner: wallachia
      overlord: ottoman
  note: ジュルジュとトゥルヌ（トゥルヌ・マグレレ）の要塞とその周辺は、ブライラと同じく1829年までオスマン帝国の直轄地（ラヤ）だったが、県全体をオスマン領にすると過大になるので描かない。

- id: braila
  name: ブライラ（オスマン帝国の直轄地）
  select:
    adm1: [ROU/BRAILA]
  timeline:
    - from: 1648
      owner: ottoman
  note: ブライラは1540–1829年オスマン帝国の直轄地（ラヤ）。県の全域が直轄地だったわけではない（近似）。
  source: "https://en.wikipedia.org/wiki/Brăila"

- id: oltenia
  name: 小ワラキア（オルテニア）
  select:
    adm1: [ROU/DOLJ, ROU/GORJ, ROU/MEHEDINTI, ROU/OLT, ROU/VALCEA]
  timeline:
    - from: 1648
      owner: wallachia
      overlord: ottoman
    - from: 1718
      owner: habsburg
      cause: パッサロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/パッサロヴィッツ条約"
    - from: 1739
      owner: wallachia
      overlord: ottoman
      cause: ベオグラード条約
      source: "https://ja.wikipedia.org/wiki/ベオグラード条約"

- id: moldavia_ro
  name: モルダヴィア（プルート川以西）
  select:
    adm1: [ROU/BACAU, ROU/BOTOSANI, ROU/GALATI, ROU/IASI, ROU/NEAMT, ROU/VASLUI, ROU/VRANCEA]
  timeline:
    - from: 1648
      owner: moldavia
      overlord: ottoman

- id: bukovina_ro
  name: ブコヴィナ（南部）
  select:
    adm1: [ROU/SUCEAVA]
  timeline:
    - from: 1648
      owner: moldavia
      overlord: ottoman
    - from: 1775
      owner: habsburg
      cause: コンスタンティノープル協定（ブコヴィナのオーストリアへの割譲）
      source: "https://ja.wikipedia.org/wiki/ブコヴィナ"
  note: 現スチャヴァ県は南ブコヴィナと旧モルダヴィア領の一部からなる。面積の大きいブコヴィナ側に合わせたので、1775年以降、県の南部（ファルティチェニ周辺など、モルダヴィアに残った地域）までオーストリア領に見える（ピースの粒度による近似）。

- id: dobruja_ro
  name: ドブルジャ（北部）
  select:
    adm1: [ROU/CONSTANTA, ROU/TULCEA]
  timeline:
    - from: 1648
      owner: ottoman

- id: bessarabia
  name: ベッサラビア（プルート・ドニエストル間の中部・北部）
  select:
    iso: [MDA]
    exclude: [MDA-Transnistria]
  timeline:
    - from: 1648
      owner: moldavia
      overlord: ottoman
    - from: 1812
      owner: russia
      cause: ブカレスト条約
      source: "https://ja.wikipedia.org/wiki/ブカレスト条約_(1812年)"

- id: budjak_bender
  name: ブジャク・ベンデル（オスマン帝国の直轄地）
  select:
    pieces: [MDA-Bender, MDA-Causeni, MDA-Stefan_Voda, MDA-Basarabeasca, MDA-Taraclia, MDA-Gagauzia]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1812
      owner: russia
      cause: ブカレスト条約
      source: "https://ja.wikipedia.org/wiki/ブカレスト条約_(1812年)"
  note: ベンデル（ティギナ）は1538年からオスマン帝国の直轄地。南部のブジャクにはクリミア＝ハン国に属するノガイ・タタール（ブジャク・オルダ）が遊牧した。境界は近似（要確認）。

- id: transnistria
  name: ドニエストル川左岸（イェディサン西部）
  select:
    pieces: [MDA-Transnistria]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1792
      owner: russia
      cause: ヤッシー条約
      source: "https://ja.wikipedia.org/wiki/ヤッシー条約"
  note: 北部（ルィブニツァ・カメンカ）はポーランド領（ブラツワフ県）で1793年にロシア領。面積の大きい南部（オスマン帝国のオズィ州、ノガイ・タタールのイェディサン）に合わせた。

- id: transylvania_ro
  name: トランシルヴァニア
  select:
    adm1: [ROU/ALBA, ROU/BISTRITA-NASAUD, ROU/BRASOV, ROU/CLUJ, ROU/COVASNA, ROU/HARGHITA, ROU/HUNEDOARA, ROU/MURES, ROU/SIBIU, ROU/SALAJ, ROU/MARAMURES]
  timeline:
    - from: 1648
      owner: transylvania
      overlord: ottoman
    - from: 1691
      owner: habsburg
      certainty: occupied
      cause: レオポルト勅書でトランシルヴァニアがハプスブルク家の支配下に入る（ハプスブルク軍は1687年から駐留）
      source: "https://en.wikipedia.org/wiki/Diploma_Leopoldinum"
    - from: 1699
      owner: habsburg
      cause: カルロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/カルロヴィッツ条約"
  note: 1687年のブラージュ条約からハプスブルク軍が駐留し、1691年のレオポルト勅書でハプスブルク家の支配下に入り、1699年のカルロヴィッツ条約でオスマン帝国が承認した。ハンガリー・モレアの再征服と揃えて、1691–1698年は占領（occupied）として描く。サラージュ・マラムレシュ（パルティウムの一部）もトランシルヴァニア公の領域に含めた。

- id: satu_mare
  name: サトゥ・マーレ（サトマール）
  select:
    adm1: [ROU/SATU MARE]
  timeline:
    - from: 1648
      owner: transylvania
      overlord: ottoman
    - from: 1660
      owner: habsburg
      certainty: uncertain
      cause: ラーコーツィ・ジェルジ2世の死でハンガリー王（ハプスブルク家）に返還（ハンガリー側のサボルチ・サトマールと同じ扱い）
      source: "https://en.wikipedia.org/wiki/Peace_of_Linz"
    - from: 1682
      owner: thokoly
      overlord: ottoman
      certainty: uncertain
      cause: テケリ・イムレがオスマン帝国の後ろ盾で上部ハンガリー公となる
    - from: 1685
      owner: habsburg
      cause: テケリの失脚と皇帝軍による回復
  note: リンツ条約（1645）でサトマール県・サボルチ県はラーコーツィ家に与えられた。返還の年はハンガリー側（担当 D の szabolcs_szatmar）に合わせて1660年とした（要確認）。

- id: bihor
  name: ビホル（ナジヴァーラド＝オラデア）
  select:
    adm1: [ROU/BIHOR]
  timeline:
    - from: 1648
      owner: transylvania
      overlord: ottoman
    - from: 1660
      owner: ottoman
      cause: オスマン軍がナジヴァーラドを占領（ヴァーラド州の設置。1664年ヴァシュヴァール条約で確認）
      source: "https://en.wikipedia.org/wiki/Siege_of_Várad_(1660)"
    - from: 1692
      owner: habsburg
      certainty: occupied
      cause: ハプスブルク軍がナジヴァーラドを奪回
    - from: 1699
      owner: habsburg
      cause: カルロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/カルロヴィッツ条約"

- id: arad
  name: アラド
  select:
    adm1: [ROU/ARAD]
  timeline:
    - from: 1648
      owner: ottoman
      certainty: uncertain
    - from: 1688
      owner: habsburg
      certainty: occupied
      cause: 大トルコ戦争でハプスブルク軍がアラド・リポヴァ方面を制圧（年は要確認）
    - from: 1699
      owner: habsburg
      cause: カルロヴィッツ条約（ムレシュ川以北）
      source: "https://ja.wikipedia.org/wiki/カルロヴィッツ条約"
  note: 1648年時点で北東部のイネウ（ボロシュイェネー）はトランシルヴァニア公領（1658年にオスマン領）。面積の大きいムレシュ川以北に合わせて1699年に切り替えた（南岸は1718年まで オスマン領）。

- id: banat_ro
  name: バナト（ティミショアラ）
  select:
    adm1: [ROU/TIMIS]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1718
      owner: habsburg
      cause: パッサロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/パッサロヴィッツ条約"

- id: lugoj_caransebes
  name: ルゴジ・カランセベシュのバナト（カラシュ＝セヴェリン）
  select:
    adm1: [ROU/CARAS-SEVERIN]
  timeline:
    - from: 1648
      owner: transylvania
      overlord: ottoman
    - from: 1658
      owner: ottoman
      cause: トランシルヴァニア公がルゴジ・カランセベシュをオスマン帝国に割譲
      source: "https://en.wikipedia.org/wiki/Banate_of_Lugos_and_Karánsebes"
    - from: 1718
      owner: habsburg
      cause: パッサロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/パッサロヴィッツ条約"

# ================================================================ セルビア・ヴォイヴォディナ
- id: backa
  name: バーチカ（バチュカ）・西スレム
  select:
    adm1: [SRB/North Backa District, SRB/West Backa District, SRB/South Backa District]
    pieces: [SRB-Senta_Municipality, SRB-Ada_Municipality, SRB-Kanjiza_Municipality, SRB-Sid_Municipality, SRB-Irig_Municipality, SRB-Indjija_Municipality]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1687
      owner: habsburg
      certainty: occupied
      cause: 第二次モハーチの戦いの後、ハプスブルク軍がバーチカ・スレム西部を制圧
      source: "https://en.wikipedia.org/wiki/Battle_of_Mohács_(1687)"
    - from: 1699
      owner: habsburg
      cause: カルロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/カルロヴィッツ条約"
  note: ハプスブルク軍は1687年ごろまでにバーチカを制圧していた（1687–1698年は占領として描く）。スレム（シルミア）の境界はスランカメン〜モロヴィチの線で、ピース単位の近似（要確認）。

- id: east_syrmia
