  note: 1830年2月のロンドン議定書の国境はアケロオス川〜スペルヒオス川の線で、アカルナニア西部やラミア周辺は1832年の条約で加わったが、地図では1830年にまとめた。独立戦争中（1821–1829）は「不確実」として描く。

