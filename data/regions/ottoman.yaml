      certainty: occupied
      cause: レオポルト勅書でトランシルヴァニアがハプスブルク家の支配下に入る（ハプスブルク軍は1687年から駐留）
      source: "https://en.wikipedia.org/wiki/Diploma_Leopoldinum"
    - from: 1699
      owner: habsburg
      cause: カルロヴィッツ条約
