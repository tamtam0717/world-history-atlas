    - {from: 2003, owner: serbia, cause: "ユーゴスラヴィア連邦共和国がゆるやかな国家連合のセルビア・モンテネグロに改組（2月）", source: "https://ja.wikipedia.org/wiki/セルビア・モンテネグロ"}
    - {from: 2006, owner: montenegro, cause: "住民投票（5月）でモンテネグロが独立（6月）", source: "https://ja.wikipedia.org/wiki/モンテネグロ"}
