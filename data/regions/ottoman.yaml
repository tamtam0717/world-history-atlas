    - from: 1718
      owner: habsburg
      cause: パッサロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/パッサロヴィッツ条約"
    - from: 1739
      owner: ottoman
      cause: ベオグラード条約
      source: "https://ja.wikipedia.org/wiki/ベオグラード条約"
