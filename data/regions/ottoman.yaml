- id: crete
  name: クレタ島
  select:
    adm1: [GRC/Crete]
  timeline:
    - from: 1648
      owner: ottoman
      certainty: occupied
      cause: クレタ戦争（1645–1669）でオスマン軍が島の大半を占領
    - from: 1669
      owner: ottoman
      cause: カンディア開城（クレタ戦争の終結）
      source: "https://ja.wikipedia.org/wiki/クレタ戦争_(1645年-1669年)"
    - from: 1830
      owner: egypt
      overlord: ottoman
      cause: ギリシア独立戦争への出兵の見返りに、クレタがエジプトのムハンマド・アリーに与えられる
      source: "https://en.wikipedia.org/wiki/Egyptian_rule_in_Crete"
    - from: 1840
      owner: ottoman
      cause: ロンドン条約（1840）でクレタがオスマン帝国に戻される
      source: "https://ja.wikipedia.org/wiki/ロンドン条約_(1840年)"
    - from: 1898
      owner: crete_state
      overlord: ottoman
      cause: 希土戦争後、列強の保護のもとでクレタ自治国が成立
      source: "https://en.wikipedia.org/wiki/Cretan_State"
    - from: 1913
      owner: greece
      cause: ロンドン条約でオスマン帝国がクレタの権利を放棄し、ギリシアに統合される
      source: "https://ja.wikipedia.org/wiki/ロンドン条約_(1913年)"
  note: 1645–1648年にオスマン軍がハニア・レティムノなど島の大半を征服した。ヴェネツィアが保っていたカンディア（イラクリオン）は別の地域で表す。スダ・スピナロンガ・グランヴサの小要塞は1715年までヴェネツィア領だが、ピースより小さいので省略。

