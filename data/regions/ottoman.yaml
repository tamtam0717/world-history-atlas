  select:
    iso: [XKX]
    pieces: [SRB-Bujanovac_Municipality, SRB-Presevo_Municipality, SRB-Novi_Pazar_City, SRB-Tutin_Municipality, SRB-Sjenica_Municipality,
      SRB-Nova_Varos_Municipality, SRB-Priboj_Municipality, SRB-Prijepolje_Municipality]
