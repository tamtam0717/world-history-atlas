      source: "https://ja.wikipedia.org/wiki/ベルリン条約_(1878年)"

- id: bessarabia
  name: ベッサラビア（プルート・ドニエストル間の中部・北部）
  select:
    iso: [MDA]
    exclude: [MDA-Transnistria]
  timeline:
    - from: 1648
      owner: moldavia
      overlord: ottoman
    - from: 1812
      owner: russia
      cause: ブカレスト条約
      source: "https://ja.wikipedia.org/wiki/ブカレスト条約_(1812年)"

- id: budjak_bender
  name: ブジャク・ベンデル（オスマン帝国の直轄地）
  select:
    pieces: [MDA-Bender, MDA-Causeni, MDA-Stefan_Voda, MDA-Basarabeasca, MDA-Taraclia, MDA-Gagauzia]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1812
      owner: russia
      cause: ブカレスト条約
      source: "https://ja.wikipedia.org/wiki/ブカレスト条約_(1812年)"
  note: ベンデル（ティギナ）は1538年からオスマン帝国の直轄地。南部のブジャクにはクリミア＝ハン国に属するノガイ・タタール（ブジャク・オルダ）が遊牧した。境界は近似（要確認）。

- id: transnistria
  name: ドニエストル川左岸（イェディサン西部）
  select:
    pieces: [MDA-Transnistria]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1792
      owner: russia
      cause: ヤッシー条約
      source: "https://ja.wikipedia.org/wiki/ヤッシー条約"
  note: 北部（ルィブニツァ・カメンカ）はポーランド領（ブラツワフ県）で1793年にロシア領。面積の大きい南部（オスマン帝国のオズィ州、ノガイ・タタールのイェディサン）に合わせた。

- id: transylvania_ro
  name: トランシルヴァニア
  select:
    adm1: [ROU/ALBA, ROU/BISTRITA-NASAUD, ROU/BRASOV, ROU/CLUJ, ROU/COVASNA, ROU/HARGHITA, ROU/HUNEDOARA, ROU/MURES, ROU/SIBIU, ROU/SALAJ, ROU/MARAMURES]
  timeline:
    - from: 1648
      owner: transylvania
      overlord: ottoman
    - from: 1691
      owner: habsburg
      certainty: occupied
      cause: レオポルト勅書でトランシルヴァニアがハプスブルク家の支配下に入る（ハプスブルク軍は1687年から駐留）
      source: "https://en.wikipedia.org/wiki/Diploma_Leopoldinum"
    - from: 1699
      owner: habsburg
      cause: カルロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/カルロヴィッツ条約"
    - from: 1867
      owner: habsburg
      overlord: hungary_crown
      cause: アウスグライヒでトランシルヴァニア大公国がハンガリー王国に統合される
      source: "https://ja.wikipedia.org/wiki/アウスグライヒ"
  note: 1687年のブラージュ条約からハプスブルク軍が駐留し、1691年のレオポルト勅書でハプスブルク家の支配下に入り、1699年のカルロヴィッツ条約でオスマン帝国が承認した。ハンガリー・モレアの再征服と揃えて、1691–1698年は占領（occupied）として描く。サラージュ・マラムレシュ（パルティウムの一部）もトランシルヴァニア公の領域に含めた。

- id: satu_mare
  name: サトゥ・マーレ（サトマール）
  select:
    adm1: [ROU/SATU MARE]
  timeline:
    - from: 1648
      owner: transylvania
      overlord: ottoman
    - from: 1660
      owner: habsburg
      certainty: uncertain
      cause: ラーコーツィ・ジェルジ2世の死でハンガリー王（ハプスブルク家）に返還（ハンガリー側のサボルチ・サトマールと同じ扱い）
      source: "https://en.wikipedia.org/wiki/Peace_of_Linz"
    - from: 1682
      owner: thokoly
      overlord: ottoman
      certainty: uncertain
      cause: テケリ・イムレがオスマン帝国の後ろ盾で上部ハンガリー公となる
    - from: 1685
      owner: habsburg
      cause: テケリの失脚と皇帝軍による回復
    - from: 1867
      owner: habsburg
      overlord: hungary_crown
      cause: アウスグライヒ（妥協）でオーストリア＝ハンガリー帝国が成立し、ハンガリー王国（聖イシュトヴァーン王冠領）の一部となる
      source: "https://ja.wikipedia.org/wiki/アウスグライヒ"
  note: リンツ条約（1645）でサトマール県・サボルチ県はラーコーツィ家に与えられた。返還の年はハンガリー側（担当 D の szabolcs_szatmar）に合わせて1660年とした（要確認）。

