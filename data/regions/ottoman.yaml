      SRB-Vranje_City, SRB-Surdulica_Municipality, SRB-Vladicin_Han_Municipality, SRB-Trgoviste_Municipality]
  timeline:
    - from: 1878
      owner: serbia
      cause: ベルリン条約で独立とともにニシュ・ピロト・ヴラニェなどがセルビア領に
      source: "https://ja.wikipedia.org/wiki/ベルリン条約_(1878年)"
  note: トルゴヴィシュテは境界にまたがる（要確認）。

- id: serbia_1912
