  note: オスマン帝国の宗主権は名目的で、事実上は自立していた。1796年以降は宗主権を外して表示（オスマン帝国が独立を認めたのは1878年）。旧モンテネグロの「4つのナヒヤ」のうち、ツルムニツァはバール市北部、リイェシャニはポドゴリツァ市西部にまたがるが、ピースの粒度の都合でツェティニェ市だけで描く。

