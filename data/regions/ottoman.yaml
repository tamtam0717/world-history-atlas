  name: セルビア西部（ウジツェ・クラリェヴォ）
  select:
    pieces: [SRB-Uzice_City, SRB-Kosjeric_Municipality, SRB-Bajina_Basta_Municipality, SRB-Kraljevo_City, SRB-Vrnjacka_Banja_Municipality]
  timeline:
    - from: 1830
      owner: serbia
      overlord: ottoman
      cause: ハッティ・シェリフでセルビア公国の自治が認められる
      source: "https://ja.wikipedia.org/wiki/セルビア公国"
    - from: 1878
      owner: serbia
      cause: ベルリン条約でセルビアの独立が承認される
      source: "https://ja.wikipedia.org/wiki/ベルリン条約_(1878年)"
    # ---- 1915–2025 ----
    - {from: 1915, owner: habsburg, certainty: occupied, label: "セルビア（オーストリア＝ハンガリーの軍政）", cause: "同盟国軍（ドイツ・オーストリア＝ハンガリー・ブルガリア）がセルビアを占領（10–12月）。北部・西部はオーストリア＝ハンガリーの軍政総督府", source: "https://en.wikipedia.org/wiki/Military_General_Governorate_of_Serbia"}
    - {from: 1918, owner: yugoslavia, cause: "セルビア王国を中心に南スラヴ人の国が合同し、セルブ＝クロアート＝スロヴェーン王国が成立（12月1日）", source: "https://ja.wikipedia.org/wiki/ユーゴスラビア王国"}
    - {from: 1941, owner: germany, certainty: occupied, label: "セルビア（ドイツの軍政）", cause: "枢軸国のユーゴスラヴィア侵攻（4月）。セルビアはドイツの軍政下に置かれ、8月からネディッチの傀儡政府", source: "https://en.wikipedia.org/wiki/Territory_of_the_Military_Commander_in_Serbia"}
    - {from: 1944, owner: yugoslavia, cause: "パルチザン（ユーゴスラヴィア人民解放軍）とソ連軍が解放（10月20日にベオグラード）", source: "https://en.wikipedia.org/wiki/Belgrade_offensive"}
    - {from: 2003, owner: serbia, cause: "ユーゴスラヴィア連邦共和国がゆるやかな国家連合のセルビア・モンテネグロに改組（2月）", source: "https://ja.wikipedia.org/wiki/セルビア・モンテネグロ"}
  note: 1815年の地図では範囲に含めていない（ベオグラード州の南西部。近似）。ウジツェの要塞のオスマン軍は1862年に撤退した。

- id: serbia_1833
  name: セルビアの6つのナヒヤ（ザイェチャル・クルシェヴァツ・アレクシナツなど）
  select:
    adm1: [SRB/Zajecar District, SRB/Rasina District]
    pieces: [SRB-Raska_Municipality, SRB-Aleksinac_Municipality, SRB-Razanj_Municipality, SRB-Pozega_Municipality, SRB-Arilje_Municipality, SRB-Cajetina_Municipality]
  timeline:
    - from: 1833
      owner: serbia
      overlord: ottoman
      cause: 1833年のハッティ・シェリフで、第一次蜂起の範囲だった南東の6つのナヒヤ（郡）がセルビア公国に加えられる
      source: "https://en.wikipedia.org/wiki/Principality_of_Serbia"
    - from: 1878
      owner: serbia
      cause: ベルリン条約でセルビアの独立が承認される
      source: "https://ja.wikipedia.org/wiki/ベルリン条約_(1878年)"
  note: 6つのナヒヤはクライナ（ネゴティン）、ツルナ・レカ（ザイェチャル）、バニャ、パラチン、クルシェヴァツ、スタリ・ヴラフなど。ネゴティン・パラチンは既存の belgrade_pashalik に含まれているので、そちらは1815年からセルビアに見える（近似）。

- id: serbia_1878
  name: ニシュ・ピロト・トプリツァ・ヴラニェ
  select:
    adm1: [SRB/Toplica District, SRB/Jablanica District]
    pieces: [SRB-Nis_City, SRB-Doljevac_Municipality, SRB-Gadzin_Han_Municipality, SRB-Merosina_Municipality, SRB-Svrljig_Municipality,
