    exclude: [SRB-Senta_Municipality, SRB-Ada_Municipality, SRB-Kanjiza_Municipality]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1718
      owner: habsburg
      cause: パッサロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/パッサロヴィッツ条約"

- id: belgrade_pashalik
  name: ベオグラード州（北セルビア）
  select:
    adm1: [SRB/Belgrade, SRB/Macva District, SRB/Kolubara District, SRB/Sumadija District, SRB/Pomoravlje District, SRB/Podunavlje District, SRB/Branicevo District, SRB/Bor District, SRB/Moravica District]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1718
      owner: habsburg
      cause: パッサロヴィッツ条約（セルビア王国としてオーストリア領）
      source: "https://ja.wikipedia.org/wiki/パッサロヴィッツ条約"
    - from: 1739
      owner: ottoman
      cause: ベオグラード条約
      source: "https://ja.wikipedia.org/wiki/ベオグラード条約"
    - from: 1804
      owner: serbia
      overlord: ottoman
      certainty: uncertain
      cause: 第一次セルビア蜂起（1804年2月に始まり、年内にダヒヤを倒して州の大半を制圧）
      source: "https://ja.wikipedia.org/wiki/第一次セルビア蜂起"
    - from: 1813
      owner: ottoman
      cause: 第一次セルビア蜂起の鎮圧
    - from: 1815
      owner: serbia
      overlord: ottoman
      certainty: uncertain
      cause: 第二次セルビア蜂起（オスマン帝国と自治を交渉）
      source: "https://ja.wikipedia.org/wiki/第二次セルビア蜂起"
  note: 1718–1739年のオーストリア領セルビア、1804–1813年の蜂起勢力の支配地域は、どちらも南の境界が西モラヴァ川付近で、ピース単位では近似（要確認）。1789–1791年のオーストリア軍の占領は描かない。

# ================================================================ ボスニア・モンテネグロ
- id: bosnian_posavina
  name: ボスニア北辺（サヴァ川沿い）
  select:
    pieces: [BIH-Posavina_Canton, BIH-Brcko_District]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1718
      owner: habsburg
      cause: パッサロヴィッツ条約
      source: "https://ja.wikipedia.org/wiki/パッサロヴィッツ条約"
    - from: 1739
      owner: ottoman
      cause: ベオグラード条約
      source: "https://ja.wikipedia.org/wiki/ベオグラード条約"
  note: パッサロヴィッツ条約でサヴァ川南岸の細長い地帯がオーストリア領となった（範囲は近似）。

- id: old_montenegro
  name: 旧モンテネグロ（ツェティニェ）
  select:
    pieces: [MNE-Cetinje_Municipality]
  timeline:
    - from: 1648
      owner: montenegro
      overlord: ottoman
      certainty: uncertain
    - from: 1796
      owner: montenegro
      cause: クルシの戦い（事実上の独立）
      source: "https://en.wikipedia.org/wiki/Battle_of_Krusi"
  note: オスマン帝国の宗主権は名目的で、事実上は自立していた。1796年以降は宗主権を外して表示（オスマン帝国が独立を認めたのは1878年）。旧モンテネグロの「4つのナヒヤ」のうち、ツルムニツァはバール市北部、リイェシャニはポドゴリツァ市西部にまたがるが、ピースの粒度の都合でツェティニェ市だけで描く。

- id: podgorica_brda
  name: ブルダ東部・ゼタ（ピペリ・クチ・ポドゴリツァ）
  select:
    pieces: [MNE-Podgorica_Municipality]
  timeline:
    - from: 1648
      owner: ottoman
      certainty: nominal
    - from: 1796
      owner: montenegro
      certainty: uncertain
      cause: クルシの戦いの後、ピペリなどブルダの諸部族がモンテネグロに加わる
      source: "https://en.wikipedia.org/wiki/Battle_of_Krusi"
  note: 現在のポドゴリツァ市は、旧モンテネグロのリイェシャニ・ナヒヤ、ブルダのピペリ・クチ、ゼタ平野を含む。ポドゴリツァの町、スプージュ、ゼタ平野は1878年までオスマン領で、クチの帰属も揺れたため、1796年以降は「不確実」として描く。

- id: brda
  name: ブルダ（ビェロパヴリチ）
