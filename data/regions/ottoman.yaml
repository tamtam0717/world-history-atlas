- id: greece_1830
  name: ギリシア王国の本土（ペロポネソス・中部ギリシア・エヴィア・キクラデス諸島）
  select:
    adm2: [GRC/Peloponnisoy, GRC/Dytikis Elladas, GRC/Attikis, GRC/Stereas Elladas]
    pieces: [GRC-Amorgos, GRC-Anafi, GRC-Andros, GRC-Antiparos, GRC-Folegandros, GRC-Iiton, GRC-Kea, GRC-Kimolos, GRC-Kithnos, GRC-Mikonos,
      GRC-Milos, GRC-Naxos_and_Lesser_Cyclades, GRC-Paros, GRC-Santorini, GRC-Serifos, GRC-Sifnos, GRC-Sikinos, GRC-Syros,
      GRC-Skiathos, GRC-Skopelos, GRC-Alonnisos]
    exclude: [GRC-Domokos]
  timeline:
    - from: 1821
      owner: greece
      certainty: uncertain
      cause: ギリシア独立戦争（臨時政府の支配。1825–1827年にはエジプト軍・オスマン軍が多くを奪回）
      source: "https://ja.wikipedia.org/wiki/ギリシャ独立戦争"
    - from: 1830
      owner: greece
      cause: ロンドン議定書でギリシアの独立が認められる（国境は1832年のコンスタンティノープル条約でアルタ＝ヴォロス線に確定）
