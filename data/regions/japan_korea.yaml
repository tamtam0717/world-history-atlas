# G3 日本・朝鮮（JPN KOR PRK、サハリン・千島）の地域と所属の変遷（1648–2025）
# 日本のピースは都道府県単位。北海道の和人地（渡島・檜山）、奄美群島・トカラ列島（鹿児島県）、小笠原諸島（東京都）は別のピース（2026-11-21 の分割）。大東諸島や先島諸島（沖縄県）は分けられないので note で示す。
# サハリン・千島の4ピースは data/regions/north_east.yaml の sakhalin（adm1 全体）とも重なるが、こちらのほうが小さいので優先される。

# ---- 日本 ----

- id: japan_main
  name: 日本（本州・四国・九州）
  select:
    iso_all: [JPN]
    exclude: [JPN-Hokkaido, JPN-Okinawa_Prefecture]
  timeline:
    - from: 1453
      owner: japan
      note: 室町幕府（足利将軍家）のもと、守護大名が各国を治めた。将軍は8代足利義政。関東では鎌倉公方（古河公方）と関東管領上杉氏が争う享徳の乱（1454–82）が始まった
      source: "https://ja.wikipedia.org/wiki/室町幕府"
    - from: 1467
      owner: japan
      certainty: uncertain
      cause: 応仁の乱（1467–77）で京都が戦場となり、室町幕府の権威が失われる
      note: 戦国時代。各地で戦国大名が自立して領国を治め（分国法）、将軍の支配は畿内のごく一部にしか及ばなくなった。国はひとつの「日本」として描き、統一の崩れた時代を斜線で示す
      source: "https://ja.wikipedia.org/wiki/戦国時代_(日本)"
    - from: 1590
      owner: japan
      cause: 豊臣秀吉が小田原の北条氏を滅ぼし、奥州仕置で東北の大名も従えて全国を統一する
      note: 太閤検地・刀狩（1588）で兵農分離を進めた。1600年の関ヶ原の戦いの後、1603年に徳川家康が征夷大将軍となり江戸幕府を開いた。1615年の大坂夏の陣で豊臣氏は滅んだ
      source: "https://ja.wikipedia.org/wiki/豊臣政権"
    - from: 1648
      owner: japan
      note: 江戸幕府の直轄地（天領）と約260の藩からなる幕藩体制。対馬藩（長崎県）は朝鮮との外交・貿易を、薩摩藩（鹿児島県）は琉球を、松前藩は蝦夷地との交易を担った
      source: "https://ja.wikipedia.org/wiki/幕藩体制"
    - from: 1945
      owner: japan
      overlord: usa
      label: 日本（連合国の占領下）
      cause: ポツダム宣言を受け入れて降伏し、連合国軍（GHQ）の占領下に入る（8–9月）
      note: 占領は連合国軍最高司令官マッカーサーのもとで、実質的にアメリカが行った。日本政府を通じた間接統治。1946年からはトカラ列島・奄美群島・小笠原諸島が日本の行政から切り離され、アメリカ軍の直接の軍政下に置かれた（それぞれ別の地域で描く）
      source: "https://ja.wikipedia.org/wiki/連合国軍占領下の日本"
    - from: 1952
      owner: japan
      cause: サンフランシスコ平和条約の発効で独立を回復（4月28日）
      note: トカラ列島は1952年2月、奄美群島は1953年、小笠原諸島は1968年に返還された（それぞれ別の地域で描く）
      source: "https://ja.wikipedia.org/wiki/日本国との平和条約"

- id: hokkaido
  name: 北海道（蝦夷地）
  names:
    - {to: 1868, name: 蝦夷地}
    - {from: 1869, name: 北海道}
  select:
    pieces: [JPN-Hokkaido]
  timeline:
    - from: 1453
      owner: null
      certainty: uncertain
      note: アイヌの人々の土地（蝦夷地）。和人は渡島半島の南端の館（道南十二館）にとどまった
      source: "https://ja.wikipedia.org/wiki/蝦夷地"
    - from: 1593
      owner: japan
      certainty: nominal
      label: 蝦夷地
      cause: 豊臣秀吉が蠣崎慶広に朱印状を与え、蝦夷地に出入りする船から税を取る権利を認める
      note: 1599年に蠣崎氏は松前氏と改め、1604年に徳川家康の黒印状でアイヌとの交易の独占を認められた（松前藩）。内陸の大部分はアイヌの人々の土地で、名目的な支配（白い斜線）として描く
      source: "https://ja.wikipedia.org/wiki/松前藩"
    - from: 1648
      owner: japan
      certainty: nominal
      label: 蝦夷地
      note: 和人の住む地（和人地）は渡島半島の南端だけで、その他はアイヌの人々の土地（蝦夷地）。松前藩がアイヌとの交易を独占した。1669年のシャクシャインの戦いの後、アイヌへの支配が強まった
      source: "https://ja.wikipedia.org/wiki/蝦夷地"
    - from: 1799
      owner: japan
      certainty: nominal
      label: 蝦夷地（幕府の直轄）
      cause: ロシアの接近に備え、幕府が東蝦夷地を直轄にする（1807年に西蝦夷地も）
      note: 1821年に松前藩に戻され、1855年に再び幕府の直轄となった。内陸の大部分はなおアイヌの土地だったので、名目的な支配（白い斜線）として描く
      source: "https://ja.wikipedia.org/wiki/蝦夷地"
    - from: 1821
      owner: japan
      certainty: nominal
      label: 蝦夷地
      cause: 蝦夷地が松前藩に返される
      source: "https://ja.wikipedia.org/wiki/松前藩"
    - from: 1855
      owner: japan
      certainty: nominal
      label: 蝦夷地（幕府の直轄）
      cause: 日米和親条約で箱館が開港し、幕府が蝦夷地を再び直轄にする
      source: "https://ja.wikipedia.org/wiki/箱館奉行"
    - from: 1868
      owner: ezo_republic
      certainty: uncertain
      cause: 旧幕府軍の榎本武揚らが箱館の五稜郭を占領し、松前城を落とす（12月）
      note: 年末には箱館・松前など渡島半島の南部をおさえた
      source: "https://ja.wikipedia.org/wiki/箱館戦争"
    - from: 1869
      owner: japan
      cause: 箱館戦争が終わり（5月）、新政府が開拓使を置いて蝦夷地を北海道と改める
      note: 屯田兵などによる開拓が進められ、アイヌの人々は土地や生業を奪われて同化政策を受けた（1899年の北海道旧土人保護法）
      source: "https://ja.wikipedia.org/wiki/開拓使"
    - from: 1945
      owner: japan
      overlord: usa
      label: 日本（連合国の占領下）
      cause: 日本の降伏と連合国軍の占領
      source: "https://ja.wikipedia.org/wiki/連合国軍占領下の日本"
    - from: 1952
      owner: japan
      cause: サンフランシスコ平和条約の発効で独立を回復
      source: "https://ja.wikipedia.org/wiki/日本国との平和条約"

- id: okinawa
  name: 沖縄（琉球）
  names:
    - {to: 1878, name: 琉球}
    - {from: 1879, name: 沖縄県}
  select:
    pieces: [JPN-Okinawa_Prefecture]
  timeline:
    - from: 1453
      owner: ryukyu
      overlord: ming
      note: 1429年に中山の尚巴志が北山・中山・南山の三山を統一して琉球王国をつくった（第一尚氏）。明の冊封を受けて朝貢し、首里を都に、日本・中国・東南アジアを結ぶ中継貿易で栄えた。宮古・八重山（先島諸島）はピースが分けられないので沖縄本島と同じに塗る（八重山は1500年のオヤケアカハチの乱の鎮圧で王府の支配が確立した）
      source: "https://ja.wikipedia.org/wiki/琉球王国"
    - from: 1609
      owner: ryukyu
      overlord: ming
      cause: 薩摩藩（島津氏）が琉球に侵攻して首里城を落とし、国王尚寧を鹿児島・江戸に連れて行く
      note: 王国は存続したが薩摩藩の支配を受け、奄美群島を割き取られた（1611）。明への朝貢は続けられ、薩摩はその利益を得た（日中両属）。宗主権の帯は明だけで示す
      source: "https://ja.wikipedia.org/wiki/琉球侵攻"
    - from: 1644
      owner: ryukyu
      cause: 明が滅び（李自成の北京占領・清の入関）、明の冊封関係が途絶える
      note: 琉球は南明の諸政権にも使者を送ったが、清との冊封関係は1663年まで結ばれなかった
      source: "https://ja.wikipedia.org/wiki/琉球王国"
    - from: 1648
      owner: ryukyu
      note: 1609年から薩摩藩の支配も受ける（両属）。明清交代期で、中国との冊封関係は清との間でまだ結ばれていない（1654年に明の印を返し、1663年に清の冊封使が来る）
      source: "https://ja.wikipedia.org/wiki/琉球王国"
    - from: 1663
      owner: ryukyu
      overlord: qing
      cause: 清の冊封使が来て尚質王を琉球国王に封じる
      source: "https://ja.wikipedia.org/wiki/冊封使"
    - from: 1872
      owner: ryukyu
      overlord: qing
      label: 琉球藩
      cause: 明治政府が琉球国王の尚泰を琉球藩王とする（琉球藩）
      note: 王府は存続し、1874年まで清への進貢も続けた。高校世界史では1879年の琉球処分で王国が滅んだとするので、それまで琉球として描く
      source: "https://ja.wikipedia.org/wiki/琉球処分"
    - from: 1875
      owner: ryukyu
      overlord: japan
      label: 琉球藩
      cause: 明治政府が清への朝貢と冊封を禁じ、明治の年号を使わせる
      note: 清は日本の領有を認めず、琉球の士族の一部も清に救いを求めた。地図では宗主権の帯を清から日本の色に替えて示す
      source: "https://ja.wikipedia.org/wiki/琉球処分"
    - from: 1879
      owner: japan
      cause: 琉球処分（琉球藩を廃して沖縄県を置く）
      note: 清との帰属問題は日清戦争（1894–95）で事実上決着した
      source: "https://ja.wikipedia.org/wiki/琉球処分"
    - from: 1945
      owner: usa
      certainty: occupied
      label: 沖縄（アメリカの軍政）
      cause: 沖縄戦（3–6月）でアメリカ軍が占領し、軍政を敷く
      source: "https://ja.wikipedia.org/wiki/沖縄戦"
    - from: 1952
      owner: usa
      certainty: occupied
      label: 沖縄（アメリカの施政権下）
      cause: サンフランシスコ平和条約第3条で、アメリカの施政権下に置かれる
      note: 日本は「潜在主権」を持つとされた。琉球政府があったが、アメリカの琉球列島民政府（USCAR）が実権を持ち、広大な米軍基地がつくられた
      source: "https://ja.wikipedia.org/wiki/琉球列島米国民政府"
    - from: 1972
      owner: japan
      cause: 沖縄返還（5月15日）
      note: 返還後も在日米軍の基地の多くが沖縄に集中している
      source: "https://ja.wikipedia.org/wiki/沖縄返還"

- id: wajinchi
  name: 和人地（松前藩）
  names:
    - {from: 1869, name: 渡島・檜山（北海道南西部）}
  select:
    pieces: [JPN-Hokkaido_Wajinchi]
  timeline:
    - from: 1453
      owner: japan
      certainty: uncertain
      label: 道南の館（安東氏）
      note: 渡島半島の南端に和人の豪族が館（道南十二館）を築き、津軽から移った安東（安藤）氏が代官を置いて治めた。1457年のコシャマインの戦いで館の多くが落とされ、以後もアイヌとの戦いが繰り返された。ピースは渡島・檜山の南部の市町村で近似した
      source: "https://ja.wikipedia.org/wiki/道南十二館"
    - from: 1551
      owner: japan
      certainty: uncertain
      label: 和人地（蠣崎氏）
      cause: 蠣崎季広がアイヌの首長と和睦し（夷狄の商舶往還の法度）、和人地の範囲が定まる
      note: 年は1550年とも。蠣崎氏はなお檜山の安東氏の代官だった
      source: "https://ja.wikipedia.org/wiki/蠣崎季広"
    - from: 1590
      owner: japan
      label: 和人地（蠣崎氏）
      cause: 豊臣秀吉の全国統一。蠣崎慶広は秀吉に直接仕え、安東氏から独立する（1593年の朱印状）
      note: 1599年に松前氏と改めた
      source: "https://ja.wikipedia.org/wiki/蠣崎慶広"
    - from: 1604
      owner: japan
      label: 和人地（松前藩）
      cause: 徳川家康の黒印状で、松前氏がアイヌとの交易の独占を認められる
      source: "https://ja.wikipedia.org/wiki/松前藩"
    - from: 1648
      owner: japan
      label: 和人地（松前藩）
      note: 渡島半島の南西部（松前・江差・箱館の周り）は和人の住む地で、松前藩が治めた。その北と東の蝦夷地（アイヌの地）とは区別され、関所で往来が制限された。ピースは渡島・檜山の南部の市町村（松前・江差・上ノ国・函館・北斗・七飯・森・鹿部・奥尻など）で近似した
      source: "https://ja.wikipedia.org/wiki/和人地"
    - from: 1807
      owner: japan
      label: 和人地（幕府の直轄）
      cause: 幕府が西蝦夷地とともに松前藩の領地も直轄にし、松前藩を陸奥の梁川に移す
      source: "https://ja.wikipedia.org/wiki/松前藩"
    - from: 1821
      owner: japan
      label: 和人地（松前藩）
      cause: 松前藩が蝦夷地とともに旧領に戻される
      source: "https://ja.wikipedia.org/wiki/松前藩"
    - from: 1855
      owner: japan
      label: 和人地（松前藩・箱館奉行）
      cause: 箱館の開港に伴い、幕府が箱館周辺と蝦夷地を再び直轄にする（松前藩は松前・江差の周りだけを残す）
      source: "https://ja.wikipedia.org/wiki/箱館奉行"
    - from: 1868
      owner: ezo_republic
      certainty: uncertain
      label: ""
      cause: 旧幕府軍の榎本武揚らが箱館の五稜郭を占領し（10月）、松前城を落とす（11月）
      note: 年末には箱館・松前・江差など和人地のほぼ全体をおさえた（蝦夷共和国とも呼ばれる）
      source: "https://ja.wikipedia.org/wiki/箱館戦争"
    - from: 1869
      owner: japan
      label: ""
      cause: 箱館戦争が終わり（5月）、蝦夷地を北海道と改めて開拓使を置く。松前藩は館藩と改称し、1871年の廃藩置県で消えた
      source: "https://ja.wikipedia.org/wiki/開拓使"
    - from: 1945
      owner: japan
      overlord: usa
      label: 日本（連合国の占領下）
      cause: 日本の降伏と連合国軍の占領
      source: "https://ja.wikipedia.org/wiki/連合国軍占領下の日本"
    - from: 1952
      owner: japan
      label: ""
      cause: サンフランシスコ平和条約の発効で独立を回復
      source: "https://ja.wikipedia.org/wiki/日本国との平和条約"

- id: tokara
  name: トカラ列島（鹿児島県十島村）
  select:
    pieces: [JPN-Tokara_Islands]
  timeline:
    - from: 1946
      owner: usa
      certainty: occupied
      label: トカラ列島（アメリカの軍政）
      cause: 連合国軍総司令部の覚書（2月2日）で北緯30度以南が日本の行政から切り離され、アメリカ軍の軍政下に置かれる
      note: 北緯30度より南の口之島以南が対象（北の竹島・硫黄島・黒島の三島村は日本に残った）
      source: "https://ja.wikipedia.org/wiki/十島村"
    - from: 1952
      owner: japan
      cause: 日本に返還される（2月10日）
      source: "https://ja.wikipedia.org/wiki/十島村"

- id: amami
  name: 奄美群島
  select:
    pieces: [JPN-Amami_Islands]
  timeline:
    - from: 1453
      owner: ryukyu
      overlord: ming
      certainty: uncertain
      note: 琉球王国の勢力が奄美大島に及びはじめていた（1447年ごろから朝貢）。島々の按司（豪族）の抵抗が続いた
      source: "https://ja.wikipedia.org/wiki/奄美群島"
    - from: 1466
      owner: ryukyu
      overlord: ming
      cause: 琉球の尚徳王が喜界島を征服する
      note: 奄美大島ではその後も反乱があり、1537年・1571年にも琉球軍が送られた
      source: "https://ja.wikipedia.org/wiki/尚徳王"
    - from: 1609
      owner: japan
      certainty: occupied
      label: 奄美（薩摩軍の占領）
      cause: 薩摩藩の琉球侵攻で、奄美の島々が占領される
      source: "https://ja.wikipedia.org/wiki/琉球侵攻"
    - from: 1611
      owner: japan
      label: 奄美（薩摩藩の直轄）
      cause: 薩摩藩が奄美群島を琉球から割き取り、直轄地とする
      source: "https://ja.wikipedia.org/wiki/奄美群島"
    - from: 1648
      owner: japan
      label: 奄美（薩摩藩の直轄）
      note: もとは琉球王国の領域だったが、1609年の薩摩藩の琉球侵攻の後、1611年に薩摩藩の直轄地とされた（表向きは琉球の一部として扱われ、中国には隠された）。江戸時代の後半には黒糖の専売で厳しく取り立てられた（黒糖地獄）
      source: "https://ja.wikipedia.org/wiki/奄美群島"
    - from: 1871
      owner: japan
      label: ""
      cause: 廃藩置県で鹿児島県の一部になる
      source: "https://ja.wikipedia.org/wiki/奄美群島"
    - from: 1945
      owner: japan
      overlord: usa
      label: 日本（連合国の占領下）
      cause: 日本の降伏と連合国軍の占領
      source: "https://ja.wikipedia.org/wiki/連合国軍占領下の日本"
    - from: 1946
      owner: usa
      certainty: occupied
      label: 奄美群島（アメリカの軍政）
      cause: 連合国軍総司令部の覚書（2月2日）で北緯30度以南が日本の行政から切り離され、アメリカ軍の軍政下に置かれる
      note: 1950年から臨時北部南西諸島政庁、1952年から琉球政府の管轄。住民の99％が署名した復帰運動が広がった
      source: "https://ja.wikipedia.org/wiki/奄美群島の復帰運動"
    - from: 1952
      owner: usa
      certainty: occupied
      label: 奄美群島（アメリカの施政権下）
      cause: サンフランシスコ平和条約第3条で、沖縄とともにアメリカの施政権下に置かれる
      source: "https://ja.wikipedia.org/wiki/日本国との平和条約"
    - from: 1953
      owner: japan
      label: ""
      cause: 奄美群島の日本復帰（12月25日）
