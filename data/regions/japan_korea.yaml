      cause: 明の援軍（李如松）が平壌を奪い返し（1月）、日本軍は漢城を捨てて慶尚道の南岸に退く（4–5月）。日明の講和交渉が始まる
      source: "https://ja.wikipedia.org/wiki/平壌包囲戦_(1593年)"

