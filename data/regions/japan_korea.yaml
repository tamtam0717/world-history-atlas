# ---- 朝鮮半島 ----
# 現代の北朝鮮（PRK）・韓国（KOR）の道はどれも、1945–50年の北緯38度線でも1953年の休戦ラインでも、面積の大きい側が同じ（開城・甕津は北、江原道の束草・鉄原の南部は南）。
# このため、ピースの粒度では38度線と休戦ラインの違いは描けない（note で示す）。

- id: korea
  name: 朝鮮半島
  select:
    iso_all: [KOR, PRK]
  timeline:
    - from: 1453
      owner: joseon
      overlord: ming
      note: 1392年に李成桂が建てた朝鮮王朝。明の冊封を受けて朝貢した。首都は漢城（ソウル）。15世紀前半の世宗の時代に北方の女真を退けて鴨緑江・豆満江までを領土とし（四郡六鎮。ただし鴨緑江上流の四郡は女真の侵入で守りきれず、1455–1459年に廃された〈廃四郡〉。地図では朝鮮のままにしている）、訓民正音（ハングル）を定めた
      source: "https://ja.wikipedia.org/wiki/李氏朝鮮"
    - from: 1637
      owner: joseon
      overlord: qing
      cause: 丙子胡乱（1636年12月–1637年2月）で清のホンタイジに降伏し（三田渡の盟約）、明との関係を断って清の冊封を受ける
      note: 清の侵入は陰暦の崇徳元年12月で、西暦では1637年1月にあたるので、1637年から清の帯とする。1627年の丁卯胡乱では後金と「兄弟の盟」を結んだが、明の冊封は続いた
      source: "https://ja.wikipedia.org/wiki/丙子の乱"
    - from: 1648
      owner: joseon
      overlord: qing
      note: 丙子胡乱（1636–37）で清に降伏し、清の冊封を受けて朝貢した。首都は漢城（ソウル）
      source: "https://ja.wikipedia.org/wiki/丙子の乱"
    - from: 1895
      owner: joseon
      cause: 下関条約で清が朝鮮の独立を認め、清の宗主権がなくなる
      source: "https://ja.wikipedia.org/wiki/下関条約"
    - from: 1905
      owner: japan
      label: 大韓帝国（日本の保護国）
      cause: 第2次日韓協約（乙巳条約）で韓国は外交権を失い、日本の保護国となる。統監府が置かれる（初代統監は伊藤博文）
      note: 1907年の第3次日韓協約で内政も日本の統監が握り、韓国軍は解散させられた
      source: "https://ja.wikipedia.org/wiki/第二次日韓協約"
    - from: 1910
      owner: japan
      label: 朝鮮（日本の植民地）
      cause: 韓国併合条約（8月）。朝鮮総督府が置かれる
      note: 初代総督は寺内正毅。1910年代の武断政治、三・一独立運動（1919）後の「文化政治」、1930年代後半からの皇民化政策（創氏改名・神社参拝の強制など）と戦時の動員が行われた
      source: "https://ja.wikipedia.org/wiki/韓国併合"

# ---- 壬辰・丁酉倭乱（文禄・慶長の役、1592–98）。1648 年より前だけの地域（until） ----
# 年末の状態：1592年末は日本軍が漢城・平壌・咸鏡道など半島の大部分を占領（全羅道・平安道北部は朝鮮側）。
# 1593年に明軍が平壌を奪回し、日本軍は慶尚道南岸の倭城（釜山・蔚山など）に退く。1597年の再侵攻（丁酉倭乱）でも年末には南岸の倭城に戻った。
# 戦後の項目（朝鮮に戻る年）は、国境の変化の理由を出すために書き、その年で地域を終える（until）。
# 慶尚南道（KOR-South_Gyeongsang）は南岸の倭城（熊川・巨済・泗川・固城など）が日本軍の手にあったが、面積の大半は朝鮮側なので朝鮮として描く。

