# ---- 北緯38度線と休戦ライン（2026-11-21 のピースの分割）----
# 年末の状態：1950年末は中国軍の参戦で国連軍が38度線付近まで退いた（翌1951年1月4日にソウルを再び失う）。
# 1951年夏からは、ほぼ休戦ラインの位置で戦線が動かなくなった。戦争中の支配は occupied（赤い斜線）で描く。

- id: korea_north_of_38_in_kor
  name: 38度線の北の江原道・京畿道（鉄原・束草・漣川など）
  names:
    - {from: 1953, name: 収復地区（38度線の北の韓国領）}
  select:
    pieces: [KOR-Gangwon_North_of_38th_parallel, KOR-Gyeonggi_North_of_38th_parallel]
  timeline:
    - from: 1945
      owner: soviet_union
      certainty: occupied
      label: 朝鮮北部（ソ連軍の占領）
      cause: 日本の降伏後、北緯38度線以北をソ連軍が占領する（8月）
      source: "https://ja.wikipedia.org/wiki/ソ連軍政期の朝鮮"
    - from: 1948
      owner: north_korea
      cause: 朝鮮民主主義人民共和国の成立（9月9日）。江原道の北部（鉄原・束草など）は北朝鮮の江原道に属した
      source: "https://ja.wikipedia.org/wiki/朝鮮民主主義人民共和国"
    - from: 1950
      owner: north_korea
      cause: 朝鮮戦争（6月）。国連軍は10月に38度線をこえて北進したが、中国の人民志願軍の参戦で12月に38度線付近まで退く
      note: 年末の戦線はほぼ38度線で、この地域は中朝軍の側にあった
      source: "https://ja.wikipedia.org/wiki/朝鮮戦争"
    - from: 1951
      owner: south_korea
      certainty: occupied
      label: 国連軍の支配地
      cause: 国連軍の反攻（2–6月）で戦線が38度線の北に押し上げられ、鉄原・金化・束草の線で動かなくなる。7月から休戦会談
      source: "https://ja.wikipedia.org/wiki/朝鮮戦争"
    - from: 1953
      owner: south_korea
      label: ""
      cause: 朝鮮戦争の休戦協定（7月27日）。休戦ライン（軍事境界線）の南となり、韓国領になる
      note: 休戦の後しばらくは国連軍（アメリカ軍）が軍政を敷き、1954年11月に韓国に行政が移された（「収復地区」）
      source: "https://ja.wikipedia.org/wiki/朝鮮戦争休戦協定"

