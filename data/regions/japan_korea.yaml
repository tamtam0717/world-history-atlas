      PRK-Kangwon, PRK-North_Hwanghae, PRK-North_Hwanghae_South_of_38th_parallel, PRK-South_Hwanghae, PRK-South_Hwanghae_South_of_38th_parallel,
      PRK-Pyongyang, PRK-Nampo, PRK-South_Pyongan, PRK-South_Hamgyong]
  timeline:
    - from: 1453
      owner: joseon
      overlord: ming
      note: 戦乱の前の状態（朝鮮半島全体の korea と同じ）。国境の変化を右パネルに出すために書く
    - from: 1592
      owner: japan
      certainty: occupied
      label: 日本軍の占領（壬辰倭乱）
      cause: 豊臣秀吉の命で日本軍が釜山に上陸し（4月、西暦5月）、漢城（5月）・平壌（6月）を落とし、加藤清正は咸鏡道まで進む
      note: 国王宣祖は鴨緑江の義州まで逃れた。全羅道は李舜臣の水軍と義兵に守られて占領されなかった。占領地でも各地の義兵が抵抗した。咸鏡道の北部（咸鏡北道のピース、鏡城・吉州より北）は加藤清正の軍が会寧まで進んだが、1592年の秋から冬に鄭文孚らの義兵が取り戻したので、年末の状態として朝鮮のままにしている。忠清南道は錦山などで戦いがあったが朝鮮側として描いた
      source: "https://ja.wikipedia.org/wiki/文禄・慶長の役"
    - from: 1593
