    - {from: 1577, owner: netherlands, certainty: uncertain, cause: ヘントの和約（1576年）で全国議会がスペイン軍と戦う。ヘント・ブルッヘなどはカルヴァン派の都市共和国に（1577–84年）, source: 'https://ja.wikipedia.org/wiki/ヘントの和約'}
    - {from: 1584, owner: spain, overlord: hre, cause: パルマ公アレッサンドロ・ファルネーゼの再征服（ブルッヘ・ヘントが降伏）, source: 'https://ja.wikipedia.org/wiki/アレッサンドロ・ファルネーゼ_(パルマ公)'}
