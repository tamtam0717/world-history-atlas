      source: "https://en.wikipedia.org/wiki/German_occupation_of_Belgium_during_World_War_I"
    - from: 1918
      owner: belgium
      cause: "第一次世界大戦の休戦（11月）でドイツ軍が撤退"
    - from: 1940
      owner: germany
      certainty: occupied
      label: "ベルギー（ドイツの占領）"
      cause: "第二次世界大戦でドイツ軍が侵入（5月）。国王レオポルド3世が降伏し、ドイツの軍政下に置かれた"
      source: "https://en.wikipedia.org/wiki/German_occupation_of_Belgium_during_World_War_II"
    - from: 1944
      owner: belgium
      cause: "連合軍による解放（9月）"
