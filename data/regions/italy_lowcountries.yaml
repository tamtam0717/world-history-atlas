      source: "https://en.wikipedia.org/wiki/German_occupation_of_Belgium_during_World_War_I"
    - from: 1918
      owner: belgium
      cause: "第一次世界大戦の休戦（11月）でドイツ軍が撤退"
    - from: 1940
      owner: germany
