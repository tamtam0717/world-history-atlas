# 担当 C（低地諸国・スイス・イタリア）の地域と所属の変遷（1648–1815 試作）
# 範囲：NLD BEL LUX CHE LIE ITA SMR VAT MLT
# 重なりの決まり：その年に記述のある地域のうち、いちばん小さい地域が優先される。

# ================================================================ オランダ（北ネーデルラント）

- id: nl_republic
  name: オランダ（七州と国家連合直轄領）
  select:
    iso: [NLD]
  timeline:
    - from: 1648
      owner: netherlands
      cause: ウェストファリア条約（ミュンスター条約）で独立を承認
      source: "https://ja.wikipedia.org/wiki/ミュンスター条約_(1648年)"
    - from: 1810
      owner: france
      cause: ホラント王国のフランス帝国への併合
      source: "https://ja.wikipedia.org/wiki/ホラント王国"
    - from: 1813
      owner: netherlands
      cause: フランス支配からの解放・ウィレム1世の帰国
      source: "https://ja.wikipedia.org/wiki/ネーデルラント連合王国"
  note: >-
    国家連合直轄領（ヘネラリテイト・ランデン：北ブラバント、ゼーラント・フランデレン、リンブルフの一部）を含む。
    クーレンボルフ・ベルフ伯領・ラーフェンステインなど小さな帝国領の飛び地は省略。

- id: zeeland_flanders
  name: ゼーラント・フランデレン（国家連合直轄領）
  select:
    pieces: [NLD-Sluis, NLD-Terneuzen, NLD-Hulst]
  timeline:
    - from: 1648
      owner: netherlands
    - from: 1795
      owner: france
      cause: ハーグ条約（バタヴィア共和国がフランスに割譲）
      source: "https://en.wikipedia.org/wiki/Treaty_of_The_Hague_(1795)"
    - from: 1814
      owner: netherlands
      cause: パリ条約（第1次）

# --- 現代のオランダ領リンブルフ（歴史的には分裂していた）
- id: nl_limburg
  name: 上ヘルレ（オーバークワルティール）とマース川流域
  select:
    adm1: ["NLD/Limburg"]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
    - from: 1714
      owner: habsburg
      overlord: hre
      cause: ラシュタット条約（スペイン領ネーデルラントがオーストリア領に）
      source: "https://ja.wikipedia.org/wiki/ラシュタット条約"
    - from: 1795
      owner: france
      cause: フランスへの併合（ムーズ＝アンフェリウール県。1797年カンポ・フォルミオ条約で承認）
    - from: 1814
      owner: netherlands
      certainty: uncertain
      cause: パリ条約（第1次）。連合国の暫定統治下
      note: 1814年には連合国の暫定統治下にあり、帰属はウィーン会議で確定した。
    - from: 1815
      owner: netherlands
      cause: ウィーン議定書
  note: ローアモント・ウェールトなど。下位の地域でオランダ・プロイセン・ユーリヒ・リエージュの部分を上書きする。

- id: maastricht
  name: マーストリヒト
  select:
    pieces: [NLD-Maastricht]
  timeline:
    - from: 1648
      owner: netherlands
      certainty: uncertain
      note: オランダ（国家連合）とリエージュ司教の共同統治。1673–1678年にはフランス軍が占領した。
      source: "https://en.wikipedia.org/wiki/Maastricht#History"
    - from: 1795
      owner: france
      cause: ハーグ条約・フランスへの併合
    - from: 1814
      owner: netherlands
      cause: パリ条約（第1次）

- id: overmaas
  name: マース川東岸の諸地方（ファルケンブルフなど）
  select:
    pieces: [NLD-Eijsden_Margraten, NLD-Valkenburg_aan_de_Geul, NLD-Meerssen, NLD-Heerlen, NLD-Voerendaal,
      NLD-Beekdaelen, NLD-Brunssum, NLD-Gulpen_Wittem, NLD-Vaals, NLD-Simpelveld, NLD-Beek, NLD-Stein]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
      certainty: uncertain
      note: ミュンスター条約後もオランダとスペインが帰属を争った。
    - from: 1661
      owner: netherlands
      cause: 分割条約（オーフェルマース分割。ファルケンブルフなどの大部分がオランダ領に）
      note: 境界は入り組んでおり、ピースの粒度では大まかな表現。要確認
      source: "https://en.wikipedia.org/wiki/Partition_Treaty_(1661)"
    - from: 1795
      owner: france
      cause: ハーグ条約・フランスへの併合
    - from: 1814
      owner: netherlands
      cause: パリ条約（第1次）

- id: julich_nl
  name: シッタルト・スステレン（ユーリヒ公国の飛び地）
  select:
    pieces: [NLD-Sittard_Geleen, NLD-Echt_Susteren]
  timeline:
    - from: 1648
      owner: palatinate_neuburg
      overlord: hre
      note: ユーリヒ公国（プファルツ＝ノイブルク家。1685年からプファルツ選帝侯家）の一部。要確認
    - from: 1685
      owner: palatinate
      overlord: hre
      cause: ノイブルク公がプファルツ選帝侯位を継承（ドイツ側のユーリヒ公領と同じ扱い）
    - from: 1777
      owner: bavaria
      overlord: hre
      cause: プファルツ選帝侯カール・テオドールがバイエルンを相続
    - from: 1795
      owner: france
      cause: フランスへの併合
    - from: 1814
      owner: netherlands
      certainty: uncertain
      cause: パリ条約（第1次）。連合国の暫定統治下
    - from: 1815
      owner: netherlands
      cause: ウィーン議定書

- id: upper_guelders_dutch
  name: フェンロー・モンフォールト（1713年からオランダ領上ヘルレ）
  select:
    pieces: [NLD-Venlo, NLD-Roerdalen, NLD-Maasgouw]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
    - from: 1713
      owner: netherlands
      cause: ユトレヒト条約（上ヘルレの分割。1715年の防壁条約で確定）
      source: "https://en.wikipedia.org/wiki/Upper_Guelders"
    - from: 1795
      owner: france
      cause: ハーグ条約・フランスへの併合
    - from: 1814
      owner: netherlands
      certainty: uncertain
      cause: パリ条約（第1次）。連合国の暫定統治下
    - from: 1815
      owner: netherlands
      cause: ウィーン議定書

- id: upper_guelders_prussian
  name: ケッセル・フェンライ（1713年からプロイセン領上ヘルレ）
  select:
    pieces: [NLD-Horst_aan_de_Maas, NLD-Peel_en_Maas, NLD-Venray, NLD-Bergen_L, NLD-Mook_en_Middelaar]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
    - from: 1713
      owner: prussia
      overlord: hre
      cause: ユトレヒト条約（上ヘルレの分割）
      note: フェンライ・ベルヘンの帰属は要確認
      source: "https://en.wikipedia.org/wiki/Upper_Guelders"
    - from: 1794
      owner: france
      overlord: hre
      certainty: occupied
      cause: フランス革命軍がクレーフェ・上ヘルレのプロイセン領を占領（1795年バーゼル条約の秘密条項で割譲を容認）
    - from: 1801
      owner: france
      cause: リュネヴィル条約でライン左岸とともにフランス領に確定
    - from: 1814
      owner: netherlands
      certainty: uncertain
      cause: パリ条約（第1次）。連合国の暫定統治下
    - from: 1815
      owner: netherlands
      cause: ウィーン議定書

- id: gennep
  name: ヘネップ（クレーフェ公国の一部）
  select:
    pieces: [NLD-Gennep]
  timeline:
    - from: 1648
      owner: prussia
      overlord: hre
      note: クレーフェ公国とともにブランデンブルク選帝侯（ホーエンツォレルン家）の領地。
    - from: 1794
      owner: france
      overlord: hre
      certainty: occupied
      cause: フランス革命軍がクレーフェ・上ヘルレのプロイセン領を占領（1795年バーゼル条約の秘密条項で割譲を容認）
    - from: 1801
      owner: france
      cause: リュネヴィル条約でライン左岸とともにフランス領に確定
    - from: 1814
      owner: netherlands
      certainty: uncertain
      cause: パリ条約（第1次）。連合国の暫定統治下
    - from: 1815
      owner: netherlands
      cause: ウィーン議定書

# ================================================================ 南ネーデルラント（ベルギー）・リエージュ・ルクセンブルク

- id: southern_netherlands
  name: 南ネーデルラント（スペイン領→オーストリア領）
  select:
    iso: [BEL]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
      note: ブルグント・クライスとして帝国に属する。
    - from: 1714
      owner: habsburg
      overlord: hre
      cause: ユトレヒト条約（1713）・ラシュタット条約（1714）でオーストリア領に
      source: "https://ja.wikipedia.org/wiki/ラシュタット条約"
    - from: 1795
      owner: france
      cause: フランスへの併合（1797年カンポ・フォルミオ条約でオーストリアが承認）
      source: "https://ja.wikipedia.org/wiki/カンポ・フォルミオ条約"
    - from: 1814
      owner: netherlands
      certainty: uncertain
      cause: パリ条約（第1次）・ロンドン八か条議定書（オランダとの合同を決定）
      note: 1814年には連合国の暫定統治下にあり（8月からオラニエ公が総督）、合同はウィーン会議で確定した。
      source: "https://en.wikipedia.org/wiki/Eight_Articles_of_London"
    - from: 1815
      owner: netherlands
      cause: ウィーン議定書（ネーデルラント連合王国の成立）
      source: "https://ja.wikipedia.org/wiki/ウィーン議定書"

- id: liege_region
  name: リエージュ司教領
  select:
    pieces: [BEL-Liege, BEL-Huy, BEL-Waremme, BEL-Verviers, BEL-Hasselt, BEL-Tongres, BEL-Maaseik,
      BEL-Dinant, BEL-Philippeville, NLD-Leudal]
  timeline:
    - from: 1648
      owner: liege
      overlord: hre
      note: >-
        ローン伯領（現リンブルフ州）・フランシモン・ホールン伯領（NLD-Leudal）を含む。
        ヴェルヴィエのピースは東部にリンブルフ公国（スペイン領）・スタヴロ＝マルメディ修道院領・ルクセンブルク公国の一部を含む。
        フィリップヴィル周辺は1659年からフランスの飛び地（フィリップヴィル・マリアンブール）。いずれもピースの粒度では表せない。
    - from: 1795
      owner: france
      cause: フランスへの併合
    - from: 1814
      owner: netherlands
      certainty: uncertain
      cause: パリ条約（第1次）・ロンドン八か条議定書
      note: 1814年には連合国の暫定統治下にあり、帰属はウィーン会議で確定した。
    - from: 1815
      owner: netherlands
      cause: ウィーン議定書（ネーデルラント連合王国の成立）
  source: "https://ja.wikipedia.org/wiki/リエージュ司教領"

- id: tournai_furnes
  name: トゥルネー・フュルヌ（1668年からフランス領）
  select:
    pieces: [BEL-Tournai, BEL-Furnes]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
    - from: 1668
      owner: france
      cause: アーヘンの和約（南ネーデルラント継承戦争）
      source: "https://ja.wikipedia.org/wiki/アーヘンの和約_(1668年)"
    - from: 1714
      owner: habsburg
      overlord: hre
      cause: ユトレヒト条約でフランスが返還（1715年の防壁条約でオーストリアへ引き渡し）
      source: "https://en.wikipedia.org/wiki/Barrier_Treaty"
    - from: 1795
      owner: france
      cause: フランスへの併合
    - from: 1814
      owner: netherlands
      cause: パリ条約（第1次）・ロンドン八か条議定書

- id: ypres
  name: イーペル（1678年からフランス領）
  select:
    pieces: [BEL-Ypres]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
    - from: 1678
      owner: france
      cause: ナイメーヘンの和約
      source: "https://ja.wikipedia.org/wiki/ナイメーヘンの和約"
    - from: 1714
      owner: habsburg
      overlord: hre
      cause: ユトレヒト条約でフランスが返還（1715年の防壁条約でオーストリアへ引き渡し）
    - from: 1795
      owner: france
      cause: フランスへの併合
    - from: 1814
      owner: netherlands
      cause: パリ条約（第1次）・ロンドン八か条議定書

- id: aachen_1668_returned
  name: コルトレイク・アウデナールデ・アト（1668–1678年フランス領）
  select:
    pieces: [BEL-Courtrai, BEL-Audenarde, BEL-Ath]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
    - from: 1668
      owner: france
      cause: アーヘンの和約（南ネーデルラント継承戦争）
      source: "https://ja.wikipedia.org/wiki/アーヘンの和約_(1668年)"
    - from: 1678
      owner: spain
      overlord: hre
      cause: ナイメーヘンの和約でスペインに返還
      source: "https://ja.wikipedia.org/wiki/ナイメーヘンの和約"
    - from: 1714
      owner: habsburg
      overlord: hre
      cause: ユトレヒト条約（1713）・ラシュタット条約（1714）でオーストリア領に
    - from: 1795
      owner: france
      cause: フランスへの併合
    - from: 1814
      owner: netherlands
      cause: パリ条約（第1次）・ロンドン八か条議定書
  note: シャルルロワ・バンシュも1668–1678年にフランス領だったが、町とその周辺だけでピースの大半を占めないため描かない。

- id: luxembourg
  name: ルクセンブルク公国
  select:
    iso: [LUX]
    adm2: ["BEL/Luxemburg"]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
    - from: 1684
      owner: france
      overlord: hre
      certainty: occupied
      cause: ルクセンブルク攻略・レーゲンスブルクの休戦条約（20年間の領有を認める）
      source: "https://en.wikipedia.org/wiki/Truce_of_Ratisbon"
    - from: 1697
      owner: spain
      overlord: hre
      cause: ライスワイク条約でスペインに返還
      source: "https://ja.wikipedia.org/wiki/レイスウェイク条約"
    - from: 1714
      owner: habsburg
      overlord: hre
      cause: ユトレヒト条約・ラシュタット条約でオーストリア領に
    - from: 1795
      owner: france
      cause: ルクセンブルク要塞の降伏（6月）とフランスへの併合（森林県）
    - from: 1814
      owner: prussia
      certainty: occupied
      cause: パリ条約（第1次）でフランスが放棄。連合国（プロイセン）の暫定統治下
    - from: 1815
      owner: netherlands
      overlord: german_confederation
      cause: ウィーン議定書でルクセンブルク大公国となり、オランダ王が大公を兼ねる（ドイツ連邦に加盟）
      source: "https://ja.wikipedia.org/wiki/ルクセンブルク大公国"
  note: 現ベルギーのリュクサンブール州は1839年までルクセンブルク大公国の一部。ブイヨン公国（リエージュ領→1678年からフランスの保護下）は省略。

# ================================================================ スイスとその周辺

- id: swiss_confederacy
  name: スイス（13邦と共同支配地）
  select:
    iso: [CHE]
  timeline:
    - from: 1648
      owner: switzerland
      cause: ウェストファリア条約で帝国からの独立を承認
      source: "https://ja.wikipedia.org/wiki/ヴェストファーレン条約"
  note: >-
    ティチーノ・トゥールガウ・アールガウ東部などの共同支配地、ザンクト・ガレン修道院領・ビール（ビエンヌ）などの同盟邦を含む。
    1798年からヘルヴェティア共和国、1803年から調停法によるスイス連邦（名前は政体の names で切り替え）。
    タラスプ（オーストリア領の飛び地）・ラジュンスなどの小さな領地は省略。

- id: graubunden_region
  name: グラウビュンデン（三同盟）
  select:
    adm1: ["CHE/Graubünden"]
  timeline:
    - from: 1648
      owner: graubunden
      note: スイス盟約者団の同盟邦。
    - from: 1799
      owner: switzerland
      cause: ヘルヴェティア共和国への編入（レティア州。1803年からグラウビュンデン州）
      source: "https://en.wikipedia.org/wiki/Three_Leagues"

- id: valais_region
  name: ヴァレー
  select:
    adm1: ["CHE/Valais"]
  timeline:
    - from: 1648
      owner: valais
      note: スイス盟約者団の同盟邦。下ヴァレー（モンテー・サン＝モーリスなど）は上ヴァレーの従属地。
    - from: 1798
      owner: switzerland
      cause: ヘルヴェティア共和国への編入
    - from: 1802
      owner: valais
      cause: ロダニア共和国として分離・独立（フランスの保護下）
      source: "https://en.wikipedia.org/wiki/Rhodanic_Republic"
    - from: 1810
      owner: france
      cause: フランスへの併合（シンプロン県）
    - from: 1814
      owner: valais
      cause: フランス軍の撤退と独立の回復
    - from: 1815
      owner: switzerland
      cause: ウィーン会議・スイスへの加盟

- id: geneva_region
  name: ジュネーヴ
  select:
    pieces: [CHE-Geneve]
  timeline:
    - from: 1648
      owner: geneva
      note: スイス盟約者団の同盟邦。
    - from: 1798
      owner: france
      cause: フランスへの併合（レマン県）
      source: "https://en.wikipedia.org/wiki/Republic_of_Geneva"
    - from: 1813
      owner: geneva
      cause: フランス軍の撤退と共和国の復活（12月31日）
    - from: 1815
      owner: switzerland
      cause: ウィーン会議・スイスへの加盟

- id: neuchatel_region
  name: ヌーシャテル
  select:
    adm1: ["CHE/Neuchâtel"]
  timeline:
    - from: 1648
      owner: neuchatel
      note: スイス盟約者団の同盟邦。1707年からプロイセン王が君主。
    - from: 1815
      owner: switzerland
      cause: ウィーン会議・スイスへの加盟（プロイセン王の公国でもあり続けた）
      source: "https://en.wikipedia.org/wiki/Principality_of_Neuchâtel"

- id: basel_bishopric_imperial
  name: バーゼル司教領（帝国に属する北部）
  select:
    pieces: [CHE-Porrentruy, CHE-Delemont, CHE-Les_Franches_Montagnes, CHE-Laufen, CHE-Arlesheim]
  timeline:
    - from: 1648
      owner: basel_bishopric
      overlord: hre
    - from: 1793
      owner: france
      cause: フランスへの併合（ラウラキア共和国を経てモン＝テリブル県）
      source: "https://en.wikipedia.org/wiki/Rauracian_Republic"
    - from: 1815
      owner: switzerland
      cause: ウィーン会議でベルン州（アルレスハイムはバーゼル州）に編入

- id: basel_bishopric_swiss
  name: バーゼル司教領南部とビール（スイスの同盟者）
  select:
    pieces: [CHE-Moutier, CHE-Courtelary, CHE-La_Neuveville, CHE-Biel]
  timeline:
    - from: 1648
      owner: basel_bishopric
      note: 司教領のうちスイス盟約者団と同盟していた南部（エルゲル・ムーティエ＝グランヴァル・ラ・ヌーヴヴィル）。ビールは司教の主権下の自治都市で、スイスの同盟邦。
    - from: 1797
      owner: france
      cause: フランスへの併合（1797年12月、ビールは1798年2月）
    - from: 1815
      owner: switzerland
      cause: ウィーン会議でベルン州に編入

- id: fricktal
  name: フリックタール（前方オーストリア）
  select:
    pieces: [CHE-Rheinfelden, CHE-Laufenburg]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
      note: 前方オーストリア（ハプスブルク家の西南ドイツ領）の一部。
