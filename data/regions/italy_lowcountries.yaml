    - from: 1648
      owner: spain
      overlord: hre
      note: ブルグント・クライスとして帝国に属する。
    - from: 1714
      owner: habsburg
      overlord: hre
      cause: ユトレヒト条約（1713）・ラシュタット条約（1714）でオーストリア領に
      source: "https://ja.wikipedia.org/wiki/ラシュタット条約"
    - from: 1795
      owner: france
      cause: フランスへの併合（1797年カンポ・フォルミオ条約でオーストリアが承認）
      source: "https://ja.wikipedia.org/wiki/カンポ・フォルミオ条約"
    - from: 1814
