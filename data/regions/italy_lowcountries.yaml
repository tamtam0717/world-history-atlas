# --- 現代のオランダ領リンブルフ（歴史的には分裂していた）
- id: nl_limburg
  name: 上ヘルレ（オーバークワルティール）とマース川流域
  select:
    adm1: ["NLD/Limburg"]
  timeline:
    - {from: 1453, owner: guelders, overlord: hre, source: 'https://ja.wikipedia.org/wiki/ヘルレ公国'}
    - {from: 1473, owner: burgundy, overlord: hre, cause: シャルル突進公がヘルレ公国を手に入れる（1473年）, source: 'https://ja.wikipedia.org/wiki/ヘルレ公国'}
    - {from: 1477, owner: guelders, overlord: hre, cause: ブルゴーニュ公国の解体で、ヘルレが自立を回復, source: 'https://ja.wikipedia.org/wiki/ヘルレ公国'}
    - {from: 1481, owner: habsburg_netherlands, overlord: hre, cause: マクシミリアンがヘルレを征服, source: 'https://ja.wikipedia.org/wiki/ヘルレ公国'}
    - {from: 1492, owner: guelders, overlord: hre, cause: カレル・ファン・エフモントが帰国し、フランスの支援でハプスブルク家に対抗, source: 'https://en.wikipedia.org/wiki/Charles_II,_Duke_of_Guelders'}
    - {from: 1543, owner: habsburg_netherlands, overlord: hre, cause: フェンロー条約。ヘルレ公国（ズトフェン伯領を含む）がカール5世の領土に, source: 'https://en.wikipedia.org/wiki/Treaty_of_Venlo'}
    - {from: 1556, owner: spain, overlord: hre, cause: カール5世の退位。ネーデルラントはスペイン王フェリペ2世の領土に}
    - from: 1648
      owner: spain
      overlord: hre
    - from: 1714
      owner: habsburg
      overlord: hre
      cause: ラシュタット条約（スペイン領ネーデルラントがオーストリア領に）
      source: "https://ja.wikipedia.org/wiki/ラシュタット条約"
    - from: 1795
      owner: france
      cause: フランスへの併合（ムーズ＝アンフェリウール県。1797年カンポ・フォルミオ条約で承認）
    - from: 1814
      owner: netherlands
      certainty: uncertain
      cause: パリ条約（第1次）。連合国の暫定統治下
      note: 1814年には連合国の暫定統治下にあり、帰属はウィーン会議で確定した。
    - from: 1815
      owner: netherlands
      cause: ウィーン議定書
    - from: 1830
      owner: belgium
      certainty: uncertain
      cause: ベルギー独立革命。マーストリヒト要塞を除くリンブルフの大部分がベルギー側の支配下に（オランダは独立を認めず）
      source: "https://ja.wikipedia.org/wiki/ベルギー独立革命"
    - from: 1839
      owner: netherlands
      overlord: german_confederation
      cause: ロンドン条約（1839）でリンブルフを分割。マース川東岸とフェンローなどがオランダ領に残り、リンブルフ公国としてドイツ連邦に加盟（ルクセンブルク西部をベルギーに譲った代わり）
      source: "https://en.wikipedia.org/wiki/Duchy_of_Limburg_(1839–1867)"
    - from: 1866
      owner: netherlands
      cause: 普墺戦争の後、プラハ条約でドイツ連邦が解体（1867年のロンドン条約でリンブルフはオランダの一州と確認）
      source: "https://ja.wikipedia.org/wiki/プラハ条約_(1866年)"
    - from: 1940
      owner: germany
      certainty: occupied
      label: "オランダ（ドイツの占領）"
      cause: "第二次世界大戦でドイツ軍が侵入（5月。ロッテルダム爆撃の後に降伏）。女王と政府はロンドンに亡命し、ドイツの国家弁務官が統治した"
      source: "https://en.wikipedia.org/wiki/German_occupation_of_the_Netherlands"
    - from: 1944
      owner: netherlands
      cause: "連合軍による解放（1944年9〜11月。南部）"
  note: ローアモント・ウェールトなど。下位の地域でオランダ・プロイセン・ユーリヒ・リエージュの部分を上書きする。1830年以降の変遷は下位の地域にも同じものを書いている。

