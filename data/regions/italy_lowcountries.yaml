        リヴォルノのピースのうちピオンビーノ公国とエルバ島の一部は省略。
        マッサ・カッラーラのピースは、大部分がルニジャーナ（ポントレーモリ・フィヴィッツァーノなどのトスカーナ領と、マラスピーナ家の小さな帝国封土）で、
        南西の海沿いのマッサ＝カッラーラ公国（チーボ＝マラスピーナ家。1790年からエステ家のマリア・ベアトリーチェ。1797年チザルピーナ、1806年エリザ・ボナパルト領、1814年マリア・ベアトリーチェ復帰）はピースの一部（約2割）なので、面積の大きいトスカーナ領で代表させる。
