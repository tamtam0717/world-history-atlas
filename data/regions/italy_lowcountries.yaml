# 担当 C（低地諸国・スイス・イタリア）の地域と所属の変遷（1648–2025）
# 範囲：NLD BEL LUX CHE LIE ITA SMR VAT MLT
# 重なりの決まり：その年に記述のある地域のうち、いちばん小さい地域が優先される。

# ================================================================ オランダ（北ネーデルラント）

- id: nl_republic
  name: オランダ（七州と国家連合直轄領）
  names: [{from: 1815, name: "オランダ"}]
  select:
    iso: [NLD]
  timeline:
    - {from: 1453, owner: burgundy, overlord: hre, cause: ブルゴーニュ公フィリップ（善良公）の支配下（ブルゴーニュ領ネーデルラント）, source: 'https://ja.wikipedia.org/wiki/ブルゴーニュ領ネーデルラント'}
    - {from: 1477, owner: habsburg_netherlands, overlord: hre, cause: シャルル突進公の戦死（ナンシーの戦い）。娘マリーがハプスブルク家のマクシミリアンと結婚し、ネーデルラントはハプスブルク家へ, source: 'https://ja.wikipedia.org/wiki/マリー・ド・ブルゴーニュ'}
    - {from: 1556, owner: spain, overlord: hre, cause: カール5世の退位（1555–56年）。ネーデルラントはスペイン王フェリペ2世の領土に, source: 'https://ja.wikipedia.org/wiki/カール5世_(神聖ローマ皇帝)'}
    - {from: 1572, owner: netherlands, cause: 海乞食団がブリーレを占領（1572年4月）。ホラント・ゼーラントの諸都市がオラニエ公ウィレムを総督に迎えて反乱（オランダ独立戦争）, source: 'https://ja.wikipedia.org/wiki/八十年戦争'}
    - from: 1648
      owner: netherlands
      cause: ウェストファリア条約（ミュンスター条約）で独立を承認
      source: "https://ja.wikipedia.org/wiki/ミュンスター条約_(1648年)"
    - from: 1810
      owner: france
      cause: ホラント王国のフランス帝国への併合
      source: "https://ja.wikipedia.org/wiki/ホラント王国"
    - from: 1813
      owner: netherlands
      cause: フランス支配からの解放・ウィレム1世の帰国
      source: "https://ja.wikipedia.org/wiki/ネーデルラント連合王国"
    - from: 1940
      owner: germany
      certainty: occupied
      label: "オランダ（ドイツの占領）"
      cause: "第二次世界大戦でドイツ軍が侵入（5月。ロッテルダム爆撃の後に降伏）。女王と政府はロンドンに亡命し、ドイツの国家弁務官が統治した"
      source: "https://en.wikipedia.org/wiki/German_occupation_of_the_Netherlands"
    - from: 1945
      owner: netherlands
      cause: "連合軍による解放とドイツ軍の降伏（1945年5月）"
  note: >-
    国家連合直轄領（ヘネラリテイト・ランデン：北ブラバント、ゼーラント・フランデレン、リンブルフの一部）を含む。
    クーレンボルフ・ベルフ伯領・ラーフェンステインなど小さな帝国領の飛び地は省略。

