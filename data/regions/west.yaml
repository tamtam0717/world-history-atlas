# 担当 A（西欧・北アフリカ）の地域と所属の変遷（1648–1815 試作）
# 大きな地域（現代の国全体など）でおおまかに書き、小さな地域で例外を上書きする。

# ================================================================ フランス
- id: france_kingdom
  name: フランス王国（本土）
  select:
    iso: [FRA]
  timeline:
    - from: 1648
      owner: france
      note: ここで上書きしない地域（三司教領メッス・トゥール・ヴェルダン、上アルザスなどを含む）はフランス領。
      source: "ja.wikipedia: フランス王国"

- id: upper_alsace
  name: 上アルザス（ズントガウ）
  select:
    pieces: [FRA-Altkirch, FRA-Thann, FRA-Mulhouse, FRA-Belfort]
  timeline:
    - from: 1648
      owner: france
      cause: ウェストファリア条約（ハプスブルク家のアルザス領をフランスに割譲）
      note: 都市ミュルーズはスイス盟約者団の同盟都市として1798年まで独立していた（ピースが粗いため描かない）。
      source: "ja.wikipedia: ヴェストファーレン条約"

- id: lower_alsace
  name: 下アルザスとデカポリス（十帝国都市）
  select:
    pieces: [FRA-Haguenau, FRA-Molsheim, FRA-Saverne, FRA-Selestat, FRA-Colmar]
  timeline:
    - from: 1648
      owner: france
      overlord: hre
      certainty: nominal
      cause: ウェストファリア条約（デカポリスの守護権などをフランスが得る）
      note: ウェストファリア条約の規定はあいまいで、ストラスブール司教領・ハーナウ＝リヒテンベルク伯領・十帝国都市などは帝国諸邦として残った。
      source: "ja.wikipedia: デカポリス (アルザス)"
    - from: 1680
      owner: france
      cause: 再統合（レユニオン）政策による併合（1697年ライスワイク条約で確認）
      note: デカポリスの諸都市は1673年に占領され、1679–81年の「再統合」で下アルザスの帝国諸邦は一括してフランス主権下に置かれた。
      source: "ja.wikipedia: 再統合政策"

- id: strasbourg_city
  name: ストラスブール
  select:
    pieces: [FRA-Strasbourg]
  timeline:
    - from: 1648
      owner: strasbourg
      overlord: hre
    - from: 1681
      owner: france
      cause: ルイ14世によるストラスブール併合
      source: "ja.wikipedia: ストラスブール"

- id: montbeliard
  name: モンベリアール伯領
  select:
    pieces: [FRA-Montbeliard]
  timeline:
    - from: 1648
      owner: wurttemberg
      overlord: hre
      note: ヴュルテンベルク公家の分家・本家が領有。
      source: "ja.wikipedia: モンベリアール"
    - from: 1793
      owner: france
      cause: フランスによる併合
      source: "ja.wikipedia: モンベリアール"

- id: franche_comte
  name: フランシュ＝コンテ（ブルゴーニュ伯領）
  select:
    pieces: [FRA-Besancon, FRA-Pontarlier, FRA-Dole, FRA-Lons_le_Saunier, FRA-Saint_Claude, FRA-Vesoul, FRA-Lure]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
      note: ブザンソンは1654年まで帝国自由都市（ピースが粗いため描かない）。
      source: "ja.wikipedia: フランシュ＝コンテ"
    - from: 1678
      owner: france
      cause: ナイメーヘンの和約
      source: "ja.wikipedia: ナイメーヘンの和約"

- id: lorraine_duchy
  name: ロレーヌ公国
  select:
    pieces: [FRA-Nancy, FRA-Luneville, FRA-Epinal, FRA-Saint_Die_des_Vosges, FRA-Neufchateau, FRA-Sarreguemines, FRA-Forbach, FRA-Commercy, FRA-Val_de_Briey, FRA-Sarrebourg]
  timeline:
    - from: 1648
      owner: france
      overlord: hre
      certainty: occupied
      note: 1633年からフランス軍が占領。
      source: "ja.wikipedia: ロレーヌ公国"
    - from: 1661
      owner: lorraine
      overlord: hre
      cause: ヴァンセンヌ条約（ロレーヌ公シャルル4世の復帰）
      source: "ja.wikipedia: ロレーヌ公国"
    - from: 1670
      owner: france
      overlord: hre
      certainty: occupied
      cause: フランス軍の再占領
      source: "ja.wikipedia: ロレーヌ公国"
    - from: 1697
      owner: lorraine
      overlord: hre
      cause: ライスワイク条約（レオポール公の復帰）
      source: "ja.wikipedia: レイスウェイク条約"
    - from: 1766
      owner: france
      cause: スタニスワフ・レシチニスキの死去によるフランス併合（1738年ウィーン条約の取り決め）
      source: "ja.wikipedia: ロレーヌ公国"
  note: ヴァル＝ド＝ブリエのロンウィ（ルクセンブルク領→1678年フランス）やザール地方の小領などはピースが粗いため描かない。

- id: sarrebourg
  name: サールブール（フランスへの軍用道路）
  select:
    pieces: [FRA-Sarrebourg]
  timeline:
    - from: 1661
      owner: france
      cause: ヴァンセンヌ条約（ロレーヌ公がアルザスへの通路をフランスに割譲）
      note: 1648–60年はロレーヌ公国と同じ扱い（フランス占領下）。
      source: "ja.wikipedia: ロレーヌ公国"

- id: barrois
  name: バール公領（バロワ・ムーヴァン）
  select:
    pieces: [FRA-Bar_le_Duc]
  timeline:
    - from: 1648
      owner: france
      certainty: occupied
      note: バール公領のうちムーズ川以西はフランス王の封土（帝国外）。ロレーヌ公が領有。
      source: "ja.wikipedia: バール公国"
    - from: 1661
      owner: lorraine
      cause: ヴァンセンヌ条約
    - from: 1670
      owner: france
      certainty: occupied
      cause: フランス軍の再占領
    - from: 1697
      owner: lorraine
      cause: ライスワイク条約
    - from: 1766
      owner: france
      cause: スタニスワフ・レシチニスキの死去によるフランス併合

