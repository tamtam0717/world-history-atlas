      cause: フランス＝スペイン条約
      note: リーフ山地の部族はスペインの支配に服さなかった（のちのリーフ戦争、1921–26）。
      source: "ja.wikipedia: スペイン保護領モロッコ"
    - from: 1921
      owner: rif_republic
      certainty: uncertain
      cause: アヌンヌの戦い（7月）でリーフの部族がスペイン軍に大勝し、アブドゥルカリームがリーフ共和国を建てる
      note: シャウエン（シェフシャウエン）は1924年にスペイン軍が撤退するまでスペインが保持していた。
      source: "https://ja.wikipedia.org/wiki/リーフ戦争"
    - from: 1926
      owner: spain
      cause: アルフセマス上陸（1925年9月）などフランス・スペインの共同作戦で、アブドゥルカリームが降伏（1926年5月）
      source: "https://ja.wikipedia.org/wiki/リーフ戦争"
