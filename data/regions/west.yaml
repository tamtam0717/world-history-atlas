# ================================================================ イベリア半島
- id: spain_kingdom
  name: スペイン王国（本土）
  select:
    iso: [ESP]
  timeline:
    - from: 1648
      owner: spain
      note: バレアレス諸島のメノルカ島はイギリス領の時期がある（1708–56、1763–82、1798–1802）が、ピースがマヨルカ島と一体のため描かない。ジブラルタル（1713年イギリス領）とオリベンサ（1801年までポルトガル領）もピースが粗く描かない。
      source: "ja.wikipedia: スペイン"

- id: catalonia_ne
  name: カタルーニャ東部（バルセロナ・ジローナ）
  select:
    pieces: [ESP-Barcelona, ESP-Girona]
  timeline:
    - from: 1648
      owner: france
      certainty: occupied
      note: 1640年のカタルーニャの反乱（収穫人戦争）以来、カタルーニャはフランス王を伯として迎え、フランス軍が駐留した。
      source: "ja.wikipedia: 収穫人戦争"
    - from: 1652
      owner: spain
      cause: バルセロナの降伏（カタルーニャの反乱の終結）
      source: "ja.wikipedia: 収穫人戦争"
    - from: 1705
      owner: spain
      certainty: uncertain
      cause: カール大公（カルロス3世を称する）派の支配
      note: スペイン継承戦争中、カタルーニャはハプスブルク家のカール大公を王として支持した。
      source: "ja.wikipedia: スペイン継承戦争"
    - from: 1714
      owner: spain
      cause: バルセロナ陥落（フェリペ5世の支配の回復）
      source: "ja.wikipedia: バルセロナ包囲戦_(1713年-1714年)"
    - from: 1812
      owner: france
      certainty: occupied
      cause: ナポレオンによるカタルーニャのフランス併合（4つの県に分割）
      source: "ja.wikipedia: 半島戦争"
    - from: 1814
      owner: spain
      cause: フランス軍の撤退
      source: "ja.wikipedia: 半島戦争"

- id: catalonia_sw
  name: カタルーニャ西部（リェイダ・タラゴナ）
  select:
    pieces: [ESP-Lleida, ESP-Tarragona]
  timeline:
    - from: 1648
      owner: spain
      note: リェイダとタラゴナは反乱中もスペイン王の軍が保持した。
      source: "ja.wikipedia: 収穫人戦争"
    - from: 1705
      owner: spain
      certainty: uncertain
      cause: カール大公（カルロス3世を称する）派の支配
      source: "ja.wikipedia: スペイン継承戦争"
    - from: 1714
      owner: spain
      cause: バルセロナ陥落（フェリペ5世の支配の回復）
      note: リェイダは1707年にブルボン軍が奪回。
      source: "ja.wikipedia: スペイン継承戦争"
    - from: 1812
      owner: france
      certainty: occupied
      cause: ナポレオンによるカタルーニャのフランス併合（4つの県に分割）
      source: "ja.wikipedia: 半島戦争"
    - from: 1814
      owner: spain
      cause: フランス軍の撤退
      source: "ja.wikipedia: 半島戦争"

- id: portugal_kingdom
  name: ポルトガル王国
  select:
    iso: [PRT]
  timeline:
    - from: 1648
      owner: portugal
      note: 1640年に再独立。スペインの承認は1668年のリスボン条約。ナポレオン期のフランス軍の占領（1807–08、1810–11）は一時的なため描かない。
      source: "ja.wikipedia: ポルトガル王政復古戦争"

