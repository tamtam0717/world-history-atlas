  timeline:
    - from: 1912
      owner: spain
      cause: フランス＝スペイン条約（11月。モロッコ北部をスペインの保護領とする）
      note: スペインの統治はテトゥアン（首都）とセウタ・メリリャ・ララシュの周辺にとどまった。
      source: "ja.wikipedia: スペイン保護領モロッコ"
    - from: 1936
      owner: nationalist_spain
      cause: スペイン内戦（7月。フランコ将軍らの反乱はモロッコ駐留軍から始まった）
      source: "https://ja.wikipedia.org/wiki/スペイン内戦"
    - from: 1939
      owner: spain
      cause: スペイン内戦の終結（反乱軍の勝利）
      source: "https://ja.wikipedia.org/wiki/スペイン内戦"
    - from: 1956
      owner: morocco
      cause: スペインとの共同宣言（4月）でスペイン保護領が独立モロッコに復帰
      source: "https://ja.wikipedia.org/wiki/モロッコ"

- id: morocco_spanish_rif
