# 担当 A（西欧・北アフリカ）の地域と所属の変遷（1648–1914）
# 大きな地域（現代の国全体など）でおおまかに書き、小さな地域で例外を上書きする。

# ================================================================ フランス
- id: france_kingdom
  name: フランス王国（本土）
  names: [{from: 1914, name: "フランス本土"}]
  select:
    iso: [FRA]
  timeline:
    - from: 1648
      owner: france
      note: ここで上書きしない地域（三司教領メッス・トゥール・ヴェルダン、上アルザスなどを含む）はフランス領。
      source: "ja.wikipedia: フランス王国"
    - from: 1940
      owner: germany
      certainty: occupied
      cause: 独仏休戦協定（6月。北部と大西洋岸をドイツが占領）
      source: "https://en.wikipedia.org/wiki/German_military_administration_in_occupied_France_during_World_War_II"
    - from: 1944
      owner: france
      cause: 連合軍のノルマンディー上陸（6月）・南仏上陸（8月）とパリ解放（8月）
      source: "https://en.wikipedia.org/wiki/Liberation_of_France"

- id: upper_alsace
  name: 上アルザス（ズントガウ）
  select:
    pieces: [FRA-Altkirch, FRA-Thann, FRA-Mulhouse, FRA-Belfort]
  timeline:
    - from: 1648
      owner: france
      cause: ウェストファリア条約（ハプスブルク家のアルザス領をフランスに割譲）
      note: 都市ミュルーズはスイス盟約者団の同盟都市として1798年まで独立していた（ピースが粗いため描かない）。
      source: "ja.wikipedia: ヴェストファーレン条約"
    - from: 1871
      owner: german_empire
      cause: フランクフルト講和条約（アルザス＝ロレーヌのドイツへの割譲）
      note: ドイツ帝国の帝国直轄領エルザス＝ロートリンゲン（どの構成国にも属さず、帝国が直接治めた）。
      source: "ja.wikipedia: フランクフルト講和条約"
    - from: 1918
      owner: france
      cause: 休戦（11月）でフランス軍が進駐。ヴェルサイユ条約（1919）で休戦の日にさかのぼってフランスに返還
      source: "https://ja.wikipedia.org/wiki/アルザス＝ロレーヌ"
    - from: 1940
      owner: germany
      label: アルザス＝モゼル（ドイツが併合）
      certainty: occupied
      cause: 独仏休戦協定の後、ドイツが事実上併合（ガウに編入。法的な併合条約はない）
      note: 住民はドイツ国籍を押しつけられ、男性はドイツ軍に徴兵された。
      source: "https://ja.wikipedia.org/wiki/アルザス＝ロレーヌ"
    - from: 1944
      owner: france
      cause: 連合軍の進撃（メス・ストラスブール・ミュルーズの解放、11月）
      source: "https://en.wikipedia.org/wiki/Liberation_of_France"

- id: lower_alsace
  name: 下アルザスとデカポリス（十帝国都市）
  names: [{from: 1871, name: "下アルザス（ストラスブール）"}]
  select:
    pieces: [FRA-Haguenau, FRA-Molsheim, FRA-Saverne, FRA-Selestat, FRA-Colmar]
  timeline:
    - from: 1648
      owner: france
      overlord: hre
      certainty: nominal
      cause: ウェストファリア条約（デカポリスの守護権などをフランスが得る）
      note: ウェストファリア条約の規定はあいまいで、ストラスブール司教領・ハーナウ＝リヒテンベルク伯領・十帝国都市などは帝国諸邦として残った。
      source: "ja.wikipedia: デカポリス (アルザス)"
    - from: 1680
      owner: france
      cause: 再統合（レユニオン）政策による併合（1697年ライスワイク条約で確認）
      note: デカポリスの諸都市は1673年に占領され、1679–81年の「再統合」で下アルザスの帝国諸邦は一括してフランス主権下に置かれた。
      source: "ja.wikipedia: 再統合政策"
    - from: 1871
      owner: german_empire
      cause: フランクフルト講和条約（アルザス＝ロレーヌのドイツへの割譲）
      note: ドイツ帝国の帝国直轄領エルザス＝ロートリンゲン（どの構成国にも属さず、帝国が直接治めた）。
      source: "ja.wikipedia: フランクフルト講和条約"
    - from: 1918
      owner: france
      cause: 休戦（11月）でフランス軍が進駐。ヴェルサイユ条約（1919）で休戦の日にさかのぼってフランスに返還
      source: "https://ja.wikipedia.org/wiki/アルザス＝ロレーヌ"
    - from: 1940
      owner: germany
      label: アルザス＝モゼル（ドイツが併合）
      certainty: occupied
      cause: 独仏休戦協定の後、ドイツが事実上併合（ガウに編入。法的な併合条約はない）
      note: 住民はドイツ国籍を押しつけられ、男性はドイツ軍に徴兵された。
      source: "https://ja.wikipedia.org/wiki/アルザス＝ロレーヌ"
    - from: 1944
      owner: france
      cause: 連合軍の進撃（メス・ストラスブール・ミュルーズの解放、11月）
      source: "https://en.wikipedia.org/wiki/Liberation_of_France"

