    pieces: [FRA-Dunkerque]
  timeline:
    - from: 1648
      owner: spain
      overlord: hre
      note: ダンケルクは1646–52年にフランスが一時占領。
      source: "ja.wikipedia: ダンケルク"
    - from: 1658
      owner: britain
      cause: 砂丘の戦い（英仏連合軍がスペインに勝利し、ダンケルクがイングランド領に）
      note: ピレネー条約（1659）で確認。グラヴリーヌは1659年、ベルグは1668年、カッセル・バイユールなど内陸部は1678年にフランス領となったが、このピースはダンケルクで代表させる。
      source: "ja.wikipedia: 砂丘の戦い"
    - from: 1662
      owner: france
      cause: チャールズ2世がダンケルクをフランスに売却
      source: "ja.wikipedia: ダンケルク"

