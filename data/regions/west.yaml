      certainty: occupied
      label: ダンケルク要塞（ドイツ軍）
      cause: 連合軍がフランス北部を解放したが、ダンケルクの町と周辺は「ダンケルク要塞」としてドイツ軍が保つ（9月〜）
      source: "https://en.wikipedia.org/wiki/Siege_of_Dunkirk_(1944–1945)"
    - from: 1945
      owner: france
      cause: ドイツの降伏で、ダンケルクのドイツ軍が降伏（5月9日）
      source: "https://en.wikipedia.org/wiki/Siege_of_Dunkirk_(1944–1945)"

