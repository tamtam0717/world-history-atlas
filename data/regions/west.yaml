# 担当 A（西欧・北アフリカ）の地域と所属の変遷（1648–1914）
# 大きな地域（現代の国全体など）でおおまかに書き、小さな地域で例外を上書きする。

# ================================================================ フランス
- id: france_kingdom
  name: フランス王国（本土）
  select:
    iso: [FRA]
  timeline:
    - from: 1648
      owner: france
      note: ここで上書きしない地域（三司教領メッス・トゥール・ヴェルダン、上アルザスなどを含む）はフランス領。
      source: "ja.wikipedia: フランス王国"

- id: upper_alsace
  name: 上アルザス（ズントガウ）
  select:
    pieces: [FRA-Altkirch, FRA-Thann, FRA-Mulhouse, FRA-Belfort]
  timeline:
    - from: 1648
      owner: france
      cause: ウェストファリア条約（ハプスブルク家のアルザス領をフランスに割譲）
      note: 都市ミュルーズはスイス盟約者団の同盟都市として1798年まで独立していた（ピースが粗いため描かない）。
      source: "ja.wikipedia: ヴェストファーレン条約"
    - from: 1871
      owner: german_empire
      cause: フランクフルト講和条約（アルザス＝ロレーヌのドイツへの割譲）
      note: ドイツ帝国の帝国直轄領エルザス＝ロートリンゲン（どの構成国にも属さず、帝国が直接治めた）。
      source: "ja.wikipedia: フランクフルト講和条約"

- id: lower_alsace
  name: 下アルザスとデカポリス（十帝国都市）
  select:
    pieces: [FRA-Haguenau, FRA-Molsheim, FRA-Saverne, FRA-Selestat, FRA-Colmar]
  timeline:
    - from: 1648
      owner: france
      overlord: hre
      certainty: nominal
      cause: ウェストファリア条約（デカポリスの守護権などをフランスが得る）
      note: ウェストファリア条約の規定はあいまいで、ストラスブール司教領・ハーナウ＝リヒテンベルク伯領・十帝国都市などは帝国諸邦として残った。
      source: "ja.wikipedia: デカポリス (アルザス)"
    - from: 1680
      owner: france
      cause: 再統合（レユニオン）政策による併合（1697年ライスワイク条約で確認）
      note: デカポリスの諸都市は1673年に占領され、1679–81年の「再統合」で下アルザスの帝国諸邦は一括してフランス主権下に置かれた。
      source: "ja.wikipedia: 再統合政策"
    - from: 1871
      owner: german_empire
      cause: フランクフルト講和条約（アルザス＝ロレーヌのドイツへの割譲）
      note: ドイツ帝国の帝国直轄領エルザス＝ロートリンゲン（どの構成国にも属さず、帝国が直接治めた）。
      source: "ja.wikipedia: フランクフルト講和条約"

