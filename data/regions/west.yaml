# ---------------------------------------------------------------- フランス東部（1871年）
- id: german_lorraine
  name: ドイツ領ロレーヌ（メス・フォルバック・サルグミーヌ）
  select:
    pieces: [FRA-Metz, FRA-Forbach, FRA-Sarreguemines]
  timeline:
    - from: 1871
      owner: german_empire
      cause: フランクフルト講和条約（アルザス＝ロレーヌのドイツへの割譲）
      note: ドイツ帝国の帝国直轄領エルザス＝ロートリンゲン。ティオンヴィル・サールブールも同じ（それぞれの地域で描く）。現在のモゼル県の範囲にあたる。
      source: "ja.wikipedia: アルザス＝ロレーヌ"
    - from: 1918
      owner: france
      cause: 休戦（11月）でフランス軍が進駐。ヴェルサイユ条約（1919）で休戦の日にさかのぼってフランスに返還
      source: "https://ja.wikipedia.org/wiki/アルザス＝ロレーヌ"
    - from: 1940
      owner: germany
      label: アルザス＝モゼル（ドイツが併合）
      certainty: occupied
      cause: 独仏休戦協定の後、ドイツが事実上併合（ガウに編入。法的な併合条約はない）
      note: 住民はドイツ国籍を押しつけられ、男性はドイツ軍に徴兵された。
      source: "https://ja.wikipedia.org/wiki/アルザス＝ロレーヌ"
    - from: 1944
      owner: france
      cause: 連合軍の進撃（メス・ストラスブール・ミュルーズの解放、11月）
      source: "https://en.wikipedia.org/wiki/Liberation_of_France"

- id: forbach_1944
  name: フォルバック
  note: ドイツ領ロレーヌ（german_lorraine）のうち、1944年末に前線になっていたフォルバックだけを塗り分けるための地域。1943年以前は german_lorraine と同じ。
  select:
    pieces: [FRA-Forbach]
  timeline:
    - from: 1944
      owner: france
      certainty: uncertain
      cause: 連合軍がメス・サルグミーヌを解放（11–12月）。フォルバック周辺はジークフリート線の前の前線になり、解放は1945年2–3月
      source: "https://en.wikipedia.org/wiki/Liberation_of_France"
    - from: 1945
      owner: france
      cause: 連合軍がフォルバックを解放（2–3月）
      source: "https://en.wikipedia.org/wiki/Liberation_of_France"

- id: belfort
  name: ベルフォール
  select:
    pieces: [FRA-Belfort]
  timeline:
    - from: 1871
      owner: france
      cause: フランクフルト講和条約（ベルフォールの要塞は普仏戦争で降伏せず、フランスに残された）
      note: アルザスのうちフランスに残った部分で、のちのベルフォール地域圏（テリトワール・ド・ベルフォール）。
      source: "ja.wikipedia: ベルフォール"
    - from: 1940
      owner: germany
      certainty: occupied
      cause: 独仏休戦協定（6月。北部と大西洋岸をドイツが占領）
      source: "https://en.wikipedia.org/wiki/German_military_administration_in_occupied_France_during_World_War_II"
    - from: 1944
      owner: france
      cause: 連合軍のノルマンディー上陸（6月）・南仏上陸（8月）とパリ解放（8月）
      source: "https://en.wikipedia.org/wiki/Liberation_of_France"

# ---------------------------------------------------------------- スペイン（カルリスタ戦争）
- id: basque_navarre
  name: ナバラとバスク3県
  select:
    pieces: [ESP-Navarra, ESP-Gipuzkoa, ESP-Bizkaia, ESP-Alava]
  timeline:
    - from: 1834
      owner: carlists
      certainty: uncertain
      cause: 第一次カルリスタ戦争（ズマラカレギの指揮でカルリスタが農村部を支配）
      note: ビルバオ・サン・セバスティアン・パンプローナ・ビトリアなどの都市は政府側が保持した。
      source: "ja.wikipedia: 第一次カルリスタ戦争"
    - from: 1839
      owner: spain
      cause: ベルガラ協定（カルリスタ軍の主力が降伏）
      source: "ja.wikipedia: 第一次カルリスタ戦争"
    - from: 1873
      owner: carlists
      certainty: uncertain
      cause: 第三次カルリスタ戦争（カルリスタがエステーリャを都として内陸を支配）
      note: 戦争は1872年に始まった。ビルバオなどの都市は政府側が保持した（ビルバオ包囲戦、1874年）。
      source: "ja.wikipedia: 第三次カルリスタ戦争"
    - from: 1876
      owner: spain
      cause: カルリスタの敗北（2月）。バスクの特権（フエロ）は廃止された
      source: "ja.wikipedia: 第三次カルリスタ戦争"
    - from: 1936
      owner: nationalist_spain
      cause: スペイン内戦（7月。ナバラ・アラバは反乱軍につき、ギプスコアは9月に反乱軍が制圧）
      note: ビスカヤはバスク自治政府のもとで1937年6月まで共和国側にとどまった（bizkaia_cw で描く）。
      source: "https://ja.wikipedia.org/wiki/スペイン内戦"
    - from: 1939
      owner: spain
      cause: スペイン内戦の終結（反乱軍の勝利）
      source: "https://ja.wikipedia.org/wiki/スペイン内戦"

# ---------------------------------------------------------------- モロッコ（1907–1912）
- id: morocco_spanish_zone
  name: スペイン保護領モロッコ（北部）
