      note: フランスは教皇との対立の際に一時占領した（1663–64、1688–89、1768–74年）。オランジュ公国（ナッサウ家、1713年ユトレヒト条約でフランス領）はピースが粗いため描かない。
      source: "ja.wikipedia: ヴネッサン伯領"
    - from: 1791
