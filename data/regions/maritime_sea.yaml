# S5 島嶼部東南アジア（IDN・MYS・SGP・BRN・PHL・TLS）の地域と所属の変遷（1648–2025）
# このファイルは S5 のスクリプトで生成した（各ピースはちょうど1つの地域に属する）。手で直してもよい。
# オランダ東インド会社・オランダ政庁の保護下に入ったスルタン国、イギリスの保護下のマレー諸州・ブルネイ・サラワクは
# owner に宗主国・certainty: indirect・label に元の国名（英領インドの藩王国と同じ扱い）。
# 1811–15年のジャワなどのイギリス占領、1942–45年の日本の占領、1947–48年のオランダの「警察行動」は certainty: occupied。

- id: batavia
  name: バタヴィア（ジャカルタ）
  select:
    pieces: [IDN-Kota_Jakarta_Barat, IDN-Kota_Jakarta_Pusat, IDN-Kota_Jakarta_Selatan, IDN-Kota_Jakarta_Timur, IDN-Kota_Jakarta_Utara, IDN-Kota_Depok, IDN-Kota_Bekasi]
  timeline:
    - from: 1648
      owner: netherlands
      label: "オランダ東インド会社領"
      note: "1619年にクーンがジャヤカルタを奪ってバタヴィアと改め、VOCのアジアの本拠とした。周辺（オメランデン）にはVOCの土地が広がった"
      source: "https://ja.wikipedia.org/wiki/バタヴィア"
    - from: 1800
      owner: netherlands
      label: "オランダ領東インド"
      cause: "オランダ東インド会社が解散し、領地がオランダ政府（バタヴィア共和国）に引き継がれる"
      source: "https://ja.wikipedia.org/wiki/オランダ東インド会社"
    - from: 1811
      owner: britain
      certainty: occupied
      label: "ジャワ（イギリスの占領）"
      cause: "イギリス軍がジャワを占領する（ナポレオン戦争。ラッフルズが副総督として統治）"
      source: "https://ja.wikipedia.org/wiki/ジャワ侵攻_(1811年)"
    - from: 1816
      owner: netherlands
      label: "オランダ領東インド"
      cause: "ウィーン会議の取り決めでオランダに返還される"
    - from: 1942
      owner: japan
      certainty: occupied
      label: "ジャワ（日本の占領）"
      cause: "日本軍がジャワに上陸し、オランダ軍が降伏する（3月）"
      note: "ジャワは陸軍第16軍の軍政下。独立運動の指導者スカルノ・ハッタは日本に協力し、義勇軍（PETA）が作られた"
      source: "https://ja.wikipedia.org/wiki/日本軍政下のインドネシア"
    - from: 1945
      owner: britain
      certainty: occupied
      label: "（イギリス軍の占領）"
      cause: "日本の降伏の後、連合軍（イギリス軍）が上陸し、主な都市を押さえる"
      note: "8月17日に独立が宣言され、共和国は内陸の大部分を治めた。11月にはスラバヤで激しい戦闘があった"
      source: "https://ja.wikipedia.org/wiki/スラバヤの戦い"
    - from: 1946
      owner: netherlands
      certainty: occupied
      label: "（オランダ軍の占領）"
      cause: "イギリス軍が撤退し、オランダ軍が都市を引き継ぐ"
    - from: 1947
      owner: netherlands
      certainty: occupied
      label: "ジャワ（オランダ軍の占領）"
      cause: "オランダ軍の第1次「警察行動」（7–8月）"
      source: "https://ja.wikipedia.org/wiki/インドネシア独立戦争"
    - from: 1948
      owner: netherlands
      certainty: occupied
      label: "ジャワ（オランダ軍の占領）"
      note: "都市と幹線はオランダ軍が押さえたが、農村では共和国軍のゲリラ戦が続いた"
      source: "https://ja.wikipedia.org/wiki/インドネシア独立戦争"
    - from: 1949
      owner: indonesia
      cause: "ハーグ協定でオランダがインドネシアに主権を移す（12月27日）"
      source: "https://ja.wikipedia.org/wiki/ハーグ円卓会議"

