      certainty: occupied
      label: "マニラ（アメリカの占領）"
      cause: "アメリカ＝スペイン戦争。デューイの艦隊がマニラ湾でスペイン艦隊を破り（5月）、アメリカ軍がマニラを占領する（8月）"
