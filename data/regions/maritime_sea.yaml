      cause: "独立準備政府（コモンウェルス）が発足する（大統領ケソン）"
      note: "1934年のフィリピン独立法（タイディングス＝マクダフィー法）で10年後の独立が約束された"
      source: "https://ja.wikipedia.org/wiki/フィリピン・コモンウェルス"
