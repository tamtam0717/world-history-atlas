# 北ドイツの地域と所属の変遷（担当 BN）。1648–1815 試作。
# ピースは現代の郡（Kreis）。歴史的な境界をまたぐ郡は、面積の大きい側の領邦に入れている（note に記載）。
# 共通の年の扱い：
#   1806 神聖ローマ帝国の解体 → overlord なし（ライン同盟加盟国は rhine_confederation）
#   1813 ライプツィヒの戦いの後、ヴェストファーレン王国・ベルク大公国が崩壊、ライン同盟も解体 → overlord なし
#   1815 ドイツ連邦 → overlord: german_confederation

# ================================================================ シュレースヴィヒ＝ホルシュタイン

- id: schleswig_royal_de
  name: シュレースヴィヒ（王領・フレンスブルク）
  select:
    pieces: [DEU-Flensburg_Kreisfreie_Stadt, DEU-Flensburg_Kreisfreie_Stadt_2]
  timeline:
    - from: 1648
      owner: denmark
      source: "https://ja.wikipedia.org/wiki/シュレースヴィヒ公国"
  note: シュレースヴィヒ公領は神聖ローマ帝国の外（デンマーク王の封）。

- id: schleswig_gottorp
  name: シュレースヴィヒ（ゴットルプ家領）
  select:
    pieces: [DEU-Nordfriesland, DEU-Schleswig_Flensburg, DEU-Schleswig_Flensburg_2, DEU-Rendsburg_Eckernforde_2]
  timeline:
    - from: 1648
      owner: holstein_gottorp
    - from: 1713
      owner: denmark
      certainty: occupied
      cause: 大北方戦争でデンマークがゴットルプ家のシュレースヴィヒ領を占領
    - from: 1720
      owner: denmark
      cause: フレデリクスボー条約（ゴットルプ家のシュレースヴィヒ領をデンマークに併合）
      source: "https://en.wikipedia.org/wiki/Treaty_of_Frederiksborg"
  note: >-
    実際にはシュレースヴィヒ南部・西部（フーズム、アイダーシュテット、ゴットルフ周辺）にゴットルプ家領と王領が入り組んでいた。
    郡単位では表せないため、ゴットルプ家領が大きい郡をまとめてゴットルプ家領とした（簡略化）。

- id: holstein_royal
  name: ホルシュタイン（王領）
  select:
    pieces: [DEU-Steinburg, DEU-Steinburg_2, DEU-Pinneberg, DEU-Pinneberg_2, DEU-Segeberg, DEU-Dithmarschen, DEU-Dithmarschen_2, DEU-Rendsburg_Eckernforde, DEU-Plon]
  timeline:
    - from: 1648
      owner: denmark
      overlord: hre
    - from: 1806
      owner: denmark
      cause: 神聖ローマ帝国の解体（デンマークがホルシュタインを編入）
    - from: 1815
      owner: denmark
      overlord: german_confederation
      cause: ドイツ連邦の成立（ホルシュタインは連邦に加盟）
  note: >-
    ホルシュタインはデンマーク王が帝国諸侯として治めた。北ディトマルシェンはゴットルプ家領、プレーンは分家ホルシュタイン＝プレーン公領（1761年に王領）だが、まとめて王領とした。
    レンツブルク＝エッケルンフェルデ郡はアイダー川の北（シュレースヴィヒ側）も含むが、面積の大きいホルシュタイン側に入れた。

- id: holstein_gottorp_lands
  name: ホルシュタイン（ゴットルプ家領）
  select:
    pieces: [DEU-Kiel_Kreisfreie_Stadt, DEU-Kiel_Kreisfreie_Stadt_2, DEU-Neumunster_Kreisfreie_Stadt, DEU-Ostholstein, DEU-Ostholstein_2, DEU-Stormarn]
  timeline:
    - from: 1648
      owner: holstein_gottorp
      overlord: hre
    - from: 1773
      owner: denmark
      overlord: hre
      cause: ツァールスコエ・セロー条約（ゴットルプ家がホルシュタインの持ち分をオルデンブルクと交換）
      source: "https://en.wikipedia.org/wiki/Treaty_of_Tsarskoye_Selo_(1773)"
    - from: 1806
      owner: denmark
      cause: 神聖ローマ帝国の解体（デンマークがホルシュタインを編入）
    - from: 1815
      owner: denmark
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: >-
    オストホルシュタイン郡のうちオイティン周辺はリューベック司教領（司教はゴットルプ家の出身。1803年にオルデンブルク領のリューベック侯領）だが、郡全体をゴットルプ家領とした（簡略化）。

- id: lauenburg_elbe
  name: ラウエンブルク
  select:
    pieces: [DEU-Herzogtum_Lauenburg]
  timeline:
    - from: 1648
      owner: saxe_lauenburg
      overlord: hre
    - from: 1689
      owner: celle
      overlord: hre
      cause: ザクセン＝ラウエンブルク家の断絶（ツェレ公が占有。皇帝の承認は1728年）
    - from: 1705
      owner: hanover
      overlord: hre
      cause: リューネブルク（ツェレ）系の断絶でハノーファーに統合
    - from: 1803
      owner: france
      overlord: hre
      certainty: occupied
      cause: フランスがハノーファーを占領（アルトレンブルク協定）
    - from: 1806
      owner: france
      certainty: occupied
      cause: 神聖ローマ帝国の解体
    - from: 1810
      owner: france
      cause: フランスが北西ドイツを併合
    - from: 1813
      owner: hanover
      cause: フランス軍の撤退
    - from: 1815
      owner: denmark
      overlord: german_confederation
      cause: ウィーン会議（ハノーファーからプロイセンを経てデンマークへ。引き渡しは1816年）
      source: "https://de.wikipedia.org/wiki/Herzogtum_Lauenburg"

- id: lubeck_city
  name: リューベック
  select:
    pieces: [DEU-Lubeck_Kreisfreie_Stadt]
  timeline:
    - {from: 1648, owner: lubeck, overlord: hre}
    - {from: 1806, owner: lubeck, cause: 神聖ローマ帝国の解体}
    - {from: 1810, owner: france, cause: フランスが北西ドイツを併合}
    - {from: 1813, owner: lubeck, cause: フランス軍の撤退}
    - {from: 1815, owner: lubeck, overlord: german_confederation, cause: ドイツ連邦の成立}

- id: hamburg_city
  name: ハンブルク
  select:
    adm1: ["DEU/Hamburg"]
  timeline:
    - {from: 1648, owner: hamburg, overlord: hre}
    - {from: 1806, owner: hamburg, cause: 神聖ローマ帝国の解体}
    - {from: 1810, owner: france, cause: フランスが北西ドイツを併合}
    - {from: 1814, owner: hamburg, cause: フランス軍の撤退（ダヴー軍は1814年5月まで籠城）}
    - {from: 1815, owner: hamburg, overlord: german_confederation, cause: ドイツ連邦の成立}
  note: 現代のハンブルク市域には、当時デンマーク領のアルトナ、ハノーファー領のハールブルクなども含まれるが、市全体をハンブルクとした。

# ================================================================ メクレンブルク＝フォアポンメルン

- id: mecklenburg_schwerin_lands
  name: メクレンブルク（シュヴェリーン）
  select:
    pieces: [DEU-Nordwestmecklenburg, DEU-Schwerin_Kreisfreie_Stadt, DEU-Ludwigslust_Parchim]
  timeline:
    - {from: 1648, owner: mecklenburg, overlord: hre}
    - {from: 1806, owner: mecklenburg, cause: 神聖ローマ帝国の解体}
    - {from: 1808, owner: mecklenburg, overlord: rhine_confederation, cause: ライン同盟に加盟}
    - {from: 1813, owner: mecklenburg, cause: ライン同盟から離脱}
    - {from: 1815, owner: mecklenburg, overlord: german_confederation, cause: ドイツ連邦の成立}
  note: >-
    ノルトヴェストメクレンブルク郡には、スウェーデン領ヴィスマール（1648–1803。1803年にメクレンブルクへ質入れ）と、
    メクレンブルク＝シュトレーリッツ領ラッツェブルク侯領（1701–）が含まれるが、郡単位では表せない。

- id: mecklenburg_gustrow_lands
  name: メクレンブルク（ギュストロー・ロストック）
  select:
    pieces: [DEU-Landkreis_Rostock, DEU-Rostock_Kreisfreie_Stadt, DEU-Rostock_Kreisfreie_Stadt_2]
  timeline:
    - {from: 1648, owner: mecklenburg_gustrow, overlord: hre}
    - {from: 1695, owner: mecklenburg, overlord: hre, cause: ギュストロー系の断絶}
    - {from: 1806, owner: mecklenburg, cause: 神聖ローマ帝国の解体}
    - {from: 1808, owner: mecklenburg, overlord: rhine_confederation, cause: ライン同盟に加盟}
    - {from: 1813, owner: mecklenburg, cause: ライン同盟から離脱}
    - {from: 1815, owner: mecklenburg, overlord: german_confederation, cause: ドイツ連邦の成立}

- id: mecklenburg_stargard
  name: メクレンブルク（シュタルガルト）
  select:
    pieces: [DEU-Mecklenburgische_Seenplatte]
  timeline:
    - {from: 1648, owner: mecklenburg_gustrow, overlord: hre}
    - from: 1695
      owner: mecklenburg
      overlord: hre
      certainty: uncertain
      cause: ギュストロー系の断絶（継承をめぐりシュヴェリーン系とシュトレーリッツ系が争う）
    - from: 1701
      owner: mecklenburg_strelitz
      overlord: hre
      cause: ハンブルク協定（メクレンブルク＝シュトレーリッツ公国の成立）
      source: "https://de.wikipedia.org/wiki/Hamburger_Vergleich"
    - {from: 1806, owner: mecklenburg_strelitz, cause: 神聖ローマ帝国の解体}
    - {from: 1808, owner: mecklenburg_strelitz, overlord: rhine_confederation, cause: ライン同盟に加盟}
    - {from: 1813, owner: mecklenburg_strelitz, cause: ライン同盟から離脱}
    - {from: 1815, owner: mecklenburg_strelitz, overlord: german_confederation, cause: ドイツ連邦の成立}
  note: >-
    メクレンブルク湖水地方郡はシュタルガルト地方（シュトレーリッツ）のほか、ヴァーレン・マルヒン（シュヴェリーン）、
    デミン（ポンメルン。1648–1720スウェーデン領、以後プロイセン領）を含む。最も大きいシュトレーリッツ領として扱った。

- id: swedish_pomerania_north
  name: スウェーデン領ポンメルン（ペーネ川以北・リューゲン）
  select:
    pieces: [DEU-Vorpommern_Rugen, DEU-Vorpommern_Rugen_2]
  timeline:
    - from: 1648
      owner: sweden
      overlord: hre
      cause: ウェストファリア条約
      source: "https://ja.wikipedia.org/wiki/スウェーデン領ポメラニア"
    - from: 1806
      owner: sweden
      cause: 神聖ローマ帝国の解体（スウェーデン本国に編入）
    - from: 1815
      owner: prussia
      overlord: german_confederation
      cause: ウィーン会議（1814年キール条約でデンマークに譲られたのち、プロイセンへ）
  note: >-
    1807–1810年と1812–1813年はフランス軍が占領したが、表示していない。1814年のキール条約でデンマークに割譲されたが、
    引き渡されないまま1815年にプロイセン領となった。グライフスヴァルトとヴォルガストもペーネ川以北で1815年までスウェーデン領だが、
    郡（フォアポンメルン＝グライフスヴァルト郡）の大半がペーネ川以南のため、南側の扱いになっている。

- id: swedish_pomerania_south
  name: ポンメルン（ペーネ川以南・ウーゼドム）
  select:
    pieces: [DEU-Vorpommern_Greifswald, DEU-Vorpommern_Greifswald_2]
  timeline:
    - from: 1648
      owner: sweden
      overlord: hre
      cause: ウェストファリア条約
    - from: 1720
      owner: prussia
      overlord: hre
      cause: ストックホルム条約（ペーネ川以南とウーゼドム・ヴォリン島、シュテッティンをプロイセンへ）
      source: "https://ja.wikipedia.org/wiki/ストックホルム条約_(1720年)"
    - {from: 1806, owner: prussia, cause: 神聖ローマ帝国の解体}
    - {from: 1815, owner: prussia, overlord: german_confederation, cause: ドイツ連邦の成立}
  note: 1675–1679年はブランデンブルク軍が占領したが（サン＝ジェルマン条約で返還）、表示していない。

# ================================================================ ブランデンブルク・ベルリン

- id: brandenburg_core
  name: ブランデンブルク辺境伯領
  select:
    adm1: ["DEU/Berlin", "DEU/Brandenburg"]
    exclude: [DEU-Cottbus_Kreisfreie_Stadt, DEU-Dahme_Spreewald, DEU-Elbe_Elster, DEU-Oberspreewald_Lausitz, DEU-Spree_Neie]
  timeline:
    - {from: 1648, owner: prussia, overlord: hre}
    - {from: 1806, owner: prussia, cause: 神聖ローマ帝国の解体}
    - {from: 1815, owner: prussia, overlord: german_confederation, cause: ドイツ連邦の成立}
  note: >-
    テルトー＝フレーミング郡のユーターボーク、ポツダム＝ミッテルマルク郡のベルツィヒはザクセン領だったが、郡の大半がブランデンブルクのためブランデンブルクとした。

- id: cottbus
  name: コトブス
  select:
    pieces: [DEU-Cottbus_Kreisfreie_Stadt]
  timeline:
    - {from: 1648, owner: prussia, overlord: hre}
    - {from: 1806, owner: prussia, cause: 神聖ローマ帝国の解体}
    - {from: 1807, owner: saxony, overlord: rhine_confederation, cause: ティルジット条約（コトブス郡をザクセンへ）}
    - {from: 1813, owner: saxony, cause: ライン同盟の解体}
    - {from: 1815, owner: prussia, overlord: german_confederation, cause: ウィーン会議}
  note: コトブスは下ラウジッツの中にあるブランデンブルクの飛び地（1462年から）。

- id: lower_lusatia
  name: 下ラウジッツ・ザクセン選帝侯領北東部
  select:
    pieces: [DEU-Dahme_Spreewald, DEU-Elbe_Elster, DEU-Oberspreewald_Lausitz, DEU-Spree_Neie]
  timeline:
    - from: 1648
      owner: saxony
      overlord: hre
      source: "https://ja.wikipedia.org/wiki/ラウジッツ"
    - {from: 1806, owner: saxony, overlord: rhine_confederation, cause: ポーゼン条約（ザクセン王国の成立とライン同盟加盟）}
    - {from: 1813, owner: saxony, cause: ライン同盟の解体}
    - from: 1815
      owner: prussia
      overlord: german_confederation
      cause: ウィーン会議（ザクセンの北半分をプロイセンへ）
      source: "https://ja.wikipedia.org/wiki/ウィーン議定書"
  note: >-
    下ラウジッツは1635年のプラハ条約からザクセン領（ボヘミア王冠の封）。エルベ＝エルスター郡は選帝侯領の本領（ヘルツベルク・リーベンヴェルダ）。
    ダーメ＝シュプレーヴァルト郡北部（ケーニヒス・ヴスターハウゼン）とシュプレー＝ナイセ郡のコトブス周辺はブランデンブルク領だが、郡の大半に合わせた。

# ================================================================ ザクセン

- id: saxony_core
  name: ザクセン（マイセン・ライプツィヒ・エルツ山地・上ラウジッツ南部）
  select:
    adm1: ["DEU/Sachsen"]
    exclude: [DEU-Nordsachsen, DEU-Gorlitz]
  timeline:
    - {from: 1648, owner: saxony, overlord: hre}
    - {from: 1806, owner: saxony, overlord: rhine_confederation, cause: ポーゼン条約（ザクセン王国の成立とライン同盟加盟）}
    - {from: 1813, owner: saxony, cause: ライン同盟の解体}
    - {from: 1815, owner: saxony, overlord: german_confederation, cause: ドイツ連邦の成立}
  note: >-
    バウツェン郡は上ラウジッツ（1635年からザクセン領）。北部のホイヤースヴェルダは1815年にプロイセン領となるが、郡の大半はザクセンに残った。
    フォークトラント郡にはロイス家の領地も少し含まれる。

- id: saxony_north_1815
  name: ザクセン北部（トルガウ・ヴィッテンベルク・上ラウジッツ北部）
  select:
    pieces: [DEU-Nordsachsen, DEU-Wittenberg, DEU-Gorlitz]
  timeline:
    - {from: 1648, owner: saxony, overlord: hre}
    - {from: 1806, owner: saxony, overlord: rhine_confederation, cause: ポーゼン条約（ザクセン王国の成立とライン同盟加盟）}
    - {from: 1813, owner: saxony, cause: ライン同盟の解体}
    - from: 1815
      owner: prussia
      overlord: german_confederation
      cause: ウィーン会議（ザクセンの北半分をプロイセンへ）
      source: "https://ja.wikipedia.org/wiki/ウィーン議定書"
  note: >-
    ゲルリッツ郡は南部（ツィッタウ・レーバウ）がザクセンに残ったが、北部（ゲルリッツ・ニースキー）がより広いためプロイセン側とした。
    ノルトザクセン郡も南部のオシャッツはザクセンに残った。

- id: saxony_thuringia
  name: ザクセン領テューリンゲン（メルゼブルク・ヴァイセンフェルス・ザンガーハウゼンなど）
  select:
    pieces: [DEU-Burgenlandkreis, DEU-Saalekreis, DEU-Mansfeld_Sudharz, DEU-Sommerda, DEU-Unstrut_Hainich_Kreis, DEU-Suhl_Kreisfreie_Stadt]
  timeline:
    - {from: 1648, owner: saxony, overlord: hre}
    - {from: 1806, owner: saxony, overlord: rhine_confederation, cause: ポーゼン条約（ザクセン王国の成立とライン同盟加盟）}
    - {from: 1813, owner: saxony, cause: ライン同盟の解体}
    - {from: 1815, owner: prussia, overlord: german_confederation, cause: ウィーン会議（ザクセンの北半分をプロイセンへ）}
  note: >-
    1656–1746年ごろはザクセン＝ヴァイセンフェルス、メルゼブルク、ツァイツの分家公領（選帝侯の宗主権の下）があったが、ザクセンにまとめた。
    ウンストルト＝ハイニッヒ郡の帝国都市ミュールハウゼン（1802/03年プロイセン、1807年ヴェストファーレン王国）は郡単位では表せない。
    マンスフェルト伯領は1780年にザクセンとプロイセン（マグデブルク）の間で分けられた。ウンストルート＝ハイニッヒ郡の帝国自由都市ミュールハウゼン
    （1802/03年プロイセン、1807年ヴェストファーレン王国）は郡単位で表せない。ズール（ヘンネベルクのザクセン領）は1815年にプロイセンへ。

# ================================================================ テューリンゲン

