# ---- 1914–2025 で足した地域（それ以前は、含まれる大きな地域の記述が効く） ----

- id: berlin_city
  name: ベルリン
  select:
    pieces: [DEU-Berlin]
  timeline:
    - {from: 1945, owner: berlin_allied, certainty: occupied, label: ベルリン（米英仏ソの共同占領）, cause: ベルリン宣言（連合国4か国による分割占領。ベルリンはソ連占領地区の中で4か国の共同管理）, source: "https://en.wikipedia.org/wiki/Berlin_Declaration_(1945)"}
    - {from: 1949, owner: west_germany, certainty: uncertain, label: 西ベルリン（東ベルリンは東ドイツの首都）, cause: 東西ドイツの成立で市が東西に分かれる（1948年の封鎖で市政府も分裂）, source: "https://ja.wikipedia.org/wiki/西ベルリン"}
    - {from: 1990, owner: germany, cause: ドイツ統一（東西ベルリンの統一。1991年に連邦議会が首都をベルリンに決める）, source: "https://ja.wikipedia.org/wiki/ドイツ再統一"}
  note: >-
    ベルリンは1ピースなので東西ベルリンを描き分けられない。1949–1990年は面積の大きい西ベルリン（米英仏の3地区、約480km²）の側で描き、
    斜線（不確実）にした。西ベルリンは法的には米英仏の占領下にあり、西ドイツの州ではなかったが、実際には西ドイツと一体で運営された。
    東ベルリン（ソ連地区、約400km²）は東ドイツが首都とした。1961年8月からは「ベルリンの壁」で東西が隔てられた（1989年11月に開放）。
  source:
    - "https://ja.wikipedia.org/wiki/西ベルリン"
    - "https://ja.wikipedia.org/wiki/東ベルリン"

