# 北ドイツの地域と所属の変遷（担当 BN）。1648–1914。
# ピースは現代の郡（Kreis）。歴史的な境界をまたぐ郡は、面積の大きい側の領邦に入れている（note に記載）。
# 共通の年の扱い：
#   1806 神聖ローマ帝国の解体 → overlord なし（ライン同盟加盟国は rhine_confederation）
#   1813 ライプツィヒの戦いの後、ヴェストファーレン王国・ベルク大公国が崩壊、ライン同盟も解体 → overlord なし
#   1815 ドイツ連邦 → overlord: german_confederation
#   1864 デンマーク戦争（シュレースヴィヒ・ホルシュタイン・ラウエンブルクは普墺の共同統治＝斜線）、1865 ガスタイン協定
#   1866 普墺戦争でドイツ連邦が解体 → overlord なし。ハノーファー・シュレースヴィヒ＝ホルシュタインはプロイセンが併合
#   1867 北ドイツ連邦 → overlord: north_german_confederation
#   1871 ドイツ帝国 → owner: german_empire（1色で塗る。構成国の名前は cause と note に書く）

# ================================================================ シュレースヴィヒ＝ホルシュタイン

- id: schleswig_royal_de
  name: シュレースヴィヒ（王領・フレンスブルク）
  select:
    pieces: [DEU-Flensburg_Kreisfreie_Stadt, DEU-Flensburg_Kreisfreie_Stadt_2]
  timeline:
    - {"from": 1453, "owner": "holstein_schauenburg", "note": "シュレースヴィヒ公領はデンマーク王の封で、神聖ローマ帝国の外。ホルシュタイン伯アドルフ8世がシュレースヴィヒ公を兼ねた"}
    - {"from": 1460, "owner": "denmark", "cause": "リーベ条約（デンマーク王クリスチャン1世がシュレースヴィヒ公・ホルシュタイン伯に選ばれる）", "source": "https://ja.wikipedia.org/wiki/リーベ条約"}
    - from: 1648
      owner: denmark
      source: "https://ja.wikipedia.org/wiki/シュレースヴィヒ公国"
    - from: 1864
      owner: prussia
      certainty: uncertain
      cause: デンマーク戦争・ウィーン条約（デンマークがシュレースヴィヒ・ホルシュタイン・ラウエンブルクをプロイセンとオーストリアに譲る。両国の共同統治）
      source: "https://en.wikipedia.org/wiki/Treaty_of_Vienna_(1864)"
    - from: 1865
      owner: prussia
      certainty: uncertain
      cause: ガスタイン協定（主権は共同のまま、シュレースヴィヒはプロイセンが管理）
      source: "https://ja.wikipedia.org/wiki/ガスタイン協定"
    - from: 1866
      owner: prussia
      cause: プラハ条約（オーストリアが権利を放棄し、プロイセンが併合。併合の布告は1867年1月）
      source: "https://ja.wikipedia.org/wiki/シュレースヴィヒ＝ホルシュタイン問題"
    - {from: 1867, owner: prussia, overlord: north_german_confederation, cause: 北ドイツ連邦の成立（シュレースヴィヒ＝ホルシュタイン州）, source: "https://ja.wikipedia.org/wiki/北ドイツ連邦"}
    - {from: 1871, owner: german_empire, cause: ドイツ帝国の成立（プロイセン王国は帝国の構成国として存続）, source: "https://ja.wikipedia.org/wiki/ドイツ帝国"}
    - {from: 1918, owner: germany, cause: ドイツ革命で帝政が倒れ共和国となる（ヴァイマル共和国）, source: "https://ja.wikipedia.org/wiki/ドイツ革命"}
    - {from: 1945, owner: britain, certainty: occupied, label: ドイツ（イギリス占領地区）, cause: ドイツの無条件降伏と連合国による分割占領, source: "https://ja.wikipedia.org/wiki/連合軍軍政期_(ドイツ)"}
    - {from: 1949, owner: west_germany, cause: ドイツ連邦共和国（西ドイツ）の成立, source: "https://ja.wikipedia.org/wiki/西ドイツ"}
    - {from: 1990, owner: germany, cause: ドイツ統一（東ドイツが西ドイツに加わる）, source: "https://ja.wikipedia.org/wiki/ドイツ再統一"}
  note: シュレースヴィヒ公領は神聖ローマ帝国の外（デンマーク王の封）。1864–1866年はプロイセン・オーストリアの共同統治（斜線）。1867年からプロイセンのシュレースヴィヒ＝ホルシュタイン州、1871年からドイツ帝国の構成国プロイセン王国の領土。

