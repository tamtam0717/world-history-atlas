# F4 中部・南部アフリカとインド洋の島々（CAF・GAB・COG・COD・AGO・ZMB・MWI・MOZ・ZWE・BWA・NAM・ZAF・LSO・SWZ・MDG・COM・MYT・REU・MUS・SYC・SHN・IOT・ATF）の地域と所属の変遷（1648–2025）
# scratchpad/f4/gen.py で生成した（各ピースはちょうど1つの地域に属する）。手で直してもよい。
# 方針（docs/agent-brief-africa.md）：
# - ヨーロッパの砦・港・実際に治めた植民地は宗主国の色＋label。ベルリン会議前後の「主張・勢力圏」だけの内陸は certainty: nominal。実効支配が及んだ年から濃く塗る。
# - コンゴ王国・ルンダ・ルバ・ズールー・ンデベレ・ガザ・メリナなどアフリカの国家は独自の政体（範囲があいまいなら uncertain）。大きな国家のない所は owner: null（note に住民）。
# - 間接統治が明確な保護領（バストランド・ベチュアナランド・スワジランド・バロツェランド・テケ王国・コモロのスルタン国・ムタパなど）は宗主国の certainty: indirect＋label。
# - 南アフリカのホームランド（バントゥースタン）は描かない。ウォルビス・ベイ（1994 年までイギリス→南アフリカ領）・キオンガ三角地帯はピースより小さいので描かない。
# - 独立後の内戦（アンゴラの UNITA・FNLA、コンゴのカタンガ・南カサイ・RCD・MLC・M23、中央アフリカの旧セレカ、アンジュアンの分離）は年末の主な支配を独自の政体＋uncertain。

