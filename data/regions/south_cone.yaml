  timeline:
    - from: 1648
      owner: "netherlands"
      certainty: "uncertain"
      label: "オランダ領ブラジル"
      note: "オランダ西インド会社が1630年からブラジル北東部を支配した。1645年からのポルトガル系住民の反乱で内陸を失い、1648年にはレシフェと海岸の砦（パライバ・リオグランデ・ド・ノルテ）が残った"
      source: "https://ja.wikipedia.org/wiki/オランダ領ブラジル"
    - from: 1654
      owner: "portugal"
