    - from: 1815
      owner: "portugal"
      label: "ブラジル王国"
      cause: "ポルトガル・ブラジル及びアルガルヴェ連合王国が成立し、ブラジルが王国に格上げされる"
      source: "https://ja.wikipedia.org/wiki/ポルトガル・ブラジル及びアルガルヴェ連合王国"
    - from: 1822
