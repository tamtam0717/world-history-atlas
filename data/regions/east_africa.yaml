# F3 東アフリカ・アフリカの角・スーダン（SDN SSD ETH ERI DJI SOM KEN UGA RWA BDI TZA）の地域と所属の変遷（1648–2025）
# scratchpad/f3/gen.py で生成した（手で直してよい。直したときは生成をやめてこのファイルを正とする）。
# 主な方針：
#  - 在地の主な国家（エチオピア・フンジ・ダルフール・マフディー国家・ブガンダ・ブニョロ・ルワンダ・ブルンジ・ザンジバルなど）は独自の色。範囲があいまいなら uncertain。
#  - エチオピアの「諸侯の時代」（1769–1854）は ethiopia・nominal。メネリクのシェワ王時代の南への拡大は shewa（1878 年から overlord: ethiopia）。
#  - トルコ・エジプト支配のスーダン（1820/21–1884/85）は egypt＋overlord: ottoman。エジプト本体が 1882 年にイギリスの占領下（occupied）に入った後も、
#    スーダンはエジプト政府の領土として egypt のまま描く。英・エジプト軍の再征服（1896–98）は britain・occupied、1899 年の共同統治協定から britain＋label。
#  - 保護領で在地の王がそのまま認められた所（ブガンダ・トロ・アンコーレ・ブニョロ〈1899–〉・ザンジバル・ルワンダ・ブルンジ・ミジュルティニア・ホビオ・アウサ・ジンマ・
#    ダール・マサリート・ウィトゥ）は宗主国の indirect。直轄・会社の統治や、間接統治がはっきりしない保護領は certainty なし。
#  - 勢力圏・主張だけで実際の支配が及んでいない内陸は nominal。実効支配が及んだ年（遠征・行政の設置）から濃く塗る（年は大まかな目安。note に書いた）。
#  - どの国家の支配も及ばない牧畜民・農耕民の地（南スーダン・ケニア内陸・タンザニア内陸・ソマリの遊牧地など）は owner なし。
#  - 第二次エチオピア戦争後のイタリアの支配（1935/36–1940）は occupied。第一次世界大戦のドイツ領東アフリカの占領（1916–19）は occupied。
#  - 内戦（スーダン 2023–、ソマリア、エチオピアのティグレ、エリトリア独立戦争）は年末時点の大まかな支配で、反乱・分離勢力は独自の政体＋uncertain。
#  - ハライブ（1995– エジプト）とワディ・ハルファの突出部（1902– スーダン）は実際の統治で塗る。ビル・タウィールは EGY のピースなので west.yaml の扱いのまま。

