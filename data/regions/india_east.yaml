# 東インド・ベンガル・ヒマラヤ（担当 S2）の地域と所属の変遷。tools の外の生成スクリプトで作った（手で直してよい）。
# 範囲：IND の Bihar・Jharkhand・West Bengal・Odisha・Chhattisgarh・Assam・Arunachal Pradesh・Manipur・Nagaland・
# Mizoram・Meghalaya・Tripura・Sikkim、および BGD・NPL・BTN。
# 方針：東インド会社の領地は owner: britain（label で管区・州名）。藩王国は owner: britain・certainty: indirect・label。
# 1717年以後のベンガル太守・ムガルの名目的な宗主権には帯を付けない。1757–1764年の太守はイギリスの帯。

- id: wb_central
  name: ベンガル中部（ムルシダーバード・ナディア・ビールブーム・バンクラ・フーグリ）
  select:
    pieces: [IND-Murshidabad, IND-Nadia, IND-Birbhum, IND-Bankura, IND-Hugli, IND-Haora]
  timeline:
  - {from: 1648, owner: mughal, note: ムガル帝国のベンガル州。1704年からムルシダーバードに太守の役所が置かれた。フーグリ川沿いにはオランダ（チンスラ）・フランス（シャンデルナゴル）・デンマーク（セランポール）などの商館があった（ピースが細かくないので描かない）}
  - {from: 1717, owner: bengal_nawab, cause: ムルシド・クリー・ハーンがベンガル太守となり、世襲の太守政権が始まる（ムガル皇帝の宗主権は名目的に）, source: 'https://ja.wikipedia.org/wiki/ムルシド・クリー・ハーン'}
  - {from: 1757, owner: bengal_nawab, overlord: britain, cause: プラッシーの戦いの後、東インド会社がミール・ジャアファルを太守に立てる, source: 'https://ja.wikipedia.org/wiki/プラッシーの戦い'}
  - {from: 1765, owner: britain, label: ベンガル管区, cause: ブクサールの戦いの後のアラーハーバード条約で、東インド会社がベンガル・ビハール・オリッサのディーワーニー（徴税権）を得る, note: 1765–1772年は太守の名で会社が徴税する「二重統治」。1773年からベンガル総督（のちインド総督）がカルカッタに置かれた, source: 'https://ja.wikipedia.org/wiki/アラーハーバード条約'}
  - {from: 1905, owner: britain, label: ベンガル州, cause: ベンガル分割（カーゾン総督）, source: 'https://ja.wikipedia.org/wiki/ベンガル分割令'}
  - {from: 1912, owner: britain, label: ベンガル州, cause: ベンガル分割の取り消し（1911年12月のデリー・ダルバール。1912年4月に州を再編）, source: 'https://en.wikipedia.org/wiki/Partition_of_Bengal_(1905)'}
  - {from: 1947, owner: india, cause: インド・パキスタンの分離独立（8月15日）, note: 西ベンガル州, source: 'https://ja.wikipedia.org/wiki/インド・パキスタン分離独立'}
