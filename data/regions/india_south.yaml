    - {from: 1947, owner: "hyderabad", cause: "インドの独立でイギリスの宗主権が消え、ニザームはインドにもパキスタンにも加わらず独立を保とうとする", note: "1947年11月にインドと現状維持協定を結んだ", source: "https://en.wikipedia.org/wiki/Hyderabad_State"}
    - {from: 1948, owner: "india", cause: "インド軍の侵攻（ポロ作戦、9月）でニザームが降伏し、インドに併合される", source: "https://ja.wikipedia.org/wiki/ポロ作戦"}

