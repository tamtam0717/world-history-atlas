# S3 南インド・スリランカ・モルディブの地域（1648–2025）。
# 藩王国（イギリスの保護下に入った在地政権）は owner: britain・certainty: indirect・label に藩王国名。
# 直轄地（ボンベイ・マドラス管区など）は owner: britain（1858年までは東インド会社の統治）。

# ムンバイ
- id: bombay_island
  name: "ボンベイ（ムンバイ）"
  select:
    pieces: [IND-Mumbai]
  timeline:
    - {from: 1648, owner: "portugal", note: "ボンベイの島々はポルトガル領（バセイン北部州の一部）"}
    - {from: 1665, owner: "britain", label: "ボンベイ管区", cause: "ポルトガル王女キャサリンの持参金としてイギリス王チャールズ2世に渡る（1661年の婚姻条約、1665年に引き渡し）", note: "1668年にイギリス東インド会社に貸し与えられ、1687年に会社の西インドの本拠がスーラトから移った", source: "https://ja.wikipedia.org/wiki/ムンバイ"}
    - {from: 1947, owner: "india", cause: "インドの独立（8月15日）。藩王国はインドに加わった", source: "https://ja.wikipedia.org/wiki/インド独立法"}

- id: salsette
  name: "サルセット島"
  select:
    pieces: [IND-Mumbai_Suburban]
  timeline:
    - {from: 1648, owner: "portugal", note: "バセインを中心とするポルトガルの北部州（プロヴィンシア・ド・ノルテ）"}
    - {from: 1739, owner: "maratha", cause: "マラーター軍がバセインを攻め落とし、ポルトガルの北部州を奪う（5月）", source: "https://en.wikipedia.org/wiki/Battle_of_Vasai"}
    - {from: 1774, owner: "britain", certainty: "occupied", cause: "イギリス東インド会社がサルセット島を占領（12月）", source: "https://en.wikipedia.org/wiki/First_Anglo-Maratha_War"}
    - {from: 1776, owner: "britain", label: "ボンベイ管区", cause: "プランダル条約でサルセット島がイギリス領と認められる（1782年のサルバイ条約で確定）", source: "https://en.wikipedia.org/wiki/Treaty_of_Salbai"}
    - {from: 1947, owner: "india", cause: "インドの独立（8月15日）。藩王国はインドに加わった", source: "https://ja.wikipedia.org/wiki/インド独立法"}

- id: bassein
  name: "バセイン・北コンカン"
  select:
    pieces: [IND-Palghar]
  timeline:
    - {from: 1648, owner: "portugal", certainty: "uncertain", note: "海岸のバセイン（ヴァサイ）・ダハヌなどはポルトガルの北部州。内陸はコーリー人のジャウハル王国など"}
    - {from: 1739, owner: "maratha", cause: "マラーター軍がバセインを攻め落とし、ポルトガルの北部州を奪う（5月）", source: "https://en.wikipedia.org/wiki/Battle_of_Vasai"}
    - {from: 1802, owner: "maratha", overlord: "britain", cause: "宰相バージー・ラーオ2世がバセイン条約（12月31日）でイギリスの軍事保護を受け入れる", note: "宰相の領地はイギリスの軍事保護下に入った（帯）が、マラーター同盟は第3次マラーター戦争（1817–18）まで大勢力として続いた", source: "https://en.wikipedia.org/wiki/Treaty_of_Bassein"}
    - {from: 1818, owner: "britain", label: "ボンベイ管区", cause: "第3次マラーター戦争で宰相の領地がイギリスに併合される（ボンベイ管区）", source: "https://ja.wikipedia.org/wiki/マラーター戦争"}
    - {from: 1947, owner: "india", cause: "インドの独立（8月15日）。藩王国はインドに加わった", source: "https://ja.wikipedia.org/wiki/インド独立法"}

# ライガド（シヴァージーの都）・プネー（宰相の都）
- id: desh_west
  name: "西デカン（プネー・コンカン北部）"
  select:
    pieces: [IND-Pune, IND-Raigarh, IND-Thane]
  timeline:
    - {from: 1648, owner: "bijapur", note: "プネーはシヴァージーの父シャーハージーの領地。シヴァージーは1646年ごろから周りの山城を奪い始めた"}
    - {from: 1656, owner: "maratha", cause: "シヴァージーがジャーヴリーを奪い、ライガドなどの城を手に入れて自立する", source: "https://ja.wikipedia.org/wiki/シヴァージー"}
    - {from: 1689, owner: "mughal", certainty: "uncertain", cause: "王サンバージーが捕らえられ処刑され、都ライガドが落ちる。マラーターは城を拠点に抵抗を続けた（マラーター独立戦争）", source: "https://en.wikipedia.org/wiki/Mughal–Maratha_Wars"}
    - {from: 1707, owner: "maratha", cause: "アウラングゼーブの死。シャーフーが解放されてマラーター王となる", source: "https://en.wikipedia.org/wiki/Shahu_I"}
    - {from: 1802, owner: "maratha", overlord: "britain", cause: "宰相バージー・ラーオ2世がバセイン条約（12月31日）でイギリスの軍事保護を受け入れる", note: "宰相の領地はイギリスの軍事保護下に入った（帯）が、マラーター同盟は第3次マラーター戦争（1817–18）まで大勢力として続いた", source: "https://en.wikipedia.org/wiki/Treaty_of_Bassein"}
    - {from: 1818, owner: "britain", label: "ボンベイ管区", cause: "第3次マラーター戦争で宰相の領地がイギリスに併合される（ボンベイ管区）", source: "https://ja.wikipedia.org/wiki/マラーター戦争"}
    - {from: 1947, owner: "india", cause: "インドの独立（8月15日）。藩王国はインドに加わった", source: "https://ja.wikipedia.org/wiki/インド独立法"}

- id: satara
  name: "サーターラー"
  select:
    pieces: [IND-Satara]
  timeline:
    - {from: 1648, owner: "bijapur"}
    - {from: 1656, owner: "maratha", cause: "シヴァージーがジャーヴリーを奪う", source: "https://ja.wikipedia.org/wiki/シヴァージー"}
    - {from: 1689, owner: "mughal", certainty: "uncertain", cause: "王サンバージーが処刑され、ムガル軍が西デカンの城を奪う（マラーター独立戦争）", source: "https://en.wikipedia.org/wiki/Mughal–Maratha_Wars"}
    - {from: 1707, owner: "maratha", cause: "アウラングゼーブの死。シャーフーがサーターラーを都にマラーター王となる", source: "https://en.wikipedia.org/wiki/Shahu_I"}
    - {from: 1802, owner: "maratha", overlord: "britain", cause: "宰相バージー・ラーオ2世がバセイン条約（12月31日）でイギリスの軍事保護を受け入れる", note: "宰相の領地はイギリスの軍事保護下に入った（帯）が、マラーター同盟は第3次マラーター戦争（1817–18）まで大勢力として続いた", source: "https://en.wikipedia.org/wiki/Treaty_of_Bassein"}
    - {from: 1818, owner: "britain", certainty: "indirect", label: "サーターラー藩王国", cause: "第3次マラーター戦争の後、イギリスがシヴァージーの子孫プラタープ・シングにサーターラーの小藩王国を与える", source: "https://en.wikipedia.org/wiki/Satara_state"}
    - {from: 1848, owner: "britain", label: "ボンベイ管区", cause: "跡継ぎがなく、ダルハウジー総督の失権の原理で併合される", source: "https://ja.wikipedia.org/wiki/失権の原理"}
    - {from: 1947, owner: "india", cause: "インドの独立（8月15日）。藩王国はインドに加わった", source: "https://ja.wikipedia.org/wiki/インド独立法"}

