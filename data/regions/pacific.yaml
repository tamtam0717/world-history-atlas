- id: png_kaiser_wilhelmsland
  name: カイザー・ヴィルヘルムスラント（ニューギニア北東部の海岸）
  select:
    pieces: [PNG-Madang_Province, PNG-Morobe_Province]
  timeline:
    - from: 1648
      owner: null
      note: パプアの人々の地。1871–83年にロシアの学者ミクルーハ＝マクライがアストロラーベ湾（マダン）に住んだ
      source: "https://ja.wikipedia.org/wiki/パプアニューギニアの歴史"
    - from: 1884
      owner: german_empire
      label: ドイツ領ニューギニア（カイザー・ヴィルヘルムスラント）
      cause: ドイツがニューギニア北東部とビスマルク諸島を保護領とする（11月）
      note: 1885–99年はドイツ・ニューギニア会社が統治した（フィンシュハーフェン、のちマダン）
      source: "https://ja.wikipedia.org/wiki/ドイツ領ニューギニア"
    - from: 1914
      owner: australia
      certainty: occupied
      label: ドイツ領ニューギニア（オーストラリアの占領）
      cause: 第一次世界大戦でオーストラリア軍がドイツ領ニューギニアを占領する（9月、ラバウル）
      source: "https://ja.wikipedia.org/wiki/オーストラリア海軍・陸軍遠征軍"
    - from: 1920
      owner: australia
      label: ニューギニア委任統治領
      cause: ヴェルサイユ条約で国際連盟の委任統治領としてオーストラリアに委ねられる
      note: 1920年代にモロベ州のワウ・ブロロで金が見つかり、飛行機で採掘の機材を運んだ
      source: "https://ja.wikipedia.org/wiki/ニューギニア委任統治領"
    - from: 1942
      owner: japan
      certainty: occupied
      label: ニューギニア（日本の占領）
      cause: 日本軍がラエ・サラモア（3月）・マダン（12月）を占領する
      note: 内陸のワウはオーストラリア軍が守った
      source: "https://ja.wikipedia.org/wiki/ニューギニアの戦い"
    - from: 1943
      owner: australia
      label: ニューギニア委任統治領
      cause: 連合軍がラエ・サラモア・フィンシュハーフェンを奪い返す（9–10月）
      note: マダンの奪回は1944年4月（ピース全体はモロベ州に合わせた）
      source: "https://ja.wikipedia.org/wiki/ニューギニアの戦い"
    - from: 1946
      owner: australia
      label: ニューギニア信託統治領
      cause: 国際連合の信託統治領となる（12月）
      source: "https://ja.wikipedia.org/wiki/ニューギニア信託統治領"
    - from: 1949
