      note: 1942年5月に日本軍がツラギを、7月にガダルカナル島北岸を占領したが、8月にアメリカ軍が上陸し、1943年2月に日本軍が撤退した（年末の状態では連合軍の支配が主なので占領は描かない）。戦後は首都がツラギからホニアラに移った
