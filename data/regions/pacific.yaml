# O2 太平洋の島々（PNG SLB VUT NCL FJI WSM TON KIR TUV NRU MHL FSM PLW PYF WLF COK NIU TKL PCN UMI CLP）の地域と所属の変遷（1648–2025）
# 方針（docs/agent-brief-oceania.md）：
# - ヨーロッパ人が来る前・保護領になる前の島々は、トンガ・タヒチ（ポマレ朝）・フィジー王国・サモア王国を除いて owner: null（note に住民）。
# - 植民地は統治国の色＋label。主張だけで行政の及ばない所（ニューギニアの内陸・高地など）は certainty: nominal。行政の拠点が置かれた年から濃く塗る。
# - 在地の王が残った保護領（トンガ 1900–70、タヒチ 1842–80、ウォリス・フツナ、クック諸島・ニウエの保護領期）は統治国の certainty: indirect＋label。
# - 委任統治・信託統治は統治国の色＋label。第一次大戦の占領は開始年から occupied、太平洋戦争の日本の占領地は japan・occupied。
# - ミクロネシアの自治政府（1979/1981）から独立（1986/1994）までは信託統治のまま usa＋label。
# - 重なりの決まり（小さい地域が優先）を使い、例外の島（ブタリタリ、日本軍が残ったマーシャルの環礁など）は小さい地域で分岐の年から上書きする。

# ================================================================ ニューギニア東部（パプアニューギニア）
# 1885 年の英独の境界：*_south_of_1885_line はイギリス（パプア）側、PNG-Hela_Province_north_of_1885_line はドイツ側。

- id: png_papua_coast
  name: パプア南東部（ポートモレスビー・ミルン湾）
  select:
    pieces: [PNG-Central_Province, PNG-National_Capital_District, PNG-Milne_Bay_Province]
  timeline:
    - from: 1648
      owner: null
      note: パプアの人々の地。ポートモレスビー周辺のモトゥ人はヒリと呼ばれる交易航海を行った
      source: "https://ja.wikipedia.org/wiki/パプアニューギニアの歴史"
    - from: 1884
      owner: britain
      label: 英領ニューギニア保護領
      cause: イギリスがニューギニア南東部を保護領とする（11月、ポートモレスビーで宣言）
      note: ドイツの進出を恐れたクイーンズランド植民地が1883年に勝手に併合を宣言し、本国が保護領の形で引き取った
      source: "https://ja.wikipedia.org/wiki/英領ニューギニア"
    - from: 1888
      owner: britain
      label: 英領ニューギニア
      cause: イギリスが保護領を併合し、植民地とする（9月）
      source: "https://ja.wikipedia.org/wiki/英領ニューギニア"
    - from: 1906
      owner: australia
      label: パプア準州
      cause: パプア法によりオーストラリア連邦に移される（9月）
      source: "https://ja.wikipedia.org/wiki/パプア準州"
    - from: 1949
      owner: australia
      label: パプアニューギニア準州
      cause: パプア・ニューギニア法でパプアとニューギニア信託統治領が一つの行政区にまとめられる（首都ポートモレスビー）
      source: "https://ja.wikipedia.org/wiki/パプアニューギニア準州"
    - from: 1975
      owner: papua_new_guinea
      cause: パプアニューギニアがオーストラリアから独立する（9月16日）
      source: "https://ja.wikipedia.org/wiki/パプアニューギニア"

- id: png_papua_north
  name: パプア北東部・湾岸（オロ・ガルフ・モロベ南部）
  select:
    pieces: [PNG-Northern_Oro_Province, PNG-Gulf_Province, PNG-Morobe_Province_south_of_1885_line]
  timeline:
    - from: 1648
      owner: null
      note: パプアの人々の地
      source: "https://ja.wikipedia.org/wiki/パプアニューギニアの歴史"
    - from: 1884
      owner: britain
      certainty: nominal
      label: 英領ニューギニア保護領
      cause: イギリスがニューギニア南東部を保護領とする（11月）
      source: "https://ja.wikipedia.org/wiki/英領ニューギニア"
    - from: 1888
      owner: britain
      label: 英領ニューギニア
      cause: イギリスが併合し、海岸に行政の拠点を置く
      note: 1890年代にオロのヨッダ・ギラ川で金が見つかり、採掘者が入った
      source: "https://ja.wikipedia.org/wiki/英領ニューギニア"
    - from: 1906
      owner: australia
      label: パプア準州
      cause: パプア法によりオーストラリア連邦に移される
      note: 1942年7月に日本軍がオロのブナ・ゴナに上陸し、ココダ道を越えてポートモレスビーをめざしたが撃退され、1943年1月に海岸の拠点も失った（ピースの一部なので占領は描かない）
      source: "https://ja.wikipedia.org/wiki/パプア準州"
    - from: 1949
      owner: australia
      label: パプアニューギニア準州
      cause: パプアとニューギニアが一つの行政区にまとめられる
