      note: "ロシアが押さえたのはアレウト列島・コディアク島・南東の沿岸の交易所だけで、内陸にはほとんど及ばなかった"
      source: "https://en.wikipedia.org/wiki/Russian_America"
    - from: 1799
      owner: "russia"
      certainty: "nominal"
      label: "ロシア領アメリカ（露米会社）"
      cause: "露米会社が設立され、アメリカ大陸のロシア領の独占権を得る。バラノフがシトカ（ノヴォアルハンゲリスク）を築く"
      note: "1804年のシトカの戦いでトリンギットを破り、1808年にシトカを首府とした。1824年の露米協定・1825年の英露条約で南の境（北緯54度40分）と東の境（西経141度）が決まった"
      source: "https://ja.wikipedia.org/wiki/露米会社"
    - from: 1867
      owner: "usa"
      certainty: "nominal"
      label: "アラスカ（アメリカが購入）"
      cause: "アメリカがロシアからアラスカを720万ドルで買い取る（国務長官スワード、10月に引き渡し）"
      note: "1884年まで陸軍・財務省などが管轄し、民政の政府はなかった"
      source: "https://ja.wikipedia.org/wiki/アラスカ購入"
    - from: 1884
      owner: "usa"
      label: "アラスカ地区"
      cause: "組織法でアラスカ地区が置かれ、民政の知事が任命される"
      note: "1890年代のクロンダイク・ノームのゴールドラッシュで人口が増えた。1903年にカナダとの境界（南東部のパンハンドル）が仲裁で決まった"
      source: "https://en.wikipedia.org/wiki/District_of_Alaska"
    - from: 1912
      owner: "usa"
      label: "アラスカ準州"
      cause: "アラスカが準州となる"
      note: "1942–43年に日本軍がアリューシャン列島のアッツ島・キスカ島を占領した（地図のピースはアラスカ全体で1つのため描かない）"
      source: "https://en.wikipedia.org/wiki/Territory_of_Alaska"
    - from: 1959
      owner: "usa"
      label: ""
      cause: "アラスカが49番目の州となる（1月3日）"
      source: "https://ja.wikipedia.org/wiki/アラスカ州"
