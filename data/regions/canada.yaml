# A2 カナダ・アラスカ（CAN・USA の Alaska・SPM・BMU）の地域と所属の変遷（1648–2025）
# scratchpad の gen_regions.py で生成した（各ピースはちょうど1つの地域に属する）。手で直してもよい。
# 方針：入植地・砦の周辺など実際に治めた所は宗主国の色、主張だけの所は certainty: nominal、
# どの国の主張も及ばない極北・西部（1648 年時点のアラスカ・北極諸島・ブリティッシュコロンビアなど）は owner: null。
# ルパートランド（ハドソン湾流域）は 1670 年のハドソン湾会社設立から britain の nominal（label）。
# 1867 年以後のカナダの州には label を付けない。準州（ノースウェスト・ユーコン・ヌナブト）には label。

# ================================================================ ケベック州：セントローレンス川の流域は、入植と領主制（セニョリー）の広がりに合わせて nominal → certain
- id: qc_quebec_city
  name: "ケベック"
  select:
    pieces: [CAN-Capitale_Nationale]
  timeline:
    - from: 1648
      owner: "france"
      label: "ヌーヴェル・フランス"
      note: "1608年にシャンプランがケベックを築いた。ヌーヴェル・フランス（カナダ）の首府"
      source: "https://ja.wikipedia.org/wiki/ヌーベルフランス"
    - from: 1663
      owner: "france"
      label: "ヌーヴェル・フランス"
      cause: "ヌーヴェル・フランスが国王直轄の植民地となる（ルイ14世・コルベール）"
      source: "https://ja.wikipedia.org/wiki/ヌーベルフランス"
    - from: 1759
      owner: "britain"
      certainty: "occupied"
      label: "ケベック（イギリスの占領）"
      cause: "アブラハム平原の戦いでウルフのイギリス軍がモンカルムのフランス軍を破り、ケベックが降伏する（9月）"
      source: "https://ja.wikipedia.org/wiki/アブラハム平原の戦い"
    - from: 1763
      owner: "britain"
      label: "ケベック植民地"
      cause: "パリ条約（1763）でフランスがカナダをイギリスに割譲。国王宣言でケベック植民地が置かれる"
      source: "https://ja.wikipedia.org/wiki/パリ条約_(1763年)"
    - from: 1791
      owner: "britain"
      label: "ローワー・カナダ"
      cause: "1791年の立憲法（カナダ法）でケベックをアッパー・カナダとローワー・カナダに分ける"
      source: "https://ja.wikipedia.org/wiki/1791年憲法法"
    - from: 1841
      owner: "britain"
      label: "カナダ連合植民地"
      cause: "連合法でアッパー・カナダとローワー・カナダが合わさり、カナダ連合植民地（カナダ州）となる"
      source: "https://ja.wikipedia.org/wiki/連合法_(1840年)"
    - from: 1867
      owner: "canada"
      cause: "英領北アメリカ法でカナダ連邦（自治領）が成立。ケベック州となる"
      source: "https://ja.wikipedia.org/wiki/1867年憲法法"

