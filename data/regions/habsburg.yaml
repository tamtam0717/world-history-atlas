    exclude: [CZE-Jesenik]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1815
      owner: habsburg
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: ボヘミア王冠領の一つ（モラヴィア辺境伯領）。

- id: silesia_cz
  name: オーストリア領シュレージエン（トロッパウ・テッシェン）
  select:
    pieces: [CZE-Opava, CZE-Bruntal, CZE-Jesenik, CZE-Karvina, CZE-Frydek_Mistek]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1815
      owner: habsburg
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: >-
    1742年のシュレジエン割譲の後もオーストリアに残った部分（トロッパウ・イェーゲルンドルフの南部、テッシェン公領、ナイセ侯領の南部）。
    オパヴァ郡の北東部（フルチーン地方）は1742年にプロイセン領となったが、ピースの小さい側なので地図ではオーストリアとして描く。
