# ===================== クロアチア（HRV） =====================

- id: croatia_hr
  name: クロアチア・スラヴォニア王国（ザグレブ周辺）
  select:
    iso: [HRV]
  timeline:
    - from: 1648
      owner: habsburg
    - from: 1867
      owner: habsburg
      overlord: hungary_crown
      cause: アウスグライヒでオーストリア＝ハンガリー帝国が成立。クロアチア＝スラヴォニア王国はハンガリー王冠のもとで自治を持つ（1868年のナゴドバ）
      source: "https://ja.wikipedia.org/wiki/アウスグライヒ"
    # ---- 1915–2025 ----
    - {from: 1918, owner: yugoslavia, cause: 帝国の解体。10月29日にスロヴェニア人・クロアチア人・セルビア人国家が成立し、12月1日にセルビアと合同してセルブ＝クロアート＝スロヴェーン王国となる, source: "https://ja.wikipedia.org/wiki/セルブ＝クロアート＝スロヴェーン王国"}
    - {from: 1941, owner: croatia_ndh, cause: 枢軸国のユーゴスラヴィア侵攻（4月）。4月10日にウスタシャがクロアチア独立国を宣言（ボスニア・ヘルツェゴヴィナを含む）, source: "https://ja.wikipedia.org/wiki/クロアチア独立国"}
    - {from: 1945, owner: yugoslavia, cause: パルチザンの勝利でユーゴスラヴィアが復活（11月にユーゴスラヴィア連邦人民共和国）, source: "https://en.wikipedia.org/wiki/Socialist_Federal_Republic_of_Yugoslavia"}
    - {from: 1991, owner: croatia, cause: 6月25日に独立を宣言（10月8日に発効。1992年1月に欧州共同体が承認）, source: "https://ja.wikipedia.org/wiki/クロアチア紛争"}
  note: >-
    ハンガリー王冠に属するクロアチア王国（帝国の外）。1648年にハプスブルク家の手にあったのはザグレブ・ヴァラジュディン・カルロヴァツ周辺の「残りの残り」と呼ばれた地域だけで、
    オスマン帝国との境界にはウィーンが直轄する軍政国境地帯（ヴァラジュディン総督領・カルロヴァツ総督領など）が置かれた。メジムリェは1848年までハンガリーのザラ県に属した。
    1848年、クロアチア総督イェラチッチがメジムリェを占領してクロアチアに編入したが、1861年にハンガリーのザラ県に戻った。1868年のクロアチア＝ハンガリー協約（ナゴドバ）で、クロアチア・スラヴォニア王国はハンガリー王国の中で自治を認められた。軍政国境地帯は1871–1881年に段階的に廃止され、1881年にクロアチア・スラヴォニアに編入された。

