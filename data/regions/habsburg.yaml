- id: bohemia
  name: ボヘミア
  select:
    iso: [CZE]
    exclude_regions: [moravia, silesia_cz]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1815
      owner: habsburg
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: ボヘミア王国はボヘミア王冠領の中心で、ボヘミア王は帝国の選帝侯の一人。ヘプ（エーガー）地方を含む。

# ===================== スロヴァキア（SVK）＝上部ハンガリー =====================

- id: upper_hungary
  name: 上部ハンガリー（現スロヴァキア）
  select:
    iso: [SVK]
  timeline:
    - from: 1648
      owner: habsburg
  note: ハンガリー王国の一部（帝国の外）。オスマン帝国に首都ブダを奪われていた時期（1536–1783）はプレスブルク（ブラチスラヴァ）がハンガリーの首都・戴冠の地だった。

- id: thokoly_sk
  name: 上部ハンガリー東部（カッシャ・エペリェシュ）
  select:
    adm1: ["SVK/Region of Ko?ice", "SVK/Region of Pre?ov"]
  timeline:
    - from: 1648
      owner: habsburg
    - from: 1682
      owner: thokoly
      overlord: ottoman
      certainty: uncertain
      cause: テケリ・イムレがオスマン帝国の後ろ盾で上部ハンガリー公となる
      source: "https://en.wikipedia.org/wiki/Principality_of_Upper_Hungary"
    - from: 1685
      owner: habsburg
      cause: テケリの失脚と皇帝軍によるカッシャ（コシツェ）などの奪回
  note: テケリ・イムレの支配範囲は戦況で大きく変わった。1682–1684年の範囲はおおよそ（要確認）。

- id: nove_zamky
  name: エルシェクウーイヴァール（ノヴェー・ザームキ）
  select:
    pieces: [SVK-District_of_Nova_Zkmky]
  timeline:
    - from: 1648
      owner: habsburg
    - from: 1664
      owner: ottoman
      cause: 要塞が1663年にオスマン軍に陥落し、ヴァシュヴァール条約でオスマン領（ウイヴァル州）となる
      source: "https://en.wikipedia.org/wiki/Peace_of_Vasvár"
    - from: 1699
      owner: habsburg
      cause: カルロヴィッツ条約（要塞は1685年に皇帝軍が奪回）
  note: ドナウ河畔のパールカーニ（シュトゥーロヴォ）は1683年までオスマン領だったが、ピースの小さい側なので省略。

- id: lubovna
  name: スピシュの質入れ都市（スタラー・ルボヴニャ）
  select:
    pieces: [SVK-District_of_Stark_Lubovna]
  timeline:
    - from: 1648
      owner: poland_lithuania
      cause: 1412年からポーランドに質入れされていたスピシュ（ツィプス）13都市とルボヴニャ城領
    - from: 1772
      owner: habsburg
      cause: 第1回ポーランド分割（1769年にオーストリアが占領・編入）
      source: "https://en.wikipedia.org/wiki/Spiš"
  note: 質入れされた都市はスピシュ地方に点在する（ポプラト・スピシュスカー・ノヴァー・ヴェスなど）。ピースの粒度の都合で、ルボヴニャ城とポドリネツを含むスタラー・ルボヴニャ郡だけを充てた。

# ===================== ハンガリー（HUN） =====================

- id: hungary_hu
  name: 王領ハンガリー
  select:
    iso: [HUN]
  timeline:
    - from: 1648
      owner: habsburg
  note: >-
    ハンガリー王国（帝国の外）。1648年時点ではトランスダヌビア西部と北部だけがハプスブルク家の王領ハンガリーで、
    中部・南部はオスマン領、東部はトランシルヴァニア公国の勢力下にあった（下の地域で上書き）。

- id: ottoman_hungary_hu
  name: オスマン領ハンガリー（ブダ州など）
  select:
    adm1: ["HUN/Pest", "HUN/Fejér", "HUN/Tolna", "HUN/Baranya", "HUN/Somogy", "HUN/Bács-Kiskun",
           "HUN/Csongrád-Csanád", "HUN/Békés", "HUN/Jász-Nagykun-Szolnok", "HUN/Heves"]
    pieces: [HUN-Esztergom, HUN-Nagykanizsa, HUN-Paszto, HUN-Batonyterenye,
             HUN-Mez_kovesd, HUN-Mez_csat, HUN-Tiszaujvaros]
  timeline:
    - from: 1648
      owner: ottoman
    - from: 1699
      owner: habsburg
      cause: カルロヴィッツ条約（ブダは1686年、ペーチは1686年、セーケシュフェヘールヴァールは1688年に皇帝軍が奪回）
      source: "https://ja.wikipedia.org/wiki/カルロヴィッツ条約"
  note: >-
    オスマン帝国のブダ州・テメシュヴァル州・エーリ（エゲル）州・カニジャ州など。エステルゴムは1683年、カニジャは1690年に奪回。
    王領との境界付近の村々は双方に税を納めることが多く、境界ははっきりしない。

- id: szabolcs_szatmar
  name: サボルチ・サトマール
  select:
    adm1: ["HUN/Szabolcs-Szatmár-Bereg"]
  timeline:
    - from: 1648
      owner: transylvania
      overlord: ottoman
      certainty: uncertain
      cause: リンツ条約（1645）でラーコーツィ家に終身で与えられた
      source: "https://en.wikipedia.org/wiki/Peace_of_Linz"
    - from: 1660
      owner: habsburg
      certainty: uncertain
      cause: ラーコーツィ・ジェルジ2世の死でハンガリー王（ハプスブルク家）に返還
    - from: 1682
      owner: thokoly
      overlord: ottoman
      certainty: uncertain
      cause: テケリ・イムレが上部ハンガリー公となる
    - from: 1685
      owner: habsburg
      cause: テケリの失脚と皇帝軍による回復
  note: パルティウム（トランシルヴァニア公の支配したハンガリー東部）の一部。1648–1660年の帰属は要確認。

- id: bihar_hajdu
  name: ビハール・ハイドゥー地方（デブレツェン）
  select:
    adm1: ["HUN/Hajdú-Bihar"]
  timeline:
    - from: 1648
      owner: transylvania
      overlord: ottoman
      certainty: uncertain
      cause: パルティウムの一部としてトランシルヴァニア公の支配下
    - from: 1660
      owner: ottoman
      certainty: uncertain
      cause: ヴァーラド（オラデア）の陥落でオスマン帝国のヴァーラド州となる
      source: "https://en.wikipedia.org/wiki/Siege_of_Várad_(1660)"
