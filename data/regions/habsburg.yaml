# 担当 D（ハプスブルク領）の地域と所属の変遷
# ピースの範囲：AUT CZE SVK HUN SVN HRV
#
# 年の決まり（この担当で採ったもの）
# - 大トルコ戦争でのハンガリー・スラヴォニア・リカなどの回復は、実効支配（ブダ奪回1686など）ではなく
#   カルロヴィッツ条約（1699）で切り替える。ダルマチア内陸の一部（イモツキ・ヴルゴラツ）はパッサロヴィッツ条約（1718）。
# - ナポレオン期は条約年：プレスブルク条約（1805）、シェーンブルン条約（1809）、パリ条約（1810、フランス→バイエルン）、
#   第1次パリ条約（1814）でイリリア・チロルなどがオーストリアに戻る。ラグーザはウィーン議定書（1815）。
# - 1815年はドイツ連邦（german_confederation）。オーストリアのうち旧帝国領（オーストリア諸邦・ボヘミア王冠領など）だけを入れ、
#   ハンガリー・クロアチア・ダルマチアは入れない。
# - 軍政国境地帯（クロアチア・スラヴォニア国境地帯）はハプスブルク直轄の軍管区だが、地図では habsburg のまま。

# ===================== オーストリア（AUT） =====================

- id: austria_core
  name: オーストリア諸邦（下・上オーストリア、シュタイアーマルク、ケルンテン）
  select:
    adm1: ["AUT/Niederösterreich", "AUT/Wien", "AUT/Oberösterreich", "AUT/Steiermark", "AUT/Kärnten"]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1815
      owner: habsburg
      overlord: german_confederation
      cause: ドイツ連邦の成立（ウィーン議定書）
      source: "https://ja.wikipedia.org/wiki/ドイツ連邦"
    - from: 1866
      owner: habsburg
      cause: 普墺戦争の敗北とプラハ条約でドイツ連邦が解体し、オーストリアはドイツから切り離される
      source: "https://ja.wikipedia.org/wiki/プラハ条約_(1866年)"
    # ---- 1915–2025 ----
    - {from: 1918, owner: austria, cause: オーストリア＝ハンガリー帝国の解体。11月12日にドイツ＝オーストリア共和国が成立（1919年のサン＝ジェルマン条約でオーストリア共和国）, source: "https://ja.wikipedia.org/wiki/サン＝ジェルマン条約"}
    - {from: 1938, owner: germany, label: オーストリア（ドイツが併合）, certainty: occupied, cause: ドイツによるオーストリア併合（アンシュルス、3月）, source: "https://ja.wikipedia.org/wiki/アンシュルス"}
    - {from: 1945, owner: soviet_union, certainty: occupied, label: オーストリア（ソ連占領地区）, cause: 第二次世界大戦の終結。連合国4か国がオーストリアを分割占領（4月にレンナーの臨時政府が独立を宣言し、政府は存続）, source: "https://en.wikipedia.org/wiki/Allied-occupied_Austria"}
    - {from: 1955, owner: austria, cause: オーストリア国家条約（5月）で主権を回復し、占領軍が撤退。10月に永世中立を宣言, source: "https://ja.wikipedia.org/wiki/オーストリア国家条約"}

