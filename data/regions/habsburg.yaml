# 担当 D（ハプスブルク領）の地域と所属の変遷
# ピースの範囲：AUT CZE SVK HUN SVN HRV
#
# 年の決まり（この担当で採ったもの）
# - 大トルコ戦争でのハンガリー・スラヴォニア・リカなどの回復は、実効支配（ブダ奪回1686など）ではなく
#   カルロヴィッツ条約（1699）で切り替える。ダルマチア内陸の一部（イモツキ・ヴルゴラツ）はパッサロヴィッツ条約（1718）。
# - ナポレオン期は条約年：プレスブルク条約（1805）、シェーンブルン条約（1809）、パリ条約（1810、フランス→バイエルン）、
#   第1次パリ条約（1814）でイリリア・チロルなどがオーストリアに戻る。ラグーザはウィーン議定書（1815）。
# - 1815年はドイツ連邦（german_confederation）。オーストリアのうち旧帝国領（オーストリア諸邦・ボヘミア王冠領など）だけを入れ、
#   ハンガリー・クロアチア・ダルマチアは入れない。
# - 軍政国境地帯（クロアチア・スラヴォニア国境地帯）はハプスブルク直轄の軍管区だが、地図では habsburg のまま。

# ===================== オーストリア（AUT） =====================

- id: austria_core
  name: オーストリア諸邦（下・上オーストリア、シュタイアーマルク、ケルンテン）
  select:
    adm1: ["AUT/Niederösterreich", "AUT/Wien", "AUT/Oberösterreich", "AUT/Steiermark", "AUT/Kärnten"]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1815
      owner: habsburg
      overlord: german_confederation
      cause: ドイツ連邦の成立（ウィーン議定書）
      source: "https://ja.wikipedia.org/wiki/ドイツ連邦"

- id: innviertel
  name: インフィアテル
  select:
    pieces: [AUT-Braunau_am_Inn, AUT-Ried_im_Innkreis, AUT-Scharding]
  timeline:
    - from: 1648
      owner: bavaria
      overlord: hre
    - from: 1704
      owner: habsburg
      overlord: hre
      certainty: occupied
      cause: スペイン継承戦争でバイエルン全土がオーストリアの占領下に（ドイツ側のバイエルン本領と同じ扱い）
    - from: 1714
      owner: bavaria
      overlord: hre
      cause: ラシュタット条約・バーデン条約で選帝侯が復帰
    - from: 1779
      owner: habsburg
      overlord: hre
      cause: テシェン条約（バイエルン継承戦争の講和）でバイエルンからオーストリアへ
      source: "https://ja.wikipedia.org/wiki/テシェン条約"
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1810
      owner: bavaria
      overlord: rhine_confederation
      cause: シェーンブルン条約（1809）でナポレオンに割譲され、パリ条約（1810）でバイエルンへ
      source: "https://en.wikipedia.org/wiki/Treaty_of_Schönbrunn"
    - from: 1813
      owner: bavaria
      cause: バイエルンがライン同盟を離脱（リート条約）
    - from: 1815
      owner: bavaria
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: 1816年のミュンヘン条約でオーストリアに戻る（データ範囲外）。

- id: hausruck_west
  name: ハウスルックフィアテル西部
  select:
    pieces: [AUT-Vocklabruck]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1810
      owner: bavaria
      overlord: rhine_confederation
      cause: シェーンブルン条約（1809）・パリ条約（1810）でバイエルンへ
      source: "https://en.wikipedia.org/wiki/Hausruckviertel"
    - from: 1813
      owner: bavaria
      cause: バイエルンがライン同盟を離脱（リート条約）
    - from: 1815
      owner: bavaria
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: 割譲されたのはハウスルックフィアテルの西半分。ピースの粒度の都合でフェックラブルック郡だけを充てた（要確認）。1816年にオーストリアへ戻る。

- id: upper_carinthia
  name: 上ケルンテン（フィラッハ周辺）
  select:
    pieces: [AUT-Villach_Stadt, AUT-Villach_Land, AUT-Spittal_an_der_Drau, AUT-Hermagor]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1809
      owner: illyria
      overlord: france
      cause: シェーンブルン条約でフランスへ割譲（イリリア州）
      source: "https://ja.wikipedia.org/wiki/イリュリア州"
    - from: 1814
      owner: habsburg
      cause: パリ条約でオーストリアに復帰
    - from: 1815
      owner: habsburg
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: >-
    フィラッハはバンベルク司教領の飛び地で、1759年にマリア・テレジアが買い取った（ヴォルフスベルクなどラヴァント谷も同じ）。
    ただし1535年以降はオーストリアのケルンテン公の領邦高権の下にあったので、地図ではオーストリアとして描く。

- id: tyrol_vorarlberg
  name: チロル・フォアアールベルク
  select:
    adm1: ["AUT/Tirol", "AUT/Vorarlberg"]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1805
      owner: bavaria
      overlord: hre
      cause: プレスブルク条約でバイエルンへ割譲
      source: "https://ja.wikipedia.org/wiki/プレスブルクの和約"
    - from: 1806
      owner: bavaria
      overlord: rhine_confederation
      cause: ライン同盟の結成
    - from: 1813
      owner: bavaria
      cause: バイエルンがライン同盟を離脱（リート条約）
    - from: 1814
      owner: habsburg
      cause: パリ条約・バイエルンとの協定でオーストリアに復帰
    - from: 1815
      owner: habsburg
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: 1809年にアンドレアス・ホーファーらがバイエルン・フランスの支配に対して蜂起した（チロル蜂起）。フォアアールベルクのホーエンエムス伯領（1765年までの独立した帝国諸邦）は小さいので省略。

- id: east_tyrol
  name: 東チロル（リエンツ）
  select:
    pieces: [AUT-Lienz]
  timeline:
    - from: 1648
      owner: habsburg
      overlord: hre
    - from: 1805
      owner: bavaria
      overlord: hre
      cause: プレスブルク条約でバイエルンへ割譲
    - from: 1806
      owner: bavaria
      overlord: rhine_confederation
      cause: ライン同盟の結成
    - from: 1810
      owner: illyria
      overlord: france
      cause: パリ条約（フランス・バイエルン間）でイリリア州へ
      source: "https://en.wikipedia.org/wiki/East_Tyrol"
    - from: 1814
      owner: habsburg
      cause: パリ条約でオーストリアに復帰
    - from: 1815
      owner: habsburg
      overlord: german_confederation
      cause: ドイツ連邦の成立

- id: salzburg_at
  name: ザルツブルク
  select:
    adm1: ["AUT/Salzburg"]
  timeline:
    - from: 1648
      owner: salzburg
      overlord: hre
    - from: 1803
      owner: salzburg
      overlord: hre
      cause: 帝国代表者会議主要決議で世俗化され、ザルツブルク選帝侯領となる
      source: "https://ja.wikipedia.org/wiki/帝国代表者会議主要決議"
    - from: 1805
      owner: habsburg
      overlord: hre
      cause: プレスブルク条約でオーストリアに併合
      source: "https://ja.wikipedia.org/wiki/プレスブルクの和約"
    - from: 1806
      owner: habsburg
      cause: 神聖ローマ帝国の解体
    - from: 1810
      owner: bavaria
      overlord: rhine_confederation
      cause: シェーンブルン条約（1809）でナポレオンに割譲され、パリ条約（1810）でバイエルンへ
    - from: 1813
      owner: bavaria
      cause: バイエルンがライン同盟を離脱（リート条約）
    - from: 1815
      owner: bavaria
      overlord: german_confederation
      cause: ドイツ連邦の成立
  note: >-
    1816年のミュンヘン条約でオーストリアに戻る（ただしルペルティウィンケルなど西部はバイエルンに残る）。
    チロルのツィラー谷・ブリクセン谷の一部も大司教領だったが、ピースの粒度の都合で省略。

- id: burgenland
  name: ブルゲンラント（西ハンガリー）
  select:
    adm1: ["AUT/Burgenland"]
  timeline:
    - from: 1648
      owner: habsburg
  note: 1921年までハンガリー王国の一部（帝国の外）。エステルハージ家などハンガリー大貴族の所領が多い。

# ===================== チェコ（CZE） =====================

