# F2 ギニア湾・ナイジェリア・カメルーン・チャド（GHA・TGO・BEN・NGA・CMR・TCD・GNQ・STP）の地域と所属の変遷（1648–2025）
# このファイルは F2 のスクリプトで生成した（各ピースはちょうど1つの地域に属する）。手で直してもよい。
# 方針：アシャンティ・ダホメ・オヨ・ソコト・ボルヌ・ワダイなどの在地の国家は独自の色。ヨーロッパの砦・植民地は宗主国の色＋label。
# 勢力圏の主張だけの内陸は nominal（斜線）。北ナイジェリアの首長国・バギルミなど在地の支配者を通じた保護領は indirect（薄い色）。
# 王国を持たない社会（イボ・ティブ・サラ・トゥブなど）は植民地化まで owner なし（note に記す）。

- id: gc_elmina
  name: "エルミナ"
  select:
    pieces: [GHA-Komenda_edina_eguafo_abirem_Municipal]
  timeline:
    - from: 1648
      owner: "netherlands"
      label: "オランダ領黄金海岸（エルミナ城）"
      note: "1637年にオランダ西インド会社がポルトガルからエルミナ城を奪い、黄金海岸の本拠とした。奴隷貿易の拠点"
      source: "https://en.wikipedia.org/wiki/Elmina_Castle"
    - from: 1872
      owner: "britain"
      label: "ゴールドコースト（イギリスの保護地域）"
      cause: "1871年の英蘭条約で、オランダが黄金海岸の砦をすべてイギリスに譲る（1872年4月）"
      source: "https://en.wikipedia.org/wiki/Dutch_Gold_Coast"
    - from: 1874
      owner: "britain"
      label: "ゴールドコースト植民地"
      cause: "第3次アシャンティ戦争の後、海岸部がゴールドコースト植民地となる（7月）"
      source: "https://en.wikipedia.org/wiki/Gold_Coast_(British_colony)"
    - from: 1957
      owner: "ghana"
      cause: "ゴールドコーストがガーナとして独立する（3月6日。首相エンクルマ）"
      source: "https://ja.wikipedia.org/wiki/ガーナ"

