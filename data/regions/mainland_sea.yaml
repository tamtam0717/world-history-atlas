# S4 大陸部東南アジア（MMR THA LAO KHM VNM）の地域と所属の変遷（1648–2025）
# このファイルは scratchpad/s4/gen_regions_s4.py で生成した（手で直してよい。直したときは生成をやめてこのファイルを正とする）。
# 主な方針：
#  - 冊封：ベトナム（黎朝〈鄭氏〉1667–・西山朝 1789–・阮朝–1882、トンキン北部–1884）は清の帯。シャム・ビルマ・ラオスの朝貢は帯なし。
#  - シャムの宗主権下（ランナー・ラオ諸国・パタニ・カンボジアの一時期）は独自の色＋overlord: siam。
#  - フランス領インドシナ：コーチシナは直轄（濃い色）、アンナン・トンキン・カンボジア・ルアンパバーン王国は保護国（indirect）。
#    ラオス（ルアンパバーン王国以外）は直轄。1940（北部）・1941（全域）–1944 は overlord: japan（日本軍の進駐。フランスの行政は続いた）。
#  - イギリス領ビルマ：管区ビルマは直轄、シャン諸州・カレンニー・カチン・チン丘陵は間接統治（indirect）。
#  - 1942–45 のビルマ：日本の占領（occupied）→ 1943 ビルマ国（overlord: japan）。タイが得たケントゥンは siam。
#  - インドシナ戦争・ベトナム戦争・カンボジア内戦・ミャンマー内戦は、年末の時点の大まかな支配で描く（細かい前線は描けない）。

- id: mmr_arakan_north
  name: アラカン（ミャウー・シットウェー）
  select:
    pieces: [MMR-Sittwe, MMR-Mrauk_U]
  timeline:
  # ---- 1453–1647（Z6） ----
  - from: 1453
    owner: arakan
    source: "https://en.wikipedia.org/wiki/Kingdom_of_Mrauk_U"
  # ---- 1648– ----
  - from: 1648
    owner: arakan
    note: 都はミャウー。ベンガルのチッタゴンも支配していた（1666年まで）
    source: "https://en.wikipedia.org/wiki/Kingdom_of_Mrauk_U"
  - from: 1785
    owner: burma
    cause: ボードーパヤー王のビルマ軍がアラカンを征服し、都ミャウーを落とす（1784年末–1785年1月）
    source: "https://en.wikipedia.org/wiki/Konbaung_conquest_of_Arakan"
  - from: 1825
    owner: britain
    certainty: occupied
    label: アラカン（イギリス軍の占領）
    cause: 第1次イギリス＝ビルマ戦争。イギリス軍がアラカンの都ミャウーを落とす（4月）
    source: "https://ja.wikipedia.org/wiki/英緬戦争"
  - from: 1826
    owner: britain
    label: アラカン（英領インド）
    cause: 第1次イギリス＝ビルマ戦争のヤンダボ条約で、アラカンがイギリス領となる
    source: "https://ja.wikipedia.org/wiki/ヤンダボ条約"
  - from: 1937
    owner: britain
    label: 英領ビルマ
    cause: ビルマがイギリス領インドから分離される
    source: "https://ja.wikipedia.org/wiki/イギリス領ビルマ"
  - from: 1942
    owner: japan
    certainty: occupied
    label: ビルマ（日本軍の占領）
    cause: 日本軍がアキャブ（シットウェー）を占領する（5月）
    source: "https://ja.wikipedia.org/wiki/ビルマの戦い"
  - from: 1943
    owner: burma_state
    overlord: japan
    cause: 日本がビルマに「独立」を与え、バー・モウのビルマ国が成立（8月）
    source: "https://ja.wikipedia.org/wiki/ビルマ国"
  - from: 1945
    owner: britain
    label: 英領ビルマ
    cause: イギリス軍がアキャブを奪回する（1月）
    source: "https://ja.wikipedia.org/wiki/ビルマの戦い"
  - from: 1948
    owner: burma
    cause: ビルマ連邦がイギリスから独立（1月4日）
    source: "https://ja.wikipedia.org/wiki/ミャンマーの歴史"
  - from: 2024
    owner: burma
    certainty: uncertain
    cause: アラカン軍がミャウーなど州の大半をおさえ、国軍は州都シットウェーを保つ
    note: ミャウー（Mrauk-U のピース）は2024年2月にアラカン軍が占領した。ピースが州都シットウェーと合わさっているので斜線とした
    source: "https://en.wikipedia.org/wiki/Arakan_Army"

