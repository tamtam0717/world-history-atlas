    source: "https://ja.wikipedia.org/wiki/西山朝"
  - from: 1802
    owner: vietnam
    overlord: qing
    cause: 阮福映が西山朝を滅ぼし、嘉隆帝として阮朝を開く
    note: 1804年に清から「越南国王」に冊封された
    source: "https://ja.wikipedia.org/wiki/阮朝"
