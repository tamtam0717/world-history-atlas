# G1 中国（中国本土・東北・香港・マカオ・租借地・台湾）の地域と所属の変遷（1648–2025）
# 地域は「同じ所属の変遷をたどった地級市（ピース）のまとまり」。互いに重ならない（どのピースも1つの地域だけに入る）。
# 内モンゴル・新疆・チベット・青海は G2（data/regions/inner_asia.yaml）。
# 内戦（明清交代・三藩の乱・太平天国・国共内戦）と日中戦争は年末時点の主な勢力圏を地級市の単位で近似して描く（過半を占める側）。
# 生成：G1 の作業用スクリプト（塗りの操作の列からピースごとの変遷を作り、同じ変遷のピースをまとめた）。手で直してよい。

- id: cn_heilongjiang_daqing
  name: 大慶・ハルビン・鶴崗・ジャムスなど（黒竜江）
  select:
    pieces: [CHN-Daqing, CHN-Haerbin, CHN-Hegang, CHN-Jiamusi, CHN-Jixi, CHN-Mudanjiang, CHN-Qitaihe, CHN-Shuangyashan, CHN-Suihua, CHN-Yichun_Heilongjiang]
  timeline:
    - from: 1648
      owner: qing
      note: 清（順治帝）は1644年に北京に入り、華北・江南を支配する。摂政はドルゴン
      source: "https://ja.wikipedia.org/wiki/清"
    - from: 1900
      owner: russia
      certainty: occupied
      label: 満洲（ロシア軍の占領）
      cause: 義和団戦争に乗じてロシア軍が満洲全土を占領する（7–10月）
      source: "https://ja.wikipedia.org/wiki/満洲還付条約"
    - from: 1905
      owner: qing
      cause: ポーツマス条約・満洲善後条約で清に返される（東清鉄道・南満洲鉄道の付属地は残る）
      source: "https://ja.wikipedia.org/wiki/ポーツマス条約"
    - from: 1912
      owner: roc
      cause: 中華民国の成立（1月）と宣統帝の退位（2月）。清が滅びる
      source: "https://ja.wikipedia.org/wiki/中華民国_(1912年-1949年)"
    - from: 1932
      owner: manchukuo
      overlord: japan
      cause: 満洲国の建国（3月1日）
      source: "https://ja.wikipedia.org/wiki/満洲国"
    - from: 1945
      owner: soviet_union
      certainty: occupied
      label: 満洲（ソ連軍の占領）
      cause: ソ連の対日参戦（8月9日）。ソ連軍が満洲国を占領し、満洲国が崩れる
      source: "https://ja.wikipedia.org/wiki/ソ連対日参戦"
    - from: 1946
      owner: chinese_soviet
      cause: ソ連軍の撤退の後、中国共産党の東北民主連軍が北満洲を押さえる（4月 ハルビン）
      source: "https://ja.wikipedia.org/wiki/遼瀋戦役"
    - from: 1949
      owner: prc
      cause: 中華人民共和国の成立（10月1日）。人民解放軍が長江を渡り（4月）、南京・上海・広州・重慶・成都を取る
      source: "https://ja.wikipedia.org/wiki/中華人民共和国"

