    pieces: [CHN-Nanjing]
  timeline:
    - from: 1648
      owner: qing
      note: 清（順治帝）は1644年に北京に入り、華北・江南を支配する。摂政はドルゴン
      source: "https://ja.wikipedia.org/wiki/清"
    - from: 1853
      owner: taiping
      cause: 太平天国軍が南京を落とし、天京と改めて都とする（3月）
      source: "https://ja.wikipedia.org/wiki/太平天国"
    - from: 1864
      owner: qing
      cause: 天京が陥落し（7月）、太平天国が滅びる
      source: "https://ja.wikipedia.org/wiki/天京攻防戦"
    - from: 1911
      owner: roc
      certainty: uncertain
      label: 辛亥革命で独立した省
      cause: 武昌起義（10月10日）。南方を中心に14省が清からの独立を宣言する
      source: "https://ja.wikipedia.org/wiki/辛亥革命"
    - from: 1912
      owner: roc
      cause: 中華民国の成立（1月）と宣統帝の退位（2月）。清が滅びる
      source: "https://ja.wikipedia.org/wiki/中華民国_(1912年-1949年)"
    - from: 1927
      owner: canton_government
      cause: 北伐軍が上海・南京を取り、南京に国民政府を置く（4月）。馮玉祥・閻錫山も北伐に加わる
      source: "https://ja.wikipedia.org/wiki/北伐_(中国国民党)"
    - from: 1928
      owner: roc
      cause: 北伐の完了。北京を取り（6月）、国民政府が中国を統一する（12月 張学良の易幟）
      source: "https://ja.wikipedia.org/wiki/北伐_(中国国民党)"
    - from: 1937
      owner: japan
      certainty: occupied
      label: 日本の占領地（中華民国維新政府）
      cause: 第2次上海事変（8–11月）。日本軍が南京を占領する（12月13日。南京事件）。1938年3月に南京に中華民国維新政府
      source: "https://ja.wikipedia.org/wiki/中華民国維新政府"
    - from: 1940
      owner: wang_jingwei
      overlord: japan
      cause: 汪兆銘が南京に国民政府（汪兆銘政権）を作る（3月）。華北の臨時政府は華北政務委員会として形の上で合流する
      note: 日本軍の占領地の都市と鉄道沿いを治めた。農村には中国共産党の八路軍・新四軍の根拠地が広がった
      source: "https://ja.wikipedia.org/wiki/汪兆銘政権"
    - from: 1945
      owner: roc
      cause: 日本の降伏（8月15日、9月9日に南京で降伏文書の調印）。国民政府が占領地を接収する
      source: "https://ja.wikipedia.org/wiki/日中戦争"
    - from: 1949
      owner: prc
      cause: 中華人民共和国の成立（10月1日）。人民解放軍が長江を渡り（4月）、南京・上海・広州・重慶・成都を取る
      source: "https://ja.wikipedia.org/wiki/中華人民共和国"

