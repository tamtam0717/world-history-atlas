# =============================================================== チベット
- id: tibet_central
  name: チベット（ウー・ツァン・ガリ・チャンタン）
  select:
    pieces: [CHN-Lasa, CHN-Shannan, CHN-Rikaze, CHN-Naqu, CHN-Linzhi, CHN-Ali]
  timeline:
    - from: 1648
      owner: tibet
      overlord: khoshut
      note: 1642年、ホシュートのグシ・ハンがツァン王を倒してダライ・ラマ5世にチベットの統治権を献じた（ガンデンポタン）。グシ・ハンの王家はチベット王を名のり軍事を握った
      source: "https://ja.wikipedia.org/wiki/ガンデンポタン"
    - from: 1717
      owner: dzungar
      certainty: occupied
      label: チベット（ジュンガルの占領）
      cause: ジュンガル軍がラサを占領し、ホシュートのラサン・ハンを殺す（11–12月）
      source: "https://en.wikipedia.org/wiki/Dzungar_conquest_of_Tibet"
    - from: 1720
      owner: qing
      certainty: indirect
      cause: 清の遠征軍がジュンガル軍を追ってラサに入り、ダライ・ラマ7世を即位させる（9–10月）
      note: 1727年から駐蔵大臣（アンバン）が置かれた。1793年の「欽定蔵内善後章程」で統制が強まった
      source: "https://en.wikipedia.org/wiki/Chinese_expedition_to_Tibet_(1720)"
    - from: 1910
      owner: qing
      cause: 清軍（四川の新軍）がラサに入り、ダライ・ラマ13世がインドへ逃れる（2月）
      note: 1904年にはイギリスのヤングハズバンドの遠征軍がラサに入り、ラサ条約を結ばせていた（地図では描かない）
      source: "https://ja.wikipedia.org/wiki/ダライ・ラマ13世"
    - from: 1911
      owner: qing
      certainty: uncertain
      cause: 辛亥革命。ラサの清軍が反乱を起こし、チベット人の部隊と戦う
      source: "https://en.wikipedia.org/wiki/Xinhai_Lhasa_turmoil"
    - from: 1912
      owner: tibet
      cause: 中国軍が降伏し、インド経由でチベットから去る（1912年8月の協定、1913年1月に完了）。ダライ・ラマ13世がラサに戻り、1913年2月に独立を宣言する
      note: 中華民国はチベットを自国の領土とし、独立を認めなかった。地図では事実上の統治で描く
      source: "https://ja.wikipedia.org/wiki/チベット_(1912-1951)"
    - from: 1951
      owner: prc
      certainty: indirect
      cause: 「チベットの平和解放に関する十七か条協定」（5月）。人民解放軍がラサに入る（10月）
      note: ダライ・ラマ政権（カシャ）は1959年まで内政を続けた
      source: "https://ja.wikipedia.org/wiki/十七か条協定"
    - from: 1959
      owner: prc
      cause: チベット蜂起（3月）。ダライ・ラマ14世がインドへ亡命し、ダライ・ラマ政権は廃される
      note: 1965年にチベット自治区。ニンティ（林芝）南部のマクマホン・ラインの南（アルナーチャル・プラデーシュ）はインドが実効支配し、中国も領有を主張している（ピースは中国の実効支配の範囲）
      source: "https://ja.wikipedia.org/wiki/チベット動乱"

