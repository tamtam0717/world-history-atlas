# 内陸アジア（担当 G2）：モンゴル（MNG）、中国の内モンゴル・新疆・チベット・青海、
# ロシアのシベリア南部・極東でロシア領になる前の時期（アルタイ・ハカス・トゥヴァ・アムール・沿海州）。
# 清の藩部（モンゴル・青海・チベット・新疆〈1884年の省設置まで〉・内モンゴル）は owner: qing・certainty: indirect。
# ロシアのピースは north_east.yaml（ヨーロッパ担当）の1ピースの地域が、それぞれの開始年から優先される。
# ここでは2–3ピースの大きめの地域で、その前の時期だけを補う（重なりの決まり：小さい地域が優先）。

# =============================================================== モンゴル高原（外モンゴル）
- id: khalkha_land
  name: 外モンゴル（ハルハ）
  select:
    iso_all: [MNG]
  timeline:
    - from: 1648
      owner: khalkha
      note: トゥシェート・ハン、ジャサクト・ハン、セチェン・ハンの3ハン家の遊牧地。北西部（フブスグル）にはアルタン・ハン（ホトゴイト部）がいた
      source: "https://ja.wikipedia.org/wiki/ハルハ"
    - from: 1688
      owner: dzungar
      certainty: occupied
      label: ハルハ（ジュンガルの侵入）
      cause: ジュンガルのガルダンがハルハに侵入し、ハルハの諸侯は内モンゴルへ逃れる
      source: "https://ja.wikipedia.org/wiki/ガルダン"
    - from: 1691
      owner: qing
      certainty: indirect
      cause: ドローン・ノール会盟でハルハの諸侯が康熙帝に服属し、清の藩部（外モンゴル）となる
      note: 1696年のジョーン・モドの戦いでガルダンが敗れ、ハルハの人々は故地に戻った。のちウリャスタイ（1733）に定辺左副将軍、フレー（ウランバートル）に庫倫辦事大臣が置かれた
      source: "https://ja.wikipedia.org/wiki/ドロンノール会盟"
    - from: 1911
      owner: mongolia
      cause: 辛亥革命の後、ハルハの諸侯がジェブツンダンバ・ホトクト8世をボグド・ハーンに推して独立を宣言（12月）
      source: "https://ja.wikipedia.org/wiki/ボグド・ハーン政権"
    - from: 1915
      owner: mongolia
      overlord: roc
      cause: キャフタ協定（ロシア・中華民国・モンゴル）で、中華民国の宗主権のもとの自治とされる（6月）
      source: "https://en.wikipedia.org/wiki/Treaty_of_Kyakhta_(1915)"
    - from: 1919
      owner: roc
      certainty: uncertain
      label: 外モンゴル（自治の取り消し）
      cause: 中国の徐樹錚の軍がフレー（庫倫）に入り、外モンゴルの自治を取り消す（11月）
      source: "https://en.wikipedia.org/wiki/Occupation_of_Mongolia"
    - from: 1921
      owner: mongolia
      cause: ウンゲルンの白軍が中国軍を追い（2月）、続いてスフバートルの人民義勇軍とソヴィエト赤軍がフレーを占領して人民政府を立てる（7月）
      note: 1924年にモンゴル人民共和国。中華民国が独立を認めたのは1946年1月（1945年10月の住民投票の後）
      source: "https://ja.wikipedia.org/wiki/モンゴル人民革命"

- id: mongolia_west
  name: 西モンゴル（ホブド・オブス・バヤン・ウルギー）
  select:
    pieces: [MNG-Khovd, MNG-Uvs, MNG-Bayan_Olgii]
  timeline:
    - from: 1648
      owner: dzungar
      certainty: uncertain
      note: オイラト（ドルベト・ホシュートなど）の遊牧地で、ジュンガルの勢力圏。東のハルハのジャサクト・ハン家との境はあいまい
      source: "https://ja.wikipedia.org/wiki/オイラト"
    - from: 1680
      owner: dzungar
      cause: ガルダンのもとでジュンガルの支配が固まる
      source: "https://ja.wikipedia.org/wiki/ガルダン"
    - from: 1731
      owner: dzungar
      certainty: uncertain
      cause: 清とジュンガルの戦争（ホトン・ノールの戦い）。1739年の講和でアルタイ山脈が境とされたが、ホブド一帯は両者の係争地だった
      source: "https://en.wikipedia.org/wiki/Dzungar–Qing_Wars"
    - from: 1755
      owner: qing
      certainty: uncertain
      cause: 清がジュンガルを滅ぼす。ドルベト部は1753年に清に服属していた
      note: 1755–1757年はアムルサナの反乱でオイラトの地が争われたので、不確実（斜線）として描く
      source: "https://ja.wikipedia.org/wiki/アムルサナ"
    - from: 1757
      owner: qing
      certainty: indirect
      cause: アムルサナの反乱が鎮められ、オイラトの地が清の支配下に入る
      note: のちにホブドに参賛大臣が置かれ、アルタイ・ウリャンハイやカザフの遊牧民も管轄した。バヤン・ウルギーには19世紀後半からカザフ人が移り住んだ
      source: "https://ja.wikipedia.org/wiki/ジュンガル"
    - from: 1912
      owner: mongolia
      cause: ボグド・ハーン政権の軍がホブドの清の城を攻め落とす（8月）
      source: "https://en.wikipedia.org/wiki/Battle_of_Khovd"
    - from: 1915
      owner: mongolia
      overlord: roc
      cause: キャフタ協定で、中華民国の宗主権のもとの自治とされる（6月）
      source: "https://en.wikipedia.org/wiki/Treaty_of_Kyakhta_(1915)"
    - from: 1919
      owner: roc
      certainty: uncertain
      label: 外モンゴル（自治の取り消し）
      cause: 中国の徐樹錚の軍が外モンゴルの自治を取り消す（11月）
      source: "https://en.wikipedia.org/wiki/Occupation_of_Mongolia"
    - from: 1921
      owner: mongolia
      cause: モンゴル人民革命。人民政府が西モンゴルの白軍の残党を退ける
      source: "https://ja.wikipedia.org/wiki/モンゴル人民革命"

# =============================================================== 内モンゴル
- id: inner_mongolia
  name: 内モンゴル
  select:
    adm1: ["CHN/Inner Mongolia Autonomous Region"]
  timeline:
    - from: 1648
      owner: qing
      certainty: indirect
      note: 南モンゴルの諸部は1636年に清（ホンタイジ）に服属し、盟旗制（旗・盟に分けて王公に治めさせる）のもとに置かれた。帰化城（フフホト）一帯のトゥメト部などは山西の官庁の管轄も受けた
      source: "https://ja.wikipedia.org/wiki/内モンゴル"
    - from: 1912
      owner: roc
      cause: 中華民国の成立と清の皇帝の退位（2月）。内モンゴルの王公の多くは中華民国にとどまる
      note: 1914年に熱河・チャハル・綏遠の特別区、1928年に熱河・チャハル・綏遠・寧夏の省となった
      source: "https://ja.wikipedia.org/wiki/内モンゴル"
    - from: 1927
      owner: canton_government
      cause: 綏遠は1926年の国民軍（馮玉祥）の撤退の後、山西の閻錫山の勢力下にあり、閻錫山が国民政府に従う（6月）
      note: 中国本土側（G1）の甘粛・寧夏・山西と同じく、1927年末は国民政府（広州→南京）の側として描く（整合で追加）
      source: "https://ja.wikipedia.org/wiki/閻錫山"
    - from: 1928
      owner: roc
      cause: 北伐の完了で、南京の国民政府が中華民国の政府となる
      source: "https://ja.wikipedia.org/wiki/北伐_(中国国民党)"
    - from: 1949
      owner: prc
      cause: 綏遠の国民政府軍が共産党に降り（9月）、中華人民共和国の成立（10月）。内モンゴル自治区（1947年成立）に綏遠省を合わせていく（1954）
      source: "https://ja.wikipedia.org/wiki/内モンゴル自治区"

- id: alxa
  name: アラシャン（阿拉善）
  select:
    pieces: [CHN-Alashan]
  timeline:
    - from: 1648
      owner: null
      certainty: uncertain
      note: 明の長城の北の砂漠と草原。オルドス・ハルハなどのモンゴル人がまばらに遊牧した
      source: "https://en.wikipedia.org/wiki/Alxa_League"
    - from: 1686
      owner: qing
      certainty: indirect
      cause: ジュンガルから逃れたホシュート部の一派（バヤル・バートル）が清に服属し、アラシャンに遊牧地を与えられる（1697年に旗とされる）
      source: "https://en.wikipedia.org/wiki/Alxa_League"
    - from: 1912
      owner: roc
      cause: 中華民国の成立。1929年から寧夏省に属する
      source: "https://en.wikipedia.org/wiki/Alxa_League"
    - from: 1927
      owner: canton_government
      cause: 寧夏・甘粛を押さえる馮玉祥の国民軍が国民政府に加わり、北伐に参加する（5月）
      note: 中国本土側（G1）の甘粛・寧夏・山西と同じく、1927年末は国民政府（広州→南京）の側として描く（整合で追加）
      source: "https://ja.wikipedia.org/wiki/馮玉祥"
    - from: 1928
      owner: roc
      cause: 北伐の完了で、南京の国民政府が中華民国の政府となる
      source: "https://ja.wikipedia.org/wiki/北伐_(中国国民党)"
    - from: 1949
      owner: prc
      cause: 寧夏の馬鴻逵の政権が崩れ、人民解放軍が入る（9月）
      source: "https://ja.wikipedia.org/wiki/寧夏回族自治区"

- id: hulunbuir
  name: ホロンバイル（呼倫貝爾）
  select:
    pieces: [CHN-Hulunbeier]
  timeline:
    - from: 1648
      owner: qing
      certainty: nominal
      note: ダウール・ソロン（エヴェンキ）などの狩猟・遊牧民が清に貂皮を納めた。北のアルグン川一帯ではロシアのコサックと争った（1689年のネルチンスク条約でアルグン川が国境）
      source: "https://ja.wikipedia.org/wiki/ホロンバイル市"
    - from: 1732
      owner: qing
      certainty: indirect
      cause: 清がソロン・ダウール・バルガの兵をホロンバイルに移して八旗に編成し、ハイラルに城を築く（1734）
      note: 黒竜江将軍の管轄
      source: "https://en.wikipedia.org/wiki/Hulunbuir"
    - from: 1912
      owner: mongolia
      certainty: uncertain
      cause: バルガの王公がハイラルを占領し、ボグド・ハーン政権に加わる（1月）
      source: "https://en.wikipedia.org/wiki/Hulunbuir"
    - from: 1915
      owner: roc
      cause: 露中協定で、中華民国の主権のもとの特別区とされる（1920年に特別区は廃止）
      note: 1929年の中ソ紛争（中東鉄道をめぐる）では、ソ連軍が一時ハイラル・満洲里を占領した（地図では描かない）
      source: "https://en.wikipedia.org/wiki/Hulunbuir"
    - from: 1932
      owner: manchukuo
      overlord: japan
      cause: 満洲国の成立（3月）。興安北分省（のち興安北省）とされる
      source: "https://ja.wikipedia.org/wiki/興安省"
    - from: 1945
      owner: soviet_union
      certainty: occupied
      label: 満洲（ソ連軍の占領）
      cause: ソ連の対日参戦（8月）。ソ連軍・モンゴル軍が満洲国を占領する
      source: "https://ja.wikipedia.org/wiki/ソ連対日参戦"
    - from: 1946
      owner: inner_mongolia_ag
      overlord: chinese_soviet
      certainty: uncertain
      cause: ソ連軍の撤退（4–5月）。モンゴル人の自治運動を中国共産党がまとめる（1947年5月 内モンゴル自治政府）
      source: "https://ja.wikipedia.org/wiki/内モンゴル自治政府"
    - from: 1949
      owner: prc
      cause: 中華人民共和国の成立（10月）。内モンゴル自治区となる
      source: "https://ja.wikipedia.org/wiki/内モンゴル自治区"

- id: hinggan_jirim
  name: 内モンゴル東部（興安・ジリム）
  select:
    pieces: [CHN-Xingan, CHN-Tongliao]
  timeline:
    - from: 1648
      owner: qing
      certainty: indirect
      note: ホルチン部などのジリム盟。清（後金）に早くから従い、皇室と婚姻を重ねた
      source: "https://en.wikipedia.org/wiki/Jirim_League"
    - from: 1912
      owner: roc
      cause: 中華民国の成立（奉天・吉林・黒竜江の省に分けて管轄）
      source: "https://en.wikipedia.org/wiki/Jirim_League"
    - from: 1931
      owner: japan
      certainty: occupied
      label: 満洲（関東軍の占領）
      cause: 満洲事変（9月）。関東軍が洮南・チチハルを結ぶ鉄道沿い（嫩江の戦い、11月）と奉天・長春を押さえる
      note: 中国本土側（G1）の遼寧・吉林・チチハルと同じく1931年末を関東軍の占領として描く（整合で追加）。ホロンバイルは1932年末まで蘇炳文が抵抗した
      source: "https://ja.wikipedia.org/wiki/満洲事変"
    - from: 1932
      owner: manchukuo
      overlord: japan
      cause: 満洲国の成立（3月）。モンゴル人の地域は興安省とされる
      source: "https://ja.wikipedia.org/wiki/興安省"
    - from: 1945
      owner: soviet_union
      certainty: occupied
      label: 満洲（ソ連軍の占領）
      cause: ソ連の対日参戦（8月）。ソ連軍・モンゴル軍が満洲国を占領する
      source: "https://ja.wikipedia.org/wiki/ソ連対日参戦"
    - from: 1946
      owner: inner_mongolia_ag
      overlord: chinese_soviet
      certainty: uncertain
      cause: 王爺廟（ウランホト）で東モンゴル自治政府が成立（1月）。1947年5月に内モンゴル自治政府となる
      source: "https://ja.wikipedia.org/wiki/内モンゴル自治政府"
    - from: 1949
      owner: prc
      cause: 中華人民共和国の成立（10月）。内モンゴル自治区となる
      source: "https://ja.wikipedia.org/wiki/内モンゴル自治区"

- id: juu_uda
  name: 赤峰（ジョーウダ盟）
  select:
    pieces: [CHN-Chifeng]
  timeline:
    - from: 1648
      owner: qing
      certainty: indirect
      note: ジョーウダ盟（ハラチン・オンニュートなど）。清の時代に漢人の農民が多く移り住み、熱河の官庁も置かれた
      source: "https://en.wikipedia.org/wiki/Chifeng"
    - from: 1912
      owner: roc
      cause: 中華民国の成立（1914年 熱河特別区、1928年 熱河省）
      source: "https://ja.wikipedia.org/wiki/熱河省"
    - from: 1933
      owner: manchukuo
      overlord: japan
      cause: 関東軍の熱河作戦（2–3月）。熱河省が満洲国に編入される
      source: "https://ja.wikipedia.org/wiki/熱河作戦"
    - from: 1945
      owner: chinese_soviet
      cause: ソ連の対日参戦（8月）でソ連軍・モンゴル軍が熱河に入り、その後に中国共産党の八路軍が承徳・赤峰を押さえる（解放区）
      note: 1946年は国民政府軍が承徳を奪う（8月）が、北の赤峰には及ばず、中国共産党の熱河省の機関が保った。ジョーウダ盟が内モンゴル自治政府に入ったのは1947年以後なので、熱河（G1の承徳・朝陽）と同じ中国共産党の支配地として描く（整合で変更）
      source: "https://en.wikipedia.org/wiki/Chifeng"
    - from: 1949
      owner: prc
      cause: 中華人民共和国の成立（10月）。1955年に熱河省が廃止され、内モンゴル自治区に入る
      source: "https://ja.wikipedia.org/wiki/熱河省"

- id: xilingol
  name: シリンゴル（錫林郭勒）
  select:
    pieces: [CHN-Xilinguole]
  timeline:
    - from: 1648
      owner: qing
      certainty: indirect
      note: シリンゴル盟とチャハル（清の直轄の八旗）の遊牧地
      source: "https://en.wikipedia.org/wiki/Xilingol_League"
    - from: 1912
      owner: roc
      cause: 中華民国の成立（1914年 チャハル特別区、1928年 チャハル省）
      source: "https://ja.wikipedia.org/wiki/チャハル省"
    - from: 1936
      owner: mengjiang
      overlord: japan
      cause: 徳王が関東軍の後押しで蒙古軍政府を作る（5月）
      source: "https://ja.wikipedia.org/wiki/徳王"
    - from: 1945
      owner: soviet_union
      certainty: occupied
      label: シリンゴル（ソ連・モンゴル軍の占領）
      cause: ソ連軍・モンゴル軍の進攻で蒙疆政権が崩れる（8月）。スニトで「内モンゴル人民共和国」の樹立が宣言されたが、長続きしなかった
      note: 11月にウランフーが張家口で内モンゴル自治運動連合会を作り（中国共産党の指導下）、シリンゴル・チャハルの両盟はその勢力圏に入った。国民政府の支配はほとんど及ばなかった
      source:
        - "https://en.wikipedia.org/wiki/Inner_Mongolian_People%27s_Republic"
        - "https://ja.wikipedia.org/wiki/内モンゴル自治政府"
    - from: 1946
      owner: inner_mongolia_ag
      overlord: chinese_soviet
      certainty: uncertain
      label: 内モンゴル自治運動連合会
      cause: ソ連軍・モンゴル軍が引き揚げ、ウランフーの内モンゴル自治運動連合会（中国共産党の指導下）の勢力圏となる
      note: 1946年10月に国民政府軍が張家口を奪ったが、北のシリンゴルの草原には支配が及ばなかった。1947年5月の内モンゴル自治政府にはシリンゴル盟も加わった。経過は要確認
      source: "https://ja.wikipedia.org/wiki/内モンゴル自治政府"
    - from: 1947
      owner: inner_mongolia_ag
      overlord: chinese_soviet
      certainty: uncertain
      cause: 王爺廟（ウランホト）で内モンゴル自治政府が成立し（5月）、シリンゴル盟もその管轄とされる
      source: "https://ja.wikipedia.org/wiki/内モンゴル自治政府"
    - from: 1949
      owner: prc
      cause: 中華人民共和国の成立（10月）。内モンゴル自治区となる
      source: "https://ja.wikipedia.org/wiki/内モンゴル自治区"

- id: suiyuan_mengjiang
  name: 綏遠（フフホト・包頭・ウランチャブ）
  select:
    pieces: [CHN-Huhehaote, CHN-Baotou, CHN-Wulanchabu]
  timeline:
    - from: 1937
      owner: mengjiang
      overlord: japan
      cause: 日中戦争で日本軍が綏遠の帰綏（フフホト）・包頭を占領し（10月）、蒙古聯盟自治政府が作られる
      note: 1936年の綏遠事件では、蒙古軍政府の軍が綏遠省主席の傅作義に敗れていた。西の河套（バヤンノール）は国民政府軍が保った
      source: "https://ja.wikipedia.org/wiki/蒙古聯合自治政府"
    - from: 1945
      owner: roc
      cause: 日本の降伏（8月）。傅作義の国民政府軍が帰綏・包頭に戻る
      source: "https://ja.wikipedia.org/wiki/傅作義"
    - from: 1949
      owner: prc
      cause: 綏遠の董其武らが共産党に降る（綏遠和平解放、9月）。中華人民共和国の成立
      source: "https://ja.wikipedia.org/wiki/綏遠省"

# =============================================================== 東トルキスタン（新疆）
- id: ili_bortala
  name: イリ（伊犁）・ボルタラ
  select:
    pieces: [CHN-Yili, CHN-Boertala]
  timeline:
    - from: 1648
      owner: dzungar
      note: ジュンガルの本拠地。イリ川流域にホンタイジの宮廷が置かれた
      source: "https://ja.wikipedia.org/wiki/ジュンガル"
    - from: 1755
      owner: qing
      certainty: uncertain
