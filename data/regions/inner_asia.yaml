      certainty: occupied
      label: チベット（ジュンガルの占領）
      cause: ジュンガル軍がラサを占領する
      source: "https://en.wikipedia.org/wiki/Dzungar_conquest_of_Tibet"
    - from: 1719
      owner: qing
      certainty: indirect
      cause: 清軍が四川からカムに入り、チャムドを従える（1719）。1718年の清の第1次の出兵はジュンガルに敗れた。1725年に寧静山を境にカム西部をダライ・ラマ政権の管轄、東部を四川の管轄とする
      source: "https://en.wikipedia.org/wiki/Kham"
    - from: 1909
      owner: qing
      cause: 趙爾豊の軍がチャムドに入り、カムの土司を廃して直接統治とする（改土帰流）
      source: "https://en.wikipedia.org/wiki/Zhao_Erfeng"
    - from: 1912
      owner: roc
      certainty: uncertain
      cause: 中華民国の四川軍（のちの川辺特別区）がチャムドを保ち、チベット軍と争う
      source: "https://en.wikipedia.org/wiki/Xikang"
    - from: 1918
      owner: tibet
      cause: チベット軍がチャムドを奪回し（4月）、ロンバツァの停戦協定で長江（金沙江）がおおよその境とされる
      source: "https://en.wikipedia.org/wiki/Sino-Tibetan_War"
    - from: 1950
      owner: prc
      cause: チャムドの戦い。人民解放軍がチベット軍を破る（10月）
      source: "https://en.wikipedia.org/wiki/Battle_of_Chamdo"

# =============================================================== 青海
- id: xining
  name: 西寧・海東（湟水流域）
  select:
    pieces: [CHN-Xining, CHN-Haidong]
  timeline:
    - from: 1648
      owner: qing
      note: 明の西寧衛を清が引き継ぐ（1645ごろ）。1648–1649年に甘粛で回民の米喇印・丁国棟の反乱が起こった
      source: "https://ja.wikipedia.org/wiki/西寧市"
    - from: 1862
      owner: qing
      certainty: uncertain
      cause: 陝西・甘粛の回民の反乱が西寧にも広がる。西寧は回民の指導者（馬桂源ら）の支配下に入る
      source: "https://en.wikipedia.org/wiki/Dungan_Revolt_(1862–1877)"
    - from: 1873
      owner: qing
      cause: 左宗棠の清軍が西寧を奪回する（1872年末）
      source: "https://ja.wikipedia.org/wiki/左宗棠"
    - from: 1912
      owner: roc
      cause: 中華民国の成立。回民の軍閥の馬麒・馬歩芳（馬家軍）が青海を治める（1928年に青海省）
      source: "https://ja.wikipedia.org/wiki/馬歩芳"
    - from: 1927
      owner: canton_government
      cause: 甘粛（当時は西寧を含む）を押さえる馮玉祥の国民軍が国民政府に加わり、北伐に参加する（5月）
      note: 中国本土側（G1）の甘粛・寧夏・山西と同じく、1927年末は国民政府（広州→南京）の側として描く（整合で追加）
      source: "https://ja.wikipedia.org/wiki/馮玉祥"
    - from: 1928
      owner: roc
      cause: 北伐の完了で、南京の国民政府が中華民国の政府となる
      source: "https://ja.wikipedia.org/wiki/北伐_(中国国民党)"
    - from: 1949
      owner: prc
      cause: 人民解放軍が西寧に入る（9月）
      source: "https://ja.wikipedia.org/wiki/青海省"

- id: kokonor
  name: 青海（ココノール・ツァイダム）
  select:
    pieces: [CHN-Haibei, CHN-Hainanzhou, CHN-Huangnan, CHN-Haixi, CHN-Geermu]
  timeline:
    - from: 1648
      owner: khoshut
      note: グシ・ハンが1637年に青海（ココノール）を征服し、ホシュートの本拠地とした。アムドのチベット人の部族も従えた
      source: "https://ja.wikipedia.org/wiki/ホシュート"
    - from: 1698
      owner: khoshut
      overlord: qing
      cause: 青海ホシュートの諸侯が康熙帝に服属し、王・貝勒などの爵位を受ける（1697–1698）
      source: "https://en.wikipedia.org/wiki/Khoshut_Khanate"
    - from: 1724
      owner: qing
      certainty: indirect
      cause: ロブサン・ダンジンの反乱（1723）を年羹堯・岳鍾琪の軍が鎮める。青海のモンゴル人を旗に編成し、1725年に西寧弁事大臣を置く
      source: "https://en.wikipedia.org/wiki/Lobzang_Danjin"
    - from: 1912
      owner: roc
      cause: 中華民国の成立。馬麒・馬歩芳の馬家軍が治める（1928年に青海省）
      source: "https://ja.wikipedia.org/wiki/馬歩芳"
    - from: 1927
      owner: canton_government
      cause: 甘粛・西寧を押さえる馮玉祥の国民軍が国民政府に加わり、北伐に参加する（5月）
      note: 中国本土側（G1）の甘粛・寧夏・山西と同じく、1927年末は国民政府（広州→南京）の側として描く（整合で追加）
      source: "https://ja.wikipedia.org/wiki/馮玉祥"
    - from: 1928
      owner: roc
      cause: 北伐の完了で、南京の国民政府が中華民国の政府となる
      source: "https://ja.wikipedia.org/wiki/北伐_(中国国民党)"
    - from: 1949
      owner: prc
      cause: 人民解放軍が西寧に入り（9月）、青海の各地を押さえる
      source: "https://ja.wikipedia.org/wiki/青海省"

- id: golog_yushu
  name: ゴロク・ユシュ（玉樹。青海南部）
  select:
    pieces: [CHN-Guoluo, CHN-Yushu]
  timeline:
    - from: 1648
      owner: khoshut
      certainty: uncertain
      note: ユシュ（ナンチェン王国など）はカムのチベット人の部族、ゴロクはアムドの遊牧部族の地で、ホシュートとダライ・ラマ政権に従ったが自立的だった
      source: "https://en.wikipedia.org/wiki/Yushu_Tibetan_Autonomous_Prefecture"
    - from: 1698
      owner: khoshut
      certainty: uncertain
      overlord: qing
      cause: 青海ホシュートの諸侯が康熙帝に服属する
      source: "https://en.wikipedia.org/wiki/Khoshut_Khanate"
    - from: 1724
      owner: qing
      certainty: nominal
      cause: 青海の平定。ユシュの部族は西寧弁事大臣の管轄とされたが、ゴロクの部族はほとんど従わなかった
      source: "https://en.wikipedia.org/wiki/Golog_people"
    - from: 1912
      owner: roc
      certainty: uncertain
      cause: 中華民国の成立。馬家軍が支配を広げ、1932年にはユシュをめぐってチベット軍と戦う（青海・チベット戦争）
      source: "https://en.wikipedia.org/wiki/Sino-Tibetan_War"
    - from: 1949
      owner: prc
      certainty: uncertain
      cause: 人民解放軍が青海に入る（9月）。南部の遊牧地に支配が及ぶのは数年後
      source: "https://ja.wikipedia.org/wiki/青海省"
    - from: 1952
      owner: prc
      cause: ゴロクの部族が中華人民共和国に服属する
      note: 1958年、青海・カム・アムドで牧畜の集団化に反対する大規模な反乱が起こり、鎮圧された
      source: "https://en.wikipedia.org/wiki/Golog_people"

# =============================================================== ロシアのシベリア南部・極東（ロシア領になる前）
- id: sayan_pre_russia
  name: サヤン山地（トゥヴァ・ハカス）
  select:
    pieces: [RUS-Tuva, RUS-Khakassia]
  timeline:
    - from: 1648
      owner: khalkha
      certainty: uncertain
      note: ハルハのアルタン・ハン（ホトゴイト部）が、トゥヴァの人々やエニセイ川上流のキルギス人の諸侯を従えていた。ハカスの北にはロシアのクラスノヤルスク砦（1628）があり、キルギス人はロシアにも貢納を迫られた
      source: "https://en.wikipedia.org/wiki/Altan_Khan_of_the_Khalkha"
    - from: 1667
      owner: dzungar
      certainty: uncertain
      cause: ジュンガルのセンゲがアルタン・ハンを破り、トゥヴァ・エニセイ・キルギスを従える
      note: ハカス（ミヌシンスク盆地）は1707年から north_east.yaml の khakassia（ロシア）が優先される
      source: "https://en.wikipedia.org/wiki/Altan_Khan_of_the_Khalkha"
    - from: 1758
      owner: qing
      certainty: indirect
      cause: 清がジュンガルを滅ぼし、トゥヴァ（タンヌ・ウリャンハイ）を従えて、ウリャスタイの定辺左副将軍の管轄とする
      source: "https://ja.wikipedia.org/wiki/ウリャンハイ地方"
    - from: 1912
      owner: mongolia
      certainty: uncertain
      cause: 辛亥革命で清の支配が崩れる。ボグド・ハーン政権が領有を主張し、ロシア人の入植者も増える
      note: 1914年からは north_east.yaml の tuva（ロシアの保護領）が優先される
      source: "https://ja.wikipedia.org/wiki/ウリャンハイ地方"

- id: altai_pre_russia
  name: アルタイ（ロシア領になる前）
  select:
    pieces: [RUS-Altai_Krai, RUS-Altai_Republic]
  timeline:
    - from: 1648
      owner: dzungar
      certainty: uncertain
      note: テレウト人・アルタイの諸部族の地で、ジュンガルに貢納した。北の境にはロシアのクズネツク砦（1618）があった。アルタイ地方は1718年、山地アルタイは1756年から north_east.yaml の地域（ロシア）が優先される
      source: "https://en.wikipedia.org/wiki/Dzungar_Khanate"

- id: amur_primorye_pre1858
  name: アムール川流域・沿海州（ロシア領になる前）
  select:
    pieces: [RUS-Amur_Oblast, RUS-Jewish_Autonomous_Oblast, RUS-Primorsky_Krai]
  timeline:
    - from: 1648
      owner: qing
      certainty: nominal
      note: >-
        ダウール人・エヴェンキ人・ナナイ人・ウデゲ人などの狩猟・漁労民の地で、清に貂皮を納めた（寧古塔・のち吉林・黒竜江の将軍の管轄）。
        1650年代からロシアのコサックが侵入し（ハバロフの遠征、1665年にアルバジン砦）、清はアルバジンを攻めて（1685–1686）、
        1689年のネルチンスク条約でアムール川流域を清の領土と認めさせた。清の実際の支配は弱かった。1858年からは north_east.yaml の地域（ロシア）が優先される
      source:
        - "https://ja.wikipedia.org/wiki/ネルチンスク条約"
        - "https://ja.wikipedia.org/wiki/アルバジン"
    - from: 1665
      owner: qing
      certainty: uncertain
      label: アムール川流域（ロシアと係争）
      cause: ロシアのコサックがアムール川上流にアルバジン砦を築く
      note: 清は1685・1686年にアルバジンを攻めた
      source: "https://ja.wikipedia.org/wiki/アルバジン"
    - from: 1689
      owner: qing
      certainty: nominal
      cause: ネルチンスク条約でアムール川流域が清の領土とされ、アルバジン砦は壊される
      source: "https://ja.wikipedia.org/wiki/ネルチンスク条約"
