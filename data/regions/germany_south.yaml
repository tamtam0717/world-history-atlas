# 南ドイツ（BS 担当）の地域と所属の変遷（1648–2025）
# 生成元: 担当者の作業用スクリプト。ピースは現代の郡（Kreis）単位で、歴史的な領邦がまたがる場合は面積の大きい側に入れた。

- id: bavaria_core
  name: "バイエルン（オーバーバイエルン・ニーダーバイエルン）"
  select:
    adm2: ["DEU/Oberbayern", "DEU/Niederbayern"]
    pieces: [DEU-Aichach_Friedberg]
  note: "オーバーバイエルン・ニーダーバイエルンの大部分（ここに含まれる司教領などは別の地域で上書き）。1742–45年のオーストリア軍による占領（オーストリア継承戦争）は描かない。"
  timeline:
    - from: 1453
      owner: bavaria
      overlord: hre
      note: "バイエルン＝ミュンヘン公国（ミュンヘン・シュトラウビングなど）。ランツフート公国の部分は bavaria_landshut_part で上書き。"
      source: "https://de.wikipedia.org/wiki/Bayern-München"
    - from: 1648
      owner: bavaria
      overlord: hre
      source: "https://ja.wikipedia.org/wiki/バイエルン選帝侯領"
    - from: 1704
      owner: habsburg
      overlord: hre
      certainty: occupied
      cause: "ブレンハイム（ヘーヒシュテット）の戦いの後、イルベスハイム条約でオーストリアの占領下に（1706年選帝侯の帝国追放）"
      source: "https://ja.wikipedia.org/wiki/スペイン継承戦争"
    - from: 1714
      owner: bavaria
      overlord: hre
      cause: "ラシュタット条約・バーデン条約で選帝侯が復帰"
      source: "https://ja.wikipedia.org/wiki/ラシュタット条約"
    - from: 1806
      owner: bavaria
      overlord: rhine_confederation
      cause: "バイエルン王国の成立（1806年1月）とライン同盟加盟"
      source: "https://ja.wikipedia.org/wiki/ライン同盟"
    - from: 1813
      owner: bavaria
      cause: "ライン同盟の解体（ライプツィヒの戦いの後）"
      source: "https://ja.wikipedia.org/wiki/ライプツィヒの戦い"
    - from: 1815
      owner: bavaria
      overlord: german_confederation
      cause: "ドイツ連邦の発足（ウィーン議定書）"
      source: "https://ja.wikipedia.org/wiki/ドイツ連邦"
    - from: 1866
      owner: bavaria
      cause: "普墺戦争の後、プラハ条約でドイツ連邦が解体"
      note: "南ドイツ諸国はどの連邦にも属さず、プロイセンと秘密の攻守同盟を結んだ。"
      source: "https://ja.wikipedia.org/wiki/プラハ条約_(1866年)"
    - from: 1871
      owner: german_empire
      cause: "ドイツ帝国の成立（1871年1月18日、ヴェルサイユ宮殿でプロイセン王ヴィルヘルム1世がドイツ皇帝に即位）"
      note: "ドイツ帝国の構成国：バイエルン王国。君主と内政は構成国のもとに残った。"
      source: "https://ja.wikipedia.org/wiki/ドイツ帝国"
    - from: 1918
      owner: germany
      cause: "ドイツ革命で帝政が倒れ共和国となる（ヴァイマル共和国）"
      note: "ヴァイマル共和国の州：バイエルン自由州。1933年からナチス・ドイツ（1934年に州の自治は廃止）。"
      source: "https://ja.wikipedia.org/wiki/ドイツ革命"
    - from: 1945
      owner: usa
      certainty: occupied
      label: "ドイツ（アメリカ占領地区）"
      cause: "ドイツの無条件降伏と連合国による分割占領"
      note: "バイエルン州。"
      source: "https://ja.wikipedia.org/wiki/連合軍軍政期_(ドイツ)"
    - from: 1949
      owner: west_germany
      cause: "ドイツ連邦共和国（西ドイツ）の成立"
      note: "西ドイツの州：バイエルン州。"
      source: "https://ja.wikipedia.org/wiki/ドイツ連邦共和国"
    - from: 1990
      owner: germany
      cause: "ドイツ統一（東ドイツが西ドイツに加わる）"
      source: "https://ja.wikipedia.org/wiki/ドイツ再統一"

- id: upper_palatinate
  name: "オーバープファルツ"
  select:
    adm2: ["DEU/Oberpfalz"]
  note: "ズルツバッハ（プファルツ＝ズルツバッハ）、ロプコヴィッツ家のノイシュタット＝シュテルンシュタインなどの小領はまとめた。"
  timeline:
    - from: 1453
      owner: palatinate
      overlord: hre
      note: "アンベルクを中心とするプファルツ選帝侯の領地（オーバープファルツ）。ノイマルクトは1499年までプファルツ＝モースバッハ家、ズルツバッハ・ブルクレンゲンフェルトなどは1505年からプファルツ＝ノイブルク家（若プファルツ）の領地。"
      source: "https://de.wikipedia.org/wiki/Oberpfalz"
