    - from: 1708
      owner: palatinate
      overlord: hre
      certainty: uncertain
      cause: "皇帝がオーバープファルツと選帝侯位の一部をプファルツ選帝侯ヨハン・ヴィルヘルムに与える"
      note: "要確認：プファルツの実効支配の程度。"
      source: "https://de.wikipedia.org/wiki/Oberpfalz"
    - from: 1714
      owner: bavaria
      overlord: hre
      cause: "ラシュタット条約・バーデン条約でバイエルンに返還"
      source: "https://ja.wikipedia.org/wiki/ラシュタット条約"
    - from: 1806
      owner: bavaria
      overlord: rhine_confederation
      cause: "バイエルン王国の成立とライン同盟加盟"
      source: "https://ja.wikipedia.org/wiki/ライン同盟"
    - from: 1813
      owner: bavaria
      cause: "ライン同盟の解体（ライプツィヒの戦いの後）"
      source: "https://ja.wikipedia.org/wiki/ライプツィヒの戦い"
    - from: 1815
      owner: bavaria
      overlord: german_confederation
      cause: "ドイツ連邦の発足（ウィーン議定書）"
      source: "https://ja.wikipedia.org/wiki/ドイツ連邦"

