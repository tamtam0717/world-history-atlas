# 南ドイツ（BS 担当）の地域と所属の変遷（1648–1815）
# 生成元: 担当者の作業用スクリプト。ピースは現代の郡（Kreis）単位で、歴史的な領邦がまたがる場合は面積の大きい側に入れた。

- id: bavaria_core
  name: "バイエルン（オーバーバイエルン・ニーダーバイエルン）"
  select:
    adm2: ["DEU/Oberbayern", "DEU/Niederbayern"]
    pieces: [DEU-Aichach_Friedberg]
  note: "オーバーバイエルン・ニーダーバイエルンの大部分（ここに含まれる司教領などは別の地域で上書き）。1742–45年のオーストリア軍による占領（オーストリア継承戦争）は描かない。"
  timeline:
    - from: 1648
      owner: bavaria
      overlord: hre
      source: "https://ja.wikipedia.org/wiki/バイエルン選帝侯領"
    - from: 1704
      owner: habsburg
      overlord: hre
      certainty: occupied
      cause: "ブレンハイム（ヘーヒシュテット）の戦いの後、イルベスハイム条約でオーストリアの占領下に（1706年選帝侯の帝国追放）"
      source: "https://ja.wikipedia.org/wiki/スペイン継承戦争"
    - from: 1714
      owner: bavaria
      overlord: hre
      cause: "ラシュタット条約・バーデン条約で選帝侯が復帰"
      source: "https://ja.wikipedia.org/wiki/ラシュタット条約"
    - from: 1806
      owner: bavaria
      overlord: rhine_confederation
      cause: "バイエルン王国の成立（1806年1月）とライン同盟加盟"
      source: "https://ja.wikipedia.org/wiki/ライン同盟"
    - from: 1813
      owner: bavaria
      cause: "ライン同盟の解体（ライプツィヒの戦いの後）"
      source: "https://ja.wikipedia.org/wiki/ライプツィヒの戦い"
    - from: 1815
      owner: bavaria
      overlord: german_confederation
      cause: "ドイツ連邦の発足（ウィーン議定書）"
      source: "https://ja.wikipedia.org/wiki/ドイツ連邦"

- id: upper_palatinate
  name: "オーバープファルツ"
  select:
    adm2: ["DEU/Oberpfalz"]
  note: "ズルツバッハ（プファルツ＝ズルツバッハ）、ロプコヴィッツ家のノイシュタット＝シュテルンシュタインなどの小領はまとめた。"
  timeline:
    - from: 1648
      owner: bavaria
      overlord: hre
      cause: "ウェストファリア条約でバイエルン領と確認（1628年から領有）"
